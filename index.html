{year:2020,subject:'計画',no:15,text:'図書館等に関する次の記述のうち、最も不適当なものはどれか。',choices:['金沢市立玉川図書館(石川県、1979年)は、東側の開架部門と、中庭を挟んで西側にある学習・管理部門を分けることによって、開架部門を気軽に立ち寄り利用できる空間とした図書館である。','朝霞市立図書館本館(埼玉県、1987年)は、成人開架と児童開架をL字型平面に振り分け、自習室を設けず、閲覧席を少数にするなど、貸出を重視した図書館である。','苅田町立図書館本館(福岡県、1990年)は、多様な閲覧席と豊富な資料を備え、開架書架群に沿ってベンチ、和室、屋外読書スペースなどを設けることで、来館者が長い時間を過ごせるように計画した図書館である。','ぎふメディアコスモス(岐阜県、2015年)は、木造格子屋根をもつ市立中央図書館や、市民活動交流センター、多文化交流プラザ及び展示ギャラリー等からなる複合施設である。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'計画',no:16,text:'医療施設等に関する次の記述のうち、最も不適当なものはどれか。',choices:['病棟の患者用トイレの計画においては、トイレを分散して配置するなど、病室とトイレの距離を短くする工夫が必要である。','LDRとは、陣痛・分娩・回復と出産の過程に応じてそれぞれに必要な設備が整った専用の部屋を設ける方式である。','4床病室の計画において、隣り合うベッドとベッドの間に幅1m以上のスペースを確保するためには、病室面積は32m²以上が目安となる。','回復期リハビリテーションは、疾患に応じ90日から180日をかけて身体の機能や日常生活動作(ADL)の改善を図ることを目的としている。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'計画',no:17,text:'子どもに関わる施設に関する次の記述のうち、最も不適当なものはどれか。',choices:['幼稚園と保育所の施設を共用化した認定こども園において、遊戯室、調理室、管理諸室、屋外環境等は幼稚園と保育所の共用の空間として計画した。','総合病院における小児患者のための病床は、疾病ごとの特徴に対し的確に対応できるように、診療科ごとにそれぞれ設けた。','放課後等デイサービス事業所において、屋外遊びを豊かにするために、学校と連携して校庭等を有効に活用した。','義務教育学校(小中一貫校)の特別支援学級関係室においては、9年間の系統性・連続性のある教育活動や一貫した支援を効果的に行えるように、小学校と中学校の配置や室構成を計画した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'計画',no:18,text:'建築関係の資格者に関する次の記述のうち、最も不適当なものはどれか。',choices:['二級建築士事務所を管理する二級建築士が、一級建築士事務所の管理建築士となるには、一級建築士の免許を取得後、3年以上の建築物の設計、工事監理等に関する業務に従事する必要がある。','一級建築士事務所において、建築士法で定める重要事項の説明については、管理建築士のほか当該一級建築士事務所に属する一級建築士も行うことができる。','監理技術者は、工事現場における建設工事を適正に実施するため、当該建設工事の施工計画の作成、工程管理、品質管理等を行うとともに当該建設工事の施工に従事する者の技術上の指導監督の職務を誠実に行う必要がある。','施工管理技士は、施工技術の向上を図るため、建設業者の施工する建設工事に従事し又はしようとする者を対象として行う技術検定に合格した者である。'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'計画',no:19,text:'建築積算に関する次の記述のうち、建築工事建築数量積算研究会「建築数量積算基準」に照らして、最も不適当なものはどれか。',choices:['屋外施設において、芝類の数量は種類及び工法ごとに面積を計測・計算するが、芝類の範囲にある排水桝等の面積が1箇所当たり0.5m²以下のときは、その欠除は、原則としてないものとする。','窓、出入口等の開口部による型枠の欠除は、原則として建具類等の開口部の内法寸法で計算するが、開口部の内法の見付面積が1箇所当たり0.5m²以下の場合は、原則として型枠の欠除はないものとする。','鉄筋の所要数量は、その設計数量の5％割増しを標準とする。','耐火被覆は、耐火被覆材の材種、材質、形状、寸法、工法、耐火時間及び部位(柱、梁)ごとに区分して計測・計算する。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'計画',no:20,text:'建築プロジェクトのマネジメント等に関する次の記述のうち、最も不適当なものはどれか。',choices:['建設工事において、コンカレントエンジニアリングとは、設計から施工までの工程にかかわる全ての部門の人材が集まり、工程をオーバーラップさせて諸問題を討議しながら作業を進めていく方式である。','PFI事業において、VFMとは、重要な概念の一つで、支払いに対して最も価値の高いサービスを供給するという考え方のことである。','公共事業において、BTO方式とは、民間事業者が資金調達を行って施設を建設し、完成直後に公共に所有権を移転し、当該民間事業者に一定期間、維持管理及び運営を委ねる方式である。','国土交通省が示す設計者選定方式において、プロポーザル方式とは、提出された具体的な設計案を審査し、最も優れた設計案を選ぶ方式である。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'環境・設備',no:1,text:'環境工学における用語に関する次の記述のうち、最も不適当なものはどれか。',choices:['PMVは、室内における人の温熱感覚に関係する、気温、放射温度、相対湿度、気流速度、人体の代謝量及び着衣量を考慮した温熱環境指標である。','色温度は、光源の光色を、それと近似する色度の光を放つ黒体の絶対温度で表したものである。','音響エネルギー密度レベルは、音のもつ単位体積当たりの力学的エネルギー量を、デシベル表示したものである。','実効放射(夜間放射)は、地表における長波長放射収支であり、日中を除く夜間の「大気放射と地表面放射との差」のことである。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'環境・設備',no:2,text:'外壁の熱貫流率に関する次の記述のうち、最も不適当なものはどれか。',choices:['外壁の熱貫流率は、外壁と屋根や床等との取合い部における熱伝導を考慮しない場合、一般に、構造体の室内側で断熱するよりも室外側で断熱するほうが小さくなる。','外壁を構成する各部材の熱伝導抵抗が大きくなると、一般に、熱貫流率は小さくなる。','外壁表面の放射率が大きくなると、一般に、熱貫流率は大きくなる。','屋外の風速が大きくなると、一般に、熱貫流率は大きくなる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'環境・設備',no:3,text:'室内の湿り空気に関する次の記述のうち、最も不適当なものはどれか。ただし、対象とする湿り空気は1気圧とし、また、室内は無風状態とする。',choices:['相対湿度が同一でも、乾球温度が異なれば、空気1m³中に含まれる水蒸気量は異なる。','乾球温度が一定の場合、相対湿度が低くなるほど露点温度は低くなる。','乾球温度と湿球温度が与えられれば、その空気の相対湿度及び水蒸気分圧を求めることができる。','相対湿度を一定に保ったまま乾球温度を上昇させるには、加熱と除湿を同時に行う必要がある。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'環境・設備',no:4,text:'図-1のA～Dに示すような熱性能(熱容量と断熱性能)を有する建築物について、室内空間の暖房開始前から暖房停止後までの室温変動を、図-2のイ～ニとして模式的に示している。A～Dとイ～ニとの組合せとして、最も適当なものは、次のうちどれか。ただし、A～Dの室形状・暖房時間・発熱量は同一であり、AとC、BとDの断熱性能は同一であるものとする。',choices:['A:ハ　B:ロ　C:ニ　D:イ','A:ハ　B:イ　C:ニ　D:ロ','A:ニ　B:イ　C:ハ　D:ロ','A:ニ　B:ロ　C:ハ　D:イ'],answer:2,hasFigure:true,figureDesc:'図-1は4つの建築物A～Dの断面を示す。A:熱容量小さい・断熱性能低い、B:熱容量小さい・断熱性能高い、C:熱容量大きい・断熱性能低い、D:熱容量大きい・断熱性能高い。図-2はイ～ニの4つの暖房時の室温変動グラフを示す。横軸は経過時間（暖房開始～暖房停止）、縦軸は室温。'},
{year:2020,subject:'環境・設備',no:5,text:'建築物における防火・防災に関する次の記述のうち、最も不適当なものはどれか。',choices:['安全区画を自然排煙とする場合、避難方向と同一の方向に排煙口を設けることが望ましい。','大規模店舗の売場内に防火区画(面積区画)を設ける場合の階段配置について、防火区画された売場ごとの避難時間と避難扉幅当たりの避難者人数が概ね均等になるように計画することが望ましい。','自然排煙の排煙量は、煙層の温度と厚さに依存し、煙層の温度が低いときや天井高が低いときにおいては排煙効果が小さい。','病院等で採用される水平避難方式は、階段での自力避難が困難な者などを出火したエリアから隣接する防火区画されたエリアへ移動させ、避難時間の余裕を生み出したうえで、介助避難させる方法である。'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'環境・設備',no:6,text:'日照・日射・採光に関する次の記述のうち、最も不適当なものはどれか。',choices:['昼光により室内の最低照度を確保するための設計用全天空照度には、一般に、暗い日の値である5,000lxが用いられる。','頂側窓は、高所において鉛直や鉛直に近い向きで設置される窓をいい、特に北側採光に用いると安定した光環境を得ることができる。','昼光率は、窓外に見える建築物や樹木の有無にかかわらず、室中央では一定の値となる。','水平面天空日射量は、大気透過率が大きいほど、小さくなる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'環境・設備',no:7,text:'照明に関する次の記述のうち、最も不適当なものはどれか。',choices:['反射面の光束発散度は、その面の輝度に反射率を乗じたものである。','白い背景のもとで黒い文字を読むような場合、対象と背景の輝度の対比が大きいほど視力が上がる。','光束は、単位時間当たりに流れる可視光範囲の放射エネルギーの量に比視感度の重みづけを行った値である。','一般に、照度均斉度が大きい視作業面ほど、照度分布が均一に近いものとなる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'環境・設備',no:8,text:'色彩に関する次の記述のうち、最も不適当なものはどれか。',choices:['ジャッド(D. B. Judd)がまとめた色彩調和の秩序性の原理によると、色相環における等間隔配色は調和する。','明所視において、ある面からの放射エネルギーが同じ場合、緑色に比べて赤色のほうが光の強さを強く感じられる。','色光の加法混色においては、混ぜ合わせる光を増やすほど、白色に近くなる。','マンセル表色系におけるバリュー(明度)は、0から10までの数値で表される。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'環境・設備',no:9,text:'音響に関する次の記述のうち、最も不適当なものはどれか。',choices:['拡散性の高い室に音響パワーが一定の音源がある場合、室の平均吸音率が2倍になると、室内平均音圧レベルは約3dB減少する。','自由音場において、無指向性点音源から25m離れた位置における音圧レベルの値が約70dBの場合、100m離れた位置における音圧レベルは約58dBになる。','セイビン(Sabine)の残響式による残響時間は、室容積に比例し、室の等価吸音面積に反比例する。','屋外において、遠方の音源から伝搬する音の強さは、空気の音響吸収によって、低周波数域の音ほど減衰する。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'環境・設備',no:10,text:'吸音・遮音に関する次の記述のうち、最も不適当なものはどれか。',choices:['剛壁に密着させて設置する多孔質吸音材料を厚くすると、一般に、低周波数域における吸音率が上昇する。','孔あき板を用いた吸音構造においては、孔と背後空気層とが共鳴器として機能することによって吸音する。','単層壁の音響透過損失の値は、質量則を用いた予測値よりも、実測値のほうが大きくなる傾向がある。','多孔質吸音材料においては、その表面を通気性の低い材料によって被覆すると、高周波数域の吸音率が低下する。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'環境・設備',no:11,text:'COP(成績係数)等、空気調和設備に使用される熱源のエネルギー効率に関する次の記述のうち、最も不適当なものはどれか。',choices:['井水を熱源水とする水熱源ヒートポンプは、一般に、熱源水の温度が冷房時には外気温度よりも低く、暖房時には外気温度よりも高いので、空気熱源ヒートポンプに比べてCOPが高い。','省エネルギー性能が高い冷凍機の選定に当たっては、定格条件のCOPとともに、年間で発生頻度が高い部分負荷運転時のCOPも考慮する。','水蓄熱槽の採用は、一般に、熱源を全負荷運転することによる高効率運転に加えて、冷水ポンプや冷却水に係る熱源補機も含めた熱源システムのエネルギー効率を高めることができる。','遠心冷凍機の冷水出口温度を高く設定すると、COPは低くなる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'環境・設備',no:12,text:'空気調和・換気設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['ナイトパージは、夜間に外気導入を行い、翌日の空調立上げ負荷を減らす省エネルギー手法で、一般に、昼間の外気冷房よりも低い外気温度まで利用できる。','冷却塔フリークーリングは、冷却塔ファンを動かすことなく、冷凍機の冷却水を冷やす省エネルギー手法である。','デシカント空調は、コージェネレーションシステムに組み合わせることで排熱が利用可能となり、コージェネレーションシステムの総合効率の向上に寄与することができる。','放射暖房方式は、放射パネルが高い放射率をもつ必要があり、反射率の高い受照面には十分な効果を及ぼすことができない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'環境・設備',no:13,text:'換気設備等に関する次の記述のうち、最も不適当なものはどれか。',choices:['営業用厨房の換気計画において、一般に、排気量は給気量に比べてやや大きくする。','ディスプレイスメント・ベンチレーション(置換換気)は、工場等において、汚染物質が周囲空気より高温又は軽量な場合に有効である。','屋内駐車場の換気方式においては、一般に、周辺諸室への排気ガスの流出を防ぐために、第二種機械換気方式を採用する。','空調機の外気取入れに全熱交換器を使用することにより、一般に、熱源装置の容量を小さくすることができる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'環境・設備',no:14,text:'上水のみ供給される建築物の給水設備について、1日当たりの給水量の算定に関する次の記述のうち、最も不適当なものはどれか。ただし、空調用及びプール等の特別な用途に使用される給水は考慮しないものとする。',choices:['集合住宅において、居住者1人当たり250l/日とした。','社員食堂のない事務所ビルにおいて、在勤者1人当たり60l/日とした。','客室主体のホテルにおいて、ベッド1台当たり500l/日とした。','総合病院において、ベッド1台当たり300l/日とした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'環境・設備',no:15,text:'排水通気設備の通気方式に関する次の記述のうち、最も不適当なものはどれか。',choices:['各個通気方式は、各衛生器具のトラップごとに取り出した通気管を通気横枝管に接続し、その端部を通気立て管等に接続する方式であり、自己サイホン作用の防止に有効である。','ループ通気方式は、2個以上のトラップを保護するために用いられる方式であり、ループ通気管を排水横枝管に接続される最高位の衛生器具のあふれ縁よりも高く立ち上げて、通気立て管にその端部を接続する。','伸頂通気方式は、通気立て管を設けず、排水立て管の頂上に設置した伸頂通気管を用いて通気を行う方式であり、一般に、各個通気方式やループ通気方式に比べて許容流量値が大きい。','通気弁方式は、通気管端部に通気弁を設置する方式であり、通気弁は、通気管内が負圧になると弁が開いて空気を吸引し、排水負荷がないときや通気管内が正圧になるときは弁が閉じる機構を有している。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'環境・設備',no:16,text:'電気設備に関する以下のA～Cの電気方式について、電圧降下(電線に電流が流れると損失が発生し、受電端の電圧が送電端の電圧よりも低くなること)の大きさの大小関係として、正しいものは、次のうちどれか。ただし、負荷電流、こう長(電線上の2点間の長さ)及び電線の断面積は同じとし、いずれも200V配電とする。\n\nA：単相2線式\nB：単相3線式\nC：三相3線式',choices:['A＞B＞C','A＞C＞B','C＞A＞B','C＞B＞A'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'環境・設備',no:17,text:'再生可能エネルギーに関する次の記述のうち、最も不適当なものはどれか。',choices:['太陽光発電システムの構成要素の一つであるパワーコンディショナには、インバータ、系統連系保護装置、制御装置等が組み込まれている。','太陽光発電システムに使用される配線は、アレイ(モジュール)からパワーコンディショナまでの交流配線とパワーコンディショナから配電盤までの直流配線とがある。','風力発電に用いられる風車は、一般に、水平軸風車(回転軸が地面に対して水平な風車)と垂直軸風車(回転軸が地面に対して垂直な風車)に分類することができ、垂直軸風車は小型風車での採用例が多い。','風力発電の系統連系において、DC(直流)リンク方式は、AC(交流)リンク方式に比べて出力変動の影響を受けにくく、安定供給が可能な電力として系統に連系できる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'環境・設備',no:18,text:'消防用設備等に関する次の記述のうち、最も不適当なものはどれか。',choices:['屋内消火栓設備において、1号消火栓については、階ごとに、その階の各部分から消火栓のホース接続口までの水平距離が25m以下となるように設置した。','スプリンクラー設備において、スプリンクラーヘッドが設けられていない部分に設ける補助散水栓については、階ごとに、その階の各部分からホース接続口までの水平距離が15m以下となるように設置した。','屋外消火栓設備については、建築物の各部分から屋外消火栓のホース接続口までの水平距離が50m以下となるように設置した。','事務所ビルの連結送水管の放水口については、3階以上の階ごとに、その階の各部分から水平距離が50m以下となるように設置した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'環境・設備',no:19,text:'建築設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['一般的な事務所ビルの執務空間における天井放射冷房は、潜熱処理を主な目的として用いられる。','一部のコージェネレーションシステムでは、常用発電設備と消防法や建築基準法で定める非常用発電設備との兼用が可能な機種があり、スペースの有効利用やメンテナンスコストの削減等に効果がある。','常用エレベーターは、利用者の人命確保と閉込めの回避を最優先するために、一般に、災害時における利用は想定されていない。','非常用エレベーターを複数台設置する必要がある場合は、避難上及び消火上、有効な間隔を保って配置する。'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'環境・設備',no:20,text:'環境・設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築物の「eマーク(省エネ基準適合認定マーク)」は、建築物が建築物の省エネルギー基準に適合していることについて、所管行政庁から認定を受けたことを示すものである。','LEED(Leadership in Energy & Environmental Design)は、建築物や敷地等に関する環境性能評価システムの一つであり、取得したポイントの合計によって4段階の認証レベルが決まる。','建築物の省エネルギー基準における年間熱負荷係数(PAL*：パルスター)は、その値が小さいほど建築物の外皮の熱性能が高いと判断される。','一般的な事務所ビルのライフサイクルCO₂においては、「運用段階のCO₂排出量の占める割合」より「設計・建設段階及び廃棄段階のCO₂排出量の占める割合」のほうが大きい。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:1,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['港湾法第40条第1項及び特定都市河川浸水被害対策法第8条の規定並びにこれらの規定に基づく命令及び条例の規定で建築物の敷地、構造又は建築設備に係るものは、「建築基準関係規定」に該当する。','防火戸であって、これに通常の火災による火熱が加えられた場合に、加熱開始後1時間当該加熱面以外の面に火炎を出さないものとして、国土交通大臣の認定を受けたものは、「特定防火設備」に該当する。','耐火建築物における外壁以外の主要構造部にあっては、「耐火構造」又は「当該建築物の周囲において発生する通常の火災による火熱に当該火災が終了するまで耐えるものとして、所定の技術的基準に適合する構造」のいずれかに該当するものでなければならない。','建築物の自重、積載荷重等を支える最下階の床版は、「構造耐力上主要な部分」に該当する。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:2,text:'面積、高さ又は階数に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['物品販売業を営む店舗の用途に供する建築物の屋上部分に設ける階段室の水平投影面積の合計が、当該建築物の建築面積の1/8以下であっても、当該階段室の床面積は、当該建築物の延べ面積に算入する。','日影による中高層の建築物の高さの制限に関する規定において、建築物の軒の高さを算定する場合の地盤面は、建築物が周囲の地面と接する位置の高低差が3mを超える場合においては、その高低差3m以内ごとの平均の高さにおける水平面とする。','隣地との関係についての建築物の各部分の高さの制限の緩和の規定において、建築物の敷地の地盤面が隣地の地盤面より1m以上低い場合においては、その建築物の敷地の地盤面は、当該高低差の1/2だけ高い位置にあるものとみなす。','建築物の一部が吹抜きとなっている場合、建築物の敷地が斜面又は段地である場合その他建築物の部分によって階数を異にする場合においては、これらの階数のうち最大なものを、当該建築物の階数とする。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:3,text:'都市計画区域内における次の行為のうち、建築基準法上、確認済証の交付を受ける必要がないものはどれか。ただし、建築等に関する確認済証の交付を受ける必要がない区域の指定はないものとする。',choices:['鉄骨造、延べ面積300m²、地上3階建ての既存の寄宿舎内におけるエレベーターの設置','第一種低層住居専用地域内における鉄筋コンクリート造、延べ面積2,000m²、地上2階建ての博物館の図書館への用途変更','遊園地に設ける回転運動をする遊戯施設のうち、原動機を使用するメリーゴーランドの築造','木造、延べ面積150m²、高さ8m、平家建ての集会場の屋根の大規模の修繕'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:4,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['既存の地上3階建ての物品販売業を営む店舗(3階における当該用途に供する部分の床面積の合計が2,000m²のもの)において、屋外への出口の戸に用いるガラスの取替えの工事の施工中に当該建築物を使用する場合は、当該建築主は、工事の施工中における建築物の安全上、防火上又は避難上の措置に関する計画を作成して特定行政庁に届け出る必要はない。','延べ面積150m²、地上3階建ての事務所に設けるエレベーター(国等の建築物に設けるものを除く。)の所有者(所有者と管理者が異なる場合においては、管理者。)は、当該エレベーターについて、定期に、一級建築士等に検査をさせて、その結果を特定行政庁に報告しなければならない。','建築主は、確認済証の交付を受けた建築物について、当該建築物の高さが減少する場合における建築物の高さの変更(建築物の高さの最低限度が定められている区域内の建築物に係るものを除く。)をして、当該建築物を建築しようとする場合において、変更後も建築物の計画が建築基準関係規定に適合することが明らかなものは、あらためて、確認済証の交付を受ける必要はない。','建築主は、鉄骨造、延べ面積200m²、平家建ての飲食店を新築する場合においては、検査済証の交付を受けた後でなければ、建築物を使用してはならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:5,text:'地上2階建ての事務所(2階の居室の床面積の合計が300m²)に屋内階段(直階段)を設ける場合、図のLの値として、建築基準法に適合する最小のものは、次のうちどれか。',choices:['4.80 m','5.76 m','6.00 m','6.24 m'],answer:2,hasFigure:true,figureDesc:'直階段の断面図。1階床面から2階床面までの高さが4.20m。階段の水平距離Lを求める問題。'},
{year:2020,subject:'法規',no:6,text:'防火区画等に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、自動式のスプリンクラー設備等は設けられていないものとする。',choices:['地上3階に居室を有する事務所で、主要構造部を耐火構造としたものにおいて、避難階である地上1階から地上3階に通ずる階段の部分とその他の部分との区画に用いる防火設備は、避難上及び防火上支障のない遮煙性能を有するものでなければならない。','主要構造部を耐火構造とした共同住宅の住戸で、その階数が3であり床面積の合計が200m²のものは、当該住戸の階段の部分とその他の部分とを防火区画しなければならない。','地上5階建ての事務所のみの用途に供する建築物において、防火区画に接する外壁については、外壁面から50cm以上突出した準耐火構造のひさし、床、袖壁等で防火上有効に遮られている場合においては、当該外壁のうちこれらに接する部分を含み幅90cm以上の部分を準耐火構造としなくてもよい。','学校の用途に供する建築物の当該用途に供する部分(天井は強化天井でないもの)については、原則として、その防火上主要な間仕切壁を準耐火構造とし、小屋裏又は天井裏に達せしめなければならない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:7,text:'避難施設等に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、いずれの建築物も各階を当該用途に供するものとし、避難階は地上1階とする。',choices:['主要構造部を耐火構造とした地上2階建て、延べ面積3,000m²の物品販売業を営む店舗で、各階に売場を有するものにあっては、2階から避難階又は地上に通ずる2以上の直通階段を設けなければならない。','主要構造部を耐火構造とした地上15階建ての共同住宅において、15階の居室及びこれから地上に通ずる主たる廊下、階段その他の通路の壁及び天井の室内に面する部分の仕上げを準不燃材料でした場合、当該居室の各部分から避難階又は地上に通ずる直通階段の一に至る歩行距離は、60m以下としなければならない。','主要構造部を耐火構造とした地上4階建ての共同住宅において、各階に住戸(1戸当たりの居室の床面積60m²)が4戸ある場合、4階に避難上有効なバルコニーが設けられていても、避難階又は地上に通ずる2以上の直通階段を設けなければならない。','主要構造部を耐火構造とした地上11階建ての共同住宅におけるメゾネット形式の住戸について、その階数が2であり、かつ、出入口が一の階のみにあるものの当該出入口のある階以外の階においては、その階の居室の各部分から避難階又は地上に通ずる直通階段の一に至る歩行距離は、40m以下としなければならない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:8,text:'防火・避難に関する次の記述のうち、建築基準法に適合しないものはどれか。ただし、避難階は地上1階とし、屋上広場はないものとする。',choices:['主要構造部を準耐火構造としたバルコニーのない建築物において、当該建築物が全館避難安全性能を有するものであることについて全館避難安全検証法により確かめたので、特別避難階段の階段室には、その付室に面する部分以外に屋内に面して開口部を設けることとした。','主要構造部を耐火構造とした地上8階建て、延べ面積10,000m²の物品販売業を営む店舗において、最上階が階避難安全性能を有するものであることについて階避難安全検証法により確かめたので、最上階に、屋内と特別避難階段の階段室とを連絡するバルコニー及び付室のいずれも設けなかった。','主要構造部を耐火構造とした地上5階建て、延べ面積5,000m²の事務所において、最上階が階避難安全性能を有するものであることについて階避難安全検証法により確かめたので、最上階に排煙設備を設けなかった。','各階を物品販売業を営む店舗の用途に供する地上4階建ての建築物(各階の床面積が600m²)において、各階における避難階段の幅の合計を3.6mとした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:9,text:'防火・避難に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、居室については、内装の「制限を受ける窓その他の開口部を有しない居室」には該当しないものとする。',choices:['延べ面積500m²、平家建ての自動車車庫(自動式のスプリンクラー設備等は設けられていないもの)において、当該用途に供する部分の壁及び天井の室内に面する部分の仕上げを、準不燃材料又はこれに準ずるものとして国土交通大臣が定める方法により国土交通大臣が定める材料の組合せによってしたものとしなければならない。','地上5階建ての共同住宅において、5階の住戸から地上に通ずる廊下及び階段が採光上有効に直接外気に開放されている場合、当該廊下及び階段に非常用の照明装置を設けなくてもよい。','地上20階建ての共同住宅の特別避難階段について、15階以上の各階における階段室及びこれと屋内とを連絡するバルコニー又は付室の床面積(バルコニーで床面積がないものにあっては、床部分の面積)の合計は、当該階に設ける各居室の床面積に8/100を乗じたものの合計以上としなければならない。','建築物の高さ31m以下の部分にある3階以上の各階において、道又は道に通ずる幅員4m以上の通路その他の空地に面する外壁面に、幅及び高さが、それぞれ、75cm以上及び1.2m以上の窓で、格子その他の屋外からの進入を妨げる構造を有しないものを当該壁面の長さ10m以内ごとに設けている場合においては、非常用の進入口を設けなくてもよい。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:10,text:'建築設備等に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['高さ31mを超える建築物において、高さ31mを超える部分を全て建築設備の機械室とする場合は、非常用の昇降機を設けなくてもよい。','事務所の用途に供する建築物において、発熱量の合計が6kWのこんろ(密閉式燃焼器具等でないもの)を設けた調理室で、換気上有効な開口部を設けたものには、換気設備を設けなくてもよい。','建築物に設けるエレベーターで、乗用エレベーター及び寝台用エレベーター以外のものの昇降路について、安全上支障がないものとして国土交通大臣が定めた構造方法を用いるものについては、昇降路の出入口の床先と籠の床先との水平距離は、4cmを超えることができる。','地階を除く階数が11以上である建築物の屋上に設ける冷房のための冷却塔設備は、防火上支障がないものとして国土交通大臣が定めた構造方法を用いる場合においては、主要な部分を不燃材料以外の材料で造ることができる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:11,text:'建築物の構造計算に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['鉄筋コンクリート造の建築物において、保有水平耐力計算によって安全性を確かめる場合、構造耐力上主要な部分である柱の主筋の断面積の和は、コンクリートの断面積の0.8%以上としなくてもよい。','鉄骨造の建築物において、許容応力度等計算によって安全性を確かめる場合、国土交通大臣が定める場合においては、構造耐力上主要な部分である構造部材の変形又は振動によって建築物の使用上の支障が起こらないことを所定の方法によって確かめなければならない。','建築物の実況によらないで、基礎の垂直荷重による圧縮力を計算する場合、事務室で、基礎のささえる床の数が7のときは、床の積載荷重として採用する数値を1,300N/m²とすることができる。','鉄骨造の建築物において、限界耐力計算によって安全性を確かめる場合、柱以外の構造耐力上主要な部分である鋼材の圧縮材の有効細長比は、250以下としなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:12,text:'構造耐力の規定に適合していない部分を有し、建築基準法第3条第2項の規定の適用を受けている既存建築物に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['基準時における延べ面積が800m²の既存建築物に床面積50m²の増築をする場合においては、増築に係る部分が現行の構造耐力の規定に適合し、既存建築物の部分の構造耐力上の危険性が増大しない構造方法とすれば、既存建築物の部分には現行の構造耐力の規定は適用されない。','基準時における延べ面積が800m²の既存建築物に床面積400m²の増築をする場合においては、増築後の建築物の構造方法が、耐久性等関係規定に適合し、かつ、所定の基準に適合するものとすれば、既存建築物の部分には現行の構造耐力の規定は適用されない。','増築をするに当たって、既存の建築物に対する制限の緩和を受ける場合においては、建築確認の申請書に、既存建築物の基準時及びその状況に関する事項を明示した既存不適格調書を添えなければならない。','柱について過半の修繕を行う場合においては、当該建築物の構造耐力上の危険性が増大しない修繕とすれば、現行の構造耐力の規定は適用されない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:13,text:'建築物を新築する場合において、建築基準法上、構造計算適合性判定の対象となるものは、次のうちどれか。',choices:['高さが60mを超える鉄骨造の建築物で、荷重及び外力によって建築物の各部分に連続的に生ずる力及び変形を把握すること等の所定の基準に従った構造計算を行ったもの','高さが20mの鉄筋コンクリート造の建築物で、構造耐力上主要な部分ごとに応力度が許容応力度を超えないこと等の所定の基準に従った構造計算を行ったもの','高さが15mの鉄骨造の建築物で、許容応力度等計算により構造計算を行ったもので、特定建築基準適合判定資格者である建築主事が審査を行ったもの','高さが15mの鉄筋コンクリート造の建築物で、保有水平耐力計算又はこれと同等以上に安全性を確かめることができる所定の基準に従った構造計算を行ったもの'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:14,text:'都市計画区域及び準都市計画区域内の道路に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['幅員6mの道路法による道路で地下におけるものは、建築基準法上の道路ではない。','道路の地盤面下に、建築物に附属する地下通路を設ける場合、特定行政庁の許可を受ける必要がある。','高架の道路の路面下に、飲食店を建築しようとする場合、原則として、特定行政庁の許可を受ける必要がある。','幅員15m未満の道路は、特定道路とはならない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:15,text:'建築物の用途の制限に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、用途地域以外の地域、地区等の指定はなく、また、特定行政庁の許可等は考慮しないものとする。',choices:['第二種低層住居専用地域内において、「延べ面積1,100m²、地上2階建ての建築物で、2階を床面積500m²の図書館、1階を図書館に附属する床面積600m²の自動車車庫とするもの」は、新築することができる。','第二種住居地域内において、「延べ面積8,000m²、地上2階建ての勝馬投票発売所(各階を当該用途に供するもの)」は、新築することができる。','工業地域内において、「延べ面積500m²、地上2階建ての幼保連携型認定こども園」は、新築することができる。','工業専用地域内において、「延べ面積300m²、地上2階建ての診療所」は、新築することができる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:16,text:'図のような敷地において、準耐火建築物を新築する場合、建築基準法上、建築することができる建築面積の最大のものは、次のうちどれか。ただし、図に記載されているものを除き、地域、地区等及び特定行政庁の指定、許可等は考慮しないものとする。',choices:['323 m²','380 m²','437 m²','460 m²'],answer:3,hasFigure:true,figureDesc:'敷地は2つの用途地域にまたがる。左側は準住居地域・準防火地域（都市計画で定められた建蔽率6/10）で幅8m、右側は第一種住居地域（都市計画で定められた建蔽率5/10）で幅20m+10m。敷地は北側に隣地、南側に宅地（崖地等ではない）、西側に宅地と道路、東側に隣地。南側に建築基準法第42条第2項の規定に基づき特定行政庁が指定した道路とみなす道（現況の道の中心線を当該道路の中心線とする）があり、敷地の奥行きは20m、道路側に2mのセットバックが必要。街区の角にある敷地等として特定行政庁が指定したものとする。'},
{year:2020,subject:'法規',no:17,text:'図のような敷地において、建築物を新築する場合、建築基準法上、A点における地盤面からの建築物の高さの最高限度は、次のうちどれか。ただし、敷地は平坦で、敷地、隣地及び道路の相互間に高低差はなく、門、塀等はないものとする。また、図に記載されているものを除き、地域、地区等及び特定行政庁による指定、許可等並びに日影による中高層の建築物の高さの制限及び天空率に関する規定は考慮しないものとする。なお、建築物は、全ての部分において、高さの最高限度まで建築されるものとする。',choices:['30.0 m','31.5 m','33.0 m','36.0 m'],answer:4,hasFigure:true,figureDesc:'商業地域（都市計画で定められた容積率60/10）の敷地。敷地は南側と東側に道路が接する。南側道路の幅員は15m（敷地境界から1m+建築物12m+2m）。東側道路の幅員は6m。北東に5mの川がある。敷地の奥行き15m、建築物は12m×3mで、A点は建築物の北東角から2m南の位置。隣地は北側と西側にある。真北は右上方向。'},
{year:2020,subject:'法規',no:18,text:'防火地域及び準防火地域内の建築物の新築に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['準防火地域内においては、延べ面積400m²、平家建ての事務所のみの用途に供する建築物は、耐火建築物若しくは準耐火建築物又はこれらと同等以上の延焼防止時間となる建築物としなければならない。','防火地域内においては、延べ面積80m²、地上2階建ての一戸建て住宅は、耐火建築物若しくは準耐火建築物又はこれらと同等以上の延焼防止時間となる建築物としなければならない。','防火地域内においては、高さが2mの広告塔で、建築物の屋上に設けるものは、その主要な部分を不燃材料で造り、又は覆わなければならない。','建築物が「防火地域」と「防火地域又は準防火地域として指定されていない区域」にわたる場合において、その建築物が防火地域外において防火壁で区画されているときは、その防火壁外の部分については、防火地域内の建築物に関する規定は適用されない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:19,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['小学校の教室の窓その他の開口部で採光に有効な部分の面積の算定に当たっては、原則として、用途地域等の区分に応じ、計算した採光補正係数を用いる。','一団地内に建築される1又は2以上の構えを成す建築物のうち、特定行政庁がその位置及び構造が安全上、防火上及び衛生上支障がないと認めるものに対する用途地域等の規定の適用については、当該一団地を当該1又は2以上の建築物の一の敷地とみなす。','特定行政庁が建築審査会の同意を得て許可した歩廊の柱は、壁面線を越えて建築することができる。','建築主は、指定確認検査機関から建築物の用途の変更に係る確認済証の交付を受けた場合において、工事を完了したときは、工事完了届を建築主事に届け出なければならない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:20,text:'共同住宅に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['共同住宅の地階に設ける居室においては、採光のための窓その他の開口部で採光に有効な部分の面積を、その居室の床面積に対して1/7以上としないことができる。','階段の幅が3mを超える共同住宅の階段で、蹴上げが15cm以下、かつ、踏面が30cm以上のものにあっては、その中間に手すりを設けないことができる。','非常用エレベーターを設置している共同住宅であっても、3階以上の階には、非常用の進入口を設けなければならない。','地方公共団体は、共同住宅の規模により、条例で、建築物の敷地、構造又は建築設備に関して安全上、防火上又は衛生上必要な制限を附加することができる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:21,text:'建築士に関する次の記述のうち、建築士法上、誤っているものはどれか。',choices:['工事監理を行う一級建築士は、工事監理の委託者から請求があったときには、一級建築士免許証又は一級建築士免許証明書を提示し、工事監理を終了したときには、直ちに、その結果を建築主に工事監理報告書を提出して報告しなければならない。','工事監理を行う建築士は、工事が設計図書のとおりに実施されていないと認めるときは、直ちに、工事施工者に対して、その旨を指摘し、当該工事を設計図書のとおりに実施するよう求め、当該工事施工者がこれに従わないときは、その旨を特定行政庁に報告しなければならない。','建築士事務所に属する構造設計一級建築士は、一級建築士定期講習と構造設計一級建築士定期講習の両方を受けなければならない。','建築士事務所に属する設備設計一級建築士は、設備設計以外の設計を含めた建築物の設計を行うことができる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:22,text:'建築士事務所に関する次の記述のうち、建築士法上、誤っているものはどれか。',choices:['建築士事務所の開設者は、配置図、各階平面図等の設計図書又は工事監理報告書で、保存しなければならないと定められているものについては、作成した日から起算して15年間保存しなければならない。','管理建築士は、自らが管理する建築士事務所の規模にかかわらず、当該建築士事務所において専任でなければならない。','建築士事務所の開設者は、延べ面積が300m²を超える建築物の新築について、他の建築士事務所の開設者から設計の業務の一部を受託する設計受託契約を締結したときは、遅滞なく、設計図書の種類、報酬の額及び支払の時期等を記載した書面を、当該委託者である建築士事務所の開設者に交付しなければならない。','管理建築士は、その建築士事務所に属する他の建築士が設計を行った建築物の設計図書について、設計者である建築士による記名及び押印に加えて、管理建築士である旨の表示をして記名及び押印をしなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:23,text:'次の記述のうち、建築士法上、誤っているものはどれか。',choices:['建築士会は、建築士の品位の保持及びその業務の進歩改善に資するため、建築士に対し、その業務に必要な知識及び技能の向上を図るための建築技術に関する研修を実施しなければならない。','建築士事務所協会は、建築主等から建築士事務所の業務に関する苦情について解決の申出があったときは、その相談に応じ、申出人に必要な助言をし、その苦情に係る事情を調査するとともに、当該建築士事務所の開設者に対し、その苦情の内容を通知してその迅速な処理を求めなければならない。','建築士事務所の業務に関する設計図書の保存をしなかった者や、設計等を委託しようとする者の求めに応じて建築士事務所の業務の実績を記載した書類を閲覧させなかった者は、10万円以下の過料に処される。','建築士事務所の開設者が建築基準法に違反して建築士免許を取り消された場合、当該建築士事務所の登録は取り消される。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:24,text:'次の記述のうち、都市計画法上、誤っているものはどれか。',choices:['地区整備計画が定められている地区計画の区域内において、6か月間使用するイベント用の仮設建築物の建築を行おうとする者は、当該行為に着手する日の30日前までに、行為の種類、場所、着手予定日等を市町村長に届け出なければならない。','市街地開発事業の施行区域内において、地階を有しない鉄骨造、地上2階建ての一戸建ての住宅を改築しようとする者は、原則として、都道府県知事等の許可を受けなければならない。','市街化調整区域内における地区整備計画が定められた地区計画の区域内において、当該地区計画に定められた内容に適合する病院の建築の用に供する目的で行う開発行為は、所定の要件に該当すれば、都道府県知事の許可を受けることができる。','開発区域の面積が10haの開発行為に係る開発許可の申請に当たっては、一級建築士の資格を有する者で、宅地開発に関する技術に関して2年以上の実務の経験を有するものは、当該開発行為に関する設計に係る設計図書を作成することができる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:25,text:'次の記述のうち、消防法上、誤っているものはどれか。ただし、建築物は、いずれも無窓階を有しないものとし、指定可燃物の貯蔵又は取扱いは行わないものとする。',choices:['収容人員が10人の飲食店と、収容人員が30人の共同住宅からなる複合用途防火対象物については、防火管理者を定めなければならない。','事務所とホテルとが開口部のない準耐火構造の床又は壁で区画されているときは、その区画された部分は、消防用設備等の設置及び維持の技術上の基準の規定の適用については、それぞれ別の防火対象物とみなす。','延べ面積300m²、平屋建ての図書館については、原則として、消火器又は簡易消火用具を設置しなければならない。','主要構造部を耐火構造とし、かつ、壁及び天井の室内に面する部分の仕上げを準不燃材料でした延べ面積2,000m²の展示場については、屋内消火栓設備を設置しなくてもよい。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:26,text:'次の記述のうち、「高齢者、障害者等の移動等の円滑化の促進に関する法律」上、誤っているものはどれか。',choices:['認定特定建築物の建築物特定施設の床面積のうち、移動等円滑化の措置をとることにより通常の建築物の建築物特定施設の床面積を超えることとなる部分については、認定特定建築物の延べ面積の1/10を限度として、容積率の算定の基礎となる延べ面積に算入しないものとする。','この法律の施行の際現に存する特定建築物に、専ら車椅子を使用している者の利用に供するエレベーターを設置する場合において、当該エレベーターが所定の基準に適合し、所管行政庁が防火上及び避難上支障がないと認めたときは、建築基準法の一部の規定の適用については、当該エレベーターの構造は耐火構造とみなす。','建築主等は、特定建築物(特別特定建築物を除く。)の建築をしようとするときは、当該特定建築物を「建築物移動等円滑化基準」に適合させるために必要な措置を講ずるよう努めなければならない。','「建築物移動等円滑化誘導基準」においては、多数の者が利用する主たる階段は、回り階段以外の階段を設ける空間を確保することが困難であるときは、回り階段とすることができる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:27,text:'防火地域及び準防火地域以外の地域における建築物の用途の変更に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、増築、大規模の修繕又は大規模の模様替を伴わないものとする。',choices:['延べ面積150m²、高さ15m、地上3階建ての「一戸建ての住宅(耐火建築物及び準耐火建築物以外の建築物)」を「旅館」に用途変更しようとする場合、有効かつ速やかに火災の発生を感知して報知できるものとする技術的基準に従って警報設備を設置すれば、主要構造部を耐火構造とする必要はない。','延べ面積150m²の「一戸建ての住宅」を「物品販売業を営む店舗」に用途変更しようとする場合、所定の基準に適合させる必要があるが、用途変更に伴う確認済証の交付を受ける必要はない。','建築基準法第3条第2項の規定により排煙設備の規定の適用を受けない「事務所」について、2以上の工事に分けて「飲食店」とするための用途変更に伴う工事を行う場合、特定行政庁による全体計画の認定を受けていれば、いずれの工事の完了後であっても、現行基準に適合するように排煙設備を設置するための改修を行う必要はない。','既存建築物の用途を変更して、国際的な規模の競技会を行うための「特別興行場等」として利用する場合、特定行政庁の許可を受けることにより、建築基準法第21条及び第27条の規定に基づく主要構造部に対する規制等を受けることなく、一年を超えて使用することができる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:28,text:'以下の条件の建築物に関する次の記述のうち、建築基準法又は建築士法上、誤っているものはどれか。',choices:['時刻歴応答解析により安全性の確認を行う場合を除き、許容応力度等計算、保有水平耐力計算、限界耐力計算又はこれらと同等以上に安全性を確かめることができるものとして国土交通大臣が定める基準に従った構造計算のいずれかによって、自重、積載荷重、地震等に対する安全性を有することを確かめなければならない。','当該建築物の通常火災終了時間及び特定避難時間が75分であった場合、その柱及びはりについて、耐火構造とする場合を除き、通常の火災による75分間の火熱を受けている間は構造耐力上支障のある損傷を生じないものとする性能を確保しなければならない。','当該建築物を新築する場合において、構造設計一級建築士及び設備設計一級建築士以外の一級建築士が設計を行ったときは、構造設計一級建築士に構造関係規定に適合するかどうかの確認を求め、かつ、設備設計一級建築士に設備関係規定に適合するかどうかの確認を求めなければならない。','所有者等は、必要に応じて建築物の維持保全に関する準則又は計画を作成して常時適法な状態に維持するための措置を講じ、かつ、定期に、一級建築士等にその状況の調査をさせて、その結果を特定行政庁に報告しなければならない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:29,text:'次の記述のうち、関係法令上、誤っているものはどれか。',choices:['「景観法」に基づき、景観計画区域内において、建築物の外観を変更することとなる模様替をしようとする者は、あらかじめ、行為の種類、場所、設計又は施行方法等について、景観行政団体の長の許可を受けなければならない。','「労働安全衛生法」に基づき、事業者は、高さが5m以上のコンクリート造の工作物の解体の作業については、作業主任者を選任しなければならない。','「建設工事に係る資材の再資源化等に関する法律」に基づき、解体工事業を営もうとする者は、建設業法に基づく土木工事業、建築工事業又は解体工事業に係る建設業の許可を受けている場合を除き、当該業を行おうとする区域を管轄する都道府県知事の登録を受けなければならない。','「労働安全衛生法」に基づく石綿障害予防規則により、事業者は、建築物の解体の作業を行うときは、あらかじめ、当該建築物について、石綿等の使用の有無を目視、設計図書等により調査し、その結果を記録しておかなければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'法規',no:30,text:'次の記述のうち、関係法令上、誤っているものはどれか。',choices:['「住宅の品質確保の促進等に関する法律」に基づき、住宅の建設工事の請負人は、設計住宅性能評価書の写しを請負契約書に添付した場合においては、当該設計住宅性能評価書の写しに表示された性能を有する住宅の建設工事を行うことを契約したものとみなす。','「建築物のエネルギー消費性能の向上に関する法律」に基づき、建築主は、特定建築物以外の建築物で床面積の合計が300m²以上のものを新築しようとするときは、所定の事項に関する計画の所管行政庁への届出に併せて、建築物エネルギー消費性能適合性判定に準ずるものとして、登録建築物エネルギー消費性能判定機関が行う建築物のエネルギー消費性能に関する評価の結果を記載した書面を提出することができる。','「宅地建物取引業法」に基づき、宅地建物取引業者は、既存の建物の売買の相手方等に対して、その契約が成立するまでの間に、宅地建物取引士をして、建物状況調査を実施している場合におけるその結果の概要、建物の建築及び維持保全の状況に関する書類の保存の状況等、所定の事項を記載した書面等を交付して説明をさせなければならない。','「宅地造成等規制法」に基づき、宅地造成工事規制区域内において、盛土のみの宅地造成に関する工事であって、盛土をする土地の面積が500m²で、高さ1mの崖を生ずることとなる場合には、造成主は、原則として、都道府県知事の許可を受けなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'構造',no:1,text:'図－1のように、脚部で固定された柱の頂部に鉛直荷重Nおよび水平荷重Qが作用している。柱の断面形状は図－2に示すとおりであり、NおよびQは断面の図心に作用しているものとする。柱脚部断面の垂直応力度分布が図－3のような全塑性状態に達している場合のNとQとの組合せとして、正しいものは、次のうちどれか。ただし、柱は等質等断面とし、降伏応力度はσyとする。',choices:['鉛直荷重N: 2a²σy、水平荷重Q: 9a³σy/h','鉛直荷重N: 2a²σy、水平荷重Q: 18a³σy/h','鉛直荷重N: 4a²σy、水平荷重Q: 9a³σy/h','鉛直荷重N: 4a²σy、水平荷重Q: 18a³σy/h'],answer:1,hasFigure:true,figureDesc:'図－1: 脚部固定柱に鉛直荷重Nと水平荷重Qが作用。図－2: H形断面（幅4a、フランジ厚a、ウェブ厚a、せい3a）。図－3: 柱脚部断面の垂直応力度分布（引張側σy、圧縮側σy、幅4a中aが引張側、3aが圧縮側）。'},
{year:2020,subject:'構造',no:2,text:'図に示す交差梁のA材とB材の交点に集中荷重Pが作用したときのA材、B材の支点の反力をそれぞれRA、RBとするとき、その比として、正しいものは、次のうちどれか。なお、A材とB材は等質等断面とし、梁の重量は無視するものとする。',choices:['RA : RB = 1 : 1','RA : RB = 1 : 2','RA : RB = 1 : 4','RA : RB = 1 : 8'],answer:4,hasFigure:true,figureDesc:'A材は単純梁でスパンl、B材は単純梁でスパン2l。交差点に集中荷重Pが作用。'},
{year:2020,subject:'構造',no:3,text:'図のような柱脚の支持条件が異なる3つのラーメンに水平荷重Pが作用する場合、柱A、柱B及び柱Cに生じるせん断力をそれぞれQA、QB及びQCとしたとき、それらの大小関係として、正しいものは、次のうちどれか。ただし、全ての柱は等質等断面の弾性部材とし、梁は剛体とする。',choices:['QA > QB > QC','QA = QC > QB','QB > QA = QC','QC > QB > QA'],answer:2,hasFigure:true,figureDesc:'柱A: 上ピン・下ピン支持、高さh。柱B: 上ピン・下固定支持、高さh。柱C: 上剛接・下固定支持、高さh。いずれも梁は剛体で水平荷重Pが作用。'},
{year:2020,subject:'構造',no:4,text:'図－1のような水平荷重Pを受けるラーメンにおいて、Pを増大させたとき、そのラーメンは、図－2のような崩壊機構を示した。ラーメンの崩壊荷重Puの値として、正しいものは、次のうちどれか。ただし、柱、梁の全塑性モーメントの値は、それぞれ400 kN・m、200 kN・mとする。',choices:['200 kN','300 kN','400 kN','600 kN'],answer:2,hasFigure:true,figureDesc:'図－1: 1層1スパンラーメン、柱高さ6m（上3m＋下3m）、スパン8m。梁Mp=200kN・m、柱Mp=400kN・m。図－2: 崩壊機構（柱脚2箇所と梁端1箇所に塑性ヒンジ）。'},
{year:2020,subject:'構造',no:5,text:'図のような荷重が作用するトラスにおいて、部材A、B、C及びDに生じる軸方向力をそれぞれNA、NB、NC及びNDとするとき、それらの値として、誤っているものは、次のうちどれか。ただし、軸方向力は、引張力を「＋」、圧縮力を「－」とする。',choices:['NA = -5√2/2 P','NB = -5P','NC = -√2/2 P','ND = 0'],answer:2,hasFigure:true,figureDesc:'ワーレントラス。上弦材に5つの等間隔荷重P。スパン7l、高さl。左端ピン支持、右端ローラー支持。部材A、B、C、Dが指定されている。'},
{year:2020,subject:'構造',no:6,text:'図のようなラーメンA、ラーメンB及びラーメンCの柱の弾性座屈荷重をそれぞれPA、PB及びPCとしたとき、これらの大小関係として、正しいものは、次のうちどれか。ただし、全ての柱及び梁は等質等断面の弾性部材であり、「柱及び梁の重量」及び「柱の面外方向の座屈及び梁の座屈」については無視するものとする。',choices:['PA = PC > PB','PB > PA > PC','PC > PA = PB','PC > PA > PB'],answer:4,hasFigure:true,figureDesc:'ラーメンA: 柱2本（ピン・ピン支持）、スパンl、高さh。ラーメンB: 柱2本（ピン・ピン支持）、スパン2l、高さh。ラーメンC: 柱2本（固定・固定支持）、スパンl、高さh。'},
{year:2020,subject:'構造',no:7,text:'建築基準法における建築物に作用する地震力に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築物の地上部分における各層の地震層せん断力係数Ciは、最下層における値が最も小さくなる。','建築物の地上部分の必要保有水平耐力を計算する場合、標準せん断力係数C0は1.0以上とする。','振動特性係数Rtは、建築物の設計用一次固有周期Tが長くなるほど大きくなる。','地震層せん断力係数Ciの建築物の高さ方向の分布を表す係数Aiを算出する場合、建築物の設計用一次固有周期Tは、振動特性係数Rtを算出する場合のTの値と同じとする。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'構造',no:8,text:'建築基準法における屋根葺き材に作用する風荷重に関する次の記述のうち、最も不適当なものはどれか。',choices:['屋根葺き材の風圧に対する構造耐力上の安全性を確かめるための構造計算の基準は、建築物の高さにかかわらず適用される。','屋根葺き材に作用する風圧力の算出に用いる平均速度圧q̄については、気流の乱れを表すガスト影響係数Gfは考慮しなくてよい。','屋根葺き材に作用する風圧力の算出に用いるピーク風力係数Ĉfは、一般に、構造骨組に用いる風圧力を算出する場合の風力係数Cfよりも大きい。','屋根葺き材に作用する風圧力の算出に用いる基準風速V0は、構造骨組に用いる風圧力を算出する場合と異なる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'構造',no:9,text:'木造軸組工法による地上2階建ての建築物において、建築基準法に基づく「木造建築物の軸組の設置の基準」(いわゆる四分割法)に関する次の記述のうち、最も不適当なものはどれか。',choices:['各階について、張り間方向及び桁行方向の偏心率が0.3以下であることを確認した場合は、「木造建築物の軸組の設置の基準」によらなくてもよい。','図－1に示す平面形状の場合、張り間方向及び桁行方向それぞれの計算に用いる側端部分は、建築物の両側(最外縁)より1/4の部分(斜線部)である。','図－2のような建築物の1階側端部分のうちAの部分は、平家建てとして必要壁量を算定する。','各側端部分の壁量充足率が全て1を超えていても、壁率比は0.5以上でなければならない。'],answer:4,hasFigure:true,figureDesc:'図－1: 平面形状と側端部分の範囲（張り間方向・桁行方向）。図－2: 立面と1階平面で、2階が1階より小さいセットバック形状。Aは2階がない部分の1階側端部分。'},
{year:2020,subject:'構造',no:10,text:'木造軸組工法による地上2階建ての既存建築物の耐震性を向上させる方法として、一般に、最も効果の低いものは、次のうちどれか。',choices:['既存の布基礎が無筋コンクリート造であったので、布基礎の外部側面に接着系のあと施工アンカーによる差し筋を行い、新たに鉄筋コンクリート造の基礎を増し打ちした。','基礎に不同沈下がみられたので、1階の床組に火打ち材を入れ、1階の床組の水平剛性を高めた。','1階と2階の耐力壁の位置がずれて設置されていたので、2階の床下地の構造用合板を梁及び桁に直張りして、2階の床組の水平剛性を高めた。','屋根葺き材が日本瓦であったので、住宅屋根用化粧スレートに葺き替えて、屋根を軽量化した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'構造',no:11,text:'鉄筋コンクリート構造における付着、継手及び定着に関する次の記述のうち、最も不適当なものはどれか。',choices:['柱の付着割裂破壊を防止するために、柱の断面の隅角部の主筋には太径の鉄筋を用いることとした。','鉄筋の継手については、継手位置の存在応力にかかわらず、母材の強度を伝達できる継手とした。','柱に定着する梁の引張鉄筋の定着長さにおいて、SD295Aの鉄筋を同一径のSD390の鉄筋に変更したので、定着長さを長くした。','独立柱の帯筋の端部(隅角部)に135度フックを設け、定着させた。'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'構造',no:12,text:'鉄筋コンクリート造の建築物において、「躯体に発生したコンクリートのひび割れの状況を示す図」と「その説明」として、最も不適当なものは、次のうちどれか。',choices:['矢印方向に荷重を受けた場合の、「片持ち梁のせん断ひび割れ」','下端筋に沿って付着割裂した場合の、「梁のひび割れ」','柱梁接合部内に定着された梁上端筋が矢印方向に引張力を受けた場合の、「柱梁接合部及び柱のひび割れ」','矢印方向に荷重を受けた場合の、「柱梁接合部のひび割れ」'],answer:1,hasFigure:true,figureDesc:'4つの選択肢それぞれに、柱・梁接合部付近のひび割れパターンを示す図が付されている。'},
{year:2020,subject:'構造',no:13,text:'鉄筋コンクリート構造の許容応力度計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['柱の長期許容せん断力の計算においては、帯筋の効果を考慮しなかった。','梁の短期許容せん断力の計算においては、有効せいに対するせん断スパンの比による割増しを考慮した。','柱の許容曲げモーメントは、「圧縮縁がコンクリートの許容圧縮応力度に達したとき」、「圧縮側鉄筋が許容圧縮応力度に達したとき」及び「引張鉄筋が許容引張応力度に達したとき」に対して算定したそれぞれの曲げモーメントのうち、最大となるものとした。','太径の異形鉄筋を梁の主筋に使用したので、鉄筋のコンクリートに対する許容付着応力度を、かぶり厚さと鉄筋径の比に応じて低減した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'構造',no:14,text:'鉄筋コンクリート構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['柱は、作用する軸方向圧縮力が大きいほど、一般に、塑性変形性能が低下する。','梁は、貫通孔を設けることにより、一般に、せん断耐力が小さくなる。','柱梁接合部は、取り付く梁の主筋量が多くなるほど、一般に、せん断耐力が大きくなる。','耐力壁は、壁板の周辺に側柱を設けることにより、一般に、塑性変形性能が向上する。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'構造',no:15,text:'鉄骨構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['横移動が拘束されていないラーメン架構において、柱材の座屈長さは、梁の剛性を高めても節点間距離より小さくすることはできない。','有効細長比λが小さい筋かい(λ＝20程度)は、中程度の筋かい(λ＝80程度)に比べて塑性変形性能が低い。','柱材を建築構造用圧延鋼材SN400Bから同一断面のSN490Bに変更しても、細長比がSN400Bの限界細長比以上であれば、許容圧縮応力度は変わらない。','梁の塑性変形性能は、使用する鋼材の降伏比が小さいほど、向上する。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'構造',no:16,text:'鉄骨構造において使用する高力ボルトに関する次の記述のうち、最も不適当なものはどれか。',choices:['山形鋼を用いた筋かいを、材軸方向に配置された一列の高力ボルトによりガセットプレートに接合する場合、筋かい材の有効断面積は、一般に、高力ボルトの本数が多くなるほど大きくなる。','高力ボルト摩擦接合部において、一般に、すべり耐力以下の繰り返し応力であれば、ボルト張力の低下や摩擦面の状態の変化を考慮する必要はない。','高力ボルト摩擦接合は、すべりが生じるまでは、高力ボルトにせん断力は生じない。','高力ボルト摩擦接合のすべりに対する許容耐力の算定において、二面摩擦接合のすべり係数は、一面摩擦接合の2倍となる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'構造',no:17,text:'鉄骨構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['引張力を負担する筋かいを保有耐力接合とするためには、筋かい軸部の降伏耐力より、筋かい端部及び接合部の破断耐力を大きくする必要がある。','H形鋼等の開断面の梁が曲げを受けたとき、ねじれを伴って圧縮側のフランジが面外にはらみ出して座屈する現象を横座屈という。','ラーメン架構の柱及び梁に、建築構造用圧延鋼材SN400Bを用いる代わりに同一断面のSN490Bを用いることで、弾性変形を小さくすることができる。','H形鋼の梁の設計において、板要素の幅厚比を小さくすると、局部座屈が生じにくくなる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'構造',no:18,text:'鉄骨構造の耐震計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['「ルート1－1」で計算する場合であっても、特定天井がある場合は、特定天井に関する技術基準に適合することを確かめる必要がある。','「ルート1－2」で、厚さ6 mm以上の冷間成形角形鋼管を用いた柱を設計する場合、地震時応力の割増し係数は、建築構造用冷間ロール成形角形鋼管BCRより、建築構造用冷間プレス成形角形鋼管BCPのほうが大きい。','「ルート2」で計算する場合、地上部分の塔状比が4を超えないことを確かめる必要がある。','「ルート3」で、建築構造用冷間プレス成形角形鋼管BCPの柱が局部崩壊メカニズムと判定された場合、柱の耐力を低減して算定した保有水平耐力が、必要保有水平耐力以上であることを確認する必要がある。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'構造',no:19,text:'土質及び地盤に関する次の記述のうち、最も不適当なものはどれか。',choices:['砂のせん断力に対する抵抗力の大きさは、標準貫入試験で得られるN値と相関関係にある。','粘土の変形特性は、一般に、粘土中に含まれる水分量と関係がある。','締固め工法による地盤改良は、一般に、液状化対策としての効果はない。','地盤の極限鉛直支持力は、一般に、土のせん断破壊が生じることにより決定される。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'構造',no:20,text:'基礎の設計のための地盤調査に関する次の記述のうち、最も不適当なものはどれか。',choices:['基礎を支持する砂礫層直下の粘性土層の圧密沈下の特性を把握するために、粘性土の乱さない試料をサンプリングして、一軸圧縮試験を実施した。','事前調査の結果、地層の構成が推定できなかったので、予備調査を実施した後に、本調査のボーリングの位置及び数量を決定した。','液状化のおそれがある埋立て土層があったので、地下水位調査と粒度試験を実施した。','高層建築物の耐震設計上必要となる地盤特性を調査するために、PS検層を実施した。'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'構造',no:21,text:'基礎の設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['直接基礎として支持力はあるが、基礎の沈下が過大となるおそれがある地盤に建つ建築物において、基礎の平均沈下量及び不同沈下量を低減するために、パイルド・ラフト基礎を採用した。','地震時に液状化のおそれのある地盤であったので、杭の水平抵抗を検討する際に、水平地盤反力係数(単位kN/m³)の値を低減した。','一つの建築物において、高層部には杭基礎、低層部には直接基礎を採用したので、鉛直荷重時の不同沈下の検討のみを行い、基礎及び上部構造に障害が生じないことを確認した。','地盤沈下が生じている埋立て地盤において、杭に負の摩擦力が生じるおそれがあったので、杭の表面に潤滑材を塗布することで対応した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'構造',no:22,text:'「壁式鉄筋コンクリート造」及び「壁式ラーメン鉄筋コンクリート造」の建築物に関する次の記述のうち、最も不適当なものはどれか。',choices:['壁式鉄筋コンクリート造の建築物では、壁梁の幅を、壁梁に接している耐力壁の厚さと同じにすることができる。','壁式鉄筋コンクリート造の建築物では、直交壁の取り付いた耐力壁の曲げ剛性を評価する場合、直交壁の効果を考慮することができる。','壁式鉄筋コンクリート構造は、一般に、壁式ラーメン鉄筋コンクリート構造に比べて、軒の高さの高い建築物に適用することができる。','壁式ラーメン鉄筋コンクリート造の建築物では、張り間方向の外壁となる構面には最下階から最上階まで連続する連層耐力壁を設置する必要がある。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'構造',no:23,text:'各種建築構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['プレストレストコンクリート構造におけるポストテンション方式は、PC鋼材の周りに直接コンクリートを打設し、コンクリートが所定の強度に達した後にPC鋼材の緊張を行って、PC鋼材とコンクリートとの付着力により、コンクリートにプレストレスを導入するものである。','プレキャストプレストレストコンクリート造の床版では、周囲の梁との接合部を、長期及び短期に生じる応力を相互に伝達できるように設計する。','鉄骨鉄筋コンクリート構造の架構応力の計算では、鋼材の影響が小さい場合には、全断面についてコンクリートのヤング係数を用いて部材剛性を評価することができる。','コンクリート充填鋼管(CFT)造の柱では、梁から伝達されるせん断力の一部を充填コンクリートに負担させる場合、鋼管と充填コンクリートとの間で応力伝達ができるように設計する。'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'構造',no:24,text:'建築物の耐震設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['鉄筋コンクリート造建築物の設計用一次固有周期Tを、略算法でなく固有値解析等の精算によって求める場合には、建築物の振動特性はコンクリートにひび割れのない初期剛性を用い、かつ、基礎や基礎杭の変形はないものと仮定する。','構造特性係数Dsは、一般に、架構の減衰が小さいほど小さくすることができる。','各階の保有水平耐力計算において、剛性率が0.6を下回る場合、又は、偏心率が0.15を上回る場合には、必要保有水平耐力の値を割増しする。','限界耐力計算において、塑性化の程度が大きいほど、一般に、安全限界時の各部材の減衰特性を表す係数を大きくすることができる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'構造',no:25,text:'免震構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['免震構造において、上部構造の地震時応答せん断力を小さくするには、一般に、ダンパーの減衰量をできるだけ大きくすることが有効である。','免震構造において、上部構造の層せん断力係数は、一般に、Ai分布と異なる分布となる。','免震構造に用いられるオイルダンパーは、免震層平面の外周部に設置すると、免震層のねじれ変形を抑制する効果がある。','免震構造に用いられるすべり支承には、減衰機能はあるが、復元機能はない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'構造',no:26,text:'建築物の構造設計及び耐震補強に関する次の記述のうち、最も不適当なものはどれか。',choices:['プレストレストコンクリート構造において、クリープ等によるプレストレスの減少率は、一般に、プレテンション方式に比べて、ポストテンション方式のほうが小さい。','コンクリート充填鋼管(CFT)造の柱は、コンクリートが充填されていない同じ断面の中空鋼管の柱に比べて、剛性は高いが水平力に対する塑性変形性能は低い。','鉄骨構造において、露出柱脚の最大せん断耐力は、「摩擦により抵抗するせん断耐力」と「アンカーボルトのせん断耐力」のいずれか大きいほうとする。','鉄筋コンクリート造の既存建築物の耐震改修において、柱への炭素繊維巻き付け補強は、柱の曲げ耐力を大きくする効果は期待できない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'構造',no:27,text:'木材に関する次の記述のうち、最も不適当なものはどれか。',choices:['木材のクリープによる変形は、一般に、気乾状態に比べて、湿潤状態のほうが大きい。','木材は樹種により腐朽菌に対する抵抗性が異なるので、腐朽しやすい土台などには、ひば、ひのきなどの耐朽性のある樹種を使用することが望ましい。','木材の含水率は、水分を含まない木材実質の質量に対する木材に含まれる水の質量の百分率として定義される。','木材の繊維方向の基準材料強度は、一般に、圧縮に比べて、引張のほうが大きい。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'構造',no:28,text:'コンクリートの一般的な性質に関する次の記述のうち、最も不適当なものはどれか。',choices:['水中で養生したコンクリートの圧縮強度は、同一温度の大気中で養生したものよりも大きくなる。','一軸圧縮を受けるコンクリート円柱試験体の圧縮強度時ひずみは、圧縮強度が大きいほど大きくなる。','コンクリートのスランプは、コンクリートの単位水量が小さいほど大きくなる。','コンクリートのヤング係数は、コンクリートの気乾単位体積重量が大きいほど大きくなる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'構造',no:29,text:'鋼材等に関する次の記述のうち、最も不適当なものはどれか。',choices:['シャルピー衝撃試験の吸収エネルギーの大きい鋼材を使用することは、溶接部の脆性破壊を防ぐために有利である。','建築構造用圧延鋼材SN490Bの引張強さの下限値は、490 N/mm²である。','アルミニウム合金の線膨張係数は、炭素鋼の約1/2倍である。','ステンレス鋼は、炭素鋼に比べて、耐食性、耐火性に優れている。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'構造',no:30,text:'特定天井に関する次の記述のうち、最も不適当なものはどれか。',choices:['高さが6 mを超え、水平投影面積が200 m²を超え、かつ単位面積質量が2 kg/m²を超える天井は、天井の支持方式にかかわらず、特定天井に該当する。','天井脱落対策に係る技術基準では、稀に生じる地震動(中地震時)において天井が損傷しないことを検証することとしている。','既存建築物においては、落下防止措置としてネットやワイヤーにより一時的に天井の脱落を防ぐ方法も許容される。','免震建築物においても、特定天井については、天井脱落対策に係る技術基準が定められている。'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:1,text:'監理者が行う一般的な監理業務に関する次の記述のうち、「建築士事務所の開設者がその業務に関して請求することのできる報酬の基準(平成31年国土交通省告示第98号)」の「工事監理に関する標準業務及びその他の標準業務」の内容に照らして、最も不適当なものはどれか。',choices:['監理者は、設計図書の内容を把握し、設計図書に明らかな矛盾、誤謬、脱漏、不適切な納まり等を発見した場合には、工事施工者に確認したうえで、設計者に報告する。','監理者は、設計図書の定めにより、工事施工者が提案又は提出する工事材料、設備機器等(当該工事材料、設備機器等に係る製造者及び専門工事業者を含む。)及びそれらの見本が設計図書の内容に適合しているかについて検討し、建築主に報告する。','監理者は、設計図書の定めにより、工事施工者が作成し、提出する施工計画(工事施工体制に関する記載を含む。)について、工事請負契約に定められた工期及び設計図書に定められた品質が確保できないおそれがあるかについて検討し、確保できないおそれがあると判断するときは、その旨を建築主に報告する。','監理者は、工事請負契約に定められた指示、検査、試験、立会い、確認、審査、承認、助言、協議等(設計図書に定めるものを除く。)を行い、また工事施工者がこれを求めたときは、速やかにこれに応じる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:2,text:'工事現場の管理等に関する次の記述のうち、最も不適当なものはどれか。',choices:['騒音規制法に定める指定地域内で行われる特定建設作業に伴って発生する騒音が、当該作業の場所の敷地の境界線において、85 dB以下となるように管理した。','鉄筋コンクリート造の外壁へのタイル割りについては、外周の躯体寸法、外壁開口寸法等にかかわるため、コンクリートの躯体図の作成に先立ち行った。','工事現場に専任の監理技術者を配置すべき工事であったが、監理技術者が技術研鑽のための研修への参加により短期間、当該工事現場を離れることとなったので、発注者の了解のもと、必要な資格を有する代理の技術者を配置した。','建築物内部の枠組足場の組立及び解体作業において、1段目の枠組足場上の作業であったので、満16歳の者を従事させた。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:3,text:'材料管理、品質管理等に関する次の記述のうち、最も不適当なものはどれか。',choices:['既製コンクリート杭の荷降ろしに当たっては、杭の両端から杭の長さの1/5の位置付近の2点で支持しながら、杭に衝撃を与えないように行った。','JISに適合する異形鉄筋の種類の確認において、SD295Aについては圧延マークによる表示がないことを、SD345については圧延マークによる表示が「突起の数1個(・)」であることを、目視により行った。','外壁工事に使用する押出成形セメント板の保管については、積置き場所を平坦で乾燥した屋内とし、台木を配置したうえで、積置き高さを最大で1.2 mとした。','塗料については、使用直前に撹拌したところ、撹拌しても再分散しない沈殿物、皮ばり、凝集等の現象が生じていたので、こしわけによりこれらを取り除いて使用した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:4,text:'建築工事等の届出等に関する次の記述のうち、最も不適当なものはどれか。',choices:['10階建ての病院(5階以上の階における病院部分の床面積の合計が1,500 m²を超えるもの)において、避難施設に関する工事中に当該病院を使用する計画であったので、その工事に先立ち、建築主が特定行政庁あてに「安全上の措置に関する計画届」を提出した。','電波法に基づく伝搬障害防止区域内における高さ35 mの建築物の新築工事において、当該工事の着手前に、建築主が総務大臣あてに「高層建築物等予定工事届」を提出した。','高さ35 mの建築物の新築工事において、当該工事の開始の日の14日前までに、事業者が労働基準監督署長あてに「建設工事計画届」を提出した。','既存建築物を除却し、引き続き同じ敷地に床面積の合計が200 m²の建築物を新築する工事に先立ち、当該既存建築物の床面積の合計が100 m²であったので、当該工事の施工者が特定行政庁あてに「建築物除却届」を提出した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:5,text:'地盤調査及び仮設工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['地盤の平板載荷試験において、試験地盤面については、直径30 cmの円形の載荷板の中心から1.2 mの範囲を水平に整地した。','建築物の高さと位置の基準となるベンチマークについては、工事中に移動のおそれのない位置に設けたコンクリート杭及び前面道路の2箇所に設け、相互に確認できる位置とした。','風荷重を受けるシート類を設けない枠組足場の構面からの墜落防止措置として、交差筋かい及び高さ10 cmの幅木を設けた。','工事を行う部分と隣家との水平距離が5 mであったので、落下物による危害を防止するため、地上からの高さが5 mの位置に防護棚(朝顔)の1段目を設けた。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:6,text:'大規模な土工事及び山留め工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['掘削工事において、ボイリングの発生が予測されたので、地下水を遮断するために止水性のある山留め壁の根入れを難透水層まで延長した。','掘削工事において、盤ぶくれの発生が予測されたので、地下水位を低下させるために掘削底面(難透水層)下の被圧帯水層にディープウェルを差し込んだ。','ソイルセメント壁の施工において、掘削対象土が撹拌不良となりやすいロームを含んでいる地層であったので、入念に原位置土とセメント系懸濁液との撹拌を行った。','山留め支保工の架設において、切張りに設置する盤圧計については、その軸力を正しく計測するために、両側の腹起しから最も離れた位置として、切張り支点間の中央に設置した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:7,text:'地業工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['場所打ちコンクリート杭工事において、安定液中に打ち込む杭に使用するコンクリートの単位セメント量については、310 kg/m³とした。','場所打ちコンクリート杭工事において、余盛り部分を所定の位置まではつり処理を行う計画であったので、処理の時期をコンクリート打込み後14日経過した後とした。','セメントミルク工法による既製コンクリート杭工事において、根固め液及び杭周固定液に使用するセメントについては、地下水に硫酸塩を含む場所であったので、高炉セメントを使用した。','セメントミルク工法による既製コンクリート杭工事において、掘削後のアースオーガーの引き上げについては、掘削時と同様にアースオーガーを正回転させながら行った。'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:8,text:'鉄筋工事におけるガス圧接継手の外観検査の検査項目とその外観形状について、鉄筋の継手の構造方法の規定に照らして、最も不適当なものは、次のうちどれか。ただし、鉄筋の種類はSD345とする。',choices:['検査項目: 圧接面のずれ、外観形状: 鉄筋径25mmに対しずれ6mm','検査項目: 圧接部の膨らみの直径、外観形状: 鉄筋径25mmに対し膨らみ直径35mm','検査項目: 圧接部の膨らみの長さ、外観形状: 鉄筋径25mmに対し膨らみ長さ27mm','検査項目: 鉄筋中心軸の偏心量、外観形状: 鉄筋径25mmに対し偏心量4mm'],answer:3,hasFigure:true,figureDesc:'各選択肢にガス圧接継手の外観形状図が付されている。1: 圧接面のずれ6mm。2: 膨らみ直径35mm。3: 膨らみ長さ27mm。4: 偏心量4mm。いずれも鉄筋径25mm。'},
{year:2020,subject:'施工',no:9,text:'型枠工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['型枠の構造計算を行うに当たり、コンクリートの打込み速さを10 m/h以下、コンクリートの打込み高さを1.5 m以下として計画したので、柱の側圧と壁の側圧とを同じ値とした。','パイプサポートを支柱に用いる型枠支保工については、その高さが3.5 mを超える計画としたので、高さ2.0 mごとに水平つなぎを二方向に設け、かつ、水平つなぎの変位を防止する措置を行った。','パラペットのコンクリートとスラブとを一体に打ち込むに当たり、パラペットの型枠を浮かし型枠とする箇所については、コンクリートの打込み時に型枠が動かないように、外部足場に固定した。','基礎のコンクリートに使用するセメントが普通ポルトランドセメントから高炉セメントB種に変更となったので、コンクリートの材齢によるせき板の最小存置期間を普通ポルトランドセメントの場合より長く設定した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:10,text:'レディーミクストコンクリートの受入れ時の検査について、表のA～Cの圧縮強度試験の結果に対する調合管理強度の判定に関する次の記述のうち、最も適当なものはどれか。ただし、コンクリートの調合管理強度は30 N/mm²とし、1回の試験には任意の1台の運搬車から採取したコンクリート試料で作製した3個の供試体を用いるものとする。',choices:['Aは「合格」、B及びCは「不合格」と判定する。','A及びBは「合格」、Cは「不合格」と判定する。','A及びCは「合格」、Bは「不合格」と判定する。','A、B及びCを「合格」と判定する。'],answer:2,hasFigure:true,figureDesc:'表: A(1回目33.0, 2回目34.5, 3回目31.5, 総平均33.0)、B(1回目26.5, 2回目33.0, 3回目32.0, 総平均30.5)、C(1回目28.0, 2回目30.0, 3回目30.5, 総平均29.5)。単位N/mm²。'},
{year:2020,subject:'施工',no:11,text:'コンクリート工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['高炉セメントB種を使用したコンクリートの調合管理強度について、特記がなく、コンクリートの打込みから材齢28日までの期間の予想平均気温が8～10℃であったので、構造体強度補正値を3 N/mm²とした。','高強度コンクリートの自己収縮を抑制するために、所要のワーカビリティーが得られる範囲で、高性能AE減水剤の使用量を増やして単位水量を小さくしたうえで、単位セメント量をできるだけ小さくした。','マスコンクリートの表面ひび割れの低減のため、表面を断熱養生マットで覆うことにより養生した。','柱や壁の型枠へのコンクリートの打込みにおいて、コンクリートが分離しない範囲で、自由落下により打ち込んだ。'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:12,text:'プレキャスト鉄筋コンクリート工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['製造工場におけるプレキャスト部材コンクリートの脱型時の圧縮強度については、プレキャスト部材と同一養生を行った供試体の圧縮強度試験の結果により確認した。','プレキャスト梁部材の長さについては、特記がなかったので、許容差を±10 mmとして製品の寸法精度の管理を行った。','エンクローズ溶接継手によるプレキャスト部材相互の接合において、溶接作業については、建築物の外周部から中央部へ順次行った。','液状シールによるプレキャスト屋根部材の接合部の防水において、液状シールの塗布幅については、目地幅端部より両端とも60 mm以上とした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:13,text:'鉄骨工事の次の記述のうち、監理者が行った行為として、最も不適当なものはどれか。',choices:['スタッド溶接完了後、1ロットにつき1本を抜き取って行った打撃曲げ試験の結果が不合格となったロットにおいて、当該ロットからさらに2本のスタッドを試験し2本とも合格したものについては、当該ロットが合格となっていることを確認した。','工作図において、鉄筋貫通孔の孔径についての特記がなかったので、異形鉄筋D25の孔径の最大値が38 mmとなっていることを確認した。','トルシア形高力ボルトの締付け後の検査において、ナット回転量が群の平均値から算出した許容範囲から過小と判定されたものについては、その範囲に入るように追締めが行われていることを確認した。','ロックウール吹付け工法による耐火被覆において、柱の耐火材の吹付け厚さについては、厚さ確認ピンが柱の1面に各1箇所以上差し込まれていることを確認した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:14,text:'鉄骨工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['受入検査において、完全溶込み溶接部の超音波探傷検査については、特記がなかったので、抜取検査により実施した。','鉄骨の建方精度の管理において、特記がなかったので、柱の各節の倒れの管理許容差を、節の高さの1/700以下、かつ、20 mm以下とした。','建方作業において、溶接継手におけるエレクションピースに使用する仮ボルトは、高力ボルトを使用して全数締め付けた。','溶接作業において、作業場所の気温が－2℃であったので、溶接線より両側約100 mmの範囲の母材部分を加熱して溶接した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:15,text:'木工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['鉄筋コンクリート造の建築物の内部工事において、間仕切軸組として使用する木材の樹種については、特記がなかったので、杉とした。','鉄筋コンクリート造の建築物の内部工事において、造作材に使用する木材の含水率については、特記がなかったので、工事現場搬入時に高周波水分計により測定した含水率が15％以下であることを確認した。','木造軸組工法において、筋かいが間柱と取り合う部分については、間柱を筋かいの厚さだけ欠き取って筋かいを通した。','木造軸組工法において、基礎と土台とを緊結するアンカーボルトについては、耐力壁の両端の柱の下部付近及び土台継手の下木の端部付近に設置した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:16,text:'防水工事の次の記述のうち、監理者が行った行為として、最も不適当なものはどれか。',choices:['屋内防水密着工法によるアスファルト防水工事において、平場の鉄筋コンクリートの打継ぎ部については、幅50 mm程度の絶縁用テープを張り付けた後、幅300 mm程度のストレッチルーフィングの増張りが行われていることを確認した。','接着工法による合成高分子系シート防水工事において、加硫ゴム系シートの接合幅(重ね幅)については、平場部、立上り面ともに100 mmとなっていることを確認した。','陸屋根のステンレスシート防水工事において、部分吊子とした吊子の固定間隔(はぜ方向)については、一般部600 mm、端部450 mm、隅角部300 mmとなっていることを確認した。','シーリング工事において、ノンワーキングジョイントの鉄筋コンクリート造の外壁の収縮目地については、三面接着となっていることを確認した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:17,text:'左官工事、タイル工事及び石工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['鉄筋コンクリート造の外壁へのモルタル塗りにおいて、下塗りとしてポリマーセメントを調合したモルタルを塗り付ける際の1回の塗厚については、7 mmとなるようにした。','セメントモルタルによるタイル後張り工法における密着張りにおいて、張付けモルタルの1回の塗付け面積の限度については、2 m²/人以下とし、かつ、60分以内に張り終える面積とした。','モルタル下地への有機系接着剤によるタイル後張り工法において、外壁のタイル張りの施工の前に下地面の清掃を行い、下地面を十分に乾燥させた。','外壁乾式工法による鉛直面への石工事において、上下の石材間の目地幅の調整に使用したスペーサーを撤去した後に、シーリング材を充填した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:18,text:'ガラス工事及び金属工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['ガラス工事において、グレイジングチャンネル構法によりサッシにガラスをはめ込んだので、セッティングブロックを使用しなかった。','化粧せっこうボード張りの軽量鉄骨天井下地において、吊りボルトの間隔については900 mm程度とし、天井の周辺部の吊りボルトについては端から200 mmの位置に配置した。','軽量鉄骨壁下地のスペーサーについては、スタッドの両端及び振れ止めの位置を押さえ、間隔600 mm程度に取り付けた。','鋼製の手摺の取付けに当たって、手摺の支柱については、コンクリート及びモルタルの中に入る部分であっても、錆止めの処置を行った。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:19,text:'内外装工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['ビニル床シート張りにおける床シートの目地処理については、特記がなかったので、熱溶接工法とし、ビニル床シート張付け後、接着剤が硬化した状態を見計らって行った。','縦壁ロッキング構法によるALCパネル工事において、外壁の縦壁と連続するパラペット部分については、その外壁のALCパネルの厚さの6倍の長さをはね出して使用した。','吹付け硬質ウレタンフォームによる断熱材現場発泡工法において、吹付け厚さの許容誤差については、±10 mmとした。','カーテンウォール工事において、プレキャストコンクリートカーテンウォール部材の取付け位置における目地の幅の寸法許容差については、特記がなかったので、±5 mmとした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:20,text:'鉄筋コンクリート造の建築物の設備工事に関する次の記述のうち、監理者が行った行為として、最も不適当なものはどれか。',choices:['雑用水管については、誤接続がないことを確認するために、衛生器具等の取付完了後、系統ごとに着色水を用いた通水試験が行われたことを確認した。','機械室が屋上階にある乗用エレベーターの地震感知器については、P波感知器が機械室に、S波感知器が昇降路底部に、設置されていることを確認した。','電池内蔵形の非常用の照明装置における照度測定については、外光の影響を受けない状況下において、内蔵電池への切替え後に行われたことを確認した。','接地工事において、接地極の埋設については掘削部理戻し前に、接地線の構造体への接続については、コンクリート打設前に、立会い確認を行った。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:21,text:'設備工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['機械設備工事におけるスリーブについては、保温材の厚さを含んだ管の外径よりも40 mm大きい径のものとした。','鉄筋コンクリートの躯体に埋設する合成樹脂製可とう電線管については、PF管を使用した。','建築物内部の同一のコンクリートピット内に高圧ケーブルと低圧ケーブルとを配線するに当たり、それらの間に耐火性のある堅牢な隔壁を設けたので、高圧ケーブルと低圧ケーブルとの間の離隔距離については、特に配慮しなかった。','呼び径80の一般配管用ステンレス鋼鋼管を用いた給水管の横走り配管については、吊り金物による支持間隔を3.0 mとした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:22,text:'鉄筋コンクリート造の建築物の耐震改修工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['鋼板巻き工法による柱補強工事において、鋼板の形状を角形としたので、コーナー部分の曲げ加工の内法半径については、鋼板の板厚の2.5倍とした。','枠付き鉄骨ブレースの設置工事において、既存の柱や梁に施す目荒しについては、電動ピックを用いて、平均深さで2～5 mm程度の凹面を、その合計の面積が打継ぎ面の20％程度の面積となるように全体にわたって付けた。','耐震壁を増設する工事において、コンクリートの打込みを圧入工法で行うに当たり、型枠上部に設けたオーバーフロー管の流出先の高さについては、既存梁の下端から10 cm高い位置とした。','既存壁の開口部を閉塞して耐震壁とする工事において、開口部周囲のはつり出した壁筋と新設の壁筋との継手については、無理に台直しを行わず、0.2 L(L：重ね継手の長さ)以下、かつ、150 mm以下の隙間を開けた「あき重ね継手」とした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:23,text:'鉄筋コンクリート造の建築物の各種改修工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['既存保護層を撤去し、既存アスファルト防水層を残して行う防水改修工事において、既存アスファルト防水層の継目等の剥離箇所及び浮き部分については、切開し、バーナーで熱した後、溶融アスファルトを充填し、張り合わせた。','防水改修工事において、防水層撤去後の新設防水層の下地となる既存コンクリート面の欠損部については、ポリマーセメントモルタルにより平滑に補修した。','タイル張り仕上げ外壁で、構造体コンクリートと下地モルタルとの間に浮きが発生している箇所を、アンカーピンニング部分エポキシ樹脂注入工法により固定する工事において、アンカーピン固定部の穿孔については、タイルの目地部分に構造体コンクリート中に30 mmの深さに達するまで行った。','コンクリート打放し仕上げ外壁の改修工事において、ひび割れ幅が0.2 mmから1.0 mmの間に分布していたので、ひび割れ部改修工法としてシール工法を採用した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:24,text:'建築工事に関する用語とその説明との組合せとして、最も不適当なものは、次のうちどれか。',choices:['CLT ── 切削機械により切削した単板を、主としてその繊維方向を互いにほぼ平行にして積層接着した木質材料','粉体塗装 ── アルミニウム建材等に使用される塗装方法で、溶剤などの溶媒を含まず、VOC(揮発性有機化合物)の低減が図れる粉体塗料を用いて塗膜を形成させる塗装方法','ミルシート ── 製鋼所で発行する鋼材の化学成分、機械的性質などが記されている試験成績書で、その材料がJIS等に適合していることを保証する規格品証明書','溶接ゲージ ── 隅肉溶接ののど厚、脚長やビード幅、アンダーカット深度等を測定する器具'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'施工',no:25,text:'建築物の工事請負契約又は監理業務委託契約に関する次の記述のうち、民間(旧四会)連合協定「工事請負契約約款」(平成29年12月改正)又は四会連合協定「建築設計・監理等業務委託契約約款」(平成27年2月改正)に照らして、最も不適当なものはどれか。',choices:['工事請負契約において、受注者は、この契約を締結した後すみやかに請負代金内訳書及び工程表を監理者に提出し、工程表については監理者の承認を受ける。','工事請負契約において、受注者が定める現場代理人は、当該工事現場における施工の技術上の管理をつかさどる監理技術者と兼務することができる。','監理業務委託契約において、受託者は、委託者の承諾を得て監理業務の一部について、他の建築士事務所の開設者に委託した場合、委託者に対し、当該他の建築士事務所の開設者の受託に基づく行為全てについて責任を負う。','監理業務委託契約において、監理業務を原設計者と異なる建築士に委託したとき、委託者は、監理業務の段階において、設計成果物について変更の必要が生じた場合、原則として、設計変更業務を原設計者に別途委託しなければならない。'],answer:1,hasFigure:false,figureDesc:''}
,
{year:2019,subject:'計画',no:1,text:'建築及び都市の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['ソシオペタルは、複数の人間が集まったときに、異なる方向に身体を向けて他人同士でいようとするような位置関係をいう。','ユニバーサルデザインは、全ての人を対象としたものであり、障がいの有無、年齢や体型の違い、身体機能の差等に関係なく、可能な限り誰もが利用できるデザインをいう。','パッシブデザインは、建築物自体の配置・形状、窓の大きさ等を工夫することにより、建築物内外に生じる熱や空気や光等の流れを制御し、暖房・冷房・照明効果等を積極的に得る手法をいう。','スマートシティは、広義では、都市が抱える諸課題に対して、情報通信技術等を活用しつつ、マネジメント（計画、整備、管理・運営等）が行われ、全体の最適化が図られる持続可能な都市又は地区をいう。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'計画',no:2,text:'神社建築に関する次の記述のうち、最も不適当なものはどれか。',choices:['伊勢神宮内宮正殿（三重県）は、柱は全て掘立て柱で、2本の棟持柱をもつ、神明造りの例である。','出雲大社本殿（島根県）は、桁行2間、梁間2間の平面をもち、正面の片方の柱間を入口とした左右非対称の形式をもつ、大社造りの例である。','賀茂別雷神社本殿・権殿（京都府）は、切妻造り、平入りの形式をもち、前面の屋根を延長して向拝を設けた、流造りの例である。','春日大社本殿（奈良県）は、本殿と拝殿との間を石の間でつないだ、権現造りの例である。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'計画',no:3,text:'歴史的な建築物に関する次の記述のうち、最も不適当なものはどれか。',choices:['サン・ピエトロ大聖堂（ヴァチカン）は、身廊部と袖廊部がともに三廊式であり、内陣には周歩廊と放射状に並ぶ複数の祭室とをもつゴシック建築である。','アーヘンの宮廷礼拝堂（ドイツ）は、平面が八角形の身廊とそれを囲む十六角形の周歩廊があり、身廊の上部にはドーム状のヴォールトをもつ集中式の建築物である。','サン・カルロ・アッレ・クァットロ・フォンターネ聖堂（イタリア）は、楕円形のドームと、凹凸の湾曲面や曲線が使用されたファサードをもつバロック建築である。','コルドバの大モスク（スペイン）は、紅白縞文様の2段のアーチを伴って林立する柱による内部空間をもち、現在はキリスト教文化とイスラム教文化とが混在している建築物である。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'計画',no:4,text:'建築物の各部に関する次の記述のうち、最も不適当なものはどれか。',choices:['特定天井に関する設計ルートのうち、仕様ルートの一つとして、天井面と周囲の壁等との間にクリアランスを設けない「隙間なし天井」がある。','Low-E複層ガラスは、中空層側のガラス面に特殊金属膜をコーティングしたものであり、室内の冷暖房効率を高めることができる。','連窓を層間変位の大きな建築物に設ける場合、地震時の安全性を向上させるために、ガラスがサッシ枠内で回転・移動しても力が加わらないように、枠とガラスとの間にクリアランスを設ける必要がある。','カーテンウォールのオープンジョイント方式の水密性能について、雨水の浸入を防止するためには、等圧空間の容量を、空気取入口に比べて大きくする必要がある。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'計画',no:5,text:'防犯計画等に関する次の記述のうち、最も不適当なものはどれか。',choices:['事務所の計画において、公道から敷地内や建築物内、事務室等への動線は、セキュリティレベルの低いほうから高いほうへ連続させることが望ましい。','小学校の計画において、不審者の侵入防止等に配慮して、職員室は運動場や出入口を見渡すことのできる位置に配置することが望ましい。','住宅地の計画において、ラドバーン方式は、心理的効果を考慮した設計によって、犯罪抑止効果を高める手法である。','ゲーテッド・コミュニティは、住宅地をフェンスや壁等で囲い、出入口にゲートを設けて、住民以外の人や車両の出入りを制限した居住地区である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'計画',no:6,text:'環境に配慮した建築物の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['越屋根は、切妻屋根等の棟の一部に設けられた小屋根又はその下の開口部を含めた部分をいい、当該開口部から自然換気や採光が期待できる。','コンクリート躯体を蓄熱体として利用するためには、「外断熱とすること」、「開口部からの日射を直接コンクリート躯体に当てること」、「コンクリート躯体を直接室内に露出させること」等が有効である。','クールスポットは、外気温度が建築物内の温度以下となる夜間を中心に、外気を室内に導入することによって躯体を冷却する方法であり、冷房開始時の負荷を低減し、省エネルギー化を図ることができる。','アースチューブは、地中に埋設したチューブに空気を送り込み、夏期には冷熱源、冬期には温熱源として利用する方式であり、一般に、外気温度の年較差又は日較差が大きい地域ほど熱交換効果が大きい。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'計画',no:7,text:'建築物の各部の寸法等に関する次の記述のうち、最も不適当なものはどれか。',choices:['地下階に駐車場を設ける大規模店舗において、売場のレイアウトと駐車場の駐車台数の効率を考慮して、柱割りを8.5m×8.5mとした。','高層事務所ビルのエレベーターの計画において、低層用5台と高層用5台とを幅4mの通路を挟んで対面配置とした。','図書館の開架閲覧室における複式（両面使用型）書架の中央支柱の心々距離については、車椅子使用者同士がすれ違うことができるように、250cmとした。','普通乗用車を駐車させる屋内駐車場の計画において、1台当たりの所要面積をなるべく少なくするため、直角駐車とした。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'計画',no:8,text:'公立小学校・中学校の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['既存の中学校の校舎を小中一貫教育を行う義務教育学校に変更する計画に当たり、階段に、手摺、滑止め等の安全上の措置を講じることにより、蹴上げの高さを変更しなかった。','中学校の計画に当たり、各教科で専用の教室をもち、生徒が時間割に従って教室を移動して授業を受ける総合教室型とした。','普通教室（40人）の広さは、多様な学習形態に対応する机、家具等の配置が可能な面積、形状を考慮し、9m×8mとした。','特別の支援を必要とする児童が通常の学級に在籍する場合を想定し、その児童が落着きを取り戻すことのできる小規模な空間を、普通教室に隣接して設けた。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'計画',no:9,text:'高齢者、障害者等の利用に配慮した建築物の計画に関する次の記述のうち、「高齢者、障害者等の円滑な移動等に配慮した建築設計標準（国土交通省）」に照らして、最も不適当なものはどれか。',choices:['公民館の便所において、車椅子使用者用便房における便器洗浄ボタンは、ペーパーホルダーの直上に設置した。','博物館の便所の計画において、乳幼児用おむつ交換台等の乳幼児連れ利用者に配慮した設備は、利用者の分散を図る観点から多機能便房に設けることは避け、男性用及び女性用の便所内にそれぞれ設けた。','ホテルのエレベーターにおいて、エレベーターの籠内の階数ボタン等の点字表示は、ボタンが縦配列であったので、それぞれのボタンの右側に設けた。','庁舎の避難設備・施設の計画において、利用者が安全に救助を待つための一時待避スペースを階段室内に設け、待避した際に助けを求めたり状況を伝えたりするためのインターホンを設置した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'計画',no:10,text:'都市の再生、まちづくり等に関する次の記述のうち、最も不適当なものはどれか。',choices:['インナーシティ問題は、都市の中心とその周辺の市街地における人口の減少と産業の衰退、地域の荒廃等のことである。','ブラウンフィールドは、土壌汚染の存在、あるいはその懸念から、本来、その土地が有する潜在的な価値よりも著しく低い利用あるいは未利用となった土地をいう。','二地域居住は、都市住民が農山漁村等の地域にも同時に生活拠点をもつこと等をいう。','パークアンドライドシステムは、中心市街地をバリアフリー化して車椅子や電動スクーター等を貸し出し、歩行困難者の外出の機会の拡大だけでなく、市街地の活性化を促す仕組みの一つである。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'計画',no:11,text:'都市の再生に関する次の記述のうち、最も不適当なものはどれか。',choices:['ハイライン（ニューヨーク）は、廃線になった貨物専用の高架線跡を再利用し、緑豊かな展望公園へと再生させたものである。','ドックランズ再開発計画（ロンドン）は、大規模な区画の整理によって街区を撤去し、中央部を遊歩道とする広場をつくり出したプロジェクトである。','ポツダム広場再開発計画（ベルリン）は、第二次世界大戦とその後の東西分断により長年更地であった敷地に、複合機能をもたせたプロジェクトである。','門司港レトロ地区（北九州市）は、門司港周辺の歴史的建造物群と関門海峡や門司港の景観を活かした街並みが形成されている地区である。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'計画',no:12,text:'ニュータウン及び集合住宅に関する次の記述のうち、最も不適当なものはどれか。',choices:['ネクサスワールドのレム棟・コールハース棟（福岡県）は、各住戸に採光と通風を確保するためのプライベートな中庭が設けられた計画である。','基町高層アパート（広島県）は、偶数階に通路をもつ住棟を「く」の字型に連結させた計画である。','千里ニュータウン（大阪府）は、近隣住区の単位にはとらわれず、将来のワンセンター方式への移行等が意図された計画である。','港北ニュータウン（神奈川県）は、公園、保存緑地と緑道、歩行者専用道路とを結ぶネットワークをもつ計画である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'計画',no:13,text:'日本における住宅の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['四間取は、土間を除く床上部分を田の字型に4室構成とする、伝統的な農家の平面形式の一つである。','公営住宅標準設計51C型は、住生活の多様化に対応するため、食事室と台所とを分離した計画である。','テラスハウスは、区画された専用庭をもつ住戸を、境界壁を介して連続させた接地型の低層集合住宅である。','コーポラティブハウスは、自ら居住する住宅を建設しようとする者が組合を結成し、共同して事業計画を定め、建築物の設計、工事発注等を行って住宅を取得し、管理していく方式である。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'計画',no:14,text:'劇場に関する次の記述のうち、最も不適当なものはどれか。',choices:['能楽堂は、一般に、「本舞台」、「後座」、「地謡座」及び「橋掛り」から成り立つ舞台と、その舞台を3方向から眺める客席をもつ空間である。','1997年に復元されたロンドンのシェークスピア劇場（グローブ座）は、観客と舞台との一体感を得られやすいプロセニアム形式の劇場である。','搬出入のためのサービスヤードにおいて、ウィング式の大型トラックが停車するスペースの、床から天井までの高さは5m以上とすることが望ましい。','車椅子使用者用の客席は、車椅子使用者が選択できるように、2箇所以上の異なる位置に分散して設けることが望ましい。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'計画',no:15,text:'木材を活用した建築物に関する次の記述のうち、最も不適当なものはどれか。',choices:['住田町役場（岩手県）は、凸レンズ状に組まれたトラス梁が並んだ屋根架構をもつ建築物である。','群馬県農業技術センター（群馬県）は、小断面の製材を格子状に組み合わせた屋根架構をもつ建築物である。','海の博物館展示棟（三重県）は、主要構造部の柱や梁には、鋼材を内蔵した集成材を使用し、外壁にはガラスカーテンウォールと木製ルーバーを使用した建築物である。','出雲ドーム（島根県）は、集成材とケーブル等で構成された立体張弦アーチと、膜屋根を組み合わせた架構をもつ建築物である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'計画',no:16,text:'病院に関する次の記述のうち、最も不適当なものはどれか。',choices:['病院は、医業又は歯科医業を行う場所であり、20人以上の患者を入院させるための施設を有するものである。','療養病床における1病室当たりの病床数は、4床以下とする。','1看護単位当たりの病床数は、80床を標準とする。','療養病床における患者の利用する廊下の幅は、医療法に基づき、片側に病室がある場合、内法による測定で1.8m以上とする。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'計画',no:17,text:'美術館（設計者）に関する次の記述のうち、最も不適当なものはどれか。',choices:['ニューヨーク近代美術館（谷口吉生）は、敷地の北側と南側に通抜けが可能なエントランスホールがあり、中庭と連続する空間となっている。','ロサンゼルス現代美術館（磯崎新）は、赤砂岩の外壁をもつ基壇部があり、その基壇部の上にピラミッド型のトップライト等が配置されている。','フォートワース現代美術館（安藤忠雄）は、平行に並べられた長方形の室によって展示室が構成され、その展示室には日差しへの配慮から深い庇が掛けられている。','アスペン美術館（坂茂）は、建築物の中央部にアトリウムがあり、アトリウムに面した螺旋状のスロープによって、最上階から地上階まで連続した空間となるように計画されている。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'計画',no:18,text:'建築物の設計・工事監理等に関する次の記述のうち、最も不適当なものはどれか。',choices:['四会連合協定「建築設計・監理等業務委託契約約款」における建築設計業務委託契約において、委託者は、必要があると認めるときは、受託者に書面をもって通知して、設計業務の全部又は一部の中止を請求することができる。','四会連合協定「建築設計・監理等業務委託契約約款」における建築設計業務委託契約において、受託者は、委託者の承諾なく、成果物、未完了の成果物及び設計業務を行ううえで得られた記録等を他人に閲覧させ、複写させ、又は譲渡してはならない。','建築士法に定められた、設計又は工事監理の契約を締結する際に行う重要事項（業務の内容及びその履行に関する事項）の説明等は、管理建築士以外の建築士が行ってはならない。','工事監理業務においては、一般に、民法における「善良な管理者の注意義務（善管注意義務）」が求められており、この義務を怠り損害が生じた場合には、監理業務委託契約書に明記されていなくても過失責任が問われることがある。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'計画',no:19,text:'建築積算に関する次の記述のうち、建築工事建築数量積算研究会「建築数量積算基準」に照らして、最も不適当なものはどれか。',choices:['コンクリートの数量において、窓、出入口等の開口部によるコンクリートの欠如は、建具類等の開口部の内法寸法とコンクリートの厚さとによる体積とし、1箇所当たりの開口部の体積が0.5m³以下の場合は、コンクリートの欠除はないものとする。','型枠の数量において、コンクリートの上面が傾斜している場合、その勾配が3/10を超えるものについては、その部分の上面型枠又はコンクリートの上面の処理を計測・計算の対象とする。','鉄骨の溶接の数量において、原則として、溶接の種類に区分し、溶接断面形状ごとに長さを求め、すみ肉溶接脚長6mmに換算した延べ長さとする。','全面がガラスである建具類のガラスの数量において、かまち、方立、桟等の見付幅が0.1mを超えるものがあるときは、その面積を差し引いた面積とする。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'計画',no:20,text:'建築のマネジメント等に関する次の記述のうち、最も不適当なものはどれか。',choices:['公共工事におけるECI方式は、設計段階の技術協力の実施期間中に、施工の数量・仕様を確定したうえで工事契約をする方式であり、施工性等の観点から施工者の提案が行われることにより、施工段階における設計変更の発生リスクの減少等が期待できる。','建築物におけるコミッショニングは、一般に、環境・エネルギー性能等の観点から建築物のオーナーやユーザーが求める要求性能を把握して、その要求性能の実現を検証することである。','BCPは、企業が災害や事故で被害を受けても、重要な業務が中断しないこと、中断しても可能な限り短い期間で再開すること等、事業の継続を追求するための計画である。','CRE戦略は、国や地方公共団体の事業コストの削減や、より質の高い公共サービスの提供を目的として、民間の資金、経営能力及び技術的能力を活用して公共施設等の設計、建設、維持管理及び運営を行う手法である。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'環境・設備',no:1,text:'環境工学における用語に関する次の記述のうち、最も不適当なものはどれか。',choices:['等価騒音レベルは、聴感補正された音圧レベルのエネルギー平均値であり、一般に、変動する騒音の評価に用いられる。','プルキンエ現象は、視感度の相違によって、明所視に比べ暗所視において、赤が明るく、青が暗く見える現象である。','空気齢は、流入口から室内に入った所定量の空気が、室内のある地点に到達するまでに経過する平均時間である。','作用温度（OT）は、一般に、発汗の影響が小さい環境下における熱環境に関する指標として用いられ、空気温度と平均放射温度の重み付け平均で表される。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'環境・設備',no:2,text:'容積が100m³の室において、室内の水蒸気発生量が0.6kg/h、換気回数が1.0回/hのとき、十分に時間が経過した後の室内空気の重量絶対湿度として、最も適当なものは、次のうちどれか。ただし、室内の水蒸気は室全体に一様に拡散するものとし、外気の重量絶対湿度を0.010kg/kg(DA)、空気の密度を1.2kg/m³とする。なお、乾燥空気1kgを1kg(DA)と表す。',choices:['0.005 kg/kg(DA)','0.010 kg/kg(DA)','0.015 kg/kg(DA)','0.020 kg/kg(DA)'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'環境・設備',no:3,text:'外気温度5℃、無風の条件の下で、図のような上下に開口部を有する断面の建築物A・B・Cがある。室内温度がいずれも18℃に保たれ、上下各々の開口面積がそれぞれ0.4m²、0.6m²、0.7m²、開口部の中心間の距離がそれぞれ4m、2m、1mであるとき、建築物A・B・Cの換気量Q_A・Q_B・Q_Cの大小関係として、正しいものは、次のうちどれか。ただし、いずれの開口部も流量係数は一定とし、中性帯は開口部の中心間の中央に位置するものとする。なお、√2≒1.4として計算するものとする。',choices:['Q_A > Q_B > Q_C','Q_B > Q_A > Q_C','Q_B > Q_C > Q_A','Q_C > Q_B > Q_A'],answer:2,hasFigure:true,figureDesc:'建築物A・B・Cの断面図。建築物A：開口面積は上下各々0.4m²、開口部の中心間の距離4m。建築物B：開口面積は上下各々0.6m²、開口部の中心間の距離2m。建築物C：開口面積は上下各々0.7m²、開口部の中心間の距離1m。'},
{year:2019,subject:'環境・設備',no:4,text:'建築物の伝熱に関する次の記述のうち、最も不適当なものはどれか。',choices:['外壁において、熱橋部分の室内側表面温度は、一般に、熱橋部分以外の部分の室内側表面温度に比べて、外気温度に近くなる。','複層ガラスの中空層が完全な真空であると仮定すると、複層ガラスの熱貫流率は、0（ゼロ）となる。','壁体内の密閉された中空層の熱抵抗は、中空層の厚さが100mmを超えるとほとんど変化しない。','外壁面の外気側における総合熱伝達率は、外壁面が外気温度に等しい黒体で覆われていると仮定し、日射や夜間放射の影響がないものとみなした値である。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'環境・設備',no:5,text:'建築物における防火・防災に関する次の記述のうち、最も不適当なものはどれか。',choices:['縦長の窓は、横長の窓に比べて噴出する火炎が外壁から離れにくいことから、上階への延焼の危険性が高い。','病院の手術室、ICU、NICU等は、籠城区画として計画することが望ましい。','不特定多数の者が利用する大規模量販店等において、売場の避難出口の扉は、廊下等の有効幅員に配慮しつつ、外開きにすることが望ましい。','避難時に利用する階段室への出入口の有効幅員は、一般に、流動係数を考慮し、階段の有効幅員よりも狭くする。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'環境・設備',no:6,text:'日照・日射に関する次の記述のうち、最も不適当なものはどれか。',choices:['窓面における日照・日射の調整のために設けるルーバーは、一般に、南向き窓面には水平のものが、西向き窓面には垂直のものが有効である。','北緯35度のある地点における春分・秋分の日の終日日射量は、終日快晴の場合、どの向きの鉛直面よりも水平面のほうが大きい。','直射日光の色温度は、正午頃より日没前頃のほうが高い。','ライトシェルフは、その上面で反射した昼光を室内の奥に導くことから、室内照度の均斉度を高めることができる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'環境・設備',no:7,text:'図のような点光源に照らされた水平な受照面上の点Pにおいて、I（点光源の光度）、r（点光源から点Pまでの距離）、θ（点光源から点Pへの入射角）及び点Pにおける水平面照度の組合せとして、最も不適当なものは、次のうちどれか。ただし、点光源の配光特性は一様なものとする。',choices:['I=100cd, r=2m, θ=0度, 水平面照度=25lx','I=100cd, r=1m, θ=60度, 水平面照度=50lx','I=25cd, r=0.5m, θ=0度, 水平面照度=100lx','I=50cd, r=0.5m, θ=60度, 水平面照度=200lx'],answer:4,hasFigure:true,figureDesc:'点光源（光度I）から受照面上の点Pへの照射を示す図。点光源から点Pまでの距離r、入射角θが示されている。受照面は水平面。選択肢は表形式で、I（単位：cd）、r（単位：m）、θ（単位：度）、点Pにおける水平面照度（単位：lx）の組合せが4つ示されている。'},
{year:2019,subject:'環境・設備',no:8,text:'色彩に関する次の記述のうち、最も不適当なものはどれか。',choices:['減法混色の三原色は、一般に、シアン、マゼンタ及びイエローである。','同化現象は、囲まれた色や挟まれた色が周囲の色に近づいて見えることをいう。','JISの物体色の色名における有彩色の系統色名は、基本色名に「明度に関する修飾語」、「彩度に関する修飾語」及び「色相に関する修飾語」の3種類の語を付記して色を表示する。','照度と色温度の関係において、一般に、低照度では色温度の低い光色が好まれ、高照度では色温度の高い光色が好まれる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'環境・設備',no:9,text:'音響に関する次の記述のうち、最も不適当なものはどれか。',choices:['聴覚のマスキングは、マスカー（マスクする音）の周波数に近い音ほどマスクされやすく、マスカーの周波数に比べ、低い音のほうが高い音よりもマスクされやすい。','カラレーションは、「直接音」と「短い遅れ時間の反射音」の干渉によって、音色の変化等が知覚される現象をいう。','室容積が同じ場合であっても、一般に、西洋音楽のためのコンサートホールとオペラハウスとでは、最適残響時間が異なる。','学校の普通教室においては、平均吸音率が0.2程度となるように、吸音対策を施すことが望ましい。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'環境・設備',no:10,text:'吸音・遮音に関する次の記述のうち、最も不適当なものはどれか。',choices:['孔あき板と剛壁との間に空気層を設けた吸音構造の固有周波数は、空気層の厚みを大きくすると低周波数域に移動する。','駅、空港、ショッピングモール等の公共施設においては、放送音声の聞こえやすさを確保するため、一般に、吸音処理を避けることが望ましい。','乾式二重床を採用する場合は、床板とスラブとの間の空気層をバネとする共振系が形成されることから、低周波数域において床衝撃音の遮断性能が低下することがある。','壁の音響透過損失を10dB増加させるためには、壁の音響透過率を現状の1/10にする必要がある。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'環境・設備',no:11,text:'空気調和設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['ペリメーターレス化は、ペリメーターゾーンにおける熱負荷を、建築的手法と設備的手法とを組み合わせて可能な限り減少させ、ペリメーターゾーンをインテリアゾーンに近い温熱環境とすることである。','熱負荷に応じて送風量を調整する変風量（VAV）方式は、VAVユニットを部屋ごと又はゾーンごとに配置することから、個別の温度制御が可能である。','外気冷房は、外気のエンタルピーが室内空気のエンタルピーよりも高い場合に、それらのエネルギーの差を冷房に利用するものである。','ダブルスキンは、外壁の一部又は全てをガラスの二重構造とし、その中間の空気の換気等による熱負荷低減、及び室内の窓際の環境改善を図ったものである。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'環境・設備',no:12,text:'空気調和・換気設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['シックハウス対策のための居室の換気を機械換気方式で行う場合、必要有効換気量を求める際の換気回数は、当該居室の天井の高さによっては、その天井の高さの区分に応じて低減することができる。','半導体や液晶を製造する工場のクリーンルームにおいては、一般に、清浄度を保つために周囲の空間に対して正圧となるように制御を行い、塵埃の流入を防止する。','空調機のウォーミングアップ制御は、一般に、外気ダンパーを全閉にするとともに還気ダンパーを全開にする制御等を行い、空調の立ち上がり時間を短縮する方法である。','中央熱源空調方式は、在館者それぞれの要望に対応することができないことから、パーソナル空調方式としては採用されない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'環境・設備',no:13,text:'空気調和・換気設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['長方形ダクトの断面のアスペクト比を、6：1とした。','セントラルダクト方式を採用した高層建築物において、低圧ダクトではダクトスペースが建築面積に対して大きな割合となることから、高圧ダクトとした。','天井から下向きに軸流吹出し口を設置する事務室の計画に当たり、居住域の上面における風速が0.5m/s以下となるようにした。','水蓄熱槽の性能を十分に発揮させるために、槽内の高温水と低温水とを可能な限り分離させた。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'環境・設備',no:14,text:'給水設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['水道直結直圧方式は、水道本管の圧力を利用して建築物内の必要箇所に給水する方式であり、一般に、3階建て以下の建築物で小規模なものに適用することができる。','高置水槽方式は、水道本管からの水を受水槽へ貯水した後に、屋上等に設置した高置水槽へ揚水し、そこから重力を利用して建築物内の必要箇所に給水する方式であり、一般に、大規模な建築物にも適用することができる。','水道直結増圧方式は、水道本管の圧力に加えて増圧ポンプによって建築物内の必要箇所に給水する方式であり、一般に、水道本管への逆流について考慮する必要はない。','ポンプ直送方式は、水道本管からの水を受水槽へ貯水した後に、給水ポンプによって建築物内の必要箇所に給水する方式であり、一般に、建築物が停電した際は給水することができない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'環境・設備',no:15,text:'給排水衛生設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['災害応急対策活動に必要な医療施設において、地震災害時に使用できる水を確保するために、受水槽に地震の感知により作動する緊急給水遮断弁を設けた。','雨水排水管と汚水排水管とを別系統で配管した建築物において、公共下水道が合流式であったことから、雨水排水と汚水排水とを屋外の排水ますで同一系統とした。','循環式の中央式給湯設備において、レジオネラ属菌の繁殖を防ぐために、貯湯槽内の湯の温度を60℃以上に保つこととした。','伸頂通気方式の排水通気配管において、通気流速を高めるために、伸頂通気管の管径を排水立て管の管径よりも1サイズ小さいものとした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'環境・設備',no:16,text:'電気設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['電圧の種別において、交流で600V以下のものは、低圧に区分される。','力率は、交流回路に電力を供給する際の「皮相電力（電圧と電流との積）」に対する「有効電力」の比率である。','幹線に使用する配線方式において、バスダクト方式は、負荷の増設に対応しにくいことから、小容量の電力供給に限られている。','無停電電源装置（UPS）は、整流器、蓄電池、インバータ等により構成され、瞬間的な電圧降下時や停電時においても安定した電力供給を維持するためのものである。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'環境・設備',no:17,text:'照明設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['病院の手術室及び診察室の照明設備において、事務室に使用する光源に比べて演色性の低い光源を使用した。','住宅のリビングの間接照明において、熱放射が少なく、ランプ交換等のメンテナンス頻度が少ないLEDランプを使用した。','事務室の照明計画において、ランプのサイズが小さく高輝度のLEDランプを使用するに当たり、グレアに配慮して、光源が直接目に入らないようにした。','事務室の照明計画において、ブラインドの自動制御により昼光を利用し、かつ、照度センサーを用いた照明の制御も併せて行うことにより、消費電力が少なくなるようにした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'環境・設備',no:18,text:'防災設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['水噴霧消火設備は、噴霧水による冷却作用と噴霧水が火炎に触れて発生する水蒸気による窒息作用等により、火災の抑制・消火をする固定式の消火設備である。','排煙設備は、専用の設備として設けることが原則であるが、換気設備が排煙設備としての性能を有していることが確認された場合には、兼用が認められることがある。','屋外消火栓設備は、防火対象物の外部に設置され、建築物の1階部分及び2階部分で発生した火災の消火や隣接する建築物への延焼防止を目的としている。','連結送水管は、地下階の火災の際、消火活動を容易にするために、消防ポンプ自動車から送水し、天井又は天井裏の散水ヘッドから放出することにより消火する設備である。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'環境・設備',no:19,text:'建築設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['冷却塔は、冷却水の蒸発による冷却作用を有効に利用するため、建築物の外気取入れ口に近い位置に計画することが望ましい。','リバースリターン方式は、往き管と還り管の流量が等しい循環配管系には適しているが、給湯管と返湯管で流量が大きく異なる場合には適さない。','分流式下水道の区域において、雨水管の敷地境界部には、下水道本管からの害虫等の侵入防止を目的として、雨水トラップを設ける必要がある。','空調用の蓄熱槽の水は、必要な措置が講じられている場合には、消防用水として使用することができる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'環境・設備',no:20,text:'環境・設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['微気候は、一般に、建築物や人体への影響が大きい地表面近くの気候、室内環境における建築部材付近や人体の皮膚付近の気候等をいう。','バスタブ曲線は、グラフの縦軸を故障率、横軸を時間とし、設備の信頼性や保全性の概念を示したものである。','冷凍機に使用される代替冷媒のフロン（HFC）は、オゾン破壊係数は0（ゼロ）であるが、地球温暖化係数が高い温室効果ガスの一種である。','CASBEEの評価においては、BEEの値が小さいほど建築物の環境性能が高いと判断される。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:1,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['建築物の周囲において発生する通常の火災による延焼の抑制に一定の効果を発揮するために外壁に必要とされる性能を、「準防火性能」という。','天井面から50cm下方に突出した垂れ壁で、不燃材料で覆われたものは、「防煙壁」に該当する。','電子計算機に対する指令であって、一の結果を得ることができるように組み合わされたものを、「プログラム」という。','木造、地上2階建ての建築物において、土台の過半について行う修繕は、「大規模の修繕」に該当する。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:2,text:'面積、高さ又は階数に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['前面道路の境界線から後退して壁面線の指定がある場合において、特定行政庁の許可を受けて建築物の容積率の算定に当たり当該前面道路の境界線が当該壁面線にあるものとみなす建築物については、当該建築物の敷地のうち前面道路と壁面線との間の部分の面積は、敷地面積又は敷地の部分の面積に算入しない。','前面道路との関係についての建築物の各部分の高さの制限に係る建築物の後退距離の算定の特例の適用を受ける場合、ポーチの高さの算定については、前面道路と敷地との高低差にかかわらず、地盤面からの高さによる。','北側の前面道路又は隣地との関係についての建築物の各部分の高さの最高限度が高度地区に関する都市計画において定められている場合の高さの算定に当たっては、建築物の屋上部分にある階段室で、その水平投影面積の合計が当該建築物の建築面積の1/8であるものについては、その部分の高さは、当該建築物の高さに算入する。','建築物の地下1階(機械室、倉庫及び防災センター(中央管理室)の用途に供する。)で、水平投影面積の合計が当該建築物の建築面積の1/8であるものについては、当該建築物の階数に算入する。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:3,text:'都市計画区域内における次の行為のうち、建築基準法上、確認済証の交付を受ける必要がないものはどれか。ただし、建築等に関する確認済証の交付を受ける必要がない区域の指定はないものとする。',choices:['鉄骨造、延べ面積300m2、平家建ての倉庫の屋根の過半の修繕','共同住宅の新築工事を施工するために設ける鉄骨造、延べ面積200m2、地上2階建ての仮設の工事管理事務所であって、現場以外の場所に設けるものの新築','鉄骨造、延べ面積100m2、高さ5m、平家建ての一戸建ての住宅における、鉄骨造、床面積15m2、平家建ての附属自動車車庫の増築','第一種住居地域内において、鉄筋コンクリート造、延べ面積500m2、地上2階建ての診療所(患者の収容施設があるもの)の、有料老人ホームへの用途変更(大規模の修繕又は大規模の模様替を伴わないもの)'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:4,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['鉄骨造、延べ面積1,000m2、地上3階建ての共同住宅を新築する場合においては、当該建築物の建築主は、検査済証の交付を受ける前においても、指定確認検査機関が安全上、防火上及び避難上支障がないものとして国土交通大臣が定める基準に適合していることを認めたときは、仮に、当該建築物又は建築物の部分を使用し、又は使用させることができる。','延べ面積3,000m2、地上5階建ての事務所の用途に供する建築物(国等の建築物を除く。)で特定行政庁が指定するものの所有者等は、当該建築物の敷地、構造及び建築設備について、定期に、一級建築士若しくは二級建築士又は国土交通大臣から所定の資格者証の交付を受けた者にその状況の調査をさせて、その結果を特定行政庁に報告しなければならない。','延べ面積800m2、地上5階建ての事務所について、ホテルの用途に供する部分の床面積の合計が500m2となる用途の変更に係る確認済証の交付を指定確認検査機関から受けた場合において、建築主は、当該工事が完了したときは、当該指定確認検査機関の検査を申請しなければならない。','延べ面積5,000m2、地上5階建ての百貨店(3階以上の階における百貨店の用途に供する部分の床面積の合計が3,000m2のもの)の大規模の修繕の工事で、避難施設等に関する工事の施工中において、当該建築物を使用する場合においては、当該建築主は、仮使用の認定を受けるとともに、あらかじめ、当該工事の施工中における当該建築物の安全上、防火上又は避難上の措置に関する計画を作成して特定行政庁に届け出なければならない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:5,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['劇場における昇降機機械室用階段の蹴上げの寸法は、23cmとすることができる。','集会場における客用の階段及びその踊場に、高さ85cmの手すりが設けられた場合における階段及びその踊場の幅は、手すりの幅が10cmを限度として、ないものとみなして算定する。','石綿が添加された建築材料が使用されていることにより建築基準法第3条第2項の規定の適用を受けている倉庫について、基準時における延べ面積が1,200m2のものを増築して延べ面積1,500m2とする場合、増築に係る部分以外の部分においては、石綿が添加された建築材料を被覆すること等の措置が必要となる。','近隣商業地域内の住宅(縁側を有しないもの)の開口部である天窓の採光補正係数は、開口部が道に面しない場合であって、水平距離が4m以上であり、かつ、採光関係比率に10を乗じた数値から1.0を減じて得た算定値が1.0未満となる場合においては、1.0とする。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:6,text:'防火区画に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、自動式のスプリンクラー設備等は設けられていないものとする。',choices:['地上15階建ての事務所の15階部分で、当該階の床面積の合計が300m2のものは、原則として、床面積の合計100m2以内ごとに防火区画しなければならない。','1階を自動車車庫(当該用途に供する部分の床面積の合計が130m2)とし、2階及び3階を事務所とする地上3階建ての建築物においては、当該自動車車庫部分と事務所部分とを防火区画しなければならない。','避難階が地上1階であり、地上3階に居室を有する事務所の用途に供する建築物で、主要構造部を準耐火構造としたものにおいては、原則として、地上2階から地上3階に通ずる吹抜きとなっている部分とその他の部分とを防火区画しなければならない。','防火区画に用いる防火シャッター等の特定防火設備は、常時閉鎖若しくは作動をした状態にあるか、又は随時閉鎖若しくは作動をできるものでなければならない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:7,text:'主要構造部を耐火構造とした耐火建築物に関する次の記述のうち、建築基準法に適合しないものはどれか。ただし、自動式のスプリンクラー設備等は設けられていないものとし、居室については、内装の「制限を受ける窓その他の開口部を有しない居室」には該当しないものとする。',choices:['物品販売業を営む店舗の用途に供する建築物の用途を変更し、新たに火を使用する調理室を設けた飲食店とする場合に、その調理室の壁及び天井の室内に面する部分の仕上げを、準不燃材料とした。','延べ面積200m2、地上3階建ての一戸建ての住宅において、1階に設ける火を使用する調理室の壁及び天井の室内に面する部分の仕上げを、不燃材料、準不燃材料及び難燃材料以外の材料とした。','延べ面積10,000m2、高さ60m、地上15階建ての事務所において、非常用エレベーターの乗降ロビーの天井及び壁の室内に面する部分の仕上げを準不燃材料でし、かつ、その下地を準不燃材料で造った。','地階に設ける集会場の客席及びこれから地上に通ずる主たる廊下、階段その他の通路の壁及び天井の室内に面する部分の仕上げを、準不燃材料とした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:8,text:'避難施設等に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、いずれの建築物も各階を当該用途に供するものとし、避難階は地上1階とする。',choices:['主要構造部を耐火構造とした地上3階建て、延べ面積3,000m2の飲食店(主たる用途に供する居室及びこれから地上に通ずる主たる廊下、階段その他の通路の壁及び天井の室内に面する部分の仕上げを準不燃材料としたもの)の避難階においては、階段から屋外への出口の一に至る歩行距離は、40mとすることができる。','地上5階建ての物品販売業を営む店舗(各階の床面積700m2)の避難階においては、屋外への出口の幅の合計を4mとすることができる。','主要構造部を耐火構造とした地上5階建ての共同住宅で、各階の居室の床面積の合計が180m2であるものは、避難階以外の階から避難階又は地上に通ずる2以上の直通階段を設けなくてもよい。','地上5階建ての共同住宅において、2階以上の階にあるバルコニーの周囲には、安全上必要な高さが1.1m以上の手すり壁、さく又は金網を設けなければならない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:9,text:'防火・避難に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['建築物の外部の仕上げに用いる準不燃材料は、通常の火災による火熱が加えられた場合に、加熱開始後10分間、燃焼せず、防火上有害な変形、溶融、き裂その他の損傷を生じないものであって、避難上有害な煙又はガスを発生しないものでなければならない。','主要構造部を耐火構造とした延べ面積5,000m2、地上8階建ての共同住宅の敷地内には、屋外に設ける避難階段から道又は公園、広場その他の空地に通ずる幅員が1.5m以上の通路を設けなければならない。','延べ面積3,000m2、地上5階建てのホテルの客室において、100m2以内ごとに耐火構造とした床、壁及び所定の防火設備で区画されている場合には、排煙設備を設けなくてもよい。','防火地域内における建築物の屋上に設ける高さ2mの看板は、その主要な部分を不燃材料で造り、又はおおわなければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:10,text:'建築設備等に関する次の記述のうち、建築基準法に適合しないものはどれか。',choices:['建築物に設けるエレベーターに、駆動装置又は制御器に故障が生じ、かご及び昇降路の全ての出入口の戸が閉じる前にかごが昇降した場合に自動的にかごを制止する装置を設けた。','管の外径が所定の数値以上である給水管、配電管その他の管が、準耐火構造の防火区画を貫通する際に、これらの管の当該貫通する部分及び貫通する部分からそれぞれ両側に1m以内の距離にある部分を不燃材料で造った。','排煙設備を設置しなければならない居室に設ける排煙設備の排煙口に、手動開放装置及び煙感知器と連動する自動開放装置を設けた。','建築物に設けるエスカレーターで、踏段面の水平投影面積が9m2であるものの踏段の積載荷重を、18kNとした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:11,text:'建築物の構造計算に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['保有水平耐力計算において、高さ20mの鉄骨造の建築物の屋外に面する帳壁については、構造計算によって風圧に対して構造耐力上安全であることを確かめなくてもよい。','許容応力度等計算において、地震力を計算する場合、学校のバルコニーの床の積載荷重については、1,300N/m2に床面積を乗じて計算することができる。','許容応力度等計算において、地下部分に作用する地震力の計算に際して、地震時における建築物の振動の性状を適切に評価して計算することができる場合には、当該計算によることができる。','エキスパンションジョイントその他の相互に応力を伝えない構造方法のみで接している「高さが31mを超える建築物の部分」と「高さが10m以下の建築物の部分」については、それぞれの建築物の部分で必要とされる構造計算の方法を用いることができる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:12,text:'保有水平耐力計算によって安全性が確かめられた建築物に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、高さが4m又は延べ面積が30m2を超える建築物とする。',choices:['鉄筋コンクリート造の建築物に使用するコンクリートの四週圧縮強度は、1mm2につき12N(軽量骨材を使用する場合においては、9N)以上でなければならない。','鉄筋コンクリート造の建築物の構造耐力上主要な部分である柱の主筋は、帯筋と緊結しなければならない。','鉄骨造の建築物の構造耐力上主要な部分の材料は、炭素鋼若しくはステンレス鋼又は鋳鉄としなければならない。','鉄骨造の建築物において、高力ボルト、ボルト又はリベットの相互間の中心距離は、その径の2.5倍以上としなければならない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:13,text:'図のような木造、地上3階建ての住宅(屋根を金属板で葺いたもの)の1階部分について、桁行方向に設けなければならない構造耐力上必要な軸組の最小限の長さとして、建築基準法上、正しいものは、次のうちどれか。ただし、地盤が著しく軟弱な区域として特定行政庁が指定する区域内にあるものとし、小屋裏等に物置等は設けず、地方の風の状況に応じた「風圧力」に対する軸組の割増はないものとする。また、構造耐力上必要な軸組等の規定の適用の除外はないものとする。なお、図は略図とする。',choices:['1,610 cm','2,150 cm','2,415 cm','2,600 cm'],answer:3,hasFigure:true,figureDesc:'南側立面図: 幅5m、1F.L.からG.L.まで0.45m、3階建て、屋根は金属板葺き（斜線部）で見付面積52m2。1階～3階平面図: 5m×7mの長方形、床面積35m2（斜格子部）、桁行方向と張り間方向の表示あり、真北は右上方向。※1階部分の軸組の構造の判定に用いる。1階の床面積については、35m2とする。'},
{year:2019,subject:'法規',no:14,text:'都市計画区域内の道路等に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['地区計画の区域のうち、地区整備計画で建築物等の敷地として併せて利用すべき区域として定められている区域内の道路の上空においては、当該道路に係る地区計画の内容に適合し、かつ、所定の基準に適合するものであって特定行政庁が安全上、防火上及び衛生上支障がないと認める建築物については建築することができる。','建築基準法上の道路に該当しない幅員6mの農道のみに2m以上接する敷地における、延べ面積150m2の一戸建て住宅については、特定行政庁が交通上、安全上、防火上及び衛生上支障がないと認める場合には建築することができる。','都市再開発法による新設の事業計画のある幅員8mの道路で、2年以内にその事業が執行される予定のものとして特定行政庁が指定したものは、建築基準法上の道路である。','土地を建築物の敷地として利用するため袋路状道路を築造する場合、特定行政庁からその位置の指定を受けるためには、その幅員を6m以上とし、かつ、延長を35m以下としなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:15,text:'建築物の用途の制限に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、用途地域以外の地域、地区等の指定はなく、また、特定行政庁の許可等は考慮しないものとする。',choices:['第一種低層住居専用地域内において、「延べ面積180m2、地上2階建ての喫茶店兼用住宅(喫茶店の用途に供する部分の床面積60m2)」は、新築することができる。','田園住居地域内において、「延べ面積300m2、地上2階建ての、地域で生産された農産物を材料とする料理を提供する飲食店」は、新築することができる。','準工業地域内において、「延べ面積5,000m2、平家建ての圧縮ガスの製造工場(内燃機関の燃料として自動車に充填するための圧縮天然ガスに係るもの)」は、新築することができる。','工業地域内において、「延べ面積10,000m2、地上3階建ての展示場」は、新築することができる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:16,text:'図のような敷地において、建築基準法上、新築することができる建築物の容積率(同法第52条に規定する容積率)の最高限度は、次のうちどれか。ただし、図に記載されているものを除き、地域、地区等及び特定行政庁の指定、許可等は考慮しないものとする。',choices:['37/10','40/10','41.5/10','45/10'],answer:2,hasFigure:true,figureDesc:'敷地が商業地域（都市計画で定められた容積率70/10）と準住居地域（都市計画で定められた容積率20/10）にまたがっている。敷地は北側と南側に道路（幅員8m）が接し、西側に隣地が接する。商業地域側の敷地寸法は20m×40m、準住居地域側は20m×40m。南側道路の幅員は8m。'},
{year:2019,subject:'法規',no:17,text:'図のような敷地において、建築物を新築する場合、建築基準法上、A点における地盤面からの建築物の高さの最高限度は、次のうちどれか。ただし、敷地は平坦で、敷地、隣地及び道路の相互間に高低差はなく、門、塀等はないものとする。また、図に記載されているものを除き、地域、地区等及び特定行政庁による指定、許可等並びに日影による中高層の建築物の高さの制限及び天空率に関する規定は考慮しないものとする。なお、建築物は、全ての部分において、高さの最高限度まで建築されるものとする。',choices:['25.5 m','28.5 m','33.0 m','36.0 m'],answer:4,hasFigure:true,figureDesc:'商業地域、都市計画で定められた容積率60/10。敷地は南側と西側に道路が接する。西側道路幅員10m、南側道路幅員15m。敷地は30m×30mで、建築物（斜線部）が敷地内に配置。A点は敷地北西側、西側道路から5m、北側隣地境界から2mの位置。真北は左上方向。'},
{year:2019,subject:'法規',no:18,text:'地区計画等又は建築協定に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['地区整備計画等が定められている地区計画等の区域内において、市町村の条例で定めることができる制限としては、建築物に附属する高さ2m以内の門又は塀の位置の制限は含まれない。','再開発等促進区で地区整備計画が定められている地区計画の区域内においては、特定行政庁が交通上、安全上、防火上及び衛生上支障がないと認めて許可した建築物については、道路高さ制限、隣地高さ制限及び北側高さ制限は適用されない。','建築協定は、都市計画区域及び準都市計画区域外においては定めることができない。','建築協定書の作成に当たって、建築協定区域内の土地に借地権の目的となっている土地がある場合においては、借地権を有する者の全員の合意がなければならない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:19,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['建築基準法令の規定による指定確認検査機関の処分についての審査請求は、当該処分に係る建築物について建築確認をする権限を有する建築主事が置かれた市町村又は都道府県の建築審査会に対してすることができる。','エレベーターの昇降路の部分又は共同住宅若しくは老人ホーム等の共用の廊下若しくは階段の用に供する部分の床面積が、当該建築物の床面積の合計の1/3を超える場合においては、当該床面積の1/3を限度として、建築物の容積率の算定の基礎となる延べ面積に算入しないものとする。','地盤が軟弱な区域として特定行政庁が規則で指定した区域外において、平家建ての木造の住宅で足固めを使用した場合は、構造耐力上主要な部分である柱で最下階の部分に使用するものの下部に土台を設けなくてもよい。','都市計画区域内においては、火葬場は、都市計画においてその敷地の位置が決定していない場合であっても、特定行政庁が都市計画審議会の議を経てその敷地の位置が都市計画上支障がないと認めて許可した場合においては、新築することができる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:20,text:'ホテルに関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、用途地域以外の地域、地区等の指定はなく、また、特段の記述がない限り、特定行政庁の許可等は考慮しないものとする。',choices:['耐火建築物のホテルで、ホテルの用途に供する3階以上の部分の床面積の合計が350m2である場合、当該用途に供する居室から地上に通ずる主たる廊下、階段その他の通路の壁及び天井の室内に面する部分の仕上げを準不燃材料ですることができる。','高さが31mを超えるホテルで、非常用の昇降機を設けていないことにより建築基準法第3条第2項の規定の適用を受けているものについて増築する場合において、増築に係る部分の床面積の合計が基準時における延べ面積の1/2を超えるときは、非常用の昇降機を設けなければならない。','敷地が第二種中高層住居専用地域内に700m2、近隣商業地域内に600m2と二つの用途地域にわたる場合、当該敷地には、ホテルを新築することができる。','文化財保護法の規定によって重要文化財として指定された建築物であったものの原形を再現する建築物で、特定行政庁が建築審査会の同意を得てその原形の再現がやむを得ないと認めたものについては、建築基準法並びにこれに基づく命令及び条例の規定は、適用されない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:21,text:'次の記述のうち、建築士法上、誤っているものはどれか。ただし、中央指定登録機関の指定は考慮しないものとする。',choices:['建築に関する業務に従事する一級建築士にあっては、勤務先が変わり業務の種別に変更があったときは、その日から30日以内に、その旨を住所地の都道府県知事を経由して国土交通大臣に届け出なければならない。','「設計図書」とは、建築物の建築工事の実施のために必要な図面(現寸図その他これに類するものを除く。)をいい、仕様書を含まない。','延べ面積450m2、高さ10m、軒の高さ7mの木造2階建ての既存建築物について、床面積250m2の部分で大規模の修繕を行う場合においては、当該大規模の修繕に係る設計は、一級建築士、二級建築士又は木造建築士でなければしてはならない。','延べ面積400m2の建築物の新築における設計の契約の当事者は、契約の受託者が設計の一部を再委託する場合にあっては、当該再委託に係る設計の概要並びに当該再委託に係る受託者の氏名又は名称及び当該受託者に係る建築士事務所の名称及び所在地を、契約の締結に際して相互に交付する書面に記載しなければならない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:22,text:'次の記述のうち、建築士法上、誤っているものはどれか。ただし、指定事務所登録機関の指定は考慮しないものとする。',choices:['一級建築士を使用する者は、他人の求めに応じ報酬を得て、建築物に関する調査若しくは鑑定又は建築物に関する法令の規定に基づく手続の代理を業として行おうとするときは、一級建築士事務所を定めて、その建築士事務所について、都道府県知事の登録を受けなければならない。','都道府県知事の登録を受けている建築士事務所に属する建築士は、当該登録を受けた都道府県以外の区域においても、業として他人の求めに応じ報酬を得て、設計等を行うことができる。','建築士事務所の開設者と管理建築士とが異なる場合においては、その開設者は、管理建築士から、建築士事務所の業務に係る所定の技術的事項に関し、必要な意見が述べられた場合には、その意見を尊重しなければならない。','建築士事務所の開設者は、延べ面積が400m2の建築物の新築工事に係る設計及び工事監理の業務を受託した場合、委託者の許諾を得た場合には、受託業務の一部である工事監理の業務について、一括して他の建築士事務所の開設者に再委託することができる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:23,text:'建築士の講習に関する次の記述のうち、建築士法上、誤っているものはどれか。ただし、中央指定登録機関の指定は考慮しないものとする。',choices:['二級建築士として3年以上の設計等の業務に従事した後に管理建築士講習の課程を修了した者が、新たに一級建築士の免許を受けて一級建築士事務所の管理建築士になる場合には、改めて管理建築士講習を受けなければならない。','建築士事務所に属する一級建築士は、建築物の設計又は工事監理の業務に従事しない場合であっても、所定の一級建築士定期講習を受けなければならない。','国土交通大臣に対し、構造設計一級建築士証の交付を申請することができるのは、原則として、一級建築士として5年以上の構造設計の業務に従事した後、登録講習機関が行う所定の講習の課程をその申請前1年以内に修了した者である。','建築士事務所の開設者は、事業年度ごとに作成する設計等の業務に関する報告書において、当該建築士事務所に属する一級建築士が構造設計一級建築士である場合にあっては、その者が受けた構造設計一級建築士定期講習のうち、直近のものを受けた年月日についても記載しなければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:24,text:'次の記述のうち、都市計画法上、誤っているものはどれか。',choices:['都市計画施設の区域内において、地階を有しない木造、平家建ての飲食店を新築する場合は、原則として、都道府県知事等の許可を受けなければならない。','都市計画区域内において、延べ面積1,500m2の仮設興行場の建築の用に供する目的で行う開発行為は、原則として、都道府県知事の許可を受けなければならない。','市街化区域内において、病院の建築の用に供する目的で行う開発行為で、その規模が5,000m2のものについては、原則として、都道府県知事の許可を受けなければならない。','地区整備計画が定められている地区計画の区域内で、当該地区計画に建築物等の形態又は色彩その他の意匠の制限が定められている場合において、建築物等の形態又は色彩その他の意匠の変更をしようとするときは、原則として、当該行為に着手する日の30日前までに、所定の事項を市町村長に届け出なければならない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:25,text:'次の記述のうち、消防法上、誤っているものはどれか。ただし、建築物は、いずれも無窓階を有しないものとし、指定可燃物の貯蔵又は取扱いは行わないものとする。',choices:['延べ面積が350m2のキャバレーについては、原則として、自動火災報知設備を設置しなければならない。','消防用設備等の技術上の基準に関する規定の施行又は適用の際、現に存する百貨店における消防用設備等が当該規定に適合しないときは、当該消防用設備等については、当該規定に適合させなければならない。','準耐火建築物で、壁及び天井の室内に面する部分の仕上げを難燃材料でした延べ面積1,000m2、地上2階建ての専修学校については、原則として、屋内消火栓設備を設置しなければならない。','延べ面積1,500m2、地上2階建ての特別養護老人ホームで、火災発生時の延焼を抑制する機能として所定の構造を有しないものについては、原則として、スプリンクラー設備を設置しなければならない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:26,text:'次の記述のうち、「高齢者、障害者等の移動等の円滑化の促進に関する法律」上、誤っているものはどれか。',choices:['床面積の合計が90m2の公衆便所及び床面積の合計が2,000m2の公共用歩廊を新築しようとするときは、いずれも建築物移動等円滑化基準に適合させなければならない。','床面積の合計が2,000m2の図書館を新築しようとする場合において、当該図書館に設ける階段のうち、不特定かつ多数の者が利用し、又は主として高齢者、障害者等が利用するものは、踏面の端部とその周囲の部分との色の明度、色相又は彩度の差が大きいことにより段を容易に識別できるものとしなければならない。','移動等円滑化経路を構成する敷地内の通路は、幅を120cm以上とし、50m以内ごとに車椅子の転回に支障がない場所を設けなければならない。','既存の特別特定建築物に、床面積の合計2,000m2の増築をする場合において、道等から当該増築部分にある利用居室までの経路が1であり、当該経路を構成する出入口、廊下等の一部が既存建築物の部分にある場合には、建築物移動等円滑化基準における移動等円滑化経路の規定は、当該増築に係る部分に限り適用される。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:27,text:'次の記述のうち、関係法令上、誤っているものはどれか。',choices:['「住宅の品質確保の促進等に関する法律」に基づき、住宅新築請負契約又は新築住宅の売買契約における瑕疵担保責任の特例において、「住宅の構造耐力上主要な部分等」には、「雨水を排除するため住宅に設ける排水管のうち、当該住宅の屋根若しくは外壁の内部又は屋内にある部分」は含まれない。','「建築物の耐震改修の促進に関する法律」に基づき、要安全確認計画記載建築物の所有者は、当該建築物について耐震診断の結果、地震に対する安全性の向上を図る必要があると認められるときは、耐震改修を行うよう努めなければならない。','「建設工事に係る資材の再資源化等に関する法律」に基づき、特定建設資材を用いた建築物に係る解体工事で、当該建築物(当該解体工事に係る部分に限る。)の床面積の合計が100m2であるものの発注者は、工事に着手する日の7日前までに、所定の事項を都道府県知事に届け出なければならない。','「労働安全衛生法」に基づき、事業者は、建設業の仕事において、耐火建築物又は準耐火建築物で、石綿等が吹き付けられているものにおける石綿等の除去の作業を行う仕事を開始しようとするときは、その計画を当該仕事の開始の日の14日前までに、労働基準監督署長に届け出なければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:28,text:'次の記述のうち、建築基準法又は建築士法上、誤っているものはどれか。',choices:['建築基準法の構造耐力の規定に違反する建築物の設計を建築主が故意に指示し、建築士がそれに従って設計及び工事監理をした場合、当該建築主及び建築士のいずれも罰則の適用の対象となる。','建築士事務所の開設者である一級建築士が、当該建築士事務所の登録期間が満了したにもかかわらず、更新の登録を受けずに他人の求めに応じ報酬を得て工事監理業務を業として行った場合には、当該建築士は、業務停止等の懲戒処分の対象となる。','建築士事務所に属する建築士の氏名及びその者の一級建築士、二級建築士又は木造建築士の別に変更があった場合に、3月以内に、その旨を都道府県知事に届け出ないときは、当該建築士事務所の開設者及び管理建築士のいずれも罰則の適用の対象となる。','建築士事務所の開設者が、自己の名義をもって、他人に建築士事務所の業務を営ませたときは、当該建築士事務所の開設者は罰則の適用の対象となる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:29,text:'次の法律とその法律で用いられている防災に関連する用語との組合せのうち、誤っているものはどれか。',choices:['建築物の耐震改修の促進に関する法律 ―― 要緊急安全確認大規模建築物','建築基準法 ―― 災害危険区域','宅地造成等規制法 ―― 土砂災害特別警戒区域','密集市街地における防災街区の整備の促進に関する法律 ―― 特定防災街区整備地区'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'法規',no:30,text:'次の記述のうち、関係法令上、誤っているものはどれか。',choices:['「建築物のエネルギー消費性能の向上に関する法律」に基づき、特定建築物以外の建築物の新築において、建築主が所定の事項に関する計画を所管行政庁に届け出なければならないのは、床面積の合計が2,000m2以上の場合である。','「長期優良住宅の普及の促進に関する法律」に基づき、長期優良住宅建築等計画の認定を申請する者は、所管行政庁に対し、当該計画を建築主事に通知し、当該計画が建築基準法に規定する建築基準関係規定に適合するかどうかの審査を受けるよう申し出ることができる。','「景観法」に基づき、景観計画区域内において、建築物の建築等をしようとする者は、原則として、あらかじめ、所定の事項を景観行政団体の長に届け出なければならず、景観行政団体がその届出を受理した日から30日を経過した後でなければ、当該届出に係る行為に着手してはならない。','「都市の低炭素化の促進に関する法律」に基づき、低炭素建築物新築等計画の認定を受けた者は、当該認定を受けた低炭素建築物新築等計画の変更をしようとするときは、原則として、所定の申請書等を提出して所管行政庁の認定を受けなければならない。'],answer:1,hasFigure:false,figureDesc:''},
