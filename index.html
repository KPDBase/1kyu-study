明や契約書面の交付が義務付けられるのは設計・工事監理の受託契約等であり、建築物に関する調査の業務は対象とならない。","正しい。開設者は、事業年度ごとに設計等の業務実績等を記載した報告書を作成し、毎事業年度経過後3月以内に登録をした都道府県知事に提出しなければならない。","正しい。登録を抹消された後も、報酬を得て設計等を業として行った場合は、無登録営業として1年以下の懲役又は100万円以下の罰金に処せられる。","正しい。延べ面積300m²を超える建築物の新築の設計受託契約では、図書の種類や報酬額等を書面に記載し、署名又は記名押印して相互に交付しなければならない。"],"2023-法規-23":["正しい。建築士事務所に属する建築士は、その業務について当該事務所の管理建築士による監督を受ける。","正しい。事務所を開設した一級建築士は、登録に加え、免許の届出事項（事務所の名称、開設者の氏名及び所在地）の変更を、30日以内に国土交通大臣に届け出る必要がある。","正しい。事務所に所属しなくなった後に、定期講習の受講期間を超えて事務所に所属した一級建築士は、遅滞なく定期講習を受けなければならない。","誤り。開設者に対する処分は「戒告」又は「1年以内の閉鎖命令」に限られず、事務所の登録の取消しもあり得る。したがって二つのいずれかのみとする記述は不適当である。"],"2023-法規-24":["正しい。コンクリートプラントは特定工作物で、その改築は開発行為の定義（新設を前提）に当たらず、都道府県知事の許可は不要である。","誤り。開発区域の面積が20ha以上の開発行為では、ガス供給区域に含まれる場合に一般ガス導管事業者との協議が必要となる。40haなら協議が必要である。","正しい。市街化区域内で市街地再開発事業の施行として行う開発行為は、規模にかかわらず開発許可が不要である。","正しい。地区計画区域内の届出（都市計画法58条の2）は、仮設建築物の建築については対象から除外されており、届出は不要である。"],"2023-法規-25":["誤り。屋内消火栓設備の代替として屋外消火栓設備を設置できるのは1階及び2階の部分に限られ、3階以下の各階について設置を省略することはできない。","正しい。図書館は消防法施行令別表の（8）項で、自動火災報知設備は延べ面積500m²以上で必要となる。400m²なら設置を要しない。","正しい。ホテルは延べ面積11,000m²以上等でスプリンクラー設備が必要となる。5,000m²、地上3階建てでは設置を要しない。","正しい。屋外消火栓設備は、準耐火建築物では1階及び2階の床面積の合計が6,000m²以上で必要となる。5,000m²なら設置を要しない。"],"2023-法規-26":["誤り。誘導基準では、多数の者が利用する主たる階段は回り階段としないこととされ、空間確保が困難な場合のただし書は設けられていない（最低限の基準である移動等円滑化基準にはある）。","正しい。階段に併設する傾斜路の幅は90cm以上とされる。床面積2,000m²以上の物品販売店舗は特別特定建築物で、新築時に基準適合義務がある。","正しい。共同住宅は特別特定建築物ではなく特定建築物であり、床面積2,000m²以上の新築でも、基準への適合は努力義務である。","正しい。特定建築物の建築主等は、新築のほか修繕や模様替をする場合にも、移動等円滑化基準に適合させる努力義務がある。便所の修繕もこれに含まれる。"],"2023-法規-27":["誤り。住宅事業建築主の基準適合の努力義務が課されるのは、請負型規格住宅等の「一戸建ての住宅」である。共同住宅は対象外である。","正しい。非住宅部分の床面積が300m²以上の新築は、建築物エネルギー消費性能基準への適合義務の対象となる。","正しい。認定建築物エネルギー消費性能向上計画に係る建築物は、誘導基準に適合させる措置による床面積の増加分について、延べ面積の1/10を限度に容積率算定から除かれる。","正しい。床面積300m²以上の建築物の新築で適合義務の対象外となるもの（共同住宅等の住宅）は、工事着手の21日前までに所管行政庁へ届け出る必要がある。"],"2023-法規-28":["誤り。耐震改修計画の認定基準は、地震に対する安全性に係る建築基準法の耐震関係規定に適合するか、これに準ずる基準に適合することであり、基準を超える「誘導すべき基準」ではない。","正しい。特定建築物の計画認定は、建築物特定施設の構造等が移動等円滑化基準を超える建築物移動等円滑化誘導基準に適合することが基準である。","正しい。長期優良住宅建築等計画の認定基準は、構造及び設備が長期にわたり良好な状態で使用するための措置が講じられた「長期使用構造等」であることなどである。","正しい。建築物エネルギー消費性能向上計画の認定基準は、エネルギー消費性能が建築物エネルギー消費性能基準を超え、誘導基準に適合することなどである。"],"2023-法規-29":["正しい。用途変更後に特別特定建築物となる場合、変更前の建築物が移動等円滑化基準に適合していないときは、建築物特定施設を当該基準に適合させる必要がある。","正しい。用途変更では既存不適格の緩和が及ばないため、非常用の照明装置が未設置の居室には、原則として設置しなければならない。","正しい。消防用設備等は、用途変更に当たり、変更後の用途の設置基準に適合させなければならない。","誤り。用途変更の確認申請は必要な場合があるが、用途変更では建築基準法7条の完了検査の規定は準用されず、完了検査の申請は不要である。"],"2023-法規-30":["正しい。認定低炭素建築物新築等計画を変更するときは、原則として所管行政庁の変更認定を受けなければならない。","誤り。耐震改修促進法では、地震に対する安全性の向上を目的とした「敷地の整備」も耐震改修に含まれる（増築、改築、修繕、模様替等と並ぶ）。","正しい。事務所の建築一式工事は、請負代金が一定額（8,000万円等）未満であれば、主任技術者・監理技術者の専任は不要である。7,000万円は専任不要である。","正しい。長期使用構造等に該当する既存住宅の所有者は、維持保全計画を作成し、所管行政庁に認定を申請することができる。"],"2022-法規-1":["誤り。容積率の延べ面積は、エレベーター昇降路や条件の各部分の不算入規定を適用して求める。図がないが、この数値は算定結果と一致しない。","正しい。避雷設備の設置を検討する高さの算定では、昇降機塔等の屋上部分は高さ12mまでの不算入規定が適用されず、屋上部分も含めた高さとなる。","正しい。昇降機塔は水平投影面積が建築面積の1/8以下であれば階数に算入せず、地階を除く階数は図から算定される数となる。","正しい。階数は昇降機塔等を除き、地階も含めて算定する。図の階数の算定結果と一致する。"],"2022-法規-2":["正しい。建築物には建築物に附属する門・塀も含まれ、道路中心線から1階では3m以内が延焼のおそれのある部分となり、幅員4mの道路に接する塀は該当する。","正しい。病院の入院患者のための談話室は、継続的に使用される室であり「居室」に該当する。","正しい。防煙壁は、天井面から50cm以上突出した垂れ壁で不燃材料で造られたもの等である。","誤り。屋外階段は主要構造部から除かれており、木造の屋外階段を全て鉄骨造に取り替えても主要構造部の過半の模様替には当たらず、大規模の模様替ではない。"],"2022-法規-3":["誤り。防火地域・準防火地域内の増築は、床面積が10m²以内でも確認済証の交付が必要である。","誤り。ゴルフ練習場のネットを支える鉄柱は、高さ15mを超える場合には確認が必要な工作物であり、高さ20mは該当する。","正しい。工事を施工するために現場に設ける仮設事務所は、法85条の規定により確認申請が不要である。","誤り。ホテルから共同住宅への用途変更は、類似の用途に当たらず、特殊建築物で床面積200m²を超えるため確認済証の交付が必要である。"],"2022-法規-4":["正しい。定期報告を要する建築物の所有者と管理者が異なる場合は、管理者が特定行政庁に報告しなければならない。","誤り。用途変更では、建築基準法7条の完了検査の規定は準用されない。工事完了後に建築主事の検査を申請する義務はない。","正しい。建築設備の材料・位置・能力の変更で、変更後も建築基準関係規定に適合することが明らかな場合は、軽微な変更として確認申請は不要である。","正しい。完了検査の申請が受理された日から7日を経過したときは、検査済証の交付前でも建築物を仮に使用できる。"],"2022-法規-5":["正しい。構造耐力上主要な部分に用いる指定建築材料は、JIS・JAS適合、又は国土交通大臣の認定を受けた品質のものでなければならない。","正しい。児童福祉施設等の傾斜路は階段の幅の規定が準用され、手すりの幅が10cmを超える場合は超過分を差し引くため、側壁間は125cm以上必要となる。","正しい。第三種ホルムアルデヒド発散建築材料を使用する内装仕上げは、使用面積に所定の数値を乗じた面積を床面積以下に抑える制限がある。","誤り。125Hz・500Hz・2,000Hzの透過損失25dB・40dB・50dB以上の遮音性能が求められるのは、長屋・共同住宅の界壁等であり、老人福祉施設の防火上主要な間仕切壁には求められない。"],"2022-法規-6":["正しい。防火構造の外壁に必要な防火性能は、加熱開始後30分間、屋内面の温度が可燃物燃焼温度以上に上昇しないことである。","正しい。共同住宅の各戸の界壁は、準耐火構造とし、小屋裏又は天井裏に達せしめなければならない（強化天井の場合を除く）。","誤り。11階以上の高層区画は100m²以内が原則で、緩和されるのは仕上げを準不燃材料とした場合の200m²等である。難燃材料では緩和されず、100m²以内ごとに区画する。","正しい。法27条の特殊建築物（客席200m²以上の集会場）の部分とその他の部分は、原則として防火区画（異種用途区画）しなければならない。"],"2022-法規-7":["正しい。耐火構造のホテルで、宿泊室の床面積の合計が200m²以下であれば、避難階の直上階以外では直通階段を1か所とすることができる。","誤り。避難階の直上階で、居室の床面積の合計が一定面積（耐火構造で400m²）を超える場合は直通階段を2か所以上設ける必要があり、売場450m²では1か所では不適合となる。","正しい。耐火構造の共同住宅で、各階の居室の床面積の合計が200m²以下であれば、直通階段は1か所でよい。","正しい。6階以上の階では原則2以上必要だが、各階の居室の床面積が200m²以下で、避難上有効なバルコニーと屋外避難階段を設ければ、直通階段は1か所とできる。"],"2022-法規-8":["正しい。非常災害時に地方公共団体が災害救助のために建築する応急仮設建築物で、災害発生から1月以内に着手するものは、建築基準法令の規定が適用されない。","誤り。国が災害時に建築する応急仮設の官公署でも、準防火地域内の屋根の性能に関する規定は、適用除外の対象とされていない。","正しい。防火地域内に特定行政庁の許可を受けて建築する仮設店舗は、外壁開口部の防火設備に関する規定の適用が除外される。","正しい。特定行政庁の許可を受けて一時的に興行場として使用する場合、内装制限に関する規定は適用されない。"],"2022-法規-9":["誤り。ボーリング場は、非常用の照明装置の設置が不要とされる学校等の用途に含まれるため、設けなくてもよい。","正しい。病院は、床面積100m²以内ごとに防火区画した部分については、排煙設備を設けなくてもよい。","正しい。地下街の各構えが接する地下道の幅員は、5m以上としなければならない。","正しい。3階以上の階で、道に面する外壁面に直径1m以上の円が内接できる窓を10m以内ごとに設けた場合は、非常用の進入口を設けなくてもよい。"],"2022-法規-10":["正しい。高さ31m超の部分が4階以下の耐火構造で、100m²以内ごとに耐火構造の床・壁や特定防火設備で区画されている場合、非常用エレベーターは設置不要である。","正しい。各構えの床面積の合計が1,000m²を超える地下街では、排煙設備の制御・監視を中央管理室で行えるようにしなければならない。","誤り。住戸の調理室で換気設備を省略できる開口面積は、調理室の床面積の1/10以上かつ0.8m²以上である。床面積7m²で0.7m²では0.8m²に満たない。","正しい。全館避難安全検証法で避難安全性能が確かめられても、非常用の照明装置の設置義務は免除されないため、設けなければならない。"],"2022-法規-11":["正しい。高さ31m以下の建築物は、許容応力度等計算又は保有水平耐力計算（ルート3）のいずれかで安全性を確かめればよく、保有水平耐力計算を行えば前者の計算は不要である。","正しい。高さ31mを超える建築物（高さ45m）で保有水平耐力計算を行う場合は、剛性率・偏心率の規定（偏心率0.15以下の確認）は適用されず、確認は不要である。","正しい。許容応力度等計算の標準せん断力係数Coは0.2以上（軟弱地盤の木造は0.3以上）、必要保有水平耐力の計算ではCo1.0以上とする。","誤り。限界耐力計算では、短期に生ずる力は積雪時及び暴風時の応力度を確かめる。地震時は許容応力度ではなく損傷限界・安全限界の検証で確かめるため、短期に「地震時」を含める点が誤りである。"],"2022-法規-12":["誤り。Fc21のコンクリートの長期圧縮許容応力度はFc/3＝7N/mm²、短期引張は長期引張（Fc/30＝0.7）の2倍の1.4N/mm²で、長期圧縮の1/5であり1/3ではない。","正しい。百貨店の売場等の柱の計算用積載荷重は2,400N/m²で、支える床数が4のときは0.85を乗じて低減でき、2,040N/m²とすることができる。","正しい。構造耐力上主要な部分でない高さ3mの鉄筋コンクリート造の塀については、四週圧縮強度12N/mm²以上とする規定は必ずしも必要とされない。","正しい。異形鉄筋をせん断補強以外に用いる場合の材料強度は、引張り・圧縮とも基準強度Fの値（同じ値）を用いる。"],"2022-法規-13":["正しい。基礎は異なる構造方法の併用が原則禁止だが、国土交通大臣が定める基準に従った構造計算で構造耐力上安全を確かめた場合は併用できる。","正しい。土砂災害特別警戒区域内の居室を有する建築物の外壁等は、自然現象による衝撃が作用しても破壊しない国土交通大臣が定める構造方法とする必要がある。","正しい。柱の主筋と帯筋の緊結に関する規定は、保有水平耐力計算によって安全性を確かめた場合には適用が除外されており、緊結する必要はない。","誤り。特定天井は保有水平耐力計算を行っても適用が除外されず、構造耐力上安全な国土交通大臣が定める構造方法又は大臣認定を受けたものとする必要がある。"],"2022-法規-14":["正しい。河川管理者が管理する幅員4m以上の公共の用に供する道のみに2m以上接する敷地は、特定行政庁の認定により建築でき、基準に適合する住宅が対象となる。","正しい。許可を受けて道路上空に設ける渡り廊下は、側面に床面から高さ1.5m以上の壁を設け、1.5m以下の部分の開口部ははめごろし戸としなければならない。","正しい。道路内にある建築物には道路高さ制限（道路斜線）は適用されないが、高架の道路の路面下に設けるものは除かれ、その場合は適用される。","誤り。位置指定道路の廃止は許可制ではなく、廃止により接する敷地が接道義務に違反することとなる場合に、特定行政庁が廃止を禁止又は制限できるとされている。"],"2022-法規-15":["正しい。児童厚生施設は第一種低層住居専用地域で建築可能な公益上必要な用途であり、延べ面積500m²・平家建てでも新築できる。","正しい。カラオケボックス等は第二種住居地域で建築可能な用途であり、延べ面積6,000m²・3階建てでも制限を受けず新築できる。","誤り。近隣商業地域で原動機を使用する自動車修理工場は、作業場の床面積の合計が150m²以内に限られる。作業場400m²では新築できない。","正しい。内燃機関の燃料として自動車に充填する圧縮天然ガスの製造工場は、商業地域で建築可能な用途として扱われ、新築できる。"],"2022-法規-16":["正しい。防火地域内では、階数3以上又は延べ面積100m²超の建築物は耐火建築物等とする。延べ面積120m²の診療所は耐火建築物等が必要である。","正しい。防火地域内の建築物に附属する高さ2mを超える門又は塀は、延焼防止上支障のない構造としなければならない。","正しい。準防火地域内で地上3階建て（延べ面積500m²以下）の建築物は、準耐火建築物又はこれと同等以上の延焼防止時間となる建築物以上とすればよく、耐火建築物も可能である。","誤り。準防火地域内では延べ面積が500m²を超え1,500m²以下で地上3階未満の建築物は準耐火建築物等で足りる。1,200m²・2階建ての倉庫は耐火建築物とする必要はない。"],"2022-法規-17":["誤り。図の前面道路幅員や用途地域・容積率の指定から求める最高限度とは一致しない。指定容積率と道路幅員による制限（幅員×法定乗数）の小さい方を採用する。","誤り。図の条件から算定した容積率の最高限度（45/10）とは異なる。前面道路幅員による制限と指定容積率を比較し、小さい方を採用する。","正しい。図の条件から、前面道路幅員による容積率制限と指定容積率を比較して小さい方をとり（敷地が複数の地域にわたる場合は面積按分）、最高限度は45/10となる。","誤り。図の条件から算定した最高限度は45/10であり、53/10は指定容積率や道路幅員による制限を超えている。"],"2022-法規-18":["誤り。図に基づく斜線制限（道路斜線・隣地斜線等）のうち最も厳しい制限による高さは24.25mであり、21.25mとはならない。","誤り。A点の高さの最高限度は24.25mであり、23.25mとはならない。各斜線制限の適用距離や勾配による算定結果が異なる。","正しい。図の条件から各斜線制限（道路斜線・隣地斜線など）による高さを算定し、そのうち最も厳しい値をとると、A点の最高限度は24.25mとなる。","誤り。26.25mでは、最も厳しい斜線制限による高さ（24.25m）を超えるため最高限度とならない。"],"2022-法規-19":["正しい。ごみ焼却場等は都市計画で敷地の位置が決定していなくても、特定行政庁が都市計画審議会の議を経て支障がないと認めて許可すれば新築できる。","誤り。再開発等促進区内で用途地域の制限に適合しない建築物は、基本方針に適合していても、特定行政庁が支障がないと認めて許可する必要がある。許可なしで新築できるわけではない。","正しい。建築基準法に基づく許可には、交通上、安全上、防火上又は衛生上支障がないようにするための条件を付すことができる。","正しい。指定確認検査機関の処分に不服がある者は、当該処分に係る建築物について確認する権限を有する建築主事が置かれた市町村又は都道府県の建築審査会に審査請求できる。"],"2022-法規-20":["正しい。病院で3階以上の階にあるものは定期報告の対象であり、所有者等は一級・二級建築士又は建築物調査員に調査させ、特定行政庁に報告しなければならない。","正しい。商業地域では採光関係比率に10を乗じて1.0を減じた算定値で、水平距離4m以上かつ算定値が1.0未満の場合は採光補正係数を1.0とする。","誤り。避難施設等に関する工事中の使用に係る安全計画の届出は、避難施設等の工事が対象である。非常用照明の照明カバーの取替えは軽微なもので届出の対象とならない。","正しい。敷地が二つの用途地域にわたるときは過半の地域の制限による。工業地域が過半（600m²）であり、工業地域では病院は原則建築できず特定行政庁の許可が必要である。"],"2022-法規-21":["誤り。工事監理は、工事を設計図書と照合し、設計図書のとおりに実施されているかいないかを確認する行為である。工事の指導監督までは含まれない。","正しい。建築士は工事監理を終了したときは、設計者が誰であるかに関わらず、直ちにその結果を文書で建築主に報告しなければならない。","正しい。一級建築士でなければ設計できない建築物の工事監理は、二級建築士が一級建築士の指導を受けていても行うことができない。","正しい。構造設計一級建築士の関与義務は設計に関するもので、工事監理は構造設計一級建築士以外の一級建築士でも行うことができる。"],"2022-法規-22":["正しい。管理建築士は、建築士事務所の技術的事項（業務に必要な期間の設定、担当建築士の選定など）を総括する者である。","正しい。管理建築士が不在となった事務所は登録取消し等の対象となる。無登録で業務を行えば1年以下の懲役又は100万円以下の罰金の対象となる。","正しい。管理建築士が建築士法等の処分を受けた場合、事務所の業務によらないものであっても、当該事務所は処分の対象となり得る。","誤り。管理建築士となるには、設計・工事監理等の実務3年以上に加えて、登録講習機関の管理建築士講習の修了が必要であり、記述は要件として不十分である。"],"2022-法規-23":["正しい。免許証の提示は、設計等の委託者から請求があったときと、重要事項説明をするときに義務付けられている。","誤り。定期講習の受講義務は、建築士事務所に属する建築士に課される。全ての建築士に義務付けられているわけではないので、B欄に義務付け対象でないものを含む。","正しい。設計図書への記名は、設計を行った建築士のほか、構造設計一級建築士・設備設計一級建築士が法適合確認を行ったときにも義務付けられる。","正しい。建築士事務所には、業務実績、所属建築士の氏名と業務実績、損害賠償措置の内容、業務及び財務に関する書類を閲覧用に備え置かなければならない。"],"2022-法規-24":["誤り。都市計画施設の区域内では、改築も含めて建築に原則許可が必要である。階数2以下で地階がなく容易に移転できる木造等でなければ例外とならず、3階建ては許可が必要である。","正しい。建築物の建築を目的とする土地の区画形質の変更は、規模にかかわらず開発行為であり、許可が必要かどうかは規模等で別に判断される。","正しい。開発許可を受けた開発区域内では、工事完了公告があるまでの間は、原則として建築物を建築してはならない。","正しい。専修学校は許可不要の公益施設に含まれず、市街化区域では開発規模が1,000m²以上であれば開発許可が必要である。"],"2022-法規-25":["誤り。図書館は特定防火対象物ではなく非特定防火対象物である。既存の建築物に新しい基準を遡及適用するのは特定防火対象物などに限られる。","正しい。天井の高さ10mを超え、延べ面積700m²以上のラック式倉庫には、原則としてスプリンクラー設備を設置しなければならない。","正しい。地階又は無窓階の駐車場で床面積が1,000m²以上のものには、原則として排煙設備の設置が必要である。","正しい。連結送水管は、地上5階以上かつ延べ面積6,000m²以上の建築物（ホテル含む）に原則設置が必要である。"],"2022-法規-26":["正しい。床面積2,000m²以上の物品販売店舗は特別特定建築物であり、法第85条第5項の許可を受けた仮設建築物でも移動等円滑化基準への適合義務を負う。","誤り。事務所は特別特定建築物ではなく特定建築物であり、基準適合は努力義務である。500m²の事務所に適合義務はない。","正しい。公立小学校は特別特定建築物で、2,000m²以上であれば適合義務があり、多数の者が利用する階段は踏面端部を識別しやすいものとする。","正しい。移動等円滑化経路を構成する敷地内通路は、幅120cm以上とし、50m以内ごとに車椅子の転回に支障がない場所を設ける。"],"2022-法規-27":["誤り。非住宅部分の床面積の合計が300m²の建築物の届出等に関する記述だが、時期や対象となる行為の取扱いが正答表上は誤りとされる。※要確認（届出義務の細部は法令確認を要する）","正しい。特定建築主（分譲型規格住宅の建築・分譲を行う大手事業者）は、一層のエネルギー消費性能向上のための基準に適合させるよう努めなければならない。","正しい。建築士は小規模建築物の設計を行う場合、建築主に建築物エネルギー消費性能基準への適合性の評価結果を書面で説明する義務がある。","正しい。建築主等は、エネルギー消費性能向上のための修繕等の計画を作成し、所管行政庁に建築物エネルギー消費性能向上計画の認定を申請できる。"],"2022-法規-28":["誤り。イ・ロは正しいが、ハは適切でない。排煙設備を設けない前提で、条件に合う窓の規模や区画の有無を考慮せずに判断しており、全てが正しいとはいえない。※ハの適否は図面依存で要確認","正しい。イ（採光が確保できる窓の確認）とロ（外皮平均熱貫流率及び冷房期の平均日射熱取得率が基準値以下）は適切で、ハは適切でないため、イとロが組合せとして正しい。","誤り。ロも正しい判断であり、ロを含まない組合せは誤りである。また、ハは適切でない。","誤り。イも正しい判断であり、イを含まない組合せは誤りである。また、ハは適切でない。"],"2022-法規-29":["正しい。高さ31m以下の鉄筋コンクリート造では保有水平耐力計算を選択でき、記載の各確認事項は構造計算に必要な内容であり、不必要な内容は含まれない。","誤り。6階建て店舗で特別避難階段とする場合、排煙設備は階段室ではなく付室に設ければよい。階段室に排煙機による排煙設備を設置することは必要でなく、不必要な内容を含む。","正しい。非住宅建築物は設計一次エネルギー消費量が基準一次エネルギー消費量を超えないことが求められ、必要な確認である。","正しい。バリアフリー法の認定特定建築物の認定を受けると容積率の特例があり、建築物移動等円滑化誘導基準への適合は必要な内容である。"],"2022-法規-30":["正しい。住宅品確法により、構造耐力上主要な部分等の瑕疵担保責任は引渡しから10年間義務付けられ、これに反する注文者・買主に不利な特約は無効である。","正しい。請負代金が4,000万円（建築一式は8,000万円）未満の工事では、主任技術者を専任とする必要はない。診療所の3,500万円はこれに当たる。","正しい。長期優良住宅の建築と維持保全を行おうとする者は、長期優良住宅建築等計画を作成し、所管行政庁に認定を申請できる。","誤り。低炭素建築物新築等計画の認定申請は、建築確認の申請と並行して行えるよう、確認済証の交付を受ける前に行うことができ、あらかじめ交付を受ける必要はない。"],"2021-法規-1":["正しい。土地に定着する観覧のための工作物は、屋根がなくても建築物に該当する。","正しい。幼保連携型認定こども園は児童福祉施設等に準じ、特殊建築物に該当する。","正しい。階数3以上の共同住宅の2階の床及びこれを支持するはりの配筋工事は、中間検査の特定工程に該当する。","誤り。防火戸は建築物の構成部分であり建築設備ではない。建築設備は電気・ガス・給排水・換気・排煙・消火設備や昇降機、避雷針などである。"],"2021-法規-2":["正しい。高い開放性を有する構造として国土交通大臣が指定した建築物は、端から水平距離1m以内の部分の水平投影面積を建築面積に算入しない。","正しい。宅配ボックス設置部分の床面積は、各階の床面積の合計の1/100を限度として容積率算定の延べ面積に算入しない。","正しい。塔屋が建築面積の1/8以下でも、休憩室など倉庫・機械室類以外の用途を設けた場合は階数に算入する。","誤り。避雷設備の設置の検討における高さの算定では、階段室等の屋上部分の高さを12mまで算入しない緩和は適用されず、その部分も高さに算入する。"],"2021-法規-3":["誤り。防火地域・準防火地域内の増築は、10m²以内であっても確認済証の交付が必要である。8m²の増築でも確認申請を要する。","誤り。木造2階建ての飲食店で用途部分が200m²を超える特殊建築物の屋根の過半の模様替は大規模の模様替に当たり、確認済証が必要である。","正しい。水泳場から体育館への用途変更は類似の用途間の変更に当たり、確認済証の交付は不要である。","誤り。エレベーターの設置は建築設備の設置であり、確認申請の対象となるため確認済証の交付を受ける必要がある。"],"2021-法規-4":["正しい。敷地面積の増加等で変更後も建築基準関係規定に適合することが明らかな場合は軽微な変更として、あらためて確認済証の交付を受ける必要はない。","誤り。避難施設等の工事中に建築物を使用する場合に必要なのは、特定行政庁への安全計画の届出である。仮使用の認定は不要であり、認定とあわせて必要とする点が誤りである。","正しい。患者収容施設のある診療所は床面積が200m²を超えない場合、確認の対象外となり、検査済証の交付前でも使用できる。","正しい。用途変更の確認済証の交付を受けた場合、工事完了後は建築主事に工事完了の届出が必要である。"],"2021-法規-5":["誤り。階段に代わる傾斜路にも階段の手すりの規定が準用され、幅が3mを超える場合は中間に手すりを設ける必要がある。勾配が緩くても幅4mでは不要とならない。","正しい。有料老人ホームの入所者用娯楽室は、採光に有効な開口部面積を床面積の1/10以上とする。50m²なら5m²以上となる。","正しい。強化天井で遮音性能に関する基準に適合する構造の場合、準耐火構造の界壁は小屋裏又は天井裏に達しなくてもよい。","正しい。最下階の居室の床が木造の場合、外壁の床下部分に5m以下ごとに300cm²以上の換気孔を設け、ねずみの侵入防止設備を設ける。"],"2021-法規-6":["誤り。防火区画検証法で防火設備に求められるのは、屋内で発生が予測される火災の火熱に対し、火災継続時間以上、遮炎性能を保つことである。建築物の周囲の火災まで含める記述は誤り。","正しい。準防火地域内の建築物の屋根は、法第22条区域と同様に、火の粉による防火上有害な発炎や、屋内に達する溶融・亀裂等の損傷を生じない構造とする必要がある。","正しい。耐火構造の柱は、通常の火災による火熱が所定の時間加えられても、構造耐力上支障のある変形、溶融、破壊その他の損傷を生じないことが求められる。","正しい。不燃材料は、通常の火災による火熱が加えられた場合に、加熱開始後20分間、燃焼せず、防火上有害な変形・溶融・亀裂等を生じないことが技術的基準である。"],"2021-法規-7":["正しい。地階に設ける劇場の客席や、そこから地上へ通ずる主たる通路の壁・天井の室内に面する部分の仕上げは、準不燃材料以上とすればよい。","誤り。階避難安全検証法を用いても階段室や付室の内装制限は除外されない。特別避難階段の階段室・付室は、仕上げだけでなく下地も不燃材料で造る必要があり、準不燃の下地は不適合。","正しい。延べ面積600m2、3階建ての図書館は、3階部分の床面積が小さく内装制限の対象とならない、または対象でも居室は難燃材料で足りるため適合する。","正しい。避難階とその直上階のみに通ずる吹抜きは、壁・天井の仕上げと下地を準不燃以上とすれば竪穴区画が不要である。不燃材料はこれを上回る性能で適合する。"],"2021-法規-8":["正しい。屋外に設ける避難階段は、階段に通ずる出入口以外の開口部から2m以上離す必要があり、2.5mは基準を満たす。","正しい。屋内に設ける避難階段の階段部分は、排煙設備の設置が不要とされる部分である。特別避難階段の付室等とは扱いが異なる。","正しい。物販店舗の避難階段の幅は、直上階以上の床面積100m2につき60cm以上が必要で、3階では直上階の500m2に対し300cm以上。3.0mは適合する。","誤り。避難階段としての屋外階段は、耐火構造で地上まで直通させる必要がある。準耐火構造(防腐措置を講じた木造等)の屋外階段は、避難階段として認められない。"],"2021-法規-9":["誤り。屋内避難階段の出入口に設ける防火設備は、法第2条第九号の二ロに規定する防火設備、すなわち加熱開始後20分間遮炎性能を有するものとする。10分間では不足で不適合。","正しい。防火壁の開口部は幅・高さを各2.5m以下とし、特定防火設備を設ける。2.5mはちょうど上限で適合する。","正しい。体育館は非常用の照明装置の設置が免除される学校等の用途に含まれるため、設置しなくても基準に適合する。","正しい。層間変形角は原則1/200以内であるが、変形による著しい損傷のおそれがない場合は1/120以内まで認められる。1/150以内は基準を満たす。"],"2021-法規-10":["正しい。エレベーター機械室の床から天井またははり下端までの垂直距離は、定格速度が毎分150m以下(60m超)の場合は2.2m以上とされる。","正しい。ホルムアルデヒド対策の機械換気設備の必要有効換気量は、居室の床面積と天井高さの積に換気回数を乗じる。住宅等の居室の換気回数は0.5回/hである。","正しい。耐火構造の床・壁や防火設備で100m2以内に区画されたホテルの客室等は、排煙設備の設置が免除される。開放できる部分の面積に関わらず設置不要である。","誤り。エレベーター強度検証法の常時の応力度は、昇降する部分の固定荷重とかごの積載荷重を合計して計算する。昇降する部分以外の部分の固定荷重を加える記述は誤りである。"],"2021-法規-11":["正しい。高力ボルト孔の径は、原則としてボルト径より2mmを超えて大きくしてはならない(ボルト径27mm以上では3mmまで)。","正しい。鉄筋コンクリート造の鉄筋のかぶり厚さは、直接土に接する柱・梁・床・壁・基礎立上り部分で4cm以上とする。","誤り。主筋の重ね継手長さについて、記述の数値の扱いは告示や継手位置の条件で異なる。※要確認:25倍は引張力が最も小さい部分に設ける場合の数値として一般に知られるが、公式正答表との整合上、本肢が誤りとされている。","正しい。鉄骨鉄筋コンクリート造の柱の主筋は、鉄筋コンクリート造の柱の規定に準じて4本以上とするのが一般的な基準である。"],"2021-法規-12":["誤り。金属板葺きは軽い屋根として扱い、2階建ての1階の地震力に対する必要軸組長さは、床面積1m2につき29cmで60m2なら1,740cmとなる。1,710cmはこの値に合わない。","正しい。軽い屋根の2階建て1階では、地震力用の係数は29cm/m2、床面積60m2で1,740cm。風圧力で必要な長さがこれを上回らなければ、桁行方向の最小限の長さは1,740cmとなる。","誤り。1,980cmは、床面積60m2に重い屋根(瓦葺き等)の係数33cm/m2を掛けた値である。屋根は金属板葺きで軽い屋根のため、この値にはならない。","誤り。2,250cmは本問の屋根・階数の条件で地震力・風圧力のどちらからも導かれる値とはならず、必要な軸組の最小限の長さを過大に見積もった値である。"],"2021-法規-13":["正しい。組積造の塀は高さ1.2m以下とし、長さ4m以下ごとに壁厚の1.5倍以上突出した控壁(木造を除く)を設ける。","誤り。劇場・映画館・公会堂等の客席の積載荷重は、柱がささえる床の数による低減の対象外である。柱の計算で床数6として1,950N/m2へ低減することはできない。","正しい。許容応力度等計算では、地上部分について、地震力による各階の層間変形角が所定の数値(原則1/200)以内であることを確かめる。","正しい。限界耐力計算では、地下部分の構造耐力上主要な部分の断面に生ずる応力度が、短期許容応力度を超えないことを確かめる。"],"2021-法規-14":["正しい。窓その他の開口部を有しない居室は、これを区画する主要構造部を耐火構造または不燃材料で造る必要がある。","誤り。換気に有効な部分の面積は3.0m2で、床面積50m2の1/20(2.5m2)以上ある。換気上の無窓居室ではなく、換気設備の設置義務はこの規定からは生じない。","正しい。無窓居室は、直通階段までの歩行距離を30m以下とする。内装を難燃材料としても、準不燃材料の場合のような緩和は受けられない。","正しい。開放できる部分が床面積の1/50(1.0m2)未満であるため排煙上の無窓居室に該当し、排煙設備を設けない場合は、煙降下が生じない部分に関する大臣告示に適合させる。"],"2021-法規-15":["正しい。位置の指定を受けて築造する道の縦断勾配は、原則として12%以下とする(特定行政庁が認める場合は緩和がある)。","正しい。地区整備計画で道の配置・規模が定められた地区計画区域内の位置指定道路は、原則としてその地区計画に即したものでなければならない。","正しい。幅員4m以上の公共の用に供する道(道路法等以外)に2m以上接する敷地は、特定行政庁が支障がないと認めて許可すれば建築できる。","誤り。壁面線を越えるひさしは、政令で定める小規模なもの(一定の高さ以上など)であれば、特定行政庁の許可を要せず設けることができる。すべて許可が必要という記述は誤り。"],"2021-法規-16":["正しい。保健所などの公益上必要な建築物は、用途地域による用途制限が緩和されるため、第一種住居地域でも新築できる。","正しい。準住居地域では、一定の条件を満たす水素ステーション(圧縮ガスの貯蔵・処理施設)を建築できる。本問の規模は条件内である。","正しい。田園住居地域では、床面積150m2以内、2階以下の喫茶店など、日用品販売店舗や飲食店に準ずる小規模な店舗を建築できる。","誤り。産業廃棄物処理施設は、一定の処理能力を超えるがれき類の破砕施設などの場合、都市計画で位置が決定されていない限り新築できない。1日120tは対象規模である。"],"2021-法規-17":["誤り。図が略されているが、容積率は指定容積率と前面道路幅員による制限の小さい方を採り、複数地域にわたる場合は面積加重平均する。本肢の数値はその計算結果と合わない。","誤り。図が略されているが、前面道路幅員による容積率制限と指定容積率の加重平均をとると、本肢の数値は最高限度とならない。","正しい。前面道路幅員による制限(幅員×係数)と各地域の指定容積率の面積加重平均をそれぞれ求め、小さい方が最高限度となる。その結果が37/10となる。","誤り。40/10は指定容積率等をそのまま採った場合の値で、前面道路幅員による制限や加重平均の結果、最高限度とはならない。"],"2021-法規-18":["誤り。図が略されているが、道路斜線・隣地斜線等のうち厳しい方でA点の高さが決まる。本肢の16.5mはそのいずれの計算結果とも合わない。","誤り。図が略されているが、斜線制限等の計算結果からA点で認められる高さは、21.0mより高く、最高限度とはならない。","正しい。道路斜線制限と隣地斜線制限を検討し、A点で最も厳しい値を採る。計算した結果が37.5mとなる。","誤り。38.5mは一方の斜線制限だけを採った場合などの値で、他方の制限を考慮すると超過するため、最高限度とはならない。"],"2021-法規-19":["誤り。図が略されているが、Aは防火壁を設けない同一敷地内の建築物の規模・階数・用途等から、耐火建築物等とすべき要件に該当しない。ここでの要求は過大である。","正しい。図が略されているが、Bは規模・階数・用途等の条件から、耐火建築物またはこれと同等以上の延焼防止時間の建築物とする必要がある。","正しい。図が略されているが、Cは条件上、耐火建築物・準耐火建築物またはこれらと同等以上の延焼防止時間の建築物とする必要がある。","正しい。図が略されているが、Dは規模・階数・用途等の条件から、耐火建築物またはこれと同等以上の延焼防止時間の建築物とする必要がある。"],"2021-法規-20":["正しい。第一種・第二種低層住居専用地域、田園住居地域で高さ限度が10mの場合、一定の空地・敷地規模を有し、特定行政庁が認めるものは12mまで緩和される。","誤り。予定道路を前面道路とみなして容積率の規定を適用するには、特定行政庁の許可が必要である。許可なしに適用できるという記述は誤り。","正しい。法第22条第1項の市街地の区域の内外にわたる建築物は、その全部について区域内の建築物の規定が適用される。","正しい。建築協定の効力が及ばない土地の所有者(協定の公告前からの所有者など)は、認可等の公告日以後いつでも、書面で意思を表示して協定に加わることができる。"],"2021-法規-21":["正しい。木造で延べ面積が1,000m2を超える建築物は、外壁・軒裏の延焼のおそれのある部分を防火構造としなければならない。","正しい。構造耐力上主要な部分の木材の品質に関する規定は、耐久性等関係規定に含まれる。","正しい。確認の特例で審査が省略される規定でも、それらの規定自体には適合させる義務があり、遵守しなければならない。","誤り。大規模の修繕は、主要構造部の一種以上について行う過半の修繕をいう。土台は主要構造部に含まれないため、土台の過半の修繕は大規模の修繕に該当しない。"],"2021-法規-22":["正しい。建築士は、建築基準法令に適合しない建築物の設計を求められても応じてはならず、不適合な設計に関わることは建築士の誠実義務に反する。","正しい。事務所に所属する建築士は定期講習を3年以内ごとに受けなければならず、新たに所属する場合も所定の期限までに受講する必要がある。","誤り。構造設計一級建築士が構造設計を行い、構造設計図書にその旨を表示した場合は、構造計算で安全性を確かめた旨の証明書の交付は不要である。交付義務があるとする記述は誤り。","正しい。設備設計一級建築士は、設備設計に限らず、設備設計以外の設計を含む建築物全体の設計を行うことができる。"],"2021-法規-23":["正しい。設計受託契約等の締結前に、建築主に対し重要事項を、建築士(管理建築士または所属建築士)に書面を交付して説明させなければならない。","正しい。所属建築士の変更について、管理建築士の変更は2週間以内に届出が必要で、それ以外の建築士は3月以内の届出とされる。","誤り。建築士事務所の登録は、業務範囲が複数の都道府県にわたっても、事務所の所在地を管轄する都道府県知事(または指定登録機関)に1か所行えばよい。","正しい。建築士事務所の開設者は、設計等の業務に関し生じた損害を賠償するための保険契約の締結その他の措置を講ずるよう努めなければならない。"],"2021-法規-24":["誤り。帳簿・図書の保存義務は、建築物の規模にかかわらず、事務所が設計・工事監理を行ったすべての建築物が対象で、確認済証が必要なものに限られない。","正しい。保存が義務付けられる図書は、配置図、各階平面図、構造詳細図等の設計図書と工事監理報告書などである。","正しい。保存が義務付けられる帳簿の記載事項には、業務の概要、報酬の額、業務に従事した建築士の氏名などがある。","正しい。帳簿・図書の保存義務に違反した開設者は、戒告、1年以内の事務所閉鎖命令、事務所登録の取消しの処分を受けることがある。"],"2021-法規-25":["正しい。用途地域等が定められている開発区域では、工事完了公告後に予定建築物以外を建築しても、法第42条の制限が及ばず、都道府県知事の許可は不要である。","正しい。市街化調整区域の開発許可を受けた区域以外では、仮設建築物の新築は許可不要の例外に当たる。","誤り。市街地開発事業等予定区域内でも、木造平家建ての附属車庫の建築のような政令で定める軽易な行為は許可が不要で、原則として許可を要するという記述は誤り。","正しい。博物館法に規定する博物館は公益上必要な建築物に当たり、その建築目的の開発行為は準都市計画区域内でも開発許可が不要である。"],"2021-法規-26":["正しい。図書館の屋内消火栓設備は、耐火構造かつ内装を準不燃材料とすると基準面積が3倍に緩和される。延べ2,000m2は緩和後の基準に満たず、設置不要である。","正しい。大学のような特定防火対象物でない用途は、避難口誘導灯の設置が地階・無窓階・11階以上の部分に限られる。無窓階を有しない地上8階建ては設置不要。","誤り。ガス漏れ火災警報設備は、特定防火対象物の地階で床面積の合計が1,000m2以上の場合に必要である。900m2では設置義務は生じない。","正しい。ホテルは特定防火対象物であり、既存の建築物であっても、消防用設備等の技術上の基準が遡及して新築の場合と同様に適用される。"],"2021-法規-27":["誤り。既存建築物の増築では、増築部分の床面積が2,000m2以上の場合に基準適合義務が生じる。増築が500m2では、既存部分と合わせても義務の対象とならない。","正しい。建築主等は、エレベーターの修繕時にも建築物移動等円滑化基準に適合させるための措置を講ずるよう努めなければならない。","正しい。当時の基準では、ホテルの客室が一定数以上の場合は総数の1/100以上(端数切上げ)の車椅子使用者用客室が必要で、150室では2室以上となる。","正しい。地方公共団体が条例で付加した基準は、建築基準法に規定する建築基準関係規定とみなされ、確認の審査対象となる。"],"2021-法規-28":["誤り。低炭素建築物の認定基準に適合させるための措置により増える部分は、延べ面積の1/20を限度に容積率算定の延べ面積から除かれる。1/10とする記述は誤り。","正しい。年間150戸以上の請負型規格住宅を供給する特定建設工事業者は、一層の省エネ性能の基準に適合させる努力義務がある。300戸はこれに該当する。","正しい。耐震改修促進法では、要安全確認計画記載建築物等以外の既存耐震不適格建築物の所有者にも、耐震診断と必要な耐震改修を行う努力義務がある。","正しい。品確法では、構造耐力上主要な部分等の瑕疵担保責任の期間は引渡しから10年が原則で、特約により20年まで延長できる。"],"2021-法規-29":["正しい。設計受託契約の締結前に、建築士の氏名、報酬、契約解除に関する事項等を記載した書面に署名して、相互に交付する(建築士法)。","誤り。第一種中高層住居専用地域では、2階以下かつ500m2以内の店舗等は許可なしで建築できる。※要確認:本肢のように許可を受ける前提の判断が不適合とされる理由は、問題文からは特定できない。","正しい。共同住宅の2階以上の各階に直通階段を二つ設け、物販店舗の屋外出口の幅の合計を100m2につき60cm以上(400m2で240cm)とする条件は、300cmで満たす。","正しい。共同住宅と物販店舗を、耐火構造の床・壁で区画し、開口部に特定防火設備を設けることは、異種用途区画の基準に適合する。"],"2021-法規-30":["正しい。建設リサイクル法では、対象建設工事のうち解体工事は床面積80m2以上が対象で、着手の7日前までに都道府県知事への届出が必要である。","正しい。開発区域が1ha未満の開発行為の設計図書は、実務経験2年以上などの資格がなくても作成できる。資格が必要なのは1ha以上の場合である。","誤り。土砂災害特別警戒区域で許可が必要な特定開発行為は、住宅宅地分譲等と要配慮者施設の開発である。自己居住用住宅の開発行為は許可の対象外である。","正しい。宅建業者は、新築住宅などの工事完了前は、確認等の処分があった後でなければ広告・契約・媒介をしてはならない。"],"2020-法規-1":["正しい。港湾法第40条第1項、特定都市河川浸水被害対策法第8条などは、建築基準法施行令第9条に列挙された建築基準関係規定に該当し、確認審査の対象となる。","正しい。通常の火災による火熱が加えられた場合に、加熱開始後1時間加熱面以外の面に火炎を出さない防火設備で、大臣認定を受けたものが特定防火設備である。","誤り。外壁以外の主要構造部については、耐火構造のほか「当該建築物において発生する通常の火災」が終了するまで耐える構造とされる。「建築物の周囲において発生する火災」は外壁に関する基準であり、混同している。","正しい。構造耐力上主要な部分には、基礎、基礎ぐい、壁、柱、小屋組、土台、斜材、床版、屋根版、横架材のうち、自重・積載荷重等を支えるものが含まれ、最下階の床版も該当する。"],"2020-法規-2":["正しい。屋上部分の階段室等は、水平投影面積が建築面積の1/8以下であれば高さや階数には算入しないが、床面積は延べ面積に算入する。","正しい。日影規制における軒の高さの算定では、周囲の地面と接する位置の高低差が3mを超える場合、高低差3m以内ごとの平均の高さにおける水平面を地盤面とする。","誤り。隣地斜線制限の緩和では、敷地の地盤面が隣地より1m以上低い場合、高低差から1mを引いた値の1/2だけ高い位置にあるものとみなす。高低差そのものの1/2ではない。","正しい。吹抜けや斜面地などで部分によって階数が異なる場合は、これらの階数のうち最大のものを建築物の階数とする。"],"2020-法規-3":["誤り。既存建築物でも昇降機（エレベーター）を設置する場合は建築設備の設置として確認済証の交付が必要となり、規模が小さくても不要とはならない。","誤り。博物館から図書館への用途変更は、延べ面積が200m²を超える特殊建築物の用途変更であり、用途制限（法第48条）との関係もあるため、確認済証の交付が必要となる扱いである。","誤り。原動機を使用するメリーゴーランドなど回転運動をする遊戯施設の築造は、工作物として建築基準法第88条により確認済証の交付が必要である。","正しい。木造2階以下・延べ面積500m²以下・高さ13m以下・軒高9m以下のいわゆる4号建築物の大規模の修繕は、確認申請が不要である。本設問の集会場は延べ150m²で特殊建築物の規模にも当たらない。"],"2020-法規-4":["正しい。ガラスの取替えは大規模の修繕・模様替に当たらないため、工事中に建築物を使用する場合の安全措置に関する計画を特定行政庁へ届け出る必要はない。","正しい。エレベーターは規模にかかわらず定期検査報告の対象であり、所有者（管理者）は有資格者に検査させ、その結果を特定行政庁に報告しなければならない。","正しい。高さが減少する変更で、変更後も建築基準関係規定に適合することが明らかなものは、規則で定める軽微な変更に該当し、あらためて確認済証の交付を受ける必要はない。","誤り。鉄骨造・延べ面積200m²・平家建ての飲食店は、特殊建築物の規模（200m²超）に達せず、いわゆる4号建築物に当たるため、検査済証の交付前でも使用できる。検査済証交付前使用の制限は対象外である。"],"2020-法規-5":["誤り。直階段の踏面・踊場等の寸法規定を満たすために必要な水平長さに足りず、建築基準法に適合する最小値とはならない（図の条件から算定した必要寸法を下回る）。","正しい。居室の床面積が200m²を超える階の階段として、蹴上げ・踏面（蹴上げ20cm以下、踏面24cm以上）や踊場の規定を満たすために必要な最小の水平長さである。","誤り。必要寸法は満たすが、適合する最小のものではない。より小さい値で法の基準を満たすため、「最小」を問う設問の答えにはならない。","誤り。必要寸法は満たすが、適合する最小のものではない。より小さい値で法の基準を満たすため、「最小」を問う設問の答えにはならない。"],"2020-法規-6":["正しい。避難階から3階以上に通ずる階段部分の竪穴区画に用いる防火設備は、避難上及び防火上支障のない遮煙性能を有するものとしなければならない。","誤り。主要構造部が耐火構造で、階数が3以下かつ床面積の合計が200m²以内の住戸については、住戸内の階段部分の竪穴区画は適用除外となる。したがって区画は不要である。","正しい。防火区画に接する外壁では、外壁面から50cm以上突出した準耐火構造のひさし・床・袖壁等で防火上有効に遮られている場合、幅90cm以上の外壁部分を準耐火構造としなくてもよい。","正しい。学校、病院、共同住宅等の防火上主要な間仕切壁は、原則として準耐火構造とし、小屋裏又は天井裏に達せしめなければならない（強化天井等の場合を除く）。"],"2020-法規-7":["正しい。主要構造部を耐火構造とした物品販売業の店舗で、避難階以外の階に売場があり床面積の合計が1,500m²を超えるものは、2以上の直通階段の設置が必要となる。","誤り。主要構造部が耐火構造の共同住宅の歩行距離は原則50m以下で、15階以上の居室では10m減じて40m以下、内装を準不燃材料とすれば10m緩和され50m以下となる。60m以下ではない。","正しい。共同住宅の居室の床面積の合計が所定の面積を超える階では、2以上の直通階段が必要である。本設問では1階当たり居室面積が大きく、バルコニーがあっても2以上の直通階段が求められる。","正しい。メゾネット形式の住戸で出入口のない階については、歩行距離を40m以下とする特例があり、出入口のある階以外の居室ではこの値が適用される。"],"2020-法規-8":["誤り（適合しない）。避難安全検証法で適用除外とされるのは付室の設置など一部の規定に限られ、特別避難階段の階段室について、付室に面する部分以外に屋内に面して開口部を設けない構造の規定は除外されない。","正しい（適合する）。階避難安全検証法により階避難安全性能が確かめられた階では、特別避難階段の階段室と屋内を連絡するバルコニー又は付室の設置規定が適用除外となる。","正しい（適合する）。階避難安全検証法で階避難安全性能が確かめられた階については、排煙設備の設置規定が適用除外となるため、排煙設備を設けなくてもよい。","正しい（適合する）。物品販売業を営む店舗における避難階段の幅は、直上階以上の床面積に応じて算定され、本設問の600m²の階に対し合計3.6mは必要幅員を満たしている。"],"2020-法規-9":["正しい。自動車車庫は内装制限の対象となる特殊建築物で、耐火・準耐火建築物以外では所定規模以上のものに、壁及び天井の室内面を準不燃材料等で仕上げる規定が適用される。","正しい。共同住宅の住戸のほか、採光上有効に直接外気に開放された廊下・階段は、非常用の照明装置の設置が免除される。","誤り。特別避難階段の階段室及びバルコニー又は付室の面積に関する規定は、15階以上や地下3階以下の階に関して、居室の床面積に対する所定の割合を確保する形で定められている。設問の算定方法・数値は規定に合致しない。","正しい。幅75cm以上、高さ1.2m以上の格子等のない窓を、道又は幅員4m以上の通路に面する外壁に10m以内ごとに設けた場合、非常用の進入口は不要である。"],"2020-法規-10":["正しい。高さ31mを超える部分が全て機械室等の場合は、非常用の昇降機の設置義務が適用除外となる。","誤り。換気設備の設置が免除される調理室等には所定の要件（用途・規模・燃焼器具の種類等）があり、事務所の調理室に設けたこんろは、換気上有効な開口部があるだけでは免除されず、換気設備が必要となる。","正しい。乗用・寝台用以外のエレベーターで、安全上支障がないものとして大臣が定めた構造方法を用いる場合は、昇降路の出入口の床先と籠の床先との水平距離が4cmを超えてもよい。","正しい。地階を除く階数が11以上の建築物の屋上冷却塔設備は、防火上支障がないものとして大臣が定めた構造方法を用いる場合、不燃材料以外の材料で造ることができる。"],"2020-法規-11":["正しい。保有水平耐力計算によって安全性を確かめる場合は、柱の主筋断面積の和をコンクリート断面積の0.8%以上とする規定は適用除外となる。","正しい。許容応力度等計算を行う場合、国土交通大臣が定める場合には、変形又は振動によって使用上の支障が起こらないことを所定の方法で確かめなければならない。","正しい。基礎の垂直荷重による圧縮力の計算では、支える床の数に応じて積載荷重を低減できる。事務室で床数が7の場合、1,800N/m²に0.7を乗じた約1,260N/m²以上の値であれば採用できる。","誤り。限界耐力計算による場合、鋼材の圧縮材の有効細長比については、設問の数値のとおりではなく、規定に合致しない（許容応力度計算等とは扱いが異なる）。上限値は設問より小さい値で定められている。"],"2020-法規-12":["誤り。基準時の延べ面積800m²に対し増築が50m²では、1/20（40m²）を超えるため、増築部分が現行規定に適合するだけでは足りない。既存部分も耐久性等関係規定への適合など所定の構造方法とする必要がある。","正しい。増築面積が基準時の延べ面積の1/2（400m²）以下であれば、増築後の建築物が耐久性等関係規定に適合し、所定の基準に適合する構造とすることで既存部分に現行の構造耐力規定は適用されない。","正しい。既存不適格建築物に対する制限の緩和を受ける場合、確認申請書には基準時及びその状況に関する事項を明示した既存不適格調書を添える必要がある。","正しい。大規模の修繕（柱の過半の修繕等）を行う場合でも、構造耐力上の危険性が増大しない修繕であれば、現行の構造耐力規定は適用されない。"],"2020-法規-13":["誤り。高さ60m超の建築物の構造計算は大臣認定を受けるもので、構造計算適合性判定の対象にはならない。","誤り。高さ20m以下の鉄筋コンクリート造で許容応力度計算（ルート1）を行うものは、構造計算適合性判定の対象とならない。","誤り。許容応力度等計算を行う場合でも、特定建築基準適合判定資格者である建築主事が審査するものは、適合性判定の対象から除かれる。","正しい。保有水平耐力計算又はこれと同等以上の構造計算（ルート3）によるものは、構造計算適合性判定の対象となる。"],"2020-法規-14":["正しい。道路法による道路でも、地下におけるものは建築基準法上の道路に該当しない。","誤り。道路内の建築制限の規定では、地盤面下に設ける建築物は特定行政庁の許可なく建築できる例外とされており、許可を受ける必要はない。","正しい。高架の道路の路面下に建築物を建築する場合は、原則として特定行政庁の許可（又は所定の基準）が必要となる。","正しい。特定道路は幅員15m以上の道路をいうので、15m未満の道路は特定道路にならない。"],"2020-法規-15":["誤り。第二種低層住居専用地域では附属自動車車庫の床面積が600m²以下かつ他の部分の床面積の合計以下などの制限があるが、本設問では車庫が600m²で全体の1/2を超え、建築できない。","正しい。第二種住居地域では、用途の種類・規模の制限を満たす範囲で建築が認められる。設問の用途・規模は当該地域の制限内にあり、新築することができる。","正しい。幼保連携型認定こども園は、工業地域でも建築することができる。","正しい。診療所は工業専用地域でも建築できる用途である。"],"2020-法規-16":["誤り。準耐火建築物の建蔽率の緩和などを考慮して算定した最大建築面積に満たず、最大値ではない。","誤り。準耐火建築物の建蔽率の緩和などを考慮して算定した最大建築面積に満たず、最大値ではない。","正しい。図の敷地条件から、建蔽率の緩和（準耐火建築物等による加算、角地の緩和等）を考慮して算定した建築面積の最大値である。","誤り。算定される最大建築面積を超えており、建蔽率の制限により建築できない。"],"2020-法規-17":["誤り。道路斜線・隣地斜線等の各制限を図の条件で算定した最高限度に満たず、最大値ではない。","誤り。道路斜線・隣地斜線等の各制限を図の条件で算定した最高限度に満たず、最大値ではない。","誤り。各斜線制限の算定値に満たず、A点における高さの最高限度ではない。","正しい。図の敷地条件から、道路斜線制限・隣地斜線制限等のうち厳しい方を算定した結果、A点における高さの最高限度は36.0mとなる。"],"2020-法規-18":["誤り。準防火地域内で延べ面積が500m²以下の平家建ては、耐火建築物等・準耐火建築物等とする義務はなく、防火上の技術的基準に適合する構造とすればよい。","正しい。防火地域内では、階数が3以上又は延べ面積が100m²を超えるものは耐火建築物等とし、それ以外は準耐火建築物等以上とする必要がある。2階建て80m²は準耐火建築物等でよいので適合する。","正しい。防火地域内で建築物の屋上に設ける広告塔・看板等は、高さにかかわらず主要な部分を不燃材料で造るか覆わなければならない。","正しい。建築物が防火地域と指定のない区域にわたる場合、防火壁で区画されていれば、防火地域外の部分には防火地域内の規定は適用されない。"],"2020-法規-19":["正しい。住宅・学校・病院等の居室の採光は、用途地域等の区分に応じて算定した採光補正係数を用いて有効面積を算定するのが原則である。","誤り。一団地の総合的設計による特例では、一団地を一の敷地とみなして適用する規定は容積率・建蔽率・斜線制限等であり、用途地域等の規定（法第48条）は含まれない。","正しい。壁面線の指定があっても、特定行政庁が建築審査会の同意を得て許可した歩廊の柱その他これに類するものは、壁面線を越えて建築できる。","正しい。用途変更で工事を伴う場合は、新築の場合に準じて工事完了後の検査の手続が適用され、確認済証を指定確認検査機関から受けた場合でも所定の届出が必要である。"],"2020-法規-20":["正しい。共同住宅の地階の居室など、一定の居室については、採光に有効な開口部の面積の規定の適用が緩和される場合がある。","正しい。階段の幅が3mを超える場合は中間に手すりが必要であるが、蹴上げ15cm以下かつ踏面30cm以上のものは、中間の手すりを設けなくてもよい。","誤り。非常用エレベーターを設置している建築物については、非常用の進入口の設置が免除されている。3階以上の階でも、必ず設けなければならないわけではない。","正しい。地方公共団体は、条例で、共同住宅など特殊建築物の規模により、敷地・構造・建築設備に関する安全上、防火上、衛生上必要な制限を附加できる。"],"2020-法規-21":["正しい。工事監理を行う一級建築士は、請求があれば免許証等を提示し、工事監理を終了したときは直ちにその結果を書面（工事監理報告書）で建築主に報告しなければならない。","誤り。工事が設計図書のとおり実施されていないと認めるときは、工事施工者に指摘して是正を求め、従わない場合はその旨を建築主に報告する。報告先は特定行政庁ではない。","正しい。構造設計一級建築士は、一級建築士としての定期講習に加え、構造設計一級建築士定期講習も受講しなければならない。","正しい。設備設計一級建築士は一級建築士でもあるので、設備設計以外の設計を含めた建築物の設計を行うことができる。"],"2020-法規-22":["正しい。建築士事務所の開設者は、配置図、各階平面図等の設計図書及び工事監理報告書を作成した日から15年間保存しなければならない。","正しい。管理建築士は、建築士事務所の規模にかかわらず、当該事務所に専任でなければならない。","正しい。延べ面積が300m²を超える建築物の設計受託契約を締結したときは、他の事務所の開設者から受託した場合を含め、遅滞なく所定事項を記載した書面を交付しなければならない。","誤り。設計図書への記名押印は設計を行った建築士が行うものであり、管理建築士が別途「管理建築士」である旨を表示して記名押印することまでは義務づけられていない。"],"2020-法規-23":["正しい。建築士会は、建築士の品位の保持及び業務の進歩改善に資するため、建築士に対し、業務に必要な知識及び技能の向上を図るための建築技術に関する研修を実施することとされている。","正しい。建築士事務所協会は、建築主等から苦情の解決の申出があったときは、相談に応じ、助言し、事情を調査するとともに、開設者に通知して迅速な処理を求めなければならない。","誤り。設計図書の保存をしなかった場合や、業務実績書類を閲覧させなかった場合には、過料ではなく罰金に処される（10万円以下の過料との記述は不適当）。","正しい。建築士事務所の開設者が建築士免許を取り消されたときは、当該事務所の登録は取り消される。"],"2020-法規-24":["誤り。仮設建築物の建築は、地区計画の区域内の届出が不要とされる行為に当たるので、30日前までに市町村長へ届け出る必要はない。","正しい。市街地開発事業の施行区域内で建築物の建築を行おうとする者は、原則として都道府県知事等の許可を受けなければならない。鉄骨造は容易に移転・除却できるものとはいえず許可が必要である。","正しい。市街化調整区域内でも、地区計画に適合する開発行為は、所定の要件に該当すれば開発許可を受けることができる。","正しい。開発区域が1ha以上の場合の設計図書は、一級建築士で宅地開発に関する技術について所定の実務経験（2年以上）を有する者が作成することができる。"],"2020-法規-25":["正しい。複合用途防火対象物で特定用途（飲食店）を含む場合、収容人員が合計30人以上であれば防火管理者を定めなければならない。収容人員は合計40人で該当する。","誤り。防火対象物を別の防火対象物とみなす区画は、開口部のない耐火構造の床又は壁によるものに限られる。準耐火構造の床・壁による区画では別の防火対象物とみなされない。","正しい。図書館は延べ面積150m²以上のものについて消火器又は簡易消火用具の設置が必要であり、延べ面積300m²はこれに該当する。","正しい。耐火構造で内装を準不燃材料とした場合、屋内消火栓設備の設置基準面積は3倍に緩和される。展示場の基準面積700m²の3倍は2,100m²で、2,000m²は設置不要である。"],"2020-法規-26":["正しい。移動等円滑化の措置で通常の床面積を超える部分は、認定特定建築物の延べ面積の1/10を限度に容積率算定の延べ面積に算入しない特例がある。","正しい。既存の特定建築物に車椅子使用者用エレベーターを設ける場合、所定の基準に適合し所管行政庁が防火上・避難上支障なしと認めれば、その構造は耐火構造とみなされる。","正しい。特別特定建築物以外の特定建築物については、建築主等は建築物移動等円滑化基準に適合させるための措置を講ずる努力義務を負う（適合義務は特別特定建築物）。","誤り。誘導基準では、多数の者が利用する主たる階段は回り階段以外とするのが原則で、空間確保が困難でも回り階段としてよいという例外は設けられていない。"],"2020-法規-27":["正しい。一戸建て住宅から旅館への用途変更では、技術的基準に従った警報設備を設けることで、主要構造部を耐火構造とする規定の適用が緩和される。","正しい。住宅から物品販売業の店舗への用途変更は特殊建築物への変更だが、床面積200m²以下なら確認済証の交付は不要である。基準への適合は必要。","誤り。全体計画の認定を受けた場合でも、緩和されるのは途中の工事の段階までであり、最後の工事完了時には現行基準（排煙設備）に適合させる必要がある。","正しい。国際的規模の競技会用の特別興行場等は、特定行政庁の許可を受ければ、法第21条・第27条等の規制を受けず一年を超えて使用できる特例がある。"],"2020-法規-28":["正しい。時刻歴応答解析を行う場合を除き、許容応力度等計算、保有水平耐力計算、限界耐力計算等のいずれかにより自重・積載荷重・地震等に対する安全性を確かめる。","正しい。柱・はりは、耐火構造とする場合を除き、通常火災終了時間・特定避難時間のうち長い方(ここでは75分)の火熱に対し構造耐力上支障のある損傷を生じない性能が必要である。","誤り。構造・設備の法適合確認は、構造設計一級建築士や設備設計一級建築士が設計に関与する場合など一律には求められず、記述のように常に双方へ確認を求めるとする点が不適当。","正しい。所有者等は建築物を常時適法な状態に維持するよう努め、特定建築物等は定期に資格者に調査させ、その結果を特定行政庁へ報告する義務がある。"],"2020-法規-29":["誤り。景観計画区域内で外観を変更する行為は、あらかじめ景観行政団体の長への「届出」が必要であり、許可制ではない（条例で別途定める場合を除く）。","正しい。労働安全衛生法令上、高さ5m以上のコンクリート造の工作物の解体等の作業には、コンクリート造の工作物の解体等作業主任者の選任が必要である。","正しい。建設リサイクル法により、解体工事業を営むには、建設業許可(土木・建築・解体)がある場合を除き、営業区域を管轄する都道府県知事の登録が必要である。","正しい。石綿障害予防規則により、事業者は建築物の解体作業前に、石綿等の使用の有無を目視・設計図書等で調査し、その結果を記録しておかなければならない。"],"2020-法規-30":["正しい。設計住宅性能評価書の写しを請負契約書に添付した場合、その表示された性能を有する住宅を建設することを契約したものとみなされる（住宅品質確保法）。","正しい。特定建築物以外で300m²以上の新築等の届出に併せ、登録判定機関によるエネルギー消費性能の評価結果を記載した書面を提出することができる。","正しい。宅建業者は既存建物の売買等で、契約成立までに宅地建物取引士をして、建物状況調査の結果の概要等を記載した書面を交付し説明させなければならない。","誤り。盛土のみの宅地造成で許可が必要となるのは、高さ1m超の崖を生ずる盛土、または面積500m²超の盛土等である。高さ1m・面積500m²ちょうどは該当せず許可不要。"],"2019-法規-1":["正しい。外壁に必要とされる、周囲の通常火災による延焼の抑制に一定の効果を発揮する性能を「準防火性能」という（法第23条関連）。","正しい。防煙壁は、天井面から50cm以上下方に突出した垂れ壁その他これらと同等以上に煙の流動を妨げる効力のある不燃材料でつくり又は覆ったものをいう。","正しい。プログラムとは、電子計算機に対する指令で、一の結果を得ることができるように組み合わされたものをいう（法第2条）。","誤り。大規模の修繕は主要構造部の一種以上の過半の修繕をいう。土台は主要構造部（壁・柱・床・はり・屋根・階段）に含まれず、その過半の修繕は該当しない。"],"2019-法規-2":["正しい。壁面線の指定がある場合の許可により容積率算定で道路境界線が壁面線にあるとみなす場合、道路と壁面線の間の部分の面積は敷地面積に算入しない。","誤り。後退距離の算定の特例によるポーチ等の高さは、前面道路の路面の中心からの高さで算定する。敷地との高低差があっても地盤面からの高さとする点が誤り。","正しい。階段室等の屋上部分が建築面積の1/8以内でも、北側斜線(高度地区の北側高さ制限を含む)の高さ算定ではその部分も建築物の高さに算入する。","正しい。地階の倉庫・機械室等は水平投影面積が建築面積の1/8以下なら階数不算入だが、防災センターはこれに類する用途と扱われず、階数に算入される。"],"2019-法規-3":["正しい。屋根の過半の修繕は大規模の修繕に当たり、鉄骨造平家で延べ面積200m²を超える建築物は確認が必要である（法第6条第1項第3号）。","正しい。工事現場外に設ける仮設事務所は、現場に設ける場合の適用除外（法第85条第2項）の対象外であり、新築には確認済証が必要である。","正しい。防火・準防火地域外で増築部分の床面積が10m²を超える場合は確認が必要であり、15m²の増築は確認済証の交付を要する。","誤り（確認不要が正答）。患者収容施設のある診療所と有料老人ホーム等（児童福祉施設等）は類似の用途であり、用途変更の確認は不要となるため、確認済証は必要ない。"],"2019-法規-4":["正しい。指定確認検査機関が安全上・防火上・避難上支障がないと認めれば、検査済証交付前でも仮使用できる（仮使用承認の特例）。","正しい。特定行政庁が指定する特殊建築物（事務所等を含む）の所有者等は、定期に資格者に敷地・構造・建築設備を調査させ、特定行政庁へ報告する義務がある。","誤り。用途変更の確認を受けた場合、工事完了検査（法第7条・第7条の2）の規定は用途変更には準用されず、完了検査の申請は不要である。","正しい。避難施設等に関する工事中の建築物を使用する場合、仮使用の認定と、安全上等の措置計画の特定行政庁への届出が必要である（法第90条の3）。"],"2019-法規-5":["正しい。昇降機機械室用階段の蹴上げは23cm以下、踏面は15cm以上とされており、23cmとすることができる。","正しい。階段・踊場の幅の算定で、高さ50cm以上の手すりの幅は10cmを限度として、ないものとみなして算定できる。","正しい。石綿添加建築材料による既存不適格に対し、基準時延べ面積の1/2以内の増築をする場合、増築部分以外は石綿を被覆する等の措置が必要である。","誤り。天窓の採光補正係数は、算定値に3.0を乗じる別の扱いがあり、水平距離が4m以上で算定値が1.0未満なら1.0とする旨の記述は天窓には当てはまらない。"],"2019-法規-6":["正しい。11階以上の部分は、スプリンクラー設備等がない場合、原則として床面積の合計100m²以内ごとに防火区画が必要で、15階の300m²は該当する。","誤り。自動車車庫は床面積が150m²以上で法第27条等の対象となる。130m²の車庫と事務所部分の区画を一律に求める規定はなく、区画は必要とされない。","正しい。準耐火建築物で3階以上に居室を有する場合、吹抜きなどの竪穴部分とその他の部分は、原則として防火区画しなければならない。","正しい。防火区画に用いる特定防火設備は、常時閉鎖又は作動した状態にあるか、随時閉鎖又は作動できるものとしなければならない。"],"2019-法規-7":["正しい。耐火建築物の火気使用室（調理室）の壁・天井の内装は、準不燃材料とすればよいため、適合する。","正しい。住宅は、主要構造部を耐火構造とした場合には火気使用室の内装制限の対象外となるため、制限材料以外の仕上げでも適合する。","誤り（不適合が正答）。非常用エレベーターの乗降ロビーの内装は、仕上げ・下地とも不燃材料としなければならず、準不燃材料では適合しない。","正しい。地階に設ける特殊建築物の居室及びこれに通ずる廊下・階段等の内装は、準不燃材料とすればよい。"],"2019-法規-8":["正しい。耐火建築物の歩行距離は50m以下、準不燃の内装とした場合は10m緩和される。階段から屋外出口までの40mはこの範囲内で適合する。","誤り。物品販売店の避難階の屋外出口の幅の合計は、床面積100m²につき60cm以上で、最大階700m²では4.2m必要となる。4mでは不足する。","正しい。耐火建築物の共同住宅で、各階の居室の床面積の合計が200m²以下であれば、2以上の直通階段の設置は不要である。","正しい。2階以上の階にあるバルコニーその他これに類するものの周囲には、高さ1.1m以上の手すり壁・さく・金網を設けなければならない。"],"2019-法規-9":["誤り。準不燃材料の要件は加熱開始後10分間の性能だが、外部の仕上げに用いるものは避難上有害な煙・ガスの発生に関する要件は適用されない。","正しい。耐火構造で延べ面積が大きい建築物の敷地内には、屋外避難階段等から道等に通ずる幅員1.5m以上の通路が必要である（令第128条）。","正しい。ホテルの客室等を100m²以内ごとに耐火構造の床・壁と防火設備で区画した場合、排煙設備を設けなくてよい。","正しい。防火地域内の建築物の屋上に設ける看板等は、高さにかかわらず、主要な部分を不燃材料でつくり又は覆わなければならない。"],"2019-法規-10":["正しい。エレベーターには、駆動装置・制御器の故障で戸が閉じる前にかごが昇降した場合に、自動的にかごを制止する装置を設ける必要がある。","正しい。防火区画を貫通する給水管等は、貫通部分及びその両側1m以内の部分を不燃材料でつくる必要がある。","正しい。排煙口には手動開放装置を設け、煙感知器連動の自動開放装置又は遠隔操作方式の開放装置を設けることができる。","誤り（不適合が正答）。エスカレーターの踏段の積載荷重は、踏段面の水平投影面積1m²につき2,600Nで計算し、9m²では23.4kNとなる。18kNでは不足である。"],"2019-法規-11":["誤り。屋外に面する帳壁は、高さや計算ルートにかかわらず、構造計算により風圧に対して構造耐力上安全であることを確かめなければならない。","正しい。地震力の計算に用いる積載荷重は、学校のバルコニーなど室の種類に応じて令第85条の表の値による。記述の1,300N/m²はその値に合致する。","正しい。地下部分の地震力は、振動性状を適切に評価できる場合、その計算によることができる（令第88条）。","正しい。エキスパンションジョイント等で相互に応力を伝えない構造方法のみで接する部分は、それぞれの部分ごとに必要な構造計算の方法によることができる。"],"2019-法規-12":["正しい。コンクリートの四週圧縮強度は12N/mm²以上（軽量骨材使用の場合は9N/mm²以上）とされている（令第74条）。","誤り。柱の主筋と帯筋の取扱いに関する記述は令第77条の規定に合致せず、記述が不適当とされる。※要確認（出題趣旨の詳細が文面から特定困難）","正しい。鉄骨造の構造耐力上主要な部分の材料は、炭素鋼、ステンレス鋼又は鋳鉄としなければならない（令第64条）。","正しい。高力ボルト・ボルト・リベットの相互間の中心距離は、その径の2.5倍以上としなければならない（令第68条）。"],"2019-法規-13":["誤り。軸組の必要長さは、床面積に乗ずる係数（軽い屋根・3階建て1階）と見付面積に乗ずる係数を比較し大きい方に、軟弱地盤の割増1.5倍を行って求める。この値は正しい長さに当たらない。","誤り。図の寸法に基づく必要軸組長さの計算結果と一致せず、正しい長さには当たらない。","正しい。図の寸法から求めた必要長さに、軟弱地盤の指定区域内の割増（1.5倍）を考慮した結果が2,415cmとなり、これが正しい値である。","誤り。軸組の必要長さの計算結果と一致せず、過大な値であるため正しい長さには当たらない。"],"2019-法規-14":["正しい。地区整備計画で建築物等の敷地として併せて利用すべき区域内の道路上空は、地区計画に適合し支障がないと認められる建築物を建築できる（法第44条第1項第3号）。","正しい。道路に該当しない幅員4m以上の農道等に2m以上接する敷地で、特定行政庁が支障がないと認めれば、建築が可能である（法第43条第2項）。","正しい。都市計画法等による新設・変更の事業計画のある幅員4m以上の道路で、2年以内に執行予定として特定行政庁が指定したものは法上の道路である。","誤り。袋路状道路の位置指定は、延長35m以下であれば幅員4m以上で足り、6m以上とする必要はない（令第144条の4）。6m以上かつ35m以下とする記述が誤り。"],"2019-法規-15":["誤り。第一種低層住居専用地域内の兼用住宅は、非住宅部分の床面積が50m²以下かつ延べ面積の1/2未満の場合に限る。喫茶店部分が60m²では建築できない。","正しい。田園住居地域では、地域で生産された農産物を材料とする飲食店で、床面積500m²以内のものは建築できる。","正しい。準工業地域では、自動車充填用の圧縮天然ガスに係る圧縮ガスの製造工場は、記述の規模で新築することができる。","正しい。工業地域には、展示場を規模の上限なく建築することができる。"],"2019-法規-16":["誤り。容積率の最高限度は、指定容積率と前面道路幅員による制限のうち小さい方で、加重平均も考慮して求める。この値は図の条件による結果と一致しない。","正しい。用途地域ごとの指定容積率と、前面道路幅員×法定乗数による制限を比較し、敷地面積で加重平均して求めた結果が40/10となる。","誤り。容積率の計算結果と一致しない値であり、最高限度とはならない。","誤り。容積率の計算結果を上回る値であり、前面道路幅員等による制限を超えるため、最高限度とはならない。"],"2019-法規-17":["誤り。A点の高さの最高限度は、道路斜線・隣地斜線・北側斜線等のうち最も厳しいものとなる。この値は図の条件で求めた結果と一致しない。","誤り。各斜線制限から求めた最高限度と一致せず、正しい値ではない。","誤り。各斜線制限から求めた最高限度と一致せず、正しい値ではない。","正しい。A点における道路斜線・隣地斜線・北側斜線等による高さを比較し、最も厳しい制限から求めた値が36.0mとなり、これが最高限度である。"],"2019-法規-18":["正しい。地区整備計画等で条例により定められる制限は、用途・容積率・高さ・壁面位置・敷地面積等であり、附属する高さ2m以内の門又は塀の位置の制限は含まれない。","正しい。再開発等促進区の地区整備計画区域内では、特定行政庁が支障がないと認めて許可した建築物は、道路高さ制限・隣地高さ制限・北側高さ制限が適用されない。","誤り。建築協定は、市町村の条例により、都市計画区域及び準都市計画区域外の区域でも定めることができる。","正しい。借地権の目的となっている土地がある場合は、その借地権を有する者も土地の所有者とみなされ、その全員の合意が必要である。"],"2019-法規-19":["正しい。指定確認検査機関の処分に対する審査請求は、その処分に係る建築物について確認をする権限を有する建築主事が置かれた市町村又は都道府県の建築審査会に対して行う。","誤り。昇降機の昇降路部分や共同住宅等の共用廊下・階段部分は、床面積の1/3を限度とするのではなく、全て容積率算定の延べ面積に算入しない。","正しい。軟弱地盤の指定区域外の平家建ての木造住宅で足固めを使用した場合、柱の下部に土台を設けなくてもよい（令第42条）。","正しい。都市計画区域内の火葬場は、特定行政庁が都市計画審議会の議を経て敷地の位置が支障ないと認めて許可すれば、新築できる。"],"2019-法規-20":["正しい。耐火建築物のホテルで3階以上の部分が300m²以上の場合、居室から地上に通ずる主たる廊下等の内装は準不燃材料以上で足りる。","正しい。非常用昇降機を設けない既存不適格の建築物は、増築部分の床面積が基準時延べ面積の1/2を超えると現行基準が適用される。","誤り。敷地が二つの用途地域にわたる場合、面積の過半を占める第二種中高層住居専用地域（700m²）の規制が敷地全体に適用され、ホテルは建築できない。","正しい。重要文化財等であったものの原形の再現がやむを得ないと特定行政庁が建築審査会の同意を得て認めたものは、建築基準法令の規定が適用されない。"],"2019-法規-21":["正しい。建築士は、勤務先の変更等で業務の種別に変更があったときは、その日から30日以内に、住所地の都道府県知事を経由して国土交通大臣に届け出る必要がある。","誤り。設計図書とは、建築物の建築工事の実施のために必要な図面（現寸図その他これに類するものを除く）及び仕様書をいい、仕様書も含まれる。","正しい。大規模の修繕の設計は、修繕に係る部分の床面積（250m2）で規模を判断する。この規模の木造建築物の設計は木造建築士でも行える。","正しい。延べ面積300m2を超える建築物の新築では、設計の再委託を行う場合、再委託の概要や受託者の氏名等を契約時の書面に記載し、相互に交付しなければならない。"],"2019-法規-22":["正しい。他人の求めに応じ報酬を得て、設計・工事監理のほか建築物の調査・鑑定や法令に基づく手続の代理を業として行う場合も、建築士事務所の登録が必要である。","正しい。建築士事務所の登録は都道府県ごとに受けるが、登録を受けた事務所に属する建築士は、他の都道府県の区域でも業務を行うことができる。","正しい。開設者は、管理建築士が技術的事項に関して述べた意見を尊重しなければならない。管理建築士の意見の尊重は開設者の義務である。","誤り。延べ面積300m2を超える建築物の新築工事の設計・工事監理は、委託者の承諾があっても、一括して他の建築士事務所の開設者に再委託することはできない。"],"2019-法規-23":["誤り。管理建築士講習を修了した者は、その後新たに一級建築士の免許を受けて管理建築士になる場合でも、既に修了していれば改めて受講する必要はない。","正しい。建築士事務所に属する建築士は、設計や工事監理の業務に従事しているかどうかにかかわらず、3年以内ごとに定期講習を受けなければならない。","正しい。構造設計一級建築士証の交付申請は、一級建築士として5年以上構造設計の業務に従事した後、申請前1年以内に所定の講習課程を修了した者が行える。","正しい。設計等の業務に関する報告書には、所属する構造設計一級建築士が受けた定期講習のうち、直近のものを受けた年月日も記載しなければならない。"],"2019-法規-24":["正しい。都市計画施設の区域内の建築は原則として許可が必要である。階数2以下で地階がなく、容易に移転・除却できる木造等の建築物は許可基準に適合する。","誤り。仮設建築物の建築の用に供する目的で行う開発行為は、規模にかかわらず都市計画法上の開発許可を要しない。仮設興行場もこれに当たる。","正しい。市街化区域内の開発行為は、規模が1,000m2以上であれば原則として許可が必要である。病院用の5,000m2の開発行為は許可を要する。","正しい。地区整備計画が定められた地区計画区域内で、建築物の形態や色彩等を変更する行為は、着手の30日前までに市町村長への届出が必要である。"],"2019-法規-25":["正しい。キャバレーは特定防火対象物で、延べ面積300m2以上であれば自動火災報知設備の設置が必要である。350m2は該当する。","正しい。百貨店などの特定防火対象物は、既存の消防用設備等が新しい基準に適合しない場合でも、既存不適格の特例がなく、基準に適合させる必要がある。","誤り。学校は延べ面積700m2以上で屋内消火栓設備が必要だが、準耐火建築物で内装を難燃材料とした場合は基準が2倍となる。1,000m2では設置不要である。","正しい。特別養護老人ホームは、延焼抑制構造を有しない場合、延べ面積275m2以上でスプリンクラー設備が必要である。1,500m2は該当する。"],"2019-法規-26":["正しい。公衆便所は床面積50m2以上、公共用歩廊は2,000m2以上の新築で、いずれも建築物移動等円滑化基準への適合義務の対象となる。","正しい。不特定多数の者や高齢者・障害者等が利用する階段は、踏面の端部とその周囲との色の明度・色相・彩度の差により、段を容易に識別できるものとする。","正しい。移動等円滑化経路を構成する敷地内通路は、幅120cm以上とし、50m以内ごとに車椅子が転回できる場所を設けなければならない。","誤り。増築では、経路の一部が既存部分にある場合、その既存部分にも移動等円滑化経路の規定が適用される。増築部分に限った適用ではない。"],"2019-法規-27":["誤り。住宅の構造耐力上主要な部分等には、雨水の浸入を防止する部分のほか、雨水を排除するための排水管のうち屋根・外壁の内部又は屋内にある部分も含まれる。","正しい。要安全確認計画記載建築物の所有者は、耐震診断の結果、安全性の向上が必要と認められるときは、耐震改修を行うよう努めなければならない。","正しい。解体工事は床面積80m2以上が対象で、100m2はこれに当たる。発注者は工事着手の7日前までに都道府県知事へ届け出る。","正しい。石綿等が吹き付けられた耐火・準耐火建築物の石綿等の除去作業を行う仕事は、開始日の14日前までに労働基準監督署長への計画届が必要である。"],"2019-法規-28":["正しい。構造耐力規定に違反する設計を建築主が故意に指示し、建築士がそれに従って設計・工事監理を行った場合、建築主・建築士ともに罰則の対象となる。","正しい。事務所登録の期間が満了して更新を受けないまま、報酬を得て業として工事監理を行った建築士は、業務停止等の懲戒処分の対象となる。","誤り。所属建築士の氏名等の変更届を3月以内に行わなかった場合に罰則の対象となるのは開設者であり、管理建築士は対象とならない。","正しい。建築士事務所の開設者が自己の名義で他人に事務所の業務を営ませる、いわゆる名義貸しは禁止されており、罰則の対象となる。"],"2019-法規-29":["正しい。要緊急安全確認大規模建築物は、建築物の耐震改修の促進に関する法律で用いられている用語である。","正しい。災害危険区域は、建築基準法で地方公共団体が条例により指定し、住居の用に供する建築物の建築制限等を定める区域である。","誤り。土砂災害特別警戒区域は、土砂災害防止法の用語である。宅地造成等規制法の用語は宅地造成工事規制区域や造成宅地防災区域である。","正しい。特定防災街区整備地区は、密集市街地における防災街区の整備の促進に関する法律に基づき都市計画で定められる地区である。"],"2019-法規-30":["誤り。特定建築物以外の建築物の新築で、省エネ計画の届出が必要となるのは床面積の合計が300m2以上の場合である。2,000m2以上は適合義務の基準である。","正しい。長期優良住宅建築等計画の認定申請者は、所管行政庁に対し、建築基準関係規定への適合について建築主事の審査を受けるよう申し出ることができる。","正しい。景観計画区域内で建築等を行う者は、あらかじめ景観行政団体の長に届け出る。届出受理から30日を経過するまでは、原則として着手できない。","正しい。低炭素建築物新築等計画の認定を受けた者が、計画を変更しようとするときは、原則として所管行政庁の変更認定を受けなければならない。"],"2018-法規-1":["正しい。高架の工作物内に設ける事務所、店舗、倉庫等の施設は、建築基準法上の「建築物」に含まれる。","正しい。傾斜地などで敷地に高低差があり、地盤面から直接地上に出られる出入口が異なる高さに複数ある場合、避難階が複数となることがある。","誤り。遮炎性能とは、通常の火災時の火炎を有効に遮るために、外壁の開口部（防火設備）に必要とされる性能をいい、外壁そのものの性能ではない。","正しい。建築材料の品質規定の対象には、主要構造部以外のバルコニー等で、防火上重要なものとして国土交通大臣が定めるものも含まれる。"],"2018-法規-2":["正しい。エレベーターの昇降路の部分の床面積は、容積率算定の基礎となる延べ面積に算入しない。","誤り。屋上部分の高さの不算入の緩和は、北側高さ制限では適用範囲が他の場合より限定されており、本記述は不適当として扱われる。※要確認","正しい。日影規制の緩和で、敷地の平均地盤面が隣地より1m以上低い場合は、高低差から1mを減じた値の1/2だけ高い位置にあるものとみなす。","正しい。塔屋の水平投影面積が建築面積の1/8以下でも、物置のように昇降機塔や装飾塔等に類しない用途に供する部分は、階数に算入する。"],"2018-法規-3":["誤り。観覧場は特殊建築物だが、100m2ちょうどなら特殊建築物としては対象外である。ただし都市計画区域内の4号建築物の新築なので確認済証が必要である。確認済証が不要とはいえない。","誤り。エレベーターなどの建築設備を既存建築物に設ける場合は、建築確認が必要であり、型式部材等に該当しても確認は不要とならない。確認済証が不要とはいえない。","正しい。延べ面積200m2、平家建ての事務所は4号建築物であり、大規模の修繕に当たる屋根の過半の修繕でも、確認済証の交付は不要である。","誤り。共同住宅から寄宿舎への用途変更は類似の用途ではなく、床面積が100m2を超える特殊建築物への用途変更として確認が必要である。確認済証が不要とはいえない。"],"2018-法規-4":["誤り。工事中の安全措置計画の届出が必要なのは、大規模な修繕等で避難施設等に重大な影響を及ぼす工事の場合である。照明カバーの取替えのような軽微な工事は対象外である。","正しい。卸売市場は原則として都市計画で敷地の位置が決定していないと特定行政庁の許可が必要だが、延べ面積が一定規模以下の場合は許可を要しない。","正しい。昇降機がない自動車車庫は、延べ面積1,000m2、地上3階建て程度では、原則として定期報告の対象となる規模に当たらない。","正しい。用途変更の確認済証の交付を受けた場合は、工事完了後、建築主事に工事完了の届出（検査の申請）を行わなければならない。"],"2018-法規-5":["正しい。居室の外側に幅1m以上のぬれ縁でない縁側があるときは、採光補正係数の算定において所定の補正を行う。本記述はその規定に沿った内容である。","誤り。集会場の用途に供する居室は、換気に有効な窓があっても、床面積が200m2を超えるときは換気設備の設置が必要である。400m2では設けなければならない。","正しい。物品販売業の店舗で床面積の合計が1,500m2を超えるものの客用階段は、高さ3m以内ごとに踊場を設けなければならない。","正しい。居室の天井の高さは2.1m以上とし、1室で天井の高さが異なる場合は、その平均の高さで判断する。"],"2018-法規-6":["正しい。準耐火構造で3階以上に居室がある建築物の昇降機の昇降路の部分は、原則として他の部分と防火区画しなければならない（竪穴区画）。","正しい。法27条の規制を受ける店舗等の特殊建築物の用途部分とその他の部分は、異種用途区画により防火区画しなければならない。","誤り。階数が3以下で延べ面積200m2以内の一戸建ての住宅の吹抜き部分は、竪穴区画の適用が除外される。区画しなければならないとする点が誤りである。","正しい。有料老人ホーム等の防火上主要な間仕切壁は、強化天井でない場合、準耐火構造とし、小屋裏又は天井裏に達せしめなければならない。"],"2018-法規-7":["誤り。地階に設ける飲食店の居室は、内装制限により壁及び天井の仕上げを準不燃材料以上とする必要があり、難燃材料では適合しない。","正しい。耐火建築物の物品販売業の店舗は、当該用途部分の床面積が3,000m2以上でなければ内装制限を受けない。600m2では難燃材料で足りる。","正しい。耐火建築物の図書館は、3階以上の用途部分の床面積の合計が3,000m2以上でなければ内装制限の対象とならない。700m2では制限を受けない。","正しい。耐火建築物の劇場は、客席の床面積が400m2以上で内装制限を受け、居室の壁・天井は難燃材料以上とする。難燃材料で適合する。"],"2018-法規-8":["正しい。耐火構造の共同住宅で、3階以上の階の居室の床面積の合計が原則として200m2を超える場合、2以上の直通階段が必要である。本記述は240m2で該当する。","誤り。避難上有効なバルコニーと屋外避難階段による直通階段1つの緩和は、5階以下の階が対象である。6階以上の階には適用されず、2以上の直通階段が必要である。","正しい。物品販売業の店舗で5階以上の階に売場がある場合、売場及び屋上広場に通ずる2以上の直通階段を設け、避難階段又は特別避難階段としなければならない。","正しい。15階以上の階に通ずる直通階段は特別避難階段とするのが原則だが、住戸等を所定の面積以内ごとに防火区画した共同住宅では、緩和される。"],"2018-法規-9":["正しい。主要構造部が準耐火構造の展示場等の特殊建築物では、避難階以外の階の居室から直通階段までの歩行距離は、原則として30m以下とする。","正しい。病院等の用途でも、防煙壁等で床面積100m2以内ごとに防火区画した部分は、排煙設備を設けなくてもよい。","正しい。スポーツの練習場は、非常用の照明装置の設置義務が免除される用途の一つである。","誤り。物品販売業の店舗の避難階段の幅の合計は、直上階以上で最大の階の床面積100m2につき60cm以上必要である。600m2では3.6m以上が必要である。"],"2018-法規-10":["正しい。乗用エレベーターは、昇降路の出入口の床先とかごの床先との水平距離は4cm以下、かごの床先と昇降路壁との水平距離は12.5cm以下とする。","正しい。エスカレーターは、勾配を30度以下とし、踏段の幅を1.1m以下としなければならない。","正しい。準耐火構造の床・壁又は防火設備で、床面積100m2以内ごとに区画する場合は排煙設備を免除できるが、共同住宅の住戸は200m2以内で免除される。","誤り。自然換気設備の給気口は、居室の天井の高さの1/2以下の高さの位置に設け、常時外気に開放された構造とする。1/2を超える位置とするのは誤りである。"],"2018-法規-11":["正しい。構造計算では、固定荷重・積載荷重・積雪荷重・風圧力・地震力のほか、実況に応じて土圧、水圧、震動及び衝撃による外力も採用する。","正しい。屋根の積雪荷重は、屋根の勾配が60度を超える場合は、雪止めがある場合を除き、零とすることができる。","誤り。教室の柱の圧縮力の計算では、床の積載荷重は2,100N/m2を基に、支える床の数に応じた低減を行う。床の数が3のときは約1,890N/m2で、1,800ではない。","正しい。近接する他の建築物や防風林等が風を有効にさえぎる場合は、その方向の風圧力の計算に用いる速度圧を1/2まで減らすことができる。"],"2018-法規-12":["誤り。土砂災害特別警戒区域内の外壁の構造規定は、居室を有する建築物が対象である。居室を有しない建築物には適用されないので、記述は誤りである。","正しい。構造耐力上主要な部分で特に摩損のおそれのあるものには、摩損しにくい材料又は摩損防止の措置をした材料を使用しなければならない。","正しい。鉄骨鉄筋コンクリート造では、鉄骨に対するコンクリートのかぶり厚さは、原則として5cm以上としなければならない。","正しい。コンクリートは打込み中及び打込み後5日間、温度を2度以上に保ち、乾燥や振動等で凝結・硬化が妨げられないよう養生しなければならない。"],"2018-法規-13":["誤り。必要軸組長さは、床面積に乗ずる数値による長さと、見付面積に乗ずる数値による長さのうち大きい方で決まる。1,392cmはその値に一致しない。図は略図で詳細不明。","正しい。金属板葺きの軽い屋根の2階建て1階の桁行方向は、床面積×29cm/m2と見付面積×50cm/m2のうち大きい方で決まり、1,560cmとなる。図は略図のため文章から言える範囲。","誤り。必要軸組長さは、床面積に乗ずる数値による長さと、見付面積に乗ずる数値による長さのうち大きい方で決まる。1,695cmはその値に一致しない。図は略図で詳細不明。","誤り。必要軸組長さは、床面積に乗ずる数値による長さと、見付面積に乗ずる数値による長さのうち大きい方で決まる。2,100cmはその値に一致しない。図は略図で詳細不明。"],"2018-法規-14":["正しい。道路の上空に設ける学校の渡り廊下等で、特定行政庁が安全上等支障がないと認めて許可したものは、道路内に建築できる。","正しい。特定行政庁が交通上等で支障がないと認める建築物については、計画道路を前面道路とみなして、建築物の各部分の高さの制限を適用する。","誤り。工事を施工するために設ける現場事務所等の仮設建築物には、接道義務は適用されない。道路に2m以上接する必要はない。","正しい。幅員4m以上の農道等で道路法の道路でないものに2m以上接する敷地は、特定行政庁が支障がないと認めて許可した建築物であれば建築できる。"],"2018-法規-15":["正しい。第二種低層住居専用地域では、老人福祉センターは延べ面積600m2以下のものに限られる。650m2は新築できない。","誤り。第一種住居地域では、ホテル又は旅館は延べ面積3,000m2以下であれば新築できる。3,000m2の3階建てのホテルは新築できる。","正しい。近隣商業地域では、客席の部分の床面積の合計が200m2以上でも映画館を建築でき、300m2の映画館は新築できる。","正しい。保育所等の児童福祉施設は、すべての用途地域で建築することができる。工業専用地域でも新築できる。"],"2018-法規-16":["誤り。耐火建築物の新築による建蔽率の緩和や容積率の前面道路幅員による制限を適切に反映すると、この組合せにはならない。図の条件を踏まえると、最高限度は建蔽率9/10、容積率48/10となる。","誤り。建蔽率は、防火地域内の耐火建築物等や角地による緩和の加算（それぞれ1/10）の組合せで定まり、8.5/10にはならない。容積率も前面道路幅員による制限を受け48/10となる。","誤り。建蔽率9/10は適切な部分があっても、容積率は前面道路幅員に乗じる係数や加重平均で決まり、40/10ではなく48/10が最高限度となる。","正しい。耐火建築物の新築や角地等による建蔽率の緩和を加えた結果、建蔽率の最高限度は9/10となり、容積率は前面道路幅員による制限等から48/10となる。"],"2018-法規-17":["誤り。道路斜線・隣地斜線・北側斜線の各制限のうち最も厳しい値で決まる高さを算定すると、22.50mにはならない。北側隣地との高低差1.2mの補正も反映する必要がある。","正しい。各斜線制限による高さを算定し、北側隣地より敷地が1.2m低いことによる地盤面の補正を行った上で最も厳しいA点の高さの最高限度は22.60mとなる。","誤り。北側斜線等による制限を考慮すると、A点の高さは23.10mまでは建築できない。地盤面の高低差の補正を加えた最も厳しい制限値で決まる。","誤り。25.00mは絶対高さや他の制限を考慮しない値で、斜線制限による高さの最高限度より大きく、A点では建築できない。"],"2018-法規-18":["正しい。図の条件から、Aは法第27条の特殊建築物等に関する規定等の対象となり、耐火建築物又は準耐火建築物としなければならない。","正しい。Bは図の用途・規模・階数等から耐火建築物としなければならないものに該当する。","正しい。Cは図の条件から耐火建築物又は準耐火建築物としなければならない規模・用途に該当する。","誤り。Dは、図の条件では耐火建築物又は準耐火建築物とする義務の対象とならない（規模・階数等が基準未満）。そのため、「しなければならない」とする記述が誤りである。"],"2018-法規-19":["正しい。敷地が二つの用途地域にまたがる場合は、過半の属する地域の制限による。第二種低層住居専用地域が700m²で過半となり、病院は同地域では原則建築できず、特定行政庁の許可が必要である。","誤り。準防火地域内で地上2階・延べ面積600m²の病院は、延べ500m²超1,500m²以下のため耐火建築物のほか準耐火建築物等とすることもできる。耐火建築物に限られない。","正しい。病院の患者用廊下の幅は、両側に居室がある場合は1.6m以上、その他の場合は1.2m以上と定められている。","正しい。病院の病室のほか、入院患者の談話等に使用される居室には、原則として採光のための窓その他の開口部を設けなければならない。"],"2018-法規-20":["正しい。地区計画等の内容として定められた建築物の敷地、構造、建築設備又は用途に関する事項は、建築主事を置かない市町村でも、条例で制限として定めることができる。","正しい。再開発等促進区で容積率の最高限度が定められている区域内では、地区計画に適合し、特定行政庁が支障がないと認める建築物には、法第52条の容積率制限は適用されない。","正しい。建築協定では、建築物の敷地、位置、構造、用途、形態、意匠、建築設備に関する基準を定めることができ、建築物に附属する門及び塀の意匠も対象となる。","誤り。建築協定区域隣接地の土地の所有者等は、過半数の合意を要せず、認可等の公告の日以後いつでも、特定行政庁に書面で意思を表示することで、各自が協定に加わることができる。"],"2018-法規-21":["正しい。一級建築士は、他の建築士の設計図書の一部を変更する場合、その建築士の承諾を求め、得られないときは自己の責任で変更できる。","正しい。構造設計一級建築士以外の一級建築士が所定の建築物の構造設計を行った場合は、構造設計一級建築士に構造関係規定への適合確認を求めなければならない。","正しい。構造設計一級建築士の関与が義務付けられる建築物でも、構造設計図書との照合を含む工事監理は、構造設計一級建築士である必要はなく一級建築士が行える。","誤り。定期講習の受講時期は、免許を受けた日の次の年度開始日から起算して3年以内などと、年度を基準に定められている。「所属した日から3年以内」とする記述は規定と異なる。"],"2018-法規-22":["誤り。管理建築士の要件は、建築士として3年以上、設計・工事監理のほか施工管理等の省令で定める業務に従事した後、管理建築士講習を修了することである。業務範囲を設計・工事監理に限る記述は誤り。","正しい。建築士事務所の登録事項である管理建築士の氏名に変更があったときは、開設者は2週間以内に都道府県知事に届け出なければならない。","正しい。管理建築士が総括する技術的事項には、他の建築士事務所との提携や提携先に行わせる業務範囲の案の作成が含まれる。","正しい。都道府県知事は、法の施行に必要があるとき、開設者や管理建築士に報告を求め、職員に事務所へ立ち入らせ図書等を検査させることができる。"],"2018-法規-23":["正しい。建築基準法違反を理由に二級建築士の免許を取り消された者は、取消しの日から5年を経過しないと、一級建築士の免許を受けられない。","誤り。建築士が禁錮以上の刑に処せられたときは、罪の種類（建築に関係するかどうか）を問わず、欠格事由に該当し免許の取消しの対象となる。","正しい。事務所に属する建築士が業務として行った行為により法令違反で懲戒処分を受けたときは、都道府県知事は事務所の登録を取り消すことができる。","正しい。建築士でない者が事務所の業務として、建築士でなければできない設計をしたときは、都道府県知事は当該事務所の登録を取り消すことができる。"],"2018-法規-24":["誤り。図書館は都市計画法上の公益上必要な建築物に当たり、その建築目的の開発行為は規模にかかわらず開発許可が不要である。4,000m²でも許可は要しない。","正しい。市街化調整区域のうち開発許可を受けた区域以外でも、仮設建築物の新築は都道府県知事の許可を要しない。","正しい。都市計画施設の区域内では、階数2以下で地階がなく主要構造部が木造等のものを除き、鉄骨造の建築物の改築には原則として許可が必要である。","正しい。地区整備計画が定められた地区計画区域内で、用途変更後が地区計画の制限に適合するような場合は、届出を要しない扱いとなる。"],"2018-法規-25":["正しい。共同住宅の屋内消火栓設備は延べ面積700m²以上が対象で、準耐火構造かつ内装を難燃材料とすると2倍の1,400m²以上となる。1,500m²は該当し設置義務がある。","正しい。事務所では、階数3以上で床面積300m²以上の階（無窓階でない場合）がある場合など、自動火災報知設備の設置が必要となる。","誤り。避難階又は地上に直通する階段が2以上設けられている場合には、工場等では避難器具の設置を要しない扱いがある。したがって3階に設置が必要とする記述は誤り。","正しい。連結送水管は、地上7階以上、又は地上5階以上で延べ面積6,000m²以上の建築物に設置を要する。該当するホテルは設置義務がある。"],"2018-法規-26":["誤り。特別特定建築物のうち床面積2,000m²以上の店舗への用途変更の場合、変更部分に限らず当該建築物全体を建築物移動等円滑化基準に適合させる必要がある。","正しい。自動車教習所は特別特定建築物ではなく特定建築物に当たり、新築時は基準適合のために必要な措置を講ずる努力義務にとどまる。","正しい。既存の特定建築物に車椅子使用者用エレベーターを設ける場合、基準適合かつ所管行政庁が防火上・避難上支障がないと認めれば、建築基準法の一部規定の適用では耐火構造とみなされる。","正しい。案内所を設ける場合には、エレベーター等の配置を表示した案内板を別に設けなくてもよい。"],"2018-法規-27":["正しい。景観地区内で建築物の建築等をしようとする者は、原則として事前に計画が所定の規定に適合することについて市町村長の認定を受けなければならない。","正しい。緑化地域内では、敷地面積が1,000m²以上の建築物の新築又は増築について、緑化率を都市計画で定める最低限度以上としなければならない。","誤り。土砂災害特別警戒区域の特定開発行為の許可は、住宅や学校、社会福祉施設、医療施設など要配慮者関係施設等が対象で、店舗用の開発行為は許可の対象ではない。","正しい。特定既存耐震不適格建築物の所有者は、耐震診断を行い、必要と認められるときは耐震改修を行うよう努めなければならない。"],"2018-法規-28":["正しい。木造で高さ13m又は軒の高さ9mを超える建築物は構造計算が必要となり、この体育館では許容応力度等計算により安全性を確かめることができる。","正しい。耐火建築物・準耐火建築物以外の木造建築物で延べ面積が1,000m²を超えるものは、1,000m²以内ごとに防火壁で区画しなければならない。図書館も該当する。","正しい。屋内消火栓設備を所定の基準で設置した場合には、原則として消火器具の設置個数を減少することができる。","誤り。木造で高さが13mを超える建築物（本問は高さ14m）の工事監理は、一級建築士でなければ行えない。二級建築士が工事監理をすることはできない。"],"2018-法規-29":["正しい。構造設計一級建築士は、建築士事務所に属さず教育業務に従事している場合であっても、構造設計一級建築士定期講習を受けなければならない。","正しい。構造計算適合判定資格者である建築主事が審査する場合は、構造計算適合性判定を別途受けなくてもよい。","正しい。特定行政庁の報告要求に対して報告をしない、又は虚偽の報告をした所有者等は、罰則の適用対象となる。","誤り。建築主が工事監理者を定めずに工事をさせた場合でも、建築主自体を罰する規定はないため、「罰則の適用対象となる」とする記述は誤りである。"],"2018-法規-30":["正しい。低炭素建築物新築等計画の認定基準に適合させる措置で通常を超える床面積は、一定の限度内で容積率算定の延べ面積に算入しない。","正しい。低炭素建築物新築等計画の認定申請者は、所管行政庁に対し、建築基準関係規定への適合審査を建築主事に依頼するよう申し出ることができる。","誤り。適合判定通知書の提出時期は、確認申請書の提出と同時に限らず、確認済証の交付を受けるまでの手続で整理される。「併せて」とする記述は法の定めと異なる。","正しい。建築物エネルギー消費性能向上計画の認定を受けたときは、適合性判定を要するものは、原則として適合判定通知書の交付を受けたものとみなされる。"],"2017-法規-1":["正しい。液化石油ガス法第38条の2並びにこれに基づく命令・条例の規定で建築物の敷地、構造又は建築設備に係るものは、建築基準関係規定に含まれる。","誤り。特定防火設備は、通常の火災による火熱が加えられた場合に加熱開始後1時間（60分）以上、加熱面以外に火炎を出さないものである。45分は準耐火構造等の防火設備の性能である。","正しい。延べ面積の合計が500m²を超える同一敷地内の2棟は別棟扱いで、2階の外壁間5mは延焼のおそれのある部分（2階以上は5m以内）に該当する。","正しい。非常用の照明装置における「学校等」には、学校、体育館、ボーリング場、スキー場、スケート場、水泳場、スポーツの練習場が含まれる。"],"2017-法規-2":["誤り。敷地内に計画道路がある場合、特定行政庁の許可を受けた建築物については、計画道路に係る部分の面積は敷地面積に「算入しない」。算入するとする記述は誤り。","正しい。避雷設備の設置を検討する高さの算定では、昇降機塔等の屋上部分は建築面積の1/8以内でも高さに算入する。","正しい。日影規制の緩和で、敷地が幅10mを超える道路に接する場合は、道路の反対側の境界線から敷地側へ水平距離5mの線を敷地境界線とみなす。","正しい。倉庫や機械室の地階で、水平投影面積の合計が建築面積の1/8以下のものは、建築物の階数に算入しない。"],"2017-法規-3":["正しい（確認が必要）。防火地域内では、増築部分の床面積が10m²以内でも確認済証の交付が必要となる。","正しい（確認が必要）。特定行政庁が許可した仮設興行場であっても、本肢の規模・構造の新築では確認済証の交付が必要となる。","誤り（確認不要）。鉄道のプラットホームの上家は建築基準法上の建築物に含まれないため、確認済証の交付を受ける必要がない。","正しい（確認が必要）。劇場から公会堂への用途変更は類似の用途ではなく、特殊建築物で200m²を超えるため確認済証の交付が必要となる。"],"2017-法規-4":["正しい。高さが60mを超える建築物は大臣認定を受けて建築するもので、構造計算適合性判定の対象ではない。","正しい。認証型式部材等で、一級建築士である工事監理者が設計図書どおりに実施されたことを確認したものは、中間検査で型式に適合するものとみなされる。","誤り。建築設備の材料・位置・能力の変更のうち、性能が低下しない材料変更や能力が減少しない変更は軽微な変更にあたり、確認済証の再交付を要しない。","正しい。確認済証の交付を受けた新築工事の施工者は、現場の見やすい場所に建築主、設計者、工事施工者、現場管理者の氏名又は名称と確認があった旨を表示する。"],"2017-法規-5":["正しい。第二種ホルムアルデヒド発散建築材料を使う居室では、使用面積に所定の数値を乗じた面積を居室の床面積以下にしなければならない。","正しい。住宅の地階の居室は、所定のからぼりに面する開口部を設けるなどした場合、湿気を防ぐ措置や衛生のための換気設備を設けなくてもよい。","正しい。学校の教室の採光に有効な開口部面積は、床面積の1/5以上であり、70m²の教室では14m²以上が必要となる。","誤り。階段や傾斜路で、幅が3mを超えるときは中間に手すりを設ける必要があるが、幅3mちょうどでは超えないため中間の手すりは不要である。"],"2017-法規-6":["正しい。階避難安全検証法は、階の各居室ごとに、避難開始時間、居室出口までの歩行時間、出口通過時間などを計算して避難の安全性を検証する方法である。","正しい。全館避難安全検証法は、火災室ごとに全員が地上へ避難するまでの時間や、煙・ガスが階段等へ流入するまでの時間を計算して検証する方法である。","正しい。耐火性能検証法は、屋内外の火災の火熱を受けても主要構造部や耐力壁である外壁が構造耐力上支障のある損傷を生じないことを確かめる方法である。","誤り。防火区画検証法は、火災が区画内にとどまる（区画の面積や火災の拡大）ことを確かめる検証法であり、防火設備の遮炎性能を確かめる方法とする記述は誤りである。"],"2017-法規-7":["正しい。耐火建築物の物品販売業を営む店舗で3階の床面積が1,000m²以上の場合、居室の壁等は難燃材料以上の仕上げとすれば適合する。","誤り。自動車修理工場は耐火建築物でも内装制限の対象で、壁及び天井の仕上げは準不燃材料以上としなければならない。難燃材料では適合しない。","正しい。100m²以内ごとに耐火構造の床・壁と所定の防火設備で区画した居室は、内装制限の適用が除かれるため、仕上げに制限がかからない。","正しい。大規模建築物の事務所では、居室から地上に通ずる廊下・階段等の壁及び天井の内装を準不燃材料以上とすれば適合する。"],"2017-法規-8":["誤り（不要）。耐火構造の旅館で3階の宿泊室の面積が合計180m²であり、基準面積を超えないため、2以上の直通階段は求められない。","誤り（不要）。主要構造部が不燃材料の寄宿舎では、2階の寝室の床面積の合計150m²は基準の200m²以下となり、2以上の直通階段は不要である。","正しい（2以上の直通階段が必要）。準耐火構造の物品販売業の店舗で2階の売場が500m²あり、基準面積を超えるため、2以上の直通階段を設けなければならない。","誤り（不要）。ナイトクラブの建築物でも、各階に避難上有効なバルコニーと屋外避難階段を設けるなど所定の緩和を満たせば、2以上の直通階段が必要とされない。"],"2017-法規-9":["正しい。柱・梁が不燃材料で、その他の主要構造部が所定の基準に適合し、延焼のおそれのある外壁開口部に防火設備があるものは、準耐火建築物に該当する。","正しい。高さ31m以下の部分の3階以上の階で、直径1mの円が内接できる窓を道に面する外壁面の10m以内ごとに設ければ、非常用の進入口を設けなくてもよい。","誤り。15階以上の階では歩行距離は10m減じられ、内装を準不燃材料とする緩和（+10m）を受けても、60mとはならず、設問のような60mにはできない。","正しい。病院の居室には非常用照明が必要だが、病室など居室ごとに除外規定があり、本肢は設けなくてよいとされる。※要確認"],"2017-法規-10":["誤り。住戸で床面積100m²以下、調理室の火気使用器具の発熱量が12kW以下、かつ換気上有効な開口部を調理室面積の1/10以上（1.2m²）設ければ換気設備は不要である。9kWで1.2m²なら設置を要しない。","正しい。非常用エレベーターを設けていない既存不適格建築物は、増築部分の床面積が基準時の延べ面積の1/2を超える場合、適合させなければならない。","正しい。事務室120m²では、排煙に有効な開口部は1/50の2.4m²以上必要である。2m²では足りないため、排煙設備を設けなければならない。","正しい。エレベーターの昇降路の出入口の戸には、かごが停止していない場合に人や物の落下を防ぐ、所定の基準に適合する施錠装置を設けなければならない。"],"2017-法規-11":["正しい。剛性率は各階の層間変形角の逆数をその建築物の各階の層間変形角の逆数の相加平均で除した値で、各階とも6/10以上であることを確かめる（令82条の6）。","誤り。保有水平耐力計算でも、各階の層間変形角が原則として1/200以内であることの確認は省略できない。高さ25mのRC造でも保有水平耐力の確認だけでは足りない。","正しい。限界耐力計算では、損傷限界・安全限界の検討を行うため、地上部分の地震時について短期許容応力度を超えないことの計算は要しない（地下部分は別途確認する）。","正しい。基礎は、国土交通大臣が定める基準に従った構造計算で構造耐力上安全であることを確かめた場合には、異なる構造方法による基礎の併用が認められる（令38条）。"],"2017-法規-12":["正しい。屋根が金属板の軽い屋根の2階建て1階では、地震力用は床面積80m2×29cm/m2=2,320cm、風圧力用は見付面積に50cm/m2を乗じた値で、大きい方がその方向の必要長さとなる。図は略図で、文章から言える範囲の説明である。","誤り。桁行の2,640cmは80m2×33cm/m2に当たり、瓦等の重い屋根の係数による値である。金属板の軽い屋根の係数29cm/m2では2,320cmとなり、軽い屋根に適用すべき値と合わない。","誤り。張り間方向3,600cmは見付面積72m2×50cm/m2の値に相当するが、図の見付面積から求まる風圧力用の必要長さとは一致しない。軸組長さは地震用と風用の大きい方で決まる。","誤り。桁行2,640cmは重い屋根の地震力用の値、張り間3,600cmも見付面積に基づく値と合わない。金属板屋根（軽い屋根）の係数と図の見付面積で求めた必要長さとは異なる。"],"2017-法規-13":["正しい。炭素鋼の短期に生ずる力に対する許容応力度（曲げ）は、鋼材の種類及び品質に応じて国土交通大臣が定める基準強度Fと同じ値である（令90条）。","正しい。許容応力度等計算の標準せん断力係数は0.2以上（軟弱地盤等は0.3以上）で、必要保有水平耐力計算では1.0以上とする（令88条、令82条の3）。","誤り。高力ボルトの引張りの許容応力度は、長期が材料強度の2/3、短期は長期の1.5倍で材料強度と同じ値である。短期を2/3とする点が誤り（令92条の2）。","正しい。コンクリートの引張りの許容応力度は、原則として圧縮の許容応力度の1/10とする（令91条）。"],"2017-法規-14":["正しい。都市計画区域編入の際に現に存在する幅員4m以上の道は道路とみなされ（法42条1項三号）、これに2m以上接する敷地には建築物を建築できる。","正しい。工事用の現場事務所などの仮設建築物は、法85条2項により接道義務（法43条）の規定が適用されないため、道路に接していなくてもよい。","正しい。公共の用に供する幅員4m以上の道で、河川管理者が管理するものに2m以上接する敷地は、特定行政庁の許可を受ければ建築可能である（法43条2項）。","誤り。地盤面下に設ける建築物は道路内でも建築でき、特定行政庁の許可は不要である（法44条1項三号）。附属する地下通路も許可を受ける必要はない。"],"2017-法規-15":["正しい。老人福祉センター等は、600m2以下であれば第一種低層住居専用地域内でも建築できる（法別表第二(い)項、令130条の4）。","誤り。保健所は第一種・第二種低層住居専用地域では建築できず、第一種中高層住居専用地域以上でなければ建築できない（法別表第二）。","正しい。第一種中高層住居専用地域では、2階以下かつ500m2以下の店舗（宅地建物取引業を営む店舗を含む）は建築できる（法別表第二(は)項）。","正しい。幼保連携型認定こども園は、用途地域の制限が学校より緩く、工業地域内でも建築できる（法別表第二(ぬ)項）。"],"2017-法規-16":["正しい。特定道路（幅員15m以上）から70m以内の前面道路（幅員6m以上12m未満）では、加算値は(12−8)×(70−35)/70=2mとなる（法52条9項）。","正しい。高度利用地区内でも、学校、駅舎、卸売市場など、特定行政庁が用途上・構造上やむを得ないと認めて許可したものは、都市計画の容積率の制限に適合しなくてもよい（法59条1項三号）。","誤り。建蔽率の限度が6/10の地域では、準防火地域内の耐火建築物による緩和は受けられない。防火地域内の耐火建築物等による+1/10は、限度が8/10以外の地域に適用される（法53条3項）。","正しい。敷地が防火地域と準防火地域にわたり、建築物の全部が耐火建築物等であれば、防火地域内にあるとみなされ、建蔽率の緩和（+1/10）の対象となる（法53条3項、7項）。"],"2017-法規-17":["誤り。A点の高さの最高限度は、道路斜線・隣地斜線・北側斜線などを図の数値で計算した結果であり、28.5mにはならない。図が略されているため、文章から言える範囲の説明である。","誤り。各斜線制限を図の数値で当てはめて求めた最高限度とは一致しない。道路斜線の適用距離や後退緩和、隣地斜線の算定を確認する必要がある。図の詳細が不明のため一般論である。","正しい。図の条件で道路斜線制限・隣地斜線制限などを計算し、A点で最も厳しい制限を採用した結果が39.0mである。複数の斜線制限のうち最小値が最高限度になる。","誤り。46.0mは、各斜線制限のうち最も厳しいものを適用した結果を超えており、A点での高さの最高限度にはならない。図の詳細が不明のため一般論の説明である。"],"2017-法規-18":["誤り。防火地域と準防火地域にわたり防火壁で区画されていない建築物は、全体に厳しい方の防火地域の規定が適用される。延べ面積600m2で100m2超のため耐火建築物が必要で、準耐火建築物では足りない。","正しい。防火地域内では、階数3以上又は延べ面積100m2超の建築物は耐火建築物としなければならない。延べ面積150m2の診療所は100m2超のため耐火建築物となる（法61条）。","正しい。3階を倉庫の用途に供し、その部分の床面積が200m2以上の建築物は、法27条により耐火建築物としなければならない。3階の床面積は300m2でこれに該当する。","正しい。準防火地域内で地階を除く階数3、延べ面積1,500m2以下の建築物は、耐火建築物又は準耐火建築物等とすればよい。延べ面積1,200m2の事務所はこれに該当する（法61条、令136条の2）。"],"2017-法規-19":["誤り。建築協定の内容と同様の事項が地区計画で定められても、建築協定が廃止されたものとはみなされない。廃止には所定の手続（法76条の3等）が必要である。","正しい。地区計画等の区域内で、特定行政庁が許可した建築物については、予定道路を前面道路とみなして容積率の規定を適用できる（法68条の7第5項）。","正しい。壁面の位置の制限は建築物の壁等に関するもので、門又は塀で高さ2mを超えるもの以外の工作物の設置制限は、条例の壁面の位置の制限としては定められない（法68条の2）。","正しい。一人協定は、認可の日から3年以内に2以上の土地の所有者等が存しないこととなったときは、効力を有しないものとされる（法76条の3第3項）。"],"2017-法規-20":["正しい。屋根の防火規定（法22条）の市街地の区域の内外にわたる建築物は、その全部について同条の規定が適用される（法24条）。","誤り。一団地の総合的設計による特例（法86条1項）で一の敷地とみなされるのは、接道・容積率・建蔽率・斜線制限などの規定である。用途地域の用途規定（法48条）は含まれない。","正しい。第一種低層住居専用地域等で高さの限度が10mと定められている場合、一定の要件を満たし特定行政庁が認めたものは12mまで緩和できる（法55条2項）。","正しい。地階を除く階数11以上の建築物の屋上に設ける冷却塔設備は、国土交通大臣が定める構造方法を用いれば、主要な部分を不燃材料以外で造ることができる（令129条の2の6）。"],"2017-法規-21":["正しい。設備設計一級建築士は、設備設計以外の設計を含む建築物の設計も行うことができる（建築士法3条、20条の3）。","正しい。建築士は、大規模建築物等の建築設備の設計・工事監理で建築設備士の意見を聴いたときは、設計図書又は工事監理報告書にその旨を明らかにしなければならない（法18条4項）。","誤り。集会場で一級建築士の独占業務となるのは延べ面積500m2超のものである。延べ面積450m2の木造平家建て（軒高9m・高さ11m）は、二級建築士でも設計・工事監理ができる（法3条）。","正しい。構造設計一級建築士は、定期講習を受けたときは、住所地の都道府県知事を経由して国土交通大臣に対し、構造設計一級建築士証の書換え交付を申請できる。"],"2017-法規-22":["正しい。延べ面積300m2を超える建築物の新築・増改築・大規模修繕等の工事監理受託契約では、所定事項を書面に記載し、署名又は記名押印して相互に交付しなければならない（法22条の3の3）。","正しい。重要事項説明を行う際、管理建築士等は、建築主に対して建築士免許証又は建築士免許証明書を提示しなければならない（法24条の7第2項）。","正しい。管理建築士は、受託可能な業務の量及び難易、業務の内容に応じて必要となる期間の設定、担当する建築士等の選定・配置などの技術的事項を総括する（法24条3項）。","誤り。設計図書には、設計を行った建築士が自ら記名押印する（法20条1項）。管理建築士が他の建築士の設計図書に管理建築士である旨を表示して記名押印する義務はない。"],"2017-法規-23":["正しい。一級建築士名簿には、登録番号、登録年月日、氏名、生年月日、性別、処分歴、定期講習の受講歴等が登録される（法5条、規則）。","正しい。一級建築士は、免許証の交付の日から30日以内に、本籍、住所、氏名、生年月日、性別等を、住所地の都道府県知事を経由して国土交通大臣に届け出なければならない（法5条の2）。","正しい。一級建築士事務所登録簿には、登録番号、登録年月日、事務所の名称・所在地、管理建築士・所属建築士の氏名、処分歴等が登録される（法23条の3、規則）。","誤り。建築士事務所の登録事項に変更があったときは、2週間以内に届け出なければならない（法23条の5）。30日以内ではない。"],"2017-法規-24":["正しい。市街化調整区域内で、既存建築物の敷地内に車庫、物置等の附属建築物を建築する場合は、開発許可を受けた区域外でも許可は不要である（法43条1項、令35条）。","正しい。都市計画施設の区域内でも、階数2以下で地階がなく、主要構造部が木造等の容易に移転・除却できる建築物の改築は、許可不要である（法53条1項、令37条）。","正しい。開発許可を受けた事項の軽微な変更をしたときは、遅滞なく都道府県知事に届け出なければならない（法35条の2第3項）。","誤り。地区計画区域内の届出は、行為着手の30日前までに市町村長へ行うが、仮設の建築物の建築は届出が不要な行為に含まれる（法58条の2第1項、令38条の4）。"],"2017-法規-25":["正しい。展示場は延べ面積700m2以上で屋内消火栓設備が必要で、耐火構造で内装を難燃材料とした場合は3倍の2,100m2以上となる。2,100m2はこれに該当し設置が必要（令11条）。","正しい。ラック式倉庫は、天井高10mを超え延べ面積700m2以上のものにスプリンクラー設備の設置が必要である（令12条1項）。","誤り。小学校は消防法施行令別表第一の(七)項で、特定防火対象物ではない。また、既存建築物には原則として遡及適用されず、既存不適格の扱いが認められる。","正しい。開口部のない耐火構造の床又は壁で区画されている部分は、消防用設備等の技術上の基準の適用上、それぞれ別の防火対象物とみなされる（令8条）。"],"2017-法規-26":["正しい。会員制スイミングスクールのように一般公共の用に供されないものは特別特定建築物ではなく、特定建築物となり、基準適合の努力義務にとどまる（バリアフリー法16条）。","正しい。公衆便所は特別特定建築物であり、新築時には、車いす使用者等が円滑に利用できる便房を1以上（男女の別があるときはそれぞれ1以上）設けなければならない。","正しい。2,000m2以上の物品販売業の店舗は特別特定建築物で、不特定多数が利用する駐車場を設ける場合は、車いす使用者用駐車施設を1以上設けなければならない。","誤り。ホテル又は旅館の車いす使用者用客室の設置数は、客室の総数に応じて定められており、総数にかかわらず一律に1以上と規定するのは適当でない。基準の詳細に確信がなく一般論での説明である。"],"2017-法規-27":["正しい。品確法により、住宅新築請負契約では、請負人は引渡しから10年間、構造耐力上主要な部分等の瑕疵について担保責任を負う（品確法94条）。","誤り。分別解体等が必要な増築は、当該工事の対象部分（増築部分）の床面積が500m2以上の場合である。増築部分は200m2で基準未満のため、増築後の合計が500m2でも対象外となる。","正しい。分譲事業者は、譲受人の決定までに相当期間を要する場合には、単独で長期優良住宅建築等計画を作成し、所管行政庁に認定を申請できる（長期優良住宅法5条）。","正しい。建築主等は、エネルギー消費性能の向上のための空気調和設備等の改修をしようとするとき、建築物エネルギー消費性能向上計画を作成し、所管行政庁に認定を申請できる（建築物省エネ法35条）。"],"2017-法規-28":["正しい。イは違反を助長する行為、ロは管理建築士の他事務所との兼務（専任義務違反）、ハは委託者の承諾があっても禁止される一括再委託、ニは登録なしでの業務で、いずれも懲戒処分の対象となる。","誤り。イ、ロ、ニだけでなく、ハの一括再委託も、委託者の許諾があっても建築士法24条の3により禁止されており、懲戒処分の対象となる。","誤り。ロ、ハ、ニだけでなく、イの建築確認を受けずに工事を施工する相談に応じる行為も、設計者として不誠実な業務や法令違反の助長にあたり、懲戒処分の対象となる。","誤り。イ、ハだけでなく、ロの管理建築士の兼務（専任義務違反）や、ニの登録の有効期間満了後に更新せず業として設計等を行う行為も、懲戒処分の対象となる。"],"2017-法規-29":["誤り。切土のみの宅地造成で許可が必要となるのは、切土面積が500m2を超える場合又は高さ2m超の崖を生ずる場合である。面積500m2、崖の高さ2mは、いずれも「超える」に該当しない。","正しい。給水装置の家屋の主配管は、配管経路について構造物の下の通過を避けるなど、漏水時の修理を容易に行えるようにしなければならない（水道法施行令6条）。","正しい。土砂災害特別警戒区域内で、分譲住宅など自己居住用以外の予定建築物のための開発行為（特定開発行為）をしようとする者は、都道府県知事の許可が必要である。","正しい。20ha未満の開発行為の設計図書は、一級建築士で宅地開発に関する技術に関して2年以上の実務経験を有する者が作成できる（都市計画法施行規則19条）。"],"2017-法規-30":["正しい。特定工程後の工程の工事を、中間検査合格証の交付前に施工した場合、工事施工者は罰則の適用対象となる（法7条の3第6項、法99条）。","誤り。一級建築士でなければ設計できない建築物を二級建築士が設計等した場合、当該二級建築士だけでなく、工事施工者も罰則の適用対象となり得る。施工者が適用対象とならないとする点が誤りと考えられる。","正しい。患者の収容施設がある診療所は、3階以上の階にあり、その部分の床面積が300m2以上であれば、定期報告の対象となる特定建築物である（令16条）。","正しい。建築士事務所の開設者は、毎事業年度経過後3月以内に設計等の業務に関する報告書を提出し、帳簿は各事業年度の末日に閉鎖して翌日から15年間保存しなければならない（法23条の6、規則21条）。"],"2016-法規-1":["正しい。居室とは、居住、執務、作業、集会、娯楽等の目的で継続的に使用する室をいい、レストランの調理室もこれに該当する（法2条四号）。","正しい。地上3階建ての共同住宅では、2階の床及びこれを支持するはりの配筋工事の工程が特定工程として政令で定められている（令11条）。","正しい。消火の設備は建築設備に含まれ、建築物に設ける消火用の貯水槽もこれに該当する（法2条三号）。","誤り。警察署は法2条二号の特殊建築物の用途（学校、病院、劇場、百貨店等）に該当せず、延べ面積2,000m2でも特殊建築物ではない。"],"2016-法規-2":["誤り。自家発電設備の設置部分で容積率の算定の基礎となる延べ面積に算入しないのは、延べ面積の1/100までである。延べ面積1,000m2では10m2までで、20m2全てを不算入とするのは誤り（令2条3項）。","正しい。国土交通大臣が高い開放性を有すると認めて指定する構造の建築物は、その端から水平距離1m以内の部分を建築面積に算入しない（令2条1項二号）。","正しい。前面道路からの後退距離の算定の特例における「軒の高さ」は、前面道路の路面の中心からの高さとして算定する（令130条の12）。","正しい。屋上部分の昇降機塔、装飾塔等で水平投影面積の合計が建築面積の1/8以下のものは、階数に算入しない（令2条1項八号）。"],"2016-法規-3":["誤り。木造2階建ての共同住宅は延べ面積200m2超の特殊建築物であり、屋根の過半の修繕は大規模の修繕にあたるため、確認済証の交付が必要である（法6条1項）。","誤り。防火地域等の指定がなくても、10m2を超える増築は確認申請が必要である。附属車庫の増築部分は12m2で10m2を超えるため、確認済証が必要となる。","正しい。診療所（患者の収容施設あり）から地域活動支援センターへの変更は、類似の用途相互間の変更にあたり、確認済証の交付は不要である（令137条の18）。","誤り。原動機を使用するメリーゴーラウンドなどの遊戯施設は確認を要する工作物であり、築造には確認済証の交付が必要である（令138条3項）。"],"2016-法規-4":["正しい。検査済証の交付前でも、指定確認検査機関が安全上、防火上、避難上支障がないと認めた場合は、建築物を仮に使用できる（法7条の6第1項二号）。","正しい。百貨店で避難施設等に関する大規模修繕の工事中に建築物を使用する場合は、仮使用の認定に加え、工事中の安全措置に関する計画の届出が必要となる（法90条の3、令147条の2）。","正しい。事務所は、5階以上かつ延べ面積2,000m2超でなければ定期報告の対象とならない。地上4階建て延べ面積1,000m2の事務所は、一般に定期報告の対象外である（令16条）。","誤り。建築物の用途変更では、工事完了後の完了検査（完了検査申請・届出）の規定は適用されない。完了したときに指定確認検査機関へ届け出なければならないとする点が誤り。"],"2016-法規-5":["正しい。地階とは、床が地盤面下にある階で、床面から地盤面までの高さがその階の天井高の1/3以上のものをいう。天井高3mで地盤面から天井まで2m以下なら、1m以上となり該当する（令1条二号）。","正しい。屋外階段の幅は、避難階以外の階から避難階又は地上に通ずる直通階段であっても、90cm以上とすることができる（令23条）。","誤り。住宅、学校、病院等の居室の採光に有効な部分の面積は、用途地域の区分ごとに定められた採光補正係数により算定する。用途地域に関係なく算定できるとする点が誤り（令20条）。","正しい。劇場、映画館、集会場などの特殊建築物の居室は、換気に有効な窓があっても、政令で定める技術的基準に従い換気設備を設ける必要がある（法28条3項）。"],"2016-法規-6":["正しい。防火地域・準防火地域内の建築物で11階以上の部分は、原則として床面積100m2以内ごとに防火区画する必要がある。内装等による緩和がなければ12階部分も100m2以内ごとの区画となる。","正しい。自動車車庫の用途部分（床面積150m2以上等）は、事務所等の他の部分と準耐火構造の床・壁や防火設備で防火区画する必要がある。200m2の車庫はこれに該当する。","正しい。防火区画に接する外壁は、外壁面から50cm以上突出した準耐火構造のひさし・床・袖壁等で防火上有効に遮られている場合、所定の部分を準耐火構造とする要件が緩和される。","誤り。共同住宅の各戸の界壁は、準耐火構造とし、小屋裏又は天井裏に達せしめれば足りる。耐火構造まで求められるわけではないので、耐火構造とする点が誤りである。"],"2016-法規-7":["正しい。防火地域内では、階数（地階を含む）が3以上又は延べ面積100m2超の建築物は耐火建築物としなければならない。地下1階・地上2階は階数3で該当する。","正しい。自動車車庫は3階以上の階を当該用途に供する場合、耐火建築物としなければならない。各階を車庫とする地上3階建てはこれに該当し、耐火建築物が必要となる。","正しい。準防火地域内で地階を除く階数が2以下かつ延べ面積500m2超1,500m2以下の建築物は、耐火建築物又は準耐火建築物等とする必要がある。平家1,000m2の倉庫が該当する。","誤り。防火・準防火地域外の学校は、特殊建築物でも法27条の耐火建築物義務の対象ではなく、3階建て延べ2,500m2では法21条の規模（高さ16m超、延べ3,000m2超等）にも当たらない。"],"2016-法規-8":["誤り。特別避難階段の階段室は、付室に面する部分以外に屋内に面して開口部を設けられない。この構造規定は全館避難安全検証法で確かめられても緩和されないため、設けられるとする点が誤り。","正しい。不燃材料の技術基準は、通常の火災による火熱が加えられた場合に、加熱開始後20分間、燃焼せず、防火上有害な変形・溶融・亀裂等を生じないことである。","正しい。防火構造の軒裏は、周囲の通常の火災による火熱が加えられた場合、加熱開始後30分間、屋内に面する加熱面以外の面の温度が可燃物燃焼温度以上に上昇しないことが求められる。","正しい。準耐火建築物は、耐火建築物以外で、主要構造部を準耐火構造としたもの又はこれと同等の準耐火性能を有するもので、外壁開口部の延焼のおそれのある部分に防火設備を有するものである。"],"2016-法規-9":["正しい。共同住宅では住戸の居室床面積の合計が100m2（主要構造部が準耐火構造以上なら200m2）を超える階から、2以上の直通階段が必要になる。各階250m2は200m2を超え、該当する。","誤り。法22条区域内の木造建築物は、外壁の延焼のおそれのある部分を準防火性能を有する構造とすれば足りる。防火構造としなければならないとする点が誤りである。","正しい。物品販売店舗の避難階段の幅の合計は、最大階の床面積100m2につき所定の数値以上とする。本問の各階400m2の店舗では、避難階段の幅の合計2.4m以上とされる。","正しい。換気設備の風道が準耐火構造等の防火区画を貫通する場合、その部分に設ける特定防火設備は、煙の発生又は温度の急激な上昇で自動閉鎖するものとすることが原則である。"],"2016-法規-10":["正しい。給水管・配電管等が準耐火構造の防火区画を貫通する場合、貫通部及びその両側1m以内の部分を不燃材料で造らなければならない。","誤り。地下街の排煙設備の制御・作動状態の監視を中央管理室で行えるようにする規定は、各構えの床面積の合計が1,000m2とする本記述の内容とは合致しない。規定の対象面積等の理解が誤りである。","正しい。高さ20mを超える建築物には、周囲の状況によって安全上支障がない場合を除き、有効に避雷設備を設けなければならない。","正しい。高さ31mを超える部分を全て建築設備の機械室等とする建築物は、非常用の昇降機の設置義務が除外される。"],"2016-法規-11":["正しい。鉄骨造の使用構造材料一覧表には、構造耐力上主要な部分に用いる材料の種別等を明示する。","誤り。コンクリートの材料の種別及び骨材の種別は、使用構造材料一覧表に明示すべき事項であり、構造詳細図に明示すべき事項ではない。","正しい。鉄骨造の構造詳細図には、構造耐力上主要な部分である接合部並びに継手及び仕口の構造方法を明示しなければならない。","正しい。鉄筋コンクリート造の構造詳細図には、鉄筋に対するコンクリートのかぶり厚さ等を明示しなければならない。"],"2016-法規-12":["正しい。限界耐力計算では、長期（常時・積雪時）及び短期（積雪時・暴風時）の各応力度が、それぞれ長期・短期の許容応力度を超えないことを確かめる。","誤り。津波による外力に対する安全性の確認は、建築基準法上、一律に義務づけられていない。津波災害警戒区域等で条例により定める場合等に限られ、全ての区域で確かめなければならないとする点が誤り。","正しい。鉄骨造の柱の脚部は、滑節構造の場合を除き、国土交通大臣が定める基準に従ったアンカーボルト緊結等により基礎に緊結しなければならない。","正しい。圧縮材の有効細長比は柱で200以下とするのが原則だが、限界耐力計算により安全性が確かめられた場合は、この制限を適用しないことができる。"],"2016-法規-13":["正しい。炭素鋼の構造用鋼材では、短期の引張りの許容応力度は長期の数値の1.5倍となる。","誤り。径28mm以下の異形鉄筋の短期の圧縮の許容応力度は基準強度Fの数値そのものであり、Fを1.5で除した数値ではない。1.5で除すのは長期の場合である。","正しい。木材の繊維方向の短期（積雪時を除く）の圧縮の許容応力度は、圧縮に対する基準強度の数値に2/3を乗じた数値とする。","正しい。ステンレス鋼の構造用鋼材の長期の引張りの許容応力度は、基準強度の数値を1.5で除した数値とする。"],"2016-法規-14":["正しい。道路内には原則建築できないが、道路の上空に設ける病院の渡り廊下等は、特定行政庁が建築審査会の同意を得て許可した場合に建築できる。","正しい。土地区画整理法等の事業計画のある道路は、2年以内に事業が執行される予定で特定行政庁が指定したものが道路となる。3年後の執行予定では道路に当たらない。","誤り。延長35m超の袋路状の位置指定道路は、終端及び区間35m以内ごとに自動車の転回広場を設ける必要があるが、幅員は原則4m以上でよく、6m以上とする規定はない。","正しい。災害時に建築する官公署等の応急仮設建築物には、接道義務の規定は適用されず、道路に接しなくてもよい。"],"2016-法規-15":["誤り。容積率の最高限度は、都市計画で定められた容積率と前面道路幅員に法定乗数を乗じた値のうち小さい方等で決まる。図の条件から算定した値と一致せず、この数値は最高限度ではない。","正しい。敷地が複数の用途地域・前面道路にまたがる場合の各部分の容積率を面積で加重平均して算定した最高限度が、この数値となる。図が不明のため詳細は省略するが、正答として整合する。","誤り。前面道路幅員による制限や用途地域別の指定容積率、加重平均の考え方に基づいて算定すると、この数値は最高限度を上回り、適当でない。","誤り。この数値は都市計画で定められた容積率等をそのまま採用した場合の値に近いが、前面道路幅員による低減を考慮すると最高限度を超えるため誤りである。"],"2016-法規-16":["誤り。道路斜線制限・隣地斜線制限等から求めた高さの最高限度は、この数値より大きく、A点の高さの最高限度としては適当でない。","正しい。A点の高さは、道路斜線制限や隣地斜線制限のうち最も厳しい制限で決まり、その算定結果がこの数値となる。図が不明のため詳細は省略するが、正答として整合する。","誤り。各斜線制限による高さの最高限度を算定すると、この数値は最高限度を超えており、適当でない。","誤り。この数値は斜線制限による高さの最高限度を大幅に超えるため、A点の高さの最高限度として適当でない。"],"2016-法規-17":["正しい。第一種低層住居専用地域では、居住部分が全体の1/2以上かつ非住宅部分が50m2以下の兼用住宅は建築できる。本記述は非住宅部分50m2・居住100m2で該当する。","誤り。第二種中高層住居専用地域では、事務所等は2階以下かつ床面積の合計1,500m2以内に限られる。延べ面積2,000m2の事務所は新築できない。","正しい。近隣商業地域では、客席の部分の床面積の合計が200m2以上の映画館も、規模の制限（客席10,000m2以上は不可）の範囲内であれば新築できる。","正しい。肥料の製造工場は、危険性が大きく又は著しく環境を悪化させるおそれのある工場に当たり、準工業地域では新築できない。"],"2016-法規-18":["正しい。防火地域内では、階数3以上又は延べ100m2超は耐火建築物、それ以外は耐火又は準耐火建築物とする。延べ50m2を超える附属車庫は例外に当たらず、準耐火建築物以上が必要。","正しい。準防火地域内で延べ面積500m2超1,500m2以下かつ地上3階以下の建築物は、耐火・準耐火建築物以外でも所定の技術的基準に適合すれば認められる。主要構造部が不燃材料のものは該当しうる。","正しい。防火・準防火地域内で、木造建築物等に附属する高さ2m超の門・塀は、延焼のおそれのある部分を不燃材料で造り又は覆わなければならない。","誤り。防火地域内の外壁開口部で延焼のおそれのある部分に設ける防火設備の遮炎性能は、加熱開始後20分間が基準である。30分間とする点が誤りである。"],"2016-法規-19":["正しい。地区計画等の区域内の予定道路の地盤面下に設ける建築物は、特定行政庁の許可を受けずに新築することができる。","正しい。地区計画等の内容を条例で建築制限として定めた場合、その条例の規定は建築基準関係規定に該当し、建築確認の審査対象となる。","誤り。再開発等促進区内で用途制限に適合しない建築物を建てるには、特定行政庁が支障がないと認めて許可することが必要である。許可を受けることなく新築できるとする点が誤り。","正しい。高さ2m以内の門又は塀は、条例による壁面の位置の制限の適用が除外されており、その位置は壁面の位置の制限として定めることができない。"],"2016-法規-20":["誤り。敷地が複数の用途地域にわたる場合は、敷地の過半が属する用途地域の規定が適用される。過半は第二種低層住居専用地域で、高等専門学校は同地域内に建てられないため、新築できない。","正しい。ごみ焼却場等は、都市計画で敷地の位置が決定していなくても、特定行政庁が都市計画審議会の議を経て許可した場合は新築できる。","正しい。重要文化財等であった建築物の原形を再現する建築物で、特定行政庁が建築審査会の同意を得てやむを得ないと認めたものは、建築基準法令の規定が適用されない。","正しい。特殊建築物については、地方公共団体が条例で、敷地・構造・建築設備に関して防火上の制限を付加できる。"],"2016-法規-21":["正しい。一級建築士は、設計等の委託者から請求があったときは、一級建築士免許証又は免許証明書を提示しなければならない。","正しい。設計受託契約等の当事者は、国土交通大臣が定める報酬の基準に準拠した委託代金で契約を締結するよう努めなければならない。","誤り。契約時の書面交付義務は、延べ面積300m2を超える建築物の新築に係る設計受託契約等が対象である。延べ面積200m2の建築物は、この義務の対象とならない。","正しい。建築士法違反により免許を取り消され5年を経過しない者は、一級・二級・木造のいずれの建築士免許も受けられない。"],"2016-法規-22":["正しい。建築士事務所の開設者は、管理建築士から技術的事項に関し必要な意見が述べられた場合、その意見を尊重しなければならない。","正しい。建築士でない者が建築士でなければできない設計・工事監理を行った場合、都道府県知事は当該建築士事務所の登録を取り消すことができる。","誤り。設備設計一級建築士の意見聴取が必要なのは、階数3以上かつ床面積の合計5,000m2超の建築物の建築設備の設計等である。延べ2,000m2超とする点が誤りである。","正しい。建築士事務所の開設者は、設計等の業務に関する損害賠償に備え、保険契約の締結その他の措置を講ずるよう努めなければならない。"],"2016-法規-23":["正しい。指定事務所登録機関が指定された場合、登録申請書は一級建築士事務所の場合も、原則として当該指定機関に提出する。","正しい。登録期間満了後に更新を受けず、報酬を得て業として設計等を行うことは登録義務違反であり、当該建築士は業務停止等の懲戒処分の対象となる。","正しい。建築士事務所に属する建築士は、直近の定期講習を受けた日の属する年度の翌年度の開始日から3年以内に、定期講習を受けなければならない。","誤り。建築士事務所の登録は全国で効力を持ち、登録を受けた都道府県以外の区域でも、業として設計等を行うことができる。行えないとする点が誤り。"],"2016-法規-24":["正しい。国土交通大臣が求めた業務に関する報告をせず、又は虚偽の報告をした建築士は、30万円以下の罰金の対象となる。","正しい。立入検査での質問に答弁せず又は虚偽の答弁をした者は罰金の対象となり、両罰規定によりその者が所属する法人も罰金の対象となる。","誤り。属する建築士の氏名等の変更を所定期間内に届け出ない場合の罰則は、30万円以下の罰金ではなく、10万円以下の過料である。","正しい。重要事項説明の際に建築士免許証等を提示しなかった管理建築士等は、10万円以下の過料の対象となる。"],"2016-法規-25":["正しい。開発行為は建築物の建築又は特定工作物の建設の用に供する目的の土地の区画形質の変更である。コンクリートプラントの改築は建設に当たらず、許可は不要である。","正しい。市街化区域内でも1,000m2以上の開発行為は原則許可が必要である。専修学校は許可不要となる公益上必要な建築物から除かれており、1,500m2では許可が必要となる。","正しい。市街化調整区域内の地区計画の区域内で、地区計画に適合する病院等の開発行為は、所定の要件に該当すれば許可を受けることができる。","誤り。都市計画施設の区域内の建築について、国の機関又は地方公共団体が行う場合は、知事等の許可ではなく協議によることとされている。市町村でも許可が必要とする点が誤り。"],"2016-法規-26":["正しい。旅館の屋内消火栓設備は延べ面積による設置基準があり、準耐火建築物で内装を難燃材料とする場合の読替えを考慮しても、本記述の規模は設置対象となる。","正しい。同一敷地内の準耐火建築物で延べ面積が基準以上の場合は屋外消火栓設備が必要だが、スプリンクラー設備を設置した有効範囲内の部分は、設置を省略できる。","誤り。通信機器室で自動火災報知設備の設置を免除できるのは、スプリンクラー設備、水噴霧消火設備、泡消火設備を設けた有効範囲に限られ、ハロゲン化物消火設備では免除されない。","正しい。特別支援学校等で、収容人員が20人以上の階が2階以上にある場合は、原則として避難器具を設置しなければならない。"],"2016-法規-27":["誤り。通行障害既存耐震不適格建築物の所有者に義務づけられているのは耐震診断であり、耐震改修は努力義務にとどまる。所定の期限までの耐震改修を義務とする点が誤りである。","正しい。賃貸住宅（共同住宅）で階数3以上かつ床面積1,000m2以上の特定既存耐震不適格建築物の所有者は、耐震診断を行い、必要なら耐震改修を行うよう努める。","正しい。要安全確認計画記載建築物の所有者は耐震診断が義務づけられ、結果に基づき必要な場合は耐震改修を行うよう努めなければならない。","正しい。法の努力義務は特定既存耐震不適格建築物以外の既存耐震不適格建築物にも及び、所有者は診断を行い、必要に応じ改修を行うよう努める。"],"2016-法規-28":["誤り。急傾斜地崩壊危険区域は、急傾斜地の崩壊による災害の防止に関する法律の用語である。宅地造成等規制法では宅地造成工事規制区域等の用語が用いられる。","正しい。特例容積率適用地区は、都市計画法に規定される地域地区である。","正しい。特定用途誘導地区は、都市再生特別措置法に規定される都市計画の地区である。","正しい。特定避難時間倒壊等防止建築物は、建築基準法（及び同法施行令）に規定される建築物の区分である。"],"2016-法規-29":["誤り。契約成立後の書面交付義務は、設計受託契約又は工事監理受託契約を対象とする規定であり、設計及び工事監理以外の業務を他の事務所から受託する場合は対象外である。","正しい。建築士事務所の開設者は、設計受託契約等を建築主と締結しようとするとき、あらかじめ管理建築士等に書面を交付して重要事項を説明させなければならない。","正しい。宅地建物取引業者は、工事完了前の新築住宅について、建築確認等の処分があった後でなければ広告・契約・媒介をしてはならない。","正しい。建設工事の請負契約の当事者は、工事内容、請負代金の額、工期、支払方法、紛争解決方法等を書面に記載し、署名又は記名押印して相互に交付しなければならない。"],"2016-法規-30":["正しい。宅地建物取引業者は、契約成立までの間に、宅地建物取引士をして重要事項を記載した書面を交付して説明させなければならない。","正しい。駐車場法に基づき、駐車場整備地区や商業地域内等で延べ2,000m2以上の特定用途の建築物には、条例で附置義務が課されることがある。","誤り。都市計画の提案制度の対象は、地区計画等の都市計画で、都市計画区域の整備、開発及び保全の方針の変更は提案の対象に含まれない。","正しい。浄化槽法に基づき、浄化槽管理者等は、保守点検や清掃について都道府県知事から助言、指導又は勧告を受けることがある。"],"2025-構造-1":["正しい。偏心荷重を受ける矩形断面の縁応力度はσ=P/A±M/Z=(P/BD)(1±6e/D)で表される。図-2の応力分布に当てはめるとe=D/12となる。核の限界D/6より内側で全断面が圧縮となる。","誤り。D²/(12B)は断面の幅Bにも依存する形で、偏心距離の導出式(M/P=σ分布から得られるD方向の長さ)と整合しない。D方向の偏心は6e/D比で決まりDのみで表される。","誤り。e=D/6は断面の核の限界で、このとき一方の縁応力度が0の三角形分布になる。図-2の分布がこの場合でなければ、D/6にはならない。","誤り。D²/(6B)は断面係数Z=BD²/6の一部のような形だが、偏心距離はM/Pであり6e/Dの比で応力が決まるのでBは関与しない。式として不適当である。"],"2025-構造-2":["誤り。梁A、Bの支持条件・スパンが異なる以上、荷重点のたわみは同一にはならない。たわみは荷重位置とスパンの3乗に比例して変わるため、1:1とはならない。","正しい。たわみは支持条件に応じたδ=αPl³/EIで求められ、同一断面・同一荷重のもとで梁A、Bの係数と有効スパンの違いからδ_A:δ_B=1:2となる。","誤り。たわみはスパンの3乗に比例し、係数も支持条件で変わる。図の梁A、Bについて各たわみ式を比較すると、比は1:3にはならない。","誤り。梁A、Bのたわみ式(δ=αPl³/EI)を比較した結果は1:2であり、1:4とはならない。荷重の条件や支持条件の評価を誤ると生じる値である。"],"2025-構造-3":["誤り。崩壊機構を仮定し、仮想仕事の原理で外力仕事=内力仕事(各塑性ヒンジの全塑性モーメント×回転角の和)を立てると、崩壊荷重は100kNより大きくなる。","正しい。柱・梁の全塑性モーメントから崩壊機構(層または梁崩壊)を仮定し、P×δ=ΣMp×θの仮想仕事式を解くと、崩壊荷重は200kNとなる。","誤り。仮想仕事法で最小の崩壊荷重を求めると200kNであり、300kNは崩壊機構を誤って仮定したか、ヒンジの数を誤った場合の値である。","誤り。崩壊荷重は最も小さい荷重を与える崩壊機構で決まる。450kNはそれより大きく、実際の崩壊荷重200kNを上回るため不適当である。"],"2025-構造-4":["正しい。2階は剛接合の門型で、柱の反曲点位置を考えて水平力3Pを柱2本が分担し、梁の端部モーメントから梁のせん断力が決まる。図の条件でせん断力比は柱A:梁B=4:3となる。","正しい。柱頭の曲げモーメントは梁端に伝わるため、節点での釣合いから柱の最大曲げモーメントと梁の最大曲げモーメントは等しくなる。","誤り。1階柱C、Dの軸力は、水平力による転倒モーメントと筋かいの鉛直分力の釣合いから決まる。その比は3:10にはならず、記述は誤りである。","正しい。1階の層せん断力4Pを筋かいが全て負担し、筋かいの角度から筋かいEの引張軸力は5Pとなる。"],"2025-構造-5":["正しい。切断法・節点法により部材Aの軸方向力を求めると、引張力N_A=+3Pとなる。","正しい。斜材Bの軸方向力は鉛直分力の釣合いから求まり、傾斜45度なので引張力N_B=+3√2Pとなる。","正しい。節点の釣合い条件から部材Cの軸方向力は引張力N_C=+Pとなる。","誤り。節点法・切断法で部材Dの軸方向力を求めると+√2Pにはならない。斜材の軸力は鉛直(または水平)分力の釣合いから求めるべきで、値が異なる。"],"2025-構造-6":["誤り。弾性座屈荷重はP=π²EI/lk²で、座屈長さlkの2乗に反比例する。構造A、B、Cの座屈長さを比べるとP_A=P_BにはならずP_A=P_C<P_Bとなる。","正しい。弾性座屈荷重は座屈長さの2乗に反比例する。構造A、Cは座屈長さが等しく、Bは座屈長さが短いため、P_A=P_C<P_Bとなる。","誤り。P_Bが最も小さいとすると、Bの座屈長さが最も長いことになる。しかし実際にはBは座屈長さが短くなる支持条件であり、P_Bが最大である。","誤り。P_Cのみが最小とはならない。座屈長さはAとCで等しく、座屈荷重もP_A=P_Cである。"],"2025-構造-7":["誤り。地下部分の水平震度は k=0.1(1-H/40)Z(Hは深さ、20m超は20m)で表され、地盤面からの深さが深くなるほど小さくなる。大きくなるとする記述が誤りである。","正しい。周期Tが長い領域では振動特性係数Rtは軟らかい地盤ほど大きく、第三種地盤は第一種より地震力が大きくなる。","正しい。Ai分布係数は上階ほど大きく、また設計用一次固有周期Tが長いほど上階での増加の度合いが大きくなる。","正しい。必要保有水平耐力の計算では、標準せん断力係数C0は1.0以上とする(Qun=Ds・Fes・Qud、Qud算定時にC0≧1.0)。"],"2025-構造-8":["正しい。風圧力の風力係数は、風洞試験によらない場合、建築物の断面・平面形状に応じて告示(平12建告1454号)に定められた数値による。","正しい。外装材用はピーク風圧力を扱うためガスト影響係数が大きく、構造骨組用の風圧力より大きい。したがって構造骨組用のほうが小さい。","正しい。ガスト影響係数Gfは、風の乱れによる時間的変動で建築物が揺れた場合の最大の力(ピーク値)を考慮する係数である。","誤り。速度圧qは q=0.6E・V0²で、Eは平均風速の高さ方向分布係数Erの2乗とGfの積に基づく。Erは高さHの冪(べき)乗の形で、Hの平方根に比例するとはいえない。"],"2025-構造-9":["正しい。圧縮力を負担する構造耐力上主要な柱の有効細長比は150以下とする(令43条6項)。","正しい。9cm角の筋かいの壁倍率は3、たすき掛けでは2倍の6が基本となるが、告示上の最大値は5で、たすき掛けの倍率は5である。","誤り。布基礎の底盤厚さは、構造計算を行わない場合、一般に15cm以上(告示1347号)とされる。12cmは不足であり不適当である。","正しい。高さ7m、延べ面積300㎡以下の木造2階建ては、壁量の検討と耐力壁のつり合い良い配置の検討で足り、許容応力度計算は要しない(一般論)。"],"2025-構造-10":["正しい。1/4の分割線上に耐力壁の中心線がある場合は、その壁を側端部分に属するものとして存在壁量に算入できる。","正しい。四分割法では側端部分とは、張り間方向は桁行方向、桁行方向は張り間方向の、それぞれ両端から1/4の部分をいう。","正しい。壁率比は壁量充足率の小さいほうを大きいほうで除して求める。","誤り。0.4/1.2≒0.33であり、壁率比は0.5以上を満たさない。側端部分の壁量充足率の一方が1を下回るので、壁率比0.5以上とするか偏心率の確認が必要である。"],"2025-構造-11":["正しい。梁のあばら筋比と柱の帯筋比は、せん断補強のため、いずれも0.2%以上とする。","正しい。高強度せん断補強筋を除き、必要な溶接長さを満たす閉鎖形の片面溶接を、135度フックに代えて用いることができる。","正しい。長期荷重時の正負最大曲げモーメントを受ける部分の引張鉄筋断面積は、引張鉄筋比0.4%以上の面積、または存在応力による必要量の4/3倍のうち、小さいほうの数値以上とする。","誤り。梁の圧縮側主筋は、圧縮側コンクリートの負担を軽減し、降伏後の曲率(変形性能)を高めるため、地震時荷重に対する靱性確保に効果がある。"],"2025-構造-12":["誤り。梁端部は塑性ヒンジが生じやすく応力が大きいので、梁端から梁せい程度の範囲にはガス圧接継手を設けるべきでない。D/2の位置は範囲内で、不適当である。","正しい。重ね継手は同一断面に集中させないよう、継手位置を重ね継手長さの1/2程度ずつずらして配筋する。","正しい。柱梁接合部内での応力伝達や定着性能を確保するため、大梁下端筋は柱内で上向きに折り曲げて定着させる。","正しい。梁せいが大きい場合は水平打継ぎ部を設けることがある。打継ぎ部のあばら筋は、フック付き重ね継手とすることができる。"],"2025-構造-13":["誤り。片側スラブ付き梁(L形梁)では、スラブが有効幅として梁の曲げ剛性を増大させる。剛性算定ではスラブの効果を考慮するのが原則で、無視するのは不適当である。","正しい。梁せいと引張鉄筋量が一定なら、梁幅を大きくすると圧縮応力度が下がり、曲げ降伏後の変形性能(靱性)が向上する。","正しい。上端筋はコンクリートの沈降・ブリーディングの影響で付着が劣るため、許容付着応力度は下端筋より小さい値を用いる。","正しい。柱梁接合部のせん断終局強度に基づいてせん断破壊の安全性を確認する場合は、許容せん断力による検討を省略できる。"],"2025-構造-14":["正しい。鉄筋の短期許容応力度は、JISに定められた最小の規格降伏点の数値(F値)を用いるのが一般的である。","正しい。保有水平耐力計算では、部材種別(破壊形式)、寸法、配筋、応力などに応じて、構造特性係数Dsを算出する。","誤り。保有水平耐力に達したときの変形と大地震時の最大応答変形は一般に一致せず、構造特性係数Dsにより靱性を考慮した大きさに換算して比較する。","正しい。限界耐力計算では、稀に発生する地震に対する損傷限界と、極めて稀に発生する地震に対する安全限界の性能を確認する。"],"2025-構造-15":["正しい。座屈拘束ブレースでは座屈拘束材が芯材の座屈を拘束するだけの剛性・曲げ耐力を要するが、軸力は芯材が負担し、拘束材は負担しない。","誤り。有効細長比λが中程度(λ=80程度)の筋かいは、座屈後の耐力低下が大きく、塑性変形能力はλが小さい(λ=20程度)筋かいに劣る。","正しい。溝形鋼筋かいの高力ボルト接合では、ボルト本数が多いほどせん断遅れが緩和され、一般に筋かい材の有効断面積は大きくなる。","正しい。側面隅肉溶接では、筋かいの軸方向力が溶接部ののど断面のせん断力としてガセットプレートに伝わる。"],"2025-構造-16":["誤り。溶接継目ののど断面に対する長期許容せん断応力度は、完全溶込み溶接も部分溶込み溶接も母材と同じF/(1.5√3)とされ、継目の形式により異ならない。","正しい。組立溶接でビードが短いと冷却が速く、硬化・低温割れが生じやすく塑性変形能力も低下しやすい。","正しい。高力ボルト摩擦接合は、破断耐力の検討では、摩擦接合面がすべって支圧接合状態となったことを想定できる。","正しい。高力ボルト摩擦接合の長期許容せん断応力度は、一面せん断で0.3T0、二面せん断でその2倍の0.6T0である。"],"2025-構造-17":["正しい。高さ31m以下でも、ルート1-2で設計できることを確認したうえで、より精緻なルート3を採用して設計してもよい。","正しい。ルート2では、標準せん断力係数C0を0.2として地震力を算定する。","誤り。ねじれ変形の抑制には、重心と剛心のずれを示す偏心率を小さくする。剛性率は層間変形の高さ方向のバランスを表す指標で、ねじれの抑制の指標ではない。","正しい。部材群の種別がCは種別Aより塑性変形能力が低いので、Dsを大きくして設計する。"],"2025-構造-18":["正しい。降伏比(降伏点/引張強さ)が小さいほど降伏後の耐力上昇が期待でき、梁の塑性変形能力は向上する。","正しい。弱軸まわりに曲げを受けるH形鋼は、幅厚比の制限に従うかぎり、許容曲げ応力度を許容引張応力度と同じとしてよい。","正しい。SN490Bは降伏点が高く、横座屈を防ぐための横補剛間隔の制限が400N級より厳しくなる。そのため、横補剛の必要箇所は多くなる。","誤り。許容圧縮応力度は細長比が大きいほど小さくなる。断面二次半径が小さいと細長比が大きくなるので、許容圧縮応力度は小さくなる。"],"2025-構造-19":["正しい。圧密沈下は、荷重による有効応力の増加に伴って間隙水が排出され、地盤が徐々に沈下する現象である。","誤り。支持力の算定式は砂質土と粘性土で異なり、N値が同じでも砂質土のほうが大きいとは一概にいえない。同じN値なら粘性土のほうが大きく評価される場合もあり、断定は不適当。","正しい。地盤の極限鉛直支持力は、一般に、土のせん断破壊(すべり破壊)が生じる荷重として決定される。","正しい。主働土圧は、壁が地盤から離れる方向に変位し、最終的に一定の最小値に落ち着いた状態で発揮される土圧である。"],"2025-構造-20":["正しい。弾性支承梁理論は、地震時の地盤変位が小さく、杭変形に影響する範囲の地盤がほぼ均一とみなせる場合に適用できる。","正しい。長い杭で杭頭回転拘束の場合、杭頭モーメントはH/(2β)で表され、β=(kB/4EI)^(1/4)である。水平地盤反力係数kが大きいほどβが大きくなり、杭頭モーメントは小さくなる。","誤り。杭頭の水平変位は1/β(β³に反比例)に比例し、水平地盤反力係数が大きいほど地盤の抵抗が増すため、杭頭水平変位は小さくなる。","正しい。応答変位法は、地震時に杭頭に作用する水平力と地盤変位を考慮して杭応力を計算する方法で、液状化しやすい軟弱地盤の検討にも適用できる。"],"2025-構造-21":["正しい。負の摩擦力が生じる可能性がある場合、杭表面に潤滑材(瀝青材など)を塗布すると摩擦力の低減に効果がある。","誤り。斜面近傍の杭は、斜面側の地盤の水平抵抗が小さく、水平力に対する地盤反力が低下する。そのため、負担するせん断力は斜面から離れた杭に比べて小さくなる。","正しい。杭に作用する水平力は基礎スラブの根入れ深さで一定範囲低減できるが、地上部分の高さが大きいほど低減の度合いは小さくなる。","正しい。直接基礎の即時沈下の計算では、粘性土・砂質土とも、変形係数とポアソン比を適切に設定した弾性体と仮定してもよい。"],"2025-構造-22":["正しい。PC部材はプレストレスにより、地震後にひび割れが閉じて変形も元に戻る復元性があり、残留変形が小さい。","誤り。長期設計荷重時に引張応力を生じさせないのはI種(フルプレストレッシング)の設計である。II種は引張応力が生じてもひび割れは生じさせない設計である。","正しい。アンボンドPC鋼材を用いたポストテンション梁では、常時荷重の保持に対する冗長性を高めるため、バックアップシステムを設ける必要がある。","正しい。PC鋼材定着部では、コンクリートの支圧破壊を避けるため、支圧板とコンクリート端面の接触面積を広くとる。"],"2025-構造-23":["誤り。壁式RC造と壁式PCa鉄筋コンクリート造は、規定に適合すれば同一階で併用できる場合があり、混用できないと断定する記述は不適当である。","正しい。合成梁ではスラブに拘束された上フランジの局部座屈は生じにくく、検討は一般に下フランジの局部座屈について行えばよい。","正しい。方向によって構造が異なる場合は、方向別にそれぞれの構造計算等の規定を適用することができる。","正しい。CFT造柱で梁からのせん断力の一部を充填コンクリートに負担させる場合は、鋼管と充填コンクリートの間で応力伝達できるよう設計する。"],"2025-構造-24":["正しい。せん断パネルは設置高さが層高に比べて小さく、変形が局所に集中するため、せん断変形角は層間変形角より大きくなる。","正しい。オイルダンパーは速度に比例する減衰力を発揮するため、揺れが比較的小さな段階から制振効果を発揮する。","正しい。直動型転がり支承は引張に抵抗でき、超高層免震建築物で転倒モーメントによりアイソレータに大きな引張軸力が生じる場合などに採用される。","誤り。積層ゴムアイソレータは、長期荷重時の圧縮応力度が中心部で大きく外周部で小さい分布となる。外周部のほうが大きいとする記述は誤りである。"],"2025-構造-25":["正しい。完全スリットを設けても、腰壁は梁と一体であり梁せいを実質的に増大させるため、腰壁付き梁の剛性評価では腰壁の影響を考慮する必要がある。","正しい。保有水平耐力は、崩壊形を形成する際に、各階の柱・耐力壁・筋かいが負担する水平せん断力の和として求められる。","誤り。筋かい付き架構は筋かいの座屈や破断の影響で塑性変形能力が低下する。同じ種別で筋かいのない架構より、Dsを小さくすることはできない。","正しい。剛性率が所定の値(0.6)未満の階は、その階のみ必要保有水平耐力を割増す(形状係数Fsを大きくする)。他の階は割増ししない。"],"2025-構造-26":["正しい。超高層建築物は風方向だけでなく、風向に直交する方向やねじれ方向にも振動しやすく、風圧力に対する検討ではこれらの振動も考慮する必要がある。","正しい。プレストレスの減少は、コンクリートの弾性変形やクリープ、乾燥収縮、PC鋼材のリラクセーション等による。一般にポストテンション方式のほうがプレテンション方式より減少率は小さい。","正しい。露出柱脚の最大せん断耐力は、柱脚底面の摩擦によるせん断耐力と、アンカーボルトのせん断耐力のいずれか大きいほうを採用する考え方による。","誤り。開口を有する耐力壁のせん断耐力は、開口面積だけでなく開口の長さや高さの影響も受ける。開口周比などにより低減係数を求めるため、長さ・高さの影響を無視してはならない。"],"2025-構造-27":["正しい。木材を常時湿潤状態にある部分に使用する場合、強度が低下するため、許容応力度は所定の割合（0.8倍）に減じた値を用いる。","正しい。構造用集成材は欠点を分散・除去したラミナを積層しており、同樹種であれば繊維方向のせん断に対する許容応力度は一般に構造用製材より大きい。","誤り。木材の短期許容応力度は、長期の2倍ではない。長期は基準強度の1.1/3、短期（積雪時以外）は2/3であり、短期は長期の約1.8倍（2/1.1倍）となる。","正しい。機械等級区分構造用製材は、人工乾燥処理を施した構造用製材のヤング係数を機械で測定して等級区分したもので、日本農林規格に定められている。"],"2025-構造-28":["誤り。コンクリートの圧縮強度は、載荷速度が大きいほど見かけ上大きくなり、速度が小さいほど小さくなる。「載荷速度が大きいほど小さい」は逆である。","正しい。引張強度も圧縮強度と同様に水セメント比が大きいほど小さくなる。引張強度は圧縮強度の概ね1/10〜1/13程度である。","正しい。コンクリートの曲げ強度は引張強度と相関が高く、一般に引張強度が大きいほど曲げ強度も大きい。","正しい。水セメント比が小さいほど圧縮強度が高く、ヤング係数も圧縮強度の増加に伴って大きくなる。"],"2025-構造-29":["正しい。シャルピー衝撃試験の吸収エネルギーが大きい鋼材は靱性が高く、溶接部などの脆性破壊の防止に有効である。","正しい。SN490Bの板厚40mm以下の基準強度Fは325N/mm²で、短期許容引張応力度はFに等しく325N/mm²となる。","誤り。建築構造用圧延鋼材SN400は、板厚精度を高めるため、厚さのマイナス許容差が一般構造用圧延鋼材SS400より小さく規定されており、同じではない。","正しい。リン(P)や硫黄(S)は靱性・延性を劣化させ、溶接割れの原因にもなるため、これらの含有量が少ない鋼材を使用することが望ましい。"],"2025-構造-30":["正しい。補強コンクリートブロック造の塀の構造計算では、地下部分の水平震度は建築物の地下部分と同様に計算してよい。","正しい。CFTのコンファインド効果（内部コンクリートの拘束効果）は、拘束が均一に働く円形鋼管のほうが角形鋼管より高い。","誤り。告示に基づくプレキャスト鉄筋コンクリート造の柱・梁の鉄筋に対する最小かぶり厚さは、一般の鉄筋コンクリート造と同じとは限らず、告示で別に定められている。同じ厚さとする記述は不適当である。","正しい。鋼管杭は、地盤が強酸性でない場合、一般に腐食代として外面に1mmを見込んで設計する。"],"2024-構造-1":["誤り。断面二次モーメントが(5/2)a⁴では小さすぎる。図の断面を軸に関して合成すると10a⁴となり、これに対応する断面係数も一致しない。","誤り。Z=5a³は正しいが、断面二次モーメントが(5/2)a⁴では小さすぎる。図の断面のX軸に関する値は10a⁴である。","誤り。I=10a⁴は正しいが、断面係数Z=I/y（yは中立軸から縁までの距離）であり、I/Z=2aとなるはずなので(5/4)a³では整合しない。","正しい。X軸に関する断面二次モーメントはI=10a⁴で、縁端までの距離を2aとすると断面係数はZ=I/y=10a⁴/2a=5a³となり、両者が整合する。"],"2024-構造-2":["誤り。ヒンジ点に作用するPは、両側の部材の曲げ剛性と支持条件に応じて分担される。EIと2EIの違いがあるため、反力が等しく1:1にはならない。","誤り。ヒンジ点Bのたわみの適合条件と両側の剛性（AB間EI、BC間2EI）から反力を求めると、比は2:1にはならない。","正しい。ヒンジ点Bに作用する鉛直力Pを、AB間とBC間の剛性・支持条件による変形の適合から分配して反力を求めると、RA:RC=4:1となる。","誤り。曲げ剛性比（EI：2EI）と支持条件から分担を求めると、RAとRCの比は8:1にならず4:1である。"],"2024-構造-3":["誤り。節点の曲げモーメントの釣合いや、各柱のせん断力×高さによる柱脚・柱頭モーメントの関係を満たさず、正しい曲げモーメント図とならない。","誤り。柱頭・柱脚のモーメントの大きさや節点での釣合いが、荷重6Pと各部材の剛性から求まる値と一致しない。","誤り。左右の柱の負担割合が逆であるなど、剛性と荷重から求まる曲げモーメントの分布と整合しない。","正しい。A点が自由端であることとB点が剛接合であることから、節点の釣合いと各柱のせん断力分担を考慮して求めた曲げモーメント図と一致する。"],"2024-構造-4":["正しい。筋かいの水平分力を水平荷重180kNから差し引いた分を柱が負担し、柱頭A点の曲げモーメントは柱のせん断力×柱高さとなり、60kN・mとなる。","誤り。筋かいBCの引張力100kNの水平分力を考慮して柱ABの負担せん断力を求めると、柱頭の曲げモーメントは120kN・mにならない。","誤り。水平荷重の筋かいと柱への分担を釣合いから求めると、柱頭モーメントは180kN・mとはならない。","誤り。B点はピン支持なので柱脚にモーメントは生じず、柱頭の曲げモーメントは柱のせん断力×柱高さである。この値は240kN・mにならない。"],"2024-構造-5":["誤り。斜材の軸方向力は、切断した部分の鉛直せん断力を斜材の角度で分担して求まる。斜材ごとに受け持つせん断力が異なるため、1:1:1にならない。","誤り。切断法で各斜材の位置における鉛直せん断力から軸力を求めると、比は3:2:1にならない。","誤り。切断法による各斜材の軸力の比は、4:2:1にはならない。","正しい。切断法により各斜材を含む断面の鉛直せん断力を求め、斜材角度で軸力に換算すると、NA:NB:NC=5:3:1となる。"],"2024-構造-6":["誤り。弾性座屈荷重Pk=π²EI/lk²であり、支持条件による座屈長さと断面二次モーメントで決まる。PAがPB・PCより小さいとは言えるが、PB<PCにはならない。","正しい。座屈荷重は座屈長さの2乗に反比例し、断面二次モーメントに比例する。支持条件と断面から、PAが最小でPBとPCは等しくなる。","誤り。PAとPBが等しくなるわけではない。座屈長さと断面二次モーメントから、PAが最も小さい。","誤り。PCが最小とはならない。座屈長さと断面二次モーメントから評価するとPAが最小である。"],"2024-構造-7":["正しい。地震動の応答スペクトルは、周期が長くなるほど加速度応答は小さくなる一方、変位応答は大きくなる傾向がある。","正しい。1次の振動モードは最も低次で、固有周期は2次以上の高次モードより長い。","正しい。固有周期T=2π√(m/k)であり、質量が同じなら水平剛性kが大きいほど固有周期は短くなる。","誤り。固有周期またはそれに近い周期で加振される共振状態では、減衰定数が大きいほどエネルギー吸収が大きく、振幅は小さくなる。「大きい振幅」は逆である。"],"2024-構造-8":["正しい。多雪区域以外の一般の地域では、暴風時又は地震時の荷重に積雪荷重を組み合わせる必要はない。","正しい。平均風速の高さ方向分布係数Erは地表面粗度区分で決まり、都市化が極めて著しい区域（粗度区分Ⅳ）は、極めて平坦で障害物がない区域（Ⅰ）より小さい。","正しい。地震地域係数Zは、過去の地震記録等に基づき1.0〜0.7の範囲で地方ごとに定められている。","誤り。地震層せん断力は、その階が支える部分（当該階より上の全重量）の固定荷重と積載荷重の和に、せん断力係数Ciを乗じて算出する。その階のみの荷重ではない。"],"2024-構造-9":["正しい。心持ち材は乾燥収縮による割れが生じやすいため、背割りを入れて割れを制御することがある。","正しい。横座屈の防止には、梁せいを大きくするより梁幅を大きくして横方向の曲げ剛性を高めるほうが効果的である。","誤り。母屋の継手は、曲げモーメントが大きい中央部を避け、小屋束の近く（支持点付近）に設けるのが原則である。","正しい。床梁の中央付近の上端に切欠きを設ける場合、有効断面は切欠きを除いた正味断面として計算する。"],"2024-構造-10":["誤り。四分割法では側端部分の存在壁量/必要壁量から壁量充足率を求め、方向ごとの比を算出する。X方向0.50、Y方向0.75は図から得られる値と一致しない。","正しい。日本瓦葺きの2階建て1階の必要壁量と側端部分の存在壁量から壁量充足率を求め、小さいほう/大きいほうで壁率比を算出すると、X方向0.75、Y方向0.50となる。","誤り。Y方向の壁率比が1.00になるには両側端部の充足率が等しい必要があるが、図の配置ではそうならず、Y方向は0.50となる。","誤り。X方向が1.00、Y方向が0.75となる配置ではない。図の耐力壁の配置から求めた値はX方向0.75、Y方向0.50である。"],"2024-構造-11":["誤り。図のひび割れの状況が、示された荷重条件での柱梁接合部のせん断ひび割れの説明と整合せず、記述として最も不適当である。","正しい。柱梁接合部内に定着された梁上端筋が引張力を受けると、定着部周辺の柱梁接合部や柱にひび割れが生じ、図と説明が整合する。","正しい。開口を有する耐力壁が水平力を受けると、開口隅角部から斜め方向のせん断ひび割れが生じる。","正しい。2本杭の基礎スラブでは、柱の圧縮軸力と杭の支持力により、杭間を結ぶ方向に曲げ・せん断によるひび割れが生じる。"],"2024-構造-12":["正しい。通し配筋の梁主筋の強度を高くすると付着応力が大きくなるため、定着性能の確保には柱せいを大きくすることが有効である。","誤り。鉄筋のガス圧接継手は、存在応力度を伝達できればよいのではなく、母材と同等の強度（母材の引張強度）を伝達できる継手とすることが求められる。","正しい。鉄筋コンクリートの単位体積重量は設計基準強度に応じて定められており、強度の異なるコンクリートを使う場合はそれぞれに応じた値を用いる。","正しい。梁の許容曲げモーメントの算出では、圧縮力をコンクリートのほか圧縮側の主筋も負担するものとして計算する。"],"2024-構造-13":["正しい。柱の長期許容せん断力は、帯筋の効果を見込まず、コンクリートのせん断強度のみで算定する。","誤り。せん断補強筋の長期許容引張応力度はSD295とSD345とも195N/mm²で同じなので、SD345に変更しても梁の長期許容せん断力は大きくならない。","正しい。梁の短期許容せん断力の算定では、主筋のダボ作用などによるせん断力の負担は考慮せず、コンクリートとあばら筋で負担する。","正しい。開口周囲の縦筋・横筋の負担分を考慮して、設計用せん断力に対する開口補強筋量を算定してよい。"],"2024-構造-14":["正しい。コンクリートの設計基準強度が大きいほど、曲げ降伏する梁の圧縮域が小さくなり、靱性は一般に高くなる。","正しい。柱のせん断耐力は、内法高さが小さい（せん断スパン比が小さい）ほど大きくなるが、脆性的なせん断破壊の危険が増す。","誤り。柱梁接合部のせん断耐力は、材料強度と接合部の形状で決まり、取り付く梁の主筋量には依存しない。梁主筋量が多いと入力せん断力が大きくなる。","正しい。耐力壁のせん断耐力は、他の条件が同じなら、引張側柱内の主筋量が多いほど一般に大きくなる。"],"2024-構造-15":["正しい。H形鋼梁に横座屈が生じると、圧縮側フランジ等が面外に変形し、その領域で局部座屈が生じやすくなる。","誤り。降伏比（降伏点/引張強さ）が大きいと、降伏後の耐力上昇が小さく塑性化領域が広がりにくく、塑性変形能力は低下する。向上するとは言えない。","正しい。塑性変形能力確保のためのウェブの幅厚比の上限値は、基準強度Fが同じなら、梁より軸力を負担する柱のほうが小さく（厳しく）設定されている。","正しい。根巻き形式柱脚は、根巻きコンクリートの主筋の降伏が他の破壊モードより先行するように設計する。"],"2024-構造-16":["誤り。強度の異なる鋼材を突合せ溶接する場合、溶接継目の許容応力度は、強度が低いほうの鋼材の許容応力度とする。高いほうの鋼材と同じとはできない。","正しい。通しダイアフラムと梁フランジの突合せ溶接部で許容値を超える食い違いやずれが生じた場合は、適切な補強を行う必要がある。","正しい。高力ボルト摩擦接合は、摩擦面にすべりが生じるまでは、ボルトにせん断力は生じず、接合部の摩擦力で応力を伝達する。","正しい。高力ボルトの最小縁端距離は、せん断縁・手動ガス切断縁より、自動ガス切断縁・圧延縁・鋸引き縁等のほうが小さい。"],"2024-構造-17":["正しい。ルート1-1では、スパンを6m以下とするなどの規定を満たす必要がある。","誤り。ルート1-2は、偏心率が一定値以下であることの確認を前提に標準せん断力係数0.3以上とし、地震力を割り増す。偏心率の確認を行わないとする記述は不適当である。","正しい。ルート2では、地上部分の塔状比を4以下とする規定がある。","正しい。ルート3において、筋かい付き骨組の保有水平耐力は、柱及び筋かいの水平せん断耐力の和として求める。"],"2024-構造-18":["誤り。塑性変形能力確保のための柱・梁の幅厚比の上限値は、基準強度Fが大きい（高強度）ほど局部座屈しやすいため、小さく
