{year:2019,subject:'構造',no:1,text:'等質で、図－1のような断面形状の部材に、図－2のように断面力として曲げモーメントMのみが作用している。この断面の降伏開始曲げモーメントをMy、全塑性モーメントをMpとするとき、M≦Myの場合とM＝Mpの場合の中立軸の位置の組合せとして、正しいものは、次のうちどれか。ただし、中立軸の位置は断面下縁から測るものとする。',choices:['M≦Myの場合: 200 mm、M＝Mpの場合: 250 mm','M≦Myの場合: 250 mm、M＝Mpの場合: 200 mm','M≦Myの場合: 250 mm、M＝Mpの場合: 300 mm','M≦Myの場合: 300 mm、M＝Mpの場合: 250 mm'],answer:3,hasFigure:true,figureDesc:'図－1: T字型断面（上フランジ幅300mm、上フランジ高さ100mm、ウェブ幅100mm、ウェブ高さ300mm、全高400mm）。図－2: 部材に曲げモーメントMが両端に作用。'},
{year:2019,subject:'構造',no:2,text:'図のような材料とスパンが同じで、断面が異なる単純梁A、B及びCの中央に集中荷重Pが作用したとき、それぞれの梁の曲げによる中央たわみδA、δB及びδCの比として、正しいものは、次のうちどれか。ただし、梁は弾性部材とし、自重は無視する。また、梁B及びCを構成する部材の接触面の摩擦はないものとする。',choices:['δA : δB : δC ＝ 1 : 1 : 1','δA : δB : δC ＝ 1 : 1 : 4','δA : δB : δC ＝ 1 : 2 : 4','δA : δB : δC ＝ 1 : 4 : 8'],answer:2,hasFigure:true,figureDesc:'梁A: 断面2a×2a、梁B: 2枚重ねの断面各2a×a、梁C: 2枚並べた断面各a×2a。いずれもスパンl、中央集中荷重P。'},
{year:2019,subject:'構造',no:3,text:'図のようなラーメンに荷重10Pが作用したときの曲げモーメント図として、正しいものは、次のうちどれか。ただし、梁部材の曲げ剛性は2EI、柱部材の曲げ剛性は3EIとし、図のA点は自由端、B点は剛接合とする。また、曲げモーメントは材の引張側に描くものとする。',choices:['柱脚3Pl、柱頭左10Pl・6Pl、梁右端4Pl・2Pl（選択肢1の曲げモーメント図）','柱脚6Pl、柱頭左10Pl・6Pl、梁右端4Pl・4Pl（選択肢2の曲げモーメント図）','柱脚2Pl、柱頭左10Pl・6Pl・4Pl、梁右端3Pl（選択肢3の曲げモーメント図）','柱脚4Pl、柱頭左10Pl・6Pl・4Pl、梁右端6Pl（選択肢4の曲げモーメント図）'],answer:1,hasFigure:true,figureDesc:'L字型ラーメン。A点（左端自由端）に10Pの鉛直荷重。梁スパンl×2、柱高さl。梁曲げ剛性2EI、柱曲げ剛性3EI。B点は剛接合。右側2本の柱は固定端。'},
{year:2019,subject:'構造',no:4,text:'図のような水平力が作用する2層構造物（1層の水平剛性2K、2層の水平剛性K）において、1層の層間変位δ1と2層の層間変位δ2との比として、正しいものは、次のうちどれか。ただし、梁は剛とし、柱の軸方向の伸縮はないものとする。',choices:['δ1 : δ2 ＝ 1 : 2','δ1 : δ2 ＝ 1 : 4','δ1 : δ2 ＝ 2 : 3','δ1 : δ2 ＝ 3 : 4'],answer:4,hasFigure:true,figureDesc:'2層構造物。2層に2Pの水平力、1層にPの水平力。2層の水平剛性K、1層の水平剛性2K。柱脚固定。'},
{year:2019,subject:'構造',no:5,text:'図のような荷重が作用するトラスにおいて、部材ABに生じる軸方向力として、正しいものは、次のうちどれか。ただし、軸方向力は、引張力を「＋」、圧縮力を「－」とする。',choices:['－12/(7√3) P','－2/(7√3) P','＋2/(7√3) P','＋12/(7√3) P'],answer:2,hasFigure:true,figureDesc:'正三角形を組み合わせたワーレントラス。左端ピン支持、右端ローラー支持（壁）。上弦にA点、下弦にB点。各角度60°。スパン2l×4＋l。上弦2箇所に鉛直荷重P。'},
{year:2019,subject:'構造',no:6,text:'次の架構のうち、静定構造はどれか。',choices:['ピン支持2点の門型ラーメンに斜材（選択肢1の架構図）','ピン支持＋固定支持の門型ラーメンに斜材（選択肢2の架構図）','ピン支持2点の門型ラーメンに斜材・中間ピン（選択肢3の架構図）','固定支持2点の門型ラーメンにピン接合・吊り材（選択肢4の架構図）'],answer:3,hasFigure:true,figureDesc:'4つの架構が図示されている。各架構の支持条件と部材配置が異なる。'},
{year:2019,subject:'構造',no:7,text:'建築基準法における建築物の構造計算に用いる風圧力に関する次の記述のうち、最も不適当なものはどれか。',choices:['風圧力の計算に用いる速度圧qは、その地方について定められている基準風速V0の2乗に比例する。','基準風速V0は、稀に発生する暴風時の地上10mにおける10分間平均風速に相当する値である。','ガスト影響係数Gfは、「平坦で障害物がない区域」より「都市化が著しい区域」のほうが大きい。','風圧力は、一般に、「外装材に用いる場合」より「構造骨組に用いる場合」のほうが大きい。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'構造',no:8,text:'建築基準法における荷重及び外力に関する次の記述のうち、最も不適当なものはどれか。',choices:['多雪区域以外の区域において、積雪荷重の計算に用いる積雪の単位荷重は、積雪量1cm当たり20N/m2以上とする。','店舗の売場に連絡する廊下の床の構造計算に用いる積載荷重は、建築物の実況に応じて計算しない場合、店舗の売場の床の積載荷重を用いることができる。','建築物の地下部分の各部分に作用する地震力は、一般に、当該部分の固定荷重と積載荷重との和に水平震度を乗じて計算する。','建築物の固有周期が長い場合や地震地域係数Zが小さい場合には、地震層せん断力係数Ciは、標準せん断力係数C0より小さくなる場合がある。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'構造',no:9,text:'木造軸組工法による地上2階建ての建築物の壁量の計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['平面が長方形の建築物において、必要壁量が地震力により決定される場合、張り間方向と桁行方向の必要壁量は異なる値となる。','風圧力に対する2階の必要壁量は、2階床面からの高さ1.35mを超える部分の見付面積に所定の数値を乗じて得た数値となる。','壁倍率2の耐力壁の長さの合計が9mの場合の存在壁量と、壁倍率3の耐力壁の長さの合計が6mの場合の存在壁量は同じ値となる。','壁倍率1.5の筋かいを入れた軸組の片面に、壁倍率2.5の構造用合板を所定の方法で打ち付けた耐力壁の壁倍率は4となる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'構造',no:10,text:'木造軸組工法による地上2階建ての建築物に関する次の記述のうち、最も不適当なものはどれか。',choices:['構造耐力上主要な柱について、やむを得ず柱の所要断面積の1/3を切り欠きしたので、切り欠きした部分が負担していた力を伝達できるように金物で補強した。','圧縮力と引張力の両方を負担する筋かいとして、厚さ1.5cm、幅9cmの木材を使用した。','国土交通大臣が定める基準に従った構造計算によって構造耐力上安全であることを確かめたので、小屋組の振れ止めを省略した。','構造耐力上主要な柱の小径を、横架材の相互間の垂直距離に対する割合によらず、国土交通大臣が定める基準に従った構造計算によって決定した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'構造',no:11,text:'鉄筋コンクリート構造の設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['耐力壁は、一般に、付着割裂破壊が発生しにくいことから、付着割裂破壊の検討を省略した。','柱の付着割裂破壊を防止するために、柱の引張鉄筋比を大きくした。','柱のせん断圧縮破壊を防止するために、コンクリートの設計基準強度を高くすることにより、コンクリートの圧縮強度に対する柱の軸方向応力度の比を小さくした。','柱梁接合部内に、帯筋比が0.3％以上となるように帯筋を配筋した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'構造',no:12,text:'鉄筋コンクリート構造の梁に関する次の記述のうち、最も不適当なものはどれか。',choices:['最小あばら筋比は、曲げひび割れの発生に伴う急激な剛性の低下を防ぐために規定されている。','あばら筋の長期許容応力度は、SD295AからSD345に変更しても、大きくはならない。','主筋のコンクリートに対する許容付着応力度は、下端筋より上端筋のほうが小さい。','圧縮側の主筋は、長期荷重によるクリープたわみを抑制する効果がある。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'構造',no:13,text:'鉄筋コンクリート構造の配筋に関する次の記述のうち、最も不適当なものはどれか。ただし、図に記載のない鉄筋は適切に配筋されているものとする。',choices:['断面内に打継ぎ部を有する基礎梁において、必要な定着長さが確保されていたので、図－1に示すように、基礎梁の側面にあばら筋の重ね継手を設けた。','片側に床スラブが取り付いた梁のあばら筋において、必要な余長が確保されていたので、図－2に示すように、あばら筋の末端の一端を90度フックとした。','梁下端主筋において、必要な重ね継手長さを確保したうえで、応力集中を避けるために、図－3に示すように、継手位置をずらして配筋した。','長方形孔を有する梁において、あばら筋に加え、図－4に示すように、軸方向補強筋を長方形孔の上下に配筋した。'],answer:3,hasFigure:true,figureDesc:'図－1: 基礎梁の断面図（打継ぎ部にあばら筋の重ね継手）。図－2: 片側床スラブ付き梁の断面図（あばら筋90度フック）。図－3: 梁下端主筋の配筋図（継手位置をずらした平面図）。図－4: 長方形孔を有する梁の配筋図（軸方向補強筋）。'},
{year:2019,subject:'構造',no:14,text:'鉄筋コンクリート構造の柱梁接合部に関する次の記述のうち、最も不適当なものはどれか。',choices:['外柱の柱梁接合部においては、一般に、靱性を確保するために、梁の下端筋は上向きに折り曲げて定着させる。','柱梁接合部の設計用せん断力は、取り付く梁が曲げ降伏する場合、曲げ降伏する梁の引張鉄筋量を増やすと大きくなる。','柱梁接合部の許容せん断力は、柱梁接合部の帯筋量を増やすと大きくなる。','柱梁接合部の許容せん断力は、コンクリートの設計基準強度を高くすると大きくなる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'構造',no:15,text:'鉄骨構造の設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['床面の水平せん断力を伝達するために、小梁と水平ブレースによりトラス構造を形成する場合、小梁は軸方向力も受ける部材として検討する必要がある。','角形鋼管を用いて柱を設計する場合、横座屈を生じるおそれがないので、許容曲げ応力度を許容引張応力度と同じ値とすることができる。','H形鋼を用いた梁に均等間隔で横補剛材を設置して保有耐力横補剛とする場合において、梁を建築構造用圧延鋼材SN400Bから同一断面の建築構造用圧延鋼材SN490Bに変更することにより、横補剛の数を減らすことができる。','圧縮材の中間支点の横補剛材は、許容応力度設計による場合、圧縮材に作用する圧縮力の2％以上の集中力が加わるものとして設計する。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'構造',no:16,text:'鉄骨構造の設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['柱の許容圧縮応力度の算定に用いる限界細長比は、基準強度F値が大きいほど大きくなる。','骨組の塑性変形能力を確保するために定められている柱及び梁の幅厚比の上限値は、基準強度F値が大きいほど小さくなる。','骨組の塑性変形能力を確保するために定められているH形鋼（炭素鋼）の梁の幅厚比の上限値は、フランジよりウェブのほうが大きい。','大地震時に、筋かい（炭素鋼）に必要な塑性変形能力を発揮させるために、筋かい端部及び接合部の破断耐力は、筋かい軸部の降伏耐力の1.2倍以上とする。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'構造',no:17,text:'鉄骨構造の接合部に関する次の記述のうち、最も不適当なものはどれか。',choices:['梁フランジを通しダイアフラムに突合せ溶接する場合、梁フランジは、通しダイアフラムを構成する鋼板の厚みの内部で溶接しなければならない。','強度の異なる鋼材を突合せ溶接する場合、強度の高いほうの鋼材に対応した溶接材料、溶接条件とすることにより、溶接部の許容応力度は、強度の高いほうの鋼材と同じ許容応力度とすることができる。','高力ボルト摩擦接合において、肌すきが1mm以内であれば、フィラープレートを挿入せず、そのまま高力ボルトを締め付けてもよい。','高力ボルトの最小縁端距離は、一般に、「手動ガス切断縁の場合」より「自動ガス切断縁の場合」のほうが小さい値である。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'構造',no:18,text:'柱材に板厚6mm以上の建築構造用冷間ロール成形角形鋼管（BCR）を用い、通しダイアフラム形式とした建築物の耐震計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['「ルート1－1」において、標準せん断力係数C0を0.2として地震力の算定を行った。','「ルート1－2」において、標準せん断力係数C0を0.3として地震力の算定を行い、柱に生じる力を割増したので、層間変形角及び剛性率の検討を省略した。','「ルート2」において、最上階の柱頭部及び1階の柱脚部を除く全ての接合部については、柱の曲げ耐力の和が、柱に取り付く梁の曲げ耐力の和の1.5倍以上となるように設計した。','「ルート3」において、局部崩壊メカニズムとなったので、柱の耐力を低減して算定した保有水平耐力が、必要保有水平耐力以上であることを確認した。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'構造',no:19,text:'土質及び地盤に関する次の記述のうち、最も不適当なものはどれか。',choices:['液状化の判定を行う必要がある土層は、一般に、地表面から20m程度以浅の沖積層の飽和砂質土層である。','地下水には自由水、被圧水及び宙水があり、地下工事中に発生することがある根切り底面の盤ぶくれは、被圧水が原因である。','一軸圧縮試験は、粘性土の強度や変形係数を調べる簡便な方法で、実用性も高い。','砂質土地盤の支持力式に用いる内部摩擦角φは、砂質土が密実になるほど小さくなる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'構造',no:20,text:'図のような杭基礎の設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['上部地盤が砂質土で地震時に液状化するおそれがある場合、各杭の水平抵抗力が低下しないよう地盤改良等の対策を行う。','上部地盤が粘性土で将来にわたって地盤沈下するおそれがある場合、各杭が地盤から突出する影響を考慮して杭の水平抵抗の検討を行う。','各杭の径が同じ場合、地震時に各杭が負担する水平力は杭長に応じて異なるものとして、杭の設計を行う。','各杭の長さが異なるので、地震時の杭の水平抵抗の検討のために、支持層の近傍で孔内水平載荷試験を行う。'],answer:4,hasFigure:true,figureDesc:'建築物の杭基礎の断面図。上部地盤20m、杭長10m、支持層あり。'},
{year:2019,subject:'構造',no:21,text:'直接基礎及び杭基礎の設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['直接基礎の即時沈下の計算において、粘性土地盤及び砂質土地盤ともにヤング率及びポアソン比を適切に設定した弾性体と仮定してもよい。','杭の引抜き抵抗力の計算において、長期及び短期ともに杭の有効自重（自重から浮力を減じた値）を引抜き抵抗力として考慮することができる。','杭基礎を有する建築物において、杭に作用する水平力は、建築物の地上部分の高さ及び基礎スラブの根入れ深さに応じて、一定の範囲で低減することができる。','杭の水平抵抗の検討に用いる水平方向地盤反力係数Kh(kN/m3)は、一様な地盤においては杭径が大きくなるほど大きくなる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'構造',no:22,text:'プレストレストコンクリート構造の設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['プレキャスト部材を継ぎ合わせて、プレストレスにより圧着接合する場合、圧着部の継目に生じるせん断力は、摩擦抵抗機構のみで伝達するように設計する。','ポストテンション材の緊張材定着部では、コンクリートの支圧破壊を避けるために、耐圧板とコンクリート端面との接触面積が広くなるように設計する。','ポストテンション方式によるプレストレストコンクリート構造の床版において、防錆材により被覆された緊張材を使用する場合、緊張材が配置されたシース内にグラウト材を注入しなくてもよい。','プレストレストコンクリート部材に導入されたプレストレス力は、緊張材のリラクセーション等により、時間の経過とともに増大する。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'構造',no:23,text:'各種建築構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['H形断面の鉄骨梁と鉄筋コンクリートスラブを頭付きスタッドを介して緊結した合成梁では、一般に、上下フランジのいずれも、局部座屈の検討を省略することができる。','H形断面の鉄骨梁と鉄筋コンクリートスラブを接合する頭付きスタッドの設計に用いる水平せん断力は、曲げ終局時に合成梁の各断面に作用する圧縮力及び引張力の関係から計算できる。','地震時の軸力変動により引張力が生じる鉄骨鉄筋コンクリート造の最下階の鉄骨柱脚は、原則として、埋込み形式とする。','鉄骨鉄筋コンクリート造の柱のせん断終局耐力は、鉄骨部分と鉄筋コンクリート部分において、それぞれの「曲げで決まる耐力」と「せん断で決まる耐力」のいずれか小さいほうの耐力を求め、それらの耐力の和とすることができる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'構造',no:24,text:'免震構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['免震構造は、一般に、上部構造の水平剛性が大きくなると、上部構造の床応答加速度も大きくなる。','免震構造は、一般に、上部構造の質量及び剛性の偏在等によるねじれ変形が抑制される。','免震構造に用いられる粘性ダンパーは、速度に応じた減衰力を発揮し、免震層の過大な変形を抑制する働きがある。','免震構造に用いられる積層ゴムアイソレーターの水平剛性は、面圧（支持軸力を積層ゴムの水平断面積で除した値）の大きさによって変化する。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'構造',no:25,text:'制振構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['制振構造に設置するダンパーは、建築物全体の耐力分布や振動性状を踏まえて、適切に配置する。','制振構造に用いられるオイルダンパーは、建築物の動きが比較的小さな段階から制振効果を発揮する。','制振構造に用いられる履歴型ダンパーの耐力は、地震後の建築物の残留変形を抑制するために、柱と梁からなる主架構の耐力よりも大きくする。','鋼材や鉛等の金属製の履歴型ダンパーは、金属が塑性化する際のエネルギー吸収能力を利用するものであり、安定した復元力特性と十分な疲労強度が必要である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'構造',no:26,text:'建築物の耐震設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['純ラーメン構造の場合、地震時の柱の軸方向力の変動は、一般に、中柱より外柱のほうが大きい。','鉄筋コンクリート造の腰壁付き梁の剛性は、腰壁と柱との間に完全スリットを設けた場合であっても、腰壁の影響を考慮する必要がある。','構造特性係数Dsは、一般に、架構が靱性に富むほど小さくすることができる。','連層の耐力壁に接続する梁（境界梁）の曲げ耐力及びせん断耐力を大きくすると、一般に、地震力に対する耐力壁の負担せん断力が小さくなる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'構造',no:27,text:'木材に関する次の記述のうち、最も不適当なものはどれか。',choices:['木表は、一般に、木裏に比べて乾燥収縮率が大きいので、木表側に凹に反る性質がある。','木材の強度は、一般に、同じ乾燥状態であれば密度が大きいものほど高い。','含水率が繊維飽和点以下の木材の乾燥収縮率は、一般に、「年輪の接線方向」より「年輪の半径方向」のほうが大きい。','構造用材料の弾性係数は、一般に、気乾状態から含水率が繊維飽和点に達するまでは、含水率が大きくなるにしたがって小さくなる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'構造',no:28,text:'コンクリートの一般的な性質に関する次の記述のうち、最も不適当なものはどれか。',choices:['コンクリートの圧縮強度は、水セメント比が小さいほど高い。','コンクリートの中性化速度は、水セメント比が小さいほど速い。','コンクリートのヤング係数は、コンクリートの圧縮強度が高いほど大きい。','水和熱によるコンクリートのひび割れは、単位セメント量が少ないコンクリートほど発生しにくい。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'構造',no:29,text:'鋼材に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築構造用圧延鋼材（SN材）は、板厚が40mmを超えても、40mm以下の材と同じ基準強度が保証されている。','建築構造用圧延鋼材（SN材）C種は、B種の規定に加えて板厚方向の絞り値の下限が定められており、溶接加工時を含め板厚方向に大きな引張力が作用する角形鋼管柱の通しダイアフラム等に用いられている。','板厚が一定以上の建築構造用冷間ロール成形角形鋼管BCR295については、降伏比の上限値が定められている。','建築構造用ステンレス鋼材SUS304Aは、降伏点が明確ではないので、0.1％オフセット耐力をもとに基準強度が定められている。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'構造',no:30,text:'建築物の構造計画及び構造設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築物の機能性、安全性、耐久性等の設計グレードを高く設定して、高品質を求めるのは必ずしもよい設計とはいえない。','建築物に作用する荷重及び外力には性質が異なるいろいろな種類があり、取扱いが難しいので、法規及び基準は、荷重及び外力の数値を扱いやすいように便宜的に提示している。','建築物の高さ方向の剛性や耐力の分布が不連続になる場合には、剛性率に基づき安易に保有水平耐力を割り増すのではなく、地震時の振動性状や崩壊過程を十分に考慮して計画を進める必要がある。','構造物のモデル化において、実構造物により近い複雑な解析モデルを採用することは、計算精度が向上するので、解析結果の検証を省略できるという利点がある。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:1,text:'民間工事における一般的な施工計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['工種別の施工計画書は、どの工事においても共通的に利用できるように作成されたものではなく、対象となる個別の工事の条件や特徴等を踏まえて具体的に検討したうえで作成されたものであり、監理者は工種別の施工計画書の提出を受ける。','施工計画書の一部である品質計画は、工事において使用予定の材料、仕上げの程度、性能、精度等の施工の目標、品質管理及び管理の体制について具体的に記載したものであり、当該工事に相応して妥当である場合は、監理者は品質計画を承認する必要がある。','工事の総合的な計画をまとめて作成する総合施工計画書は、総合仮設を含めた工事の全般的な進め方や、主要工事の施工方法、品質目標と管理方針等の大要を定めたものであり、監理者は総合施工計画書の提出を受ける。','工事請負契約書の規定に基づく施工条件の変更等により、実施工程表を変更する必要が生じた場合は、施工に支障がないように、監理者は変更部分の工事と並行して変更された実施工程表を承認する必要がある。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:2,text:'工事現場の管理に関する次の記述のうち、最も不適当なものはどれか。',choices:['高さが5mの鉄筋コンクリート造の既存建築物の解体作業において、「コンクリート造の工作物の解体等作業主任者」を選任した。','既存建築物の解体工事において、石綿を重量で0.1％を超えて含有する建材を除去するに当たり、「石綿作業主任者」を選任した。','山留めの高さが5mである山留め支保工の切ばりの取付けにおいて、「地山の掘削作業主任者」を選任した。','高さが5mの枠組足場の解体作業において、「足場の組立て等作業主任者」を選任した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:3,text:'材料管理及び品質管理に関する記述において、監理者が一般に行うものとして、最も不適当なものは、次のうちどれか。',choices:['工事現場に搬入した材料の検査において、立会い検査に合格した材料と同じ種別の材料については、以後の検査を、必要な証明書類により確認することとし、状況に応じて、抽出による立会い検査とした。','設計図書においてJIS又はJASによると指定された材料で、かつ、JIS又はJASのマーク表示があるものが使用されていたので、設計図書に定める品質及び性能を有することの証明となる書類等の確認を省略した。','鉄筋工事に用いる鉄筋については、有害な曲がりや損傷のあるものは使用せず、設計図書に従い、寸法及び形状に合わせて常温で加工し、組立てを行っていることを確認した。','セメントミルク工法による既製コンクリート杭工事において、「アースオーガーの掘削深さ」、「アースオーガーの駆動用電動機の電流値又は積分電流値」等から行う支持地盤の確認については、施工する本杭のうち、工事施工者が過半の杭について行っていることを確認した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:4,text:'建築工事等の届出等に関する組合せとして、最も不適当なものは、次のうちどれか。',choices:['届出等: 大気汚染防止法に基づく「特定粉じん排出等作業実施届出書」、届出者等: 特定工事の発注者、時期: 作業開始の日の14日前まで、届出先等: 労働基準監督署長','届出等: 労働安全衛生法に基づく「共同企業体代表者届」、届出者等: 事業者、時期: 工事開始の日の14日前まで、届出先等: 都道府県労働局長','届出等: 建築基準法に基づく「建築工事届」、届出者等: 建築主、時期: 確認申請時又は計画通知時、届出先等: 都道府県知事','届出等: 建築士法に基づく「工事監理報告書」、届出者等: 建築士、時期: 工事監理終了後、直ちに、届出先等: 建築主'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:5,text:'地盤調査等に関する次の記述のうち、最も不適当なものはどれか。',choices:['事前に地層構成が想定できない地盤のボーリング調査において、地震応答解析の必要がない直接基礎の建築物であったので、その調査深さを建築物の幅の2倍とした。','ボーリング孔を利用した弾性波速度検層（PS検層）により、地盤内を伝搬する弾性波（P波・S波）の速度を測定し、その速度値から地盤の硬軟を判定した。','ボーリング調査において、ボーリング孔内に地下水が認められたので、孔内をなるべく長時間放置し、水位が安定してから地下水位を測定した。','粘性土地盤において、ボーリング調査の標準貫入試験の結果から得られたN値により、内部摩擦角や相対密度を推定した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:6,text:'土工事及び山留め工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['ソイルセメント壁の心材としての形鋼に新品材を用いたので、心材の許容応力度については、短期許容応力度の値を採用した。','総掘りにおける根切り底において、地盤の状態については土質試料等を参考に目視により確認し、レベルチェックについては4mごとに1点を目安として行った。','埋戻しに当たり、埋戻し土が透水性の悪い山砂であったので、ローラー及びランマーによりまき出し厚さ50cmごとに締め固めた。','地下水処理におけるディープウェルの運転の停止については、「地下水の上昇による構造体の浮上りがないこと」、「地下外壁が自然地下水位よりも高く構築されていること」等を確認したうえで行った。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:7,text:'地業工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['液状化のおそれのある地盤の地盤改良工事については、地盤内に締め固められた砂杭が形成されるサンドコンパクションパイル工法を採用した。','場所打ちコンクリート杭工事の鉄筋籠の組立てにおいて、補強リングについては、主筋に断面欠損を生じないように注意して、堅固に溶接した。','セメントミルク工法による既製コンクリート杭工事において、建込み後の杭については、保持治具を用いて杭心に合わせて保持し、3日間養生を行った。','プレストレストコンクリート杭工事の杭頭処理において、ダイヤモンドカッター方式で杭頭を切断するに当たり、補強する範囲を当該切断面から350mm程度とした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:8,text:'図中のア～エについて、鉄筋工事における柱主筋、大梁主筋等の一般的な継手位置（範囲）として、最も不適当なものは、次のうちどれか。ただし、鉄筋の継手は、ガス圧接継手とする。',choices:['ア','イ','ウ','エ'],answer:3,hasFigure:true,figureDesc:'柱・大梁等断面における主筋の継手位置の範囲を示す図。ア: 柱の下部（H0/4の範囲内）、イ: 大梁上端（L0/4の範囲内）、ウ: 大梁下端（a=Dの範囲内）、エ: 片持梁側柱上部。H0は柱の内法高さ、Dは大梁のせい、L0は大梁の内法長さ。'},
{year:2019,subject:'施工',no:9,text:'型枠工事の次の記述のうち、最も不適当なものはどれか。',choices:['型枠支保工の構造計算における水平荷重については、支柱に鋼管枠を使用するに当たり、支保工の上端に設計荷重（鉛直荷重）の2.5/100に相当する値が作用することとした。','コンクリート打放し仕上げに使用するせき板に、「合板の日本農林規格」第5条「コンクリート型枠用合板の規格」による表面加工品を使用するに当たり、特記がなかったので、厚さが9mmのものを使用した。','計画供用期間の級が「標準」の建築物において、せき板の取外し後に湿潤養生をしない計画となっていたので、構造体コンクリートの圧縮強度が10N/mm2以上に達するまで、せき板を存置した。','片持ちスラブを除くスラブ下の型枠支保工の取外しについては、コンクリートの圧縮強度によることとしたので、圧縮強度が12N/mm2以上であること、かつ、施工中の荷重及び外力について、構造計算により安全であることを確認したうえで行った。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:10,text:'コンクリート工事に関する記述において、監理者が一般に行うものとして、最も不適当なものは、次のうちどれか。',choices:['単位水量が180kg/m3と指定されたコンクリートにおいて、打込み中に品質変化が見られたので、単位水量が180kg/m3であることを、レディーミクストコンクリート工場の製造管理記録により確認した。','特記のないコンクリートの打継ぎにおいて、やむを得ず、梁に鉛直打継ぎ部を設けなければならなかったので、スパンの中央又は端から1/4の付近に打継ぎ部が設けられていることを確認した。','普通コンクリートにおける構造体コンクリートの強度の検査において、1回の圧縮強度の試験に用いる供試体については、レディーミクストコンクリートの受入れ検査と併用しないこととなっていたので、工事現場において適切な間隔をあけた3台の運搬車から各1個ずつ、合計3個採取されていることを確認した。','同一区画のコンクリート打込み時における打重ね時間の限度については、外気温が25℃を超えていたので、150分を目安としていることを確認した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:11,text:'図に示すコンクリート工事におけるフレッシュコンクリートの現場受入れ時の品質検査に関する次の記述のうち、最も不適当なものはどれか。ただし、設計図書において、コンクリートは普通コンクリートとし、調合管理強度は27N/mm2、スランプは18cmと指定されているものとする。また、「寒中コンクリート」には該当しないものとする。',choices:['スランプ試験の結果は、合格であると判断した。','空気量試験の結果は、合格であると判断した。','コンクリートの温度測定試験の結果は、合格であると判断した。','コンクリートの塩化物含有量試験の結果は、合格であると判断した。'],answer:2,hasFigure:true,figureDesc:'フレッシュコンクリートの現場受入れ時の品質検査状況の写真。空気量6.1%、コンクリート温度30.0℃、スランプ20.5cm、塩化物含有量（塩化物イオン量）0.25kg/m3。'},
{year:2019,subject:'施工',no:12,text:'プレキャスト鉄筋コンクリート工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['プレキャスト部材の組立精度の検査においては、特記がなかったので、柱・壁の垂直部材と梁・床の水平部材とも、組立て作業中の仮固定完了後、次のプレキャスト部材が組み立てられる前に、全数について、それぞれ±5mmを判定基準として行った。','工事現場において、バルコニー付きの床のプレキャスト部材を平置きで仮置きするので、ひび割れや変形等が生じないように、台木の位置を、組立て後にプレキャスト部材が支持される位置からできるだけ離した。','プレキャスト部材の製造工場における製品検査において、外壁のプレキャスト部材の屋外に面する部分に、幅0.10mm以下のひび割れがあったが、外壁の性能上支障がないと判断し、プレキャスト部材製造要領書に従って、初期補修用プレミックスポリマーセメントペーストによる補修を行ったうえで合格とした。','プレキャスト部材の製造に当たり、脱型時に表面温度が高いプレキャスト部材においては、表面部の温度が外気温と同程度となるまで水密シートによる養生を行った。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:13,text:'鉄骨工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['溶接部の清掃において、母材の溶接面について付着物の確認を行ったところ、固着したミルスケールがあったが、溶接に支障とならなかったので、除去しなかった。','工事現場において、H形鋼の梁と柱との接合に当たり、梁ウェブを高力ボルト接合とし梁フランジを溶接接合とする混用継手で、梁せいや梁フランジ厚が大きくなく、溶接部に割れ等の欠陥が生じるおそれがないと判断し、高力ボルトを締め付けた後に溶接を行った。','溶融亜鉛めっきを施した鉄骨の接合部の摩擦面については、すべり係数が0.40以上確保することができるように、特記がなかったので、りん酸塩処理を行った。','鉄骨の製作精度の管理において、特記がなかったので、鉄骨精度検査基準（（一社）日本建築学会「建築工事標準仕様書 鉄骨工事 付則6」）に従い、柱の長さについては、10m未満であったので、柱の長さの管理許容差を±5mmとした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:14,text:'鉄骨工事に関する記述において、監理者が一般に行うものとして、最も不適当なものは、次のうちどれか。',choices:['高力ボルト接合の摩擦面については、ショットブラストにより表面粗度を50μmRz以上確保できていたので、摩擦面に赤錆を発錆させないことを承認した。','組立溶接において、鋼材の板厚が6mmを超えていたので、ショートビードとならないように、組立溶接の最小溶接長さが30mmを基準としていることを確認した。','特記により、高力ボルト孔の孔あけ加工をレーザ孔あけとしたので、溶損部を含む孔径の精度を±0.5mmとしていることを確認した。','ねじの呼びM22のトルシア形高力ボルトにおいて、ボルトの長さについては締付け長さに35mmを加えたものを標準長さとし、標準長さに最も近い寸法のボルトが使用されていることを確認した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:15,text:'木工事に関する記述において、監理者が一般に行うものとして、最も不適当なものは、次のうちどれか。',choices:['最下階の床が木造の床組の建築物において、床下をコンクリートで覆わなかったので、ねこ土台を用い、外周部の土台の全周にわたって、1m当たり有効面積75cm2以上の換気孔が設けられていることを確認した。','鉄筋コンクリート造の建築物において、建具枠や間仕切壁下地を留め付けるための「木れんが」については、樹種がヒノキで、「木れんが用接着剤」によりコンクリート面に張り付けられていることを確認した。','軸組工法による木造の建築物における構造用合板等の面材を併用しない耐力壁において、壁倍率2.0に適合させるために30mm×90mmの木材を片筋かいとし、その端部がプレートBP－2により緊結されていることを確認した。','鉄筋コンクリート造の建築物の内部仕上げの下地を木工事とするに当たり、床組の土台の取付けに使用するアンカーボルトは、位置や埋込み深さが不正確とならないことを重視して、「あと施工アンカー」が適切に使用されていることを確認した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:16,text:'防水工事等に関する次の記述のうち、最も不適当なものはどれか。',choices:['合成高分子系シート防水工事において、防水層の下地の入隅については直角とし、出隅については45度の面取りとした。','アスファルト防水工事において、アスファルトプライマーを刷毛でむらなく均一となるよう塗布し、30～60分程度の経過後、一層目のアスファルトルーフィングを張り付けた。','共同住宅において、現場打ち鉄筋コンクリートのバルコニーを塗膜防水としたので、防水層の塗膜防水材をウレタンゴム系とし、その仕上げを軽歩行用仕上塗料とした。','屋上緑化システム工事において、防水層に植物の根が直接触れないようにするために、耐根層を防水層直上部に設けた。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:17,text:'石張り工事、タイル工事及び左官工事に関する記述において、監理者が一般に行うものとして、最も不適当なものは、次のうちどれか。',choices:['石張り工事における外壁乾式工法において、止水のために石材間の目地をシーリング材で充填するに当たり、特記がなかったので、シーリング材の目地寸法が幅、深さともに5mm以上となっていることを確認した。','床を石張りとする部分の面積が広く、特記がなかったので、床面積30m2程度ごと及び石材と他の仕上材とが取り合う箇所に、伸縮調整目地が設けられていることを確認した。','セメントモルタルによる陶磁器質タイル張り工事における壁タイルの密着張りにおいて、タイル剥離防止のため、タイルの化粧目地の深さが、タイルの厚さの1/2以下となっていることを確認した。','コンクリート外壁面へのタイル張りの下地モルタル塗りにおいて、タイルの伸縮調整目地に合わせて、幅10mm以上の伸縮調整目地が発泡合成樹脂板で設けられていることを確認した。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:18,text:'金属工事及びガラス工事に関する記述において、監理者が一般に行うものとして、最も不適当なものは、次のうちどれか。',choices:['軽量鉄骨壁下地工事において、床ランナー下端から1.2mごとに設ける振れ止めを電気配管の敷設により切断せざるを得なかったので、切断する箇所を振れ止めと同材又は吊りボルト（外径9.0mm）で補強する計画であることを確認した。','軽量鉄骨天井下地工事において、天井面に下がり壁による段違いがあったので、野縁受と同材又は山形鋼（L-30×30×3（mm））を補強材に用いて、3.6m程度の間隔で斜め補強されていることを確認した。','屋外に設置する鋼製の手摺において、温度差40℃の場合の部材伸縮の目安を1m当たり0.5mmとして、伸縮調整部が5～10mごとに設けられていることを確認した。','屋外に面する建具に合わせガラスを使用するに当たり、建具のガラス溝内に雨水が浸入した場合に雨水を排水するため、建具下枠のガラス溝に設ける水抜き孔の直径が6mm以上となっていることを確認した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:19,text:'内外装工事に関する記述において、監理者が一般に行うものとして、最も不適当なものは、次のうちどれか。',choices:['コンクリート下地への塗装工事において、素地調整を行うことができる乾燥期間を、冬期であったので、コンクリートの材齢が14日確保されていることを確認した。','下地面がコンクリートとなる「せっこうボードのせっこう系直張り用接着材による直張り工法」において、張付け時の室温が5℃以下となる寒冷期に、やむを得ず施工しなければならなかったので、採暖等の養生を行い、室温が10℃以上に保たれていることを確認した。','押出成形セメント板を用いる外壁工事において、横張り工法により取り付けたフラットパネル（働き幅600mm、厚さ60mmの標準パネル）については、構造体に固定した下地鋼材に取り付け、パネル枚数3枚以下ごとに自重受け金物で受けていることを確認した。','外壁のセメントモルタルによる陶磁器質タイル（セラミックタイル）後張りにおける引張接着強度検査については、引張接着強度が0.4N/mm2以上で、かつ、コンクリート下地の接着界面における破壊率が50％以下のものを合格とした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:20,text:'設備工事に関する記述において、監理者が一般に行うものとして、最も不適当なものは、次のうちどれか。',choices:['昇降機設備工事において、乗用エレベーターの昇降路内に、エレベーターに必要な配管設備を設けることとなっていたので、その配管設備が地震時においてエレベーターの籠又は釣合おもりに触れるおそれのないことを確認した。','非常用の照明装置の電気配線は、他の電気回路（電源又は誘導灯に接続する部分を除く。）に接続されず、かつ、非常用の照明装置の電気配線の途中に一般の者が、容易に電源を遮断することのできる開閉器が設けられていないことを確認した。','配管の埋設工事において、給水管と排水管とを平行して埋設する部分については、給水管を排水管の上方に埋設し、両配管の水平実間隔が300mm程度確保されていることを確認した。','共同住宅の居室に設ける自然換気設備の給気口については、居室の天井の高さの1/2以下の高さの位置に設けられ、常時外気に開放されている構造となっていることを確認した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:21,text:'各種工事に関する記述において、監理者が一般に行うものとして、最も不適当なものは、次のうちどれか。',choices:['施工中における建具の鍵については、コンストラクションキーシステムを用いたので、施工完了後に、シリンダーは取り替えずに工事用の鍵から本設用の鍵に切り替え、不用となった工事用の鍵が回収されていることを確認した。','屋上緑化システムを採用した屋根に設けるルーフドレンについては、その口径が目詰まりを考慮して余裕のある管径になっていることを確認したうえで、1排水面積に対して2箇所以上設置されていることを確認した。','軽量鉄骨天井下地工事において、照明器具の設置に当たり、野縁及び野縁受をやむを得ず切断しなければならなかったので、溶断することを承認した。','内装工事において、タイルカーペットをフリーアクセスフロア（高さ調整式）に敷設するに当たり、フリーアクセスフロアの床パネルの段違いや隙間が0.5mm以下に調整されていることを確認した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:22,text:'鉄筋コンクリート造の既存建築物の耐震改修工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['現場打ち鉄筋コンクリート壁の増設工事において、壁厚が薄い複配筋の既存開口壁を鉄筋コンクリートにより閉塞するに当たり、開口周囲に埋め込む「あと施工アンカー」の埋込み長さについては、特記がなかったので、10da（da：アンカー筋径）とした。','枠付き鉄骨ブレースの設置工事において、鉄骨枠と既存躯体との間にグラウト材（無収縮モルタル）を圧入したところ、圧入したグラウト材と既存躯体との間に3mmの隙間ができてしまったので、その隙間にエポキシ系樹脂を圧入した。','鋼板巻き工法による柱補強工事において、二分割した鋼板を現場で一体化するに当たり、鋼板の厚さが6mmであったので、突合せ溶接とした。','溶接金網巻き工法による柱補強工事において、溶接金網の継手を重ね継手とするに当たり、溶接金網の縦筋の間隔が100mmであったので、その継手長さを200mmとした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:23,text:'各種改修工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['既存のアスファルト防水の改修工事において、既存防水層を非撤去とすることとしたので、立上り部及びルーフドレン回りの防水層についても非撤去とした。','既存のウレタンゴム系塗膜防水を撤去せず、新規にウレタンゴム系塗膜防水を施す改修工事において、既存防水層の膨れ部分については、カッターナイフで切除し、ポリマーセメントモルタルで平坦に仕上げた。','既存のモルタル塗り仕上げ外壁の仕上塗材の改修工事において、既存塗膜の劣化部の除去を高圧水洗工法で行うに当たり、その処理範囲については、特記がなかったので、既存仕上げ面全体とした。','コンクリート打放し仕上げ外壁の改修工事において、鉄筋が露出していない比較的浅い欠損部であったので、ポリマーセメントモルタル充填工法を採用して補修した。'],answer:1,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:24,text:'建築工事に関する用語・試験機器とその説明との組合せとして、最も不適当なものは、次のうちどれか。',choices:['用語・試験機器: 腹起し、説明: 山留め壁に作用する側圧を切ばり又は地盤アンカーに伝えるための水平部材','用語・試験機器: スランプフロー、説明: スランプコーンを引き上げた後の試料の広がりを直径で表したフレッシュコンクリートの流動性を示す指標','用語・試験機器: エンドタブ、説明: 鋼材の溶接において、アークの始端部や終端部が欠陥となりやすいため、溶接ビードの始点と終点に取り付ける補助板','用語・試験機器: タッピングマシン、説明: 子供の飛び跳ねや走り回り等の比較的重く柔らかい衝撃が加わったときの床衝撃音の遮断性能を調査するための床衝撃音発生器'],answer:4,hasFigure:false,figureDesc:''},
{year:2019,subject:'施工',no:25,text:'建築物の工事請負契約又は監理業務委託契約に関する次の記述のうち、民間（旧四会）連合協定「工事請負契約約款」又は四会連合協定「建築設計・監理等業務委託契約約款」に照らして、最も不適当なものはどれか。',choices:['工事請負契約において、工事中に本契約の目的物の一部を発注者が使用する場合につき、法令に基づいて必要となる手続きは、発注者から手続きを委託された場合は監理者が行い、受注者は、これに協力するとともに手続きに要する費用を負担する。','工事請負契約において、発注者は、監理者の意見に基づいて、受注者の現場代理人、監理技術者又は主任技術者、専門技術者及び従業員並びに下請負者及びその作業員のうちに、工事の施工又は管理について著しく適当でないと認められる者があるときは、受注者に対して、その理由を明示した書面をもって、必要な措置をとることを求めることができる。','監理業務委託契約において、受託者は、本契約に定めがある場合、又は委託者の請求があるときは、監理業務の進捗状況について、委託者に説明・報告しなければならない。','監理業務委託契約において、建築設計・監理等業務委託契約約款の規定により履行期間又は業務委託書の内容が変更された場合において、委託者は、必要があると認めるときは、受託者に対して、監理業務方針の再説明を請求することができる。'],answer:1,hasFigure:false,figureDesc:''}
,
{year:2018,subject:'計画',no:1,text:'建築士法に規定されている建築士の職責等に関する記述の[ A ]～[ D ]に該当する語句の組合せとして、正しいものは、次のうちどれか。\n\n建築士法第2条の2において、「建築士は、常に品位を保持し、業務に関する法令及び実務に精通して、[ A ]に寄与するように、公正かつ誠実にその業務を行わなければならない。」とされている。\nまた、同法第21条の4において、「建築士は、[ B ]を害するような[ C ]をしてはならない。」とされ、同法第22条第1項においては、「建築士は、設計及び工事監理に必要な[ D ]の維持向上に努めなければならない。」とされている。',choices:['A：国民の生命、健康及び財産の保護　B：公共の福祉の増進　C：建築　D：知識及び技能','A：国民の生命、健康及び財産の保護　B：建築士の信用又は品位　C：建築　D：専門的応用能力','A：建築物の質の向上　B：建築士の信用又は品位　C：行為　D：知識及び技能','A：建築物の質の向上　B：公共の福祉の増進　C：行為　D：専門的応用能力'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'計画',no:2,text:'日本における伝統的な木造建築物の屋根に関する次の記述のうち、最も不適当なものはどれか。',choices:['組物は斗と肘木との組合せをいい、肘木が壁から外に二段に出ている組物は舟肘木と呼ばれている。','瓦葺きは、仏教の伝来とともに伝わり、各地で様々な試行が行われ、江戸時代において桟瓦葺きが考案されている。','垂木は、一般に、唐様(禅宗様)では放射状に配置され、和様では平行に配置されている。','桔木は、梃子の原理を利用して、長く突き出ている軒先を支えるために、軒裏から小屋組内に取り付けられる材をいう。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'計画',no:3,text:'住宅に関する次の記述のうち、最も不適当なものはどれか。',choices:['マルセイユのユニテ・ダビタシオンは、ル・コルビュジエによって設計されたピロティのある高層の集合住宅であり、建築物内には住戸に加えて、店舗、ホテル、屋上庭園等の機能がある。','ヴァイセンホーフ・ジードルングは、ミース・ファン・デル・ローエが全体計画を行った実験住宅展で建築された住宅団地であり、「インターナショナル・スタイル」の成立に影響を与えたものである。','ムードンの住宅は、ジャン・プルーヴェによって設計されたものであり、アルミニウム等の材料が用いられている。','フランクリン街のアパートは、ルイス・サリヴァンによって設計された集合住宅であり、構造を鉄筋コンクリート造とした初期の集合住宅とされている。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'計画',no:4,text:'日本におけるスポーツ施設の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['屋外の野球場は、一般に、太陽光線の直射の影響を最小限とするため、本塁から投手板を経て二塁に向かう線を、東北東の方位に計画することが望ましい。','屋外のサッカー競技場は、一般に、冬期の風向きによる競技への影響を最小限とするため、競技のフィールドの長軸を、東西の方向に計画することが望ましい。','陸上競技場の観客席の勾配は、サイトライン(可視線)に配慮しつつ、観客が「競技者との一体感」や「競技の臨場感」を得られるように計画することが望ましい。','屋内の競技施設(アリーナ)は、施設の規模、想定される競技や大会のレベル等に応じて、自然採光・自然通風に配慮しつつ、空調設備・照明設備を設けることが望ましい。'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'計画',no:5,text:'事務所ビルにおけるコアの型とその一般的な特徴について、次の組合せのうち、最も不適当なものはどれか。なお、コアの型に示す図は平面略図であり、■はコアを示す。',choices:['センターコア：面積効率がよく、大きな床面積の場合に適しているが、二方向避難の計画が難しい。','両端コア：二方向避難の計画はしやすいが、フロアを分割する場合には廊下が必要となるため面積効率が低下する。','片コア(偏心コア)：共用部の管理がしやすく、高層建築物に適しているが、二方向避難の計画が難しい。','外コア(分離コア)：整形な執務空間を確保することができるが、執務空間とコアとの接続部でエキスパンションジョイントを設ける等の検討が必要である。'],answer:3,hasFigure:true,figureDesc:'各選択肢にコアの型の平面略図が付されている。1.センターコア（中央に黒い長方形）、2.両端コア（左右両端に黒い長方形）、3.片コア/偏心コア（片側に黒い長方形）、4.外コア/分離コア（建物外に分離した黒い長方形）'},
{year:2018,subject:'計画',no:6,text:'公共施設における床の材料又は仕上げに関する次の記述のうち、最も不適当なものはどれか。',choices:['床の滑りの指標のうち、JISにおける高分子系張り床材試験方法に定める滑り性試験により測定される滑り抵抗係数(C.S.R)は、埃や水等の介在物によって変化する。','階段の計画に当たり、階段の滑りには踏面だけでなく段鼻の滑りも大きく影響することから、滑りにくい段鼻材を採用することが望ましい。','床材は、同一の床において滑り抵抗係数を変化させると高齢者のつまずきの防止が期待できることから、滑り抵抗係数に大きな差がある材料を複合使用することが望ましい。','建築物の出入口に設ける視覚障害者誘導用ブロック等は、金属製のものを使用する場合、雨滴によりスリップしやすいため、ノンスリップの加工があるものを採用する等の配慮をすることが望ましい。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'計画',no:7,text:'建築物等の各部の寸法に関する次の記述のうち、最も不適当なものはどれか。',choices:['排気量250 ccクラスのオートバイの駐車場の計画において、平行駐車の1台当たりの駐車区画の寸法を、幅60 cm、長さ230 cmとした。','庁舎の車椅子使用者用受付カウンターの計画において、天板の高さを床面から70 cmとし、下部に車椅子のフットレストが入るスペースを設けた。','多人数の成人が利用する男性用便所の計画において、隣り合うストール型小便器の中心間距離を、90 cmとした。','事務所ビルの計画において、10席程度の会議室の内法寸法を、3.6 m × 7.2 mとした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'計画',no:8,text:'造形に対する人間の知覚に関する次の記述のうち、最も不適当なものはどれか。',choices:['黄金比は、その比率がもつ安定感から造形美を得るために古くから採用され、人体各部の寸法の比率がこれに近似するといわれている。','ゲシュタルト心理学の基礎概念においては、形や存在が認められる部分を「地」、その背景となる部分を「図」という。','線遠近法がつくりだす立体感の効果を建築物に応用することにより、奥行感を強めたり弱めたりすることができる。','建築物の立面が大きなスケールになると、軒線等の水平線がその中央部で垂れたように見えたり、柱等の垂直線が傾いて見えたりする現象が生じる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'計画',no:9,text:'宿泊施設における車椅子使用者用客室に関する次の記述のうち、「高齢者、障害者等の円滑な移動等に配慮した建築設計標準(国土交通省)」に照らして、最も不適当なものはどれか。',choices:['客室の総数を250室と計画したので、車椅子使用者用客室を3室設けた。','客室の出入口の前後に、140 cm角の水平な床のスペースを設けた。','客室内の浴室の出入口の有効幅員を、85 cmとした。','ベッドの高さはマットレス上面で車椅子の座面と同程度とし、ベッドサイドキャビネットの高さはマットレス上面から10 cm程度高くした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'計画',no:10,text:'都市再生の事例に関する次の記述のうち、最も不適当なものはどれか。',choices:['小布施町(長野県)においては、明治時代に建築された黒漆喰仕上げの建築物を保存・改装し、この建築物を核とした街並み「黒壁スクエア」を中心にして観光振興によるまちづくりを行っている。','富山市(富山県)においては、持続可能なコンパクトシティの実現を目指し、LRT(Light Rail Transit)を導入することで、公共交通の活性化、公共交通沿線地区への居住促進、中心市街地の活性化等を図っている。','横浜市(神奈川県)においては、「クリエイティブシティ・ヨコハマ」の実現を目指し、歴史的建造物や鉄道高架下等を活用した文化芸術活動を支援するための拠点づくりを行っている。','環状第二号線新橋・虎ノ門地区(東京都)においては、道路の上空及び路面下において建築物等の整備を一体的に行うことができる「立体道路制度」を活用し、この地域における居住機能や文化・交流機能の導入、業務機能の質の高度化等を図っている。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'計画',no:11,text:'都市計画に関連する用語に関する次の記述のうち、最も不適当なものはどれか。',choices:['CBD(Central Business District)は、一般に、人口密度が4,000人/km²以上の国勢調査基本単位区等が互いに隣接し、それらの隣接した地域の人口が5,000人以上となる地域である。','TOD(Transit Oriented Development)は、公共交通機関の利用を前提として、過度に自動車へ依存しない持続可能な都市を実現する方法の一つである。','GIS(Geographic Information System)は、位置に関する情報をもつデータ(空間データ)を総合的に管理・加工したうえで、視覚的に表示し、分析や判断を可能にする技術である。','BID(Business Improvement District)は、一般に、地区内の不動産所有者や事業者等から徴収される負担金により、その地区のオープンスペース等の維持管理、治安の改善、マーケティング等を行うものである。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'計画',no:12,text:'車椅子使用者に配慮した集合住宅の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['駐車場からエントランスホールにアプローチする傾斜路の計画に当たり、車椅子使用者が自力で登ることができるように、勾配を1/16とした。','居間と寝室の計画に当たり、コンセントの中心高さを床面から20 cmとした。','台所の計画に当たり、流し台・調理台の奥行きを60 cmとし、作業効率に配慮してL字型に配置した。','浴室の計画に当たり、浴槽の深さを50 cm、エプロンの高さを40 cmとした。'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'計画',no:13,text:'集合住宅に関する次の記述のうち、最も不適当なものはどれか。',choices:['熊本県営竜蛇平団地(熊本市)は、中庭や共用部に面して住戸ごとの土間やテラス等を設け、居住者同士が互いの生活を感じながら居住することができるように計画されている。','真野ふれあい住宅(神戸市)は、阪神・淡路大震災の被災者を対象に建築されたコレクティブハウジングであり、共同の食堂、台所等を設けて、居住者が生活の一部を共同で行うことが可能となっている。','世田谷区深沢環境共生住宅(世田谷区)は、木造平家建ての住宅団地の建替え事業により建築された公営の住宅であり、高齢者在宅サービスセンターを併設した、シルバーハウジング・プロジェクトを含むものである。','茨城県営六番池アパート(水戸市)は、三つの住棟、集会室及び中央広場で構成され、中央広場については、住戸又は集会室を介してアクセスする居住者専用のものである。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'計画',no:14,text:'建築物に設けるサインの計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['サインの種別には、場所の名称を示す「位置サイン」、特定の場所への方角を矢印表示等で示す「誘導サイン」、利用者が行動を選択するために必要な情報を提供する「案内サイン」等がある。','サインの色彩は、高齢者、弱視者、色覚障がい者等に配慮して、「黄と白」、「赤と緑」等の色の組合せを用いないことが望ましい。','視距離1 mから視認するサインの計画において、一般に、立位の利用者と車椅子を使用する利用者の双方に配慮して、床面からサイン表示面の中心までの高さを150 cmとすることが望ましい。','視距離10 mから視認するサインの計画において、サインの設置位置は仰角(水平からの見上げ角度)が10度を超えないようにすることが望ましい。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'計画',no:15,text:'小学校を指定避難所として使用する場合の対応の方法に関する次の記述のうち、最も不適当なものはどれか。',choices:['避難した人が利用するマンホールトイレは、居住エリアから離れた人目に付きにくい場所に設置できるように計画することが望ましい。','屋外プールの水は、可搬式のポンプを用いて、トイレの洗浄水等に利用することができるように計画することが望ましい。','小学校の教育活動を早期に再開するために、避難所機能と教育機能の区画や動線が分けられるように計画することが望ましい。','備蓄倉庫は、行政の防災担当部局等と協議して、想定される災害に対して安全な場所に計画することが望ましい。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'計画',no:16,text:'幼保連携型認定こども園の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['園舎は、地上2階建てとし、園庭は園舎と同一の敷地内に設けた。','園児のための諸室として、ほふく室、保育室、遊戯室及び便所を設け、ほふく室と遊戯室を兼用する計画とした。','飲料水用設備を、手洗い用設備や足洗い用設備とは別に設けた。','食事の提供をすべき園児数を25人とする計画であったので、独立した調理室を設けた。'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'計画',no:17,text:'次の建築物に関する記述のうち、最も不適当なものはどれか。',choices:['東京国際展示場(通称：東京ビッグサイト)は、4本の巨大な柱によるスーパーストラクチャーによって支えられた「コングレスタワー」と呼ばれる会議棟が施設のシンボルとなっている。','福島県産業交流館(通称：ビッグパレットふくしま)は、楕円に近い形状をもつ「マザールーフ」と呼ばれる大屋根に特徴があり、「ビッグパレット」の由来となっている。','横浜国際平和会議場(通称：パシフィコ横浜)は、パーゴラのある中央広場を囲むように、劇場棟、展示棟及び会議棟が配置されており、屋根の形状については大空に羽ばたく鳳がイメージされている。','千葉県日本コンベンションセンター国際展示場(通称：幕張メッセ)は、シルエットが山並みをイメージさせる第I期計画の建築物と、屋根形状が凹面から凸面に波のように変化する第II期計画の建築物があり、これらがつくりだすスカイラインに特徴がある。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'計画',no:18,text:'著作権に関する次の記述のうち、四会連合協定「建築設計・監理等業務委託契約約款」に照らして、最も不適当なものはどれか。なお、「成果物」は建築設計業務委託契約において受託者が委託者に提出した設計図書等の設計成果物とし、「本件建築物」は当該成果物を利用して完成した建築物とする。',choices:['本件建築物が著作物に該当する場合、当該著作権は受託者に帰属する。','委託者は、本件建築物が著作物に該当する場合であっても、当該本件建築物を写真、模型、絵画その他の媒体により表現し、利用することができる。','受託者は、成果物が著作物に該当する場合であっても、受託者の権利により、委託者の承諾を得ることなく、当該著作権を第三者に譲渡することができる。','受託者は、成果物によって第三者の著作権を侵害した場合、原則として、第三者に対して損害の賠償を行わなければならない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'計画',no:19,text:'各種マネジメント等に関する次の記述のうち、最も不適当なものはどれか。',choices:['不動産分野におけるデュー・デリジェンスは、不動産を取得する場合に、適正な価値やリスクを評価するために行う建築物の物理的状況調査、法的調査、経済的調査等の多角的な調査のことである。','建築物の企画段階におけるブリーフィングは、一般に、発注者及び関係者の要求、目的、制約条件を明らかにし、分析するプロセスであり、その成果物はブリーフと呼ばれている。','建築物の企画段階におけるフィージビリティ・スタディは、企画内容が事業経営上の観点で実行可能かどうかを確かめる検討作業である。','建築工事におけるファシリティ・マネジメントは、基本性能の維持を前提とした工事費低減の提案、工事施工者独自の施工技術の導入の提案等である。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'計画',no:20,text:'図のような鉄筋コンクリート構造の柱において、建築工事建築数量積算研究会「建築数量積算基準」に照らして、積算上の1本の帯筋の長さとして、正しいものは、次のうちどれか。なお、帯筋はスパイラルフープではないものとする。',choices:['2,000 mm','2,120 mm','2,200 mm','2,400 mm'],answer:4,hasFigure:true,figureDesc:'鉄筋コンクリート柱の断面図。柱寸法600mm×600mm、内法500mm×500mm、柱筋D22、帯筋D10、鉄筋に対するコンクリートのかぶり厚さ50mm。単位はmm。'},
{year:2018,subject:'環境・設備',no:1,text:'環境工学における用語に関する次の記述のうち、最も不適当なものはどれか。',choices:['長波長放射率は、赤外放射域において、「ある部材表面から発する単位面積当たりの放射エネルギー」を「その部材表面と同一温度の完全黒体から発する単位面積当たりの放射エネルギー」で除した値である。','エネルギー代謝率は、労働代謝の基礎代謝に対する比率で表され、人間の作業強度を表す指標である。','光幕反射は、机上面の光沢のある書類に光が当たる場合等、光の反射によって文字等と紙面との輝度対比が大きくなる現象である。','音の干渉は、二つ以上の音波が同時に伝搬する場合、音波の重なり具合によって振幅が変化する現象である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'環境・設備',no:2,text:'結露に関する次の記述のうち、最も不適当なものはどれか。',choices:['空気を加熱しても、絶対湿度が同じ場合、その空気の露点温度は変化しない。','窓ガラスの室内側にカーテンを設けることは、冬期におけるガラス面の結露の防止対策として期待できない。','冬期において、二重サッシの間の結露を防止するためには、室外側サッシの気密性に比べて室内側サッシの気密性を高くすることが有効である。','冬期において、外壁に接する押入れ内に生じる結露を防止するためには、押入れの襖の断熱性を高くすることが有効である。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'環境・設備',no:3,text:'換気に関する次の記述のうち、最も不適当なものはどれか。',choices:['全般換気は、室全体の空気を入れ替えることにより、室内で発生する汚染物質の希釈、拡散及び排出を行う換気方式のことである。','第一種機械換気方式は、給気機及び排気機を用いるため、正圧に保つ必要のある室にも採用することが可能である。','風圧力によって室内を換気する場合、その換気量は、外部風向と開口条件が一定であれば、外部風速の平方根に比例する。','温度差による換気において、外気温度が室内温度よりも高い場合、外気は中性帯よりも上側の開口から流入する。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'環境・設備',no:4,text:'伝熱に関する次の記述のうち、最も不適当なものはどれか。',choices:['室の断熱性能を高めることにより、一般に、室温と室内表面温度との差を小さくすることができ、室内の上下の温度差も小さくすることができる。','日射を受ける外壁面に対する相当外気温度(SAT)は、その面における日射吸収量、風速等の影響を受ける。','窓ガラスの日射熱取得率(日射侵入率)は、「ガラスに入射した日射量」に対する「ガラスを透過した日射量」の割合である。','同種の発泡系の断熱材で空隙率が同じ場合、熱伝導率は、一般に、断熱材内部の気泡寸法が大きいものほど大きくなる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'環境・設備',no:5,text:'建築物における防火・防災に関する次の記述のうち、最も不適当なものはどれか。',choices:['防火扉は、火災や煙の伝播・拡大を防ぐために、自動的に閉鎖する機構を有する。','「層間区画」は、上下階の延焼拡大を防止するために、耐火構造や準耐火構造の、スラブ等の水平方向の部材や外壁のスパンドレル等の垂直方向の部材により形成するものである。','火災室から廊下へ流出した煙の水平方向の流動速度は、3～5 m/sである。','建築物に使用するアカマツ、ケヤキ等の木材は、一般に、約260 ℃に達すると引火し、約450 ℃に達すると自然に発火する。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'環境・設備',no:6,text:'図のような窓をもつ直方体の室がある。この室内にある机の上の点Pにおける昼光率及び照度に関する次の記述のうち、最も不適当なものはどれか。ただし、窓の外には昼光を遮る障害物はないものとする。',choices:['点Pにおける水平面照度は、窓面における屋外側の鉛直面照度に昼光率を乗じた値となる。','室内の内装材を暗い色にすると、点Pにおける昼光率は小さくなる。','窓ガラスが完全透過で、窓面に占める窓枠等の面積割合が十分に小さく、かつ、間接照度を無視できるとき、点Pにおける昼光率は、その点における窓面の立体角投射率にほぼ等しい。','机の位置をx軸に沿って窓面に近づけると、点Pにおける窓面の立体角投射率は大きくなる。'],answer:1,hasFigure:true,figureDesc:'直方体の室の透視図。窓が一面にあり、室内に机が置かれている。窓の高さ方向の寸法は4m、机の上の点Pから窓面までの距離はx方向に0.8m、窓の反対側の壁までは2m。机の高さ0.8m。'},
{year:2018,subject:'環境・設備',no:7,text:'ある地点における南中時の太陽高度が60度のときの水平面直達日射量はJHであった。このときの法線面直達日射量JNと南向き鉛直面直達日射量JVの値の組合せとして、最も適当なものは、次のうちどれか。',choices:['JN：2JH/√3　JV：JH/√3','JN：2JH/√3　JV：√3/JH','JN：2JH　JV：JH/√3','JN：2JH　JV：√3・JH'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'環境・設備',no:8,text:'色彩に関する次の記述のうち、最も不適当なものはどれか。',choices:['照明の光がわずかに変化した場合であっても、その光が一様に物体に当たっていれば、色の恒常性により物体の色を同じ色として認識できる。','明度は、視感反射率に対応する値であり、マンセル表色系ではヒューとして表される。','全波長を均等に反射する分光分布をもつ物体を昼間の太陽光のもとで見るとき、その物体の反射率が高いほど、太陽光の色に近い白色に見える。','色光の誘目性は、一般に、色相においては赤が最も高く、青がこれに次ぐ。'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'環境・設備',no:9,text:'音響に関する次の記述のうち、最も不適当なものはどれか。',choices:['音の強さのレベルを30 dB下げるためには、音の強さを1/1,000にする。','コンサートホール等の最適残響時間として推奨される値は、一般に、室容積が大きくなるほど長くなる。','音の大きさの感覚量は、音圧レベルが一定の場合、低音域で小さく、3～4 kHz付近で最大となる。','カクテルパーティー効果は、周囲が騒がしいことにより、聞きたい音が聞き取りにくくなる現象をいう。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'環境・設備',no:10,text:'吸音・遮音に関する次の記述のうち、最も不適当なものはどれか。',choices:['吸音率は、「壁へ入射する音のエネルギー」に対する「壁内部に吸収される音のエネルギー」の割合である。','背後空気層をもつ板振動型吸音機構において、空気層部分にグラスウールを挿入した場合、高周波数域での吸音効果についてはあまり期待できない。','音の反射性が高い面で構成された室に吸音材料を設置すると、壁を隔てた隣室で音を放射したときの2室の室間音圧レベル差(2室間の遮音性能)は大きくなる。','空調用のダクト内の音の伝搬においては、音の強さの減衰が小さいことから、一般に、ダクト内に吸音材を貼る等の遮音上の対策が行われる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'環境・設備',no:11,text:'換気設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['営業用厨房は、一般に、厨房内へ客席の臭気等が流入しないように、厨房側を客席側よりも正圧に保つ。','ボイラー室の給気量は、「燃焼に必要な空気量」に「室内発熱を除去するための換気量」を加えた量とする。','外気取入れ経路に全熱交換器が設置されている場合、中間期等の外気冷房が効果的な状況においては、一般に、バイパスを設けて熱交換を行わないほうが省エネルギー上有効である。','置換換気は、空間上部の高温(汚染)領域と空間下部の低温(新鮮)領域との空気密度差によって生じる、空気の浮力を利用した換気方式である。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'環境・設備',no:12,text:'空気調和設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['吸収冷凍機は、一般に、運転中も機内が真空に近い状態であり、圧力による破裂等のおそれがない。','空調熱源用の冷却塔の設計出口水温は、冷凍機の冷却水入口水温の許容範囲内の高い温度で運転したほうが、省エネルギー上有効である。','冷却塔内の冷却水の温度は、外気の湿球温度よりも低くすることはできない。','パッケージユニット方式の空調機のAPF(Annual Performance Factor)は、「想定した年間の空調負荷」と「年間の消費電力量」により求められる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'環境・設備',no:13,text:'空気調和設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['デシカント空調方式は、除湿剤等を用いることにより潜熱を効率よく除去することが可能であり、潜熱と顕熱とを分離処理する空調システムに利用することができる。','床吹出し空調方式は、事務所等で利用され、冷房・暖房のいずれにおいても、居住域での垂直温度差が生じにくい。','蓄熱槽を利用した空調方式では、建築物の冷房負荷が小さくなる中間期の冷房においても、冷房負荷の大きい夏期と同様に、冷凍機の成績係数(COP)を高く維持することが可能である。','放射暖房方式は、一般に、室の床、壁、天井や放射パネルを加熱して、その放射熱を利用するものである。'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'環境・設備',no:14,text:'給水設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['上水受水槽の保守点検スペースとして、水槽の上部に100 cm、側面及び下部にそれぞれ60 cmのスペースを確保した。','上水受水槽と別に設ける消火用水槽として、建築物の地下ピットを利用した。','屋外の散水栓において、逆流を防止するためにバキュームブレーカーを設けた。','断水時にも水が使用できるように、水道直結直圧方式の上水給水配管と井戸水配管とをバルブを介して接続した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'環境・設備',no:15,text:'給排水衛生設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['ガス瞬間式給湯機の給湯能力は、1 lの水の温度を1分間に25 ℃上昇させる能力を1号として表示される。','給湯設備における加熱装置と膨張タンクとを連結する膨張管には、止水弁を設ける。','営業用厨房の排水設備において、グリース阻集器への流入管には、一般に、トラップを設けない。','排水槽に設ける通気管は、一般に、排水管に接続する通気管とは別に設け、外気に開放させる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'環境・設備',no:16,text:'電気設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['同一容量の負荷設備に電力を供給する場合、同じ種別の電線であれば、配電電圧が200 Vより400 Vのほうが、電線は細いものを使用することができる。','かご形三相誘導電動機の始動電流は、全電圧始動方式よりもスターデルタ始動方式のほうが大きくなる。','受変電設備における進相コンデンサは、主に、力率を改善するために用いられる。','受電方式には、1回線受電方式の他に、電力供給の信頼性に重点をおいたスポットネットワーク受電方式等がある。'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'環境・設備',no:17,text:'発電設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['デュアルフュエルタイプの発電機に用いる燃料は、通常時にはガスを用い、災害時等にガスの供給が停止した場合には重油等を用いることができる。','屋内に設置する発電機用の燃料槽は、消防法の規定による指定数量以上の燃料を備蓄する場合、屋内貯蔵所等として規制を受ける。','燃料電池設備は、消防法の規定に適合する場合、消防用設備等の非常電源として用いることができる。','コージェネレーションシステムに使用される発電機の発電効率は、一般に、ガスエンジンに比べてガスタービンのほうが高い。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'環境・設備',no:18,text:'防災設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['閉鎖型スプリンクラーヘッドの種別について、感度種別が1種で、かつ、有効散水半径が2.6 m以上であるものは「高感度型」に分類される。','自動火災報知設備において、差動式熱感知器は、一般に、厨房、ボイラー室又はサウナ室に設置する。','非常用の照明装置は、常温下で床面において水平面照度で1 lx(蛍光灯又はLEDランプを用いる場合には2 lx)以上を確保する。','排煙設備の排煙口は、原則として、防煙区画のそれぞれについて、当該防煙区画部分の各部分から排煙口のいずれかに至る水平距離が30 m以下となるように設ける。'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'環境・設備',no:19,text:'設備計画における省エネルギーに関する次の記述のうち、最も不適当なものはどれか。',choices:['空調用ポンプについては、熱負荷の時刻別の変動が大きい建築物であったため、変流量方式を採用した。','温暖な地域において、大気中の熱エネルギーを利用するため、ヒートポンプ式給湯機を採用した。','太陽光発電設備において、単結晶シリコン太陽電池モジュールよりもエネルギー変換効率が高いアモルファスシリコン太陽電池モジュールを採用した。','大規模な建築物に設置する多数台のエレベーターの管理において、省エネルギーとサービス性の向上との両立を図るため、群管理方式を採用した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'環境・設備',no:20,text:'環境・設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['日本における建築物の総合環境性能評価システムとしてはCASBEEがあり、他国においてはBREEAM(英国)、LEED(米国)等がある。','LCCO₂による環境性能評価においては、一般に、「資材生産」、「輸送」、「施工」、「運用」、「保守」、「更新」及び「解体除却」で示される建築物のライフサイクルの各過程におけるCO₂排出量を推定する。','「建築物のエネルギー消費性能の向上に関する法律」に基づく省エネルギー基準の適否の判断に用いられるエネルギー消費量は、電力、ガス、石油等の二次エネルギーの消費量である。','地域冷暖房システムの導入は、一般に、未利用熱の活用による排熱削減が期待でき、ヒートアイランド現象の緩和にも効果的である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:1,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['高架の工作物内に設ける店舗は、「建築物」である。','傾斜地等で敷地に高低差のある場合は、建築物の避難階が複数となることがある。','「遮炎性能」とは、通常の火災時における火炎を有効に遮るために外壁に必要とされる性能をいう。','建築材料の品質における「安全上、防火上又は衛生上重要である建築物の部分」には、主要構造部以外のバルコニーで防火上重要であるものとして国土交通大臣が定めるものも含まれる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:2,text:'面積、高さ又は階数に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['容積率を算定する場合、建築物のエレベーターの昇降路の部分の床面積は、容積率の算定の基礎となる延べ面積に算入しない。','「北側高さ制限」において、建築物の屋上部分に設ける高さ4mの階段室の水平投影面積の合計が当該建築物の建築面積の1/8である場合においては、その部分の高さは、当該建築物の高さに算入しない。','日影による中高層の建築物の高さの制限の緩和の規定において、建築物の敷地の平均地盤面が隣地(建築物があるもの)又はこれに連接する土地(建築物があるもの)で日影の生ずるものの地盤面より1m以上低い場合においては、その建築物の敷地の平均地盤面は、原則として、当該高低差から1mを減じたものの1/2だけ高い位置にあるものとみなす。','建築物の屋上部分で、水平投影面積の合計が当該建築物の建築面積の1/8の塔屋において、その一部に物置を設けたものは、当該建築物の階数に算入する。'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:3,text:'都市計画区域内における次の行為のうち、建築基準法上、確認済証の交付を受ける必要がないものはどれか。ただし、建築等に関する確認済証の交付を受ける必要がない区域の指定はないものとする。',choices:['鉄骨造、延べ面積100m²の、屋外観覧場の新築','鉄筋コンクリート造、延べ面積500m²、地上3階建ての物品販売業を営む既存の店舗内における、エレベーター(認証型式部材等に該当するもの)の設置','鉄骨造、延べ面積200m²、平家建ての事務所の、屋根の過半の修繕','木造、延べ面積300m²、高さ8m、地上2階建ての共同住宅の、寄宿舎への用途の変更(大規模の修繕又は大規模の模様替を伴わないもの)'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:4,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['既存の地上5階建ての病院(5階における当該用途に供する部分の床面積の合計が2,000m²のもの)に設けた非常用の照明装置に用いる照明カバーの取替えの工事の施工中に、当該建築物を使用する場合においては、当該建築主は、あらかじめ、工事の施工中における建築物の安全上、防火上又は避難上の措置に関する計画を作成して特定行政庁に届け出なければならない。','都市計画区域内においては、延べ面積500m²の卸売市場を準住居地域内に新築する場合には、都市計画においてその敷地の位置が決定していないものであっても、当該建築主は、特定行政庁の許可を受ける必要はない。','延べ面積1,000m²、地上3階建ての、昇降機を設けていない自動車車庫の敷地、構造及び建築設備については、当該所有者(所有者と管理者が異なる場合においては、管理者)は、定期に、一級建築士等にその状況の調査をさせてその結果を特定行政庁に報告する必要はない。','鉄骨造、延べ面積300m²、地上2階建ての飲食店を物品販売業を営む店舗とする用途の変更に係る確認済証の交付を受けた場合においては、当該建築主は、当該用途の変更に係る工事を完了したときは、建築主事に工事完了届を届け出なければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:5,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['準工業地域内の有料老人ホームの居室(天窓を有しないもの)で、外側にぬれ縁ではない幅1mの縁側を有する開口部(道に面しないもの)の採光補正係数は、水平距離が6mであり、かつ、採光関係比率が0.24である場合においては、0.7とする。','集会場の用途に供する床面積400m²の居室に、換気に有効な部分の面積が20m²の窓を設けた場合においては、換気設備を設けなくてもよい。','物品販売業を営む店舗で床面積の合計が1,600m²のものにおける客用の階段で、その高さが3mを超えるものにあっては、高さ3m以内ごとに踊場を設けなければならない。','居室の天井の高さは、室の床面から測り、1室で天井の高さの異なる部分がある場合においては、その平均の高さを2.1m以上としなければならない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:6,text:'防火区画等に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、自動式のスプリンクラー設備等は設けられていないものとし、耐火性能検証法、防火区画検証法、階避難安全検証法、全館避難安全検証法及び国土交通大臣の認定による安全性の確認は行わないものとする。',choices:['主要構造部を準耐火構造とした延べ面積800m²、地上4階建ての事務所であって、3階以上の階に居室を有するものの昇降路の部分については、原則として、当該部分とその他の部分とを防火区画しなければならない。','1階及び2階を物品販売業を営む店舗(当該用途に供する部分の各階の床面積の合計がそれぞれ1,000m²)とし、3階以上の階を事務所とする地上8階建ての建築物においては、当該店舗部分と事務所部分とを防火区画しなければならない。','主要構造部を準耐火構造とした延べ面積200m²、地上3階建ての一戸建ての住宅においては、吹抜きとなっている部分とその他の部分とを防火区画しなければならない。','有料老人ホームの用途に供する建築物の当該用途に供する部分(天井は強化天井でないもの)については、原則として、その防火上主要な間仕切壁を準耐火構造とし、小屋裏又は天井裏に達せしめなければならない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:7,text:'「特殊建築物の内装の制限」に関する次の記述のうち、建築基準法に適合しないものはどれか。ただし、自動式のスプリンクラー設備等は設けられていないものとし、居室については、内装の「制限を受ける窓その他の開口部を有しない居室」には該当しないものとする。また、耐火性能検証法、防火区画検証法、階避難安全検証法、全館避難安全検証法及び国土交通大臣の認定による安全性の確認は行わないものとする。',choices:['地階に設ける飲食店において、床面積の合計が80m²の客席の壁及び天井の室内に面する部分の仕上げを、難燃材料とした。','耐火建築物である地上2階建ての物品販売業を営む店舗において、各階の当該用途に供する部分の床面積の合計をそれぞれ600m²としたので、各階の売場の壁及び天井の室内に面する部分の仕上げを、難燃材料とした。','耐火建築物である延べ面積700m²、地上3階建ての図書館において、3階部分にある図書室の壁及び天井の室内に面する部分の仕上げを、難燃材料とした。','耐火建築物である地上2階建ての劇場において、客席の床面積の合計を500m²としたので、客席の壁及び天井の室内に面する部分の仕上げを、難燃材料とした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:8,text:'避難施設等に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、いずれの建築物も各階を当該用途に供するものとし、避難階は地上1階とする。',choices:['主要構造部を耐火構造とした地上3階建ての共同住宅で、各階に住戸(各住戸の居室の床面積60m²)が4戸あるものは、避難階以外の階から避難階又は地上に通ずる2以上の直通階段を設けなければならない。','主要構造部を耐火構造とした地上6階建ての事務所において、6階の事務室の床面積の合計が300m²であり、かつ、その階に避難上有効なバルコニーを設け、その階に通ずる屋外の直通階段を、屋外に設ける避難階段の構造の規定に適合するものとした場合には、2以上の直通階段を設けなくてもよい。','床面積の合計が3,000m²の地上5階建ての物品販売業を営む店舗には、各階の売場及び屋上広場に通ずる2以上の直通階段を設け、これを避難階段又は特別避難階段としなければならない。','主要構造部が耐火構造である地上20階建ての共同住宅において、階段室、昇降機の昇降路、廊下等が所定の方法で区画され、各住戸の床面積の合計が200m²(住戸以外は100m²)以内ごとに防火区画されている場合には、15階以上の階に通ずる直通階段は、特別避難階段としなくてもよい。'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:9,text:'防火・避難に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、耐火性能検証法、防火区画検証法、階避難安全検証法、全館避難安全検証法及び国土交通大臣の認定による安全性の確認は行わないものとする。',choices:['主要構造部を準耐火構造とした地上2階建ての展示場の避難階以外の階においては、主たる用途に供する居室の各部分から避難階又は地上に通ずる直通階段の一に至る歩行距離を、原則として、30m以下としなければならない。','延べ面積2,000m²の病院において、床面積100m²以内ごとに防火区画した部分については、排煙設備を設けなくてもよい。','延べ面積3,000m²、地上3階建てのスポーツの練習場には、非常用の照明装置を設けなくてもよい。','各階を物品販売業を営む店舗の用途に供する地上3階建ての建築物(各階の床面積600m²)においては、各階における避難階段の幅の合計を3.0m以上としなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:10,text:'建築設備に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['乗用エレベーター(特殊な構造又は使用形態のもので国土交通大臣が定めたものを除く。)の昇降路については、昇降路の出入口の床先とかごの床先との水平距離は4cm以下とし、かごの床先と昇降路壁との水平距離は12.5cm以下としなければならない。','エスカレーター(特殊な構造又は使用形態のもので国土交通大臣が定めたものを除く。)は、勾配を30度以下とし、踏段の幅は1.1m以下としなければならない。','準耐火構造の床若しくは壁又は防火戸その他の政令で定める防火設備で床面積200m²以内に区画された共同住宅の住戸には、窓その他の開口部で開放できる部分の面積にかかわらず、排煙設備を設けなくてもよい。','建築物(換気設備を設けるべき調理室等を除く。)に設ける自然換気設備の給気口は、居室の天井の高さの1/2を超える高さの位置に設け、常時外気に開放された構造としなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:11,text:'建築物の構造計算に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['建築物に作用する荷重及び外力としては、固定荷重、積載荷重、積雪荷重、風圧力、地震力のほか、建築物の実況に応じて、土圧、水圧、震動及び衝撃による外力を採用しなければならない。','屋根の積雪荷重は、屋根に雪止めがある場合を除き、その勾配が60度を超える場合においては、零とすることができる。','教室の柱の垂直荷重による圧縮力の計算において、建築物の実況によらないで積載荷重を計算する場合、床の積載荷重として採用する数値は、柱のささえる床の数が3のときは1,800N/m²とすることができる。','建築物に近接してその建築物を風の方向に対して有効にさえぎる他の建築物、防風林その他これらに類するものがある場合においては、その方向における風圧力の計算に用いる速度圧は、通常の速度圧の1/2まで減らすことができる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:12,text:'構造強度に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['土砂災害特別警戒区域内における建築物の外壁の構造は、原則として、居室を有しない建築物であっても、自然現象の種類、最大の力の大きさ等及び土石等の高さ等に応じて、当該自然現象により想定される衝撃が作用した場合においても破壊を生じないものとして国土交通大臣が定めた構造方法を用いるものとしなければならない。','構造耐力上主要な部分で特に摩損のおそれのあるものには、摩損しにくい材料又は摩損防止のための措置をした材料を使用しなければならない。','鉄骨鉄筋コンクリート造の建築物において、鉄骨に対するコンクリートのかぶり厚さは、原則として、5cm以上としなければならない。','鉄筋コンクリート造と鉄骨造とを併用する建築物の鉄筋コンクリート造の構造部分は、原則として、コンクリート打込み中及び打込み後5日間は、コンクリートの温度が2度を下らないようにし、かつ、乾燥、震動等によってコンクリートの凝結及び硬化が妨げられないように養生しなければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:13,text:'図のような木造、地上2階建ての住宅(屋根を金属板で葺いたもの)の1階部分について、桁行方向に設けなければならない構造耐力上必要な軸組の最小限の長さとして、建築基準法上、正しいものは、次のうちどれか。ただし、小屋裏等に物置等は設けず、区域の地盤及び地方の風の状況に応じた「地震力」及び「風圧力」に対する軸組の割増はないものとし、国土交通大臣が定める基準に従った構造計算は行わないものとする。なお、図は略図とする。',choices:['1,392 cm','1,560 cm','1,695 cm','2,100 cm'],answer:2,hasFigure:true,figureDesc:'南側立面図と1階及び2階平面図。南側立面図：幅6m、1F.L.から0.45mにG.L.、2F.L.あり、見付面積42m²(斜線部)。平面図：6m×8m、床面積48m²(斜格子部)。桁行方向と張り間方向を示す。真北表示あり。※1階部分の軸組の構造の判定に用いる1階の床面積については、48m²とする。'},
{year:2018,subject:'法規',no:14,text:'都市計画区域及び準都市計画区域内の道路等に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['道路の上空に設ける学校の渡り廊下で、生徒の通行の危険を防止するために必要であり、特定行政庁が安全上、防火上及び衛生上他の建築物の利便を妨げ、その他周囲の環境を害するおそれがないと認めて許可したものは、道路内に建築することができる。','建築物の各部分の高さの制限において、建築物の敷地が都市計画において定められた計画道路(建築基準法第42条第1項第四号に該当するものを除く。)に接し、特定行政庁が交通上、安全上、防火上及び衛生上支障がないと認める建築物については、当該計画道路が前面道路とみなされる。','工事を施工するために2年間現場に設ける事務所の敷地は、道路に2m以上接しなければならない。','幅員4mの農道に2m以上接する敷地においては、特定行政庁が交通上、安全上、防火上及び衛生上支障がないと認めて許可した建築物は、建築することができる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:15,text:'建築物の用途の制限に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、用途地域以外の地域、地区等の指定はなく、また、特定行政庁の許可等は考慮しないものとする。',choices:['第二種低層住居専用地域内において、「延べ面積650m²、平家建ての老人福祉センター」は、新築することができない。','第一種住居地域内において、「延べ面積3,000m²、地上3階建てのホテル」は、新築することができない。','近隣商業地域内において、「客席の部分の床面積の合計が300m²、地上2階建ての映画館」は、新築することができる。','工業専用地域内において、「延べ面積300m²、地上2階建ての保育所」は、新築することができる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:16,text:'図のような敷地において、耐火建築物を新築する場合、建築基準法上、新築することができる建築物の建蔽率(同法第53条に規定する建蔽率)と建築物の容積率(同法第52条に規定する容積率)の最高限度の組合せとして、正しいものは、次のうちどれか。ただし、図に記載されているものを除き、地域、地区等及び特定行政庁の指定、許可等は考慮しないものとする。',choices:['建蔽率の最高限度 8.5/10、容積率の最高限度 40/10','建蔽率の最高限度 8.5/10、容積率の最高限度 48/10','建蔽率の最高限度 9/10、容積率の最高限度 40/10','建蔽率の最高限度 9/10、容積率の最高限度 48/10'],answer:4,hasFigure:true,figureDesc:'敷地図。敷地は商業地域・防火地域(都市計画で定められた容積率80/10)と準住居地域・準防火地域(都市計画で定められた容積率30/10、建蔽率6/10)にまたがる。敷地は街区の角にあり特定行政庁が指定したものとする。北側15m道路、南側4m道路に接する。敷地寸法：東西30m+10m、南北20m+20m。'},
{year:2018,subject:'法規',no:17,text:'図のような敷地において、建築物を新築する場合、建築基準法上、A点における地盤面からの建築物の高さの最高限度は、次のうちどれか。ただし、敷地は平坦で、南側道路、西側道路及び東側隣地との高低差はなく、北側隣地より1.2m低いものとし、門、塀等はないものとする。また、図に記載されているものを除き、地域、地区等及び特定行政庁による指定、許可等並びに日影による中高層の建築物の高さの制限及び天空率に関する規定は考慮しないものとする。なお、建築物は、全ての部分において、高さの最高限度まで建築されるものとする。',choices:['22.50 m','22.60 m','23.10 m','25.00 m'],answer:2,hasFigure:true,figureDesc:'敷地平面図と断面図。第二種中高層住居専用地域、都市計画で定められた容積率30/10。敷地は南側道路(幅員14m、道路全体20m)と西側道路に接し、北側隣地は+1.2m、東側隣地は±0.0m。建築物は6m×6mの平面でA点が示される。敷地寸法：東西20m、南北12m+4m+2m+2m。断面図：敷地±0.0m、北側隣地+1.2m、南側道路±0.0m、道路幅8m。'},
{year:2018,subject:'法規',no:18,text:'図のような敷地において、用途上不可分の関係にあるA～Dの建築物を新築する場合、建築基準法上、誤っているものは、次のうちどれか。ただし、いずれの建築物も防火壁を設けていないものとし、建築物に附属する門又は塀はないものとする。また、図に記載されているものを除き、地域、地区等の制限については考慮しないものとし、危険物の貯蔵等は行わないものとする。',choices:['Aは、耐火建築物又は準耐火建築物としなければならない。','Bは、耐火建築物としなければならない。','Cは、耐火建築物又は準耐火建築物としなければならない。','Dは、耐火建築物又は準耐火建築物としなければならない。'],answer:4,hasFigure:true,figureDesc:'敷地平面図。敷地は防火地域と準防火地域にまたがる。西側に道路。A：延べ面積60m²、平家建ての事務所（防火地域側）。B：延べ面積900m²、地上3階建て、1階と2階は事務所、3階はテレビスタジオ（準防火地域側）。C：延べ面積100m²、平家建ての附属自動車車庫（防火地域側）。D：延べ面積200m²、平家建ての倉庫（準防火地域側）。'},
{year:2018,subject:'法規',no:19,text:'病院に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、階避難安全検証法、全館避難安全検証法及び国土交通大臣の認定による安全性の確認は行わないものとする。',choices:['敷地が第一種中高層住居専用地域内に300m²、第二種低層住居専用地域内に700m²と二つの用途地域にわたる場合、当該敷地には、特定行政庁の許可を受けなければ新築することができない。','準防火地域内の地上2階建てで、各階の床面積が300m²のもの(各階とも患者の収容施設があるもの)は、耐火建築物としなければならない。','患者用の廊下の幅は、両側に居室がある場合、1.6m以上としなければならない。','入院患者の談話のために使用される居室には、原則として、採光のための窓その他の開口部を設けなければならない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:20,text:'地区計画等又は建築協定に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['建築主事を置かない市町村であっても、地区計画等の区域(地区整備計画等が定められている区域に限る。)内において、建築物の敷地、構造、建築設備又は用途に関する事項で当該地区計画等の内容として定められたものについて、所定の基準に従い、これらに関する制限として条例で定めることができる。','地区計画の区域のうち再開発等促進区で地区整備計画が定められている区域のうち建築物の容積率の最高限度が定められている区域内においては、当該地区計画の内容に適合する建築物で、特定行政庁が交通上、安全上、防火上及び衛生上支障がないと認める建築物については、建築基準法第52条の規定は、適用されない。','建築協定には、建築物に附属する門及び塀の意匠に関する基準を定めることができる。','建築協定区域隣接地の区域内の土地に係る土地の所有者等は、建築協定の認可等の公告があった日以後いつでも、当該土地に係る土地の所有者等の過半数の合意により、特定行政庁に対して書面でその意思を表示することによって、当該建築協定に加わることができる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:21,text:'次の記述のうち、建築基準法又は建築士法上、誤っているものはどれか。',choices:['一級建築士は、他の一級建築士の設計した設計図書の一部を変更しようとするときは、当該一級建築士の承諾を求め、承諾が得られなかったときは、自己の責任において、その設計図書の一部を変更することができる。','構造設計一級建築士以外の一級建築士は、高さが60mを超える建築物の構造設計を行った場合においては、構造設計一級建築士に当該構造設計に係る建築物が建築基準法に規定する構造関係規定に適合するかどうかの確認を求めなければならない。','構造設計一級建築士の関与が義務付けられた建築物については、工事監理において、構造設計図書との照合に係る部分についても、構造設計一級建築士以外の一級建築士が行うことができる。','一級建築士定期講習を受けたことがない一級建築士は、一級建築士の免許を受けた日の次の年度の開始の日から起算して3年を超えた日以降に建築士事務所に所属した場合には、所属した日から3年以内に一級建築士定期講習を受けなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:22,text:'次の記述のうち、建築士法上、誤っているものはどれか。ただし、指定事務所登録機関の指定は考慮しないものとする。',choices:['一級建築士事務所に置かれる管理建築士は、一級建築士として3年以上の建築物の設計又は工事監理に関する業務に従事した後に管理建築士講習の課程を修了した建築士でなければならない。','建築士事務所の開設者は、当該建築士事務所の管理建築士の氏名について変更があったときは、2週間以内に、その旨を都道府県知事に届け出なければならない。','管理建築士が総括する技術的事項には、他の建築士事務所との提携及び提携先に行わせる業務の範囲の案の作成が含まれる。','都道府県知事は、建築士法の施行に関し必要があると認めるときは、一級建築士事務所の開設者又は管理建築士に対し、必要な報告を求め、又は当該職員をして建築士事務所に立ち入り、図書等の物件を検査させることができる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:23,text:'次の記述のうち、建築士法上、誤っているものはどれか。',choices:['建築基準法の規定に違反して二級建築士の免許を取り消された者は、その後に一級建築士試験に合格した場合であっても、その取消しの日から起算して5年を経過しない間は、一級建築士の免許を受けることができない。','建築士が道路交通法違反等の建築物の建築に関係しない罪を犯し、禁錮以上の刑に処せられた場合には、建築士の免許の取消しの対象とはならない。','建築士事務所に属する建築士が、その属する建築士事務所の業務として行った行為により建築基準法の規定に違反し、懲戒処分を受けたときは、都道府県知事は、当該建築士事務所の登録を取り消すことができる。','建築士事務所に属する者で建築士でないものが、当該建築士事務所の業務として、建築士でなければできない建築物の設計をしたときは、都道府県知事は、当該建築士事務所の登録を取り消すことができる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:24,text:'次の記述のうち、都市計画法上、誤っているものはどれか。',choices:['都市計画区域又は準都市計画区域内において、図書館の建築の用に供する目的で行う開発行為で、その規模が4,000m²のものについては、都道府県知事の許可を受けなければならない。','市街化調整区域のうち開発許可を受けた開発区域以外の区域内における仮設建築物の新築については、都道府県知事の許可を受ける必要はない。','都市計画施設の区域内において、地階を有しない鉄骨造、地上2階建ての建築物を改築する場合は、原則として、都道府県知事等の許可を受けなければならない。','地区整備計画が定められている地区計画の区域内において、建築物等の用途の変更を行おうとする場合に、用途変更後の建築物等が地区計画において定められた用途の制限及び用途に応じた建築物等に関する制限に適合するときは、当該行為の種類、場所、着手予定日等を市町村長に届け出る必要はない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:25,text:'次の記述のうち、消防法上、誤っているものはどれか。ただし、建築物は、いずれも無窓階を有しないものとし、指定可燃物の貯蔵又は取扱いは行わないものとする。',choices:['主要構造部を準耐火構造とした延べ面積1,500m²、地上2階建ての共同住宅で、壁及び天井の室内に面する部分の仕上げを難燃材料でしたものについては、原則として、屋内消火栓設備を設置しなければならない。','地上3階建ての事務所で、各階の床面積が300m²のものについては、原則として、3階に自動火災報知設備を設置しなければならない。','各階から避難階又は地上に直通する2の階段が設けられた地上3階建ての工場で、各階の収容人員が100人のものについては、原則として、3階に避難器具を設置しなければならない。','延べ面積6,000m²、地上5階建てのホテルについては、連結送水管を設置しなければならない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:26,text:'次の記述のうち、「高齢者、障害者等の移動等の円滑化の促進に関する法律」上、誤っているものはどれか。',choices:['既存の倉庫の一部の用途を変更し、床面積の合計が2,500m²の物品販売業を営む店舗に用途の変更をしようとするときは、当該用途の変更に係る部分に限り、建築物移動等円滑化基準に適合させればよい。','自動車教習所を新築しようとするときは、建築物移動等円滑化基準に適合させるために必要な措置を講ずるよう努めなければならない。','この法律の施行の際現に存する特定建築物に、専ら車椅子を使用している者の利用に供するエレベーターを設置する場合において、当該エレベーターが所定の基準に適合し、所管行政庁が防火上及び避難上支障がないと認めたときは、建築基準法の一部の規定の適用については、当該エレベーターの構造は耐火構造とみなされる。','建築物移動等円滑化基準への適合が求められる建築物において、案内所を設ける場合には、当該建築物内の移動等円滑化の措置がとられたエレベーター等の配置を表示した案内板を設けなくてもよい。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:27,text:'次の記述のうち、関係法令上、誤っているものはどれか。',choices:['「景観法」に基づき、景観地区内において建築物の建築等をしようとする者は、原則として、あらかじめ、その計画が、所定の規定に適合するものであることについて、市町村長の認定を受けなければならない。','「都市緑地法」に基づき、緑化地域内において、敷地面積が1,000m²の建築物の新築又は増築をしようとする者は、原則として、当該建築物の緑化率を、緑化地域に関する都市計画において定められた建築物の緑化率の最低限度以上としなければならない。','「土砂災害警戒区域等における土砂災害防止対策の推進に関する法律」に基づき、土砂災害特別警戒区域内において、予定建築物の用途が店舗である都市計画法に基づく開発行為をしようとする者は、原則として、あらかじめ、「土砂災害警戒区域等における土砂災害防止対策の推進に関する法律」に基づく都道府県知事の許可を受けなければならない。','「建築物の耐震改修の促進に関する法律」に基づき、特定既存耐震不適格建築物の所有者は、当該建築物について耐震診断を行い、その結果、地震に対する安全性の向上を図る必要があると認められるときは、耐震改修を行うよう努めなければならない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:28,text:'木造の建築物に関する次の記述のうち、関係法令上、誤っているものはどれか。',choices:['「建築基準法」に基づき、延べ面積1,500m²、高さ13m、軒の高さ10mの木造の平家建ての体育館については、許容応力度等計算により構造耐力上の安全性を確かめることができる。','「建築基準法」に基づき、防火地域及び準防火地域以外の区域内における、延べ面積1,800m²、耐火建築物及び準耐火建築物以外の木造の地上2階建ての図書館については、床面積の合計1,000m²以内ごとに防火上有効な構造の防火壁によって有効に区画しなければならない。','「消防法」に基づき、延べ面積600m²、木造の地上2階建ての旅館(無窓階を有しないものとし、少量危険物又は指定可燃物の貯蔵又は取扱いは行わないもの)については、所定の基準に従って屋内消火栓設備を設置した場合には、原則として、消火器具の設置個数を減少することができる。','「建築士法」に基づき、延べ面積500m²、高さ14m、軒の高さ9mの木造の地上3階建ての共同住宅の新築については、一級建築士事務所の管理建築士の監督の下に、当該建築士事務所に属する二級建築士が工事監理をすることができる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:29,text:'次の記述のうち、建築基準法又は建築士法上、誤っているものはどれか。',choices:['構造設計一級建築士は、建築士事務所に属さず、教育に関する業務を行っている場合であっても、構造設計一級建築士定期講習を受けなければならない。','許容応力度等計算を要する建築物について、許容応力度等計算を行ったものであっても、構造計算適合判定資格者である建築主事が、確認申請に係る建築物の計画が建築基準関係規定に適合するかどうかを審査したものは、構造計算適合性判定を受けなくてもよい。','特定行政庁が、建築物の所有者、管理者、設計者、工事監理者、工事施工者又は建築物に関する調査をした者に対して、建築物の構造又は建築設備に関する調査の状況について報告を求めたにもかかわらず、報告をしなかった当該所有者等は、罰則の適用の対象となる。','建築主が工事監理者を定めないまま、一級建築士でなければ工事監理ができない建築物の工事をさせた場合においては、当該建築主は、罰則の適用の対象となる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'法規',no:30,text:'次の記述のうち、関係法令上、誤っているものはどれか。',choices:['「都市の低炭素化の促進に関する法律」に基づき、低炭素建築物新築等計画の認定基準に適合させるための措置をとることにより通常の建築物の床面積を超えることとなる場合、建築基準法第52条第1項に基づく容積率の算定の基礎となる延べ面積には、一定の限度内の床面積は、算入しないものとする。','「都市の低炭素化の促進に関する法律」に基づき、低炭素建築物新築等計画の認定を申請する者は、所管行政庁に対し、当該計画を建築主事に通知し、当該計画が建築基準法に規定する建築基準関係規定に適合するかどうかの審査を受けるよう申し出ることができる。','「建築物のエネルギー消費性能の向上に関する法律」に基づき、建築物エネルギー消費性能適合性判定を受けた者は、建築基準法に基づく確認申請書を建築主事に提出するときに、併せて適合判定通知書又はその写しを提出しなければならない。','「建築物のエネルギー消費性能の向上に関する法律」に基づき、建築物エネルギー消費性能向上計画の認定を受けたときは、当該建築物の新築等のうち、建築物エネルギー消費性能適合性判定を受けなければならないものについては、原則として、適合判定通知書の交付を受けたものとみなされる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'構造',no:1,text:'図-1のような等質な材料からなる断面が、図-2に示す垂直応力度分布となって全塑性状態に達している。このとき、断面の図心に作用する圧縮軸力Nと曲げモーメントMとの組合せとして、正しいものは、次のうちどれか。ただし、降伏応力度はσyとする。',choices:['N=4a²σy, M=10a³σy','N=4a²σy, M=20a³σy','N=8a²σy, M=10a³σy','N=8a²σy, M=20a³σy'],answer:4,hasFigure:true,figureDesc:'図-1: 断面形状（十字形断面、全体4a×6a、中央2a×2aの開口）、図-2: 垂直応力度分布（上部σy圧縮、下部σy引張、高さ5a、幅aの偏り）'},
{year:2018,subject:'構造',no:2,text:'図のような集中荷重PA、PBを受ける梁A、Bの荷重点に生じるたわみδA、δBの値が等しいとき、集中荷重PAとPBとの比として、正しいものは、次のうちどれか。ただし、梁A、Bは等質等断面の弾性部材とする。',choices:['PA : PB = 1 : 4','PA : PB = 1 : 2','PA : PB = 1 : 1','PA : PB = 2 : 1'],answer:2,hasFigure:true,figureDesc:'梁A: 片持ち梁、スパンl、先端に集中荷重PA、たわみδA。梁B: 単純梁、スパン2l、中央に集中荷重PB、たわみδB'},
{year:2018,subject:'構造',no:3,text:'図のような水平荷重Pを受ける骨組において、A点における曲げモーメントの大きさとして、正しいものは、次のうちどれか。',choices:['Pl/2','2Pl/3','3Pl/4','Pl'],answer:2,hasFigure:true,figureDesc:'山形骨組（頂部ピン、左右ピン支点）、左柱のA点に水平荷重P、柱高さl、屋根勾配l/2、スパン2l'},
{year:2018,subject:'構造',no:4,text:'図は、2層のラーメンにおいて、2階に水平荷重P1、R階に水平荷重P2が作用したときの柱の曲げモーメントを示したものである。次の記述のうち、誤っているものはどれか。',choices:['2階に作用する水平荷重P1は、80 kNである。','2階の梁のせん断力QBは、70 kNである。','1階右側の柱の軸方向圧縮力NCは、105 kNである。','右側の支点の鉛直反力Vは、120 kNである。'],answer:4,hasFigure:true,figureDesc:'2層ラーメン、スパン8m、各階高さ4m。柱の曲げモーメント: R階柱頭140kN・m、2階柱頭180kN・m、2階柱脚100kN・m、1階柱脚220kN・m'},
{year:2018,subject:'構造',no:5,text:'図のような水平荷重Pが作用するトラスにおいて、部材A及びBに生じる軸力の組合せとして、正しいものは、次のうちどれか。ただし、軸力は、引張力を「＋」、圧縮力を「－」とする。',choices:['A = -√2P/2, B = +P','A = -√2P/2, B = +2P','A = -√2P, B = +P','A = -√2P, B = +2P'],answer:3,hasFigure:true,figureDesc:'2層トラス、幅3m×2、高さ3m×2。上下に水平荷重P。部材Aは上層の斜材、部材Bは下層の垂直材'},
{year:2018,subject:'構造',no:6,text:'図のような剛で滑らない面の上に置いてある直方体の剛体の重心に漸増する水平力が作用する場合、剛体が浮き上がり始めるときの水平力Fの重力Wに対する比α（=F/W）の値として、正しいものは、次のうちどれか。ただし、剛体の質量分布は一様とする。',choices:['0.15','0.30','0.45','0.60'],answer:2,hasFigure:true,figureDesc:'十字形断面の直方体（上部300×150、中部300×1000、下部300×500）、重心位置に水平力F、単位mm'},
{year:2018,subject:'構造',no:7,text:'建築基準法における建築物に作用する地震力に関する次の記述のうち、最も不適当なものはどれか。',choices:['地震地域係数Zが1.0、振動特性係数Rtが0.9、標準せん断力係数C0が0.2のとき、建築物の地上部分の最下層における地震層せん断力係数Ciは0.18とすることができる。','鉄骨造又は木造の建築物の地震力を算定する場合に用いる設計用一次固有周期T（単位 秒）は、建築物の高さ（単位 メートル）に0.03を乗じて算出することができる。','地震層せん断力係数Ciの建築物の高さ方向の分布を表す係数Aiは、建築物の上階になるほど大きくなる。','建築物の地上部分におけるある層に作用する地震層せん断力は、その層の固定荷重と積載荷重との和に、その層の地震層せん断力係数Ciを乗じて算出する。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'構造',no:8,text:'建築物の構造計算に用いる荷重に関する次の記述のうち、最も不適当なものはどれか。',choices:['多雪区域において、地震時に考慮すべき積雪荷重は、短期積雪荷重を低減したものを用いる。','百貨店の屋上広場の単位面積当たりの積載荷重は、建築物の実況に応じて計算しない場合、百貨店の売場の単位面積当たりの積載荷重と同じとすることができる。','単位面積当たりの積載荷重は、建築物の実況に応じて計算しない場合、「床の構造計算をする場合」、「大梁、柱又は基礎の構造計算をする場合」及び「地震力を計算する場合」のうち、「地震力を計算する場合」が最も大きくなる。','一般的な鉄筋コンクリートの単位体積重量は、コンクリートの単位体積重量に、鉄筋による重量増分として1 kN/m³を加えた値を用いることができる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'構造',no:9,text:'木造軸組工法による地上2階建ての建築物に関する次の記述のうち、最も不適当なものはどれか。',choices:['風による水平力に対して必要な各階の耐力壁の量を、建築物の各階の床面積に所定の数値を乗じて得られた量以上とした。','地盤が著しく軟弱な区域として指定されている区域内の建築物ではなかったので、標準せん断力係数C0を0.2として、地震力を算定した。','軸組の両面に同じ構造用合板を1枚ずつ釘打ちした耐力壁の倍率を、軸組の片面に同じ構造用合板を1枚釘打ちした耐力壁の倍率の2倍とした。','引張力のみを負担する筋かいとして、厚さ1.5 cmで幅9 cmの木材を使用した。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'構造',no:10,text:'図のような平面形状の木造軸組工法による地上2階建ての建築物（屋根は日本瓦葺きとし、1階と2階の平面形状は同じであり、平家部分はないものとする。）の1階において、建築基準法における「木造建築物の軸組の設置の基準」（いわゆる四分割法）によるX方向及びY方向の壁率比の組合せとして、最も適当なものは、次のうちどれか。ただし、図中の太線は耐力壁を示し、その軸組の倍率（壁倍率）は全て2とする。なお、壁率比は次の式による。壁率比＝壁量充足率の小さい方／壁量充足率の大きい方、ここで、壁量充足率＝存在壁量／必要壁量',choices:['X方向 0.5, Y方向 1.0','X方向 0.8, Y方向 1.0','X方向 1.0, Y方向 0.5','X方向 1.0, Y方向 0.8'],answer:1,hasFigure:true,figureDesc:'8m×8mの平面、1mグリッド。耐力壁の配置を太線で示す。四分割法による壁率比の計算'},
{year:2018,subject:'構造',no:11,text:'鉄筋コンクリート構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['地震時に水平力を受けるラーメン架構の柱の曲げひび割れは、一般に、柱頭及び柱脚に発生しやすい。','柱の軸方向の圧縮耐力は、一般に、帯筋によるコンクリートの拘束の度合いが大きいほど大きくなり、最大耐力以降の耐力低下の度合いも緩やかになる。','柱は、一般に、同じ断面の場合、内法高さが小さいほど、せん断耐力が大きくなることから、塑性変形能力は向上する。','柱梁接合部のせん断耐力は、一般に、柱に取り付く梁の幅を大きくすると大きくなる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'構造',no:12,text:'鉄筋コンクリート構造の鉄筋の定着に関する次の記述のうち、最も不適当なものはどれか。',choices:['梁主筋の柱への必要定着長さは、柱のコンクリートの設計基準強度が高いほど長くなる。','折曲げ定着筋の標準フックの必要余長は、折曲げ角度が小さいほど長くなる。','引張鉄筋の必要定着長さは、横補強筋で拘束されたコア内に定着する場合より、横補強筋で拘束されていない部分に定着する場合のほうが長くなる。','純ラーメン架構の柱梁接合部内に通し配筋定着する梁については、地震時に梁端に曲げヒンジを想定する場合、梁主筋の引張強度が高いほど、定着性能を確保するために必要となる柱せいは大きくなる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'構造',no:13,text:'鉄筋コンクリート構造の許容応力度計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['開口を有する耐力壁において、許容せん断力だけではなく、せん断剛性についても、開口の大きさに応じた低減率を考慮して構造計算を行った。','両側スラブ付き梁部材の曲げ剛性として、スラブの協力幅を考慮したT形断面部材の値を用いた。','柱の断面算定において、コンクリートに対する鉄筋のヤング係数比nは、コンクリートの設計基準強度が高くなるほど大きな値とした。','純ラーメン架構の梁端部の断面算定において、水平荷重による設計用曲げモーメントとして、フェイスモーメント（柱面位置での曲げモーメント）を用いた。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'構造',no:14,text:'鉄筋コンクリート構造の保有水平耐力計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['柱の塑性変形能力を確保するため、引張鉄筋比ptを大きくした。','梁の塑性変形能力を確保するため、崩壊形に達したときの梁の断面に生じる平均せん断応力度を小さくした。','耐力壁の塑性変形能力を確保するため、崩壊形に達したときの耐力壁の断面に生じる平均せん断応力度を小さくした。','ラーメン架構と耐力壁を併用した建築物の構造特性係数Dsを小さくするため、保有水平耐力に対する耐力壁の水平耐力の和の比率βuを小さくした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'構造',no:15,text:'鉄骨構造の溶接接合に関する次の記述のうち、最も不適当なものはどれか。',choices:['溶接金属の機械的性質は溶接施工条件の影響を受けることから、溶接に当たっては、溶接部の強度を低下させないために、パス間温度が規定値より小さくなるように管理する。','溶接継目ののど断面に対する長期許容せん断応力度は、溶接継目の形式が「完全溶込み溶接の場合」と「隅肉溶接の場合」とで同じである。','柱梁接合部の梁端部フランジの溶接接合においては、梁ウェブにスカラップを設けないノンスカラップ工法を用いることにより、塑性変形能力の向上が期待できる。','組立溶接において、ショートビード（ビードの長さが短い溶接）は、冷却時間が短いことから、塑性変形能力が低下する危険性や低温割れが生じる危険性が小さくなる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'構造',no:16,text:'鉄骨構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['骨組の塑性変形能力を確保するために定められているH形鋼の柱及び梁の幅厚比の上限値は、フランジよりウェブのほうが大きい。','柱及び梁に使用する鋼材の幅厚比の上限値は、建築構造用圧延鋼材SN400Bより建築構造用圧延鋼材SN490Bのほうが大きい。','梁の横座屈を防止するための横補剛材は、強度だけではなく、十分な剛性を有する必要がある。','梁の横座屈を防止するための横補剛には、「梁全長にわたって均等間隔で横補剛する方法」、「主として梁端部に近い部分を横補剛する方法」等がある。'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'構造',no:17,text:'鉄骨構造において使用する高力ボルトに関する次の記述のうち、最も不適当なものはどれか。',choices:['高力ボルト摩擦接合は、接合される部材間の摩擦力で応力を伝達する機構であり、部材とボルト軸部との間の支圧による応力の伝達を期待するものではない。','せん断力と引張力とを同時に受ける高力ボルトの許容せん断応力度は、引張応力度の大きさに応じて低減する。','高力ボルト摩擦接合と溶接接合とを併用する接合部においては、溶接を行った後に高力ボルトを締め付けた場合、両接合の許容力を加算することができる。','F10Tの高力ボルト摩擦接合において、2面摩擦の許容せん断応力度は、1面摩擦の場合の2倍である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'構造',no:18,text:'鉄骨構造の耐震計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['「ルート1－1」で計算する場合、標準せん断力係数C0を0.3以上として許容応力度計算をすることから、水平力を負担する筋かいの端部及び接合部を保有耐力接合とする必要はない。','「ルート2」で計算する場合、水平力を負担する筋かいの水平力分担率に応じて、地震時の応力を割り増して許容応力度計算をする必要がある。','「ルート3」で計算する場合、筋かいの有効細長比や柱及び梁の幅厚比等を考慮して構造特性係数Dsを算出する。','冷間成形角形鋼管柱に筋かいを取り付ける場合、鋼管に局部的な変形が生じないように補強を行う必要がある。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'構造',no:19,text:'土質及び地盤に関する次の記述のうち、最も不適当なものはどれか。',choices:['粘性土地盤において、土粒子の粒径は、粘土よりシルトのほうが大きい。','土の含水比（土粒子の質量に対する土中の水の質量の比）は、一般に、粘性土より砂質土のほうが大きい。','標準貫入試験のN値が10程度の地盤の場合、許容応力度は、一般に、砂質土地盤より粘性土地盤のほうが大きい。','砂質土地盤の許容応力度の算定に用いる支持力係数は、一般に、内部摩擦角が大きくなるほど大きくなる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'構造',no:20,text:'図に示す土質柱状図の地盤において、地階を有しない地上3階建ての鉄骨造の事務所を計画する場合、基礎の設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['表土下部の細砂層を支持地盤とした直接基礎（べた基礎）とする場合は、細砂層の許容応力度及び即時沈下量の検討に加えて、粘性土層の許容応力度及び圧密沈下量の検討も行う。','粘性土層まで貫入させた摩擦杭と、直接基礎（べた基礎）からなるパイルド・ラフト基礎とする場合は、摩擦杭の効果により基礎の沈下を抑えられることから、沈下量の検討を省略できる。','砂礫層を支持地盤とした杭基礎とする場合は、粘性土層における負の摩擦力の検討を行う。','砂礫層を支持地盤とした杭基礎とする場合、細砂層が地震時に液状化するおそれがあると判定されたときは、液状化層の水平地盤反力係数を低減して杭の設計を行う。'],answer:2,hasFigure:true,figureDesc:'土質柱状図: 表土、細砂、礫混り細砂(~5m)、粘性土質細砂、粘性土(~15m)、砂質シルト(~20m)、シルト質砂(~25m)、砂礫。N値グラフ付き'},
{year:2018,subject:'構造',no:21,text:'図に示す鉄筋コンクリート造の擁壁の設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['地表面に作用する上載荷重は、擁壁背面側に作用する土圧として考慮しない。','擁壁底版の直上の土の重量は、擁壁の転倒に対する抵抗要素として考慮する。','擁壁底版とその直下の地盤との間に生じる滑動抵抗力を、擁壁背面側に作用する土圧等の水平成分の1.5倍以上となるように設計すれば、使用限界状態での擁壁の変形等の検討は省略できる。','擁壁の滑動抵抗を大きくするために、擁壁底版の底面に突起を設けることもある。'],answer:1,hasFigure:true,figureDesc:'L型擁壁断面図。高さ3m、擁壁背面側に地盤、宅地側に擁壁底版'},
{year:2018,subject:'構造',no:22,text:'壁式鉄筋コンクリート造の建築物の設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['耐力壁の面外座屈に対する安全性を確保するために、鉛直支点間距離に対する耐力壁の厚さの比の最小値が規定されている。','使用するコンクリートの設計基準強度を高くすると、一般に、必要壁量を小さくすることができる。','階高が3.5 mを超える場合は、保有水平耐力計算によって安全性を確かめる必要がある。','耐力壁の長さの算定において、住宅用の換気扇程度の大きさの開口は、補強をしなくても、開口がないものとみなすことができる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'構造',no:23,text:'建築構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['プレストレスト鉄筋コンクリート構造は、PC鋼材によってコンクリートにプレストレスを導入することにより、曲げひび割れの発生を許容しない構造である。','制振構造に用いられる制振部材のうち、鋼材ダンパーは、金属素材の塑性変形能力を利用したものである。','免震建築物の性能は、一般に、アイソレータとダンパーとの組合せによって決定され、ダンパーのエネルギー吸収量が少ないと免震層の応答変位が過大となることがある。','鉄筋コンクリート造の柱及び梁の主筋の継手に機械式継手を用いる場合、鉄筋径より継手部の外径のほうが大きくなるため、継手部に配筋するせん断補強筋の外面から必要かぶり厚さを確保しなければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'構造',no:24,text:'建築物の構造計画及び構造設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['鉄筋コンクリート造の建築物の腰壁と柱との間に完全スリットを設けることにより、柱の剛性評価において腰壁部分の影響を無視することができる。','高強度コンクリートや高強度鉄筋の実用化等により、高さ100 mを超える鉄筋コンクリート造の建築物が建設されている。','鉄筋コンクリート造の多層多スパンラーメン架構の建築物の1スパンに連層耐力壁を設ける場合、連層耐力壁の浮上りに対する抵抗力を高めるためには、架構内の中央部分に設けるよりも、最外端部に設けるほうが有効である。','片流れ屋根の屋根葺き材の構造設計において、風による吹上げ力は、屋根面の中央に位置する部位より、縁に位置する部位のほうを大きくする。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'構造',no:25,text:'建築物の耐震設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['鉄骨造の建築物において、張り間方向を純ラーメン架構、桁行方向をブレース架構とする場合、方向別に異なる耐震計算ルートを採用してもよい。','鉄筋コンクリート構造において、部材のせん断耐力を計算する場合のせん断補強筋の材料強度は、JIS規格品の鉄筋であっても、せん断破壊に対する余裕度を確保するために基準強度の割増しはしない。','保有水平耐力は、建築物の一部又は全体が地震力の作用によって崩壊形を形成するときの、各階の柱、耐力壁及び筋かいが負担する水平せん断力の和としてもよい。','各階の保有水平耐力の計算による安全性の確認において、ある階の偏心率が所定の数値を上回る場合、全ての階について必要保有水平耐力の割増しをしなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'構造',no:26,text:'建築物の構造設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['制振構造において、ダンパーのエネルギー吸収効率は、一般に、主架構とダンパーとの接合の構造形式を間柱型とするより、ブレース型とするほうがよい。','免震構造において、積層ゴムアイソレータの2次形状係数S2（全ゴム層厚に対するゴム直径の比）は、主に座屈荷重や水平剛性に関係する。','プレストレストコンクリート造の梁は、一般に、鉄筋コンクリート造の梁に比べて、地震後の残留変形が大きい。','コンクリート充填鋼管（CFT）構造の柱は、鉄骨構造の柱に比べて塑性変形能力が優れているため、軸力比制限や鋼管の幅厚比制限を緩和することができる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'構造',no:27,text:'木材の防腐に関する次の記述のうち、最も不適当なものはどれか。',choices:['木材の腐朽は、木材腐朽菌の繁殖条件である酸素・温度・水分・栄養源のうち、いずれか一つでも欠くことによって防止することができる。','木材は、一般に、含水率が25～35％を境にして腐朽しやすくなるため、構造用製材（未仕上げ材）の含水率は、25％以下とされている。','心材は、辺材に比べて耐腐朽性に優れていることから、腐朽しやすい箇所には、心材が多く含まれる木材を使用する。','防腐剤を加圧注入した防腐処理材は、継手や仕口の加工が行われた部分について、その加工面の防腐処理を再度行わずに使用することができる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'構造',no:28,text:'コンクリートに関する次の記述のうち、最も不適当なものはどれか。',choices:['乾燥収縮によるひび割れは、水セメント比が同じ場合、単位セメント量が多いコンクリートほど発生しにくい。','AE剤を用いたコンクリートは、AE剤により連行された空気がコンクリート中で独立した無数の気泡となることから、凍結融解作用に対する抵抗性が増す。','コンクリートの圧縮強度は、一般に、コンクリート供試体の形状が相似の場合、供試体寸法が小さいほど大きくなる。','コンクリートの引張強度は、一般に、コンクリートの圧縮強度が大きいほど大きくなる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'構造',no:29,text:'鋼材に関する次の記述のうち、最も不適当なものはどれか。',choices:['鋼材は、一般に、炭素含有量が多くなるほど、破断に至るまでの伸びが小さくなる。','建築構造用低降伏点鋼材LY225は、一般構造用圧延鋼材SS400に比べて降伏点が低く、延性が高いことから、履歴型制振ダンパーの材料に用いられている。','降伏点350 N/mm²、引張強さ490 N/mm²である鋼材の降伏比は、1.4である。','建築構造用圧延鋼材SN490B（板厚12 mm以上）は、「降伏点又は耐力」の上限値及び下限値が規定されている。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'構造',no:30,text:'建築物の構造計画及び構造設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築物の耐震性を向上させる手段として、構造体の強度を大きくする方法、構造体の塑性変形能力を高める方法、建築物の上部構造を軽量化する方法等がある。','特定天井のうち、天井と周囲の壁等との間に隙間を設けない構造方法では、天井と壁等とが一体となって動くので、地震時における天井材の脱落に対する安全性の検討を省略することができる。','銑鉄の製造時に副生する高炉スラグを利用した高炉セメントを構造体コンクリートに用いることは、環境に配慮した建築物を実現することにつながる。','鉄筋コンクリート造の建築物の耐久性を向上させる手段として、コンクリートの設計基準強度を高く設定する方法、鉄筋に対するコンクリートのかぶり厚さを大きく設定する方法等がある。'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:1,text:'監理者が行う一般的な監理業務に関する次の記述のうち、最も不適当なものはどれか。',choices:['工事監理の着手に先立って工事監理体制その他の工事監理方針について建築主に説明し、その説明後、工事監理方法に変更の必要が生じた場合には、工事施工者に承認を受けたことをもって、工事監理方法を変更する。','工事施工者から工事に関する質疑書が提出された場合には、設計図書に定められた品質（形状、寸法、仕上り、機能、性能等を含む。）確保の観点から技術的に検討し、必要に応じて建築主を通じて設計者に確認のうえ、回答を工事施工者に通知する。','工事施工者の行う工事が設計図書の内容に適合しないおそれがあり、かつ、破壊検査が必要と認められる相当の理由がある場合にあっては、工事請負契約の定めにより、その理由を工事施工者に通知のうえ、必要な範囲で破壊して検査する。','工事施工者から提出される工事費の最終支払いの請求について、工事請負契約に適合しているかどうかを技術的に審査し、建築主に報告する。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:2,text:'工事施工者が行う工事現場の管理に関する次の記述のうち、最も不適当なものはどれか。',choices:['現場代理人は、現場に常駐し、現場の運営、取締りを行う者であり、受注者の代理としての権限の他、一般に、請負代金額の変更、請負代金の請求及び受領の権限が与えられている。','発注者から直接建築一式工事を請け負った特定建設業者は、当該工事を施工するために締結した下請契約の請負代金の額が6,000万円以上になる場合には、監理技術者を置かなければならない。','建築物の解体工事の事前調査においてPCBを含有する蛍光灯安定器が発見された場合、その安定器は、建築物の所有者の責任において保管・処分するため、当該所有者に引き渡すこととなっている。','建設工事に係る資材の再資源化等に関する法律において、特定建設資材には、「コンクリート」、「コンクリート及び鉄から成る建設資材」、「木材」及び「アスファルト・コンクリート」が該当する。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:3,text:'材料管理及び品質管理に関する次の記述のうち、最も不適当なものはどれか。',choices:['鉄骨工事において、鉄骨溶接構造の400 N及び490 N級炭素鋼で板厚が60 mmであったので、認定グレードMの鉄骨製作工場が選定されていることを確認した。','鉄筋工事において、鉄筋の表面に発生した錆のうち、浮いていない赤錆程度のものについては、コンクリートとの付着を阻害することがないので、除去しなかった。','防水工事において、アスファルトルーフィングの保管については、雨露や湿気の影響を受けにくい屋内の乾燥した場所に、たてて積みとした。','鉄骨工事における吹付けロックウールの耐火被覆の施工において、吹付け厚さの確認に用いる確認ピンについては、施工後もそのまま存置した。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:4,text:'建築工事等に関する届出に関する組合せとして、最も適当なものは、次のうちどれか。',choices:['届出: 労働安全衛生法に基づく「クレーン設置届」, 届出者: 事業者, 届出時期: 工事の開始の日の10日前まで, 届出先: 労働基準監督署長','届出: 建設工事に係る資材の再資源化等に関する法律に基づく対象建設工事の「届出書」, 届出者: 発注者又は自主施工者, 届出時期: 工事に着手する日の7日前まで, 届出先: 都道府県知事','届出: 騒音規制法に基づく「特定建設作業実施届出書」, 届出者: 工事施工者, 届出時期: 作業の開始の日の7日前まで, 届出先: 労働基準監督署長','届出: 消防法に基づく「消防用設備等設置届出書」, 届出者: 特定防火対象物の関係者, 届出時期: 工事が完了した日から10日以内, 届出先: 消防長又は消防署長'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:5,text:'仮設工事等に関する次の記述のうち、最も不適当なものはどれか。',choices:['切ばり上部に設けた作業用通路に設ける手摺については、高さを75 cmとし、高さ30 cmの中桟が設けられていることを確認した。','建築物の内部に工事用機械を仮設置する計画であったので、当該建築物の構造的な補強方法や工事用機械の搬出後の復旧方法等を含む仮設工事計画書を作成させた。','単管足場の壁つなぎの設置間隔を、垂直方向5.0 m、水平方向5.4 mとし、地上第一の壁つなぎが地上より4.5 mの位置に設けられていることを確認した。','特定建設作業に該当する杭打ち作業により発生する著しい振動について、近隣に影響を及ぼす振動の規制基準の管理のための測定場所を、特定建設作業場所の敷地境界線とした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:6,text:'土工事及び山留め工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['山留め壁・支保工の検討を行うに当たり、山留め壁外周上への掘削土の仮置きや大型の重機械を据え付ける作業がない範囲については、作業荷重及び資材仮置き時の積載荷重として考慮する上載荷重を10 kN/m²とした。','山留め支保工の地盤アンカー工法において、地盤アンカーの引抜き耐力が、全数について設計アンカー力の1.1倍以上であることを確認した。','掘削工事において、盤ぶくれの発生が予測されたので、止水性のあるソイルセメント壁を、盤ぶくれの原因となる被圧滞水層の砂礫層に延長して根入れした。','粘性土地盤に設置した山留め壁の撤去に当たり、地盤沈下を引き起こすおそれがあったので、鋼矢板を引き抜いた跡に直ちに砂を充填した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:7,text:'地業工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['場所打ちコンクリート杭工事において、特記がなかったので、本杭の施工における各種管理基準値を定めるための試験杭を、最初に施工する1本目の本杭と兼ねることとした。','セメントミルク工法による既製コンクリート杭工事において、支持層の出現深度の確認については、掘削機の電流計の値から換算したN値によることとした。','アースドリル工法による場所打ちコンクリート杭工事において、支持層の確認については、ケリーバーの振れや掘削機の回転抵抗等を参考にしつつ、バケット内の土砂を近傍のボーリング調査における土質柱状図及び土質資料と比較して行った。','セメントミルク工法による既製コンクリート杭工事において、根固め液及び杭周固定液の管理試験に用いる供試体を作製するに当たり、根固め液についてはグラウトプラントで混練した液を、杭周固定液については杭挿入後の掘削孔からオーバーフローした液を、それぞれ採取した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:8,text:'鉄筋工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['スラブの配筋において、特記がなかったので、上端筋、下端筋それぞれにスペーサーをスラブ1 m²当たり1.3個程度配置した。','普通コンクリート（設計基準強度27 N/mm²）の耐力壁の脚部におけるSD295Aの鉄筋の重ね継手については、特記がなかったので、フックなしとし、その重ね継手の長さを40 dとした。','機械式継手を用いる大梁の主筋の配筋において、隣り合う鉄筋の継手位置をずらして配筋するに当たり、カップラーの中心間で400 mm以上、かつ、カップラー端部の間のあきが40 mm以上となるように組み立てた。','D22の主筋のガス圧接継手の外観検査において、鉄筋中心軸の偏心量の合格基準値を5 mmとした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:9,text:'型枠工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['コンクリート打放し仕上げ以外に使用するせき板については、特記がなかったので、「合板の日本農林規格」第5条「コンクリート型枠用合板の規格」による板面の品質がB－Cのものが使用されていることを確認した。','型枠の構造計算におけるコンクリートの施工時の水平荷重については、鉛直方向の荷重に対する割合で定めることとし、地震力については考慮しなかった。','外壁の地中部分等の水密を要する部分の貫通孔に用いるスリーブについては、特記がなかったので、硬質ポリ塩化ビニル管が使用されていることを確認した。','防水下地となるコンクリート面における型枠緊張材（丸セパB型）のコーン穴の処理については、水量の少ない硬練りモルタルでコンクリート面と同一になるように充填されていることを確認した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:10,text:'コンクリート工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['普通ポルトランドセメントを使用したコンクリート（設計基準強度36 N/mm²）の調合管理強度については、特記がなく、コンクリートの打込みから材齢28日までの期間の予想平均気温が7℃であったので、構造体強度補正値を6 N/mm²とした。','普通コンクリートにおける構造体コンクリートの圧縮強度の試験については、コンクリートの打込み日ごと、打込み工区ごと、かつ、150 m³又はその端数ごとに1回行った。','調合管理強度27 N/mm²、スランプ21 cmと指定された高性能AE減水剤を使用したコンクリートにおいて、現場受入れ時のスランプ試験の結果が19.0 cmであったので、合格とした。','構造体コンクリート強度の検査において、標準養生による3個の供試体の材齢28日における圧縮強度の平均値がコンクリートの設計基準強度以上であったので、合格とした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:11,text:'コンクリート工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['暑中コンクリート工事の適用期間に関して特記がなく、コンクリートの打込み予定日の日平均気温の平年値が25℃を超えていたので、暑中コンクリート工事として施工計画書を提出させた。','柱、梁、スラブ及び壁に打ち込むコンクリートの粗骨材については、特記がなかったので、最大寸法25 mmの砕石が使用されることを確認した。','コンクリートの打継ぎ面のレイタンスについては、高圧水洗やワイヤーブラシ掛けにより除去し、健全なコンクリート面が露出していることを確認した。','柱や壁の打込み後のコンクリートの養生において、透水性の小さいせき板で保護されている部分については、湿潤養生されているものとみなして、湿潤養生を省略した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:12,text:'プレキャスト鉄筋コンクリート工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['計画供用期間の級が「標準」の建築物において、プレキャスト部材の屋外側の鉄筋に対するコンクリートの設計かぶり厚さは、特記がなかったので、柱・梁・耐力壁については45 mm、床スラブ・屋根スラブについては35 mmとした。','プレキャスト部材の現場受入れ時の検査において、製造工場における製品検査に合格した部材であっても、運搬中に起こり得るひび割れ、破損、変形や先付金物の状態等を確認した。','プレキャスト部材を現場打ちコンクリートに接合する部分については、現場打ちコンクリート部分の精度に影響されるため、「プレキャスト部材の位置の許容差」を、特記がなかったので、「現場打ちコンクリート部分の位置の許容差」と同じ値とした。','プレキャスト部材の組立精度の検査は、柱・壁の垂直部材と梁・床の水平部材とも、それぞれ±10 mmを判定基準として行った。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:13,text:'鉄骨工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['高力ボルト接合における摩擦面は、すべり係数値が0.45以上確保できるように、ミルスケールを添え板全面の範囲について除去したのち、一様に錆を発生させることとした。','I形鋼のフランジ部分における高力ボルト接合において、ボルト頭部又はナットと接合部材の面が1/20以上傾斜していたので、勾配座金を使用した。','溶接接合において、引張強さ490 N/mm²以上の高張力鋼及び厚さ25 mm以上の鋼材の組立溶接を被覆アーク溶接（手溶接）とするので、低水素系溶接棒を使用した。','スタッド溶接において、スタッドの仕上り精度については、仕上り高さを指定された寸法の±5 mm、スタッドの傾きを15度以内として管理した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:14,text:'鉄骨工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['保有水平耐力計算を行わない鉄骨造において、柱脚を基礎に緊結するに当たり、露出形式柱脚としたので、鉄骨柱のベースプレートの厚さをアンカーボルトの径の1.3倍以上とした。','鉄骨造の柱脚部を基礎に緊結するために設置するアンカーボルトについては、特記がなかったので、二重ナット締めを行ってもボルトのねじが3山以上突出する高さで設置した。','完全溶込み溶接部の内部欠陥の検査については、浸透探傷試験により行った。','溶融亜鉛めっき高力ボルト接合において、ナット回転法で行ったので、締付け完了後、ナットの回転量が不足しているものについては、所定の回転量まで追締めを行った。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:15,text:'木工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['造作材に使用するJISによる「Nくぎ」の代用品として、「FNくぎ」を使用した。','現場における木材の含水率の測定に当たり、測定箇所については、1本の製材の異なる2面について、両小口から300 mm以上離れた2箇所及び中央部1箇所とし、計6箇所とした。','構造用合板による大壁造の耐力壁において、山形プレートを用いて土台と柱とを接合する箇所については、山形プレート部分の構造用合板を切り欠き、その近傍の釘打ちについては増し打ちを行った。','軸組構法（壁構造系）において、基礎と土台とを緊結するアンカーボルトの埋込み位置の許容誤差を、±5 mmとした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:16,text:'防水工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['アスファルト防水工事において、コンクリート下地の乾燥状態については、高周波水分計で測定するとともに、コンクリート打込み後の経過日数により判断した。','アスファルト防水工事において、平場部の防水層の保護コンクリートに設ける伸縮調整目地の割付けについては、パラペット等の立上り部の仕上り面から600 mm程度とし、中間部は縦横の間隔を5 m程度とした。','シーリング工事において、外部に面するシーリング材の施工に先立ち行う接着性試験については、特記がなかったので、簡易接着性試験とした。','シーリング工事において、2成分形シーリング材については、1組の作業班が1日に行った施工箇所を1ロットとして、ロットごとにサンプルを別に作製し硬化の過程や硬化状態を確認した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:17,text:'左官工事、石張り工事及びタイル工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['型枠に塗装合板を用いたコンクリート壁下地へのモルタル塗りについては、下地とモルタルとの有効な付着性能を得るために、下地に高圧水洗処理を施すとともに、ポリマーセメントペーストを塗布し、乾燥しないうちに下塗りを行った。','ビニル床シートを用いた床仕上げ工事における下地については、床コンクリートの直均し仕上げとするに当たり、コンクリートの仕上りの平坦さの標準値を、特記がなかったので、3 mにつき7 mm以下とした。','石張り工事における内壁空積工法において、下地ごしらえを「あと施工アンカー・横筋流し工法」で行うに当たり、あと施工アンカーに、おねじ形の締込み式アンカーを使用した。','セメントモルタルによる陶磁器質タイル張り工事において、屋内の吹抜け部分の壁タイル張り仕上げ面については、モルタルが硬化した後、工事施工者の自主検査で、打診用ハンマーにより全面の1/2程度について打診を行っていることを確認した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:18,text:'金属工事及びガラス工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['軽量鉄骨天井下地工事において、JISによる建築用鋼製下地材を使用したので、高速カッターで切断した面には、亜鉛の犠牲防食作用が期待できることから、錆止め塗料塗りを省略した。','ガラス工事におけるガラスブロック積み工法において、伸縮調整目地については、特記がなかったので、5 mごとに幅15 mmとした。','軽量鉄骨壁下地工事において、振れ止めについては、JISによる建築用鋼製下地材を使用し、床ランナーから上部ランナーまでの高さが3,000 mmであったので、床ランナー下端から1,500 mmの位置に1段目の振れ止めを設けた。','はめ込み構法によるガラス工事において、サッシ枠が地震による面内変形を受けた場合におけるガラスの割れの防止のため、サッシ枠四周のエッジクリアランス（はめ込み溝底とガラスエッジとの間の寸法）を確認した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:19,text:'内外装工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['ビニル床シートを用いた床仕上げ工事において、下地が床コンクリート直均し仕上げであったので、ビニル床シートの張付けを、コンクリートの打込みから21日後に行うことを確認した。','仕様ルートにより検証した特定天井については、天井面構成部材と壁及び柱との隙間を6 cm以上設けていることを確認した。','外壁乾式工法による石張り工事の施工図等において、石材の形状と寸法については、特記がなかったので、形状が正方形に近い矩形で、1枚の面積が0.8 m²以下、有効厚さが30 mm以上70 mm以下であることを確認した。','カーテンウォール工事において、躯体付け金物の取付け位置の寸法許容差については、特記がなかったので、鉛直方向を±10 mm、水平方向を±25 mmとした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:20,text:'設備工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['コンクリート埋込みとなる分電盤の外箱は、型枠に取り付けた。','雷保護設備における引下げ導線については、保護レベルに応じた平均間隔以内として、建築物の外周に沿ってできるだけ等間隔に、かつ、建築物の突角部の近くになるように配置した。','屋内の横走り排水管の勾配の最小値については、呼び径65以下を1/50、呼び径125を1/200とした。','外壁に設ける換気用ダクトの換気口については、屋外避難階段から2 m以上離して設けた。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:21,text:'各種工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['アースドリル工法による場所打ちコンクリート杭工事において、鉄筋かごの建込みの際の孔壁の欠損によるスライムや建込み期間中に生じたスライムの処理を行う二次スライム処理については、コンクリートの打込み直前に、水中ポンプ方式により行った。','屋根工事において、鋼板葺きの留付けに用いる釘や金物については、ステンレス製のものを使用した。','塗装工事において、屋外に露出する亜鉛めっき鋼面への錆止め塗料塗りについては、特記がなかったので、一液形変性エポキシ樹脂さび止めペイントを使用した。','外壁乾式工法による石張り工事において、目地に用いるシーリング材については、特記がなかったので、シリコーン系シーリング材を使用した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:22,text:'鉄筋コンクリート造の耐震改修工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['既存コンクリートの圧縮強度試験について、コアを壁厚の小さい部位から採取することになり、コア供試体の高さ（h）と直径（d）との比（h/d）が1.5となったので、h/dの数値に応じた補正係数を乗じて、直径の2倍の高さをもつ供試体の強度に換算した。','鉄骨枠付きブレースのスタッド溶接完了後の外観試験において、溶接後の仕上り高さと傾きの試験については、スタッドの種類及びスタッド溶接される部材が異なるごと、かつ、100本ごと及びその端数を試験ロットとし、各ロットの1本以上について抜取試験を行った。','既存鉄筋コンクリート造建築物の耐震補強のための鉄骨枠付きブレースの設置工事において、鉄骨枠内に使用するグラウト材の品質管理における圧縮強度試験については、供試体の材齢を3日及び28日として管理を行った。','鉄筋コンクリート造の新設耐震壁の増設工事において、本体打込み式の改良型の金属系アンカーを使用するに当たり、ドリルで穿孔する穿孔深さについては、有効埋込み深さと同じ深さとした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:23,text:'各種改修工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['防水改修工事において、既存保護コンクリートの撤去に用いるハンドブレーカーは、躯体や仕上げ材に損傷を与えないように、質量15 kg未満のものとした。','アスベスト含有建材の除去工事においては、除去したアスベスト含有吹付け材等の飛散防止のため、除去作業場所にて、所定のプラスチック製の袋の中に入れ、袋の中の空気を十分に抜く際に、この材等が湿潤化していることを確認した。','コンクリート打放し仕上げ外壁のひび割れ部の改修工事において、自動式低圧エポキシ樹脂注入工法で行うに当たり、エポキシ樹脂注入材の注入完了後、注入材が硬化する前に速やかに注入器具を撤去した。','アルミニウム製建具のかぶせ工法による改修工事において、新規建具と鉄筋コンクリート造の躯体との取合い部に用いるシーリング材については、目地深さが所定の寸法であり、新規建具と躯体間の挙動が少ないことが確認できたので、ボンドブレーカーを省略し三面接着とした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:24,text:'建築工事に関する用語とその説明との組合せとして、最も不適当なものは、次のうちどれか。',choices:['用語: セトリング（木工事）, 説明: 丸太組構法において、丸太組用木材の重みや乾燥収縮により、水平に積んだ丸太組用木材が沈下をおこし、壁の高さが低くなる現象','用語: リバウンド（土工事）, 説明: 軟弱な粘性土を掘削した場合に、山留め背面の地盤の回り込みにより掘削底面が膨れ上がる現象','用語: ラミネーション（鉄骨工事）, 説明: 鋼材の製造において、種々の酸化物、けい酸塩、硫化物の非金属介在物や気泡等が圧延によって圧延方向に延ばされ層状に分布することによってできる内部の層状欠陥','用語: 強化ガラス（ガラス工事）, 説明: フロート板ガラスを強化炉で約650℃まで加熱した後、ガラスの両表面に空気を吹き付け急冷してガラス表面付近に強い圧縮応力層を形成し、耐風圧強度を約3倍に高めたガラス'],answer:2,hasFigure:false,figureDesc:''},
{year:2018,subject:'施工',no:25,text:'建築物の監理業務委託契約又は工事請負契約に関する次の記述のうち、四会連合協定「建築設計・監理等業務委託契約約款」又は民間（旧四会）連合協定「工事請負契約約款」に照らして、最も不適当なものはどれか。',choices:['監理業務委託契約において、委託者受託者双方の責めに帰すことができない事由により受託者が監理業務を行うことができなくなった場合、受託者は、委託者に対し、既に遂行した業務の割合に応じて業務報酬を請求することができる。','監理業務委託契約において、受託者は、委託者の契約の違反により、受託者に相当な損害が生じたときは、委託者がその責めに帰すことができない事由によることを証明した場合であっても、契約の違反についての別段の定めを規定した場合を除き、委託者に対し、その賠償を請求することができる。','工事請負契約において、受注者は、工事用図書又は監理者の指示によって施工することが適当でないと認めたときは、直ちに書面をもって発注者又は監理者に通知する。','工事請負契約において、施工について、工事用図書のとおりに実施されていない部分があると認められるときは、原則として、監理者の指示によって、受注者は、その費用を負担して速やかにこれを修補又は改造し、このための工期の延長を求めることはできない。'],answer:2,hasFigure:false,figureDesc:''}
,
{year:2017,subject:'計画',no:1,text:'技術者の倫理等の用語に関する次の記述のうち、最も不適当なものはどれか。',choices:['「公益確保の責務」は、技術者の倫理的義務の一つであり、「公衆の安全、健康及び福利を最優先に考慮すること」をいう。','「リスクマネジメント」は、危機事態が生じた後に速やかに実施するものであり、被害の最小化、被害の拡大防止、二次被害の防止等が目的となる。','「モラルハザード」は、保険の領域から派生した概念で、近年では、一般に、「倫理観の欠如」と訳され、企業等が節度なく利益を追求する状態をいう。','「不遵守行為」は、個人及び組織を含めて意図的に法令や条例等に従わない行為をいう。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'計画',no:2,text:'建築物の保存・再生の事例に関する次の記述のうち、最も不適当なものはどれか。',choices:['犬島精錬所美術館(岡山県)は、20世紀初頭に閉鎖された精錬所の遺構を活用し、自然エネルギーを積極的に利用した美術館として保存・再生させたものである。','3331 Arts Chiyoda(東京都)は、廃校になった中学校を、アートギャラリーを含む文化施設等として保存・再生させたものである。','カステルヴェッキオ美術館(イタリア ヴェローナ)は、14世紀に建設された歴史的建造物である城を、美術館等として保存・再生させたものである。','リンゴット工場再開発計画(イタリア トリノ)は、20世紀初頭に建設された巨大な自動車工場を、現代美術館として保存・再生させたものである。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'計画',no:3,text:'A〜Dの建築物について、その建造された年代を古いものから新しいものへ並べた順序として、正しいものは、次のうちどれか。\nA．ローマのテンピエット(イタリア)\nB．ル・トロネ修道院(フランス)\nC．ローマのパンテオン(イタリア)\nD．ロンドンのセント・ポール大聖堂(イギリス)',choices:['B → C → D → A','B → C → A → D','C → A → B → D','C → B → A → D'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'計画',no:4,text:'都市空間についての著書に関する次の記述のうち、最も不適当なものはどれか。',choices:['レム・コールハースは、「錯乱のニューヨーク(Delirious New York)」において、主としてマンハッタンの超高層建築物がつくりだした「過密の文化」に着目し、「マンハッタニズム」と定義した。','クリストファー・アレグザンダーは、「パタン・ランゲージ(A Pattern Language)」において、過去の事例から導きだされた都市や建築を形づくるための基本的な原則を示した。','ジェイン・ジェイコブズは、「アメリカ大都市の死と生(The Death and Life of Great American Cities)」において、都市の街路や地区に多様性を生みだす四つの条件を示した。','ケヴィン・リンチは、「都市のイメージ(The Image of the City)」において、ラスベガスの都市景観の多様な空間要素を記号論的な視点から分析した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'計画',no:5,text:'わが国における建築物と周辺環境に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築物に囲まれた広場や街路等の幅員をD、建築物のファサードの高さをHとした場合、D/Hはその外部空間の開放感や閉塞感を表す指標となる。','建築物が冬至の日において4時間以上の日影を周囲に及ぼす範囲は、一般に、建築物の東西方向の幅よりも建築物の高さに大きく影響される。','都市部にある建築物の屋根及び屋上に高日射反射率塗料を塗ることにより、ヒートアイランド現象を抑制する効果が期待できる。','多雪地域の市街地の建築物において、落雪の搬出の不便さと落雪による危険を避けるため、無落雪屋根を採用する場合がある。'],answer:2,hasFigure:false,figureDesc:''},
