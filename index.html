{year:2023,subject:'環境・設備',no:9,text:'吸音・遮音に関する次の記述のうち、最も不適当なものはどれか。',choices:['壁の音響透過損失を10dB増加させるためには、壁の音響透過率を現状の1/10にする必要がある。','空港等の公共施設においては、吸音処理を行うことで、放送音声の聞こえやすさを確保することができる。','学校等の施設においては、周囲に生垣や並木等の植栽を設けることで、騒音を減衰させる大きな物理的効果が得られる。','剛壁に密着させて設置する多孔質吸音材料を厚くすると、一般に、低周波数域における吸音率が上昇する。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'環境・設備',no:10,text:'表に示す条件をもつ室A、B、Cにおける残響時間の大小関係として、最も適当なものは、次のうちどれか。',choices:['A > B > C','A > C > B','C > A > B','C > B > A'],answer:3,hasFigure:true,figureDesc:'室A、B、Cの条件を示す表。室A: 室容積1,000m³、室内表面積750m²、平均吸音率0.2。室B: 室容積1,500m³、室内表面積1,000m²、平均吸音率0.3。室C: 室容積3,000m³、室内表面積1,500m²、平均吸音率0.2。'},
{year:2023,subject:'環境・設備',no:11,text:'空気調和設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['冷暖同時型のマルチパッケージ型空調機は、同一冷媒系統内で冷房と暖房の混在運転をする場合には、熱回収により省エネルギー効果が期待できる。','開放式冷却塔は、同じ冷却能力の密閉式冷却塔に比べて、送風機動力が大きくなる。','水蓄熱槽を用いた熱源システムは、熱源機が空調負荷の変動に直接追従しなくてよいので、熱源機の容量を低減できる。','空気熱源ヒートポンプチリングユニットを複数台連結するモジュール型は、負荷変動に対応して運転台数が変わるので、効率的な運転が可能である。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'環境・設備',no:12,text:'空気調和設備の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['冷水パネルを用いた放射空調方式は、気流や温度むらによる不快感が少ない方式であるが、パネル表面の結露を防止するため、パネル表面温度を室内空気の露点温度以上に保つ必要がある。','床吹出し空調方式は、冷房運転時であっても、空調域の高さに応じた気流特性を有する床吹出し口を用いることにより、天井高にかかわらず効率的な居住域空調が可能である。','リバースリターン方式は、ダイレクトリターン方式に比べて、冷温水配管のスペースを縮小することができる。','デシカント空調方式は、コージェネレーションシステムと組み合わせることによって、排熱の利用が可能となるので、コージェネレーションシステムの総合効率の向上に寄与することができる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'環境・設備',no:13,text:'換気設備の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['喫煙室において、非喫煙場所との境界の開口部における気流の風速は、喫煙室に向かって0.2m/s以上とした。','事務所ビルにおいて、執務室の中央南面に縦シャフトを通し、その頂部を延長したソーラーチムニー方式を採用することで温度差換気を積極的に活用した。','火気使用室において、排気フードI型を設けた換気扇の有効換気量Vは、V＝30KQ(K:燃料の単位燃焼量当たりの理論廃ガス量、Q:火を使用する設備又は器具の実状に応じた燃料消費量)により算出した。','ボイラー室において、燃料の燃焼に伴う発熱を制御するため、第3種換気方式とした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'環境・設備',no:14,text:'事務所ビルの飲料用受水槽に関する次の記述のうち、最も不適当なものはどれか。',choices:['塩素による腐食の発生を防ぐため、ステンレス鋼板製の受水槽は、水面上部(気相部)には水面下部(液相部)より耐食性の高いステンレス鋼材を用いた。','断水時におけるBCP対策等のため、受水槽の容量を1日予想給水量の2倍に設定したので、塩素滅菌装置を設置した。','水槽内における藻類の増殖を防ぐため、屋外に設置するFRP製の受水槽は、水槽照度率(水槽内照度[lx]/水槽外照度[lx]×100)[%]が10%以下のものを用いた。','水槽内の滞留水による死水ができないようにするため、大容量の受水槽内には迂回壁を設けた。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'環境・設備',no:15,text:'給排水衛生設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['公共下水道が合流式である地域においては、害虫や臭気等の侵入防止を目的として、雨水排水はトラップますを介して一般排水系統の敷地排水管に接続する。','管径200mmの敷地排水管の排水ますは、起点、屈曲点、合流箇所、ますの間隔が24m以内となるような位置等に設ける。','雨水排水管径の算定に用いる雨量に最大雨量の1時間値を用いることは、10分間値を用いた場合よりも排水管径は大きくなるので、局地的な集中豪雨への対策として有効である。','サイホン式雨水排水システムは、特殊な形状のルーフドレンによりサイホン現象を発生させ、多量の雨水を排水する方式で、一般に、従来方式に比較して雨水たてどいの口径を小さくすることができる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'環境・設備',no:16,text:'電気設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['力率は、交流回路に電力を供給する際における、「皮相電力」を「有効電力」で除したものである。','需要率は、ある電力系統における、「接続された負荷の最大需要電力」を「負荷設備容量の総和」で除したものである。','負荷率は、ある期間における、「平均需要電力」を「最大需要電力」で除したものである。','不等率は、「ある系統に接続されている個々の負荷の最大需要電力の合計」を「その系統の最大需要電力」で除したものである。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'環境・設備',no:17,text:'電気設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['雷保護システムにおけるSPD(サージ防護デバイス)は、建築物に対する直撃雷・近傍雷による雷害から、電気・電子機器を守るために設置する装置のことである。','同一容量の負荷設備に電力を供給する場合における電線の断面積は、同じ種類の電線であれば、配電電圧が400Vよりも200Vのほうが、小さいものを使用することができる。','かご形三相誘導電動機の始動電流は、全電圧始動方式(直入れ始動)よりもスターデルタ始動方式のほうが小さくなる。','鉄骨造の建築物における雷保護システムの引き下げ導線は、地上部分の構造体の鉄骨を利用することができる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'環境・設備',no:18,text:'自動火災報知設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['炎感知器は、天井が高い空間のように、熱や煙が天井面に到達する以前に分散し、火災検出が困難な場所において使用される。','P型受信機は、R型受信機と異なり、固有信号による伝送方式であるので信号線を少なくすることができる。','地区音響装置における区分鳴動方式とは、火災時に一斉に鳴動させることでパニックを発生させないように、階の区分ごとに限定して鳴動させる方式のことである。','予備電源が内蔵されていない受信機と非常電源間の配線には、火災時に異常なく動作させるために、耐火配線を使用する。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'環境・設備',no:19,text:'建築設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['高層建築物において、1階の天井内に吊り支持された設備機器の設計用地震力を算定する場合、設計用標準震度は、適用階の区分を中間階とし、耐震クラスに応じた値を用いる。','基礎免震構造の建築物において、エレベーターの設計用水平地震力を算定する場合、設計用水平標準震度は、建築物の高さに関係なく全ての階で同じ値を用いる。','大地震後にも長時間継続して使用する非常用発電機の冷却方式は、冷却水が不要な空冷式が望ましい。','エキスパンションジョイント部分には、原則として、給水管を通過させてはならないが、やむを得ず通過させる場合は、低層部を避け、できるだけ高層部に配管する。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'環境・設備',no:20,text:'環境・設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['我が国における「ZEB Ready」は、再生可能エネルギーによる削減分を除いて、基準となる一次エネルギー消費量から50%以上の省エネルギー化を達成した建築物と定義されている。','建築物の省エネルギー基準における一次エネルギー消費性能の評価指標BEIは、「評価建築物の省エネルギー量の合計」を「評価建築物の基準となる一次エネルギー消費量」で除した値と定義されている。','建築物の省エネルギー基準における外皮性能の評価指標PAL＊(パルスター)は、その値が小さいほど建築物の外皮の熱性能が高いと判断される。','冷凍機に使用されている代替フロン(HFC)は、温室効果ガスの一種であり、モントリオール議定書のキガリ改正(2016年)により生産及び消費量の段階的削減が求められている。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:1,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['脱落によって重大な危害を生ずるおそれがあるものとして国土交通大臣が定める天井は、「強化天井」である。','特定都市河川浸水被害対策法第10条並びにこの規定に基づく命令及び条例の規定で、建築物の敷地、構造又は建築設備に係るものは、「建築基準関係規定」である。','建築物の自重、積載荷重等を支える最下階の床版は、「構造耐力上主要な部分」である。','防火戸であって、これに通常の火災による火熱が加えられた場合に、加熱開始後1時間当該加熱面以外の面に火炎を出さないものとして、国土交通大臣の認定を受けたものは、「特定防火設備」である。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:2,text:'面積、高さ又は階数に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['延べ面積1,000m²の建築物における専ら防災のために設ける備蓄倉庫の用途に供する部分の床面積の合計が20m²の場合、当該部分の床面積については、建築基準法第52条第1項に規定する容積率の算定の基礎となる延べ面積(建築物の容積率の最低限度に関する規制に係るものを除く。)に算入しない。','北側の前面道路又は隣地との関係についての建築物の各部分の高さの最高限度が高度地区に関する都市計画において定められている場合の高さの算定に当たっては、建築物の屋上部分にある階段室で、その水平投影面積の合計が当該建築物の建築面積の1/8であるものについては、その部分の高さは、当該建築物の高さに算入する。','前面道路との関係についての建築物の各部分の高さの制限に係る建築物の後退距離の算定の特例の適用を受ける場合、ポーチの部分の水平投影の前面道路に面する長さについては、敷地の前面道路に接する部分の水平投影の長さの1/5以下でなければならない。','建築物の地階(倉庫、機械室及びそれらに通ずる階段室からなるもの)で、その水平投影面積の合計が当該建築物の建築面積の1/8であるものについては、当該建築物の階数に算入する。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:3,text:'都市計画区域内における次の行為のうち、建築基準法上、確認済証の交付を受ける必要があるものはどれか。ただし、防火地域、準防火地域又は建築等に関する確認済証の交付を受ける必要がない区域の指定はないものとする。',choices:['木造、延べ面積500m²、高さ9m、地上2階建ての事務所の屋根及び壁の過半の修繕','文化財保護法の規定によって重要文化財として仮指定された、れんが造、延べ面積500m²、地上2階建ての美術館の移転','木造、延べ面積10m²、高さ8m、平家建ての倉庫の新築','鉄骨造、延べ面積500m²、平家建ての事務所の一部(床面積200m²)の、診療所(患者の収容施設があるもの)への用途の変更(大規模の修繕又は大規模の模様替は伴わないものとする。)'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:4,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['建築主は、鉄筋コンクリート造、延べ面積1,000m²、地上5階建ての共同住宅の新築の工事において、3階の床及びこれを支持するはりに鉄筋を配置する工事の工程(特定行政庁が指定する工程ではない。)を終えたときは、指定確認検査機関が中間検査を引き受けた場合を除き、建築主事の中間検査を申請しなければならない。','建築主は、都市計画区域内において、鉄骨造、延べ面積200m²、平家建ての事務所を新築する場合、検査済証の交付を受ける前であっても、建築物を使用することができる。','国際的な規模の会議の用に供することにより、1年を超えて使用する特別の必要がある仮設興行場を建築する場合は、特定行政庁の許可を受けなければならない。','建築物である認証型式部材等で、その新築の工事が建築士である工事監理者によって設計図書のとおり実施されたことが確認されたものは、完了検査において、その認証に係る型式に適合するものとみなす。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:5,text:'第一種住居地域において、図のような断面を有する住宅の1階の居室に設ける開口部(A)の採光に有効な部分の面積として、建築基準法上、正しいものは、次のうちどれか。ただし、開口部(A)の幅は2.0mとし、図に記載されていないことについては考慮しないものとする。',choices:['4.0m²','4.4m²','6.4m²','12.0m²'],answer:2,hasFigure:true,figureDesc:'住宅の断面図。隣地境界線から建物までの距離、開口部(A)の位置と寸法、各階の高さ等が示されている。隣地境界線までの水平距離1.5m、建物幅2.5m、開口部(A)は1階に位置し高さ2.0m、地盤面からの高さ0.7m。建物全体の高さ7.7m。各部の寸法が詳細に記載。'},
{year:2023,subject:'法規',no:6,text:'耐火建築物等に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、特定行政庁の認定等は考慮しないものとする。',choices:['準防火地域内において、延べ面積1,600m²、地下1階、地上3階建ての事務所を新築する場合は、耐火建築物又はこれと同等以上の延焼防止時間となる建築物としなければならない。','耐火性能検証法における建築物の各室内の可燃物の発熱量は、当該室の用途及び床面積並びに当該室の壁、床及び天井(天井のない場合においては、屋根)の室内に面する部分の表面積及び当該部分に使用する建築材料の種類に応じて国土交通大臣が定める方法により算出する。','防火地域及び準防火地域以外の区域内において、延べ面積2,000m²、地上3階建ての図書館を新築する場合は、耐火建築物としなければならない。','延べ面積600m²、地上3階建ての物品販売業を営む店舗(耐火建築物以外のもの)は、その主要構造部に通常の火災による火熱が所定の特定避難時間(屋根及び階段は30分間)加えられた場合に、当該部分が構造耐力上支障のある変形、溶融、破壊その他の損傷を生じないものでなければならない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:7,text:'避難施設等に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['床面積の合計が2,000m²、地上3階建ての物品販売業を営む店舗で、各階を当該用途に供するものについて、各階の売場及び屋上広場に通ずる直通階段を2か所設け、これを避難階段とした。','主要構造部を耐火構造とした地上5階建てのナイトクラブの用途に供する建築物(避難階は1階であり、各階に客席を有し、居室の床面積の合計が各階200m²で、避難上有効なバルコニー、屋外通路等を設けていないもの)について、各階から地上に通ずる直通階段を1か所設けた。','診療所(特定階を有し、病室の床面積の合計が110m²で、主要構造部を準耐火構造としたもの)について、各階から避難階に通ずる直通階段(間仕切壁及び所定の防火設備により当該階段の部分以外の部分と区画されているもの)を1か所設けた。','階避難安全検証法により、火災発生時において建築物の階からの避難が安全に行われることを検証するため、「当該階の各居室ごとに、当該居室で火災が発生した場合に当該居室の在室者の全てが当該居室から安全に避難できること」及び「当該階の各火災室ごとに、当該火災室で火災が発生した場合に当該階に存する者の全てが当該階から安全に避難できること」を確かめた。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:8,text:'仮設建築物等に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['災害があった場合において建築する公益上必要な用途に供する応急仮設建築物については、避難施設に関する規定が適用されず、当該建築物を建築した者は、その建築工事を完了した後3月を超えて当該建築物を存続させようとする場合、原則として、その超えることとなる日前に、特定行政庁の許可を受けなければならない。','建替えのためその工事期間中、当該従前の建築物に代えて必要となる仮設店舗で、安全上、防火上及び衛生上支障がないものとして特定行政庁の許可を受けたものについては、内装の制限に関する規定は適用されない。','非常災害があった場合において、非常災害区域等のうち準防火地域内にある学校の用途を変更して地方公共団体が災害救助のために使用する病院で、その災害が発生した日から1月以内に当該用途の変更に着手するものについては、建築基準法令の規定は適用されない。','建築物の用途を変更して一時的に使用する興行場で、安全上、防火上及び衛生上支障がないものとして特定行政庁の許可を受けるものについては、排煙設備に関する規定は適用されない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:9,text:'次の記述のうち、建築基準法上、誤っているものはどれか。ただし、居室については、内装の制限を受ける「窓その他の開口部を有しない居室」には該当しないものとする。',choices:['内装の制限を受ける地上2階建ての有料老人ホームの寝室において、壁及び天井の室内に面する部分の仕上げを難燃材料とした。','耐火建築物である延べ面積750m²、地上3階建ての図書館において、3階部分にあるレファレンスルームの壁及び天井の室内に面する部分の仕上げを難燃材料とした。','主要構造部を耐火構造とした延べ面積300m²、地上3階建ての事務所兼用住宅において、2階に設ける火を使用する調理室の壁及び天井の室内に面する部分の仕上げを、不燃材料、準不燃材料及び難燃材料以外の材料とした。','内装の制限を受ける地上2階建ての病院において、当該用途に供する居室から地上に通ずる主たる廊下、階段その他の通路の壁及び天井の室内に面する部分の仕上げを難燃材料とした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:10,text:'建築設備の次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['給水管、配電管その他の管が、準耐火構造の防火区画を貫通する際に、これらの管は通常の火災による火熱が加えられた場合に、加熱開始後所定の時間、防火区画の加熱側の反対側に火炎を出す原因となる亀裂その他の損傷を生じないものとして、国土交通大臣の認定を受けたものとすることができる。','非常用エレベーター(所定の特殊な構造又は使用形態のものを除く。)について、昇降路は、2基以内ごとに、乗降ロビーに通ずる出入口及び機械室に通ずる主索、電線その他のものの周囲を除き、耐火構造の床及び壁で囲み、乗降ロビーは、窓若しくは排煙設備又は出入口を除き、耐火構造の床及び壁で閉まなければならない。','排煙設備を設置しなければならない居室に設ける排煙設備の排煙口で、煙感知器と連動する自動開放装置を設けたものについては、原則として、手動開放装置を設けなくてもよい。','準耐火構造の床若しくは壁又は防火戸その他の政令で定める防火設備で、床面積200m²以内に区画された共同住宅の住戸の居室には、窓その他の開口部で開放できる部分(天井又は天井から下方80cm以内の距離にある部分に限る。)の面積の合計が、当該居室の床面積の1/50未満であっても、排煙設備を設けなくてもよい。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:11,text:'建築物の構造計算に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['高さが31mの鉄筋コンクリート造の建築物において、保有水平耐力計算によって安全性を確かめる場合、構造耐力上主要な部分である柱の主筋の断面積の和は、コンクリートの断面積の0.8%以上としなくてもよい。','高さが15mの鉄筋コンクリート造の建築物で、保有水平耐力計算又はこれと同等以上に安全性を確かめることができる所定の基準に従った構造計算を行ったものは、構造計算適合性判定の対象とならない。','高さが60mを超える鉄骨造の建築物で、荷重及び外力によって建築物の各部分に連続的に生ずる力及び変形を把握することその他の所定の基準に従った構造計算によって安全性が確かめられたものとして国土交通大臣の認定を受けたものは、構造計算適合性判定の対象とならない。','許容応力度等計算によって安全性を確かめる場合、外装材については、所定の構造計算によって風圧に対して構造耐力上安全であることを確かめなければならない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:12,text:'構造強度の次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['建築物の実況によらないで、基礎の垂直荷重による圧縮力を計算する場合、映画館の客席(固定席)で、柱のささえる床の数が2のときは、床の積載荷重として採用する数値を2,600N/m²とすることができる。','径25mmの異形鉄筋における、短期に生ずる力に対する圧縮の許容応力度は、鋼材等の種類及び品質に応じて国土交通大臣が定める基準強度の数値としなければならない。','設計基準強度が21N/mm²のコンクリートの場合、短期に生ずる力に対するせん断の許容応力度は、設計基準強度の1/30である。','設計基準強度が21N/mm²のコンクリートの引張りに対する材料強度は、圧縮に対する材料強度の1/10である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:13,text:'限界耐力計算によって安全性が確かめられた建築物に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、高さが4mを超える建築物とする。',choices:['鉄骨造の建築物において、構造耐力上主要な部分である鋼材の圧縮材の有効細長比は、柱にあっては200以下としなくてもよい。','鉄筋コンクリート造の建築物において、構造耐力上主要な部分であるはりは、「複筋ばりとし、これにあばら筋をはりの丈の3/4(臥梁にあっては、30cm)以下の間隔で配置」する必要はない。','鉄筋コンクリート造の建築物において、原則として、コンクリートの打込み中及び打込み後5日間は、コンクリートの温度が2度を下らないようにし、かつ、乾燥、震動等によってコンクリートの凝結及び硬化が妨げられないように養生しなければならない。','鉄骨造の建築物において、構造耐力上主要な部分である柱の脚部は、滑節構造である場合を除き、国土交通大臣が定める基準に従ったアンカーボルトによる緊結その他の構造方法により基礎に緊結しなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:14,text:'都市計画区域内の道路に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['高度利用地区内の自動車のみの交通の用に供する道路の上空に設けられる建築物は、原則として、特定行政庁の許可を受けなければ建築することができない。','工事を施工するために現場に設ける仮設事務所の敷地は、道路に2m以上接しなければならない。','特殊建築物、階数が3以上である建築物等については、その敷地が接しなければならない道路の幅員、道路に接する部分の長さ等について、地方公共団体の条例により、制限を付加される場合がある。','景観重要建造物として指定された建築物については、市町村の条例により、道路に軒を突き出したまま大規模の修繕ができる場合がある。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:15,text:'建築物の用途の制限に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、用途地域以外の地域、地区等の指定はなく、また、特定行政庁の許可等は考慮しないものとする。',choices:['「延べ面積3,500m²、地上5階建ての消防署」は、第一種住居地域内において、新築することができる。','「延べ面積500m²、客席の部分の床面積の合計180m²、平家建ての演芸場」は、準住居地域内において、新築することができる。','「20tの火薬の貯蔵に供する平家建ての倉庫」は、準工業地域内において、新築することができる。','「延べ面積20,000m²、地上3階建ての大学」は、工業地域内において、新築することができる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:16,text:'図のような敷地において、準耐火建築物を新築する場合、建築基準法上、建築することができる建築面積の最大のものは、次のうちどれか。ただし、図に記載されているものを除き、地域、地区等及び特定行政庁の指定、許可等は考慮しないものとする。',choices:['238.0m²','273.0m²','292.5m²','308.0m²'],answer:4,hasFigure:true,figureDesc:'敷地の配置図。敷地は第一種住居地域(建蔽率6/10)と近隣商業地域・準防火地域(建蔽率8/10)にまたがる。北側に建築基準法第42条第2項の規定に基づく道路(現況の道の中心線を当該道路の中心線とする)があり幅員2m。敷地は15m×15mと10m×6mの部分からなり、街区の角にある敷地等として特定行政庁が指定したものとする。南側に道路あり。'},
{year:2023,subject:'法規',no:17,text:'図のような敷地において、建築物を新築する場合、建築基準法上、A点における地盤面からの建築物の高さの最高限度は、次のうちどれか。ただし、敷地は平坦で、南側道路、西側道路及び東側隣地との高低差はなく、北側隣地の地盤面より3.0m低いものとし、門、塀等はないものとする。また、図に記載されているものを除き、地域、地区等及び特定行政庁による指定、許可等並びに日影による中高層の建築物の高さの制限及び天空率に関する規定は考慮しないものとする。なお、建築物は、全ての部分において、高さの最高限度まで建築されるものとする。',choices:['20.00m','22.50m','23.50m','23.75m'],answer:3,hasFigure:true,figureDesc:'敷地の配置図と断面図。第一種中高層住居専用地域、容積率30/10。敷地は南側と西側に道路が接し、北側と東側に隣地が接する。建築物は敷地内に配置され、A点が示されている。南側道路幅員6m、西側道路幅員7m。建築物と東側隣地の距離1m。北側隣地は地盤面+3.0m。断面図に各部の寸法が詳細に記載。敷地寸法は南北20m、東西15m程度。'},
{year:2023,subject:'法規',no:18,text:'防火地域及び準防火地域内の建築物の新築に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['防火地域内にある建築物で、外壁が耐火構造のものについては、その外壁を隣地境界線に接して設けることができる。','防火地域内においては、高さが1.5mの看板で、建築物の屋上に設けるものは、その主要な部分を不燃材料で造り、又は覆わなければならない。','防火地域及び準防火地域にわたる建築物(過半が準防火地域内であり、防火地域外で防火壁で区画されていないもの)で、地上3階建ての事務所の用途に供するものは、耐火建築物若しくは準耐火建築物又はこれらと同等以上の延焼防止時間となる建築物としなければならない。','防火地域内の自動車車庫の用途に供する開放的簡易建築物の主要構造部である柱及びはりは、準耐火構造であるか、又は不燃材料で造らなければならない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:19,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['一団地内に建築される1又は2以上の構えを成す建築物のうち、特定行政庁がその位置及び構造が安全上、防火上及び衛生上支障がないと認めるものに対する用途地域等の規定の適用については、当該一団地を当該1又は2以上の建築物の一の敷地とみなす。','建築基準法令の規定による指定確認検査機関の処分に不服がある者は、当該処分に係る建築物について建築確認をする権限を有する建築主事が置かれた市町村又は都道府県の建築審査会に対して審査請求をすることができる。','高さが31mを超えるホテルで、非常用エレベーターを設けていないことにより建築基準法第3条第2項の規定の適用を受けているものについて増築する場合において、増築に係る部分の床面積の合計が基準時における延べ面積の1/2を超えるときは、非常用エレベーターを設けなければならない。','地盤が軟弱な区域として特定行政庁が規則で指定した区域外において、平家建ての木造の住宅で足固めを使用した場合は、構造耐力上主要な部分である柱で最下階の部分に使用するものの下部に土台を設けなくてもよい。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:20,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['地上5階建ての事務所のみの用途に供する建築物において、防火区画に接する外壁については、外壁面から50cm以上突出した準耐火構造のひさし、床、袖壁等で防火上有効に遮られている場合においては、当該外壁のうちこれらに接する部分を含み幅90cm以上の部分を準耐火構造としなくてもよい。','病院の地階に設ける入院患者の談話のために使用される居室においては、採光のための窓その他の開口部の採光に有効な部分の面積を、その居室の床面積に対して1/10以上としないこともできる。','老人ホームにおけるエレベーターの昇降路の部分又は共用の廊下若しくは階段の用に供する部分の床面積が、当該老人ホームの床面積の合計の1/3を超える場合においては、当該床面積の1/3を限度として、建築物の容積率の算定の基礎となる延べ面積に算入しないものとする。','階段の幅が3mを超える劇場の階段で、蹴上げが15cm以下、かつ、踏面が30cm以上のものにあっては、その中間に手すりを設けなくてもよい。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:21,text:'建築士に関する次の記述のうち、建築士法上、誤っているものはどれか。',choices:['建築士は、延べ面積が2,000m²を超える建築物の建築設備に係る設計について、建築設備士の意見を聴いたときは、設計図書においてその旨を明記するように努めなければならない。','工事監理を行う建築士は、建築設備士の意見を聴いたときには、その旨を明らかにしたうえで、工事監理終了後、直ちに、その結果を建築主に報告しなければならない。','一級建築士は、他の一級建築士の設計した設計図書の一部を変更しようとする場合は、当該一級建築士の承諾を求め、承諾が得られなかったときは、自己の責任において、その設計図書の一部を変更することができる。','建築士は、設計及び工事監理に必要な知識及び技能の維持向上に努めるとともに、設計の委託者に対し、設計の内容に関して適切な説明を行うように努めなければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:22,text:'建築士事務所の開設者に関する次の記述のうち、建築士法上、誤っているものはどれか。',choices:['開設者は、建築物に関する調査の業務を受託する場合、その委託者に対して、建築士法に基づく重要事項の説明や契約を締結したときの書面の交付を行わなければならない。','開設者は、事業年度ごとに、設計等の業務の実績等を記載した報告書(電子計算機に備えられたファイル等による場合を含む。)を作成し、毎事業年度経過後3月以内に建築士事務所の登録をした都道府県知事に提出しなければならない。','開設者は、建築士事務所の登録の更新を怠り、都道府県知事により当該登録を抹消されたにもかかわらず、報酬を得て、設計等を業として行った場合、1年以下の懲役又は100万円以下の罰金に処せられる。','開設者は、延べ面積が300m²を超える建築物の新築に係る設計受託契約の当事者となる場合、作成する設計図書の種類や報酬の額等を書面に記載し、署名又は記名押印をして、契約の当事者間で相互に交付(情報通信の技術を利用する方法による場合を含む。)しなければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:23,text:'建築士事務所に属する建築士と当該建築士事務所との関係に関する次の記述のうち、建築士法上、誤っているものはどれか。ただし、中央指定登録機関の指定は考慮しないものとする。',choices:['建築士事務所に属する建築士は、当該建築士事務所の管理建築士による監督を受ける対象である。','建築士事務所に属する一級建築士が独立して建築士事務所を開設した場合、当該建築士は建築士事務所の登録を受けることに加えて、自らの建築士免許に関する届出事項である「建築士事務所の名称、開設者の氏名及び所在地」に変更があった旨を、変更のあった日から30日以内に国土交通大臣に届け出なければならない。','一級建築士は、建築士事務所に所属しなくなった後、一級建築士定期講習の受講期間を超えた日以降に建築士事務所に所属した場合は、遅滞なく、一級建築士定期講習を受けなければならない。','建築士事務所に属する建築士が、その業務における建築基準法の違反行為によって免許を取り消された場合、当該建築士事務所の開設者に課せられる処分は、「戒告」又は「1年以内の事務所の閉鎖命令」のいずれかである。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:24,text:'次の記述のうち、都市計画法上、誤っているものはどれか。',choices:['都市計画区域内において、コンクリートプラントの改築の用に供する目的で行う開発行為については、都道府県知事の許可を受ける必要はない。','開発区域の面積が40haの開発行為について開発許可を申請しようとする者は、あらかじめ、当該開発区域を供給区域に含むガス事業法に規定する一般ガス導管事業者と協議する必要はない。','市街化区域内において、市街地再開発事業の施行として行う1,000m²の開発行為については、都道府県知事の許可を受ける必要はない。','地区整備計画が定められている地区計画の区域内において、仮設建築物の建築を行おうとする者は、行為の種類、場所、着手予定日等を市町村長に届け出る必要はない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:25,text:'次の記述のうち、消防法上、誤っているものはどれか。ただし、いずれも無窓階を有しないものとし、危険物等の貯蔵又は取扱いは行わないものとする。また、いずれの建築物も各階を当該用途に供するものとする。',choices:['屋内消火栓設備を設けるべき地上8階建ての防火対象物に、屋外消火栓設備を設置する場合は、3階以下の各階について屋内消火栓設備を設置しなくてもよい。','木造、延べ面積400m²、地上2階建ての図書館には、自動火災報知設備を設置しなくてもよい。','延べ面積5,000m²、地上3階建ての耐火建築物であるホテルには、スプリンクラー設備を設置しなくてもよい。','延べ面積5,000m²、地上2階建ての準耐火建築物である倉庫については、屋外消火栓設備を設置しなくてもよい。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:26,text:'次の記述のうち、「高齢者、障害者等の移動等の円滑化の促進に関する法律」上、誤っているものはどれか。',choices:['「建築物移動等円滑化誘導基準」においては、多数の者が利用する主たる階段は、回り階段以外の階段を設ける空間を確保することが困難であるときは、回り階段とすることができる。','床面積の合計が2,000m²の物品販売業を営む店舗を新築する場合、移動等円滑化経路を構成する階段に併設する傾斜路の幅は、90cm以上としなければならない。','建築主等は、床面積の合計が3,000m²の共同住宅を新築する場合、当該建築物を「建築物移動等円滑化基準」に適合させるために必要な措置を講ずるよう努めなければならない。','建築主等は、事務所の便所の修繕をしようとするときは、当該便所を「建築物移動等円滑化基準」に適合させるために必要な措置を講ずるよう努めなければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:27,text:'次の記述のうち、「建築物のエネルギー消費性能の向上に関する法律」上、誤っているものはどれか。',choices:['共同住宅の請負型規格住宅を1年間に新たに300戸以上建設する工事を業として請け負う者は、当該住宅をエネルギー消費性能の一層の向上のために必要な住宅の構造及び設備に関する基準に適合させるよう努めなければならない。','建築主は、非住宅部分の床面積の合計が300m²の事務所を新築しようとするときは、当該建築物(非住宅部分に限る。)を建築物エネルギー消費性能基準に適合させなければならない。','建築基準法第52条第1項に規定する建築物の容積率の算定の基礎となる延べ面積には、認定建築物エネルギー消費性能向上計画に係る建築物の床面積のうち、建築物エネルギー消費性能誘導基準に適合させるための措置をとることにより通常の建築物の床面積を超えることとなる場合、国土交通大臣が定めるものの床面積については、当該建築物の延べ面積の1/10を限度として算入しないものとする。','建築主は、床面積の合計が300m²の共同住宅を新築しようとするときは、原則として、その工事に着手する日の21日前までに、当該行為に係る建築物のエネルギー消費性能の確保のための構造及び設備に関する計画を所管行政庁に届け出なければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:28,text:'次の「計画」について所管行政庁による認定を受けることで、技術的基準や容積率の特例の適用を受けるために必要な「認定基準の内容」との組合せとして、関係法令上、誤っているものはどれか。',choices:['計画：建築物の耐震改修の計画（建築物の耐震改修の促進に関する法律）／認定基準の内容：建築物の耐震改修の事業の内容が、建築基準法で規定された基準を超え、かつ、地震に対する安全性の一層の向上の促進のために誘導すべき基準である「耐震関係規定」に適合していること。','計画：特定建築物の建築等及び維持保全の計画（高齢者、障害者等の移動等の円滑化の促進に関する法律）／認定基準の内容：建築物特定施設の構造等が、建築物移動等円滑化基準を超え、かつ、高齢者、障害者等が円滑に利用できるようにするために誘導すべき基準である「建築物移動等円滑化誘導基準」に適合していること。','計画：認定長期優良住宅建築等計画（長期優良住宅の普及の促進に関する法律）／認定基準の内容：住宅の構造及び設備が、住宅を長期にわたり良好な状態で使用するために誘導すべき基準に適合する措置等が講じられた「長期使用構造等」であること。','計画：建築物エネルギー消費性能向上計画（建築物のエネルギー消費性能の向上に関する法律）／認定基準の内容：建築物のエネルギー消費性能が、建築物エネルギー消費性能基準を超え、かつ、建築物のエネルギー消費性能の向上の一層の促進のために誘導すべき基準である「建築物エネルギー消費性能誘導基準」に適合するものであること。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:29,text:'延べ面積2,000m²の「寄宿舎」を「有料老人ホーム」に用途の変更(大規模の修繕又は大規模の模様替は伴わないものとする。)をする場合の取扱いについて、次の記述のうち、建築基準法その他の建築関係法令の規定の適用に関する内容として、誤っているものはどれか。',choices:['変更前の建築物が「建築物移動等円滑化基準」に適合していなかったときは、用途の変更に当たって、廊下、階段、便所などの「建築物特定施設」の構造及び配置を当該基準に適合させなければならない。','寄宿舎の寝室であった居室に「非常用の照明装置」が設けられていなかった場合は、用途の変更に当たって、原則として、当該居室に「非常用の照明装置」を設けなければならない。','スプリンクラー設備等の「消防用設備等」については、用途の変更に当たって、変更後の設置基準に適合させなければならない。','用途の変更に当たって、工事に着手する前に建築確認の申請を行い、当該工事の完了後は完了検査の申請を行わなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'法規',no:30,text:'次の記述のうち、関係法令上、誤っているものはどれか。',choices:['「都市の低炭素化の促進に関する法律」上、認定建築主は、認定を受けた低炭素建築物新築等計画の変更をしようとするときは、原則として、所定の申請書等を提出して所管行政庁の認定を受けなければならない。','「建築物の耐震改修の促進に関する法律」上、地震に対する安全性の向上を目的とした敷地の整備は、耐震改修に含まれない。','「建設業法」上、建設業者は、発注者から請負代金の額が7,000万円の事務所の建築一式工事を請け負った場合、当該工事を施工するときは、当該工事現場に置く主任技術者又は監理技術者を専任の者としなくてよい。','「長期優良住宅の普及の促進に関する法律」上、構造及び設備が長期使用構造等に該当すると認められる既存住宅(区分所有住宅を除く。)の所有者は、長期優良住宅として国土交通省令で定める長期優良住宅維持保全計画を作成し、所管行政庁の認定を申請することができる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:1,text:'図のような集中荷重Pを受ける梁A及びBの荷重点に生じるたわみδAとδBとの比として、正しいものは、次のうちどれか。ただし、梁A及びBは同一断面で、全長にわたって等質等断面の弾性部材とし、自重は無視する。',choices:['δA : δB = 4 : 1','δA : δB = 8 : 1','δA : δB = 16 : 1','δA : δB = 32 : 1'],answer:3,hasFigure:true,figureDesc:'梁A: 片持ち梁（左端固定）、右端自由端に集中荷重P（下向き）、スパンl、たわみδA。梁B: 単純梁（両端ピン支持）、中央に集中荷重P（下向き）、スパンl（l/2+l/2）、右端にたわみδB。'},
{year:2023,subject:'構造',no:2,text:'図のような断面積が一定で長さが3lの部材において、a、b及びcの位置における断面の図心にそれぞれ軸方向力P、P及び2Pが矢印の向きに作用するとき、「a－b間の軸力」と「cの軸方向変位」との組合せとして、正しいものは、次のうちどれか。ただし、部材は全長にわたって等質等断面の弾性部材とし、自重は無視する。また、部材の断面積をA、ヤング係数をEとする。',choices:['a－b間の軸力: P、cの軸方向変位: (2l/AE)P','a－b間の軸力: P、cの軸方向変位: (3l/AE)P','a－b間の軸力: 2P、cの軸方向変位: (2l/AE)P','a－b間の軸力: 2P、cの軸方向変位: (3l/AE)P'],answer:2,hasFigure:true,figureDesc:'上端固定の鉛直部材（長さ3l）。上からa、b、cの位置に区切られ各区間長さl。aの位置に左向き軸力P、bの位置に左向き軸力P、下端に下向き軸力2P。'},
{year:2023,subject:'構造',no:3,text:'図－1のような水平荷重Pを受けるラーメンにおいて、Pを増大させたとき、そのラーメンは、図－2のような崩壊機構を示した。ラーメンの崩壊荷重Puの値として、正しいものは、次のうちどれか。ただし、柱、梁の全塑性モーメントの値は、それぞれ400 kN・m、200 kN・mとする。',choices:['225 kN','300 kN','375 kN','500 kN'],answer:3,hasFigure:true,figureDesc:'図-1: 1層1スパンラーメン。左柱下端固定、右柱下端固定。梁スパン8m、柱高さ8m（上部2m＋下部6m）。左側に水平荷重P。Mp(梁)=200kN・m、Mp(柱)=400kN・m。図-2: 崩壊機構。柱頭と梁端に塑性ヒンジが形成。'},
{year:2023,subject:'構造',no:4,text:'図は、2層のラーメンにおいて、2階に水平荷重P1、R階に水平荷重P2が作用したときの柱の曲げモーメントを示したものである。次の記述のうち、誤っているものはどれか。ただし、全ての部材の自重は無視する。',choices:['2階に作用する水平荷重P1は、100 kNである。','2階の梁のせん断力QBは、64 kNである。','1階右側の柱の軸方向圧縮力NCは、128 kNである。','右側の支点の鉛直反力Vは、152 kNである。'],answer:3,hasFigure:true,figureDesc:'2層1スパンラーメン（スパン10m）。R階高さ4m、2階高さ4m、1階高さ4m。柱の曲げモーメント図が描かれている。R階柱頭: 160kN・m、2階柱頭: 200kN・m/120kN・m、1階柱脚: 280kN・m。'},
{year:2023,subject:'構造',no:5,text:'静定トラスは、一つの部材が降伏すると塑性崩壊する。図のような集中荷重Pを受けるトラスの塑性崩壊荷重として、正しいものは、次のうちどれか。ただし、各部材は、断面積をA、材料の降伏応力度をσyとし、断面二次モーメントは十分に大きく、座屈は考慮しないものとする。また、全ての部材の自重は無視する。',choices:['Aσy/3','Aσy/(3√2)','Aσy/6','Aσy/(6√2)'],answer:3,hasFigure:true,figureDesc:'2段のプラットトラス。上弦材と下弦材が3スパン（各スパンl）、高さl。上弦材の3つの格点に下向き集中荷重P。左端上下ピン・ローラー支持。斜材あり。'},
{year:2023,subject:'構造',no:6,text:'次の架構のうち、静定構造はどれか。',choices:['正方形ラーメン（上辺中央ピン、左下ピン支持、右下ローラー支持）','門型ラーメン（上辺両端ピン、左下固定支持、右下ローラー支持、斜め部材あり）','正方形ラーメン（上辺両端ピン、左下ローラー支持、右下ローラー支持、斜め部材あり）','門型ラーメン（左下固定支持、右下ローラー支持）'],answer:1,hasFigure:true,figureDesc:'4つの架構図。1: 正方形フレーム、上辺中央ピン、下辺左ピン支持・右ローラー支持。2: 門型フレーム、上辺両端ピン、左下固定・右下ローラー、右側に斜材。3: 正方形フレーム、上辺両端ピン、下辺左右ローラー、斜材あり。4: 門型フレーム、左下固定・右下ローラー。'},
{year:2023,subject:'構造',no:7,text:'建築基準法における建築物に作用する地震力に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築物の基礎の底部の直下の地盤の種別に応じて定められる数値Tcは、沖積層の深さが35 mの軟弱な第三種地盤である場合、0.2秒を用いる。','鉄骨造又は木造の建築物の地震力を算定する場合に用いる設計用一次固有周期T（単位 秒）は、建築物の高さ（単位 メートル）に0.03を乗じて算出することができる。','弾性域における設計用一次固有周期Tの計算に用いる建築物の高さは、建築物の最高高さではなく、振動性状を十分に考慮した振動上有効な高さを用いる場合がある。','地震層せん断力係数の算定に用いる振動特性係数Rtは、一般に、設計用一次固有周期Tが長くなるほど、小さくなる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:8,text:'建築基準法における風荷重に関する次の記述のうち、最も不適当なものはどれか。',choices:['屋根葺き材に作用する風圧力の算出に用いる基準風速V0は、構造骨組に用いる風圧力を算出する場合と同じ値である。','屋根葺き材に作用する風圧力の算出に用いる平均速度圧q̄は、一般に、気流の乱れを表すガスト影響係数Gfを考慮する。','基準風速V0は、稀に発生する暴風時を想定した、地上10 mにおける10分間平均風速に相当する値である。','ガスト影響係数Gfは、一般に、建築物の高さと軒の高さとの平均Hの値が大きくなるほど、小さくなる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:9,text:'木造軸組工法による地上2階建ての既存建築物の耐震性を向上させる方法として、一般に、最も効果の低いものは、次のうちどれか。',choices:['既存の布基礎が無筋コンクリート造であったので、布基礎の外部側面に接着系のあと施工アンカーによる差し筋を行い、新たに鉄筋コンクリート造の基礎を増し打ちした。','鉄筋コンクリート造のべた基礎を有する1階の床組において、床下地材に挽板が用いられていたので、これを構造用合板に張り替えた。','1階と2階の耐力壁線の位置がずれていたので、2階の床組の床下地材として新たに構造用合板を梁及び桁に直張りした。','大きな吹抜けが設けられていたので、その部分を、構造用合板を張り付けたキャットウォークや火打梁を用いて補強した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:10,text:'木造軸組工法による地上2階建ての建築物において、建築基準法に基づく「木造建築物の軸組の設置の基準」(いわゆる四分割法)に関する次の記述のうち、最も不適当なものはどれか。',choices:['各側端部分の必要壁量を算定する場合の建築物の階数は、それぞれの側端部分の階数によらず、建築物全体の階数とする。','張り間方向の存在壁量の算定には、桁行方向の耐力壁を考慮しない。','各側端部分のそれぞれについて、壁量充足率が全て1を超える場合は、壁率比がいずれも0.5以上であることを確かめなくてもよい。','各階について、張り間方向及び桁行方向の偏心率が0.3以下であることを確認した場合は、「木造建築物の軸組の設置の基準」によらなくてもよい。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:11,text:'地上4階建て、階高4 m、スパン6 mの普通コンクリートを使用した鉄筋コンクリート造の建築物における部材寸法の設定に関する次の記述のうち、最も不適当なものはどれか。ただし、特別な調査・研究によらないものとする。',choices:['耐力壁の厚さを、階高の1/30以上などを満たすように、150 mmとした。','正方形断面柱の一辺の長さを、階高の1/10以上などを満たすように、600 mmとした。','短辺4 mの長方形床スラブの厚さを、スラブ短辺方向の内法長さの1/40以上などを満たすように、150 mmとした。','バルコニーに用いるはね出し長さ2 mの片持ちスラブの支持端の厚さを、はね出し長さの1/15以上などを満たすように、150 mmとした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:12,text:'鉄筋コンクリート構造の鉄筋の定着に関する次の記述のうち、最も不適当なものはどれか。',choices:['梁主筋の柱への必要定着長さは、柱のコンクリートの設計基準強度が高いほど短くなる。','引張鉄筋の必要定着長さは、フックの折曲げ角度を90度とする場合に比べて、180度とする場合のほうが短い。','引張鉄筋の必要定着長さは、横補強筋で拘束されていない部分に定着する場合に比べて、横補強筋で拘束されたコア内に定着する場合のほうが短い。','最上階以外の梁で、上端筋と下端筋を柱内で連続させてU字形の折曲げ定着とする場合、その定着長さの取り方は折曲げ角度90度のフックを準用してもよい。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:13,text:'鉄筋コンクリート構造の許容応力度計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['梁の短期許容せん断力の計算において、有効せいに対するせん断スパンの比による割増しを考慮した。','梁の許容曲げモーメントの計算において、引張鉄筋比が釣合い鉄筋比以下であったので、at(引張鉄筋の断面積)×ft(引張鉄筋の許容引張応力度)×j(梁の応力中心間距離)により算定した。','耐力壁の長期許容せん断力の計算において、壁の横筋による効果を考慮した。','柱の許容曲げモーメントは、「圧縮縁がコンクリートの許容圧縮応力度に達したとき」、「圧縮側鉄筋が許容圧縮応力度に達したとき」及び「引張鉄筋が許容引張応力度に達したとき」に対して算定したそれぞれの曲げモーメントのうち、最小となるものとした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:14,text:'鉄筋コンクリート構造の保有水平耐力計算における部材の靱性に関する次の記述のうち、最も不適当なものはどれか。',choices:['両端部が曲げ降伏する梁では、断面が同じ場合、一般に、内法スパン長さが小さいほど、靱性は低下する。','太径の異形鉄筋を主筋に用いる柱では、曲げ降伏する場合、一般に、引張り鉄筋比が大きいほど、靱性は向上する。','軸方向応力度が小さい柱では、断面が同じ場合、一般に、曲げ降伏する時点の平均せん断応力度が小さいほど、靱性は向上する。','壁式構造の耐力壁では、曲げ降伏する時点の平均せん断応力度が同じ場合、一般に、壁板両端に柱があるラーメン構造の耐力壁に比べて、靱性は低下する。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:15,text:'鉄骨構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['H形鋼梁の許容曲げ応力度を、鋼材の基準強度、断面寸法、曲げモーメントの分布及び圧縮フランジの支点間距離を用いて計算した。','多数回の繰返し応力を受ける梁フランジ継手の基準疲労強さを高めるため、梁フランジの継手を高力ボルト摩擦接合から完全溶込み溶接に変更した。','柱の継手に作用する応力をなるべく低減し、かつ、現場での施工性を考慮し、床面から高さ1 mの位置に継手を設けた。','軸方向力と曲げモーメントが作用する露出型柱脚の設計においては、ベースプレートの大きさを断面寸法とする鉄筋コンクリート柱と仮定し、引張側アンカーボルトを鉄筋とみなして許容応力度設計を行った。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:16,text:'鉄骨構造の接合部に関する次の記述のうち、最も不適当なものはどれか。',choices:['部分溶込み溶接は、片面溶接でルート部に曲げ又は荷重の偏心によって生じる付加曲げによる引張応力が作用する場合には、用いることができない。','突合せ溶接部において、母材の種類に応じた適切な溶接材料を用いる場合、溶接部の許容応力度は母材と同じ値を採用することができる。','高力ボルト摩擦接合と溶接接合とを併用する接合部の許容耐力の算定において、高力ボルトの締付けを溶接より先に行う場合には、それぞれの許容耐力を加算することができる。','高力ボルトM22を用いた摩擦接合は、支圧ではなく接合される部材間の摩擦力で応力を伝達する機構であるので、施工性を考慮し、一般に、ボルト孔の径を25 mmとすることができる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:17,text:'鉄骨構造の設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['鋼材断面の幅厚比の規定は、局部座屈防止のために設けられたものであり、鋼材の降伏点に影響される。','角形鋼管を用いた柱は、横座屈を生じるおそれがないので、材長にかかわらず、許容曲げ応力度を許容引張応力度と同じ値とすることができる。','H形鋼（炭素鋼）の幅厚比の上限値は、骨組の塑性変形能力を確保するために定められたものであり、フランジに比べてウェブのほうが大きい。','大スパンの梁部材に降伏点の高い鋼材を用いることは、鉛直荷重による梁の弾性たわみを小さくする効果がある。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:18,text:'図－1～図－3は、鉄骨造のX形筋かい構面及びラーメン構面における、水平方向の荷重－変形関係を示した模式図である。これに関するイ～ニの記述の組合せのうち、最も適当なものは、次のうちどれか。ただし、水平荷重をQ、水平変形をδとし、強度Qaはいずれも同じ値とする。また、部材の接合部は十分な剛性・強度を有するものとし、破線は、変形が増加したときの実線の履歴ループに続くループを示す。',choices:['イとハ','イとニ','ロとハ','ロとニ'],answer:3,hasFigure:true,figureDesc:'図-1～図-3: Q-δ関係の履歴ループ模式図3種。図-1: 紡錘形の太い履歴ループ。図-2: 逆S字型のスリップ型履歴ループ。図-3: 紡錘形だが図-1より安定した履歴ループ。選択肢イ～ニの記述: イ.図-1は細長比の小さい筋かい構面、図-2は細長比の大きい筋かい構面、図-3はラーメン構面。ロ.図-1は細長比の大きい筋かい構面、図-2は細長比の小さい筋かい構面、図-3はラーメン構面。ハ.筋かいは一般に引張側において降伏耐力を発揮する。ニ.細長比の大きい筋かいは一般に引張・圧縮の両側において降伏耐力を発揮する。'},
{year:2023,subject:'構造',no:19,text:'土質及び地盤に関する次の記述のうち、最も不適当なものはどれか。',choices:['砂質土の内部摩擦角は、一般に、N値が大きくなるほど小さくなる。','土の含水比は、一般に、細粒分含有率が大きくなるほど大きくなる。','地震動が作用している軟弱な地盤においては、地盤のせん断ひずみが大きくなるほど、地盤の減衰定数は増大し、せん断剛性は減少する。','液状化のおそれのある地層が基礎底面以深に存在している場合は、液状化の度合い、液状化のおそれのある地層の厚さ及びその上部の地層構成等を考慮して、沈下等の影響について検討する。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:20,text:'杭基礎等に関する次の記述のうち、最も不適当なものはどれか。',choices:['重要な建築物等の基礎の設計においては、法令上の要求のほかに大地震後の継続使用性等を目標とする場合、液状化などの地盤変動の可能性を考慮して、必要に応じ、終局時の状況を想定した検討を行う。','杭1本当たりの鉛直荷重が等しい場合、杭の沈下量の大小関係は、一般に、「単杭」＜「群杭」である。','杭先端の地盤の許容応力度の大小関係は、一般に、「打込み杭」＜「セメントミルク工法による埋込み杭」＜「アースドリル工法等による場所打ちコンクリート杭」である。','砂質地盤における杭の極限周面抵抗力度の大小関係は、一般に、「打込み杭」＜「場所打ちコンクリート杭」である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:21,text:'鉄筋コンクリート造の擁壁の設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['L型擁壁における底版の直上にある土の重量は、一般に、擁壁の転倒に対する抵抗要素として考慮できない。','擁壁に常時作用する土圧は、一般に、受働土圧に比べて主働土圧のほうが小さい。','擁壁に常時作用する土圧は、一般に、背面土の内部摩擦角が大きくなるほど小さくなる。','擁壁の滑動抵抗を大きくするために、擁壁底版の底面に突起を設けることは有効である。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:22,text:'プレストレストコンクリート構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['保有水平耐力計算におけるプレストレストコンクリート柱の部材種別判定において、軸方向力にPC鋼材の有効プレストレス力を考慮しない。','プレストレストコンクリート部材に導入されたプレストレス力は、PC鋼材のリラクセーション等により、時間の経過とともに減少する。','プレストレストコンクリート部材のPC鋼材の曲げ半径が小さく、角度変化が大きい箇所においては、内側のコンクリートの局部圧縮応力について検討する。','建築物の使用上の支障が起こらないことを確かめるためにプレストレストコンクリート部材の長期たわみを算定する場合には、部材の曲げ耐力に対するPC鋼材の寄与を考慮して変形増大係数を低減することができる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:23,text:'合成構造及び混合構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['鉄筋コンクリートスラブとこれを支持する鉄骨梁とを接合する合成梁を完全合成梁とする場合には、合成梁断面が全塑性モーメントを発揮するのに必要な本数以上の頭付きスタッドを設ける。','鉄骨鉄筋コンクリート構造において、地震時に引張軸力の生じる1階の鉄骨柱脚は、原則として、埋込み形式とする。','鉄筋コンクリート柱・鉄骨梁の混合構造における柱梁接合部の設計では、柱梁接合部のせん断破壊や、接合部に連なる柱頭・柱脚の支圧破壊等が生じないことを確認する。','外周部の骨組を鉄骨造とし、コア部分の壁を鉄筋コンクリート造とした混合構造形式は、一般に、外周部の骨組は主に水平力を負担する主要な構造要素とし、コア部分の壁は主に鉛直荷重を負担する構造形式である。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:24,text:'耐震構造、制振構造及び免震構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['構造特性係数Dsは、建築物の振動に関する減衰性及び各階の靱性に応じて、建築物に求められる必要保有水平耐力を低減する係数である。','制振構造に用いられる鋼材ダンパーは、ダンパーが弾性範囲に留まる地震動レベルにおいてもエネルギー吸収能力を発揮する。','制振構造において、ダンパーの接合部及び周辺部材が変形する場合や、ダンパーの取りつく柱の軸変形により架構全体が曲げ変形する場合には、ダンパーの効率が低下する。','免震構造に用いられる積層ゴムアイソレータは、座屈が生じない範囲では、ある変形までは水平変位に比例してせん断力が大きくなり、水平剛性はほぼ一定であるが、さらに変形が進むと徐々に水平剛性が大きくなり、最終的にゴム層の破断に至る。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:25,text:'建築物の耐震設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築物の地下部分の各部分に作用する地震力は、一般に、当該部分の固定荷重と積載荷重の和に所定の水平震度を乗じて計算する。','地震層せん断力係数の算定に用いる地震地域係数Zは、許容応力度設計用地震力と必要保有水平耐力の算定において、一般に、同じ値を用いる。','1階が鉄骨鉄筋コンクリート造で2階以上が鉄骨造の建築物の構造計算において、2階以上の部分の必要保有水平耐力は、一般に、鉄骨造の構造特性係数Dsを用いて計算する。','限界耐力計算において、塑性化の程度が大きいほど、一般に、安全限界時の各部材の減衰特性を表す数値を小さくすることができる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:26,text:'エキスパンションジョイント等によって構造的に分離した建築物の構造計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['地下部分も含めて別棟とするに当たって、許容応力度計算で用いる中地震時程度の荷重により生じる変形に対して、建築物の衝突による損傷が生じないことを確かめた。','鉄筋コンクリート造で、地下部分も含めて別棟とするに当たって、保有水平耐力計算で用いる大地震時程度の荷重に対しては、簡便的に、それぞれのエキスパンションジョイントがある部分の高さをHとし、当該高さにおける間隔がH/50以上であることを確かめた。','地下部分が一体で地上部分を別棟とするに当たって、一次設計については、地下部分を検討する際には、地上部分の「耐震計算ルート1」や「耐震計算ルート2」で必要となる割り増し規定を適用しなかった。','地下部分（1階の床・梁を含む。）が一体で地上部分を別棟とするに当たって、1階床スラブを一体の剛床と仮定したので、1階床スラブでの局部的な地震力の伝わり方の検討は省略した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:27,text:'木材の破壊の性状として、一般に、脆性的な性状を示さないものは、次のうちどれか。',choices:['木材の繊維に直交方向の圧縮によるめり込み','木材の繊維に直交方向の引張による割り裂き','木材の繊維に平行方向の圧縮による全体座屈','木材の繊維に平行方向の引張による破断'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:28,text:'コンクリートに関する次の記述のうち、最も不適当なものはどれか。',choices:['軽量コンクリート1種のせん断弾性係数は、一般に、ヤング係数が大きいほど大きい。','常温における軽量コンクリート1種の線膨張係数は、一般の鋼材とほぼ等しく、鋼材と同じ値を用いることが多い。','軽量コンクリート1種のヤング係数は、一般に、同じ設計基準強度の普通コンクリートのヤング係数に比べて小さい。','軽量コンクリート1種の許容せん断応力度は、一般に、同じ設計基準強度の普通コンクリートの許容せん断応力度と等しい。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:29,text:'鋼材に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築構造用圧延鋼材（SN材）B種及びC種は、降伏比だけでなく降伏点のレンジ（上限値から下限値までの幅）が規定されており、これらの鋼材を用いることにより、設計するうえで想定した降伏メカニズムを実現する確度を高めることができる。','建築構造用ステンレス鋼材SUS304Aは、降伏点が明確ではないので、0.1％オフセット耐力をもとに基準強度が定められている。','同じ鋼塊から圧延された鋼材の降伏点は、一般に、「板厚の薄いもの」に比べて「板厚の厚いもの」のほうが高くなる。','降伏点325 N/mm2、引張強さ490 N/mm2である鋼材の降伏比は、66％である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'構造',no:30,text:'特定天井に関する次の記述のうち、最も不適当なものはどれか。',choices:['「建築物における天井脱落対策に係る技術基準（国土交通省）」において、特定天井は、稀に生じる地震動の発生時（中地震時）において、天井の損傷を防止することにより、中地震時を超える一定の地震時においても天井の脱落の低減を図ることを目標としている。','既存建築物の増改築においては、特定天井の落下防止措置として、ネットやワイヤーにより一時的に天井の脱落を防ぐ方法は認められていないので、新築時と同様の技術基準に適合させる必要がある。','免震構造の採用により、地震時の加速度が十分に抑えられている場合においても、特定天井についての構造耐力上の安全性の検証は行う必要がある。','特定天井のうち、天井と周囲の壁等との間に隙間を設けない構造方法であっても、地震時における天井材の脱落に対する安全性の検証を行う必要がある。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:1,text:'建築主との監理業務委託契約において監理者が行う監理業務に関する次の記述のうち、「建築士事務所の開設者がその業務に関して請求することのできる報酬の基準（平成31年国土交通省告示第98号）」に照らして、最も不適当なものはどれか。',choices:['建築基準法等の法令に基づく関係機関の検査に必要な書類を工事施工者の協力を得てとりまとめるとともに、当該検査に立会い、その指摘事項等について、工事施工者等が作成し、提出する検査記録等に基づき建築主に報告する。','工事と設計図書との照合及び確認の結果、工事が設計図書のとおりに実施されていないと認めたときは、直ちに、工事施工者に対して、その旨を指摘し、当該工事を設計図書のとおりに実施するよう求め、工事施工者がこれに従わないときは、その旨を建築主事に報告する。','工事施工者の行う工事が設計図書の内容に適合しない疑いがあり、かつ、破壊検査が必要と認められる相当の理由がある場合にあっては、工事請負契約の定めにより、その理由を工事施工者に通知のうえ、必要な範囲で破壊して検査する。','工事施工者から提出される工事期間中の工事費支払いの請求について、工事請負契約に適合しているかどうかを技術的に審査し、建築主に報告する。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:2,text:'工事現場の管理等に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築工事の監理技術者は、自ら施工する工事と、これに密接に関連する別途発注された第三者の施工する他の工事との調整を自らの責任において行わなければならない。','施工計画書の一部である品質計画は、工事において使用予定の材料、仕上げの程度、性能、精度等の施工の目標、品質管理及び管理の体制について具体的に記載したものであり、一般に、監理者が当該工事に相応して妥当であることを確認する。','設計図書において監理者の検査を受けて使用すべきと指定された工事材料のうち、その検査で不合格となったものは、監理者の指示がなくても、工事施工者が速やかに工事現場外に搬出する。','民間の建築一式工事を直接請け負った特定建設業者は、その工事を施工するために締結した下請代金額の総額が7,000万円以上になる場合には、全ての下請負業者を含む施工体制台帳を作成し、建設工事の目的物を引き渡すまで工事現場ごとに備え置かなければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:3,text:'品質管理における確認・検査の方法等に関する次の記述のうち、最も不適当なものはどれか。',choices:['コンクリート工事における調合管理強度の判定は、3回の試験で行い、1回の試験における圧縮強度の平均値が調合管理強度の85％以上、かつ、3回の試験における圧縮強度の総平均値が調合管理強度以上であったので、合格とした。','外壁乾式工法による張り石工事において、石材の形状と寸法については、形状が矩形であること、その幅及び高さが1,200 mm以下、かつ、1枚の面積が0.8 m2以下であることを確認した。','セメントモルタルによる外壁タイル後張り工法における引張接着試験については、引張接着強度の全ての結果が0.4 N/mm2以上、かつ、コンクリート下地の接着界面における破壊率が50％以下であったので、合格とした。','内装工事に使用するせっこうボードのせっこう系直張り用接着材による直張り工法において、通気性のある壁紙を使用するので、せっこうボード張付け後5日間放置してから仕上げが行われることを確認した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:4,text:'建築工事の届出等に関する次の記述のうち、最も不適当なものはどれか。',choices:['共同住宅の新築工事を共同連帯して請け負ったので、共同企業体を構成する事業者が、「共同企業体代表者届」を、その工事の開始の日の14日前までに都道府県労働局長あてに提出した。','店舗の建替え工事期間中に必要となる仮設店舗の新築に当たり、建築基準法の一部の規定の緩和を受けるために、建築主が、「許可申請書（仮設建築物等）」を、建築主事あてに提出した。','プレキャスト部材の運搬に当たり、道路法により通行の制限を受ける車両を通行させるために、「特殊車両通行許可申請書」を、道路管理者あてに提出した。','石綿含有吹付け材や石綿含有保温材が使用されている建築物の解体工事を施工するに当たり、その工事を施工する事業者が、「建設工事計画届」を、石綿含有吹付け材や石綿含有保温材を除去する作業の開始の14日前までに労働基準監督署長あてに提出した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:5,text:'仮設工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['高さが20 mの枠組足場における壁つなぎの間隔については、風荷重を考慮する必要がなかったので、水平方向9 m、垂直方向8 mとした。','鋼製巻尺については、工事着手前にJIS規格品の1級の鋼製巻尺を2本用意してテープ合わせを行い、そのうち1本を基準巻尺として保管し、もう1本の鋼製巻尺を工事に使用した。','建築物の高さと位置の基準となるベンチマークについては、敷地内の移動のおそれのない位置に新設したコンクリート杭に加えて、工事の影響を受けない既存の工作物や道路もベンチマークとし、相互に確認できるようにした。','建築工事を行う部分から水平距離5 m以内の範囲にある歩道に対する危害防止のための防護棚（朝顔）については、1段目を地上から5 mの高さに設け、はね出し長さを足場から水平距離2 mとした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:6,text:'土工事及び山留め工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['親杭横矢板壁は、砂礫地盤における施工が可能であるが、遮水性は期待できないので、地下水位の高い地盤では排水工法を併用する必要がある。','逆打ち工法は、躯体強度が発現する前の地下躯体を支保工として利用するので、軟弱地盤における深い掘削には適さない。','地盤アンカー工法は、不整形な掘削平面の場合や傾斜地等で偏土圧が作用する場合に有効であり、切梁がないので施工効率の向上が期待できる。','軟弱な粘性土地盤の掘削工事において、ヒービングの発生が事前に予測された場合の対策として、剛性の高い山留め壁を良質な地盤まで根入れすることにより背面地盤の回り込みを抑える方法がある。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:7,text:'地業工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['セメント系固化材を用いた地盤改良を採用するに先立ち、現場の土壌と使用する予定のセメント系固化材とを用いて六価クロム溶出試験を実施して六価クロムの溶出量が土壌環境基準以下であることを確認した。','直接基礎において、浅層地盤改良を実施した強固で良質な地盤を支持面とするので、砂利地業を行わず、地盤改良を実施した地盤の表層に直接、捨てコンクリートを打設する地肌地業を行った。','セメントミルク工法による既製コンクリート杭工事において、アースオーガーの支持地盤への到達については、オーガーの駆動用電動機の電流値の変化と土質柱状図・N値の変化を対比することに加えて、オーガーの先端に付着した排出土と土質標本との照合により確認した。','場所打ちコンクリート杭工事の鉄筋かごの組立てについては、主筋が太径であったので、主筋と帯筋とを溶接するとともに、鉄線結束により結合した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:8,text:'鉄筋工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['ガス圧接継手の外観検査において、圧接部における鉄筋中心軸の偏心量が鉄筋径の1/4であったので、再加熱して修正した。','梁の下端筋の配筋において、特記がなかったので、鋼製スペーサーを、端部は0.5 m程度の位置に、端部以外は1.5 m程度の間隔で配置した。','スパイラル筋の加工寸法については、特記がなかったので、外側寸法の許容差を±5 mmの範囲内とした。','設計基準強度が階によって異なる普通コンクリートを用いた建築物の上部構造において、片持ちでない小梁の下端筋（SD345）の直線定着の長さについては、特記がなかったので、設計基準強度にかかわらず20d（dは異形鉄筋の呼び名に用いた数値）とした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:9,text:'型枠工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['床型枠用鋼製デッキプレート（フラットデッキ）には、施工荷重によるたわみを考慮して、一般に、10 mm程度のキャンバー（むくり）がついていることから、短スパン部分に使用する場合には、スラブ厚が薄くならないようにする。','コンクリート表面の硬化不良を起こしやすいせき板を現場で見分けるためには、せき板表面にセメントペーストを塗り付けて2～3日後に剥がして、その表面状態を確認する方法がある。','高さが3.5 mを超えるパイプサポートを支柱に用いる型枠支保工には、高さ3.5 mごとに水平つなぎを二方向に設け、かつ、水平つなぎの変位を防止する措置を講じる。','窓の下枠となる腰壁の型枠は、一般に、コンクリートが盛り上がることを防ぐために腰壁上端の端部にふたを設け、その端部以外の開口部から腰壁部分のコンクリートの充填具合を点検できるようにする。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:10,text:'計画供用期間の級が「標準」の建築物に使用するコンクリートの計画調合に関する次の記述のうち、最も不適当なものはどれか。',choices:['普通コンクリートの調合管理強度は、設計基準強度又は耐久設計基準強度のうち大きいほうの値に、構造体強度補正値を加えた値とした。','普通ポルトランドセメントを用いた普通コンクリートの水セメント比の最大値については、65％とした。','粒形が角張って実積率の小さい粗骨材を用いたので、標準的な実積率の粗骨材を用いた場合に比べて、所定のスランプを得るために単位水量を小さくした。','普通コンクリートの単位セメント量の最小値については、270 kg/m3とした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:11,text:'コンクリート工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['コンクリートの圧送中にベント管内でコンクリートが閉塞したので、圧力を解除した後、そのベント管を速やかに取り外し、閉塞して品質が変化したコンクリートを廃棄した。','梁及びスラブのコンクリートについては、壁及び柱のコンクリートの沈みが落ち着いた後に梁に打ち込み、その梁のコンクリートの沈みが落ち着いた後にスラブに打ち込んだ。','コンクリート充填鋼管造の柱（CFT柱）に使用する鋼管充填コンクリートにおいて、フレッシュコンクリートのブリーディング量については、特記がなかったので、0.1 cm3/cm2以下とした。','普通コンクリートにおける構造体コンクリートの圧縮強度の検査で、受入検査と併用しない検査において、1回の試験における供試体については、任意の1台の運搬車から採取したコンクリート試料で作製した3個を使用した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:12,text:'プレキャスト鉄筋コンクリート工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['プレキャストの耐力壁の水平及び鉛直接合部の防水については、適切な目地深さを確保するためにバックアップ材を装填し、建築用シーリング材により行った。','プレキャスト部材と現場打ちコンクリートの接合部については、豆板などの欠陥を防止するために、打込み箇所を清掃して異物を取り除き、散水してせき板やコンクリート面を湿潤状態にして、接合部1か所ごとに一度にコンクリートを打ち込んだ。','プレキャスト部材の柱脚部において、鉄筋のスリーブ継手のグラウト材の充填度については、注入口から注入したグラウト材が、すべての排出口からあふれ出たことを目視により確認した。','プレキャスト部材の製造において、脱型時に表面温度が高いプレキャスト部材については、表面部の温度が外気温と同程度になるまで適切な温度管理をした貯蔵場所で十分に乾燥させた。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:13,text:'鉄骨工事における溶接に関する次の記述のうち、最も不適当なものはどれか。',choices:['作業場所の気温が2℃であったので、溶接線より100 mmの範囲の母材部分を予熱して溶接を行った。','隅肉溶接において、T継手の密着不良部の隙間が3.0 mmであったので、隅肉溶接のサイズを隙間の大きさだけ大きくした。','裏当て金を用いた柱梁接合部の裏当て金の組立溶接については、梁フランジ幅の両端から5 mm以内の位置において行った。','開先のある溶接の両端に設ける鋼製エンドタブについては、特記がなく、柱材にH形断面柱が用いられている接合部であったので、切断しなかった。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:14,text:'鉄骨工事における精度の管理に関する「検査の対象」と「管理許容差」との組合せとして、鉄骨精度検査基準（(一社)日本建築学会「建築工事標準仕様書6　鉄骨工事　付則6」）に照らして、最も不適当なものは、次のうちどれか。',choices:['製品の検査における柱の長さの誤差ΔH: H<10mの場合 -3mm≦ΔH≦+3mm、H≧10mの場合 -4mm≦ΔH≦+4mm','製品の検査における階高の誤差Δh: -5mm≦Δh≦+5mm','工事現場における柱の倒れe: e≦H/1,000、かつ、e≦10mm','工事現場における建築物の倒れe: e≦H/4,000+7mm、かつ、e≦30mm'],answer:2,hasFigure:true,figureDesc:'4つの検査対象の図解。1: 柱の長さH+ΔH（柱頭柱脚の高力ボルト接合部間）。2: 階高の誤差Δh（各フランジ上面間の長さh1～h4にΔhが加わる）。3: 柱の倒れe（柱の節の高さHに対する水平方向のずれe）。4: 建築物の倒れe（建築物の高さHに対する水平方向のずれe）。'},
{year:2023,subject:'施工',no:15,text:'木造軸組工法における木工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['梁などの横架材については、木材の背を上端にして使用した。','防腐剤が加圧注入されている防腐処理材を用いた土台を、工事現場でやむを得ず加工した面については、再度、防腐処理をして使用した。','土台の継手は、柱及び床下換気口の位置を避け、土台の継手付近に設けるアンカーボルトは、その継手の上木端部付近となるように設置した。','大壁造の壁倍率3.7の構造用合板を用いた耐力壁については、CN50釘で外周部を150 mm間隔で打ち留めた。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:16,text:'防水工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['トーチ工法による改質アスファルトシート防水工事において、立上り部の防水層の末端部については、各層の改質アスファルトシートを所定の位置で各層の端部をそろえ、押え金物で固定した上に、シール材を充填した。','アスファルト防水工事において、保護層に設ける成形伸縮目地材については、キャップ幅が25 mm、本体幅が20 mm、保護コンクリートの上面から下面にまで達するよう高さの調節が可能なものので、キャップ側面に付着層を備えたものとした。','ウレタンゴム系塗膜防水工事において、防水層の下地については、入隅を丸面に仕上げ、出隅を通りよく直角に仕上げた。','シーリング工事において、プライマーの塗布及び充填時に被着体が、5℃以下になるおそれがあったので、仮囲い、シート覆いによる保温などの必要な措置を講じて施工した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:17,text:'左官工事、タイル工事及び張り石工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['鉄筋コンクリート造の建築物において、冬期に施工するアルミニウム合金製建具の枠まわりの充填モルタルには、初期凍害を防止するために、塩化カルシウム系の凍結防止剤を添加した。','コンクリート壁下地に施すモルタル塗りにおいて、下塗りについては、先に塗布した吸水調整材が乾燥した後に行った。','タイル後張り工法の密着張りにおいて、壁のタイルの張付けについては、上部から下部へと行い、一段置きに数段張り付けた後に、それらの間を埋めるようにタイルを張り付けた。','外壁乾式工法による張り石工事において、一次ファスナーの取付け位置に合わせて、下地となるコンクリート躯体面に、あと施工アンカーを取り付けた。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:18,text:'金属工事及びガラス工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['鉄筋コンクリート造の建築物において、アルミニウム製笠木の取付けに用いる固定金具については、防水層が施されたパラペット天端に、あと施工アンカーにより堅固に取り付けた。','軽量鉄骨天井下地において、天井裏に通るダクトにより天井用のつりボルトの適切な間隔を確保できない箇所については、ダクトフランジに天井用のつりボルトを取り付けた。','熱線反射ガラスの清掃は、ガラス表面の反射膜を傷つけないように、軟らかいゴムを用いて水洗いとした。','ガラス工事において、グレイジングチャンネル構法によるガラスの取付には、セッティングブロックを使用しなかった。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:19,text:'内外装工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['ALCパネル下地に施すモルタル塗りにおいて、ALCパネルの表面強度が低いことを考慮して、保水剤を添加した富調合の現場調合モルタルを使用した。','仕様ルートにより検証した特定天井の天井面構成部材等については、自重を天井材に負担させる照明設備等を含めて20 kg/m2以下であることを確認した。','メタルカーテンウォール工事において、ファスナーの面外方向の位置決めについては、各階に出された基準地墨により個々に部材を取り付けると、墨の誤差などのために上下階のくい違いが生じるおそれがあるので、ピアノ線を用いて水平及び垂直方向に連続した基準を設定し、ファスナーを取り付けた。','夏期に施工するコンクリート下地への塗装工事において、塗装を行う前の素地については、コンクリートの材齢が21日経過し、十分に乾燥していることを確認した。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:20,text:'設備工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['給排水衛生設備工事において、給水管の埋戻しに当たり、土被り150 mm程度の深さに埋設表示用アルミテープを埋設した。','給排水衛生設備工事において、壁付けの衛生器具については、樹脂製プラグを用いてコンクリート壁に取り付けた。','電気設備工事において、軽量鉄骨壁下地内の低圧の配線に用いる合成樹脂製可とう電線管については、CD管を使用した。','電気設備工事における二重床内配線については、ケーブルをころがし配線とし、配線経路を二重床の割付方向に平行になるようにした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:21,text:'断熱工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['鉄筋コンクリート造の建築物における断熱材打込み工法において、工事現場に搬入した発泡プラスチック断熱材を、やむを得ず屋外に保管することにしたので、断熱材に黒色のシートを掛けて、かつ、そのシートと断熱材との間に隙間が生じないようにした。','鉄筋コンクリート造の建築物における断熱材打込み工法において、型枠取り外し後にフェノールフォーム断熱材が欠落している部分については、仕上げに支障がない部分であったので、断熱材が欠落している部分のコンクリートの上から、同じ断熱材により隙間なく補修した。','戸建木造住宅における断熱工事において、天井の小屋裏側に設ける無機繊維系断熱材の施工状況については、天井下地の施工が完了するまでの間に、断熱材相互に隙間がないこと、防湿層が断熱層の室内側に設けられていること等を目視により確認した。','戸建木造住宅における充填断熱工法（フェルト状断熱材を用いたはめ込み工法）において、防湿層として別に施工するポリエチレンフィルムの継目については、柱等の木下地のある部分に設け、その重ね幅を30 mm以上とした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:22,text:'鉄筋コンクリート造の建築物の耐震改修工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['既存の柱と壁との接合部に耐震スリットを新設する工事において、既存の外壁に幅30 mmのスリットを設け、耐火性能を有したスリット材を挿入したうえで、屋外側及び屋内側の2か所をシーリング材により止水処理した。','あと施工アンカー工事において、接着系アンカーの埋込み時に接着剤がコンクリート表面まであふれ出てこなかったので、直ちにアンカー筋を引き抜き、カプセルを追加して接着剤があふれ出るようにアンカー筋を埋め込んだ。','あと施工アンカー工事において、騒音、振動対策が必要とされたことから、穿孔機械にハンマードリルを採用した。','現場打ち鉄筋コンクリート壁の増設工事において、既存梁下端と増設壁上端との取合い部分に注入するグラウト材については、空気抜きを既存梁下端に設け、その位置より10 cm程度高い位置に設けた空気抜きの管の先端からグラウト材がオーバーフローすることにより注入状況を確認した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:23,text:'各種改修工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['既存保護層を撤去せずに改修用ドレンを設けない防水改修工事において、既存ルーフドレンの周囲については、ルーフドレン端部から300 mm程度の範囲の既存保護コンクリートを四角形に撤去し、既存アスファルト防水層の上に防水層を新設した。','既存保護層を撤去し、既存アスファルト防水層を残して行う防水改修工事において、新設する防水層の下地となる既存アスファルト防水層の処理については、既存防水層の損傷箇所、継目等の剥離箇所、浮き部分等を、切開し、バーナーで熱した後、溶融アスファルトを充填し、張り合わせた。','既存のコンクリート打放し仕上げ外壁を厚付け仕上塗材仕上げとする外壁改修工事において、コンクリート面の下地調整については、目違いをサンダー掛けで取り除く程度で十分であったので、下地調整塗材の塗付けを省略した。','既存の下地モルタルを撤去せずにタイルの部分的な張替えを行う外壁改修工事において、1か所当たりの張替え面積が0.25 m2以下の箇所については、張替え下地面とタイル裏面の両面にポリマーセメントモルタルを塗り付け、タイルを張り付けた後、タイルの目地詰めまで24時間以上の養生を行った。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:24,text:'建築工事に関する用語とその説明の組合せとして、最も不適当なものは、次のうちどれか。',choices:['ミルシート ── 製鋼所で発行する、鋼材の化学成分、機械的性質などの試験結果が記されており、その材料がJIS等に適合していることを保証する規格品証明書','ブリーディング ── フレッシュコンクリート及びフレッシュモルタルにおいて、固体材料の沈降又は分離によって、練混ぜ水の一部が遊離して上昇する現象','チョーキング ── 塗膜が熱、紫外線、風雨などによって劣化し、塗膜の表面から粉化していく現象','ボイリング ── 掘削底面下方に被圧地下水を有する帯水層がある場合に、被圧地下水の圧力により掘削底面が持ち上がる現象'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'施工',no:25,text:'建築物の工事請負契約又は監理業務委託契約に関する次の記述のうち、民間（七会）連合協定「工事請負契約約款」（令和5年（2023年）1月改正）又は四会連合協定「建築設計・監理等業務委託契約約款」（令和2年（2020年）4月改正）に照らして、最も不適当なものはどれか。',choices:['工事請負契約において、発注者は、監理者の意見に基づいて、受注者の現場代理人、主任技術者、監理技術者、監理技術者補佐、専門技術者及び従業員並びに下請負者及びその作業員のうちに、工事の施工又は管理について著しく適当でないと認められる者があるときは、受注者に対して、その理由を明示した書面をもって、必要な措置をとることを求めることができる。','工事請負契約において、発注者は、引き渡された契約の目的物に契約不適合があるときは、監理者に対し、書面をもって、目的物の修補又は代替物の引渡しによる履行の追完を請求することができる。','監理業務委託契約において、委託者は、受託者に債務の不履行があった場合（委託者の責めに帰すべき事由によるときを除く。）には、原則として、受託者に書面をもって、委託者が相当の期間を定めてその履行の催告をし、その期間内に履行がないときは、この契約の全部又は一部を解除することができる。','監理業務委託契約において、委託者及び受託者は、受託者が監理業務を行うに当たり協議をもって決定した事項については、原則として、速やかに書面を作成し、記名・押印する。'],answer:2,hasFigure:false,figureDesc:''}
,
{year:2022,subject:'計画',no:1,text:'次の記述のうち、最も不適当なものはどれか。',choices:['建築士は、他人の求めに応じ報酬を得て、建築物の建築に関する法令に基づく手続きの代理を行う場合、建築士事務所に所属する必要がある。','建築士は、設計契約を結んだ委任者に対し、法律に定められていない内容であっても、建築士として一般的に要求されるだけの注意を尽くす義務がある。','建築基準法は、国民の生命、健康及び財産の保護を図り、公共の福祉の増進に資することを目的として、建築物の敷地、構造、設備及び用途に関する平均的な基準を定めている。','我が国において2050年までのカーボンニュートラルの実現のために、建築物においては、省エネルギー性能の確保や向上への取り組み、また、再生可能エネルギーの導入拡大等が求められている。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'計画',no:2,text:'都市計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['平安京では、長方形の平面に対し、南北を通る朱雀大路を中心に右京と左京に分かれ、条(東西道路)と坊(南北道路)による格子の街路網をもつ条坊制が敷かれた。','江戸では、16世紀末から17世紀にかけて江戸城を中核とする堀の開削や海岸線の埋め立てが行われ、山の手の尾根筋の土地に大名屋敷を配し、谷筋に町人地を設定するなど、起伏に富んだ地形に対応した開発が行われた。','ドイツのエンデ・ベックマン建築事務所による「帝都復興計画」では、築地・日比谷・霞が関一帯を含む広大な敷地に中央停車場を置き、三角形に構成された大街路や広場を含んだ計画が提案された。','丹下健三研究室による「東京計画1960」では、これまでの求心・放射型の都市構造の閉鎖性に対して、東京湾に造成した人工地盤に向かって都市の中枢機能の拡大を可能とする都市構造が提案された。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'計画',no:3,text:'建築物とその形態・構造的特徴との組合せとして、最も不適当なものは、次のうちどれか。',choices:['パンテオン（ローマ、不詳、2世紀）── 直径約43mのドームは、コンクリートやレンガを用い、上方へいくほどドームの厚さが薄くなっている。','サンタ・マリア・デル・フィオーレ［フィレンツェ大聖堂］（フィレンツェ、F.ブルネレスキ、15世紀）── 直径約31mの中央の大ドームは、その東西にある2つの半ドームと南北にある4つの巨大なバットレスで支えられている。','ジョン F.ケネディ国際空港 TWAターミナルビル（ニューヨーク、E.サーリネン、1962年）── 長さ約105mの屋根は、4本のY字柱脚に支えられた4枚の鉄筋コンクリート造によるシェルで構成されている。','ミレニアムドーム2000（ロンドン、R.ロジャース、1999年）── 直径約365m・最高高さ約50mの膜構造ドームは、12本のマストの頂部からケーブルで吊られている。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'計画',no:4,text:'特定の用途に供する建築物に関する次の記述のうち、最も不適当なものはどれか。',choices:['博物館の計画に当たり、一般収蔵庫のほかに、収蔵品の適正な保護のために低湿収蔵庫と高湿収蔵庫を設け、それぞれに前室としてならし室を設けた。','図書館の計画に当たり、来館者が静かに本を閲覧・検索するためのブラウジングコーナーやレファレンスコーナーを閉架式書庫内に設けた。','小学校の計画に当たり、細菌の繁殖や水はねによる汚染を防止するために、給食室の床を乾燥した状態に保つドライシステムを導入した。','危険物貯蔵庫の計画に当たり、貯蔵物が爆発した際の周囲に対する安全性に考慮し、天井は設けずに軽量な不燃材料で屋根を葺いた。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'計画',no:5,text:'木材等に関する次の記述のうち、最も不適当なものはどれか。',choices:['屋外に階段やバルコニーを木造で設置する場合、雨がかりが極力生じないような計画とすることや接合部に水分が常時滞留しないように配慮する。','木材は炭素を貯蔵する特性があり、また、製材は鋼材に比べて製造時に使用するエネルギーが少ない材料である。','木材の乾燥収縮率の大小関係は、年輪の半径方向 ＞ 年輪の接線方向 ＞ 繊維方向である。','木材の種類による気乾密度の大小関係は、一般に、チーク ＞ ヒノキ ＞ キリである。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'計画',no:6,text:'建築物の環境振動及び光環境に関する次の記述のうち、最も不適当なものはどれか。',choices:['高層建築物に限らず、軽量化された建築物やアスペクト比(幅に対する高さの比)の大きい塔状の建築物では、振動の問題が起こりやすい。','建築物内の躯体を伝わる固体伝搬音の対策として、スラブの短辺方向のスパンを小さくし、スラブを厚くすることが有効である。','照明計画において、視対象面の明るさにむらがあると視覚疲労につながるので、作業領域の均斉度が低くならないようにする。','タスク・アンビエント照明において、タスク照明の照度は、一般に、アンビエント照度より低く設定することで、全般照明よりも省エネルギー化が図れる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'計画',no:7,text:'防犯計画等に関する次の記述のうち、最も不適当なものはどれか。',choices:['割れ窓理論とは、建築物の窓が割られたまま放置されると、建築物を管理する人がいないと判断され、最終的にはその建築物の全ての窓が割られてしまうという比喩によって、犯罪発生のメカニズムを説明したものである。','ジェイン・ジェイコブズは、著書「アメリカ大都市の死と生」において、頻繁に使われている街路は安全となる傾向にあり、街路には常に住民、通行人、店員などの多数の目を置く必要があるとしている。','CPTED(防犯環境設計)とは、「周囲からの見通しを確保すること」、「コミュニティ形成を促進すること」、「犯罪企図者の接近を妨げること」、「部材や設備等を破壊されにくいものとすること」という手法による犯罪予防策である。','プルーイット・アイゴー(アメリカ)は、1950年代に建設された低所得者向けの集合住宅群であり、開放的な低層住宅とすることにより、犯罪発生率の大幅な低下を実現した事例である。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'計画',no:8,text:'建築物の各部の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['総合病院の改修計画において、一般病床の床面積が内法15m²の2床室を、小児専用の4床室とした。','市民ホールに設ける300席の小ホールの計画において、車椅子使用者用を含めて客席配置の自由度を高めるため、平土間形式とした。','小学校の計画において、低学年の普通教室(35人)の平面形状は、情報端末や教科書等の教材の使用に配慮した机等のサイズ拡大を考慮し、流し台を含めて9m×9mとした。','ホテルの計画において、車椅子使用者用客室の出入口には、有効幅員が80cmの引戸を採用し、取っ手側に幅45cmの接近できるスペースを設けた。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'計画',no:9,text:'高齢者、障害者等の利用に配慮した建築物の計画に関する次の記述のうち、「高齢者、障害者等の円滑な移動等に配慮した建築設計標準(国土交通省)」に照らして、最も不適当なものはどれか。',choices:['市庁舎の総合案内所において、ハイカウンターとローカウンターを併設し、視覚障害者誘導用ブロックをローカウンターに向かって敷設した。','病院のサインの計画において、サインプレートを部門ごとに色分けし、色の違いだけに頼った情報伝達となっていないか、サイン案をそれぞれ白黒コピーして判別性を確認した。','コンビニエンスストアにおいて、両側に商品棚のある通路の有効幅を120cmとし、レジ前には150cm×150cmの車椅子の転回スペースを設けた。','大規模量販店において、車椅子使用者用便房(大型ベッド付き)を男女が共用できる位置に設け、それとは別に、男女それぞれの便所内にオストメイト用設備を有する便房と乳幼児用設備を有する便房を分散配置した。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'計画',no:10,text:'都市公園に関する次の記述のうち、最も不適当なものはどれか。',choices:['防災公園は、地震災害時に復旧・復興拠点や生活物資等の中継基地等となる防災拠点、避難者を収容し保護する避難地等の機能を有するもので、地域防災計画等に位置づけられている。','広域公園は、都市住民全般の休息、観賞、散歩、遊戯、運動等総合的な利用に供することを目的とし、都市規模に応じ1か所当たり面積10～40haを標準としている。','地区公園は、主として徒歩圏内に居住する者の利用に供することを目的とし、誘致距離1kmの範囲内で1か所当たり面積4haを標準としている。','街区公園は、もっぱら街区に居住する者の利用に供することを目的とし、誘致距離250mの範囲内で1か所当たり面積0.25haを標準としている。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'計画',no:11,text:'まちづくりや都市の再生に関する次の記述のうち、最も不適当なものはどれか。',choices:['松山市道後温泉本館周辺地区(愛媛県)は、シンボル性・公共性が高い歴史的建築物の周辺を、道路の付け替えを行うことで歩行者のための空間とし、軌道で使われていた手加工の敷石を舗装に再利用することで歴史的建築物と調和した景観づくりが行われた。','最上郡金山町金山地区(山形県)は、町の基幹産業である木材を活用した住宅の表彰制度や、建築物の屋根や外壁に関する景観条例の制定、教育施設等の公共施設の建て替え、歴史的建築物の改修による景観づくりが行われた。','クリチバ(Curitiba、ブラジル)は、バスを優先する幹線道路と、その両側に平行する支線道路等、道路の構造を都市計画的に再編し、連結されたバス車両や、プラットホームのある停留所による交通システムが構築された。','ハイライン(New York、アメリカ)は、建築物の高密化と老朽化に伴いスラム化した市街地において、建築物を減築し、病院を図書館へ改築するなどの文化施設の整備により都市再生が行われた。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'計画',no:12,text:'住宅の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['新築の一戸建て住宅において、「住宅の品質確保の促進等に関する法律」に基づく「日本住宅性能表示基準」に規定される「高齢者等配慮対策等級」は、等級5～1で評価している。','新築の一戸建て住宅において、「住宅の品質確保の促進等に関する法律」に基づく「日本住宅性能表示基準」に規定される「高齢者等配慮対策等級」における「特定寝室」とは、高齢者の利用を想定する主たる寝室のことである。','住宅セーフティネット制度とは、民間の空き家・空き室を活用した、住宅確保要配慮者(高齢者、障害者、子育て世帯等)の入居を拒まない賃貸住宅の登録制度のことである。','住宅セーフティネット制度において、規模や構造等について一定の登録基準を満たしていても、シェアハウス(共同居住型賃貸住宅)では登録できない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'計画',no:13,text:'住宅の作品名(設計者、建設年)とその特徴に関する次の記述のうち、最も不適当なものはどれか。',choices:['増沢邸［自邸］(増沢洵、1952年)は、3間×3間の9坪の平面プランをもつ2階建ての計画であり、3坪の吹抜けに面して設けた南面大開口部の障子を通して、柔らかな光を室内に取り込んだ住宅である。','斎藤助教授の家(清家清、1952年)は、テラス、廊下、居間が連続する開放的な平面に、移動畳等を配置し、場面に応じて空間を設える「舗設」の概念を具現化した住宅である。','ヴィッラ・クゥクゥ(吉阪隆正、1957年)は、コンクリートの特性を生かした形態と彫りの深い開口をもち、外部に対して閉じることにより「閉鎖性」をつくり出したワンルーム形式の住宅である。','正面のない家-H(坂倉準三建築研究所、1962年)は、襖を開くことでワンルームとなる正方形平面に方形屋根を架け、傘の骨のように組まれた木材を内部に現した住宅である。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'計画',no:14,text:'用語とその説明との組合せとして、最も不適当なものは、次のうちどれか。',choices:['BEMS（Building and Energy Management System）── 二重のガラス間にブラインド等の遮光装置を設置し、空調空気を通すことで、ペリメーターゾーンの熱負荷を軽減するシステムのことである。','POE（Post Occupancy Evaluation）── 建築物が建設され、その施設の使用者が入居してある程度の時間が経過した後、その施設を評価する、入居後評価のことである。','OPAC（Online Public Access Catalog）── 電子情報化された蔵書目録であり、利用者が目的の書籍の収蔵場所等をパソコン上で検索できるシステムのことである。','BDS（Book Detection System）── 図書館の出入口等に設置し、書籍等の館外への不正な持ち出し等を防ぐための資料管理システムのことである。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'計画',no:15,text:'公立小学校・中学校の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['小学校の計画において、職員室とは別に設けた教師コーナーは児童の見守りやすさを重視し、教師コーナーを取り囲むように普通教室を配置した。','小学校の計画において、特別支援学級では、聴覚に過敏性をもつ児童に対応するため、遮音性の高い小規模な空間を設けた。','中学校の計画において、片廊下幅を広くして教室との仕切りをなくしたオープンプラン教室配置とすることから、隣接する教室相互の間に準備室を設け、音の伝搬を抑制した。','中学校の計画において、教室の稼働率を高めるために、普通教科はクラスルームで行い、実験や実習の授業は特別教室で行う教科教室型を採用した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'計画',no:16,text:'高齢者福祉施設、病院及び保育所の火災対策に関する次の記述のうち、最も不適当なものはどれか。',choices:['平家建ての特別養護老人ホームにおいて、共同生活室の天井を高くして蓄煙空間とするとともに、採光のためのトップライトを開くようにして、排煙口の役割を果たすように計画した。','介護老人保健施設において、煙の拡散を遅らせるために、防煙垂れ壁を増やし、防煙区画を小さくする計画とした。','病院の病棟階(1層2看護単位)において、防火扉を多く設けると避難の妨げとなるので、階段やエレベーターシャフト等の竪穴区画以外には防火区画を設けない計画とした。','3階に保育室のある保育所において、幼児数人ごとに保育士等が引率して避難することを想定し、屋内避難階段に隣接した位置に付室を設け、待避スペースとした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'計画',no:17,text:'図書館(所在地、建設年)に関する次の記述のうち、最も不適当なものはどれか。',choices:['国際子ども図書館(東京都、2002年)は、敷地の余剰容積を他の敷地に移転できる制度を活用して、大正時代に竣工した鉄骨レンガ造の歴史的建造物を再生・利活用している。','まちとしょテラソ［小布施町立図書館］(長野県、2009年)は、間仕切りを必要最小限に抑えることで大空間を実現させ、三角形平面プランの中央に開架書庫を配置し、3つの辺に沿って緩やかに分けられたスペースがつくられている。','フランス国立図書館(パリ、1995年)は、緑豊かな中庭をもつロの字型の基壇部と、その四隅に配置されたL字型の高層棟により構成されている。','デンマーク王立図書館(コペンハーゲン、1999年)は、既存の王立図書館(旧館)に対し、道路を挟んだ運河側に黒色のガラス張りの新館が増築され、メインエントランスは新館に設けられている。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'計画',no:18,text:'設計・監理業務等に関する次の記述のうち、建築士法第25条の規定に基づく「建築士事務所の開設者がその業務に関して請求することのできる報酬の基準(平成31年国土交通省告示第98号)」に照らして、最も不適当なものはどれか。',choices:['直接人件費は、設計等の業務に直接従事する者のそれぞれについての当該業務に関して必要となる給与、諸手当、賞与、退職給与、法定保険料等の人件費の1日当たりの額に当該業務に従事する延べ日数を乗じて得た額の合計とする。','工事監理に関する標準業務には、設計図書の定めにより、工事施工者が作成し提出した施工図と工事を照合し、それが施工図のとおりに実施されているかを確認するために行う業務が含まれる。','工事監理に関する標準業務には、工事施工者から工事に関する質疑書が提出された場合、設計図書に定められた品質(形状、寸法、仕上がり、機能、性能等を含む。)確保の観点から技術的に検討し、必要に応じて建築主を通じて設計者に確認の上、回答を工事施工者に通知する業務が含まれる。','工事監理に関する標準業務と一体となって行われるその他の標準業務には、工事請負契約の定めにより工事施工者が作成し、提出する工程表について、工事請負契約に定められた工期及び設計図書に定められた品質が確保できないおそれがあると判断したときは、その旨を建築主に報告する業務が含まれる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'計画',no:19,text:'建築積算に関する次の記述のうち、建築工事建築数量積算研究会「建築数量積算基準・同解説」に照らして、最も不適当なものはどれか。',choices:['鉄骨材料の所要数量において、アンカーボルトについては設計数量に対する割増しは行わない。','石材の主仕上げの所要数量において、1か所当たりの面積が0.1m²以下の開口部による石材の欠除については、原則として、ないものとして計測・計算する。','防水層等の所要数量において、シート防水のシートの重ね代は、計測数量に5％の割増しをすることを標準とする。','純工事費は、直接工事費と共通仮設費を合わせたものである。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'計画',no:20,text:'建築のマネジメントに関する次の記述のうち、最も不適当なものはどれか。',choices:['設計VEとは、ライフサイクルコストを考慮した経済性を追求しつつ、設計段階において施設の機能を検討・分析し、必要な機能を確実に達成することを目指す取り組みのことである。','不動産分野におけるアセットマネジメントとは、不動産を取得する際に、適正な投資価値を算出するために、物件の将来の収支の正確な予測を行うことを目的とする多角的な調査のことである。','コストオン方式とは、一般に、建築主が専門工事業者を選定し工事費を決定したうえで、その工事費に元請の管理経費を加えて建築の元請会社に工事を発注する方式のことである。','PFI事業におけるSPCとは、ある特定の事業を実施することを目的として設立される会社で、PFI事業以外の投資は行わず、PFIの契約期間が終了すれば解散する会社のことである。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'環境・設備',no:1,text:'環境工学に関する次の記述のうち、最も不適当なものはどれか。',choices:['日照図表は、周辺の建築物によって対象点への直射日光が遮られるかどうかを検討するものであり、緯度ごと、また、冬至の日などの季日ごとに描かれる。','外皮平均熱貫流率(UA値)は、断熱性能を示す指数で、建築物の内部から屋根や壁、床、開口部等を通過して外部へ逃げる「単位温度差当たりの外皮総熱損失量」を「外皮総面積」で除した値である。','ブーミング現象は、低い周波数領域になるほど、また、室の寸法が小さいほど、固有周波数密度が疎になるので起こりやすい。','空気寿命が一定の条件では、空気齢が小さいほど、室内のある点で発生した汚染質が排気口に至るまでの時間は短くなる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'環境・設備',no:2,text:'冬期における結露に関する次の記述のうち、最も不適当なものはどれか。',choices:['外壁の室内側の表面結露を防止するため、外壁断熱を強化することにより室内側の壁面温度を上昇させた。','外壁の室内側の表面結露を防止するため、暖房設備を開放型燃焼器具の代わりに密閉型燃焼器具とした。','外壁の内部結露を防止するため、断熱材の室内側に防湿層を設けた。','外壁に接する押入れ内に生じる表面結露を防止するため、押入れの襖の断熱性を高くした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'環境・設備',no:3,text:'室容積200m³の居室に25人の在室者がおり、換気回数4回で換気がなされているとき、定常状態におけるこの室内の二酸化炭素濃度として最も適当な値は、次のうちどれか。ただし、一人当たりの二酸化炭素発生量は0.016m³/(h・人)とし、在室者から発生した二酸化炭素は直ちに室全体に一様に拡散するものとする。また、外気の二酸化炭素濃度は400ppmとし、隙間風は考慮しないものとする。',choices:['700 ppm','800 ppm','900 ppm','1,000 ppm'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'環境・設備',no:4,text:'建築物の伝熱に関する次の記述のうち、最も不適当なものはどれか。',choices:['開口部(窓ガラス＋ブラインド等)の日射遮蔽係数は、その値が大きいほど日射遮蔽効果が大きくなる。','窓ガラスの日射熱取得率は、「ガラスに入射した日射量」に対する「ガラスを透過した日射量とガラスが吸収した後に室内側に放出された熱量との和」の比率で表される。','壁体の総合熱伝達率は、「対流熱伝達率」と「放射熱伝達率」の合計である。','外壁表面の対流熱伝達率は、外部風速が大きいほど大きくなる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'環境・設備',no:5,text:'建築物における防火・防災に関する次の記述のうち、最も不適当なものはどれか。',choices:['第二種排煙は、押出型の機械排煙方式であり、所定の排煙量を確保するために、排煙量よりも多い給気量が必要となる。','籠城区画は、病院の手術室やICU等の患者を避難させることが困難な室において、内部からの出火を防止するとともに、外からの火災の影響を受けない構造にして、鎮火までたてこもることができるようにした区画のことである。','超高層集合住宅の中央部に設けた屋根のないボイド空間(光庭)に面した開放廊下を避難経路とする場合には、開放廊下への煙の拡散を防ぐために、ボイド空間の下層部分からの給気を抑制する必要がある。','等価可燃物量は、対象となる可燃物の発熱量を、発熱量が等価な木材の重量で表現した値である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'環境・設備',no:6,text:'北緯35度の地点における日照・日射に関する次の記述のうち、最も不適当なものはどれか。',choices:['冬至の日における南向き鉛直面の終日日射量は、夏至の日における西向き鉛直面の終日日射量より小さい。','春分・秋分の日における南中時の直達日射量は、水平面のほうが南向き鉛直面より大きい。','夏至の日における可照時間は、南向き鉛直面より北向き鉛直面のほうが長い。','4時間日影となる領域の面積は、建築面積と高さが同じ直方体の建築物で、ある壁面が東西方向に平行に配置されている場合、一般に、平面形状が正方形より東西に長い形状のほうが大きい。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'環境・設備',no:7,text:'図のような水平に取り付けられた下面発光形の円形光源Aと、それと同じ面積で45°傾いた位置にある下面発光形の円形光源Bが、イ～ホの条件を満たす場合、次の記述のうち、最も不適当なものはどれか。\n\n条件\nイ．光源Aの中心とその鉛直下にある点Pとの距離は、rｍである。\nロ．光源Bの中心と点Pとの距離は、rｍである。\nハ．光源A及び光源Bは、等輝度均等拡散の発光面である。\nニ．光源A及び光源Bの面積はS m²、輝度はL cd/m²である。\nホ．光源A及び光源Bの外縁と点Pとの距離は、dｍである。',choices:['光源Aの点Pに対する立体角投射率(％)は、S/(πd²)×100である。','光源Bの点Pに対する立体角投射率(％)をCBとすると、光源Bによる点Pの水平面直接照度(lx)であるEBPは、πL×CB/100×cos 45°である。','光源Aによる点Pの水平面直接照度(lx)であるEAPと、光源Bによる点Pの水平面直接照度(lx)であるEBPの関係は、EAP ＞ EBPである。','rが光源Aの直径の10倍以上の場合、一般に、光源Aは点Pにおいて点光源とみなせる。'],answer:2,hasFigure:true,figureDesc:'水平に取り付けられた円形光源A（面積S m²）が上方にあり、その鉛直下の点Pとの距離がrm。光源Aから45°傾いた位置に同じ面積の円形光源B（面積S m²）があり、光源Bの中心と点Pとの距離もrm。光源A及び光源Bの外縁と点Pとの距離はdm。'},
{year:2022,subject:'環境・設備',no:8,text:'色彩に関する次の記述のうち、最も不適当なものはどれか。',choices:['平均演色評価数(Ra)は、評価対象となる光源による物体色の見え方と、同じ相関色温度の基準の光の下における物体色の見え方とのずれをもとにした数値である。','短波長成分を多く含む色温度の高い光を午前中に浴びることで、サーカディアンリズムを保つ効果が期待できる。','色票を用いて視感測色を行う際は、一般に、測色する部分の面積を色票の面積と同程度とする。','記憶色(記憶上の色彩)は、一般に、実際の色彩に比べて、彩度が低くなる傾向がある。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'環境・設備',no:9,text:'音響に関する次の記述のうち、最も不適当なものはどれか。',choices:['カラレーションは、「直接音」と「短い遅れ時間の反射音」の干渉によって、音の高さの変化が知覚される現象をいう。','聴覚のマスキング現象において、「マスクする音」と「マスクされる音」の高さが異なる場合には、マスクする音より高い周波数の音のほうが低い周波数の音に比べてマスクされやすい。','人の可聴周波数の範囲はおよそ20 Hzから20 kHzであり、対応する波長の範囲は十数mから十数mmである。','同種で同じ音圧レベルの音源の数が、ほぼ同じ位置において4つになると、音源が1つの場合に比べて、音圧レベルの値は約6 dB増加する。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'環境・設備',no:10,text:'遮音に関する次の記述のうち、最も不適当なものはどれか。',choices:['厚さ6mmの単板ガラスは、厚さ3mmの単板ガラスに比べて全周波数帯域にわたって遮音性能が高いとは限らない。','複層ガラス(厚さ3mmの単板ガラス2枚と乾燥空気を封入した6mmの中空層からなる。)は、その面密度の合計と同じ面密度をもつ単板ガラス(厚さ6mm)に比べて、一般に、500 Hz付近の中音域の遮音性能は低下する。','建築物の床衝撃音遮断性能に関する等級において、Lr-40はLr-55に比べて、床衝撃音の遮断性能が低い。','建築物及び建築部材の空気音遮断性能に関する等級において、Dr-50はDr-35に比べて、空気音の遮断性能が高い。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'環境・設備',no:11,text:'建築物とその空調負荷の一般的な特徴との組合せとして、最も不適当なものは、次のうちどれか。',choices:['劇場 ── ピーク負荷が小さく、予冷・予熱の時間が短い傾向にある。','百貨店 ── 休日と平日、一日の午前と夕方の時間帯等によって負荷が大きく異なる傾向にある。','ビジネスホテル ── ピーク負荷が夕方から夜間にかけて発生する傾向にある。','データセンター ── 外皮負荷や外気負荷より室内で発生する顕熱負荷のほうが大きい傾向にある。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'環境・設備',no:12,text:'空気調和設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['水蓄熱式空調システムは、熱源機器の容量を小さくできるとともに、電力需要の平準化を図ることができる。','送風機のエネルギー消費量は、同じ風量であれば、接続する長方形ダクトのアスペクト比(ダクト断面の短辺に対する長辺の比)を小さくするほど大きくなる。','変風量単一ダクト方式は、VAVユニットを部屋ごと又はゾーンごとに設けることによって、個別の温度制御を行うことができる。','空調機に再熱コイルを設置する場合は、冷房時の部分負荷時において、設定室温での室内の湿度上昇を防ぐことはできるが、エネルギー消費量は多くなる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'環境・設備',no:13,text:'換気設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['RI(ラジオアイソトープ)施設では、一般に、室内への給気を全て排気するオールフレッシュ空調方式が用いられる。','化学処理や実験等に用いられる作業台と排気フードが組み合わされたドラフトチャンバーの排気風量は、作業用開口部の面積と制御風速によって決定される。','換気用エアフィルターの粉じん捕集率は、同一のエアフィルターに対して、質量法や計数法等の測定方法によって異なる値となる。','JISにおけるクリーンルームの空気清浄度は、清浄度クラスの値が大きいほど高くなる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'環境・設備',no:14,text:'給水設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['作動している給水ポンプ内のキャビテーションは、水温が一定の場合、ポンプ吸込口の管内圧力が低いときに発生しやすい。','大便器洗浄弁には、逆サイホン作用による汚物の給水管への逆流を防止するために、バキュームブレーカーを設ける。','飲料水用配管から空調設備配管へ給水する場合には、クロスコネクションを防止するために、一般に、逆止め弁を設ける。','高置水槽方式において、揚水管の横引きは、ウォーターハンマーの発生原因となる水柱分離を防止するために、できるだけ低い位置で計画する。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'環境・設備',no:15,text:'給湯設備等に関する次の記述のうち、最も不適当なものはどれか。',choices:['潜熱回収型ガス給湯機は、一般に、潜熱回収時に発生する酸性の凝縮水を機器内の中和器で処理し排出する仕組みとなっている。','水熱源方式のヒートポンプ給湯システムは、下水道処理水、工場や大浴場の温排水等の未利用エネルギーを、熱源として利用することができる。','家庭用燃料電池は、都市ガス等から燃料改質装置で作った水素と空気中の酸素とを反応させて発電するとともに、反応時の排熱で作った温水を給湯に利用する仕組みとなっている。','ハイブリッド給湯システムは、給湯負荷変動が少ないベース負荷を燃焼式加熱機が受け持ち、ベース負荷を超える場合にヒートポンプ給湯機でバックアップする仕組みとなっている。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'環境・設備',no:16,text:'JISにおける構内電気設備の名称とその配線用図記号との組合せとして、最も不適当なものは、次のうちどれか。',choices:['壁付コンセント(接地端子付) ── ⊖ ET','煙感知器 ── 半円形の図記号','分電盤 ── 黒塗りの三角形の図記号','配電盤 ── ×印の入った正方形の図記号'],answer:2,hasFigure:true,figureDesc:'各選択肢に電気設備の配線用図記号が表形式で示されている。1.壁付コンセント(接地端子付)は丸に横線とET、2.煙感知器は半円形、3.分電盤は黒塗り三角形、4.配電盤は×印の入った正方形。'},
{year:2022,subject:'環境・設備',no:17,text:'電気設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['インバータ機器から発生する高調波電流を抑制するために、アクティブフィルタを設置した。','幹線設備における地絡電流による感電、火災、設備の破損等を防止するために、過電流遮断器を設置した。','伝送系の信号線が電源関係ケーブルからの静電誘導によるノイズの影響を受けないようにするために、その信号線には、シールドケーブルを使用した。','外部雷保護システム(受雷部、引下げ導線及び接地極システム)及び建築物等の導電性部材に流れる雷電流による危険な火花放電の発生を防止するために、内部雷保護システムを構築した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'環境・設備',no:18,text:'防災設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['排煙設備の設置が必要な百貨店において、排煙設備の排煙口を、防煙区画のそれぞれについて、当該防煙区画の各部分から排煙口のいずれかに至る水平距離が30m以下となるように設置した。','スプリンクラー設備の設置が必要なホテルにおいて、床面から天井面までの高さが12mのロビーに、放水型ヘッドを使用したスプリンクラー設備を設置した。','プロパンガスを使用する厨房において、ガス漏れ警報器の検知部を、燃焼機器から検知部までの水平距離が8m以内、かつ、天井面から検知部下端までの高さが0.3m以内となるように設置した。','劇場において、客席誘導灯を、客席内の通路の床面における水平面照度が0.2 lx以上となるように設置した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'環境・設備',no:19,text:'建築設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['パッケージ型空調機のAPF(Annual Performance Factor)は、「通年消費電力量」を「冷房期間総合負荷及び暖房期間総合負荷の和」で除した値により表される。','中央管理室は、超高層建築物において、中央管理方式の空気調和設備の制御及び作動状態の監視等を行うための室として、避難階又はその直上階若しくは直下階に設ける。','乗用エレベーターは、火災発生時にエレベーター内の乗客を速やかに避難階に帰着させた後、運転を休止させる計画とする。','照明の省エネルギー手法のうち、初期照度補正制御は、経年による照度低下を見込むことで生じる、照明器具やランプの設置直後等における過剰照度を、適正な照度に補正するものである。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'環境・設備',no:20,text:'我が国におけるZEBに関する次の記述のうち、最も不適当なものはどれか。',choices:['ZEBの定義には、『ZEB』、Nearly ZEB、ZEB Ready及びZEB Orientedがある。','ZEBを実現するための省エネルギー技術のうち、搬送機器のインバータ制御やLED照明はパッシブ技術に含まれる。','ZEBは、既存の建築物であっても、建築物の改修時に、外皮の断熱強化、設備の高効率化等を行うことによって実現可能である。','ZEBを実現するためには、エネルギー消費量の削減が必須であり、再生可能エネルギーの導入のみでは不十分である。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:1,text:'図のような建築物における延べ面積、建築物の高さ又は階数の算定に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、図及び【建築物の条件】に記載されていないことについては考慮しないものとする。\n\n【建築物の条件】\n・建築面積：600 m²\n・昇降機塔の屋上部分の水平投影面積：30 m²\n・最下階の防災センター（中央管理室）の水平投影面積：75 m²\n・エレベーターの昇降路の各階の床面積の合計：40 m²',choices:['容積率の算定の基礎となる延べ面積は、2,435 m²である。','避雷設備の設置の必要性を検討するに当たっての建築物の高さは、15 mである。','地階を除く階数は、3である。','階数は、5である。'],answer:1,hasFigure:true,figureDesc:'昇降機塔[30m²]が屋上にあり、パラペットの下に事務所[600m²]が各階に配置された断面図。各階高さ3m、パラペット上1.5m、昇降機塔3m。地面より下に事務所[600m²]1階と防災センター（中央管理室）[75m²]がある。右側に道路中心線が示され、地面から8mの距離。[ ]内は各階の床面積を示す。'},
{year:2022,subject:'法規',no:2,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['一戸建て住宅に附属する塀で幅員4 mの道路に接して設けられるものは、「延焼のおそれのある部分」に該当する。','病院の入院患者のための談話室は、「居室」に該当する。','天井面から50 cm下方に突出した垂れ壁で、不燃材料で造られたものは、「防煙壁」に該当する。','既存建築物に設けられている木造の屋外階段を全て鉄骨造に取り替えることは、「大規模の模様替」に該当する。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:3,text:'防火地域内における次の行為のうち、建築基準法上、確認済証の交付を受ける必要がないものはどれか。ただし、建築物の建築等に関する確認済証の交付を受ける必要がない区域の指定はないものとする。',choices:['鉄骨造、延べ面積100 m²、平家建ての事務所における床面積10 m²の増築','ゴルフ練習場に設ける工作物で、ネットを支える高さ20 mの鉄柱の築造','共同住宅の新築工事を施工するために現場に設ける延べ面積50 m²、平家建ての工事管理事務所の新築','鉄筋コンクリート造、延べ面積800 m²、地上3階建てのホテルから共同住宅への用途の変更（大規模の修繕又は大規模の模様替を伴わないもの）'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:4,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['定期報告を要する建築物の所有者と管理者が異なる場合においては、管理者が特定行政庁にその定期報告をしなければならない。','建築主は、鉄骨造、延べ面積300 m²、地上2階建ての飲食店を物品販売業を営む店舗とする用途の変更（大規模の修繕又は大規模の模様替を伴わないもの）に係る確認済証の交付を受けた場合において、当該工事を完了したときは、建築主事の検査を申請しなければならない。','建築主は、確認済証の交付を受けた建築物について、当該建築物の建築設備の材料、位置又は能力の変更（性能が低下する材料の変更及び能力が減少する変更を除く。）として、当該建築物を建築しようとする場合において、変更後も建築物の計画が建築基準関係規定に適合することが明らかなものは、あらためて、確認済証の交付を受ける必要はない。','建築主は、鉄骨造、延べ面積500 m²、地上3階建ての事務所を新築する場合において、完了検査の申請が建築主事により受理された日から7日を経過したときは、検査済証の交付を受ける前においても、仮に、当該建築物又は建築物の部分を使用することができる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:5,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['建築物の構造耐力上主要な部分に木材、コンクリート等の指定建築材料を用いる場合には、その品質が、指定建築材料ごとに国土交通大臣の指定する日本産業規格若しくは日本農林規格に適合するもの、又は指定建築材料ごとに国土交通大臣が定める安全上、防火上若しくは衛生上必要な品質に関する技術的基準に適合するものであることについて国土交通大臣の認定を受けたものとしなければならない。','直上階の居室の床面積の合計が300 m²である児童福祉施設の地上階に設ける階段に代わる傾斜路で、両側に側壁を設けるものにおいて、側壁の一方に幅15 cmの手すりを設けた場合、側壁間の距離は125 cm以上としなければならない。','居室の内装の仕上げに第三種ホルムアルデヒド発散建築材料を使用するときは、原則として、当該材料を使用する内装の仕上げの部分の面積に所定の数値を乗じて得た面積については、当該居室の床面積を超えないようにしなければならない。','老人福祉施設における防火上主要な間仕切壁で、小屋裏又は天井裏に達する準耐火構造としたものは、125 Hz、500 Hz、2,000 Hzの振動数の音に対して、それぞれ透過損失25 dB、40 dB、50 dB以上の遮音性能としなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:6,text:'次の記述のうち、建築基準法上、誤っているものはどれか。ただし、自動式のスプリンクラー設備等は設けられていないものとする。',choices:['非耐力壁である防火構造の外壁に必要とされる防火性能は、建築物の周囲において発生する通常の火災による火熱が加えられた場合に、加熱開始後30分間屋内面の温度が可燃物燃焼温度以上に上昇しないものでなければならない。','共同住宅（天井は強化天井でないもの）の各戸の界壁は、準耐火構造とし、小屋裏又は天井裏に達せしめなければならない。','地上15階建ての事務所の12階部分で、執務室の壁及び天井の室内に面する部分の仕上げを難燃材料でし、かつ、その下地を難燃材料で造ったものは、床面積の合計200 m²以内ごとに防火区画しなければならない。','1階及び2階を集会場（当該用途に供する部分の各階の客席部分の床面積の合計が1,000 m²）とし、3階以上の階を事務所とする地上10階建ての建築物においては、原則として、当該集会場部分と事務所部分とを防火区画しなければならない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:7,text:'次の建築物のうち、建築基準法に適合しないものはどれか。ただし、いずれの建築物も各階を当該用途に供するものとし、避難階は1階とする。',choices:['主要構造部を耐火構造とした地上5階建てのホテルで、各階に宿泊室（1室当たりの床面積25 m²）が8室あるもの（2階以上の階には宿泊室以外の居室はないものとする。）に直通階段を1か所設けた。','主要構造部を耐火構造とした延べ面積1,200 m²、地上2階建ての物品販売業を営む店舗で、2階における売場の床面積の合計が450 m²のものに直通階段を1か所設けた。','主要構造部を耐火構造とした地上5階建ての共同住宅（住戸の居室以外の居室はないものとする。）で、各階に住戸（各住戸の居室の床面積の合計50 m²）が4戸あるものに直通階段を1か所設けた。','主要構造部を耐火構造とした地上6階建ての事務所で、各階の居室の床面積の合計が200 m²で、かつ、各階に避難上有効なバルコニーを設けたものに、避難階段の構造に適合する屋外の直通階段を1か所設けた。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:8,text:'仮設建築物等に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['非常災害があった場合において、準防火地域である非常災害区域等に地方公共団体が災害救助のために建築する、延べ面積1,000 m²、地上3階建ての応急仮設建築物の病院で、災害が発生した日から1月以内にその工事に着手するものについては、建築基準法令の規定は適用されない。','災害があった場合において、準防火地域内に国が建築する、延べ面積500 m²、地上2階建ての応急仮設建築物である官公署については、市街地における火災を想定した火の粉による建築物の火災の発生を防止するために屋根に必要とされる性能に関する規定は適用されない。','防火地域内に建築する仮設店舗で、安全上、防火上及び衛生上支障がないものとして特定行政庁の許可を受けたものについては、外壁の開口部で延焼のおそれのある部分への防火戸等の防火設備の設置に関する規定は適用されない。','建築物の用途を変更して一時的に興行場として使用する場合において、安全上、防火上及び衛生上支障がないものとして特定行政庁の許可を受けたものについては、内装の制限に関する規定は適用されない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:9,text:'避難施設等に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['延べ面積2,000 m²、地上2階建てのボーリング場の2階の居室から地上に通ずる屋内の廊下及び階段の部分には、非常用の照明装置を設けなければならない。','延べ面積2,000 m²の病院において、床面積100 m²以内ごとに防火区画した部分については、排煙設備を設けなくてもよい。','地下街の各構えが接する地下道の幅員は、5 m以上でなければならない。','建築物の高さ31 m以下の部分にある3階以上の各階において、道に面する外壁面に直径1 m以上の円が内接できる窓で、格子その他の屋外からの進入を妨げる構造を有しないものを、当該壁面の長さ10 m以内ごとに設けている場合には、非常用の進入口を設けなくてもよい。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:10,text:'建築設備に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['高さ31 mを超える部分の階数が4以下の主要構造部を耐火構造とした建築物で、当該部分が床面積の合計100 m²以内ごとに耐火構造の床若しくは壁又は所定の特定防火設備で区画されているものには、非常用エレベーターを設置しなくてもよい。','各構えの床面積の合計が1,500 m²の地下街における排煙設備の制御及び作動状態の監視は、中央管理室において行うことができるものとしなければならない。','床面積の合計が50 m²の住戸において、発熱量の合計（密閉式燃焼器具等又は煙突を設けた設備若しくは器具に係るものを除く。）が8 kWの火を使用する器具を設けた床面積7 m²の調理室には、0.7 m²の有効開口面積を有する窓その他の開口部を換気上有効に設けた場合、所定の技術的基準に従った換気設備は設けなくてもよい。','鉄骨造、延べ面積1,500 m²、地上3階建ての物品販売業を営む店舗の売場においては、全館避難安全検証法により、全館避難安全性能を有することが確かめられた場合であっても、非常用の照明装置を設けなければならない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:11,text:'建築物の構造計算に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['鉄筋コンクリート造、高さ31 m、地上10階建ての建築物について、保有水平耐力計算によって安全性を確かめた場合には、許容応力度等計算又はこれと同等以上に安全性を確めることができるものとして国土交通大臣が定める基準に従った構造計算を行わなくてもよい。','鉄骨鉄筋コンクリート造、高さ45 mの建築物の地上部分について、保有水平耐力計算によって安全性を確かめた場合には、各階の偏心率が、それぞれ15/100を超えないことを確かめる必要はない。','建築物の地上部分に作用する地震力について、許容応力度等計算を行う場合における標準せん断力係数は0.2以上又は0.3以上とし、必要保有水平耐力を計算する場合における標準せん断力係数は1.0以上としなければならない。','限界耐力計算を行う場合、構造耐力上主要な部分の断面に生ずる長期（常時及び積雪時）及び短期（積雪時、暴風時及び地震時）の各応力度が、それぞれ長期に生ずる力又は短期に生ずる力に対する各許容応力度を超えないことを確かめなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:12,text:'構造強度に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['設計基準強度が21 N/mm²のコンクリートの場合、短期に生ずる力に対する引張りの許容応力度は、長期に生ずる力に対する圧縮の許容応力度の1/3の値である。','建築物の実況によらないで、柱の垂直荷重による圧縮力を計算する場合、百貨店の屋上広場で、柱のささえる床の数が4のときは、床の積載荷重として採用する数値を2,040 N/m²とすることができる。','高さ3 mの鉄筋コンクリート造の塀に使用するコンクリート（軽量骨材は使用しないものとする。）の四週圧縮強度は、12 N/mm²以上とする必要はない。','異形鉄筋をせん断補強以外に用いる場合の引張りに対する材料強度は、異形鉄筋の圧縮に対する材料強度と同じ値である。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:13,text:'保有水平耐力計算によって安全性が確かめられた建築物に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、高さが4 mを超える建築物とする。',choices:['鉄骨造の建築物において、建築物の基礎は、国土交通大臣が定める基準に従った構造計算によって構造耐力上安全であることを確かめた場合には、異なる構造方法による基礎を併用してもよい。','鉄筋コンクリート造の建築物において、土砂災害特別警戒区域内における居室を有する建築物の外壁等の構造は、原則として、自然現象の種類、最大の力の大きさ等及び土石等の高さ等に応じて、当該自然現象により想される衝撃が作用した場合においても破壊を生じさせないものとして、国土交通大臣が定めた構造方法を用いるものとしなければならない。','鉄筋コンクリート造の建築物において、構造耐力上主要な部分である柱の主筋は帯筋と緊結する必要はない。','鉄骨造の建築物において、特定天井の構造は、構造耐力上安全なものとして、国土交通大臣が定めた構造方法を用いるもの又は国土交通大臣の認定を受けたものとする必要はない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:14,text:'都市計画区域及び準都市計画区域内の道路等に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['その敷地が、河川管理者が管理する幅員6 mの公共の用に供する道で建築基準法上の道路に該当しないもののみに2 m以上接する、延べ面積100 m²の一戸建て住宅は、特定行政庁の認定を受けることにより建築することができる。','特定行政庁の許可を受けて道路の上空に渡り廊下を設ける場合においては、その側面には、床面からの高さが1.5 m以上の壁を設け、その壁の床面からの高さが1.5 m以下の部分に開口部を設けるときは、これにはめごろし戸を設けなければならない。','道路内にある建築物については、高架の道路の路面下に設けるものを除き、道路高さ制限は適用されない。','特定行政庁から位置の指定を受けた幅員6 mの私道を廃止する場合は、特定行政庁の許可が必要である。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:15,text:'建築物の用途の制限に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、用途地域以外の地域、地区等の指定はなく、また、特定行政庁の許可等は考慮しないものとする。',choices:['第一種低層住居専用地域において、「延べ面積500 m²、平家建ての児童厚生施設」は、新築することができる。','第二種住居地域内において、「延べ面積6,000 m²、地上3階建てのカラオケボックス（各階を当該用途に供するもの）」は、新築することができる。','近隣商業地域内において、「延べ面積500 m²（作業場の床面積の合計が400 m²）、平家建ての、原動機を使用する自動車修理工場」は、新築することができる。','商業地域内において、「延べ面積2,000 m²、平家建ての圧縮天然ガスの製造工場（内燃機関の燃料として自動車に充填するための圧縮天然ガスに係るもの）」は、新築することができる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:16,text:'防火地域及び準防火地域内の建築物の新築に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['防火地域内においては、延べ面積120 m²、平家建ての診療所の用途に供する建築物は、耐火建築物又はこれと同等以上の延焼防止時間となる建築物としなければならない。','防火地域内にある建築物に附属する門又は塀で、高さ2 mを超えるものは、延焼防止上支障のない構造としなければならない。','準防火地域内においては、延べ面積180 m²、地上3階建ての一戸建て住宅の用途に供する建築物は、耐火建築物若しくは準耐火建築物又はこれらと同等以上の延焼防止時間となる建築物としなければならない。','準防火地域内においては、延べ面積1,200 m²、地上2階建ての倉庫の用途に供する建築物は、耐火建築物又はこれと同等以上の延焼防止時間となる建築物としなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:17,text:'図のような敷地において、建築基準法上、新築することができる建築物の容積率（同法第52条に規定する容積率）の最高限度は、次のうちどれか。ただし、図に記載されているものを除き、地域、地区等及び特定行政庁の指定、許可等は考慮しないものとする。',choices:['30/10','40/10','45/10','53/10'],answer:3,hasFigure:true,figureDesc:'敷地が準住居地域（都市計画で定められた容積率40/10）と商業地域（都市計画で定められた容積率80/10）にまたがる配置図。敷地の西側に幅員8mの道路、南側に幅員10mの道路、東側に幅員10mの道路がある。北側と一部は隣地に接する。敷地の南北方向が25m、東西方向の道路部分が6m。各道路と敷地の寸法が8m、10m、10m、35m、15mと示されている。真北が右上方向。'},
{year:2022,subject:'法規',no:18,text:'図のような敷地において、建築物を新築する場合、建築基準法上、A点における地盤面からの建築物の高さの最高限度は、次のうちどれか。ただし、敷地は平坦で、隣地との高低差はなく、門、塀等はないものとする。また、図に記載されているものを除き、地域、地区等及び特定行政庁による指定、許可等並びに日影による中高層の建築物の高さの制限及び天空率に関する規定は考慮しないものとする。なお、建築物は全ての部分において、高さの最高限度まで建築されるものとする。',choices:['21.25 m','23.25 m','24.25 m','26.25 m'],answer:3,hasFigure:true,figureDesc:'第一種中高層住居専用地域（都市計画で定められた容積率30/10）の敷地配置図と断面図。敷地の北側3m、東側13m、南側4m、西側10mの寸法。敷地内に建築物があり、A点は建築物の南東角から1m内側・3m内側の位置。東側に幅員4mの道路と宅地。南側に隣地。断面図では地盤面と道路の高さが3m異なることが示されている。真北が左上方向。'},
{year:2022,subject:'法規',no:19,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['都市計画区域内においては、ごみ焼却場は、都市計画においてその敷地の位置が決定していない場合であっても、特定行政庁が都市計画審議会の議を経てその敷地の位置が都市計画上支障がないと認めて許可した場合は、新築することができる。','地区計画の区域のうち再開発等促進区内において、当該地区計画において定められた土地利用に関する基本方針に適合した建築物については、用途地域内の建築物の制限に適合しない場合であっても、特定行政庁の許可を受けることなく新築することができる。','建築基準法の規定による許可には、建築物又は建築物の敷地を交通上、安全上、防火上又は衛生上支障がないものとするための条件等を付すことができる。','建築基準法令の規定による指定確認検査機関の処分に不服がある者は、当該処分に係る建築物について建築確認をする権限を有する建築主事が置かれた市町村又は都道府県の建築審査会に対して審査請求をすることができる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:20,text:'病院に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['地上3階建て、床面積の合計が1,500 m²の病院（国等の建築物を除く。）の所有者等は、当該建築物の敷地、構造及び建築設備について、定期に、一級建築士若しくは二級建築士又は建築物調査員にその状況の調査をさせて、その結果を特定行政庁に報告しなければならない。','商業地域内の病院の病室（天窓及び縁側を有しないもの）の開口部の採光補正係数は、開口部が道に面していない場合であって、水平距離が4 m以上であり、かつ、採光関係比率に10を乗じた数値から1.0を減じて得た算定値が1.0未満となる場合においては、1.0とする。','既存の地上5階建ての病院（5階における当該用途に供する部分の床面積の合計が1,600 m²のもの）に設けた非常用の照明装置に用いる照明カバーの取替えの工事の施工中に、当該建築物を使用する場合においては、当該建築主は、あらかじめ、工事の施工中における建築物の安全上、防火上又は避難上の措置に関する計画を作成して特定行政庁に届け出なければならない。','敷地が準工業地域内に400 m²、工業地域内に600 m²と二つの用途地域にわたる場合、当該敷地には、特定行政庁の許可を受けなければ病院を新築することができない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:21,text:'工事監理を行う建築士に関する次の記述のうち、建築士法上、誤っているものはどれか。',choices:['建築士が工事監理を行う場合は、その者の責任において、工事を設計図書と照合し、それが設計図書のとおりに実施されているかいないかを確認するとともに、当該工事の指導監督を行わなければならない。','建築士が工事監理を行う場合は、当該建築士が自ら設計図書を作成した建築物であるか、他の建築士が設計図書を作成した建築物であるかに関わらず、工事監理を終了したときは、直ちに、建築主に結果報告を行わなければならない。','一級建築士でなければ設計をしてはならない建築物の工事監理については、一級建築士の指導を受けている場合であっても、二級建築士は行うことができない。','構造設計一級建築士の関与が義務付けられた建築物の工事監理については、構造設計一級建築士以外の一級建築士であっても行うことができる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:22,text:'建築士事務所の管理建築士に関する次の記述のうち、建築士法上、誤っているものはどれか。',choices:['管理建築士は、建築士事務所において、業務の内容に応じて必要となる期間の設定や、受託しようとする業務を担当させる建築士の選定などの技術的事項を総括する。','建築士事務所の開設者が、管理建築士の退職後に代わりの管理建築士を置かなかった場合、その建築士事務所の登録は取り消され、その開設者は1年以下の懲役又は100万円以下の罰金に処される。','管理建築士が建築基準法の違反によって免許取消しや業務停止等の処分を受けた場合、その処分が自宅の設計など建築士事務所の業務によらないものであっても、当該建築士事務所は閉鎖処分の対象となる。','一級建築士事務所に置かれる管理建築士となるための業務要件としては、一級建築士として3年以上の建築物の設計や工事監理等に従事することが求められる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:23,text:'A欄に掲げる「建築士等に義務付けられる行為等」とB欄に掲げる「義務付けの対象等」の組合せのうち、B欄において、建築士法による義務付けの対象等とされていないものを含むものは、次のうちどれか。',choices:['建築士免許証（免許証明書を含む。）の提示：・設計等の委託者から請求があったとき／・建築主に対して、契約内容などの重要事項の説明をするとき','定期講習の受講：・全ての一級建築士／・全ての二級建築士／・全ての木造建築士／・全ての構造設計一級建築士／・全ての設備設計一級建築士','設計図書その他の書面への記名：・一級建築士、二級建築士又は木造建築士が、設計を行ったとき／・構造設計一級建築士が、構造関係規定の法適合確認を行ったとき／・設備設計一級建築士が、設備関係規定の法適合確認を行ったとき','建築士事務所に閲覧のために備え置く書類：・建築士事務所の業務の実績を記載した書類／・建築士事務所に属する建築士の氏名及び業務の実績を記載した書類／・損害賠償に必要な金額を担保するための措置の内容を記載した書類／・建築士事務所の業務及び財務に関する書類'],answer:2,hasFigure:true,figureDesc:'A欄（建築士等に義務付けられる行為等）とB欄（義務付けの対象等）の対応表。選択肢1〜4の各組合せが表形式で示されている。'},
{year:2022,subject:'法規',no:24,text:'次の記述のうち、都市計画法上、誤っているものはどれか。',choices:['都市計画施設の区域内において、木造、地上3階建ての建築物を改築する場合は、都道府県知事等の許可を受ける必要はない。','建築物の建築の用に供する目的で行う土地の区画形質の変更は、その土地の規模にかかわらず「開発行為」である。','開発許可を受けた開発区域内の土地においては、当該開発行為に関する工事が完了した場合であっても、都道府県知事による当該工事が完了した旨の公告があるまでの間は、原則として、建築物を建築してはならない。','市街化区域内において、専修学校の建築の用に供する目的で行う開発行為で、その規模が1,000 m²のものについては、開発許可を受けなければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:25,text:'次の記述のうち、消防法上、誤っているものはどれか。',choices:['図書館は、消防用設備等の技術上の基準に関する政令等の規定の施行又は適用の際、現に存する建築物であっても、新築の場合と同様に消防用設備等の規定が適用される「特定防火対象物」である。','天井の高さ12 m、延べ面積700 m²のラック式倉庫については、原則として、スプリンクラー設備を設置しなければならない。','地階に設ける駐車場で、床面積が1,000 m²のものについては、原則として、排煙設備を設置しなければならない。','延べ面積6,000 m²、地上5階建てのホテルについては、原則として、連結送水管を設置しなければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:26,text:'次の記述のうち、「高齢者、障害者等の移動等の円滑化の促進に関する法律」上、誤っているものはどれか。',choices:['建築主等は、仮設建築物（建築基準法第85条第5項の許可を受けたもの）として、床面積の合計が2,000 m²の物品販売業を営む店舗を新築する場合、当該建築物を建築物移動等円滑化基準に適合させなければならない。','建築主等は、床面積の合計が500 m²の事務所を新築する場合、当該建築物を建築物移動等円滑化基準に適合させなければならない。','床面積の合計が5,000 m²の公立小学校を新築する場合、当該小学校に設ける階段のうち、多数の者が利用するものは、踏面の端部とその周囲の部分との色の明度、色相又は彩度の差が大きいことにより段を容易に識別できるものとしなければならない。','移動等円滑化経路を構成する敷地内の通路は、幅を120 cm以上とし、50 m以内ごとに車椅子の転回に支障がない場所を設けなければならない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:27,text:'次の記述のうち、「建築物のエネルギー消費性能の向上に関する法律」上、誤っているものはどれか。',choices:['建築主は、非住宅部分の床面積の合計が300 m²の建築物を新築しようとするときは、その工事に着手する日の21日前までに、当該行為に係る建築物のエネルギー消費性能の確保のための構造及び設備に関する計画を所管行政庁に届け出なければならない。','特定建築主は、新築する分譲型一戸建て規格住宅を当該住宅のエネルギー消費性能の一層の向上のために必要な住宅の構造及び設備に関する基準に適合させるよう努めなければならない。','建築士は、床面積の合計が100 m²の住宅の新築に係る設計を行うときは、原則として、当該住宅の建築物エネルギー消費性能基準への適合性について評価を行うとともに、当該設計の委託をした建築主に対し、当該評価の結果について、書面を交付して説明しなければならない。','建築主等は、エネルギー消費性能の向上のために建築物の修繕をしようとするときは、建築物エネルギー消費性能向上計画を作成し、所管行政庁の認定を申請することができる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:28,text:'建築主から以下の条件Aに基づく「地上3階建て共同住宅」の設計を求められた際に、各居室に以下の条件Bに該当する窓を設置しようとした場合、建築基準法その他の建築関係法令の規定の適用に関する設計者の判断として、イ〜ハの記述について、正しいもののみの組合せは、次のうちどれか。\n\n条件A（建築主の要請）\n・各居室の床面積：40 m²（各階に3室ずつ）\n・階の床面積：160 m²\n・延べ面積：480 m²\n・建築物エネルギー消費性能基準における「地域の区分」が6の地域の基準に適合させる。\n・住戸ごとの防火区画は設けない。\n\n条件B（各居室の窓）\n※採光補正係数は1.0とする。\n※天井面近くの窓は、全面開放できるものとする。\n※窓の性能を基に算出した住戸単位での「外皮平均熱貫流率」は0.75 W/(m²・度)、「冷房期の平均日射熱取得率」は1.4である。\n\nイ．適切に採光を確保することができる規模の窓であることを確認した。\nロ．それぞれの住戸について「外皮平均熱貫流率」及び「冷房期の平均日射熱取得率」が基準値以下となることを確認した。\nハ．排煙設備を設置することなく、避難上の支障をきたす煙・ガスを適切に屋外に排出することができる規模の窓であることを確認した。',choices:['イとロとハ','イとロ','イとハ','ロとハ'],answer:2,hasFigure:true,figureDesc:'各居室の窓の断面図。幅300cm、高さ270cmの壁面に、下部から190cmの腰壁、その上に高さ184cmの窓が3枚（各幅96cm）並ぶ。天井面近くに高さ114cmの窓（幅120cm）がある。天井面から20cm下がった位置に窓上端、床面から44cmの位置に別の寸法。天井高は50cm分のふかしを含む。'},
{year:2022,subject:'法規',no:29,text:'以下の条件に該当する建築物の設計に際して、建築基準法その他の建築関係法令の規定の適用に関する設計者の判断として、次の記述のうち、不必要な内容を含むものはどれか。\n\n【条件】\n・規　　模：地上6階建て、高さ27 m\n・構　　造：鉄筋コンクリート造\n・延べ面積：3,000 m²（各階の床面積は500 m²）\n・用　　途：物品販売業を営む店舗（各階に売場）',choices:['構造耐力上の安全性を確認するため、構造計算の実施に当たっては「保有水平耐力計算」によることとし、「保有水平耐力が必要保有水平耐力以上であること」、「構造耐力上主要な部分の断面に生ずる各応力度が、各許容応力度を超えないこと」、「層間変形角が、基準値以内であること」、「屋根ふき材等が、風圧に対して構造耐力上安全であること」を確かめて設計した。','避難上の安全性を確保するため、避難経路となる屋内の直通階段を、「特別避難階段に適合する階段として、2か所に設置すること」、「階段室に排煙機による排煙設備を設置すること」、「非常用の照明装置を設置すること」として設計した。','建築物の備えるべきエネルギー消費性能を確保するため、空気調和設備、照明設備等に関して、実際の設計仕様の条件を基に算定した「設計一次エネルギー消費量」が、床面積、設備等の条件によって定まる「基準一次エネルギー消費量」を超えないものとして設計した。','建築主の要請により、高齢者や障害者など誰もが利用しやすい建築物とするため、廊下の幅などについて移動がしやすいように配慮したところ、床面積の増加によって容積率の基準を超えたことから、容積率の特例の対象となる「認定特定建築物」の認定を受けることとして、「建築物移動等円滑化誘導基準」に適合するものとして設計した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'法規',no:30,text:'次の記述のうち、関係法令上、誤っているものはどれか。',choices:['「住宅の品質確保の促進等に関する法律」に基づき、住宅新築請負契約又は新築住宅の売買契約においては、住宅の構造耐力上主要な部分等について、引き渡した時から10年間の瑕疵担保責任を義務付けており、これに反する特約で注文者又は買主に不利なものは無効とされる。','「建設業法」に基づき、建設業者は、発注者から請負代金の額が3,500万円の診療所の建築一式工事を請け負った場合、当該工事を施工するときは、当該工事現場に置く主任技術者を専任の者としなくてよい。','「長期優良住宅の普及の促進に関する法律」に基づき、住宅の建築をしてその構造及び設備を長期使用構造等とし、自らその建築後の住宅の維持保全を行おうとする者は、長期優良住宅建築等計画を作成し、所管行政庁の認定を申請することができる。','「都市の低炭素化の促進に関する法律」に基づき、低炭素建築物新築等計画の認定の申請をしようとする場合には、あらかじめ、建築基準法に基づく確認済証の交付を受けなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'構造',no:1,text:'図－1のような等質な材料からなる部材の断面が、図－2に示す垂直応力度分布となって全塑性状態に達している。このとき、断面の図心に作用する圧縮軸力Nと曲げモーメントMとの組合せとして、正しいものは、次のうちどれか。ただし、降伏応力度はσyとする。',choices:['N=8a²σy, M=42a³σy','N=8a²σy, M=52a³σy','N=12a²σy, M=42a³σy','N=12a²σy, M=52a³σy'],answer:2,hasFigure:true,figureDesc:'図－1: 中空矩形断面形状（外寸6a×8a、内寸4a×6a、フランジ厚a、ウェブ厚a）。図－2: 垂直応力度分布（上部圧縮σy、下部引張σy、圧縮領域6a、引張領域2a）。'},
{year:2022,subject:'構造',no:2,text:'図のように、材料とスパンが同じで、断面が異なる単純梁A、B及びCの中央に集中荷重Pが作用したとき、それぞれの梁の曲げによる中央たわみδA、δB及びδCの大小関係として、正しいものは、次のうちどれか。ただし、それぞれの梁は全長にわたって等質等断面の弾性部材とし、自重は無視する。また、梁を構成する部材の接触面の摩擦及び接着はないものとする。',choices:['δA＜δB＝δC','δA＝δB＜δC','δB＝δC＜δA','δC＜δA＝δB'],answer:4,hasFigure:true,figureDesc:'梁A: 2枚重ねの断面（各a×2a）、スパン2l。梁B: 正方形断面（a×a）上に斜線部（a×a）を重ねた断面、下部3a、スパン2l。梁C: 斜線部断面（2a高さ、幅3/2 a×2）、スパン2l。'},
{year:2022,subject:'構造',no:3,text:'図のような鉛直方向に等分布荷重wと水平方向に集中荷重Pが作用する骨組において、固定端A点に曲げモーメントが生じない場合の荷重wlと荷重Pの比として、正しいものは、次のうちどれか。ただし、全ての部材は弾性部材とし、自重は無視する。',choices:['wl：P＝1：1','wl：P＝1：2','wl：P＝2：1','wl：P＝3：1'],answer:3,hasFigure:true,figureDesc:'L字型骨組。水平部材（長さl）に等分布荷重w、鉛直部材（長さl）の中間（l/2の位置）に水平集中荷重P。A点は固定端。'},
{year:2022,subject:'構造',no:4,text:'図－1のような水平荷重Pを受ける山形ラーメンにおいて、Pを増大させたとき、その山形ラーメンは、図－2のような梁端部に塑性ヒンジを生じる崩壊機構を示した。山形ラーメンの崩壊荷重がPuであるとき、最も不適当なものは、次のうちどれか。ただし、梁の全塑性モーメントはMpとする。',choices:['水平荷重Puは2Mp/lである。','柱ABの軸力はMp/lの引張力である。','C点の曲げモーメントは0である。','E点の鉛直反力VEはMp/lである。'],answer:3,hasFigure:true,figureDesc:'図－1: 山形ラーメン（A,E点ピン支持、B,D点梁端、C点頂部、柱高l、梁の水平長2l、頂部高さ3/4 l）に水平荷重P。図－2: 崩壊機構（B,D点に塑性ヒンジMp）。'},
{year:2022,subject:'構造',no:5,text:'図のような荷重が作用するトラスにおいて、部材A、B及びCに生じる軸方向力をそれぞれNA、NB及びNCとするとき、それらの大小関係として、正しいものは、次のうちどれか。ただし、全ての部材は弾性部材とし、自重は無視する。また、軸方向力は、引張力を「＋」、圧縮力を「－」とする。',choices:['NA＜NB＜NC','NB＜NA＜NC','NC＜NA＜NB','NC＜NB＜NA'],answer:1,hasFigure:true,figureDesc:'プラットトラス（4パネル、各パネル幅l、高さl）。上弦に5つの等間隔鉛直荷重P。部材A:上弦中央、B:左端斜材、C:左から2番目斜材。下弦2点でピン・ローラー支持。'},
{year:2022,subject:'構造',no:6,text:'図－1のような構造物に鉛直荷重Pが作用したときのせん断力図として、正しいものは、次のうちどれか。ただし、全ての部材は弾性部材とし、自重は無視する。また、せん断力の符号は図－2に示した向きを「＋」とする。',choices:['選択肢1のせん断力図','選択肢2のせん断力図','選択肢3のせん断力図','選択肢4のせん断力図'],answer:4,hasFigure:true,figureDesc:'図－1: 斜め部材を含む構造物（上端ピン支持、下端ピン支持、水平部材長さ2a+a=3a、高さ2a）に鉛直荷重P。図－2: せん断力の正の向き。選択肢1～4はそれぞれ異なるせん断力図。'},
{year:2022,subject:'構造',no:7,text:'図のようなラーメン架構A、B及びCの水平方向の固有周期をそれぞれTA、TB及びTCとしたとき、それらの大小関係として、正しいものは、次のうちどれか。ただし、柱の曲げ剛性は図中に示すEIあるいは2EIとし、梁は剛体とする。また、柱の質量は考慮しないものとする。',choices:['TA＜TB＝TC','TB＜TA＜TC','TB＝TC＜TA','TC＜TA＜TB'],answer:1,hasFigure:true,figureDesc:'架構A: 1層1スパン（質量2M、柱EI×2本、柱高h、スパンl）。架構B: 1層2スパン（質量6M、柱EI×3本、柱高h、各スパンl）。架構C: 1層1スパン（質量M、柱2EI×2本、柱高2h、スパンl）。'},
{year:2022,subject:'構造',no:8,text:'建築基準法における建築物に作用する積雪荷重に関する次の記述のうち、最も不適当なものはどれか。',choices:['屋根面における積雪量が不均等となるおそれのある場合においては、その影響を考慮して積雪荷重を計算しなければならない。','垂直積雪量が1mを超える場合、雪下ろしの実況に応じて垂直積雪量を1mまで減らして積雪荷重を計算した建築物については、その出入口、主要な居室又はその他の見やすい場所に、その軽減の実況その他必要な事項を表示しなければならない。','多雪区域以外の区域における大スパン等の一定の条件を満たす緩勾配屋根を有する建築物では、屋根版の構造種別によっては、構造計算において用いる積雪荷重に積雪後の降雨を考慮した割増係数を乗じることが求められる場合がある。','多雪区域を指定する基準において、積雪の初終間日数の平年値が30日以上の区域であっても、垂直積雪量が1m未満の場合は、多雪区域とはならない。'],answer:4,hasFigure:false,figureDesc:''},
