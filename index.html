{year:2022,subject:'構造',no:9,text:'木造軸組工法による地上2階建ての建築物に関する次の記述のうち、最も不適当なものはどれか。',choices:['地震時等におけるねじれによる被害を防ぐために、壁率比が0.5以上となるように壁や筋かいを配置した。','建築物の出隅にある通し柱と胴差との仕口部分を、かど金物を用いて接合した。','隅柱を通し柱としなかったので、1階と2階の管柱相互を通し柱と同等以上の耐力を有するように、金物により補強した。','筋かいが間柱と交差する部分は、間柱を欠き取り、筋かいは欠込みをせずに通すようにした。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'構造',no:10,text:'木造軸組工法による地上2階建ての建築物の壁量の計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['壁量充足率は、各側端部分のそれぞれについて、存在壁量を必要壁量で除して求める。','筋かいを入れた壁倍率1.5の軸組の片面に、壁倍率3.7の仕様で構造用合板を釘打ち張りした耐力壁は、壁倍率5.2として存在壁量を算定する。','平面が長方形の建築物において、張り間方向と桁行方向ともに必要壁量が地震力により決定される場合、張り間方向と桁行方向の同一階の必要壁量は同じ値である。','風圧力に対する必要壁量を求める場合、見付面積に乗ずる数値は、1階部分と2階部分で同じ値を用いる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'構造',no:11,text:'図に示す鉄筋コンクリート構造の配筋に関する次の記述のうち、最も不適当なものはどれか。ただし、図に記載のない鉄筋は適切に配筋されているものとする。',choices:['断面内に打継ぎ部を設ける必要がある基礎梁において、必要な定着長さを確保したうえで、基礎梁の側面にあばら筋のフック付き重ね継手を設けた。','片側にスラブが取り付いた梁のあばら筋において、必要な余長を確保したうえで、あばら筋の末端の一端を90度フックとした。','スパンが短い大梁の主筋の配筋において、梁断面の四隅以外の主筋を部材の全長にわたって対角線上に配置した。','柱梁接合部において、せん断補強筋比が0.3％相当となるように帯筋を配筋した。'],answer:2,hasFigure:true,figureDesc:'4つの配筋詳細図。1:基礎梁の打継ぎ部とあばら筋。2:片側スラブ付き梁のあばら筋（90度フック）。3:スパンが短い大梁の対角線配筋。4:柱梁接合部の帯筋配筋。'},
{year:2022,subject:'構造',no:12,text:'鉄筋コンクリート構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['曲げ降伏する梁部材の靱性を高めるために、梁せい及び引張側の鉄筋量を変えることなく、梁幅を大きくした。','梁部材のクリープによるたわみを減らすために、引張側の鉄筋量を変えることなく、圧縮側の鉄筋量を減らした。','耐力壁は、一般に、付着割裂破壊が発生しにくいことから、付着割裂破壊の検討を省略した。','下階の柱抜けによりフィーレンディール架構が形成されるので、剛床仮定を設けず、上下弦材となる梁では軸方向力を考慮した断面算定を行った。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'構造',no:13,text:'鉄筋コンクリート構造の許容応力度計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築物の外壁から突出する部分の長さが2m以下の片持ちのバルコニーについては、鉛直方向の振動の励起が生じにくいものとして、鉛直震度による突出部分に作用する応力の割増しを行わなかった。','梁の引張鉄筋比が釣合い鉄筋比以下であったので、短期許容曲げモーメントを大きくするために、引張鉄筋をSD345から同一径のSD390に変更した。','梁の上端筋のコンクリートに対する許容付着応力度は、下端筋よりも大きい値を用いた。','耐力壁の短期許容せん断力を、「壁板の許容せん断力」と「側柱の許容せん断力」の和とした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'構造',no:14,text:'鉄筋コンクリート構造の保有水平耐力計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['引張側にスラブが取り付く大梁の曲げ終局モーメントは、一般に、スラブの有効幅内のスラブ筋量が多いほど大きくなる。','大梁のせん断終局耐力は、一般に、有効せいに対するせん断スパンの比が小さいほど大きくなる。','柱のせん断終局耐力は、一般に、軸方向圧縮応力度が小さいほど大きくなる。','柱梁接合部のせん断終局耐力は、一般に、取り付く大梁の幅が大きいほど大きくなる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'構造',no:15,text:'鉄骨構造の設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['鉄骨梁のせいがスパンの1/15以下であったので、固定荷重及び積載荷重によるたわみの最大値を有効長さで除した値が所定の数値以下であることを確認することにより、建築物の使用上の支障が起こらないことを確かめた。','埋込み型柱脚において、鉄骨の曲げモーメントとせん断力は、コンクリートに埋め込まれた部分の上部と下部の支圧により、基礎に伝達する設計とした。','冷間成形角形鋼管柱を用いた建築物の「ルート1－1」の計算において、標準せん断力係数C0を0.3以上とするとともに、柱の設計用応力を割増して検討した。','地震時に梁端部が塑性化するH形鋼梁について、一次設計時に許容曲げ応力度を圧縮フランジの支点間距離を用いて算定したことにより、十分な塑性変形能力が確保されているものと判断した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'構造',no:16,text:'鉄骨構造の設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['柱の限界細長比は、基準強度Fが大きいほど小さくなる。','振動障害の検討に用いる、床の鉛直方向の固有振動数は、梁の水平軸まわりの断面二次モーメントを小さくするほど高くなる。','圧縮材の許容圧縮応力度は、鋼材及び部材の座屈長さが同じ場合、座屈軸まわりの断面二次半径が小さいほど小さくなる。','弱軸まわりに曲げを受けるH形鋼の許容曲げ応力度は、幅厚比の制限に従う場合、許容引張応力度と同じ値とすることができる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'構造',no:17,text:'鉄骨構造の設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['H形鋼を用いた梁の全長にわたって均等間隔で横補剛を設ける場合、梁のせい、断面積及びウェブ厚さが同一であれば、フランジ幅が大きい梁ほど必要な横補剛の箇所数は多くなる。','工場や体育館等の軽量な建築物の柱継手・柱脚の断面算定においては、暴風時の応力の組合せとして、積載荷重を無視した場合についても検討する。','一般に、細長比の大きな筋かいは強度抵抗型であり、細長比の小さな筋かいはエネルギー吸収型であるといえるが、これらの中間領域にある筋かいは不安定な挙動を示すことが多い。','冷間成形角形鋼管柱に筋かいを取り付ける場合、鋼管柱に局部的な変形が生じないように補強を行う必要がある。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'構造',no:18,text:'鉄骨構造の接合部に関する次の記述のうち、最も不適当なものはどれか。',choices:['溶接するに当たっては、溶接部の強度を低下させないために、入熱量及びパス間温度が規定値より小さくなるように管理する。','柱梁接合部の梁端部フランジの溶接接合においては、梁ウェブにスカラップを設けないノンスカラップ工法を用いることにより、塑性変形能力の向上が期待できる。','高力ボルト摩擦接合部にせん断力と引張力が同時に作用する場合、引張応力度に応じて高力ボルト摩擦接合部の許容せん断耐力を低減する。','山形鋼を用いた筋かい材を、ガセットプレートの片側に高力ボルト摩擦接合により接合する場合、降伏引張耐力の算定において筋かい材の有効断面積は、筋かい材全断面積からボルト孔による欠損分を除いた値とする。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'構造',no:19,text:'地盤及び基礎に関する次の記述のうち、最も不適当なものはどれか。',choices:['直接基礎の基礎スラブの部材応力算定用の接地圧については、一般に、基礎スラブの自重を考慮しなくてよい。','受働土圧は、地下外壁や擁壁が地盤を押す方向に変位するときに、最終的に一定値に落ち着いた状態で発揮される土圧である。','地震時に液状化のおそれがある砂質地盤の許容応力度は、建築基準法施行令に規定された表の数値を用いてよい。','同一砂質地盤において、直接基礎の底面に単位面積当たり同じ荷重が作用する場合、一般に、基礎底面の幅が大きいほど、即時沈下量は大きくなる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'構造',no:20,text:'土質及び地盤調査に関する次の記述のうち、最も不適当なものはどれか。',choices:['杭の支持力等を検討するために、杭先端の支持力度を考慮して杭先端から下方に必要な深さまでボーリング調査を行った。','直接基礎が想定される地盤で、支持層の下部に位置する砂質土層の沈下量や沈下速度等を推定するために、圧密試験を行った。','地震時の杭の水平抵抗を検討するために、地盤の変形係数は、ボーリング孔の孔壁を用いた孔内水平載荷試験によって推定した。','土の液状化判定のための粒度試験には、標準貫入試験用サンプラーより採取した乱した試料を用いた。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'構造',no:21,text:'杭基礎に関する次の記述のうち、最も不適当なものはどれか。',choices:['砂質地盤における杭の極限周面摩擦力度は、杭周固定液を使用した埋込み杭より場所打ちコンクリート杭のほうが大きい。','杭の引抜き方向の許容支持力の計算において、長期及び短期ともに、杭の有効自重(自重から浮力を減じた値)を考慮することができる。','軟弱地盤における杭基礎の設計では、上部構造や基礎構造に作用する慣性力に対して検討しているので、地盤の水平変位により生じる応力を考慮しなくてもよい。','同一地盤に埋設される長い杭において、杭に作用する水平力、杭の種類及び杭径が同じ場合、杭頭の固定度が高いほど、杭頭の曲げモーメントは大きくなる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'構造',no:22,text:'プレストレストコンクリート構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['プレストレストコンクリート構造は、一般に、鉄筋コンクリート構造と比べて長スパンに適しており、ひび割れが発生する可能性が低いことから、鋼材の防食性は高い。','建築物の安全限界時の各部材の減衰特性を表す数値は、一般に、プレストレストコンクリート造の部材のほうが、鉄筋コンクリート造の部材と比べて小さい。','プレキャストプレストレストコンクリート造の梁をPC鋼材の緊張により柱と圧着接合する場合において、圧着部のせん断耐力は、一般に、PC鋼材の有効プレストレス力に摩擦係数を乗じることにより求められる。','ポストテンション方式によるプレストレストコンクリート造の床版において、一般に、防錆材により被覆された緊張材を使用する場合であっても、緊張材が配置されたシース内にグラウト材を注入しなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'構造',no:23,text:'各種建築構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['鉄骨鉄筋コンクリート造の柱の短期荷重時のせん断力に対する検討において、「鉄骨部分の許容せん断力」と「鉄筋コンクリート部分の許容せん断力」の和が、設計用せん断力を下回らないものとする。','鉄骨鉄筋コンクリート造の柱梁接合部において、梁の鉄骨ウェブに帯筋を貫通させて配筋してよい。','壁式鉄筋コンクリート構造は、鉄筋コンクリートラーメン構造とは異なり、一般に、耐震強度は大きい反面、優れた靱性は期待できない。','壁式鉄筋コンクリート造の建築物では、階高が規定値を超える場合、「層間変形角が制限値以下であること」及び「保有水平耐力が必要保有水平耐力以上であること」を確認する必要がある。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'構造',no:24,text:'免震構造、制振構造及び耐震改修に関する次の記述のうち、最も不適当なものはどれか。',choices:['免震構造において、積層ゴムアイソレータの座屈応力度は一次形状係数S1(ゴム1層の側面積に対するゴムの受圧面積の比)が大きいほど大きくなる。','制振構造による耐震改修は、制振装置を既存建築物に設置し、建築物の固有周期を長くすることにより、建築物に作用する地震力を低減し、耐震性の向上を図るものである。','制振ダンパーによるエネルギー吸収機構を適用した建築物のモデル化においては、制振ダンパーの取付け部周辺の変形を適切に評価しなければならない。','耐震改修には強度補強、靱性補強、損傷集中の回避等のほかに、減築等により建築物に作用する地震力を低減する方法がある。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'構造',no:25,text:'建築物の耐震設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['地震層せん断力係数の建築物の高さ方向の分布を表す係数Aiは、一般に、建築物の上階になるほど、また、建築物の設計用一次固有周期Tが長くなるほど、大きくなる。','鉄骨造の建築物において、張り間方向を純ラーメン構造、桁行方向をブレース構造とする場合、方向別に異なる耐震計算ルートを適用してよい。','保有水平耐力計算における必要保有水平耐力の算定では、形状特性を表す係数Fesは、各階の剛性率及び偏心率のうち、それぞれの最大値を用いて、全階共通の一つの値として算出する。','限界耐力計算により建築物の構造計算を行う場合、耐久性等関係規定以外の構造強度に関する仕様規定は適用しなくてよい。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'構造',no:26,text:'建築物の構造計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['鉄骨造の多層骨組の建築物において、床を鉄筋コンクリートスラブとした場合には、一般に、各骨組に水平力を伝達するために、床スラブとこれを支持する鉄骨梁をシアコネクター等で緊結する必要がある。','細長い連層耐力壁に接続する梁(境界梁)は、耐力壁の回転による基礎の浮き上がりを抑える効果がある。','平面的に構造種別が異なる建築物は、構造種別ごとにエキスパンションジョイントにより分離して個々に設計することが原則であるが、力の伝達等を十分に考慮し、一体として設計することもできる。','構造特性係数Dsは、一般に、架構が靱性に富むほど大きくすることができる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'構造',no:27,text:'木材に関する次の記述のうち、最も不適当なものはどれか。',choices:['木材の弾性係数は、一般に、含水率が繊維飽和点から気乾状態に達するまでは、含水率が小さくなるに従って小さくなる。','積雪時の許容応力度計算をする場合、木材の繊維方向の短期許容応力度は、通常の短期許容応力度を所定の割合で減じた数値とする。','木材の熱伝導率は、普通コンクリートに比べて小さい。','木材の腐朽は、木材腐朽菌の繁殖条件である酸素・温度・水分・栄養源のうち、いずれか一つでも欠くことによって防止することができる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'構造',no:28,text:'コンクリートに関する次の記述のうち、最も不適当なものはどれか。',choices:['コンクリートの引張強度は、一般に、圧縮強度が大きいほど大きい。','コンクリートの中性化速度は、一般に、圧縮強度が大きいほど遅い。','乾燥収縮によるコンクリートのひび割れは、一般に、単位水量が大きいほど発生しやすい。','水和熱及び乾燥収縮によるコンクリートのひび割れは、一般に、単位セメント量が小さいほど発生しやすい。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'構造',no:29,text:'鋼材に関する次の記述のうち、最も不適当なものはどれか。',choices:['炭素鋼は、硫黄の含有量が少ないほど、シャルピー吸収エネルギー及び板厚方向の絞り値が大きくなる。','鋼材は、板厚に対し極端に小さな曲げ半径で冷間曲げ加工を行うと、加工前に比べて強度が上昇し、変形性能が低下する。','角形鋼管柱の通しダイアフラム等に用いられている、建築構造用圧延鋼材(SN材)C種には、板厚方向の絞り値の制限がない。','建築構造用圧延鋼材SN400Aは、降伏点の下限のみが規定された鋼材であり、降伏後の十分な変形性能が保証された鋼材ではないので、一般に、弾性範囲で使用する部位に用いる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'構造',no:30,text:'建築物等の構造計画及び構造設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['鉄筋コンクリート造の腰壁と柱の間に完全スリットを設けた場合には、梁剛性の算定に当たっては、腰壁部分が梁剛性に与える影響を考慮しなくてよい。','木質構造の採用や、ハーフPC床版利用による型枠用合板の使用量低減等、地球環境との共生に寄与した設計が求められている。','高さ1.2mを超える補強コンクリートブロック造の塀は、原則として、所定の数値以下の間隔で控壁を設けるとともに、必要な根入れ深さ等を確保した基礎としなければならない。','特定天井の構造方法には、壁等と天井面との間に隙間を設ける方法と設けない方法がある。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:1,text:'鉄筋コンクリート造建築物の施工計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['ネットワーク工程表において、トータルフロートが最小のパスをクリティカルパスといい、これを重点管理することが、工程管理上、重要である。','工事施工者は、工事の着手に先立ち、総合仮設を含めた工事の全般的な進め方や、主要工事の施工方法、品質目標と管理方針、重要管理事項等の大要を定めた、総合施工計画書を作成する。','総合図は、一般に、意匠、構造、設備などの分野別に作成された設計図書に基づき相互に関連する工事内容を一枚の図面に表したもので、コンクリート躯体図の作成後に工事施工者が作成する。','概成工期は、建築物等の使用を想定して総合試運転調整を行ううえで、関連工事を含めた各工事が支障のない状態にまで完了しているべき期限である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:2,text:'工事現場の管理等に関する次の記述のうち、最も不適当なものはどれか。',choices:['鉄筋コンクリート造建築物の墨出しにおいて、2階より上階については、一般に、建築物の四隅の床に小さな穴を開けておき、下げ振り等により下階から上階に基準墨を上げる。','遣方の検査において、当該工事の監理者は、墨出しの順序と同じ順序で確認するなど、できる限り工事施工者が行った方法と同じ方法で確認する。','施工条件の設計図書等との不一致、工事内容の変更等により、実施工程表を変更する必要が生じた場合には、工事施工者は、施工等に支障がないように実施工程表を直ちに変更し、変更した部分の施工に先立ち、当該工事の発注者及び監理者に提出する。','建築物の解体において、石綿の除去作業に用いられ、廃棄されたプラスチックシートや防塵マスクは、特別管理産業廃棄物に該当する。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:3,text:'材料管理、品質管理等に関する次の記述のうち、最も不適当なものはどれか。',choices:['工事用材料について、設計図書に製品名及び製造所が3種類指定されていたので、その中から工事施工者が選定した。','工事施工者は、設計図書においてJIS又はJASの指定のある材料について、それぞれのマーク表示のあるものを使用することとしたので、当該工事の監理者への「設計図書に定める品質及び性能を有することの証明となる資料」の提出を省略した。','工事現場における錆止め塗料塗りにおいて、塗装面の単位面積当たりの塗付け量の確認については、膜厚測定が困難であるので、使用量から推定することにした。','有機系接着剤によるタイル後張り工法において、屋内の吹抜け部分の壁面に張り付けたタイルについては、接着剤の硬化前に全面にわたり打診による確認を行った。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:4,text:'鉄筋コンクリート造の共同住宅(床面積の合計が1,500m²)の新築工事の届出等に関する次の記述のうち、最も不適当なものはどれか。',choices:['この敷地に設ける駐車場の出入りのために歩道の切下げを行う必要があったので、当該工事の建築主が、歩道の工事の設計及び実施計画について承認を受けるための申請書を、建築主事あてに提出した。','この工事の確認申請と同時に、当該工事の建築主が、建築工事届を、建築主事を経由して都道府県知事あてに提出した。','この工事が「建設工事に係る資材の再資源化等に関する法律」の対象建設工事であることから、当該工事の発注者が、工事に着手する日の7日前までに、分別解体等の計画等を添えた届出書を、都道府県知事あてに提出した。','この工事が完了した日から4日以内に到達するように、当該工事の建築主が、完了検査申請書を、建築主事あてに提出した。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:5,text:'地盤調査に関する次の記述のうち、最も不適当なものはどれか。',choices:['ボーリングにおいて、地表面付近の孔壁が崩壊するおそれがあったので、ドライブパイプを0.5～1.5m程度打ち込み、孔壁を保護した。','ボーリングにおいて、孔内に地下水が認められたので、長時間放置し、水位が安定した後に、孔内水位を測定した。','標準貫入試験の本打ちにおいて、打撃回数が50回、累計貫入量が30cmであったので、N値を30とした。','標準貫入試験の結果から得られたN値により、砂質地盤の相対密度や内部摩擦角を推定した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:6,text:'土工事及び山留め工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['根切り工事において、工事施工者が施工に支障となる障害物を発見したので、撤去の方法、処分の方法、時期などについて、当該工事の監理者と協議した。','ディープウェル工法において、建築物の位置に設けられたディープウェルの揚水停止後の処置については、箱抜きした基礎スラブ内で井戸管を切断し、その内部を砕石で充填した後、その上に直接コンクリートを打設した。','山留め工事において、山留め壁の変形、切ばりの蛇行を防止するため、「切ばり交差部の切ばり相互」及び「切ばりと切ばり支柱」をそれぞれ緊結した。','山留め支保工の撤去作業において、腹起しと切ばりについては、切ばりジャッキの軸力を緩めてから撤去した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:7,text:'地業工事等に関する次の記述のうち、最も不適当なものはどれか。',choices:['直接基礎において、掘削作業をバックホウにより行ったが、支持層となる床付け面までの30～50cmを残し、残りを手掘りとした。','セメントミルク工法による既製コンクリート杭工事において、地盤の状況、施工性、施工時に発生する騒音・振動などを確認するための試験杭については、特記がなかったので、最初に施工する本杭を兼ねることとした。','アースドリル工法による現場打ちコンクリート杭工事において、超音波孔壁測定器により、孔壁の崩壊の有無、水平方向の偏心及び支持層の土質を確認することとした。','アースドリル工法による現場打ちコンクリート杭工事において、杭頭の処理については、コンクリートの打込みから14日程度経過した後、杭体を傷めないように、可能な限り平坦に斫り取り、所定の高さにそろえた。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:8,text:'鉄筋工事に関する「部位」に対する「形状及び寸法」として、最も不適当なものは、次のうちどれか。ただし、コンクリートの設計基準強度は24N/mm²とする。また、設計図書には特記がないものとし、図に記載のない鉄筋は適切に配筋されているものとする。',choices:['柱中間部のスパイラル筋(D10)の重ね継手の長さ: 400mm（SD295 D10、柱主筋SD345 D22）','柱頭の出隅部の末端に設ける柱主筋(D22)のフックの形状及び寸法: 90mm×90mm（SD345 D22）','耐力壁の縦筋(D13とD10)の継手長さ: 350mm（SD295 D10とSD295 D13、打継ぎ位置あり）','土に接する基礎梁の設計かぶり厚さ: 50mm（梁主筋SD345 D29、あばら筋SD295 D10、1階スラブ、捨てコンクリート厚さ50mm）'],answer:1,hasFigure:true,figureDesc:'4つの配筋詳細図。1:柱中間部のスパイラル筋の重ね継手400mm。2:柱頭出隅部の柱主筋D22のフック90mm×90mm。3:耐力壁の縦筋D13とD10の継手長さ350mm。4:土に接する基礎梁の設計かぶり厚さ50mm。'},
{year:2022,subject:'施工',no:9,text:'型枠工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['目違いや不陸等の極めて少ないコンクリート打放し仕上げに用いるせき板については、特記がなかったので、JASのコンクリート型枠用合板による表面加工品で、厚さが12mmのものが使用されていることを確認した。','型枠支保工に用いる鋼材の許容曲げ応力及び許容圧縮応力の値については、当該鋼材の「降伏強さの値」又は「引張強さの値の3/4」のうち、いずれか小さい値の2/3の値以下とした。','型枠の構造計算におけるコンクリート施工時の水平荷重については、鉛直方向の荷重に対する割合で定めることとし、地震力については検討しなかった。','計画供用期間の級が「標準」の建築物において、せき板の取外し後に湿潤養生を行わない柱、梁側及び壁については、コンクリートの圧縮強度が5N/mm²に達したことを確認したので、湿潤養生期間の終了前にせき板を取り外した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:10,text:'レディーミクストコンクリートの受入れ時の検査に関する次の記述のうち、最も不適当なものはどれか。',choices:['コンクリートに含まれる塩化物量の検査において、塩化物イオン量として0.30kg/m³であったので、合格とした。','呼び強度60、スランプフロー50cmと指定した高強度コンクリートにおいて、スランプフローが60.0cmであったので、合格とした。','呼び強度27、スランプ21cmと指定した高性能AE減水剤を用いた普通コンクリートにおいて、スランプが23.0cmであったので、合格とした。','スランプ及び空気量の検査において、スランプ及び空気量とも許容範囲を外れたため、同一運搬車から新しく試料を採取して再試験を行ったところ、1回でいずれも許容範囲内となったので、合格とした。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:11,text:'コンクリート工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['調合管理強度が27N/mm²の普通コンクリートを使用した流動化コンクリートにおいて、ベースコンクリートのスランプを15cm、流動化コンクリートのスランプを21cmとした。','寒中コンクリートにおいて、コンクリートの荷卸し時にコンクリート温度が10℃以上20℃未満となるように、練混ぜ水を40℃に加熱して使用した。','コンクリートポンプによるコンクリートの圧送において、打ち込むコンクリートの品質変化を防止するために、コンクリートの圧送前に富調合のモルタルを圧送した。','床スラブ上面の均しについては、プラスチック収縮ひび割れの発生を防止するために、コンクリートの凝結完了後に、速やかにタンピングを行った。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:12,text:'プレキャスト鉄筋コンクリート工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['高強度コンクリートを用いて部材厚の大きなプレキャスト部材を製造するに当たり、セメントの水和熱により中心部と表面部の温度差が大きくなることを考慮した加熱養生計画とした。','プレキャスト部材の製造工場における製品検査において、外壁のプレキャスト部材の屋外に面する部分に、外壁の性能上支障がない「幅0.10mm以下のひび割れ」があったので、プレキャスト部材製造要領書に従って、初期補修用プレミックスポリマーセメントペーストによる補修を行ったうえで合格とした。','工事現場における部材の受入検査において、特殊な形状や特に注意を要する部材については、専用の架台に仮置きして、製品検査済などの表示を確認したうえで、積込み時や運搬中に生じる可能性があるひび割れ、破損、変形などの状況を確認した。','プレキャストの柱部材と梁部材の組立て精度の検査については、当該階の全てのプレキャスト部材の仮固定完了後、接合作業前に行った。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:13,text:'鉄骨工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['国土交通大臣の認定による鉄骨製作工場のグレードは、製作した鉄骨により建築可能な建築物の規模や、使用する鋼材の種類・板厚、溶接作業の条件などに応じて定められており、性能評価の低い工場から順に、J、R、M、H、Sの5つのグレードに区分される。','板厚10mm以下の鉄骨部材に行う高力ボルト用の孔あけ加工については、工事現場でドリルあけとすることができる。','高力ボルトにおける摩擦面のすべり係数値を0.45以上確保するには、摩擦接合面全面の範囲のミルスケールを除去した後、一様に錆を発生させる方法がある。','トルシア形高力ボルトの締付け後の検査において、ボルトの余長については、ナット面から突き出た長さが、ねじ1山から6山までの範囲にあるものを合格とする。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:14,text:'鉄骨工事における溶接に関する次の記述のうち、最も不適当なものはどれか。',choices:['溶接接合において、厚さ25mm以上の400N/mm²級の軟鋼の組立溶接を被覆アーク溶接(手溶接)とするので、低水素系溶接棒を使用した。','母材の溶接面について付着物の確認を行ったところ、固着したミルスケールがあったが、溶接に支障とならなかったので、除去しなかった。','完全溶込み溶接とする板厚の異なる突合せ継手において、部材の板厚差による段違いが薄いほうの板厚の1/4以下、かつ、10mm以下であったので、薄いほうの部材から厚いほうの部材へ溶接表面が滑らかに移行するように溶接した。','溶接部の補修において、表面割れについては、割れの位置を確認した後、割れと割れの両端からさらに20mm程度広げた部分を除去し、舟底形に仕上げてから再溶接した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:15,text:'木造2階建て住宅の建築工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['敷居及び鴨居については、木表に建具用の溝を掘ったものを使用した。','枠組壁工法において、アンカーボルトの埋込み位置については、住宅の隅角部付近、土台の継手位置付近とし、その他の部分は間隔2.0m以内とした。','軸組工法において、2階床組の補強に用いる木製の火打梁については、断面寸法を45mm×90mmとし、横架材との仕口を六角ボルト締めとした。','軸組工法において、大引きと土台との仕口については、大入れ蟻掛けとし、N75釘2本を斜め打ちとした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:16,text:'防水工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['シート防水工事の接着工法において、一般平場部の合成高分子系ルーフィングシートについては、引張力を与えながら下地に接着させた。','屋根保護防水絶縁工法によるアスファルト防水工事において、一般平場部に砂付あなあきルーフィングを使用する工法としたので、立上り部については砂付あなあきルーフィングを省略した。','ウレタンゴム系塗膜防水工事において、防水材の塗布による防水層の施工については、立上り部、平場部の順に行った。','シーリング工事において、外部に面するシーリング材の施工に先立ち行う接着性試験については、特記がなかったので、簡易接着性試験とした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:17,text:'左官工事、タイル工事及び石工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['せっこうプラスター塗りにおいて、塗り作業中及び作業後半日から1日は通風をなくし、凝結が十分に進行した後は適切な通風を与えた。','コンクリート壁面へのモルタル塗りにおいて、下塗りの調合については容積比でセメント1に対し砂2.5とし、中塗り及び上塗りの調合については容積比でセメント1に対し砂3とした。','有機系接着剤によるタイル後張り工法において、屋外に使用する接着剤は、練り混ぜ不良に起因する事故を防止するため、JIS規格品の二液反応硬化形の変成シリコーン樹脂系のものとした。','石工事における床用敷きモルタルの調合については、容積比でセメント1に対し砂4とした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:18,text:'金属工事及びガラス工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['軽量鉄骨壁下地において、床ランナー下端から上部ランナー上端までの高さが2,700mmの壁下地に設ける振れ止めについては、床ランナー下端から1,200mmの位置に設け、床ランナー下端から2,400mmの位置は省略した。','軽量鉄骨天井下地において、野縁については、野縁受から180mmはね出した。','ガラス工事において、アルミニウム製の引違い戸の単板ガラスのはめ込みには、グレイジングチャンネルを使用した。','ガラス工事において、ガラスが破損すると破片が落下する危険性が高いトップライトには、合わせガラスを使用した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:19,text:'内外装工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['せっこうボード張りにおいて、突付け工法に用いるせっこうボードのエッジの種類については、ベベルエッジとした。','ビニル床シート張りにおいて、張付け後に湿気の影響を受けやすい箇所については、エポキシ樹脂系接着剤を使用した。','スウェイ方式のメタルカーテンウォール工事において、層間変位を吸収するためのスライドホール部については、手締め程度のボルト締めとし、緩止めを施した。','PCカーテンウォール工事において、カーテンウォール部材で層間変位に追従できるように、スパンドレルパネル方式を採用した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:20,text:'設備工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['現場における給水管の水圧試験については、保持時間が60分であることを確認した。','一般配管用ステンレス鋼鋼管を用いた冷温水用の立て管については、最下階の床で固定し、各階に1か所ずつ管の収縮を妨げないように形鋼振れ止め支持を設けた。','電気設備工事における二重天井内のケーブル配線については、ケーブルによる荷重が過度とならないことを確認したうえで、ケーブルの支持間隔が2m以下になるように、天井吊ボルト及び天井下地材にバンド等を用いて固定した。','雷保護設備における板状接地極については、地表面下1.5mの深さに埋設し、ガス管から0.75m離隔した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:21,text:'5階建ての建築物における各部工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['呼び径150の耐火二層管の横走り配管工事において、吊り金物による吊り間隔を1.5m以下とした。','とい工事において、硬質ポリ塩化ビニル管を用いた屋外の「たてどい」のどい受け金物については、特記がなかったので、3m間隔となるように取り付けた。','軽量鉄骨壁下地において、コンクリートスラブへのランナーの取付けについては、打込みピンによる固定とし、その間隔については、900mm程度とした。','横引き配管等の耐震対策において、最上階のケーブルラックについては、耐震クラスSに対応する必要があったので、6m以内の間隔でSA種の耐震支持を行った。'],answer:2,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:22,text:'鉄筋コンクリート造建築物の耐震改修工事に使用する「あと施工アンカー」に関する次の記述のうち、最も不適当なものはどれか。',choices:['接着系アンカーの施工において、特記がなかったので、アンカー筋に打撃や衝撃を与えず、かつ、回転しないように、マーキング位置まで埋め込むことにより固着させた。','金属系アンカーの施工において、締付け方式のアンカーの固着状況については、特記がなかったので、締付け作業後、目視検査及び打音試験により全数確認した。','金属系アンカーの施工後の現場非破壊試験において、引張試験を行うための確認試験荷重については、特記がなかったので、計算で得られた、「アンカーの鋼材による引張荷重」又は「コンクリート破壊による引張荷重」の小さいほうの2/3程度の値とした。','接着系アンカーの施工後の確認試験において、引張試験に不合格となったロットについては、特記がなかったので、当該ロットの残り全てのアンカーに対して、試験を行った。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:23,text:'鉄筋コンクリート造建築物の外壁改修工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['手動式エポキシ樹脂注入工法によるコンクリート打放し仕上げの外壁のひび割れ部の改修工事において、鉛直方向のひび割れ部へのエポキシ樹脂の注入については、ひび割れ部の上部の注入口から下部へ順次行った。','自動式低圧エポキシ樹脂注入工法によるコンクリート打放し仕上げ外壁のひび割れ部の改修工事において、エポキシ樹脂の注入完了後は注入器具を取り付けたまま硬化養生を行い、エポキシ樹脂の硬化を見計らって仮止めシール材及び注入器具を撤去した。','塗り仕上げ外壁の改修工事において、既存塗膜を除去する必要がなかったので、下地のひび割れ部の補修後に塗膜表面の粉化物や付着物を除去する水洗い工法を採用し、上塗りのみを塗り替えた。','塗り仕上げ外壁の改修工事において、劣化の著しい塗膜や下地コンクリートの脆弱部分を除去する必要があったので、高圧水洗工法を採用した。'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:24,text:'建築工事に関する用語とその説明との組合せとして、最も不適当なものは、次のうちどれか。',choices:['ECP ── 石灰質原料及びけい酸質原料を主原料とし、オートクレーブ養生した軽量気泡コンクリートに鉄筋などの補強材を埋め込んだパネル','DPG構法 ── 一般に、ガラスにあけた点支持用孔に点支持金物を取り付け、支持構造と連結することにより、大きなガラス面を構成する構法','エントレインドエア ── AE剤又は空気連行作用がある混和剤を用いてコンクリート中に連行させた独立した微細な空気泡','逆打ち工法 ── 一般に、建築物の1階の床・梁などを先行施工し、これらを支保工として、下部の根切りを進め、順次地下階の躯体の施工と根切りを繰り返し、地下工事を進める工法'],answer:1,hasFigure:false,figureDesc:''},
{year:2022,subject:'施工',no:25,text:'建築物の監理業務委託契約(工事監理を含む。)に関する次の記述のうち、四会連合協定「建築設計・監理等業務委託契約約款」(令和2年4月改正)に照らして、最も不適当なものはどれか。',choices:['委託者は、受託者から監理業務方針の説明を受けた日から7日以内に、受託者に対して、その修正につき協議を請求することができる。','受託者は、あらかじめ委託者の承諾を得た場合であっても、監理業務の全部を一括して他の建築士事務所の開設者に委託してはならない。','受託者は、委託者の債務の不履行により損害が生じたときは、その債務の不履行が監理業務委託契約及び取引上の社会通念に照らして委託者の責めに帰することができない事由によるものであっても、その債務の不履行の効果がこの契約に定められている場合を除き、委託者に対し、その損害の賠償を請求することができる。','受託者は、監理業務の段階において、理由の如何を問わず、工事請負契約が解除されたときは、委託者に催告をすることなく、直ちに、委託者に書面をもって通知して監理業務委託契約の全部を解除することができる。'],answer:3,hasFigure:false,figureDesc:''}
,
{year:2021,subject:'計画',no:1,text:'次の用語に関する記述のうち、最も不適当なものはどれか。',choices:['SDGsは、誰一人取り残さない、持続可能でよりよい社会の実現を目指す世界共通の17の開発目標からなり、その目標の一つに「持続可能な都市」がある。','QOLは、近年、生活の質的向上を目指そうとする気運の高まりとともに、建築計画においても、医療福祉等の分野で重要性が増している。','ZEBは、資源の有効な利用を確保する観点から、「建設工事に係る資材の再資源化等に関する法律」(建設リサイクル法)によって定められた分別解体及び再資源化等の実施義務の対象となる建築物のことである。','重要伝統的建造物群保存地区における「修景事業」は、伝統的建造物以外の建造物や新築される建造物が歴史的風致と調和するよう、外観を整備するために行う事業のことである。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'計画',no:2,text:'海外の都市に関する次の記述のうち、最も不適当なものはどれか。',choices:['ミレトス(トルコ、紀元前5世紀頃)は、ヒッポダモスの計画による、城壁内全体に格子状に直交道路網を敷設し、都市の中央部に行政・宗教・商業施設を、その南北に住宅地を配した都市である。','ローマのカンピドリオ広場(イタリア、16世紀)は、ミケランジェロの計画による、台形状の広場とアプローチとしての大階段、三つのパラッツォを対称的に配置することで、軸線を強調した、バロック的な広場計画の初期の事例である。','レッチワース(イギリス、20世紀初頭)は、パトリック・ゲデスの「保存的外科手術」という概念のもと、都市の歴史性を保存しながら再開発が行われた都市である。','チャンディガール(インド、20世紀後半)は、ル・コルビュジエの都市計画理念に基づく、格子状に分割した区域(ユニット)と7段階に機能分けした道路網からなる都市である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'計画',no:3,text:'図に示す日本の歴史的な建築物に関する次の記述のうち、最も不適当なものはどれか。',choices:['三重塔の各層に裳階を付け、六つの屋根が交互に出入りする独特の構造を有する建築物である。','貫で軸部を水平方向に固め、挿肘木を重ねて軒の荷重を支える大仏様の建築物である。','主体部の柱と裳階の柱を海老虹梁でつなぎ、組物を柱の上のみならず柱と柱の間にも組んで詰組とする禅宗様の建築物である。','長い束柱を貫で固めた足代によって、急な崖の上に張り出した床を支える懸造の建築物である。'],answer:3,hasFigure:true,figureDesc:'4つの日本の歴史的建築物の図（断面図・立面図）が示されている。肢1:薬師寺東塔（三重塔）、肢2:東大寺南大門（大仏様）、肢3:法隆寺金堂（禅宗様）、肢4:清水寺本堂（懸造）'},
{year:2021,subject:'計画',no:4,text:'建築計画の次の記述のうち、最も不適当なものはどれか。',choices:['小学校の計画に当たり、インクルーシブ教育システム構築のため、障害のある児童と障害のない児童とが、交流及び共同学習できる施設とした。','病院の計画に当たり、医療行為を中断することなく設備更新が行えるように、手術室のある階の上階に設備階(インタースティシャル・スペース)を設けた。','ホテルの一般客室を、車椅子使用者用客室へ改修するに当たり、二つの客室の間仕切り壁を撤去して一室化し、客室内にスロープを設置し、客室全体の床の高さを、トイレ・浴室等の床の高さと合わせた。','図書館の計画に当たり、地上階に開架書庫や地域住民が利用する施設等を配置したので、半地下階に貴重書保存用書庫を設け、年間を通じて自然換気を行うこととした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'計画',no:5,text:'建築物の各部に関する次の記述のうち、最も不適当なものはどれか。',choices:['外壁や屋上から離れている居室に設ける光ダクトの設計において、ダクト内の光の反射回数を減らすために、ダクトの曲がりを少なく、断面積を大きくした。','建築物の通風計画において、効果的に室内に外の風を取り込むために、風上開口を風下開口よりも大きくした。','木材の構造材を現し仕上げとするに当たり、燃焼時に木材の表面が炭化し、中心に向けて燃える速度が遅くなるので、木材の部材断面を大きくすることで、耐火性を高めた。','木材を構造材として使用するに当たり、腐朽しにくく、乾燥に伴う収縮や反りが少ない心材を採用した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'計画',no:6,text:'人間のまわりの空間や距離等に関する次の記述のうち、最も不適当なものはどれか。',choices:['エドワード・ホールは、人間同士の距離のとり方等の空間の使い方は、それ自体がコミュニケーションとしての機能をもつと考え、距離をコミュニケーションと対応させて四つの距離帯に分類した。','ロバート・ソマーは、テリトリー(なわばり)は個人についてまわり、持ち運びができ、その空間のかたちは必ずしも球形ではなく、前方に比べ横のほうは未知の人が近づいても寛容になれることを示した。','H.メルテンスは、「建築物の高さ」と「視点から建築物までの水平距離」の比によって建築物の見え方の変化を尺度化した。','オスカー・ニューマンは、物理的・象徴的障壁と見通しのよさをもち、住民たちがそこを「自分たちの場所」と感じているような環境をディフェンシブルスペース(まもりやすい空間)と定義した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'計画',no:7,text:'建築物内で発生する音に関する次の記述のうち、最も不適当なものはどれか。',choices:['室内の反射音を防ぐために、壁と天井の仕上げに孔あき板を採用し、低音域の吸音率を向上させるために、その仕上げとコンクリート躯体との間に空気層を十分に確保した。','音圧が極端に弱くなることにより、音が聞こえにくくなる場所(デッドスポット)の発生を防ぐために、天井面や壁面を大きな凹曲面で構成した。','オープンプラン型の小学校において、隣接する教室からの音の伝播を防止するため、廊下の天井の仕上げに表面をガラスクロスで覆ったグラスウールを使用した。','隣り合う部屋の間仕切りにおいて、せっこうボードを両面張りとした壁の遮音性能を向上させるため、共通間柱構造から、壁のボードを各面ごとに別々の間柱に取り付ける独立間柱構造に変更した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'計画',no:8,text:'建築物の各部の高さに関する次の記述のうち、最も不適当なものはどれか。',choices:['百貨店のトイレ・洗面所の計画において、乳幼児用おむつ交換台の高さを、50cmとした。','庁舎の車椅子使用者用トイレの計画において、ドアを開閉するための押しボタンスイッチの高さを、110cmとした。','ホテルのフロントカウンターの計画において、一般用の高さを100cmとし、車椅子使用者用の高さを70cmとした。','事務所ビルの事務室の計画において、椅子に座ったときの視界を遮るためのパーティションの高さを、120cmとした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'計画',no:9,text:'図は、公共施設が建つ敷地内の主要な経路上の傾斜路を計画した模式図である。「高齢者、障害者等の円滑な移動等に配慮した建築設計標準(国土交通省)」に照らして、最も不適当なものは、次のうちどれか。',choices:['転倒防止や休憩、減速ができるように、傾斜路の途中に設置した踊り場の踏幅Aを、1,600mmとした。','車椅子使用者が自力で上り下りできるように、傾斜路の水平距離Bを、8,000mmとした。','人と車椅子使用者がすれ違えるように、傾斜路の有効幅Cを、1,500mmとした。','白杖等による危険の認知、車椅子のキャスター等の脱輪防止のため、側壁がない傾斜路及び踊り場側端の立ち上がりDを、50mmとした。'],answer:2,hasFigure:true,figureDesc:'公共施設敷地内の傾斜路の平面図と断面図。傾斜路の踏幅A、水平距離B、有効幅C、立ち上がりD、レベル差750mmが示されている。'},
{year:2021,subject:'計画',no:10,text:'施設を計画・運営する際の官民連携等に関する次の記述のうち、最も不適当なものはどれか。',choices:['指定管理者制度とは、文化会館や保育所、公園等の公の施設の管理運営を、ノウハウを有する民間事業者等が行うことで、住民サービスの質の向上を図り、施設設置の目的を効果的に達成するための制度のことである。','街なみ環境整備事業とは、住環境の整備改善を必要とする区域において、地方公共団体及び街づくり協定等を結んだ住民が協力して、美しい景観の形成、良好な居住環境の整備を支援する事業のことである。','TMOとは、商業・業務機能が集積した地区において、「中心市街地活性化基本計画」等をもとに活性化事業等を推進する民間主体の組織のことである。','サウンディング型市場調査とは、地方公共団体等の事業完了後に、住民との意見交換等を通し、事業に対しての様々な意見や改善点を把握する調査のことである。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'計画',no:11,text:'都市開発やまちづくりに関する次の記述のうち、最も不適当なものはどれか。',choices:['北海道札幌市では、都市再生特別地区の指定により、建築物の形態意匠の制限の他、建築物の高さの最高限度や敷地面積の最低限度を定めることで市街地の良好な景観形成に取り組んでいる。','富山県富山市では、レジリエンス戦略を策定し、自然災害による大きな被害や少子高齢化等の社会構造の変化に直面しても、速やかに復興し、さらに成長する能力や強靭さを有する都市づくりに取り組んでいる。','香川県高松市では、タウンマネジメント・プログラムにより、第三セクターを設立し、地域住民や事業者、地権者を主体としたまちづくりが実践されている。','福岡県北九州市では、民間自立型による家守事業者の設立や定期的なリノベーションスクールの開催により、遊休不動産を活用した「リノベーションまちづくり」が実践されている。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'計画',no:12,text:'日本の伝統的な住宅・集落等の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['卯建とは、一般に、妻壁を屋根面より高く突き出し、小屋根を付けた部分のことで、建築物の装飾としてだけではなく、防火性能を兼ね備えている。','築地塀とは、一般に、方形の平瓦を並べ四隅を釘留めし、目地に漆喰を盛り上げた外壁仕上げである。','岩手県下に多く見られた曲り屋造りとは、L字型の平面形状を有し、突出部は厩で母屋の土間とつながる民家形式の一つである。','輪中とは、河川の氾濫する低湿地帯で、周囲に堤防を築き、集落と耕地を守る水防のための集落形態のことである。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'計画',no:13,text:'自然災害からの復興支援のための住宅、住宅地等の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['防災集団移転促進事業とは、災害が発生した地域又は建築基準法に基づく災害危険区域のうち、住民の居住に適当でないと認められる区域内にある住居の集団的移転を促進することを目的としたものである。','応急借上げ住宅とは、地方自治体が民間賃貸住宅を借り上げて仮設住宅として供与するものであり、東日本大震災以降は「みなし仮設住宅」とも呼ばれているものである。','陸前高田のみんなの家(岩手県)は、東日本大震災の津波で立ち枯れたスギの丸太を用い、被災した人々の集いの場としてつくられた集会場である。','グループハウス尼崎(兵庫県)は、阪神・淡路大震災後に被災者を対象に建設された、高齢者向け住戸と一般向け住戸で構成され、サポート拠点(サポートセンター)を併設した災害公営住宅である。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'計画',no:14,text:'建築物と周辺環境の次の記述のうち、最も不適当なものはどれか。',choices:['TIME\'S Ⅰ,Ⅱ(京都府)は、屋根全体を大階段の展望広場とし、その大階段を二分するスリット状のアプローチが人々をエントランスに導くように計画された。','アオーレ長岡(新潟県)は、駅前に建てられた市民協働・市民交流の拠点であり、大通りに開かれた屋根付き広場を中心に、アリーナ、市民交流スペース、市役所、議会等を配置した複合施設として計画された。','太田市美術館・図書館(群馬県)は、建築物の屋内外を巡るスロープや階段、テラス、緑化された屋上を備え、駅前からは施設の賑わいが見え、また、施設からは街が眺められるように計画された。','代官山ヒルサイドテラス(東京都)は、建築群が内包する広場や路地等を主要素として外部空間を形成し、周囲の純和式建築物や庭園とゲートによってつながるように計画された。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'計画',no:15,text:'公共建築物等の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['福岡市立博多小学校(福岡県)は、オープンプラン型を採用し、旧来型の職員室の代わりに壁のない教員コーナーやワーキングスペースを設けることで、複数の教員で児童を見守ることのできる空間整備が行われた。','立命館大学大阪いばらきキャンパス(大阪府)は、工場跡地において、官民が連携し、防災公園と一体化して計画された。','石巻市庁舎(宮城県)は、百貨店を転用したもので、既存エスカレーターをそのまま活用し、売り場は執務スペースへ、映画館は議場へと改修された。','大田区役所本庁舎(東京都)は、1960年代に建てられた民間の事務所ビルを転用したもので、外部及び内部デザインを継承しながら、3階エントランスは各種イベントに対応できるように、設備改修が施された。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'計画',no:16,text:'高齢者施設に関する次の記述のうち、最も不適当なものはどれか。',choices:['認知症高齢者グループホームにおいて、家庭にできるだけ近い環境で生活できるように、1ユニットの定員を8人とした。','小規模多機能型居宅介護施設において、要介護者が短期間宿泊するための宿泊室は個室とし、その床面積を、1室当たり10m²とした。','二つのユニットを有する個室ユニットケア型特別養護老人ホームにおいて、隣接するユニットの共同生活室は共用として、二つのユニットが一体的に使えるようにした。','個室ユニットケア型特別養護老人ホームにおいて、入居者の個室内にトイレを設けない場合、排泄リズムの重なる場合が多いことを配慮し、個室からトイレに至る動線を短くし、トイレを個室3部屋に対し一つ以上設けた。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'計画',no:17,text:'歴史的建築物の改修や保存に関する次の記述のうち、最も不適当なものはどれか。',choices:['倉敷アイビースクエア(岡山県)は、明治初期に建設された工場を商業施設に改修し、中央に設けたガラス屋根のアトリウムを市民に開放することで、公共性の高い空間を実現したものである。','金沢市民芸術村(石川県)は、大正から昭和初期に建設された紡績工場の倉庫を改修し、工房、レストラン、オープンスペース等から構成される芸術文化施設へ再生させたものである。','千葉市美術館(千葉県)は、昭和初期に銀行として建設された既存建築物全体を新築の建築物で覆う「鞘堂」という日本古来の方式により整備したものである。','ロームシアター京都(旧京都会館)(京都府)は、昭和30年代に建設された既存建築物を保存し、意匠的な要素を再現しながら、増築と一部建て替えを行うことで、機能拡充が図られたものである。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'計画',no:18,text:'設計・監理業務等に関する次の記述のうち、建築士法第25条の規定に基づく「建築士事務所の開設者がその業務に関して請求することのできる報酬の基準(平成31年国土交通省告示第98号)」に照らして、最も不適当なものはどれか。',choices:['業務経費は、それぞれ算定される直接人件費、特別経費、直接経費及び間接経費の合計額であり、これらの経費には課税仕入れの対価に含まれる消費税に相当する額は含まれない。','特別経費は、設計等の業務において発揮される技術力、創造力等の対価として支払われる費用である。','設計者は、設計図書の定めにより、工事施工段階において行うことに合理性がある工事材料、設備機器等及びそれらの色、柄、形状等の選定に関して、設計意図の観点からの検討を行い、必要な助言を建築主に対して行う。','工事監理者は、設計図書の定めにより、工事施工者が作成し、提出する施工図、製作見本、見本施工等が設計図書の内容に適合しているかについて検討し、建築主に報告する。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'計画',no:19,text:'建築積算に関する次の記述のうち、建築工事建築数量積算研究会「建築数量積算基準」に照らして、最も不適当なものはどれか。',choices:['「計画数量」は、設計図書に基づいた施工計画により求めた数量をいい、仮設や土工等の数量がこれに該当する。','主仕上の数量において、衛生器具、電気器具、換気孔、配管、配線等の器具の類による各部分の仕上の欠除が1か所当たり0.5m²以下の欠除については、原則として、ないものとして計測・計算する。','鉄骨の数量において、1か所当たり0.5m²以下のダクト孔による鋼材の欠除については、原則として、ないものとして計測・計算する。','仕上改修において、設計図書に改修に必要な余幅の図示がないときは、適切な余幅を加えて計測・計算することができる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'計画',no:20,text:'建築のマネジメントに関する次の記述のうち、最も不適当なものはどれか。',choices:['コンセッション方式とは、料金の徴収を行う公共施設において、施設の所有権と運営権を民間業者へ移行する方式のことである。','デザインレビューとは、設計や施工等の各部門の専門家が、設計段階で性能・機能・信頼性等を価格、納期等を考慮しながら、設計について審査し改善を図ることである。','フロントローディングとは、施工段階や維持管理段階における問題点の早期発見や作業全体の効率化を目指し、設計段階で各種の技術検討を行うことである。','CRE戦略とは、企業が保有している不動産について、企業価値向上の観点から、経営戦略的視点に立って見直しを行い、不動産投資の効率性を最大限向上させるための考え方である。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'環境・設備',no:1,text:'環境工学における用語に関する次の記述のうち、最も不適当なものはどれか。',choices:['露点温度は、絶対湿度を一定に保ちながら空気を冷却した場合に、相対湿度が100％となる温度である。','グレアは、視野の中に輝度の高い光源が入ってきたときに起こり、周囲の輝度からの影響を受けない。','ビル風は、建築物の見付面積が大きく、風をより多くせき止めるほど、一般に、剥離する領域が大きくなる。','カクテルパーティ効果は、周囲が騒がしい環境であっても聴きたい音を選択的に聴き取ることができる、聴覚上の性質である。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'環境・設備',no:2,text:'室内の温熱環境に関する次の記述のうち、最も不適当なものはどれか。',choices:['予測平均温冷感申告(PMV)の値が0に近づくに従って、予測不満足者率(PPD)は高くなる。','平均放射温度(MRT)は、グローブ温度、空気温度及び気流速度から求められる。','冷たい壁面による不快感を生じさせないためには、放射の不均一性(放射温度の差)を10℃未満にすることが望ましい。','着席安静時における日本人の平均的な体格の成人男性の代謝量は、約100W/人である。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'環境・設備',no:3,text:'換気に関する次の記述のうち、最も不適当なものはどれか。',choices:['静止型の全熱交換器を採用する場合、全熱交換素子の通気抵抗が大きいので、一般に、給気側と排気側の両方に送風機が必要となる。','汚染空気が周囲から流入してはならない手術室やクリーンルーム等においては、第二種機械換気方式又は室内の気圧を周囲より高くした第一種機械換気方式とする。','住宅の全般換気をトイレ、浴室、台所等の水まわり部分からのファンによる排気によって行う場合、居室に設ける自然給気口は、温熱環境に影響を及ぼさないように、床面から0.5m以下に設置することが望ましい。','建築物が風圧力のみによって換気される場合、その換気量は、外部風向と開口条件が同じであれば、概ね外部風速に比例する。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'環境・設備',no:4,text:'建築物の伝熱に関する次の記述のうち、最も不適当なものはどれか。',choices:['冬期において、二重サッシの間の結露を防止するためには、屋外側よりも室内側のサッシの気密性能を高くするとよい。','室内の壁表面における自然対流熱伝達率は、壁表面と室内空気との温度差が大きくなるほど高くなる。','繊維系断熱材は、含水率が増加すると水の熱伝導抵抗が加わるので、断熱性能が向上する。','複層ガラスにおいて、Low-Eガラスを屋外側に用いると、室内側に用いる場合に比べて遮熱性が高まる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'環境・設備',no:5,text:'建築物における防火・防災に関する次の記述のうち、最も不適当なものはどれか。',choices:['火災時に空気と分離した煙が平面方向に広がる速さは、避難における歩行速度にほぼ等しい。','劇場の防災計画において、階段を下りる速度は、一般に、0.6m/秒で想定する。','超高層建築物や医療福祉施設では、災害時に一気に外部まで避難することが困難な場合が想定されるので、避難経路の途中又は途中階に一時的に滞留できる空間を確保することが望ましい。','居室内避難における歩行距離は、一般に、家具の配置にかかわらず、出口に最も遠い地点から出口までの直線距離とする。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'環境・設備',no:6,text:'日照・日射に関する次の記述のうち、最も不適当なものはどれか。',choices:['夏至の日に終日日影となる部分を、永久日影という。','建築物の形状と日影の関係において、4時間以上日影となる領域の面積は、一般に、建築物の東西方向の幅よりも高さから受ける影響が大きい。','南面と西面の外壁条件が同一である建築物の周囲に落葉樹を植える場合は、その落葉樹の位置は、一般に、南側より西側としたほうが、その建築物の冷暖房負荷の軽減に有効である。','鉛直壁面の中央付近に設けられる同一面積の窓からの採光においては、一般に、横長窓より縦長窓のほうが、床面の照度の均斉度は高い。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'環境・設備',no:7,text:'照明に関する次の記述のうち、最も不適当なものはどれか。',choices:['ある視対象面の明るさは、その面に入射する光から求められる照度のみからでは、予測することができない。','CIE標準曇天空では、天頂に対する相対的な輝度分布は、方位にかかわらず、高度のみにより決まる。','配光曲線は、光源の各方向に対する照度の分布を示すものである。','平均演色評価数(Ra)は、相関色温度が同じ光源であっても異なる場合がある。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'環境・設備',no:8,text:'色彩に関する次の記述のうち、最も不適当なものはどれか。',choices:['マンセル表色系において、マンセルバリューが5の色の視感反射率は、一般に、約20％である。','減法混色とは、複数の色光を混ぜ合わせて別の色の知覚を生じさせることをいい、もとの色の数が増加するほど明るくなる。','LED等の人工光源から発せられる光は、相関色温度が等しくても、異なる光色に知覚される場合がある。','XYZ表色系における三刺激値X、Y、Zのうち、Yは、反射物体の色の場合には、視感反射率を示す。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'環境・設備',no:9,text:'吸音・遮音に関する次の記述のうち、最も不適当なものはどれか。',choices:['単層壁の遮音において、同一の材料の場合、壁の厚さが薄いほど、コインシデンス効果による遮音性能の低下は、より高い周波数域で発生する。','壁の吸音率は、「壁へ入射する音のエネルギー」に対する「壁内部に吸収される音のエネルギーと壁の反対側へ透過する音のエネルギーとの和」の割合である。','子どもの飛び跳ねのような重量床衝撃源による床衝撃音については、カーペット等の柔らかい床仕上げ材を用いても、遮断性能の大幅な向上は期待できない。','中空二重壁の共振透過において、同一の材料を用いて壁間の空気層を厚くすると、共振周波数は高くなる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'環境・設備',no:10,text:'音響に関する次の記述のうち、最も不適当なものはどれか。',choices:['音の大きさの感覚量は、音圧レベルが一定の場合、低音域で小さく、10kHz付近で最大となる。','防音塀は、音の回折による減衰を利用して、騒音を低減化するものであり、一般に、低音域よりも高音域において有効である。','無限大の面音源から放射された音は、距離減衰することなく伝搬する。','室内の平均吸音率が大きい場合、セイビン(Sabine)の残響式により求めた残響時間は、アイリング(Eyring)の残響式により求めたものに比べると、長くなる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'環境・設備',no:11,text:'空気調和設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['空調用水蓄熱槽の利用温度差を確保するために、熱交換器を通過する蓄熱槽からの水量を一定に制御した。','密閉式冷却塔の省エネルギーを図るために、ファン発停制御及びファン回転数制御を行えるようにした。','遠心冷凍機の成績係数を改善するために、中間期においては、夏期よりも低い冷却水入口温度で運転できるようにした。','ガスエンジンから発生する排熱を利用するために、排熱投入型の吸収冷温水機を設置した。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'環境・設備',no:12,text:'事務所の空調方式に関する次の記述のうち、最も不適当なものはどれか。',choices:['定風量単一ダクト方式は、一般に、変風量単一ダクト方式に比べて搬送動力の消費量が大きい。','個別分散方式は、空調機を室単位やゾーン単位ごとに設置する方式であり、一般に、天井内等に機器の設置が可能なため、機器等の設置に必要なスペースを小さくすることができる。','放射空調方式は、一般に、天井等に設置した放射パネルを冷却又は加熱することにより放射パネルと人との間で放射熱交換を行う方式であり、気流や温度むらによる不快感が少ない。','床吹出し空調方式は、二重床の床下空間を利用し、床面に設けた吹出し口から空調空気を吹き出す方式であり、一般に、暖房運転時における居住域高さでの垂直温度差は大きい。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'環境・設備',no:13,text:'機械換気設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['200m²の一般的な事務室(40席)の換気量を、1,200m³/hとした。','100m²の喫茶店の客席(40席)の換気量を、1,200m³/hとした。','500m²の劇場の客席(400席)の換気量を、6,000m³/hとした。','1,000m²の自走式屋内地下駐車場の換気量を、14,000m³/hとした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'環境・設備',no:14,text:'給排水衛生設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['排水を再利用した雑用水については、便器洗浄水や修景用水の他に、清掃用水や冷却塔補給水にも使用した。','給水設備において、上水系統と別系統にした雑用水系統の受水槽については、雑用水用ポンプを設置した給排水衛生設備機械室の直下にある鉄筋コンクリート造の床下ピットを利用した。','雨水を便器洗浄水等で再利用した排水が下水道料金の対象となる地域において、雨水使用量を計測する量水計を設置した。','飲食施設を設けない中小規模の事務所ビルの給水設計において、使用水量の比率を、飲料水30％、雑用水70％とした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'環境・設備',no:15,text:'排水設備等に関する次の記述のうち、最も不適当なものはどれか。',choices:['飲食店の厨房の排水系統に設けるグリース阻集器は、一般に、油脂分を取ることのみを目的としているので、下流に臭気等を防止するトラップを別に設ける必要がある。','公共下水道へ排水する場合には、原則として、排水温度を45℃未満にしなければならない。','ディスポーザ排水処理システムは、ディスポーザ、専用の排水配管及び排水処理装置により構成されており、一般に、排水中のBOD等を基準値以下にして、下水道に放流するものである。','即時排水型ビルピット設備は、排水の貯留時間を短くすることにより、硫化水素等の悪臭物質の発生を抑制することができる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'環境・設備',no:16,text:'発電設備等に関する次の記述のうち、最も不適当なものはどれか。',choices:['非常電源専用受電設備は、商用電源が停電した場合、消防設備へ電力を供給できなくなるので、大規模な特定防火対象物における消防用設備等の非常電源とすることができない。','消防用設備等の非常電源として用いる自家発電設備で、蓄電池を使用しないものは、常用電源が停電してから電圧確立及び投入までの所要時間を40秒以内とする必要がある。','デュアルフューエルシステムの発電機に用いる燃料は、通常時にはガスを用い、災害等によりガスの供給が停止した場合には重油等を用いることができる。','燃料電池設備は、気体燃料を用いるので、消防用設備等の非常電源とすることができない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'環境・設備',no:17,text:'照明率に関する次の記述のうち、最も不適当なものはどれか。',choices:['配光が同じ照明器具においては、器具効率が高いほど照明率は高くなる。','器具効率が同じ照明器具においては、配光の広がりが大きいほど照明率は高くなる。','室の形状を示す室指数が同じであれば、室内反射率が高いほど照明率は高くなる。','室内反射率が同じであれば、室の形状を示す室指数が大きいほど照明率は高くなる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'環境・設備',no:18,text:'消防用設備等に関する次の記述のうち、最も不適当なものはどれか。',choices:['消火薬剤の放射により消火するパッケージ型自動消火設備を、スプリンクラー設備の代替設備として延べ面積1,500m²の特別養護老人ホームに設置した。','窒息効果と冷却効果により消火する泡消火設備を、地下駐車場に設置した。','水幕を張ることにより外部等からの延焼を防止するドレンチャー設備を、重要文化財の神社に設置した。','消防用水を、屋内消火栓設備やスプリンクラー設備等の初期消火設備のための専用水源として設置した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'環境・設備',no:19,text:'建築設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['非常用エレベーターの機械室の床面積は、機械の配置及び管理に支障がない場合においては、昇降路の水平投影面積の2倍以上としなくてもよい。','空調用の低圧送風機系統において、同一特性の送風機を2台並列運転させた場合の風量は、一般に、単独運転時の2倍にはならない。','ヒートポンプ給湯機は、大気中の熱エネルギーを給湯の加熱に利用するもので、冷媒に二酸化炭素を用いたものがある。','マルチパッケージ型空調機の屋外機は、屋上に集中設置するよりも各階バルコニーに分散設置するほうが、冷媒管が短く、高低差が少なくなるため、一般に、機器の運転効率は低下する。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'環境・設備',no:20,text:'環境・設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築物省エネルギー性能表示制度(BELS)の5段階のマークは、BEIの値が大きいほど星の数が増える。','「建築物のエネルギー消費性能の向上に関する法律」に基づく新築住宅の省エネルギー基準では、原則として、外皮平均熱貫流率(UA値)や冷房期の平均日射熱取得率(ηAC値)を地域の区分に応じた基準値以下となること等が求められる。','被災時に救護場所や避難場所となる可能性が高い病院やホテル等の施設を有する企業のBCPにおいては、電気、ガス、水道等のライフラインの広域停止に備えた設備をあらかじめ計画することが望ましい。','地域冷暖房システムの導入は、一般に、未利用熱の活用による排熱削減が期待でき、ヒートアイランド現象の緩和にも効果的である。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:1,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['土地に定着する観覧のための工作物は、屋根を有しないものであっても、「建築物」に該当する。','幼保連携型認定こども園は、「特殊建築物」に該当する。','鉄筋コンクリート造、地上3階建ての共同住宅における2階の床及びこれを支持するはりに鉄筋を配置する工事の工程は、「特定工程」に該当する。','火災により温度が急激に上昇した場合に自動的に閉鎖する防火戸は、「建築設備」に該当する。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:2,text:'面積、高さ又は階数に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['国土交通大臣が高い開放性を有すると認めて指定する構造の建築物については、その端から水平距離1m以内の部分の水平投影面積は、建築面積に算入しない。','建築物の宅配ボックス設置部分の床面積は、当該建築物の各階の床面積の合計の1/100を限度として、当該建築物の建築基準法第52条第1項に規定する容積率の算定の基礎となる延べ面積(建築物の容積率の最低限度に関する規制に係るものを除く。)に算入しない。','建築物の屋上部分で、水平投影面積の合計が当該建築物の建築面積の1/8以下の塔屋において、その一部に休憩室を設けたものは、当該建築物の階数に算入する。','避雷設備の設置の必要性を検討するに当たっての建築物の高さの算定において、階段室、昇降機塔等の建築物の屋上部分で、その水平投影面積の合計が当該建築物の建築面積の1/8以内の場合、その部分の高さは、12mまでは当該建築物の高さに算入しない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:3,text:'準防火地域内における次の行為のうち、建築基準法上、確認済証の交付を受ける必要がないものはどれか。ただし、建築等に関する確認済証の交付を受ける必要がない区域の指定はないものとする。',choices:['鉄骨造、延べ面積100m2、平家建ての一戸建ての住宅における、床面積8m2の増築','木造、高さ8m、地上2階建ての飲食店で、その用途に供する部分の床面積の合計が300m2のものにおける、屋根の過半の模様替','第一種住居地域内にある鉄筋コンクリート造、延べ面積2,000m2、地上2階建ての水泳場の、体育館への用途の変更(大規模の修繕又は大規模の模様替を伴わないもの)','鉄筋コンクリート造、延べ面積300m2、地上3階建ての事務所内における、エレベーターの設置'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:4,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['建築主は、確認済証の交付を受けた建築物について、当該建築物の敷地面積が増加する場合の敷地面積及び敷地境界線の変更(当該敷地境界線の変更により変更前の敷地の一部が除かれる場合を除く。)をして、当該建築物を建築しようとするときは、変更後も建築物の計画が建築基準関係規定に適合することが明らかなものは、あらためて確認済証の交付を受ける必要はない。','延べ面積2,000m2、地上4階建ての病院の避難施設等に関する工事の施工中において当該建築物を使用する場合においては、当該建築主は、仮使用の認定を受けるとともに、あらかじめ、当該工事の施工中における当該建築物の安全上、防火上又は避難上の措置に関する計画を作成して特定行政庁に届け出なければならない。','鉄骨造、平家建ての診療所(患者の収容施設があるもの)で、その用途に供する部分の床面積の合計が200m2のものを新築する場合においては、当該建築主は、検査済証の交付を受ける前であっても、当該建築物を使用することができる。','鉄筋コンクリート造、延べ面積500m2、地上5階建ての共同住宅を寄宿舎とする用途の変更(大規模の修繕又は大規模の模様替を伴わないもの)に係る確認済証の交付を受けた場合において、当該建築主は、当該用途の変更に係る工事を完了したときは、建築主事に工事完了届を届け出なければならない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:5,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['集会場における客用の階段に代わる高さ1.5m、勾配1/15の傾斜路で、その幅が4mのものには、中間に手すりを設けなくてもよい。','有料老人ホームにおける床面積50m2の入所者用娯楽室には、採光のための窓その他の開口部を設け、その採光に有効な部分の面積は、原則として、5m2以上としなければならない。','共同住宅の天井の全部が強化天井であり、かつ、天井の構造が、隣接する住戸からの日常生活に伴い生ずる音を衛生上支障がないように低減するために天井に必要とされる性能に関して政令で定める技術的基準に適合するもので、国土交通大臣が定めた構造方法を用いるものである場合には、当該共同住宅の各戸の界壁(準耐火構造であるもの)は、小屋裏又は天井裏に達しなくてもよい。','最下階の居室の床が木造である場合における外壁の床下部分には、原則として、壁の長さ5m以下ごとに、面積300cm2以上の換気孔を設け、これにねずみの侵入を防ぐための設備をしなければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:6,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['防火区画検証法は、開口部に設けられる防火設備について、屋内及び建築物の周囲において発生が予測される火災による火熱が加えられた場合に、火災の継続時間以上、加熱面以外の面に火炎を出すことなく耐えることができることを確かめる方法である。','準防火地域内における共同住宅の屋根の構造は、市街地における通常の火災による火の粉により、防火上有害な発炎をしないものであり、かつ、屋内に達する防火上有害な溶融、亀裂その他の損傷を生じないものでなければならない。','耐火構造の柱は、通常の火災による火熱が所定の時間加えられた場合に、構造耐力上支障のある変形、溶融、破壊その他の損傷を生じないものでなければならない。','不燃材料として、建築物の外部の仕上げに用いる建築材料が適合すべき不燃性能及びその技術的基準は、建築材料に、通常の火災による火熱が加えられた場合に、加熱開始後20分間、「燃焼しないものであること」及び「防火上有害な変形、溶融、亀裂その他の損傷を生じないものであること」である。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:7,text:'主要構造部を耐火構造とした耐火建築物に関する次の記述のうち、建築基準法に適合しないものはどれか。ただし、自動式のスプリンクラー設備等は設けられていないものとし、居室については、内装の制限を受ける「窓その他の開口部を有しない居室」には該当しないものとする。',choices:['地階に設ける劇場の客席及びこれから地上に通ずる主たる廊下、階段その他の通路の壁及び天井の室内に面する部分の仕上げを、準不燃材料でした。','各階が階避難安全性能を有するものであることについて、階避難安全検証法により確かめられた地上20階建ての共同住宅において、特別避難階段の階段室及び付室の天井及び壁の室内に面する部分の仕上げを不燃材料でし、かつ、その下地を準不燃材料で造った。','延べ面積600m2、地上3階建ての図書館において、3階部分にある図書室の壁及び天井の室内に面する部分の仕上げを、難燃材料でした。','延べ面積1,500m2、地上3階建ての物品販売業を営む店舗において、避難階である1階からその直上階のみに通ずる吹抜きについて、壁及び天井の室内に面する部分の仕上げを不燃材料でし、かつ、その下地を不燃材料で造ったので、吹抜きとなっている部分以外の部分との防火区画を行わなかった。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:8,text:'各階を物品販売業を営む店舗の用途に供する地上4階建ての建築物(各階の床面積が500m2)の避難階段に関する次の記述のうち、建築基準法に適合しないものはどれか。ただし、避難階は1階とし、屋上広場はないものとする。',choices:['屋外に設ける避難階段を、その階段に通ずる出入口以外の開口部から2.5mの距離に設けた。','屋内に設ける避難階段の部分には、排煙設備を設けなかった。','3階における避難階段の幅の合計を3.0mとした。','各階から1階に通ずる二つの直通階段を設け、そのうちの一つを、有効な防腐措置を講じた準耐火構造の屋外階段とした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:9,text:'防火・避難に関する次の記述のうち、建築基準法に適合しないものはどれか。',choices:['屋内に設ける避難階段に通ずる出入口に、通常の火災による火熱が加えられた場合に、加熱開始後10分間当該加熱面以外の面に火炎を出さない性能を有する防火戸で所定の構造であるものを設けた。','延べ面積1,500m2、耐火建築物及び準耐火建築物以外の、木造、地上2階建ての美術館について、防火上有効な構造の防火壁に設ける開口部の幅及び高さを、それぞれ2.5mとし、かつ、これに特定防火設備で所定の構造であるものを設けた。','延べ面積1,500m2の体育館に、非常用の照明装置を設けなかった。','主要構造部を準耐火構造とした建築物の地上部分の層間変形角を、1/150以内となるようにした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:10,text:'建築設備に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['エレベーター(所定の特殊な構造又は使用形態のものを除く。)の機械室における床面から天井又ははりの下端までの垂直距離は、かごの定格速度が毎分150mの場合、2.2m以上としなければならない。','居室を有する建築物の換気設備についてのホルムアルデヒドに関する技術的基準において、機械換気設備の有効換気量(単位 m3/時)は、原則として、その「居室の床面積(単位 m2)」と「居室の天井の高さ(単位 m)」の積に、住宅の居室にあっては0.5を乗じて得た必要有効換気量以上でなければならない。','耐火構造の床若しくは壁又は防火戸その他の所定の防火設備で床面積100m2以内に区画されたホテルの客室には、窓その他の開口部で開放できる部分(天井又は天井から下方80cm以内の距離にある部分に限る。)の面積の合計が、当該客室の床面積の1/50未満であっても、排煙設備を設置しなくてよい。','エレベーター強度検証法による主要な支持部分等の断面に生ずる常時の応力度は、昇降する部分以外の部分の固定荷重、昇降する部分の固定荷重及びかごの積載荷重を合計した数値により計算する。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:11,text:'保有水平耐力計算によって安全性が確かめられた建築物に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、高さが4mを超える建築物とする。',choices:['鉄骨造の建築物において、高力ボルト接合を行う場合、高力ボルト孔の径は、原則として、高力ボルトの径より2mmを超えて大きくしてはならない。','鉄筋コンクリート造の建築物において、鉄筋に対するコンクリートのかぶり厚さは、原則として、直接土に接する柱にあっては、4cm以上としなければならない。','鉄筋コンクリート造の建築物において、主筋の継手の重ね長さは、径の同じ主筋の継手を構造部材における引張力の最も小さい部分に設ける場合にあっては、原則として、主筋の径の25倍以上としなければならない。','鉄骨鉄筋コンクリート造の建築物において、構造耐力上主要な部分である柱の主筋は、4本以上としなければならない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:12,text:'図のような木造、地上2階建ての住宅(屋根を金属板で葺いたもの)の1階部分について、桁行方向に設けなければならない構造耐力上必要な軸組の最小限の長さとして、建築基準法上、正しいものは、次のうちどれか。ただし、小屋裏等に物置等は設けず、区域の地盤及び地方の風の状況に応じた「地震力」及び「風圧力」に対する軸組の割増はないものとし、国土交通大臣が定める基準に従った構造計算は行わないものとする。なお、1階部分の軸組の構造の判定に用いる1階の床面積については、60m2とする。また、図は略図とする。',choices:['1,710 cm','1,740 cm','1,980 cm','2,250 cm'],answer:2,hasFigure:true,figureDesc:'木造2階建て住宅の西側立面図と1階及び2階平面図。西側立面図：幅6m、1F.L.からG.L.まで0.45m、屋根は斜線部で見付面積45m2。平面図：床面積60m2（斜格子部）、10m×6m、桁行方向と張り間方向の矢印あり。真北表示あり。'},
{year:2021,subject:'法規',no:13,text:'構造強度に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['高さ1.2mの組積造の塀(補強コンクリートブロック造を除く。)は、原則として、長さ4m以下ごとに、壁面からその部分における壁の厚さの1.5倍以上突出した控壁(木造のものを除く。)を設けなければならない。','建築物の実況によらないで、柱の垂直荷重による圧縮力を計算する場合、公会堂の客席(固定席)で、柱がささえる床の数が6のときは、床の積載荷重として採用する数値を1,950N/m2とすることができる。','許容応力度等計算を行う場合、建築物の地上部分については、所定の地震力によって各階に生ずる層間変形角が所定の数値以内であることを確かめなければならない。','限界耐力計算を行う場合、所定の地震力により建築物の地下部分の構造耐力上主要な部分の断面に生ずる応力度が、短期に生ずる力に対する許容応力度を超えないことを計算により確かめなければならない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:14,text:'事務所(避難階は1階)の5階にある居室(床面積50m2で、「避難上支障がないものとして国土交通大臣が定める基準」に適合しない居室)の設計に際して、以下の条件に該当する開口部を設置することとした場合、窓その他の開口部を有しない居室の規定に関する次の記述のうち、建築基準法上、誤っているものはどれか。\n【条件】\n・採光に有効な部分の面積の合計：2.0m2\n・換気に有効な部分の面積の合計：3.0m2\n・天井又は天井から下方80cm以内で開放できる部分の面積の合計：0.5m2\n・避難上有効な構造の開口部ではない。',choices:['当該居室を区画する主要構造部を、耐火構造又は不燃材料で造らなければならない。','当該居室においては、自然換気設備、機械換気設備等に関する所定の技術的基準に適合する換気設備を設置しなければならない。','当該居室及び地上に通ずる主たる通路の内装を難燃材料で仕上げた場合、居室の各部分から直通階段までの距離を30m以下としなければならない。','当該居室については、排煙設備を設置しない場合、避難上支障のある高さまで煙又はガスの降下が生じない建築物の部分として国土交通大臣が定めたものに適合させなければならない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:15,text:'都市計画区域内の道路等に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['土地を建築物の敷地として利用するため、道路法等によらないで、特定行政庁からその位置の指定を受けて築造する道の縦断勾配は、原則として、12％以下としなければならない。','地区整備計画で道の配置及び規模又はその区域が定められている地区計画の区域内において、土地を建築物の敷地として利用するため、道路法等によらないで、特定行政庁からその位置の指定を受けて築造する道は、原則として、当該地区計画に定められた道の配置等に即したものでなければならない。','港湾管理者が管理する幅員10mの公共の用に供する道に2m以上接する敷地においては、特定行政庁が交通上、安全上、防火上及び衛生上支障がないと認めて許可した場合には、建築物を建築することができる。','壁面線を越えるひさしを設ける建築物を建築する場合には、特定行政庁の許可が必要である。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:16,text:'都市計画区域内の建築物の用途の制限に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、用途地域以外の地域、地区、都市施設等の指定はなく、また、特定行政庁の許可等は考慮しないものとする。',choices:['第一種住居地域内において、「延べ面積4,000m2、地上5階建ての保健所」は、新築することができる。','準住居地域内において、「延べ面積300m2、平家建ての水素ステーション(燃料電池自動車用の圧縮ガスを所定の設備により貯蔵・処理する建築物)」は、新築することができる。','田園住居地域内において、「延べ面積100m2、平家建ての喫茶店」は、新築することができる。','工業地域内において、「延べ面積1,000m2、平家建ての産業廃棄物処理施設の用途に供する建築物(がれき類の破砕施設で、1日当たりの処理能力が120tのもの)」は、新築することができる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:17,text:'図のような敷地において、建築基準法上、新築することができる建築物の容積率(同法第52条に規定する容積率)の最高限度は、次のうちどれか。ただし、図に記載されているものを除き、地域、地区等及び特定行政庁の指定、許可等は考慮しないものとする。',choices:['28/10','31/10','37/10','40/10'],answer:3,hasFigure:true,figureDesc:'敷地が第一種住居地域（都市計画で定められた容積率20/10）と商業地域（都市計画で定められた容積率60/10）にまたがる図。敷地は20m×20mで、北側と南側に道路あり。北側道路幅員7m、南側道路幅員18m。敷地の西側6mが道路に面し、東側に隣地。第一種住居地域部分は10m×20m、商業地域部分は10m×20m。'},
{year:2021,subject:'法規',no:18,text:'図のような敷地において、建築物を新築する場合、建築基準法上、A点における地盤面からの建築物の高さの最高限度は、次のうちどれか。ただし、敷地は平坦で、敷地、隣地及び道路の相互間に高低差はなく、門、塀等はないものとする。また、図に記載されているものを除き、地域、地区等及び特定行政庁による指定、許可等並びに日影による中高層の建築物の高さの制限及び天空率に関する規定は考慮しないものとする。なお、建築物は、全ての部分において、高さの最高限度まで建築されるものとする。',choices:['16.5 m','21.0 m','37.5 m','38.5 m'],answer:3,hasFigure:true,figureDesc:'商業地域（都市計画で定められた容積率80/10）の敷地図。敷地は35m×35mで、北側に道路（幅員16m）、南側に道路（幅員5m）。建築物は敷地内に配置され、A点は建築物の南西角、敷地境界から1m内側、南端から3m。隣地は東西両側。寸法：東西35m（1m+31m+3m）、南北方向に16m道路、3m、29m建築物、3m、5m道路の順。'},
{year:2021,subject:'法規',no:19,text:'図のような敷地において、用途上不可分の関係にあるA～Dの建築物を新築する場合、建築基準法上、誤っているものは、次のうちどれか。ただし、いずれの建築物も防火壁を設けていないものとし、建築物に附属する門又は塀はないものとする。また、図に記載されているものを除き、地域、地区等の制限については考慮しないものとし、危険物の貯蔵等は行わないものとする。',choices:['Aは、耐火建築物又はこれと同等以上の延焼防止時間となる建築物としなければならない。','Bは、耐火建築物又はこれと同等以上の延焼防止時間となる建築物としなければならない。','Cは、耐火建築物若しくは準耐火建築物又はこれらと同等以上の延焼防止時間となる建築物としなければならない。','Dは、耐火建築物又はこれと同等以上の延焼防止時間となる建築物としなければならない。'],answer:1,hasFigure:true,figureDesc:'敷地が準防火地域、防火地域、防火地域及び準防火地域の指定はなしの3つの区域にまたがる図。敷地内にA～Dの4棟の建築物が配置。A：延べ面積600m2、地上3階建ての事務所棟（準防火地域内）。B：延べ面積2,000m2、地上4階建ての事務所棟（防火地域及び準防火地域の指定はなしの区域）。C：延べ面積80m2、地上2階建ての事務所棟（準防火地域と道路の境界付近）。D：延べ面積120m2、平家建ての自動車車庫棟（防火地域内）。北側と南側に道路、東西に隣地。'},
{year:2021,subject:'法規',no:20,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['都市計画において建築物の高さの限度が10mと定められた田園住居地域内においては、その敷地内に政令で定める空地を有し、かつ、その敷地面積が政令で定める規模以上である建築物であって、特定行政庁が低層住宅に係る良好な住居の環境を害するおそれがないと認めるものについては、建築物の高さの限度は、12mとすることができる。','地区計画等の区域内における建築物の敷地が特定行政庁の指定した予定道路に接する場合、特定行政庁の許可を受けることなく、当該予定道路を前面道路とみなして建築物の容積率の規定を適用することができる。','共同住宅が建築基準法第22条第1項の市街地の区域の内外にわたる場合においては、その全部について同項の市街地の区域内の建築物に関する規定を適用する。','建築協定区域内の土地の所有者で当該建築協定の効力が及ばないものは、建築協定の認可等の公告のあった日以後いつでも、特定行政庁に対して書面でその意思を表示することによって、当該建築協定に加わることができる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:21,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['木造、延べ面積1,200m2の事務所は、その外壁及び軒裏で延焼のおそれのある部分を防火構造としなければならない。','「構造耐力上主要な部分に使用する木材の品質は、節、腐れ、繊維の傾斜、丸身等による耐力上の欠点がないものでなければならない。」とする規定は、「耐久性等関係規定」に該当する。','一級建築士の設計に係る木造、延べ面積120m2、高さ9m、地上2階建ての一戸建て住宅においては、建築物の建築に関する確認の特例により、建築基準法令の規定の一部が審査から除外される場合であっても、当該規定は遵守されなければならない。','木造、地上2階建ての一戸建て住宅において、土台の過半について行う修繕は、「大規模の修繕」に該当する。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:22,text:'建築士に関する次の記述のうち、建築士法上、誤っているものはどれか。',choices:['建築士は、建築主から建築基準法に関する基準に適合しない建築物を設計するよう求められた場合にあっては、その相談に応じることが禁止されている。','令和3年度に一級建築士試験に合格し、令和4年度に建築士事務所に所属することとなった一級建築士は、令和7年3月31日までに初めての一級建築士定期講習を受けなければならない。','構造設計一級建築士は、一級建築士でなければ設計できない建築物のうち、建築基準法第20条第1項第一号又は第二号に該当するものの構造設計を行って、その構造設計図書に構造設計一級建築士である旨の表示をした場合であっても、構造計算によって建築物の安全性を確かめた旨の証明書を設計の委託者に交付しなければならない。','設備設計一級建築士は、設備設計以外の設計を含めた建築物の設計を行うことができる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:23,text:'建築士事務所に関する次の記述のうち、建築士法上、誤っているものはどれか。',choices:['建築士事務所の開設者は、設計受託契約又は工事監理受託契約を締結する場合、あらかじめ、建築主に対して、報酬の額や契約の解除に関する事項等の重要事項について、所定の方法により管理建築士や当該事務所に所属する建築士に説明させる必要がある。','建築士事務所の開設者は、当該事務所に所属する建築士に変更があった場合、管理建築士については2週間以内に、それ以外の建築士については3月以内に、都道府県知事(都道府県知事が指定事務所登録機関を指定したときは、原則として、当該指定事務所登録機関)に届け出なければならない。','建築士事務所を開設しようとする者は、設計等の業務範囲が複数の都道府県にわたる場合、業務を行おうとする全ての地域について都道府県知事(都道府県知事が指定事務所登録機関を指定したときは、原則として、当該指定事務所登録機関)の登録を受ける必要がある。','建築士事務所の開設者は、設計等の業務に関し生じた損害を賠償するために必要な金額を担保するための保険契約の締結その他の措置を講ずるよう努めなければならない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:24,text:'建築士事務所の業務に関するものとして作成した帳簿及び図書で、建築士法の規定によって保存が義務付けられているものについて、次の記述のうち、同法上、誤っているものはどれか。',choices:['帳簿及び図書の保存が義務付けられる対象となる建築物は、確認済証の交付を受けることが必要とされる建築物に限られている。','保存が義務付けられている図書は、配置図、各階平面図、構造詳細図等の設計図書及び工事監理報告書である。','保存が義務付けられている帳簿の記載事項は、業務の概要、報酬の額、業務に従事した建築士の氏名等である。','帳簿や図書の保存義務を怠った場合、建築士事務所の開設者に対しては、戒告、1年以内の事務所閉鎖の命令又は事務所登録の取消しの処分が行われる場合がある。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:25,text:'次の記述のうち、都市計画法上、誤っているものはどれか。',choices:['開発許可を受けた開発区域内の土地について用途地域等が定められているときは、当該開発行為に関する工事が完了した旨の公告があった後に当該開発許可に係る予定建築物等以外の建築物を新築する場合であっても、都道府県知事の許可を受ける必要はない。','市街化調整区域のうち開発許可を受けた開発区域以外の区域内において、仮設建築物を新築する場合は、都道府県知事の許可を受ける必要はない。','市街地開発事業等予定区域に関する都市計画において定められた区域内において、既存の建築物の敷地内に、附属建築物である木造、平家建ての車庫を建築する場合は、原則として、都道府県知事等の許可を受けなければならない。','準都市計画区域内において、博物館法に規定する博物館の建築の用に供する目的で行う開発行為で、その規模が5,000m2のものについては、都道府県知事の許可を受ける必要はない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:26,text:'次の記述のうち、消防法上、誤っているものはどれか。ただし、建築物は、いずれも無窓階を有しないものとし、指定可燃物の貯蔵又は取扱いは行わないものとする。',choices:['主要構造部を耐火構造とし、かつ、壁及び天井の室内に面する部分の仕上げを準不燃材料でした延べ面積2,000m2、地上2階建ての図書館については、屋内消火栓設備を設置しなくてもよい。','地上8階建ての大学には、避難口誘導灯を設置しなくてもよい。','遊技場及び飲食店の用途に供する複合用途防火対象物の地階(床面積の合計900m2)については、ガス漏れ火災警報設備を設置しなければならない。','ホテルは、消防用設備等の技術上の基準に関する政令の規定の施行又は適用の際、現に存する建築物であっても、新築の場合と同様に当該規定が適用される「特定防火対象物」である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:27,text:'次の記述のうち、「高齢者、障害者等の移動等の円滑化の促進に関する法律」上、誤っているものはどれか。',choices:['床面積の合計が1,500m2の既存の老人ホームにおいて、床面積の合計が500m2の増築を行うときは、建築物移動等円滑化基準に適合させなければならない。','建築主等は、共同住宅のエレベーターを修繕しようとするときは、当該エレベーターを建築物移動等円滑化基準に適合させるために必要な措置を講ずるよう努めなければならない。','床面積の合計が3,000m2のホテルを新築するに当たって、客室の総数が150室の場合には、車椅子使用者用客室を2室以上設けなければならない。','地方公共団体が、条例で建築物移動等円滑化基準に必要な事項を付加した場合、当該条例の規定は、建築基準法に規定する建築基準関係規定とみなす。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:28,text:'次の記述のうち、関係法令上、誤っているものはどれか。',choices:['「都市の低炭素化の促進に関する法律」に基づき、低炭素建築物新築等計画の認定基準に適合させるための措置をとることにより通常の建築物の床面積を超えることとなる場合、建築基準法第52条第1項に基づく容積率の算定の基礎となる延べ面積には、当該建築物の延べ面積の1/10を限度に算入しないものとする。','「建築物のエネルギー消費性能の向上に関する法律」に基づき、一戸建ての請負型規格住宅を1年間に新たに300戸建設する特定建設工事業者は、当該住宅をエネルギー消費性能の一層の向上のために必要な住宅の構造及び設備に関する基準に適合させるよう努めなければならない。','「建築物の耐震改修の促進に関する法律」に基づき、要安全確認計画記載建築物及び特定既存耐震不適格建築物以外の既存耐震不適格建築物の所有者は、当該既存耐震不適格建築物について耐震診断を行い、必要に応じ、当該既存耐震不適格建築物について耐震改修を行うよう努めなければならない。','「住宅の品質確保の促進に関する法律」に基づき、住宅新築請負契約又は新築住宅の売買契約においては、住宅の構造耐力上主要な部分等の瑕疵(構造耐力又は雨水の浸入に影響のないものを除く。)について担保の責任を負うべき期間を、引き渡した時から20年間とすることができる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:29,text:'以下の条件に該当する建築物の設計に際して、建築基準法又は建築士法の規定の適用に関する建築士事務所の開設者又は設計者の判断として、次の記述のうち、建築基準法又は建築士法に適合しないものはどれか。\n【条件】\n・規模：地上4階建て(避難階は1階のみ)\n・延べ面積：2,000m2(各階の床面積は500m2)\n・用途：1階の一部 スーパーマーケット(床面積400m2)、1階の一部及び2～4階 共同住宅\n・立地：第一種中高層住居専用地域',choices:['当該建築物の新築に係る設計受託契約を締結する際に、建築士の氏名、報酬の額及び支払の時期、契約の解除に関する事項などを記載した書面を、署名をして、建築主との間で相互に交付することとした。','用途地域に基づく建築物の用途の制限に関し、良好な住居の環境を害するおそれがないものとして特定行政庁の許可を受けることとした。','2階から4階までの各階においては1階に通ずる直通階段を二つ設け、かつ、1階のスーパーマーケットにおける屋外への出口の幅の合計を300cmとすることとした。','共同住宅とスーパーマーケットとを耐火構造とした床及び壁で区画し、その開口部には特定防火設備を設けることとした。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'法規',no:30,text:'次の記述のうち、関係法令上、誤っているものはどれか。',choices:['「建設工事に係る資材の再資源化等に関する法律」に基づき、特定建設資材を用いた建築物に係る解体工事において、当該解体工事に係る部分の床面積の合計が80m2以上の場合は、当該工事の発注者又は自主施工者は、工事に着手する日の7日前までに、所定の事項を都道府県知事に届け出なければならない。','「都市計画法」に基づき、開発許可の申請に当たって、宅地開発に関する技術に関して2年以上の実務経験を有していない者であっても、開発区域の面積が1ha未満の開発行為に関する設計に係る設計図書を作成することができる。','「土砂災害警戒区域等における土砂災害防止対策の推進に関する法律」に基づき、土砂災害特別警戒区域内において、予定建築物が自己の居住の用に供する住宅である開発行為をしようとする者は、あらかじめ、都道府県知事の許可を受けなければならない。','「宅地建物取引業法」に基づき、宅地建物取引業者は、建築工事の完了前に新築住宅を販売する際には、その広告、契約及び媒介については、建築基準法第6条第1項の確認等所定の処分があった後でなければしてはならない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:1,text:'図-1のように、脚部で固定された柱の頂部に、鉛直荷重N及び水平荷重Qが作用している。柱の断面形状は図-2に示すような長方形断面であり、N及びQは断面の図心に作用しているものとする。柱脚部断面における引張縁応力度、圧縮縁応力度及び最大せん断応力度の組合せとして、正しいものは、次のうちどれか。ただし、柱は全長にわたって等質等断面の弾性部材とし、自重は無視する。また、引張応力度を「+」、圧縮応力度を「-」とする。',choices:['引張縁応力度(N/mm2): +16、圧縮縁応力度(N/mm2): -24、最大せん断応力度(N/mm2): 0.50','引張縁応力度(N/mm2): +16、圧縮縁応力度(N/mm2): -24、最大せん断応力度(N/mm2): 0.75','引張縁応力度(N/mm2): +26、圧縮縁応力度(N/mm2): -34、最大せん断応力度(N/mm2): 0.50','引張縁応力度(N/mm2): +26、圧縮縁応力度(N/mm2): -34、最大せん断応力度(N/mm2): 0.75'],answer:2,hasFigure:true,figureDesc:'図-1: 脚部固定の柱(高さ2,000mm)に頂部で鉛直荷重N=240kN、水平荷重Q=30kNが作用。図-2: 長方形断面(幅300mm、高さ200mm)'},
{year:2021,subject:'構造',no:2,text:'図のような梁A、梁B及び梁Cにそれぞれ荷重Pが作用している場合、梁A、梁B及び梁Cにおける応力、たわみ等の大きさの比(梁A:梁B:梁C)として、最も不適当なものは、次のうちどれか。ただし、全ての梁は同一断面で、全長にわたって等質等断面の弾性部材とし、自重は無視する。',choices:['鉛直方向の支点反力 --- 梁A:梁B:梁C = 1:1:1','最大曲げモーメント --- 梁A:梁B:梁C = 2:1:2','最大せん断力 --- 梁A:梁B:梁C = 1:1:1','荷重点のたわみ --- 梁A:梁B:梁C = 2:1:2'],answer:4,hasFigure:true,figureDesc:'梁A: 単純梁(スパン2l)中央に集中荷重P。梁B: 両端固定梁(スパン2l)中央に集中荷重P。梁C: 一端固定他端ピンの梁(スパン2l)に荷重P'},
{year:2021,subject:'構造',no:3,text:'図のようなラーメンにおいて、A点に鉛直荷重P及びB点に水平荷重αPが作用したとき、A点における曲げモーメントが0になるためのαの値として、正しいものは次のうちどれか。ただし、全ての部材は全長にわたって等質等断面の弾性部材とし、自重は無視する。',choices:['α = 1/2','α = 1','α = 3/2','α = 2'],answer:2,hasFigure:true,figureDesc:'門型ラーメン。柱高さl、梁スパン2l(l+l)。左右柱脚はピン支持。梁上A点に鉛直荷重P、右柱頭B点に水平荷重αP'},
{year:2021,subject:'構造',no:4,text:'図は、2層のラーメンに水平荷重Pが作用したときの、正しい崩壊メカニズムを示したものである。次の記述のうち、最も不適当なものはどれか。ただし、柱及び梁の全塑性モーメントはMpとする。',choices:['図のせん断力Qbは、Mp/l である。','図の鉛直反力Vは、2Mp/l である。','図の水平荷重Pは、2Mp/l である。','図のせん断力Qcは、4Mp/l である。'],answer:4,hasFigure:true,figureDesc:'2層1スパンラーメン。1階柱高さ2l、2階柱高さl、梁スパン2l。各階に水平荷重Pが作用。塑性ヒンジ位置とせん断力Qb、Qc、鉛直反力Vが示されている'},
{year:2021,subject:'構造',no:5,text:'図のような集中荷重Pを受けるトラスA、トラスB及びトラスCにおいて、それぞれのローラー支持点の水平変位δA、δB及びδCの大小関係として、正しいものは、次のうちどれか。ただし、各部材は同一材質の弾性部材とし、斜材の断面積はいずれもa、水平材の断面積はトラスA及びトラスBがa、トラスCが2aとする。',choices:['δA = δC < δB','δA < δC < δB','δC < δA = δB','δC < δA < δB'],answer:3,hasFigure:true,figureDesc:'3つのトラス。いずれも45度の斜材を持つ。トラスA: 鉛直荷重P、トラスB: 水平荷重P、トラスC: 水平荷重Pで水平材断面積2a。各トラスのローラー支点での水平変位δA、δB、δCを求める'},
{year:2021,subject:'構造',no:6,text:'中心圧縮力を受ける正方形断面の長柱の弾性座屈荷重Peに関する次の記述のうち、最も不適当なものはどれか。ただし、柱は全長にわたって等質等断面とする。',choices:['Peは、正方形断面を保ちながら柱断面積が2倍になると4倍になる。','Peは、柱材のヤング係数が2倍になると2倍になる。','Peは、柱の材端条件が「両端ピンの場合」に比べて「一端自由他端固定の場合」のほうが大きくなる。','Peは、柱の材端条件が「一端ピン他端固定の場合」に比べて「両端ピンの場合」のほうが小さくなる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:7,text:'地震時における建築物の振動に関する次の記述のうち、最も不適当なものはどれか。',choices:['地震動の変位応答スペクトルは、一般に、周期が長くなるほど小さくなる。','建築物の固有周期は、質量が同じ場合、水平剛性が大きいものほど短くなる。','建築物の一次固有周期は、一般に、二次固有周期に比べて長い。','鉄筋コンクリート造建築物の内部粘性減衰の減衰定数は、一般に、鉄骨造の建築物に比べて大きい。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:8,text:'建築基準法における荷重及び外力に関する次の記述のうち、最も不適当なものはどれか。',choices:['床の構造計算を行う場合の単位面積当たりの積載荷重の大小関係は、実況に応じて計算しない場合、住宅の居室 < 事務室 < 教室である。','建築物の地上部分における各層の地震層せん断力Qiは、最下層の値が最も大きくなる。','地震時の短期に生ずる力については、特定行政庁が指定する多雪区域においては、積雪荷重を考慮する。','屋根葺き材等に対して定められるピーク風力係数Ĉfは、局部風圧の全風向の場合における最大値に基づいて定められている。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:9,text:'図のような平面の木造軸組工法による平家建ての建築物において、建築基準法における「木造建築物の軸組の設置の基準」(いわゆる四分割法)に関する次の記述のうち、最も不適当なものはどれか。ただし、図中の太線は耐力壁を示し、その軸組の倍率(壁倍率)は全て1とする。なお、この建築物の単位床面積当たりに必要な壁量は15 cm/m2とする。',choices:['「X方向の北側の側端部分」及び「Y方向の東側の側端部分」の必要壁量は、いずれも2.4 mである。','「X方向の南側の側端部分」及び「Y方向の西側の側端部分」の必要壁量は、いずれも1.2 mである。','X方向の壁率比は、0.5である。','Y方向の壁率比は、0.5である。'],answer:3,hasFigure:true,figureDesc:'平面図(8m x 8m)。1mグリッドで太線が耐力壁を示す。北方向の方位記号あり。X方向・Y方向の軸組配置'},
{year:2021,subject:'構造',no:10,text:'木造軸組工法による建築物の設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['片面に同じ構造用合板を2枚重ねて釘打ちした耐力壁の倍率を、その構造用合板を1枚で用いたときの耐力壁の倍率の2倍とした。','軸組に方づえを設けて水平力に抵抗させることとしたので、柱が先行破壊しないことを確認した。','圧縮力と引張力の両方を負担する筋かいとして、厚さ3 cm、幅9 cmの木材を使用した。','地上3階建ての建築物において、構造耐力上主要な1階の柱の小径は、13.5 cmを下回らないようにした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:11,text:'鉄筋コンクリート構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['柱部材は、同じ断面の場合、一般に、内法高さが小さいほど、せん断耐力が大きくなり、靱性は低下する。','コンクリートは圧縮力に強く引張力に弱いので、一般に、同じ断面の柱の場合、大きな軸方向圧縮力を受けるもののほうが靱性は高い。','耐力壁の壁筋の間隔を小さくすると、一般に、耐力壁のひび割れの進展を抑制できる。','柱梁接合部のせん断終局耐力は、一般に、柱梁接合部のコンクリートの圧縮強度が大きくなると増大する。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:12,text:'図に示す鉄筋コンクリート構造の配筋に関する次の記述のうち、最も不適当なものはどれか。ただし、図に記載のない鉄筋は適切に配筋されているものとする。',choices:['梁上端筋の配筋において、ガス圧接継手をスパンの中央部に設けた。','最上階の外柱梁接合部(L形接合部)の配筋において、梁上端筋を機械式定着具で定着した。','スラブの配筋において、スラブの下端筋を梁内に直線定着した。','柱と壁の間に設けた完全スリットにおいて、面外変形を抑えるための鉄筋を設けた。'],answer:2,hasFigure:true,figureDesc:'4つの配筋詳細図。1: 梁上端筋のガス圧接継手。2: 外柱梁接合部(L形)の機械式定着具。3: スラブ下端筋の梁内直線定着。4: 柱と壁の完全スリットに防錆処理した鉄筋'},
{year:2021,subject:'構造',no:13,text:'鉄筋コンクリート構造の許容応力度計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['片側スラブ付き梁部材の曲げ剛性の算定において、スラブの効果を無視して計算を行った。','柱の長期許容曲げモーメントの算定において、コンクリートの引張力の負担を無視して計算を行った。','梁の短期許容せん断力の算定において、主筋のせん断力の負担を無視して計算を行った。','柱の短期許容せん断力の算定において、軸圧縮応力度の効果を無視して計算を行った。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:14,text:'鉄筋コンクリート構造の保有水平耐力計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['増分解析に用いる外力分布は、地震層せん断力係数の建築物の高さ方向の分布を表す係数Aiに基づいて設定した。','全体崩壊形を形成する架構では、構造特性係数Dsは崩壊形を形成した時点の応力等に基づいて算定した。','せん断破壊する耐力壁を有する階では、耐力壁のせん断破壊が生じた時点の層せん断力を当該階の保有水平耐力とした。','付着割裂破壊する柱については、急激な耐力低下のおそれがないので、部材種別をFAとして構造特性係数Dsを算定した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:15,text:'鉄骨構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['横移動が拘束されていないラーメン架構において、柱材の座屈長さは、梁の剛性を高めても節点間距離より小さくすることはできない。','柱及び梁に使用する鋼材の幅厚比の上限値は、建築構造用圧延鋼材SN400Bに比べてSN490Bのほうが大きい。','ラーメン架構の靱性を高めるため、塑性化が想定される部位に降伏比が小さい材料を採用した。','梁の横座屈を防止するための横補剛材を梁の全長にわたって均等間隔に設けることができなかったので、梁の端部に近い部分を主として横補剛する方法を採用した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:16,text:'鉄骨構造の接合部に関する次の記述のうち、最も不適当なものはどれか。',choices:['高力ボルト摩擦接合において、肌すきが1 mmを超えるものについては、母材や添え板と同様の表面処理を施したフィラープレートを挿入し、高力ボルトを締め付けた。','高力ボルト摩擦接合の二面せん断の短期許容せん断応力度を、高力ボルトの基準張力T0(単位 N/mm2)に対し、0.9 T0とした。','基準強度が同じ溶接部について、完全溶込み溶接とすみ肉溶接におけるそれぞれののど断面に対する許容せん断応力度を、同じ値とした。','角形鋼管柱とH形鋼梁の柱梁仕口部において、梁のフランジ、ウェブとも完全溶込み溶接としたので、梁端接部の最大曲げ耐力にはスカラップによる断面欠損の有無を考慮しないこととした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:17,text:'鉄骨構造の設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['ベースプレートの四周にアンカーボルトを用いた露出型柱脚としたので、柱脚には曲げモーメントは生じないものとし、軸方向力及びせん断力に対して柱脚を設計した。','H形鋼梁の横座屈を抑制するため、圧縮側のフランジの横変位を拘束できるように横補剛材を取り付けた。','曲げ剛性に余裕のあるラーメン架構の梁において、梁せいを小さくするために、建築構造用圧延鋼材SN400Bの代わりにSN490Bを用いた。','小梁として、冷間成形角形鋼管を使用したので、横座屈が生じないものとして曲げモーメントに対する断面検定を行った。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:18,text:'鉄骨構造の耐震計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['「ルート1-1」で計算する場合、層間変形角、剛性率、偏心率について確認する必要はない。','「ルート1-2」で計算する場合、梁は、保有耐力横補剛を行う必要はない。','「ルート2」で計算する場合、地階を除き水平力を負担する筋かいの水平力分担率に応じて、地震時の応力を割り増して許容応力度計算を行う必要がある。','「ルート3」で計算する場合、構造特性係数Dsの算定において、柱梁接合部パネルの耐力を考慮する必要はない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:19,text:'土質及び地盤に関する次の記述のうち、最も不適当なものはどれか。',choices:['土の含水比(土粒子の質量に対する土中の水の質量比)は、一般に、砂質土に比べて粘性土のほうが大きい。','飽和土は、土粒子の間隙部分が全て水で満たされている状態にある。','粘性土地盤において、粘土の粒径は、シルトの粒径に比べて大きい。','地盤の許容支持力度は、標準貫入試験によるN値が同じ場合、一般に、砂質土地盤に比べて粘性土地盤のほうが大きい。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:20,text:'地盤の沈下に関する次の記述のうち、最も不適当なものはどれか。',choices:['地震時に地盤が液状化して沈下する原因は、主に砂粒子の間隙水圧の上昇等により、水が砂混じりで地上に噴出するためである。','地盤の変形特性は非線形性状を示すが、通常の設計においては、地盤を等価な弾性体とみなし、即時沈下の計算を行ってもよい。','粘性土を支持層とする場合は、即時沈下だけではなく、圧密沈下も考慮する必要がある。','圧密沈下は、有効応力の増加に伴って、主に土粒子が変形することにより生じる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:21,text:'擁壁及び地下外壁の設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['擁壁の滑動に対する検討において、フーチング底面と支持地盤との間の摩擦係数を、土質にかかわらず一定とした。','擁壁背面側の地表面に、等分布荷重が加わることとしたので、鉛直応力の増加分に土圧係数を乗じた値を、主働土圧に加えた。','常時作用する荷重として、地下外壁に作用する水圧を、地下水位からの三角形分布として求めた。','地下外壁の断面設計に用いる静止土圧係数を、土質試験により信頼性の高い結果が得られなかったので、土質にかかわらず0.5とした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:22,text:'プレストレストコンクリート構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['不静定架構の梁にプレストレス力を導入する場合、曲げ変形と同時に軸方向変形を考慮した不静定二次応力を計算しなければならない。','フルプレストレッシングの設計(I種)は、長期設計荷重時に断面に生じるコンクリートの引張応力を長期許容引張応力度以下に制限するものである。','プレキャストプレストレストコンクリート造の梁を、PC鋼材の緊張により柱と圧着接合する場合、目地モルタルの脱落を防止するために、スターラップ状の曲げ拘束筋やワイヤーメッシュ等による補強を行うことが必要である。','プレストレストコンクリート合成梁では、引張応力が生じるプレキャストプレストレストコンクリート部分と、残りの現場打ち鉄筋コンクリート部分とが一体で挙動できるように、両者を結合する鉄筋を設ける必要がある。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:23,text:'各種建築構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['壁式鉄筋コンクリート構造の建築物では、使用するコンクリートの設計基準強度を高くすると、一般に、必要壁量を小さくすることができる。','壁式鉄筋コンクリート構造と壁式プレキャスト鉄筋コンクリート構造は、一つの建築物の同じ階に混用することができる。','鉄骨鉄筋コンクリート造の埋込み型柱脚の曲げ終局耐力は、柱脚の鉄骨断面の曲げ終局耐力と、柱脚の埋め込み部分の支圧力による曲げ終局耐力の累加により求めることができる。','鉄骨鉄筋コンクリート造の柱では、格子形の非充腹形鉄骨を用いた場合に比べて、フルウェブの充腹形鉄骨を用いた場合のほうが、靱性の向上が期待できる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:24,text:'耐震構造、免震構造及び制振構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築物の耐震性は、一般に、強度と靱性によって評価され、靱性が低い場合には、強度を十分に大きくする必要がある。','免震構造に用いられる、積層ゴムアイソレータの2次形状係数S2(全ゴム層厚に対するゴム直径の比)は、主に座屈荷重や水平剛性に関係する。','免震構造用の積層ゴムにおいて、積層ゴムを構成するゴム1層の厚みを大きくすることは、一般に、鉛直支持能力を向上させる効果がある。','制振構造に用いられる鋼材ダンパー等の履歴減衰型の制振部材は、鋼材等の履歴エネルギー吸収能力を利用するものであり、大地震時には層間変形が小さい段階から当該部材を塑性化させることが有効である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:25,text:'既存鉄筋コンクリート造建築物の耐震診断・改修に関する次の記述のうち、最も不適当なものはどれか。',choices:['垂れ壁や腰壁が付いた柱は、大地震時に垂れ壁や腰壁が付かない柱より先に破壊するおそれがある。','耐震改修において、柱の耐力の向上を図る方法の一つに、「そで壁付き柱の柱とそで壁との間に耐震スリットを設ける方法」がある。','耐震改修において、耐力の向上を図る方法の一つに、「枠付き鉄骨ブレースを増設する方法」がある。','耐震改修において、柱の変形能力の向上を図る方法の一つに、「炭素繊維巻き付け補強」がある。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:26,text:'建築物の構造計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築物の平面形状が細長く、耐力壁が短辺方向の両妻面のみに配置され、剛床と仮定できない場合、両妻面の耐力壁の負担せん断力は、剛床と仮定した場合より大きくなる。','地震時水平力を受けて骨組の水平変形が大きくなると、P-Δ効果による付加的な応力及び水平変形が発生する。','大きいスパンの建築物において、柱を鉄筋コンクリート造、梁を鉄骨造とする場合、異種構造の部材間における応力の伝達を考慮して設計する必要がある。','1階にピロティ階を有する鉄筋コンクリート造建築物において、ピロティ階の独立柱の曲げ降伏による層崩壊を想定する場合、当該階については、地震入力エネルギーの集中を考慮した十分な保有水平耐力を確保する必要がある。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:27,text:'木材及び木質系材料に関する次の記述のうち、最も不適当なものはどれか。',choices:['製材の日本農林規格において、目視等級区分構造用製材は、構造用製材のうち、節、丸身等の材の欠点を目視により測定し、等級区分したものである。','針葉樹は、通直な長大材が得やすく、加工が容易であることから、柱・梁等の構造材をはじめ様々な用途に用いられる。','木材の基準強度は、一般に、せん断に対する基準強度(Fs)に比べて曲げに対する基準強度(Fb)のほうが大きい。','木材の曲げ強度は、樹種が同一の場合、一般に、気乾比重が大きいものほど小さい。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:28,text:'コンクリートに関する次の記述のうち、最も不適当なものはどれか。',choices:['コンクリートの硬化初期の期間中に、コンクリートの温度が想定していた温度より著しく低いと、一般に、強度発現が遅延する。','コンクリートの圧縮強度試験において、一般に、コンクリート供試体の形状が相似の場合、供試体寸法が小さいほど、圧縮強度は大きくなる。','コンクリートの圧縮強度試験用供試体を用いた圧縮強度試験において、荷重速度が速いほど大きい強度を示す。','コンクリートのヤング係数は、一般に、応力ひずみ曲線上における圧縮強度時の点と原点を結ぶ直線の勾配で表される。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:29,text:'鋼材に関する次の記述のうち、最も不適当なものはどれか。',choices:['構造用鋼材では、一般に、炭素量が増加すると、鋼材の強度や硬度が増加するが、靱性や溶接性は低下する。','熱間圧延鋼材の強度は、圧延方向(L方向)や圧延方向に直角な方向(C方向)に比べて、板厚方向(Z方向)は小さい傾向がある。','建築構造用圧延鋼材SN490Bは、降伏点又は耐力の下限値を490 N/mm2とすることのほか、降伏比の上限値や引張強さの下限値等が規定されている。','建築構造用TMCP鋼は、一般に、化学成分の調整と熱加工制御法により製造され、板厚が40 mmを超え100 mm以下の材であっても、40 mm以下の材と同じ基準強度が保証されている。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'構造',no:30,text:'非構造部材等の設計用地震力に関する次の記述のうち、最も不適当なものはどれか。',choices:['補強コンクリートブロック造の塀の構造設計に用いる地震力は、地表面から突出する構造物となる煙突に準じたものとする。','建築物の屋上から突出する水槽等の耐震設計において、転倒等に対して危害を防止するための有効な措置が講じられている場合は、地震力を一定の範囲で減じることができる。','高層建築物に設置する設備機器の耐震設計において、設計用水平震度は、一般に、中間階に比べて上層階のほうを大きくする。','一端固定状態のエスカレーターにおける固定部分の設計用地震力の算定において、設計用鉛直標準震度は、一般に、全ての階で同じ数値とする。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:1,text:'一般的な設計図書に基づく施工計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['監理者は、工事施工者から提出を受けた「品質計画、施工の具体的な計画並びに一工程の施工の確認内容及びその確認を行う段階を定めた施工計画書」のうち、品質計画に係る部分について、承認した。','監理者は、一工程の施工の着手前に、総合施工計画書に基づいて工事施工者が作成する工種別施工計画書のうち、工事の品質に影響を及ぼさない工種を省略することについて、承認した。','設計図書に選ぶべき専門工事業者の候補が記載されていなかったので、設計図書に示された工事の内容・品質を達成し得ると考えられる専門工事業者を、事前に工事施工者と協議したうえで、監理者の責任において選定した。','近隣の安全に対して行う仮設計画で、契約書や設計図書に特別の定めがないものについては、工事施工者の責任において決定した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:2,text:'工事現場の管理等に関する次の記述のうち、最も不適当なものはどれか。',choices:['設計図書間に相違がある場合の適用の優先順位として最も高いものは、一般に、質問回答書である。','公共工事において、特別な要因により工期内に主要な工事材料の日本国内における価格に著しい変動が生じ、請負代金額が不適当となったときは、発注者又は受注者は、請負代金額の変更を請求することができる。','発注者から事務所の建築一式工事(請負代金額が7,000万円以上)を請け負った元請業者が当該工事を施工するために置く監理技術者については、当該工事現場に専任の監理技術者補佐を置いた場合であっても、当該工事現場のほかの工事現場の監理技術者を兼務することはできない。','産業廃棄物の処理を委託する場合、元請業者は、原則として、廃棄物の量にかかわらず、廃棄物の種類ごと、車両ごとのマニフェストにより、廃棄物が適正に運搬されたこと、処分されたこと及び最終処分されたことを確認する。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:3,text:'材料管理及び品質管理に関する次の記述のうち、最も不適当なものはどれか。',choices:['工事現場に仮置きする既製コンクリート杭については、仮置きするための場所が狭かったので、所定の措置を講じたうえで、同径のものを平置きで2段まで積み重ねる計画とした。','コンクリート工事において、計画供用期間の級が「標準」のコンクリートの練混ぜ水として、レディーミクストコンクリート工場で発生するコンクリートの洗浄排水を処理して得られる回収水で、JISに適合することが確認されたものを用いた。','シーリング工事で用いるバックアップ材は、合成樹脂製でシーリング材に変色等の悪影響を及ぼさず、かつ、シーリング材との接着性がよいものを用いた。','木工事に用いる造作材の工事現場搬入時の含水率は、特記がなかったので、15 %以下であることを確認した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:4,text:'建築工事等の届出等に関する次の記述のうち、最も不適当なものはどれか。',choices:['指定確認検査機関による確認を受けた建築物について、特定行政庁が指定した特定工程に係る工事を終えた日から4日以内に到達するように、「中間検査申請書」を建築主事あてに提出した。','騒音規制法による指定地域内において、特定建設作業を伴う建設工事を施工するに当たって、当該特定建設作業の開始の日の7日前までに、「特定建設作業実施届出書」を市町村長あてに届け出た。','特定元方事業者の労働者及び関係請負人の労働者の作業が同一場所において行われる建築工事の着手に当たって、当該作業の開始後、速やかに「特定元方事業者の事業開始報告」を労働基準監督署長あてに行った。','道路に外部足場を設置するに当たって、継続して道路の一部を使用する必要があったので、「道路使用許可申請書」を道路管理者あてに提出した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:5,text:'仮設工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築物の改修工事のための枠組足場を設置する計画において、高さ12 mの枠組足場の組立てから解体までの期間が49日であったので、その計画を労働基準監督署長に届け出なかった。','工事用の資材を上階に運搬するために鉄筋コンクリートの床スラブに設ける仮設用の開口については、補強や復旧等を含む計画書を作成し、監理者の承認を受けた。','ベンチマークから引き出した「各階の通り心と高さの基準になる基準墨」について、監理者の検査を受けた。','移動式クレーンによる荷の吊り上げ作業において、送電電圧6,600 Vの絶縁防護のない配電線からの最小離隔距離(安全距離)については、1.0 mを確保した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:6,text:'土工事及び山留め工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['ウェルポイント工法において、ウェルポイントに接続するライザーパイプについては、揚水能力を確保するために、スリット形ストレーナー管を用いた。','軟弱地盤の掘削において、掘削位置の外周に余裕があったので、ヒーピングを防止するために、山留め壁の背面側の地盤のすき取りを行った。','ディープウェルからの揚水を同一帯水層に復水するリチャージ工法を採用したので、その必要揚水量については、復水しないディープウェル工法を採用した場合より多く計画した。','山留め工事において、切ばりが切ばり支柱の一部と平面的に重なってしまったので、切ばり支柱の一部を切り欠いて、補強を行ったうえで、切ばりを通りよくまっすぐに設置した。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:7,text:'杭地業工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['セメントミルク工法による既製コンクリート杭工事において、掘削時の支持層への到達確認については、掘削機の積分電流計の値から算出したN値によることとした。','セメントミルク工法による既製コンクリート杭工事において、掘削時に支持層への到達確認の記録が取得できない杭については、施工前にあらかじめ定めた代替の手法による記録を到達確認の記録とした。','アースドリル工法による場所打ちコンクリート杭工事において、安定液は、ベントナイトを主体として、分散剤や変質防止剤等を加え、できる限り低粘性・低比重となるように配合した。','オールケーシング工法による場所打ちコンクリート杭工事において、トレミー管及びケーシングチューブの先端は、コンクリート中に2 m以上入っていることを確認した。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:8,text:'図に示す鉄筋工事に関する寸法について、最も不適当なものは、次のうちどれか。ただし、鉄筋はSD345、コンクリートの設計基準強度は24 N/mm2とし、コンクリートの粗骨材の最大寸法は20 mmとする。また、設計図書には特記がないものとし、図に記載のない鉄筋は適切に配筋されているものとする。',choices:['鉄筋(D19)のあき','地上の耐力壁の鉄筋(D13)の継手長さ','大梁の下端筋(D32)の柱内折曲げ定着の投影定着長さ','鉄筋(D25)のガス圧接継手の位置'],answer:2,hasFigure:true,figureDesc:'4つの配筋詳細図。1: リブ付き鉄筋(D19)のあき30mm。2: 耐力壁鉄筋(D13)の継手長さ500mm、打継ぎ位置。3: 大梁下端筋(D32)の柱内折曲げ定着、柱せい800mm、投影定着長さ650mm。4: 鉄筋(D25)のガス圧接継手位置、圧接部間隔400mm'},
{year:2021,subject:'施工',no:9,text:'型枠工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['型枠支保工の構造計算において、通常のポンプ工法による打込み時の積載荷重については、打込み時の作業荷重とそれに伴う衝撃荷重を合わせたものとし、その値を1.5 kN/m2とした。','壁型枠に設ける配管用のスリーブのうち、開口補強が不要であり、かつ、当該スリーブの径が200 mm以下の部分については、特記がなかったので、紙チューブとした。','コンクリートの材齢28日以前に梁下の支保工の取り外しの可否を判断するに当たって、標準養生した供試体の圧縮強度が設計基準強度以上であることを確認した。','計画供用期間の級が「標準」の柱及び壁のせき板の存置期間をコンクリートの材齢により決定するとした施工計画において、存置期間中の平均気温が10 ℃以上15 ℃未満と予想されたので、普通ポルトランドセメントを使用したコンクリートについては、せき板の存置期間を6日とした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:10,text:'表は、コンクリートの計画調合において使用する材料の絶対容積、質量等を記号で表したものである。この表の材料を使用したコンクリートに関する次の記述のうち、最も不適当なものはどれか。ただし、細骨材及び粗骨材は、表面乾燥飽水状態とする。また、化学混和剤としてAE減水剤を使用するものとする。',choices:['コンクリートの強度(N/mm2)は、A/E に比例する。','AE減水剤の使用量(kg/m3)は、E × H/100 である。','細骨材率(%)は、C/(C+D) × 100 である。','フレッシュコンクリートの単位容積質量(kg/m3)は、A + E + F + G である。'],answer:1,hasFigure:true,figureDesc:'表: 単位水量A(kg/m3)、絶対容積(l/m3)としてセメントB、細骨材C、粗骨材D、質量(kg/m3)としてセメントE、細骨材F、粗骨材G、AE減水剤の添加率H(%)'},
{year:2021,subject:'施工',no:11,text:'コンクリート工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['レディーミクストコンクリートの受入検査において、指定したスランプ18 cmに対して、15.5 cmであったので許容した。','鋼管充填コンクリートの落し込み工法において、できる限りコンクリートの分離が生じないように、打込み当初のコンクリートの自由落下高さを1 m以内とした。','設計基準強度60 N/mm2の高強度コンクリートの打込みにおいて、高性能AE減水剤を使用しているので、外気温にかかわらず、練混ぜから打込み終了までの時間の限度を120分とした。','コンクリートの締固めについては、公称棒径45 mmのコンクリート用棒形振動機のほかに、型枠振動機及び木槌を併用したので、棒形振動機の挿入間隔を80 cm程度とした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:12,text:'プレキャスト鉄筋コンクリート工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['プレキャスト部材の製造については、部材の大型化や輸送費の低減を図るために、工事現場に仮設の製造設備や品質管理体制を整え、第三者機関の認定を取得した仮設工場で行う計画とした。','プレキャスト部材に用いるコンクリートの空気量は、特記がなく、凍結融解作用を受けるおそれもなかったので、目標値を4.5 %とした。','計画供用期間の級が「標準」の建築物において、耐久性上有効な仕上げを施すプレキャスト部材の屋外側の設計かぶり厚さは、特記がなかったので、柱・梁・耐力壁については35 mm、床スラブ・屋根スラブについては25 mmとした。','工事現場において、プレキャスト部材のエンクローズ溶接継手については、溶接後の鉄筋の残留応力が過大とならないように、同一接合部の鉄筋の溶接作業を連続して行った。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:13,text:'鉄骨工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['トルシア形高力ボルトによる本接合において、一次締付後に、ボルト・ナット・座金及び母材にわたりマークを施し、専用のレンチを用いてピンテールが破断するまで締付けを行った。','サブマージアーク溶接による完全溶込み溶接において、あらかじめ行った溶接施工試験により十分な溶込みが得られることを確認できたので、監理者の承認を得て、裏はつりを省略した。','受入検査における溶接部の外観検査は、特記がなかったので、表面欠陥及び精度に対する目視検査とし、基準を逸脱していると思われる箇所に対してのみ、適正な器具により測定した。','やむを得ず横向き姿勢で行う軸径16 mmのスタッド溶接については、実際の施工条件に合わせた技量付加試験を実施できなかったので、スタッド溶接技能者の資格種別A級の資格を有する者が行った。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:14,text:'鉄骨工事に関する次の記述のうち、監理者の行為として、最も不適当なものはどれか。',choices:['鉄骨製作工場で行う監理者の検査については、塗装実施前に工事施工者が行う受入検査時に実際に使用する製品に対して直接行った。','板厚が13 mmの鉄骨の高力ボルト用の孔あけ加工において、特記のないものについては、せん断孔あけとし、グラインダーを使用して切断面のばりが除去されていることを確認した。','トルシア形高力ボルト接合の本締めにおいて、トルシア形高力ボルト専用の締付け機が使用できない箇所については、高力六角ボルトに交換して、ナット回転法により適切なボルト張力が導入されたことを確認した。','材料の受入れに当たって、鋼材の種類、形状及び寸法については、規格品証明書の写しに所定の事項が明示され、押印された原本相当規格品証明書により確認した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:15,text:'木造軸組工法の住宅の建築工事に関する次の記述のうち、監理者の行為として、最も不適当なものはどれか。',choices:['柱脚部において、短期許容耐力20 kNのホールダウン金物(引寄せ金物)をホールダウン専用アンカーボルトで緊結する箇所については、アンカーボルトのコンクリートへの埋込み長さが360 mm以上であることを確認した。','出隅にある通し柱と胴差との仕口については、大入れ蟻掛けとし、かね折り金物を当て、六角ボルト締め、スクリュー釘打ちされていることを確認した。','垂木の軒桁への留付けは、ひねり金物を当て、釘打ちされていることを確認した。','2階床梁の継手を追掛け大栓継ぎとする箇所については、上木先端部が柱心より150 mm内外となるように下木が持ち出されていることを確認した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:16,text:'防水工事に関する次の記述のうち、監理者の行為として、最も不適当なものはどれか。',choices:['ウレタンゴム系塗膜防水工事において、補強布の重ね幅については50 mm以上、防水材の塗継ぎの重ね幅については100 mm以上となっていることを確認した。','屋根露出防水密着工法による改質アスファルトシート防水工事において、プレキャストコンクリート部材の接合部の目地については、改質アスファルトシートの張付けに先立ち、増張り用シートを両側に50 mm程度ずつ張り掛けた絶縁増張りが行われていることを確認した。','屋根保護防水密着断熱工法によるアスファルト防水工事に用いる断熱材は、押出法ポリスチレンフォーム断熱材3種bA(スキン層付き)が使用されていることを確認した。','屋根保護防水絶縁工法によるアスファルト防水工事において、平場部の立上り際の500 mm程度の部分については、立上り部の1層目のアスファルトルーフィング類がアスファルトを用いた密着張りとなっていることを確認した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:17,text:'左官工事、タイル工事及び石工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['床コンクリート直均し仕上げにおいて、ビニル床シートの下地となる床コンクリートの仕上りの平坦さの標準値については、特記がなかったので、1 mにつき10 mm以下とした。','セメントモルタルによるタイル後張り工法において、床タイル張り面の伸縮調整目地の位置については、特記がなかったので、縦・横ともに4 m以内ごとに設けた。','セメントモルタルによるタイル後張り工法において、外壁タイルの引張接着強度を確認する試験体の個数については、100 m2ごと及びその端数につき1個以上とし、かつ、全体で3個以上とした。','内壁空積工法による石工事において、幅木の裏には、全面に裏込めモルタルを充填した。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:18,text:'金属工事及びガラス工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['軽量鉄骨壁下地において、スタッドの間隔については、特記がなかったので、ボード2枚張りとする箇所を450 mm程度、ボード1枚張りとする箇所を300 mm程度とした。','軽量鉄骨天井下地において、野縁及び野縁受は、特記がなかったので、屋内を25形、屋外を19形とした。','外部に面する網入り板ガラスの「下辺小口」及び「縦小口下端から1/4の高さまでの部分」には、ガラス用防錆塗料を用いて防錆処置を行った。','ガラスブロック積み工法において、伸縮調整目地については、特記がなかったので、6 m以内ごとに幅20 mm程度のものを設けた。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:19,text:'内外装工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['タイルカーペット全面接着工法における接着剤については、粘着はく離(ピールアップ)形とした。','断熱材現場発泡工法における断熱材の吹付け厚さを確認する確認ピンの本数は、スラブ下面及び壁面については5 m2につき1箇所以上、柱及び梁については1面につき各1箇所以上とし、確認ピンはそのまま存置した。','複層仕上塗材仕上げにおいて、主材の塗付けについては、仕上げの形状が凹凸状の部分を吹付けとし、仕上げの形状がゆず肌状の部分をローラー塗りとした。','外壁に使用する押出成形セメント板(ECP)のパネル相互の目地幅については、特記がなかったので、長辺及び短辺ともに10 mmとした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:20,text:'設備工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['鉄筋コンクリートの躯体に埋設する合成樹脂製可とう電線管(PF管)について、壁付きでない梁の横断配管は、多数の管をまとめて横断させないようにするとともに、柱際から梁せい寸法以内の範囲での横断を避けた。','蒸気給気管の配管については、先上り管勾配を1/250、先下り管勾配を1/80とした。','電気設備工事において、鋼製ケーブルラックの水平支持間隔を2 m以内とし、直線部と直線部以外との接続部では、接続部に近い箇所及びケーブルラック端部に近い箇所で支持した。','屋外で雨水排水横主管と汚水排水横主管とを接続するに当たり、接続する部分に設ける排水ますのほかに、雨水排水横主管にトラップますを設けた。'],answer:2,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:21,text:'各部工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['銅板葺屋根に取り付ける軒樋については、耐候性を考慮して、銅との電位差が大きい溶融亜鉛めっき鋼板製のものとした。','防火区画の壁を貫通するダクトにおいて、防火区画に近接して防火ダンパーを設けるに当たり、当該防火ダンパーと当該防火区画との間のダクトは、厚さ1.6 mmの鉄板で造られたものとした。','金属板による折板葺において、タイトフレームと受け梁との接合については、風による繰返し荷重による緩みを防止するため、ボルト接合とせずにすみ肉溶接とした。','軽量鉄骨間仕切壁内に配管する合成樹脂製可とう電線管(PF管)については、バインド線を用いて支持し、その支持間隔を1.5 m以下とした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:22,text:'耐震改修工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['既存柱と壁との接合部に耐震スリットを新設する工事において、既存の壁の切断に用いる機器を固定する「あと施工アンカー」については、柱や梁への打込みを避け、垂れ壁や腰壁に打ち込んだ。','あと施工アンカー施工後の確認試験については、特記がなかったので、引張試験機による引張試験とし、1日に施工された「あと施工アンカー」の径及び仕様ごとにロットを構成した。','鉄筋コンクリートの増打ち耐震壁の増設工事において、増設壁の鉄筋の既存柱への定着は、既存柱を斫って露出させた柱主筋に、増設壁の鉄筋端部を135度に折り曲げたフックをかけた。','金属系アンカーの「あと施工アンカー工事」において、特記がなかったので、打込み方式のアンカーは所定の位置まで打込むことにより固着させ、締付け方式のアンカーはナット回転法で締め付けることにより固着させた。'],answer:4,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:23,text:'各種改修工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['防水改修工事において、既存保護コンクリートの撤去は、躯体や仕上げ材に損傷を与えないように、質量10 kgのハンドブレーカーを使用した。','防水改修工事におけるルーフドレン回りの処理に当たって、防水層及び保護層の撤去端部は、既存の防水層や保護層を含め、ポリマーセメントモルタルで、1/2程度の勾配に仕上げた。','かぶせ工法によるアルミニウム製建具の改修工事において、既存枠への新規建具の取付けについては小ねじ留めとし、留め付けについては、端部を100 mm、中間部の間隔を500 mmとした。','内装改修工事において、特定天井の天井下地に該当しない軽量鉄骨天井下地(吊りボルト受け等の間隔が900 mm程度以下かつ天井面構成部材等の単位面積当たりの質量が20 kg/m2以内)を新設するに当たって、再利用する既存の埋込みインサートについては、特記がなかったので、工事の当該階の3箇所に対してそれぞれ400 Nの荷重による吊りボルトの引抜き試験を行った。'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:24,text:'建築工事に関する用語とその説明の組合せとして、最も不適当なものは、次のうちどれか。',choices:['歩掛り --- 建築の各部分工事の原価計算における原単位的な概念で、部分工事量の1単位当たりの標準労働量、標準資材量等のこと','クリープ現象 --- 材料や部材に一定の荷重が持続することによって時間とともにひずみが増大する現象','スライディングフォーム工法 --- 構造物を解体しないで、機械又は人力によって水平移動させ、あらかじめ造られた基礎の上に移す工法','リフトアップ工法 --- 地上等の低所であらかじめ組み立てた大スパン構造の屋根架構等をジャッキ又は吊上げ装置を用いて所定の位置まで上昇させ設置する工法'],answer:3,hasFigure:false,figureDesc:''},
{year:2021,subject:'施工',no:25,text:'建築物の工事請負契約に関する次の記述のうち、民間(七会)連合協定「工事請負契約約款」に照らして、最も不適当なものはどれか。',choices:['天災により生じた損害について、発注者及び受注者が協議して重大なものと認め、かつ、受注者が善良な管理者として注意をしたと認められるものは、発注者及び受注者がこれを負担する。','受注者は、工事の施工中、この工事の出来形部分と工事現場に搬入した、工事材料、建築設備の機器等に火災保険又は建設工事保険を付し、その証券の写しを発注者に提出する。','発注者は、工期の変更をするときは、変更後の工期をこの工事を施工するために通常必要と認められる期間に比べて著しく短い期間としてはならない。','発注者が工事を著しく減少したため、請負代金額が2/3以上減少したとき、受注者は書面をもって発注者に通知して直ちに契約を解除することができる。'],answer:1,hasFigure:false,figureDesc:''}
,
{year:2020,subject:'計画',no:1,text:'建築士の職責、業務等に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築士は、新たにつくる建築物について、長期間の使用に耐えるように建築計画の初期段階から十分に検討を行い、完成した後も継続的に適正な維持管理が行われるように配慮する必要がある。','建築士は、他人の求めに応じ報酬を得て、建築物に関する調査及び鑑定のみを業として行う場合、建築士事務所に所属せずに業務を行うことができる。','建築士は、違反建築物の建築等の法令違反行為について、指示をする、相談に応じる等の行為をしてはならない。','建築士は、設計者ではなく施工者として建築基準関係規定に違反する工事を行った場合であっても、建築士法により業務停止処分を受けることがある。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'計画',no:2,text:'日本の歴史的な建築物に関する次の記述のうち、最も不適当なものはどれか。',choices:['東三条殿(平安時代)などの寝殿造りは、柱は丸柱とし、寝殿の周囲には蔀戸を吊り、床は板敷きであったといわれている。','鹿苑寺金閣(室町時代)は、最上層を禅宗様仏堂風、中間層を和様仏堂風、初層を住宅風とした三層の建築物である。','光浄院客殿(安土桃山時代)は、欄間や長押をはじめ、建具や金具、釘隠や引手などに技巧を凝らし、様々な意匠が施された数寄屋風の建築物である。','旧開智学校校舎(明治時代)は、アーチや隅石等の洋風の意匠と唐破風等の和風の意匠が混在した擬洋風の建築物である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'計画',no:3,text:'西洋の歴史的な建築物とその背景との組合せとして、最も不適当なものは、次のうちどれか。',choices:['大英博物館(イギリス、1824-47年) ── 考古学の成果に基づく古代ギリシアや古代ローマ建築の研究及び正確な理解を通じ、その造形原理の復興を試みた新古典主義を背景としている。','タッセル邸(ベルギー、1893年) ── 植物の茎や葉、長い髪などの自然物をモチーフとした非対称な曲線や曲面を造形に用いたアール・ヌーヴォーを背景としている。','ウィーン郵便貯金局(オーストリア、1906年) ── 機械生産による低品質な製品を否定し、工業化社会における芸術性を中世的な手工芸に求めたアーツ・アンド・クラフツ運動を背景としている。','シュレーダー邸(オランダ、1924年) ── 対象を幾何学によって客観的かつ普遍的に表現するために、要素を水平・垂直の線や面で構成し、三原色と無彩色を使用するデ・スティルを背景としている。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'計画',no:4,text:'高齢者、障害者等に配慮した屋内競技場の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['幅150cmの屋内廊下に面して設けた障害者等が利用する居室の出入口は、有効幅員を90cmとした。','オストメイト用設備を有する便房において、汚物流しの近くに着替え台を設けた。','車椅子使用者用の観覧席は、複数の車椅子使用者が利用できる専用スペースとして、異なる場所に分散して2箇所設けた。','屋内階段において、高齢者が段差の存在を知覚できるように、踏面と段鼻との輝度比を1.0とした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'計画',no:5,text:'建築物の外壁に関する次の記述のうち、最も不適当なものはどれか。',choices:['外壁に設置する排気口や給気口の防水が難しいので、ダクトを外壁に向かって下がり勾配とし、浸入した雨水を排出できるようにした。','カーテンウォール等の外壁について、部材間の接合部から雨水が浸入することを防ぐため、内外の空気圧を等圧にすることにより重力で排水するフィルドジョイントとした。','地震時の躯体の層間変位を考慮して、上部又は下部のファスナーをスライドさせて追従させるパネル方式のメタルカーテンウォールを採用した。','外装にカーテンウォールを使用するに当たり、シーリング材の耐久年数は、外壁の耐久年数よりも短いことが多いので、雨水が浸入した場合の排水機構を設けた。'],answer:2,hasFigure:false,figureDesc:''},
{year:2020,subject:'計画',no:6,text:'建築物の防災計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['災害時に防災拠点となる庁舎において、仮設修復足場としての利用やガラス落下防止等のために、建築物外周にバルコニーを設ける計画とした。','浸水深さを5mと想定した沿岸型の災害拠点建築物において、1・2階の外壁の大部分をガラスカーテンウォールとして津波被災時には破壊・脱落させ、4階以上の重要な拠点部分の機能を守る計画とした。','高層の集合住宅に設ける備蓄倉庫は、避難階のほかに、100住戸ごとに、かつ、いずれの階からも4層以内の位置に計画した。','災害時の避難場所の仮設トイレは、全てマンホールトイレとし、避難者200人当たり1基を目安とする計画とした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'計画',no:7,text:'30階建ての事務所ビルの計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['基準階の平面計画において、南北面にコアを配置して窓を減らすことで、熱負荷の影響を軽減した。','防災計画上の避難経路は、日常動線に配慮し、第1次安全区画である廊下から第2次安全区画である特別避難階段の付室を通じて、特別避難階段に避難できるように計画した。','エレベーターの運行方式は、建築物を10層ごとに三つのゾーンに分割して各ゾーンにエレベーター群を割り当てるコンベンショナルゾーニング方式とした。','非常用エレベーターは荷物用エレベーターと兼用することとし、その乗降ロビーは特別避難階段の付室と兼用する計画とした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'計画',no:8,text:'建築物等の各部の寸法等に関する次の記述のうち、最も不適当なものはどれか。',choices:['公共体育館の計画において、成人用バスケットボールコートを二面配置するため、床面の内法寸法を、40m×50mとした。','屋内の公式試合用の硬式テニスコートについて、ネット上部の天井高を、13mとした。','競技場の観客席の固定座席の計画において、座席の幅(1人分の間口)を45cmとし、前後間隔(椅子の背の間隔)を85cmとした。','屋内駐車場の計画において、一方通行の小型自動車の車路のうち、車路に接して駐車料金の徴収施設が設けられている場所で、歩行者の通行の用に供しない部分の幅員を、2.5mとした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'計画',no:9,text:'図は、高齢者、障害者等の利用に配慮した階段の計画案の模式図である。「高齢者、障害者等の円滑な移動等に配慮した建築設計標準(国土交通省)」に照らして、最も不適当なものは、次のうちどれか。',choices:['手すりは、階段の上端で水平に延長する部分Aを30cmとして、踊場にも連続させて設置した。','手すりを上下に2本設置するに当たり、下段の手すりの高さBを段鼻から60cmとした。','点状ブロックCを、階段手前30cmの位置に敷設した。','階段の有効幅員Dは、手すりの幅10cmはないものとみなし、140cmとした。'],answer:1,hasFigure:true,figureDesc:'高齢者・障害者等の利用に配慮した階段の計画案の模式図。階段の側面図と正面図が示されており、A（手すりの上端水平延長部分）、B（下段手すりの高さ）、C（点状ブロックの位置）、D（階段の有効幅員）の各部分が示されている。'},
{year:2020,subject:'計画',no:10,text:'交通手段を考慮した都市計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['セミモールは、都市部や商業地などで歩行者空間を充実させたモールにおいて、一般車両の乗り入れを禁止し、路面電車やバスを通行させるものである。','キスアンドライドは、出発地から公共交通機関の乗降所(駅やバス停等)まで家族等が自動車で送迎する交通形態のことである。','BRTは、バス専用道路などを活用して高い定時性を確保し、連節車両を用いることや停車時間短縮の工夫を取り入れること等により、高い輸送能力を確保するバス交通システムである。','フリンジパーキングは、都市中心部の周辺に駐車場を整備し、そこから公共交通機関等により都市中心部までアクセスするシステムであり、都市中心部への車の流入の抑制等を目的とするものである。'],answer:1,hasFigure:false,figureDesc:''},
{year:2020,subject:'計画',no:11,text:'歴史的資産を活かしたまちづくりに関する次の記述のうち、最も不適当なものはどれか。',choices:['青森県黒石市では、中町の「こみせ」と呼ばれる降雪や日差しを避けて通れるようにした木造の軒下の歩廊が続く町並みを、伝統的建造物群保存地区に指定し、保存に取り組んでいる。','静岡県掛川市では、「生涯学習都市宣言」を行い、その一環として官民が協力し、地区計画を定めて掛川城の城下町としての歴史を活かした城下町風まちづくりを推進している。','岡山県倉敷市では、本瓦葺塗屋造りの町屋、土蔵造りの蔵、白漆喰になまこ壁が建ち並ぶ倉敷川畔を「美観地区」とし、景観の保全を図っている。','鹿児島県南九州市の知覧では、「パタン・ランゲージ」に範をとったまちづくり規範により、明治時代の大火からの復興によって形成された、蔵造りの歴史的町並み景観の保全が実践されている。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'計画',no:12,text:'集合住宅・住宅団地の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['同潤会江戸川アパート(東京都、1934年)は、社交室、共同浴場、食堂、洗濯場等の付帯施設を有する集合住宅として計画された。','コモンシティ星田A2(大阪府、1992年)は、敷地内の緩斜面を活かした緑道の配置や、塀・門を極力設けない外構計画等により、連続した開放的な外部空間を創り出した戸建ての住宅団地として計画された。','幕張ベイタウンパティオス4番街(千葉県、1995年)は、高層板状住棟による高密度な賃貸集合住宅であり、住戸には、仕事場等として使用できる開放的なf-ルーム(ホワイエルーム)が設けられ、中廊下やコモンテラスと連続して計画された。','釜石・平田地区仮設住宅団地(岩手県、2011年)は、東日本大震災の復興支援の一環として建設されたコミュニティケア型仮設住宅団地であり、診療所付きのサポートセンターや仮設店舗が計画された。'],answer:3,hasFigure:false,figureDesc:''},
{year:2020,subject:'計画',no:13,text:'集合住宅・住宅団地の改修の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['北側に階段室をもつ階段室型の5階建て集合住宅において、バリアフリー改修のため、北側に廊下棟を増築し、ここに着床するエレベーターを設置するとともに増築した廊下に面して各住戸の新しい玄関を設置した。','既存の集合住宅をサービス付き高齢者向け住宅とするため、バリアフリー改修を施し、各住戸専用部分の床面積が25m²以上となるようにした。','分譲集合住宅の共用部分において、形状の著しい変更を伴わない大規模修繕工事について、区分所有者数及び議決権の各過半数の決議を経て行うこととした。','住宅団地内の道路の改修において、歩車共存を目的として、車の通行部分を蛇行させスピードを落とさせるラドバーン方式を採用した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2020,subject:'計画',no:14,text:'事務所ビルに関する次の記述のうち、最も不適当なものはどれか。',choices:['ジョンソン・ワックス・ビル(アメリカ、1936年)の2層吹抜けの執務スペースでは、天井付近が広がった樹木状の柱や柱頭まわりの天窓、ハイサイドライトによって、内部に自然を再現している。','フォード財団本部ビル(アメリカ、1967年)は、ビル内部に豊かな植栽が施されたアトリウムをもち、各フロアの執務スペースはアトリウムをL字型に囲むように配置されている。','丸の内ビルディング(東京都、2002年)の高層階のオフィスゾーンは、中央にアトリウムを設け、事務室沿いの廊下をアトリウムに面して配置しており、その廊下から建築物のどこの位置に自分がいるのかを把握することができる。','ROKI Global Innovation Center(静岡県、2013年)は、執務スペースが階段状に積層する立体的なワンルーム空間に、ガラスをはめこんだ木と鉄のハイブリッドトラスの屋根をかけ、自然光を通すフィルターを使用した天幕を設けている。'],answer:3,hasFigure:false,figureDesc:''},
