{year:2017,subject:'計画',no:6,text:'建築物の各部の寸法等に関する次の記述のうち、最も不適当なものはどれか。',choices:['事務所ビルの事務室において、椅子に座った状態で室内の見通しをよくするためにパーティションの高さを床面から110 cmとした。','幼稚園において、子ども用足洗い場については床に5％程度の勾配をとり、子ども用手洗い場についてはその高さを床面から65 cmとした。','小学校において、居心地のよさや落着き感に考慮しつつ、教室の天井高さを2.7 mとした。','病院の4床室の病室において、隣り合うベッドとベッドの間に幅1 m以上のスペースを確保するため、その床面積を患者一人につき8 m²とした。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'計画',no:7,text:'建築物の各部の寸法等に関する次の記述のうち、最も不適当なものはどれか。',choices:['乗用エレベーター(定員24人)は、かごの内法寸法が間口2,150 mm×奥行1,600 mmのものを採用した。','建築物の主要な出入口の有効幅員を1,500 mmとし、その他の出入口の有効幅員を1,000 mmとした。','自走式の立体駐車場における自動車の車路において、傾斜部の本勾配を1/5とし、傾斜部の始まりと終わりのそれぞれの長さ6 mの部分の緩和勾配を1/10とした。','多人数の成人が使用する洗面所において、隣り合う洗面器の中心間距離を850 mmとした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'計画',no:8,text:'屋内階段に関する次の記述のうち、「高齢者、障害者等の円滑な移動等に配慮した建築設計標準(国土交通省)」に照らして、最も不適当なものはどれか。',choices:['階段の両側の壁に手すりを設けるに当たり、その手すりの端部は、階段の上端では水平に45 cm延長させ、下端では斜め部分も含めて段鼻から45 cm延長させた。','階段に上下2本の手すりを設けるに当たり、その上段の手すりの高さを80 cmとし、下段の手すりの高さを60 cmとした。','階段の蹴上げを15 cm、踏面を32 cm、蹴込みを1 cmとした。','階段上端部と連続する床については、視覚障がい者が段を認識できるように、段の手前5 cmの位置に線状ブロックを敷設した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'計画',no:9,text:'便所・洗面所に関する次の記述のうち、「高齢者、障害者等の円滑な移動等に配慮した建築設計標準(国土交通省)」に照らして、最も不適当なものはどれか。',choices:['オストメイト用設備を有する便房の汚物流しに設ける水栓は、湯温調整付きレバーハンドル型混合水栓とした。','オストメイト用設備を有する便房には、ストーマ装具や関連の小物等を置くことができる手荷物置き台(カウンター)を設置した。','車いす使用者用便房に設置する洗面器の鏡は、幅35 cm×高さ45 cmの大きさとし、車いす使用者の利用に配慮し傾斜させて設置した。','車いす使用者用便房に設置する手すりは、便器の側壁側にL型手すりを設けるとともに、他方には可動手すりを設け、それらの水平部はいずれも便座の座面から25 cmの高さとした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'計画',no:10,text:'都市計画・都市デザインに関する次の記述のうち、最も不適当なものはどれか。',choices:['後藤新平らが主導した関東大震災からの「帝都復興事業」においては、鉄筋コンクリート造により不燃化・耐震化した復興小学校を建設し、隣接して小公園を整備した。','ル・コルビュジエの「パリのヴォワザン計画」においては、一部の歴史的建造物を保存しつつ、古い街区や建築物を大規模に取り壊し、幹線道路等を整備したうえで、超高層ビルに建て替える提案をした。','丹下健三の「東京計画1960」においては、人口の過剰集中による諸問題に対し、東京湾を全面的に埋め立て、放射状の都市構造をつくりだす提案をした。','フランソワ・ミッテランらが主導したパリの都市計画である「グラン・プロジェ」においては、フランス革命200年を記念して、ルーブル美術館の大改修やオルセー駅舎の美術館への転用等、拠点整備による都市の再生を進めた。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'計画',no:11,text:'都市計画等に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築基準法に基づく、いわゆる「連担建築物設計制度」は、都市機能の更新や、優れた都市空間の形成・保全を図ることを目的に、都市計画法と建築基準法による制限の一部を適用せず、街区単位に都市計画を定め、建築物等を個々に認定する制度である。','都市計画法に基づく「地区計画」は、地区の課題や特徴を踏まえ、住民と市町村とが連携しながら、地区の目指すべき将来像を設定し、その実現に向けて「まちづくり」を進めていく手法である。','文化財保護法に基づく「登録有形文化財登録基準」の建造物の部では、原則として、建設後50年を経過し、かつ、一定の基準に該当する建築、土木構造物及びその他の工作物が、文化財登録原簿への登録の対象となる。','都市緑地法に基づく「緑化地域」は、緑地が不足している市街地等において、一定規模以上の建築物の新築や増築を行う場合に、敷地面積の一定割合以上の緑化が義務付けられる地域である。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'計画',no:12,text:'住宅の作品(設計者)に関する次の記述のうち、最も不適当なものはどれか。',choices:['ファンズワース邸(ミース・ファン・デル・ローエ)は、広大な敷地に建つ週末住宅であり、H形鋼の柱に溶接された梁を介して屋根スラブ及び床スラブを取り付けた構造に特徴がある。','シュレーダー邸(ヘリット・トーマス・リートフェルト)は、建具や家具による住空間づくりに特徴があり、2階は一つの広い空間として使用することも、また可動の間仕切りにより、小さく区分けすることもできる。','前川自邸(前川 國男)は、都市部の約20 m²の狭小な敷地に、住空間を機能別に積層し構成した住宅である。','原自邸(原 広司)は、玄関から吹抜けを通過してバルコニーまで降りてゆく廊下の両側に居室を配置し、トップライトから自然光を取り入れた住宅である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'計画',no:13,text:'住宅に関する次の記述のうち、最も不適当なものはどれか。',choices:['かんかん森(東京都)は、各住戸の独立性を保ちつつ、居住者が共同で使用することができる居間や台所等を設置して、コモンミールや掃除等、生活の一部を共同化している、コレクティブハウスである。','SHARE yaraicho(東京都)は、道路に面する部分は巨大な半透明のテント膜で覆われ、内部は吹抜け空間を介して個室7室とコモンスペースが計画された、シェアハウスである。','泉北ニュータウン(大阪府)は、空き住戸を活用したサポート付き共同住宅や戸建て住宅を活用した多世代型シェアハウス等の試みが行われている、大規模なニュータウンである。','求道學舎(東京都)は、居住者が共同生活をすることに重点を置き、居間や浴室等のコモンスペースの充実を図った、テラスハウスである。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'計画',no:14,text:'大規模で高層の事務所ビルの防災計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['非常用エレベーターの乗降ロビーは、消防隊が消火活動拠点として利用するため、その面積は、非常用エレベーター1台につき15 m²以上と定められている。','エレベーター、階段等を含むコアの配置のうち片寄せタイプについては、一般に、避難上不利な点が多く、その採用に当たっては、シミュレーションや実験等により安全性を確認することが望ましい。','火災の拡大を防止するためには、出火の可能性が高いエリア(部分)に、防火上有効な区画を設けるとともに、初期消火設備の設置や不燃性のある建築材料を使用することが求められる。','屋上に緊急離着陸場を設けた場合、そのスペースは、在館者の救助に使用されるとともに消防隊の突入時にも利用される。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'計画',no:15,text:'災害に関連した建築物等の整備に関する次の記述のうち、最も不適当なものはどれか。',choices:['「指定緊急避難場所」としての施設は、災害が発生した場合、又は発生するおそれがある場合にその危険から逃れるための避難場所であり、洪水等に係るものについては、想定される洪水等の水位以上の高さに避難スペースを配置する必要がある。','「基幹災害拠点病院」には、病院機能を維持するために必要な全ての施設が地震等に対して安全な構造を有すること、敷地内にヘリポートを有すること等が求められている。','「応急仮設住宅」のうち「借上型仮設住宅」は、地方自治体が民間賃貸住宅を借り上げて供与することをいい、東日本大震災以降は「みなし仮設住宅」とも呼ばれているものである。','「応急仮設住宅」のうち「建設型仮設住宅」は、災害発生後に速やかに建設され、恒久的に供与されるものである。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'計画',no:16,text:'医療・福祉等の用語に関する次の記述のうち、最も不適当なものはどれか。',choices:['「介護老人保健施設」は、医療ケアを必要とする要介護者に対し、看護や医学的管理下における介護及び機能訓練等並びに日常生活上の世話を行うことにより、入所者が自立した日常生活を営むことや居宅における生活への復帰を目指す施設である。','「急性期リハビリテーション」は、疾患に応じ90日から180日をかけて身体の機能や日常生活動作(ADL)の改善を目指すことであり、専門リハビリテーション医療機能をもつ医療施設で行われている。','「放課後等デイサービス事業所」は、就学中の障がい児に対して、放課後や夏休み等の長期休暇中において、生活能力の向上のための訓練や支援等を継続的に提供するもので、指導訓練室や支援に必要な設備・備品等を備えることが求められている。','「日本版CCRC(Continuing Care Retirement Community)」は、大都市に在住する高齢者が健康な段階から地方へ移住し、地域活動に積極的に参加することをとおして、地域社会に溶け込み、多世代と交流・共働する居住が基本となっている。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'計画',no:17,text:'図書館(設計者等)に関する次の記述のうち、最も不適当なものはどれか。',choices:['ベルリン自由大学図書館(フォスター・アンド・パートナーズ)は、傾斜した巨大な円盤状の屋根構造をもち、外壁には世界各地・各時代の文字が彫り込まれている。','フランス国立図書館(ドミニク・ペロー)は、緑豊かな中庭をもつロの字型の基壇部と、その四隅に配置されたL字型の高層タワーから構成されている。','シアトル中央図書館(OMA)は、外観全体が格子状の鉄骨とガラスで構成され、室内空間に外光を導いている。','ストックホルム市立図書館(エーリック・グンナール・アスプルンド)は、円筒と直方体が組み合わされた外観をもち、巨大な円筒の内部には、壁に沿って書架があり、中央にサービスデスクが設けられている。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'計画',no:18,text:'工事監理等に関する次の記述のうち、最も不適当なものはどれか。',choices:['「工事監理」、「工事と設計図書との照合及び確認の結果報告等」及び「工事監理の結果報告」は、建築士法における、いわゆる「建築士の独占業務」に該当する。','工事監理の具体的で詳細な実施方法(工事と設計図書との照合及び確認の具体的な対象、方法や業務の範囲)は、建築士法では定められていない。','建築士事務所が行う監理業務には、一般に、「工事請負契約の目的物の引渡しの立会い」と「工事費支払いの審査」が含まれる。','工事監理を行う一級建築士は、所定の登録講習機関が実施する監理技術者講習を受講しなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'計画',no:19,text:'図のような根切りについて、建築工事建築数量積算研究会「建築数量積算基準(平成23年版)」に照らして、「法付け工法における作業上のゆとり幅」と「山留め工法における余幅」との組合せとして、正しいものは、次のうちどれか。なお、図は略図とする。',choices:['作業上のゆとり幅(法付け工法の場合): 0.1 m ／ 余幅(山留め工法の場合): 0.5 m','作業上のゆとり幅(法付け工法の場合): 0.3 m ／ 余幅(山留め工法の場合): 0.5 m','作業上のゆとり幅(法付け工法の場合): 0.5 m ／ 余幅(山留め工法の場合): 1.0 m','作業上のゆとり幅(法付け工法の場合): 1.0 m ／ 余幅(山留め工法の場合): 1.0 m'],answer:3,hasFigure:true,figureDesc:'法付け工法と山留め工法の根切り断面略図。根切り深さ=2m。法付け工法では基礎の外側に作業上のゆとり幅を設け、山留め工法では矢板と基礎の間に余幅を設ける。'},
{year:2017,subject:'計画',no:20,text:'建築のマネジメントに関する次の記述のうち、最も不適当なものはどれか。',choices:['不動産分野におけるアセットマネジメントは、不動産の所有者や投資家を代行して、テナント対応や建築物の維持管理、運営までを含めた一連の不動産業務を行うことである。','デザインビルドは、建築物の企画から、設計、施工、維持管理までの業務について、コストや工期、品質情報等の全てのデータを統合した三次元モデルを活用して行う手法である。','BOTは、公共サービスに関わる建築物を民間が建設して一定期間運営し、期間満了後に行政に移管する仕組みのことである。','LCMは、建築物の機能や効用の維持・向上を、通常、建築物の企画から解体・廃棄処分まで、適切なコストのもとで管理・実行することをいい、LCCの低減を行うことが目的の一つである。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'環境・設備',no:1,text:'環境工学における用語に関する次の記述のうち、最も不適当なものはどれか。',choices:['色度は、色の明度と彩度の二つの属性を含めた知覚的評価の指標である。','音の回折は、音波の伝搬空間に障害物がある場合に、障害物の背後に音が回り込んで伝搬する現象であり、障害物の大きさよりも音の波長が大きいほど回り込みやすい。','壁体の定常伝熱は、壁体の両面の空気温度又は表面温度を長時間一定に保った後も、壁体内の各部の温度が時間の経過によって変化せず、熱流量が一定な場合の伝熱過程をいう。','建築物の壁面に沿った風の流れが、隅角部で建築物から離れる現象を、一般に、剥離流という。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'環境・設備',no:2,text:'室内の温熱・空気環境に関する次の記述のうち、最も不適当なものはどれか。',choices:['予測平均温冷感申告(PMV)は、主に均一な環境に対する温熱快適指標であることから、不均一な放射環境や上下温度分布が大きな環境等に対しては、適切に評価できない場合がある。','中央管理方式の空気調和設備を設ける居室においては、浮遊粉じんの量を概ね0.15 mg/m³以下とする。','室内の酸素濃度が18％近くに低下した場合、人体に対しては生理的に大きな影響を与えにくいが、開放型燃焼器具の不完全燃焼をもたらすおそれがある。','平均放射温度(MRT)は、室温によらず、グローブ温度及び気流速度の計測値から概算で求められる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'環境・設備',no:3,text:'換気に関する次の記述のうち、最も不適当なものはどれか。',choices:['容積の異なる二つの室において、それぞれの室内の二酸化炭素発生量及び換気回数が同じ場合、定常状態での室内の二酸化炭素濃度は、一般に、容積が大きい室より小さい室のほうが高くなる。','汚染物質が発生している室の必要換気量は、定常状態を想定した場合、室の容積によらず、その室の汚染物質の発生量、許容濃度及び外気中の汚染物質の濃度により求めることができる。','外気に面して上下に同じ大きさの二つの開口部がある室において、無風の条件で温度差換気を行う場合、換気量は、「内外温度差」及び「開口高さの差」に比例する。','手術室やクリーンルーム等のように、汚染空気が周囲から流入してはならない室においては、第二種機械換気又は室内の気圧を周囲よりも高くした第一種機械換気とする。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'環境・設備',no:4,text:'図は、冬期において、定常状態にある外壁の内部及び周囲の温度分布を示したものである。次の記述のうち、最も不適当なものはどれか。ただし、図中の屋外温度t₀、室内温度tᵢ及び材料の厚さdの条件は変わらないものとする。',choices:['材料(A)は、材料(B)より熱伝導率が大きい。','材料(A)の熱伝導率を大きくすると、材料(B)の各部分の温度が下がる。','材料(B)の熱伝導率を大きくすると、材料(A)の各部分の温度が上がる。','室内表面結露の防止には、材料(A)と材料(B)を入れ替えると効果的である。'],answer:4,hasFigure:true,figureDesc:'冬期の定常状態における外壁断面の温度分布図。屋外側から材料(A)、材料(B)の順に配置され、それぞれ厚さd。屋外温度t₀から室内温度tᵢまでの温度勾配が示されており、材料(A)の温度勾配が材料(B)より急である。'},
{year:2017,subject:'環境・設備',no:5,text:'火災時の煙制御に関する次の記述のうち、最も不適当なものはどれか。',choices:['自然排煙方式の排煙の効率は、給気経路によらず、排気を行う開口部の位置及び面積で決まる。','吸引型の機械排煙方式は、発生した煙を外部に排出するとともに、煙が発生した室を減圧することにより、他の空間への煙の拡散防止にも有効である。','高層建築物の階段室に対する加圧防煙システムは、階段室への煙の流入防止とともに、階段室における煙突効果による煙の拡散防止にも有効である。','第二種排煙は、押出型の機械排煙方式であり、所定の排煙量を確保するために、排煙量よりも多い給気量が必要となる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'環境・設備',no:6,text:'北緯35度のある地点において、イ〜ニに示す各面の終日日射量の大小関係として、最も適当なものは、次のうちどれか。ただし、終日快晴とし、日射を妨げる要素はないものとする。\nイ．夏至の日における南向き鉛直面\nロ．夏至の日における西向き鉛直面\nハ．冬至の日における南向き鉛直面\nニ．冬至の日における水平面',choices:['イ ＞ ハ ＞ ロ ＞ ニ','ロ ＞ イ ＞ ハ ＞ ニ','ロ ＞ ハ ＞ イ ＞ ニ','ハ ＞ ロ ＞ ニ ＞ イ'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'環境・設備',no:7,text:'昼光・照明に関する次の記述のうち、最も不適当なものはどれか。',choices:['光束は、ある面を単位時間に通過する光の放射エネルギーの量を、視感度で補正した値である。','受照面が均等拡散面である場合の輝度は、照度と反射率の積に比例する。','長時間の精密な視作業のための基準昼光率は、2％である。','設計用全天空照度は、普通の日(標準の状態)の場合、15,000 lxを用いることが多い。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'環境・設備',no:8,text:'色彩に関する次の記述のうち、最も不適当なものはどれか。',choices:['減法混色は、色を吸収する媒体を混ぜ合わせて別の色を作ることをいい、混ぜ合わせを増やすごとに黒に近づく。','XYZ表色系における三原刺激X、Y、Zのうちの Yは、光源色の場合、測光的な明るさを表している。','マンセル表色系における彩度は、0から10までの数値で表される。','日本工業規格(JIS)の「安全色－一般事項」において、「緑」は、「安全状態」及び「進行」を表している。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'環境・設備',no:9,text:'音響に関する次の記述のうち、最も不適当なものはどれか。',choices:['室内の平均吸音率が大きい場合、セイビン(Sabine)の残響式により求めた残響時間は、アイリング(Eyring)の残響式により求めたものに比べて、長くなる。','空気中を伝搬する音のエネルギーの一部は、空気の粘性や分子運動等によって吸収され、その吸収率は、周波数が低くなるほど大きくなる。','音源の音響パワーを4倍にすると、受音点の音圧レベルは、約6 dB上がる。','無限大の面音源の場合、音圧レベルは、距離によって減衰しない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'環境・設備',no:10,text:'吸音・遮音に関する次の記述のうち、最も不適当なものはどれか。',choices:['剛壁にグラスウール等の多孔質吸音材料を設置する場合、その吸音材料を厚くすると、一般に、低周波数域における吸音率が大きくなる。','ロックウールボード等の多孔質吸音材料の表面を塗装しても、高周波数域における吸音率には、ほとんど影響しない。','ガラス2枚からなる厚さの合計が6 mmの合わせガラスの遮音性能は、コインシデンス効果の生じる周波数域以外の周波数域においては、厚さ6 mmの単板ガラスの遮音性能とほとんど変わらない。','中空二重壁の共鳴透過について、中空二重壁を構成する二つの壁の面密度をともに2倍にすると、共振周波数は低くなる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'環境・設備',no:11,text:'空気調和・換気設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['換気ダクトにおいて、ダクトの曲がり部分や断面変化部分に生じる局部圧力損失は、風速の二乗に比例する。','軸流送風機は、一般に、遠心送風機に比べて、静圧の高い用途に用いられる。','並列に接続した2台の同一性能をもつ送風機から単一ダクトに送風する場合、2台を同時に運転するときの風量は、そのうち1台のみを運転するときの風量の2倍よりも小さくなる。','同じ風量用の外気取入れガラリと排気ガラリを比べると、排気ガラリのほうが、一般に、通過風速を高くできることから必要な正面面積は小さくなる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'環境・設備',no:12,text:'空気調和設備の熱負荷計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['熱負荷計算法には、一般に、定常計算法、非定常計算法等があり、計算の目的により使い分けられている。','設計用外界条件に用いられるTAC温度は、気象データを統計処理して得られた値であり、所定の超過確率を設定して、稀にみられる猛暑等の要因を取り除いたものである。','室内発熱負荷には、顕熱と潜熱があり、人体に起因する潜熱は、同一作業の場合、室温が高いほど小さくなる。','最大負荷計算において、照明、人体、器具等による室内発熱負荷については、冷房時は計算に含めるが、暖房時は計算に含めないことが多い。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'環境・設備',no:13,text:'空気調和設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['蓄熱方式は、熱源装置の負荷のピークを平準化しその容量を小さくすることができる。','河川水や井戸水を熱源とする水熱源ヒートポンプは、一般に、熱源水の温度が冷房時には外気温度よりも低く、暖房時には外気温度よりも高いことから、空気熱源ヒートポンプより成績係数(COP)が高い。','省エネルギー性能が高い冷凍機の選定に当たっては、定格条件の成績係数(COP)とともに、年間で発生頻度が高い部分負荷時の成績係数(COP)も考慮する必要がある。','冷却水を直接大気に開放しない密閉式冷却塔は、同じ冷却能力の開放式冷却塔に比べて、送風機動力が小さくなる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'環境・設備',no:14,text:'給排水衛生設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['排水再利用水の原水としては、手洗器・洗面器や湯沸室からの排水のほかに、厨房からの排水も利用することができる。','利用頻度が低い衛生器具には、器具付きのトラップの下流の配管の途中に、Uトラップを設けることが望ましい。','分流式排水は、建築物内の排水設備においては「汚水」と「雑排水」とを別系統にすることをいい、公共下水道においては「汚水及び雑排水」と「雨水」とを別系統にすることをいう。','公共下水道が合流式の地域において、雨水排水管を一般排水系統の敷地排水管と接続する場合には、トラップますを介して接続する。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'環境・設備',no:15,text:'給排水衛生設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['作動しているポンプ内のキャビテーションは、水温が一定の場合、ポンプ吸込口の管内圧力が高いときに発生しやすい。','高置水槽方式の給水設備において、揚水管の横引きが長くなる場合は、ウォーターハンマーの発生原因となる水柱分離を防止するために、建築物のできるだけ低い位置で横引き配管を長くする。','給水設備において、上水系統と雑用水系統とを別系統とすることにより、雑用水系統の受水槽は、鉄筋コンクリート造の床下ピットを利用することができる。','上水系統の受水槽の水抜き管とオーバーフロー管は、いずれも十分な排水口空間を介して排水管等への間接排水とする。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'環境・設備',no:16,text:'電気設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['鉄骨造の建築物においては、雷保護システムの引下げ導線に、地上部分の構造体の鉄骨を利用することが望ましい。','接地には、外部雷保護用接地、電位上昇による感電等を防ぐ保安用接地、電位変動による電子機器の機能障害を防ぐ機能用接地等がある。','接地工事の接地線には、過電流遮断器を施設してはならない。','埋設接地極は、酸等で腐食するおそれがなく、水気の少ない場所を選定して地中に埋設することが望ましい。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'環境・設備',no:17,text:'照明設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['蛍光ランプやLEDの光色において、昼白色は、電球色に比べて相関色温度が低い。','グレアは、視野内に輝度の高い光源や極端な輝度対比があることにより生じる現象をいう。','アンビエント照明の設計においては、空間の明るさを確保しつつ省エネルギーを図るために、輝度分布を考慮することが望ましい。','初期照度補正は、経年に伴う光源の出力低下等を考慮した、照明の省エネルギー手法の一つである。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'環境・設備',no:18,text:'防災設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['スプリンクラー設備の設置が必要なホテルにおいて、床面から天井までの高さが12 mのロビーに、放水型ヘッドを使用したスプリンクラー設備を設置した。','スプリンクラー設備の設置が必要な店舗において、スプリンクラーヘッドが設けられていない部分に、補助散水栓をホース接続口からの水平距離が25 m以内となるように設置した。','特別避難階段の付室に、所定の機械排煙設備を設置した。','劇場の客席誘導灯を、客席内の通路の床面における水平面照度が、0.2 lx以上となるように設置した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'環境・設備',no:19,text:'エレベーターに関する次の記述のうち、最も不適当なものはどれか。',choices:['貸事務所ビルの乗用エレベーターのサービス水準については、エレベーターが2台以上ある場合、平均運転間隔を40秒以下となるように計画することが望ましい。','事務所ビルの乗用エレベーターについては、一般に、出勤時のピーク5分間に発生する交通量に基づき、台数及び仕様を計画する。','エレベーターの設計用水平標準震度は、基礎免震構造を採用しない建築物の場合、建築物の高さが60 mを超えると、高さ60 m以下の場合に比べて、大きく異なった値となる。','高層建築物の乗用エレベーターは、地震時にできるだけ早く安全な避難階に停止させ、乗客がかごから降りた後に、運転を中止する計画とする。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'環境・設備',no:20,text:'環境・設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['「ZEH(Net Zero Energy House)」は、快適な室内環境を保ちながら、一年間で消費する住宅の一次エネルギー消費量の収支がゼロとなることを目指した住宅のことをいう。','「CASBEE－建築(新築)」における評価は、「設計一次エネルギー消費量」を「基準一次エネルギー消費量」で除した数値で判定される。','「BELS(建築物省エネルギー性能表示制度)」は、第三者評価機関が建築物の省エネルギー性能を評価し認証する制度で、性能に応じて5段階の星の数等で表示される。','「eマーク(省エネ基準適合認定マーク)」は、建築物が建築物エネルギー消費性能基準に適合していることについて、所管行政庁から認定を受けたことを示すものである。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:1,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['「液化石油ガスの保安の確保及び取引の適正化に関する法律第38条の2の規定」並びにこの規定に基づく命令及び条例の規定で建築物の敷地、構造又は建築設備に係るものは、「建築基準関係規定」である。','防火戸であって、これに通常の火災による火熱が加えられた場合に、加熱開始後45分間当該加熱面以外の面に火炎を出さないものとして、国土交通大臣が定めた構造方法を用いるものは、「特定防火設備」である。','同一敷地内に二つの地上2階建ての建築物(延べ面積はそれぞれ400m²及び200m²とし、いずれも耐火構造の壁等はないものとする。)を新築する場合において、当該建築物相互の外壁間の距離を5mとする場合は、二つの建築物は「延焼のおそれのある部分」を有している。','スポーツの練習場の用途に供する建築物は、非常用の照明装置の設置に関する規定における「学校等」に含まれる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:2,text:'面積、高さ又は階数に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['容積率の算定に当たって、建築物の敷地内に都市計画において定められた計画道路がある場合において、特定行政庁が交通上、安全上、防火上及び衛生上支障がないと認めて許可した建築物については、当該敷地のうち計画道路に係る部分の面積は、敷地面積又は敷地の部分の面積に算入する。','避雷設備の設置の必要性を検討するに当たっての建築物の高さの算定において、建築物の屋上部分である昇降機塔で、その水平投影面積の合計が当該建築物の建築面積の1/8以内の場合であっても、その部分の高さは、当該建築物の高さに算入する。','日影による中高層の建築物の高さの制限の緩和の規定において、建築物の敷地が幅12mの道路に接する場合、当該道路に接する敷地境界線については、原則として、当該道路の反対側の境界線から当該敷地の側に水平距離5mの線を敷地境界線とみなす。','建築物の地階(倉庫及び機械室の用途に供する。)で、水平投影面積の合計が当該建築物の建築面積の1/8以下であるものは、当該建築物の階数に算入しない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:3,text:'防火地域内における次の行為のうち、建築基準法上、確認済証の交付を受ける必要がないものはどれか。ただし、建築物の建築等に関する確認済証の交付を受ける必要がない区域の指定はないものとする。',choices:['木造、延べ面積100m²、地上2階建ての一戸建ての住宅における、床面積10m²の増築','鉄骨造、延べ面積300m²、平家建ての、特定行政庁が安全上、防火上及び衛生上支障がないと認め、その建築を許可した仮設興行場の新築','鉄骨造、延べ面積400m²、平家建ての、鉄道のプラットホームの上家の新築','鉄筋コンクリート造、延べ面積500m²、地上2階建ての劇場の、大規模の修繕又は大規模の模様替を伴わない公会堂への用途の変更'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:4,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['建築主は、高さが60mを超える建築物を建築しようとする場合において、申請書を提出して都道府県知事又は指定構造計算適合性判定機関の構造計算適合性判定を受ける必要はない。','鉄筋コンクリート造、地上3階建ての共同住宅の用途に供する建築物である認証型式部材等で、その新築の工事が一級建築士である工事監理者によって設計図書のとおり実施されたことが確認されたものは、中間検査において、その認証に係る型式に適合するものとみなされる。','建築主は、確認済証の交付を受けた建築物について、当該建築物の建築設備の材料、位置又は能力の変更(性能が低下しない材料の変更及び能力が減少しない変更とする。)をして、当該建築物を建築しようとする場合においては、変更後も建築物の計画が建築基準関係規定に適合することが明らかなものであっても、あらためて、確認済証の交付を受けなければならない。','確認済証の交付を受けた建築物の新築の工事の施工者は、当該工事現場の見易い場所に、建築主、設計者、工事施工者及び工事の現場管理者の氏名又は名称並びに当該工事に係る建築主事又は指定確認検査機関の確認があった旨の表示をしなければならない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:5,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['居室の内装の仕上げに第二種ホルムアルデヒド発散建築材料を使用するときは、原則として、当該材料を使用する内装の仕上げの部分の面積に所定の数値を乗じて得た面積については、当該居室の床面積を超えないようにしなければならない。','住宅の居室で地階に設けるものは、所定の基準によりからぼりに面する一定の開口部を設けた場合、壁及び床の防湿の措置等衛生のための換気設備は設けなくてもよい。','中学校における床面積70m²の教室には、採光のための窓その他の開口部を設け、その採光に有効な部分の面積は、原則として、14m²以上としなければならない。','集会場における客用の階段に代わる高さ1.5m、勾配1/8の傾斜路で、その幅が3mの場合においては、中間に手すりを設けなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:6,text:'防火・避難に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['階避難安全検証法は、火災時において、建築物の階からの避難が安全に行われることを検証する方法であり、当該階の各居室ごとに、在室者が、火災が発生してから避難を開始するまでに要する時間、当該居室の出口の一に達するまでに要する歩行時間、当該居室の出口を通過するために要する時間等を計算することとされている。','全館避難安全検証法は、火災時において、建築物からの避難が安全に行われることを検証する方法であり、各階における各火災室ごとに、火災が発生してから、在館者の全てが当該建築物から地上までの避難を終了するまでに要する時間、火災により生じた煙又はガスが階段の部分又は当該階の直上階以上の階の一に流入するために要する時間等を計算することとされている。','耐火性能検証法は、屋内において発生が予測される火災による火熱が加えられた場合に主要構造部が構造耐力上支障のある損傷を生じないものであること、建築物の周囲において発生する通常の火災による火熱が加えられた場合に耐力壁である外壁が構造耐力上支障のある損傷を生じないものであること等を確かめる方法である。','防火区画検証法は、開口部に設けられる防火設備について、屋内及び建築物の周囲において発生が予測される火災による火熱が加えられた場合に、火災の継続時間以上、加熱面以外の面に火炎を出すことなく耐えることができることを確かめる方法である。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:7,text:'「特殊建築物等の内装」の制限に関する次の記述のうち、建築基準法に適合しないものはどれか。ただし、主要構造部を耐火構造とした耐火建築物であり、自動式のスプリンクラー設備等は設けられていないものとし、居室については、内装の「制限を受ける窓その他の開口部を有しない居室」には該当しないものとする。また、「避難上の安全の検証」は行われていないものとする。',choices:['延べ面積3,000m²、地上3階建ての物品販売業を営む店舗(当該用途に供する3階の床面積が1,000m²)において、当該用途に供する居室の壁の室内に面する部分の仕上げを、難燃材料とした。','延べ面積300m²、平家建ての自動車修理工場において、当該用途に供する部分の壁及び天井の室内に面する部分の仕上げを、難燃材料とした。','延べ面積1,200m²、高さ12m、地上3階建ての有料老人ホーム(当該用途に供する3階の床面積が400m²)において、100m²ごとに耐火構造とした床、壁及び所定の防火設備で区画された3階の居室の天井の室内に面する部分の仕上げを、不燃材料、準不燃材料及び難燃材料以外の材料とした。','延べ面積1,800m²、地上3階建ての事務所(当該用途に供する3階の床面積が600m²)において、当該用途に供する居室から地上に通ずる主たる廊下、階段その他の通路の壁及び天井の室内に面する部分の仕上げを、準不燃材料とした。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:8,text:'次の建築物のうち、建築基準法上、2以上の直通階段を設けなければならないものはどれか。ただし、いずれの建築物も各階を当該用途に供するものとし、避難階は1階とする。',choices:['主要構造部を耐火構造とした地上3階建ての旅館で、各階に宿泊室(床面積30m²)が6室あるもの(2階以上の階には宿泊室以外の居室はないものとする)','主要構造部が不燃材料で造られた地上2階建ての寄宿舎で、2階における寝室の床面積の合計が150m²、2階における寝室以外の居室の床面積の合計が150m²のもの','主要構造部を準耐火構造とした、延べ面積1,000m²、地上2階建ての物品販売業を営む店舗で、2階における売場の床面積の合計が500m²のもの','主要構造部を耐火構造とした地上5階建てのナイトクラブの用途に供する建築物で、各階に客席があり、各階の居室の床面積の合計が200m²で、かつ、各階に避難上有効なバルコニーを設け、各階から地上に通ずる屋外の直通階段を、屋外に設ける避難階段の構造の規定に適合するものとしたもの'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:9,text:'次の記述のうち、建築基準法上、誤っているものはどれか。ただし、「避難上の安全の検証」は行われていないものとする。',choices:['主要構造部を準耐火構造とした建築物以外の建築物であっても、柱及び梁が不燃材料で、その他の主要構造部が所定の技術的基準に適合するものとし、また、外壁の開口部で延焼のおそれのある部分に所定の防火設備を有するものは、準耐火建築物に該当する。','建築物の高さ31m以下の部分にある3階以上の各階において、道に面する外壁面に、直径1mの円が内接できる窓で、格子その他の屋外からの進入を妨げる構造を有しないものを当該壁面の長さ10mごとに設けている場合には、非常用の進入口を設けなくてもよい。','主要構造部を耐火構造とした地上15階建ての共同住宅において、15階の居室及びこれから地上に通ずる廊下、階段その他の通路の壁及び天井の室内に面する部分の仕上げを準不燃材料とした場合には、15階の居室の各部分から地上に通ずる直通階段のその一に至る歩行距離を60mとすることができる。','主要構造部を耐火構造とした延べ面積が1,000m²、地上3階建ての病院には、非常用の照明装置を設けなくてもよい。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:10,text:'建築設備等に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['床面積の合計が80m²の住戸において、発熱量の合計(密閉式燃焼器具等又は煙突を設けた設備若しくは器具に係るものを除く。)が9kWの火を使用する器具を設けた床面積12m²の調理室には、1.2m²の有効開口面積を有する窓その他の開口部を換気上有効に設けた場合であっても、所定の技術的基準に従って、換気設備を設けなければならない。','高さが31mを超える建築物で、非常用エレベーターを設けていないことにより、建築基準法第3条第2項の規定の適用を受けているものに増築する場合においては、増築に係る部分の床面積の合計が基準時における延べ面積の1/2を超える場合には、非常用エレベーターを設けなければならない。','延べ面積500m²の事務所において、開放できる部分の面積の合計が2m²の窓(天井から下方80cm以内の距離にあるもの)のある床面積120m²の事務室には、原則として、排煙設備を設けなければならない。','エレベーター(所定の特殊な構造又は使用形態のものを除く。)の昇降路の出入口の戸には、かごがその戸の位置に停止していない場合において、昇降路外の人又は物の昇降路内への落下を防止することができるものとして、所定の基準に適合する施錠装置を設けなければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:11,text:'建築物の構造計算に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['許容応力度等計算においては、建築物の地上部分について各階の剛性率を確かめる場合、当該剛性率は、「各階の層間変形角の逆数」を「当該建築物についての各階の層間変形角の逆数の相加平均」で除して計算し、その値がそれぞれ6/10以上であることを確かめる。','保有水平耐力計算においては、高さ25mの鉄筋コンクリート造の建築物の地上部分について、保有水平耐力が必要保有水平耐力以上であることを確かめた場合には、層間変形角が所定の数値以内であることを確かめなくてもよい。','限界耐力計算を行う場合、地震時については、建築物の地下部分を除き、地震力により構造耐力上主要な部分の断面に生ずる応力度が、短期に生ずる力に対する許容応力度を超えないことを計算により確かめなくてもよい。','建築物の基礎は、国土交通大臣が定める基準に従った構造計算によって構造耐力上安全であることを確かめた場合には、異なる構造方法による基礎を併用してもよい。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:12,text:'図のような木造、地上2階建ての住宅(屋根を金属板で葺いたもの)の1階部分について、桁行方向と張り間方向に設けなければならない構造耐力上必要な軸組の最小限の長さの組合せとして、建築基準法上、正しいものは、次のうちどれか。ただし、小屋裏等に物置等は設けず、区域の地盤及び地方の風の状況に応じた「地震力」及び「風圧力」に対する軸組の割増はないものとし、国土交通大臣が定める基準に従った構造計算は行わないものとする。なお、1階部分の軸組の構造の判定に用いる1階の床面積については、80m²とする。また、図は略図とする。',choices:['桁行方向 2,320cm、張り間方向 2,925cm','桁行方向 2,640cm、張り間方向 2,925cm','桁行方向 2,450cm、張り間方向 3,600cm','桁行方向 2,640cm、張り間方向 3,600cm'],answer:1,hasFigure:true,figureDesc:'木造2階建て住宅の1階及び2階平面図(床面積80m²、斜格子部、10m×8m)、南側立面図(見付面積72m²、斜線部、幅10m)、東側立面図(見付面積49m²、斜線部、幅8m)。真北は東側。桁行方向は東西方向(10m側)、張り間方向は南北方向(8m側)。'},
{year:2017,subject:'法規',no:13,text:'構造強度に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['炭素鋼を構造用鋼材として使用する場合、短期に生じる力に対する曲げの許容応力度は、鋼材等の種類及び品質に応じて国土交通大臣が定める基準強度と同じ値である。','建築物の地上部分に作用する地震力について、許容応力度等計算を行う場合における標準せん断力係数は0.2以上又は0.3以上とするが、必要保有水平耐力を計算する場合における標準せん断力係数は、1.0以上としなければならない。','高力ボルトの短期に生ずる力に対する引張りの許容応力度は、引張りの材料強度の2/3の値である。','コンクリートの引張りの許容応力度は、原則として、圧縮の許容応力度の1/10の値である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:14,text:'都市計画区域及び準都市計画区域内の道路等に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、特定行政庁による道路幅員に関する区域の指定はないものとする。',choices:['都市計画区域及び準都市計画区域以外の区域から都市計画区域に編入された際、現に存在している幅員4mの道(地下におけるものを除く。)に2m以上接している敷地には、建築物を建築することができる。','工事を施工するために現場に設ける事務所の敷地は、道路に接していなくてもよい。','河川管理者が管理する幅員4mの公共の用に供する道に2m以上接する敷地においては、特定行政庁が交通上、安全上、防火上及び衛生上支障がないと認めて許可した場合には、建築物を建築することができる。','道路の地盤面下に、建築物に附属する地下通路を設ける場合、特定行政庁の許可を受ける必要がある。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:15,text:'建築物の用途の制限に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、用途地域以外の地域、地区等及び特定行政庁の許可等は考慮しないものとする。',choices:['「延べ面積600m²、地上2階建ての老人福祉センター」は、第一種低層住居専用地域内において、新築することができる。','「延べ面積400m²、地上2階建ての保健所」は、第二種低層住居専用地域内において、新築することができる。','「延べ面積500m²、地上2階建ての宅地建物取引業を営む店舗」は、第一種中高層住居専用地域内において、新築することができる。','「延べ面積300m²、地上2階建ての幼保連携型認定こども園」は、工業地域内において、新築することができる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:16,text:'建築物の容積率及び建蔽率に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、敷地は、街区の角にある敷地又はこれに準ずる敷地で特定行政庁が指定するものではないものとする。',choices:['幅員15mの道路に接続する幅員8mの道路を前面道路とする敷地が、幅員15mの道路から当該敷地が接する前面道路の部分の直近の端までの延長が35mの場合、容積率の算定に係る当該前面道路の幅員に加える数値は2mとする。','高度利用地区内においては、学校、駅舎、卸売市場等で、特定行政庁が用途上又は構造上やむを得ないと認めて許可したものについては、高度利用地区に関する都市計画において定められた容積率に適合しないものとすることができる。','都市計画において定められた建蔽率の限度が6/10の第一種住居地域内で、かつ、準防火地域内にある耐火建築物については、建蔽率の限度の緩和の対象となる。','工業地域内にある建築物の敷地が防火地域及び準防火地域にわたる場合において、その敷地内の建築物の全部が耐火建築物であるときは、都市計画において定められた建蔽率の限度にかかわらず、建蔽率の限度の緩和の対象となる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:17,text:'図のように、敷地に建築物を新築する場合、建築基準法上、A点における地盤面からの建築物の高さの最高限度は、次のうちどれか。ただし、敷地は平坦で、敷地、隣地及び道路の相互間に高低差はなく、門、塀等はないものとする。また、図に記載されているものを除き、地域、地区等及び特定行政庁による指定、許可等並びに日影による中高層の建築物の高さの制限及び天空率に関する規定は考慮しないものとする。なお、建築物は、全ての部分において、高さの最高限度まで建築されるものとする。',choices:['28.5m','34.5m','39.0m','46.0m'],answer:3,hasFigure:true,figureDesc:'敷地図。商業地域、都市計画で定められた容積率80/10。敷地は35m×40mで南北に道路あり。北側道路幅員8m、南側道路幅員15m。東西に隣地あり。建築物は敷地内に配置され、北側道路から3m、東側隣地から3m離れている。A点は建築物の北西角付近。敷地の東西幅29m、南北方向に道路間が40m。真北は右方向。'},
{year:2017,subject:'法規',no:18,text:'防火地域及び準防火地域内の建築物の新築に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['防火地域及び準防火地域にわたる建築物(過半が準防火地域内であり、防火地域外で防火壁で区画されていないもの)で、延べ面積600m²、地上2階建てで、各階を展示場の用途に供するものは、耐火建築物又は準耐火建築物としなければならない。','防火地域内においては、延べ面積150m²、平家建ての建築物で、診療所の用途に供するものは、耐火建築物としなければならない。','準防火地域内においては、延べ面積900m²、地上3階建ての建築物(各階の床面積300m²)で、3階を倉庫の用途に供するものは、耐火建築物としなければならない。','準防火地域内においては、延べ面積1,200m²、地上3階建ての建築物で、各階を事務所の用途に供するものは、耐火建築物又は準耐火建築物としなければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:19,text:'地区計画等又は建築協定に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['建築協定における建築協定区域及び当該区域内の建築物に関する基準について、同様の内容が地区計画において定められた場合には、その建築協定は廃止されたものとみなされる。','地区計画等の区域内における建築物の敷地が特定行政庁の指定した予定道路に接する場合、特定行政庁が交通上、安全上、防火上及び衛生上支障がないと認めて許可した建築物については、当該予定道路を前面道路とみなして建築物の容積率の規定が適用される。','地区計画等の区域内において、地区整備計画等で定められている壁面の位置の制限に係る建築物に附属する門又は塀で高さ2mを超えるもの以外の工作物の設置の制限は、地区計画等に関する市町村の条例による壁面の位置の制限としては定めることができない。','特定行政庁の認可を受けた建築協定のうち、建築協定区域内の土地について一の所有者以外に土地の所有者等が存しないものは、認可の日から起算して3年以内において当該建築協定区域内の土地に2以上の土地の所有者等が存しない場合には、効力を有するものとはならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:20,text:'次の記述のうち、建築基準法上、誤っているものはどれか。ただし、特定行政庁の許可は考慮しないものとする。',choices:['建築基準法第22条第1項の市街地の区域の内外にわたる共同住宅の屋根の構造は、その全部について、同項の規定の適用を受け、通常の火災を想定した火の粉による火災の発生を防止するために屋根に必要とされる所定の性能を有するものとしなければならない。','一団地内に建築される1又は2以上の構えを成す建築物のうち、特定行政庁がその位置及び構造が安全上、防火上及び衛生上支障がないと認めるものに対する用途地域の規定の適用については、当該一団地は一の敷地とみなされる。','都市計画において建築物の高さの限度が10mと定められた第一種低層住居専用地域内においては、所定の要件に適合する建築物であって、特定行政庁が低層住宅に係る良好な住居の環境を害するおそれがないと認めるものについては、建築物の高さの限度は、12mとすることができる。','地階を除く階数が11以上である建築物の屋上に設ける冷房のための冷却塔設備は、防火上支障がないものとして国土交通大臣が定めた構造方法を用いる場合においては、主要な部分を不燃材料以外の材料で造ることができる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:21,text:'次の記述のうち、建築士法上、誤っているものはどれか。ただし、中央指定登録機関の指定は考慮しないものとする。',choices:['設備設計一級建築士は、設備設計以外の設計を含む建築物の設計を行うことができる。','建築士は、大規模の建築物その他の建築物の建築設備に係る設計又は工事監理を行う場合において、建築設備士の意見を聴いたときは、原則として、設計図書又は工事監理報告書において、その旨を明らかにしなければならない。','木造、平家建ての延べ面積450m²、高さ11m、軒の高さ9mのオーディトリアムを有する集会場を新築する場合においては、一級建築士でなければ、その設計又は工事監理をしてはならない。','構造設計一級建築士は、構造設計一級建築士定期講習を受けたときは、住所地の都道府県知事を経由して国土交通大臣に対し、構造設計一級建築士証の書換え交付を申請することができる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:22,text:'次の記述のうち、建築士法上、誤っているものはどれか。',choices:['建築物の大規模の修繕に係る部分の床面積が400m²である工事の工事監理受託契約の締結に際して、その当事者は、工事と設計図書との照合の方法、工事監理の実施の状況に関する報告の方法、工事監理に従事することとなる建築士の氏名等の所定の事項について書面に記載し、署名又は記名押印をして相互に交付しなければならない。','建築士事務所の開設者が建築主との設計受託契約の締結に先立って管理建築士等に重要事項の説明をさせる際に、管理建築士等は、当該建築主に対し、建築士免許証又は建築士免許証明書を提示しなければならない。','建築士事務所を管理する建築士は、当該建築士事務所において受託可能な業務の量及び難易並びに業務の内容に応じて必要となる期間の設定、受託しようとする業務を担当させる建築士等の選定及び配置等の所定の技術的事項を総括するものとする。','建築士事務所を管理する建築士は、当該建築士事務所に属する他の建築士が設計を行った建築物の設計図書について、管理建築士である旨の表示をして記名及び押印をしなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:23,text:'次の記述のうち、建築士法上、誤っているものはどれか。ただし、中央指定登録機関及び指定事務所登録機関の指定は考慮しないものとする。',choices:['一級建築士名簿に登録する事項は、登録番号、登録年月日、氏名、生年月日、性別、処分歴、定期講習の受講歴等である。','一級建築士は、一級建築士免許証の交付の日から30日以内に、本籍、住所、氏名、生年月日、性別等を住所地の都道府県知事を経由して国土交通大臣に届け出なければならない。','一級建築士事務所登録簿に登録する事項は、登録番号、登録年月日、建築士事務所の名称及び所在地、管理建築士の氏名、建築士事務所に属する建築士の氏名、処分歴等である。','建築士事務所の開設者は、建築士事務所に属する建築士の氏名に変更があったときは、30日以内に、その建築士事務所の所在地を管轄する都道府県知事に届け出なければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:24,text:'次の記述のうち、都市計画法上、誤っているものはどれか。',choices:['市街化調整区域のうち開発許可を受けた開発区域以外の区域内において、既存の建築物の敷地内で車庫、物置その他これらに類する附属建築物を建築する場合は、都道府県知事の許可を受ける必要はない。','都市計画施設の区域内において、地階を有しない木造、地上2階建ての建築物を改築する場合は、都道府県知事等の許可を受ける必要はない。','開発許可を受けた開発区域内において、都道府県知事の許可を受ける必要のない軽微な変更をしたときは、遅滞なく、その旨を都道府県知事に届け出なければならない。','地区整備計画が定められている地区計画の区域内において、仮設の建築物の建築を行おうとする者は、当該行為に着手する日の30日前までに、行為の種類、場所、着手予定日等を市町村長に届け出なければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:25,text:'次の記述のうち、消防法上、誤っているものはどれか。ただし、建築物は、いずれも無窓階を有しないものとし、指定可燃物の貯蔵及び取扱いは行わないものとする。',choices:['主要構造部を耐火構造とし、壁及び天井の室内に面する部分の仕上げを難燃材料でした延べ面積2,100m²、地上2階建ての展示場については、原則として、屋内消火栓設備を設置しなければならない。','天井の高さ12m、延べ面積700m²のラック式倉庫については、原則として、スプリンクラー設備を設置しなければならない。','小学校は、消防用設備等の技術上の基準に関する政令等の規定の施行又は適用の際、現に存する建築物であっても、新築の場合と同様に消防用設備等の規定が適用される「特定防火対象物」である。','物品販売業を営む店舗と共同住宅とが開口部のない耐火構造の床又は壁で区画されているときは、その区画された部分は、消防用設備等の設置及び維持の技術上の基準の規定の適用については、それぞれ別の防火対象物とみなされる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:26,text:'次の記述のうち、「高齢者、障害者等の移動等の円滑化の促進に関する法律」上、誤っているものはどれか。',choices:['床面積の合計が2,000m²の会員制スイミングスクール(一般公共の用に供されないもの)を新築しようとするときは、建築物移動等円滑化基準に適合させるために必要な措置を講ずるよう努めなければならない。','床面積の合計が50m²の公衆便所を新築しようとするときは、便所内に、高齢者、障害者等が円滑に利用することができる構造の水洗器具を設けた便房を1以上(男子用及び女子用の区別があるときは、それぞれ1以上)設けなければならない。','床面積の合計が2,000m²の物品販売業を営む店舗を新築しようとするとき、不特定かつ多数の者が利用する駐車場を設ける場合には、そのうち1以上に、車いす使用者用駐車施設を1以上設けなければならない。','床面積の合計が2,000m²の旅館を新築しようとするときは、客室の総数にかかわらず、車いす使用者用客室を1以上設けなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:27,text:'次の記述のうち、関係法令上、誤っているものはどれか。',choices:['「住宅の品質確保の促進等に関する法律」に基づき、住宅新築請負契約においては、請負人は、注文者に引き渡した時から10年間、住宅の構造耐力上主要な部分等の瑕疵(構造耐力又は雨水の浸入に影響のないものを除く。)について、民法第634条第1項及び第2項前段に規定する担保の責任を負う。','「建設工事に係る資材の再資源化等に関する法律」に基づき、その施工に特定建設資材を使用する建築物の床面積200m²の増築の工事(請負代金の額が4,000万円)で、当該建築物の増築後の床面積の合計が500m²であるものの受注者は、原則として、分別解体等をしなければならない。','「長期優良住宅の普及の促進に関する法律」に基づき、分譲事業者は、譲受人を決定するまでに相当の期間を要すると見込まれる場合においては、単独で長期優良住宅建築等計画を作成し、所管行政庁の認定を申請することができる。','「建築物のエネルギー消費性能の向上に関する法律」に基づき、建築主等は、エネルギー消費性能の向上のための建築物に設けた空気調和設備等の改修をしようとするときは、建築物エネルギー消費性能向上計画を作成し、所管行政庁の認定を申請することができる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:28,text:'一級建築士によるイ～ニの行為について、建築士法に基づいて、当該一級建築士に対する業務停止等の懲戒処分の対象となるものは、次のうちどれか。\nイ．建築確認の必要な建築物の設計者として、建築確認の申請を行わずに工事を施工することについて、当該建築物の工事施工者からの相談に応じた。\nロ．複数の一級建築士事務所の開設者である一級建築士が、管理建築士の欠員が生じた一級建築士事務所について、別の一級建築士事務所の管理建築士を一時的に兼務させた。\nハ．建築士事務所の開設者である一級建築士が、委託者の許諾を得て、延べ面積500m²の建築物の新築に係る設計業務を、一括して他の建築士事務所の開設者に委託した。\nニ．建築士事務所登録の有効期間の満了後、更新の登録を受けずに、業として他人の求めに応じ報酬を得て設計等を行った。',choices:['イとロとハとニ','イとロとニのみ','ロとハとニのみ','イとハのみ'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:29,text:'次の記述のうち、関係法令上、誤っているものはどれか。',choices:['「宅地造成等規制法」に基づき、宅地造成工事規制区域内において、切土のみの宅地造成に関する工事であって、切土をする土地の面積が500m²で、高さ2mの崖を生ずることになる場合には、造成主は、原則として、都道府県知事の許可を受けなければならない。','「水道法」に基づき、給水装置における家屋の主配管は、配管の経路について構造物の下の通過を避けること等により漏水時の修理を容易に行うことができるようにしなければならない。','「土砂災害警戒区域等における土砂災害防止対策の推進に関する法律」に基づき、特別警戒区域内において、予定建築物が分譲住宅である開発行為をしようとする者は、原則として、あらかじめ、都道府県知事の許可を受けなければならない。','「都市計画法」に基づき、開発許可の申請に当たって、一級建築士の資格を有する者で、宅地開発に関する技術に関して2年以上の実務の経験を有するものは、開発区域の面積が20ha未満の開発行為に関する設計に係る設計図書を作成することができる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'法規',no:30,text:'次の記述のうち、建築基準法及び建築士法上、誤っているものはどれか。',choices:['特定行政庁が特定工程の指定と併せて指定する特定工程後の工程に係る工事を、工事施工者が当該特定工程に係る中間検査合格証の交付を受ける前に施工した場合、当該工事施工者は罰則の適用の対象となる。','一級建築士でなければ行ってはならない建築物の設計及び工事監理を二級建築士が行い、工事が施工された場合、当該建築物の工事施工者は罰則の適用の対象とならないが、当該二級建築士は罰則の適用の対象となる。','患者の収容施設がある地上3階、床面積300m²の診療所(国、都道府県及び建築主事を置く市町村の建築物を除く。)の所有者等は、当該建築物の敷地、構造及び建築設備について、定期に、一定の資格を有する者にその状況の調査をさせて、その結果を特定行政庁に報告しなければならない。','建築士事務所の開設者は、事業年度ごとに、設計等の業務に関する報告書を作成し、毎事業年度経過後3月以内に当該建築士事務所に係る登録をした都道府県知事に提出するとともに、所定の業務に関する事項を記載した帳簿を備え付け、各事業年度の末日にその帳簿を閉鎖し、その翌日から15年間保存しなければならない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'構造',no:1,text:'図－1のように、脚部で固定された柱の頂部に鉛直荷重N及び水平荷重Qが作用している。柱の断面形状は図－2に示すような長方形断面であり、鉛直荷重N及び水平荷重Qは断面の図心に作用しているものとする。柱脚部断面における引張縁応力度と圧縮縁応力度との組合せとして、正しいものは、次のうちどれか。ただし、柱は等質等断面とし、自重は無視する。また、応力度は弾性範囲内にあるものとし、引張応力度を「＋」、圧縮応力度を「－」とする。',choices:['引張縁応力度(N/mm²): +6、圧縮縁応力度(N/mm²): -14','引張縁応力度(N/mm²): +8、圧縮縁応力度(N/mm²): -12','引張縁応力度(N/mm²): +11、圧縮縁応力度(N/mm²): -19','引張縁応力度(N/mm²): +13、圧縮縁応力度(N/mm²): -17'],answer:2,hasFigure:true,figureDesc:'図－1: 脚部固定の柱（高さ2,000mm）の頂部にN=120kN（鉛直）とQ=15kN（水平）が作用。図－2: 柱断面は長方形（幅300mm×せい200mm）。'},
{year:2017,subject:'構造',no:2,text:'図のような断面形状の単純梁A及びBの中央に集中荷重Pが作用したとき、それぞれ曲げによる最大たわみδA及びδBが生じている。δAとδBとの比として、正しいものは、次のうちどれか。ただし、梁A及びBは同一材質の弾性部材とし、自重は無視する。また、梁Bは重ね梁であり、接触面の摩擦はないものとする。',choices:['δA : δB = 1 : 1','δA : δB = 1 : 2','δA : δB = 1 : 4','δA : δB = 1 : 8'],answer:3,hasFigure:true,figureDesc:'梁A: スパンl、断面は正方形(a×a)。梁B: スパン2l、断面はa×aの2枚重ね梁（摩擦なし）。'},
{year:2017,subject:'構造',no:3,text:'図のようなラーメンに鉛直荷重4P及び水平荷重Pが作用したときの曲げモーメント図として、正しいものは、次のうちどれか。ただし、曲げモーメント図は、材の引張側に描くものとする。',choices:['左柱脚2Pl、左柱頭2Pl、梁右端3Pl（引張側が内側）','左柱脚4Pl、左柱頭4Pl、梁右端5Pl（引張側が内側）','左柱脚2Pl、左柱頭2Pl、梁右端3Pl、右柱頭2Pl（引張側が両側）','左柱脚4Pl、左柱頭4Pl、梁右端5Pl、右柱頭2Pl（引張側が両側）'],answer:1,hasFigure:true,figureDesc:'門形ラーメン（柱高さl、梁スパン2l）。左柱頂に水平荷重P、梁中央に鉛直荷重4P。左柱脚ピン、右柱脚ピン、梁中央にローラー支点。'},
{year:2017,subject:'構造',no:4,text:'図は2層のラーメンに水平荷重P及び2Pが作用したときの正しい崩壊メカニズムを示したものである。次の記述のうち、最も不適当なものはどれか。ただし、最上階梁及び2階梁の全塑性モーメントはそれぞれMp及び2Mpとし、1階柱の柱脚の全塑性モーメントは2Mpとする。',choices:['最上階梁のせん断力Qbは、Mp/l である。','鉛直反力Vは、3Mp/l である。','水平荷重Pは、2Mp/l である。','1階右側の柱のせん断力Qcは、6Mp/l である。'],answer:4,hasFigure:true,figureDesc:'2層1スパンラーメンの崩壊メカニズム図。各層高さl、スパン2l。2階に2P、最上階にPの水平荷重。柱脚・梁端・柱頭に塑性ヒンジ。'},
{year:2017,subject:'構造',no:5,text:'図のような荷重が作用するトラスにおいて、部材ABに生じる軸方向力として、正しいものは、次のうちどれか。ただし、軸方向力は、引張力を「＋」、圧縮力を「－」とする。',choices:['-√2 P','-（√2/2）P','+（√2/2）P','+√2 P'],answer:4,hasFigure:true,figureDesc:'4パネルのトラス（各パネル幅l、高さl）。上弦にP, 2P, Pの鉛直荷重。左端ピン支持、右端ローラー支持。部材ABは上弦の左から2番目の節点（A）と下弦の中央節点（B）を結ぶ斜材。'},
{year:2017,subject:'構造',no:6,text:'図のような構造物A、B、Cの柱の弾性座屈荷重をそれぞれPA、PB、PCとしたとき、それらの大小関係として正しいものは、次のうちどれか。ただし、全ての柱は等質等断面で、梁は剛体であり、柱及び梁の自重、柱の面外方向の座屈は無視する。',choices:['PA > PC > PB','PB > PA > PC','PC > PA > PB','PC > PB > PA'],answer:3,hasFigure:true,figureDesc:'構造物A: 2本の柱（高さ2h）で梁を支持、柱脚ピン。構造物B: 2本の柱（高さ5h）で梁を支持、柱脚固定。構造物C: 2本の柱（高さ6h）で梁を支持、柱脚固定、梁の両端はピンローラー（水平移動拘束）。'},
{year:2017,subject:'構造',no:7,text:'建築基準法における地震層せん断力係数Ciの計算に用いる振動特性係数Rtは、建築物の設計用一次固有周期Tと地盤の種別に応じて定められている。それらの関係を示す図として、適当なものは、次のうちどれか。',choices:['Rt-T図: 第3種地盤が最も上、第1種地盤が中間、第2種地盤が最も下','Rt-T図: 第1種地盤が最も上、第3種地盤が中間、第2種地盤が最も下','Rt-T図: 第3種地盤が最も上、第1種地盤が最も下、第2種地盤が中間','Rt-T図: 第1種地盤が最も上、第3種地盤が最も下、第2種地盤が中間'],answer:1,hasFigure:true,figureDesc:'4つのRt（振動特性係数）とT（設計用一次固有周期）の関係を示すグラフ。各グラフで第1種・第2種・第3種地盤の曲線の上下関係が異なる。'},
{year:2017,subject:'構造',no:8,text:'建築基準法における荷重及び外力に関する次の記述のうち、最も不適当なものはどれか。',choices:['学校の屋上広場の単位面積当たりの積載荷重は、実況に応じて計算しない場合、教室の単位面積当たりの積載荷重と同じ数値とすることができる。','雪下ろしを行う慣習のある地方においては、その地方における垂直積雪量が1mを超える場合においても、積雪荷重は、雪下ろしの実況に応じて垂直積雪量を1mまで減らして計算することができる。','風圧力における平均風速の高さ方向の分布を表す係数Erは、建築物の高さが同じ場合、一般に、「都市計画区域外の極めて平坦で障害物がない区域」より「都市計画区域内の都市化が極めて著しい区域」のほうが小さい。','建築物の地上部分における各層の地震層せん断力Qiは、最下層の値が最も大きくなる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'構造',no:9,text:'木造軸組工法による地上2階建ての建築物に関する次の記述のうち、最も不適当なものはどれか。',choices:['平面が長方形の建築物において、必要壁量が風圧力により決定されたので、張り間方向と桁行方向の壁量が、それぞれの方向の必要壁量以上となるように設計した。','圧縮力と引張力の両方を負担する筋かいとして、厚さ3cm、幅9cmの木材を使用した。','9cm角の木材の筋かいを入れた軸組の倍率(壁倍率)を3とし、9cm角の木材の筋かいをたすき掛けに入れた軸組の倍率(壁倍率)を6とした。','筋かいが間柱と交差する部分は、間柱の断面を欠き取り、筋かいは欠込みをせずに通すようにした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'構造',no:10,text:'図のような平面の木造軸組工法による平家建ての建築物において、建築基準法における「木造建築物の軸組の設置の基準」(いわゆる四分割法)に関する次の記述のうち、最も不適当なものはどれか。ただし、図中の太線は耐力壁を示し、その軸組の倍率(壁倍率)は全て1とする。なお、この建築物の単位床面積当たりに必要な壁量は15cm/m²とする。',choices:['X方向の北側の側端部分の必要壁量は、3mである。','X方向の北側の側端部分の存在壁量は、5mである。','X方向の北側の側端部分の壁量充足率は、1を超えている。','X方向の壁率比は、0.5を超えている。'],answer:4,hasFigure:true,figureDesc:'平面図: 10m×8mの長方形平面。1mグリッド。太線で耐力壁を表示。北が上。X方向（東西）、Y方向（南北）。'},
{year:2017,subject:'構造',no:11,text:'鉄筋コンクリート造の建築物において、「躯体に発生したコンクリートのひび割れの状況を示す図」と「その原因の説明」として、最も不適当なものは、次のうちどれか。',choices:['最上階の柱梁接合部が、矢印の方向に曲げモーメントを受けた場合のひび割れ','独立基礎フーチングのはね出し部分が、矢印の方向に地盤からの接地圧を受けた場合のひび割れ','周辺が梁で固定されたスラブが、鉛直荷重を受けた場合のスラブ上面のひび割れ','耐力壁に、乾燥収縮が生じた場合のひび割れ'],answer:2,hasFigure:true,figureDesc:'4つのひび割れパターン図。1: 柱梁接合部のひび割れ。2: 独立基礎フーチングのひび割れ。3: スラブ上面のひび割れ。4: 耐力壁のひび割れ。'},
{year:2017,subject:'構造',no:12,text:'鉄筋コンクリート構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['梁のせん断強度を大きくするために、あばら筋量を増やした。','曲げ降伏する梁の靭性を高めるために、コンクリートの設計基準強度に対するせん断応力度の比を大きくした。','柱のせん断強度を大きくするために、設計基準強度がより高いコンクリートを採用した。','曲げ降伏する両側柱付き耐力壁の靭性を高めるために、側柱の帯筋量を増やした。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'構造',no:13,text:'鉄筋コンクリート構造の柱及び梁における付着に関する次の記述のうち、最も不適当なものはどれか。',choices:['主筋間のあきが大きくなると、付着割裂強度は小さくなる。','細径の主筋を用いる場合よりも、太径の主筋を用いる場合のほうが、断面の隅角部に付着割裂破壊を生じやすい。','付着割裂破壊に対する安全性の検討を行う場合、帯筋、あばら筋及び中子筋の効果を考慮して、付着割裂強度を算定してもよい。','部材端部にせん断ひび割れが生じる部材では、主筋の引張応力度を一定とみなす範囲を除いたうえで、設計用付着応力度を算定する。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'構造',no:14,text:'鉄筋コンクリート構造の許容応力度計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['柱の長期許容曲げモーメントの算定において、コンクリートには引張応力度の負担は期待せず、主筋と圧縮コンクリートを考慮して計算を行った。','梁の長期許容曲げモーメントを大きくするために、引張鉄筋をSD345から同一径のSD390に変更した。','柱及び梁の短期許容せん断力の算定において、主筋はせん断力を負担しないものとして計算を行った。','開口を設けた耐力壁において、壁縦筋や壁横筋の寄与分を考慮して、設計用せん断力に対して必要となる開口補強筋量を算定した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'構造',no:15,text:'鉄骨構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['引張力を負担する筋かいを保有耐力接合とするために、筋かい端部及び接合部の破断耐力より、筋かいの軸部の降伏耐力のほうが大きくなるように設計した。','溝形鋼を用いた筋かいの設計において、接合部のボルト本数に応じた突出脚の無効長さを考慮して、部材の断面積を低減した。','横移動が拘束された両端ピン接合の柱材において、節点間距離を柱材の座屈長さとした。','平面計画上、梁の横座屈を防止するための横補剛を梁の全長にわたって均等間隔に設けることができなかったので、梁の端部に近い部分を主として横補剛する方法を採用した。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'構造',no:16,text:'鉄骨構造の柱脚の設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['露出形式柱脚に使用する「伸び能力のあるアンカーボルト」には、「建築構造用転造ねじアンカーボルト」等があり、軸部の全断面が十分に塑性変形するまでねじ部が破断しない性能がある。','一般的な根巻形式柱脚における鉄骨柱の曲げモーメントは、根巻鉄筋コンクリート頂部で最大となり、ベースプレートに向かって小さくなるので、根巻鉄筋コンクリートより上部の鉄骨柱に作用するせん断力よりも、根巻鉄筋コンクリート部に作用するせん断力のほうが大きくなる。','根巻形式柱脚において、柱脚の応力を基礎に伝達するための剛性と耐力を確保するために、根巻鉄筋コンクリートの高さが鉄骨柱せいの2.5倍以上となるように設計する。','埋込形式柱脚において、鉄骨柱の剛性は、一般に、基礎コンクリート上端の位置で固定されたものとして算定する。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'構造',no:17,text:'鋼材ダンパーを用いた制振構造を採用した鉄骨造の建築物に関する次の記述のうち、最も不適当なものはどれか。',choices:['地震時に主架構を無損傷とする目的で、柱梁部材には建築構造用圧延鋼材SN490に比べて、基準強度Fが大きい建築構造用高性能鋼材SA440を用いた。','地震エネルギーを効率的に吸収させるために、鋼材ダンパーには建築構造用圧延鋼材SN400と比べて、伸び能力の優れた建築構造用低降伏点鋼材LY225を用いた。','制振効果を高めるために、鋼材ダンパーの主架構への取付け部の剛性を小さくした。','せん断パネルタイプの鋼材ダンパーについて、地震等による繰返し変形下の疲労に対して累積損傷度による検討を行った。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'構造',no:18,text:'冷間成形角形鋼管柱を用いた鉄骨造の建築物に関する次の記述のうち、最も不適当なものはどれか。',choices:['プレス成形角形鋼管の角部は、成形前の素材と比べて、強度及び変形性能が高くなる。','柱と梁との仕口部の接合形式には、一般に、通しダイアフラム形式、内ダイアフラム形式及び外ダイアフラム形式がある。','柱の継手は、一般に、現場溶接となり、継手位置は曲げ応力が小さくなる位置とすることが望ましい。','「耐震計算ルート1－1」の場合は、標準せん断力係数C0を0.3以上とするとともに、柱の設計用応力を割増して、許容応力度を検討しなければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'構造',no:19,text:'基礎の設計を行うための地盤調査に関する次の記述のうち、最も不適当なものはどれか。',choices:['地震時の杭の水平抵抗を検討するための孔内水平載荷試験は、杭頭から約5mの深さ又は最大杭径の約5倍の深さまでで実施する。','平板載荷試験により「地盤の支持力特性」の調査ができる範囲は、載荷板幅の1.5～2.0倍程度の深さまでである。','常時微動測定の結果は、地盤の卓越周期の推定や、建築物の地震力の設定に必要な地盤種別の判定に利用される。','粘性土の内部摩擦角は、一軸圧縮試験により求めることができる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'構造',no:20,text:'杭基礎に関する次の記述のうち、最も不適当なものはどれか。',choices:['鉛直荷重が作用する杭の抵抗要素には、先端抵抗と周面摩擦抵抗があり、杭頭に作用する上部構造物の荷重による杭の沈下の発生とともに先端抵抗が先行して発揮され、杭の沈下が増加すると周面摩擦抵抗が発揮される。','地震時に液状化のおそれのある地盤において、杭の水平抵抗を検討する場合には、水平地盤反力係数(単位 kN/m³)の値を低減しなければならない。','地下水位の高い敷地に計画する低層建築物に地下室を設ける場合には、浮力が作用するので、杭の引抜き抵抗力の検討が必要となる。','杭先端の地盤の許容応力度を計算で求める場合に用いるN値は、杭先端付近のN値の平均値とし、その値が60を超えるときは60とする。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'構造',no:21,text:'地盤及び基礎に関する次の記述のうち、最も不適当なものはどれか。',choices:['直接基礎の地盤の許容応力度の算定において、根入れ深さDfを評価する場合、隣接する建築物の影響を考慮する必要がある。','杭の長さが長い場合、杭頭の固定度が大きくなるほど、杭頭の曲げモーメントは小さくなる。','支持層が傾斜している地盤に杭基礎を採用する場合、長い杭と短い杭を混用すると、各杭の負担水平荷重の差異やねじれが生じやすい。','地盤沈下のおそれのある敷地において、支持杭を採用する場合には、負の摩擦力による杭の支持力、杭の沈下量等を検討しなければならない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'構造',no:22,text:'建築構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['プレストレストコンクリート構造におけるプレテンション方式は、PC鋼材を緊張した状態でその周りに直接コンクリートを打設し、コンクリートが所定の強度に達した後に緊張端の張力を解放して、PC鋼材とコンクリートとの付着によりプレストレスを導入するものである。','制振構造には、特定の層を柔らかく設計して、その層にダンパーを設置し、建築物に入力された地震エネルギーを効果的に吸収させる方法もある。','免震構造は、規模や用途にかかわらず、戸建て住宅や超高層建築物等、幅広く適用することが可能である。','壁式鉄筋コンクリート構造は、一般に、軒高が20mの地上6階建ての建築物においても採用することができる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'構造',no:23,text:'合成構造及び混合構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['鉄骨梁と鉄筋コンクリートスラブとを頭付きスタッドを介して緊結した合成梁の曲げ剛性の算定に用いる床スラブの有効幅は、鉄筋コンクリート梁の曲げ剛性の算定に用いる床スラブの有効幅と同じとしてもよい。','デッキ合成スラブは、鋼製デッキプレートとその上に打設されるコンクリートとが一体となる構造で、面内せん断力の伝達も期待することができる。','コンクリート充填鋼管(CFT)構造の柱は、同一断面で同一板厚の鋼管構造の柱に比べて、水平力に対する塑性変形性能は高いが耐火性能は同等である。','鉄筋コンクリート構造のコア壁を耐震要素とし、外周部を鉄骨構造の骨組とした架構形式は、大スパン化による空間の有効利用に適している。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'構造',no:24,text:'鉄筋コンクリート造の建築物の構造設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['圧密沈下のおそれのある地盤において、直接基礎を採用した建築物の設計に当たり、不同沈下による建築物の損傷を生じにくくするために、基礎形式を独立基礎からべた基礎に変更した。','平面形状が細長い建築物の応力解析において、短辺方向に地震力を受ける場合には、床を剛と仮定しなかった。','床組の振動による使用上の支障がないことを、梁及び床スラブの断面の各部の応力を検討することにより確認した。','片持スラブの設計において、長期荷重に加えて地震時の上下振動を考慮して配筋を決定した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'構造',no:25,text:'建築物の構造設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['鉄骨構造の筋かい付き骨組の保有水平耐力計算において、X形筋かいの耐力は、引張側筋かいの耐力と圧縮側筋かいの座屈後安定耐力とを合算して求めることができる。','鉄骨構造の筋かいに山形鋼を用いる場合、小規模な建築物を除き、山形鋼を2本使用し、ガセットプレートの両側に取り付け、偏心を小さくする。','鉄骨鉄筋コンクリート構造の柱脚を非埋込形式とする場合、柱脚の曲げ終局強度は、アンカーボルトの曲げ終局強度、ベースプレート直下のコンクリートの曲げ終局強度及びベースプレート周囲の鉄筋コンクリートの曲げ終局強度を累加して求める。','鉄骨部材の許容圧縮応力度は、材種及び座屈長さが同じ場合、座屈軸周りの断面二次半径が小さくなるほど大きくなる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'構造',no:26,text:'免震構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['積層ゴムアイソレータを用いた免震構造は、一般に、水平地震動に対する免震効果はあるが、上下地震動に対する免震効果は期待できない。','長期荷重を受ける積層ゴムアイソレータの設計に用いる面圧は、支持軸力を積層ゴムの断面積で除した値とする。','転倒モーメントによりアイソレータに大きな引張軸力が生じる場合は、天然ゴム系の積層ゴムアイソレータを採用する。','天然ゴム系の積層ゴムアイソレータを用いた免震構造においては、アイソレータのみでは減衰能力が不足するので、オイルダンパーや鋼材ダンパー等を組み込む必要がある。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'構造',no:27,text:'木材及び木質系材料に関する次の記述のうち、最も不適当なものはどれか。',choices:['木材の曲げ強度は、一般に、気乾比重が大きいものほど大きい。','木材の木裏は、一般に、木表に比べて乾燥収縮が大きいので、木裏側が凹に反る性質がある。','LVLは、日本農林規格(JAS)において「単板積層材」と呼ばれ、主として各層の繊維方向が互いにほぼ平行となるように積層接着されたもので、柱、梁等の線材に使用される。','CLTは、日本農林規格(JAS)において「直交集成板」と呼ばれ、各層の繊維方向が互いにほぼ直角となるように積層接着されたもので、床版、壁等の面材に使用される。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'構造',no:28,text:'コンクリートに関する次の記述のうち、最も不適当なものはどれか。',choices:['コンクリートの初期の圧縮強度の発現は、一般に、セメントの粒子が細かいものほど早くなる。','コンクリートの圧縮強度は、一般に、材齢が同じ場合、大気中で養生した供試体よりも、大気と同一温度の水中で養生した供試体のほうが大きくなる。','コンクリートのせん断弾性係数は、一般に、ヤング係数の0.4倍程度である。','局部圧縮を受けるコンクリートの支圧強度は、一般に、全面圧縮を受けるコンクリートの圧縮強度よりも小さい。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'構造',no:29,text:'金属材料に関する次の記述のうち、最も不適当なものはどれか。',choices:['板厚40mm以下の建築構造用圧延鋼材SN400Bにおいて、基準強度F及び短期許容引張応力度は、235N/mm²である。','熱間圧延鋼材の強度は、圧延方向に比べて、板厚方向のほうが小さい傾向がある。','シャルピー衝撃試験の吸収エネルギーが小さい鋼材を使用することは、溶接部の脆性的破壊の防止に有効である。','アルミニウムの線膨張係数は、鉄の約2倍である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'構造',no:30,text:'建築物の構造設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['耐震性能の要求レベルを高くするために、建築主と協議のうえ、「住宅の品質確保の促進等に関する法律」に基づく「日本住宅性能表示基準」に規定される「耐震等級」を、等級3から等級1に変更した。','角形鋼管柱の許容曲げ応力度を、許容引張応力度と同じ値とした。','柱及び梁は、国土交通大臣が定めた構造方法によるプレキャスト鉄筋コンクリート造とし、直接土に接しない部分の鉄筋に対する最小かぶり厚さを2cmとした。','杭を鋼管杭とするに当たり、地盤が強い酸性ではなかったので、その鋼管の腐食代として厚さ1mmを見込んだ。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'施工',no:1,text:'監理者が行う一般的な監理業務に関する次の記述のうち、最も不適当なものはどれか。',choices:['監理者は、監理業務の着手に先立って、監理体制・監理業務内容・監理業務の進め方等の監理方針を策定し、建築主、工事施工者等に対してその監理方針を説明する。','監理者は、工事施工者から提出される請負代金内訳書に記載されている項目・数量・単価等の適否について、合理的な方法により検討を行い、その結果を建築主に報告する。','監理者は、工事請負契約の定めにより工事施工者から提出される工程表について、工事請負契約に定められた工期又は設計図書等に定められた品質が確保できないおそれがあると判断した場合には、速やかにその旨を工事施工者に報告する。','監理者は、工事監理に当たり、設計図書等に定めのある方法による確認のほか、目視による確認、抽出による確認、工事施工者から提出される品質管理記録の確認等、確認対象工事に応じた合理的方法により確認を行う。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'施工',no:2,text:'材料管理、品質管理等に関する次の記述のうち、最も不適当なものはどれか。',choices:['呼び径150mm以下の硬質ポリ塩化ビニル管の屋外での保管については、ビニル管の反りや変形防止のため、通気性のよいシートで覆い直射日光を避けた平坦な場所に、角材の上に井げた積みで、その高さが1.5m以下であることを確認した。','調合管理強度36N/mm²、スランプ21cmの高性能AE減水剤を使用したJIS規格品のコンクリートについては、スランプの変動幅が大きくなるため、スランプの許容差が±2.5cmであることを確認した。','外壁工事に用いる押出成形セメント板の保管については、屋内の平坦で乾燥した場所に、台木の上に積置きで、その高さが1.0m以下であることを確認した。','外壁工事に用いるGRC(ガラス繊維補強セメント)パネルについては、特記がなかったので、パネルの辺長の寸法許容差が±3mmであることを確認した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'施工',no:3,text:'建設工事における技術者の配置、施工管理等に関する次の記述のうち、最も不適当なものはどれか。',choices:['元請として建築一式工事を施工する特定建設業者は、当該工事に含まれる請負代金の額が500万円の屋根工事を自ら施工する場合には、当該屋根工事について所定の要件に該当する専門技術者を工事現場に置かなくてはならない。','解体工事業の業種区分の見直しにおいて、平成28年5月31日以前にとび・土工工事業の許可を受けて工作物等の解体工事を営んでいた建設業者は、平成28年6月1日から3年間は経過措置として、解体工事業の許可を受けることなく引き続き解体工事を施工することができる。','地方公共団体から直接建設工事を請け負った建設業者は、特定建設業又は一般建設業の許可にかかわらず、下請契約を締結する全ての工事において、施工体制台帳を作成し、建設工事の目的物を引き渡すまで工事現場ごとに備え置かなければならない。','元請として診療所併用住宅の建築一式工事を施工する特定建設業者は、診療所部分に相当する請負金額が7,000万円以上の場合、原則として、当該工事には専任の監理技術者を置かなくてよい。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'施工',no:4,text:'建築工事に関する届出等に関する組合せとして、最も不適当なものは、次のうちどれか。',choices:['届出等:「土壌汚染対策法」に基づく「一定の規模以上の土地の形質の変更届出書」、届出者等: 土地の形質の変更をしようとする者、届出先等: 都道府県知事','届出等:「廃棄物の処理及び清掃に関する法律」に基づく「産業廃棄物管理票交付等状況報告書」、届出者等: 産業廃棄物管理票を交付した排出事業者、届出先等: 都道府県知事','届出等:「建築基準法」に基づく工事中における「安全上の措置等に関する計画届」、届出者等: 建築主、届出先等: 都道府県知事','届出等:「建築物における衛生的環境の確保に関する法律」に基づく「特定建築物についての届出」、届出者等: 特定建築物の所有者等、届出先等: 都道府県知事'],answer:3,hasFigure:true,figureDesc:'届出等・届出者等・届出先等の3列の表形式で4つの組合せを示している。'},
{year:2017,subject:'施工',no:5,text:'地盤調査及び仮設工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['根切り底以深の地盤が粘性土層と砂質土層との互層となっていたので、砂質土層において揚水試験を行い、被圧地下水位、透水係数等を求めて、根切り工事の地下水処理工法を検討した。','地盤の変形や強さ等の支持力特性を直接把握するため、根切り工事後に平板載荷試験を実施した。','枠組足場において、高さ2m以上に設ける作業床の設置に当たり、墜落防止措置のため、床材と建地(支柱)との隙間を12cm未満とした。','吊り足場(ゴンドラの吊り足場を除く。)における作業床の最大積載荷重を定めるに当たり、吊りワイヤロープの安全係数を5とした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'施工',no:6,text:'土工事及び山留め工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['砂質地盤の掘削工事において、ボイリングの発生する可能性が高いと判断したので、動水勾配を減らすため、止水性のある山留め壁の根入れ長を延長した。','山留め工事における腹起しの継手は、火打材と切ばりとの間の曲げ応力の小さい位置とし、補強プレートとボルトとを使用して連結した。','土工事における根切りについて、粘性土地盤の床付け面を乱してしまったので、掘削土を使用して直ちにローラーによる転圧や締固めを行った。','山留め工事において、切ばりが切ばり支柱の一部と平面的に重なってしまったので、切ばり支柱の一部を切り欠いて補強を行ったうえで、切ばりを通りよくまっすぐに設置した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'施工',no:7,text:'杭地業工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['セメントミルク工法による既製コンクリート杭工事において、特記がなかったので、アースオーガーの支持地盤への掘削深さについては1.5m程度とし、杭の支持地盤への根入れ深さについては0.5m程度とした。','打込み工法による既製コンクリート杭工事において、打込み完了後の杭頭の水平方向の施工精度の目安については、杭径の1/4以下、かつ、100mm以下とした。','場所打ちコンクリート杭工事において、鉄筋かごの主筋間隔が10cm以下になると、コンクリートの充填性が悪くなるので、主筋を2本重ねて配置し、適切な主筋間隔を確保した。','アースドリル工法による場所打ちコンクリート杭工事において、孔壁の崩落防止に安定液を使用したので、杭に使用するコンクリートの単位セメント量を340kg/m³とした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'施工',no:8,text:'鉄筋工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['大梁の主筋の定着に当たり、所定のフックあり定着の長さを確保することができなかったので、大梁の主筋を柱仕口内に90度縦に折り曲げて定着することとし、柱仕口面から大梁の主筋の鉄筋外面までの投影定着長さを柱せいの1/2とした。','溶接継手を用いる大梁の主筋は、隣り合う鉄筋の溶接継手の位置を400mm以上離れるようにずらして配筋した。','大梁の主筋のガス圧接継手の外観検査において、圧接部の膨らみの直径が母材の鉄筋径の1.4倍であったが、膨らみの長さが母材の鉄筋径の1.1倍未満であったので、再加熱し、圧力を加えて所定の膨らみの長さに修正した。','大梁にU字形のあばら筋とともに用いるキャップタイについては、梁天端と段差のないスラブが取り付く側を90度フックとした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'施工',no:9,text:'型枠工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['型枠の構造計算を行うに当たり、コンクリートの打込み速さを10m/h以下、コンクリートの打込み高さを1.5mとして予定していたので、柱の側圧と壁の側圧とを同じ値とした。','型枠支保工の構造計算を行うに当たり、通常のポンプ工法による場合の打込み時の積載荷重として、1.5kN/m²を採用することを確認した。','梁下の支保工を材齢28日以前に取り外す必要があったので、標準養生した供試体の圧縮強度が、設計基準強度以上であることを確認した。','資材の搬出入に伴い、やむを得ずスラブ支柱の盛替えを行う必要がある旨の報告を受けたので、その範囲と方法を定めた施工計画書を作成させ、承認した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'施工',no:10,text:'表は、コンクリートの計画調合において使用する材料の絶対容積及び質量を記号で表したものである。この表の材料を使用したコンクリートに関する次の記述のうち、最も不適当なものはどれか。ただし、細骨材及び粗骨材は、表面乾燥飽水状態とする。',choices:['水セメント比(%)は、(E/F)×100 である。','細骨材率(%)は、{G/(G+H)}×100 である。','空気量(%)は、{1,000-(A+B+C+D)}/1,000×100 である。','フレッシュコンクリートの単位容積質量(t/m³)は、(E+F+G+H)/1,000 である。'],answer:2,hasFigure:true,figureDesc:'表: 絶対容積(l/m³)の欄に水A、セメントB、細骨材C、粗骨材D。質量(kg/m³)の欄に水E、セメントF、細骨材G、粗骨材H。'},
{year:2017,subject:'施工',no:11,text:'コンクリート工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['コンクリートポンプによるコンクリートの圧送に当たり、コンクリートの圧送に先立って圧送する富調合モルタルについては、型枠内に打ち込まずに全て破棄した。','コンクリート棒形振動機によるコンクリートの締固めにおいては、打込み層ごとに行い、その下層に振動機の先端が入るようにほぼ垂直に挿入し、挿入間隔を60cm以下としたうえで、コンクリートの上面にセメントペーストが浮くまで加振した。','床スラブのコンクリートの打込みをした翌日に、やむを得ず次工程の墨出しを行わなければならなかったので、適切な養生を行いコンクリートに振動や衝撃等の悪影響を与えない作業に限定して承認した。','普通ポルトランドセメントを使用したコンクリートの養生において、外気温の低い時期であったので、コンクリートを寒気から保護し、コンクリートの温度が2℃を下まわらない期間を3日とした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'施工',no:12,text:'プレキャスト鉄筋コンクリート工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['プレキャスト部材の製造に当たり、コンクリートの加熱養生において、前養生時間を3時間とし、養生温度の上昇勾配を15℃/hとした。','プレキャスト部材の製造に当たり、板状のプレキャスト部材の脱型時所要強度については、脱型時にベッドを70～80度に立て起こしてから吊り上げる計画としたので、コンクリートの圧縮強度を5N/mm²とした。','工事現場において、プレキャスト部材のエンクローズ溶接継手については、溶接後の鉄筋の残留応力を小さくするため、同一接合部の溶接作業を連続して行った。','工事現場において、プレキャスト部材と現場打ちコンクリートとの接合部については、コンクリートの打込みに先立ち、豆板等の欠陥を防止するため、散水してせき板及びプレキャスト部材の接合面を湿潤状態にした。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'施工',no:13,text:'鉄骨工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['溶接作業において、作業場所の気温が0℃であったので、溶接線の両側約100mmの範囲の母材部分を加熱(ウォームアップ)して溶接した。','完全溶込み溶接とする板厚の異なる突合せ継手において、部材の板厚差による段違いが薄いほうの板厚の1/4以下、かつ、10mm以下であったので、薄いほうの部材から厚いほうの部材へ溶接表面が滑らかに移行するように溶接した。','高力ボルト接合において、接合部に生じた肌すきが2mmであったので、フィラープレートを挿入しないこととした。','トルシア形高力ボルトの締付けの確認において、ナット回転量に著しいばらつきが認められるボルト群に対して、その群の全てのボルトのナット回転量を測定して平均回転角度を算出し、平均回転角度±30度の範囲であったものを合格とした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'施工',no:14,text:'鉄骨工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['工事現場における鉄骨の錆止め塗装において、鋼材表面の温度が50℃以上となり、塗膜に泡を生ずるおそれがあったので、塗装作業を中止した。','鉄骨の建方に先立って行うあと詰め中心塗り工法におけるベースモルタルの施工において、モルタル中心塗り部分のモルタルの塗厚さを60mmとし、養生期間を2日とした。','ロックウール吹付け工法による耐火被覆の施工において、柱の耐火材の吹付け厚さについては確認ピンを使用し、柱の1面に各1箇所以上を差し込んで確認した。','鉄骨の建方精度の管理において、建築物の倒れの管理許容差を、特記がなかったので、鉄骨精度検査基準((一社)日本建築学会「建築工事標準仕様書 鉄骨工事 付則6」)に従い、建築物の高さの1/4,000に7mmを加えた値以下、かつ、30mm以下とした。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'施工',no:15,text:'木造軸組工法による木工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['桁に使用する木材については、継伸しの都合上、やむを得ず短材を使用する必要があったので、その長さを2m内外とし、継手部分は短ざく金物で補強した。','建方精度の許容値は、特記がなかったので、垂直の誤差の範囲を1/1,000以下、水平の誤差の範囲を1/500以下とした。','ボルト径が16mmの孔あけ加工は、特記がなかったので、ボルトが木部のボルト孔に密着するように、ボルト孔の径をボルト径に2.0mmを加えた大きさとした。','地表面から高さ1m以下の外周壁内及び水まわり部分に接する壁内における柱、間柱、筋かい、構造用面材及び胴縁類には、特記がなかったので、JIS規格品の表面処理用木材保存剤を塗布した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'施工',no:16,text:'防水工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['シーリング工事において、鉄筋コンクリート造の建築物の外壁に設けるひび割れ誘発目地については、目地底にボンドブレーカーを使用せずに、シーリング材を充填する三面接着とした。','屋根保護防水絶縁工法によるアスファルト防水工事において、砂付あなあきルーフィングを一般平場部に使用したが、立上り部については省略した。','屋根保護防水密着工法によるアスファルト防水工事において、防水層の下地の立上り部の出隅部は面取りとし、入隅部は直角の納まりとした。','アスファルト防水工事において、工期短縮を図るため、プレキャスト化した「塔屋の壁基壇部」と「現場打ちコンクリートのスラブ」とを一体化して防水層の下地とした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'施工',no:17,text:'左官工事、石張り工事及びタイル工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['コンクリート壁下地へのモルタル塗りにおいて、下塗りは、吸水調整材の乾燥後に行った。','コンクリート床の石張り工事において、敷モルタルは、容積比でセメント1に対し砂4に少量の水を加え、手で握って形が崩れない程度の硬練りモルタルとした。','接着剤による陶磁器質タイル後張り工法において、屋外に使用する有機系接着剤は、JIS規格品の一液反応硬化形の変成シリコーン樹脂系のものとした。','セメントモルタルによるタイル後張り工法において、床タイル張り面の伸縮調整目地の位置については、特記がなかったので、縦・横ともに5mごとに設けた。'],answer:4,hasFigure:false,figureDesc:''},
{year:2017,subject:'施工',no:18,text:'金属工事及びガラス工事に関する次の記述のうち、最も不適当なものはどれか。ただし、建築物の天井は、特定天井又はシステム天井に該当しない吊り天井とする。',choices:['軽量鉄骨天井下地において、天井のふところが1.5mであったので、吊りボルトの水平補強及び斜め補強に当たり、∟-19×10×1.2(mm)の鋼材を使用した。','軽量鉄骨天井下地において、野縁を野縁受に留め付ける留付けクリップのつめの向きについては、野縁受の溝に確実に折り曲げられるように、向きを揃えて留め付けた。','設計図書において、強化ガラスの指定があったが、自然破損の危険性があるので、設計者、建築主、監理者、工事施工者等で協議して合わせガラス仕様に変更した。','アルミニウム製建具へのフロート板ガラスによる複層ガラス(6mm+A6+6mm)のはめ込みに当たり、不定形シーリング材構法における複層ガラスの掛り代を、特記がなかったので、15mm以上確保した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2017,subject:'施工',no:19,text:'内外装工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['カーペットのグリッパー工法において、上敷きの敷詰めは、隙間及び不陸をなくすように伸長用工具により幅500mmにつき200N程度の張力をかけて伸長し、グリッパーに固定した。','木造軸組構法の壁の充填断熱工法(はめ込み工法)における防湿層の設置については、ポリエチレンフィルムの防湿層の継目を柱等の木下地部分に設け、その重ね幅を30mm以上とした。','プレキャストコンクリートカーテンウォールの開口部にY型構造ガスケットの使用に当たり、コンクリート端面からY型ガスケットをプレキャスト版にはめ込むため の溝の中心までの寸法を、60mm以上とした。','システム天井において、天井パネルにロックウール化粧吸音板を使用したので、吸音板の軟化を防止するため、工事中の室内湿度が80％を超えないようにした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'施工',no:20,text:'設備工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['空気調和設備工事に用いるロックウール保温材のうち、ロックウールフェルトについては、特記がなかったので、フェルトの密度が20kg/m³のものを使用した。','合成樹脂製可とう電線管をコンクリートスラブに埋設するので、電線管をスラブ配筋の上端筋と下端筋との間に配管し、コンクリートの打込み時に管が移動しないように専用支持具等を使用して、曲り部分については0.5m以下の間隔で下端筋に結束した。','防火区画の壁を貫通する配電電線管は、呼び径82mm(外径89mm)の硬質塩化ビニル電線管とし、当該配電管と防火区画との隙間をモルタルで充填した。','エスカレーターの上下乗り場及び踏段で行う検査において、踏段相互間及びスカートガードと踏段との隙間については、エスカレーターの全長にわたって接触することなく5mm以下であることを確認した。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'施工',no:21,text:'各種工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['鋼板製屋根用折板を使用した屋根工事において、折板のけらば包みを1.8mの間隔で端部用タイトフレームに取り付けた。','鉄筋コンクリート造の建築物の屋根スラブに縦形ルーフドレンを取り付けるに当たり、梁との干渉がないことを確認のうえ、ルーフドレンの径が150mmであったので、あご付きパラペットのあごの垂直面からルーフドレンの中心までの距離が400mm確保されていることを確認した。','屋上のパラペットにおいて、オープン形式のアルミニウム製笠木の取付けに当たり、笠木部の固定金具の取付け完了後、コーナー部分の笠木を先に取り付け、直線部分の笠木については、両端から定尺部材を取り付け、中央部に調整部材を取り付けた。','建具工事において、防火扉の危害防止装置の検査については、扉の閉鎖時間をストップウォッチにより測定し、扉の質量により運動エネルギーを確認するとともに、プッシュプルゲージにより閉鎖力を測定した。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'施工',no:22,text:'耐震改修工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['鉄筋コンクリート造の増打ち耐震壁の増設工事において、打継ぎ面となる既存構造体コンクリートの表面については、特記がなかったので、目荒しとしてコンクリートを30mm程度斫り、既存構造体の鉄筋を露出させた。','鉄筋コンクリート造の耐力壁の新設工事において、新規に打ち込むコンクリートについては、壁頭部にグラウト材を注入することとしたので、梁下200mm程度の位置でコンクリートを打ち止めた。','金属系あと施工アンカーの穿孔作業において、穿孔した傾斜角が施工面への垂線に対して5度以内であったので合格とした。','金属系あと施工アンカーの施工後の現場非破壊試験において、引張試験を行うための確認試験荷重は、特記がなかったので、計算で得られた、「アンカーの鋼材による引張荷重」又は「コンクリート破壊による引張荷重」の小さいほうの2/3程度の値とした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2017,subject:'施工',no:23,text:'各種改修工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['かぶせ工法により既存建具を新規建具とする改修において、既存建具の方立・無目・障子等を撤去したうえで、外周枠を残し、その上から新規金属製建具を取り付けた。','塗膜はく離剤工法における既存の防水形複層塗材の塗り仕上げ外壁の改修において、特記がなかったので、試験施工を行ったうえで、既存の弾性を有する有機系塗膜を全面除去した。','タイル張り仕上げ外壁の改修において、モザイクタイルの広範囲にわたる浮きの改修については、注入口付アンカーピンニングエポキシ樹脂注入タイル固定工法を採用した。','シーリング再充填工法による防水改修において、既存シーリング材の除去については、目地被着体に沿ってカッターにより切込みを入れ、既存シーリング材をできる限り除去した後に、サンダー掛け等により清掃を行った。'],answer:3,hasFigure:false,figureDesc:''},
{year:2017,subject:'施工',no:24,text:'鉄骨工事におけるV形開先の突合せ継手において、図に示す記号部とその名称の組合せとして、正しいものは、次のうちどれか。',choices:['A: ベベル角度、B: 開先角度、C: ルート深さ、D: ギャップ','A: ベベル角度、B: 開先角度、C: ルート面、D: ルート間隔','A: 開先角度、B: ベベル角度、C: ルート面、D: ルート間隔','A: 開先角度、B: ベベル角度、C: ルート深さ、D: ギャップ'],answer:3,hasFigure:true,figureDesc:'V形開先の突合せ継手の断面図。A: 開先全体の角度、B: 片側の角度、C: ルート部の寸法、D: 裏当て金との間隔。母材と裏当て金を表示。'},
{year:2017,subject:'施工',no:25,text:'建築物の監理業務委託契約又は工事請負契約に関する次の記述のうち、四会連合協定「建築設計・監理等業務委託契約約款」又は民間(旧四会)連合協定「工事請負契約約款」に照らして、最も不適当なものはどれか。',choices:['監理業務委託契約において、委託者及び受託者は、受託者が監理業務を行うに当たり協議をもって決定した事項については、原則として速やかに、書面を作成し、記名・押印する。','監理業務委託契約において、監理業務を原設計者と異なる建築士に委託したとき、委託者は、監理業務の段階において、設計成果物について変更の必要が生じた場合、原則として、設計変更業務を原設計者に別途委託しなければならない。','工事請負契約において、受注者は、設計図書等に発注者又は監理者の立会いのうえ施工することを定めた工事を施工するときは、事前に発注者又は監理者に通知する。','工事請負契約において、受注者は、工事を完了したときは、設計図書等のとおりに実施されていることを確認して、監理者に検査を求め、監理者は、速やかにこれに応じて検査を行う。'],answer:4,hasFigure:false,figureDesc:''}
,
{year:2016,subject:'計画',no:1,text:'技術者倫理等の用語に関する次の記述のうち、最も不適当なものはどれか。',choices:['「アカウンタビリティ」は、一般に、業務や研究活動についての「説明する責任」のことをいう。','「談合」は、一定の利益を業界全体にもたらすことを目的とするもので、同業種の業者が資本を結合し、共同企業体を設けることも含む。','「公益通報」には、通報先や状況によって、「内部通報」、「行政機関への通報」及び「外部通報」の三つの種類がある。','「コンプライアンス」は、一般に、「法令遵守」と訳され、法令・条例等の遵守に加えて企業倫理等の遵守も含む。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'計画',no:2,text:'建築物の保存、再生、活用等に関する次の記述のうち、最も不適当なものはどれか。',choices:['東京駅丸の内駅舎(東京都千代田区)は、赤レンガのファサードをもつ駅舎であり、特例容積率適用地区制度を活用して、未利用容積を周辺建築物に売却・移転したうえで、保存・復原したものである。','目黒区総合庁舎(東京都目黒区)は、民間企業の本社屋として建築された建築物を、耐震補強、設備改修等を行ったうえで、庁舎として再生・転用したものである。','神奈川県立近代美術館鎌倉館(神奈川県鎌倉市)は、竣工時の形状を損なうことなく地震に対する安全性を高めるため、免震レトロフィット工法を採用し、保存・改修したものである。','旧門司税関(福岡県北九州市)は、明治・大正時代の歴史的建造物を活かしたまちづくりである「門司港レトロ事業」の一環として、明治45年に建築された税関庁舎を、港湾緑地の休憩所等として再生・活用したものである。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'計画',no:3,text:'歴史的な建築物に関する次の記述のうち、最も不適当なものはどれか。',choices:['ハギア・ソフィア大聖堂(トルコ)は、バシリカ形式とドーム集中形式とを融合させた平面をもち、巨大なドーム構造によって内部に広大な空間を作り出したビザンチン様式の建築物である。','コルドバの大モスク(スペイン)は、紅白縞文様の2段アーチを伴って林立する柱による内部空間をもち、現在はキリスト教文化とイスラム教文化が混在している建築物である。','ピサ大聖堂(イタリア)は、世界最大級の石積ドームをもち、外装はピンクや緑の大理石により幾何学模様で装飾され、クーポラとランターンは初期ルネサンス様式、ファサードはネオ・ゴシック様式の建築物である。','ヴォルムス大聖堂(ドイツ)は、東西両端にアプスを対置させた二重内陣と身廊の両側に側廊を設けたバシリカ形式で構成され、東西の内陣と交差部とに六つの塔をもつロマネスク様式の建築物である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'計画',no:4,text:'建築物の開口部等に用いるガラスに関する次の記述のうち、最も不適当なものはどれか。',choices:['Low-E複層ガラスは、中空層側のガラス面に特殊金属膜をコーティングすることで、中空層における放射伝熱を低減した複層ガラスである。','単板の強化ガラスは、同厚のフロート板ガラスと比較して6～10倍の強度をもつため、特段の措置を講じることなく、アトリウム等の屋根、スカイライト、トップライト等での使用に適している。','合わせガラスは、2枚以上の板ガラスでプラスチックフィルムを挟み加熱圧着したものであり、破損時の飛散防止や開口部の防犯性能の向上等を目的として用いられる。','板ガラスの耐風圧性能を考慮した使用可能面積は、設計風圧力、ガラスの厚さ、支持条件等が同一であれば、フロート板ガラスに比べて網入磨き板ガラスのほうが小さい。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'計画',no:5,text:'建築物とその周辺環境に関する次の記述のうち、最も不適当なものはどれか。',choices:['高層建築物の計画において、地表面付近の風速増加率は、計画地の周囲に建築物がない場合に比べ、周囲に低層建築物群がある場合のほうが大きくなる傾向がある。','建築物の周辺の気流は、「建築物の高さ(H)と建築物の間隔(W)の比(H/W)」や「街区面積に対して建築物が占める割合」により大きく影響される。','高層建築物の計画において、床面積が大きい低層部を設け、当該低層部の屋根の上部に強風を発生させる計画とすると、建築物周辺の歩行者へのビル風の影響が少なくなる。','ビル風対策としての植栽計画においては、耐風性の高い樹種を選定するとともに、低木を避け高木を風向きと平行となる向きに並べて配置することが有効である。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'計画',no:6,text:'自然エネルギーを利用したパッシブデザインに関する次の記述のうち、最も不適当なものはどれか。',choices:['十分な日射が得られる北緯35度の地点において、建築物が受ける日射量は、冬期においては南面が多く、夏期においては水平面・東西面が多いことから、集熱窓を、南面で大きく、東西面で小さくすることが省エネルギー上有効である。','パッシブクーリングの原則は、日射熱の侵入を極力排除したうえで通風を図り、自然エネルギーの利用により室内空気を冷やすことである。','コンクリート躯体を蓄熱体として利用するためには、「外断熱とすること」、「開口部からの日射を直接コンクリート躯体に当てること」、「コンクリート躯体を直接室内に露出させること」等が有効である。','クールチューブは、外気温が低下する夜間に自然通風を図り、居住者に涼感を与えるとともに、室内の蓄熱体の温度を下げ、翌日の室温上昇を抑える方式である。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'計画',no:7,text:'一般公共の用に供する屋内駐車場(自動車の駐車の用に供する部分の面積が1,000m²のもの)の各部の寸法に関する次の記述のうち、最も不適当なものはどれか。',choices:['車いす使用者用駐車施設について、1台当たりの駐車スペースを、幅3.5m×奥行6.0mとした。','小型自動車の車路の梁下の高さを、2.1mとした。','一方通行の小型自動車の車路のうち、車路に接して駐車料金の徴収施設が設けられている場所で、歩行者の通行の用に供しない部分の幅員を、2.75mとした。','小型自動車の車路の屈曲部の内法半径を、5mとした。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'計画',no:8,text:'建築物の各部の寸法等に関する次の記述のうち、最も不適当なものはどれか。',choices:['中規模事務所ビルの計画において、基準階の共用部の主要な廊下の幅員を、2.0mとした。','公共体育館の計画において、成人用バスケットボールコートを二面配置するために、床面の内法寸法を、30m×35mとした。','バスターミナルの誘導車路の屈曲部の計画において、全長12m程度の大型バスの最小回転半径を、12mとした。','大規模量販店の計画において、売場の客用通路の幅員は、主要な避難通路を3.0mとし、それ以外の通路を1.8mとした。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'計画',no:9,text:'劇場、競技場等の客席・観覧席の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['車いす使用者用客席・観覧席の数(可動席スペースを含む。)は、施設内容や規模に応じ、客席・観覧席総数の0.5～1％以上とする。','車いす使用者用客席・観覧席は、少なくとも同時に2以上の車いす使用者が利用できる専用スペースとして、固定位置に確保する。','サイトライン(可視線)は、客席・観覧席の各々の人が、前列の人の頭又は肩を越して視焦点(舞台や競技場)を見ることができる視野の限界線のことである。','客席・観覧席の出入口から車いす使用者用客席・観覧席へ至る客席・観覧席内の通路は、有効幅員を120cm以上とするとともに、区間100m以内ごとに車いすが転回することができる140cm角以上のスペースを設ける。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'計画',no:10,text:'都市計画・都市デザインに関する次の記述のうち、最も不適当なものはどれか。',choices:['高蔵寺ニュータウン(愛知県)は、高度経済成長期に名古屋圏に流入し、増加した人口の受け皿として、「近隣住区」等の都市計画理論に基づき開発された我が国で最初のニュータウンである。','筑波研究学園都市(茨城県)は、東京への一極集中を緩和するために、職住一体の「田園都市」として構想されたものである。','川越一番街(埼玉県)では、「パタン・ランゲージ」に範をとった町づくり規範により、歴史的町並みの景観の保全が実践されている。','くまもとアートポリス(熊本県)は、環境デザインに対する関心を高め、都市環境・建築文化等の向上を図るために、「コミッショナー」が設計者を推薦する手法が採用された事業である。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'計画',no:11,text:'まちづくりに関する用語とその説明として、最も不適当なものは、次のうちどれか。',choices:['レジリエンスは、一般に、自然災害等により、社会基盤やそれが支える社会及び経済が一時的に大きなダメージを受けても、速やかに復活できること等を意味する。','ダウンゾーニングは、都市計画で定められた容積率の引下げや建築することができる用途を住宅等に限定する等、規制を現行に比べて厳しいものに変更することである。','トランジットモールは、歩行者用の空間であるモールの形態の一つであり、一般の自動車の進入を排除して、路面電車やバス等の公共交通機関に限って走行を認めたものである。','エリアマネジメントは、行政主導により地域における良好な環境や地域の価値を維持・向上させるための取組みのことである。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'計画',no:12,text:'住宅の作品名(設計者)とその計画上の特徴に関する次の記述のうち、最も不適当なものはどれか。',choices:['イームズ自邸(チャールズ&レイ・イームズ)は、再組立が可能という理念のもと、形鋼やスチールサッシ等の工業製品を用いて建築された住宅である。','ゲーリー自邸(フランク・O・ゲーリー)は、既存の木造住宅に、安価な材料である金網やトタン板、ベニヤ板の断片等を組み合わせて増改築を行った、ポストモダンを代表する住宅の一つである。','ヒラルディ邸(ルイス・バラガン)は、不整形敷地に建つ地上4階建ての医院併用住宅であり、台形の平面をもつ医院と矩形の平面をもつ住居は、中庭のスロープによって繋がれている。','フィッシャー邸(ルイス・カーン)は、二つの矩形のボリュームが45度の角度をもって接合され、一方には2層の個室群が配置され、もう一方には2層分の高さの居間をもつ、幾何学的な構成の住宅である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'計画',no:13,text:'住宅団地及び集合住宅の計画上の特徴に関する次の記述のうち、最も不適当なものはどれか。',choices:['茨城県営松代アパート(茨城県つくば市)は、七つの住棟により囲まれた二つの中庭をもち、屋根葺材には地元で焼かれた瓦を使用する等、周辺との融和に配慮された地上3階建ての低層集合住宅である。','コモンシティ星田A2(大阪府交野市)は、敷地内の緩斜面を活かした緑道の配置や、塀・門を極力設けない外構計画等により、連続した開放的な外部空間を創り出した戸建での住宅団地である。','NEXT21(大阪府大阪市)は、二段階供給方式(スケルトン・インフィル分離方式)と環境共生をテーマにし、住戸の外壁等の規格化・部品化による可変性の確保や屋上植栽等が試みられた集合住宅である。','幕張ベイタウンパティオス4番街(千葉県千葉市)は、壁面線の位置・高さ、壁面率等についての「都市デザインガイドライン」に沿って設計された集合住宅であり、街区型の形式に特徴がある。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'計画',no:14,text:'事務所ビルの計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['事務室内のヘビーデューティーゾーン(重荷重ゾーン)の床の積載荷重を、2,300N/m²とした。','事務室内のフリーアクセスフロアの高さを、100mmとした。','事務室内の照明計画において、アンビエント照明の照度を、500lxとした。','基準階の事務室の床面積を1,000m²とする貸事務所ビルの計画において、男子小便器3個、男子大便器3個、女子便器4個とした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'計画',no:15,text:'博物館・劇場の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['博物館の保存、修復のための調査・研究部門は、研究対象である収蔵品の移動を最小限に留めるために、調査・研究部門と収蔵部門とを隣接して設ける計画とした。','博物館の収蔵部門は、収蔵庫内の保存環境を一定に保つため、前室を設ける計画とした。','劇場の搬出入のためのサービスヤードにおいて、ウィング式(荷台の側面と屋根面を一体として上方に開くことができるもの)の大型トラックが停車するスペースの、床から天井までの高さを4mとした。','劇場において、定員600人の固定式の客席部分の面積(通路を含む。)を、400m²とした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'計画',no:16,text:'病院の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['手術部の計画に当たり、他部門との速やかな連携や機材等の搬出入に配慮し、他部門間の通過動線を手術部内に設ける計画とした。','外来診療部の計画に当たり、患者の出入りの多い内科は外来入口の近くに配置し、小児科は可能な限り他科と分離して計画した。','LDR室の計画に当たり、家具や空間の仕上げに木材を使用する等、暖かい家庭的な雰囲気となるように配慮した。','看護拠点の計画に当たり、看護動線の短縮及び病室内の患者の観察の容易さを確保するため、ナースステーションの他にナースコーナーを設け、看護の作業領域を分散した。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'計画',no:17,text:'建築物の外装の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['エアフローウィンドウは、一般に、二重のガラス間にブラインド等の遮光装置を設置し、空調空気を通すことで、ペリメーターゾーンの熱負荷を軽減するシステムである。','SSG構法は、ガラスを室内側に設置したフレーム(バック・マリオン)に構造シーラントを用いて接着することで、室外側にほとんどサッシが見えないフラットなガラス面を構成できるものである。','カーテンウォール工事におけるフィルドジョイント構法は、外装材の接合部分の水密性能を確保するため、内外の空気圧を等圧にすることにより、雨水を重力で排水するものである。','メタルカーテンウォールにおけるマリオン方式(方立方式)は、マリオンが日射等の熱により膨張・収縮することから、変形に対する追従機構が必要である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'計画',no:18,text:'建築士法第25条の規定に基づく「建築士事務所の開設者がその業務に関して請求することのできる報酬の基準(平成21年国土交通省告示第15号)」に照らし、「工事監理に関する標準業務」の業務内容として、最も不適当なものは、次のうちどれか。',choices:['設計図書の内容を把握し、設計図書に明らかな矛盾、誤謬、脱漏、不適切な納まり等を発見した場合には、設計者に報告し、必要に応じて工事施工者に確認する。','設計図書の定めにより、工事施工者が作成し、提出する施工図(躯体図、工作図、製作図等をいう。)、製作見本、見本施工等が設計図書の内容に適合しているかについて検討し、建築主に報告する。','工事施工者の行う工事が設計図書の内容に適合しているかについて、設計図書に定めのある方法による確認のほか、目視による確認、抽出による確認、工事施工者から提出される品質管理記録の確認等、確認対象工事に応じた合理的方法により確認を行う。','工事と設計図書との照合及び確認の結果、工事が設計図書のとおりに実施されていないと認めるときは、直ちに、工事施工者に対して、その旨を指摘し、当該工事を設計図書のとおりに実施するよう求め、工事施工者がこれに従わないときは、その旨を建築主に報告する。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'計画',no:19,text:'図のような鉄筋コンクリート構造の梁において、スタラップの割付本数が設計図書に記載されていない場合、建築工事建築数量積算研究会「建築数量積算基準」に照らして、スタラップの割付本数の値として、正しいものは、次のうちどれか。ただし、図に記載されていない鉄筋は適切に配筋されているものとする。',choices:['37本','38本','39本','40本'],answer:3,hasFigure:true,figureDesc:'鉄筋コンクリート構造の梁の断面図。柱間のスパンは5,600mm、両側の柱幅は各900mm。梁せいは800mm。スタラップはD13-@150で配筋。'},
{year:2016,subject:'計画',no:20,text:'プロジェクトマネジメントに関する次の記述のうち、最も不適当なものはどれか。',choices:['賃貸住宅におけるサブリース事業は、賃貸管理事業者が建物所有者等から建築物を転貸目的として賃借し、自らが転貸人となって入居者に転貸するシステムによって行う賃貸管理事業である。','BCPは、企業が災害や事故で被害を受けても、重要な業務が中断しないこと、中断しても可能な限り短い期間で再開すること等、事業の継続を追求する計画である。','CSRは、企業が所有する不動産について、経営戦略的な視点に立って見直しを行い、不動産投資の効率性を最大限向上させるという考え方である。','PFI事業におけるSPCは、ある特定の事業を実施することを目的として設立される会社で、PFI事業以外の投資は行わず、PFIの契約期間が終了すれば解散するものである。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'環境・設備',no:1,text:'環境工学における用語に関する次の記述のうち、最も不適当なものはどれか。',choices:['PMVは、室内の温熱感覚に関係する、気温、放射温度、相対湿度、気流速度、人体の代謝量及び着衣量を考慮した温熱環境指標である。','照度は、目で見た明るさに直接的な関わりがあり、屋内照明器具による不快グレアの評価に用いられる。','プルキンエ現象は、暗所視において、比視感度が最大となる波長が短い波長へずれる現象である。','残響室法吸音率は、残響室内に試料を設置した場合と設置しない場合の残響時間を測定して、その値をもとに算出する試料の吸音率である。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'環境・設備',no:2,text:'住宅における結露の防止に関する次の記述のうち、最も不適当なものはどれか。',choices:['浴室から他の室への水蒸気の浸入を抑制するため、浴室に設置した排気ファンを使用した。','外壁の内部結露を防止するため、断熱材の室内側に防湿層を設けた。','木造住宅における最上階の天井部分のみに断熱材を施した屋根において、野地板面の結露を防止するため、小屋裏に換気口を設けた。','暖房設備から室内に発生する水蒸気の量を抑制するため、暖房設備を密閉型燃焼器具の代わりに開放型燃焼器具とした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'環境・設備',no:3,text:'定常状態における室内の二酸化炭素濃度を上限の基準である1,000ppm以下に保つために、最低限必要な外気の取入量として最も適当な値は、次のうちどれか。ただし、人体一人当たりの二酸化炭素発生量は0.024m³/(h・人)であり、人体から発生した二酸化炭素は直ちに室全体に一様に拡散するものとし、外気の二酸化炭素濃度を400ppmとする。また、隙間風は考慮しないものとする。',choices:['20m³/(h・人)','30m³/(h・人)','40m³/(h・人)','50m³/(h・人)'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'環境・設備',no:4,text:'伝熱に関する次の記述のうち、最も不適当なものはどれか。',choices:['透明フロート板ガラスは、一般に、可視光線に比べて長波長域の赤外線を通しにくい。','単層壁の熱貫流抵抗は、同一の材料で壁の厚さを2倍にしても2倍にはならない。','壁体表面の対流熱伝達率は、風速が大きいほど大きくなる。','グラスウールの熱伝導率は、一般に、かさ比重(密度)が大きいほど大きくなる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'環境・設備',no:5,text:'建築物における防火・防災に関する次の記述のうち、最も不適当なものはどれか。',choices:['水平避難方式は、一つの階を複数のゾーン(防火区画や防煙区画)に区画し、火災の発生時に、火災の発生していないゾーンに水平に移動することによって安全を確保する方法である。','火災室で発生した熱を伴った煙は、階段室に流入すると、一般に、3～5m/s程度の速さで上昇する。','中央部に光庭となるボイド空間を設けた超高層集合住宅において、ボイド空間を取り囲む開放廊下を避難経路とする場合、煙の拡散を防ぐために下層部分からボイド空間への給気を抑制する必要がある。','等価可燃物量は、可燃物発熱量が等価な木材の重量に換算した量である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'環境・設備',no:6,text:'図のような直方体の建築物の冬至日における1時間ごとのある水平面上の日影図(数字は真太陽時を示す。)に関する次の記述のうち、最も不適当なものはどれか。ただし、A点及びB点は、その水平面上にあるものとする。',choices:['この建築物により、終日日影ができる。','A点は、1日のうち3時間以上日影になる。','建築物の高さのみを3倍にしても、B点の日影には影響しない。','建築物の高さのみを現状より高くしても、4時間日影線は変化しない。'],answer:2,hasFigure:true,figureDesc:'直方体の建築物の冬至日における1時間ごとの水平面上の日影図。真北方向が示され、8:00から16:00までの各時刻の日影線が放射状に描かれている。建築物の北側にA点とB点が示されている。A点は建築物に近い位置、B点はやや離れた位置にある。日の出・日没の方向も示されている。'},
{year:2016,subject:'環境・設備',no:7,text:'昼光・照明に関する次の記述のうち、最も不適当なものはどれか。',choices:['輝度は、光源面だけではなく、反射面及び透過面についても定義できる。','昼光率は、室内各部の反射率の影響を受ける。','配光曲線は、光源の各方向に対する輝度の分布を示すものである。','光幕反射を減らすためには、光が視線方向に正反射する位置に光源を配置しないことが重要である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'環境・設備',no:8,text:'色彩に関する次の記述のうち、最も不適当なものはどれか。',choices:['マンセル表色系において、「5G7/8と表される色」より「5G8/6と表される色」のほうが明度は高い。','色の面積効果は、面積が小さいほど明度・彩度が高く感じられる効果である。','演色性は、視対象の色の見え方に及ぼす光源の性質であり、光源の分光分布に依存する。','面色や開口色は、空間的な定位や肌理を感じられない色の見え方である。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'環境・設備',no:9,text:'音響に関する次の記述のうち、最も不適当なものはどれか。',choices:['人の可聴周波数の範囲はおよそ20Hzから20kHzであり、対応する波長の範囲は十数mから十数mmである。','拡散性の高い室に、音響パワーが一定の音源がある場合、室の平均吸音率が2倍になると、室内平均音圧レベルは約3dB減少する。','セイビン(Sabine)の残響式によると、残響時間は、容積が1,000m³で等価吸音面積200m²の室より、容積が500m³で等価吸音面積120m²の室のほうが短い。','アナウンススタジオの室内騒音のNC推奨値は、一般に、NC-35とされている。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'環境・設備',no:10,text:'遮音・吸音に関する次の記述のうち、最も不適当なものはどれか。',choices:['重量床衝撃源による床衝撃音については、カーペット等の柔らかい床仕上げ材を用いても、遮断性能の向上はほとんど期待できない。','壁に多孔質吸音材料を使用するに当たり、表面を孔あき板やリブ等で保護する場合、開孔率が小さいと共鳴器型の吸音特性が現れることがある。','単層壁による遮音において、同一の材料で壁の厚さを薄くしていくと、コインシデンス効果による遮音性能の低下の影響範囲は、より低い周波数域へ拡大する。','窓に複層ガラスを用いると、共鳴周波数付近においては、同一面密度の単板ガラスより、遮音性能が劣ることがある。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'環境・設備',no:11,text:'冷凍機に関する次の記述のうち、最も不適当なものはどれか。',choices:['吸収冷凍機は、一般に、同一容量の遠心冷凍機に比べて、振動及び騒音が小さい。','吸収冷凍機は、一般に、同一容量の遠心冷凍機に比べて、冷却水量が少ない。','吸収冷凍機は、一般に、同一容量の遠心冷凍機に比べて、機内(冷媒循環系)の圧力が低い。','吸収冷凍機は、一般に、同一容量の遠心冷凍機に比べて、消費電力が少ない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'環境・設備',no:12,text:'空気調和設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['外気冷房の省エネルギー効果は、内部発熱密度が高い建築物ほど期待できる。','単一ダクト方式において、外気冷房を用いた場合、冬期における導入外気の加湿を行うためのエネルギーを削減することができる。','データセンターの空気調和設備の特徴は、「年間連続運転」、「年間冷房」、「顕熱負荷が主体」等であり、計画地の気象条件等によっては、外気冷房や冷却塔フリークーリングが効果的な省エネルギー手法として考えられる。','データセンターのエネルギー効率を定量的に評価する指標PUE(Power Usage Effectiveness)は、「データセンター全体のエネルギー消費量」を「ICT機器のエネルギー消費量」で除した値である。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'環境・設備',no:13,text:'換気設備・排煙設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['ボイラー室等の燃焼機器を使用する機械室の換気方式は、第3種換気とする。','置換換気(ディスプレイスメント・ベンチレーション)は、汚染物質が周囲の空気より高温又は軽量の場合に有効である。','隣接した二つの防煙区画において、一般に、防煙垂れ壁を介して一方の区画を自然排煙、他方の区画を機械排煙とすることはできない。','機械排煙設備において、天井の高さが3m未満の居室に設ける排煙口の設置高さ(下端高さ)は、一般に、天井から80cm以内、かつ、防煙垂れ壁の下端より上の部分とする。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'環境・設備',no:14,text:'給排水設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['受水槽の材質については、腐食のおそれがあるため、現在、木を使用することはできない。','排水再利用水は、人の健康に係る被害の防止のため、大腸菌が検出されない場合であっても、飲料水として使用することはできない。','給水管を、硬質塩化ビニルライニング鋼管とし、管端防食継手を使用すれば、赤水の発生を防止することができる。','給湯用ボイラーは、常に缶水が新鮮な補給水と入れ替わるため、空気調和設備用温水ボイラーに比べて腐食しやすい。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'環境・設備',no:15,text:'給排水設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['病院等の災害応急対策活動に必要な施設においては、受水槽や必要な給水管分岐部に地震の感知により作動する緊急給水遮断弁等を設けることが望ましい。','給湯設備の転倒、移動等による被害を防止するため、満水時の質量が15kgを超える給湯器については、一般に、アンカーボルトによる固定等の転倒防止の措置を講じる。','排水槽において、排水及び汚泥の排出を容易にするため、底部には吸込みピットを設けるとともに、排水槽の底部の勾配は、吸込みピットに向かって1/5以上とする。','一般的な事務所ビルにおいて、災害応急対策として、飲料用受水槽の容量を1日予想給水量の2倍程度に設定する場合は、水道法の規定による残留塩素の濃度を確保するため、塩素注入等を行う。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'環境・設備',no:16,text:'照明設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['照明制御の一つの方法として、照度センサを用いて不在エリアを消灯・減光する方法がある。','昼光を利用する照明計画を行う場合には、一般に、日射による空調負荷を抑えるための検討も必要となる。','照度計算に用いられる保守率は、ランプの経年劣化やほこり等による照明器具の効率の低下をあらかじめ見込んだ定数である。','病院の手術室・診察室において使用する照明設備は、事務室において使用する照明設備に比べて、演色性の高い光源とすることが望ましい。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'環境・設備',no:17,text:'電気設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['逆潮流は、コージェネレーションシステムや太陽光発電システム等で系統連系を行う場合に、需要家側から商用電力系統へ向かう電力潮流のことである。','燃料電池の発電の原理は、水の電気分解と逆の反応を利用したもので、水素と酸素が結合して電気と水が発生する化学反応である。','集合住宅において、契約電力が60kWを超える場合は、一般に、受変電設備の必要性が高くなる。','電圧の種別において、特別高圧と高圧とを区分する電圧は、6,000Vである。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'環境・設備',no:18,text:'防災設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['非常用の照明装置の予備電源には、蓄電池を照明器具に内蔵しない方式がある。','差動式熱感知器は、周囲が一定の温度以上になると火災信号を発する感知器である。','補助散水栓は、屋内消火栓のうち2号消火栓(広範囲型を除く。)と同等の放水量を有し、スプリンクラー設備へ配管接続する。','開放型スプリンクラーヘッドは、天井が高く種々の可燃物がある舞台部等に用いる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'環境・設備',no:19,text:'建築設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['一般的な事務所ビルにおいて、水槽類を除く設備機器を同一階に設置する場合、局部震度法による設計用標準震度は、防振支持された設備機器のほうが大きい値となる。','超高層建築物において、中央管理方式の空気調和設備の制御及び作動状態の監視を行うための室として、避難階又はその直上階若しくは直下階に、中央管理室を設ける。','乗用エレベーターは、一般に、火災発生時の乗客の避難を図るため、火災時管制運転により速やかに最寄階に停止させる計画とする。','非常用エレベーターを2基設置する必要がある場合、避難上及び消火上有効な間隔を保って配置する。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'環境・設備',no:20,text:'環境・設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['再生可能エネルギーは、自然界に存在し繰り返し再生利用できるエネルギーのことであり、そのエネルギー源としては、太陽光、風力、水力、地熱、バイオマス等がある。','冷凍機に使用される代替冷媒のフロン(HFC)は、オゾン破壊係数はゼロではあるが、温室効果ガスの一種である。','コージェネレーションシステムの原動機としては、ガスエンジン、ディーゼルエンジン、ガスタービン等が使用される。','エレベーターの電力消費は、電力回生制御の有無により変化するが、巻上機のギアの有無には影響されない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:1,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['レストランの調理室は、「居室」である。','地上3階建ての共同住宅における2階の床及びこれを支持するはりに鉄筋を配置する工事の工程は、「特定工程」である。','建築物に設ける消火用の貯水槽は、「建築設備」である。','延べ面積2,000m2の警察署は、「特殊建築物」である。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:2,text:'面積、高さ又は階数に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['延べ面積1,000m2の建築物の電気設備室に設置する自家発電設備の設置部分の床面積が20m2の場合、当該部分の床面積については、建築基準法第52条第1項に規定する容積率の算定の基礎となる延べ面積に算入しない。','国土交通大臣が高い開放性を有すると認めて指定する構造の建築物については、その端から水平距離1m以内の部分の水平投影面積は、建築面積に算入しない。','前面道路の境界線から後退した建築物の各部分の高さの制限において、当該建築物の後退距離の算定の特例を受ける場合の「軒の高さ」の算定については、前面道路の路面の中心からの高さとする。','建築物の屋上部分に昇降機塔及び装飾塔がある場合で、それらの水平投影面積の合計が当該建築物の建築面積の1/8以下のものは、階数に算入しない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:3,text:'都市計画区域内における次の行為のうち、建築基準法上、確認済証の交付を受ける必要がないものはどれか。ただし、防火地域、準防火地域又は建築等に関する確認済証の交付を受ける必要がない区域の指定はないものとする。',choices:['木造、延べ面積500m2、高さ8m、地上2階建ての共同住宅における、屋根の過半の修繕','鉄骨造、延べ面積80m2、平家建ての一戸建て住宅における、鉄骨造、床面積12m2、平家建ての附属自動車車庫の増築','商業地域内において、鉄筋コンクリート造、延べ面積300m2、地上2階建ての診療所(患者の収容施設があるもの)の、大規模の修繕又は大規模の模様替を伴わない地域活動支援センターへの用途の変更','遊園地に設ける回転運動をする遊戯施設のうち、原動機を使用するメリーゴーラウンドの築造'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:4,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['木造、延べ面積400m2、地上2階建ての共同住宅を新築する場合においては、当該建築主は、検査済証の交付を受ける前においても、指定確認検査機関が安全上、防火上及び避難上支障がないものとして国土交通大臣が定める基準に適合していることを認めたときは、仮に、当該建築物又は建築物の部分を使用し、又は使用させることができる。','地上3階建ての百貨店(3階における当該用途に供する部分の床面積の合計が1,600m2のもの)の大規模の修繕の工事で、避難施設等に関する工事の施工中において建築物を使用する場合においては、当該建築主は、仮使用の認定に加え、あらかじめ、工事の施工中における建築物の安全上、防火上又は避難上の措置に関する計画を作成して特定行政庁に届け出なければならない。','延べ面積1,000m2、地上4階建ての事務所の敷地、構造及び昇降機以外の建築設備については、当該所有者(所有者と管理者が異なる場合においては、管理者)は、定期に、一級建築士若しくは二級建築士又は国土交通大臣が定める資格を有する者にその状況を調査又は検査をさせてその結果を特定行政庁に報告する必要はない。','建築物の用途の変更についての確認済証の交付を指定確認検査機関から受けた場合においては、当該建築主は、建築物の用途の変更に係る工事が完了したときは、当該指定確認検査機関に届け出なければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:5,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['床が地盤面下にあり天井の高さが3mである階で、地盤面から天井までの高さが2m以下のものは、地階である。','高等学校における生徒用の階段で、避難階以外の階から避難階又は地上に通ずる屋外の直通階段の幅は、140cm以上としないことができる。','病院における病室の窓その他の開口部で採光に有効な部分の面積は、用途地域に関係なく算定することができる。','集会場の用途に供する床面積300m2の居室に、換気に有効な部分の面積が15m2の窓を設けた場合においても、所定の技術的基準に従って、換気設備を設けなければならない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:6,text:'防火区画等に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、「避難上の安全の検証」は行われていないものとする。',choices:['準防火地域内においては、地上15階建ての事務所の12階部分で、当該階の床面積の合計が500m2のものは、原則として、床面積の合計100m2以内ごとに防火区画しなければならない。','1階を自動車車庫(当該用途に供する部分の床面積の合計が200m2)とし、2階以上の部分を事務所とする地上5階建ての建築物においては、当該自動車車庫部分と事務所部分とを防火区画しなければならない。','防火区画に接する外壁については、外壁面から50cm以上突出した準耐火構造のひさし、床、袖壁等で防火上有効に遮られている場合においては、当該外壁の所定の部分を準耐火構造とする要件が緩和される。','準防火地域内においては、延べ面積1,000m2、地上3階建ての共同住宅の各戸の界壁は、耐火構造とし、小屋裏又は天井裏に達せしめなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:7,text:'耐火建築物等に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['防火地域内において、地下1階、地上2階建ての事務所を新築する場合は、耐火建築物としなければならない。','準防火地域内において、延べ面積1,000m2、地上3階建ての自動車車庫(各階を当該用途に供するもの)を新築する場合は、耐火建築物としなければならない。','準防火地域内において、延べ面積1,000m2、平家建ての倉庫を新築する場合は、耐火建築物又は準耐火建築物としなければならない。','防火地域及び準防火地域以外の区域内において、延べ面積2,500m2、地上3階建ての学校を新築する場合は、耐火建築物としなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:8,text:'防火・避難に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['主要構造部を準耐火構造としたバルコニーのない建築物で、当該建築物が全館避難安全性能を有するものであることについて全館避難安全検証法により確かめられたものにあっては、特別避難階段の階段室には、その付室に面する部分以外に屋内に面して開口部を設けることができる。','不燃材料として、建築物の外部の仕上げに用いる建築材料が適合すべき不燃性能に関する技術的基準は、建築材料に、通常の火災による火熱が加えられた場合に、加熱開始後20分間、「燃焼しないものであること」及び「防火上有害な変形、溶融、亀裂その他の損傷を生じないものであること」である。','防火構造として、建築物の軒裏の構造が適合すべき防火性能に関する技術的基準は、軒裏に建築物の周囲において発生する通常の火災による火熱が加えられた場合に、加熱開始後30分間当該加熱面以外の面(屋内に面するものに限る。)の温度が可燃物燃焼温度以上に上昇しないものであることである。','準耐火建築物は、耐火建築物以外の建築物で、「主要構造部を準耐火構造としたもの」又は「主要構造部を準耐火構造としたものと同等の準耐火性能を有するものとして所定の技術的基準に適合するもの」に該当し、外壁の開口部で延焼のおそれのある部分に耐火建築物に求められるものと同じ防火設備を有する建築物をいう。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:9,text:'防火・避難に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、避難階は地上1階とし、屋上広場はないものとする。また、「避難上の安全の検証」及び「防火区画検証法」は行われていないものとし、国土交通大臣の認定は考慮しないものとする。',choices:['主要構造部を耐火構造とした地上3階建ての共同住宅において、各階に住戸(1住戸の居室の床面積の合計が50m2)が5戸ある場合には、避難階以外の階から避難階又は地上に通ずる2以上の直通階段を設けなければならない。','建築基準法第22条第1項の市街地の区域内にある木造、延べ面積200m2、地上2階建ての共同住宅は、その外壁及び軒裏で延焼のおそれのある部分を防火構造としなければならない。','各階を物品販売業を営む店舗の用途に供する地上4階建ての建築物(各階の床面積が400m2)においては、原則として、各階における避難階段の幅の合計を2.4m以上としなければならない。','換気設備の風道が準耐火構造の防火区画を貫通する場合において、当該風道に設置すべき特定防火設備については、原則として、火災により煙が発生した場合又は火災により温度が急激に上昇した場合に自動的に閉鎖するものとしなければならない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:10,text:'建築設備に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['管の外径が所定の数値以上である給水管、配電管その他の管が、準耐火構造の防火区画を貫通する場合においては、原則として、これらの管の当該貫通する部分及び貫通する部分からそれぞれ両側に1m以内の距離にある部分を不燃材料で造らなければならない。','各構えの床面積の合計が1,000m2の地下街における排煙設備の制御及び作動状態の監視は、中央管理室において行うことができるものとしなければならない。','高さ20mを超える建築物には、周囲の状況によって安全上支障がない場合を除き、有効に避雷設備を設けなければならない。','高さ31mを超える建築物において、高さ31mを超える部分を全て建築設備の機械室とする場合は、非常用の昇降機を設けなくてもよい。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:11,text:'建築基準法第20条の規定が適用される新築の建築物に関する次の記述のうち、「確認申請書に添える構造詳細図又は使用構造材料一覧表に明示すべき事項」として、建築基準法施行規則上、誤っているものはどれか。ただし、確認申請書に添える他の図書には明示されていないものとする。また、国土交通大臣の認定は受けていないものとする。',choices:['鉄骨造の建築物における「使用構造材料一覧表」に明示すべき事項には、「構造耐力上主要な部分に用いる材料の種別」が含まれる。','鉄筋コンクリート造の建築物における「構造詳細図」に明示すべき事項には、「コンクリートの材料の種別及びコンクリートの骨材の種別」が含まれる。','鉄骨造の建築物における「構造詳細図」に明示すべき事項には、「構造耐力上主要な部分である接合部並びに継手及び仕口の構造方法」が含まれる。','鉄筋コンクリート造の建築物における「構造詳細図」に明示すべき事項には、「鉄筋に対するコンクリートのかぶり厚さ」が含まれる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:12,text:'構造強度に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['限界耐力計算を行う場合、構造耐力上主要な部分の断面に生ずる長期(常時及び積雪時)及び短期(積雪時及び暴風時)の各応力度が、それぞれ長期に生ずる力又は短期に生ずる力に対する各許容応力度を超えないことを確かめなければならない。','津波による災害の発生のおそれのある区域においては、津波による外力に対して安全であることを確かめなければならない。','鉄骨造の建築物において、構造耐力上主要な部分である柱の脚部は、滑節構造である場合を除き、原則として、国土交通大臣が定める基準に従ったアンカーボルトによる緊結その他の構造方法により基礎に緊結しなければならない。','鉄骨造の建築物において、限界耐力計算によって安全性が確かめられた場合、構造耐力上主要な部分である鋼材の圧縮材の有効細長比は、柱にあっては200以下としないことができる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:13,text:'構造強度の次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['炭素鋼の構造用鋼材における、短期に生ずる力に対する引張りの許容応力度は、長期に生ずる力に対する引張りの許容応力度の数値の1.5倍の数値としなければならない。','径25mmの異形鉄筋における、短期に生ずる力に対する圧縮の許容応力度は、鋼材等の種類及び品質に応じて国土交通大臣が定める基準強度の数値を1.5で除して得た数値としなければならない。','木材の繊維方向における、短期(積雪時を除く。)に生ずる力に対する圧縮の許容応力度は、原則として、木材の種類及び品質に応じて国土交通大臣が定める圧縮に対する基準強度の数値に2/3を乗じて得た数値としなければならない。','ステンレス鋼の構造用鋼材における、長期に生ずる力に対する引張りの許容応力度は、鋼材等の種類及び品質に応じて国土交通大臣が定める基準強度の数値を1.5で除して得た数値としなければならない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:14,text:'都市計画区域及び準都市計画区域内の道路等に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['道路の上空に設ける病院の渡り廊下で、患者の通行の危険を防止するために必要であり、特定行政庁が安全上、防火上及び衛生上他の建築物の利便を妨げ、その他周囲の環境を害するおそれがないと認め、あらかじめ建築審査会の同意を得て許可したものは、道路内に建築することができる。','土地区画整理法による新設の事業計画のある幅員6mの道路で、3年後にその事業が執行される予定のものは、建築基準法上の道路ではない。','土地を建築物の敷地として利用するため築造する延長が35mを超える袋路状の道について、特定行政庁からその位置の指定を受ける場合には、その幅員を6m以上とし、かつ、終端に自動車の転回広場を設けなければならない。','災害があった場合に建築する官公署の用途に供する応急仮設建築物の敷地は、建築基準法上の道路に接しなくてもよい。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:15,text:'図のような敷地において、建築基準法上、新築することができる建築物の容積率(同法第52条に規定する容積率)の最高限度は、次のうちどれか。ただし、図に記載されているものを除き、地域、地区等及び特定行政庁の指定、許可等は考慮しないものとする。',choices:['42/10','48/10','50/10','55/10'],answer:2,hasFigure:true,figureDesc:'敷地は第一種住居地域（都市計画で定められた容積率30/10）と商業地域（都市計画で定められた容積率70/10）にまたがる。敷地の南側に幅員8.5mの道路、西側に道路、東側に道路がある。敷地は50m×40mで、西側25mが第一種住居地域、東側25mが商業地域。道路幅員は西側9m、南側8.5m、東側20m+16mの道路配置。'},
{year:2016,subject:'法規',no:16,text:'図のように、敷地に建築物を新築する場合、建築基準法上、A点における地盤面からの建築物の高さの最高限度は、次のうちどれか。ただし、敷地は平坦で、敷地、隣地及び道路の相互間に高低差はなく、門、塀等はないものとする。また、図に記載されているものを除き、地域、地区等及び特定行政庁による指定、許可等並びに日影による中高層の建築物の高さの制限及び天空率に関する規定は考慮しないものとする。なお、建築物は、全ての部分において、高さの最高限度まで建築されるものとする。',choices:['31.5m','36.0m','43.5m','51.0m'],answer:2,hasFigure:true,figureDesc:'商業地域（都市計画で定められた容積率70/10）の敷地。北側に隣地、南側に幅員15mの道路、西側に隣地、東側に道路。敷地北側から建築物までの距離3m、建築物は22m×20mの平面。A点は建築物北東角から5m南の位置。敷地全体は30m（南北）で、建築物の北端から敷地北端まで3m+2m。道路から敷地境界まで等の寸法が記載。'},
{year:2016,subject:'法規',no:17,text:'建築物の用途の制限に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、用途地域以外の地域、地区等及び特定行政庁の許可等は考慮しないものとする。',choices:['第一種低層住居専用地域内において、「延べ面積150m2、地上2階建ての食堂兼用住宅(居住の用途に供する部分の床面積が100m2)」は、新築することができる。','第二種中高層住居専用地域内において、「延べ面積2,000m2、地上2階建ての事務所」は、新築することができる。','近隣商業地域内において、「客席の部分の床面積の合計が600m2、地上3階建ての映画館」は、新築することができる。','準工業地域内において、「肥料の製造工場」は、新築することができない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:18,text:'防火地域及び準防火地域内の建築物の新築に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['防火地域内においては、附属自動車車庫として使用する延べ面積60m2、平家建ての建築物は、耐火建築物又は準耐火建築物としなければならない。','準防火地域内においては、延べ面積1,200m2、地上2階建ての機械製作工場で主要構造部が不燃材料で造られたものは、耐火建築物及び準耐火建築物以外の建築物とすることができる。','準防火地域内においては、木造建築物等に附属する高さ2mを超える門については、当該門が建築物の1階であるとした場合に延焼のおそれのある部分に該当する部分を不燃材料で造り、又は覆わなければならない。','防火地域においては、建築物の外壁の開口部で延焼のおそれのある部分に設ける防火戸は、建築物の周囲において発生する通常の火災による火熱が加えられた場合に、加熱開始後30分間当該加熱面以外の面(屋内に面するものに限る。)に火炎を出さないものとしなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:19,text:'地区計画等に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['地区計画等の区域内において、建築物の敷地内に予定道路が指定された場合においては、当該予定道路の地盤面下に設ける建築物は、特定行政庁の許可を受けることなく新築することができる。','地区整備計画等が定められている地区計画等の区域内において、建築物の敷地、構造、建築設備又は用途に関する事項で当該地区計画等の内容として定められたものが、市町村の条例で、これらに関する制限として定められた場合には、当該条例の規定は、建築基準関係規定に該当する。','地区計画の区域のうち再開発等促進区内において、当該地区計画において定められた土地利用に関する基本方針に適合した建築物については、用途地域内の建築物の制限に適合しない場合であっても、特定行政庁の許可を受けることなく新築することができる。','地区整備計画等が定められている地区計画等の区域内において、建築物に附属する高さ2m以内の門又は塀の位置については、市町村の条例による壁面の位置の制限としては定めることはできない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:20,text:'次の記述のうち、建築基準法上、誤っているものはどれか。ただし、特定行政庁の許可は考慮しないものとする。',choices:['敷地が、第一種中高層住居専用地域内に350m2、第二種低層住居専用地域内に650m2、と二つの用途地域にわたる場合、当該敷地には、高等専門学校を新築することができる。','都市計画区域内においては、ごみ焼却場は、都市計画においてその敷地の位置が決定していない場合であっても、特定行政庁が都市計画審議会の議を経てその敷地の位置が都市計画上支障がないと認めて許可した場合においては、新築することができる。','文化財保護法の規定によって重要文化財として指定された建築物であったものの原形を再現する建築物で、特定行政庁が建築審査会の同意を得てその原形の再現がやむを得ないと認めたものについては、建築基準法並びにこれに基づく命令及び条例の規定は、適用されない。','特殊建築物については、その用途により、地方公共団体の条例で、建築物の敷地、構造又は建築設備に関して防火上の制限が附加されることがある。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:21,text:'次の記述のうち、建築士法上、誤っているものはどれか。',choices:['一級建築士は、設計、工事監理、建築工事の指導監督等の委託者から請求があったときは、一級建築士免許証又は一級建築士免許証明書を提示しなければならない。','設計受託契約又は工事監理受託契約を締結しようとするときは、委託者及び受託者は、国土交通大臣が定める報酬の基準に準拠した委託代金で当該契約を締結するよう努めなければならない。','延べ面積200m2の建築物の新築に係る設計受託契約の当事者は、契約の締結に際して、作成する設計図書の種類、設計に従事することとなる建築士の氏名及びその者の一級建築士、二級建築士又は木造建築士の別、報酬の額及び支払いの時期、契約の解除に関する事項、その他所定の事項について書面に記載し、署名又は記名押印をして相互に交付しなければならない。','建築士法の規定に違反して一級建築士の免許を取り消され、その取消しの日から起算して5年を経過しない者は、一級建築士の免許のみならず、二級建築士又は木造建築士の免許も受けることができない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:22,text:'次の記述のうち、建築士法上、誤っているものはどれか。',choices:['建築士事務所の開設者と管理建築士とが異なる場合においては、その開設者は、管理建築士から建築士事務所の業務に係る所定の技術的事項に関し、必要な意見が述べられた場合には、その意見を尊重しなければならない。','建築士事務所に属する者で建築士でないものが、その属する建築士事務所の業務として、建築士でなければできない建築物の設計又は工事監理をしたときは、都道府県知事は、当該建築士事務所の登録を取り消すことができる。','建築士は、延べ面積が2,000m2を超える建築物の建築設備に係る設計又は工事監理を行う場合においては、設備設計一級建築士の意見を聴かなければならない。','建築士事務所の開設者は、設計等の業務に関し生じた損害を賠償するために必要な金額を担保するための保険契約の締結その他の措置を講ずるよう努めなければならない。'],answer:3,hasFigure:false,figureDesc:''},
