{year:2016,subject:'法規',no:23,text:'次の記述のうち、建築士法上、誤っているものはどれか。',choices:['都道府県知事により指定事務所登録機関が指定された場合、建築士事務所の登録を受けようとする者は、一級建築士事務所の場合においても、原則として、登録申請書を当該指定事務所登録機関に提出しなければならない。','建築士事務所の開設者である一級建築士が、当該建築士事務所の登録期間が満了したにもかかわらず、更新の登録を受けずに他人の求めに応じ報酬を得て工事監理業務を業として行った場合には、当該建築士は、業務停止等の懲戒処分の対象となる。','建築士事務所に属する一級建築士は、直近の一級建築士定期講習を受けた日の属する年度の翌年度の開始の日から起算して3年以内に、一級建築士定期講習を受けなければならない。','都道府県知事の登録を受けている建築士事務所に属する建築士は、当該登録を受けた都道府県以外の区域においては、業として他人の求めに応じ報酬を得て、設計等を行うことはできない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:24,text:'次の記述のうち、建築士法上、誤っているものはどれか。',choices:['国土交通大臣が建築士の業務の適正な実施を確保するため、一級建築士に対し業務に関する報告を求めた場合に、当該建築士がその報告をせず、又は虚偽の報告をしたときは、当該建築士は、30万円以下の罰金刑の適用の対象となる。','国土交通大臣が建築士の業務の適正な実施を確保するため、国土交通省の職員に開設者が法人である建築士事務所に立ち入り当該建築士事務所に属する者に質問させた際に、その者がその質問に対して答弁せず、又は虚偽の答弁をしたときは、その者のほか、その者が所属する法人も、30万円以下の罰金刑の適用の対象となる。','建築士事務所に属する建築士の氏名及びその者の一級建築士、二級建築士又は木造建築士の別に変更があった場合に、3月以内に、その旨を都道府県知事に届け出ないときは、当該建築士事務所の開設者及び管理建築士は、30万円以下の罰金刑の適用の対象となる。','管理建築士等が、建築主に対して設計受託契約又は工事監理受託契約の内容及びその履行に関する重要事項について説明する際に、建築士免許証又は建築士免許証明書を提示しなかったときは、当該建築士は、10万円以下の過料の適用の対象となる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:25,text:'次の記述のうち、都市計画法上、誤っているものはどれか。',choices:['都市計画区域内において、コンクリートプラントの改築の用に供する目的で行う開発行為については、都道府県知事の許可を受ける必要はない。','市街化区域内において、専修学校の建築の用に供する目的で行う開発行為で、その規模が1,500m2のものについては、原則として、都道府県知事の許可を受けなければならない。','市街化調整区域内における地区整備計画が定められた地区計画の区域内において、当該地区計画に定められた内容に適合する病院の建築の用に供する目的で行う開発行為は、所定の要件に該当すれば、都道府県知事の許可を受けることができる。','都市計画施設として定められた公園の区域内において、公園施設の建築物を建築しようとする者が市町村の場合、当該建築物の建築が当該公園に関する都市計画に適合するものであっても、都道府県知事等の建築の許可を受けなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:26,text:'次の記述のうち、消防法上、誤っているものはどれか。ただし、建築物は、いずれも無窓階を有しないものとし、指定可燃物の貯蔵及び取扱いは行わないものとする。',choices:['準耐火建築物で、かつ、壁及び天井の室内に面する部分の仕上げを難燃材料でした延べ面積1,500m2、地上2階建ての旅館については、原則として、屋内消火栓設備を設置しなければならない。','同一敷地内にあり一の建築物とみなされる複数の準耐火建築物の床面積の合計が6,000m2、平屋建ての美術館で、所定のスプリンクラー設備を設置したものについては、当該設備の有効範囲内の部分について屋外消火栓設備を設置しないことができる。','延べ面積10,000m2のテレビスタジオ内にある床面積500m2の通信機器室で、所定のハロゲン化物消火設備を設置したものについては、自動火災報知設備を設置しないことができる。','地上3階建ての特別支援学校(避難階は地上1階)で、各階の収容人員が20人以上のものについては、原則として、2階以上の階に避難器具を設置しなければならない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:27,text:'次の記述のうち、「建築物の耐震改修の促進に関する法律」上、誤っているものはどれか。',choices:['都道府県耐震改修促進計画に記載された建築物集合地域通過道路等に敷地が接する通行障害既存耐震不適格建築物の所有者は、所定の期限までに耐震改修を行わなければならない。','床面積の合計が3,000m2、地上3階建ての賃貸住宅(共同住宅に限る。)で既存耐震不適格建築物(要安全確認計画記載建築物でないもの)の所有者は、当該建築物について耐震診断を行い、その結果、地震に対する安全性の向上を図る必要があると認められるときは、耐震改修を行うよう努めなければならない。','要安全確認計画記載建築物の所有者は、当該建築物について耐震診断の結果、地震に対する安全性の向上を図る必要があると認められるときは、耐震改修を行うよう努めなければならない。','床面積の合計が800m2、地上2階建ての病院で既存耐震不適格建築物(要安全確認計画記載建築物でないもの)の所有者は、当該建築物について耐震診断を行い、必要に応じ、耐震改修を行うよう努めなければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:28,text:'次の法律とその法律又は政令で用いられている用語との組合せのうち、誤っているものはどれか。',choices:['宅地造成等規制法 ―― 急傾斜地崩壊危険区域','都市計画法 ―― 特例容積率適用地区','都市再生特別措置法 ―― 特定用途誘導地区','建築基準法 ―― 特定避難時間倒壊等防止建築物'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:29,text:'契約に関する次の記述のうち、関係法令上、誤っているものはどれか。',choices:['「建築士法」に基づき、建築士事務所の開設者は、他の建築士事務所の開設者から設計及び工事監理以外の業務を受託する場合においては、契約締結後、遅滞なく、所定の事項を記載した書面を交付しなければならない。','「建築士法」に基づき、建築士事務所の開設者は、設計受託契約又は工事監理受託契約を建築主と締結しようとする場合においては、あらかじめ、当該建築主に対し、管理建築士等をして、所定の事項を記載した書面を交付して説明をさせなければならない。','「宅地建物取引業法」に基づき、宅地建物取引業者は、建築工事の完了前に新築住宅を販売する際には、その広告、契約及び媒介については、建築確認等所定の処分があった後でなければしてはならない。','「建設業法」に基づき、建設工事の請負契約の当事者は、契約の締結に際して、原則として、工事内容、請負代金の額、工事着手の時期及び工事完成の時期、請負代金の支払いの時期及び方法、契約に関する紛争の解決方法、その他所定の事項について書面に記載し、署名又は記名押印をして相互に交付しなければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'法規',no:30,text:'次の記述のうち、関係法令上、誤っているものはどれか。',choices:['「宅地建物取引業法」に基づき、宅地建物取引業者は、建物の売買の相手方等に対して、その契約が成立するまでの間に、宅地建物取引士をして、所定の事項を記載した書面等を交付して説明をさせなければならない。','「駐車場法」に基づき、商業地域内において、延べ面積が2,000m2以上の建築物を新築しようとする場合は、同法による条例により、その建築物又はその建築物の敷地内に駐車施設を設けなければならないことがある。','「都市計画法」に基づき、まちづくりの推進を図る活動を行うことを目的とする特定非営利活動法人は、所定の土地の区域について、都道府県に対し、都市計画区域の整備、開発及び保全の方針の変更を提案することができる。','「浄化槽法」に基づき、浄化槽管理者等は、浄化槽の保守点検又は浄化槽の清掃について、都道府県知事から、必要な助言、指導又は勧告を受けることがある。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:1,text:'図－1のような脚部で固定された柱の頂部に鉛直荷重及び水平荷重が作用している。柱の断面形状は図－2に示すような箱形断面であり、鉛直荷重の合力Pおよび水平荷重の合力Qは断面の図心に作用しているものとする。柱脚部断面の垂直応力度分布が図－3のような全塑性状態に達している場合のPとQとの組合せとして、正しいものは、次のうちどれか。ただし、箱形断面は等質等断面とし、降伏応力度はσyとする。',choices:['P=2d²σy, Q=6d³σy/l','P=2d²σy, Q=12d³σy/l','P=4d²σy, Q=6d³σy/l','P=4d²σy, Q=12d³σy/l'],answer:4,hasFigure:true,figureDesc:'図－1: 脚部固定柱に頂部で鉛直荷重Pと水平荷重Qが作用、柱高さl。図－2: 箱形断面(外寸4d×4d、肉厚d)。図－3: 柱脚部断面の垂直応力度分布(引張側σy幅d、圧縮側σy幅3d)。'},
{year:2016,subject:'構造',no:2,text:'図のような断面形状の単純梁A及びBの中央に集中荷重Pが作用したとき、それぞれに曲げによる最大たわみδA及びδBが生じている。δAとδBとの比として、正しいものは、次のうちどれか。ただし、梁A及びBは同一材質の弾性部材とする。',choices:['δA : δB = 1 : 2','δA : δB = 1 : 4','δA : δB = 1 : 8','δA : δB = 1 : 16'],answer:2,hasFigure:true,figureDesc:'単純梁A: スパンl、断面a×2a(幅a、せい2a)。単純梁B: スパンl、断面2a×a(幅2a、せいa)。それぞれ中央に集中荷重P。'},
{year:2016,subject:'構造',no:3,text:'図のような筋かいを有する柱脚ピンの骨組に水平荷重100 kNが作用したとき、部材BCの引張力Tは100 kNであった。このとき、柱ABの柱頭A点における曲げモーメントの絶対値として、正しいものは、次のうちどれか。ただし、梁ACは剛体とし、柱ABと柱CDは等質等断面で伸縮はないものとする。',choices:['0 kN・m','20 kN・m','40 kN・m','80 kN・m'],answer:4,hasFigure:true,figureDesc:'柱脚ピンの骨組。梁AC上にA点で100kN水平荷重。柱AB・CDは高さ4m、スパン3m。筋かいBCあり、T=100kN。'},
{year:2016,subject:'構造',no:4,text:'図－1のような鉛直荷重100 kN、水平荷重Pを受けるラーメンにおいて、水平荷重Pを増大させたとき、荷重Puで塑性崩壊に至り、図－2のような崩壊機構を示した。Puの値として、正しいものは、次のうちどれか。ただし、柱、梁の全塑性モーメントMpの値をそれぞれ300 kN・m、200 kN・mとする。',choices:['200 kN','225 kN','250 kN','275 kN'],answer:2,hasFigure:true,figureDesc:'図－1: 1層1スパンラーメン、柱高さ4m、スパン5m+5m、梁中央に鉛直荷重100kN、左柱頭に水平荷重P。Mp(柱)=300kN・m、Mp(梁)=200kN・m。図－2: 崩壊機構(梁中央と柱脚・柱頭にヒンジ)。'},
{year:2016,subject:'構造',no:5,text:'図のような鉛直荷重が作用するトラスにおいて、部材ABに生じる軸方向力として、正しいものは、次のうちどれか。ただし、軸方向力の符号は、引張力を「＋」とする。',choices:['0','+√3/2・P','+√3P','+3√3/2・P'],answer:4,hasFigure:true,figureDesc:'対称トラス。下弦材3スパン(各l)、上部に2P(中央)とP(左右)の鉛直荷重。角度30°・60°の部材配置。部材ABは下弦材中央部。'},
{year:2016,subject:'構造',no:6,text:'図－1のような頂部に質量m又は2mをもち、剛性がK又は2Kの棒A、B、Cにおける固有周期はそれぞれTA、TB、TCである。それぞれの棒の脚部に図－2に示す加速度応答スペクトルをもつ地震動が入力されたとき、棒に生じる最大応答せん断力がQA、QB、QCとなった。QA、QB、QCの大小関係として、正しいものは、次のうちどれか。ただし、TA、TB、TCは図－2のT1、T2、T3のいずれかに対応し、応答は水平方向であり、弾性範囲内とする。',choices:['QA < QB = QC','QB < QA = QC','QB < QA < QC','QC < QA < QB'],answer:1,hasFigure:true,figureDesc:'図－1: 棒A(質量m、剛性K)、棒B(質量m、剛性2K)、棒C(質量2m、剛性K)。図－2: 加速度応答スペクトル(周期T1で0.4g、T2で0.3g、T3で0.2g、右下がり曲線)。'},
{year:2016,subject:'構造',no:7,text:'建築基準法における荷重及び外力に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築物の地上部分の必要保有水平耐力を計算する場合、標準せん断力係数C0は1.0以上としなければならない。','地震地域係数Zは、1.0から0.7の数値として地域ごとに定められている。','風圧力の計算に用いる速度圧qは、その地方における基準風速V0に比例する。','構造部材に生じる応力度等を計算するに当たり、多雪区域ではない一般の地域においては、暴風時又は地震時の荷重を、積雪荷重と組み合わせなくてもよい。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:8,text:'中心圧縮力を受ける正方形断面の長柱の弾性座屈荷重Peに関する次の記述のうち、最も不適当なものはどれか。ただし、柱は全長にわたって等質等断面とする。',choices:['Peは、柱の材端条件が「両端ピン」の場合に比べて、「両端固定」の場合のほうが大きい。','Peは、柱頭の水平移動を自由とした場合に比べて、水平移動を拘束した場合のほうが大きい。','Peは、柱材のヤング係数に比例する。','Peは、柱材の断面積に比例する。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:9,text:'木造軸組工法による地上2階建ての建築物に関する次の記述のうち、最も不適当なものはどれか。',choices:['筋かいの端部は、柱と梁その他の構造耐力上主要な横架材との接合部に接近して緊結し、各材の軸線が1点で交わるようにした。','土台には、耐朽性を向上させるため、心材ではなく辺材を用いた。','国土交通大臣が定める基準に従った構造計算によって構造耐力上安全であることを確かめたので、小屋組の振れ止めを省略した。','構造耐力上主要な柱の所要断面積の1/3を切り欠きしたので、切り欠きした部分が負担していた力を伝達できるように金物等により補強した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:10,text:'木造軸組工法による地上2階建ての建築物の構造計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['平面が長方形の建築物において、必要壁量が地震力により決定される場合、張り間方向とけた行方向の必要壁量は、それぞれ異なる値となる。','延べ面積が500 m²を超える場合、必要壁量の計算及び耐力壁の釣合いのよい配置の検討に加えて、許容応力度計算等の構造計算を行う必要がある。','風圧力に対する1階の必要壁量は、1階床面からの高さ1.35 mを超える部分の見付面積に所定の数値を乗じて得た数値以上となるようにする。','構造耐力上主要な柱の小径は、横架材の相互間の垂直距離に対する割合によらず、座屈を考慮した構造計算によって決定してもよい。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:11,text:'鉄筋コンクリート構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['曲げ降伏する梁部材の靱性を高めるために、梁せい及び引張側の鉄筋量を変えることなく、梁幅を大きくした。','柱部材の靱性を高めるために、コンクリートの圧縮強度に対する柱の軸方向応力度の比が小さくなるように、柱の配置や断面形状を計画した。','梁部材のクリープによるたわみを減らすために、引張側の鉄筋量を変えることなく、圧縮側の鉄筋量を減らした。','曲げ降伏する柱部材の曲げ降伏後のせん断破壊を防止するために、曲げ強度に対するせん断強度の比を大きくした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:12,text:'鉄筋コンクリート構造の配筋に関する次の記述のうち、最も不適当なものはどれか。ただし、図に記載されていない鉄筋は適切に配筋されているものとする。',choices:['図－1に示す副帯筋の配筋において、余長部が帯筋で囲まれたコア内に挿入されており、必要な余長が確保されていたので、副帯筋の末端の一端を90度フックとした。','図－2に示す大梁の主筋の配筋において、下端筋の重ね継手をスパンの中央部に設けた。','図－3に示すスパンが短い大梁の主筋の配筋において、せん断破壊や付着割裂破壊を防止するため、梁断面の四隅以外の主筋を部材の全長にわたって対角線上に配置した。','図－4に示す柱梁接合部において、せん断補強筋比0.3％相当の帯筋を配筋した。'],answer:2,hasFigure:true,figureDesc:'図－1: 副帯筋の配筋詳細(柱断面)。図－2: 大梁の主筋配筋(梁主筋と柱の接合部)。図－3: スパンが短い大梁の主筋配筋(X型配筋)。図－4: 柱梁接合部の配筋詳細(柱主筋・帯筋・梁主筋)。'},
{year:2016,subject:'構造',no:13,text:'鉄筋コンクリート構造の許容応力度計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['コンクリートのひび割れに伴う部材の剛性低下を考慮して、地震荷重時に構造耐力上主要な部分に生じる力を計算した。','梁部材における主筋のコンクリートに対する許容付着応力度として、下端筋では上端筋よりも大きい値を用いた。','柱部材の長期許容せん断力の計算において、帯筋や軸圧縮応力度の効果はないものとした。','引張鉄筋比が釣合い鉄筋比を超える梁部材について、梁断面の許容曲げモーメントを、at(引張鉄筋の断面積)×ft(引張鉄筋の許容引張応力度)×j(応力中心間距離)により計算した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:14,text:'鉄筋コンクリート構造における建築物の耐震計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['「ルート1」の計算において、コンクリートの設計基準強度を24 N/mm²としたので、設計基準強度による割増し係数αを用いて、単位強度の割増しを行った。','「ルート2－1」の計算において、柱及び梁の靱性を確保するため、地震力によって生じるせん断力を割増した設計用せん断力が、安全性確保のための許容せん断力を超えないことを確かめた。','「ルート3」の計算において、両端ヒンジとなる梁部材の設計用せん断力の割増し係数を1.2とし、両端ヒンジとならない梁部材の設計用せん断力の割増し係数を1.1とした。','「ルート3」の計算において、崩壊メカニズム時にせん断破壊した柱部材の種別をFDとした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:15,text:'鋼材の溶接に関する次の記述のうち、最も不適当なものはどれか。',choices:['通しダイアフラムに溶接する梁フランジのエンドタブとして鋼製タブを使用した場合は、終局状態において塑性ヒンジを形成しない部位であれば、エンドタブを切断しなくてもよい。','通しダイアフラムと梁フランジの突合せ溶接部において、許容値を超える食い違いや仕口部のずれが生じた場合は、適切な補強を行えばよい。','パス間温度が規定値以下となるように管理すれば、溶接施工時の低温割れを防止することができる。','突合せ溶接部において、母材の種類に応じた適切な溶接材料を用いる場合、溶接部の許容応力度は母材と同じ値を採用することができる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:16,text:'鉄骨構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['高力ボルト接合となる梁の継手部分に、F10Tの代わりにF14T級の超高力ボルト(遅れ破壊の主原因となる水素に対する抵抗力を高めた高力ボルト)を用いることで、ボルト本数を減らし、スプライスプレートを小さくした。','高力ボルト摩擦接合の二面せん断の短期許容せん断応力度を、高力ボルトの基準張力T0(単位 N/mm²)とした。','露出形式柱脚において、ベースプレートの変形を抑えるために、ベースプレートの厚さをアンカーボルトの径の1.3倍とした。','埋込形式柱脚において、鉄骨柱の応力は、コンクリートに埋め込まれた部分の上部と下部の支圧により、基礎に伝達する設計とした。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:17,text:'鉄骨構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['H形鋼を用いた梁に均等間隔で横補剛材を設置して保有耐力横補剛とする場合において、梁をSN400B材から同一断面のSN490B材に変更したので、横補剛の数を減らした。','両端がピン接合のH形断面圧縮材の許容応力度を、弱軸回りの断面二次半径を用いて計算した。','曲げ剛性に余裕のあるラーメン構造の梁において、梁せいを小さくするために、SN400B材の代わりにSN490B材を用いた。','H形断面梁の設計において、フランジの局部座屈を生じにくくするため、フランジの幅厚比を小さくした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:18,text:'鉄骨構造における建築物の耐震計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['「ルート1－1」の計算において、標準せん断力係数C0を0.3として地震力の算定を行ったので、水平力を負担する筋かいの端部及び接合部については、保有耐力接合としなかった。','「ルート1－2」の計算において、標準せん断力係数C0を0.3として地震力の算定を行ったので、層間変形角及び剛性率の確認を行わなかった。','「ルート1－2」の計算において、冷間成形角形鋼管を柱に用いたので、柱梁接合形式及び鋼管の種類に応じ、応力を割増して柱の設計を行った。','「ルート2」の計算において、冷間成形角形鋼管を柱に用いたので、建築物の最上階の柱頭部及び1階の柱脚部を除く全ての接合部について、柱の曲げ耐力の和を梁の曲げ耐力の和の1.5倍以上となるように設計を行った。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:19,text:'杭の支持力に関する次の記述のうち、最も不適当なものはどれか。',choices:['地震時に液状化のおそれのない地盤において、杭の極限支持力は、杭の種類や施工法に応じた極限先端支持力と極限周面摩擦力との和として算定できる。','地震時に液状化のおそれのある地盤においても、杭の許容支持力は、載荷試験による極限支持力から求めることができる。','砂質地盤における杭の極限周面摩擦力度は、杭周固定液を使用した埋込み杭より場所打ちコンクリート杭のほうが大きく評価できる。','摩擦杭において杭間隔が十分に確保できない場合は、群杭効果を考慮して支持力を算定する。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:20,text:'基礎に関する次の記述のうち、最も不適当なものはどれか。',choices:['支持層が同一の杭において、施工方法の異なる杭を用いることは異種基礎の併用となるので、避けることが望ましい。','同一の砂質地盤を支持層とする直接基礎において、基礎底面に作用する単位面積当たりの荷重が同じ場合、基礎底面の大きさに関係なく即時沈下量は同じになる。','地下階を有する建築物の杭の耐震設計において、一般に、杭に作用する水平力は、地下外壁等が負担する水平力に応じて、一定の範囲内で低減することができる。','直接基礎の場合、基礎の沈下は、上部構造に障害が発生するおそれがない範囲で許容される。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:21,text:'土質及び地盤に関する次の記述のうち、最も不適当なものはどれか。',choices:['標準貫入試験のN値が10程度の粘性土地盤は、地上6階程度の中層建築物の直接基礎の支持地盤として十分な支持力を有していると判断できる。','粘性土地盤における圧密沈下は、地中の応力増加により土中の水が絞り出されて間隙が減少するために生じる。','砂質地盤における内部摩擦角は、一般に、標準貫入試験のN値が大きいほど大きくなる。','地盤のせん断剛性は、PS検層により測定されるS波速度が大きいほど小さくなる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:22,text:'コンクリート系の構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['プレキャスト部材を継ぎ合わせて、PC鋼材の緊張により圧着接合する場合、圧着部の継目に生じるせん断力は、摩擦抵抗機構のみで伝達するように設計する。','プレキャストプレストレストコンクリート造の床版と周囲の梁との接合部は、長期及び短期に生じる応力を部材相互に伝達できるように設計する。','プレストレストコンクリート造は、引張縁の状態によりI種、II種及びIII種に分類され、いずれも、常時作用している長期応力に対して、ひび割れの発生を許容し、ひび割れ幅を制御して設計する。','単純梁形式のプレストレストコンクリート合成梁は、一般に、引張応力の生じる部分をプレキャストプレストレストコンクリート部材とし、残る圧縮側部分を現場打ち鉄筋コンクリートとして、一体となって挙動するように設計する。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:23,text:'各種建築構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['壁式構造は、地震その他の水平力に対して、耐力壁を主体にした強度抵抗型の構造であり、高い変形性能は期待できない。','鉄筋コンクリート構造において、鉄筋のA級継手(母材と同等並みの強度と剛性を有する継手)は、降伏ヒンジが形成される材端域の主筋に使用できるが、靱性が低下することを考慮する必要がある。','壁式鉄筋コンクリート構造と壁式プレキャスト鉄筋コンクリート構造は、一つの建築物の同じ階に混用することはできない。','ポストテンション方式のプレストレストコンクリート構造において、シース内に充塡するグラウトは、PC鋼材の腐食の防止、シースとPC鋼材との付着の確保等を目的とする。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:24,text:'建築物の耐震計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['耐震計算を行う場合に用いるAiは、多数の地震応答解析結果の蓄積から、それらをまとめたものに基づき定められた、設計用層せん断力を求めるための高さ方向の分布を表す係数である。','各階の保有水平耐力計算において、偏心率が所定の数値を上回る場合又は剛性率が所定の数値を下回る場合には、必要保有水平耐力の値を割増しする。','鉄筋コンクリート造建築物の設計用一次固有周期Tを、略算法でなく固有値解析等の精算によって求める場合には、建築物の振動特性はコンクリートにひび割れのない初期剛性を用い、基礎や基礎杭の変形はないものと仮定する。','鉄筋コンクリート造建築物の必要保有水平耐力の計算において、一般に、柱・梁部材に曲げ破壊が生じる場合は、せん断破壊が生じる場合に比べて、構造特性係数Dsを大きくしなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:25,text:'建築物の免震構造・制振構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['免震構造用の積層ゴムにおいて、積層ゴムを構成するゴム1層の厚みを大きくすることは、一般に、鉛直支持能力を向上させるのに有効である。','基礎免震構造は、大地震での上部構造に作用する水平力を小さくすることはできるが、免震層には大きな変形が生じる。','鋼材や鉛等の履歴減衰型ダンパーは、塑性化する際のエネルギー吸収能力を利用するものであり、安定した復元力特性と十分な疲労強度が必要である。','免震構造用のオイルダンパーや履歴減衰型ダンパーは、地震時に対する設計だけではなく、暴風時に対する設計も行う必要がある。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:26,text:'建築物の構造計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['アスペクト比(幅に対する高さの比)が大きい塔状の建築物の場合には、大地震時の転倒に対する抵抗力を増やすために、基礎構造を軽量化する。','構造形式や構造種別が異なる構造を併用する場合には、それぞれの構造形式や構造種別の特性を踏まえて計画する。','エスカレーターは、大地震時において、耐震ブレースのように挙動することによる破損や層間変形による脱落が生じないように計画する。','床の鉛直方向の固有振動数が10 Hz以下となる場合には、振動に対する居住性の検討を行う。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:27,text:'木材に関する次の記述のうち、最も不適当なものはどれか。',choices:['木材の熱伝導率は、普通コンクリートに比べて小さい。','木材は、一般に、含水率が25～35％を超えると腐朽しやすくなる。','無等級材の繊維方向の基準強度の圧縮、引張、曲げの大小関係は、曲げ＞圧縮＞引張である。','含水率が繊維飽和点以下の木材において、乾燥収縮率の大小関係は、一般に、繊維方向＞半径方向＞年輪の接線方向である。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:28,text:'コンクリートに関する次の記述のうち、最も不適当なものはどれか。',choices:['耐震診断等で構造体コンクリートから採取される円柱コア供試体の圧縮強度は、直径に対する高さの比が小さくなると小さくなる。','コンクリートの中性化速度は、水セメント比が小さいほど遅くなる。','コンクリートの引張強度は、一般に、円柱供試体を用いた直径方向の圧縮試験(割裂試験)により間接的に求められる。','一軸圧縮を受けるコンクリート円柱供試体の圧縮強度時ひずみは、一般に、圧縮強度が大きいほど大きくなる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:29,text:'鋼材に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築構造用TMCP鋼は、化学成分の調整と水冷型熱加工制御法により製造され、板厚が40 mmを超え100 mm以下の材であっても、40 mm以下の材と同じ基準強度が保証されている。','SN材C種は、B種の規定に加えて板厚方向の絞り値の下限が規定されており、溶接加工時を含め板厚方向に大きな引張応力が発生する角形鋼管柱の通しダイアフラム等に用いられている。','SN490B材は、SS400材に比べて、降伏点、引張強さ、ヤング係数のいずれも大きい。','ステンレス鋼は、約11％以上のクロムを含む合金鋼であり、炭素鋼に比べて、耐食性、耐火性等に優れている。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'構造',no:30,text:'建築物の総合的な構造計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築物の耐火設計については、火災終了まで、建築物を崩壊・倒壊させないことを目標とする。','床の積載荷重や部材断面設計において、適度に余裕をもたせて設計することは、イニシャルコスト増となるが、一般に、建築物の寿命を延ばし、ライフサイクルコストの節減に結びつく。','平面が不整形な建築物をエキスパンションジョイントを用いて整形な建築物に分割すると、一般に、構造体の地震時の挙動が明確になるが、温度応力やコンクリートの乾燥収縮に対しては、不利になる。','中間階免震構造を採用し、免震層を居室として使用する場合、火災時を考慮して、免震支承に耐火被覆を施す。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'施工',no:1,text:'施工計画等に関する次の記述のうち、最も不適当なものはどれか。',choices:['特記は、標準仕様書と異なる事項や標準仕様書に含まれていない事項について、設計図書のうち、質問回答書、現場説明書、特記仕様書及び図面において指定された事項をいう。','地震の後に、屋外に設置されているクレーンを用いて作業を行うときは、その地震が中震(震度4)の場合であれば、クレーンの各部分の点検を省略することができる。','クレーン、リフト、エレベーター等から材料の取込みに使用する仮設の荷受け構台は、積載荷重等に対して十分に安全な構造のものとしたうえで、材料置場と兼用することができる。','品質計画、一工程の施工の確認及び施工の具体的な計画を定めた工種別の施工計画書については、原則として、当該工事の施工に先立ち作成のうえ、監理者に提出する。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'施工',no:2,text:'工事現場管理等に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築物の地下工事において、海域以外の公共用水域に排出する、建設工事により発生した1日当たりの平均的な排出水の量が50 m³以上であったので、水素イオン濃度をpH 9.0以下となるように管理した。','建築物の土工事において、掘削面の高さが2 mの地山の掘削であったので、作業主任者を選任した。','既存建築物の解体工事において、石綿含有成形板(その重量の0.1％を超えて石綿を含有するもの)の除去を行うので、石綿作業主任者を選任した。','騒音規制法に定める特定建設作業における騒音が、敷地の境界線において、85 dB以下となるように管理した。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'施工',no:3,text:'材料管理、品質管理等に関する次の記述のうち、最も不適当なものはどれか。',choices:['既製コンクリート杭の積込み及び荷降しについては、杭に生じる曲げモーメントを最小とするため、杭の両端から杭の長さの1/3の位置付近に2点で支持し、杭に衝撃を与えないように仮置きさせた。','工事現場に納入されたカーペット類のうち、タイルカーペットについては、材料が荷崩れしないように、5～6段積みまでとして保管させた。','構造体コンクリートの床の仕上りにおいて、セメントモルタルによる磁器質タイル張りとしたので、コンクリートの仕上がりの平坦さ(凹凸の差)の標準値を、1 mにつき10 mm以下として管理した。','屋内における塗装工事において、塗装場所の気温が5 ℃未満、相対湿度が85％以上の状況であったが、採暖と換気等の養生を行うことで、適切な温度・湿度条件が確保できたので、塗装作業をさせた。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'施工',no:4,text:'建築工事に関連する届等に関する次の記述のうち、最も不適当なものはどれか。',choices:['床面積の合計が500 m²の鉄筋コンクリート造の建築物の新築工事を行うに当たって、建設工事に係る資材の再資源化等に関する法律に基づく「届出書」を都道府県知事あてに提出した。','高さ40 mの鉄筋コンクリート造の建築物の解体工事を行うに当たって、「建設工事計画届」を特定行政庁あてに提出した。','道路に工事用の仮囲いを設置するに当たって、継続して道路の一部を使用する必要があったので、「道路占用許可申請書」を道路管理者あてに提出した。','ボイラー(移動式ボイラーを除く。)を設置するに当たって、「ボイラー設置届」を労働基準監督署長あてに提出した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'施工',no:5,text:'仮設工事等に関する次の記述のうち、最も不適当なものはどれか。',choices:['高さ40 mの枠組足場の強度計算において、鉛直方向の荷重である足場の自重と積載荷重は建枠で支持し、水平方向の風荷重は壁つなぎで支持しているものとみなして部材の強度を検討させた。','移動式クレーンによる荷の吊り上げ作業において、10分間の平均風速が10 m/s以上となることが予想されたので、作業を中止し、当該クレーンの転倒防止を図った。','単管パイプを用いて床面開口部の周囲に設ける仮設の手摺については、高さを1.2 mとし、物体落下防止として高さ10 cmの幅木を設け、墜落防止として床から65 cmの位置に中桟1本を取り付けた。','墨出しに用いる鋼製巻尺のテープ合わせについては、鋼製巻尺(日本工業規格(JIS)1級)を3本用意して、それぞれに50 Nの張力を与えて、相互の差を確認した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'施工',no:6,text:'土工事及び山留め工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['軟弱な粘性土地盤の掘削工事において、ヒービングの危険性が高いと判断されたので、その対策として、剛性の高い山留め壁を良質な地盤まで設置し、背面地盤の回り込みを抑えることとした。','親杭横矢板工法の親杭をプレボーリングにより設置したので、受働抵抗を十分に発揮させて水平方向の変形を抑制するために、杭の根入れ部分はセメントベントナイト液の注入を行い、根入れ部分より上の杭まわりの空隙は存置した。','切ばり支柱と乗入れ構台支柱をやむを得ず兼用するに当たり、切ばり支柱としての荷重とともに、乗入れ構台上の重機や構台自重等の合計荷重に対する支持力を確認した。','ソイルセメント壁の芯材としての形鋼に新品を用いたので、芯材の許容応力度は、短期許容応力度の値を採用した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'施工',no:7,text:'杭地業工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['寒冷地における場所打ちコンクリート杭において、地中温度が低くなることを考慮して、コンクリートの養生温度による調合強度の補正を行った。','プレストレストコンクリート杭工事の杭頭処理において、ダイヤモンドカッター方式で杭頭を切断するに当たり、補強する範囲を当該切断面から350 mm程度とした。','セメントミルク工法において、掘削時にはアースオーガーの心を杭心に鉛直に合わせ正回転させ、引上げ時にはアースオーガーを逆回転させた。','既製コンクリート杭の継手部の溶接において、仮付け溶接は、本溶接と同等なものとし、その長さを40 mm以上とした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'施工',no:8,text:'鉄筋工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['鉄筋相互の接合に当たって、「SD345のD25」と「SD390のD29」との継手をガス圧接継手とした。','ガス圧接において、加熱中にバーナーの火炎に異常が生じたため加熱を中断したが、圧接端面相互が密着した後であったので、再加熱して圧接作業を続行させた。','日本工業規格(JIS)のD25の異形鉄筋の受入れ検査において、搬入時に圧延マークを確認したところ、突起の数が2個であったので、SD345と判断した。','鉄筋工事の配筋検査のうち、壁の検査においては、交差する鉄筋相互の結束箇所が、交点の半数以上でバランスよく結束されていることを確認した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'施工',no:9,text:'型枠工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['せき板の取外し後に湿潤養生をしない計画の基礎のせき板の存置期間は、計画供用期間の級が「標準」であったので、構造体コンクリートの圧縮強度が5 N/mm²以上に達するまでとした。','スラブ下(片持スラブを除く。)の支保工の取外しに当たり、コンクリートの圧縮強度が設計基準強度に達していなかったが、コンクリートの圧縮強度が12 N/mm²以上であり、かつ、構造計算により安全であることを確認した。','柱型枠の構造計算を行うに当たり、コンクリートの打込み速さが20 m/hを超え、打込み高さを3.6 mとして予定していたので、側圧は、「フレッシュコンクリートのヘッド(側圧を求める位置から上のコンクリートの打込み高さ)」と「フレッシュコンクリートの単位容積質量に重力加速度を乗じたもの」とを乗じた値とした。','壁型枠に設ける配管用のスリーブのうち、開口補強が不要であり、かつ、スリーブの径が200 mm以下の部分について、特記がなかったので、当該スリーブに紙チューブを採用した。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'施工',no:10,text:'コンクリート工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['マスコンクリートの温度ひび割れを抑制するために、普通ポルトランドセメントの代わりに、中庸熱ポルトランドセメントを採用した。','コンクリートの乾燥収縮ひずみを抑制するために、所要のワーカビリティーが得られる範囲で、単位粗骨材量をできるだけ大きくした。','軽量コンクリートのポンプ圧送中のスランプロス(スランプ低下)を抑制するために、人工軽量骨材はあらかじめ十分に吸水したものを使用した。','高強度コンクリートの自己収縮を抑制するために、所要のワーカビリティーが得られる範囲で、単位セメント量をできるだけ大きくした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'施工',no:11,text:'コンクリート工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['普通コンクリートにおける構造体コンクリートの圧縮強度の検査において、1回の試験に用いる供試体については、工事現場において適切な間隔をあけた3台の運搬車から各1個ずつ、合計3個採取した。','コンクリートの打込み日の外気温が25℃以下となることが予想されたので、コンクリートの練混ぜから打込み終了までの時間の限度を150分とした。','軽量コンクリートのポンプ圧送において、輸送管の水平換算距離が150 mであったので、呼び寸法125Aの輸送管を使用した。','コンクリートの打継ぎにおいて、やむを得ず、梁に鉛直打継ぎ部を設けなければならなかったので、せん断力の小さいスパン中央付近に鉛直打継ぎ部を設けた。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'施工',no:12,text:'プレキャスト鉄筋コンクリート工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['プレキャスト部材の接合用金物のアンカー筋に対するコンクリートの設計かぶり厚さについては、特記がなかったので、部材製造時の精度や施工時の誤差を考慮し、必要な最小かぶり厚さに5 mmを加えた値とした。','プレキャスト部材を現場打ちコンクリートに接合する部分については、特記がなかったので、「プレキャスト部材の位置の許容差」と「現場打ちコンクリート部分の位置の許容差」とを同じ値とした。','製造工場におけるプレキャスト部材の脱型時のコンクリートの圧縮強度は、部材の製造場所において採取し標準養生を行った供試体の圧縮強度の結果により確認した。','工事現場において仮置きするプレキャストの柱部材の積み重ねの数は、安定性を考慮して、平置きで2段までとする計画とした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'施工',no:13,text:'木造建築物において用いる接合金物の種類、形状及び主な用途の組合せとして、最も不適当なものは、次のうちどれか。ただし、図で示した金物の形状は、用途別に複数あるサイズのうちから、1例を示したものである。',choices:['ひら金物 (SM-40) — 上下階の管柱相互の接合','梁受け金物 (BH-195) — 梁と梁との接合','ホールダウン金物(引寄せ金物) (S-HD-15) — 基礎と柱との接合','折曲げ金物 (ST-12) — 根太と大引きとの接合'],answer:4,hasFigure:true,figureDesc:'各金物の形状図。ひら金物(SM-40)はL字型プレート、梁受け金物(BH-195)はU字型金物、ホールダウン金物(S-HD-15)は長尺プレート、折曲げ金物(ST-12)は小型L字型金物。'},
{year:2016,subject:'施工',no:14,text:'鉄骨工事における溶接部の欠陥とその補修方法との組合せとして、最も不適当なものは、次のうちどれか。',choices:['アンダーカット — 欠陥部を必要に応じて整形した後、ショートビードにならないように補修溶接し、必要に応じてグラインダー仕上げを行った。','ピット — 欠陥部に細径の溶接棒を用いて、ピット部に溶接金属を足して余盛を十分に確保するように補強した。','オーバーラップ — 余盛を削りすぎないように、注意しながらグラインダー仕上げを行った。','融合不良 — アークエアガウジングによりはつり取って実際の不良箇所の位置を確認し、欠陥の端部より20 mm程度の範囲を除去し、船底型の形状に仕上げてから再溶接した。'],answer:2,hasFigure:true,figureDesc:'各溶接欠陥の断面図。アンダーカット、ピット、オーバーラップ、融合不良の形状を図示。'},
{year:2016,subject:'施工',no:15,text:'鉄骨工事の高力ボルト接合に関する次の記述のうち、最も不適当なものはどれか。',choices:['溶融亜鉛めっき高力ボルトの接合において、M20とM22の一次締めトルクは、100 N・mとした。','高力六角ボルトM20のナット回転法による本締め後の検査において、全てのボルトについて、一次締め完了後に付したマークのずれにより、ナットの回転量が120度±30度の範囲にあるものを合格とした。','トルシア形高力ボルトの締付け後の検査において、ボルトの余長については、ナット面から突き出た長さが、ねじ1山～6山の範囲にあるものを合格とした。','F8Tの溶融亜鉛めっき高力ボルトM20の孔径については、22 mmとした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'施工',no:16,text:'防水工事及び屋根工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['アスファルト防水工事において、コンクリート下地の乾燥状態については、高周波水分計による下地水分の測定により判断した。','シーリング工事において、特記がなかったので、コンクリート壁下地の外壁のタイル目地に2成分形ポリサルファイド系シーリング材を使用した。','アスファルト防水工事で使用する縦引き型ルーフドレンについては、ルーフドレンから雨水排水縦管までの横引き管を短くするため、ルーフドレンをパラペットの立上り部に接する位置に設置した。','金属板による折板葺において、タイトフレームと受け梁との接合については、ボルト接合とせずに隅肉溶接とし、風による繰返し荷重による緩みを防止した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'施工',no:17,text:'張り石工事及びタイル張り工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['張り石工事における外壁乾式工法において、石材取付け用ファスナーの面外調整機構を考慮して、下地となるコンクリート部材の位置の許容差を、±10 mmとした。','張り石工事における石先付けプレキャストコンクリート工法において、シアコネクターの取付け代を考慮して、コンクリート部材に先付けされる石材の厚さを、20 mmとした。','セメントモルタルによるタイル後張り工法における改良圧着張りにおいて、張付けモルタルの1回の塗付け面積の限度は、2 m²以下とし、かつ、60分以内に張り終える面積とした。','セメントモルタルによるタイル後張り工法において、外壁タイルの引張接着強度を確認する試験体の数は、100 m²ごと及びその端数につき1個以上とし、かつ、全体で3個以上とした。'],answer:2,hasFigure:false,figureDesc:''},
{year:2016,subject:'施工',no:18,text:'金属工事及びガラス工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['アルミニウム合金製の手摺の取付けにおいて、温度差が40℃の場合の部材伸縮の目安を1 m当たり1.0 mm程度として、伸縮調整部を所定の間隔で設けた。','鉄筋コンクリート造の躯体へのアルミニウム製の外壁サッシの取付けに当たって、サッシ下部のモルタルを確実に充塡するために、水切り板下部とサッシ下枠下部のモルタル詰めを二度に分けて行った。','アルミニウム製の外壁サッシにおいて、引違い窓のセッティングブロックは、フロート板ガラスの両端部からガラスの横幅寸法の1/4の位置に設置した。','外壁サッシにはめ込まれた板ガラスの熱割れを防止するために、フロート板ガラスに比べて日射吸収率の高い熱線吸収板ガラスを用いた。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'施工',no:19,text:'内外装工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['コンクリート壁下地面におけるせっこうボードのせっこう系直張り用接着剤による直張り工法において、特記がなかったので、接着剤の塗付け間隔をボード周辺部で、150～200 mmとした。','グリッパー工法によるタフテッドカーペットの敷込みにおいて、長い廊下については、伸長用工具としてパワーストレッチャーを使用した。','コンクリート下地へのセメントモルタル塗りにおいて、下地への吸水調整材の塗布回数を増すことにより、コンクリート下地とモルタルの付着性を高めた。','縦壁ロッキング構法によるALCパネル工事において、外壁のパネル間の目地のシーリングについては二面接着とした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'施工',no:20,text:'設備工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['自動火災報知設備の設置において、天井面への煙感知器(光電式スポット型)の取付けは、換気口等の吹出し口から1.2 m離して取り付けた。','排水設備工事における排水トラップは、封水深さが5～10 cmのものを使用した。','外壁に設ける換気用の排気口については、屋外避難階段から2 m離して設けた。','寒冷地以外において、車両が通行しない平坦な敷地における給水管の埋設深さを、管の上端から300 mmとした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2016,subject:'施工',no:21,text:'各種工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['耐火建築物におけるメタルカーテンウォール工事において、下階から上階への延焼と火炎を防止する層間ふさぎについては、カーテンウォール部材の挙動により耐火材が脱落しないように厚さ1.6 mmの鋼板の層間ふさぎ受けを取り付けた。','鉄筋コンクリート造の建築物における断熱工事の断熱材打込み工法において、型枠取り外し後にフェノールフォーム保温材が欠落している部分を発見したので、その部分のコンクリートをはつり取り、断熱材現場発泡工法により隙間なく補修した。','現場発泡工法による断熱工事において、総厚さ30 mmの吹付け硬質ウレタンフォーム断熱材の吹付け方法については、厚さ5 mm以下で下吹きを行った後、発泡体表面が平滑になるよう、多層吹きとした。','戸建て住宅の換気設備工事において、排気ダクトについては、雨仕舞いに優れた形状の丸型ベントキャップを用いたので、排気効率を考慮し、住戸内から住戸外に向かって、先上がり勾配とした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'施工',no:22,text:'改修工事等に関する次の記述のうち、最も不適当なものはどれか。',choices:['コンクリート打放し仕上げの外壁のひび割れ部の手動式エポキシ樹脂注入工法による改修工事において、鉛直方向のひび割れ部については、ひび割れ部の下部の注入口から上部へ順次注入した。','保護アスファルト工法による陸屋根の保護層を残し改修用ルーフドレンを設けない防水改修工事において、既存ルーフドレンの周囲の既存防水層の処理に当たっては、既存ルーフドレン端部から500 mm程度の範囲の既存保護層を四角形に撤去した後、既存ルーフドレン端部から300 mm程度の範囲の既存防水層を四角形に撤去した。','特定天井の天井下地に該当しない一般的な軽量鉄骨天井下地を新設する内装改修工事において、既存の埋込みインサートを再使用することとしたので、引き抜けないことを確認するために、工事対象階の3箇所でそれぞれ400 Nの荷重により、吊りボルトの引抜き試験を行った。','建築物の劣化診断方法において、コンクリートの中性化深さの調査を、電磁波レーダ法により行った。'],answer:4,hasFigure:false,figureDesc:''},
{year:2016,subject:'施工',no:23,text:'鉄筋コンクリート造の既存建築物の耐震改修工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['コンクリート壁において、豆板が発見された部分のコンクリートの打直しを行うに当たり、図－1(X－X\'断面)のように、コンクリートをはつり取った後に露出した鉄筋と周囲のコンクリートとの隙間の寸法aを最低20 mm程度とした。','コンクリート壁において、豆板が発見された部分のコンクリートの打直しを行うに当たり、図－1(Y－Y\'断面)のように、開口部の上端のコンクリート打設側の寸法bを100 mm以上となるように斜めにはつり取った。','接着系アンカーによる「あと施工アンカー」の穿孔作業において、図－2のように、やむを得ず傾斜して穿孔しなければならなかったので、施工面への垂線に対して傾斜角cを15度以内で行った。','壁開口部の金属系アンカーによる「あと施工アンカー」の施工において、図－3のように、既存梁の主筋とせん断補強筋で囲まれた内側になるように配置し、既存柱からのはしあきの寸法dをアンカー軸部の直径の5倍以上とした。'],answer:1,hasFigure:true,figureDesc:'図－1: コンクリート壁の打直し断面図(X-X\'断面で鉄筋周囲の隙間a、Y-Y\'断面で開口部上端の寸法b)。図－2: あと施工アンカーの穿孔時の傾斜角c。図－3: あと施工アンカーの配置(はしあきd、既存柱・既存梁との関係)。'},
{year:2016,subject:'施工',no:24,text:'建築工事の検査において、一般に使用する検査器具に関する次の記述のうち、最も不適当なものはどれか。',choices:['クラックスケールは、コンクリート等に発生したひび割れの幅の測定に用いる器具である。','溶接ゲージは、隅肉溶接ののど厚、脚長やビード幅の測定、アンダーカット深度等を測定する器具である。','すきまゲージは、本尺と副尺により1/20 mmまでの精度で幅や深さの測定ができる器具である。','鋼球型テストハンマーは、タイル等の表面について、ハンマーの先端を左右に転がすように動かし又は軽打し、その音の差異で浮きがないか調べる器具である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2016,subject:'施工',no:25,text:'次の記述のうち、四会連合協定「建築設計・監理等業務委託契約約款」(平成27年2月改正)又は民間(旧四会)連合協定「工事請負契約約款」(平成23年5月改正)に照らして、最も不適当なものはどれか。',choices:['監理業務において、委託者は、必要あるときは受託者に対し指示をすることができるが、委託者の指示の内容が建築士法、建築基準法その他業務に関する法令に抵触し又は抵触するおそれがあると認められる場合、受託者は撤回又は変更を求めることができる。','監理業務において、受託者は、委託者の承諾を得て監理業務の一部について、他の建築士事務所の開設者に委託した場合、委託者に対し、当該他の建築士事務所の開設者の受託に基づく行為全てについて責任を負う。','工事の施工において、受注者は、監理者の処置が著しく適当でないと認められるときは、その理由を明示した書面をもって、発注者に対して異議を申し立てることができる。','工事の施工において、受注者は、工事現場における施工の技術上の管理をつかさどる監理技術者又は主任技術者を定め、書面をもってその氏名を監理者に通知する。'],answer:4,hasFigure:false,figureDesc:''}
];

const EXPL = {"2025-計画-1":["正しい。循環経済の実現に向け、建設リサイクルの高度化や長寿命化、空き家活用、二拠点居住などによる循環資源に資する地域生活圏の形成が目指されている。","正しい。ウォーカブルシティは歩いて暮らせる都市づくりを目指す考え方で、国土交通省のまちなかウォーカブル推進事業などで居心地が良く歩きたくなる空間づくりが進められている。","正しい。アフォーダンスは環境が備えている、行動を引き出す資質をいい、知覚されるアフォーダンスは知覚者の経験・能力・要求などによって異なるとされる。","誤り。記述はユニバーサルデザインの説明である。フェーズフリーは、平常時と災害時(フェーズ)の区別をなくし、日常の製品・サービスを非常時にも役立てる考え方である。"],"2025-計画-2":["正しい。日光東照宮社殿は、本殿と拝殿を石の間でつないだ権現造の代表例である。","誤り。慈照寺東求堂同仁斎は、違い棚と付書院をもつ現存最古級の書院造の例であり、数寄屋造ではない。数寄屋造は茶室の意匠を取り入れた後の様式である。","正しい。東大寺二月堂は、斜面に張り出した床を長い束柱で支える懸造(舞台造)の例である。","正しい。出雲大社本殿は、切妻造・妻入で、正面の柱間の片側を入口とする左右非対称の平面をもつ大社造である。"],"2025-計画-3":["誤り。パルテノン神殿は外周にドリス式円柱が並ぶ古代ギリシアの神殿だが、クリアストーリー(高窓)による採光は行っていない。高窓採光はエジプトの多柱室やバシリカなどの特徴である。","正しい。パンテオンは直径約43mのドームをレンガとコンクリート等で架け、頂部の天窓(オクルス)から採光する古代ローマの建築物である。","正しい。ハギア・ソフィアはペンデンティヴを用いて大ドームを架け、バシリカ式と集中式を融合した内部空間をもつビザンチン建築である。","正しい。サン・カルロ・アッレ・クァットロ・フォンターネ聖堂はボッロミーニの設計で、凹凸の曲面ファサードと楕円形平面のドームをもつバロック建築である。"],"2025-計画-4":["正しい。特定天井の仕様ルートでは、天井と壁等との間に6cm(60mm)以上の隙間を設けることとされており、記述は適当である。","正しい。遮音壁では、スタッドを千鳥配置とし中空部にグラスウールを充填することで、壁両面の振動の伝達を抑え遮音性能が向上する。","誤り。寒冷地では凍害防止のため吸水率の小さいI類(磁器質)が適する。吸水率の大きいIII類(陶器質)に変更すると凍害を受けやすく、記述は逆である。","正しい。オープンジョイントは、目地内外の空気圧を等圧にして雨水の浸入を防ぎ、浸入水を重力で排水する等圧原理を利用した工法である。"],"2025-計画-5":["正しい。令和5年住宅・土地統計調査では、全国の空き家は約900万戸で過去最多とされ、有効活用や適切な管理の総合的強化が求められている。","正しい。建設リサイクル法の特定建設資材は、コンクリート、コンクリート及び鉄から成る建設資材、木材、アスファルト・コンクリートの4種類である。","正しい。長期優良住宅の認定には、構造耐力上主要な部分や雨水浸入防止部分、給排水設備などについて、定期点検・補修等の維持保全計画の策定が必要である。","誤り。法定耐用年数は税務上の減価償却費を計算するための年数であり、建築物を実際に使用できる期間を規定するものではない。"],"2025-計画-6":["正しい。ポリウレタン樹脂塗料は光沢があり、付着性・耐摩耗性・耐水性に優れ、木床などに用いられる。","誤り。オイルステインは木材に浸透して着色する塗料で、塗膜を形成せず、耐久性の向上効果は小さい。外壁等には適さず、耐久性向上には塗膜形成型塗料等を用いる。","正しい。ヤマトシロアリは湿潤な木材を好み、被害は地面に近い建築物の下部や水回りに多い。","正しい。木材腐朽菌の繁殖には酸素・温度・水分・栄養源の4条件が必要で、いずれか一つでも除去すれば腐朽を防止できる。"],"2025-計画-7":["正しい。天空率を用いると斜線制限が適用されず、基準階の合理化や床面積・空地の確保がしやすくなる。","誤り。夏期の熱負荷低減には、日射の影響が大きい東西面にコアを配置して開口部を減らし、南北面に開口部を設けるのが一般的であり、記述は逆である。","正しい。センターコアは共用部を集約でき、フロアを分割貸しする場合でもレンタブル比を確保しやすい。","正しい。動線はセキュリティレベルの低い公道側から高い事務室へ段階的に連続させるのが基本である。"],"2025-計画-8":["正しい。避難時に使用する階段の頭上空間(段裏から段鼻まで)を2m程度確保するという寸法は、一般的な設計の範囲として適当である。","正しい。車椅子使用者用客室の浴室では、浴槽深さ500mm程度、移乗台とエプロンの高さ450mm程度が一般的な目安である。","誤り。駐車場法施行令では、車路の幅員は一方通行で3.5m以上、対面通行で5.5m以上とされる。一方通行を3mとするのは不足である。","正しい。ローカウンターの高さは700mm程度、ハイカウンターは1,000mm程度が高齢者・障害者等への配慮として一般的である。"],"2025-計画-9":["誤り。壁面と直交方向の利用を想定する場合、おむつ交換台の展開時の引出し寸法は500mmでは不足し、利用動作や通路幅を考慮して設計標準の寸法を確保する必要がある。詳細寸法は標準を要確認。","正しい。バリアフリートイレは、車椅子の回転等に配慮した広さを確保し、オストメイト用流し、手荷物置き台、車椅子使用者が使える洗面台などを設ける。","正しい。便房内の操作部は、視覚障害者が識別しやすいよう配置・形状を統一し、洗浄ボタンと呼出しボタンを離して誤操作を避ける。","正しい。車椅子使用者用便房にはL型手すりと可動手すりを設け、水平部は便座座面から250mm程度の高さとする。"],"2025-計画-10":["正しい。オスマンのパリ改造は、中世以来の密集市街地を取り壊して直線的な大通りを通し、近代都市へつくり変えた。","誤り。記述は田園都市論(ハワード)の説明で、レッチワースもその例である。ペリーの近隣住区理論は、小学校を中心とした住区の構成単位を示す理論である。","正しい。1933年のCIAMに基づくアテネ憲章は、居住・労働・余暇・交通の4機能で都市を捉える機能主義的都市計画の考え方を示した。","正しい。東京計画1960は、求心型・放射型の閉鎖的構造を否定し、都市軸を導入した開放的な線形発展の都市構造を提案した。"],"2025-計画-11":["正しい。総合設計制度は、一定規模以上の敷地で一定割合以上の空地を確保し、市街地環境の向上に資する計画に対し、特定行政庁の許可で容積率等を緩和する制度である。","正しい。緑化地域は、緑地が不足する市街地等で、一定規模以上の建築物の新築・増築時に敷地面積の一定割合以上の緑化を義務付ける地域である。","誤り。記述は地区計画の説明である。高度利用地区は、土地の合理的かつ健全な高度利用と都市機能の更新を図るため、容積率の最高・最低限度等を定める地区である。","正しい。伝統的建造物群保存地区は、伝統的建造物群とこれと一体をなす環境を保存するため、市町村が都市計画または条例で定める地区である。"],"2025-計画-12":["正しい。住生活基本計画(全国計画)における最低居住面積水準は、単身世帯で住戸専用面積25m²が原則である。","正しい。子育て支援型共同住宅推進事業は、子どもの安全・安心対策や親同士の交流機会創出の施設整備を、転落防止手すりや補助錠の設置等に対し支援するものである。","正しい。シルバーハウジング・プロジェクトは、高齢者向けの住宅とライフサポートアドバイザーによるサービスを一体的に提供する事業で、事業主体の長が認めれば障害者世帯も利用できる。","誤り。サービス付き高齢者向け住宅は、バリアフリー構造を備え、安否確認と生活相談サービスを提供する賃貸住宅である。記述のリハビリで家庭復帰を目指すケア付きの施設は介護老人保健施設の説明である。"],"2025-計画-13":["正しい。ゆいま〜る多摩平の森は、団地の階段室型住棟にエレベーターと共用廊下を増築し、介護施設棟や誰もが使える食堂等を設けた再生事例である。","正しい。堀川団地は戦後建設のRC造店舗併用集合住宅で、耐震補強やエレベーター設置、多世代向け改修、DIY可能な住戸の導入などが行われた。","正しい。釜石市天神復興住宅は、リビングアクセス形式の採用や階ごとの共用廊下の反転配置により、高齢居住者の見守りに配慮した公営住宅である。","誤り。真野ふれあい住宅の建築計画の説明が実際と異なる。記述の平家建て・左右対称・中庭を軸とする配置などは実際の計画とは一致しない(詳細は確認を要する)。"],"2025-計画-14":["誤り。大臣認定による個別の安全検証は、テナント入れ替えや区画変更のたびに再検証・再認定が必要となり、短期間で容易に変更したい計画には不向きである。","正しい。劇場では、エントランスから客席へ段階的に暗くして暗順応を促す。赤系の内装は暗順応を妨げにくいとされ、記述は適当である。","正しい。車椅子使用者用駐車スペースを青色に塗装して一般駐車スペースと区別するのは、利用の適正化に有効な計画である。","正しい。ビル風対策として、外壁の出隅部の曲面化や外周部への常緑高木の植栽は有効である。"],"2025-計画-15":["正しい。紫外線カットフィルム付きのハイサイドライトによる自然採光で均質な照度を確保し、不足分をLED調光で補う計画は美術館に適する。","正しい。4階に保育室を設ける場合、特別避難階段に準じた屋内避難階段の付室に排煙設備を設け、乳幼児が一定時間待避できる広さを確保する計画は適当である。","正しい。床座のお話しコーナーに靴の履き替え用の段差を設けるのは一般的な計画で、記述の段差100mm程度は妥当な範囲である。","誤り。避難所のマンホールトイレは、防犯や利用しやすさの面から、居住エリアから離れすぎず、人目につきやすく安全に利用できる場所に設置する。人目につきにくい場所は不適当である。"],"2025-計画-16":["正しい。病室の出入口はベッドごと患者を搬送できる有効幅員が必要で、1.35mは適当である。","正しい。下部内視鏡検査の待合エリアには、検査衣への更衣室や前処置用のトイレを併設するのが一般的である。","正しい。中央材料部門は、手術部と専用の搬送設備で直結し、それ以外の部門へは廊下経由の搬送経路を確保する計画が一般的である。","誤り。LDRは陣痛・分娩・回復の過程を一つの部屋で過ごせるようにした方式である。過程ごとに専用の部屋を設けるのは記述の趣旨と異なる。"],"2025-計画-17":["正しい。岩見沢複合駅舎は、赤レンガの壁と古いレールを再利用したマリオンのカーテンウォールが特徴の駅・交流施設等の複合施設である。","誤り。東京駅丸の内駅舎は、戦災で被災した姿ではなく、保存・復原工事により創建時(1914年)の姿に復原された。免震構造の採用は正しい。","正しい。京都駅ビルは、中央コンコースを谷に見立てて段丘を東西方向に延ばし、ガラス屋根のアトリウムを特徴とする複合施設である。","正しい。延岡駅前複合施設エンクロスは、PCコンクリート柱とRC梁によるグリッド構成で、総合待合、図書スペース、駅前広場等を備えた複合施設である。"],"2025-計画-18":["正しい。委託者は、受託者が業務を遂行するのに必要な情報を、求めに応じて速やかに提供する義務がある。","誤り。四会連合協定の約款では、受託者は業務の全部を一括して第三者に委託してはならないとされ、委託者の同意があっても認められない。一部の再委託は承諾を得て可能である。","正しい。著作建築物への実名等の表示は、約款の著作権の取扱いに沿って、委託者との取り決めの下に行うものとされており、記述は適当である。","正しい。受託者は、委託者の請求があれば、契約に定めがなくても、業務の進捗状況について説明・報告する義務がある。"],"2025-計画-19":["誤り。直接仮設は、複数の工事科目に共通して使用する仮設をいう。単独の科目でのみ使用するという定義は誤りである。定義の取り違えに注意が必要である。","正しい。災害防止は、工事関係者や第三者の災害防止のための垂直養生、安全ネット、外周・開口部養生手すり等の安全設備をいう。","正しい。木躯体(軸組構法)は、軸組、床組、小屋組、壁、階段などに区分され、接合金物・接合具や防腐・防蟻処理等を含む。","正しい。コンクリート躯体は基礎、柱、梁、床板、壁、階段等に区分され、「さきの部分」に「あとの部分」が接続するものとして計測する。"],"2025-計画-20":["正しい。PPPは公共サービスの提供に民間が参画する手法を幅広くとらえた概念で、効率化やサービスの質向上を目指す。","正しい。詳細設計付工事発注方式は、主要諸元等を確定した上で、仮設等を含む詳細設計を施工と一括して発注する方式である。","誤り。デザインビルド方式は、設計と施工を一括して同一の事業者に発注する方式である。設計者と施工者の責任を分ける記述は設計施工分離方式の説明である。","正しい。オープンブック方式は、施工者がコスト情報を発注者に開示し、発注者または第三者が監査して支払の公正さを担保する方式である。"],"2024-計画-1":["正しい。建築士法上、建築士は違反建築物の建築等の法令違反行為について、指示や相談に応じる行為をしてはならない。","正しい。建築士が施工者として建築基準関係規定に違反する工事を行った場合も、不誠実な行為として、業務停止等の懲戒処分の対象となり得る。","誤り。一級建築士は国土交通大臣の免許を受けるが、二級建築士と木造建築士は都道府県知事の免許を受ける。","正しい。「地球環境・建築憲章」(2000年)は、長寿命、自然共生、省エネルギー、省資源・循環、継承の5つに取り組むことを宣言している。"],"2024-計画-2":["正しい。豊平館は明治期に建てられた木造総2階建ての洋風建築で、半円形に張り出したバルコニーをコリント式の柱で支える特徴をもつ。","正しい。臨春閣は江戸時代の数寄屋風書院造で、大正期に移築された。第三屋には雅楽の楽器を用いた欄間が設けられている。","誤り。本願寺飛雲閣は、平安時代の寝殿造ではなく、桃山時代(安土桃山時代)の建築で、書院造に数寄屋風の意匠を取り入れた3層の楼閣建築である。","正しい。三徳山三仏寺投入堂は、岩山の崖のくぼみに建つ、平安時代の懸造の建築物である。"],"2024-計画-3":["正しい。サン・マルコ大聖堂は、ギリシア十字形の集中式平面で中央交差部と各腕にドームをもつビザンツ様式の建築物である。","正しい。シュパイヤー大聖堂は、ラテン十字形の三廊式バシリカ平面に複数の塔をもつ、ドイツ・ロマネスク様式の代表例である。","正しい。パリのノートルダム大聖堂は、二重周歩廊と階上廊をもつ五廊式バシリカ平面で、西面にバラ窓や双塔をもつゴシック建築である。","誤り。ウェストミンスター宮殿は、バリーとピュージンによるゴシック・リバイバル様式である。幾何学的庭園や鏡の間をもつバロック様式の宮殿はヴェルサイユ宮殿である。"],"2024-計画-4":["正しい。認知症高齢者グループホームは、環境移行による混乱を避けるため、1ユニット5〜9人程度の小規模で家庭的な環境とする。","誤り。ウェイファインディングは、施設内での目的地までの経路を分かりやすく案内する計画である。備品・什器を直感的に使えるようにする配慮は、アフォーダンスなどの考え方にあたる。","正しい。ニューマンの「まもりやすい空間」は、パブリックからプライベートまでの段階的な空間構成により、領域性と監視性を高める理論である。","正しい。ソシオフーガルは、人を互いに離れさせる配置をいう。視線が合わずに座れるベンチは、この関係での利用に適した設えである。"],"2024-計画-5":["正しい。繊維系断熱材の屋外側に透湿防水シートと通気層を設けると、壁体内の湿気が屋外に排出され、内部結露を防止できる。","誤り。基礎断熱工法は床下を室内側として扱うため、床下換気口やねこ土台による通気は設けず、気密性を確保する。ねこ土台は床断熱で床下換気を行うための部材である。","正しい。内窓の気密性を高めると室内の湿気が既存窓との間に入りにくくなり、既存窓の室内側表面の結露防止に効果がある。","正しい。気候風土適応住宅は、地域の気候・風土に応じた住宅で、外皮基準への適合が困難なものとして国土交通大臣が定める基準に適合するものである。"],"2024-計画-6":["正しい。さや管ヘッダー工法は、さや管内の樹脂配管を引き替えられるため更新性に優れ、ヘッダーを点検しやすい位置に設ければ床下から集中的に点検・更新が行える。","正しい。BCPの策定では、サテライトオフィスの設置など拠点の分散によって、大規模災害時の事業継続や早期復旧のリスクを低減する方法が有効である。","誤り。特殊継手排水システムの排水管やパイプシャフトを専有部から点検する計画では、更新時に居住者の協力が必要となり長期利用に不適当である。共用部から点検・更新できる計画とする。","正しい。検査済証がない建築物の耐震改修では、確認済証や添付図書等を用いた図上調査と現地調査により、建築当時の法適合状況を確認する方法が一般的である。"],"2024-計画-7":["誤り。構造用集成材は、ひき板をその繊維方向が互いにほぼ平行となるように積層接着したものである。繊維方向を直交させるのは合板やCLTであり、大断面・湾曲材として大スパンにも使える点は正しい。","正しい。構造用合板は単板を繊維方向が直交するよう積層接着したもので、JASの特類は接着性能が高く、屋外や常時湿潤状態となる環境でも使用できる。","正しい。OSBは木材の削片（ストランド）を配向させた層を直交に積層接着したもので、強度性能が高く、耐力壁の面材などに使われている。","正しい。MDFは木材等の植物繊維を成形した繊維板で、下地材や家具材料のほか、構造用の面材としても用いられている。"],"2024-計画-8":["正しい。乳児を対象とするほふく室の面積は、児童福祉施設の設備及び運営に関する基準で1人当たり3.3m²以上とされ、定員10人なら33m²以上が必要であり、40m²は基準を満たす。","正しい。子どもや車椅子使用者が利用しやすいよう、貸出カウンターの上端高さを700mm程度、下端（ひざ下空間）を650mm程度とする計画は適切である。","誤り。バレーボールの公式試合を行うには、天井高（床面から障害物までの高さ）が12.5m以上必要とされる。10.5mでは不足であり、不適当である。","正しい。療養病床の病棟の患者用廊下の有効幅員は、片側居室で1.8m以上、両側居室で2.7m以上とされ、2.0mと3.0mは基準を満たす。"],"2024-計画-9":["正しい。幼児の立位でのおむつ交換や着脱衣を安全に行うため、乳幼児用おむつ交換台とは別に着替え台を設ける配慮は、設計標準に沿った適切な計画である。","誤り。直角に曲がる経路では車椅子の回転に余裕が必要であり、浴室出入口付近の通路幅員800mmでは不足する。設計標準では、これより広い有効幅員を確保することが求められる。","正しい。主たる階段では、杖使用者等に配慮して、段鼻から650mmと850mm程度の高さに二段の手すりを両側に設けることが標準的な計画である。","正しい。白内障の人は黄色味がかった見え方となり明暗対比の高い表示が見やすいため、黒地に白文字の表示板は適切な配慮である。"],"2024-計画-10":["正しい。景観協定は、景観計画区域内の一団の土地における良好な景観形成のため、原則として土地所有者等の全員の合意により締結される。","正しい。都市利便増進協定は、にぎわいや交流の創出に寄与する施設等を一体的に整備・管理するための協定であり、区域内の土地所有者等の相当部分の参加を前提として結ばれる。","正しい。建築協定は、住宅地としての環境や商店街の利便の維持増進を目的に、原則として土地所有者等の全員の合意により締結される。","誤り。都市緑地法に基づく緑地協定は、緑地の保全や緑化の推進に関する事項について、原則として土地所有者等の全員の合意により締結される。相当部分の参加ではない。"],"2024-計画-11":["正しい。区域区分（線引き）は、無秩序な市街化を防止し計画的な市街化を図るため、都市計画区域を市街化区域と市街化調整区域に区分する制度である。","正しい。まちづくり三法は、改正都市計画法、中心市街地活性化法、大規模小売店舗立地法の三つの法律の総称である。","正しい。連担建築物設計制度は、複数敷地の一団の土地で既存建築物の存在を前提に、複数建築物を同一敷地内にあるものとみなして建築規制を適用する制度である。","誤り。風致地区は、都市計画法に基づく地域地区であり、都市の風致を維持するために定められる。歴史まちづくり法に基づくものではない。"],"2024-計画-12":["正しい。まつかわぼっくす（宮脇檀）は、鉄筋コンクリート造の内側に木造を納めた混構造で、中庭をもつコートハウス形式の住宅である。","正しい。住吉の長屋（安藤忠雄）は、道路に面したファサードに玄関以外の開口部がなく、中央に中庭を設けたコンクリート打放しの住宅である。","誤り。中野本町の家（伊東豊雄）は、鉄筋コンクリートのヴォールトが連なるU字形平面の白い住宅である。鉄骨フレームにアルミやテントを架けた住宅は同設計者のシルバーハットである。","正しい。私たちの家（林昌二・林雅子）は、コンクリートブロック造の住宅を増改築し、庭と居間の関係を保ちつつ夫婦2人の住まいとした住宅である。"],"2024-計画-13":["正しい。防災集団移転促進事業は、災害発生地域や災害危険区域のうち居住に適当でない区域にある住居の集団的移転を促進する事業である。","正しい。ボンエルフ方式は、シケイン等で車道を蛇行させ車の速度を落とさせ、歩行者と車が共存できる道路とする計画手法である。","誤り。記述は、居住希望者が組合を結成して設計から管理まで行うコーポラティブハウスの説明である。コレクティブハウスは、個人住居に加え共用スペースを備え、居住者が協働して生活する集合住宅である。","正しい。デュアルリビングは、接客用のフォーマルリビングと家族用のファミリーリビングのように、機能の異なる2つのリビングを設ける計画である。"],"2024-計画-14":["正しい。避難時の流動係数は階段室の出入口の方が階段より大きく、出入口の有効幅員は階段の有効幅員より狭くすることができる。","正しい。駐車場の出入口は、同一道路に面する場合に適切な間隔を離し、左折入庫・左折出庫とすることで、交通の安全と円滑さを確保できる。","正しい。劇場の車椅子使用者用客席は、舞台までのサイトラインを確保し、異なる階や水平位置に分散して配置することが望ましい。","誤り。2階建てのかごで奇数階と偶数階を同時に輸送する方式はダブルデッキエレベーター方式である。コンベンショナルゾーニングは、低層・中層・高層などのゾーンごとに専用のエレベーターを割り当てる方式である。"],"2024-計画-15":["正しい。インクルーシブ教育は障害の有無にかかわらず共に学ぶ仕組みであり、カームダウン用のスペース設置など、状況に応じた合理的配慮が必要となる。","誤り。記述は障害者が社会の中で普通に生活できるよう整えるノーマライゼーションの説明である。ジェントリフィケーションは、再開発等により地域の居住者層が入れ替わる都市現象である。","正しい。レスパイトケアは、介護者が一時的に介護から離れて休息できるようにする支援であり、短期入所は交流の場としても期待されている。","正しい。地域包括ケアシステムは、重度の要介護状態でも住み慣れた地域で暮らし続けられるよう、住まい・医療・介護・予防・生活支援を一体的に提供する仕組みである。"],"2024-計画-16":["正しい。患者用トイレは、麻痺の側により便器への側方アプローチの向きが異なるため、左右勝手の異なるタイプを分散して配置することが望ましい。","正しい。緩和ケア病棟は、全室個室とし、患者家族が利用できる調理室や食事室を共用部に設けるなど、患者と家族のQOLを高める計画が適切である。","正しい。病室階には、避難階段等の縦動線を使わずに一定時間安全を確保できるよう、防火防煙区画された安全区画を2つ以上設ける計画が有効である。","誤り。一般に、診療部門（中央診療部門）を外来部門と病棟部門の間に配置し、両方からの動線を考慮する。外来部門を診療部門と病棟部門の間に置く計画は不適当である。"],"2024-計画-17":["誤り。富弘美術館（群馬県）は、大きさの異なる円形の展示空間が独立して配置され、その間の空間も展示や交流の場とする計画であり、矩形ではない。","正しい。ポーラ美術館（神奈川県）は、すり鉢状の構造体を地下に埋め込んで高さを抑え、アトリウムから自然光を取り入れ、自然と美術の共生を目指した計画である。","正しい。京都市京セラ美術館は、昭和初期開館の既存のメインエントランスを残し、スロープからつながる地下広場に面して新たなエントランスを設ける改修が行われた。","正しい。豊島美術館（香川県）は、鉄筋コンクリートのシェル構造の屋根に大きな開口部を設け、風・音・光を取り込んで環境と建築と作品を一体で感じさせる計画である。"],"2024-計画-18":["正しい。実施設計に関する標準業務には、基本設計に基づき、施工者が設計意図を読み取り適切に施工・見積りできるよう、詳細な仕様書や図面等を作成する業務が含まれる。","正しい。四会連合協定の監理業務は、工事監理と、契約で定める工事監理に係るそれ以外の任意の業務を含んでいる。","正しい。工事と設計図書との照合及び確認、その結果報告等と工事監理の結果報告は、建築士法上、建築士でなければ行えない業務である。","誤り。約款上の監理者の権限は契約で定められるが、設計変更は原則として発注者の判断に関わる事項であり、特に定めのない限り設計変更の権限は含まれないとされる。"],"2024-計画-19":["誤り。工事価格は、純工事費に現場管理費を加えた工事原価に、一般管理費等を加えたものである。純工事費と一般管理費等だけを合わせたものではない。","正しい。木取りは、規格長さの製材から1本又は複数の部材を挽き出すことをいう。","正しい。複合単価は、材料、副資材、施工手間等をまとめた単価である。","正しい。材料と施工手間に分離する場合、材料価格に対応する数量は所要数量（割増を含む）とし、施工手間に対応する数量は設計数量とする。"],"2024-計画-20":["誤り。記述は、完成直後に所有権を公共に移転し民間が運営を行うBTO方式の説明である。BOT方式は、民間が建設・所有して運営し、事業期間終了後に公共へ所有権を移転する。","正しい。プロパティマネジメントは、ビル運営管理のほか、リーシングマネジメントやコンストラクションマネジメント業務等を含むことがある。","正しい。ライフサイクルマネジメントは、建築物の企画から解体・廃棄までの全期間を通じ、機能や効用の維持向上を適切なコストで管理することである。","正しい。BIMは、3次元モデルに部材の寸法、材料、コスト等の属性情報をもたせたデータベースで、設計から施工、維持管理まで活用できる。"],"2023-計画-1":["正しい。建築士は専門家として、非専門家との知識・情報の格差を埋める責任があり、アカウンタビリティ（説明責任）の実践が求められる。","正しい。建築士は国民の生命・財産を守る技術的資質・能力を自ら保持すべき資格者であり、業務独占を与えられた者として高い倫理性が求められる。","正しい。プロジェクト達成のリスク（不都合な情報）を積極的に共有し、集団内で意思疎通を図ることをリスクコミュニケーションといい、その実践が重要である。","誤り。コンプライアンスは法令遵守にとどまらず、社会規範や倫理、契約など広く守るべきものを遵守する姿勢をいう。遵守対象は法令に限定されない。"],"2023-計画-2":["正しい。宇佐神宮本殿は、切妻造・平入りの前殿と後殿を相の間でつないだ八幡造の建築物である。","誤り。円覚寺舎利殿は、内部を化粧屋根裏とし、柱上に組物を置く禅宗様（唐様）の建築物である。挿肘木で軒荷重を支える大仏様の代表例は東大寺南大門である。","正しい。箱木家住宅（兵庫県）は、棟束で屋根を支え、柱間が長く内法高の低い、現存最古級の民家と推定されている。","正しい。妙喜庵待庵（京都府）は、二畳隅炉に次の間をもつ、16世紀末頃の建築と推定される草庵風茶室である。"],"2023-計画-3":["正しい。ジッテの『広場の造形』（1889年）は、ヨーロッパの歴史的広場を分析し、中世に起源をもつ自然発生的な都市空間の価値と、そのスケール感を学ぶ重要性を主張した。","正しい。ロースの『装飾と犯罪』（1908年）は、実用に資さない表面的な装飾は不要であると主張し、近代建築の思想に大きな影響を与えた。","正しい。ギーディオンの『空間・時間・建築』（1941年）は、空間概念を前面に出して近代建築を歴史の流れに位置づけ、その正当性を主張した。","誤り。曖昧さや複雑さのある建築の魅力を説き、近代建築を批判した著作は、ヴェンチューリの『建築の多様性と対立性』（1966年）である。ロッシの『都市の建築』は都市の類型や集合的記憶に着目した著作である。"],"2023-計画-4":["正しい。Low-E複層ガラスは、中空層側のガラス面に特殊金属膜をコーティングしたもので、日射取得型と日射遮蔽型を使い分けることで省エネルギー化に寄与する。","誤り。網入板ガラスは、破損しても破片が脱落しにくいが、金属線が入るため同程度の厚さのフロート板ガラスより強度は高くなく、耐風圧性能を高める効果はない。","正しい。倍強度ガラスは強化ガラスより強度は低いが、破損時に細かい粒状にならず脱落しにくいため、高所での使用に適する。","正しい。合わせガラスは、2枚以上の板ガラスの間に中間膜を挟んで全面接着したもので、飛散防止や防犯性能の向上に有効である。"],"2023-計画-5":["正しい。陸屋根では、信頼性・耐久性のある防水に加え、ルーフドレンを複数設置したりオーバーフロー管を設けることが、漏水防止に有効である。","正しい。スノーダクト方式の無落雪屋根は、隣地との間に雪を堆積する空間がない都市部などで有効である。","正しい。霧除け庇は、窓等の開口部の上部に設ける小庇であり、雨仕舞いに有効である。","誤り。夏期は西日の太陽高度が低く、水平庇では日射を遮りにくい。北緯35度の地点では、水平庇は南面の開口部に設けるほうが夏期の日射遮蔽効果が期待できる。"],"2023-計画-6":["正しい。CLTは、ひき板を繊維方向がほぼ直交となるように積層接着した材料で、構造躯体として使用でき、断熱性能も期待できる。","誤り。LVLは、単板を繊維方向がほぼ平行となるように積層接着した材料である。引張強度が高く品質が均一であり、主に梁や柱などの軸材に使われる。","正しい。被覆型（メンブレン型）は、柱や梁等の木材の周囲に無機質系建材等の耐火被覆を施した耐火部材である。","正しい。燃え止まり型は、木材の周囲に燃え止まり層を設け、その外側に燃え代層を張り付けた耐火部材である。"],"2023-計画-7":["正しい。市庁舎では、市民、職員・サービス、議会の利用者が異なるため、エントランスをそれぞれ別に設ける計画は動線を分離でき適切である。","正しい。施設一体型の義務教育学校では、低学年児童が安心して遊べるよう、専用の運動広場を設ける計画は適切である。","正しい。博物館では、研究対象の収蔵品を不必要に移動させないため、研究部門を収蔵部門に近接して配置するのが望ましい。","誤り。ICU（集中治療室）は、手術部や救急部との連携が密であるため、これらに近接して配置する。手術部と離して病棟部門に置く計画は不適当である。"],"2023-計画-8":["正しい。自動車の車路の傾斜部では、本勾配を1/8とする場合、始端と終端に本勾配の1/2程度の緩和勾配（1/16）を設け、長さを3.5〜4m程度とする計画は妥当である。","正しい。400mトラックを設ける高等学校の運動場は、120m×190m程度の寸法があれば計画できる。","誤り。ユニット型個室の居室は、床面積を原則13.2m²以上とする基準がある。2.7m×3.6mでは約9.7m²となり不足する。","正しい。バルコニーは、床から80mm程度の立上りを設けた上で、高さ1.1m以上の手すりを設け、手すり子の間隔は内法110mm以下とするため、記述は妥当である。"],"2023-計画-9":["誤り。自動式引戸の開閉スイッチを戸先の近くに設けると、戸の動きにより車椅子使用者が衝突や接触の危険を受ける。スイッチは戸先から離れた、安全に操作できる位置に設ける。","正しい。授乳及びおむつ替え室は、男女ともにアクセスしやすい場所とし、中から施錠できる授乳用の個室を設ける配慮は適切である。","正しい。車椅子使用者用客室は、利用者の状況に応じてレイアウトを変更しやすいよう、ベッドやキャビネットを可動式とすることが望ましい。","正しい。階段の段鼻と踏面の色に明度差を付け、昇り始めから終わりまで統一することは、弱視者等が段を識別しやすく、適切である。"],"2023-計画-10":["誤り。記述は交通需要マネジメント（TDM）の説明である。MaaSは、複数の交通手段を統合し、検索・予約・決済等を一括して提供するサービスである。","正しい。TODは、公共交通機関の利用を前提とし、過度に自動車に依存しない持続可能な都市を実現する手法である。","正しい。ITSは、最先端の情報通信技術を用い、交通事故や渋滞などの道路交通問題の解決を目的として構築する交通システムである。","正しい。LRTは、低床式車両の活用や軌道・電停の改良により、乗降の容易性、定時性、速達性、快適性などに優れた軌道系交通システムである。"],"2023-計画-11":["誤り。高度利用地区は容積率の最高限度及び最低限度、建蔽率の最高限度、建築面積の最低限度、壁面の位置の制限を定める地区であり、建築物の高さの限度を定める地区ではない。","正しい。市街化調整区域は、無秩序な市街化を防止し計画的な市街化を図るため、市街化を抑制すべき区域として定められる。","正しい。生産緑地地区は市街化区域内の農地等で、良好な生活環境の確保に効用があり、公共施設等の敷地として適している土地を指定する地区である。","正しい。景観地区では、建築物の形態意匠の制限、高さの最高限度又は最低限度、壁面の位置の制限、敷地面積の最低限度を都市計画に定めることができる。"],"2023-計画-12":["正しい。バラガン自邸は庭と一体化した内部空間をもち、居間の奥に庭に面した大きな窓を設けて外部を積極的に取り込んだ住宅である。","正しい。アスプルンドの夏の家は、切妻屋根の2棟を組み合わせ、居間棟をずらすことで主棟のホールからも海を望めるようにした住宅である。","誤り。ガラスの家(ジョンソン)は四周をほぼ透明な板ガラスで囲み、間仕切り壁はほとんどなく、浴室を収めた円筒のみを置いた住宅である。半透明のガラスブロック壁ではない。","正しい。バワ自邸は4軒長屋を改造・改築し、路地を長い回廊に置き換え、アプローチから奥まで坪庭が随所に設けられた住宅である。"],"2023-計画-13":["正しい。一度に多数が入居する分譲集合住宅では、人口構成の偏りに配慮した多様な住戸計画とし、低層部に保育所や高齢者施設を設けることは有効である。","正しい。浸水想定区域では、水防ラインの設定や、受変電設備・非常用発電機など重要設備の屋上等高所への設置により、浸水時の機能維持を図る。","誤り。長期修繕計画ガイドラインでは、計画期間を30年以上とし、その間に大規模修繕工事が2回以上含まれるようにすることとされている。1回では不十分である。","正しい。長期優良住宅の認定には、躯体天井高さの確保や、間取り変更に対応できる可変性の措置など、居住者の変化に対応できる構造・設備が求められる。"],"2023-計画-14":["正しい。基準階の平面寸法が45m×80mの大規模な事務所ビルでは、フレキシビリティや面積効率の高いセンターコアタイプが適している。","正しい。ABWは、業務内容や気分に応じて事務所内外から働く場所を自由に選ぶ働き方であり、事務所内にも多様な場所を計画する。","正しい。直通階段が1か所の建築物の改修では、直通階段から離れた位置に、外部から救出可能な開口部を備えた退避区画を設けることが有効である。","誤り。PC作業中心の執務空間では、ディスプレイへの映り込みを避けるため、水平面照度に対し鉛直面照度を過度に高くしない。鉛直面照度を高くするのは不適当である。"],"2023-計画-15":["正しい。施設一体型の義務教育学校では、小・中学校段階の教職員が連携しやすいよう、共同の職員室とする計画は有効である。","正しい。聴覚障害児童・生徒の特別支援学校では、発音・発語の練習用の鏡や、練習後に使う手洗い・うがい用の流しを普通教室に設けることがある。","誤り。小学校の児童用廊下は、建築基準法施行令により両側に居室がある場合は幅2.3m以上、その他は1.8m以上が必要である。両側居室で1.8mでは不足する。","正しい。板材単体は吸音性能が低いため、木板を表面材とした孔あき板等を用いて吸音性を確保し、残響過多を防ぐ配慮は適切である。"],"2023-計画-16":["正しい。診療部門は医療機器の更新や機能拡充が頻繁に生じるため、隣接して増築可能な空地を確保しておく計画は適切である。","誤り。感染症病室は、病原体を室外に漏らさないよう廊下に対して室内を陰圧に保つ。陽圧にするのは易感染患者用の無菌室などである。","正しい。子ども一人ひとりの生活リズムを尊重するため、食事の空間を保育室と分けて計画する考え方がある。","正しい。保育室ごとにトイレを設ければ、トイレまでの距離が短くなり、間に合わずに失敗することを減らせる。"],"2023-計画-17":["正しい。ワインヤード型は、舞台を取り囲むように段差をつけて客席をブロック状に配置したホール形式である。","正しい。フライズ(フライロフト)は、幕や照明などの吊物を収納する、プロセニアム形式の舞台上部の空間である。","正しい。橋掛りは、本舞台の後座から鏡の間へ続く廊下状の部分で、出演者の出入りに加え、演技・演出上の重要な場でもある。","誤り。本花道は客席の下手側を縦に貫く通路舞台である。上手側に設けられるのは仮花道であり、本花道を上手側とする記述は誤りである。"],"2023-計画-18":["正しい。建築設計受託契約は、建築主と設計者が対等な立場で合意に基づき、公正な契約を結ぶことが求められる。","誤り。重要事項説明は、設計受託契約の締結前に、建築主に対して書面を交付して行う必要がある。契約締結後に実施するとした点が誤りである。","正しい。四会連合協定の約款では、完成した建築物について新たに意匠登録を受けようとする場合、相手方の承諾を得る必要がある。","正しい。実費加算方法は、直接人件費、特別経費、直接経費、間接経費、技術料等経費及び消費税相当額を個別に積み上げて合算する方法である。"],"2023-計画-19":["誤り。仮設・土工事等における施工計画に基づく数量は計画数量である。所要数量は、設計数量に施工上の切りむだや損失を見込んだ数量をいう。","正しい。設計数量は、設計図書に記載された個数や設計寸法から求めた長さ・面積・体積等の数量である。","正しい。工事原価は、純工事費(直接工事費と共通仮設費)と現場管理費を合わせたものである。","正しい。共通費は、共通仮設費、現場管理費及び一般管理費等を合わせたものである。"],"2023-計画-20":["正しい。プロジェクトファイナンスは、担保不動産ではなくプロジェクトが生む事業収益に着目して、大規模な資金を融資する資金調達手法である。","正しい。ファシリティマネジメントは、組織活動のため施設とその環境を総合的に企画、管理、活用する経営活動である。","誤り。設計競技(コンペ)は、具体的な設計案の提出を求めて選ぶ方式である。技術力や経験、体制を含む提案書で設計者を選ぶのはプロポーザル方式である。","正しい。CM方式では、発注者の委任を受けたCMrが、設計・発注・施工の各段階で工程・品質・コスト管理等のマネジメント業務の全部又は一部を行う。"],"2022-計画-1":["正しい。建築士が報酬を得て、建築基準法令に基づく手続きの代理を業として行う場合は、建築士事務所に所属して登録を受ける必要がある。","正しい。建築士は設計契約の委任者に対し、法律に定める内容に限らず、建築士として一般的に要求される注意を尽くす善管注意義務を負う。","誤り。建築基準法は、建築物の敷地、構造、設備及び用途に関する「最低の基準」を定めている。平均的な基準とする記述は誤りである。","正しい。2050年カーボンニュートラルの実現に向け、建築物では省エネルギー性能の確保・向上と再生可能エネルギーの導入拡大が求められている。"],"2022-計画-2":["正しい。平安京は朱雀大路を中心に右京・左京に分かれ、条(東西道路)と坊(南北道路)による格子状街路をもつ条坊制がとられた。","正しい。江戸では江戸城を中核に堀の開削や埋立てが行われ、山の手の尾根筋に大名屋敷、谷筋に町人地を配するなど、地形に対応した開発がなされた。","誤り。エンデ・ベックマン建築事務所の計画は、明治期の日比谷を中心とする官庁集中計画である。帝都復興計画は関東大震災後に後藤新平らが立案した別の計画である。","正しい。丹下健三研究室の東京計画1960は、求心・放射型の閉鎖的構造に対し、東京湾上へ都市軸を伸ばして発展可能な構造を提案した。"],"2022-計画-3":["正しい。パンテオンの直径約43mのドームは、コンクリートやレンガで造られ、上方ほど厚さを薄くして重量を軽減している。","誤り。フィレンツェ大聖堂の八角形の大ドームはブルネレスキによる二重殻構造で、直径は約43mである。直径約31mで東西の半ドームと4つのバットレスが支えるとする記述は誤りである。","正しい。サーリネンのTWAターミナルビルは、4本のY字柱脚に支えられた4枚の鉄筋コンクリートシェルの屋根をもつ。","正しい。ミレニアムドームは直径約365m、最高高さ約50mの膜構造ドームで、12本のマストの頂部からケーブルで吊られている。"],"2022-計画-4":["正しい。博物館では収蔵品の保護のため、低湿・高湿収蔵庫を設け、それぞれの前室としてならし室を設けて急激な環境変化を防ぐ。","誤り。ブラウジングコーナーやレファレンスコーナーは、来館者が利用する開架部分に設けるものであり、職員が出納する閉架式書庫内には設けない。","正しい。給食室のドライシステムは、床を乾燥状態に保ち、細菌の繁殖や水はねによる汚染を防ぐ方式である。","正しい。危険物貯蔵庫は、爆発時の被害拡大を抑えるため、天井を設けず軽量な不燃材料で屋根を葺く。"],"2022-計画-5":["正しい。屋外の木造階段やバルコニーは、雨がかりを避け、接合部に水分が滞留しない計画とすることで耐久性を確保する。","正しい。木材は炭素を貯蔵する特性があり、製材は鋼材に比べて製造時のエネルギー消費が少ない。","誤り。木材の乾燥収縮率は、年輪の接線方向が最も大きく、次いで半径方向、繊維方向が最も小さい。接線方向 > 半径方向 > 繊維方向である。","正しい。木材の気乾密度は、一般にチーク、ヒノキ、キリの順に小さくなる。"],"2022-計画-6":["正しい。軽量化された建築物やアスペクト比の大きい塔状の建築物は、高層でなくても振動の問題が生じやすい。","正しい。固体伝搬音の対策には、スラブの短辺スパンを小さくし、スラブを厚くして剛性・質量を高めることが有効である。","正しい。視対象面の明るさにむらがあると視覚疲労につながるため、作業領域の均斉度が低くならないようにする。","誤り。タスク・アンビエント照明は、タスク照明の照度をアンビエント照度より高く設定し、全般照明より省エネルギー化を図る。低く設定するのは誤りである。"],"2022-計画-7":["正しい。割れ窓理論は、割られた窓が放置されると管理者不在とみなされ、犯罪が拡大するという比喩で犯罪発生の仕組みを説明している。","正しい。ジェイコブズは「アメリカ大都市の死と生」で、多数の目が常に街路にある「街路の眼」により、頻繁に使われる街路は安全になると述べた。","正しい。CPTEDは、見通しの確保、コミュニティ形成の促進、接近の妨げ、破壊されにくい部材・設備という手法による犯罪予防策である。","誤り。プルーイット・アイゴーは1950年代に建設された高層の低所得者向け集合住宅群で、荒廃と犯罪が進み、のちに解体された事例である。開放的な低層住宅ではない。"],"2022-計画-8":["誤り。病室の床面積は、患者1人当たり内法6.4m2以上が必要である。4床室では25.6m2以上必要となり、内法15m2の2床室を4床室にするのは不適当である。","正しい。小ホールでは、車椅子使用者席を含め客席配置の自由度を高めるため、平土間形式とすることがある。","正しい。情報端末等の使用で机が大きくなることを考慮し、低学年の普通教室を流し台を含め9m×9mとする計画は妥当である。","正しい。車椅子使用者用客室の出入口は有効幅員80cm以上とし、引戸の取っ手側には接近できる空間を確保する。"],"2022-計画-9":["誤り。総合案内所でハイカウンターとローカウンターを併設する場合、ローカウンターは主に車椅子使用者向けである。視覚障害者誘導用ブロックは、職員が対応する位置を考慮してハイカウンターへ向けて敷設するのが一般的である。","正しい。色の違いだけに頼らない情報伝達とするため、サイン案を白黒コピーして判別性を確認することは有効である。","正しい。店舗の通路は有効幅120cm以上とし、レジ前に150cm角の車椅子転回スペースを設けることは設計標準に沿っている。","正しい。車椅子使用者用便房は男女共用位置に設け、オストメイト用設備や乳幼児用設備を有する便房は男女の便所内に分散配置する。"],"2022-計画-10":["正しい。防災公園は、防災拠点や避難地等の機能を有し、地域防災計画等に位置づけられる都市公園である。","誤り。広域公園は、都市住民全般の利用を目的とし、1か所当たり面積50ha以上を標準とする。10〜40haを標準とするのは総合公園である。","正しい。地区公園は徒歩圏内の居住者を対象とし、誘致距離1kmの範囲内で1か所当たり面積4haを標準とする。","正しい。街区公園は街区の居住者を対象とし、誘致距離250mの範囲内で1か所当たり面積0.25haを標準とする。"],"2022-計画-11":["正しい。道後温泉本館周辺では、道路の付け替えで歩行者空間を確保し、敷石を再利用して歴史的建築物と調和した景観づくりが行われた。","正しい。金山町金山地区では、地場産の木材を活用した住宅の表彰制度や景観条例の制定などによる景観づくりが行われた。","正しい。クリチバは、バス優先の幹線道路と支線道路等を都市計画的に再編し、連結バスと専用停留所による交通システムを構築した。","誤り。ハイラインは、ニューヨークの廃線となった高架貨物鉄道跡を公園として再生した事例である。建築物を減築し病院を図書館へ改築する事例ではない。"],"2022-計画-12":["正しい。日本住宅性能表示基準の高齢者等配慮対策等級(専用部分)は、等級5〜1で評価される(新築)。","正しい。「特定寝室」とは、高齢者等の利用を想定する主たる寝室のことである。","正しい。住宅セーフティネット制度は、空き家・空き室を活用し、住宅確保要配慮者の入居を拒まない賃貸住宅を登録する制度である。","誤り。住宅セーフティネット制度では、規模や構造等の登録基準を満たせば、シェアハウス(共同居住型賃貸住宅)でも登録できる。"],"2022-計画-13":["正しい。増沢邸は3間×3間の9坪の2階建てで、3坪の吹抜けに面した南面大開口の障子から柔らかな光を取り込む住宅である。","正しい。斎藤助教授の家は、テラス・廊下・居間が連続する開放的な平面に移動畳等を置き、場面に応じて空間を設える住宅である。","正しい。ヴィッラ・クゥクゥは、コンクリートの特性を生かした形態と彫りの深い開口をもち、外部に閉じたワンルーム形式の住宅である。","誤り。正面のない家-Hの空間構成や架構についての説明が、実際の作品の特徴と合致しない。坂倉準三建築研究所の作品の特徴を正確に述べた記述ではない。"],"2022-計画-14":["誤り。BEMSは建築物のエネルギー使用を監視・制御して省エネを図る管理システムである。二重ガラス間にブラインドを入れ空調空気を通す説明はダブルスキン等のペリメーターレスに関するものである。","正しい。POEは、建築物の使用開始後ある程度時間が経過してから、使用者の視点で施設を評価する入居後評価である。","正しい。OPACは電子化された蔵書目録で、利用者が目的の書籍の所在等をパソコン上で検索できるシステムである。","正しい。BDSは図書館の出入口等に設置し、資料の無断持ち出しを防ぐ資料管理システムである。"],"2022-計画-15":["正しい。教師コーナーを取り囲むように普通教室を配置すれば、児童の様子を見守りやすくなる。","正しい。聴覚に過敏性をもつ児童には、遮音性の高い小規模な空間を設けて落ち着ける環境を用意することが有効である。","正しい。オープンプランでは教室間の音の伝搬が問題となるため、隣接教室の間に準備室を設けて音を抑制する計画は妥当である。","誤り。普通教科をクラスルームで行い特別教室で実験・実習を行うのは特別教室型の運営である。教科教室型は全教科を専用の教科教室で行い、生徒が移動する方式である。"],"2022-計画-16":["正しい。天井を高くした蓄煙空間とトップライトの開放による自然排煙は、大空間の平家建て施設で有効な排煙計画の考え方である。","正しい。防煙垂れ壁を増やして防煙区画を小さくすれば、煙の拡散が遅れ、避難のための時間を確保しやすくなる。","誤り。病棟階では竪穴区画以外にも、看護単位ごとなどの水平区画（防火・防煙区画）を設け、隣接区画へ水平避難できるようにするのが基本である。","正しい。保育所では幼児の避難に時間を要するため、階段に隣接した付室を待避スペースとして設ける計画は有効である。"],"2022-計画-17":["誤り。国際子ども図書館が再生した旧帝国図書館は明治時代の竣工であり、大正時代とする点が事実と異なる。歴史的建造物の再生・増築の事例である。","正しい。まちとしょテラソは三角形平面で、中央に開架書庫を置き、三辺に沿って緩やかに分けた空間をもつ町立図書館である。","正しい。フランス国立図書館（トルビアック館）は、ロの字型の基壇部と四隅のL字型高層棟からなり、中庭に緑豊かな庭園をもつ。","正しい。デンマーク王立図書館は、旧館に対し道路を挟んだ運河側に黒色ガラス張りの新館（ブラックダイヤモンド）を増築した。"],"2022-計画-18":["正しい。直接人件費は、業務に従事する者の人件費の1日当たりの額に従事延べ日数を乗じた額の合計であり、告示の定義どおりである。","誤り。工事監理では、施工図が設計図書の内容に適合しているかを検討・確認する。施工図を基準として「施工図のとおり」実施されているかを照合するのではない。","正しい。質疑書への回答として、設計図書の品質確保の観点から技術的に検討し、必要に応じ設計者に確認のうえ通知する業務が含まれる。","正しい。工程表が工期や品質確保に支障を及ぼすおそれがあると判断した場合に建築主へ報告する業務は、一体的な標準業務に含まれる。"],"2022-計画-19":["正しい。鉄骨の所要数量では、鋼材等に所定の割増しを行うが、アンカーボルトは設計数量に対する割増しを行わないのが一般的である。","正しい。石材など主仕上げの小さな開口部による欠除は、一定面積以下であれば原則として、ないものとして計測・計算する扱いである。","誤り。防水層の重ね代などの扱いは基準に定めがあり、「計測数量に5％の割増しを標準とする」という記述は基準の内容と合致しない。","正しい。純工事費は、直接工事費と共通仮設費を合わせたものであり、これに現場管理費等を加えて工事価格となる。"],"2022-計画-20":["正しい。設計VEは、ライフサイクルコストを考慮し、設計段階で施設の機能を分析して必要な機能を確実に達成する取り組みである。","誤り。記述は不動産の購入前調査であるデューデリジェンスの説明である。アセットマネジメントは、不動産資産の運用・管理により収益や価値の最大化を図ること。","正しい。コストオン方式は、建築主が専門工事業者を選定して工事費を決め、元請の管理経費を加えて元請会社に発注する方式である。","正しい。SPCは特定事業の実施のみを目的に設立され、PFI事業以外の投資を行わず、契約期間終了後に解散する特別目的会社である。"],"2021-計画-1":["正しい。SDGsは「誰一人取り残さない」社会を目指す17の目標からなり、目標11に「住み続けられるまちづくりを（持続可能な都市）」がある。","正しい。QOL（生活の質）の向上を重視する流れから、医療福祉分野の建築計画でも重要性が増している。","誤り。ZEBは、省エネと創エネにより年間の一次エネルギー消費量の収支をゼロとすることを目指す建築物（net Zero Energy Building）であり、建設リサイクル法の対象建築物ではない。","正しい。修景事業は、伝統的建造物以外の建造物や新築建築物の外観を、歴史的風致と調和するよう整備する事業である。"],"2021-計画-2":["正しい。ミレトスは、ヒッポダモスの計画による格子状の直交道路網をもつ古代ギリシャの計画都市として知られる。","正しい。カンピドリオ広場は、ミケランジェロによる台形の広場と大階段、三つのパラッツォの対称配置で軸線を強調した計画である。","誤り。レッチワースは、ハワードの提唱した田園都市の理念に基づく最初期の田園都市である。「保存的外科手術」はゲデスの概念で、歴史的都市の部分的再生の考え方である。","正しい。チャンディガールは、ル・コルビュジエの理念に基づき、格子状のセクターと7段階（7V）の道路網で計画された都市である。"],"2021-計画-3":["正しい。各層に裳階を付けた三重塔は、屋根が六つ重なって見える独特の外観となる。薬師寺東塔が代表例である。","正しい。貫で軸部を固め、挿肘木で軒を支える構造は大仏様の特徴で、東大寺南大門などが代表例である。","誤り。海老虹梁や詰組は禅宗様の特徴だが、図に示された建築物の様式・構造の説明としては適合しない（図の建築物は別の様式である）。","正しい。長い束柱を貫で固めた足代で崖上に床を張り出す形式は懸造であり、清水寺本堂などが代表例である。"],"2021-計画-4":["正しい。インクルーシブ教育システムでは、障害のある児童と障害のない児童が交流・共同学習できる環境を整える。","正しい。手術室の上階にインタースティシャル・スペースを設ければ、医療行為を中断せず設備の保守・更新ができる。","正しい。二室を一室化し、床の高さをトイレ・浴室と揃えて段差をなくす改修は、車椅子使用者用客室として適切である。","誤り。貴重書庫は温湿度の厳密な管理が必要で、年間を通じた自然換気は不適当である。空調設備により温湿度を一定に保つ必要がある。"],"2021-計画-5":["正しい。光ダクトは反射のたびに光が減衰するため、曲がりを少なく断面積を大きくして反射回数を減らすのが有効である。","誤り。効果的な通風のためには、風上開口を小さく、風下開口を大きくすると、室内の風速が高まる。風上開口を大きくするのは逆である。","正しい。木材は燃焼すると表面が炭化し、内部への燃焼が遅くなるため、断面を大きくする燃えしろ設計で耐火性を高められる。","正しい。心材は辺材より腐朽しにくく、乾燥に伴う収縮や反りも少ないため、構造材に適している。"],"2021-計画-6":["正しい。ホールは距離をコミュニケーションと対応させ、密接距離・個体距離・社会距離・公衆距離の四つに分類した。","誤り。持ち運びができ個人についてまわる空間はパーソナルスペースである。テリトリー（なわばり）は一定の場所に固定された空間であり、記述は両者を混同している。","正しい。メルテンスは、建築物の高さと視点からの水平距離の比（D/H）で、建築物の見え方の変化を尺度化した。","正しい。ニューマンは、住民が自分たちの場所と感じ、障壁や見通しをもつ空間をディフェンシブルスペースと定義した。"],"2021-計画-7":["正しい。孔あき板の背後に空気層を確保すると共鳴吸音により吸音でき、空気層を厚くするほど低音域の吸音性能を高められる。","誤り。大きな凹曲面は音を一点に集めて焦点を生み、かえって音圧の極端に弱い場所（デッドスポット）を生じやすい。凹曲面は避けるべきである。","正しい。多孔質材料のグラスウールをガラスクロスで覆った仕上げは吸音に有効で、廊下から他教室への音の伝播を抑える。","正しい。両面の板を別々の間柱に取り付ける独立間柱構造は、壁の両側の振動が伝わりにくく、遮音性能が向上する。"],"2021-計画-8":["誤り。おむつ交換台は大人が立ったまま無理のない姿勢で使えるよう、床面から70〜80cm程度の高さとするのが一般的である。50cmでは低すぎ、介助者の腰に負担がかかる。","正しい。車椅子使用者用トイレのドアの押しボタンスイッチは、車椅子使用者が手を伸ばして操作しやすい床上100〜110cm程度の高さとするのが適当である。","正しい。カウンターは、一般用を高さ100cm程度、車椅子使用者用を高さ70〜75cm程度とし、膝が入る下部空間を確保すると、双方が使いやすい。","正しい。座位で視界を遮り、立位では見通せるようにするには、パーティションの高さを120cm程度とするのが一般的で、プライバシー確保に有効である。"],"2021-計画-9":["正しい。傾斜路の踊り場の踏幅は、車椅子の転倒防止や休憩・減速のため、1,500mm以上確保する必要がある。1,600mmはこれを満たす。","誤り。傾斜路の勾配は原則1/12以下とされ、高さ750mm以内ごとに踊り場を設ける。水平距離8,000mmでは勾配が急になりやすく、自力で上り下りしにくい。9,000mm程度以上が目安となる。","正しい。人と車椅子使用者がすれ違える傾斜路の有効幅は1,500mm以上が望ましく、1,500mmは適当である。段を併設しない場合の最低は1,200mmである。","正しい。側壁のない傾斜路や踊り場の側端には、白杖による危険の認知や車椅子の脱輪防止のため、高さ50mm以上の立ち上がりを設ける。"],"2021-計画-10":["正しい。指定管理者制度は、公の施設の管理運営を民間事業者等のノウハウを活用して行い、住民サービスの向上を図る制度である。","正しい。街なみ環境整備事業は、住環境の整備改善が必要な区域で、自治体と住民が協力して良好な居住環境の整備を支援する事業である。","正しい。TMO（タウンマネジメント機関）は、中心市街地活性化基本計画等をもとに、商業・業務機能が集積した地区の活性化を推進する組織である。","誤り。サウンディング型市場調査は、事業実施前に民間事業者へ意見や参入意向を直接聞き取り、事業化の可能性や条件を把握する調査である。事業完了後の調査ではない。"],"2021-計画-11":["誤り。都市再生特別地区は、既存の用途地域等の規制を適用除外し、用途・容積率・高さ等を自由度高く定める制度である。記述のような形態意匠や敷地面積の最低限度の制限による景観形成の内容は、この制度の説明として適当でない。","正しい。富山市はレジリエンス戦略を策定し、自然災害や少子高齢化等の変化に対し、速やかに回復し成長できる強靭な都市づくりに取り組んでいる。","正しい。高松市(丸亀町商店街等)では、タウンマネジメントの考え方に基づき第三セクターを設立し、住民・事業者・地権者が主体となったまちづくりを実践している。","正しい。北九州市では、民間自立型の家守事業者の設立やリノベーションスクールの開催により、遊休不動産を活用したリノベーションまちづくりが実践されている。"],"2021-計画-12":["正しい。卯建は、妻壁を屋根面より高く突き出し小屋根を付けた部分で、装飾に加え隣家からの延焼を防ぐ防火の役割がある。","誤り。記述は、平瓦を並べて目地に漆喰を盛り上げたなまこ壁の説明である。築地塀は、土を突き固めて築いた屋根付きの土塀である。","正しい。曲り屋は、岩手県などに見られるL字型平面の民家で、突出部の厩が母屋の土間とつながる形式である。","正しい。輪中は、河川の氾濫する低湿地で周囲に堤防を築き、集落と耕地を水害から守る集落形態である。"],"2021-計画-13":["正しい。防災集団移転促進事業は、災害が発生した地域や災害危険区域のうち居住に適当でない区域内の住居の集団的移転を促進する事業である。","正しい。応急借上げ住宅は、自治体が民間賃貸住宅を借り上げて仮設住宅として供与するもので、東日本大震災以降は「みなし仮設住宅」とも呼ばれる。","正しい。陸前高田のみんなの家は、津波で立ち枯れたスギの丸太を用いてつくられた、被災者の集いの場となる集会場である。","誤り。グループハウス尼崎は、阪神・淡路大震災後に建設された、高齢者を対象とする災害公営住宅で、サポート拠点を併設する。高齢者向けと一般向け住戸で構成されるとする点が適当でない。"],"2021-計画-14":["誤り。TIME'S I・II(京都)は、高瀬川沿いの水辺に面して計画された商業施設で、水辺空間と一体となった外部空間が特徴である。屋根全体を大階段の展望広場とする記述は適当でない。","正しい。アオーレ長岡は、駅前に建つ市民協働・交流の拠点で、屋根付き広場(ナカドマ)を中心にアリーナ、市役所、議会等を配した複合施設である。","正しい。太田市美術館・図書館は、屋内外を巡るスロープや階段、テラス、緑化屋上を備え、駅前から賑わいが見え、街も眺められるよう計画された。","正しい。代官山ヒルサイドテラスは、広場や路地等を主要素として外部空間を形成し、周囲の街並みや緑とつながるよう段階的に計画された建築群である。"],"2021-計画-15":["正しい。福岡市立博多小学校は、オープンプラン型を採用し、壁のない教員コーナーやワーキングスペースで、複数の教員が児童を見守れる空間とした。","正しい。立命館大学大阪いばらきキャンパスは、工場跡地に官民が連携し、防災公園と一体化して整備されたキャンパスである。","正しい。石巻市庁舎は、百貨店を転用したもので、既存エスカレーターを活用し、売り場を執務スペース、映画館を議場に改修した。","誤り。大田区役所本庁舎は、記述のような1960年代の民間事務所ビルを転用して、デザインを継承しつつ改修したものとする説明が事実と整合せず、適当でない。"],"2021-計画-16":["正しい。認知症高齢者グループホームの1ユニットの定員は5〜9人であり、8人は基準の範囲内である。","正しい。小規模多機能型居宅介護の宿泊室は個室で、1室当たり7.43m²程度以上が目安となり、10m²は妥当である。","誤り。ユニットケアでは、各ユニットが独立した共同生活室をもつことが原則である。隣接ユニットの共同生活室を共用して一体的に使うと、ユニットの単位が成り立たない。","正しい。個室にトイレがない場合、排泄のリズムが重なるため動線を短くし、個室3室に対して1か所以上のトイレを設けるのは適切である。"],"2021-計画-17":["誤り。倉敷アイビースクエアは、明治期の紡績工場を、ホテルを中心とする宿泊・文化・交流施設に再生したものである。商業施設への改修で、ガラス屋根のアトリウムを開放したとする記述は適当でない。","正しい。金沢市民芸術村は、大正から昭和初期の紡績工場の倉庫を改修し、工房やオープンスペース等を備えた芸術文化施設に再生したものである。","正しい。千葉市美術館は、昭和初期に銀行として建設された既存建築物を、新築の建築物で覆う「鞘堂」方式で保存・整備したものである。","正しい。ロームシアター京都は、昭和30年代の京都会館を保存し、意匠要素を再現しつつ増築と一部建て替えを行い、機能を拡充したものである。"],"2021-計画-18":["正しい。業務経費は、直接人件費、特別経費、直接経費、間接経費の合計額で、消費税相当額は含まれない。","誤り。設計等の業務で発揮される技術力・創造力等の対価は技術料等経費である。特別経費は、標準業務に含まれない特別な費用（出張旅費など）である。","正しい。設計者は、工事施工段階での工事材料、設備機器等の選定について、設計意図の観点から検討し、建築主に必要な助言を行う。","正しい。工事監理者は、施工図、製作見本、見本施工等が設計図書の内容に適合しているかを検討し、建築主に報告する。"],"2021-計画-19":["正しい。計画数量は、設計図書に基づく施工計画により求める数量で、仮設や土工などがこれに該当する。","正しい。主仕上の数量では、器具類による欠除が1か所当たり0.5m²以下であれば、原則として、ないものとして計測・計算する。","誤り。鉄骨の数量では、ダクト孔など1か所当たり0.5m²以下ではなく、小さい面積（0.1m²以下）の欠除が、ないものとして扱われる。0.5m²は大きすぎる。","正しい。仕上改修で設計図書に余幅の図示がない場合は、適切な余幅を加えて計測・計算できる。"],"2021-計画-20":["誤り。コンセッション方式は、施設の所有権を公共側に残したまま、運営権のみを民間事業者に設定する方式である。所有権を民間に移行するわけではない。","正しい。デザインレビューは、各部門の専門家が設計段階で性能・機能・信頼性などを審査し、改善を図る活動である。","正しい。フロントローディングは、設計段階で施工・維持管理を見据えた技術検討を行い、問題の早期発見や効率化を図る考え方である。","正しい。CRE戦略は、企業の保有不動産を経営戦略の視点で見直し、不動産投資の効率性を最大化しようとする考え方である。"],"2020-計画-1":["正しい。建築士は設計に際し、長期使用に耐える計画を初期段階から検討し、完成後も適正な維持管理が行われるよう配慮することが職責として求められる。","誤り。他人の求めに応じ報酬を得て建築物の調査・鑑定を業として行う場合も、建築士法上は建築士事務所の登録が必要である。所属せずに行える記述は誤り。","正しい。建築士は、違反建築物の建築など法令違反行為について、指示や相談に応じることなどをしてはならない。","正しい。建築士が施工者の立場であっても、建築基準関係規定に違反する行為をすれば、建築士法上の懲戒処分（業務停止等）の対象となり得る。"],"2020-計画-2":["正しい。寝殿造は、柱を丸柱とし、寝殿の周囲に蔀戸を吊り、床を板敷きとした平安時代の貴族住宅の形式である。","正しい。鹿苑寺金閣は三層構成で、最上層は禅宗様仏堂風、中間層は和様仏堂風、初層は住宅（寝殿造）風の異なる様式を重ねた建築物である。","誤り。光浄院客殿は安土桃山時代の書院造の代表例であり、数寄屋風の建築物とするのは誤り。数寄屋風は茶室の意匠を取り入れた江戸初期以降の様式である。","正しい。旧開智学校校舎は、アーチや隅石など洋風意匠と唐破風など和風意匠が混在する、明治期の擬洋風建築である。"],"2020-計画-3":["正しい。大英博物館は、古代ギリシア・ローマ建築の研究に基づき造形原理の復興を目指した新古典主義の代表的建築物である。","正しい。タッセル邸（オルタ設計）は、植物の茎や葉など自然物に着想を得た非対称な曲線を用いたアール・ヌーヴォーの代表例である。","誤り。ウィーン郵便貯金局（O.ワーグナー設計）の背景は、ウィーン分離派（近代建築への過渡期の合理的表現）であり、アーツ・アンド・クラフツ運動ではない。","正しい。シュレーダー邸（リートフェルト設計）は、水平・垂直の線や面で構成し三原色と無彩色を用いたデ・スティルの代表作である。"],"2020-計画-4":["正しい。障害者等が利用する居室の出入口の有効幅員は、80cm以上とされており、90cmは基準を満たしている。","正しい。オストメイト用設備を有する便房では、汚物流しの近くに着替え台を設けることは利便性の面で有効な配慮である。","正しい。車椅子使用者用観覧席は、2箇所以上に分散して設けることが望ましく、複数人が利用できる専用スペースとして計画する。","誤り。段を識別しやすくするため、踏面と段鼻の明度・輝度比は2.0以上とすることが望ましい。輝度比1.0では差がなく、段差を知覚しにくい。"],"2020-計画-5":["正しい。排気口や給気口は外壁に向かって下がり勾配のダクトとし、浸入した雨水を外部へ排出できるようにするのは有効な防水対策である。","誤り。内外の空気圧を等圧にして雨水を重力で排水するのはオープンジョイント方式である。フィルドジョイントはシーリング材等を充填して止水する方式で、記述は誤り。","正しい。層間変位に対し、上部又は下部のファスナーをスライドさせて追従させるパネル方式（スライド方式）のメタルカーテンウォールがある。","正しい。シーリング材は外壁より耐久年数が短いことが多いため、雨水が浸入しても排水できる機構を設けておくことは有効である。"],"2020-計画-6":["正しい。外周バルコニーは、仮設修復足場としての利用やガラス落下の防止などに役立ち、防災拠点庁舎の計画として有効である。","正しい。浸水が想定される低層部の外壁を破壊・脱落させて水を通過させ、上階の重要な拠点機能を守る計画は、津波対策の一手法である。","正しい。高層集合住宅の備蓄倉庫は、避難階のほか、一定住戸数ごとかつ4層以内に設ける計画が一般的な考え方として示されている。","誤り。避難場所の仮設トイレは、マンホールトイレだけでなく簡易トイレ・携帯トイレ等を併用して計画する。基数の目安もおおむね100人当たり1基程度で、200人は不足し、全てとする点も不適当。"],"2020-計画-7":["誤り。事務所ビルでは、日射の影響を受けやすい東西面にコアを配置して熱負荷を軽減するのが一般的である。南北面にコアを置くと、窓の多い東西面の負荷が大きくなり不適当。","正しい。避難経路は、廊下（第1次安全区画）から特別避難階段の付室（第2次安全区画）を経て階段へ至る計画とするのが適切である。","正しい。高層ビルでは、数層ごとにゾーンを分割してエレベーター群を割り当てるコンベンショナルゾーニング方式が用いられる。","正しい。非常用エレベーターは、荷物用エレベーターと兼用でき、乗降ロビーも特別避難階段の付室と兼用することが認められている。"],"2020-計画-8":["正しい。成人用バスケットボールコートは約28m×15mで、これを2面配置するのに床面の内法寸法40m×50m程度は妥当な寸法である。","正しい。公式試合用の硬式テニスコートでは、ネット上部の天井高は12.5m以上が望ましいとされ、13mは適切である。","正しい。観客席の固定座席は、座席幅（間口）45cm程度、前後間隔（椅子の背の間隔）85cm程度が一般的な寸法として適切である。","誤り。駐車場法施行令では、料金徴収施設が設けられている場所の車路幅員は、歩行者の通行の用に供しない部分で2.75m以上とされる。2.5mでは不足で不適当。"],"2020-計画-9":["誤り。階段上端での手すりの水平延長部分は、設計標準では45cm程度以上とすることが望ましい。30cmでは不足しており、不適当。","正しい。手すりを2本設ける場合、下段の手すりは段鼻から60〜65cm程度の高さとするなど、子どもや車椅子使用者にも配慮して設置する。","正しい。階段の手前には、視覚障害者に段の存在を知らせるため、30cm程度手前に点状ブロックを敷設するのが一般的である。","正しい。階段の有効幅員は、手すりの突出が10cm以内であればないものとみなして算定できるので、140cmとする記述は妥当である。"],"2020-計画-10":["誤り。路面電車やバスのみを通行させる歩行者空間はトランジットモールである。セミモールは、歩行者空間を確保しつつ、車道を蛇行させるなどして自動車の通行を一部認めるものである。","正しい。キスアンドライドは、出発地から駅やバス停まで家族等が自動車で送迎し、公共交通に乗り換える交通形態である。","正しい。BRTは、専用道路等で定時性を確保し、連節バスや停車時間短縮の工夫で輸送力を高めるバス交通システムである。","正しい。フリンジパーキングは都心周辺部に駐車場を整備し、公共交通で都心に入る方式で、都心への自動車流入の抑制を目的とする。"],"2020-計画-11":["正しい。黒石市中町の「こみせ」は、軒下の木造歩廊が続く町並みで、伝統的建造物群保存地区に指定されている。","正しい。掛川市は生涯学習都市宣言を行い、官民協力で地区計画を定めるなど、城下町の歴史を活かしたまちづくりを進めている。","正しい。倉敷市の倉敷川畔は、本瓦葺塗屋造りの町屋や白漆喰・なまこ壁の土蔵が並び、美観地区として景観保全が図られている。","誤り。知覧は武家屋敷群と庭園の町並みで知られる。「パタン・ランゲージ」に範をとったまちづくり規範（美の基準）は神奈川県真鶴町の例で、知覧とするのは誤り。"],"2020-計画-12":["正しい。同潤会江戸川アパートは、社交室、共同浴場、食堂、洗濯場などの付帯施設を備えた集合住宅として計画された。","正しい。コモンシティ星田は、緩斜面を活かした緑道や塀・門を極力設けない外構により、連続した開放的な外部空間をつくった戸建て団地である。","誤り。幕張ベイタウンのパティオス4番街は、中庭を囲む中層の街区型集合住宅として知られ、高層板状住棟による計画ではない。記述はその特徴と合致しない。","正しい。釜石・平田地区の仮設住宅団地は、診療所付きサポートセンターや仮設店舗を備えたコミュニティケア型の団地として計画された。"],"2020-計画-13":["正しい。階段室型住棟の北側に廊下棟を増築し、エレベーターを設置して各住戸の玄関を新設するのは、バリアフリー改修の典型的手法である。","正しい。サービス付き高齢者向け住宅の住戸専用部分の床面積は、原則25m²以上とされている。","正しい。形状又は効用の著しい変更を伴わない共用部分の変更（大規模修繕等）は、区分所有者及び議決権の各過半数による普通決議で行える。","誤り。ラドバーン方式は、歩行者と車を分離する計画手法（クルドサック等）であり、歩車共存を目的とするものではない。車の通行部分を蛇行させ速度を落とす手法はボンエルフである。"],"2020-計画-14":["正しい。ジョンソン・ワックス・ビル（F.L.ライト設計）は、樹木状の柱とトップライト等により、2層吹抜けの執務空間に自然を再現している。","正しい。フォード財団本部ビルは、植栽豊かなアトリウムをL字型に囲んで執務スペースを配置した事務所ビルである。","誤り。丸の内ビルディングの高層階オフィスゾーンは、中央にアトリウムを設けて廊下を面させる構成ではなく、記述は実際の特徴と合致しない。","正しい。ROKI Global Innovation Centerは、階段状に積層するワンルーム空間に、木と鉄のハイブリッドトラス屋根と天幕を架けた事務所である。"],"2020-計画-15":["正しい。金沢市立玉川図書館は、開架部門と学習・管理部門を中庭を挟んで分け、開架部門を気軽に利用できる空間とした図書館である。","誤り。朝霞市立図書館本館に関するこの記述は、実際の計画内容と合致しない。貸出重視型の図書館として説明する点などが事実と異なり不適当。","正しい。苅田町立図書館は、多様な閲覧席や和室、屋外読書スペースを備え、来館者が長時間滞在できるよう計画された図書館である。","正しい。ぎふメディアコスモスは、木造格子屋根の下に市立中央図書館、市民活動交流センター等を収めた複合施設である。"],"2020-計画-16":["正しい。病棟の患者用トイレは、分散配置して病室との距離を短くするなど、患者の負担軽減に配慮することが必要である。","誤り。LDRは、陣痛・分娩・回復を同一の部屋で行える方式である。過程ごとに専用の部屋を設ける方式とする記述は誤り。","正しい。4床病室でベッド間に幅1m以上を確保するには、病室面積32m²程度以上が計画上の目安となる。","正しい。回復期リハビリテーションは、疾患に応じた一定期間をかけ、身体機能や日常生活動作（ADL）の改善を図るものである。"],"2020-計画-17":["正しい。幼保連携型などの認定こども園では、遊戯室、調理室、管理諸室、屋外環境等を幼稚園と保育所で共用する空間として計画できる。","誤り。総合病院の小児病床は、疾病別・診療科別に分散させず、小児病棟としてまとめ、小児に配慮した環境や付き添い等に対応できる計画とするのが適当である。","正しい。放課後等デイサービス事業所では、屋外遊びを豊かにするため、学校と連携して校庭等を有効に活用することが有効である。","正しい。義務教育学校では、9年間の系統的・連続的な教育や一貫した支援を効果的に行えるよう、特別支援学級関係室の配置や室構成を計画する。"],"2020-計画-18":["誤り。管理建築士になるには、建築士として3年以上設計・工事監理等の業務に従事した後、登録講習を修了する必要がある。「一級建築士の免許取得後」に限らず、二級建築士としての従事期間も含まれる。","正しい。重要事項説明は、管理建築士のほか、当該事務所に属する他の一級建築士(建築士)が行うこともできる。","正しい。監理技術者は、施工計画の作成、工程管理、品質管理等の技術上の管理と、施工従事者の技術上の指導監督を誠実に行う必要がある。","正しい。施工管理技士は、建設工事に従事する者を対象とした技術検定に合格した者で、施工技術の向上を図る国家資格である。"],"2020-計画-19":["正しい。建築数量積算基準では、芝類の範囲にある排水桝等の小面積の箇所は、一定の面積以下であれば欠除はないものとして計測・計算する。","正しい。型枠の数量で開口部の内法の見付面積が1箇所当たり0.5m2以下の場合は、原則として型枠の欠除はないものとする。","誤り。鉄筋の所要数量は、設計数量に対する割増しを標準3%とする。5%ではない。","正しい。耐火被覆は、材種、材質、形状、寸法、工法、耐火時間及び部位(柱、梁)ごとに区分して計測・計算する。"],"2020-計画-20":["正しい。コンカレントエンジニアリングは、設計から施工までの関係者が集まり、工程を重ね合わせて検討を進める方式である。","正しい。VFM（Value For Money）は、支払いに対して最も価値の高いサービスを供給するというPFIの重要な概念である。","正しい。BTO方式は、民間事業者が施設を建設し、完成直後に公共へ所有権を移転した上で、維持管理・運営を民間が行う方式である。","誤り。具体的な設計案を審査して最も優れた案を選ぶのは設計競技（コンペ）方式である。プロポーザル方式は、設計者の能力や考え方、提案内容を評価して設計者を選ぶ方式である。"],"2019-計画-1":["誤り。複数の人が異なる方向を向き他人同士でいようとする配置はソシオフーガルである。ソシオペタルは、互いに向き合って交流しやすい配置を指す。","正しい。ユニバーサルデザインは、障がいの有無や年齢、体型等に関係なく、可能な限り誰もが利用できるデザインである。","正しい。パッシブデザインは、建築物の配置・形状・開口等の工夫により、熱・空気・光の流れを制御して冷暖房や照明効果を得る手法である。","正しい。スマートシティは、ICT等を活用して都市の諸課題に対し、計画から運営まで全体最適化を図る持続可能な都市や地区をいう。"],"2019-計画-2":["正しい。伊勢神宮内宮正殿は、掘立て柱と2本の棟持柱をもつ神明造りの例である。","正しい。出雲大社本殿は、桁行2間・梁間2間の平面で、正面の片方の柱間を入口とした左右非対称の大社造りである。","正しい。賀茂別雷神社本殿は、切妻造り平入りで、前面の屋根を延ばして向拝を設けた流造りの例である。","誤り。春日大社本殿は春日造りの例である。本殿と拝殿を石の間でつなぐ権現造りの代表例は日光東照宮である。"],"2019-計画-3":["誤り。サン・ピエトロ大聖堂はルネサンス・バロック期の建築で、ゴシック建築ではない。周歩廊と放射状祭室をもつ平面はロマネスク・ゴシック建築の特徴である。","正しい。アーヘンの宮廷礼拝堂は、八角形の身廊を十六角形の周歩廊が囲む集中式の建築物で、身廊上部はドーム状ヴォールトである。","正しい。サン・カルロ・アッレ・クァットロ・フォンターネ聖堂は、楕円ドームと凹凸の湾曲したファサードをもつバロック建築である。","正しい。コルドバの大モスクは紅白縞のアーチが林立する内部空間をもち、現在はキリスト教とイスラム教の文化が混在している。"],"2019-計画-4":["正しい。特定天井の仕様ルートの一つに、天井面と周囲の壁等との間にクリアランスを設けない「隙間なし天井」がある。","正しい。Low-E複層ガラスは、中空層側のガラス面に特殊金属膜をコーティングしたもので、断熱性を高め冷暖房効率の向上に有効である。","正しい。層間変位の大きな建築物の連窓では、ガラスが回転・移動しても力が加わらないよう、枠とガラスの間にクリアランスを設ける。","誤り。オープンジョイントでは、外部の圧力変動に追従して等圧を保つため、等圧空間の容量は空気取入口に比べて小さくする必要がある。大きくする記述は誤り。"],"2019-計画-5":["正しい。動線は、公道からセキュリティレベルの低い空間から高い空間へ段階的に連続させるのが、防犯計画上望ましい。","正しい。小学校では、不審者の侵入防止のため、職員室を運動場や出入口を見渡せる位置に配置することが望ましい。","誤り。ラドバーン方式は歩行者と車を分離する住宅地計画手法であり、心理的効果による犯罪抑止を狙った手法ではない。防犯上の工夫は、見通しの確保や領域性の明確化などによる。","正しい。ゲーテッド・コミュニティは、住宅地をフェンスや壁で囲みゲートを設けて、住民以外の出入りを制限した居住地区である。"],"2019-計画-6":["正しい。越屋根は棟の一部に設ける小屋根またはその開口部を含む部分で、開口部から自然換気や採光が期待できる。","正しい。コンクリート躯体を蓄熱体とするには、外断熱とし、日射を直接躯体に当て、躯体を室内に露出させることが有効である。","誤り。夜間の外気導入で躯体を冷却し冷房負荷を低減する方法は「ナイトパージ」である。クールスポットは緑地や水面等で周囲より涼しくなる場所を指す。","正しい。アースチューブは地中の安定した温度を利用して夏は冷熱源、冬は温熱源とする方式で、外気温の年較差・日較差が大きい地域ほど効果が大きい。"],"2019-計画-7":["正しい。駐車場の柱間は駐車台数の効率から、駐車スペースの幅の整数倍に合わせて計画する。8.5m角程度の柱割りは大規模店舗で一般的である。","誤り。エレベーターの一群は多くても8台程度までとし、対面配置の場合の距離も3.5〜4.5m程度が一般的である。5台と5台の10台を対面配置するのは過大である。","正しい。複式書架の中央支柱の心々距離は一般に180cm程度だが、車椅子使用者同士がすれ違うには250cm程度が望ましい。","正しい。直角駐車は車路幅を要するが、1台当たりの所要面積は平行駐車や斜め駐車に比べて小さく、収容効率が高い。"],"2019-計画-8":["正しい。安全上の措置を講じれば、既存校舎を義務教育学校に変更する際に階段の蹴上げ寸法の変更を要しないとされる。","誤り。各教科で専用教室をもち生徒が移動して授業を受ける方式は「教科教室型」である。総合教室型は学級ごとに主な教室を一つ用意し、そこで大半の授業を行う方式である。","正しい。普通教室は多様な学習形態に対応するため、40人学級で9m×8m（72㎡）程度の広さが確保される例が一般的である。","正しい。特別な支援を要する児童が落ち着きを取り戻せるクールダウン用の小空間を、普通教室に隣接して設けることは有効である。"],"2019-計画-9":["正しい。車椅子使用者用便房では、便器洗浄ボタンをペーパーホルダーの直上に設置する等、操作しやすく分かりやすい配置とする。","正しい。乳幼児連れ利用者への設備は、多機能便房への利用集中を避けるため、男女の便所内にもそれぞれ設けることが望ましい。","誤り。エレベーター籠内の階数ボタン等の点字表示は、ボタンが縦配列の場合は各ボタンの左側に設けるのが標準である。右側ではない。","正しい。階段室内に一時待避スペースを設け、救助を待つ間に状況を伝えられるようインターホンを設置することは適切である。"],"2019-計画-10":["正しい。インナーシティ問題は、都心周辺の既成市街地で人口減少、産業衰退、地域の荒廃等が生じる問題を指す。","正しい。ブラウンフィールドは、土壌汚染の存在やその懸念により、本来の価値より著しく低い利用または未利用となった土地をいう。","正しい。二地域居住は、都市住民が農山漁村等にも同時に生活拠点をもつライフスタイルをいう。","誤り。記述はショップモビリティの説明である。パークアンドライドは、郊外の駐車場に車を停めて公共交通機関に乗り換え、都心部への自動車流入を抑制する仕組みである。"],"2019-計画-11":["正しい。ニューヨークのハイラインは、廃線となった高架貨物線跡を再利用して緑豊かな空中公園に再生したものである。","誤り。ドックランズ再開発は、ロンドンの旧港湾地区（ドック跡）を、業務・商業・住宅等の複合地区として再生した計画である。街区撤去による遊歩道広場の計画ではない。","正しい。ポツダム広場は、戦争と東西分断で長年空地だった敷地に、業務・商業・文化等の複合機能を導入して再開発された。","正しい。門司港レトロ地区は、歴史的建造物群と関門海峡の景観を活かして街並みが形成された地区である。"],"2019-計画-12":["正しい。ネクサスワールドのレム棟・コールハース棟は、各住戸に採光・通風を確保するためのプライベートな中庭を設けた計画である。","正しい。基町高層アパートは、偶数階に通路をもつ住棟を「く」の字型に連結した計画で、通路階以外はスキップ形式の住戸となっている。","誤り。千里ニュータウンは近隣住区論に基づき、近隣センターを核とした近隣住区を単位として計画された。単位にとらわれない計画ではない。","正しい。港北ニュータウンは、公園、保存緑地、緑道、歩行者専用道路を結ぶグリーンマトリックスシステムを備えた計画である。"],"2019-計画-13":["正しい。四間取は、土間を除く床上部分を田の字型に4室で構成する伝統的な農家の平面形式である。","誤り。公営住宅標準設計51C型は、食事室と就寝室を分離する食寝分離を実現した計画で、食事室と台所は一体のDKである。両者を分離した計画ではない。","正しい。テラスハウスは、専用庭をもつ住戸を境界壁を介して連続させた接地型の低層集合住宅である。","正しい。コーポラティブハウスは、入居希望者が組合を結成し、事業計画、設計、工事発注等を共同で行って住宅を取得し管理する方式である。"],"2019-計画-14":["正しい。能楽堂は、本舞台、後座、地謡座、橋掛りからなる舞台を、3方向から客席が囲む構成が一般的である。","誤り。グローブ座は舞台が客席に張り出し観客が舞台を取り囲むオープンステージ形式で、一体感を得やすい。プロセニアム形式は額縁で舞台と客席を隔てる形式である。","正しい。ウィング式大型トラックの停車スペースは、荷台を開く必要があるため床から天井までの高さを5m以上とすることが望ましい。","正しい。車椅子使用者用客席は、選択の自由を確保するため、2箇所以上の異なる位置に分散して設けることが望ましい。"],"2019-計画-15":["正しい。住田町役場は、凸レンズ状に組んだトラス梁が並ぶ屋根架構をもつ木造建築物である。","正しい。群馬県農業技術センターは、小断面の製材を格子状に組み合わせた屋根架構をもつ建築物である。","誤り。海の博物館展示棟は、柱・梁に鋼材を内蔵した集成材を使う建築物ではなく、無垢材や集成材による木造の架構で構成される。ガラスカーテンウォールを用いた外壁でもない。","正しい。出雲ドームは、集成材とケーブル等による立体張弦アーチと膜屋根を組み合わせた架構をもつ。"],"2019-計画-16":["正しい。医療法上、病院は医業または歯科医業を行う場所で、20人以上の患者を入院させる施設を有するものをいう。","正しい。療養病床の1病室当たりの病床数は4床以下とされている。","誤り。1看護単位当たりの病床数は、40〜50床程度が標準とされる。80床は過大である。","正しい。療養病床の患者用廊下の幅は、片側に病室がある場合は内法1.8m以上、両側にある場合は2.7m以上とされる。"],"2019-計画-17":["正しい。ニューヨーク近代美術館（谷口吉生）は、敷地の北側と南側に通り抜けできるエントランスホールがあり、中庭と連続する空間となっている。","正しい。ロサンゼルス現代美術館（磯崎新）は、赤砂岩の外壁の基壇部と、その上に配置されたピラミッド型トップライト等が特徴である。","正しい。フォートワース現代美術館（安藤忠雄）は、平行に並ぶ長方形の室で展示室を構成し、深い庇を掛けている。","誤り。アスペン美術館（坂茂）は、中央に螺旋状スロープのアトリウムを持つ計画ではない。この記述は、らせん状のスロープで連続する空間をもつグッゲンハイム美術館のような計画を想起させるものである。"],"2019-計画-18":["正しい。四会連合協定の約款では、委託者は必要があるときは書面で通知して、設計業務の全部または一部の中止を請求できる。","正しい。受託者は、委託者の承諾なく、成果物や業務で得た記録等を他人に閲覧、複写、譲渡させてはならない。","誤り。重要事項説明は建築士事務所の開設者が建築士に行わせるもので、管理建築士に限らず、他の建築士が行ってもよい。","正しい。工事監理業務には善管注意義務が求められ、これを怠って損害が生じれば、契約書に明記がなくても過失責任を問われうる。"],"2019-計画-19":["誤り。開口部によるコンクリートの欠除は、1箇所当たりの開口部の内法「面積」が0.5㎡以下の場合は考慮しない。体積0.5m³以下という基準ではない。","正しい。コンクリート上面が傾斜し、勾配が3/10を超える場合は、上面型枠またはコンクリート上面の処理を計測・計算の対象とする。","正しい。鉄骨の溶接数量は、溶接の種類ごとに断面形状別の長さを求め、すみ肉溶接脚長6mmに換算した延べ長さとする。","正しい。全面がガラスの建具では、かまち等の見付幅が0.1mを超えるものがあれば、その面積を差し引いた面積をガラス数量とする。"],"2019-計画-20":["正しい。ECI方式は設計段階で施工者が技術協力し、数量・仕様を確定してから工事契約する方式で、設計変更リスクの低減等が期待できる。","正しい。コミッショニングは、オーナー等が求める環境・エネルギー性能等の要求性能を把握し、その実現を検証するプロセスである。","正しい。BCPは事業継続計画で、災害や事故でも重要業務を中断させず、中断しても短期間で再開するための計画である。","誤り。記述は官民連携手法であるPPP/PFIの説明である。CRE戦略は、企業が保有する不動産を経営資源として戦略的に活用・管理する考え方である。"],"2018-計画-1":["誤り。Bは「公共の福祉の増進」ではなく「建築士の信用又は品位」、Cは「建築」ではなく「行為」、Dは「専門的応用能力」ではなく「知識及び技能」が正しい。","誤り。Aは「建築物の質の向上」が正しい。法第2条の2の目的は国民の生命等の保護ではなく建築物の質の向上への寄与である。Cは「行為」、Dは「知識及び技能」が正しい。","正しい。法第2条の2は「建築物の質の向上」、第21条の4は「建築士の信用又は品位を害するような行為」、第22条は「知識及び技能」の維持向上を定めている。","誤り。Bは「公共の福祉の増進」ではなく「建築士の信用又は品位」が正しい。Dも「専門的応用能力」ではなく「知識及び技能」が正しい。"],"2018-計画-2":["誤り。舟肘木は柱上に肘木を一段のせて桁を受ける簡素な組物で、壁から二段に出るものではない。斗と肘木を組み合わせたものが組物である。","正しい。瓦葺きは仏教伝来とともに伝わり、江戸時代に現在一般的な桟瓦葺きが考案された。","正しい。垂木は、唐様（禅宗様）では放射状の扇垂木、和様では平行垂木が一般的である。","正しい。桔木は梃子の原理で、長く突き出た軒先を支えるため軒裏から小屋組内に取り付ける材である。"],"2018-計画-3":["正しい。ユニテ・ダビタシオンは、ル・コルビュジエ設計のピロティをもつ高層集合住宅で、住戸のほか店舗、ホテル、屋上庭園等を備える。","正しい。ヴァイセンホーフ・ジードルングは、ミースが全体計画を行った実験住宅展の住宅団地で、インターナショナル・スタイルの成立に影響した。","正しい。ムードンの住宅は、ジャン・プルーヴェ設計の、アルミニウム等を用いた工業化住宅である。","誤り。フランクリン街のアパートは、ルイス・サリヴァンではなくオーギュスト・ペレの設計で、構造を鉄筋コンクリート造とした初期の集合住宅である。"],"2018-計画-4":["正しい。野球場は、日射の影響を抑えるため、本塁から投手板を経て二塁に向かう線を東北東とするのが望ましいとされる。","誤り。サッカー競技場は、冬期の風や日射の影響を考慮し、フィールドの長軸を南北方向に計画するのが望ましい。東西方向では日の出・日没時に選手が眩しくなる。","正しい。陸上競技場の観客席の勾配は、可視線に配慮しつつ、一体感や臨場感を得られるよう計画することが望ましい。","正しい。屋内アリーナは、規模や競技レベルに応じ、自然採光・自然通風に配慮しつつ、空調設備・照明設備を設けることが望ましい。"],"2018-計画-5":["正しい。センターコアは面積効率がよく大規模な床面積に適するが、コアが中央にあるため二方向避難の計画が難しい。","正しい。両端コアは二方向避難を計画しやすいが、フロアを分割する場合は廊下が必要となり、面積効率が低下する。","誤り。片コアは小規模な事務所ビルに適し、高層建築物には不向きである。また、二方向避難は片側にコアが寄るため確保しにくい点が特徴である。","正しい。外コアは整形な執務空間が得られるが、執務空間とコアの接続部にエキスパンションジョイント等の検討が必要となる。"],"2018-計画-6":["正しい。C.S.R（滑り抵抗係数）は、埃や水等の介在物があると値が変化する。","正しい。階段の滑りは段鼻の影響も大きく、滑りにくい段鼻材を採用することが望ましい。","誤り。同一の床で滑り抵抗係数に大きな差がある材料を複合使用すると、つまずきの原因となる。係数の差が小さい材料を用いることが望ましい。","正しい。金属製の視覚障害者誘導用ブロックは雨で滑りやすいため、ノンスリップ加工のあるものを採用する等の配慮が望ましい。"],"2018-計画-7":["誤り。排気量250ccクラスのオートバイの駐車区画は、幅1.0m程度、長さ2.3m程度が一般的である。幅60cmは狭すぎる。","正しい。車椅子使用者用カウンターは、天板高さを70cm程度とし、下部にフットレストが入る空間を確保する。","正しい。ストール型小便器の中心間距離は、一般に75〜90cm程度で、多人数が利用する場合90cmは妥当である。","正しい。10席程度の会議室は、内法3.6m×7.2m程度（約26㎡）が一般的な規模である。"],"2018-計画-8":["正しい。黄金比は安定感のある比率として造形美に古くから用いられ、人体各部の比率もこれに近似するといわれる。","誤り。ゲシュタルト心理学では、形として認識される部分を「図」、その背景となる部分を「地」という。記述は逆である。","正しい。線遠近法による立体感の効果を応用することで、建築物の奥行感を強めたり弱めたりできる。","正しい。立面が大きなスケールになると、水平線が中央で垂れて見えたり、垂直線が傾いて見えたりする錯視が生じる。"],"2018-計画-9":["誤り。設計標準では車椅子使用者用客室数を客室総数に応じて定め、200室を超える場合は総数の1/100に2室を加えた数以上とされる。250室で3室では不足である。","正しい。客室の出入口の前後には、車椅子が回転できる140cm角以上の水平なスペースを設ける。","正しい。浴室出入口の有効幅員は80cm以上とされ、85cmは適合する。","正しい。ベッドの高さは車椅子の座面と同程度とし、ベッドサイドキャビネットはマットレス上面より10cm程度高くする。"],"2018-計画-10":["誤り。黒漆喰仕上げの建築物を核とする「黒壁スクエア」は滋賀県長浜市の事例である。小布施町は栗や北斎で知られ、修景事業による街並み整備で知られる。","正しい。富山市は、LRTの導入等により公共交通を活性化し、沿線居住の促進と中心市街地の活性化を図るコンパクトシティを目指している。","正しい。横浜市は「クリエイティブシティ・ヨコハマ」を掲げ、歴史的建造物や鉄道高架下等を活用した文化芸術の拠点づくりを行っている。","正しい。環状第二号線新橋・虎ノ門地区は、立体道路制度を活用し、道路上空・路面下で建築物等を一体的に整備した事例である。"],"2018-計画-11":["誤り。記述の内容は人口集中地区(DID)の定義であり、CBDではない。CBDは都市の中心業務地区で、官公庁や企業の本社、商業・業務機能が集積する地区をいう。","正しい。TODは公共交通機関を軸に、駅周辺に住宅・商業・業務等を集約して、自動車への過度な依存を避ける持続可能な都市開発手法である。","正しい。GISは位置情報をもつ空間データを統合的に管理・加工し、地図上に可視化して分析や意思決定に活用できるようにする技術である。","正しい。BIDは地区内の不動産所有者や事業者から負担金を徴収し、その財源で公共空間の維持管理、防犯、マーケティング等を行う仕組みである。"],"2018-計画-12":["正しい。車椅子使用者が自力で登れる傾斜路の勾配は1/12以下が基準であり、1/16はそれより緩やかで適切である。","誤り。20cmでは車椅子使用者が手を伸ばしにくい。コンセントは車椅子使用者の利用を考慮し、中心高さを床面から40cm程度以上とするのが望ましい。","正しい。流し台・調理台の奥行きは60cm程度が一般的で、車椅子使用者には移動せず作業できるL字型配置が作業効率の面で有効である。","正しい。車椅子使用者が浴槽へ移乗しやすいよう、浴槽の深さは50cm程度、エプロン高さは40cm程度とするのが適切である。"],"2018-計画-13":["正しい。熊本県営竜蛇平団地は、中庭や共用部に面して土間やテラス等を設け、住民同士が互いの気配を感じられる住戸計画としている。","正しい。真野ふれあい住宅は、阪神・淡路大震災の被災者向けに建てられたコレクティブハウジングで、共同の食堂や台所を備えている。","正しい。世田谷区深沢環境共生住宅は、木造平家の住宅団地の建替えによる公営住宅で、高齢者在宅サービスセンターを併設したシルバーハウジング・プロジェクトを含む。","誤り。茨城県営六番池アパートの中央広場は、居住者専用に閉じたものではなく、地域に開かれた広場として計画されている。住戸や集会室を介してのみアクセスする記述は適当でない。"],"2018-計画-14":["正しい。サインには位置サイン、誘導サイン、案内サイン等があり、それぞれ場所の名称、方向、利用判断に必要な情報の提供という役割をもつ。","正しい。高齢者や弱視者、色覚障がい者は、黄と白、赤と緑などの組合せを識別しにくいため、これらの配色は避けることが望ましい。","誤り。視距離1mで読むサインは、立位の人と車椅子使用者の双方が見やすいよう、表示面中心を130cm程度(おおむね100〜150cmの範囲)とするのが望ましい。150cmは高すぎる。","正しい。遠方から見るサインは、見上げ角度が大きいと見づらくなるため、視距離10mでは仰角10度以内に収まる位置に設けることが望ましい。"],"2018-計画-15":["誤り。避難者が使うマンホールトイレは、安全と防犯の観点から、居住エリアに近く、人目が届きやすい場所に設置できるよう計画するのが望ましい。離れた人目に付かない場所は不適当である。","正しい。屋外プールの水は、可搬式ポンプでくみ上げれば、断水時のトイレ洗浄水等の生活用水として活用できる。","正しい。学校の教育活動を早期に再開するため、避難所機能と教育機能の区画や動線を分けて計画しておくことが望ましい。","正しい。備蓄倉庫は、行政の防災担当部局と協議し、想定される災害に対して安全な場所に計画することが望ましい。"],"2018-計画-16":["正しい。幼保連携型認定こども園の園舎は2階建以下を原則とし、園庭は園舎と同一敷地内等に設けるのが原則である。","誤り。ほふく室は主に2歳未満児が過ごす専用の部屋で、保育室と遊戯室は兼用できても、ほふく室と遊戯室を兼用する計画は適当でない。","正しい。飲料水用設備は、衛生上、手洗い用設備や足洗い用設備とは別に設けることとされている。","正しい。食事の提供を要する園児が20人を超える場合は独立した調理室が必要であり、25人なら調理室を設ける計画は適切である。"],"2018-計画-17":["正しい。東京ビッグサイトの会議棟(コングレスタワー)は、4本の巨大な柱によるスーパーストラクチャーに支えられ、施設のシンボルとなっている。","正しい。ビッグパレットふくしまは、楕円に近い形の「マザールーフ」と呼ばれる大屋根が特徴で、名称の由来にもなっている。","誤り。パシフィコ横浜の屋根形状や配置に関する記述が実際と合わない。大空に羽ばたく鳳をイメージしたとするのは適当でなく、この説明は他の建築物のものと混同されている。","正しい。幕張メッセは、山並みを思わせる第I期と、凹面から凸面へ波のように変化する屋根の第II期が、特徴的なスカイラインをつくっている。"],"2018-計画-18":["正しい。四会連合協定の約款では、本件建築物が著作物に該当する場合、その著作権は受託者(建築家)に帰属すると定めている。","正しい。委託者は、本件建築物が著作物であっても、写真、模型、絵画その他の媒体により表現し、利用することができる。","誤り。受託者が成果物の著作権を第三者に譲渡する場合は、委託者の承諾が必要である。承諾なく自由に譲渡できるとする記述は誤りである。","正しい。受託者は、成果物が第三者の著作権を侵害した場合、原則として第三者に対し損害賠償の責任を負う。"],"2018-計画-19":["正しい。デュー・デリジェンスは、不動産取得に際し、適正な価値やリスクを評価するために、物理的、法的、経済的な面から行う多角的な調査である。","正しい。ブリーフィングは、発注者や関係者の要求、目的、制約条件を明らかにして分析する過程で、その成果物をブリーフという。","正しい。フィージビリティ・スタディは、企画内容が事業経営の観点から実行可能かどうかを検証する検討作業である。","誤り。基本性能を維持したまま工事費低減や独自施工技術の導入を提案するのはバリュー・エンジニアリング(VE)等の手法である。ファシリティ・マネジメントは施設を経営資源として総合的に管理する活動である。"],"2018-計画-20":["誤り。図が不明のため断定はできないが、積算基準では帯筋の長さは柱断面から被りを引いた外周に、フック等の加算を行って求める。この値は正答と一致しない。","誤り。積算基準に基づく帯筋1本の長さの計算結果と一致せず、正答ではない。帯筋は主筋を囲む外周長さにフック分等を加えて算定する。","誤り。積算基準に基づいて算定した帯筋1本の長さと一致しない。帯筋の長さは柱断面寸法や被り厚さ、フックの加算で決まる。","正しい。建築数量積算基準に基づき、柱断面から被りを除いた帯筋の外周長さにフック等の加算分を加えると、帯筋1本の長さは2,400mmとなる。"],"2017-計画-1":["正しい。公益確保の責務は技術者の倫理的義務の一つで、公衆の安全、健康及び福利を最優先に考慮することをいう。","誤り。リスクマネジメントは、危機が生じる前に、リスクを予測・評価して対策を講じ、損失を最小限にする活動である。記述は事後対応を指す危機管理(クライシスマネジメント)に近い。","正しい。モラルハザードは保険分野から生じた概念で、近年は一般に倫理観の欠如と訳され、節度なく利益を追求する状態を指す。","正しい。不遵守行為は、個人や組織が意図的に法令や条例等に従わない行為をいう。"],"2017-計画-2":["正しい。犬島精錬所美術館は、20世紀初頭に閉鎖された精錬所の遺構を活かし、自然エネルギーを利用した美術館として再生したものである。","正しい。3331 Arts Chiyodaは、廃校となった中学校を、ギャラリーを含む文化施設等に再生したものである。","正しい。カステルヴェッキオ美術館は、14世紀に建てられた城を、カルロ・スカルパの設計で美術館として再生した事例である。","誤り。リンゴット工場は、20世紀初頭の巨大な自動車工場を、商業施設、ホテル、大学、会議場等を含む複合施設へ再生したものである。現代美術館として再生したとする記述は適当でない。"],"2017-計画-3":["誤り。正しい順序はパンテオン(2世紀)、ル・トロネ修道院(12世紀)、テンピエット(16世紀初頭)、セント・ポール大聖堂(17世紀)である。ル・トロネが最初という点が誤り。","誤り。パンテオンが最も古く、ル・トロネ修道院(12世紀)がテンピエット(16世紀初頭)より前に位置する。この並びは年代順に合わない。","誤り。パンテオンの次にテンピエットを置いているが、ル・トロネ修道院(12世紀)の方がテンピエット(16世紀初頭)より古い。","正しい。パンテオン(2世紀)、ル・トロネ修道院(12世紀)、テンピエット(16世紀初頭)、セント・ポール大聖堂(17世紀後半)の順で、古いものから新しいものへ並んでいる。"],"2017-計画-4":["正しい。コールハースは「錯乱のニューヨーク」で、マンハッタンの超高層がつくる「過密の文化」に着目し、マンハッタニズムと定義した。","正しい。アレグザンダーの「パタン・ランゲージ」は、都市や建築を形づくる基本的な原則(パタン)を、事例から導いて示した書である。","正しい。ジェイコブズは「アメリカ大都市の死と生」で、街路や地区に多様性を生む四つの条件を示した。","誤り。ラスベガスの都市景観を記号論的に分析したのはヴェンチューリらの「ラスベガス」である。リンチの「都市のイメージ」は、パス・エッジ・ディストリクト・ノード・ランドマークの5要素で都市の認識を論じた書である。"],"2017-計画-5":["正しい。外部空間の幅員Dとファサード高さHの比D/Hは、開放感や閉塞感を表す指標として用いられる。","誤り。冬至日に4時間以上の日影が及ぶ範囲のような長時間の日影は、建築物の高さよりも東西方向の幅に大きく影響される。高さの影響が大きいとする記述は誤りである。","正しい。屋根や屋上に高日射反射率塗料を塗ると、日射による表面温度上昇が抑えられ、ヒートアイランド現象の抑制が期待できる。","正しい。多雪地域の市街地では、落雪の搬出の不便さや落雪の危険を避けるため、無落雪屋根を採用する場合がある。"],"2017-計画-6":["正しい。座った状態で室内の見通しをよくするには、パーティション高さを110cm程度とするのが妥当である。","誤り。幼稚園の子ども用手洗い場の高さは、幼児の体格を考慮し、床面から50〜55cm程度が一般的であり、65cmは高い。足洗い場の床勾配等も含め、記述は適当でない。","正しい。小学校の教室の天井高さは、居心地や落着き感を考慮して2.7m程度とするのが一般的で、建築基準法の2.1m以上も満たす。","正しい。病室の床面積は、患者一人につき6.4m²以上と定められており、8m²は基準を満たし、ベッド間に1m以上の幅を確保できる。"],"2017-計画-7":["正しい。定員24人のエレベーターのかご内法は、間口2,150mm×奥行1,600mm程度で適切である。","正しい。主要な出入口の有効幅員を1,500mm、その他を1,000mmとする計画は、一般的な寸法として適当である。","誤り。自走式立体駐車場の車路の傾斜部の本勾配は1/6以下とされており、1/5は急すぎる。緩和勾配を1/10とする点は妥当である。","正しい。多人数の成人が使う洗面所では、隣り合う洗面器の中心間距離は750〜900mm程度が目安で、850mmは適当である。"],"2017-計画-8":["正しい。建築設計標準では、階段の手すり端部は、上端で水平に45cm、下端で段鼻から斜め部分も含めて45cm延長するとされている。","正しい。二段手すりは上段を80cm程度、下段を60〜65cm程度とし、大人と子どもや車椅子使用者の双方が使えるようにする。","正しい。蹴上げ15cm、踏面32cm、蹴込み1cmは、蹴上げ16cm以下、踏面30cm以上、蹴込み2cm以下の目安に適合している。","誤り。階段上端部の手前には、注意喚起のために点状ブロックを敷設する(段の手前30cm程度)。線状ブロックは誘導用であり、段の存在を知らせる目的には適さない。"],"2017-計画-9":["正しい。オストメイト用汚物流しの水栓は、湯温調整付きのレバーハンドル型混合水栓が使いやすく、適当である。","正しい。オストメイト用便房には、ストーマ装具や小物を置ける手荷物置き台(カウンター)を設けるのが望ましい。","誤り。車いす使用者用便房の洗面器の鏡は、座位でも利用しやすい十分な大きさとするものであり、幅35cm×高さ45cmは小さい。標準的な寸法より小さい点が不適当である。","正しい。車いす使用者用便房には、便器側壁にL型手すり、他方に可動手すりを設け、水平部の高さは座面から25cm程度とするのが標準である。"],"2017-計画-10":["正しい。帝都復興事業では、後藤新平らの主導により、鉄筋コンクリート造の復興小学校を建設し、隣接して小公園を整備した。","正しい。ヴォワザン計画は、一部の歴史的建造物を残し、古い街区を大規模に取り壊して、幹線道路と超高層ビルに建て替える提案である。","誤り。丹下健三の「東京計画1960」は、東京湾を全面的に埋め立てるのではなく、東京湾上に都市軸を延ばす海上都市を計画した。放射状ではなく線状(リニア)に伸びる構造を提案している。","正しい。グラン・プロジェは、ミッテラン大統領らが主導し、フランス革命200年を記念してルーブル改修やオルセー駅舎の美術館転用等を進めた。"],"2017-計画-11":["誤り。連担建築物設計制度は、既存建築物がある複数敷地を一団地とみなして一体的に設計し、容積率等の規定を適用する制度である。記述は特定街区等の説明であり、適当でない。","正しい。地区計画は、住民と市町村が連携し、地区の将来像を設定して、まちづくりを進めていく都市計画法上の手法である。","正しい。登録有形文化財(建造物)は、原則として建設後50年を経過し、一定の基準に該当するものが登録の対象となる。","正しい。都市緑地法の緑化地域では、一定規模以上の建築物の新築や増築の際に、敷地面積の一定割合以上の緑化が義務付けられる。"],"2017-計画-12":["正しい。ファンズワース邸は、H形鋼の柱に梁を溶接し、屋根スラブと床スラブを取り付けた構造の週末住宅である。","正しい。シュレーダー邸は、建具や家具で住空間をつくる点に特徴があり、2階は可動間仕切りで一室にも小空間にも区切れる。","誤り。前川自邸は、約20m²の狭小敷地ではなく、広めの敷地に建つ住宅である。都市部の狭小敷地に空間を積層した住宅の記述は、別の作品の説明と混同している。","正しい。原自邸は、玄関から吹抜けを通ってバルコニーまで降りる廊下の両側に居室を配し、トップライトから自然光を取り入れた住宅である。"],"2017-計画-13":["正しい。かんかん森は、各住戸の独立性を保ちつつ、共同の居間や台所を備えて生活の一部を共同化したコレクティブハウスである。","正しい。SHARE yaraichoは、道路側を半透明のテント膜で覆い、吹抜けを介して個室7室とコモンスペースを計画したシェアハウスである。","正しい。泉北ニュータウンでは、空き住戸を活用したサポート付き共同住宅や多世代型シェアハウス等の試みが行われている。","誤り。求道學舎は、テラスハウスではなく、既存の学生寮を再生した集合住宅(コーポラティブ方式)である。記述はこの建物の性格と合わない。"],"2017-計画-14":["誤り。非常用エレベーターの乗降ロビーの面積は、非常用エレベーター1台につき10m²以上と定められている。15m²以上とする記述は誤りである。","正しい。コアの片寄せタイプは、避難経路が偏り避難上不利な点が多いので、採用時はシミュレーション等で安全性を確認することが望ましい。","正しい。火災拡大防止には、出火の可能性が高い部分に防火区画を設け、初期消火設備や不燃材料を用いることが求められる。","正しい。屋上の緊急離着陸場は、在館者の救助に使われるほか、消防隊の進入にも利用できる。"],"2017-計画-15":["正しい。指定緊急避難場所は災害の危険から逃れるための場所で、洪水等では想定される水位以上の高さに避難スペースを設ける必要がある。","正しい。基幹災害拠点病院には、施設全体が地震等に対して安全な構造であることや、敷地内のヘリポートの設置等が求められる。","正しい。借上型仮設住宅は、自治体が民間賃貸住宅を借り上げて供与するもので、東日本大震災以降は「みなし仮設住宅」とも呼ばれる。","誤り。建設型仮設住宅は、災害後に速やかに建設されるが、恒久的ではなく一時的な居住のために供与される(原則として供与期間に限りがある)。"],"2017-計画-16":["正しい。介護老人保健施設は、要介護者に看護・医学的管理下の介護や機能訓練を行い、自立した日常生活と在宅復帰を目指す施設である。","誤り。急性期リハビリテーションは、発症直後から早期に行う訓練で、機能低下の予防が主目的である。90〜180日をかけて機能改善を図るのは回復期リハビリテーションである。","正しい。放課後等デイサービスは、就学中の障がい児に放課後や長期休暇中に生活能力向上の訓練等を継続提供する事業で、指導訓練室等の設備を要する。","正しい。日本版CCRCは、大都市の高齢者が健康なうちに地方へ移住し、地域活動を通じて多世代と交流・共働する居住を基本とする構想である。"],"2017-計画-17":["誤り。ベルリン自由大学図書館(フォスター)は、傾斜した円盤状屋根や外壁の文字彫刻をもつ建築ではなく、頭脳を思わせる楕円のドーム状の形態が特徴である。","正しい。フランス国立図書館(ペロー)は、緑豊かな中庭を囲むロの字型の基壇と、四隅に配置したL字型の高層タワーで構成される。","正しい。シアトル中央図書館(OMA)は、鉄骨格子とガラスで外観が構成され、外光を室内に導く特徴的な建築である。","正しい。ストックホルム市立図書館(アスプルンド)は、円筒と直方体を組み合わせた外観で、円筒内部に壁沿いの書架と中央のサービスデスクをもつ。"],"2017-計画-18":["正しい。工事監理、工事と設計図書との照合・確認の結果報告、工事監理の結果報告は、建築士法上の建築士の独占業務に該当する。","正しい。工事監理の具体的な実施方法や、照合・確認の対象・方法、業務範囲の詳細は、建築士法では定められていない。","正しい。建築士事務所の監理業務には、一般に、請負契約の目的物の引渡しの立会いや工事費支払いの審査が含まれる。","誤り。監理技術者講習は建設業法に基づき施工側の監理技術者が受けるものである。工事監理を行う建築士に義務づけられるのは、建築士法に基づく定期講習である。"],"2017-計画-19":["誤り。建築数量積算基準では、法付け工法の作業上のゆとり幅は0.5m、山留め工法の余幅は1.0mとされ、0.1mや0.5mの組合せは当てはまらない。","誤り。作業上のゆとり幅は0.3mではなく0.5m、山留め工法の余幅は0.5mではなく1.0mが基準である。","正しい。建築数量積算基準における根切りでは、法付け工法の作業上のゆとり幅は0.5m、山留め工法の余幅は1.0mとして計測する。","誤り。山留め工法の余幅は1.0mで正しいが、法付け工法の作業上のゆとり幅は1.0mではなく0.5mである。"],"2017-計画-20":["正しい。不動産のアセットマネジメントは、所有者や投資家に代わり、テナント対応や維持管理・運営を含む一連の不動産業務を行うものである。","誤り。デザインビルドは設計と施工を一括して同一事業者に発注する方式である。記述の三次元モデルで全データを統合して行う手法はBIMの説明である。","正しい。BOTは、民間が施設を建設(Build)し一定期間運営(Operate)したのち、期間満了時に行政へ移管(Transfer)する仕組みである。","正しい。LCMは、企画から解体・廃棄までの全期間で適切なコストのもと建築物の機能・効用を管理する手法で、LCCの低減も目的の一つである。"],"2016-計画-1":["正しい。アカウンタビリティは、業務や研究活動に関する「説明する責任」を意味する。","誤り。談合は、入札等で事前に業者間で落札者や価格を取り決める不正行為で、独占禁止法に違反する。資本を結合した共同企業体の設立は談合ではない。","正しい。公益通報には、通報先に応じて、事業者内部への内部通報、行政機関への通報、外部への通報の三種類がある。","正しい。コンプライアンスは「法令遵守」と訳され、法令・条例の遵守に加え、企業倫理等の遵守も含む概念である。"],"2016-計画-2":["正しい。東京駅丸の内駅舎は、特例容積率適用地区制度により未利用容積を周辺建築物へ移転・売却し、その財源で保存・復原された。","正しい。目黒区総合庁舎は、民間企業の本社屋を耐震補強・設備改修のうえ庁舎に転用した、再生活用の事例である。","誤り。神奈川県立近代美術館鎌倉館を、免震レトロフィット工法で保存・改修したとする記述は事実と合わない。免震レトロフィットの代表例は東京駅丸の内駅舎などである。","正しい。旧門司税関は、門司港レトロ事業の一環として、明治45年建築の庁舎を休憩所等として再生・活用した事例である。"],"2016-計画-3":["正しい。ハギア・ソフィア大聖堂は、バシリカ形式とドーム集中形式を融合した平面と巨大ドームによる広い内部空間をもつビザンチン建築である。","正しい。コルドバの大モスクは、紅白縞の二段アーチと林立する柱の内部空間をもち、現在はキリスト教とイスラム教の文化が混在する。","誤り。ピサ大聖堂は、ピサ・ロマネスク様式の建築で、白大理石の縞模様による外装が特徴である。記述はフィレンツェ大聖堂(ドーム、ピンクや緑の大理石)の特徴である。","正しい。ヴォルムス大聖堂は、東西に内陣(アプス)を対置し、身廊の両側に側廊を設けたバシリカ形式のロマネスク建築で、六つの塔をもつ。"],"2016-計画-4":["正しい。Low-E複層ガラスは、中空層側のガラス面に特殊金属膜をコーティングして、中空層の放射伝熱を低減した複層ガラスである。","誤り。強化ガラスは強度が高いが、破損時に粒状に割れ落下する危険があるため、アトリウムの屋根やトップライト等では、合わせガラスにするなど特段の措置が必要である。","正しい。合わせガラスは、2枚以上の板ガラスの間にフィルムを挟み加熱圧着したもので、破損時の飛散防止や防犯性能の向上に用いられる。","正しい。網入磨き板ガラスは、設計風圧力や厚さ・支持条件が同一なら、フロート板ガラスより耐風圧強度が低く、使用可能面積は小さくなる。"],"2016-計画-5":["正しい。周囲に低層建築物群がある場合は、周囲に何もない場合より、高層建築物による地表面付近の風速増加率が大きくなる傾向がある。","正しい。建築物周辺の気流は、高さと間隔の比(H/W)や、街区面積に対する建築物の占有割合に大きく影響される。","
