<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>一級建築士 学科試験対策</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--primary:#1a5276;--primary-light:#2980b9;--accent:#e74c3c;
--bg:#f5f6fa;--card:#fff;--text:#2c3e50;--text-light:#7f8c8d;
--border:#ddd;--correct:#27ae60;--wrong:#e74c3c;
--radius:12px;--shadow:0 2px 8px rgba(0,0,0,.08);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-text-size-adjust:100%}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

/* Header */
.header{background:var(--primary);color:#fff;padding:16px 20px;text-align:center;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:700;letter-spacing:.5px}
.header .sub{font-size:12px;opacity:.8;margin-top:2px}
.back-btn{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:4px 8px}

/* Home Screen */
.home{padding:20px;flex:1}
.mode-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;margin-bottom:16px;box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent;transition:all .2s}
.mode-card:active{transform:scale(.98);border-color:var(--primary-light)}
.mode-card .mode-icon{font-size:32px;margin-bottom:8px}
.mode-card h2{font-size:17px;color:var(--primary);margin-bottom:6px}
.mode-card p{font-size:13px;color:var(--text-light)}
.mode-card .mode-tag{display:inline-block;background:var(--primary);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;margin-top:8px}

/* Subject/Year Select */
.select-screen{padding:20px;flex:1}
.select-screen h2{font-size:16px;margin-bottom:16px;text-align:center;color:var(--primary)}
.select-group{margin-bottom:20px}
.select-group h3{font-size:14px;color:var(--text-light);margin-bottom:8px;padding-left:4px}
.select-btn{display:block;width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:8px;text-align:left;cursor:pointer;font-size:15px;transition:all .2s}
.select-btn:active{background:#eef2f7}
.select-btn .btn-sub{font-size:12px;color:var(--text-light);margin-top:2px}
.select-btn .btn-count{float:right;color:var(--primary-light);font-size:13px}
.select-btn:disabled{opacity:.4;cursor:not-allowed}

/* Timer Bar */
.timer-bar{background:var(--primary);color:#fff;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;font-size:14px;position:sticky;top:56px;z-index:99}
.timer-bar .timer{font-family:'Courier New',monospace;font-size:20px;font-weight:700}
.timer-bar .timer.warning{color:#f39c12}
.timer-bar .timer.danger{color:var(--accent);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
.timer-bar .progress-text{font-size:12px;opacity:.9}

/* Question Card */
.question-area{padding:16px 20px;flex:1;padding-bottom:100px}
.q-card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.q-number{font-size:13px;color:var(--primary-light);font-weight:700;margin-bottom:8px}
.q-text{font-size:15px;line-height:1.8;margin-bottom:16px}
.q-figure{margin:12px 0;text-align:center}
.q-figure svg{max-width:100%;height:auto}
.choices{list-style:none}
.choices li{border:2px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:8px;cursor:pointer;font-size:14px;line-height:1.6;transition:all .15s;display:flex;align-items:flex-start;gap:10px}
.choices li .choice-num{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-light);transition:all .15s}
.choices li.selected{border-color:var(--primary-light);background:#eef6fc}
.choices li.selected .choice-num{background:var(--primary-light);color:#fff}
.choices li.correct{border-color:var(--correct);background:#eafaf1}
.choices li.correct .choice-num{background:var(--correct);color:#fff}
.choices li.wrong{border-color:var(--wrong);background:#fdedec}
.choices li.wrong .choice-num{background:var(--wrong);color:#fff}
.choices li.disabled{pointer-events:none}

/* QA ○× Buttons */
.qa-statement{border:2px solid var(--border);border-radius:10px;padding:16px;margin:16px 0;font-size:14px;line-height:1.8;background:var(--card)}
.qa-note{font-size:12px;color:var(--text-light);line-height:1.7;margin:8px 0}
.qa-statement-text{color:var(--text)}
.qa-buttons{display:flex;gap:16px;justify-content:center;margin:20px 0}
.qa-btn{width:80px;height:80px;border-radius:50%;border:3px solid var(--border);font-size:36px;font-weight:700;cursor:pointer;transition:all .15s;background:var(--card)}
.qa-maru{color:var(--correct)}
.qa-batsu{color:var(--wrong)}
.qa-btn:active{transform:scale(.95)}
.qa-btn.disabled{pointer-events:none;opacity:.5}
.qa-btn.correct{border-color:var(--correct);background:#eafaf1;opacity:1}
.qa-btn.wrong{border-color:var(--wrong);background:#fdedec;opacity:1}

/* Answer Feedback (一問一答) */
.expl-box{margin-top:12px;padding:12px 16px;border-radius:10px;font-size:13.5px;line-height:1.8;background:#f4f7fb;border:1px solid #d6e0ec;color:var(--text)}
.expl-box b{color:var(--primary)}
.expl-more{margin-top:10px;font-size:13px}
.expl-more summary{cursor:pointer;color:var(--primary);padding:6px 0}
.expl-item{padding:8px 10px;margin:6px 0;border-radius:8px;border:1px solid var(--border);font-size:13px;line-height:1.7;background:var(--card)}
.expl-item.ans{border-color:var(--correct);background:#eafaf1}
.expl-item.mine{border-color:var(--wrong);background:#fdedec}
.expl-item .ec{color:var(--text-light);margin-top:4px}
.review-q{border:1px solid var(--border);border-radius:10px;margin:8px 0;background:var(--card)}
.review-q summary{padding:10px 12px;cursor:pointer;font-size:13.5px}
.review-q .rb{padding:0 12px 12px}
.review-mark{font-weight:700;margin-right:6px}
.feedback{margin-top:12px;padding:12px 16px;border-radius:10px;font-size:14px;line-height:1.6;display:none}
.feedback.correct{display:block;background:#eafaf1;color:#1e8449;border:1px solid #a9dfbf}
.feedback.wrong{display:block;background:#fdedec;color:#922b21;border:1px solid #f5b7b1}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--border);padding:12px 20px;display:flex;gap:12px;z-index:100}
.bottom-nav button{flex:1;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s}
.bottom-nav .btn-primary{background:var(--primary);color:#fff}
.bottom-nav .btn-primary:active{background:var(--primary-light)}
.bottom-nav .btn-secondary{background:#ecf0f1;color:var(--text)}
.bottom-nav .btn-secondary:active{background:#d5dbdb}
.bottom-nav .btn-danger{background:var(--accent);color:#fff}

/* Result Screen */
.result-screen{padding:20px;flex:1;text-align:center}
.result-score{font-size:48px;font-weight:800;color:var(--primary);margin:20px 0 8px}
.result-total{font-size:16px;color:var(--text-light);margin-bottom:24px}
.result-bar{background:#ecf0f1;border-radius:20px;height:12px;margin:0 20px 24px;overflow:hidden}
.result-bar-fill{height:100%;border-radius:20px;transition:width .8s ease}
.result-detail{text-align:left;background:var(--card);border-radius:var(--radius);padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.result-detail h3{font-size:14px;color:var(--primary);margin-bottom:12px}
.result-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
.result-row:last-child{border:none}
.result-row .label{color:var(--text-light)}
.result-row .value{font-weight:600}
.result-row .value.pass{color:var(--correct)}
.result-row .value.fail{color:var(--accent)}

/* Stats Card */
.stats-card{background:var(--card);border-radius:var(--radius);padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.stats-card h3{font-size:14px;color:var(--primary);margin-bottom:8px}
.stats-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}

/* Utility */
.hidden{display:none!important}
.screen{display:none;flex-direction:column;min-height:calc(100dvh - 56px)}
.screen.active{display:flex}
.text-center{text-align:center}
.mt-8{margin-top:8px}
.mt-16{margin-top:16px}
</style>
</head>
<body>
<div class="app">
  <div class="header" id="header">
    <button class="back-btn hidden" id="backBtn" onclick="goBack()">&larr;</button>
    <h1>一級建築士 学科試験対策</h1>
    <div class="sub" id="headerSub">過去問トレーニング</div>
  </div>

  <!-- Home Screen -->
  <div class="screen active" id="homeScreen">
    <div class="home">
      <div class="mode-card" onclick="openMode('exam')">
        <div class="mode-icon">&#128221;</div>
        <h2>年代別過去問モード</h2>
        <p>年代ごとに学科を通しで解く本番形式。制限時間付きで実力を測定できます。</p>
        <span class="mode-tag">本番シミュレーション</span>
      </div>
      <div class="mode-card" onclick="openMode('qa')">
        <div class="mode-icon">&#9889;</div>
        <h2>科目別一問一答モード</h2>
        <p>科目を選んで一問ずつ即座に正誤がわかる。スキマ時間にサクサク学習。</p>
        <span class="mode-tag">スキマ時間学習</span>
      </div>
      <div class="stats-card" id="statsCard">
        <h3>学習記録</h3>
        <div class="stats-row"><span>総解答数</span><span id="statTotal">0問</span></div>
        <div class="stats-row"><span>正答率</span><span id="statRate">--%</span></div>
        <div class="stats-row"><span>最終学習</span><span id="statLast">--</span></div>
      </div>
    </div>
  </div>

  <!-- Exam Mode: Year Select -->
  <div class="screen" id="examSelectScreen">
    <div class="select-screen" id="examSelectArea"></div>
  </div>

  <!-- QA Mode: Subject Select -->
  <div class="screen" id="qaSelectScreen">
    <div class="select-screen" id="qaSelectArea"></div>
  </div>

  <!-- Question Screen (Exam Mode) -->
  <div class="screen" id="examScreen">
    <div class="timer-bar" id="timerBar">
      <div><span id="examSubject"></span><span class="progress-text" id="examProgress"></span></div>
      <div class="timer" id="examTimer">00:00</div>
    </div>
    <div class="question-area" id="examQuestions"></div>
    <div class="bottom-nav" id="examNav">
      <button class="btn-secondary" onclick="examPrev()">前の問題</button>
      <button class="btn-primary" onclick="examNext()" id="examNextBtn">次の問題</button>
    </div>
  </div>

  <!-- Question Screen (QA Mode) -->
  <div class="screen" id="qaScreen">
    <div class="question-area" id="qaQuestions"></div>
    <div class="bottom-nav" id="qaNav">
      <button class="btn-primary" onclick="qaNext()" id="qaNextBtn" style="display:none">次の問題</button>
    </div>
  </div>

  <!-- Result Screen -->
  <div class="screen" id="resultScreen">
    <div class="result-screen" id="resultArea"></div>
    <div class="bottom-nav">
      <button class="btn-secondary" onclick="showScreen('homeScreen')">ホームに戻る</button>
      <button class="btn-primary" onclick="reviewWrong()" id="reviewBtn">間違えた問題を復習</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 問題データ（この配列を編集して問題を追加する）
// ============================================================
const QUESTIONS = [
  {
    year: 2025, subject: '計画', no: 1,
    text: '建築及び都市の計画に関する次の記述のうち、最も不適当なものはどれか。',
    choices: [
      '循環経済(サーキュラーエコノミー)の実現のため、建設リサイクルの高度化、良好なストック形成、インフラの長寿命化のほか、空き家活用、地域交通、二拠点居住等による循環資源に資する地域生活圏の形成などが目指されている。',
      'ウォーカブルシティは、歩いて暮らせる都市づくりを目指すものであり、「まちなかウォーカブル推進事業(国土交通省)」などにより、居心地が良く歩きたくなる空間づくりが推進されている。',
      'アフォーダンス理論では、知覚者が何かの行動をできそうだと感じるよう引き出す、環境が備えている資質をアフォーダンスと呼び、知覚されるアフォーダンスは知覚者の性格や経験、能力、要求等によって異なると説明されている。',
      'フェーズフリーデザインは、障害の有無、年齢や性別、体型、出身、身体や認知機能等の差にかかわらず、できるだけ安全かつ便利に利用しやすいようにあらかじめ配慮されたものであり、公共施設等の整備の理念として広く普及している。'
    ],
    answer: 4
  },
  {
    year: 2025, subject: '計画', no: 2,
    text: '日本の歴史的な建築物(所在地)に関する次の記述のうち、最も不適当なものはどれか。',
    choices: [
      '日光東照宮社殿(栃木県)は、本殿と拝殿を石の間でつないだ、権現造の例である。',
      '慈照寺東求堂同仁斎(京都府)は、現存最古とされる違い棚と付書院をもつ、数寄屋造の例である。',
      '東大寺二月堂(奈良県)は、斜面の上に張り出した床を束柱で支えた、懸造の例である。',
      '出雲大社本殿(島根県)は、切妻造・妻入で、正面の2つの柱間の片方を入口とした左右非対称の形式をもつ、大社造の例である。'
    ],
    answer: 2
  },
  {
    year: 2025, subject: '計画', no: 3,
    text: '西洋の歴史的な建築物(所在地)に関する次の記述のうち、最も不適当なものはどれか。',
    choices: [
      'パルテノン神殿(アテネ)は、外周にドリス式の円柱が並び、クリアストーリーと呼ばれる高窓をとおして神室内に光を取り入れた、古代ギリシアの建築物である。',
      'パンテオン(ローマ)は、レンガとコンクリート等を用いて建設された直径約43mのドームが架けられ、その頂部にある天窓をとおして内部空間に光を取り入れる、古代ローマの建築物である。',
      'ハギア・ソフィア大聖堂(イスタンブール)は、ペンデンティヴと呼ばれる技術を用いた巨大なドームが架けられ、キリスト教会堂のバシリカ式と集中式が融合した内部空間をもつ、ビザンチン様式の建築物である。',
      'サン・カルロ・アッレ・クァットロ・フォンターネ聖堂(ローマ)は、凹凸の湾曲面や曲線が使用されたファサードをもち、内部には楕円形平面のドームが架けられた、バロック様式の建築物である。'
    ],
    answer: 1
  },
  {
    year: 2025, subject: '計画', no: 4,
    text: '建築物の各部に関する次の記述のうち、最も不適当なものはどれか。',
    choices: [
      '特定天井の設計に当たり、天井と壁との間に一定の隙間を設けることにより、天井材の損傷・脱落防止を図る仕様ルートを採用したので、60mm以上の隙間を設けた。',
      '軽量鉄骨下地の遮音壁の設計に当たり、軽量鉄骨の支柱(スタッド)は千鳥配置とし、中空部分にはグラスウールを充填した。',
      '外壁をタイル仕上げとするに当たり、寒冷地で使用することから、I類(磁器質に相当)からIII類(陶器質に相当)に変更した。',
      '外壁をカーテンウォールとするに当たり、部材間の接合部から雨水が浸入することを防ぐため、内外の空気圧を等圧にすることにより重力で排水するオープンジョイントとした。'
    ],
    answer: 3
  },
  {
    year: 2025, subject: '計画', no: 5,
    text: '既存建築物の活用や資源循環に関する次の記述のうち、最も不適当なものはどれか。',
    choices: [
      '「令和5年住宅・土地統計調査(総務省)」によると、2023年10月1日現在、日本全体では約900万戸の空き家があり、周囲に悪影響を及ぼす前の有効活用や適切な管理等の総合的な強化が必要とされている。',
      '「建設工事に係る資材の再資源化等に関する法律」(建設リサイクル法)によって規定された特定建設資材は、コンクリート、コンクリート及び鉄から成る建設資材、木材、アスファルト・コンクリートである。',

      '「減価償却資産の耐用年数等に関する省令」により、減価償却期間の算定に用いる法定耐用年数が定められており、これにより、建築物を居住用途として使用できる期間が規定されている。'
    ],
    answer: 4
  },
  {
    year: 2025, subject: '計画', no: 6,
    text: '木材に関する次の記述のうち、最も不適当なものはどれか。',

      'ポリウレタン樹脂塗料は、光沢があり、付着性、耐摩耗性、耐水性等に優れ、木床等に用いられる。',

      '木材の腐朽は、木材腐朽菌の繁殖条件である酸素・温度・水分・栄養源のうち、いずれか一つでも除去することにより防止することができる。'
    ],
    answer: 2
  },
  {
    year: 2025, subject: '計画', no: 7,
    text: '事務所ビルの平面計画・配置計画に関する次の記述のうち、最も不適当なものはどれか。',
    choices: [
      '斜線制限の規定を適用せずに天空率を用いることで、基準階の合理化、床面積と地上部分の空地の確保を実現した。',
      '基準階の平面形状は、南北面にコアを配置することで南北面の窓を減らし、東西面に開口部を設けることで、夏期の熱負荷の影響を軽減させた。',
      '一つの階を分割して貸し出すことを想定した場合、両端コアタイプを採用するとレンタブル比が低下するおそれがあったので、共用廊下、エレベーター、避難階段、トイレ等の共用部分を集約したセンターコアタイプとした。',
      '公道から敷地内や建築物内、事務室等への動線は、セキュリティレベルの低いほうから高いほうへと連続させた。'
    ],
    answer: 2
  },
  {
    year: 2025, subject: '計画', no: 8,
    text: '建築物等の各部の寸法に関する次の記述のうち、最も不適当なものはどれか。',
    choices: [
      '集合住宅において、避難時に使用する共用階段は、階段の段裏から段鼻までの最小寸法を2mとした。',
      'ホテルにおいて、車椅子使用者用客室内の浴室は、浴槽深さを500mmとし、移乗台の高さとエプロン高さを450mmとした。',
      '大規模な路外駐車場において、普通自動車用の一方通行の車路を幅3m、対面通行の車路を幅6mとした。',
      '庁舎において、受付や窓口のカウンターは、高齢者、障害者等の利用に配慮し、ローカウンターの高さを700mm、ハイカウンターの高さを1,000mmとした。'
    ],
    answer: 3
  },

{year:2024,subject:'計画',no:1,text:'建築士の行う、設計業務等に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築士は、違反建築物の建築等の法令違反行為について、指示をする、相談に応じる等の行為をしてはならない。','建築士は、設計者ではなく施工者として建築基準関係規定に違反する工事を行った場合であっても、建築士法により業務停止処分を受けることがある。','一級建築士、二級建築士及び木造建築士は、国土交通大臣の免許を受け、設計、工事監理その他の業務を行う者で、常に品位を保持し、建築物の質の向上に寄与するように、公正かつ誠実にその業務を行わなければならない。','建築関連5団体によって制定された「地球環境・建築憲章」(2000年)では、持続可能な循環型社会の実現に向けての21世紀の目標として、「長寿命」、「自然共生」、「省エネルギー」、「省資源・循環」、「継承」に取り組むことを宣言している。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'計画',no:2,text:'日本の歴史的な建築物(所在地)に関する次の記述のうち、最も不適当なものはどれか。',choices:['豊平館(北海道)は、木造総2階建てで、中央入口の上部に架かる半円形に張り出したバルコニーをコリント式の柱で支える、明治時代に建てられた洋風の建築物である。','臨春閣(大正期に移築、現・神奈川県)は、3棟からなり、現在の第三屋においては、1階に雅楽の楽器を用いた欄間、2階に縁を配した小部屋が設けられている、江戸時代に建てられた数寄屋風書院造りの建築物である。','本願寺飛雲閣(京都府)は、敷地内の池に面して建つ3層の楼閣建築であり、左右対称を避けるように3層を中央からずらして配置し、屋根や唐破風を複雑に配した、平安時代に建てられた寝殿造りの建築物である。','三徳山三仏寺投入堂(鳥取県)は、修験道の道場として山中に営まれた寺院の奥院で、岩山の崖のくぼみにあり、長短の様々な柱を巧みに用いた、平安時代に建てられた懸造りの建築物である。'],answer:3,hasFigure:false,figureDesc:''},

{year:2024,subject:'計画',no:5,text:'断熱計画、気密計画等に関する次の記述のうち、最も不適当なものはどれか。',choices:['木造の一戸建て住宅の外壁において、繊維系断熱材の屋外側に透湿防水シートを設けたうえで胴縁等を用いて通気層を確保することは、壁体内に侵入した湿気が屋外に排出され、壁体内の結露を防止する効果がある。','木造の一戸建て住宅において、基礎断熱工法を採用する場合、外周部の土台と基礎天端の間にねこ土台を設け、床下の通気性を確保する必要がある。','建築物の改修において、既存の窓に内窓を設置し、その内窓の気密性を高めることは、既存の窓の室内側の表面結露を防止する効果がある。','気候風土適応住宅は、地域の気候及び風土に応じた住宅であることにより、外皮基準に適合させることが困難であるものとして国土交通大臣が定める基準に適合するものである。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'計画',no:6,text:'建築物の長期利用に関する次の記述のうち、最も不適当なものはどれか。',choices:['一戸建て住宅において、敷設したさや管の内部に樹脂製の配管を通すさや管ヘッダー工法を用い、ヘッダーを設置した洗面室の床下から集中的に点検や更新が行える計画とした。','事務所ビルにおいて、大規模災害時の事業継続や早期復旧を目的としたBCP（事業継続計画）の策定に当たり、サテライトオフィスを設置して事業拠点を分散する計画とした。','高層集合住宅において、各階で更新ができるように、排水管の接合方法が工夫された特殊継手排水システムを採用したので、排水管及びパイプシャフトは専有部から点検する計画とした。','建築物の耐震改修に当たり、確認済証が交付されていたが検査済証の交付を受けていなかったので、建築当時の建築基準法等への適合状況を調査するため、確認済証に添付された図書等を用いて図上調査・現地調査を実施した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'計画',no:7,text:'木質系材料に関する次の記述のうち、最も不適当なものはどれか。',choices:['構造用集成材は、ひき板をその繊維方向が互いに直交となるように積層接着したものであり、大断面や湾曲材等の形状とすることで大スパンでの使用も可能である。','構造用合板は、単板をその繊維方向が互いに直交となるように積層接着したものであり、JASにおいて特類のものは、屋外又は常時湿潤状態となる環境下での使用も可能である。','OSB（Oriented Strand Board）は、木材のストランド（切削片）を配向した層が互いに直交となるように積層接着したものであり、耐力壁にも使用されている。','MDF（Medium Density Fiberboard）は、主に木材等の植物繊維を成形した繊維板であり、下地材、家具材料のほか、構造用の面材にも使用されている。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'計画',no:8,text:'建築物の各部の寸法等に関する次の記述のうち、最も不適当なものはどれか。',choices:['保育所の計画において、乳児を対象とした定員10人のほふく室の有効面積を、40 m²とした。','図書館の計画において、子どもや車椅子使用者に配慮して、貸出用のカウンターについては、上端高さを700 mm、下端高さを650 mmとした。','体育館の計画において、バレーボールの公式試合（日本バレーボール協会主催の競技会）が行えるようにするため、天井の高さを、10.5 mとした。','病院の療養病床の病棟計画において、患者が使用する廊下の有効幅員は、片側居室となる部分を2.0 m、両側居室となる部分を3.0 mとした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'計画',no:9,text:'高齢者、障害者、子ども連れ利用者等に配慮した建築物の計画に関する次の記述のうち、「高齢者、障害者等の円滑な移動等に配慮した建築設計標準（国土交通省）」に照らして、最も不適当なものはどれか。',choices:['商業施設のベビー休憩室（授乳及びおむつ替えのための部屋）において、幼児の立位姿勢でのおむつ交換と排泄前後の着脱衣を安全にできるよう、乳幼児用おむつ交換台とは別に着替え台を設けた。','ビジネスホテルの客室において、客室内の浴室の出入口に至る経路を直角路としたので、浴室の出入口付近の通路の有効幅員を、800 mmとした。','市庁舎の主たる階段において、杖使用者等が円滑に上下移動できるよう、両側に段鼻から高さ650 mmと850 mmの二段の手すりを設けた。','特別養護老人ホームのサイン計画において、特に白内障の人に表示内容が分かりやすくなるよう、黒い表示板に白色の文字を用いた。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'計画',no:10,text:'各種の法令に基づく協定における、土地所有者等の合意に関する次の記述のうち、最も不適当なものはどれか。',choices:['景観法に基づく景観協定は、景観計画区域内の一団の土地の区域における良好な景観の形成に関する事項について、原則として、土地所有者等の全員の合意により結ばれる。','都市再生特別措置法に基づく都市利便増進協定は、まちのにぎわいや交流の創出に寄与する施設を、イベント等を実施しながら一体的に整備又は管理していくことを目的としたもので、区域内の土地所有者等の相当部分の参加により結ばれる。','建築基準法に基づく建築協定は、住宅地としての環境や商店街としての利便を高度に維持増進することなどを目的としたもので、原則として、土地所有者等の全員の合意により結ばれる。','都市緑地法に基づく緑地協定は、都市計画区域又は準都市計画区域内の地域の良好な環境を確保するため、緑地の保全及び緑化の推進に関する事項について、土地所有者等の相当部分の参加により結ばれる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'計画',no:11,text:'都市計画やまちづくりに関する用語の説明として、最も不適当なものは、次のうちどれか。',choices:['区域区分（線引き）は、都市計画区域について、無秩序な市街化を防止し、計画的な市街化を図るため必要があるときに定める、市街化区域と市街化調整区域との区分のことである。','まちづくり三法は、「改正都市計画法」、「中心市街地における市街地の整備改善と商業等の活性化の一体的推進に関する法律」、「大規模小売店舗立地法」の総称である。','連担建築物設計制度は、複数敷地により構成される一団の土地の区域内において、既存建築物の存在を前提とした合理的な設計をする場合には、複数建築物が同一敷地内にあるものとみなして、建築規制を適用する制度である。','風致地区は、「地域における歴史的風致の維持及び向上に関する法律（歴史まちづくり法）」に基づき、都市の風致を維持するために定められた地区である。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'計画',no:12,text:'住宅の作品名（設計者）とその特徴に関する次の記述のうち、最も不適当なものはどれか。',choices:['まつかわぼっくす（宮脇檀）は、鉄筋コンクリート造の内側に木構造をおさめた混構造で、中庭のあるコートハウス形式の住宅である。','住吉の長屋（安藤忠雄）は、ファサードに玄関以外の開口部がなく、中央部に中庭を設けた住宅である。','中野本町の家（伊東豊雄）は、鉄筋コンクリートの柱の上に鉄骨フレームを架け、上部をアルミやテントで覆った住宅である。','私たちの家（林昌二・林雅子）は、庭と居間とが面する関係を保ちつつ、コンクリートブロック造の住宅を増改築することで、夫婦2人の住まいとした住宅である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'計画',no:13,text:'住宅地・集合住宅の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['防災集団移転促進事業は、災害が発生した地域又は建築基準法に基づく災害危険区域のうち、住民の居住に適当でないと認められる区域内にある住居の集団的移転を促進することを目的としたものである。','ボンエルフ方式は、住宅地内の道路の計画において、シケインを用いて車の通行部分を蛇行させるなど、スピードを落とさせることにより、歩車共存を図ることを目的としたものである。','コレクティブハウスは、自ら居住する住宅を建設しようとする者が集まって結成した組合によって、事業計画の策定、建築物の設計、工事発注から住宅の管理・運営までを行うものである。','デュアルリビングは、住宅内に接客用のリビング（フォーマルリビング）と家族用のリビング（ファミリーリビング）のような、異なる機能をもつ2つのリビングを設けるものである。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'計画',no:14,text:'商業建築物等の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['大規模店舗において、避難時に利用する階段室への出入口の有効幅員は、流動係数を考慮して、階段の有効幅員よりも狭くした。','大規模店舗において、同じ道路に面した駐車場の入口と出口とを、10 m離して設けたうえで、左折入庫・左折出庫となるようにした。','劇場において、車椅子使用者用客席は、劇場の舞台の先端から車椅子使用者の眼高までのサイトラインの確保を基本とし、異なる階・異なる水平位置に分散して配置した。','事務所ビルにおいて、2階建てのエレベーター籠によって奇数階と偶数階と同時に乗客の輸送が可能なコンベンショナルゾーニング方式を採用し、建築面積に占めるエレベーターの割合を減らした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'計画',no:15,text:'社会福祉に関する用語の説明として、最も不適当なものは、次のうちどれか。',choices:['インクルーシブ教育は、障害の有無にかかわらず学べる仕組みのことであり、カームダウンのためのデンやアルコーブを教室まわりに設けるなど、それぞれの状況に応じて環境を整える「合理的配慮」が必要となる。','ジェントリフィケーションは、障害者が社会の中でごく普通に生活ができるように社会を整えることであり、在宅生活支援や地域に溶け込む小規模な就労支援の場などの整備が進められている。','レスパイトケアは、在宅で介護をする者が一時的に介護から離れて休息等をとれるようにする支援のことであり、医療型短期入所（ショートステイ）は、一時預かりだけでなく、介護をする者・される者が家族以外の人々と交流できる場としても期待されている。','地域包括ケアシステムは、重度な介護状態となっても住み慣れた地域で自分らしい暮らしを続けることができるような仕組みのことであり、住まい・医療・介護・予防・生活支援が一体的に提供されるよう、地域の特性に応じた対応が重要である。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'計画',no:16,text:'総合病院の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['病棟において、患者用のトイレは、利用時の安全性と利便性の確保のため、便器側方へのアプローチについて左右勝手が異なるタイプのものを分散して配置した。','緩和ケア病棟において、病室は全て個室とし、共用部に患者や患者家族が利用できる調理室や食事室を設置するなど、患者とその家族とのQOLを高める計画とした。','病室階において、火災時に避難階段等の縦動線を利用せずに一定の時間の安全性が確保できるように、各階に防火防煙区画された、2つ以上の安全区画を設ける計画とした。','部門構成において、病院運営の効率及び患者の動線を考慮して、外来部門は診療部門と病棟部門との間に配置した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'計画',no:17,text:'美術館（所在地）に関する次の記述のうち、最も不適当なものはどれか。',choices:['富弘美術館（群馬県）は、様々な大きさの矩形の展示空間が独立して配置され、その間の空間も展示や交流のためのスペースとなるように計画されている。','ポーラ美術館（神奈川県）は、周囲の景観を極力損なわないよう、すり鉢状の構造体を地下に埋め込んで建築物の高さを抑え、美術館の中心を貫くアトリウムにより自然光を取り入れることで、自然と美術との共生を目指した空間が計画されている。','京都市京セラ美術館[京都市美術館]（京都府）は、昭和初期に開館した美術館の既存のメインエントランスを残し、スロープからつながる地下広場に面した新たなエントランスを設けるなどの改修がされている。','豊島美術館（香川県）は、鉄筋コンクリートのシェル構造による屋根の大きな開口部から、周囲の風・音・光を内部に直接取り込むことで、周辺環境と建築物、展示作品とを一体で感じられるように計画されている。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'計画',no:18,text:'設計・監理業務等に関する次の記述のうち、最も不適当なものはどれか。',choices:['「建築士事務所の開設者がその業務に関して請求することのできる報酬の基準（平成31年国土交通省告示第98号）」における実施設計に関する標準業務には、工事施工者が設計図書の内容を正確に読み取り、設計意図に合致した建築物の工事を的確に行い、工事費の適切な見積りができるよう、基本設計に基づき、設計意図をより詳細に具体化した仕様書や図面等の図書を作成する業務が含まれる。','四会連合協定「建築設計・監理業務委託契約書」を利用する場合の「監理業務」は、工事監理と工事監理に係るそれ以外の業務（契約で定められる任意の業務）を含んでいる。','「工事監理」、「工事と設計図書との照合及び確認の結果報告等」及び「工事監理の結果報告」は、建築士法における、いわゆる「建築士の独占業務」に該当する。','四会連合協定「建築設計・監理等業務委託契約約款」における監理者の権限は、基本的に発注者との個別の契約で定められるが、契約で特に定められた場合を除き、工事施工段階での設計変更の権限も含まれる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'計画',no:19,text:'建築積算に関する次の記述のうち、建築工事積算研究会「建築数量積算基準・同解説」に照らして、最も不適当なものはどれか。',choices:['工事費における工事価格は、純工事費と一般管理費等を合わせたものである。','木取りは、規格長さの製材から1本又は複数の部材を挽き出すことをいう。','工事費における複合単価は、材料、副資材、施工等をまとめた単価のことである。','仕上の計測・計算において、木製間仕切下地を材料と施工手間に分離する場合の材料価格に対応する数量は、所要数量とする。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'計画',no:20,text:'建築のマネジメントに関する次の記述のうち、最も不適当なものはどれか。',choices:['PFI事業におけるBOT方式は、民間事業者が資金調達を行って施設を建設し、完成直後に公共工事の発注者に所有権を移転し、当該民間事業者に一定期間、維持管理及び運営を委ねる方式である。','プロパティマネジメントは、ビル運営管理業務以外にも、リーシングマネジメント業務、コンストラクションマネジメント業務等を含むことがある。','ライフサイクルマネジメントは、建築物の機能や効用の維持あるいは向上を適切なコストのもとで、建築物の企画から解体・廃棄処分まで管理実行することである。','BIMは、3次元の建築モデルに部材の寸法、材料、コスト等の属性情報をもたせたデータベースであり、設計から施工、維持管理までの各工程での情報活用が可能である。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'環境・設備',no:1,text:'環境工学における用語に関する次の記述のうち、最も不適当なものはどれか。',choices:['クリモグラフは、気温、相対湿度、降水量等の気候要素のうち2種類を座標軸にとり、一般に、月ごとの値をプロットして年間の推移を示した図であり、各地の気候特性を理解するために利用される。','自然室温は、室内における空気温度と平均放射温度の重み付け平均で表される値であり、一般に、発汗の影響が小さい環境下における熱環境に関する指標として用いられる。','輝度は、発光面の見かけの単位面積当たりの光度であり、ある点を見た際に眼に入る光の強さを表す。','A特性は、音圧レベルの測定値に対し、等ラウドネス曲線の40 phonの聴感曲線に対応した周波数感度補正を行うための特性であり、騒音レベルを算出する際に用いられる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'環境・設備',no:2,text:'室内の温熱環境に関する次の記述のうち、最も不適当なものはどれか。',choices:['冷たい窓面による不快感を生じさせないためには、放射の不均一性（放射温度の差）は10℃以内とすることが望ましい。','SET*（標準新有効温度）が25℃の場合、温冷感は「快適、許容できる」ものの範囲内とされる。','室内の暑さ指数（WBGT）は、湿球温度とグローブ温度から求められる。','床暖房時の床表面温度は、一般に、人が触れたときに温かく感じられるよう、体温よりやや高めにすることが望ましい。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'環境・設備',no:3,text:'外気温度5℃、無風の条件の下で、図のような上下に開口部を有する断面の建築物A、B、Cがある。室内温度がいずれも18℃に保たれ、上下各々の開口面積がそれぞれ3 m²、2 m²、1 m²、開口部の中心間の距離がそれぞれ3 m、6 m、9 mであるとき、建築物A、B、Cの換気量Q_A、Q_B、Q_Cの大小関係として、最も適当なものは、次のうちどれか。ただし、いずれの開口部も流量係数は一定とし、中性帯は開口部の中心間の中央に位置するものとする。なお、√2は1.4、√3は1.7として計算する。',choices:['Q_A = Q_B = Q_C','Q_A > Q_B > Q_C','Q_B > Q_A = Q_C','Q_C > Q_B > Q_A'],answer:2,hasFigure:true,figureDesc:'3つの建築物A、B、Cの断面図。それぞれ上下に開口部がある。建築物A：開口面積は上下各々3 m²、開口部の中心間の距離3 m。建築物B：開口面積は上下各々2 m²、開口部の中心間の距離6 m。建築物C：開口面積は上下各々1 m²、開口部の中心間の距離9 m。'},
{year:2024,subject:'環境・設備',no:4,text:'熱伝導率・熱貫流率に関する次の記述のうち、最も不適当なものはどれか。',choices:['断熱材に用いられるグラスウールの熱伝導率は、一般に、板ガラスの1/10以下、アルミニウムの1/1,000以下である。','同種の発泡系の断熱材で空隙率が同じ場合の熱伝導率は、一般に、断熱材内部の気泡寸法が大きいものほど大きくなる。','屋外の風速が大きくなると、一般に、外壁の熱貫流率は大きくなる。','外壁の熱貫流率は、外壁を構成する材料の種類や材厚が同じ条件の場合、一般に、躯体の屋外側で断熱するよりも、室内側で断熱するほうが大きくなる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'環境・設備',no:5,text:'建築物における防火・防災に関する次の記述のうち、最も不適当なものはどれか。',choices:['廊下を避難するときの歩行速度は、一般に、平均照度の低下に伴い遅くなり、1 lx以下では顕著に遅くなる。','フラッシュオーバーは、発生すると、一般に、酸素濃度が急激に低下する。','火災室で発生した熱を伴った煙は、階段室に流入すると、一般に、1～2 m/s程度の速さで上昇する。','建築物に使用するアカマツ、ケヤキ等の木材は、一般に、温度が上昇すると可燃性ガスを発生し、260℃前後で引火しやすくなる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'環境・設備',no:6,text:'日照・日射・採光に関する次の記述のうち、最も不適当なものはどれか。',choices:['大気透過率は、直射日光と天空光が大気を通過する場合の透過の程度を示す値である。','北緯35度の地点において、快晴の夏至の日における単位面積当たりの終日直達日射量は、南向き鉛直面よりも東向き鉛直面のほうが大きい。','輝度が一様な曇天空下で、測定点での窓の立体角が等しい場合、南面のみに側窓がある室内よりも天窓のみがある室内のほうが、測定点から南面向きに測定した鉛直面照度が低くなる。','春分・秋分の日において、水平面上に立てた鉛直棒の直射日光による影の先端の軌跡は、ほぼ直線となる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'環境・設備',no:7,text:'照明に関する次の記述のうち、最も不適当なものはどれか。',choices:['光束は、放射束に対して比視感度で重みづけし、可視光範囲で積分した量である。','照度は、受照面が均等拡散面の場合、輝度と反射率の積に比例する。','CIE標準晴天空の輝度は、太陽周辺で最も高く、天頂を挟んで太陽から約90°離れた部分で最も低くなる。','UGR（屋内統一グレア評価値）は、人工照明のまぶしさを評価するための指標で、一般に、面積の広い窓面のグレアには適用しない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'環境・設備',no:8,text:'色彩に関する次の記述のうち、最も不適当なものはどれか。',choices:['オストワルト表色系では、理想的な黒、理想的な白及びオストワルト純色を定義しているが、明度の属性がない。','マンセル表色系における彩度の最大値は、色相によって異なり、10を超えることもある。','加法混色の三原色は、シアン、マゼンタ及びイエローである。','明所視において、ある面からの放射エネルギーが同じ場合、一般に、赤よりも緑のほうが明るく感じられる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'環境・設備',no:9,text:'音響に関する次の記述のうち、最も不適当なものはどれか。',choices:['障壁において生ずる回折による音の減衰効果は、一般に、高音域よりも低音域のほうが高い。','交通量の多い道路を無限に長い線音源と想定した場合には、受音点までの距離が2倍になるごとに、音圧レベルは約3 dBずつ減衰する。','拡散音場とみなせる室においては、音響パワーが一定の音源がある場合、室の平均吸音率が2倍になると、室内の音圧レベルは約3 dB減少する。','学校の普通教室においては、平均吸音率が0.2程度となるように、吸音対策を施すことが望ましい。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'環境・設備',no:10,text:'吸音・遮音に関する次の記述のうち、最も不適当なものはどれか。',choices:['開放窓は音波が全て透過するので、音響透過率も、吸音率も1になる。','多孔質吸音材料の表面を通気性の低い材料によって被覆すると、高周波数域の吸音率が低下する。','単層壁への平面波入射において、一般に、垂直に入射する場合が最も遮音性能が高く、入射方向が斜めになるに従い、遮音性能は低下する。','床にコルクタイルを敷くことによって、一般に、重量床衝撃音の低減を図ることができる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'環境・設備',no:11,text:'図のような空気調和設備の方式A及びBに関する次の記述のうち、最も不適当なものはどれか。ただし、空調機、外調機及びターミナル空調機には、それぞれ、冷温水コイルは1つのみ設置されている。',choices:['方式A、方式Bともに、負荷に応じて風量を調整することができ、搬送動力の低減が可能である。','方式A、方式Bともに、低負荷時に導入外気量が不足することがある。','方式Aでは、室内湿度の微調整が難しいが、方式Bは、室内湿度の微調整が可能である。','方式Aでは、外気冷房はできないが、方式Bは、外気冷房が可能である。'],answer:4,hasFigure:true,figureDesc:'空気調和設備の方式Aと方式Bの系統図。方式Aはゾーン1～3のそれぞれに空調機を設置し、各空調機にOA（外気ダクト）を接続、各ゾーンにRA（還気ダクト）とSA（給気ダクト）を配し、変風量装置を設置。方式Bは外調機1台でOAを処理し、SA（給気ダクト）で各ゾーンに送気、各ゾーンにはターミナル空調機を設置し、RA（還気ダクト）とSA（給気ダクト）を配し、変風量装置を設置。'},
{year:2024,subject:'環境・設備',no:12,text:'空気調和設備・換気設備・排煙設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['中央熱源空調方式は、在館者の要望に対して個別に対応できないので、パーソナル空調には適さない。','同風量の外気取入れガラリと排気ガラリを比べると、外気取入れガラリのほうが、一般に、通過風速を遅くするので、必要な正面面積は大きくなる。','超高層ビルでは、冬期において、低層部から外気が流入し、高層部で外気が流出する傾向が強くなり、空調換気システムの給気と排気のバランスが崩れやすい。','隣接した2つの防煙区画において、一般に、防煙垂れ壁を介して一方の区画を自然排煙、他方の区画を機械排煙とすることはできない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'環境・設備',no:13,text:'事務所ビルの空気調和設備・換気設備の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['事務室の窓回りの温熱環境に配慮し、窓下部より室内空気を吸い込み、窓上部から天井内に排気する、エアフローウィンドウを採用した。','冷房負荷の計算において、事務室の内部発生熱負荷のうち、OA機器による負荷を15 W/m²とした。','事務室の冷房負荷は、年間を通して安定しているので、部分負荷を考慮せずに、ピーク負荷によって熱源設備を計画した。','地下に設けた自走式駐車場の換気設備は、経済性及び設置スペースを考慮して、誘引誘導方式を採用した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'環境・設備',no:14,text:'給水・給湯設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['事務所ビルにおいて、節水器具を使用した場合、一般に、在勤者1人当たりの設計用の1日の給水量を120～150 l程度で計画する。','事務所ビルにおいて、給水系統を飲用水と雑用水に分ける場合、一般に、飲用水30～40 %、雑用水60～70 %程度の使用水量の比率で計画する。','ガス瞬間式給湯機の給湯能力は、1 lの水の温度を1分間に25℃上昇させる能力を1号として表示される。','循環式の中央式給湯設備において、レジオネラ属菌の繁殖を防ぐためには、貯湯槽内の湯の温度を60℃以上に維持する必要がある。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'環境・設備',no:15,text:'排水設備等に関する次の記述のうち、最も不適当なものはどれか。',choices:['排水再利用水の原水に、手洗い・洗面器及び給湯室からの排水のほか、厨房からの排水も利用した。','排水槽において、排水の滞留及び汚泥ができるだけ生じないように底部に吸込みピットを設け、底部の勾配を1/5以上とした。','排水槽において、定期的に清掃及び保守点検を行うため、有効内径60 cmの防臭密閉型マンホールを2か所設けた。','雨水を便器洗浄水等で再利用した排水が下水道料金の対象となる地域において、雨水使用量を計測する量水器を設置した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'環境・設備',no:16,text:'電気設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['特別高圧受電となる超高層ビルにおいて、電力供給の信頼度を高めたい場合には、一般に、2回線受電方式やスポットネットワーク方式を採用する。','大規模な商業施設において、非常用の照明装置の予備電源には、経済性や保守性に配慮する場合、一般に、電源別置型を採用する。','中小規模の事務所ビルにおいて、照明・コンセント用幹線の配電方式には、一般に、単相3線式100 V/200 Vを採用する。','低圧受電となる戸建て住宅において、接地端子付きのコンセントの接地工事には、一般に、A種接地工事を採用する。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'環境・設備',no:17,text:'電気設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['電圧の種別において、交流の750 V以下のものは、低圧に区分される。','進相コンデンサは、負荷設備の力率を改善するために用いられる。','ガスタービンによる発電設備は、同一出力のディーゼル機関によるものと比べて、振動及び設置面積は小さくなるが、必要な燃焼用空気量は多くなる。','車両が通行する場所に、地中電線路を直接埋設式により施設する場合、原則として、土被りは120 cm以上とする。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'環境・設備',no:18,text:'消火設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['閉鎖型予作動式スプリンクラー設備は、予作動弁からヘッドまで圧縮空気を充填しておき、火災感知器と連動して放水する方式であり、損傷等による水損事故を防止する目的で開発されたものである。','連結散水設備は、地階の火災の際、消火活動を容易にするため、消防ポンプ車から送水して天井面等の散水ヘッドから放出し、消火する設備である。','泡消火設備は、液体燃料等の火災に対して有効な消火設備であり、駐車場、自動車整備場、指定可燃物の貯蔵所等への設置に適している。','屋内消火栓設備は、初期消火を目的とした消火設備であり、病院やホテルに設置する場合、一般に、1号消火栓を採用する。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'環境・設備',no:19,text:'建築設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['高層建築物の乗用エレベーターは、地震発生時の乗客の避難を図るため、地震感知器の作動により、速やかに避難階に帰着させて乗客を避難させる計画とする。','非常用エレベーターの籠の定格速度は、60 m/分以上としなければならない。','ノンフロン化を目指して空調用冷凍機等に用いられる自然冷媒には、アンモニア、二酸化炭素、水等がある。','防振架台上に設置される設備機器に対して設ける耐震ストッパは、設備機器の運転中に接触しない範囲で、設備機器との間が、極力小さな隙間となるように設置する。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'環境・設備',no:20,text:'環境・設備に関する次の記述のうち、最も不適当なものはどれか。',choices:['BELSは、新築及び既存建築物を対象として、エネルギー消費性能を第三者評価機関が評価し認証する制度である。','CASBEEは、建築物や街区、都市などに係わる環境性能を総合的に評価するためのツールである。','LEEDは、人の健康やウェルネスに着目した、建築物や街区の環境性能評価システムである。','DR（デマンドレスポンス）は、電力需要側が供給状況に応じて電力消費パターンを変化させて、電力需給バランスを調整する仕組みである。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:1,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['建築物に設ける消火用の貯水槽は、「建築設備」に該当する。','建築材料の品質における「安全上、防火上又は衛生上重要である建築物の部分」には、屋外階段で防火上重要であるものとして国土交通大臣が定めるものも含まれる。','高さ4mの記念塔の工事用の図面は、「設計図書」に含まれる。','同一敷地内に二つの地上2階建ての建築物(延べ面積はそれぞれ400m²及び200m²とし、いずれも耐火構造の壁等はないものとする。)を新築する場合において、当該建築物相互の外壁間の距離を5mとする場合は、二つの建築物は「延焼のおそれのある部分」を有している。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:2,text:'面積、高さ又は階数に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['建築物の敷地内に都市計画において定められた計画道路(都市計画法等による新設又は変更の事業計画のある道路で、2年以内にその事業が執行される予定のものとして特定行政庁が指定したものを除く。)がある場合において、特定行政庁の許可を受けて当該計画道路を容積率の算定に当たっての前面道路とみなす場合は、当該敷地のうち計画道路に係る部分の面積は、敷地面積又は敷地の部分の面積に算入しない。','北側高さ制限において、建築物の敷地が北側で公園に接する場合、当該公園に接する隣地境界線は、当該公園の幅の1/2だけ外側にあるものとみなす。','前面道路の境界線から後退した建築物の各部分の高さの制限において、当該建築物の後退距離の算定の特例を受ける場合の「軒の高さ」の算定については、前面道路の路面の中心からの高さによる。','建築物の敷地が斜面又は段地である場合その他建築物の部分によって階数を異にする場合においては、これらの階数のうち最大なものを、当該建築物の階数とする。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:3,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['原動機を使用する観覧車の築造については、確認済証の交付を受けなければならない。','延べ面積3,000m²、地上3階建ての病院の避難施設等に関する工事の施工中において当該建築物を使用する場合においては、建築主は、あらかじめ、当該工事の施工中における当該建築物の安全上、防火上又は避難上の措置に関する計画を作成して特定行政庁に届け出なければならない。','高さが60mを超える建築物を建築しようとする場合において、建築主は、所定の構造計算によって安全性が確かめられたものとして国土交通大臣の認定を受ける必要があるが、都道府県知事又は指定構造計算適合性判定機関の構造計算適合性判定を受ける必要はない。','鉄骨造、地上8階建ての共同住宅の増築の工事で、避難施設等に関する工事を含むものをする場合においては、建築主は、原則として、検査済証の交付を受けた後でなければ、当該避難施設等に関する工事に係る建築物又は建築物の部分を使用することができない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:4,text:'建築物の用途の変更に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、増築、改築、大規模の修繕又は大規模の模様替を伴わないものとする。',choices:['商業地域内において、鉄筋コンクリート造、延べ面積400m²、地上3階建ての診療所(患者の収容施設があるもの)の用途を変更して、地域活動支援センターとする場合においては、確認済証の交付を受ける必要がない。','鉄筋コンクリート造、延べ面積800m²、地上2階建ての劇場の用途を変更して、公会堂とする場合においては、確認済証の交付を受けなければならない。','原動機の出力の合計が3.0kWの空気圧縮機を使用する自動車修理工場において、その建築後に用途地域が変更されたため、原動機の出力の合計が現行の用途地域の規定に適合せず、建築基準法第3条第2項の規定の適用を受けているものについては、原動機の出力の合計を3.5kWに変更することができる。','建築物の用途の変更についての確認済証の交付を指定確認検査機関から受けた場合においては、建築主は、建築物の用途の変更に係る工事が完了したときは、当該指定確認検査機関に届け出なければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:5,text:'イ～ニの記述について、建築基準法上、正しいもののみの組合せは、次のうちどれか。',choices:['イとロ','イとニ','ロとハ','ハとニ'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:6,text:'防火区画、防火壁及び防火床に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['主要構造部を耐火構造とした建築物について、区画された部分の床面積を3,000m²とする場合の自動式のスプリンクラー設備を設けた部分の床面積には、手動式の補助散水栓による部分の床面積は含まれない。','給水管、配電管等が防火壁又は防火床を貫通する場合においては、当該管等と当該防火壁又は防火床との隙間をモルタルその他の不燃材料で埋めなければならない。','耐火建築物及び準耐火建築物以外の延べ面積が1,000m²を超える木造の小学校は、原則として、床面積の合計1,000m²以内ごとに準耐火構造の防火壁又は防火床で有効に区画しなければならない。','避難階が地上1階であり、地下1階から地上2階の各階に居室を有する事務所の用途に供する建物で、主要構造部を耐火構造としたものにおいては、地下1階から地上2階に通ずる階段の部分とその他の部分との区画に用いる防火設備は、避難上及び防火上支障のない遮煙性能を有するものでなければならない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:7,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['準防火地域内における共同住宅の屋根の構造は、市街地における通常の火災による火の粉により、防火上有害な発炎をしないものであり、かつ、屋内に達する防火上有害な溶融、亀裂その他の損傷を生じないものでなければならない。','耐火構造の耐力壁と準耐火構造の耐力壁は、いずれも、通常の火災による火熱がそれぞれについて定められた時間加えられた場合に、加熱終了後も構造耐力上支障のある変形、溶融、破壊その他の損傷を生じないものでなければならない。','防火構造として、建築物の軒裏の構造は、軒裏に建築物の周囲において発生する通常の火災による火熱が加えられた場合に、加熱開始後30分間当該加熱面以外の面(屋内に面するものに限る。)の温度が可燃物燃焼温度以上に上昇しないものでなければならない。','準防火性能に関する技術的基準に適合する構造として、建築物の耐力壁以外の外壁の構造は、外壁に建築物の周囲において発生する通常の火災による火熱が加えられた場合に、加熱開始後20分間当該加熱面以外の面(屋内に面するものに限る。)の温度が可燃物燃焼温度以上に上昇しないものでなければならない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:8,text:'避難施設等に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['建築物の高さ31m以下の部分にある3階以上の各階において、非常用の進入口の設置が必要な場合、外壁面の長さ40m以内ごとにこれを設けなければならない。','地上23階建てのホテルの特別避難階段について、15階以上の各階における階段室及びこれと屋内とを連絡するバルコニー又は付室の床面積(バルコニーで床面積がないものにあっては、床部分の面積)の合計は、当該階に設ける各居室の床面積に3/100を乗じたものの合計以上としなければならない。','主要構造部が耐火構造である地上5階建ての共同住宅において、各階の居室の床面積の合計が200m²である場合、避難階以外の階から避難階又は地上に通ずる2以上の直通階段を設けなくてもよい。','延べ面積1,200m²、地上3階建ての集会場の客用に供する屋外への出口の戸は内開きとはせず、敷地内には当該出口から道又は公園、広場その他の空地に通ずる幅員が1.5m以上の通路を設けなければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:9,text:'次の記述のうち、建築基準法に適合しないものはどれか。',choices:['一戸建て住宅の窓のない床面積30m²のシアタールームについて、これを区画する主要構造部を耐火構造とする代わりに、自動火災報知設備を設置した。','屋内から屋外避難階段に通ずる出入口に、通常の火災による火熱が加えられた場合に、加熱開始後10分間当該加熱面以外の面に火炎を出さない防火設備を設置した。','耐火建築物である地上2階建ての映画館において、客席(天井の高さが7m)の床面積の合計を500m²としたので、客席の壁及び天井の室内に面する部分の仕上げを、難燃材料とした。','延べ面積200m²、平家建ての自動車車庫において、当該用途に供する部分の壁及び天井の室内に面する部分の仕上げを、準不燃材料とした。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:10,text:'建築設備に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、エレベーター及びエスカレーターは、所定の特殊な構造又は使用形態のものを除くものとする。',choices:['非常用エレベーターの乗降ロビーの構造が、通常の火災時に生ずる煙が乗降ロビーを通じて昇降路に流入することを有効に防止できるものとして、国土交通大臣が定めた構造方法を用いるもの又は国土交通大臣の認定を受けたものである場合においては、バルコニーの設置を要しない。','排煙設備及び非常用エレベーターを設けた建築物の中央管理室は、排煙設備の制御及び作動状態の監視並びに非常用エレベーターの籠を呼び戻す装置の作動を行うことができるものとしなければならない。','特定行政庁が衛生上特に支障があると認めて規則で指定する区域における処理対象人員400人の合併処理浄化槽は、原則として、放流水に含まれる大腸菌群数が3,000個/cm³以下、かつ、通常の使用状態において、生物化学的酸素要求量の除去率が70%以上、合併処理浄化槽からの放流水の生物化学的酸素要求量が60mg/l以下とする性能を有するものでなければならない。','建築物に設けるエスカレーターで、踏段面の水平投影面積が13m²であるものの踏段の積載荷重は、33kNとすることができる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:11,text:'建築物の構造計算に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、高さが4mを超える建築物とする。',choices:['鉄筋コンクリート造の建築物において、保有水平耐力計算によって安全性を確かめる場合、構造耐力上主要な部分である柱の帯筋比は、0.2%以上としなくてもよい。','鉄筋コンクリート造の建築物において、保有水平耐力計算によって安全性を確かめる場合、耐力壁の厚さは、12cm以上としなくてもよい。','鉄骨造の建築物において、限界耐力計算によって安全性を確かめる場合、高力ボルト、ボルト又はリベットの相互間の中心距離は、その径の2.5倍以上としなくてもよい。','鉄筋コンクリート造の建築物において、限界耐力計算によって安全性を確かめる場合、柱の出すみ部分の異形鉄筋の末端は、かぎ状に折り曲げて、コンクリートから抜け出ないように定着しなくてもよい。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:12,text:'鉄筋コンクリート造、高さ31mの建築物の構造計算に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['許容応力度等計算を行う場合、建築物の地下部分の各部分に作用する地震力は、当該部分の固定荷重と積載荷重との和に、原則として、所定の式に適合する地震層せん断力係数を乗じて計算しなければならない。','許容応力度等計算を行う場合、建築物の地上部分については、所定の地震力によって各階に生ずる層間変形角が所定の数値以内であることを確かめなければならない。','保有水平耐力計算を行う場合、各階の剛性率がそれぞれ6/10以上であることを確かめなくてもよい。','限界耐力計算によって安全性を確かめた場合には、保有水平耐力計算又はこれと同等以上に安全性を確かめることができるものとして国土交通大臣が定める基準に従った構造計算を行わなくてもよい。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:13,text:'建築物の構造計算に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['建築物の実況によらないで、柱の垂直荷重による圧縮力を計算する場合、教室で柱の支える床の数が2のときは、床の積載荷重として採用する数値を1,995N/m²とすることができる。','木材の繊維方向における、長期に生ずる力に対する引張りの許容応力度は、原則として、木材の種類及び品質に応じて国土交通大臣が定める引張りに対する基準強度の1.1/3の数値である。','ステンレス鋼の高力ボルトの引張りに対する材料強度は、鋼材等の種類及び品質に応じて国土交通大臣が定める基準強度と同じ数値である。','鋼材の突合せ溶接における、溶接継目ののど断面に対する、短期に生ずる力に対するせん断の許容応力度は、溶接される鋼材の種類及び品質に応じて国土交通大臣が定める溶接部の基準強度の1/(1.5√3)の数値である。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:14,text:'都市計画区域内の道路に関する次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['その地方の気候などにより必要な場合には、特定行政庁により道路の幅員を6m以上とする区域が指定されることがある。','自動車のみの交通の用に供する道路のみに接している敷地には、原則として、建築物を新築することができない。','道路の地盤面下に、建築物に附属する地下通路を設ける場合には、特定行政庁の許可を受けることなく新築することができる。','地区計画等の区域内において、建築物の敷地内に予定道路が指定された場合、当該予定道路の上空に設けられる渡り廊下は、特定行政庁の許可を受けることなく新築することができる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:15,text:'建築物の用途の制限に関する次の記述のうち、建築基準法上、誤っているものはどれか。ただし、用途地域以外の地域、地区等の指定はなく、また、特定行政庁の許可等は考慮しないものとする。',choices:['田園住居地域内において、「延べ面積700m²、平家建ての老人福祉センター」は、新築することができる。','近隣商業地域内において、「延べ面積1,000m²、地上2階建ての日刊新聞の印刷所」は、新築することができる。','全ての用途地域内において、「延べ面積500m²、地上2階建ての地方公共団体の支所」は、新築することができる。','用途地域の指定のない区域(市街化調整区域を除く。)内において、「延べ面積10,000m²、地上2階建ての店舗」は、新築することができる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:16,text:'図のような敷地において、建築基準法上、新築することができる建築物の容積率の算定の基礎となる延べ面積の最大のものは、次のうちどれか。ただし、図に記載されているものを除き、地域、地区等及び特定行政庁の指定、許可等は考慮しないものとする。',choices:['640m²','720m²','800m²','810m²'],answer:1,hasFigure:true,figureDesc:'敷地が商業地域（都市計画で定められた容積率50/10）と準住居地域（都市計画で定められた容積率40/10）にまたがっている。敷地の北側に8mの道路、その東に10mと10mの区画がある。敷地の南側に川があり、その南に宅地がある。東側の南端に建築基準法第42条第2項の規定に基づき特定行政庁が指定した道（幅員2m）がある。敷地は隣地に囲まれ、北側道路に面し、南側は川に面している。敷地の奥行きは10m、川の幅は6mである。'},
{year:2024,subject:'法規',no:17,text:'図のような敷地において、建築物を新築する場合、建築基準法上、A点における地盤面からの建築物の高さの最高限度は、次のうちどれか。ただし、敷地は平坦で、敷地、隣地及び道路の相互間に高低差はなく、門、塀等はないものとする。また、図に記載されているものを除き、地域、地区等及び特定行政庁による指定、許可等並びに天空率に関する規定は考慮しないものとする。なお、建築物は、全ての部分において、高さの最高限度まで建築されるものとする。',choices:['20.00m','23.75m','25.00m','26.25m'],answer:3,hasFigure:true,figureDesc:'第二種中高層住居専用地域（都市計画で定められた容積率20/10）の敷地。日影による中高層の建築物の高さの制限に係る条例は制定されていない。敷地は南側に12m幅の道路（両側に2mの歩道）に面し、北側・東側・西側は隣地に接する。敷地の南北方向の寸法は北から3m+10m+5m=18m、道路は10m幅。建築物は敷地内に配置され、A点は建築物の南西角の1m内側付近に位置する。真北は左上方向。'},
{year:2024,subject:'法規',no:18,text:'図のような敷地において、用途上不可分の関係にあるA～Dの建築物を新築する場合、建築基準法上、誤っているものは、次のうちどれか。ただし、いずれの建築物も防火壁を設けていないものとし、建築物に附属する門又は塀はないものとする。また、図に記載されているものを除き、地域、地区等の制限については考慮しないものとし、危険物の貯蔵等は行わないものとする。',choices:['Aは、耐火建築物若しくは準耐火建築物又はこれらと同等以上の延焼防止時間となる建築物としなければならない。','Bは、耐火建築物若しくは準耐火建築物又はこれらと同等以上の延焼防止時間となる建築物としなければならない。','Cは、耐火建築物若しくは準耐火建築物又はこれらと同等以上の延焼防止時間となる建築物としなければならない。','Dは、耐火建築物又はこれと同等以上の延焼防止時間となる建築物としなければならない。'],answer:3,hasFigure:true,figureDesc:'敷地が防火地域、防火地域及び準防火地域の指定なしの区域、準防火地域の3つの区域にまたがっている。敷地の西側に道路（宅地に面する）、南側にも道路（宅地に面する）がある。東側は隣地に接する。建築物A（延べ面積90m²、地上2階建ての事務所棟）は防火地域内に配置。建築物B（延べ面積1,200m²、地上3階建ての事務所棟）は指定なし区域に配置。建築物C（延べ面積140m²、平家建ての自動車車庫棟）は防火地域と指定なし区域の境界付近に配置。建築物D（延べ面積400m²、地上4階建ての事務所棟）は準防火地域内に配置。'},
{year:2024,subject:'法規',no:19,text:'次の記述のうち、建築基準法上、誤っているものはどれか。ただし、特定行政庁の許可は考慮しないものとする。',choices:['一団地内に建築される1又は2以上の構えを成す建築物のうち、特定行政庁がその位置及び構造が安全上、防火上及び衛生上支障がないと認めるものに対する用途地域等による用途の制限の規定の適用については、当該一団地は一の敷地とみなされる。','建築協定は、都市計画区域及び準都市計画区域外であっても定められることがある。','都市計画において建築物の高さの限度が10mと定められた第二種低層住居専用地域内において、その敷地内に政令で定める空地を有し、かつ、その敷地面積が政令で定める規模以上である建築物であって、特定行政庁が低層住宅に係る良好な住居の環境を害するおそれがないと認めるものについては、建築物の高さの限度は、12mとすることができる。','避難階を1階とするホテルにおける3階以上の階の宿泊室(床面積が30m²を超えるもの)には、採光上有効な窓がある場合であっても、非常用の照明装置を設けなければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:20,text:'次の記述のうち、建築基準法上、誤っているものはどれか。',choices:['建築工事等における根切り及び山留めについては、その工事の施工中必要に応じて点検を行い、山留めを補強し、排水を適当に行う等これを安全な状態に維持するための措置を講ずるとともに、矢板等の抜取りに際しては、周辺の地盤の沈下による危害を防止するための措置を講じなければならない。','模様替の工事中に使用されている共同住宅について、特定行政庁により、避難上著しく支障があると認められた場合には、使用制限が命ぜられることがある。','建築基準法第3条第2項の規定により排煙設備の規定の適用を受けない建築物について、2以上の工事に分けて増築を含む工事を行う場合、特定行政庁による工事に係る全体計画の認定を受けていれば、いずれの工事の完了後であっても、現行基準に適合するように排煙設備を設置するための改修を行う必要はない。','建築基準法令の規定に違反することが明らかな増築の工事中の建築物については、緊急の必要があって所定の手続によることができない場合に限り、建築監視員により、これらの手続によらないで、当該工事の請負人等に対して、当該工事の施工の停止が命ぜられることがある。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:21,text:'建築士が行う「工事監理」に関する次の記述のうち、建築士法上、誤っているものはどれか。',choices:['工事監理受託契約の当事者は、延べ面積が300m²を超える建築物の新築に係る工事監理受託契約の締結に際して、工事監理の実施の状況に関する報告の方法や、工事監理に従事する建築士の氏名等を記載した書面を相互に交付しなければならない。','工事監理受託契約を締結しようとする者は、国土交通大臣が定めた報酬の基準に準拠した委託代金で工事監理受託契約を締結するよう努めなければならない。','工事監理を行う建築士は、工事監理の委託者から請求があったときには、建築士免許証又は建築士免許証明書を提示し、工事監理を終了したときには、直ちに、その結果を建築主に工事監理報告書を提出して報告しなければならない。','工事監理を行う建築士は、工事が設計図書のとおりに実施されていないと認めるときは、直ちに、工事施工者に対して、その旨を指摘し、当該工事を設計図書のとおりに実施するよう求め、当該工事施工者がこれに従わないときは、その旨を特定行政庁に報告しなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:22,text:'建築士事務所の開設者に係る「工事監理」に関する次の記述のうち、建築士法上、誤っているものはどれか。',choices:['建築士事務所の開設者は、工事監理の業務に関し生じた損害を賠償するために必要な金額を担保するための保険契約の締結その他の措置を講ずるよう努めなければならない。','建築士事務所の開設者は、工事監理の実績を含む「設計等の業務に関する報告書」を都道府県知事に事業年度ごとに提出しなかった場合、30万円以下の罰金に処せられる。','建築士事務所の開設者は、建築物の新築工事に係る工事監理の業務について、延べ面積が300m²以下の建築物であれば、委託者の許諾を得たうえで、一括して他の建築士事務所の開設者に委託することができる。','建築士事務所の開設者は、その建築士事務所の業務に関する工事監理報告書を、作成した日から起算して5年間保存しなければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:23,text:'建築士事務所の開設者と、当該建築士事務所に属する建築士(以下「所属建築士」という。)との関係に関する次の記述のうち、建築士法上、誤っているものはどれか。',choices:['建築士事務所の開設者は、所属建築士の監督及びその業務遂行の適正の確保に関する技術的事項を自ら総括しなければならない。','建築士事務所の開設者は、設計等を委託しようとする者の求めに応じて閲覧させる書類として、所属建築士の氏名及び業務の実績を記載したものを当該建築士事務所に備え置かなければならない。','建築士事務所の開設者は、当該建築士事務所を管理する専任の所属建築士を置かなければならない。','建築士事務所の開設者は、設計受託契約を建築主と締結しようとするときは、あらかじめ、当該建築主に対し、所属建築士から、設計受託契約の内容について、これらの事項を記載した書面を交付して説明をさせなければならない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:24,text:'次の記述のうち、都市計画法上、誤っているものはどれか。',choices:['市街化調整区域内における地区整備計画が定められた地区計画の区域内において、当該地区計画に定められた内容に適合する病院の建築の用に供する目的で行う開発行為は、所定の要件に該当すれば、都道府県知事の許可を受けることができる。','開発許可を受けた開発区域内において、都道府県知事の許可を受ける必要のない国土交通省令で定める軽微な変更をしたときは、遅滞なく、その旨を都道府県知事に届け出なければならない。','開発許可を受けた開発区域内の土地に用途地域等が定められている場合、当該開発行為に関する工事が完了した旨の公告があった後に、当該開発許可に係る予定建築物等以外の建築物を新築するときは、都道府県知事の許可を受けなければならない。','都市計画施設の区域内において、地階を有しない木造、地上2階建ての飲食店を新築する場合は、原則として、都道府県知事等の許可を受けなければならない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:25,text:'次の記述のうち、消防法上、誤っているものはどれか。ただし、建築物は、いずれも無窓階を有しないものとし、指定可燃物の貯蔵又は取扱いは行わないものとする。',choices:['延べ面積2,500m²、地上3階建ての倉庫に設ける屋内消火栓は、当該倉庫の階ごとに、その階の各部分から一のホース接続口までの水平距離が25m以下となるように設けなければならない。','延べ面積150m²、地上2階建ての飲食店については、消火器又は簡易消火用具を設置しなくてもよい。','物品販売業を営む店舗と共同住宅とが開口部のない耐火構造の床又は壁で区画されているときは、その区画された部分は、消防用設備等の設置及び維持の技術上の基準の規定の適用については、それぞれ別の防火対象物とみなす。','地上5階建ての大学には、避難口誘導灯を設けなくてもよい。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:26,text:'床面積の合計が2,000m²のホテルを新築しようとする場合における次の記述のうち、「高齢者、障害者等の移動等の円滑化の促進に関する法律」上、誤っているものはどれか。',choices:['客室の総数が120室の場合は、車椅子使用者用客室を2室以上設けなければならない。','車椅子使用者用駐車施設を設ける場合は、当該施設から利用居室までの経路の長さができるだけ短くなる位置に設けなければならない。','建築主等は、特定建築物の建築等及び維持保全の計画を作成し、所管行政庁の認定を申請しなければならない。','移動等円滑化経路を構成するエレベーター(所定の特殊な構造又は使用形態のものを除く。)の乗降ロビーの幅及び奥行きは、それぞれ150cm以上としなければならない。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:27,text:'次の記述のうち、「建築物のエネルギー消費性能の向上に関する法律」上、誤っているものはどれか。',choices:['建築主は、特定建築物の増築(非住宅部分の増築に係る部分の床面積の合計が300m²以上であるものに限る。)をしようとするときは、当該特定建築物(非住宅部分に限る。)を建築物エネルギー消費性能基準に適合するよう努めなければならない。','分譲型一戸建て規格住宅を1年間に150戸以上新築し、これを分譲することを業として行う建築主は、当該住宅をエネルギー消費性能の一層の向上のために必要な住宅の構造及び設備に関する基準に適合させるよう努めなければならない。','分譲型規格共同住宅等を1年間に1,000戸以上新築し、これを分譲することを業として行う建築主は、当該住宅をエネルギー消費性能の一層の向上のために必要な住宅の構造及び設備に関する基準に適合させるよう努めなければならない。','建築主等は、エネルギー消費性能の一層の向上のための建築物に設けた空気調和設備等の改修をしようとするときは、建築物エネルギー消費性能向上計画を作成し、所管行政庁の認定を申請することができる。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:28,text:'以下の条件に該当する建築物の新築に係る設計に際して、建築基準法その他の法令の規定の適用に関する設計者の判断として、次の記述のうち、誤っているものはどれか。',choices:['構造計算において、「応力度の計算等による構造耐力上主要な部分の安全性」、「層間変形角」、「屋根ふき材等における風圧に対する構造耐力上の安全性」、「各階の剛性率」、「各階の偏心率」及び「建築物の地上部分の地震に対する安全性」を確かめた。','「通常火災終了時間が80分」及び「特定避難時間が70分」と算出されたため、柱及びはりを80分間の性能を有する準耐火構造とした。','他の構造設計一級建築士に構造関係規定に適合するかどうかの確認を求めたが、他の設備設計一級建築士に設備関係規定に適合するかどうかの確認を求めなかった。','建築主に対して、5年の間隔をおいて、定期に、一級建築士若しくは二級建築士又は建築物調査員に建築物の状況の調査をさせ、かつ、その結果を特定行政庁に報告する義務がある旨を伝えた。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:29,text:'以下の条件に該当する建築物の新築に係る設計に際して、建築基準法その他の法令の規定の適用に関する設計者の判断として、次の記述のうち、誤っているものはどれか。',choices:['用途地域に基づく建築物の用途の制限に関し、住居の環境を害するおそれがないものとして特定行政庁の許可を受けることとした。','太陽光発電設備の設置によって容積率の最高限度を超えた建築計画となったことから、建築物のエネルギー消費性能が「建築物エネルギー消費性能誘導基準」に適合するように設計し、「建築物エネルギー消費性能向上計画」の認定を受けることとした。','2階から4階までの各階の売場から1階に通ずる直通階段を三つ設け、このうちの二つを「避難階段」とし、他の一つは「避難階段」及び「特別避難階段」のいずれにも該当しないものとすることとした。','1階における物品販売業を営む店舗と飲食店とを防火区画する代わりに、火災の発生を感知し、そのことを各階に報知することができる自動火災報知設備を設けることとした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'法規',no:30,text:'次の記述のうち、関係法令上、誤っているものはどれか。',choices:['「建築基準法」に基づき、工業地域内において、1日当たりの処理能力が6t以下の廃プラスチック類を破砕する産業廃棄物処理施設の用途に供する建築物は、特定行政庁の許可を受けずに新築することができる。','「景観法」に基づき、景観計画区域内において、建築物の外観を変更することとなる模様替をしようとする者は、原則として、あらかじめ、行為の種類、場所、設計又は施行方法等について、景観行政団体の長に届け出なければならない。','「土砂災害警戒区域等における土砂災害防止対策の推進に関する法律」に基づき、特別警戒区域内において、予定建築物が分譲住宅である開発行為をしようとする者は、原則として、あらかじめ、都道府県知事の許可を受けなければならない。','「宅地造成及び特定盛土等規制法」に基づき、特定盛土等規制区域内において、盛土で高さ3mの崖を生ずる工事をしようとする者は、原則として、当該工事に着手する日の30日前までに、都道府県知事に届け出なければならない。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'構造',no:1,text:'図のような断面のX軸に関する断面二次モーメントIと断面係数Zとの組合せとして、正しいものは、次のうちどれか。',choices:['I = (5/2)a⁴, Z = (5/4)a³','I = (5/2)a⁴, Z = 5a³','I = 10a⁴, Z = (5/4)a³','I = 10a⁴, Z = 5a³'],answer:4,hasFigure:true,figureDesc:'X軸に対して上下対称な階段状の断面図。中央にa×aの正方形、その上下にa×aの正方形、さらにその上下にa×(a/2)の長方形が配置されている。全体の幅は2a、高さは4a。'},
{year:2024,subject:'構造',no:2,text:'図のような梁において、梁のヒンジであるB点に鉛直力Pが作用したとき、A点、C点の鉛直反力RA、RCの絶対値の比として、正しいものは、次のうちどれか。ただし、梁は、曲げ剛性がAB間でEI、BC間で2EIの弾性部材とし、自重は無視する。',choices:['RA : RC = 1 : 1','RA : RC = 2 : 1','RA : RC = 4 : 1','RA : RC = 8 : 1'],answer:3,hasFigure:true,figureDesc:'A点（固定端）とC点（固定端）を持つ梁。B点はヒンジで、AB間の長さはl（曲げ剛性EI）、BC間の長さは2l（曲げ剛性2EI）。B点に鉛直力Pが下向きに作用。'},
{year:2024,subject:'構造',no:3,text:'図のようなラーメンに荷重6Pが作用したときの曲げモーメント図として、正しいものは、次のうちどれか。ただし、全ての部材の曲げ剛性はEIとし、自重は無視する。また、図のA点は自由端、B点は剛接合とし、曲げモーメントは材の引張側に描くものとする。',choices:['選択肢1の曲げモーメント図（左柱脚4Pl、左柱頭4Pl、梁右端6Pl、右柱脚2Pl、右柱頭2Pl）','選択肢2の曲げモーメント図（左柱脚2Pl、左柱頭4Pl、梁右端6Pl、右柱脚Pl、右柱頭2Pl）','選択肢3の曲げモーメント図（左柱脚2Pl、左柱頭2Pl、梁右端6Pl、右柱脚4Pl、右柱頭4Pl）','選択肢4の曲げモーメント図（左柱脚Pl、左柱頭2Pl、梁右端6Pl、右柱脚2Pl、右柱頭4Pl）'],answer:4,hasFigure:true,figureDesc:'門型ラーメン。左右に固定端の柱、上部に梁。B点（梁と右柱の交点）は剛接合、A点（右柱の上端）は自由端。梁の長さは2l、右柱の長さはl。A点に鉛直荷重6Pが下向きに作用。選択肢は4つの曲げモーメント図。'},
{year:2024,subject:'構造',no:4,text:'図のような筋かいを有する骨組に水平荷重180 kNが作用したとき、筋かいBCの引張力Tは100 kNであった。このとき、柱ABの柱頭A点における曲げモーメントの絶対値として、正しいものは、次のうちどれか。ただし、B点はピン支持、D点は固定支持とし、梁ACは剛体とする。また、柱ABと柱CDは等質等断面で伸縮はないものとし、全ての部材の自重は無視する。',choices:['60 kN・m','120 kN・m','180 kN・m','240 kN・m'],answer:1,hasFigure:true,figureDesc:'1層1スパンの骨組。左柱ABはB点（下端）がピン支持、右柱CDはD点（下端）が固定支持。梁ACは剛体。筋かいBCが左下から右上に設置され引張力T=100kN。左から水平荷重180kNが作用。柱の高さは3m、スパンは4m。'},
{year:2024,subject:'構造',no:5,text:'図のような荷重を受けるトラスの斜材A、B及びCに生じる軸方向力をそれぞれNA、NB及びNCとするとき、それらの比として、正しいものは、次のうちどれか。ただし、全ての部材は弾性部材とし、自重は無視する。',choices:['NA : NB : NC = 1 : 1 : 1','NA : NB : NC = 3 : 2 : 1','NA : NB : NC = 4 : 2 : 1','NA : NB : NC = 5 : 3 : 1'],answer:4,hasFigure:true,figureDesc:'6パネルのプラットトラス。上弦材と下弦材の間隔はl、各パネルの幅はl。左端がピン支持、右端がローラー支持。下弦材の各節点に等しい荷重Pが5箇所に下向きに作用。斜材A、B、Cはそれぞれ左から1番目、2番目、3番目のパネルの斜材。'},
{year:2024,subject:'構造',no:6,text:'図のような支持条件及び断面で同一材質からなる柱A、B及びCにおいて、中心圧縮の弾性座屈荷重の理論値PA、PB及びPCの大小関係として、正しいものは、次のうちどれか。ただし、固定支持部分の水平移動は拘束されているものとする。',choices:['PA < PB < PC','PA < PB = PC','PA = PB < PC','PC < PB < PA'],answer:2,hasFigure:true,figureDesc:'柱A：両端ピン、長さl、断面は(a/2)×(a/2)の正方形。柱B：両端固定、長さl、断面はa×aの正方形。柱C：一端自由・他端固定、長さl、断面は2a×2aの正方形。各柱に上から圧縮荷重PA、PB、PCがそれぞれ作用。'},
{year:2024,subject:'構造',no:7,text:'地震時における建築物の振動に関する次の記述のうち、最も不適当なものはどれか。',choices:['地震動の応答スペクトルは、一般に、周期が長くなると加速度は小さくなるが、変位は大きくなる傾向にある。','1次の振動モードに対応する周期は、一般に、2次の振動モードに対応する周期より長い。','建築物の固有周期は、質量が同じ場合、水平剛性が大きいほど短い。','建築物は、その固有周期又はそれに近い周期で加振される場合、一般に、減衰定数が大きいほど、大きい振幅の振動が発生する。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'構造',no:8,text:'建築基準法における荷重及び外力に関する次の記述のうち、最も不適当なものはどれか。',choices:['構造部材に生じる応力度等を計算するに当たり、多雪区域ではない一般の地域においては、暴風時又は地震時の荷重を、積雪荷重と組み合わせなくてもよい。','風圧力における平均風速の高さ方向の分布を表す係数Eは、建築物の高さが同じ場合、一般に、「都市計画区域外の極めて平坦で障害物がない区域」より「都市計画区域内の都市化が極めて著しい区域」のほうが小さい。','地震地域係数Zは、その地方における過去の地震の記録等に基づき、1.0〜0.7の範囲内において地方ごとに定められている。','建築物の地上部分において、ある階に作用する地震層せん断力は、その階の固定荷重と積載荷重との和に、その階の地震層せん断力係数Ciを乗じて算出する。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'構造',no:9,text:'木造軸組工法による建築物の柱又は横架材に関する次の記述のうち、最も不適当なものはどれか。',choices:['柱に心持ち材を用いる場合、背割りを入れることがある。','梁の横座屈を防止するためには、梁せいを大きくするよりも、梁幅を大きくするほうが効果的である。','母屋の継手は、できるだけ小屋束間の中央部付近に設ける。','床梁の中央部付近の上端に切欠きを設ける場合、床梁の有効な断面は、切欠きを除いた部分の断面(正味断面)とすることができる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'構造',no:10,text:'図のような1階平面を有する木造軸組工法による地上2階建ての建築物(屋根は日本瓦葺きとし、1階と2階の平面形状は同じであり、平家部分はないものとする。)の1階において、建築基準法における「木造建築物の軸組の設置の基準」(いわゆる四分割法)によるX方向及びY方向の壁率比の組合せとして、最も適当なものは、次のうちどれか。ただし、図中の太線は耐力壁を示し、その軸組の倍率(壁倍率)は全て2とする。なお、壁率比は次の式による。\n壁率比＝壁量充足率の小さい方／壁量充足率の大きい方\nここで、壁量充足率＝存在壁量／必要壁量',choices:['X方向: 0.50, Y方向: 0.75','X方向: 0.75, Y方向: 0.50','X方向: 0.75, Y方向: 1.00','X方向: 1.00, Y方向: 0.75'],answer:2,hasFigure:true,figureDesc:'1階平面図。10m×8mの矩形平面で、1mグリッドで区切られている。太線で耐力壁の位置が示されている。X方向とY方向の座標軸が示されている。'},
{year:2024,subject:'構造',no:11,text:'鉄筋コンクリート造の建築物において、「躯体に発生したコンクリートのひび割れの状況を示す図」と「その説明」として、最も不適当なものは、次のうちどれか。',choices:['矢印方向に荷重を受ける場合の「柱梁接合部のせん断ひび割れ」','柱梁接合部内に定着された梁上端筋が矢印方向に引張力を受ける場合の「柱梁接合部及び柱のひび割れ」','矢印方向に水平力を受ける場合の「開口を有する耐力壁のせん断ひび割れ」','矢印方向に柱の圧縮軸力及び杭の鉛直支持力を受ける場合の「2本杭の基礎スラブのひび割れ」'],answer:1,hasFigure:true,figureDesc:'4つの図と説明の組合せ。1：柱梁接合部にせん断ひび割れが生じた図。2：柱梁接合部で梁上端筋の引張による柱のひび割れ図。3：開口を有する耐力壁に水平力が作用しせん断ひび割れが生じた図。4：2本杭の基礎スラブに圧縮軸力と支持力が作用しひび割れが生じた図。'},
{year:2024,subject:'構造',no:12,text:'鉄筋コンクリート構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['純ラーメン架構の柱梁接合部内に、通し配筋で定着する梁については、地震時に梁端に曲げヒンジを想定し、梁主筋の引張強度を高くしたので、定着性能を確保するために、柱せいを大きくした。','鉄筋のガス圧接継手については、母材の引張強度ではなく、継手位置の存在応力度を伝達できる継手とした。','高層建築物の建築物重量の算出において、階により異なる強度のコンクリートを使用することとしたので、コンクリートの設計基準強度に応じて、異なる単位体積重量を用いた。','梁の許容曲げモーメントの算出において、圧縮力は、コンクリートのほか、圧縮側の主筋も負担するものとした。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'構造',no:13,text:'鉄筋コンクリート構造の許容応力度計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['柱の長期許容せん断力の算定において、帯筋の効果を考慮しなかった。','梁の長期許容せん断力を大きくするために、あばら筋をSD295からSD345に変更した。','梁の短期許容せん断力の算定において、主筋のせん断力の負担を考慮しなかった。','開口を有する耐力壁において、開口周囲の縦筋や横筋の負担分を考慮して、設計用せん断力に対して必要となる開口補強筋量を算定した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'構造',no:14,text:'鉄筋コンクリート構造の保有水平耐力計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['曲げ降伏する梁の靱性は、内法長さ、断面寸法及び配筋が同一の場合、一般に、コンクリートの設計基準強度が大きいほど高い。','柱のせん断耐力は、材料強度、断面寸法及び配筋が同一の場合、一般に、内法高さが小さいほど大きい。','柱梁接合部のせん断耐力は、材料強度及び柱梁接合部の形状が同一の場合、一般に、取り付く梁の主筋量が多いほど大きい。','耐力壁のせん断耐力は、材料強度、形状、壁筋比及び作用する軸方向応力度が同一の場合、一般に、引張側柱内の主筋量が多いほど大きい。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'構造',no:15,text:'鉄骨構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['H形鋼梁に横座屈変形が生じると、その領域で局部座屈が生じやすくなる。','地震時に梁端部が塑性化するH形鋼梁について、使用する鋼材の降伏比が大きいほど、塑性化領域が広がり、塑性変形能力は向上する。','骨組の塑性変形能力を確保するために定められているウェブの幅厚比の上限値は、基準強度Fが同じ場合、梁よりも柱のほうが小さい。','根巻き形式柱脚は、一般に、根巻き鉄筋コンクリートの主筋の降伏が、他の破壊モードよりも先行するように設計する。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'構造',no:16,text:'鉄骨構造の接合部に関する次の記述のうち、最も不適当なものはどれか。',choices:['強度の異なる鋼材を突合せ溶接する場合、強度が高いほうの鋼材に対応した溶接材料、溶接条件とすることにより、溶接継目の許容応力度は、強度が高いほうの鋼材と同じ許容応力度とすることができる。','通しダイアフラムと梁フランジの突合せ溶接部において、許容値を超える食い違いや仕口部のずれが生じた場合は、適切な補強を行う必要がある。','高力ボルト摩擦接合は、摩擦面にすべりが生じるまでは、高力ボルトにせん断力は生じない。','高力ボルトの最小縁端距離は、一般に、「せん断縁の場合」より「自動ガス切断縁の場合」のほうが小さい。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'構造',no:17,text:'鉄骨構造の耐震計算に関する次の記述のうち、最も不適当なものはどれか。',choices:['「ルート1−1」において、スパンは6 m以下とした。','「ルート1−2」において、偏心率の確認を行わず、標準せん断力係数を0.3として地震力を割増した。','「ルート2」において、地上部分の塔状比を4以下とした。','「ルート3」において、筋かい付き骨組の保有水平耐力は、柱及び筋かいの水平せん断耐力の和とした。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'構造',no:18,text:'鉄骨構造の設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['骨組の塑性変形能力を確保するために定められている柱及び梁の幅厚比の上限値は、基準強度Fが大きいほど大きくなる。','引張力を負担する筋かいを保有耐力接合とするためには、筋かい端部及び接合部の破断耐力を、軸部の降伏耐力に比べて十分に大きくする必要がある。','保有耐力横補剛の方法には、「梁の全長にわたって均等間隔に横補剛を設ける方法」と、「梁の端部に近い部分を主として横補剛する方法」等がある。','繰返し応力を受けない部材及び接合部は、一般に、疲労についての検討を必要としない。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'構造',no:19,text:'地盤及び土質に関する次の記述のうち、最も不適当なものはどれか。',choices:['圧密対策としては、鉛直ドレーン(排水工法)と盛土荷重などを組み合わせて圧密時間を短縮する方法が効果的である。','液状化対策としては、地盤固結(深層混合処理工法等)や、過剰間隙水圧の消散(グラベルドレーン工法等)などがある。','傾斜地盤の斜面の一部を切土によって除去して、その部分に建築物を建築する場合、切土によって除去された土の重量に比べて建築物の重量が大きいと、斜面の安定性は低下する。','砂質土層では、一般に、細粒分含有率が大きくなるほど、液状化発生に対する安全率FLは小さくなる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'構造',no:20,text:'基礎の設計のための地盤調査に関する次の記述のうち、最も不適当なものはどれか。',choices:['一軸圧縮試験は、拘束圧を作用させた状態における圧縮強さを調べるものであり、土の粘着力及び内部摩擦角を求めることができる。','スクリューウエイト貫入試験(旧スウェーデン式サウンディング試験)は、ロッドの先にスクリューポイントを取り付けた試験装置により、地盤の硬軟や締まり具合等を評価するための静的貫入抵抗を求めるものである。','平板載荷試験は、支持地盤上に置いた平板に載荷して地耐力を求めるものであり、載荷板直下から載荷板幅の1.5〜2.0倍程度の深さまでの支持力特性を調べることができる。','PS検層は、ボーリング孔内又はボーリング孔近傍で起振して生じる弾性波を受振して、調査地におけるP波及びS波の速度分布を求めるものである。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'構造',no:21,text:'杭基礎に関する次の記述のうち、最も不適当なものはどれか。',choices:['地盤条件や杭径などに応じて施工が確実に行える範囲で杭長を設定する場合、一般に、杭の長さ径比による杭体の許容圧縮力の低減はしなくてよい。','地震時に液状化のおそれのない地盤において、杭の極限鉛直支持力は、杭の種類や施工法に応じた極限先端支持力と極限周面抵抗力との和として算定できる。','複数の杭(群杭)が水平力を受けると、杭同士が地盤を介して影響し合うので、単杭と比較して群杭1本当たりの水平抵抗は大きくなる。','直接基礎と杭基礎が複合して上部構造を支えるパイルド・ラフト基礎は、一般に、直接基礎に比べて基礎の平均沈下量及び不同沈下量の低減に効果がある。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'構造',no:22,text:'「壁式ラーメン鉄筋コンクリート造」及び「壁式鉄筋コンクリート造」の建築物に関する次の記述のうち、最も不適当なものはどれか。',choices:['壁式ラーメン鉄筋コンクリート構造は、一般に、壁式鉄筋コンクリート構造に比べて、軒の高さの高い建築物に適用することができる。','壁式鉄筋コンクリート造の建築物における耐力壁の長さの算定において、住宅用の換気扇程度の大きさの開口は、補強をしなくても、開口がないものとみなすことができる。','壁式鉄筋コンクリート造の建築物における必要壁量は、地震地域係数Zに応じて低減することができる。','壁式鉄筋コンクリート造の建築物における壁梁の幅は、壁梁に接している耐力壁の厚さ以上とする。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'構造',no:23,text:'合成構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['コンクリート充填鋼管(CFT)造の柱においては、外周の鋼材によるコンファインド効果により、一定の要件を満足すれば、充填コンクリートの圧縮強度を、通常の鉄筋コンクリート造の場合に比べて高く評価することができる。','鉄骨鉄筋コンクリート造の柱の曲げ終局耐力は、コンクリート、鉄筋及び鉄骨の曲げ終局耐力の和とすることができる。','鉄骨造において、長期間の荷重によるデッキプレート版(デッキ合成スラブ)の変形増大係数は、梁と同じとすることができる。','鉄骨梁と鉄筋コンクリートスラブとを頭付きスタッドを介して緊結した合成梁の曲げ剛性の算定に用いる床スラブの有効幅は、鉄筋コンクリート梁の曲げ剛性の算定に用いる床スラブの有効幅と同じとすることができる。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'構造',no:24,text:'制振構造及び免震構造に関する次の記述のうち、最も不適当なものはどれか。',choices:['制振構造において、鋼材ダンパーのエネルギー吸収効率は、一般に、主架構とダンパーとの接合の構造形式をブレース型とするより、間柱型とするほうがよい。','制振構造において、鋼材ダンパーの制振効果を高めるために、一般に、ダンパーが十分塑性化してエネルギーを吸収するまで、ダンパーの接合部が弾性範囲にあることを確認する。','免震構造は、一般に、上部構造の水平剛性が大きくなると、上部構造の床応答加速度は小さくなる。','免震構造に用いられるオイルダンパー及び粘性ダンパーは、速度に応じた減衰力を発揮し、上部構造の床応答加速度を抑制する効果がある。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'構造',no:25,text:'建築物の耐震設計に関する次の記述のうち、最も不適当なものはどれか。',choices:['地震力を受ける鉄筋コンクリート造の耐力壁の耐力は、基礎が浮き上がることによって決まる場合がある。','剛性率が所定の値未満の階を有する建築物は、地震時に層崩壊を起こして被害を受けやすい。','設計用一次固有周期が長い建築物では、軟弱地盤に建つ場合よりも硬質地盤に建つ場合のほうが、一般に、各階の必要保有水平耐力は大きい。','限界耐力計算における安全限界固有周期は、建築物の地上部分の保有水平耐力時における各階の水平方向の変形により計算する。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'構造',no:26,text:'図は、剛床仮定が成り立つ、4階建て鉄筋コンクリート造の建築物の軸組図と1階平面図の模式図である。偏心によるねじれを小さくする方法として、最も不適当なものは、次のうちどれか。ただし、Sは剛心、Gは重心、Qは地震力(層せん断力)を示し、耐力壁の増減による重心位置の変更はないものとする。',choices:['耐力壁Aを厚くする。','耐力壁Bを追加する。','耐力壁Cを削除する。','耐力壁Dを追加する。'],answer:3,hasFigure:true,figureDesc:'4階建てRC造建築物の軸組図と1階平面図の模式図。平面図には柱・梁のグリッド、耐力壁の位置、剛心S、重心G、地震力Qの方向が示されている。剛心Sは重心Gより右上にずれている。選択肢の各耐力壁A〜Dの位置が平面図上に示されている。'},
{year:2024,subject:'構造',no:27,text:'木材に関する次の記述のうち、最も不適当なものはどれか。',choices:['垂木、根太等の並列材に構造用合板を張り、荷重・外力を支持する場合、並列材の曲げに対する基準強度は、割増しの係数を乗じた数値とすることができる。','無等級材の繊維方向の基準強度の引張、曲げ、せん断の大小関係は、せん断 < 曲げ < 引張である。','木材のクリープによる変形は、一般に、気乾状態より湿潤状態のほうが大きい。','木材が繊維飽和点から絶乾状態に達するまでの収縮率の大小関係は、一般に、繊維方向 < 半径方向 < 年輪の接線方向である。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'構造',no:28,text:'コンクリートに関する次の記述のうち、最も不適当なものはどれか。',choices:['水中養生したコンクリートは、一般に、気中養生したコンクリートに比べて、養生期間における圧縮強度の増進が大きい。','AE剤を用いたコンクリートは、一般に、凍結融解作用に対する抵抗性が増大する。','一軸圧縮を受けるコンクリート円柱試験体の圧縮強度時ひずみは、一般に、圧縮強度が大きいほど大きい。','構造体コンクリートから採取される円柱コア供試体の圧縮強度は、一般に、直径に対する高さの比が大きいほど大きい。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'構造',no:29,text:'鋼材に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築構造用圧延鋼材(SN材)には、A、B及びCの三つの鋼種があり、いずれもシャルピー衝撃試験の吸収エネルギーの下限値が定められている。','建築構造用ステンレス鋼材に定めるSUS304Aの基準強度は、板厚40 mm以下の建築構造用圧延鋼材SN400Bの基準強度と同じである。','建築構造用低降伏点鋼材LY225は、一般構造用圧延鋼材SS400に比べて降伏点が低く、延性が高いことから、履歴型制振ダンパーの材料に用いられている。','建築構造用冷間プレス成形角形鋼管BCP325(板厚12 mm以上)は、引張強さの下限値が490 N/mm²であり、「降伏点または耐力」の上限値及び下限値が定められている。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'構造',no:30,text:'「住宅の品質確保の促進等に関する法律」に基づく「日本住宅性能表示基準」における構造の安定に関する次の記述のうち、最も不適当なものはどれか。',choices:['基礎の構造の性能について表示すべき事項は、直接基礎にあっては、基礎の構造方法及び形式である。','「耐積雪等級」は、建築基準法施行令に規定する多雪区域に存する住宅に適用されるものである。','「耐風等級」は、暴風に対する構造躯体の倒壊、崩壊等のしにくさ及び構造躯体の損傷の生じにくさを表示している。','「耐震等級」には、等級1、等級2及び等級3があり、耐震性能の要求レベルが最も高いのは等級1である。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:1,text:'監理者が行う一般的な監理業務に関する次の記述のうち、「建築士事務所の開設者がその業務に関して請求することのできる報酬の基準(平成31年国土交通省告示第98号)」の内容に照らして、最も不適当なものはどれか。',choices:['監理者は、設計図書の内容を把握し、設計図書に明らかな矛盾、誤謬、脱漏、不適切な納まり等を発見した場合には、工事施工者に確認したうえで、設計者に報告する。','監理者は、設計図書の定めにより、工事施工者が提案又は提出する工事材料、設備機器等(当該工事材料、設備機器等に係る製造者及び専門工事業者を含む。)及びそれらの見本が設計図書の内容に適合しているかについて検討し、建築主に報告する。','監理者は、工事施工者から工事に関する質疑書が提出された場合には、設計図書に定められた品質(形状、寸法、仕上り、機能、性能等を含む。)確保の観点から技術的に検討し、必要に応じて建築主を通じて設計者に確認のうえ、回答を工事施工者に通知する。','監理者は、工事施工者から提出される請負代金内訳書の適否を合理的な方法により検討し、その結果を建築主に報告する。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:2,text:'工事現場の管理等に関する次の記述のうち、最も不適当なものはどれか。',choices:['公共性のある工作物に関する重要な建設工事で、監理技術者を専任で置かなければならない現場であっても、元請の監理技術者については、監理技術者補佐を当該工事現場に専任で置く場合には、2現場まで兼任することができる。','くい打機の巻上げ用ワイヤロープの安全係数は、ワイヤロープの切断荷重の値を当該ワイヤロープにかかる荷重の最大の値で除した値とし、3から5の間の値とする。','地上又は床上における補助作業の業務を除き、枠組足場の解体の業務には、満18歳に満たない者を就業させてはならない。','鉄筋コンクリート造で高さ40 mの煙突の解体工事を行う場合、当該工事を開始する日の14日前までに、建設工事計画届を労働基準監督署長へ届け出なければならない。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:3,text:'品質管理に関する次の記述のうち、最も不適当なものはどれか。',choices:['工事現場における木材の含水率は、1本の製材の異なる2面について、両木口から300 mm以上離れた2か所及び中央部1か所の計6か所を測定した値の平均とした。','鉄骨の建方における高力ボルト継手の仮ボルトについては、本接合のボルトと同軸径の普通ボルトで損傷のないものを使用し、1群に対して1/3以上、かつ、2本以上をバランス良く配置して締め付けた。','外気温の低い時期における普通ポルトランドセメントを用いたコンクリートの養生は、コンクリートを寒気から保護し、打込み後5日間以上、コンクリートの温度が2℃以上に保たれるようにした。','鉄筋の手動ガス圧接継手の外観検査については、1検査ロット(1組の作業班が1日に施工した圧接箇所の数量)から無作為に抜き取った30か所を対象とした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:4,text:'建築工事の届出等に関する次の記述のうち、最も不適当なものはどれか。',choices:['請負代金が100万円以上の建築物の改修工事において、事業者は、当該工事における石綿含有建材の有無について事前調査を行い、その結果を遅滞なく都道府県知事及び労働基準監督署長あてに報告した。','高さ15 mの枠組足場の組立てから解体までの期間を6か月とする計画としたので、事業者が、当該工事の開始の日の30日前までに、機械等設置届を労働基準監督署長あてに提出した。','騒音規制法による指定地域内において、特定建設作業を伴う建設工事を施工するに当たり、工事施工者が、当該特定建設作業の開始の日の7日前までに、特定建設作業実施届出書を都道府県知事あてに提出した。','消防署のある市町村において、設備等技術基準に従って設置しなければならない消防用設備を設置したので、防火対象物の関係者が、工事が完了した日から4日以内に、消防用設備等設置届出書を消防署長あてに提出した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:5,text:'仮設工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['防護棚(朝顔)は、地上から高さ5 mの位置に1段目を設け、1段目から9 m上部の位置に2段目を設けた。','高さ40 mの枠組足場の強度計算において、鉛直方向の荷重である足場の自重と積載荷重は建地で支持し、水平方向の風荷重は壁つなぎで支持しているものとみなして部材の強度の検討を行った。','単管足場の壁つなぎの設置間隔を、垂直方向5.0 m、水平方向5.4 mとし、地上第一の壁つなぎを地上より4.5 mの位置に設置した。','枠組足場の構面からの墜落防止措置として、交差筋かい及び高さ10 cmの幅木を設置した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:6,text:'土工事及び山留め工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['山留め壁に使用したソイルセメント壁の応力材を利用し、地下外壁・床版を一体化した合成壁とすることで、地下外壁の薄壁化を行った。','釜場による排水において、周辺の湧水を確実に集水するため、釜場が掘削底面の最も浅い場所に設置されるよう、掘削の進行に合わせて設置位置を変えた。','鋼矢板壁は、鋼矢板を相互にかみ合わせながら施工し、連続した山留め壁を構築できるので、比較的遮水性が高い工法であり、地下水位の高い地盤や軟弱地盤に用いた。','砂質土を用いた埋戻しにおける締固めには、振動ローラーを使用した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:7,text:'地業工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['アースドリル工法において、表層ケーシング以深の孔壁の保護に用いられる安定液については、孔壁の崩壊防止や、コンクリートとの置換を考慮して、コンクリートと比べて高粘性、かつ、高比重のものとした。','サンドコンパクションパイル工法の補給材として、再生砕石のRC−40を用いて締固めを行った。','既製コンクリート杭の施工精度は、特記がなかったので、鉛直精度1/100以内、杭心ずれ量を杭径の1/4以下、かつ、100 mm以下として管理した。','セメントミルク工法において、掘削中は孔壁の崩壊を防止するため安定液を使用し、アースオーガーが予定の支持層に達した後、根固め液を注入し、アースオーガーが正回転のまま杭周固定液を注入しながら引き抜いた。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:8,text:'鉄筋工事等に関する次の記述のうち、最も不適当なものはどれか。',choices:['コンクリート壁内に埋め込むCD管(合成樹脂製可とう電線管)は、バインド線を用いて1 m以下の間隔で鉄筋に結束し、コンクリート打設時に移動しないようにした。','径の異なる異形鉄筋の重ね継手の長さは、細いほうの鉄筋の径を基準とした。','SD345のD19とD22とが隣り合うときの鉄筋相互のあきについては、使用するコンクリートの粗骨材の最大寸法が20 mmであったので、25 mmとした。','鉄筋コンクリート造の鉄筋に対するコンクリートのかぶり厚さは、特記がなかったので、耐圧スラブを除く直接土に接する床について、4 cm以上確保できていることを確認した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:9,text:'型枠工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['コンクリート打放し仕上げ以外に用いるせき板は、特記がなかったので、「合板の日本農林規格」第5条「コンクリート型枠用合板の規格」による、表面がB、かつ、裏面がCの品質のものとし、厚さを12 mmとした。','計画供用期間の級が「標準」の柱のせき板の存置期間をコンクリートの材齢で決定する施工計画において、存置期間中の平均気温が25℃と予想されたので、高炉セメントB種を用いたコンクリートについては、せき板の存置期間を4日とした。','型枠設計用のコンクリートの側圧は、側圧を求める位置から上のコンクリートの打込み高さに、フレッシュコンクリートの単位体積重量を乗じた値とした。','普通コンクリートを用いた建築物の型枠の構造計算において、型枠に作用する鉛直荷重のうち固定荷重は、鉄筋を含んだ普通コンクリートの単位容積重量に部材厚さを乗じた値に、型枠重量を加えた値とした。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:10,text:'コンクリート工事における品質管理及び検査に関する次の記述のうち、最も不適当なものはどれか。',choices:['レディーミクストコンクリートの受入れ時の検査において、空気量及びスランプが許容差を超えたので、高性能AE減水剤の添加量を変更するとともに、水セメント比を変えて調合の調整を行った。','構造体コンクリート強度の判定において、標準養生した供試体の材齢28日の圧縮強度試験の1回の試験の結果が、調合管理強度以上であったので、合格とした。','普通ポルトランドセメントを用いたマスコンクリートの調合管理強度を定めるに当たって、特記がなく、コンクリートの打込みから材齢28日までの期間の予想平均養生温度が25℃を超えると予想されたので、構造体強度補正値を6 N/mm²とした。','構造体コンクリートの各部材の位置について、設計図書に示された位置との差が±20 mm以内であることを確認した。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:11,text:'コンクリート工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['同一区画のコンクリート打込み時における打重ね時間間隔の限度は、外気温が20℃であったので、先に打ち込まれたコンクリートの再振動可能時間の範囲内である120分とした。','マスコンクリートの打込み後、コンクリート内部の温度が著しく上昇したので、コンクリートを冷却することを目的として、打込み表面に散水した。','高流動コンクリートの打込みにおいて、コンクリートが材料分離することなく型枠内の隅々に自己充填できる状況であったので、内部振動機(棒形振動機)による締固めを行わなかった。','軽量コンクリートの圧送において、輸送管の水平換算距離が150 m以上であったので、輸送管の呼び寸法を125 Aとした。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:12,text:'プレキャスト鉄筋コンクリート工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['プレキャストの耐力壁の水平接合部に用いる敷モルタルは、現場水中養生による供試体の圧縮強度が、材齢28日において部材コンクリートの設計基準強度以上となるように管理した。','プレキャスト部材の製造に当たり、コンクリートの加熱養生については、前養生時間を3時間とし、養生温度の上昇勾配を18℃/hとした。','板状のプレキャスト部材の製造に当たり、脱型時にベッドを70〜80度に立て起こしてから吊り上げる計画としたので、脱型時所要強度は9 N/mm²とした。','プレキャスト部材は、搬入時に組立て用クレーンにより運搬車両から直接荷取りして組み立てた。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:13,text:'鉄骨工事における溶融亜鉛めっきに関する次の記述のうち、最も不適当なものはどれか。',choices:['溶融亜鉛めっき高力ボルト接合における一次締めトルクは、M16を約100 N・mとし、M20とM22を約150 N・mとした。','溶融亜鉛めっき高力ボルト接合において、本締めをナット回転法で行ったので、締付け完了後、ナットの回転量が不足しているものについては、所定の回転量まで追締めを行った。','溶融亜鉛めっきを施した鉄骨の接合部の摩擦面については、すべり係数が0.40以上確保することができるように、特記がなかったので、りん酸塩処理を行った。','F8TのM20の溶融亜鉛めっき高力ボルトの孔径については、F10TのM20の高力ボルトの最大孔径より1.0 mm大きくした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:14,text:'鉄骨工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['スタッド溶接において、施工に先立ち、適切な溶接条件を確認するため、スタッドの径の異なるごと、午前と午後それぞれ作業開始前に2本の試験スタッド溶接を行い、曲げ角度15度の打撃曲げ試験を行った。','スパン数の多い建築物は、柱梁接合部の溶接取縮により水平方向に柱の倒れ変形が生じるので、建築物の中央部等に調整スパンを設け、溶接完了後に調整スパンの梁を高力ボルトで取り付けた。','組立溶接については、溶接部に割れが生じないように、必要で十分な長さと4 mm以上の脚長をもつビードを適切な間隔で配置した。','保有水平耐力計算を行わない鉄骨造において、柱脚を基礎に緊結するに当たり、露出形式柱脚としたので、鉄骨柱のベースプレートの厚さは、アンカーボルトの径の1.3倍以上とした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:15,text:'木造軸組工法による木工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['構造用合板による大壁造の耐力壁において、山形プレートを用いて土台と柱とを接合する箇所については、山形プレート部分の構造用合板を切り欠いたので、その周辺には釘の増打ちを行った。','構造耐力上主要な部分に用いる製材の工事現場搬入時の含水率は、特記がなかったので、15％以下のものを合格とした。','基礎の立上がりが地面から40 cmである木造住宅において、木部に有効な防腐・防蟻措置を講ずる範囲は、地面から60 cm以内の部分とした。','構造用合板の耐力壁において、大壁造の床勝ち仕様(床の下地合板が先行施工されている仕様)であったので、壁倍率の基準の仕様を確認した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:16,text:'防水工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['シーリング工事において、鉄筋コンクリート造の建築物の外壁に設けるひび割れ誘発目地については、目地底にボンドブレーカーを使用せずに、シーリング材を充填する三面接着とした。','塗膜防水工事において、防水材塗継ぎの重ね幅を50 mmとし、補強布の重ね幅を100 mmとした。','アスファルト防水工事における密着工法において、アスファルトルーフィングの張付けに先立ち、防水上不具合のあるコンクリートの打継ぎ部及びひび割れ部は、幅50 mmの絶縁用テープを張り付け、その上に幅300 mmのストレッチルーフィングを増張りした。','アスファルト防水工事において、こて仕上げとする平場の保護コンクリートの厚さは、特記がなかったので、80 mmとした。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:17,text:'セメントモルタルによるタイル張り工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['屋内の吹抜け部分の壁タイル張り仕上げ面における打音検査は、モルタルが硬化した後、タイル用テストハンマーを用い、全面の1/2程度に対して行った。','外壁タイルの引張接着強度を確認する試験体の個数については、100 m²ごと及びその端数につき1個以上とし、かつ、全体で3個以上で実施した。','壁タイルの密着張りにおいて、タイルの目地の深さは、タイル厚さの1/2以下とした。','下地が高強度コンクリートであったので、目荒しの工法は超高圧水洗浄法とし、吐出圧は150〜200 N/mm²とした。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:18,text:'ガラス工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['アルミニウム製建具において、外部に面する複層ガラスを受ける下端ガラス溝に、径6 mm以上の水抜き孔を2か所以上設けた。','ガラスブロック積み工法において、ガラスブロック平積みの目地幅の寸法については、特記がなかったので、6 mmとした。','ガラスの熱割れ防止のため、建築物の立地、開口部の方位、ガラスの光特性・熱特性等によりガラスエッジに発生する熱応力を算出し、ガラスエッジの許容応力と比較した。','ガラスの表面のサンドブラスト加工に当たって、加工深さを板厚の1/12未満とした。'],answer:2,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:19,text:'金属工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['軽量鉄骨壁下地のスタッドは、ねじれのないものを使用し、上部ランナーの上端とスタッド天端の隙間を10 mm以下とした。','軽量鉄骨壁下地において、出入口の開口補強に用いる長さ4.5 mの縦枠の補強材は、特記がなかったので、65形のスタッドを2本抱き合わせて、上下端部及び間隔600 mmに溶接したものを用いた。','軽量鉄骨天井下地において、野縁及び野縁受けは、特記がなかったので、屋内には19形、屋外には25形を使用した。','軽量鉄骨天井下地において、野縁を野縁受けに留め付けるクリップは、野縁のひずみを防止するため、つめの向きをそろえた。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:20,text:'設備工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['コンクリート埋込みのボックス及び分電盤の外箱は、コンクリートの打込み時に位置がずれないように、型枠に堅固に取り付けた。','自動火災報知設備の差動式スポット型感知器は、換気口等の空気吹出し口から1.5 m以上離れた位置に設置した。','雑用水管について、雑用水系統と飲料水系統との誤接続がないことを確認するため、衛生器具等の取付け完了後、雑用水に着色して通水試験を行った。','屋内の横走り排水管の勾配の最小値は、管の呼び径50を1/100とし、呼び径75を1/150とした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:21,text:'各種工事等に関する次の記述のうち、最も不適当なものはどれか。',choices:['屋根保護防水密着断熱工法を採用したルーフドレン回りの断熱材は、ルーフドレンのつばの150 mm手前で止めたので、断熱材の欠損部には、熱橋部の結露防止のために、スラブ下に断熱材を施した。','戸建て住宅の浴室の換気設備工事において、雨仕舞に優れたベントキャップを採用し、排気ダクトは屋外に向かって先下がり勾配とした。','フローリング張りの釘留め工法において、壁、幅木、敷居などとフローリング材との取合いには、フローリング材が動かないよう隙間を設けないこととした。','シーリング工事において、ガラス部材同士の組合せについては、特記がなかったので、シリコーン系シーリング材を使用した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:22,text:'鉄筋コンクリート造の耐震改修工事及びあと施工アンカーに関する次の記述のうち、最も不適当なものはどれか。',choices:['あと施工アンカーの施工後の確認試験において不合格となったので、その至近の位置に再施工をし、再施工をした全てのあと施工アンカーに対して施工確認試験を行った。','鉄骨枠付きブレースのスタッド溶接完了後の外観試験において、溶接後の仕上がり高さと傾きの試験については、スタッドの種類及びスタッド溶接される部材が異なるごと、かつ、100本ごと及びその端数を試験ロットとし、各ロットの1本以上について抜取試験を行った。','連続繊維補強工事におけるプライマーの塗布については、コンクリート表面を十分に湿潤させてから行った。','現場打ち鉄筋コンクリート壁の増設工事において、コンクリートの打込みを流込み工法にて行う場合、打込み高さが大きかったので、コンクリート投入口を2段以上とした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:23,text:'各種改修工事に関する次の記述のうち、最も不適当なものはどれか。',choices:['既存のウレタンゴム系塗膜防水を撤去せず、新規にウレタンゴム系塗膜防水を施す改修工事において、既存防水層の膨れ部分については、カッターナイフで切除し、ポリマーセメントモルタルで平滑に補修した。','タイル張り仕上げ外壁の改修において、小口平タイル以上の大きさのタイル陶片の浮きについては、注入口付アンカーピンニングエポキシ樹脂注入タイル固定工法により行った。','鉄筋の腐食に対する補修工法として、斫り出して錆を除去した鉄筋に、再腐食を防止するために浸透性吸水防止材を塗布した後、コンクリートの欠損部にポリマーセメントモルタルを充填した。','既存のアスファルト防水層を撤去し、密着工法により新設する防水改修工事において、新設する防水層の1層目のルーフィング張りまで行ったので、作業終了後のシートによる降雨に対する養生を省略した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:24,text:'建築工事に関する用語とその説明との組合せとして、最も不適当なものは、次のうちどれか。',choices:['クラックスケール ── コンクリート等に発生したひび割れの長さの測定に用いる器具である。','複層ガラス ── 2枚以上のガラスをスペーサーで一定の間隔に保ち、周囲を封着材で密閉し、内部に乾燥気体を満たしたガラスである。','インバート ── 排水系統において、汚水ますやマンホールの底部に設けられる下面を半円形に仕上げた導水溝である。','スランプ ── 高さ30 cmのスランプコーンにコンクリートを3層に分けて詰め、コーンを引き上げた直後の、コンクリートの頂部からの下がりを計測した数値である。'],answer:1,hasFigure:false,figureDesc:''},
{year:2024,subject:'施工',no:25,text:'建築物の工事請負契約に関する次の記述のうち、民間(七会)連合協定「工事請負契約約款」(令和5年1月改正)に照らして、最も不適当なものはどれか。',choices:['監理者は、工事の内容、工期又は請負代金額の変更に関する書類を技術的に審査する。','受注者は、設計図書等に発注者又は監理者の立会いのうえ施工することを定めた工事を施工するときは、事前に発注者又は監理者に通知する。','施工について、工事用図書のとおりに実施されていない部分があると認められるときは、原則として、監理者の指示によって、受注者は、その費用を負担して速やかにこれを修補又は改造し、このための工期の延長を求めることはできない。','部分使用とは、発注者が工事中に契約の目的物の一部を使用する場合に、法定検査を受けて建築確認申請の要件を満たしたうえで、当該部分の引渡しを受けて使用することである。'],answer:4,hasFigure:false,figureDesc:''}
,
{year:2023,subject:'計画',no:1,text:'建築士の行う設計業務等に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築士は、建築に係る専門家として、非専門家との間の知識や情報等の格差を埋める責任があり、アカウンタビリティ(専門家としての説明責任)の実践が求められる。','建築士は、本来、国家資格者にふさわしい国民の生命や財産を守る技術的資質や能力を自ら保持すべきとされ、同時に業務独占を賦与された資格者として高い倫理性を求められる。','プロジェクト達成にとってのリスク(不都合な情報)の積極的な共有による集団内での意思疎通をリスクコミュニケーションといい、その実践が特に重要である。','建築士が専門家として建築関連の法令を遵守する基本的な態度をコンプライアンスといい、遵守すべき対象は法令に限定されている。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'計画',no:2,text:'日本の歴史的な建築物に関する次の記述のうち、最も不適当なものはどれか。',choices:['宇佐神宮本殿(大分県)は、独立した前殿と後殿を切妻造り・平入りとし、両殿を相の間でつないだ、八幡造りの建築物である。','円覚寺舎利殿(神奈川県)は、内部を化粧屋根裏とし、柱上に組物を置かず、挿肘木で軒荷重を支える、大仏様の建築物である。','箱木家住宅(兵庫県)は、屋根を棟束で支え、柱間が長く、内法高の低い、現存最古級の一つと推定されている民家である。','妙喜庵待庵(京都府)は、二畳隅炉に次の間をもつ、16世紀末頃に建てられたと推定されている草庵風茶室である。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'計画',no:3,text:'建築や都市に関する著作物とその説明との組合せとして、最も不適当なものは、次のうちどれか。',choices:['『広場の造形(芸術的原理に基づく都市計画)』(カミロ・ジッテ、1889年) ── ヨーロッパ各地の歴史的な広場を分析することで、中世の街並みに起源をもつ自然発生的な都市空間の構成を再評価し、そのスケール感や空間感覚を学ぶことの重要性を主張した。','『装飾と犯罪(装飾と罪悪)』(アドルフ・ロース、1908年) ── 建築の快適性や有用性といった実用的な側面を重視し、文化としての生活との有機的関連性を欠き、実用に資することのない表面的な装飾が不要であることを主張した。','『空間・時間・建築』(ジークフリート・ギーディオン、1941年) ── 「空間」という概念を前面に押し出し、近代建築を西欧の建築の歴史的な流れの中にあらためて位置づけることを試み、近代建築のもつ特徴や理論の正当性を主張した。','『都市の建築』(アルド・ロッシ、1966年) ── 歴史上の建築を例に、曖昧さや複雑さのある建築の魅力を伝え、不整合性をもつ多様な建築表現の有効性を示し、単純化・抽象化されすぎた近代建築が建築の唯一の解でないことを主張した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'計画',no:4,text:'建築物の開口部等に用いるガラスに関する次の記述のうち、最も不適当なものはどれか。',choices:['Low-E複層ガラスは、中空層側のガラス面に特殊金属膜をコーティングしたものであり、日射取得型と日射遮蔽型を使い分けることにより、建築物の省エネルギー化に貢献できる。','網入板ガラスは、破損してもガラスが脱落しにくくしたものであり、同程度の厚さのフロート板ガラスよりも強度が高いので、耐風圧性能を高めることができる。','倍強度ガラスは、同程度の厚さの強化ガラスよりも強度は低いが、破損時に細かい粒状の破片にならないので、高所で使う際には破損しても脱落しにくいなどの効果が期待できる。','合わせガラスは、2枚以上の板ガラスで中間膜を挟み全面接着したものであり、破損時の飛散防止や開口部の防犯性能を高めることができる。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'計画',no:5,text:'建築物の屋根や庇に関する次の記述のうち、最も不適当なものはどれか。',choices:['陸屋根は、信頼性及び耐久性のある防水工事を施すほか、水下にルーフドレンを複数設置する又はオーバーフロー管を設けることが、建築物内への漏水防止に有効である。','積雪地で採用されるスノーダクト方式の無落雪屋根は、都市部などで、隣地との間に雪を堆積する空間がない場合に有効である。','霧除け庇は、窓等の外部に面する開口部の上部に設ける小庇のことであり、雨仕舞いにおいて有効である。','建築物の開口部に設ける水平の庇は、北緯35度の地点において、一般に、南面の開口部に設けるよりも西面の開口部に設けたほうが、夏期における日射遮蔽効果が期待できる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'計画',no:6,text:'木質系材料及び工法に関する次の記述のうち、最も不適当なものはどれか。',choices:['CLTとは、ひき板を繊維方向がほぼ直交となるように積層接着した木質系材料であり、構造躯体として建築物を支えるとともに、高い断熱性能も期待できる。','LVLとは、ひき板を繊維方向にほぼ平行となるように積層接着した木質系材料であり、引張強度の高さと品質の均一性から、主に、耐力壁等の面材として使用される。','被覆型(メンブレン型)木質系耐火部材とは、柱や梁等の木材の周りに、無機質系建材等を耐火被覆として用いたものである。','燃え止まり型木質系耐火部材とは、柱や梁等の木材の周りに、燃え止まり層と呼ばれる耐火被覆材を設け、その外側に燃え代層を張り付けたものである。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'計画',no:7,text:'各種建築物のゾーニング計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['市庁舎の計画に当たり、市民が通常利用するメインエントランス、職員・サービスのエントランス、議会エントランスを、それぞれ別に設けた。','施設一体型の義務教育学校の計画に当たり、低学年児童が安心して運動や遊ぶことができるように、専用の運動広場を設けた。','調査・研究部門をもつ博物館の計画に当たり、研究対象である収蔵品を不必要に移動させることがないよう、研究部門を収蔵部門に近接して配置した。','総合病院の計画に当たり、ICU(集中治療室)を、人や機器の出入りが多い手術部と離し、療養できる病棟部門に配置した。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'計画',no:8,text:'建築物に関する各部の寸法等の記述のうち、最も不適当なものは、次のうちどれか。',choices:['地下駐車場の自動車の車路において、傾斜部の本勾配を1/8とし、傾斜部の始まりと終わりのそれぞれに設けた長さ4mの緩和勾配を1/16とした。','高等学校の配置計画において、400mトラックを設けるための運動場の寸法を、120m×190mとした。','ユニット型の介護老人福祉施設(特別養護老人ホーム)において、トイレを除いた定員1人の居室の内法寸法を、2.7m×3.6mとした。','サービス付き高齢者向け住宅において、2階以上の階に設けるバルコニーには、床仕上げ面からコンクリート躯体の立上りを80mm設けた上に、高さ1,200mmの金属製手すりを設置し、手すり子間の内法寸法を100mmとした。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'計画',no:9,text:'高齢者、障害者等の利用に配慮した建築物の計画に関する次の記述のうち、「高齢者、障害者等の円滑な移動等に配慮した建築設計標準(国土交通省)」に照らして、最も不適当なものはどれか。',choices:['美術館の車椅子使用者用トイレにおいて、内部の自動式引戸の開閉スイッチは、引戸の戸先からできるだけ近い位置に設置した。','大規模な物販店舗において、授乳及びおむつ替え室は、男女ともにアクセスしやすい場所とし、中から施錠できる授乳のための個室を設けた。','シティホテルにおいて、車椅子使用者用客室は、客室内のレイアウトが変更しやすいように、ベッドやベッドサイドキャビネットを可動式とした。','病院の階段において、段鼻と踏面との色の明度差が大きいものを選定し、昇り始めから終わりの段まで、それぞれの色を統一した。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'計画',no:10,text:'交通の面からみた都市計画に関する用語の説明として、最も不適当なものは、次のうちどれか。',choices:['MaaS(Mobility as a Service)とは、自動車利用者の交通行動の変更を促すことにより、都市や地域レベルの道路交通の混雑を緩和するための手法のことである。','TOD(Transit Oriented Development)とは、公共交通機関の利用を前提として、過度に自動車へ依存しない持続可能な都市を実現する手法のことである。','ITS(Intelligent Transport Systems)とは、最先端の情報通信技術を用いて、交通事故、渋滞などの道路交通の問題解決を目的に構築する交通システムのことである。','LRT(Light Rail Transit)とは、低床式車両の活用や軌道・電停の改良による乗降の容易性、定時性、速達性、快適性などの面で優れた特徴を有する軌道系交通システムのことである。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'計画',no:11,text:'都市計画法に規定される地域地区の名称とその説明との組合せとして、最も不適当なものは、次のうちどれか。',choices:['高度利用地区 ── 市街地の合理的かつ健全な高度利用を図るため、都市計画に建築物の高さの最高限度又は最低限度を定めることができる地区','市街化調整区域 ── 無秩序な市街化防止と計画的な市街化を図るために定められる、市街化を抑制すべき区域','生産緑地地区 ── 市街化区域内にある農地等において、公害又は災害防止、農林漁業と調和した都市環境の保全等の良好な生活環境の確保に効用があり、かつ、公共施設等の敷地の用に供する土地として適していると指定された地区','景観地区 ── 市街地の良好な景観の形成を図るため、建築物の形態意匠の制限、建築物の高さの最高限度又は最低限度、壁面の位置の制限、敷地面積の最低限度について、都市計画に定めることができる地区'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'計画',no:12,text:'住宅の作品名(設計者、建設地)とその特徴に関する次の記述のうち、最も不適当なものはどれか。',choices:['バラガン自邸(ルイス・バラガン、メキシコ)は、庭と分かち難く結びついた内部空間をもち、居間の奥には庭に面して大きな窓を設け、積極的に外部を内部に取り込んだ住宅である。','夏の家(E.G.アスプルンド、スウェーデン)は、切妻屋根の2棟が組み合わさった形状であり、主棟に対し、居間棟をずらして配置することで、主棟にあるホール(食堂)からも海を見渡せるようにした住宅である。','ガラスの家(フィリップ・ジョンソン、アメリカ)は、南北全面を半透明のガラスブロック壁とし、間仕切り壁にガラスやパンチングメタルを使うことで、内部まで明るい一塊の空間とした住宅である。','バワ自邸[Number 11](ジェフリー・バワ、スリランカ)は、4軒長屋を改造・改築することにより、路地を長い回廊に置き換え、アプローチから建築物の深部に至るまでに坪庭が随所に設けられた住宅である。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'計画',no:13,text:'高層の分譲集合住宅の新築計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['一度期に多くの住民が住み始めるので、人口構成のバランスに配慮した多様な住戸平面とし、低層部に保育所と高齢者の通所施設を設置する計画とした。','自治体によるハザードマップの浸水想定が1.5mの区域内にある敷地であったので、建築物の外周等における水防ラインを設定し、高圧受変電設備と非常用発電機を屋上等の浸水リスクの低い場所への設置を計画した。','「長期修繕計画作成ガイドライン(国土交通省)」に基づいて長期修繕計画を作成するに当たり、建物・設備、調査・診断、修繕計画内容、修繕積立金等について、計画期間を30年間と設定し、その間に大規模修繕工事が1回含まれる内容とした。','「長期優良住宅の普及の促進に関する法律」における長期優良住宅の認定を受けるため、住戸の躯体天井高さは認定基準を満たし、居住者のライフスタイルの変化等に応じて間取りの変更が可能な措置を講じた。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'計画',no:14,text:'事務所ビルの計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['高層事務所ビルにおいて、基準階の平面寸法を45m×80mとしたので、フレキシビリティや面積効率を高めるため、センターコアタイプとした。','事務所内だけでなく事務所外も含めて、業務内容や気分に合わせて自由に働く場所を選択できる働き方「ABW(Activity Based Working)」を導入し、事務所内には多様な場所を計画した。','直通階段が1か所のみの賃貸事務所ビルの改修において、直通階段と離れた位置に外部から救出可能な開口部がある退避区画を設けた。','パソコンを使った作業の多い執務空間の照明計画において、ディスプレイ面の文字や図の見やすさを考慮し、鉛直面照度を水平面照度より高くした。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'計画',no:15,text:'公立小学校・中学校等の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['施設一体型の義務教育学校の計画において、小・中学校段階の教職員が連携し、教育内容の充実や学校運営の円滑化を図るため、共同の職員室とした。','特別支援学校の計画において、聴覚障害児童・生徒に対応するため、普通教室に発音・発語の練習に利用する鏡や、練習後の手洗いやうがいのための流し台を設けた。','小学校の図書室と公立図書館とを一体整備した小学校の計画において、建築物移動等円滑化誘導基準に合わせ、両側居室の廊下幅を1.8mとした。','小学校の内装の木質化計画において、板材単体での吸音性能は低いので、普通教室の天井や壁に木板を表面材とした孔あき板等を用いることで、残響過多とならないように配慮した。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'計画',no:16,text:'病院及び保育所の計画に関する次の記述のうち、最も不適当なものはどれか。',choices:['急性期病院において、病棟部門に比べ、医療機器の更新や機能拡充が必要な診療部門には、隣接したところに増築が可能な空地を確保した。','病院の感染症病室において、廊下に対して室内を陽圧に保ち、外部の汚染空気を室内には流入させずに無菌に近い状態が確保できるようにした。','保育所において、それぞれの子どもの生活リズムを尊重するため、食事のための空間は保育室と分けて計画した。','保育所において、子どもがトイレに行くのが間に合わずに失敗することを減らすために、保育室ごとにトイレを設置した。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'計画',no:17,text:'劇場・舞台に関する用語の説明として、最も不適当なものは、次のうちどれか。',choices:['コンサートホールにおけるワインヤード型とは、舞台を取り囲むように段差をつけて客席が配置されたホール形式のことである。','プロセニアムステージ形式の劇場におけるフライズ(フライロフト)とは、幕や舞台照明等の吊物が収納された、舞台上部に設けられた空間のことである。','能舞台における橋掛りとは、本舞台の後座から鏡の間に続く廊下のことであり、出演者の入退場だけでなく、演技・演出上の重要な場所である。','歌舞伎劇場における本花道とは、観客席を上手側で縦に貫く通路舞台のことであり、客席の中を通って舞台に出入りできる歌舞伎独特の演技空間である。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'計画',no:18,text:'設計及び工事監理の契約等に関する次の記述のうち、最も不適当なものはどれか。',choices:['建築設計受託契約とは、建築設計業務を建築主が設計者に対して依頼することを契約することであり、各々の対等な立場における合意に基づいて公正な契約をしなければならない。','重要事項説明とは、作成する設計図書の種類や、工事監理に際して工事と設計図書との照合方法等を建築主に対し説明することであり、契約締結後、速やかに実施する必要がある。','四会連合協定「建築設計・監理等業務委託契約約款」を使用して契約する、委託者、受託者双方は、完成した建築物について、新たに意匠登録を受けようとする場合、相手側の承諾を得る必要がある。','「建築士事務所の開設者がその業務に関して請求することのできる報酬の基準(平成31年国土交通省告示第98号)」における実費加算方法とは、業務経費(直接人件費、特別経費、直接経費、間接経費)、技術料等経費及び消費税に相当する額を個別に積み上げたうえで合算して算出する方法である。'],answer:2,hasFigure:false,figureDesc:''},
{year:2023,subject:'計画',no:19,text:'建築積算に関する次の記述のうち、最も不適当なものはどれか。',choices:['所要数量とは、仮設、土工事等における、設計図書に基づいた施工計画による数量のことである。','設計数量とは、設計図書に記載されている個数及び設計寸法から求めた長さ、面積、体積等の数量のことである。','工事費における工事原価とは、純工事費と現場管理費を合わせたものである。','工事費における共通費とは、共通仮設費、現場管理費及び一般管理費等を合わせたものである。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'計画',no:20,text:'建築のマネジメントに関する次の記述のうち、最も不適当なものはどれか。',choices:['プロジェクトファイナンスとは、資金調達手法の一つであり、不動産などを担保に資金調達をしてきたのに対し、プロジェクトから得られる事業収益に着目し、大規模な資金が融資される仕組みである。','ファシリティマネジメントとは、企業、団体などが組織活動のために施設とその環境を総合的に企画、管理、活用する経営活動である。','国土交通省が示す設計者選定方式における設計競技(コンペ)方式とは、技術力や経験、プロジェクトにのぞむ体制などを含めた提案書の提出を求め、最も適した設計者を選ぶ方式である。','CM(Construction Management)方式とは、発注者の委任を受けたCMr(Construction Manager)が、設計・発注・施工の各段階において、設計内容や工事発注方式の検討、工程管理、品質管理、コスト管理等の各種のマネジメント業務の全部又は一部を行うものである。'],answer:3,hasFigure:false,figureDesc:''},
{year:2023,subject:'環境・設備',no:1,text:'環境工学に関する次の記述のうち、最も不適当なものはどれか。',choices:['夜間放射(実効放射)とは、地表における、「上向きの地表面放射」と「下向きの大気放射」との差のことである。','冷房期の平均日射熱取得率(η_AC)とは、窓から直接侵入する日射による熱と、屋根、天井、外壁などの窓以外から日射の影響で熱伝導により侵入する熱を評価した指標である。','NC値とは、室内騒音を評価する指標の一つであり、対象となる騒音のオクターブバンドごとの音圧レベルをNC曲線群上にプロットし、全ての帯域で、あるNC曲線を下回ったときのその曲線値である。','色の誘目性とは、目を引きやすいか否かに関する属性であり、一般に、色相においては緑が最も高くなる。'],answer:4,hasFigure:false,figureDesc:''},
{year:2023,subject:'環境・設備',no:2,text:'室内の温熱環境に関する次の記述のうち、最も不適当なものはどれか。',choices:['コールドドラフトは、暖房時の室内において、外気により冷やされた窓ガラスからの放射熱伝達により生じる現象である。','人体からの総発熱量に占める潜熱発熱量の比率は、一般に、室温が高くなるほど増加する。','予測平均温冷感申告(PMV)は、主に均一な環境に対する温熱快適指標であるので、不均一な放射環境や上下温度差が大きな環境等に対しては、適切に評価できない場合がある。','室内の上下温度分布は、椅座位の場合、くるぶしの高さ(床上0.1m)と頭の高さ(床上1.1m)の温度差が3℃以内とすることが望ましい。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'環境・設備',no:3,text:'空気調和設備を設けた延べ面積5,000m²の事務所ビルの居室における空気環境に関する次の測定結果のうち、「建築物における衛生的環境の確保に関する法律」に照らして、最も不適当なものはどれか。',choices:['一酸化炭素の含有率 ── 0.001%(10ppm)','温度 ── 18.0℃','浮遊粉じんの量 ── 空気1m³につき0.10mg','ホルムアルデヒドの量 ── 空気1m³につき0.10mg'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'環境・設備',no:4,text:'図は、冬期において、定常状態にある外壁の内部及び周囲の温度分布を示したものである。次の記述のうち、最も不適当なものはどれか。ただし、図中の屋外温度t_o、室内温度t_i及び材料の厚さdの条件は変わらないものとする。',choices:['材料(ア)は、材料(イ)より熱伝導率が小さい。','材料(ア)の熱伝導率を大きくすると、材料(イ)の各部分の温度が下がる。','材料(イ)の熱伝導率を小さくすると、材料(ア)の各部分の温度が上がる。','材料(ア)と材料(イ)を入れ替えたとしても、室内表面結露の防止には効果がない。'],answer:3,hasFigure:true,figureDesc:'冬期の定常状態における外壁断面の温度分布図。外壁は材料(ア)と材料(イ)の2層構成で、それぞれ厚さd。縦軸が温度(高い方が上)、横軸が屋外側から室内側。屋外温度t_oから室内温度t_iまでの温度勾配が示され、材料(ア)の方が材料(イ)より温度勾配が急(熱伝導率が小さい)。'},
{year:2023,subject:'環境・設備',no:5,text:'建築物における防火・防災に関する次の記述のうち、最も不適当なものはどれか。',choices:['室内の可燃物量が同じ場合、一般に、外気が流入する開口面積が大きいほど火盛り期の火災継続時間が長くなる。','建築物の上階への延焼防止のためには、層間区画を十分に確保する必要があり、ファサードデザインに応じてバルコニーや庇等により対応する方法がある。','竪穴区画内の温度が屋外より高くなる冬期において、地下階がない建築物では、火災階が下階であるほど、竪穴区画への煙の侵入量が増える傾向にある。','建築物の用途が異なる部分に設けられる異種用途区画については、原則として、異なる用途部分への延焼を防止するために防火区画とする。'],answer:1,hasFigure:false,figureDesc:''},
{year:2023,subject:'環境・設備',no:6,text:'図は、北緯35度の地点における太陽位置図である。この地点における太陽の位置に関する次の記述のうち、最も不適当なものはどれか。',choices:['春分の日において、時刻(真太陽時)15時における太陽高度は、約35°である。','夏至の日において、太陽が真東にくる時刻(真太陽時)は、7時頃である。','秋分の日において、太陽高度が約45°となるのは、太陽が概ね南東又は南西にくるときである。','冬至の日において、日没時の太陽方位角は、約60°である。'],answer:2,hasFigure:true,figureDesc:'北緯35度の地点における太陽位置図（極射影）。円形の図で、外周にN(北)・E(東)・S(南)・W(西)の方位角が示され、同心円状に高度(10°刻み)が表示されている。各月の日付ごとの太陽の軌跡が曲線で描かれ、時刻線(真太陽時)も放射状に示されている。'},
{year:2023,subject:'環境・設備',no:7,text:'図のような点光源に照らされた受照面上の点A、B、Cの鉛直面照度の大小関係として、最も適当なものは、次のうちどれか。ただし、点光源の配光特性は一様なものとし、反射は考慮しないものとする。',choices:['A > B = C','A > C > B','B = C > A','C > B > A'],answer:2,hasFigure:true,figureDesc:'3つの点光源と受照面の配置図。点Aは光度200cdの点光源から水平距離1mの鉛直面上の点。点Bは光度1,600cdの点光源から水平距離2m、入射角60°の鉛直面上の点。点Cは光度1,600cdの点光源から水平距離4mの鉛直面上の点（入射角0°、光源と同じ高さ）。'},
{year:2023,subject:'環境・設備',no:8,text:'色彩に関する次の記述のうち、最も不適当なものはどれか。',choices:['XYZ表色系において、xy色度図上のxの値が増大するほど赤みが強くなり、yの値が増大するほど緑みが強くなる傾向がある。','XYZ表色系において、xy色度図上の外周の釣鐘形の曲線部分は、単一の波長によって表される単色光の色度座標を示す。','マンセル表色系は、光源から出る光の色に適用することはできない。','JISの安全色の規定において、「赤」の表示は、「注意警告」を意味する。'],answer:4,hasFigure:false,figureDesc:''},
