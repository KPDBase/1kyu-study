正しい。床面積の大きい低層部を設けると、高層部からの吹き下ろしが低層屋根上で受けられ、歩行者への影響が少なくなる。","誤り。ビル風対策の植栽は、耐風性の高い樹種を選び、低木と高木を組み合わせて風向きに対し直交する向きに配置するのが有効である。風向きと平行では効果が小さい。"],"2016-計画-6":["正しい。北緯35度では、冬は南面、夏は水平面と東西面の日射量が多いので、集熱窓は南面を大きく、東西面を小さくするのが有効である。","正しい。パッシブクーリングは、日射熱の侵入を極力排除したうえで通風を図り、自然エネルギーで室内空気を冷やす考え方である。","正しい。コンクリート躯体を蓄熱体とするには、外断熱とし、日射を躯体に直接当て、躯体を室内に露出させることが有効である。","誤り。クールチューブは、地中に埋設した管に外気を通し、地中熱で予冷・予熱して取り入れる方式である。記述は夜間の自然通風で躯体を冷やすナイトパージの説明である。"],"2016-計画-7":["正しい。車いす使用者用駐車施設は、1台当たり幅3.5m以上、奥行6.0m以上とされており、幅3.5m×奥行6.0mは適切である。","誤り。駐車場法施行令では、車路の梁下の高さは2.3m以上とされている。2.1mでは不足する。","正しい。一方通行の車路で、料金徴収施設に接し歩行者の通行に供しない部分は、幅員2.75m以上で足りる特例がある。","正しい。小型自動車の車路の屈曲部は、内法半径を5m以上とする必要があり、5mは基準を満たす。"],"2016-計画-8":["正しい。中規模事務所ビルの基準階共用部の主要な廊下の幅員は、2.0m程度が一般的で適切である。","誤り。成人用バスケットボールコート(28m×15m)を2面配置するには、周囲の余裕を含め、床面の内法寸法で30m×35mでは不足し、より大きな面積が必要である。","正しい。全長12m程度の大型バスの最小回転半径は12m程度であり、誘導車路の屈曲部の計画として妥当である。","正しい。大規模量販店の客用通路は、主要な避難通路を3.0m、それ以外を1.8m程度とするのが一般的である。"],"2016-計画-9":["正しい。車いす使用者用客席・観覧席の数は、施設内容や規模に応じ、客席総数の0.5〜1%以上とするのが一般的である。","正しい。車いす使用者用客席・観覧席は、少なくとも2以上の車いす使用者が同時に利用できる専用スペースを、固定位置に確保する。","正しい。サイトライン(可視線)は、前列の人の頭や肩越しに視焦点(舞台や競技場)を見通せる視野の限界線のことである。","誤り。客席内通路は有効幅員120cm以上とするが、車いすが転回できる140cm角以上のスペースは、区間50m以内ごとに設けるものとされ、100m以内ではない。"],"2016-計画-10":["誤り。高蔵寺ニュータウンは近隣住区理論等に基づく大規模開発だが、我が国で最初のニュータウンではない。日本初の本格的ニュータウンは千里ニュータウンである。","正しい。筑波研究学園都市は、東京一極集中の緩和を目的に、職住一体の田園都市として構想された。","正しい。川越一番街では、パタン・ランゲージに範をとった町づくり規範により、歴史的町並みの景観保全が実践されている。","正しい。くまもとアートポリスは、コミッショナーが設計者を推薦する方式で、都市環境や建築文化の向上を図る事業である。"],"2016-計画-11":["正しい。レジリエンスは、自然災害等で社会基盤や社会・経済が一時的に大きな打撃を受けても、速やかに回復できることを意味する。","正しい。ダウンゾーニングは、容積率の引下げや用途の限定など、規制を現行より厳しく変更することである。","正しい。トランジットモールは、一般自動車の進入を排除し、路面電車やバス等の公共交通機関に限り通行を認める歩行者空間である。","誤り。エリアマネジメントは、住民・事業主・地権者等が主体となって、地域の環境や価値の維持・向上を図る取組みであり、行政主導とする記述は不適当である。"],"2016-計画-12":["正しい。イームズ自邸は、再組立が可能という理念のもと、形鋼やスチールサッシ等の工業製品で建築された住宅である。","正しい。ゲーリー自邸は、既存の木造住宅に金網やトタン板等の安価な材料で増改築を施した、ポストモダンを代表する住宅の一つである。","誤り。記述の医院併用住宅で、台形の医院と矩形の住居を中庭のスロープで繋ぐ計画は、ル・コルビュジエのクルチェット邸の特徴であり、バラガンのヒラルディ邸ではない。","正しい。フィッシャー邸(カーン)は、二つの矩形ボリュームを45度の角度で接合した、幾何学的な構成の住宅である。"],"2016-計画-13":["誤り。茨城県営松代アパートは、周辺との融和に配慮した低層集合住宅だが、住棟数や階数・規模など、記述の内容が実際の計画と合致していない。","正しい。コモンシティ星田A2は、緩斜面を活かした緑道や塀・門を極力設けない外構で、開放的な外部空間をもつ戸建て住宅団地である。","正しい。NEXT21は、スケルトン・インフィル分離方式と環境共生をテーマに、外壁等の規格化・部品化による可変性や屋上植栽を試みた集合住宅である。","正しい。幕張ベイタウンパティオス4番街は、都市デザインガイドラインに沿って設計された街区型の集合住宅である。"],"2016-計画-14":["誤り。事務室の床の積載荷重は、建築基準法施行令上、床の構造計算用で2,900N/m²とされる。重荷重ゾーンはそれ以上の値とするため、2,300N/m²では不足する。","正しい。事務室のフリーアクセスフロアの高さは、配線量に応じて、一般に100mm程度から設けられ、100mmは妥当である。","正しい。アンビエント照明の照度は、事務室の全般照明として、500lx程度とするのが一般的である。","正しい。基準階の事務室床面積1,000m²程度の貸事務所ビルにおける衛生器具数として、記載の個数は一般的な計画の範囲内である。"],"2016-計画-15":["正しい。調査・研究部門は、収蔵品の移動を最小限にするため、収蔵部門と隣接して設けるのが適切である。","正しい。収蔵部門は、収蔵庫内の保存環境を一定に保つため、前室を設けて外部環境の影響を和らげる計画とする。","誤り。ウィング式の大型トラックは、荷台の側面と屋根面を上方に開くため、停車スペースの床から天井までの高さは4mでは足りず、より高い高さが必要である。","正しい。固定席の客席部分の面積は、通路を含め1人当たり0.5〜0.7m²程度が目安で、定員600人で400m²は妥当である。"],"2016-計画-16":["誤り。手術部は清潔区域であり、他部門の通過動線を手術部内に設けない。他部門との連携や搬出入に配慮しつつも、通り抜け動線は排除する計画とする。","正しい。外来診療部では、患者の出入りの多い内科を入口近くに配置し、小児科は感染防止のため他科と分離して計画する。","正しい。LDR室(陣痛・分娩・回復室)は、木材の使用など、暖かい家庭的な雰囲気となるよう配慮して計画する。","正しい。看護動線の短縮と患者の観察の容易さのため、ナースステーションのほかにナースコーナーを設けて看護の作業領域を分散する手法がある。"],"2016-計画-17":["正しい。エアフローウィンドウは、二重のガラス間に遮光装置を設け、空調空気を通してペリメーターゾーンの熱負荷を軽減するシステムである。","正しい。SSG構法は、バック・マリオンにガラスを構造シーラントで接着し、室外側にサッシがほとんど見えないフラットなガラス面を構成する。","誤り。内外の空気圧を等圧にして雨水を重力で排水するのはオープンジョイント構法の説明である。フィルドジョイント構法は、目地にシーリング材等を充填して水密性を確保する。","正しい。メタルカーテンウォールのマリオン方式では、マリオンが日射等の熱で膨張・収縮するため、変形に追従する機構が必要である。"],"2016-計画-18":["誤り。標準業務の内容は、設計図書の内容を把握し、疑義がある場合は建築主に報告し、設計者に確認するものである。記述は報告先や確認先の関係が異なっている。","正しい。設計図書の定めにより施工者が作成する施工図、製作見本、見本施工等が設計図書に適合しているか検討し、建築主に報告する。","正しい。工事が設計図書に適合しているかは、目視、抽出、品質管理記録の確認など、対象工事に応じた合理的方法で確認する。","正しい。工事が設計図書どおりでない場合は、施工者に直ちに指摘して是正を求め、従わないときはその旨を建築主に報告する。"],"2016-計画-19":["誤り。建築数量積算基準では、スタラップの割付本数は、梁の内法長さを間隔で割った値に1を加え、端数は切り上げて求める。この算定結果と37本は一致しない。","誤り。割付本数は、(梁の内法長さ÷スタラップ間隔)+1を端数切り上げして求めるが、図の寸法による算定結果は38本にならない。","正しい。積算基準に従い、梁の内法長さをスタラップ間隔で除して1を加え、端数を切り上げると39本となる。","誤り。図の寸法から割付本数を算定すると、端数を切り上げても39本であり、40本にはならない。"],"2016-計画-20":["正しい。サブリース事業は、賃貸管理事業者が建物所有者から転貸目的で借り受け、自らが転貸人となって入居者に転貸する賃貸管理事業である。","正しい。BCPは事業継続計画であり、被災しても重要業務を中断させない、または中断しても可能な限り早く再開することを目指す計画である。","誤り。CSRは企業の社会的責任のことである。企業所有不動産を経営戦略的視点で見直し、投資効率を最大化する考え方はCREである。","正しい。PFI事業のSPCは、特定事業の実施のみを目的に設立され、PFI以外の投資は行わず、契約期間の終了後に解散する会社である。"],"2025-環境・設備-1":["誤り。音の強さ(インテンシティ)は単位面積を単位時間に通過する音のエネルギー(W/m²)であり、単位体積当たりのエネルギーではない。単位体積当たりは音のエネルギー密度である。","正しい。暗所視ではプルキンエ現象により視感度が最大となる波長が555nm付近から507nm付近の短波長側へずれ、青や緑が相対的に明るく、赤が暗く見える。","正しい。平均放射温度(MRT)は、グローブ温度計の測定値に空気温度と気流速度を加味した式で求められる。","正しい。空気齢は流入口から入った空気が室内のある地点に到達するまでの平均時間で、小さいほど新鮮な空気が速く届く。換気効率の指標となる。"],"2025-環境・設備-2":["正しい。PMVは温熱環境の6要素である空気温度、放射温度、相対湿度、気流速度、着衣量、代謝量から求める。","誤り。PMVが0(中立)でも、個人差があるためPPDは0%にならず、最小で約5%となる。全員が満足する温熱環境は存在しない。","正しい。ドラフトによる不快感は平均風速だけでなく気流の変動や空気温度にも影響され、空気温度が低いほど不快に感じやすい。","正しい。着席安静時の代謝量は約1met(約58W/m²)で、成人の平均的な体表面積を考えると一人当たり約100Wとなる。"],"2025-環境・設備-3":["正しい。全熱交換器は外気の湿分を排気側へ一部移すため、外気の絶対湿度が室内より高い場合、吹出し空気の絶対湿度は外気より低くなる。","誤り。外気温が室内温度より高い場合は室内空気のほうが重く、外気は中性帯より上側の開口から流入し、下側の開口から流出する。","正しい。風圧力による換気量は風圧係数差と風速の2乗の平方根に比例するため、開口条件が同じなら概ね外部風速に比例する。","正しい。定常時のCO2濃度は発生量÷換気量で決まり、換気回数が同じなら換気量は容積に比例する。よって容積の小さい室のほうが濃度は高くなる。"],"2025-環境・設備-4":["正しい。ブラインドを窓の外側に設けると日射を室外で遮れるが、内側では吸収熱が室内に残るため、内側のほうが日射熱取得率は大きくなる。","正しい。透明フロート板ガラスは可視光をよく透過し、長波長の赤外線の吸収率が高いため、一般に日射が当たると室内の温度が上昇する。","正しい。熱線吸収板ガラスは日射の一部を吸収して室内への日射熱侵入を抑えるが、同厚の透明フロート板ガラスと熱貫流率は同程度である。","誤り。中空層が真空でも、ガラス間の放射やスペーサー・枠部の熱伝導により熱は伝わるため、熱貫流率が0W/m²・Kになることはない。"],"2025-環境・設備-5":["正しい。吸引型機械排煙は火災室の圧力を下げて負圧にするため、煙が他の空間へ拡散しにくい。","正しい。加圧防排煙方式は機械給気で圧力を高め、階段や付室など避難上重要な空間への煙の侵入を防ぐ方式である。","正しい。第二種排煙は給気を機械、排気を自然に行う押出型で、煙が侵入するおそれはあるが出火のおそれが少ない空間に用いられる。","誤り。自然排煙の効率は、排煙口の位置・面積だけでなく、給気口の位置・面積などの給気経路や外部風、煙の浮力の影響も受けて決まる。"],"2025-環境・設備-6":["誤り。直達日射量は水平面ではJH=JN・sin h、南向き鉛直面ではJV=JN・cos h(南中時)で表され、h=60°ならJH=√3JN/2、JV=JN/2となる。この組合せは一致しない。","誤り。h=60°ではsin60°=√3/2、cos60°=1/2であるため、JH=JN/2、JV=JN/√3とはならない。太陽高度30°の場合とも一致しない。","誤り。JH=JN/2、JV=√3JN/2となるのは太陽高度が30°の場合であり、60°の場合は水平面と鉛直面の値が入れ替わる。","正しい。南中時の太陽高度h=60°では、水平面直達日射量JH=JN・sin60°=√3JN/2、南向き鉛直面直達日射量JV=JN・cos60°=JN/2となる。"],"2025-環境・設備-7":["誤り。CIE標準曇天空は方位によらず輝度分布が同じ(天頂が最も明るい)ため、鉛直面照度は東西南北の向きによらず等しく、南向きだけが低くはならない。","正しい。昼光率は室内照度÷全天空照度×100%で、天空の輝度分布が一様であれば全天空照度が変化しても一定の値となる。","正しい。色温度の高い青白い光はメラトニン分泌を抑えて体内時計を乱すため、就寝前に浴びすぎないほうがよい。","正しい。輝度は面の見かけの単位面積当たりの光度であり、発光面のほか、反射面や透過面についても定義できる。"],"2025-環境・設備-8":["誤り。xy色度図上の距離は知覚される色差に比例せず、領域により不均等(緑付近は大きく、青付近は小さい)である。均等色空間にはL*a*b*などがある。","正しい。三刺激値のYは明るさに対応し、反射物体の色では視感反射率を表す。","正しい。マンセル表色系のバリュー(明度)は、理想的な黒を0、白を10とした0〜10の数値で表す。","正しい。色覚の多様性に配慮するカラーユニバーサルデザインでは、色相の差だけでなく明度の差(明暗のコントラスト)を十分に付けた配色とする。"],"2025-環境・設備-9":["誤り。拡散音場の平均音圧レベルは、音源のパワーレベルが同じなら、室定数が小さい室ほど高くなる。この大小関係の並びは、各室の条件から求めた結果と一致しない。","誤り。室内の平均音圧レベルは室定数R=Sα/(1-α)に依存し、Rが小さいほど高くなる。この並びは、条件から求めた室定数の大小と対応しない。","誤り。同じ音響パワーでも、吸音力の大きい室ほど音圧レベルは低くなる。この順序では、吸音力と平均音圧レベルの関係が合わない。","正しい。拡散性の高い室では、平均音圧レベルは室定数が小さい室ほど高い。条件から求めた結果、B、C、Aの順に大きくなる。"],"2025-環境・設備-10":["正しい。等ラウドネス曲線より、音圧レベルが等しい純音では、低音の100Hzより1,000Hzのほうが大きく感じられる。","誤り。天井高を1/2にすると容積は1/2になるが、床・壁も残るため表面積(吸音力)は1/2にならない。残響時間は1/2倍より長くなり、1/2倍にはならない。","正しい。質量則では透過損失は面密度と周波数の積の対数に比例し、面密度を2倍にすると20log2≒6dB増加する。","正しい。孔あき板構造の共鳴周波数は空気層厚の平方根に反比例するため、空気層を2倍にすると共鳴周波数は1/√2倍になる。"],"2025-環境・設備-11":["正しい。冷温水コイルで予冷することで、デシカントローターに入る空気の温度が下がり、除湿性能を上げることができる。","正しい。デシカントローターは除湿剤で吸湿を行い、シリカゲル系やゼオライト系など除湿剤の種類によって再生に必要な温度が異なる。","誤り。再生コイルはローターに吸着した水分を脱着させて再生するため、空気を加熱するものである。冷却ではなく加熱で、排熱や太陽熱の利用で省エネ化できる。","正しい。加湿器は冬期に、デシカントローターで還気から回収した湿分だけでは室内湿度が目標値に達しない場合に稼働する。"],"2025-環境・設備-12":["正しい。中央管理方式の空気調和設備の中央管理室は、避難階またはその直上階・直下階に設ける。","正しい。空調配管のシャフトを各階同じ位置とすると、漏水時の修繕や保守が行いやすく、天井裏の無駄なスペースも生じにくい。","誤り。排煙ダクトは高温の煙を通すため、防火ダンパーを設けると閉鎖して排煙機能を損なう。排煙の竪ダクトには一般に防火ダンパーを設けない。","正しい。冷却塔の飛散水や排気を外気取入れ口から取り込まないよう、離隔距離は10m程度以上とすることが望ましい。"],"2025-環境・設備-13":["正しい。井水は温度が年間を通じ安定しており、冷房時は外気より低く暖房時は高いため、空気熱源ヒートポンプよりCOPが高い。","正しい。冷却塔フリークーリングは、外気温が低い時期に冷凍機を使わず冷却塔で冷却した水で冷水をつくる省エネルギー手法である。","誤り。外気冷房は、外気のエンタルピーが室内空気より低い場合に有効である。外気のほうが高いと外気導入で冷房負荷が増えてしまう。","正しい。ナイトパージは夜間の冷涼な外気で建物を冷やして翌日の冷房負荷を減らす手法で、昼間より低い外気温も利用できる。"],"2025-環境・設備-14":["正しい。水道直結増圧方式では、水道本管への逆流を防ぐため、一般に増圧ポンプの吸込み側に逆流防止器を設ける。","誤り。クロスコネクションの防止には逆止め弁では不十分であり、吐水口空間を設けた間接給水(受水槽等を介する)とするのが原則である。","正しい。雑用水系統の受水槽は、飲料水用と異なり、鉄筋コンクリート造の床下ピットを利用することも可能である。","正しい。排水再利用水は、大小便器の洗浄水のほか、一定の条件のもとで散水用水や掃除用水にも使用できる。"],"2025-環境・設備-15":["正しい。合流式でも、汚水排水管の詰まり時に器具から雨水が逆流して浸入しないよう、建築物内の雨水排水管と汚水排水管の兼用は避ける。","正しい。公共下水道へ排水する場合、排水温度は原則として45℃未満とする。","誤り。ループ通気方式は2個以上のトラップを保護する通気管を設けるため、伸頂通気方式に比べて許容流量値は大きくなる。","正しい。掃除口の大きさは、排水管径100mm以下では同一口径、100mmを超える場合は100mmより小さくならないようにする。"],"2025-環境・設備-16":["正しい。接地極は銅板や銅被覆板等とし、なるべく水気があり、かつ酸などで腐食するおそれがない場所に埋設または打込む。","誤り。外部雷保護システムの保護レベルはI〜IVで、Iが最も高い。重要度の高い建築物は最も高い保護レベルIで計画し、IVは最も低い。","正しい。航空法により、地表または水面から60m以上の高さの建築物等には、原則として航空障害灯の設置が義務づけられている。","正しい。太陽電池モジュールは一部のセルに影が当たると発電が低下し、ホットスポットも生じるため、対策にバイパスダイオードを設ける。"],"2025-環境・設備-17":["誤り。避難口誘導灯のA級・B級・C級は、器具の大きさ(表示面の縦寸法)と有効範囲による区分で、停電時の点灯継続時間(予備電源容量)による区分ではない。","正しい。非常コンセント設備は、消防隊の消火活動用に、単相交流100V、15A以上の電気を供給できるものとする。","正しい。非常電源専用受電設備は、大規模な特定防火対象物における消防用設備等の非常電源としては使用できない。","正しい。蓄電池は、非常用電源、停電補償、受電電力の平準化、自然エネルギーによる発電電力の平準化等に用いられる。"],"2025-環境・設備-18":["正しい。開放型スプリンクラー設備は、一斉開放弁を開くことで放水区域内の全てのヘッドから一斉に散水する。","正しい。粉末消火設備は、炭酸水素ナトリウム等の粉末の負触媒効果で消火し、航空機の格納庫や寒冷地の駐車場等に適している。","正しい。連結送水管は公設消防隊用の設備で、1階の外壁等に設けた送水口から消防ポンプ自動車で送水して使用する。","誤り。消防用水の必要貯水量は、敷地面積ではなく、建築物の1・2階の床面積の合計を、耐火建築物等の区分ごとの基準面積で除した数に20m³を乗じて求める。"],"2025-環境・設備-19":["正しい。ヒートポンプ給湯機は大気中の熱を給湯の加熱に利用するもので、冷媒に二酸化炭素を用いたものがある。","正しい。エスカレーターの一端のみを固定し他端を非固定とする場合、非固定部では地震時の変位に対し、隙間及びかかり代長さを確保する。","誤り。免震構造では水平方向の地震力は低減されるが、鉛直方向の低減効果は小さい。設備機器の設計用鉛直震度を耐震構造より小さくはしない。","正しい。多数台のエレベーターを群管理方式とすると、効率的な運転により省エネルギーとサービス向上を両立できる。"],"2025-環境・設備-20":["正しい。エンボディドカーボンは、ホールライフカーボンのうち建物の新築、改修、解体時等に発生するカーボンである。","正しい。ZEHは、高断熱の外皮と高効率な省エネ設備に再生可能エネルギーを組み合わせ、年間の一次エネルギー消費量が正味ゼロ以下となる住宅である。","正しい。一次エネルギー消費量等級4は、建築物省エネ法の住宅の省エネ基準における基準値相当の性能を示す。","誤り。外皮性能基準では、外皮平均熱貫流率(UA)と冷房期の平均日射熱取得率(ηAC)を地域区分別の基準値以下とする。暖房期ではなく冷房期である。"],"2024-環境・設備-1":["正しい。クリモグラフは気温、相対湿度、降水量等のうち2要素を軸にとり、月別の値をプロットして年間推移を示す図で、気候特性の把握に用いる。","誤り。空気温度と平均放射温度の重み付け平均で表されるのは作用温度である。自然室温は、冷暖房を行わない状態で自然に定まる室温を指す。","正しい。輝度は発光面の見かけの単位面積当たりの光度で、ある点を見た際に眼に入る光の強さを表す。","正しい。A特性は、40phonの等ラウドネス曲線に対応した周波数感度補正で、騒音レベルの算出に用いられる。"],"2024-環境・設備-2":["正しい。冷たい窓面による不快感を避けるため、放射の不均一性(放射温度の差)は10℃以内とするのが望ましい。","正しい。SET*が25℃付近であれば、温冷感は「快適、許容できる」範囲内とされる。","正しい。屋内の暑さ指数(WBGT)は、自然湿球温度とグローブ温度から求める。","誤り。床暖房時の床表面温度は、低温やけどや不快感を避けるため、体温より低めにする。体温よりやや高めにするのは不適当である。"],"2024-環境・設備-3":["誤り。温度差換気量は開口部の有効面積と開口部の中心間距離の平方根に比例するため、A、B、Cで条件が異なり、同じにはならない。","正しい。換気量は面積×√(高さ差)に比例し、A≈3×√3=5.1、B≈2×√6≈4.8、C≈1×3=3となり、Q_A>Q_B>Q_Cとなる。","誤り。Q_BがQ_A、Q_Cより大きくなることはない。A≈5.1、B≈4.8、C≈3であり、Q_A>Q_B>Q_Cである。","誤り。開口面積が最も小さいCの換気量が最も小さい。高さ差が大きくても面積の減少の影響が上回り、Q_Cは最小となる。"],"2024-環境・設備-4":["正しい。グラスウールの熱伝導率は約0.04W/(m・K)で、板ガラス(約1)の1/10以下、アルミニウム(約200以上)の1/1,000以下である。","正しい。発泡系断熱材では空隙率が同じなら、気泡寸法が大きいほど気泡内の対流や放射の影響が増し、熱伝導率は大きくなる。","正しい。屋外の風速が大きくなると外表面の熱伝達率が大きくなり、外壁の熱貫流率も大きくなる。","誤り。定常状態の熱貫流率は各層の熱抵抗の合計で決まり、材料と材厚が同じなら断熱層を屋外側に置いても室内側に置いても変わらない。"],"2024-環境・設備-5":["正しい。廊下の避難歩行速度は平均照度が低下すると遅くなり、1lx以下では顕著に遅くなる。","正しい。フラッシュオーバーでは室内全体が急激に燃焼するため、酸素が大量に消費され、酸素濃度が急激に低下する。","誤り。火災室の煙が階段室に流入して上昇する速さは、一般に3〜5m/s程度である。1〜2m/sは遅すぎる。","正しい。アカマツやケヤキ等の木材は、温度上昇により可燃性ガスを発生し、260℃前後で引火しやすくなる。"],"2024-環境・設備-6":["誤り。大気透過率は、大気を通過する際の直射日光（直達日射）の透過の程度を表す値で、天空光（拡散成分）は含まない。直射日光と天空光の両方とする点が誤り。","正しい。北緯35度の夏至の日は、太陽高度が高く南向き鉛直面への入射が少ない。一方、東向き鉛直面は午前中に日射を受けるため、終日直達日射量は東向きのほうが大きい。","正しい。曇天空は天頂が最も明るい。天窓は天頂光を受けるが、南向き鉛直面は天窓からの光を斜めに受けて入射角が大きくなるため、鉛直面照度は低くなる。","正しい。春分・秋分の日は太陽が真東から昇り真西に沈み、赤緯がほぼ0°である。そのため鉛直棒の影の先端の軌跡は、ほぼ東西方向の直線となる。"],"2024-環境・設備-7":["正しい。光束は、放射束を比視感度で重みづけし、可視光の波長範囲で積分した量で、単位はlm（ルーメン）である。","誤り。均等拡散面では、輝度は照度と反射率の積に比例する（L=ρE/π）。照度が輝度と反射率の積に比例するとしている点が逆で、誤りである。","正しい。CIE標準晴天空の輝度分布は、太陽周辺が最も高く、天頂を挟んで太陽と反対側へ約90°離れた部分で最も低くなる。","正しい。UGRは人工照明のまぶしさ（不快グレア）を評価する指標である。窓面のように面積の広い光源のグレアには、一般に適用しない。"],"2024-環境・設備-8":["正しい。オストワルト表色系は、白色量・黒色量・純色量の混合比で色を表す。理想的な黒・白・純色を定義し、明度という属性は持たない。","正しい。マンセル表色系の彩度の最大値は色相や明度によって異なり、鮮やかな色では10を超える（赤では14程度）こともある。","誤り。加法混色（光の混色）の三原色は赤・緑・青（RGB）である。シアン・マゼンタ・イエローは減法混色の三原色であり、取り違えている。","正しい。明所視では人間の比視感度は555nm付近の緑で最大となる。放射エネルギーが同じなら、赤より緑のほうが明るく感じられる。"],"2024-環境・設備-9":["誤り。障壁の回折による減衰効果は、波長の短い高音域ほど大きく、波長の長い低音域は回り込みやすいため減衰効果が小さい。高低が逆である。","正しい。無限に長い線音源では、距離が2倍になるごとに音圧レベルは約3 dB減衰する（点音源では約6 dB）。","正しい。拡散音場では音圧レベルは10log(1/A)に従って変わる。平均吸音率が2倍になると吸音力が2倍となり、音圧レベルは約3 dB減少する。","正しい。学校の普通教室では、残響を適度に抑えて聞き取りやすくするため、平均吸音率を0.2程度とする吸音対策が望ましい。"],"2024-環境・設備-10":["正しい。開放窓では音波がすべて透過するので、音響透過率は1となる。また入射音を反射しないため、吸音率も1とみなされる。","正しい。多孔質材料の表面を通気性の低い材料で被覆すると、材料内部へ音が入りにくくなり、高周波数域の吸音率が低下する。","正しい。単層壁へ平面波が入射する場合、一般に垂直入射の遮音性能が最も高く、入射方向が斜めになるほど遮音性能は低下する。","誤り。コルクタイルなど柔らかい床仕上げは軽量床衝撃音の低減には有効だが、重量床衝撃音の低減には効果が小さい。重量床衝撃音には床スラブの厚さ・質量が重要である。"],"2024-環境・設備-11":["正しい。両方式とも変風量方式（VAV）などを併用すれば、負荷に応じて風量を調整でき、搬送動力を低減できる。図が不明なため、一般論に基づく説明である。","正しい。風量を絞る低負荷時には、導入する外気量も減りがちで、必要外気量が不足するおそれがある。両方式に共通する留意点である。","正しい。外調機で外気を処理して湿度を制御する方式は、室内湿度の微調整がしやすい。コイルが1つのみの方式は、冷却除湿と再熱が難しく微調整が難しい。","誤り。外気冷房は、全空気方式のように大量の外気を導入できる方式で可能であり、外調機で最小外気量のみを処理する方式では困難である。AとBの可否を逆に述べている。（図が不明なため一般論による説明）"],"2024-環境・設備-12":["誤り。中央熱源方式でも、各室・各ゾーンに端末機器（ファンコイルやVAVなど）を設ければ、個別の要望に対応できる。パーソナル空調にも適用可能である。","正しい。外気取入れガラリは雨水や砂塵の侵入を防ぐため、排気ガラリより通過風速を遅く設定する。同風量なら必要な正面面積は大きくなる。","正しい。超高層ビルでは冬期に煙突効果が強く働き、低層部で外気が流入し高層部で流出するため、給気と排気のバランスが崩れやすい。","正しい。防煙垂れ壁で区画された隣接する防煙区画で、自然排煙と機械排煙を混在させることは、排煙効果が阻害されるため一般にできない。"],"2024-環境・設備-13":["正しい。エアフローウィンドウは、窓下部から室内空気を吸い込み窓上部から排気して、窓ガラス面の熱負荷を抑え窓際の温熱環境を改善する手法である。","正しい。事務室のOA機器による内部発生熱負荷は、OA機器の使用状況により異なるが、一般に10～30 W/m²程度で計画する。15 W/m²は妥当な範囲である。","誤り。事務室の冷房負荷は、季節・時刻・在室状況などにより大きく変動する。ピーク負荷のみで熱源を計画すると過大となり、部分負荷を考慮する必要がある。","正しい。誘引誘導方式は、ダクトを減らして誘引ファンで排気を誘導する方式で、経済性や設置スペースに優れ、地下駐車場に用いられる。"],"2024-環境・設備-14":["誤り。節水器具を使用する場合、事務所ビルの在勤者1人当たりの設計用1日給水量は、一般に60～100 l程度で計画する。120～150 lは過大である。","正しい。事務所ビルでは、便器洗浄水の使用量が多いため、飲用水30～40％、雑用水60～70％程度の比率で給水系統を計画する。","正しい。給湯能力の1号は、1 lの水の温度を1分間に25℃上昇させる能力であり、ガス瞬間式給湯機の能力表示に用いられる。","正しい。レジオネラ属菌は温度が低いと繁殖しやすい。中央式給湯設備では、貯湯槽内を60℃以上に維持し、末端でも55℃以上を保つことが望ましい。"],"2024-環境・設備-15":["正しい。排水再利用水の原水には、手洗い・洗面・給湯室の排水に加え、処理して厨房排水を使う場合もある。ただし油分の処理に留意が必要で、記述は可とされる。","誤り。排水槽の底部の勾配は、汚泥を吸込みピットへ集めるため、1/15以上1/10以下とするのが一般的である。1/5以上は急すぎて不適当である。","正しい。排水槽には点検・清掃のため、有効内径60 cm以上の防臭密閉型マンホールを設ける。吸込みピット付近を含む2か所の設置が一般的である。","正しい。雨水利用水が下水道料金の対象となる地域では、排水量を把握するために雨水使用量を計測する量水器を設置する。"],"2024-環境・設備-16":["正しい。特別高圧受電では、2回線受電方式やスポットネットワーク方式を採用すると、1回線停電時にも受電でき、電力供給の信頼度が高まる。","正しい。大規模な商業施設では、非常用照明の予備電源として、電源別置型（集中型）が経済性や保守性に優れ、一般に採用される。","正しい。中小規模の事務所ビルの照明・コンセント用幹線には、単相3線式100 V/200 Vが一般に採用される。","誤り。住宅の接地端子付きコンセントの接地工事は、300 V以下の低圧機器に適用するD種接地工事（接地抵抗100Ω以下）が一般的である。A種は高圧・特別高圧用機器に適用する。"],"2024-環境・設備-17":["誤り。電圧の区分で、低圧は直流750 V以下、交流600 V以下である。交流750 V以下を低圧とする記述は誤りで、交流750 Vは高圧に区分される。","正しい。進相コンデンサは、誘導電動機などの遅れ力率を進め、負荷設備の力率を改善するために用いられる。","正しい。ガスタービンはディーゼル機関に比べ、振動や設置面積が小さいが、燃焼用空気量が多く必要となる。","正しい。車両その他の重量物の圧力を受けるおそれがある場所で、直接埋設式により地中電線路を施設する場合、土被りは原則120 cm以上とする。"],"2024-環境・設備-18":["正しい。予作動式スプリンクラーは、感知器の作動で予作動弁が開き配管内へ送水する方式で、ヘッドの破損等による誤放水・水損を防ぐ目的で開発された。","正しい。連結散水設備は、地階の火災時に消防ポンプ車から送水し、散水ヘッドから放水して消火を容易にする消防隊用の設備である。","正しい。泡消火設備は、油類などの液体燃料の火災に有効で、駐車場、自動車整備場、指定可燃物の貯蔵所などに適している。","誤り。病院やホテルなど、不特定多数が利用し、操作に不慣れな者が使う可能性のある施設では、1人で操作できる易操作性1号または2号消火栓を採用する。通常の1号は2人以上で操作する。"],"2024-環境・設備-19":["誤り。地震管制運転では、地震感知器の作動により、エレベーターは最寄り階に停止して乗客を降ろす。避難階まで帰着させる運転ではなく、記述は不適当である。","正しい。非常用エレベーターのかごの定格速度は、60 m/分以上としなければならない（建築基準法施行令）。","正しい。ノンフロン冷媒となる自然冷媒には、アンモニア、二酸化炭素、水、空気、炭化水素などがある。","正しい。防振架台上の機器に設ける耐震ストッパは、運転中に接触しない範囲で、機器との隙間をできるだけ小さくして地震時の移動を抑える。"],"2024-環境・設備-20":["正しい。BELSは、新築・既存を問わず建築物の省エネルギー性能を、第三者評価機関が評価して認証する制度である。","正しい。CASBEEは、建築物や街区、都市などの環境性能を、環境負荷と環境品質の両面から総合的に評価するツールである。","誤り。LEEDは米国発の建築物・街区の環境性能評価システムで、省エネ・資源・環境全般を評価する。人の健康やウェルネスに着目するのはWELLである。","正しい。DR（デマンドレスポンス）は、電力需要家が供給状況に応じて消費パターンを変え、電力需給バランスを調整する仕組みである。"],"2023-環境・設備-1":["正しい。夜間放射（実効放射）は、上向きの地表面放射と下向きの大気放射との差であり、夜間の地表面冷却に関わる。","正しい。冷房期の平均日射熱取得率（ηAC）は、窓からの直接侵入日射に加え、屋根・外壁などから日射の影響で熱伝導により侵入する熱も評価する指標である。","正しい。NC値は室内騒音の評価指標で、オクターブバンドごとの音圧レベルをNC曲線上にプロットし、全帯域で下回る最小の曲線値で表す。","誤り。色の誘目性は、目を引きやすさを表す属性で、一般に色相では赤が最も高く、次いで橙・黄などの暖色が高い。緑が最も高いとする点が誤り。"],"2023-環境・設備-2":["誤り。コールドドラフトは、窓ガラスなどの冷たい面で冷やされた空気が下降して床面を流れる、対流による冷気流の現象である。放射熱伝達による現象ではない。","正しい。室温が高くなると人体は発汗による潜熱放熱が増える。そのため、総発熱量に占める潜熱発熱量の比率は、室温が高いほど増加する。","正しい。PMVは均一な環境を前提とした温熱快適指標であり、不均一な放射環境や上下温度差が大きい環境では適切に評価できない場合がある。","正しい。椅座位では、くるぶし（床上0.1 m）と頭（床上1.1 m）の温度差を3℃以内とすることが望ましい。"],"2023-環境・設備-3":["誤り。建築物衛生法の管理基準で、一酸化炭素の含有率は100万分の6以下（6 ppm以下）である。10 ppm（0.001％）はこの基準を超え、不適当である。","正しい。温度の管理基準は、17℃以上28℃以下である。18.0℃は基準を満たしている。","正しい。浮遊粉じんの量の基準は、空気1m³につき0.15 mg以下である。0.10 mgは基準を満たしている。","正しい。ホルムアルデヒドの量の基準は、空気1m³につき0.1 mg以下（約0.08 ppm）である。0.10 mgは基準値以内である。"],"2023-環境・設備-4":["正しい。温度分布の傾きは熱流が同じなら熱伝導率に反比例するため、傾きが急な材料ほど熱伝導率が小さい。図が不明のため一般論での説明である。","正しい。直列壁では、室内側と屋外側の位置関係により、一方の熱伝導率を大きくすると全体の熱抵抗が減って熱流が増え、もう一方の材料の温度は変化する。ここでは温度が下がる関係である。","誤り。屋外側の材料(ア)と室内側の材料(イ)の関係では、(イ)の熱伝導率を小さくすると熱流が減り、屋外側の(ア)の各部分の温度は下がる。上がるとする点が誤り。","正しい。材料を入れ替えても全体の熱抵抗は変わらず、熱流も同じなので、室内表面温度は変わらない。そのため室内表面結露の防止には効果がない。"],"2023-環境・設備-5":["誤り。外気が流入する開口面積が大きいほど燃焼が活発になり、火盛り期の温度は高くなるが、可燃物は早く燃え尽きるため火災継続時間は短くなる。","正しい。上階への延焼を防ぐには層間区画を十分に確保する必要があり、ファサードデザインに応じてバルコニーや庇などで対応する方法がある。","正しい。冬期は竪穴区画内の温度が高く、煙突効果が働く。地下階がない建築物では、火災階が下階ほど竪穴区画に煙が流入しやすい傾向にある。","正しい。用途が異なる部分は、出火危険や避難の特性が違うため、異種用途区画により原則として防火区画とし、延焼を防止する。"],"2023-環境・設備-6":["正しい。春分の日の太陽高度は90°-緯度＝約55°が南中高度で、15時（時角45°）の高度は約35°となる。図が不明のため計算に基づく説明である。","誤り。北緯35度の夏至の日に太陽が真東にくる時刻（真太陽時）は、およそ8時半頃であり、7時頃は誤りである。7時頃は真東よりやや北寄りにある。","正しい。秋分の日に太陽高度が約45°となるのは、概ね南東または南西（方位角が南から約45°）の時刻である。","正しい。冬至の日の日没時の太陽方位角は、南から西へ約60°の方向である。図が不明のため計算に基づく説明である。"],"2023-環境・設備-7":["誤り。鉛直面照度は、光源からの距離の2乗に反比例し、入射角の余弦に比例するため、AとBとCが等しくなる関係ではなく、この大小関係は成立しない。図が不明のため一般論による説明。","正しい。点光源による鉛直面照度は、距離の逆2乗の法則と入射角余弦の法則から決まる。これに基づく大小関係はA>C>Bとなる。図が不明のため一般論による説明。","誤り。BとCが等しくAより大きくなる関係は、距離と入射角の両方を考慮した鉛直面照度の計算結果と整合しない。図が不明のため一般論による説明。","誤り。C>B>Aの順は、点光源からの距離と入射角から求めた鉛直面照度の関係と整合しない。図が不明のため一般論による説明。"],"2023-環境・設備-8":["正しい。XYZ表色系のxy色度図では、xが増すほど赤みが、yが増すほど緑みが強くなる傾向がある。","正しい。xy色度図の外周の釣鐘形の曲線（スペクトル軌跡）は、単一波長の単色光の色度座標を示す。","正しい。マンセル表色系は物体色を表す表色系であり、光源色には適用できない。","誤り。JISの安全色で、赤は「防火・禁止・停止・危険」を意味する。「注意警告」を意味するのは黄赤（黄）であり、赤とする点が誤り。"],"2023-環境・設備-9":["正しい。透過損失TL=10log(1/τ)なので、TLを10 dB増やすには、音響透過率τを現状の1/10にする必要がある。","正しい。空港など残響が長くなりやすい空間では吸音処理で残響を抑え、放送音声の明瞭度（聞こえやすさ）を確保できる。","誤り。生垣や並木などの植栽による騒音の減衰効果は小さく、大きな物理的減衰は期待できない。心理的効果はあるが、遮音には障壁などが必要である。","正しい。剛壁に密着させた多孔質吸音材は、厚くすると低周波数域の吸音率が上昇する。背後に空気層を設けても同様の効果がある。"],"2023-環境・設備-10":["誤り。残響時間はT=0.161V/A（セイビンの式）で、室容積Vに比例し、吸音力Aに反比例する。表の条件から求めた順はC>A>Bであり、この大小関係とは異なる。表が不明のため一般論による説明。","誤り。残響時間は室容積に比例し吸音力に反比例するため、表の条件から求めた結果はC>A>Bであり、A>C>Bの順にはならない。表が不明のため一般論による説明。","正しい。セイビンの式T=0.161V/Aに表の室容積と吸音力を当てはめると、残響時間の大小関係はC>A>Bとなる。表が不明のため一般論による説明。","誤り。C>B>Aの順は、セイビンの式から求めた各室の残響時間の大小関係と合わない。正解はC>A>Bである。表が不明のため一般論による説明。"],"2023-環境・設備-11":["正しい。冷暖同時型マルチパッケージ型空調機は、冷房側の排熱を暖房側で利用する熱回収運転ができ、冷暖が混在する場合に省エネルギー効果が期待できる。","誤り。開放式冷却塔は冷却水を直接外気に触れさせる方式で、密閉式に比べ送風機動力は小さい。密閉式は散布水ポンプも要し、同能力なら送風機動力が大きくなる。","正しい。水蓄熱槽により熱源機の運転を負荷変動から切り離せるため、ピーク負荷を平準化でき、熱源機の容量低減や夜間電力の利用が可能となる。","正しい。モジュール型は小容量ユニットを複数台連結し、負荷に応じて運転台数を制御するため、部分負荷時にも高効率な運転ができる。"],"2023-環境・設備-12":["正しい。放射空調は気流や温度むらによる不快感が少ない方式である。冷水パネルでは結露防止のため、パネル表面温度を室内空気の露点温度以上に保つ必要がある。","正しい。床吹出し空調は、空調域の高さに応じた気流特性の吹出し口を用いることで、冷房時でも天井高にかかわらず居住域を効率的に空調できる。","誤り。リバースリターン方式は各機器への配管長を揃えて流量バランスを良くする方式で、配管長が長くなり、ダイレクトリターン方式より配管スペースは大きくなる。","正しい。デシカント空調の再生熱にコージェネレーションの排熱を利用でき、排熱の有効活用により総合効率の向上に寄与する。"],"2023-環境・設備-13":["正しい。喫煙室では、たばこの煙や臭気が非喫煙場所へ漏れないよう、境界開口部で喫煙室に向かう0.2m/s以上の気流を確保する。","正しい。ソーラーチムニーは日射で縦シャフト内の空気を暖め、温度差による浮力で換気を促す方式であり、温度差換気の積極的な活用にあたる。","正しい。排気フードI型付きの換気扇の有効換気量は、V＝30KQで算出する。なお、II型の場合はV＝20KQである。","誤り。ボイラー室は燃焼用空気を十分に供給する必要があり、室内が負圧となる第3種換気は不適当である。一般に第1種または第2種換気とする。"],"2023-環境・設備-14":["正しい。受水槽の気相部は、塩素ガス等の影響で腐食しやすい。そのため液相部よりも耐食性の高いステンレス鋼材を用いるのが有効である。","正しい。受水槽を大容量にすると滞留時間が長くなり、残留塩素が低下して水質が劣化しやすい。そのため塩素滅菌装置の設置は適切である。","誤り。藻類の増殖防止には槽内への光の侵入を抑える必要があり、水槽照度率は一般に0.1%以下とする。10%以下では光が入りすぎて不適当である。","正しい。大容量の受水槽では、槽内に迂回壁（導流壁）を設けて水の流れを作り、滞留水（死水）の発生を防ぐ。"],"2023-環境・設備-15":["正しい。合流式地域では、雨水排水系統を一般排水系統の敷地排水管に接続する際、トラップますを設けて害虫や臭気の侵入を防ぐ。","正しい。敷地排水管の排水ますは、起点・屈曲点・合流箇所のほか、管径の120倍以内の間隔で設ける。管径200mmでは24m以内となる。","誤り。降雨強度は継続時間が短いほど大きく、10分間値のほうが1時間値より大きい。10分間値を用いるほうが管径は大きくなり、集中豪雨対策に有効である。","正しい。サイホン式雨水排水システムは、特殊なルーフドレンでサイホン現象を生じさせ満管流で排水するため、たてどいの口径を小さくできる。"],"2023-環境・設備-16":["誤り。力率は有効電力を皮相電力で除した値であり、「皮相電力を有効電力で除したもの」は逆である。力率は1以下の値となる。","正しい。需要率は、最大需要電力を負荷設備容量の総和で除した値で、設備がどの程度同時に使われるかを示す。","正しい。負荷率は、ある期間の平均需要電力を最大需要電力で除した値で、電力使用の平準度を表す。","正しい。不等率は、個々の負荷の最大需要電力の合計を、系統全体の合成最大需要電力で除した値であり、1以上となる。"],"2023-環境・設備-17":["正しい。SPD（サージ防護デバイス）は、直撃雷や近傍雷で生じる過電圧（サージ）から電気・電子機器を保護するために設置する装置である。","誤り。同一容量の負荷では、電圧が高いほど電流が小さくなる。そのため電線は200Vより400Vのほうが細いものを使用でき、記述は逆である。","正しい。スターデルタ始動は始動時に巻線へ加わる電圧を下げるため、始動電流は全電圧始動（直入れ始動）の約1/3に小さくなる。","正しい。鉄骨造では、地上部分の構造体の鉄骨を雷保護システムの引き下げ導線として利用できる。ただし電気的な連続性の確保が必要である。"],"2023-環境・設備-18":["正しい。炎感知器は炎の放射光を検知するため、天井が高く熱や煙が天井面に達する前に分散してしまうような空間に適している。","誤り。固有信号による伝送方式で信号線を少なくできるのは、R型受信機である。P型受信機は共通信号方式で、警戒区域ごとに配線が必要となる。","正しい。区分鳴動方式は、火災時の混乱（パニック）を避けるため、出火階とその直上階など階の区分ごとに限定して地区音響装置を鳴動させる方式である。","正しい。予備電源を内蔵しない受信機と非常電源との間の配線は、火災時にも確実に動作させるため耐火配線とする。"],"2023-環境・設備-19":["正しい。設備機器の設計用標準震度は、設置階ではなく建築物の高さや階の区分で定まる。高層建築物の1階天井内でも、適用階の区分を中間階として耐震クラスに応じた値を用いる。","正しい。基礎免震構造では、免震層より上の階が概ね同じように揺れるため、エレベーターの設計用水平標準震度は高さに関係なく全階で同じ値を用いる。","正しい。大地震後も長時間運転する非常用発電機は、断水しても使える冷却水不要の空冷式が望ましい。","誤り。エキスパンションジョイント部は変位が大きく、特に高層部ほど相対変位が大きい。やむを得ず給水管を通す場合は、高層部を避け、できるだけ低層部に配管する。"],"2023-環境・設備-20":["正しい。ZEB Readyは、再生可能エネルギーによる削減分を除き、基準一次エネルギー消費量から50%以上削減した建築物をいう。","誤り。BEIは「設計一次エネルギー消費量」を「基準一次エネルギー消費量」で除した値であり、「省エネルギー量の合計」を除する定義ではない。小さいほど省エネ性能が高い。","正しい。PAL＊は年間熱負荷を外皮面積で除した指標で、値が小さいほど外皮の熱性能が高いと判断される。","正しい。代替フロン（HFC）は温室効果ガスであり、モントリオール議定書キガリ改正（2016年）で生産・消費量の段階的削減が求められている。"],"2022-環境・設備-1":["正しい。日照図表は、周辺建築物による直射日光の遮りの有無を検討する図で、緯度ごと、冬至などの季日ごとに描かれる。","正しい。UA値は、単位温度差当たりの外皮総熱損失量を外皮総面積で除した値で、小さいほど断熱性能が高い。","正しい。ブーミングは、低周波数域ほど、また室寸法が小さいほど固有周波数密度が疎になり、特定の固有周波数が強調されて起こりやすい。","誤り。汚染質が排気口に至るまでの時間は空気余命に関する指標で、空気齢はその点に新鮮空気が到達するまでの時間である。空気齢が小さいことと、汚染質の排出時間の短さは直接対応しない。"],"2022-環境・設備-2":["正しい。外壁の断熱を強化すると室内側の壁面温度が上昇し、露点温度との差が確保されるため、表面結露の防止に有効である。","正しい。開放型燃焼器具は水蒸気を室内に放出するため、密閉型燃焼器具にすれば室内の絶対湿度が下がり、表面結露の防止に有効である。","正しい。断熱材の室内側に防湿層を設けると、水蒸気の壁体内への侵入を抑えられ、内部結露の防止に有効である。","誤り。襖の断熱性を高くすると押入れ内に室内の暖気が入りにくくなり、外壁面の温度が下がって結露しやすい。襖は断熱性を低くして通気させるのが有効である。"],"2022-環境・設備-3":["誤り。二酸化炭素濃度は約900ppmとなり、700ppmは小さすぎる。発生量0.4m³/hを換気量800m³/hで除した500ppmに、外気400ppmを加えて求める。","誤り。二酸化炭素濃度は約900ppmとなり、800ppmは小さすぎる。発生量0.4m³/hを換気量800m³/hで除した500ppmに、外気400ppmを加えて求める。","正しい。発生量は25人×0.016＝0.4m³/h、換気量は200m³×4回＝800m³/hである。室内濃度は0.4÷800＝500ppmに外気400ppmを加え、900ppmとなる。","誤り。二酸化炭素濃度は約900ppmであり、1,000ppmは大きすぎる。発生量0.4m³/hを換気量800m³/hで除した500ppmに、外気400ppmを加えて求める。"],"2022-環境・設備-4":["誤り。日射遮蔽係数は、3mm透明ガラスの日射熱取得に対する比である。値が大きいほど日射を通しやすく、日射遮蔽効果は小さくなる。","正しい。日射熱取得率は、入射日射量に対する、透過日射量と吸収後に室内側へ放出される熱量の和の比率である。","正しい。壁体表面の総合熱伝達率は、対流熱伝達率と放射熱伝達率の合計で表される。","正しい。外壁表面の対流熱伝達率は、外部風速が大きいほど大きくなる。"],"2022-環境・設備-5":["正しい。第二種排煙は給気機で押し出す機械排煙方式で、排煙量を確保するため、排煙量より多い給気量が必要となる。","正しい。籠城区画は、手術室やICUなど避難が困難な室で、内部出火を防ぎ外部火災の影響も受けない構造とし、鎮火まで留まれるようにした区画である。","誤り。光庭に面した開放廊下への煙の拡散を防ぐには、ボイド空間の下層部からの給気を抑制せず、むしろ十分に確保して煙の滞留や拡散を防ぐ必要がある。","正しい。等価可燃物量は、可燃物の発熱量を、発熱量が等価な木材の重量に換算して表した値で、火災荷重の評価に用いる。"],"2022-環境・設備-6":["誤り。北緯35度では、冬至の南向き鉛直面の終日日射量は大きく、夏至の西向き鉛直面の終日日射量より大きい。記述は大小が逆である。","正しい。春分・秋分の南中時は太陽高度が約55度で、直達日射量は南向き鉛直面より水平面のほうが大きい。","正しい。夏至は日の出と日の入りが北寄りとなるため、北向き鉛直面にも日が当たり、可照時間は南向きより北向きのほうが長い。","正しい。壁面が東西方向に平行な場合、東西に長い形状ほど長時間日影となる範囲が広がり、4時間日影の面積は大きくなる。"],"2022-環境・設備-7":["正しい。光源Aの立体角投射率は、半径をaとすると a²/d²に等しい。S＝πa²より、S/(πd²)×100(%)と表せる。","誤り。水平面照度は、E＝πL×(立体角投射率)で求められ、投射率に傾きの影響が含まれる。そのため cos45°を重ねて乗じるのは誤りである。","正しい。同じ輝度・面積・距離でも、光源Bは傾いているため点Pからの見かけの立体角投射率が小さくなり、EAP＞EBPとなる。","正しい。光源までの距離が光源寸法の約5〜10倍以上であれば、一般に点光源とみなせ、10倍以上なら点光源として扱える。"],"2022-環境・設備-8":["正しい。平均演色評価数Raは、試験光源と同じ相関色温度の基準光で見たときの物体色の見え方とのずれをもとにした数値である。","正しい。短波長成分を多く含む色温度の高い光を午前中に浴びると、体内時計が調整され、サーカディアンリズムを保つ効果が期待できる。","正しい。視感測色では、測色する部分の面積を色票の面積と同程度にする。面積の違いによる見え方の差を避けるためである。","誤り。記憶色は実際の色彩より彩度が高く、鮮やかになる傾向がある。「彩度が低くなる」とする記述は逆である。"],"2022-環境・設備-9":["誤り。カラレーションは、直接音と短い遅れ時間の反射音の干渉により、音色が変化して聞こえる現象である。音の高さの変化ではない。","正しい。マスキング現象では、周波数の低い音が高い音をマスクしやすい。マスクする音より高い周波数の音のほうがマスクされやすい。","正しい。可聴範囲は約20Hz〜20kHzで、音速約340m/sから波長は約17m〜17mm、すなわち十数mから十数mmとなる。","正しい。同じ音圧レベルの音源がn個になると、10log₁₀nだけ増加する。4個では10log₁₀4≒6dBの増加となる。"],"2022-環境・設備-10":["正しい。単板ガラスは厚いほど質量則で遮音性能が上がるが、コインシデンス効果で低下する周波数域があり、全周波数帯で高いとは限らない。","正しい。複層ガラスは中空層が共鳴するため、同じ面密度の単板ガラスに比べ、一般に中音域（500Hz付近）の遮音性能が低下する。","誤り。床衝撃音遮断等級のLrは数値が小さいほど性能が高い。Lr-40はLr-55より遮断性能が高く、記述は逆である。","正しい。空気音遮断性能のDr等級は数値が大きいほど性能が高く、Dr-50はDr-35より空気音の遮断性能が高い。"],"2022-環境・設備-11":["誤り。劇場は在室人員が多く、ピーク負荷が大きい。また、空調停止中の室温を整えるため予冷・予熱の時間が長くなる傾向がある。","正しい。百貨店は、休日と平日、午前と夕方など時間帯によって来客数が変わるため、空調負荷の変動が大きい。","正しい。ビジネスホテルは、宿泊客が帰室する夕方から夜間にかけて使用が増え、ピーク負荷が夕方から夜間に発生する傾向にある。","正しい。データセンターは情報機器の発熱が大きいため、外皮負荷や外気負荷より室内で発生する顕熱負荷が大きい。"],"2022-環境・設備-12":["正しい。水蓄熱式空調は負荷の平準化により熱源機容量を小さくでき、夜間蓄熱で電力需要の平準化にも寄与する。","誤り。ダクトのアスペクト比が大きいほど圧力損失が増え、送風機のエネルギー消費量は大きくなる。アスペクト比を小さくすれば消費量は小さくなる。","正しい。変風量単一ダクト方式は、VAVユニットを部屋やゾーンごとに設置するため、個別の温度制御が可能である。","正しい。再熱コイルは部分負荷時に風量を保ちつつ除湿でき、室内の湿度上昇を防げるが、冷却後に再加熱するためエネルギー消費量は多くなる。"],"2022-環境・設備-13":["正しい。RI施設では、放射性物質を含む空気を室内に循環させないため、給気を全て排気するオールフレッシュ方式が用いられる。","正しい。ドラフトチャンバーの排気風量は、作業用開口部の面積と制御風速（面風速）の積によって決定される。","正しい。エアフィルターの粉じん捕集率は、質量法や計数法などの測定方法の違いにより、同一のフィルターでも異なる値となる。","誤り。JISのクリーンルームの空気清浄度は、清浄度クラスの値が小さいほど、空気中の粒子数が少なく清浄度が高い。記述は逆である。"],"2022-環境・設備-14":["正しい。キャビテーションは、水温一定でポンプ吸込口の管内圧力が低く、水の飽和蒸気圧に近づくと発生しやすい。","正しい。大便器洗浄弁は、逆サイホン作用による汚水の給水管への逆流を防ぐため、バキュームブレーカーを設ける。","誤り。飲料水配管から空調設備配管へ給水する場合は、逆止め弁だけでは不十分で、吐水口空間を設けて縁を切る必要がある。クロスコネクションを防止する。","正しい。揚水管の横引きを高い位置にすると水柱分離が起きやすい。ウォーターハンマーを防ぐため、できるだけ低い位置で計画する。"],"2022-環境・設備-15":["正しい。潜熱回収型ガス給湯機では、排気の潜熱回収時に酸性の凝縮水が生じるため、機器内の中和器で中和して排出する。","正しい。水熱源方式のヒートポンプ給湯は、下水処理水や工場・大浴場の温排水などの未利用エネルギーを熱源として利用できる。","正しい。家庭用燃料電池は、改質装置で作った水素と空気中の酸素の反応で発電し、その排熱で作った温水を給湯に利用する。","誤り。ハイブリッド給湯システムは、負荷変動が少ないベース負荷をヒートポンプ給湯機が受け持ち、それを超える分を燃焼式加熱機でバックアップする。記述は逆である。"],"2022-環境・設備-16":["正しい。接地端子付きコンセントは、コンセントの図記号に接地端子を示すETを添えて表す。JISの配線用図記号の表記として適当である。","誤り。煙感知器は、半円形ではなく、感知器の図記号に煙を表すSを添えて表す。半円形に近い形の記号は熱感知器系のものであり、組合せが不適当である。","正しい。分電盤は、配電盤などと区別して、塗りつぶした図形の記号で表す。選択肢の対応はJISの図記号として適当と判断できる。","正しい。配電盤は、×印の入った正方形の図記号で表し、分電盤や制御盤などの盤類とは図形で区別される。記述として適当である。"],"2022-環境・設備-17":["正しい。インバータ機器から発生する高調波電流の抑制には、高調波電流を打ち消す電流を注入するアクティブフィルタが有効であり、適当な対策である。","誤り。地絡電流による感電・火災の防止には、漏電遮断器(地絡遮断器)を設置する。過電流遮断器は過負荷や短絡電流から回路を保護するもので、地絡対策としては不適当である。","正しい。静電誘導によるノイズ対策には、信号線にシールドケーブルを用い、シールドを接地することが有効である。記述は適当である。","正しい。内部雷保護システムは、等電位ボンディングやサージ保護により、雷電流による危険な火花放電を防止するものである。記述は適当である。"],"2022-環境・設備-18":["正しい。排煙口は、防煙区画の各部分から排煙口までの水平距離が30m以下となるように設ける。百貨店でもこの基準が適用され、記述は適当である。","正しい。天井の高さが6mを超える大空間のロビー等には、閉鎖型ヘッドでなく放水型ヘッドを用いたスプリンクラー設備を設置する。高さ12mでも適当である。","誤り。プロパンガスは空気より重いので、検知部は床面から30cm以内に設け、燃焼機器から水平距離4m以内とする。天井面付近は空気より軽い都市ガスの設置位置であり、不適当である。","正しい。客席誘導灯は、客席内の通路の床面における水平面照度が0.2lx以上となるように設ける。記述は適当である。"],"2022-環境・設備-19":["誤り。APFは、「冷房期間総合負荷及び暖房期間総合負荷の和」を「通年消費電力量」で除した値である。記述は分母と分子が逆であり、不適当である。","正しい。中央管理室は、中央管理方式の空気調和設備を設ける建築物などで、避難階又はその直上階若しくは直下階に設ける。記述は適当である。","正しい。乗用エレベーターは、火災時管制運転により乗客を速やかに避難階へ帰着させた後、運転を休止させる計画とする。記述は適当である。","正しい。初期照度補正制御は、経年による照度低下を見込んで過剰になる設置直後の照度を、適正な照度に補正して省エネを図る手法である。"],"2022-環境・設備-20":["正しい。ZEBの定義には、『ZEB』、Nearly ZEB、ZEB Ready、ZEB Orientedの4段階があり、一次エネルギー消費量の削減率などで区分される。","誤り。搬送機器のインバータ制御やLED照明は、機器の効率を高めるアクティブ技術である。パッシブ技術は、断熱、日射遮蔽、自然採光・通風など建築的な工夫による技術を指す。","正しい。ZEBは新築に限らず、既存建築物でも、改修時に外皮の断熱強化や設備の高効率化などを行うことで実現が可能である。","正しい。ZEBは、まず省エネによるエネルギー消費量の削減が前提であり、再生可能エネルギーの導入のみでは実現できない。記述は適当である。"],"2021-環境・設備-1":["正しい。露点温度は、絶対湿度を一定に保ったまま空気を冷却したとき、相対湿度が100%となり結露が始まる温度である。","誤り。グレアは、視野内の高輝度光源だけでなく、周囲の輝度との対比(輝度比)の影響を受ける。周囲が暗いほどグレアは強く感じられ、影響を受けないとする点が誤りである。","正しい。ビル風は、建築物の見付面積が大きく風を多くせき止めるほど、風が剥離する領域が大きくなる傾向がある。記述は適当である。","正しい。カクテルパーティ効果は、騒がしい環境でも、聴きたい音を選択的に聴き取れる聴覚の性質である。記述は適当である。"],"2021-環境・設備-2":["誤り。PPDは、PMVが0のとき最小(約5%)となり、PMVが0から離れるほど高くなる。PMVが0に近づくとPPDは低くなるため、記述は不適当である。","正しい。平均放射温度(MRT)は、グローブ温度、空気温度、気流速度から求められる。記述は適当である。","正しい。冷たい壁面による不快感を避けるため、放射の不均一性(放射温度の差)は10℃未満が望ましいとされる。","正しい。着席安静時の成人男性の代謝量は約1met(約58W/m²)で、体表面積から約100W/人となる。記述は適当である。"],"2021-環境・設備-3":["正しい。静止型全熱交換器は素子の通気抵抗が大きく、一般に給気側と排気側の両方に送風機が必要である。記述は適当である。","正しい。手術室やクリーンルームなど、周囲から汚染空気を入れない室は、室内を正圧にする第二種換気、または正圧の第一種換気とする。","誤り。水まわりの排気で全般換気を行う場合、給気口は冷気の流入による不快を避けるため、一般に床面から高い位置(1.6m程度以上)に設けることが望ましい。0.5m以下は不適当である。","正しい。風圧力のみによる換気量は、風向と開口条件が同じなら、概ね外部風速に比例する。記述は適当である。"],"2021-環境・設備-4":["正しい。二重サッシ間の結露は、室内の湿った空気が間に流入して起こる。室内側サッシの気密性を高め、屋外側は低くすると結露防止に有効である。","正しい。室内壁表面の自然対流熱伝達率は、壁面と室内空気の温度差が大きいほど対流が活発になり、高くなる。記述は適当である。","誤り。繊維系断熱材は含水率が増加すると、空隙の空気が水に置き換わり熱伝導率が大きくなって断熱性能が低下する。水の熱伝導抵抗が加わるわけではない。","正しい。Low-Eガラスは、屋外側に用いると日射熱を遮る効果が高く、室内側に用いる場合より遮熱性が高まる。記述は適当である。"],"2021-環境・設備-5":["正しい。空気と分離した煙の水平方向の拡散速度は0.5〜1.0m/秒程度で、人の歩行速度とほぼ等しい。記述は適当である。","正しい。劇場の防災計画では、階段を下りる速度を一般に0.6m/秒程度と想定する。記述は適当である。","正しい。超高層建築物や医療福祉施設では、一気に外部へ避難しにくいため、途中に一時的に滞留できる空間を確保することが望ましい。","誤り。居室内避難の歩行距離は、家具の配置を考慮して、実際に歩行できる経路に沿って測る。家具に関係なく直線距離とする点が不適当である。"],"2021-環境・設備-6":["正しい。夏至の日は日影が最も短くなる日であり、その日に終日日影となる部分を永久日影という。記述は適当である。","誤り。4時間以上日影となる領域の面積は、一般に、建築物の高さよりも東西方向の幅から受ける影響が大きい。高さの影響が大きいとする点が不適当である。","正しい。西日は夏の冷房負荷が大きいので、落葉樹は南側より西側に植えるほうが、夏の日射遮蔽と冬の日射取得の面で負荷軽減に有効である。","正しい。同一面積の窓では、縦長窓のほうが床面の奥行方向への光の到達が良く、横長窓より床面照度の均斉度が高くなる。"],"2021-環境・設備-7":["正しい。視対象面の明るさは輝度で決まり、照度だけでなく反射率にも左右される。照度のみからは予測できない。記述は適当である。","正しい。CIE標準曇天空では、天頂に対する相対輝度分布は方位に関係なく、高度のみで決まる。天頂の輝度は地平線の約3倍である。","誤り。配光曲線は、光源の各方向に対する光度の分布を示すものである。照度の分布ではないので、記述は不適当である。","正しい。平均演色評価数Raは、相関色温度が同じ光源でも分光分布の違いにより異なる場合がある。記述は適当である。"],"2021-環境・設備-8":["正しい。マンセルバリューVと視感反射率Yの関係は、V=5でY=約20%である。記述は適当である。","誤り。複数の色光を混ぜて明るくなるのは加法混色である。減法混色は絵の具などの混合で、色数が増えるほど暗くなる。記述は混色の種類を取り違えている。","正しい。LED等の人工光源は、相関色温度が等しくても分光分布が異なるため、異なる光色に知覚されることがある。記述は適当である。","正しい。XYZ表色系の三刺激値のうち、Yは反射物体の場合に視感反射率を示す。記述は適当である。"],"2021-環境・設備-9":["正しい。コインシデンス効果による遮音性能の低下は、壁が薄いほど高い周波数域で生じる。同一材料の場合、厚いほど低い周波数域で生じる。","正しい。吸音率は、入射する音のエネルギーに対する、壁内部に吸収される分と反対側へ透過する分との和の割合である。記述は適当である。","正しい。子どもの飛び跳ねなどの重量床衝撃音には、カーペット等の柔らかい仕上げ材では大きな改善が期待できない。床の質量や剛性が重要である。","誤り。中空二重壁の共振透過周波数は、壁間の空気層を厚くすると低くなる。空気層が厚いとばね定数が小さくなるためで、高くなるとする記述は不適当である。"],"2021-環境・設備-10":["誤り。同じ音圧レベルでの音の大きさの感覚量は、低音域で小さく、3〜4kHz付近で最大となる。10kHz付近で最大とする記述は不適当である。","正しい。防音塀は回折による減衰を利用するため、波長の短い高音域のほうが回折しにくく、低音域より有効である。","正しい。無限大の面音源から放射された音は広がらず平面波として進むため、距離減衰しない。記述は適当である。","正しい。平均吸音率が大きい室では、セイビンの式はアイリングの式より残響時間が長めに算出される。吸音率が小さければ両者はほぼ一致する。"],"2021-環境・設備-11":["誤り。蓄熱槽の利用温度差を確保するには、熱交換器を通過する水量を一定にするのでなく、負荷に応じて変流量制御するのが適当である。一定制御では温度差が確保できない。","正しい。密閉式冷却塔は、ファンの発停制御や回転数制御により搬送動力を低減でき、省エネルギーになる。記述は適当である。","正しい。遠心冷凍機は冷却水入口温度が低いほど成績係数が向上するため、中間期に夏期より低い温度で運転できるようにするのは適当である。","正しい。ガスエンジン等の排熱を熱源として利用する排熱投入型吸収冷温水機は、コージェネレーションの排熱利用として適当である。"],"2021-環境・設備-12":["正しい。定風量単一ダクト方式は、常に最大風量を搬送するため、変風量方式に比べ搬送動力が大きくなる。記述は適当である。","正しい。個別分散方式は、機器を天井内等に設置でき、中央式のような大きな機械室やダクトスペースを小さくできる。記述は適当である。","正しい。放射空調は放射パネルとの放射熱交換で温熱環境を作るため、気流や温度むらによる不快感が少ない。記述は適当である。","誤り。床吹出し空調は、居住域に直接給気するため室内の上下温度差が小さくなりやすい。暖房運転時の垂直温度差が大きいとする記述は不適当である。"],"2021-環境・設備-13":["正しい。一般事務室の必要換気量は1人あたり約30m³/hであり、40席で1,200m³/hとなる。記述は適当である。","正しい。喫茶店の客席は1人あたり約30m³/hで、40席なら1,200m³/hとなる。記述は適当である。","誤り。劇場の客席は1人あたり約30m³/hが必要で、400席では12,000m³/h程度となる。6,000m³/hでは不足であり、不適当である。","正しい。自走式の地下駐車場は、床面積1m²あたり14m³/h程度を目安とし、1,000m²では14,000m³/hとなる。記述は適当である。"],"2021-環境・設備-14":["誤り。排水再利用の雑用水は、便器洗浄水や修景用水などに用いる。人の接触の可能性がある清掃用水などへの使用は衛生上避けるべきで、記述は不適当である。","正しい。雑用水槽は飲料水槽と異なり、建築物の躯体を利用した床下ピットを受水槽に用いることも可能である。記述は適当である。","正しい。雨水の再利用水が下水道料金の対象となる地域では、使用量を把握するため、量水計を設置する。記述は適当である。","正しい。飲食施設のない中小規模の事務所では、飲料水の割合は小さく、雑用水が多くを占める。30%対70%は設計値として適当である。"],"2021-環境・設備-15":["誤り。グリース阻集器は、油脂分の分離とともに、それ自体が封水によるトラップ機能を備えている。下流に臭気防止用のトラップを別に設ける必要はなく、二重トラップとなるので不適当である。","正しい。公共下水道への排水温度は、原則として45℃未満としなければならない。記述は適当である。","正しい。ディスポーザ排水処理システムは、排水中のBODなどを基準値以下にして下水道へ放流する。記述は適当である。","正しい。即時排水型ビルピットは貯留時間を短くでき、硫化水素等の悪臭物質の発生を抑制できる。記述は適当である。"],"2021-環境・設備-16":["正しい。非常電源専用受電設備は商用電源の停電時に電力を供給できないため、大規模な特定防火対象物の非常電源には使えない。","正しい。蓄電池を使用しない自家発電設備は、停電から電圧確立・投入までの所要時間を40秒以内とする必要がある。記述は適当である。","正しい。デュアルフューエルシステムは、通常時はガス、ガス供給停止時には重油等の液体燃料を使える発電方式である。記述は適当である。","誤り。燃料電池設備は、基準に適合すれば消防用設備等の非常電源とすることができる。気体燃料を用いることを理由に非常電源にできないとする記述は不適当である。"],"2021-環境・設備-17":["正しい。配光が同じなら、器具効率が高いほど光源から出た光が有効に出てくるため、照明率は高くなる。記述は適当である。","誤り。器具効率が同じなら、配光が広がるほど壁などへ光が逃げ作業面に届く割合が減り、照明率は低くなる傾向にある。広いほど高いとする記述は不適当である。","正しい。室指数が同じなら、室内反射率が高いほど反射光が増え、照明率は高くなる。記述は適当である。","正しい。室内反射率が同じなら、室指数が大きい(室が広い)ほど壁面での損失が少なく、照明率は高くなる。記述は適当である。"],"2021-環境・設備-18":["正しい。パッケージ型自動消火設備は、一定の条件でスプリンクラー設備の代替設備として認められており、特別養護老人ホームにも設置できる。","正しい。泡消火設備は窒息効果と冷却効果により消火し、地下駐車場など油火災のおそれのある場所に適している。記述は適当である。","正しい。ドレンチャー設備は水幕により延焼を防ぐ設備で、重要文化財の神社などに設置される。記述は適当である。","誤り。消防用水は消防隊が使用する水源であり、屋内消火栓設備やスプリンクラー設備等の初期消火設備の専用水源とはならない。これらには別に水源を設ける。"],"2021-環境・設備-19":["正しい。非常用エレベーターの機械室は、機械の配置と管理に支障がなければ、床面積を昇降路の水平投影面積の2倍以上としなくてもよい。","正しい。送風機を並列運転すると、管路抵抗の増加のため風量は単独運転時の2倍にならない。記述は適当である。","正しい。ヒートポンプ給湯機は大気熱を利用して給湯を加熱し、冷媒に二酸化炭素を用いたものがある。記述は適当である。","誤り。屋外機を分散設置すると冷媒管が短くなり、高低差が少なくなるため、一般に運転効率は向上する。低下するとする記述は不適当である。"],"2021-環境・設備-20":["誤り。BELSは、BEIの値が小さいほど省エネ性能が高く、星の数が増える。BEIが大きいほど星が増えるとする記述は不適当である。","正しい。新築住宅の省エネ基準では、原則として外皮平均熱貫流率(UA値)や冷房期の平均日射熱取得率(ηAC値)を、地域区分ごとの基準値以下とすることが求められる。","正しい。病院やホテルなど被災時に救護・避難の場となる施設のBCPでは、ライフラインの広域停止に備えた設備を事前に計画することが望ましい。","正しい。地域冷暖房は、未利用熱の活用による排熱削減が期待でき、ヒートアイランド現象の緩和にも効果的である。"],"2020-環境・設備-1":["正しい。PMVは気温・放射温度・相対湿度・気流速度の環境側4要素に、人体の代謝量・着衣量を加えた6要素から温熱感覚を予測する指標である。","正しい。色温度は、光源の光色を、それに近い色度の光を放つ黒体の絶対温度(K)で表したものである。","正しい。音響エネルギー密度レベルは、単位体積当たりの音の力学的エネルギー量(音響エネルギー密度)をデシベルで表したものである。","誤り。実効放射は地表面放射と大気放射の差で表される地表面の長波長放射収支で、昼夜を問わず生じる。夜間に限定した定義ではない点が誤り。"],"2020-環境・設備-2":["誤り。外壁の熱貫流率は各層の熱抵抗の和で決まり、断熱材の位置(室内側か室外側か)には左右されない。取合い部の熱橋を考えなければ同じ値になる。","正しい。熱貫流率は総熱抵抗の逆数なので、各部材の熱伝導抵抗が大きくなれば総熱抵抗が増え、熱貫流率は小さくなる。","正しい。放射率が大きいと表面の放射熱伝達率が大きくなり、総合熱伝達率が増えて総熱抵抗が減るため、熱貫流率は大きくなる。","正しい。風速が大きいと外表面の対流熱伝達率が大きくなり、表面熱抵抗が小さくなるので、熱貫流率は大きくなる。"],"2020-環境・設備-3":["正しい。飽和水蒸気量は温度が高いほど大きいので、相対湿度が同じでも乾球温度が異なれば1m³中の水蒸気量は異なる。","正しい。乾球温度一定で相対湿度が低くなると絶対湿度が小さくなり、水蒸気分圧が下がるので、露点温度も低くなる。","正しい。乾球温度と湿球温度が分かれば湿り空気線図から相対湿度が読み取れ、絶対湿度や水蒸気分圧も求められる。","誤り。相対湿度を一定に保ったまま乾球温度を上げると飽和水蒸気量が増えるため、必要なのは加熱と加湿である。除湿ではない。"],"2020-環境・設備-4":["誤り。図が示せないため断定的な判定は難しいが、熱容量・断熱性能の大小と立上がり・冷め方の対応が正解の組合せと一致しない。","正しい。断熱性能が同じAとC、BとDで、熱容量が大きいほど立上がりが遅く暖房停止後も冷めにくい特性が対応し、断熱が高いほど到達室温が高く下がりにくい。","誤り。図の条件から判断される熱容量・断熱性能と室温変動の対応が、正解の組合せと一致しない。","誤り。熱容量が大きいと室温の立上がり・低下が緩やか、断熱が高いと高温で保たれるという関係に、正解の組合せと照らして合致しない。"],"2020-環境・設備-5":["誤り。排煙口は煙が避難経路へ流れないよう、避難方向と逆の方向に設けるのが望ましい。避難方向と同一方向に設けるのは不適当である。","正しい。防火区画された売場ごとに避難時間や避難扉幅当たりの人数を概ね均等にすると、特定の階段への集中を避けられる。","正しい。自然排煙は煙の浮力を利用するため、煙層温度が低いと浮力が小さく、天井高が低いと煙層厚が確保しにくく、排煙効果は小さくなる。","正しい。水平避難方式は、隣接する防火区画へ移動して時間的余裕を確保したうえで介助避難を行う方式で、病院等で採用される。"],"2020-環境・設備-6":["正しい。昼光による最低照度確保の設計では、暗い日の値として設計用全天空照度に5,000lxを用いるのが一般的である。","正しい。頂側窓は高所の鉛直に近い窓で、北側採光に用いると直射日光を避けられ、安定した光環境が得られる。","誤り。昼光率は窓外の建築物や樹木などの遮蔽物の有無によって変わる。室中央でも一定にはならない。","正しい。大気透過率が大きいほど直達日射が増え、散乱成分である天空日射量は小さくなる。"],"2020-環境・設備-7":["誤り。光束発散度は照度に反射率を乗じたもの(完全拡散面なら輝度のπ倍)である。輝度に反射率を乗じたものではない。","正しい。対象と背景の輝度対比が大きいほど対象が見えやすくなり、視力は上がる。","正しい。光束は放射束(単位時間当たりの放射エネルギー)に比視感度で重みづけして求めた、光の量を表す量である。","正しい。照度均斉度は最小照度/最大(または平均)照度で表すので、大きいほど照度分布が均一に近い。"],"2020-環境・設備-8":["正しい。ジャッドの秩序性の原理では、色相環上で等間隔に配した色の組合せは調和するとされる。","誤り。明所視の比視感度は555nm付近の緑が最大で、赤は低い。放射エネルギーが同じなら緑のほうが強く感じられる。","正しい。加法混色では混ぜる色光を増やすほど明るくなり、3原色を等量混ぜると白色に近づく。","正しい。マンセル表色系のバリュー(明度)は、黒を0、白を10とする0〜10の尺度で表される。"],"2020-環境・設備-9":["正しい。平均吸音率が2倍になると室内の音のエネルギー密度が1/2になり、平均音圧レベルは約3dB減少する。","正しい。自由音場の点音源では距離が4倍になると約12dB減衰するので、70dBは約58dBになる。","正しい。セイビンの式T=0.161V/Aのとおり、残響時間は室容積に比例し、等価吸音面積に反比例する。","誤り。空気の音響吸収による減衰は高周波数域ほど大きい。低周波数域の音ほど減衰するという記述は逆である。"],"2020-環境・設備-10":["正しい。多孔質吸音材を厚くしたり背後に空気層を設けたりすると、低周波数域の吸音率が上昇する。","正しい。孔あき板構造は、孔部の空気と背後空気層がヘルムホルツ共鳴器として働き、共鳴周波数付近の音を吸音する。","誤り。単層壁の透過損失の実測値は、コインシデンス効果などにより質量則による予測値より小さくなる傾向がある。大きくなるのは誤り。","正しい。通気性の低い材料で表面を覆うと音が材料内部に入りにくくなり、高周波数域の吸音率が低下する。"],"2020-環境・設備-11":["正しい。井水は温度が年間で安定し、冷房時は外気より低く暖房時は高いため、空気熱源ヒートポンプよりCOPが高くなる。","正しい。冷凍機は年間の大半を部分負荷で運転するため、定格COPだけでなく部分負荷時のCOPも考慮して選定する。","正しい。水蓄熱槽は熱源を高効率な全負荷で運転でき、補機を含めたシステム全体のエネルギー効率向上にも寄与する。","誤り。冷水出口温度を高く設定すると蒸発温度が上がり圧縮仕事が減るため、COPは高くなる。低くなるは誤り。"],"2020-環境・設備-12":["正しい。ナイトパージは夜間の低温外気で蓄熱体を冷やして翌日の立上げ負荷を減らす手法で、昼間の外気冷房より低い外気温度でも利用できる。","誤り。冷却塔フリークーリングは冷凍機を停止し、冷却塔で冷やした冷却水を熱交換して冷水を得る手法である。冷却塔ファンは運転するので、動かさないという記述が不適当である。","正しい。デシカント空調の再生にコージェネの排熱を利用できるため、排熱利用が進み、システム全体の総合効率の向上に寄与する。","正しい。放射暖房は放射パネルの放射率が高いことが必要で、反射率の高い受照面には十分な効果が期待できない。"],"2020-環境・設備-13":["正しい。厨房は臭気や熱が他室に流出しないよう負圧にするため、排気量を給気量よりやや大きくする。","正しい。置換換気は、汚染物質が周囲より高温・軽量で上昇する場合に、下部から低速で給気し上部で排出する形で有効である。","誤り。第二種機械換気は室内が正圧となり排気ガスが周辺諸室へ流出しやすい。駐車場は負圧となる第三種や、第一種機械換気とするのが一般的である。","正しい。全熱交換器で外気負荷を低減できるため、熱源装置の容量を小さくできる。"],"2020-環境・設備-14":["正しい。集合住宅の1日当たり給水量は居住者1人当たり概ね200〜350l程度で、250l/日は妥当な値である。","正しい。事務所ビルの給水量は在勤者1人当たり概ね60〜100l/日程度で、60l/日は妥当な範囲である。","正しい。客室主体のホテルの給水量はベッド1台当たり数百l/日程度で、500l/日は一般的な算定値の範囲として扱われる。","誤り。総合病院のベッド1台当たりの給水量は1,500〜3,500l/日程度と大きく、300l/日では過小である。"],"2020-環境・設備-15":["正しい。各個通気方式は各トラップごとに通気管を設ける方式で、自己サイホン作用の防止に有効である。","正しい。ループ通気方式は2個以上のトラップを保護し、通気管を最高位器具のあふれ縁より高く立ち上げて通気立て管に接続する。","誤り。伸頂通気方式は通気立て管を持たないため、各個通気方式やループ通気方式に比べて許容流量は小さい。大きいとするのは誤り。","正しい。通気弁は管内が負圧のときに開いて空気を吸引し、排水負荷がない時や正圧時には閉じる機構をもつ。"],"2020-環境・設備-16":["誤り。単相2線式が最大で単相3線式が最小となるため、AとBの大小関係が逆になっている。","正しい。電圧降下は単相2線式が最大、三相3線式はその約√3/2倍、単相3線式は平衡負荷で中性線に電流が流れず最小となり、A＞C＞Bとなる。","誤り。三相3線式は単相2線式より電圧降下が小さく、Cが最大にはならない。","誤り。単相3線式の電圧降下は最も小さく、Cが最大でBが中間となる関係は成り立たない。"],"2020-環境・設備-17":["正しい。パワーコンディショナは直流を交流に変換するインバータに、系統連系保護装置や制御装置などを組み込んだ装置である。","誤り。アレイ(モジュール)からパワーコンディショナまでは直流配線、パワーコンディショナから配電盤までは交流配線で、直流と交流が逆の記述になっている。","正しい。風車は回転軸の向きにより水平軸風車と垂直軸風車に分類され、垂直軸風車は小型風車での採用例が多い。","正しい。DCリンク方式は直流段で一旦電力を平滑化してから連系するため、一般に出力変動の影響を受けにくく安定した電力として連系しやすい。"],"2020-環境・設備-18":["正しい。1号消火栓は、各階の各部分からホース接続口までの水平距離を25m以下とする(2号消火栓は15m以下)。","正しい。スプリンクラー設備の補助散水栓は、各部分からホース接続口までの水平距離が15m以下となるよう設置する。","誤り。屋外消火栓は、建築物の各部分からホース接続口までの水平距離が40m以下となるよう設置する。50m以下とするのは誤り。","正しい。連結送水管の放水口は3階以上の階ごとに、各部分から水平距離50m以下となるよう設ける。"],"2020-環境・設備-19":["誤り。天井放射冷房は放射による顕熱処理を主とし、潜熱(除湿)処理は別途外気処理等で行う。潜熱処理を主目的とするのは誤り。","正しい。コージェネレーションの機種によっては、常用発電と消防法・建築基準法上の非常用発電を兼用でき、スペースや保守費の削減に効果がある。","正しい。常用エレベーターは災害時の使用を想定せず、人命確保と閉込め回避を優先する。","正しい。非常用エレベーターを複数台設ける場合は、避難上・消火上有効な間隔を保って配置する。"],"2020-環境・設備-20":["正しい。eマークは建築物が省エネルギー基準に適合していることを、所管行政庁が認定したことを示す表示である。","正しい。LEEDは建築物や敷地の環境性能評価システムで、獲得ポイントの合計により4段階(認証・シルバー・ゴールド・プラチナ)に認証される。","正しい。PAL*は外皮の熱的性能を表す指標で、値が小さいほど外皮の熱性能が高いと判断される。","誤り。事務所ビルのライフサイクルCO₂では、数十年に及ぶ運用段階の排出量が最も大きな割合を占める。設計・建設・廃棄段階のほうが大きいとするのは逆である。"],"2019-環境・設備-1":["正しい。等価騒音レベルは、聴感補正した音圧レベルをエネルギー平均した値で、変動する騒音の評価に用いられる。","誤り。プルキンエ現象は、明所視に比べ暗所視では青が明るく、赤が暗く見える現象である。赤が明るく青が暗くという記述は逆である。","正しい。空気齢は、流入口から入った空気が室内のある地点に到達するまでの平均経過時間で、換気効率の指標である。","正しい。作用温度は、発汗の影響が小さい環境で用いられる指標で、空気温度と平均放射温度の重み付け平均で表される。"],"2019-環境・設備-2":["誤り。0.005kg/kg(DA)は外気との差分にすぎない。結果の湿度は外気の0.010に発生分0.005を加えた値になる。","誤り。0.010kg/kg(DA)は外気の絶対湿度そのものである。室内では水蒸気発生により、これより高くなる。","正しい。換気量は100×1.0×1.2=120kg(DA)/hなので、湿度上昇は0.6/120=0.005となり、室内は0.010+0.005=0.015kg/kg(DA)である。","誤り。0.020kg/kg(DA)になるには湿度上昇が0.010必要だが、実際は0.6/120=0.005なので過大である。"],"2019-環境・設備-3":["誤り。重力換気量は開口面積と√(中心間距離)に比例する。Aは0.4×√4=0.8、Bは0.6×1.4=0.84で、A＞Bは成り立たない。","正しい。上下開口が同面積のとき換気量は開口面積×√(高さ)に比例し、A:0.8、B:0.6×1.4=0.84、C:0.7となり、Q_B＞Q_A＞Q_Cとなる。","誤り。Cは0.7×1=0.7と3者の中で最小で、AやBを上回らない。","誤り。Cは換気量が最小で、Q_Cが最大になることはない。"],"2019-環境・設備-4":["正しい。熱橋部分は熱が伝わりやすいため、室内側表面温度は他の部分より低く、外気温度に近くなる。","誤り。中空層が真空でも放射による伝熱があるため、複層ガラスの熱貫流率はゼロにならない。","正しい。中空層の熱抵抗は厚さとともに増えるが、ある厚さ以上では対流が生じて、ほとんど変化しなくなる。","正しい。外壁外気側の総合熱伝達率は、対流と放射を合わせた熱伝達率で、日射や夜間放射の影響を考慮しない値として扱われる。"],"2019-環境・設備-5":["誤り。噴出火炎が外壁から離れにくく上階延焼の危険が高いのは横長の窓である。縦長の窓は火炎が外壁から離れやすく、記述は逆である。","正しい。手術室、ICU、NICUなどは移動が困難なため、その場で安全を確保する籠城区画として計画することが望ましい。","正しい。不特定多数が利用する店舗では、避難方向に開く外開き扉とするのが望ましい。ただし廊下の有効幅員には配慮する。","正しい。階段室への出入口は流動係数が階段より大きく、人が流れやすいため、有効幅員を階段より狭くしても合理的である。"],"2019-環境・設備-6":["正しい。南向き窓は太陽高度が高いため水平ルーバー、西向き窓は低い角度から日が差すため垂直ルーバーが有効である。","正しい。北緯35度の春分・秋分の日は、終日快晴であれば1日の積算日射量は水平面が南向き鉛直面など他のどの鉛直面よりも大きい。","誤り。直射日光の色温度は、太陽高度が高い正午頃のほうが高く青白い。日没前は光が大気中を長く通り赤みを帯び、色温度は低くなる。","正しい。ライトシェルフは上面で昼光を反射して天井面へ導き、室奥まで届けるとともに窓際の明るさを抑えるため、室内照度の均斉度が高まる。"],"2019-環境・設備-7":["正しい。E=Icosθ/r²より、100×1/2²=25lxとなり、記載値と一致する。","正しい。E=Icosθ/r²より、100×cos60°/1²=100×0.5=50lxとなり、記載値と一致する。","正しい。E=Icosθ/r²より、25×1/0.5²=100lxとなり、記載値と一致する。","誤り。E=Icosθ/r²より、50×0.5/0.5²=100lxとなる。200lxではないため、この組合せが不適当である。"],"2019-環境・設備-8":["正しい。減法混色の三原色はシアン、マゼンタ、イエローで、混ぜるほど暗くなる。加法混色の三原色は赤、緑、青である。","正しい。同化現象は、囲まれた色や挟まれた色が周囲の色に近づいて見える現象である。対比とは逆の見え方になる。","誤り。JISの有彩色の系統色名は、基本色名に「明度及び彩度に関する修飾語」と「色相に関する修飾語」の2種類を付記する。3種類ではない。","正しい。一般に低照度では低色温度の暖かい光色が、高照度では高色温度の涼しい光色が好まれる傾向がある（クルーゾフの曲線）。"],"2019-環境・設備-9":["誤り。マスキングはマスカーの周波数に近い音ほど生じやすいが、低い周波数のマスカーは高い音を、より強くマスクする。低い音のほうがマスクされやすいとの記述は逆である。","正しい。カラレーションは直接音と短い遅れ時間の反射音の干渉により、音色が変化して聞こえる現象である。","正しい。最適残響時間は用途で異なり、オペラハウスは音声の明瞭性を重視するため、室容積が同じでもコンサートホールより短く設定される。","正しい。学校の普通教室では、平均吸音率が0.2程度となるよう吸音対策を行い、残響を抑えて音声の明瞭度を確保することが望ましい。"],"2019-環境・設備-10":["正しい。孔あき板と空気層による共鳴吸音構造の共鳴周波数は、空気層が厚くなるほど低周波数側へ移動する。","誤り。公共施設の放送音声は残響が長いと聞き取りにくくなる。明瞭度を確保するため、天井などに吸音処理を施すことが望ましい。","正しい。乾式二重床は空気層がバネとなり共振系を形成するため、低周波数域で床衝撃音の遮断性能が低下することがある。","正しい。透過損失TL=10log(1/τ)なので、10dB増やすには音響透過率τを現状の1/10にする必要がある。"],"2019-環境・設備-11":["正しい。ペリメーターレス化は、建築的手法（高断熱・日射遮蔽）と設備的手法を併用し、ペリメーターの熱負荷を減らして内部に近い温熱環境にする。","正しい。VAV方式はVAVユニットを室やゾーンごとに設けて送風量を調整するため、個別の温度制御が可能である。","誤り。外気冷房は、外気のエンタルピーが室内空気より低い場合に、その差を冷房に利用する方式である。高い場合は冷房負荷が増える。","正しい。ダブルスキンは外壁をガラスの二重構造とし、中間層の換気などで熱負荷を低減し、窓際の温熱環境を改善するものである。"],"2019-環境・設備-12":["正しい。シックハウス対策の機械換気では、天井高さが2.7m以上の場合などに、高さの区分に応じて必要換気回数を低減できる。","正しい。クリーンルームは周囲に対して正圧とし、外部からの塵埃の流入を防止して清浄度を保つ。","正しい。ウォーミングアップ制御では、外気ダンパーを全閉、還気ダンパーを全開にして外気負荷を抑え、空調の立ち上がり時間を短縮する。","誤り。中央熱源方式でも、タスク・アンビエント空調や個別の温度調整機器を併用してパーソナル空調として採用される例がある。採用されないとの断定は誤りである。"],"2019-環境・設備-13":["誤り。長方形ダクトのアスペクト比は、圧力損失や騒音を抑えるため4以下とするのが望ましく、6:1は大きすぎて不適当である。","正しい。セントラルダクト方式の高層建築物では、ダクトスペースを小さくするため高圧ダクト（小断面）とすることがある。","正しい。軸流吹出し口では、居住域上面の風速を0.5m/s以下に抑えるとドラフトによる不快感を避けられる。","正しい。水蓄熱槽では、高温水と低温水の混合を防ぎ、温度成層を保つことで蓄熱性能を十分に発揮できる。"],"2019-環境・設備-14":["正しい。水道直結直圧方式は水道本管の圧力のみを利用するため、一般に3階建て以下の小規模な建築物に適用される。","正しい。高置水槽方式は受水槽から高置水槽へ揚水し重力で給水する方式で、大規模な建築物にも適用でき、給水圧力が安定する。","誤り。水道直結増圧方式は増圧ポンプによる水道本管への逆流の恐れがあるため、逆流防止措置を講じる必要がある。","正しい。ポンプ直送方式は給水ポンプで直接給水するため、停電時は受水槽内の水が使えず、非常用電源がなければ給水できない。"],"2019-環境・設備-15":["正しい。災害時医療施設の受水槽に、地震感知で作動する緊急給水遮断弁を設ければ、受水槽内の水を確保できる。","正しい。公共下水道が合流式の場合、雨水排水と汚水排水は屋外の排水ますで合流させて接続できる。","正しい。レジオネラ属菌の繁殖を防ぐため、貯湯槽内の湯温は60℃以上に保つこととされている。","誤り。伸頂通気管の管径は排水立て管の管径以上とする。通気管を排水立て管より小さくすると、通気性能が確保できず不適当である。"],"2019-環境・設備-16":["正しい。電圧の区分は、交流で600V以下、直流で750V以下が低圧であり、これを超え7,000V以下が高圧である。","正しい。力率は、皮相電力（電圧と電流の積）に対する有効電力の比率であり、1に近いほど効率がよい。","誤り。バスダクト方式は大容量の電力供給に適し、負荷の増設にも対応しやすい。対応しにくく小容量に限るとの記述は誤りである。","正しい。UPSは整流器・蓄電池・インバータ等で構成され、瞬時電圧低下や停電時にも安定した電力を供給する。"],"2019-環境・設備-17":["誤り。手術室や診察室では、患者の顔色や血色、患部の状態を正確に判断する必要があるため、事務室より演色性の高い光源を用いる。","正しい。LEDは熱放射が少なく、寿命が長くランプ交換頻度も少ないため、住宅の間接照明に適している。","正しい。高輝度の小型LEDは眩しさを生じやすいため、光源が直接目に入らないようグレアに配慮する。","正しい。昼光利用のブラインド自動制御と照度センサーによる照明制御を併用すれば、照明の消費電力を削減できる。"],"2019-環境・設備-18":["正しい。水噴霧消火設備は、噴霧水の冷却作用と、発生した水蒸気による窒息作用等で火災を抑制・消火する固定式設備である。","正しい。排煙設備は専用設備が原則だが、換気設備が排煙設備としての性能を有すると確認された場合は兼用が認められることがある。","正しい。屋外消火栓設備は、建築物の1階及び2階部分の火災の消火と、隣接建築物への延焼防止を目的とする。","誤り。連結送水管は、消防隊が消防ポンプ車から送水して消火活動に使うもので、散水ヘッドからは放水しない。記述は連結散水設備の内容である。"],"2019-環境・設備-19":["誤り。冷却塔から出る湿った空気や飛散水にはレジオネラ属菌等が含まれる恐れがあるため、外気取入れ口からは離して計画する。","正しい。リバースリターン方式は往き管と還り管の流量が等しい系統に適するが、給湯管と返湯管のように流量が大きく異なる場合は適さない。","正しい。分流式下水道区域では、雨水管の敷地境界部に雨水トラップを設け、下水道本管からの害虫等の侵入を防止する。","正しい。空調用蓄熱槽の水は、必要な措置が講じられていれば消防用水として利用できる。"],"2019-環境・設備-20":["正しい。微気候は、地表面近くの気候や、室内の建築部材付近・人体の皮膚付近の気候など、ごく狭い範囲の気候をいう。","正しい。バスタブ曲線は縦軸を故障率、横軸を時間とし、初期故障・偶発故障・摩耗故障の推移で設備の信頼性・保全性を示す。","正しい。HFCはオゾン破壊係数は0だが地球温暖化係数が高い温室効果ガスであり、排出抑制が求められている。","誤り。CASBEEのBEEは環境品質Qを環境負荷Lで除した値で、BEEの値が大きいほど環境性能が高いと評価される。"],"2018-環境・設備-1":["正しい。長波長放射率は、同温度の完全黒体の放射エネルギーに対する、ある部材表面の放射エネルギーの比である。","正しい。エネルギー代謝率（RMR）は、労働代謝量の基礎代謝量に対する比で、作業強度を表す指標である。","誤り。光幕反射は、光沢面の反射光が文字と紙面の輝度対比を小さくし、見えにくくなる現象である。対比が大きくなるとの記述は誤りである。","正しい。音の干渉は、複数の音波が重なり合い、位相関係によって振幅が強め合ったり弱め合ったりする現象である。"],"2018-環境・設備-2":["正しい。露点温度は絶対湿度で決まるため、加熱しても絶対湿度が同じなら露点温度は変わらない。","正しい。室内側にカーテンを設けるとガラス面が冷えやすく空気の流れも滞るため、結露防止は期待できず、むしろ結露しやすくなる。","正しい。二重サッシでは、室内側サッシの気密性を室外側より高くし、室内の湿った空気の流入を防ぐことで中間の結露を抑える。","誤り。押入れ内の結露防止には、室内の暖かい空気が入りやすいよう襖の断熱性を低くしたり、換気を図ることが有効である。断熱性を高めると逆効果である。"],"2018-環境・設備-3":["正しい。全般換気は、室全体の空気を入れ替えて、汚染物質を希釈・拡散・排出する換気方式である。","正しい。第一種機械換気は給気機と排気機を併用するため、室圧を正圧にも負圧にも制御でき、正圧を保つ室にも採用できる。","誤り。風圧力による換気量は、外部風速に比例する。平方根に比例するのではない。なお、温度差換気は温度差の平方根に比例する。","正しい。外気温が室温より高い場合は気流が逆転し、外気は中性帯より上側の開口から流入して下側の開口から流出する。"],"2018-環境・設備-4":["正しい。断熱性能を高めると、室温と室内表面温度の差や上下の温度差が小さくなり、温熱環境が均一になる。","正しい。相当外気温度（SAT）は、外気温に日射吸収量や外表面の熱伝達率（風速の影響を受ける）を加味した値である。","誤り。日射熱取得率は、ガラスに入射した日射量に対する、透過した日射と吸収後に室内へ放出される熱の合計の割合である。透過分のみの割合ではない。","正しい。空隙率が同じなら、気泡寸法が大きいほど気泡内の対流・放射が増え、熱伝導率は大きくなる。"],"2018-環境・設備-5":["正しい。防火扉は、火災や煙の伝播・拡大を防ぐため、自動的に閉鎖する機構を備える。","正しい。層間区画は、上下階の延焼防止のため、耐火・準耐火構造のスラブ等の水平部材と、スパンドレル等の垂直部材で形成する。","誤り。火災室から廊下へ流出した煙の水平方向の流動速度は0.5～1.0m/s程度である。3～5m/sは垂直方向（階段など）の流動速度である。","正しい。アカマツ、ケヤキ等の木材は、約260℃で引火し、約450℃に達すると自然に発火する。"],"2018-環境・設備-6":["誤り。点Pの水平面照度は、窓面の屋外側鉛直面照度ではなく、全天空照度に昼光率を乗じた値となる。","正しい。内装材を暗い色にすると室内反射光（間接光）が減るため、点Pの昼光率は小さくなる。","正しい。窓が完全透過で窓枠が小さく、間接光を無視できるとき、昼光率は窓面の立体角投射率にほぼ等しくなる。","正しい。机を窓に近づけると窓面を見込む立体角が大きくなるため、窓面の立体角投射率は大きくなる。"],"2018-環境・設備-7":["正しい。JH=JN×sin60°より、JN=JH/(√3/2)=2JH/√3。JV=JN×cos60°=JN/2=JH/√3となり、この組合せが適当である。","誤り。JNは2JH/√3で正しいが、JVはJN×cos60°=JH/√3である。√3/JHでは分子分母が逆で、日射量の次元にもならない。","誤り。JN=JH/sin60°=2JH/√3であり、2JHではない。JV=JH/√3の部分は正しいが、JNが誤りである。","誤り。JN=JH/sin60°=2JH/√3であり、2JHではない。またJV=JN×cos60°=JH/√3で、√3・JHではない。"],"2018-環境・設備-8":["正しい。色の恒常性により、照明光が多少変化しても、一様に照らされていれば物体の色は同じ色として認識される。","誤り。明度は視感反射率に対応する値だが、マンセル表色系ではバリュー（V）で表す。ヒュー（H）は色相のことである。","正しい。全波長を均等に反射する物体は無彩色で、反射率が高いほど太陽光の色に近い白に見える。","正しい。色光の誘目性は、一般に色相では赤が最も高く、青がこれに次ぐとされる。"],"2018-環境・設備-9":["正しい。強さのレベルL=10log(I/I0)なので、30dB下げるには音の強さを1/1,000にする。","正しい。最適残響時間は、一般に室容積が大きくなるほど長くなる。","正しい。同じ音圧レベルでも、人の聴覚は低音域で感度が低く感じ、3～4kHz付近で最も敏感になる。","誤り。カクテルパーティー効果は、騒がしい中でも聞きたい音を選択的に聞き取れる現象である。聞き取りにくくなる現象ではない。"],"2018-環境・設備-10":["誤り。吸音率は、入射する音のエネルギーに対する、反射されなかった音（壁内部で吸収される分と透過する分）の割合である。吸収分だけの割合ではない。","正しい。板振動型吸音は低周波数域が主体で、空気層にグラスウールを入れても高周波数域の吸音効果はあまり期待できない。","正しい。反射性の高い室に吸音材を設置すると、受音室の音圧レベルが下がり、室間音圧レベル差は大きくなる。","正しい。ダクト内は音の減衰が小さいため、吸音材の内貼りなどによる消音対策が一般に行われる。"],"2018-環境・設備-11":["誤り。営業用厨房は、臭気・熱・蒸気が客席側へ流出しないよう、厨房側を客席側よりも負圧に保つのが一般的である。正圧にすると厨房の臭気が客席へ流れてしまう。","正しい。ボイラー室の給気量は、燃焼に必要な空気量に、室内の発熱を除去するための換気量を加えた量とするのが一般的な考え方である。","正しい。中間期など外気温が低く外気冷房が有効なときは、全熱交換器をバイパスして外気をそのまま取り入れるほうが、熱交換による負荷を避けられ省エネルギー上有効である。","正しい。置換換気は、下部から低温の新鮮空気を供給し、上部に高温の汚染空気を溜めて排出する方式で、空気の密度差による浮力を利用している。"],"2018-環境・設備-12":["正しい。吸収冷凍機は、機内を真空に近い低圧状態で運転するため、圧力による破裂等のおそれが少なく、取扱いが比較的安全である。","誤り。冷却塔の出口水温（冷凍機の冷却水入口温度）は、低いほど冷凍機の成績係数が向上して省エネになる。許容範囲内で高い温度にする運転は不利である。","正しい。冷却塔は水の蒸発による気化熱で冷却するため、冷却水温度は理論上、外気の湿球温度より低くすることはできない。","正しい。APFは通年エネルギー消費効率で、想定した年間の空調負荷を年間の消費電力量で除して求める指標である。"],"2018-環境・設備-13":["正しい。デシカント空調は、除湿剤で水分を吸着して潜熱を効率よく処理でき、潜熱と顕熱を分離して処理する空調システムに利用できる。","誤り。床吹出し空調は、冷房時は居住域の上下温度差が生じにくいが、暖房時は温風が上昇しやすく上下温度差が生じやすい。冷暖房いずれでも生じにくいとは言えない。","正しい。蓄熱槽方式は、負荷が小さい中間期でも、冷凍機を高効率な状態で運転して熱を蓄えられるため、成績係数（COP）を高く維持しやすい。","正しい。放射暖房は、床・壁・天井や放射パネルを加熱し、その放射熱で暖房する方式であり、気流が少なく快適性が高い。"],"2018-環境・設備-14":["正しい。上水受水槽の点検スペースは、上部に100cm以上、側面と下部に60cm以上とする。記述はこの基準を満たしている。","正しい。消火用水槽は上水受水槽と兼用せず別に設ける必要があるが、別に設ける場合に建築物の地下ピットを利用することは可能である。","正しい。屋外の散水栓などは、汚水の逆流による汚染を防ぐため、バキュームブレーカーを設ける。","誤り。上水の給水配管と井戸水配管をバルブを介して接続することは、クロスコネクションとなり、バルブを閉じていても禁止されている。"],"2018-環境・設備-15":["正しい。給湯能力の1号は、1Lの水の温度を1分間に25℃上昇させる能力である。","誤り。膨張管は、加熱による水の膨張を逃がす安全装置の管であり、止水弁を設けてはならない。誤って閉止すると機器が破裂するおそれがある。","正しい。グリース阻集器は器自体にトラップ機能があるため、流入管にトラップを設けると二重トラップになるので設けない。","正しい。排水槽の通気管は、悪臭を考慮して、排水管に接続する通気管とは別に単独で設け、外気に開放する。"],"2018-環境・設備-16":["正しい。同一容量の負荷では、電圧を高くするほど電流が小さくなるため、200Vより400Vのほうが細い電線を使用できる。","誤り。スターデルタ始動は、始動時に巻線電圧を下げて始動電流を全電圧始動の約3分の1に抑える方式であり、始動電流は全電圧始動より小さくなる。","正しい。進相コンデンサは、遅れ力率を改善（力率を向上）するために受変電設備に設置される。","正しい。受電方式には1回線受電方式のほか、信頼性の高いスポットネットワーク受電方式や予備電源線受電方式などがある。"],"2018-環境・設備-17":["正しい。デュアルフュエル型は、通常時はガス、ガス供給停止時には重油等の液体燃料で運転でき、災害時の信頼性を高められる。","正しい。屋内の燃料槽に、消防法の指定数量以上の危険物（重油等）を貯蔵する場合は、屋内貯蔵所等として規制を受ける。","正しい。燃料電池設備は、消防法令の基準に適合すれば、消防用設備等の非常電源として使用できる。","誤り。コージェネレーションの発電効率は、一般にガスタービンよりガスエンジンのほうが高い。ガスタービンは発電効率は低めだが排熱回収量が大きい。"],"2018-環境・設備-18":["正しい。閉鎖型スプリンクラーヘッドは、感度種別が1種で有効散水半径が2.6m以上のものを高感度型という。","誤り。厨房・ボイラー室・サウナ室は平常時の温度変化が大きく、差動式熱感知器では誤作動しやすい。このような場所には定温式感知器を設置する。","正しい。非常用の照明装置は、常温下の床面で水平面照度1lx以上（蛍光灯・LEDは2lx以上）を確保する。","正しい。排煙口は、防煙区画の各部分から排煙口までの水平距離が30m以下となるように設ける。"],"2018-環境・設備-19":["正しい。熱負荷の変動が大きい場合、ポンプを変流量方式とすれば、搬送動力を低減でき省エネルギーに有効である。","正しい。ヒートポンプ式給湯機は大気中の熱を利用して高効率で給湯でき、温暖な地域で特に効果的である。","誤り。アモルファスシリコン太陽電池は、単結晶シリコン太陽電池よりエネルギー変換効率が低い。単結晶シリコンのほうが変換効率は高い。","正しい。エレベーターの群管理方式は、多数台を効率よく運行制御し、待ち時間の短縮と省エネルギーの両立を図れる。"],"2018-環境・設備-20":["正しい。日本の総合環境性能評価システムはCASBEEで、海外には英国のBREEAM、米国のLEEDなどがある。","正しい。LCCO2は、資材生産、輸送、施工、運用、保守、更新、解体除却といったライフサイクル全体のCO2排出量を推定して評価する。","誤り。建築物省エネ法の省エネ基準の判断に用いるのは、電力・ガス・石油等を一次エネルギーに換算した一次エネルギー消費量であり、二次エネルギーの消費量ではない。","正しい。地域冷暖房は、未利用熱の活用等により排熱の削減が期待でき、ヒートアイランド現象の緩和にも効果的である。"],"2017-環境・設備-1":["誤り。色度は、色の明度を除いた色相と彩度（色の質）を表す指標である。明度と彩度を含めた指標とする記述は誤りである。","正しい。回折は障害物の背後に音が回り込む現象で、音の波長が障害物より大きい（低周波数）ほど回り込みやすい。","正しい。定常伝熱は、壁体の各部の温度が時間によって変化せず、熱流量が一定な伝熱状態をいう。","正しい。建築物の壁面に沿う風が隅角部で壁面から離れる現象を剥離流といい、強風の発生要因となる。"],"2017-環境・設備-2":["正しい。PMVは均一な環境を前提とした温熱快適指標であるため、不均一な放射環境や上下温度差が大きい環境では適切に評価できない場合がある。","正しい。建築基準法令上、中央管理方式の空気調和設備を設ける居室の浮遊粉じんは、0.15mg/m3以下とする。","正しい。酸素濃度が18%程度なら生理的な影響は小さいが、開放型燃焼器具では不完全燃焼を起こすおそれがある。","誤り。平均放射温度（MRT）は、グローブ温度に加え、室温（空気温度）と気流速度の測定値から求める。室温によらずに求められるわけではない。"],"2017-環境・設備-3":["正しい。二酸化炭素発生量と換気回数が同じなら、換気量は容積に比例するため、容積の小さい室ほど発生量に対する換気量が少なく、濃度は高くなる。","正しい。定常状態の必要換気量は、汚染物質の発生量を、許容濃度と外気濃度の差で除して求められ、室容積には依存しない。","誤り。温度差換気の換気量は、内外温度差の平方根と開口高さの差の平方根に比例する。温度差や高さの差そのものに比例するわけではない。","正しい。汚染空気の流入を防ぎたい室は、室内を正圧に保つ必要があるため、第二種機械換気か、室圧を高めた第一種機械換気とする。"],"2017-環境・設備-4":["正しい。温度勾配が緩やかな材料ほど熱伝導率が大きい。図の温度分布から、材料(A)のほうが熱伝導率が大きいと読み取れる。","正しい。(A)の熱伝導率を大きくすると全体の熱抵抗が減って熱流が増え、(B)内の温度差が拡大し、(B)の各部分の温度は下がる。","正しい。(B)の熱伝導率を大きくすると全体の熱抵抗が減って熱流が増え、(A)内の温度差が拡大して、(A)の各部分の温度が上がる。","誤り。熱伝導率の大きい(A)を室内側に入れ替えると、室内表面温度が下がり、かえって結露しやすくなる。表面結露の防止には断熱性の高い材料を室内側に配置する。"],"2017-環境・設備-5":["誤り。自然排煙の効率は、排気側の開口部の位置や面積だけでなく、給気経路（空気の流入経路）にも左右される。給気経路によらないとする点が誤りである。","正しい。吸引型の機械排煙は、煙を排出するとともに煙の発生室を減圧するため、他の空間への煙の拡散防止にも有効である。","正しい。加圧防煙は、階段室を加圧して煙の流入を防ぎ、煙突効果による煙の拡散防止にも有効である。","正しい。第二種排煙は給気を機械で行う押出型で、排煙口から自然に排出させるため、排煙量よりも多い給気量が必要となる。"],"2017-環境・設備-6":["誤り。夏至の南向き鉛直面（イ）は太陽高度が高く壁面への日射が少ないため、最大にはならず、実際は最も小さい。イを最大とする大小関係は不適当である。","誤り。夏至の南向き鉛直面（イ）は冬至の南向き鉛直面（ハ）や冬至の水平面（ニ）より小さく、イ＞ハとする順序は逆である。","誤り。冬至の南向き鉛直面（ハ）は太陽が低く南面に正対するため最大級で、ロより大きい。また夏至の南向き鉛直面（イ）はニより小さい。","正しい。冬至の南向き鉛直面が最大級で、次いで夏至の西向き鉛直面が大きく、冬至の水平面、夏至の南向き鉛直面の順に小さくなる。"],"2017-環境・設備-7":["正しい。光束は、単位時間に面を通過する光の放射エネルギー量を、視感度で補正した量である。","正しい。均等拡散面の輝度は、照度と反射率の積を円周率で除したものであり、照度と反射率の積に比例する。","誤り。長時間の精密な視作業の基準昼光率は、一般に5%程度とされる。2%は低すぎる。","正しい。設計用全天空照度は、標準的な普通の日の場合に15,000lxを用いることが多い。"],"2017-環境・設備-8":["正しい。減法混色は色を吸収する媒体を混ぜる方法で、混ぜるほど吸収が増えて黒に近づく。","正しい。XYZ表色系の三刺激値のうちYは、光源色では測光的な明るさ（輝度）を表す。","誤り。マンセル表色系の彩度は無彩色の0から始まるが、10までに限られず、色相によっては10を超える高彩度の色もある。","正しい。JISの安全色で、緑は安全状態、進行を表す。"],"2017-環境・設備-9":["正しい。平均吸音率が大きい場合、セイビンの式はアイリングの式より残響時間を長く算出する。吸音率が小さいと両者はほぼ一致する。","誤り。空気による音の吸収は、周波数が高いほど大きくなる。低くなるほど大きくなるわけではない。","正しい。音響パワーを4倍にすると、10log4で約6dBだけ音圧レベルが上がる。","正しい。無限大の面音源では音が広がらず、音圧レベルは距離によって減衰しない。"],"2017-環境・設備-10":["正しい。多孔質吸音材は、厚くするほど低周波数域の吸音率が大きくなる。","誤り。多孔質吸音材の表面を塗装すると、表面が目詰まりして通気性が失われ、高周波数域の吸音率が低下する。ほとんど影響しないわけではない。","正しい。合わせガラスは、コインシデンス効果が生じる周波数域以外では、質量則に支配され、同厚の単板ガラスの遮音性能とほぼ同じである。","正しい。中空二重壁の共鳴透過の共振周波数は、壁の面密度が大きいほど低くなるため、面密度を2倍にすると低くなる。"],"2017-環境・設備-11":["正しい。ダクトの曲がり部や断面変化部の局部圧力損失は、動圧に比例するので風速の2乗に比例する。","誤り。軸流送風機は大風量・低静圧の用途に向き、遠心送風機のほうが静圧の高い用途に用いられる。静圧の高い用途に用いるとする点が誤りである。","正しい。並列運転では、ダクトの抵抗が増えるため、2台同時運転の風量は1台運転時の2倍よりも小さくなる。","正しい。排気ガラリは外気取入れガラリより通過風速を高くできるため、同じ風量なら必要な正面面積は小さくなる。"],"2017-環境・設備-12":["正しい。熱負荷計算法には定常計算法や非定常計算法などがあり、目的に応じて使い分けられる。","正しい。TAC温度は気象データを統計処理し、超過確率を設定して異常な猛暑等を除いた設計用外界条件の値である。","誤り。人体からの潜熱は、同じ作業なら室温が高いほど大きくなり、顕熱は小さくなる。潜熱が小さくなるとする点が誤りである。","正しい。最大負荷計算では、冷房時は室内発熱を計算に含めるが、暖房時は安全側として含めないことが多い。"],"2017-環境・設備-13":["正しい。蓄熱方式は、熱源装置の負荷のピークを平準化できるため、熱源の容量を小さくできる。","正しい。河川水や井戸水は、冷房時は外気温より低く暖房時は高いため、空気熱源ヒートポンプよりCOPが高い。","正しい。冷凍機は部分負荷運転の頻度が高いため、定格COPに加えて部分負荷時のCOPも考慮して選定する。","誤り。密閉式冷却塔は熱交換器を介するため、同能力の開放式に比べて大型になり、送風機や散水ポンプの動力は大きくなる。小さくなるわけではない。"],"2017-環境・設備-14":["正しい。排水再利用水の原水には、手洗器、洗面器、湯沸室の排水のほか、厨房排水も、適切な処理を前提に利用できるとされる。","誤り。器具付きトラップの下流にUトラップを設けると二重トラップとなり、排水不良や通気不良を招くため設けてはならない。","正しい。分流式は、建築物内では汚水と雑排水を別系統とし、公共下水道では汚水・雑排水と雨水を別系統とする方式である。","正しい。合流式地域で雨水排水管を敷地排水管に接続する場合は、下水ガスの逆流を防ぐため、トラップますを介して接続する。"],"2017-環境・設備-15":["誤り。キャビテーションは、ポンプ吸込口の圧力が低下して水が気化するときに発生する。吸込口の圧力が高いときではなく、低いときに発生しやすい。","正しい。水柱分離によるウォーターハンマーを防ぐため、揚水管の横引きはできるだけ低い位置で行うのがよい。","正しい。雑用水系統は上水と別系統にすれば、受水槽に鉄筋コンクリート造の床下ピットを利用することができる。","正しい。上水受水槽の水抜き管とオーバーフロー管は、汚染防止のため十分な排水口空間を設けた間接排水とする。"],"2017-環境・設備-16":["正しい。鉄骨造では構造体の鉄骨を雷保護システムの引下げ導線として利用でき、導通が確保されれば合理的で望ましい。","正しい。接地には外部雷保護用、感電防止などの保安用、電子機器の障害を防ぐ機能用などがあり、目的別に区分される。","正しい。接地工事の接地線は、断線時に接地機能を失うおそれがあるため、過電流遮断器を施設してはならない。","誤り。埋設接地極は、酸などで腐食するおそれがなく、接地抵抗を下げやすい水気のある（湿った）場所に埋設することが望ましい。乾燥した場所は抵抗が高くなる。"],"2017-環境・設備-17":["誤り。相関色温度は昼白色（約5000K）のほうが電球色（約2800K）より高い。色温度が低いほど赤みを帯びた暖かい光色となる。","正しい。グレアは、視野内の高輝度光源や極端な輝度対比により、不快感や見えにくさを生じる現象をいう。","正しい。アンビエント照明では、輝度分布を考慮して空間の明るさ感を確保すれば、照度を抑えられ省エネルギーに有効である。","正しい。初期照度補正は、保守率を見込んだ初期過剰照度を制御して、経年による光源出力低下を補う省エネ手法である。"],"2017-環境・設備-18":["正しい。天井高が10mを超えるロビー等の高天井部分には、放水型ヘッドを用いたスプリンクラー設備を設置する。","誤り。補助散水栓は、ホース接続口からの水平距離を15m以内とする必要がある。25m以内とする記述は不適当である。","正しい。特別避難階段の付室には、所定の排煙設備（機械排煙など）を設けることが求められる。","正しい。客席誘導灯は、客席内通路の床面における水平面照度が0.2 lx以上となるように設置する。"],"2017-環境・設備-19":["正しい。貸事務所ビルで2台以上ある場合、平均運転間隔は40秒以下程度とするのが望ましいサービス水準とされる。","正しい。事務所ビルでは出勤時のピーク5分間の交通量を基に、台数・仕様を計画するのが一般的である。","正しい。設計用水平標準震度は高さ60mを境に値が大きく変わり、60m超では60m以下よりかなり大きな値となる。","誤り。地震時管制運転では、最寄階に停止させて乗客を降ろし運転を休止するのが基本である。避難階まで移動させる計画ではない。"],"2017-環境・設備-20":["正しい。ZEHは、高断熱化・省エネ・創エネにより、快適な室内環境を保ちつつ年間の一次エネルギー消費量の収支ゼロを目指す住宅である。","誤り。CASBEE建築（新築）の評価は、環境品質Qを環境負荷Lで除した環境性能効率BEEで判定される。一次エネルギー消費量の比ではない。","正しい。BELSは第三者機関が省エネ性能を評価・認証する制度で、性能に応じて星の数（5段階）等で表示される。","正しい。eマークは、建築物が建築物エネルギー消費性能基準に適合していると所管行政庁から認定を受けたことを示す表示である。"],"2016-環境・設備-1":["正しい。PMVは、気温・放射温度・湿度・気流・代謝量・着衣量の6要素を考慮した温熱環境指標である。","誤り。照度は面に入射する光束の量で、不快グレアの評価には用いない。不快グレアは光源の輝度や輝度対比を基に評価する。","正しい。プルキンエ現象は、暗所視で比視感度の最大波長が短波長側（青側）へずれる現象である。","正しい。残響室法吸音率は、試料の有無による残響時間の差から算出される吸音率である。"],"2016-環境・設備-2":["正しい。浴室の排気ファンで水蒸気を排出し、他室への侵入を抑えれば、結露防止に有効である。","正しい。断熱材の室内側に防湿層を設けると、水蒸気の壁内侵入を防ぎ、内部結露を抑制できる。","正しい。天井断熱の木造では小屋裏が冷えるため、換気口で湿気を排出し野地板面の結露を防ぐ。","誤り。開放型燃焼器具は燃焼で生じた水蒸気を室内に放出するため、結露を助長する。水蒸気を抑えるには密閉型を用いる。"],"2016-環境・設備-3":["誤り。必要換気量は Q＝0.024／{(1000－400)×10⁻⁶}＝40m³/(h・人)であり、20では不足する。","誤り。必要換気量は Q＝0.024／{(1000－400)×10⁻⁶}＝40m³/(h・人)であり、30では濃度が1,000ppmを超える。","正しい。発生量0.024m³/hを許容濃度差600ppm（0.0006）で除すと40m³/(h・人)となり、これが最低限必要な外気取入量である。","誤り。50m³/(h・人)でも基準は満たすが、最低限必要な量は40m³/(h・人)であり、「最低限」に当たらない。"],"2016-環境・設備-4":["正しい。透明フロート板ガラスは可視光をよく透過するが、長波長の赤外線は透過しにくい（温室効果の原理）。","正しい。熱貫流抵抗は表面熱伝達抵抗を含み、壁厚を2倍にしても材料分の抵抗だけが2倍となるため、全体は2倍にならない。","正しい。壁体表面の対流熱伝達率は、風速が大きいほど大きくなる。","誤り。グラスウールは、かさ比重が大きくなりすぎると固体部分の伝導が増えるが、一般には密度の増加で空気層が細分化され熱伝導率は小さくなる傾向がある。大きくなるとはいえない。"],"2016-環境・設備-5":["正しい。水平避難方式は、階を複数のゾーンに区画し、火災のないゾーンへ水平移動して安全を確保する方法である。","正しい。熱を伴う煙が階段室に流入すると、煙突効果で3～5m/s程度の速さで上昇するとされる。","誤り。ボイド空間を避難経路とする場合、煙の拡散を防ぐには下層部からの給気を確保して煙を排出する必要があり、給気を抑制するとしたのは不適当である。","正しい。等価可燃物量は、可燃物の発熱量を同等の発熱量をもつ木材の重量に換算した量である。"],"2016-環境・設備-6":["正しい。冬至日の日影図で、建築物の周辺に終日日影となる部分（全時間帯の影が重なる部分）が生じるとの記述で、図の読み取りと整合する。","誤り。図から読み取ると、A点が日影に入る時間は3時間未満であり、3時間以上日影になるとの記述は不適当である。","正しい。B点は影の範囲が建築物の高さによって変わらない位置にあり、高さのみを3倍にしても日影の状況に影響しない。","正しい。4時間日影線は影が重なる部分の外縁で決まり、建築物の高さのみを高くしても変化しないとされる。"],"2016-環境・設備-7":["正しい。輝度は光源面に限らず、反射面や透過面についても定義できる量である。","正しい。昼光率は直接昼光だけでなく室内の反射光も含むため、室内各部の反射率の影響を受ける。","誤り。配光曲線は、光源の各方向に対する光度の分布を示すものであり、輝度の分布ではない。","正しい。光幕反射は、光が視線方向に正反射する位置に光源を置かないことで減らせる。"],"2016-環境・設備-8":["正しい。マンセル値は「色相 明度/彩度」の表記で、5G7/8は明度7、5G8/6は明度8なので後者のほうが明度が高い。","誤り。面積効果は、面積が大きいほど明度・彩度が高く感じられる効果である。小さいほど高く感じるとした点が逆である。","正しい。演色性は、光源の分光分布に依存し、視対象の色の見え方に及ぼす光源の性質である。","正しい。面色や開口色は、空間的定位や肌理を感じさせない色の見え方である。"],"2016-環境・設備-9":["正しい。波長は音速約340m/sを周波数で除すと、20Hzで約17m、20kHzで約17mmとなり、十数mから十数mmである。","正しい。平均吸音率が2倍になると室定数が約2倍となり、拡散音場の音圧レベルは約3dB低下する。","正しい。Sabineの式T＝0.161V/Aより、前者は約0.81秒、後者は約0.67秒で、後者のほうが短い。","誤り。アナウンススタジオの騒音の推奨値はNC-15～20程度と非常に低い値であり、NC-35は大きすぎる。"],"2016-環境・設備-10":["正しい。重量床衝撃音には、カーペット等の柔らかい仕上げ材では遮断性能の向上がほとんど期待できない。","正しい。表面を開孔率の小さい孔あき板で覆うと、共鳴器型の吸音特性が現れることがある。","誤り。単層壁の厚さを薄くすると、コインシデンス周波数は高い周波数側へ移り、影響範囲も高周波側にずれる。低い周波数へ拡大するとした点が誤りである。","正しい。複層ガラスは共鳴透過により、共鳴周波数付近で同一面密度の単板ガラスより遮音性能が劣ることがある。"],"2016-環境・設備-11":["正しい。吸収冷凍機は圧縮機をもたず回転部が少ないため、遠心冷凍機より振動・騒音が小さい。","誤り。吸収冷凍機は凝縮熱に加え吸収熱も除去するため、同一容量の遠心冷凍機より冷却水量が多くなる。","正しい。吸収冷凍機は機内がほぼ真空に近く、遠心冷凍機より機内圧力が低い。","正しい。吸収冷凍機は熱源として蒸気や燃料を使い、電力は溶液ポンプ程度なので消費電力が少ない。"],"2016-環境・設備-12":["正しい。内部発熱密度が高い建築物ほど冷房負荷が大きい期間が長く、外気冷房の省エネ効果が期待できる。","誤り。冬期は導入外気が低温低湿のため、外気冷房では加湿が必要となり、加湿エネルギーはむしろ増える。削減できない。","正しい。データセンターは年間連続・年間冷房で顕熱負荷主体であり、外気冷房やフリークーリングが有効である。","正しい。PUEはデータセンター全体のエネルギー消費量をICT機器のエネルギー消費量で除した値で、1に近いほど効率が高い。"],"2016-環境・設備-13":["誤り。燃焼機器のある機械室は負圧にすると排ガスの逆流や不完全燃焼の恐れがあるため、第3種換気は不適当で、第1種または第2種換気とする。","正しい。置換換気は、汚染物質が周囲より高温または軽量で上昇する場合に有効である。","正しい。防煙垂れ壁を介して隣接する防煙区画で、自然排煙と機械排煙を混在させることは一般にできない。","正しい。天井高3m未満の居室では、排煙口の下端は天井から80cm以内で、かつ防煙垂れ壁の下端より上に設ける。"],"2016-環境・設備-14":["誤り。受水槽の材質に木を使うことは、現在も禁止されているわけではない。腐食のおそれを理由に使用できないとした点が誤りである。","正しい。排水再利用水は、大腸菌が検出されなくても飲料水には使用できず、雑用水等に限られる。","正しい。硬質塩化ビニルライニング鋼管に管端防食継手を用いれば、管端部の腐食による赤水の発生を防止できる。","正しい。給湯用ボイラーは常に新鮮な補給水が入り、溶存酸素が多く供給されるため、温水ボイラーより腐食しやすい。"],"2016-環境・設備-15":["正しい。災害応急対策活動施設では、地震感知で作動する緊急給水遮断弁を受水槽等に設けるのが望ましい。","正しい。満水時の質量が15kgを超える給湯器は、転倒・移動防止のためアンカーボルト等で固定するのが一般的である。","誤り。排水槽の底部は吸込みピットに向かって1/15以上1/10以下の勾配とする。1/5以上は急すぎて不適当である。","正しい。受水槽の容量を大きく設定すると滞留時間が長くなるため、残留塩素確保のため塩素注入等が必要となる。"],"2016-環境・設備-16":["誤り。照度センサは明るさを検知するもので、不在エリアの検知には人感センサを用いる。照度センサは昼光利用の調光制御に使う。","正しい。昼光利用では日射による空調負荷の増加も生じ得るため、日射遮蔽等の検討も必要である。","正しい。保守率は、ランプの経年劣化や器具の汚れによる光束低下をあらかじめ見込んだ係数である。","正しい。手術室・診察室は、患部や顔色を正しく見るため、事務室より演色性の高い光源が望ましい。"],"2016-環境・設備-17":["正しい。逆潮流は、需要家側の発電設備から商用電力系統へ向かう電力の流れである。","正しい。燃料電池は水の電気分解の逆反応で、水素と酸素が結合して電気と水を生じる。","正しい。集合住宅では契約電力が50kW以上で高圧受電となるのが一般的で、60kWを超えると受変電設備の必要性が高くなる。","誤り。特別高圧と高圧を区分する電圧は7,000Vである（交流で600V超7,000V以下が高圧）。6,000Vではない。"],"2016-環境・設備-18":["正しい。非常用照明の予備電源には、蓄電池を器具に内蔵する方式のほか、別置の蓄電池を用いる方式がある。","誤り。差動式熱感知器は周囲温度の上昇率が一定以上になると作動する。一定温度以上で作動するのは定温式である。","正しい。補助散水栓は2号消火栓と同等の放水量をもち、スプリンクラー設備の配管に接続する。","正しい。開放型ヘッドは天井が高く可燃物の多い舞台部などに用い、一斉開放弁で放水する。"],"2016-環境・設備-19":["正しい。局部震度法では、防振支持された設備機器のほうが固定された機器より設計用標準震度が大きい。","正しい。中央管理方式の空気調和設備の中央管理室は、避難階またはその直上階・直下階に設ける。","誤り。火災時管制運転では、乗客の避難のためエレベーターを避難階（基準階）に呼び戻して停止させる。最寄階に停止させるのは地震時管制運転である。","正しい。非常用エレベーターを複数設ける場合は、避難上・消火上有効な間隔を保って配置する。"],"2016-環境・設備-20":["正しい。再生可能エネルギーは、太陽光・風力・水力・地熱・バイオマス等、自然界で繰り返し利用できるエネルギーである。","正しい。HFCはオゾン破壊係数はゼロだが、地球温暖化係数が大きい温室効果ガスである。","正しい。コージェネレーションの原動機には、ガスエンジン、ディーゼルエンジン、ガスタービン等が用いられる。","誤り。エレベーターの電力消費は、電力回生制御の有無に加え、巻上機のギアの有無（ギアレスは効率が高い）にも影響される。"],"2025-法規-1":["正しい。外壁に求められる、周囲で発生する通常の火災による延焼の抑制に一定の効果を発揮する性能は「準防火性能」と定義されている。","正しい。建築基準関係規定は、建築基準法令の規定に加え、消防法など建築確認の際に適合が求められる他法令の規定も含む。","誤り。観覧のための工作物は、屋根の有無にかかわらず、土地に定着していれば「建築物」に該当する。屋根を有しないから建築物でないとする点が誤り。","正しい。レストランの調理室は、継続的に使用する室であり、建築基準法上の「居室」に該当する。"],"2025-法規-2":["正しい。日影規制における平均地盤面とは、建築物が周囲の地面と接する位置の平均の高さにおける水平面をいい、その面からの高さで算定する。","誤り。後退距離の算定の特例を受けるポーチ等の高さは、地盤面ではなく、前面道路の路面の中心からの高さで算定する。地盤面からとする点が誤り。","正しい。避雷設備の設置を検討する高さの算定では、昇降機塔等の屋上部分は、面積が1/8以内でも高さに算入する。","正しい。屋上部分の水平投影面積が建築面積の1/8以内なら階数に算入されない例外があるが、1/8ちょうどの倉庫等は例外の範囲として扱われ、記述の趣旨は階数算定の原則に整合する。"],"2025-法規-3":["正しい。国、都道府県等が建築主の場合は、確認申請に代えて、工事着手前に計画を建築主事等または指定確認検査機関に通知することができる。","正しい。都市計画法の開発許可を要する擁壁は、高さ2m超でも確認済証の交付を要する工作物から除かれ、建築確認は不要である。","誤り。木造2階建ては建築基準法第6条第1項第四号の建築物に該当し、都市計画区域外等でも確認済証の交付を受ける必要がある。不要とする点が誤り。","正しい。容積率の最低限度が定められた区域では、床面積の減少でも軽微な変更に当たらず、あらためて確認済証の交付を受ける必要がある。"],"2025-法規-4":["正しい。事務所に設けるエレベーターの所有者等は、定期に一級建築士等に検査させ、その結果を特定行政庁に報告しなければならない。","正しい。完了検査の申請は、工事完了の日から4日以内に建築主事等に到達するようにしなければならない。","正しい。指定確認検査機関から確認済証の交付を受けた用途変更の工事完了届は、建築主事等（特定行政庁）に届け出ることとされている。","誤り。階数3以上の共同住宅は特定工程の中間検査対象で、2階の床及びはりの配筋工事が特定工程となるのは、特定行政庁が指定した場合などであり、本問は指定がないため、この工程は特定工程に当たらず申請義務はない。"],"2025-法規-5":["正しい。階段の両側に手すり等を設けた同等安全の階段では、告示で定める蹴上げ・踏面の寸法の範囲に収まる組合せであり、この寸法は基準を満たす。","正しい。直上階の居室の床面積の合計が200m2以下の場合、示された蹴上げ・踏面の寸法は告示の基準に適合する。","誤り。直上階の居室の床面積の合計が200m2を超える場合は、より厳しい蹴上げ・踏面の寸法が求められ、本問の組合せはその基準に適合しない。","正しい。直上階の居室の床面積の合計が200m2を超える場合の寸法で、蹴上げを小さく踏面を大きくしており、基準に適合する。"],"2025-法規-6":["誤り。5階以上の階を百貨店の売場とする場合、避難階段のほか屋上広場が必要となるが、本問の規定は5階以上の階が対象で、地上5階建てなら「各階」の直通階段を一律に避難階段としなければならないわけではない。","正しい。耐火構造の共同住宅で、各階の居室の床面積の合計が200m2以下等の条件を満たし、避難上有効なバルコニー及び屋外避難階段がある場合は、2以上の直通階段の設置が緩和される。","正しい。スポーツの練習場の居室から地上に通ずる廊下・階段には、非常用の照明装置の設置が義務付けられる用途に含まれない。","正しい。全館避難安全検証法は、避難時間に基づく検証または煙・ガスの高さに基づく検証により、避難の安全性を確かめる方法である。"],"2025-法規-7":["正しい。防火区画に用いる防火設備は、常時閉鎖若しくは作動した状態か、随時閉鎖・作動できるものとする必要がある。","正しい。常時閉鎖状態を保持する構造の防火戸は、面積が3m2以内であることが要件の一つとされている。","誤り。吹抜き部分の竪穴区画の緩和は、主要構造部が準耐火構造で地階又は3階以上に居室を有する建築物では、仕上げ等を不燃化するだけでは足りず、本問のような場合に区画不要とする点が誤り。","正しい。防火区画検証法は、防火設備が、開口部の面する室の火災継続時間以上、加熱面以外に火炎を出さずに耐えることを確かめる方法である。"],"2025-法規-8":["正しい。開口部のない耐火構造の床・壁で区画された部分の増築は、既存部分に排煙設備の技術的基準を遡及適用しない緩和がある。","正しい。特定行政庁が認めた全体計画に基づく段階的な増築等では、最後の工事に着手するまで、既存部分に避難施設の技術的基準は適用されない。","正しい。火熱遮断壁等で区画された部分の増築では、既存部分に耐火建築物としなければならない特殊建築物の基準は適用されない緩和がある。","誤り。興行場を一時的に使用する仮設の許可は1年以内の期限とされるが、仮設興行場等の特例は、避難施設に関する技術的基準の適用除外を含む旨の記述が不適当で、その緩和の範囲を誤っている。"],"2025-法規-9":["正しい。地階の物品販売業の売場と、これに通ずる主たる廊下・階段等の壁・天井の内装は、準不燃材料でよい。","誤り。非常用エレベーターの乗降ロビーは、天井・壁の仕上げだけでなく下地も不燃材料で造る必要があり、仕上げを準不燃材料とする点が不適合。","正しい。壁付暖炉の可燃物燃焼部分の間柱、下地、仕上げを特定不燃材料とし、他の部分を難燃材料等とする方法は、適合する構造である。","正しい。100m2以内ごとに耐火構造の床・壁と所定の防火設備で区画された居室は、内装制限が緩和され、内装材の規制を受けない。"],"2025-法規-10":["誤り。避難階に設けた非常用エレベーターの乗降ロビー出入口から屋外への出口までの歩行距離は、30m以下としなければならない。40m以下とする点が誤り。","正しい。大臣が定めた構造方法を用いる荷物用等のエレベーターは、昇降路の出入口の床先と籠の床先との水平距離を4cm超とすることができる。","正しい。高さ20m超の既存不適格建築物でも、大規模の修繕等を行う場合は、避雷設備の技術的基準に適合させる必要がある。","正しい。階数が11以上の建築物の屋上の冷却塔は、大臣が定めた構造方法により防火上支障がない場合、主要部分を不燃材料以外で造ることができる。"],"2025-法規-11":["誤り。保有水平耐力計算で安全を確かめる場合、柱の主筋と帯筋の緊結に関する規定は一部が適用除外となる点が前提で、この緊結を一律に義務付ける記述は不適当とされる。","正しい。鉄筋コンクリート造の使用コンクリートの四週圧縮強度は、1mm2につき12N（軽量骨材使用で9N）以上とする。","正しい。直接土に接する壁、柱、床、はり、基礎の立上り部分の鉄筋のかぶり厚さは、原則として4cm以上必要である。","正しい。高力ボルト孔の径は、高力ボルトの径より2mmを超えて大きくしてはならないのが原則である。"],"2025-法規-12":["正しい。許容応力度等計算では、地上部分について、地震力による各階の層間変形角が所定の数値（原則1/200）以内であることを確かめる。","正しい。柱の垂直荷重による圧縮力を計算する場合の積載荷重は、支える床の数に応じて低減でき、百貨店の売場で床数5なら1,920N/m2とすることができる。","正しい。限界耐力計算を行う場合は、特定天井の構造を、大臣が定めた構造方法又は大臣認定によるものとする規定の適用が除外される。","誤り。異形鉄筋の短期の圧縮の許容応力度は、基準強度Fの数値そのもの（F）とする。Fを1.5で除すのは長期の許容応力度であり、短期を1.5で除すとする点が誤り。"],"2025-法規-13":["正しい。高さ31m以下の建築物は、保有水平耐力計算において、偏心率が15/100以下であることの確認を省略できる。","誤り。限界耐力計算を行う場合は、この規定の扱いが他のルートと異なり、柱脚の緊結に関する記述は不適当とされる。","正しい。外装材は、高さにかかわらず、大臣が定める基準による風圧に対する構造計算で安全性を確かめる必要がある。","正しい。限界耐力計算では、長期・短期の各応力度が、それぞれの許容応力度を超えないことを確かめる必要がある。"],"2025-法規-14":["正しい。道路に該当しない幅員4m以上の道等に接する敷地は、特定行政庁の認定により、延べ面積や用途が基準内であれば建築できる。","正しい。位置指定道路の基準は、地方公共団体が条例で、区域を限り別の基準を定めることができる。","誤り。事業計画のある道路は、2年以内にその事業が執行される予定のものとして特定行政庁が指定したものが道路となる。3年以内とする点が誤り。","正しい。自動車のみの交通の用に供する道路内には、原則として特定行政庁の許可がなければ建築物を建築できない。"],"2025-法規-15":["正しい。自家用倉庫は、2階以下かつ1,500m2以下であれば、第二種中高層住居専用地域内に建築できる。","誤り。第一種住居地域では、水泳場等の運動施設は、床面積が3,000m2を超えるものは建築できない。5,000m2の水泳場は建築不可。","正しい。本記述の産業廃棄物処理施設は、工業地域において、別表第二の規定に照らして新築できる。","正しい。幼保連携型認定こども園は、工業専用地域内でも建築できる用途に該当する。"],"2025-法規-16":["誤り。敷地条件から求まる建築面積の最大値は、角地や準耐火建築物による建蔽率の緩和を加味した値で、この値は最大値ではない。","誤り。建蔽率の緩和を一部しか考慮していない値であり、条件から求まる最大の建築面積ではない。","誤り。緩和の適用を不十分に見積もった値であり、条件下で建築できる最大の建築面積に及ばない。","正しい。準耐火建築物とすることなど、建蔽率の緩和をすべて適用して求めた、建築できる建築面積の最大値である。"],"2025-法規-17":["誤り。道路斜線、隣地斜線等のうち最も厳しい制限で求めた高さより低い値であり、A点の高さの最高限度ではない。","誤り。斜線制限の算定に用いる距離や勾配の適用を誤った値であり、最高限度とはならない。","正しい。道路斜線制限及び隣地斜線制限のうち、A点でより厳しい方の制限から求まる、地盤面からの高さの最高限度である。","誤り。緩和を過大に見積もった値で、A点で適用される制限を超えるため、最高限度とはならない。"],"2025-法規-18":["正しい。建築物が防火地域と指定のない区域にわたる場合、防火壁で区画されていなければ全体を防火地域の規定で扱い、延べ面積100m2超の2階建ては耐火建築物等とする。","誤り。準防火地域では、地階を除く階数が4以上又は延べ面積1,500m2超の建築物は耐火建築物等としなければならない。1,800m2の店舗は準耐火建築物では足りない。","正しい。準防火地域で延べ面積500m2超1,500m2以下の建築物は、耐火建築物又は準耐火建築物等としなければならない。","正しい。準防火地域内の木造建築物等に附属する高さ2m超の門又は塀は、延焼防止上支障のない構造とする必要がある。"],"2025-法規-19":["正しい。22条区域の内外にわたる建築物の屋根は、その全部について、同条の規定（火の粉による火災防止性能）を適用する。","正しい。火葬場は、都市計画で敷地の位置が決定していなくても、特定行政庁が都市計画審議会の議を経て支障がないと認めて許可すれば新築できる。","正しい。予定道路に接する敷地は、特定行政庁の許可を受けた建築物については、予定道路を前面道路とみなして容積率の規定が適用される。","誤り。借地権の目的となっている土地では、借地権者の合意があればよく、土地の所有者の合意は不要である。所有者の合意も必要とする点が誤り。"],"2025-法規-20":["正しい。用途地域にわたる場合は敷地の過半の用途地域の制限による。近隣商業地域が過半（850m2）であり、ホテルを新築できる。","正しい。床面積100m2以内ごとに防火区画された居室は排煙設備が免除される。30m2に区画された客室には設置不要である。","誤り。15階以上の階では、直通階段までの歩行距離の限度が10m短縮され、居室の内装を準不燃材料にした場合でも50m以下となる。60mとする点が誤り。","正しい。ホテルの客室は、採光上有効な窓があっても居室に当たり、非常用の照明装置の設置が必要である（住宅の居室等は除く）。"],"2025-法規-21":["正しい。一級建築士の定期講習は、建築士事務所への所属に関する所定の期限までに初めて受ける必要があり、本記述はその期限に沿っている。","誤り。構造設計一級建築士が構造設計を行い、構造設計図書にその旨を表示した場合は、構造計算により安全性を確かめた旨の証明書の交付義務は生じない。","正しい。管理建築士は、事務所の規模にかかわらず、その建築士事務所に専任でなければならない。","正しい。設計受託契約の当事者は、設計図書の種類、報酬の額・支払の時期などを記載した書面に署名又は記名押印して相互に交付する必要がある。"],"2025-法規-22":["正しい（登録取消し等の事由に該当する）。延べ面積300m2超の建築物の設計・工事監理の一括再委託は禁止されており、事務所の処分事由となる。","正しい（登録取消し等の事由に該当する）。管理建築士が免許取消しを受けた場合は、事務所の業務外の行為でも、事務所の処分事由となる。","誤り（事由に該当しない）。事務所に属する建築士が、事務所の業務ではない行為で免許取消しを受けても、事務所の登録の処分事由にはならない。","正しい（登録取消し等の事由に該当する）。無資格者に建築士でなければ設計できない建築物の設計をさせることは、事務所の処分事由となる。"],"2025-法規-23":["正しい。建築物の建築の用に供する目的の土地の区画形質の変更は、規模にかかわらず「開発行為」の定義に該当する（許可の要否は別問題）。","誤り。市街化調整区域でも、仮設建築物の新築は都道府県知事の許可を要する建築行為から除かれている。許可を受ける必要があるとする点が誤り。","正しい。開発許可の申請書には、公共施設の管理者の同意や協議の経過を示す書面等を添付しなければならない。","正しい。開発許可の基準では、排水施設が、降水量等を勘案し、下水を有効に排出して溢水等の被害が生じない構造・能力で配置されることとされている。"],"2025-法規-24":["正しい。入院施設のない診療所でも、2階以上の階で収容人員が20人以上であれば、原則として避難器具の設置が必要である。","正しい。耐火建築物の延べ面積や高さが一定規模以上の場合には、原則として消防用水の設置義務がある。","正しい。階数が7以上の建築物には、原則として連結送水管を設置しなければならない。","誤り。自動車車庫の排煙設備は、主として地階又は無窓階で床面積が一定以上の場合が対象である。1階の床面積1,000m2の車庫に設置義務があるとする点が誤り。"],"2025-法規-25":["誤り。特別特定建築物を新築・増築・改築する場合のほか、用途変更で特別特定建築物となる場合も、基準適合は当該用途変更部分に限るのではなく、記述の適合範囲の限定は不適当である。","正しい。客室が設けられた階に車椅子使用者用便房を備えた共用の便所が設けられていれば、客室内の便所に車椅子使用者用便房を設けなくてもよい。","正しい。案内所を設ける場合には、エレベーター等の配置を視覚障害者に示す設備は、設けなくてもよい。","正しい。移動等円滑化基準では、傾斜路の幅は、段に代わるものは120cm以上、段に併設するものは90cm以上とされている。"],"2025-法規-26":["誤り。増築の場合、増築部分の床面積が300m2以上なら適合義務の対象は原則として増築部分のみで、既存部分を含む建築物全体ではない。","正しい。建築士は、設計の委託を受けたとき、建築主にエネルギー消費性能の向上に資する事項を説明するよう努める努力義務がある。","正しい。年間1,000戸以上を新築する特定共同住宅等建設工事業者は、請負型規格共同住宅等を一層の性能向上基準に適合させるよう努める義務を負う。","正しい。建築主等は、エネルギー消費性能の向上のための修繕等をしようとするとき、性能向上計画を作成して所管行政庁の認定を申請できる。"],"2025-法規-27":["正しい。鉄筋コンクリート造の耐力壁の開口部周囲には、径12mm以上の補強筋を配置することとされており、記述は規定に適合する。","正しい。6地域の外皮平均熱貫流率の基準値は0.87W/(m2・K)、冷房期の平均日射熱取得率は2.8であり、0.50と2.5はいずれも基準を満たす。","誤り。避難階段から屋外への出口の戸は、屋内から「かぎを用いることなく」開けられる構造とする必要がある。かぎを用いて解錠する戸は不適合である。","正しい。延焼のおそれのある部分の外壁開口部には、加熱開始後20分間の遮炎性能を有する防火設備を設ければよい。"],"2025-法規-28":["正しい。劇場の客席からの出口の戸は、避難の支障とならないよう、内開きとせず外開きとする必要があり、記述は適切である。","正しい。不特定多数が利用する出入口を自動開閉式とし、前後の高低差を設けないことは、移動等円滑化の観点から望ましい適切な措置である。","正しい。防火戸は閉鎖の支障となる物件を置かないよう、常に適切に維持管理する必要があり、管理者の判断として適切である。","誤り。屋内避難階段の出入口の防火戸は、煙感知器又は熱煙複合式感知器の作動で自動閉鎖する構造とする。熱感知器のみによる閉鎖は不適合である。"],"2025-法規-29":["正しい。耐震改修計画の認定を受けると、既存不適格の扱いが続き、法27条2項、容積率及び建蔽率関係規定の適用を受けない特例がある。","正しい。バリアフリー法の建替等計画の認定を受けた特定建築物は、容積率算定の延べ面積に、一部の床面積を算入しない特例が受けられる。","正しい。長期優良住宅建築等計画の認定を受けた住宅は、特定行政庁の許可の範囲内で、容積率の限度を超えることができる特例がある。","誤り。建築物エネルギー消費性能向上計画の認定による特例は、省エネ設備部分等の容積率の不算入などであり、建蔽率の規定の適用除外はない。"],"2025-法規-30":["誤り。宅地造成等規制法の中間検査は、盛土で高さ2m超の崖を生じる工事など盛土を伴う特定工程が対象であり、高さ3mの切土工事の特定工程は対象外である。","正しい。緑化地域内では、敷地面積が政令で定める規模（1,000m2）以上の建築物の新築は、緑化率の最低限度以上としなければならない。","正しい。駐車場法により、近隣商業地域等で延べ面積2,000m2以上の建築物の新築には、条例で駐車施設の附置が義務付けられることがある。","正しい。流通業務地区では建築基準法の用途地域等による用途制限が適用されず、流通業務地区の規制に従い倉庫業の事務所を建設できる。"],"2024-法規-1":["正しい。建築設備とは、建築物に設ける電気、給排水、換気、消火、排煙等の設備をいい、消火用の貯水槽もこれに該当する。","正しい。建築材料の品質規定の対象となる重要部分には、防火上重要であるものとして国土交通大臣が定める屋外階段も含まれる。","誤り。設計図書は建築物の建築等に関する工事用の図面と仕様書をいう。記念塔は工作物であり建築物ではないため、その図面は設計図書に含まれない。","正しい。延べ面積の合計が500m2を超える同一敷地内の二棟は別棟とされ、外壁間が2階で5m以下なら、延焼のおそれのある部分を有する。"],"2024-法規-2":["正しい。許可を受けて計画道路を前面道路とみなす場合、その敷地のうち計画道路に係る部分は敷地面積に算入しない。","誤り。北側高さ制限では、北側で道路・水面・線路敷等に接する場合に反対側の境界線等の緩和がある。公園は対象とされていないため記述は誤りである。","正しい。後退距離の算定の特例における「軒の高さ」は、前面道路の路面の中心からの高さで算定する取扱いである。","正しい。敷地が斜面・段地等で部分によって階数が異なる場合は、これらの階数のうち最大のものを建築物の階数とする。"],"2024-法規-3":["正しい。原動機を使用する観覧車は法88条の工作物として準用され、築造の際には確認済証の交付を受ける必要がある。","誤り。避難施設等の工事中に使用する際の安全計画の届出は、用途・階数・規模の政令要件に該当する建築物が対象で、地上3階建ての病院は要件を満たさない。","正しい。高さ60m超の建築物は大臣認定を受ける必要があり、この場合は構造計算適合性判定の対象外である。","正しい。避難施設等に関する工事を含む増築では、原則として検査済証の交付後でなければその部分を使用できない（仮使用承認等の例外あり）。"],"2024-法規-4":["正しい。診療所（患者の収容施設あり）と児童福祉施設等（地域活動支援センター等）は類似の用途とされ、確認済証の交付は不要である。","正しい。劇場から公会堂への変更は類似の用途の範囲外のため、特殊建築物の用途変更として確認済証の交付が必要である。","正しい。既存不適格の原動機出力は、1.2倍以下の範囲なら増加できる。3.0kWから3.5kWは約1.17倍であり、変更可能である。","誤り。用途変更では、完了検査の規定が準用されず工事完了の届出も不要なため、指定確認検査機関への届出義務はない。"],"2024-法規-5":["誤り。正答は「イとニ」であり、イ・ニが正しく、ロ・ハが誤りの記述である。この組合せはロを正しいものに含むため誤り。※問題文のイ～ニ本文が入力になく要確認。","正しい。イとニが正しい記述の組合せである（ロ・ハは誤り）。※問題文のイ～ニ本文が入力に含まれず、個別の根拠は要確認。","誤り。正答は「イとニ」であり、ロ・ハはいずれも誤りの記述のため、ロとハの組合せは不適当である。※問題文本文が入力になく要確認。","誤り。ニは正しいが、ハは誤りの記述である。正しいのはイとニの組合せである。※問題文本文が入力になく要確認。"],"2024-法規-6":["正しい。1,000m2を超える面積の緩和で自動式スプリンクラー設備を設けた部分は、手動式の補助散水栓による部分を含めない。","正しい。給水管・配電管等が防火壁・防火床を貫通する場合は、隙間をモルタルその他の不燃材料で埋めなければならない。","誤り。木造の延べ面積1,000m2超の建築物は、1,000m2以内ごとに防火壁等で区画する。この防火壁は耐火構造のものであり、準耐火構造のものでは足りない。","正しい。地下1階から地上2階に通ずる階段部分の竪穴区画では、防火設備に避難上及び防火上支障のない遮煙性能が求められる。"],"2024-法規-7":["正しい。準防火地域内の建築物の屋根は、火の粉による防火上有害な発炎や屋内に達する溶融・亀裂等を生じない構造とする。","誤り。耐火構造の耐力壁は加熱終了後も損傷を生じないことが求められるが、準耐火構造は加熱時間中の性能を求めるもので、「いずれも加熱終了後」とする点が誤り。","正しい。防火構造の軒裏は、加熱開始後30分間、裏面（屋内側）の温度が可燃物燃焼温度以上に上昇しない構造とする。","正しい。準防火性能を有する外壁（耐力壁以外）は、加熱開始後20分間、屋内側の温度が可燃物燃焼温度以上に上昇しない構造とする。"],"2024-法規-8":["誤り。非常用の進入口は、道又は道に通ずる通路等に面する外壁面に、10m以内ごとに設ける。40m以内ではない。","正しい。15階以上の特別避難階段の階段室・付室等の床面積の合計は、居室の床面積に3/100を乗じた数値以上とする。","正しい。主要構造部が耐火構造の共同住宅で、5階以上の居室の床面積の合計が200m2以下であれば、2以上の直通階段は不要である。","正しい。集会場の客用出口の戸は内開きとせず、屋外の出口から道等に通ずる幅員1.5m以上の敷地内通路を設ける。"],"2024-法規-9":["正しい。一戸建て住宅の窓のない居室の規定は、区画する主要構造部を耐火構造等とするほか、避難上支障のない措置による緩和があり、適合しうる。","誤り。屋外避難階段に通ずる出入口には、法2条九号の二ロの防火設備（20分間遮炎性能）が必要で、10分間の遮炎性能では不適合である。","正しい。耐火建築物の映画館で客席床面積合計が400m2以上であれば、内装は難燃材料でよく、天井高さ6m超なら天井は制限を受けない。","正しい。延べ面積200m2の自動車車庫は内装制限の対象となり、壁・天井の仕上げを準不燃材料とすれば適合する。"],"2024-法規-10":["正しい。乗降ロビーが煙の昇降路への流入を有効に防止できる大臣指定の構造や認定を受けたものなら、バルコニーは不要である。","正しい。中央管理室は、排煙設備の制御・作動状態の監視及び非常用エレベーターの籠を呼び戻す装置の作動ができるものとする。","正しい。特定行政庁指定の区域で処理対象人員が501人未満の合併処理浄化槽は、BOD除去率70%以上、放流水BOD60mg/l以下等の性能が必要である。","誤り。エスカレーターの踏段の積載荷重は、踏段面の水平投影面積1m2につき2,600N以上とする。13m2では33.8kN以上が必要で、33kNでは不足する。"],"2024-法規-11":["正しい。保有水平耐力計算を行う場合、柱の帯筋比0.2%以上とする規定は適用除外とされ、満たさなくてもよい。","誤り。耐力壁の厚さを12cm以上とする規定は、保有水平耐力計算を行う場合でも適用除外とされない。したがって12cm以上としなければならない。","正しい。限界耐力計算を行う場合、高力ボルト等の相互間の中心距離（径の2.5倍以上）の規定は適用除外とされる。","正しい。限界耐力計算を行う場合、柱の出すみ部分の異形鉄筋の末端をかぎ状に折り曲げる規定は適用除外とされる。"],"2024-法規-12":["誤り。地下部分に作用する地震力は、固定荷重と積載荷重の和に「水平震度k」を乗じて計算する。地震層せん断力係数ではなく、深さに応じた水平震度を用いる。","正しい。許容応力度等計算では、地上部分の各階の層間変形角が原則として1/200以内であることを確かめる。","正しい。保有水平耐力計算では、剛性率が6/10未満でも構造特性係数Dsを割り増して安全を確かめるため、剛性率6/10以上の確認を要しない。","正しい。限界耐力計算で安全性を確かめた場合は、保有水平耐力計算等の構造計算を行わなくてよい。"],"2024-法規-13":["正しい。柱の支える床数が2の場合、積載荷重の低減率は0.95であり、教室の柱用2,100N/m2に乗じて1,995N/m2とすることができる。","正しい。木材の繊維方向の長期引張りの許容応力度は、基準強度Fの1.1/3倍である。","正しい。ステンレス鋼の高力ボルトの引張りに対する材料強度は、基準強度Fと同じ数値とされる。","誤り。突合せ溶接ののど断面の短期せん断の許容応力度はF/√3であり、F/(1.5√3)は長期の値である。短期と長期を取り違えている。"],"2024-法規-14":["正しい。特定行政庁は、気候等により必要な場合、都道府県都市計画審議会の議を経て、道路幅員を6m以上とする区域を指定できる。","正しい。自動車のみの交通の用に供する道路は、接道義務を満たす道路に該当せず、これのみに接する敷地には原則建築できない。","正しい。道路の地盤面下に設ける建築物に附属する地下通路は、特定行政庁の許可なく建築できる。","誤り。予定道路の上空に渡り廊下を設ける場合は、原則として建築制限の対象であり、特定行政庁の許可（交通上等の支障がない場合）が必要である。"],"2024-法規-15":["誤り。田園住居地域で建築できる老人福祉センター等は、延べ面積600m2以下に限られるため、700m2のものは新築できない。","正しい。日刊新聞の印刷所は、近隣商業地域で、延べ面積の制限なく新築できる用途に含まれる。","正しい。地方公共団体の支所等（延べ面積600m2以下の公益上必要な建築物）は、全ての用途地域内で建築できる。","正しい。用途地域の指定のない区域（市街化調整区域を除く）では、店舗の用途制限はなく、10,000m2でも新築できる。"],"2024-法規-16":["正しい。図が示されていないため詳細は判断できないが、前面道路幅員による容積率の制限（幅員×0.4または0.6）と指定容積率の小さい方を用いた算定の結果、最大値は640m2となる。","誤り。前面道路幅員の制限などで算出される容積率を考慮すると、延べ面積の最大値は720m2にならない。算定の基礎となる延べ面積の最大は640m2である。","誤り。800m2は、道路幅員制限や敷地面積から導かれる容積対象延べ面積の上限を超える数値で、最大値として適当ではない。","誤り。810m2は容積率の上限を超える数値で、前面道路幅員による制限等を考慮した最大値とはならない。"],"2024-法規-17":["誤り。図が示されないため断定はできないが、道路斜線・隣地斜線・北側斜線等のうち最も厳しい制限から求まる高さは20.00mではない。","誤り。各斜線制限のうち最も厳しいものを適用して求める高さの最高限度は、23.75mとはならない。","正しい。道路斜線、隣地斜線、北側斜線の各制限による高さのうち最小のものがA点の最高限度となり、その値は25.00mである。","誤り。26.25mは、いずれかの斜線制限の緩和等を過大に見た値であり、最も厳しい制限で決まる最高限度とはならない。"],"2024-法規-18":["正しい。図は不明だが、Aは延焼のおそれのある部分等を踏まえ、耐火・準耐火建築物等としなければならない記述として成り立つ。","正しい。Bは規模・用途等の規定により、耐火建築物若しくは準耐火建築物等としなければならない記述として成り立つ。","誤り。Cは、面積・階数等の要件から耐火建築物等・準耐火建築物等とする義務が生じない、又は別の扱いとなるため、記述が不適当である。","正しい。Dは3階以上や規模の規定により、耐火建築物又はこれと同等以上の延焼防止時間の建築物としなければならない。"],"2024-法規-19":["誤り。一団地の総合的設計制度で一の敷地とみなされるのは接道・容積率・斜線制限等の規定であり、用途地域等による用途制限は一団地ごとに一の敷地とみなす対象ではない。","正しい。建築協定は、条例で定めれば、都市計画区域及び準都市計画区域外の区域でも定めることができる。","正しい。第二種低層住居専用地域で高さ10mとされている場合、空地と敷地規模の要件を満たし、特定行政庁が認めれば12mとできる。","正しい。ホテルの宿泊室には、採光上有効な窓があっても非常用照明装置の設置免除が受けられず、設置しなければならない。"],"2024-法規-20":["正しい。根切り・山留めは、工事中の点検と補強、排水等の安全措置を講じ、矢板等の抜取り時は周辺地盤の沈下による危害を防ぐ措置が必要である。","正しい。工事中の建築物で避難上著しく支障があると認めるものには、特定行政庁が使用制限を命じることがある。","誤り。全体計画の認定を受けても、既存不適格の緩和を受けられるのは最後の工事の完了時までで、それ以前に現行基準への適合が不要となるとは限らない。","正しい。建築監視員は、緊急の必要があり所定の手続によることができない場合に限り、施工の停止を命ずることができる。"],"2024-法規-21":["正しい。延べ面積300m²を超える建築物の新築に係る工事監理受託契約では、報告方法や従事建築士の氏名等を記載した書面を当事者が相互に交付する必要がある。","正しい。工事監理受託契約を締結しようとする者は、国土交通大臣が定める報酬の基準に準拠した委託代金で契約するよう努めなければならない(努力義務)。","正しい。建築士は委託者から請求があれば免許証等を提示する必要があり、工事監理を終了したときは直ちに結果を建築主に報告しなければならない。","誤り。設計図書どおりでない工事を認めたら、施工者に指摘し、従わない場合は建築主に報告する。報告先は特定行政庁ではなく建築主である。"],"2024-法規-22":["正しい。開設者は、工事監理の業務に関し生じた損害を賠償するための保険契約の締結その他の措置を講ずるよう努めなければならない(努力義務)。","正しい。設計等の業務に関する報告書を事業年度ごとに都道府県知事へ提出しない場合は、30万円以下の罰金の対象となる。","正しい。新築の工事監理は原則として一括再委託が禁止されるが、延べ面積300m²以下の建築物は、委託者の許諾があれば一括して委託できる。","誤り。工事監理報告書の保存期間は、作成日から5年ではなく15年である。5年は誤りで、書類保存義務の期間を取り違えている。"],"2024-法規-23":["誤り。所属建築士の監督や業務遂行の適正確保に関する技術的事項を総括するのは、開設者自身ではなく、専任の管理建築士である。","正しい。開設者は、所属建築士の氏名や業務の実績を記載した書類を事務所に備え置き、委託しようとする者の求めに応じて閲覧させなければならない。","正しい。建築士事務所には、その事務所を管理する専任の建築士(管理建築士)を置かなければならない。管理建築士は所属建築士の中から選ばれる。","正しい。設計受託契約の締結前に、建築主に対して建築士から書面を交付して重要事項の説明をさせなければならない。"],"2024-法規-24":["正しい。市街化調整区域でも、地区整備計画が定められた地区計画の区域内で、計画の内容に適合する開発行為は、所定の要件を満たせば許可を受けられる。","正しい。開発許可を受けた者が、許可を要しない軽微な変更をしたときは、遅滞なく都道府県知事に届け出なければならない。","誤り。工事完了公告後の予定建築物以外の新築等の制限(許可)は、用途地域等が定められていない区域が対象である。用途地域がある区域では許可は不要。","正しい。都市計画施設の区域内では、木造2階建て以下で地階を有しない建築物であっても、原則として都道府県知事等の許可が必要である。"],"2024-法規-25":["正しい。1号消火栓は、各階の各部分から一のホース接続口までの水平距離を25m以下とする。倉庫で延べ面積が一定以上のため屋内消火栓の設置対象となる。","誤り。飲食店は延べ面積150m²以上で消火器等の設置が必要となる。延べ面積150m²の飲食店は該当するため、設置しなくてよいとする点が誤り。","正しい。開口部のない耐火構造の床又は壁で区画されている場合、その区画された部分は消防用設備等の基準の適用上、別の防火対象物とみなされる。","正しい。大学のような非特定用途の防火対象物では、避難口誘導灯は地階、無窓階、11階以上の部分に設置が必要で、無窓階のない地上5階建てなら不要である。"],"2024-法規-26":["正しい。客室総数が200室未満の場合、車椅子使用者用客室は客室総数の1/100以上必要で、120室なら1.2を切り上げて2室以上となる。","正しい。車椅子使用者用駐車施設は、利用居室までの経路の長さができるだけ短くなる位置に設けなければならない。","誤り。特定建築物の建築等及び維持保全の計画の認定は、申請することができる任意の制度であり、申請が義務ではない。","正しい。移動等円滑化経路を構成するエレベーターの乗降ロビーは、幅及び奥行きをそれぞれ150cm以上とする。"],"2024-法規-27":["誤り。非住宅部分の増築で増築部分の床面積が300m²以上のものは、努力義務ではなく建築物エネルギー消費性能基準への適合義務の対象である。","正しい。分譲型一戸建て規格住宅を年間150戸以上供給する建築主には、より高い水準の基準への適合に努める義務がある。","正しい。分譲型規格共同住宅等を年間1,000戸以上新築して分譲する建築主には、一層の省エネ性能向上の基準に適合させる努力義務がある。","正しい。空気調和設備等の改修についても、建築物エネルギー消費性能向上計画を作成して所管行政庁の認定を申請することができる。"],"2024-法規-28":["正しい。構造計算の各項目を確かめる記述であり、保有水平耐力計算(ルート3)に相当する検証として整合する。層間変形角・剛性率・偏心率等の確認が含まれる。","正しい。柱・はりに要求される耐火時間は、通常火災終了時間と特定避難時間との関係で定まり、記述の数値設定で準耐火構造とする判断は成り立つ。","正しい。設備設計一級建築士による法適合確認が義務となるのは一定規模以上の場合に限られ、義務のない場合は求めなくてもよい。","誤り。特定建築物の定期調査報告の間隔は、概ね6月から3年までの範囲で特定行政庁が定める。5年の間隔という説明は誤りである。"],"2024-法規-29":["正しい。用途地域による用途制限は、特定行政庁が住居の環境を害するおそれがない等として許可すれば、例外的に建築できる。","正しい。建築物エネルギー消費性能向上計画の認定を受けた場合、省エネ設備(再エネ設備等)の部分は、容積率の算定上、特例により不算入とできる。","誤り。3階以上の階に物品販売業の売場がある場合、売場に通ずる直通階段は避難階段又は特別避難階段としなければならず、いずれにも該当しない階段は不可。","正しい。異種用途区画は、一定の自動火災報知設備を設ける等の措置があれば区画に代えられる場合があるとの記述で、規定の趣旨に沿う。"],"2024-法規-30":["正しい。工業地域内で1日の処理能力が一定以下の廃プラスチック類破砕施設は、特定行政庁の許可なく建築できる。","正しい。景観計画区域内で建築物の外観を変更する模様替を行う場合は、原則として事前に景観行政団体の長への届出が必要となる。","正しい。土砂災害特別警戒区域内で分譲住宅等の予定建築物のための開発行為をするには、あらかじめ都道府県知事の許可を受けなければならない。","誤り。特定盛土等規制区域内での盛土(崖が生ずるもの)の工事は届出制だが、着手の30日前ではなく14日前までに届け出る。期間の数値が誤り。"],"2023-法規-1":["誤り。脱落によって重大な危害を生ずるおそれがあるものとして国土交通大臣が定める天井は「強化天井」ではなく「特定天井」である。","正しい。特定都市河川浸水被害対策法第10条及びこれに基づく命令・条例の規定で、建築物の敷地・構造・建築設備に係るものは建築基準関係規定に含まれる。","正しい。建築物の自重・積載荷重等を支える最下階の床版は、構造耐力上主要な部分に該当する。","正しい。通常の火災による火熱が加えられた場合に、加熱開始後1時間加熱面以外の面に火炎を出さない防火設備で大臣認定を受けたものが特定防火設備である。"],"2023-法規-2":["正しい。専ら防災のための備蓄倉庫部分は、敷地全体の延べ面積の1/50を限度に容積率算定の延べ面積に算入しない。1,000m²の1/50は20m²で該当する。","正しい。高度地区の北側斜線に係る高さの算定では、階段室等は水平投影面積が建築面積の1/8以内でも高さに算入される。","正しい。後退距離の算定の特例を受けるポーチ等は、前面道路に面する長さが敷地の道路接続部分の長さの1/5以下であることが条件の一つである。","誤り。倉庫・機械室等からなる地階で水平投影面積が建築面積の1/8以下のものは、建築物の階数に算入しない。算入するとの記述が誤り。"],"2023-法規-3":["誤り。木造2階建て、延べ面積500m²以下の事務所は4号建築物に該当し、屋根・壁の過半の修繕では確認済証の交付を受ける必要はない。","誤り。重要文化財として仮指定された建築物には建築基準法の規定が適用除外され、移転でも確認済証は不要である。","正しい。確認済証が必要となる。10m²以内の例外は増築・改築・移転に限られ、新築は規模が小さくても確認が必要である(防火・準防火地域外でも同様)。","誤り。用途変更で確認が必要となるのは、特殊建築物の用途に供する部分の床面積が200m²を超える場合である。200m²は超えないため不要。"],"2023-法規-4":["誤り。階数3以上の共同住宅の中間検査の特定工程は2階の床及びこれを支持するはりの配筋工程であり、3階の床の配筋工程は該当しない。","正しい。特殊建築物でなく小規模な建築物であれば、検査済証の交付前でも仮使用の承認を要せずに使用できる。","正しい。国際的な規模の会議等の用に供する仮設興行場で1年を超えて使用する特別の必要があるものは、特定行政庁の許可を受けて建築できる。","正しい。認証型式部材等で、工事が建築士である工事監理者により設計図書のとおり実施されたことが確認されたものは、完了検査で型式に適合するものとみなされる。"],"2023-法規-5":["誤り。採光に有効な部分の面積は、開口部の面積に採光補正係数を乗じて求める。図の寸法から算定した結果は4.0m²とならない。","正しい。第一種住居地域の採光補正係数(D/H×6-1.4等)を図の寸法に当てはめて開口部の面積に乗じると、有効面積は4.4m²となる。","誤り。有効面積は開口部の面積に採光補正係数(1.0以下)を乗じたもので、図の条件から算定した値は6.4m²とならない。","誤り。12.0m²は補正係数を考慮しない大きな値で、採光補正係数を乗じるため有効面積がこれほど大きくなることはない。"],"2023-法規-6":["正しい。準防火地域内で延べ面積が1,500m²を超える建築物は、耐火建築物又はこれと同等以上の延焼防止時間となる建築物としなければならない。","正しい。耐火性能検証法における可燃物の発熱量は、室の用途・床面積・内装の表面積・建築材料の種類に応じ、国土交通大臣が定める方法で算出する。","誤り。防火・準防火地域外の3階建て図書館は、規模・用途に応じ耐火建築物に限らず準耐火建築物等とすれば足りる場合があり、耐火建築物と断定する点が誤り。","正しい。耐火建築物以外の特殊建築物は、主要構造部が特定避難時間(屋根及び階段は30分間)の間、構造耐力上支障のある損傷を生じないことが求められる。"],"2023-法規-7":["正しい。床面積の合計が1,500m²を超える物品販売業の店舗では、売場及び屋上広場に通ずる直通階段を2以上設け、避難階段又は特別避難階段とする。","誤り。不特定多数が利用するナイトクラブ等を避難階以外の階に設ける場合は、2以上の直通階段が原則必要である。避難上有効なバルコニー等もないので1か所は不可。","正しい。診療所で病室の床面積の合計が一定以下で主要構造部が準耐火構造等であれば、直通階段を1か所とすることができる。","正しい。階避難安全検証法では、居室ごとの避難と、火災室ごとに階に存する者全員が階から安全に避難できることを確かめる。"],"2023-法規-8":["正しい。災害時の公益上必要な応急仮設建築物は避難施設の規定が適用されず、完成後3月を超えて存続させる場合は特定行政庁の許可が必要である。","正しい。建替え中の仮設店舗で特定行政庁の許可を受けたものには、内装の制限に関する規定は適用されない。","正しい。非常災害区域内で災害救助のために使用する建築物の用途変更で、災害発生から1月以内に着手するものは建築基準法令の規定が適用されない。","誤り。用途変更して一時的に使用する興行場の特例では、適用除外となる規定は限られ、排煙設備に関する規定は適用が除外されない。"],"2023-法規-9":["正しい。有料老人ホームなど特殊建築物の居室の内装は、壁・天井(居室)を難燃材料以上の仕上げとすれば足りる。","正しい。耐火建築物の図書館の居室内装は難燃材料でよい(通路は準不燃材料以上が必要となる点と区別する)。","正しい。主要構造部が耐火構造の建築物で、最上階でない2階の調理室であれば、内装制限の対象外となり、仕上げの材料を問われない。","誤り。病院等の居室から地上に通ずる主たる廊下・階段等の通路の壁・天井は、難燃材料では足りず、準不燃材料以上の仕上げとしなければならない。"],"2023-法規-10":["正しい。準耐火構造の防火区画を貫通する配管は、通常の火災時に火炎を出す原因となる損傷を生じないものとして大臣認定を受けたものとできる。","正しい。非常用エレベーターの昇降路は2基以内ごとに耐火構造の床・壁で囲み、乗降ロビーも窓・排煙設備・出入口を除き耐火構造の床・壁で囲む。","誤り。排煙口には手動開放装置が必要で、煙感知器と連動する自動開放装置を設けても、手動開放装置を省略できるわけではない。","正しい。防火区画された共同住宅の住戸(200m²以内)の居室には、開放できる部分の面積が不足していても、排煙設備を設けなくてよい場合がある。"],"2023-法規-11":["正しい。高さ31m以下の鉄筋コンクリート造で保有水平耐力計算を行う場合、柱の主筋断面積の和を0.8%以上とする規定は適用されない。","誤り。保有水平耐力計算又はこれと同等以上の安全性を確かめる構造計算を行った建築物は、構造計算適合性判定の対象となる。判定不要とする点が誤り。","正しい。高さが60mを超える建築物で大臣認定を受けた構造計算によるものは、構造計算適合性判定の対象とならない。","正しい。許容応力度等計算によって安全性を確かめる場合でも、外装材は風圧に対して構造耐力上安全であることを確かめなければならない。"],"2023-法規-12":["正しい。映画館の客席(固定席)の積載荷重は、柱・基礎の圧縮力の計算では2,600N/m²とでき、床の数が複数でも低減しない旨の規定に沿う。","正しい。鉄筋の短期許容応力度は圧縮・引張りとも基準強度Fの値とする。径25mmの異形鉄筋も該当する。","誤り。コンクリートの短期のせん断許容応力度は長期の2倍であり、設計基準強度の1/30ではなく1/15程度となる(1/30は長期)。","正しい。コンクリートの引張りの材料強度は、圧縮の材料強度の1/10とされている。"],"2023-法規-13":["正しい。限界耐力計算を行った場合、鉄骨造の圧縮材の有効細長比を柱で200以下とする規定は適用されない。","正しい。限界耐力計算を行った場合、鉄筋コンクリート造のはりに複筋ばり及びあばら筋の間隔を一定以下とする規定は適用されない。","正しい。コンクリートの打込み中及び打込み後5日間は、温度が2度を下らないようにし、乾燥や震動を避けて養生しなければならない。","誤り。限界耐力計算による場合の柱脚の緊結に関する規定の適用関係を取り違えた記述とされる(公式正答)。※要確認:筆者は適用除外の根拠を確認できていない。"],"2023-法規-14":["正しい。高度利用地区内で自動車のみの交通用の道路の上空に建築物を建築する場合は、原則として特定行政庁の許可を要する。","誤り。工事現場に設ける仮設事務所などの仮設建築物は、敷地が道路に2m以上接する規定(接道義務)が適用除外となる。","正しい。特殊建築物や階数3以上の建築物等は、敷地の接する道路の幅員や接道長さについて、条例で制限を付加される場合がある。","正しい。景観重要建造物については、市町村の条例により、道路に軒を突き出したまま大規模の修繕を行える場合がある。"],"2023-法規-15":["正しい。消防署などの公益上必要な建築物は、用途地域の制限が緩和され、第一種住居地域でも新築できる。","正しい。準住居地域では、客席の部分の床面積が200m²未満の演芸場は新築できる。","正しい。準工業地域では、火薬の貯蔵量が一定以下の倉庫は新築できる(本問の記述は許容される範囲)。","誤り。大学は、工業地域及び工業専用地域では建築できない。工業地域で建築できるのは、幼稚園・小中高等学校までである。"],"2023-法規-16":["誤り。図が必要だが、建蔽率の緩和（準耐火建築物・角地等）や敷地の算定を踏まえた最大値は、この値より大きくなる。","誤り。建蔽率の緩和を適用した建築面積の最大値としてはこの値は小さく、最大のものとはならない。","誤り。準耐火建築物としての緩和や角地緩和を加味した建築面積の上限には達しておらず、最大値ではない。","正しい。準耐火建築物等の建蔽率の緩和や敷地面積の算定を適用して求めた建築面積の最大値がこの値となる。図に基づく計算結果である。"],"2023-法規-17":["誤り。道路斜線・隣地斜線・北側斜線などのうち最も厳しい制限による高さの最高限度は、この値より大きくなる。","誤り。各斜線制限を比較して求めた最も厳しい高さ制限はこの値を上回り、A点の最高限度とはならない。","正しい。道路斜線、隣地斜線、北側斜線の制限を各々算定し、北側隣地の地盤面との高低差の緩和も考慮した最小値がこの値となる。","誤り。算定した各斜線制限のうち最も厳しいものはこの値より低く、これは最高限度を超えている。"],"2023-法規-18":["正しい。防火地域内の建築物は、外壁が耐火構造であれば、その外壁を隣地境界線に接して設けることができる（建築基準法63条）。","正しい。防火地域内の看板等で、建築物の屋上に設けるもの又は高さ3mを超えるものは、主要部分を不燃材料で造るか覆う必要がある（法64条）。","誤り。防火壁で区画されていない場合、建築物全体に厳しい防火地域の規制が適用される。地上3階建ては耐火建築物等とする必要があり、準耐火建築物とはできない。","正しい。防火地域内の開放的簡易建築物（自動車車庫等）の柱及びはりは、準耐火構造とするか不燃材料で造らなければならない。"],"2023-法規-19":["誤り。一団地の総合的設計による特例（法86条）で一の敷地とみなされるのは、接道、容積率、建蔽率、斜線制限等の規定であり、用途地域等の規定は対象でない。","正しい。指定確認検査機関の処分に不服がある場合は、当該処分に係る建築物の確認権限を有する建築主事を置く市町村又は都道府県の建築審査会に審査請求できる。","正しい。既存不適格の建築物を増築する際、増築部分の床面積が基準時の延べ面積の1/2を超えるときは、既存部分を含め現行規定に適合させなければならない。","正しい。足固めを使用した平家建ての木造住宅等では、軟弱地盤の区域外であれば、最下階の柱の下部に土台を設けなくてもよい（令42条1項ただし書）。"],"2023-法規-20":["正しい。防火区画に接する外壁は、50cm以上突出した準耐火構造のひさし・床・袖壁等で防火上有効に遮られていれば、幅90cm以上の部分を準耐火構造とする規定を緩和できる。","正しい。病院の地階に設ける入院患者の談話等の居室は、用途上やむを得ない居室として、採光に有効な開口部の面積を床面積の1/10以上としないこともできる。","誤り。老人ホーム等の共用の廊下・階段、エレベーターの昇降路は、容積率算定の延べ面積に全て不算入であり、1/3を限度とする規定はない。","正しい。階段の幅が3mを超える場合は中間に手すりを要するが、蹴上げ15cm以下かつ踏面30cm以上の階段は、中間手すりを設けなくてもよい。"],"2023-法規-21":["誤り。2,000m²を超える建築物の建築設備について建築設備士の意見を聴いたときは、設計図書にその旨を明記しなければならない。「努めなければならない」ではなく義務である。","正しい。工事監理を行う建築士は、建築設備士の意見を聴いたときは、その旨を明らかにして、工事監理終了後直ちに結果を建築主に報告しなければならない。","正しい。他の一級建築士の設計図書の一部変更は、本人の承諾を求め、得られなかったときは、自己の責任で変更することができる（建築士法19条）。","正しい。建築士は、知識・技能の維持向上に努め、設計の委託者に対し設計内容について適切な説明を行うよう努めなければならない。"],"2023-法規-22":["誤り。重要事項説
