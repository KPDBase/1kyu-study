長に提出する。","誤り。仮設建築物の建築基準法の規定緩和を受ける許可申請(法85条)の提出先は特定行政庁であり、建築主事ではない。","正しい。道路法により通行制限を受ける車両(特殊車両)を通行させるには、道路管理者に特殊車両通行許可申請を行う。","正しい。石綿含有吹付け材等の除去作業では、作業開始の14日前までに労働基準監督署長へ計画届を提出する必要がある。"],"2023-施工-5":["誤り。枠組足場の壁つなぎの間隔は、垂直方向9m以下、水平方向8m以下とする。記述は水平と垂直が逆で、水平方向9mは基準を超える。","正しい。鋼製巻尺は、JIS1級品を2本用意してテープ合わせを行い、1本を基準巻尺として保管し、もう1本を工事に使用する。","正しい。ベンチマークは移動のおそれのない位置に設け、既存工作物等も併用して相互に確認できるようにするのがよい。","正しい。歩道等に対する防護棚(朝顔)は、1段目を地上5m程度の高さに設け、はね出し長さを水平2m以上、角度20度以上とするのが一般的である。"],"2023-施工-6":["正しい。親杭横矢板壁は砂礫地盤でも施工できるが、遮水性がないため、地下水位が高い場合は排水工法の併用が必要となる。","誤り。逆打ち工法は、地下躯体を支保工として先行利用するため山留め壁の変形を抑えやすく、軟弱地盤の深い掘削にも適している。","正しい。地盤アンカー工法は切梁が不要で作業空間が広く、不整形な平面や偏土圧の作用する場合にも有効で、施工効率の向上が期待できる。","正しい。ヒービング対策として、剛性の高い山留め壁を良質な地盤まで深く根入れし、背面土の回り込みを抑える方法がある。"],"2023-施工-7":["正しい。セメント系固化材を使う地盤改良では、現場土と使用予定の固化材で六価クロム溶出試験を行い、土壌環境基準以下であることを確認する。","正しい。強固で良質な地盤改良面を支持面とする場合などは、砂利地業を省略して表層に直接捨てコンクリートを打つ地肌地業とすることがある。","正しい。アースオーガーの支持層到達は、電動機の電流値の変化と土質柱状図・N値の対比に加え、先端付着土と土質標本の照合で確認する。","誤り。場所打ち杭の鉄筋かごでは、主筋と帯筋の溶接は主筋の材質を損なうおそれがあるため行わず、鉄線結束や仮付けなどによる。"],"2023-施工-8":["誤り。ガス圧接部の鉄筋中心軸の偏心量は鉄筋径の1/5以下とする。1/4は不合格で、再加熱による修正はできず、切り取って再圧接する必要がある。","正しい。梁下端筋の鋼製スペーサーは、端部1.5m以内程度と端部以外で間隔1.5m程度に配置するのが一般的で、記述は標準的である。","正しい。スパイラル筋の加工寸法の許容差は、特記がなければ外側寸法で±5mmの範囲とする。","正しい。小梁(片持ちでない)の下端筋の直線定着長さは、SD345では設計基準強度にかかわらず20dとするのが標準的である。"],"2023-施工-9":["正しい。フラットデッキは施工荷重によるたわみを見込んだむくりがあるため、短スパンで使用する場合はスラブ厚が薄くならないよう注意する。","正しい。せき板表面にセメントペーストを塗り付けて2〜3日後に剥がし、表面状態を見る方法で、硬化不良を起こしやすいせき板を判別できる。","誤り。高さ3.5mを超えるパイプサポート支柱では、高さ2m以内ごとに水平つなぎを二方向に設ける必要がある。3.5mごとでは不足である。","正しい。腰壁型枠は、コンクリートの盛り上がり防止のため上端にふたを設け、端部以外の開口部から充填状況を点検できるようにする。"],"2023-施工-10":["正しい。調合管理強度は、設計基準強度と耐久設計基準強度のうち大きいほうの値に構造体強度補正値を加えた値とする。","正しい。計画供用期間の級が標準で普通ポルトランドセメントを用いる普通コンクリートの水セメント比の最大値は65%である。","誤り。角張って実積率の小さい粗骨材は、所定のスランプを得るのに必要な単位水量が大きくなる。単位水量を小さくできるわけではない。","正しい。普通コンクリートの単位セメント量の最小値は270kg/m3である。"],"2023-施工-11":["正しい。ベント管内で閉塞した場合は、圧力を解除してから管を取り外し、品質が変化したコンクリートは廃棄する。","正しい。柱・壁のコンクリートの沈みが落ち着いた後に梁を、梁の沈みが落ち着いた後にスラブを打ち込み、沈みひび割れを防ぐ。","正しい。CFT柱の充填コンクリートのブリーディング量は、特記がなければ0.1cm3/cm2以下とする。","誤り。受入検査と併用しない構造体コンクリートの強度検査では、1回の試験の供試体は、適当な間隔をあけた3台の運搬車から1個ずつ採取した3個とするのが原則で、1台から3個ではない。"],"2023-施工-12":["正しい。PCa耐力壁の接合部の防水は、適切な目地深さを確保するためバックアップ材を装填し、建築用シーリング材で行う。","正しい。PCa部材と現場打ちコンクリートの接合部は、清掃・散水で湿潤状態にし、豆板等を防ぐため1か所ごとに一度に打ち込む。","正しい。スリーブ継手のグラウト充填は、注入口から注入したグラウト材がすべての排出口からあふれ出ることを目視で確認する。","誤り。脱型時に高温のPCa部材は、急激な乾燥・温度変化によるひび割れを防ぐため、温度や湿度を管理して徐冷する。単に十分に乾燥させるのは不適当である。"],"2023-施工-13":["正しい。気温が-5℃〜5℃の場合は、溶接線から100mmの範囲の母材を予熱して溶接する。","正しい。隅肉溶接のT継手で隙間が1.5〜5mmの場合は、隙間の大きさだけ隅肉溶接のサイズを増やして施工する。","誤り。裏当て金の組立溶接は、梁フランジ幅の両端から5mm以内の位置では行わない。端部は応力集中でノッチ等の欠陥の原因になるためである。","正しい。H形断面柱の接合部のエンドタブは、特記がなければ切断しないで残す扱いが一般的である。"],"2023-施工-14":["正しい。柱の長さの誤差の管理許容差は、鉄骨精度検査基準で定められた範囲であり、記述の値は基準に合致するものとして扱われる。","誤り。製品検査における階高の誤差Δhの管理許容差は±3mmであり、±5mmとしている記述は不適当である。","正しい。工事現場における柱の倒れeは、e≦H/1,000かつe≦10mmが管理許容差である。","正しい。工事現場における建築物の倒れeは、e≦H/4,000+7mmかつe≦30mmが管理許容差である。"],"2023-施工-15":["正しい。梁などの横架材は、木材の背(樹皮側)を上端にして使用する。","正しい。防腐処理材を現場で加工した面は、薬剤が浸透していないため、再度防腐処理を行ってから使用する。","正しい。土台の継手は柱・床下換気口の位置を避け、継手付近のアンカーボルトは上木端部付近に設置する。","誤り。大壁造の壁倍率3.7の構造用合板耐力壁は、外周部の釘打ち間隔を75mm程度にする仕様であり、150mm間隔では倍率が低い仕様となる。"],"2023-施工-16":["正しい。トーチ工法の立上り末端部は、各層の端部をそろえて押え金物で固定し、シール材を充填する。","正しい。保護層の成形伸縮目地材は、保護コンクリートの上面から下面まで達する高さ調節可能なもので、記述の仕様は一般的である。","誤り。塗膜防水の下地は、入隅は直角に、出隅は面取り(丸面)に仕上げる。記述は入隅と出隅が逆である。","正しい。被着体が5℃以下になるおそれがある場合は、仮囲い・シート覆いによる保温などの措置を講じて施工する。"],"2023-施工-17":["誤り。塩化カルシウム系の凍結防止剤は鉄筋やアルミニウム合金を腐食させるおそれがあり、建具枠まわりの充填モルタルには使用しない。","正しい。モルタル塗りの下塗りは、先に塗布した吸水調整材が乾燥した後に行う。","正しい。密着張りは上部から下部へ、一段置きに数段張った後に間を埋める手順で行う。","正しい。乾式工法の石張りでは、一次ファスナーの位置に合わせて躯体にあと施工アンカーを取り付ける。"],"2023-施工-18":["正しい。アルミニウム製笠木の固定金具は、防水層を施したパラペット天端にあと施工アンカーで堅固に取り付ける。","誤り。天井のつりボルトはダクトフランジ等の設備機器に取り付けてはならない。つりボルトの間隔が確保できない箇所は、補強材を設けるなど別に対処する。","正しい。熱線反射ガラスは反射膜を傷つけないよう、軟らかい材料で水洗いして清掃する。","正しい。グレイジングチャンネル構法は、溝内のチャンネルでガラスを保持する構法であり、一般にセッティングブロックを使用しない扱いとなる。"],"2023-施工-19":["誤り。ALCパネル下地のモルタル塗りは、表面強度が低いため、富調合では乾燥収縮やひび割れが大きくなる。保水剤を添加した貧調合のモルタルを用いる。","正しい。仕様ルートの特定天井では、天井面構成部材等の質量(照明設備等を含む)が単位面積当たり20kg/m2以下であることが条件である。","正しい。メタルカーテンウォールのファスナーは、ピアノ線で連続した基準を設定して取り付け、階ごとの墨の誤差による食い違いを防ぐ。","正しい。コンクリート下地への塗装は、夏期は材齢21日以上経過し十分乾燥していることを確認してから行う。"],"2023-施工-20":["正しい。埋設配管の上方の土被り150mm程度の位置に、埋設表示用のテープを敷設するのは一般的である。","正しい。壁付けの衛生器具は、樹脂製プラグ等を用いてコンクリート壁へ堅固に取り付けることができる。","誤り。CD管は自己消火性がなく、コンクリート埋設用である。軽量鉄骨壁下地内の配線には、自己消火性のあるPF管などを使用する。","正しい。二重床内の配線は、ケーブルをころがし配線とし、二重床の割付方向に平行に配線経路をとるのが一般的である。"],"2023-施工-21":["誤り。屋外保管する発泡プラスチック断熱材は、黒色のシートでは熱がこもり変形するおそれがある。白色等のシートで覆い、直射日光を避けつつ隙間を設けて通気を確保する。","正しい。打込み工法で断熱材が欠落した部分は、仕上げに支障がない箇所であれば、同じ断熱材で隙間なく補修できる。","正しい。木造の天井断熱は、断熱材相互の隙間や、防湿層が断熱層の室内側にあることを、天井下地施工完了までに目視で確認する。","正しい。防湿フィルムの継目は、柱等の木下地のある部分に設け、重ね幅を30mm以上とする。"],"2023-施工-22":["正しい。耐震スリットは、耐火性能を有するスリット材を挿入し、屋外側・屋内側をシーリング材で止水処理するのが一般的である。","正しい。接着系アンカーで接着剤があふれ出ない場合は、直ちに引き抜き、カプセルを追加して再施工する。","誤り。ハンマードリルは騒音・振動が大きい。騒音・振動対策が必要な場合は、コアドリル等の低騒音・低振動の工法を採用する。","正しい。増設壁上端のグラウト注入は、空気抜きより高い位置の管先端からのオーバーフローにより充填状況を確認する。"],"2023-施工-23":["誤り。改修用ドレンを設けない場合、ルーフドレン周囲は端部から500mm程度の範囲で既存保護コンクリートを撤去し、既存防水層も含めて処理する。300mmでは不足である。","正しい。既存アスファルト防水層を残す場合は、損傷・浮き・剥離箇所を切開し、バーナーで熱して溶融アスファルトを充填し張り合わせる。","正しい。厚付け仕上塗材仕上げでは、目違い程度であればサンダー掛けで足り、下地調整塗材の塗付けを省略できる。","正しい。0.25m2以下の部分的なタイル張替えは、下地面とタイル裏面にポリマーセメントモルタルを塗り、目地詰めまで24時間以上養生する。"],"2023-施工-24":["正しい。ミルシートは、製鋼所が発行する鋼材の成分・機械的性質等の試験結果を示す規格品証明書である。","正しい。ブリーディングは、固体材料の沈降・分離により練混ぜ水の一部が遊離して上昇する現象である。","正しい。チョーキングは、塗膜が紫外線・熱・風雨等で劣化し、表面から粉化する現象である。","誤り。記述は被圧地下水による掘削底面の持ち上がりで、盤ぶくれの説明である。ボイリングは砂質地盤で上向きの浸透流により砂が沸き立つ現象である。"],"2023-施工-25":["正しい。発注者は、監理者の意見に基づき、施工管理上著しく不適当な者について、理由を明示した書面で受注者に必要な措置を求めることができる。","誤り。契約不適合による履行の追完(修補・代替物の引渡し)の請求先は受注者であり、監理者ではない。","正しい。受託者に債務不履行があった場合、委託者は相当期間を定めて催告し、履行がなければ契約の全部または一部を解除できる。","正しい。協議で決定した事項は、原則として速やかに書面を作成し、記名・押印する。"],"2022-施工-1":["正しい。トータルフロートが最小（通常ゼロ）となる経路がクリティカルパスで、遅れが全体工期に直結するため重点管理する。","正しい。総合施工計画書は着手に先立ち、総合仮設を含む全般的な進め方、主要工事の施工方法、品質目標・管理方針などの大要を定めるものである。","誤り。総合図は各分野の設計図を重ね合わせて調整した図面で、コンクリート躯体図の作成前に作成し、これを基に躯体図を作成する。","正しい。概成工期は、総合試運転調整を行うために関連工事を含め支障のない状態まで完了しているべき期限である。"],"2022-施工-2":["正しい。上階の墨出しは、四隅の床に小さな穴を開けて下げ振り等で下階から基準墨を上げる方法が一般的である。","誤り。監理者による遣方検査は、施工者と同じ方法では同じ誤りを見逃すおそれがあるため、できる限り施工者とは異なる方法で確認する。","正しい。実施工程表を変更する必要が生じた場合は、施工に支障がないよう直ちに変更し、変更部分の施工に先立ち発注者及び監理者に提出する。","正しい。石綿の除去作業で用いて廃棄されたプラスチックシートや防塵マスク等は、石綿含有の特別管理産業廃棄物に該当する。"],"2022-施工-3":["正しい。設計図書に製品名・製造所が複数指定されている場合は、その中から工事施工者が選定してよい。","正しい。JIS又はJASのマーク表示のある材料は、品質・性能の証明となる資料の提出を省略できる。","正しい。錆止め塗料の塗付け量は膜厚測定が困難なため、使用量から推定して確認する方法が一般的である。","誤り。有機系接着剤によるタイル後張りの打診検査は、接着剤が硬化した後に全面にわたって行う。硬化前では接着状態を確認できない。"],"2022-施工-4":["誤り。歩道の切下げ工事の承認申請は、道路管理者（必要に応じ警察署長等）に行うもので、建築主事あてではない。","正しい。建築工事届は、確認申請と同時に建築主事を経由して都道府県知事に提出する。","正しい。建設リサイクル法の対象工事では、着手の7日前までに分別解体等の計画を添えて都道府県知事に届け出る。","正しい。完了検査の申請は、工事完了日から4日以内に建築主事に到達するよう行う。"],"2022-施工-5":["正しい。表層の孔壁崩壊のおそれがある場合は、ドライブパイプを打ち込んで孔壁を保護する。","正しい。孔内水位は、水位が安定するまで一定時間放置してから測定する。","誤り。50回打撃しても30cm貫入しない場合は貫入量から換算するが、50回で30cm貫入したのであればN値は50である。30ではない。","正しい。N値から、砂質地盤の相対密度や内部摩擦角などを推定できる。"],"2022-施工-6":["正しい。根切り中に障害物を発見したときは、撤去・処分の方法や時期について監理者と協議する。","誤り。ディープウェルの揚水停止後は、井戸管内を充填したうえで止水処理（鋼板での蓋など）を行ってからコンクリートを打設する。砕石上に直接打設するのは不適当である。","正しい。切ばり交差部や切ばりと切ばり支柱を緊結し、山留め壁の変形や切ばりの蛇行を防止する。","正しい。腹起しと切ばりの撤去は、切ばりジャッキの軸力を緩めて荷重を解放してから行う。"],"2022-施工-7":["正しい。直接基礎の床付け面は、乱さないよう最後の30～50cm程度を手掘りで仕上げる。","正しい。試験杭について特記がなければ、最初に施工する本杭を兼ねることができる。","誤り。超音波孔壁測定器で確認できるのは孔壁の崩壊や孔の偏心などで、支持層の土質は確認できない。土質は掘削土や地盤調査資料で確認する。","正しい。杭頭処理は、コンクリート打込み後14日程度経過してから、杭体を傷めないよう平坦に斫って高さをそろえる。"],"2022-施工-8":["誤り。スパイラル筋の重ね継手長さは、末端フック付きで50d以上（D10なら500mm以上）必要である。400mmでは不足する。","正しい。柱頭出隅部の柱主筋の末端は、折曲げ形状の規定に適合するフックとする。図に依存するが、答えの前提から適合する記述として扱う。","正しい。異径鉄筋の重ね継手長さは細いほうの径を基準とし、SD295・Fc24で35d（D10なら350mm）となる。","正しい。土に接する梁の最小かぶり厚さ40mmに10mmを加えた設計かぶり厚さ50mmが標準である。"],"2022-施工-9":["正しい。表面仕上がりの良さが求められる打放しには、JASのコンクリート型枠用合板の表面加工品（厚さ12mm）を用いる。","正しい。型枠支保工用鋼材の許容応力は、降伏強さ又は引張強さの3/4の小さいほうの2/3以下とする。","正しい。施工時の水平荷重は鉛直荷重に対する割合（2.5%以上等）で定め、地震力は別途検討しない。","誤り。計画供用期間の級が標準の場合、湿潤養生しない柱・梁側・壁のせき板は、圧縮強度10N/mm²以上で取り外す。5N/mm²では不足である。"],"2022-施工-10":["正しい。塩化物イオン量は0.30kg/m³以下であれば合格となる。","誤り。スランプフロー50cm指定の許容差は±7.5cmで、42.5～57.5cmが合格範囲。60.0cmは範囲外であり不合格となる。","正しい。高性能AE減水剤使用の呼び強度27以上でスランプ21cmの許容差は±2cmで、23.0cmは範囲内である。","正しい。不合格時に新しい試料で行う再試験は1回が認められ、1回で許容範囲内なら合格とする。"],"2022-施工-11":["正しい。流動化コンクリートはベースのスランプ15cm、流動化後21cmのように、増加量を規定内で定める。","正しい。寒中コンクリートの練混ぜ水の加熱は最高40℃程度までとし、荷卸し温度10～20℃を確保する。","正しい。圧送前に富調合のモルタルを先送りし、管内を潤滑して後続コンクリートの品質変化を防ぐ。","誤り。スラブ上面の均しやタンピングは、プラスチック収縮ひび割れ防止のため、凝結が終了する前の適切な時期に行う。凝結完了後では遅い。"],"2022-施工-12":["正しい。部材厚が大きい高強度コンクリートでは、水和熱による内外温度差を考慮した養生計画とする。","正しい。外壁性能上支障のない幅0.10mm以下のひび割れは、製造要領書に従い補修して合格とできる。","正しい。特殊形状や注意を要する部材は、専用架台に仮置きし、表示や損傷の有無を確認して受け入れる。","誤り。組立て精度の検査は、全部材の仮固定完了を待つのではなく、部材ごとに建込み・仮固定後、本接合前に速やかに行う。"],"2022-施工-13":["正しい。鉄骨製作工場のグレードは、性能評価の低いほうからJ、R、M、H、Sの5区分である。","誤り。高力ボルト孔は工場でドリルあけを原則とする。板厚13mm以下でせん断孔あけが可能な場合もあるが、現場ドリルあけとするのは不適当である。","正しい。ミルスケールを除去して一様に赤錆を発生させる方法で、すべり係数0.45以上を確保できる。","正しい。トルシア形高力ボルトの余長は、ナット面から突き出た長さがねじ1山から6山の範囲にあれば合格である。"],"2022-施工-14":["正しい。厚さ25mm以上の軟鋼の被覆アーク溶接による組立溶接には、低水素系溶接棒を使用する。","正しい。固着したミルスケールで溶接に支障がなければ、除去しなくてよい。","正しい。突合せ継手の段違いが薄いほうの板厚の1/4以下かつ10mm以下なら、滑らかに移行するよう溶接できる。","誤り。表面割れの補修は、割れの位置を確認し、割れの両端から50mm以上広げた部分を除去して再溶接する。20mmでは不足である。"],"2022-施工-15":["正しい。敷居・鴨居は反りを考慮し、木表側に建具用の溝を掘る。","正しい。枠組壁工法のアンカーボルトは、隅角部・継手付近に設け、その他の間隔は2.0m以内とする。","誤り。軸組工法の木製火打梁は、断面90mm×90mm以上とするのが一般的で、45mm×90mmでは小さい。仕口は六角ボルト締めとする。","正しい。大引きと土台の仕口は、大入れ蟻掛けとしてN75釘2本を斜め打ちする。"],"2022-施工-16":["誤り。シート防水の接着工法では、シートに引張力を与えず、たるみやしわを生じさせないように張り付ける。引張りながらの接着は不適当である。","正しい。砂付あなあきルーフィングを平場に用いる絶縁工法では、立上り部への砂付あなあきルーフィングは省略できる。","正しい。ウレタンゴム系塗膜防水の塗布は、立上り部を先に、次に平場部の順で行う。","正しい。接着性試験は特記がなければ簡易接着性試験とする。"],"2022-施工-17":["正しい。せっこうプラスター塗りでは、作業中・作業後半日～1日は通風を避け、凝結後に適切な通風を与える。","正しい。モルタル塗りの調合は、下塗りがセメント1：砂2.5、中塗り・上塗りが1：3とする。","誤り。屋外用の有機系接着剤は、変成シリコーン樹脂系等の一液反応硬化形とするのが一般的で、練混ぜ不良が生じる二液形とする記述は不適当である。","正しい。石工事の床用敷きモルタルの調合は、容積比でセメント1：砂4とする。"],"2022-施工-18":["正しい。高さ2,700mmの壁下地で、振れ止めは1.2m程度間隔に設ける。2,400mmの位置は上部ランナー上端から近く省略できる。","誤り。軽量鉄骨天井下地の野縁のはね出しは、野縁受けから150mm以内とする。180mmは過大である。","正しい。アルミ製引違い戸の単板ガラスのはめ込みには、グレイジングチャンネルを使用する。","正しい。破損時に破片が落下するトップライトには、合わせガラスを使用する。"],"2022-施工-19":["正しい。突付け工法に用いるせっこうボードのエッジはベベルエッジとする。","正しい。張付け後に湿気の影響を受けやすい箇所のビニル床シートには、エポキシ樹脂系接着剤を用いる。","正しい。スウェイ方式のスライドホール部は、層間変位を吸収できるよう手締め程度とし、緩止めを施す。","誤り。スパンドレルパネル方式はパネルの形状による分類で、層間変位への追従方式ではない。PCカーテンウォールではロッキング方式等で追従させる。"],"2022-施工-20":["正しい。給水管の水圧試験は、規定の圧力で保持時間60分とするのが一般的である。","正しい。ステンレス鋼管の立て管は、最下階で固定し、各階に管の伸縮を妨げない形鋼振れ止め支持を設ける。","正しい。二重天井内のケーブルは、荷重を確認したうえ、支持間隔2m以下で吊ボルトや天井下地材に固定する。","誤り。板状接地極は、地表面下0.75m以上に埋設し、ガス管から1.5m以上離隔する。数値が逆になっている。"],"2022-施工-21":["正しい。耐火二層管の横走り配管の吊り間隔は、1.5m以下とする。","誤り。硬質ポリ塩化ビニル管のたてどいの受け金物は、1.2m以下の間隔で取り付ける。3m間隔は不適当である。","正しい。軽量鉄骨壁下地のランナーのコンクリートスラブへの固定は、打込みピンで900mm程度間隔とする。","正しい。耐震クラスS対応のケーブルラックは、6m以内の間隔でSA種の耐震支持を行う。"],"2022-施工-22":["誤り。接着系アンカーは、アンカー筋に打撃や衝撃を与えず、回転を与えながらマーキング位置まで埋め込む。回転させない記述は不適当である。","正しい。金属系アンカーの締付け方式の固着確認は、目視検査と打音試験を全数行う。","正しい。確認試験荷重は、鋼材とコンクリート破壊による引張荷重の小さいほうの2/3程度とする。","正しい。引張試験不合格のロットは、残りの全アンカーを試験する。"],"2022-施工-23":["誤り。手動式エポキシ樹脂注入では、鉛直方向のひび割れは下部の注入口から上部へ順次注入し、空気を押し出す。上部から下部へは不適当である。","正しい。自動式低圧注入では、樹脂の硬化を見計らって、注入器具を取り付けたまま養生してから撤去する。","正しい。既存塗膜を除去する必要がなければ、水洗いで粉化物等を除去して上塗りのみ塗り替えることができる。","正しい。劣化した塗膜や脆弱部を除去する必要がある場合は、高圧水洗工法が適用される。"],"2022-施工-24":["誤り。ECPは押出成形セメント板（中空パネル）である。記述はALC（軽量気泡コンクリート）パネルの説明である。","正しい。DPG構法は、ガラスの孔に点支持金物を取り付けて支持構造と連結し、大きなガラス面を構成する構法である。","正しい。エントレインドエアは、AE剤等でコンクリート中に連行させた独立した微細な空気泡である。","正しい。逆打ち工法は、1階床・梁等を先行施工して支保工とし、地下の根切りと躯体施工を順次繰り返す工法である。"],"2022-施工-25":["正しい。委託者は、監理業務方針の説明を受けた日から7日以内に、修正の協議を請求できる。","正しい。受託者は、委託者の承諾を得た場合でも、監理業務の全部を一括して他の建築士事務所の開設者に委託してはならない。","誤り。委託者の債務不履行でも、その事由が委託者の責めに帰することができないものであるときは、受託者は損害賠償を請求できない。","正しい。工事請負契約が解除されたときは、受託者は催告なく書面で通知して監理業務委託契約を解除できる。"],"2021-施工-1":["正しい。施工計画書のうち品質計画に係る部分は、監理者が内容を確認して承認する事項であり、記述は適当である。","正しい。品質に影響を及ぼさない工種については、監理者の承認を得て工種別施工計画書の作成を省略することができる。","誤り。設計図書に記載のない専門工事業者の選定は、工事施工者の責任で行うものである。監理者の責任で選定するのは不適当。","正しい。契約書や設計図書に特別の定めのない仮設計画は、工事施工者が責任をもって決定するのが原則である。"],"2021-施工-2":["正しい。設計図書間に相違がある場合の優先順位は、一般に質問回答書が最も高く、次いで現場説明書、特記仕様書などの順となる。","正しい。公共工事標準請負契約約款では、特別な要因により工期内に主要な工事材料の価格に著しい変動を生じ、請負代金額が不適当となったときは、請負代金額の変更を請求できる。","誤り。専任の監理技術者補佐を置いた場合は、監理技術者は他の工事現場の監理技術者を兼務できる。兼務できないとする点が誤り。","正しい。産業廃棄物の処理委託では、元請業者は廃棄物の種類ごと、車両ごとにマニフェストを交付し、運搬・処分・最終処分の終了を確認する。"],"2021-施工-3":["正しい。既製コンクリート杭の仮置きは、所定の措置を講じたうえで同径のものを平積みとし、2段以下とするのが一般的である。","正しい。計画供用期間の級が標準の場合、JISに適合した回収水を練混ぜ水に用いることができる。","誤り。バックアップ材はシーリング材と接着しないもの(非接着性)を用いる。接着性がよいものを用いるとの記述が誤り。","正しい。造作材の含水率は、特記がなければ15%以下とするのが一般的で、搬入時に確認する。"],"2021-施工-4":["正しい。特定工程に係る工事を終えた日から4日以内に到達するよう、中間検査申請書を提出する。指定確認検査機関の確認を受けた建築物でも同様の扱いである。","正しい。騒音規制法の特定建設作業は、開始の日の7日前までに市町村長へ届け出る。","正しい。特定元方事業者は、作業開始後、遅滞なく事業開始報告を労働基準監督署長へ行う。","誤り。道路に足場を設置するなど道路を継続して使用する場合の道路使用許可は、警察署長に申請する。道路管理者あてとするのは誤り。"],"2021-施工-5":["正しい。足場の設置の届出は、高さ10m以上かつ60日以上の使用が対象である。本記述は期間が49日で60日未満のため届出は不要である。","正しい。床スラブに設ける仮設開口は、補強・復旧を含む計画書を作成し、監理者の承認を受ける。","正しい。基準墨は工事の精度の基準となるため、ベンチマークから引き出したものについて監理者の検査を受ける。","誤り。6,600Vの配電線に対する移動式クレーンの離隔距離は、一般に1.2m以上必要である。1.0mでは不足で不適当。"],"2021-施工-6":["誤り。ウェルポイントに接続するライザーパイプは、揚水の通り道であり無孔管を用いる。スリット形ストレーナー管を用いるのは不適当。","正しい。ヒーピング防止には、山留め壁背面側の地盤をすき取って土圧を減らす方法が有効である。","正しい。リチャージ工法は復水する分を余分に揚水する必要があり、必要揚水量は復水しない場合より多く計画する。","正しい。切ばりと支柱が重なる場合、支柱を切り欠いて補強したうえで切ばりを通りよく設置することは適当である。"],"2021-施工-7":["誤り。セメントミルク工法の支持層到達確認は、掘削機の電流値(積分電流値)の変化や掘削抵抗、土質試料などで行うものである。電流計からN値を算出するとの記述は不適当。","正しい。到達確認の記録が取得できない杭に備え、あらかじめ代替手法を定めて記録とするのは適当である。","正しい。アースドリル工法の安定液は、ベントナイトを主体に分散剤等を加え、できる限り低粘性・低比重に配合する。","正しい。トレミー管とケーシングチューブの先端はコンクリート中に2m以上入れておくことが必要である。"],"2021-施工-8":["正しい。鉄筋のあきは、粗骨材最大寸法や鉄筋径に応じた規定値以上であり、記述の寸法は図から判断して適当とされる。","誤り。耐力壁の鉄筋の継手長さが、SD345・Fc24N/mm2・D13に対する規定値(重ね継手長さ)を満たしていない。※図が不明のため、文章から言える範囲での説明である。","正しい。大梁下端筋の柱内折曲げ定着は、投影定着長さが規定値以上であれば適当である。","正しい。ガス圧接継手の位置は、隣接する継手を400mm程度ずらすなど規定に適合している。"],"2021-施工-9":["正しい。通常のポンプ工法による打込み時の積載荷重は、作業荷重と衝撃荷重を合わせて1.5kN/m2程度とする。","正しい。開口補強が不要で径200mm以下の壁スリーブは、特記がなければ紙チューブとしてよい。","誤り。支保工の取外し可否の判断には、現場水中養生または現場封かん養生した供試体を用いる。標準養生の供試体では実際の躯体の強度発現を反映できず不適当。","正しい。せき板の存置期間は、セメントの種類と存置期間中の平均気温により定められ、記述はその規定の範囲で適当である。"],"2021-施工-10":["誤り。コンクリートの圧縮強度は、水セメント比(W/C)の逆数、すなわちセメント水比(C/W)にほぼ比例する。表の記号の組合せがそれに該当しない記述は不適当。","正しい。AE減水剤の使用量は、セメント量に対する混和剤の使用率を乗じて求める。","正しい。細骨材率は、骨材の絶対容積に占める細骨材の絶対容積の割合(%)で表される。","正しい。フレッシュコンクリートの単位容積質量は、1m3当たりの各材料の質量の合計である。"],"2021-施工-11":["正しい。スランプ18cmの許容差は±2.5cmであり、15.5cmは許容範囲内(15.5〜20.5cm)である。","正しい。鋼管充填コンクリートの落し込み工法では、分離を防ぐため自由落下高さを1m以内とする。","正しい。設計基準強度の高い高強度コンクリートで高性能AE減水剤を用いる場合、練混ぜから打込み終了までの時間は120分を限度とするのが一般的である。","誤り。棒形振動機の挿入間隔は60cm以下が原則である。他の締固め器具を併用しても80cm程度とするのは不適当。"],"2021-施工-12":["正しい。仮設工場でも第三者機関の認定を受け、品質管理体制を整えれば、部材製造を行うことができる。","誤り。プレキャスト部材に用いるコンクリートの空気量は、凍結融解作用を受けるおそれがなければ、一般に4.5%とせず小さく設定する。特記がないとき4.5%とするのは不適当。","正しい。耐久上有効な仕上げを施す屋外側の設計かぶり厚さは、記述の値が一般的な目安である。","正しい。エンクローズ溶接継手は、溶接作業の方法に配慮して鉄筋の残留応力が過大とならないよう施工する。"],"2021-施工-13":["正しい。トルシア形高力ボルトは、一次締付け後にマーキングを施し、専用レンチでピンテールが破断するまで本締めする。","正しい。サブマージアーク溶接で、溶接施工試験により十分な溶込みが確認できれば、監理者の承認を得て裏はつりを省略できる。","正しい。溶接部の外観検査は、目視により表面欠陥や精度を確認し、基準を逸脱していると思われる箇所のみ測定する。","誤り。横向き姿勢のスタッド溶接は、実際の施工条件に合わせた技量付加試験を行う必要がある。A級資格のみで施工するのは不適当。"],"2021-施工-14":["正しい。製作工場での監理者の検査は、受入検査時に実際に使用する製品について直接行う。","誤り。高力ボルト用の孔は、特記のない限りドリル孔あけとするのが原則である。せん断孔あけとする記述は不適当。","正しい。専用締付け機が使えない箇所では、高力六角ボルトに交換しナット回転法で適切な張力を導入する方法が認められる。","正しい。鋼材の種類・形状・寸法は、規格品証明書の写しに所定の事項が明示されたものなどで確認する。"],"2021-施工-15":["正しい。短期許容耐力20kNのホールダウン金物用アンカーボルトの埋込み長さは、360mm以上が目安である。","誤り。出隅の通し柱と胴差の仕口は、大入れ蟻掛けにかね折り金物を当てるだけでは耐力上不十分で、必要な接合方法とする必要がある。","正しい。垂木と軒桁の接合は、ひねり金物を当てて釘打ちとするのが一般的である。","正しい。追掛け大栓継ぎは、上木先端部が柱心から150mm内外となるように下木を持ち出す。"],"2021-施工-16":["正しい。ウレタンゴム系塗膜防水では、補強布の重ね幅は50mm以上、塗継ぎの重ね幅は100mm以上とする。","誤り。プレキャストコンクリート部材の接合部の絶縁増張りは、増張り用シートを両側に100mm程度ずつ張り掛ける。50mm程度では不足で不適当。","正しい。屋根保護防水密着断熱工法の断熱材には、押出法ポリスチレンフォーム3種bA(スキン層付き)が用いられる。","正しい。保護絶縁工法では、平場部の立上り際500mm程度は、立上り部の1層目を密着張りとする。"],"2021-施工-17":["誤り。ビニル床シート下地となる床コンクリート直均し仕上げの平坦さの標準値は、3mにつき7mm以下である。1mにつき10mm以下とするのは不適当。","正しい。床タイルの伸縮調整目地は、特記がなければ縦・横とも4m以内ごとに設ける。","正しい。外壁タイルの引張接着強度試験は、100m2ごと及びその端数につき1個以上、かつ全体で3個以上とする。","正しい。内壁空積工法では、幅木の裏には全面に裏込めモルタルを充填する。"],"2021-施工-18":["正しい。軽量鉄骨壁下地のスタッド間隔は、ボード2枚張りで450mm程度、1枚張りで300mm程度とする。","誤り。野縁及び野縁受の形は、屋内が19形、屋外が25形である。屋内を25形、屋外を19形とする記述は逆で不適当。","正しい。網入り板ガラスの下辺小口と縦小口下端から1/4の高さまでの部分には、防錆処置を行う。","正しい。ガラスブロック積みの伸縮調整目地は、6m以内ごとに幅20mm程度で設ける。"],"2021-施工-19":["正しい。タイルカーペット全面接着工法の接着剤は、張替えを考慮し、粘着はく離(ピールアップ)形を用いる。","正しい。断熱材現場発泡工法の厚さ確認ピンは、スラブ下面・壁面5m2につき1箇所以上、柱・梁は1面につき各1箇所以上とし、そのまま存置する。","正しい。複層仕上塗材の主材塗りは、凹凸状は吹付け、ゆず肌状はローラー塗りとする。","誤り。押出成形セメント板(ECP)のパネル相互の目地幅は、長辺は8mm以上、短辺は15mm以上とするのが一般的である。長辺・短辺とも10mmは不適当。"],"2021-施工-20":["正しい。PF管の梁横断配管は、多数をまとめず、柱際から梁せい以内の範囲を避けるのが適当である。","誤り。蒸気給気管の勾配は、先上り管は1/80、先下り管は1/250が一般的である。記述の勾配は逆になっている。","正しい。鋼製ケーブルラックの水平支持間隔は2m以内とし、接続部や端部に近い箇所で支持する。","正しい。雨水排水横主管と汚水排水横主管の接続では、雨水側にトラップますを設けて臭気の逆流を防ぐ。"],"2021-施工-21":["誤り。銅板葺屋根に溶融亜鉛めっき鋼板製の樋を用いると、異種金属の電位差により電食を生じる。電位差の大きい組合せを避けるべきで不適当。","正しい。防火ダンパーと防火区画との間のダクトは、厚さ1.5mm以上の鋼板製とする。1.6mmは適当である。","正しい。折板葺のタイトフレームと受け梁の接合は、すみ肉溶接とするのが一般的である。","正しい。軽量鉄骨間仕切壁内のPF管は、バインド線などで支持し、支持間隔は1.5m以下とする。"],"2021-施工-22":["正しい。切断機器を固定するあと施工アンカーは、柱や梁への打込みを避け、垂れ壁や腰壁に打ち込むのが適当である。","正しい。あと施工アンカーの確認試験は引張試験機による引張試験とし、1日に施工された径・仕様ごとにロットを構成する。","正しい。増設耐震壁の鉄筋の既存柱への定着は、柱主筋に135度フックをかけて定着する方法がある。","誤り。金属系アンカーの締付け方式は、トルクレンチを用いて所定のトルクで締め付ける。ナット回転法で締め付けるとするのは不適当。"],"2021-施工-23":["正しい。既存保護コンクリートの撤去には、躯体を傷めないよう小型のハンドブレーカーを使用する。","正しい。ルーフドレン回りの防水層・保護層の撤去端部は、ポリマーセメントモルタルで1/2程度の勾配に仕上げる。","誤り。かぶせ工法の既存枠への小ねじ留めは、端部を100mm程度、中間部を300mm程度以内の間隔とするのが一般的。中間部500mmは間隔が大きく不適当。","正しい。特定天井に該当しない軽量鉄骨天井下地を新設する際の既存インサートは、引抜き試験で耐力を確認して再利用する。"],"2021-施工-24":["正しい。歩掛りは、部分工事量1単位当たりの標準労働量・標準資材量などをいう。","正しい。クリープ現象は、一定荷重の持続によって時間とともにひずみが増大する現象である。","誤り。スライディングフォーム工法は、型枠を上方へ連続して滑らせながらコンクリートを打ち込む工法である。構造物を水平移動させる工法は曳家(ひきや)で、説明が異なる。","正しい。リフトアップ工法は、地上で組み立てた大スパン屋根架構などをジャッキ等で所定位置へ持ち上げ設置する工法である。"],"2021-施工-25":["誤り。七会連合協定約款では、天災による重大な損害で、受注者が善良な管理者として注意をしたと認められるものは、発注者が負担する。両者が負担するとするのは不適当。","正しい。受注者は、出来形部分や搬入材料などに火災保険又は建設工事保険を付し、証券の写しを発注者に提出する。","正しい。発注者は、工期を変更する場合も、通常必要と認められる期間に比べて著しく短い期間としてはならない。","正しい。発注者が工事を著しく減少させ、請負代金額が2/3以上減少したときは、受注者は書面通知により契約を解除できる。"],"2020-施工-1":["誤り。設計図書に矛盾・誤謬・脱漏・不適切な納まり等を発見した場合は、工事施工者ではなく設計者に確認し、その内容を建築主に報告するのが標準業務の内容である。","正しい。施工者が提案・提出する工事材料、設備機器等及びその見本が設計図書に適合しているかを検討し、建築主に報告することは標準業務に含まれる。","正しい。施工計画について、工期や設計図書の品質が確保できないおそれがあるかを検討し、おそれがあると判断すれば建築主に報告することは標準業務に位置付けられている。","正しい。工事請負契約に定められた指示、検査、試験、立会い、確認、審査、承認、助言、協議等を行い、施工者から求められたときは速やかに応じるのが監理者の業務である。"],"2020-施工-2":["正しい。騒音規制法の特定建設作業に伴う騒音は、敷地境界線において85 dBを超えてはならないとされており、85 dB以下とする管理は適切である。","正しい。外壁のタイル割りは躯体寸法や開口寸法に影響するため、躯体図の作成に先立って行う。後から行うと寸法調整ができず不都合を生じる。","正しい。専任の監理技術者が研修等で短期間不在となる場合に、発注者の了解を得て必要な資格を有する代理の技術者を配置する対応は、実務上認められている。","誤り。満18歳未満の者は、足場の組立て・解体等の業務(地上又は床上の補助作業を除く)への就業が制限されている。1段目の作業でも満16歳の者を従事させるのは不適当である。"],"2020-施工-3":["正しい。既製コンクリート杭の荷降ろし・保管は、杭の両端から杭長の1/5付近の2点で支持し、衝撃を与えないよう行うのが一般的な方法である。","正しい。JIS適合の異形鉄筋では、SD295Aは圧延マークの表示がなく、SD345は突起の数1個(・)で表示されるため、目視で種類を確認できる。","誤り。押出成形セメント板は、平坦で乾燥した屋内に台木を配して保管するが、積置き高さは一般に1 m以下とされる。1.2 mとするのは不適当である。","正しい。塗料は使用直前に撹拌するが、皮ばり等が生じた場合はこしわけて取り除く対応が一般的である。※再分散しない沈殿物等が生じたものは使用不可とする見方もあり、一般論として述べる。"],"2020-施工-4":["正しい。5階以上の階の病院部分が1,500 m²を超える建築物で、避難施設工事中に使用する場合、建築主が特定行政庁へ安全上の措置に関する計画届を提出する。","正しい。伝搬障害防止区域内で高さ31 mを超える建築物等を建てる場合、着手前に高層建築物等予定工事届を総務大臣へ提出する。高さ35 mは該当する。","正しい。高さ31 mを超える建築物の建設工事は、事業者が工事開始日の14日前までに建設工事計画届を労働基準監督署長へ提出する。35 mはこれに該当する。","誤り。建築物除却届は、除却部分の床面積が10 m²を超える場合に、除却工事の施工者が都道府県知事へ提出する。届出先を特定行政庁とした点が誤りである。"],"2020-施工-5":["正しい。平板載荷試験では直径30 cmの載荷板を用い、載荷板の中心から一定範囲を水平に整地して行う。記述の整地範囲は一般的な基準を満たしている。","正しい。ベンチマークは工事中に移動のおそれのない位置に、相互に確認できるよう2箇所以上設け、高さと位置の基準とする。","誤り。枠組足場の墜落防止措置として、交差筋かいに加え高さ15 cm以上40 cm以下の幅木等を設ける必要がある。高さ10 cmの幅木では不足する。","正しい。工事部分と隣地との水平距離が近い場合は落下物による危害防止のため防護棚(朝顔)を設ける。1段目は地上5 m程度の位置とする記述は一般的な設置例である。"],"2020-施工-6":["正しい。ボイリング対策として、止水性のある山留め壁の根入れを難透水層まで延長し、地下水の回り込みや上昇流を遮断する方法は有効である。","正しい。盤ぶくれ対策として、掘削底面下の被圧帯水層にディープウェルを入れて水頭(被圧水位)を低下させる方法は有効である。","正しい。ロームなど撹拌不良となりやすい土層では、原位置土とセメント系懸濁液を入念に撹拌混合しないと品質のばらつきが生じるため、適切な対応である。","誤り。盤圧計は切張りの軸力を測るもので、設置位置は支点部や継手の影響を避けた適切な位置とする。腹起しから最も離れた中央に置けば正しく測れるとする記述は不適当である。"],"2020-施工-7":["誤り。安定液(水中)中に打ち込む場所打ち杭のコンクリートは、単位セメント量を330 kg/m³以上とする。310 kg/m³では不足している。","正しい。余盛り部分のはつり処理は、コンクリートが十分に硬化した後に行う。打込み後14日経過後とする計画は妥当である。","正しい。地下水に硫酸塩を含む場合、耐硫酸塩性に優れる高炉セメントを根固め液・杭周固定液に用いるのは適切である。","正しい。セメントミルク工法では、掘削後のオーガー引上げ時も掘削時と同じ正回転とし、孔壁の崩壊や吸引による孔内の乱れを防ぐ。"],"2020-施工-8":["正しい。圧接面のずれは鉄筋径の1/4以下とされ、径25 mmでは6.25 mm以下である。6 mmは基準を満たす。","正しい。圧接部の膨らみの直径は鉄筋径の1.4倍以上とされ、径25 mmでは35 mm以上である。35 mmは基準を満たす。","誤り。圧接部の膨らみの長さは鉄筋径の1.1倍以上とされ、径25 mmでは27.5 mm以上必要である。27 mmは基準を満たさない。","正しい。鉄筋中心軸の偏心量は鉄筋径の1/5以下とされ、径25 mmでは5 mm以下である。4 mmは基準を満たす。"],"2020-施工-9":["正しい。打込み速さ10 m/h以下、打込み高さ1.5 m以下の場合、側圧は柱と壁で同じ値として計算してよい。","正しい。パイプサポートを支柱とする支保工は、高さ3.5 m超の場合に高さ2 m以内ごとに水平つなぎを二方向に設け、変位を防止する措置が必要である。","誤り。浮かし型枠を外部足場に固定すると、打込み時の荷重や振動が足場に伝わり危険で、足場の変形で型枠もずれる。型枠は足場から縁を切って固定すべきである。","正しい。高炉セメントB種は普通ポルトランドセメントより強度発現が遅いため、せき板の最小存置期間を長く設定する。"],"2020-施工-10":["誤り。表の数値が不明なため一般論で述べる。受入検査は、1回の試験結果が調合管理強度の85%以上、かつ3回の平均値が調合管理強度以上であることを基準とする。この判定の組合せは正答と一致しない。","正しい。表の数値は不明だが、1回の試験が調合管理強度の85%以上かつ3回平均が調合管理強度以上という基準で判定すると、AとBが合格、Cが不合格となる組合せが正答である。","誤り。表の数値は不明だが、調合管理強度の85%以上かつ3回平均が調合管理強度以上という基準に照らすと、この判定の組合せは正答と一致しない。","誤り。表の数値は不明だが、全てを合格とすると、Cが基準(1回の試験結果が調合管理強度の85%以上かつ3回平均が調合管理強度以上)を満たさない点と矛盾する。"],"2020-施工-11":["誤り。高炉セメントB種は初期の強度発現が遅く、予想平均気温が8～10℃の場合は構造体強度補正値を3 N/mm²では足りず、より大きな値(6 N/mm²程度)とする必要がある。","正しい。高強度コンクリートの自己収縮は単位セメント量が多いほど大きい。単位水量を小さくしたうえで単位セメント量をできるだけ小さくするのは自己収縮抑制に有効である。","正しい。マスコンクリートでは、断熱養生マットで表面を覆い内部との温度差を小さくすることで、表面ひび割れの低減を図れる。","正しい。柱や壁のコンクリートは、分離しない範囲であれば自由落下による打込みも認められる。"],"2020-施工-12":["正しい。プレキャスト部材の脱型時強度は、部材と同一養生を行った供試体の圧縮強度試験により確認する。","正しい。特記がない場合のプレキャスト梁部材の長さの許容差は±10 mmとして寸法精度を管理するのが一般的である。","誤り。エンクローズ溶接は、溶接による収縮やひずみの影響を考慮し、建築物の外周部から中央部へではなく、中央部から外周部へ順次行うのが適切である。","正しい。液状シールの塗布幅は、目地幅の端部から両端とも60 mm以上とするのが標準的である。"],"2020-施工-13":["正しい。打撃曲げ試験が不合格のロットでも、さらに2本試験して2本とも合格すれば、そのロットは合格とされる。","正しい。特記がない場合の鉄筋貫通孔の孔径は、異形鉄筋D25で最大38 mm程度とされており、記述は一般的な基準に合致している。","誤り。トルシア形高力ボルトはピンテールの破断で締付けを確認する。ナット回転量が過小な場合に単に追締めして済ませるとする扱いは不適当で、不適合ボルトの処置は規定に従う必要がある。","正しい。ロックウール吹付けの耐火被覆では、厚さ確認ピンを差し込み吹付け厚さを確認する。この方法による確認は一般的である。"],"2020-施工-14":["正しい。完全溶込み溶接部の超音波探傷検査は、特記がない場合、抜取検査により実施する。","誤り。特記がない場合の柱の各節の倒れの管理許容差は、節の高さの1/1000以下かつ10 mm以下である。1/700以下かつ20 mm以下は緩すぎる。","正しい。溶接継手におけるエレクションピースの仮ボルトには高力ボルトを使用し、全数締め付ける。","正しい。気温が－5℃～5℃では、溶接線の両側約100 mmの範囲の母材を加熱して溶接する。気温－2℃での加熱は適切である。"],"2020-施工-15":["正しい。鉄筋コンクリート造の内部の間仕切軸組に用いる木材は、特記がなければ杉などの一般的な樹種で差し支えない。","正しい。造作材の含水率は、特記がない場合15％以下とするのが一般的で、搬入時に高周波水分計で確認する。","正しい。筋かいが間柱と取り合う部分は、筋かいを欠き取らず、間柱を筋かいの厚さだけ欠き取って通す。","誤り。アンカーボルトは、耐力壁両端の柱下部付近と土台継手の上木端部付近などに設置する。土台継手の下木の端部付近とする記述は不適当である。"],"2020-施工-16":["正しい。屋内防水密着工法では、打継ぎ部に幅50 mm程度の絶縁用テープを張り、幅300 mm程度のストレッチルーフィングで増張りする。","誤り。加硫ゴム系シートの接合幅は部位や接合方法ごとに定められており、平場部と立上り面を一律100 mmとする確認は仕様に合致せず不適当である。","正しい。ステンレスシート防水の部分吊子の固定間隔は、一般部600 mm、端部450 mm、隅角部300 mm程度とされる。","正しい。ノンワーキングジョイントの収縮目地は、動きがほとんどないため三面接着とする。"],"2020-施工-17":["正しい。ポリマーセメントモルタルによる下塗りの1回の塗厚は7 mm程度以下とし、過厚による剥離等を防ぐ。","誤り。密着張りでは、張付けモルタルの1回の塗付け面積は2 m²/人以下とし、かつ20分以内に張り終える面積とする。60分以内は誤りである。","正しい。有機系接着剤によるタイル張りでは、施工前に下地面を清掃し、十分に乾燥させる。","正しい。外壁乾式工法の石工事では、目地幅調整用のスペーサーを撤去してからシーリング材を充填する。"],"2020-施工-18":["正しい。グレイジングチャンネル構法では、ガラスの重量をチャンネルで支持するため、セッティングブロックを使用しなくてよい。","誤り。軽量鉄骨天井下地の吊りボルト間隔は900 mm程度でよいが、周辺部は端から150 mm以内に配置する。200 mmの位置では不適当である。","正しい。壁下地のスペーサーは、スタッドの両端及び振れ止めの位置を押さえ、600 mm程度の間隔で取り付ける。","正しい。鋼製手摺の支柱は、コンクリートやモルタルに埋まる部分も含めて錆止めの処置を行う。"],"2020-施工-19":["正しい。ビニル床シートの熱溶接工法は、接着剤が硬化した状態を見計らって溝切り・溶接を行うのが一般的である。","正しい。縦壁ロッキング構法で外壁と連続するパラペットは、ALCパネル厚さの6倍以下のはね出しとする。","誤り。吹付け硬質ウレタンフォームの吹付け厚さの許容誤差は、一般に＋10 mm、－0 mmとされる。±10 mmは不適当である。","正しい。PCカーテンウォールの取付け位置における目地幅の許容差は、特記がなければ±5 mmとするのが一般的である。"],"2020-施工-20":["正しい。雑用水管の誤接続防止のため、衛生器具取付け後に系統ごとに着色水による通水試験を行い、確認する。","誤り。エレベーターの地震感知器は、P波感知器を昇降路底部、S波感知器を機械室に設置するのが一般的である。記述は設置位置が逆で不適当である。","正しい。電池内蔵形の非常用照明の照度測定は、外光の影響を受けない状況で、内蔵電池へ切り替えた後に行う。","正しい。接地極の埋設は埋戻し前、接地線の構造体への接続はコンクリート打設前に、隠蔽されるため立会い確認を行う。"],"2020-施工-21":["正しい。スリーブ径は、保温材の厚さを含めた管の外径に余裕をとって決める。外径より40 mm程度大きい径とするのは一般的である。","正しい。コンクリートに埋設する合成樹脂製可とう電線管には、PF管やCD管が用いられる。","正しい。高圧ケーブルと低圧ケーブルを同一ピット内に配線する場合でも、耐火性のある堅牢な隔壁を設ければ離隔距離の確保は不要である。","誤り。呼び径80の一般配管用ステンレス鋼鋼管の横走り配管の支持間隔は、一般に2 m以内とされる。3.0 mは大きすぎて不適当である。"],"2020-施工-22":["誤り。鋼板巻き工法で角形とする場合、コーナー部の曲げ加工の内法半径は鋼板の板厚の3倍以上とされる。2.5倍は不足している。","正しい。既存の柱や梁への目荒しは、電動ピック等で深さ2～5 mm程度、打継ぎ面の20％程度の面積を全体にわたって付けるのが一般的である。","正しい。圧入工法では、型枠上部のオーバーフロー管の流出先を既存梁下端より高くして、充填を確実にする。","正しい。壁筋の継手は、無理に台直しせず、規定の隙間以内とする「あき重ね継手」とすることが認められている。"],"2020-施工-23":["正しい。既存アスファルト防水層の継目等の剥離・浮き部は、切開してバーナーで熱し、溶融アスファルトを充填して張り合わせる補修が一般的である。","正しい。防水層撤去後の下地コンクリートの欠損部は、ポリマーセメントモルタルで平滑に補修する。","正しい。アンカーピンニング部分エポキシ樹脂注入工法では、タイル目地部分から構造体コンクリート中に30 mm程度まで穿孔するのが一般的である。","誤り。ひび割れ幅が0.2 mm～1.0 mmの範囲では、エポキシ樹脂注入工法を採用する。シール工法は、0.2 mm未満の微細なひび割れに用いる工法である。"],"2020-施工-24":["誤り。CLTは、ひき板を繊維方向が直交するように積層接着した木質材料である。記述の繊維方向を平行にして単板を積層接着した材料は、LVL(単板積層材)の説明である。","正しい。粉体塗装は溶剤を含まない粉体塗料を用いる塗装方法で、VOCの低減が図れ、アルミニウム建材等に用いられる。","正しい。ミルシートは製鋼所が発行する鋼材の試験成績書で、化学成分や機械的性質を記載し、規格適合を保証する規格品証明書である。","正しい。溶接ゲージは、隅肉溶接ののど厚や脚長、ビード幅、アンダーカット深さ等を測定する器具である。"],"2020-施工-25":["誤り。約款上、請負代金内訳書及び工程表は受注者が提出するが、工程表について監理者の承認を受けるとする記述は約款の定めと異なる。一般論として述べる。","正しい。現場代理人は、工事現場における施工の技術上の管理をつかさどる監理技術者等と兼務することができる。","正しい。受託者が委託者の承諾を得て業務の一部を他の建築士事務所に委託した場合も、その受託者の行為全てについて責任を負う。","正しい。監理業務を原設計者と異なる建築士に委託した場合、設計成果物の変更が必要となったときは、原則として設計変更業務を原設計者に別途委託する。"],"2019-施工-1":["正しい。工種別施工計画書は個別工事の条件や特徴を踏まえて作成されるもので、監理者は施工者から提出を受けて内容を確認する。","正しい。品質計画は材料・仕上げ・性能・精度などの目標と品質管理体制を示すもので、当該工事に相応して妥当であれば監理者は承認する。","正しい。総合施工計画書は総合仮設を含む工事全般の進め方、主要工事の施工方法、品質目標と管理方針の大要を定めたもので、監理者は提出を受ける。","誤り。契約条件の変更等で実施工程表を変更する場合、変更部分の工事に着手する前に、監理者が変更された実施工程表を承認する必要がある。「並行して」は不適当。"],"2019-施工-2":["正しい。高さ5m以上のコンクリート造の工作物の解体等作業には、コンクリート造の工作物の解体等作業主任者の選任が必要である。","正しい。石綿を重量比0.1％を超えて含有する建材の除去作業では、石綿作業主任者を選任する。","誤り。山留め支保工の切ばりや腹起しの取付け・取外しの作業では、地山の掘削作業主任者ではなく「山留め支保工作業主任者」を選任する。","正しい。高さ5m以上の構造の足場の組立て・解体・変更作業では、足場の組立て等作業主任者を選任する。"],"2019-施工-3":["正しい。立会い検査に合格した材料と同種のものは、以後は証明書類による確認とし、状況に応じて抽出による立会い検査とすることができる。","正しい。JIS・JASのマーク表示がある指定材料は、品質・性能の証明書類等の確認を省略できるのが一般的である。","正しい。鉄筋は有害な曲がりや損傷のあるものを使用せず、設計図書に従い常温で加工・組立てを行う。","誤り。セメントミルク工法の支持地盤確認は、アースオーガーの掘削深さや電流値等により全ての本杭について行うのが原則で、過半の杭のみでは不適当である。"],"2019-施工-4":["誤り。特定粉じん排出等作業実施届出書の届出先は、労働基準監督署長ではなく都道府県知事（政令市等では市長）である。届出者は特定工事の発注者等で、作業開始の14日前までに行う。","正しい。共同企業体代表者届は、労働安全衛生法に基づき事業者が工事開始の14日前までに都道府県労働局長へ届け出る。","正しい。建築工事届は、建築主が建築確認申請時等に都道府県知事へ提出する。","正しい。建築士法上、工事監理終了後に建築士は直ちに工事監理報告書を建築主へ提出する。"],"2019-施工-5":["正しい。地層構成が想定できない場合のボーリング調査深さは、地震応答解析が不要な直接基礎では建築物の幅の1.5〜2倍程度が目安である。","正しい。PS検層はボーリング孔を利用してP波・S波の速度を測り、その値から地盤の硬軟や剛性を判定する。","正しい。孔内水位は掘進直後では乱れているため、なるべく長時間放置して水位が安定してから測定する。","誤り。N値から内部摩擦角や相対密度を推定できるのは砂質土であり、粘性土では一軸圧縮強さ（粘着力）等を推定する。粘性土で内部摩擦角・相対密度を推定するのは不適当。"],"2019-施工-6":["正しい。ソイルセメント壁の心材に新品材を用いる場合は、仮設構造物として短期許容応力度を採用できる。","正しい。総掘りの根切り底では、土質試料等を参考に地盤の状態を目視確認し、レベルチェックは一定間隔ごとに行う。","誤り。透水性の悪い山砂の埋戻しでは、まき出し厚さは30cm程度以下とするのが一般的で、50cmごとでは締固めが不十分となる。","正しい。ディープウェルの運転停止は、構造体の浮上りがないことや地下外壁が自然地下水位より高く構築されていること等を確認して行う。"],"2019-施工-7":["正しい。サンドコンパクションパイル工法は砂杭を締め固めて形成し、液状化のおそれのある地盤の改良に有効である。","正しい。場所打ち杭の鉄筋籠の補強リングは、主筋に断面欠損を生じないよう注意して堅固に溶接する。","誤り。セメントミルク工法では、建込み後の杭を保持治具で杭心に合わせて保持し、根固め液等が所定の強度を発現するまで適切に保持・養生する。「3日間」とする記述は標準的な仕様と異なり不適当である。","正しい。PC杭の杭頭処理でダイヤモンドカッター方式の場合、補強範囲は切断面から350mm程度とするのが一般的である。"],"2019-施工-8":["正しい。図が確認できないため文章から述べると、ガス圧接継手は柱・大梁主筋とも応力が小さい位置に設け、隣り合う継手は400mm程度以上ずらすのが一般的である。","正しい。この位置（範囲）は、ガス圧接継手の一般的な設け方に適合しているとして扱われる。","誤り。当該位置（範囲）は、柱主筋・大梁主筋のガス圧接継手位置として一般的な範囲に適合せず、不適当である。（図中の位置は文章から確認できないため一般論による）","正しい。この位置（範囲）は、ガス圧接継手の一般的な位置として適当である。"],"2019-施工-9":["正しい。支柱に鋼管枠を使用する型枠支保工の水平荷重は、設計荷重の2.5/100に相当する値を支保工上端に作用させる。","誤り。コンクリート型枠用合板の表面加工品を打放し仕上げのせき板に使う場合、特記がなければ厚さは12mmを標準とする。9mmは薄く不適当。","正しい。計画供用期間の級が標準で湿潤養生をしない場合、圧縮強度10N/mm2以上に達するまでせき板を存置する。","正しい。片持ちスラブを除くスラブ下の支保工は、圧縮強度12N/mm2以上かつ構造計算で安全を確認すれば取り外せる。"],"2019-施工-10":["正しい。単位水量は、品質変化が見られた場合などに、レディーミクストコンクリート工場の製造管理記録で確認できる。","正しい。梁の鉛直打継ぎ部は、スパンの中央付近または端から1/4付近に設けるのが原則である。","正しい。受入れ検査と併用しない構造体強度検査は、適切な間隔をあけた3台の運搬車から各1個、計3個採取する。","誤り。打重ね時間の限度は、外気温25℃未満で150分、25℃以上で120分が目安である。25℃を超える場合に150分とするのは不適当。"],"2019-施工-11":["正しい。スランプ18cmの許容差は±2.5cmで、15.5〜20.5cmの範囲であれば合格である（図の数値は確認できないため一般論）。","誤り。普通コンクリートの空気量は4.5％±1.5％（3.0〜6.0％）が合否の基準であり、この範囲を外れる試験結果を合格と判断するのは不適当。（図は確認できないため一般論）","正しい。寒中コンクリートに該当しない場合、荷卸し時のコンクリート温度は一般に35℃以下であれば合格と判断できる。","正しい。塩化物含有量は塩化物イオン量として0.30kg/m3以下であれば合格である。"],"2019-施工-12":["正しい。プレキャスト部材の組立精度は、特記がなければ仮固定完了後、次の部材を組み立てる前に全数について±5mmを基準に検査する。","誤り。バルコニー付き床部材の平置きでは、ひび割れや変形を防ぐため、台木は組立て後に部材が支持される位置にできるだけ近い位置に置く。離すのは不適当。","正しい。外壁プレキャスト部材の幅0.10mm以下のひび割れは、性能上支障がなければ要領書に従い補修して合格とできる。","正しい。脱型時に表面温度が高い部材は、急激な乾燥・温度変化を避けるため、外気温程度になるまで養生する。"],"2019-施工-13":["正しい。固着したミルスケールで溶接に支障がないものは、除去しなくてもよい。","正しい。梁ウェブを高力ボルト、フランジを溶接とする混用継手では、割れ等のおそれがなければ高力ボルトを先に締め付けてから溶接する。","正しい。溶融亜鉛めっき高力ボルト接合の摩擦面は、すべり係数0.40以上を確保するためりん酸塩処理等を行う。","誤り。鉄骨精度検査基準では、柱の長さの管理許容差は±3mmとされる。±5mmとするのは不適当。"],"2019-施工-14":["正しい。ショットブラスト等で表面粗度50μmRz以上を確保できれば、赤錆を発生させなくてもよい。","誤り。組立溶接の最小溶接長さは、板厚6mm超では40mm、6mm以下では30mmが基準である。板厚6mm超で30mmとするのは不適当。","正しい。レーザ孔あけの孔径精度は±0.5mmとされる。","正しい。トルシア形高力ボルトの標準長さは締付け長さに加算する長さで決まり、M22では35mmを加える。"],"2019-施工-15":["正しい。ねこ土台を用いる場合、外周部の土台全周に1m当たり有効面積75cm2以上の換気孔を設ける。","正しい。木れんがは、耐久性のある樹種を使い、専用の接着剤でコンクリート面に取り付けるのが一般的である。","誤り。30mm×90mmの片筋かいの壁倍率は1.0であり、2.0とするには45mm×90mm以上の片筋かい等が必要である。壁倍率2.0に適合とするのは不適当。","正しい。RC造の床組の土台取付けでは、位置や埋込み深さが不正確になりにくいよう、あと施工アンカーを適切に用いることがある。"],"2019-施工-16":["正しい。合成高分子系シート防水の下地は、入隅は直角、出隅は面取りとするのが一般的である。","誤り。アスファルトプライマー塗布後は、十分に乾燥させてから一層目のルーフィングを張り付ける必要があり、乾燥時間が「30〜60分」程度との記述は不適当。（乾燥時間の詳細は一般論）","正しい。バルコニーのウレタンゴム系塗膜防水では、軽歩行用仕上塗料による仕上げが一般的である。","正しい。屋上緑化では、植物の根が防水層に直接触れないよう、防水層直上部に耐根層を設ける。"],"2019-施工-17":["誤り。外壁乾式工法の石材間目地にシーリング材を充填する場合、特記がなければ目地幅は8mm以上、かつ適切な深さが必要で、幅・深さとも5mm以上では小さく不適当。（数値は一般論）","正しい。広い石張り床には、特記がなければ30m2程度ごとおよび他仕上材との取合い箇所に伸縮調整目地を設ける。","正しい。密着張りの化粧目地深さは、剥離防止のためタイル厚の1/2以下とする。","正しい。タイル張りの下地モルタル塗りでは、タイルの伸縮調整目地に合わせて10mm以上の目地を発泡合成樹脂板で設ける。"],"2019-施工-18":["正しい。振れ止めを切断せざるを得ない場合は、同材または吊りボルトで補強する。","誤り。天井面の段違い部の斜め補強は、1.8m程度の間隔で行うのが標準であり、3.6m程度では不適当。","正しい。鋼製手摺の伸縮調整部は、温度差による伸縮を考慮し5〜10mごとに設ける。","正しい。建具下枠のガラス溝には、雨水排水のため直径6mm以上の水抜き孔を設ける。"],"2019-施工-19":["誤り。コンクリート下地の塗装では、素地調整前に十分乾燥させる必要があり、一般に夏期21日以上、冬期28日以上の乾燥期間を確保する。冬期に材齢14日は不足で不適当。","正しい。せっこう系直張り用接着材による直張りは、室温が5℃以下になる場合は採暖等で10℃以上に保つ。","正しい。押出成形セメント板の横張り工法では、パネル3枚以下ごとに自重受け金物で受ける。","正しい。タイル後張りの引張接着強度検査は、0.4N/mm2以上かつコンクリート下地の接着界面での破壊率50％以下を合格とする。"],"2019-施工-20":["正しい。エレベーター昇降路内の配管設備は、地震時に籠や釣合おもりに触れるおそれのないものとする。","正しい。非常用照明装置の電気配線は他の回路と接続せず、一般の者が容易に遮断できる開閉器を設けない。","誤り。給水管と排水管を平行して埋設する場合、水平実間隔は500mm以上とし、給水管を上方に埋設する。300mm程度では不適当。","正しい。自然換気設備の給気口は、居室の天井高さの1/2以下の高さに設け、常時外気に開放された構造とする。"],"2019-施工-21":["正しい。コンストラクションキーシステムは、シリンダーを交換せず工事用鍵から本設用鍵に切り替え、工事用鍵を回収する。","正しい。屋上緑化のルーフドレンは、目詰まりを考慮して余裕のある口径とし、1排水面積に2箇所以上設ける。","誤り。軽量鉄骨天井下地の野縁や野縁受を切断する場合は、溶断では亜鉛めっきの損傷や熱変形を招くため、機械切断とし、補強を行う。溶断を承認するのは不適当。","正しい。タイルカーペットをフリーアクセスフロアに敷設する場合、床パネルの段違いや隙間は0.5mm以下に調整する。"],"2019-施工-22":["誤り。壁厚が薄い複配筋の既存開口壁の閉塞では、あと施工アンカーの埋込み長さを特記なしに10daとするのは不適当で、壁厚や配筋状況に応じた埋込み長さを確保する必要がある。（具体的数値は確信が持てず一般論）","正しい。グラウト材と既存躯体の間に生じた隙間には、エポキシ系樹脂を圧入して充填する。","正しい。鋼板巻き工法で分割鋼板を現場で一体化する場合は、突合せ溶接とする。","正しい。溶接金網巻き工法の重ね継手長さは、縦筋間隔の2倍（200mm）が確保されていればよい。"],"2019-施工-23":["誤り。アスファルト防水の改修で既存防水層を非撤去とする場合でも、立上り部およびルーフドレン回りの既存防水層は撤去するのが原則である。非撤去とするのは不適当。","正しい。ウレタンゴム系塗膜防水の既存膨れ部分は、カッターナイフで切除してポリマーセメントモルタルで平坦に補修する。","正しい。高圧水洗工法による既存塗膜の除去範囲は、特記がなければ既存仕上げ面全体とする。","正しい。鉄筋が露出していない浅い欠損部は、ポリマーセメントモルタル充填工法で補修できる。"],"2019-施工-24":["正しい。腹起しは、山留め壁に作用する側圧を切ばりまたは地盤アンカーに伝える水平部材である。","正しい。スランプフロー（スランプコーン引上げ後の試料の広がり直径）は、フレッシュコンクリートの流動性を示す指標である。","正しい。エンドタブは、溶接ビードの始端・終端の欠陥を母材外に出すための補助板である。","誤り。タッピングマシンは、靴音等の軽くて硬い衝撃（軽量床衝撃音）を調べる発生器である。子供の飛び跳ねのような重く柔らかい衝撃（重量衝撃音）にはバングマシン等を用いる。"],"2019-施工-25":["誤り。工事中に目的物の一部を発注者が使用する場合の法令上の手続きは、発注者が行い、その費用も発注者が負担するのが一般的で、受注者に費用を負担させる記述は不適当。（約款の詳細は一般論）","正しい。発注者は監理者の意見に基づき、著しく不適当な者について理由を明示した書面で必要な措置を求めることができる。","正しい。受託者は、契約に定めがある場合や委託者の請求があるときは、監理業務の進捗状況を説明・報告する。","正しい。履行期間や業務委託書の内容が変更された場合、委託者は必要に応じて監理業務方針の再説明を請求できる。"],"2018-施工-1":["誤り。工事監理方法の変更が必要になった場合は、監理者が建築主にその内容を説明し、了解を得て行う。工事施工者の承認を受けるだけで変更できるものではなく、監理方針の説明先は建築主である。","正しい。施工者からの質疑は、設計図書に定められた品質確保の観点から技術的に検討し、必要に応じて建築主を通じて設計者に確認したうえで、回答を施工者に通知するのが一般的な監理業務である。","正しい。施工が設計図書に適合しないおそれがあり、破壊検査が必要と認められる相当の理由がある場合は、請負契約の定めにより、理由を施工者に通知のうえ必要な範囲で破壊して検査できる。","正しい。工事費の最終支払いの請求については、監理者が工事請負契約に適合しているかを技術的に審査し、その結果を建築主に報告する。支払いの判断自体は建築主が行う。"],"2018-施工-2":["誤り。現場代理人には、請負代金額の変更や請負代金の請求・受領に関する権限は、通常は与えられていない。これらは契約上の重要事項であり、受注者本人（代表者等）の権限とされるのが一般的である。","正しい。発注者から直接請け負った特定建設業者が、下請契約の総額が6,000万円（令和以前の建築一式工事の基準）以上となる場合は、監理技術者を置かなければならない。","正しい。解体工事の事前調査で見つかったPCB含有の蛍光灯安定器は、建築物の所有者の責任で保管・処分するため、所有者に引き渡す取扱いとなっている。","正しい。建設リサイクル法の特定建設資材は、コンクリート、コンクリート及び鉄から成る建設資材、木材、アスファルト・コンクリートの4種類である。"],"2018-施工-3":["誤り。板厚60mmの400N級・490N級炭素鋼の鉄骨溶接構造では、Mグレードでは適用範囲を超える。板厚の大きい部材には、より上位のHグレード以上の認定工場を選定する必要がある。","正しい。鉄筋表面の浮いていない赤錆程度であれば、コンクリートとの付着を阻害しないため、除去しなくてよい。浮き錆や油などは除去する。","正しい。アスファルトルーフィングは、雨露や湿気を避けて屋内の乾燥した場所に、たてて積み（縦置き）にして保管する。寝かせて積むと自重で変形・固着するためである。","正しい。吹付けロックウールの厚さ確認に用いる確認ピンは、施工後もそのまま存置してよい。吹付け厚さの確認と、後の維持管理時の確認にも役立つ。"],"2018-施工-4":["誤り。クレーン設置届は、設置工事の開始の30日前までに労働基準監督署長へ提出する。10日前までとする記述は誤りで、事業者が届け出る点のみが正しい。","正しい。建設リサイクル法の対象建設工事の届出は、発注者又は自主施工者が、工事着手の7日前までに都道府県知事に行う。","誤り。騒音規制法の特定建設作業実施届出書は、作業開始の7日前までに市町村長へ提出する。届出先は労働基準監督署長ではなく、また届出者は元請・下請を問わず施工者である。","誤り。消防用設備等設置届出書は、工事完了から4日以内に消防長又は消防署長へ届け出る。10日以内とする記述は誤りである。"],"2018-施工-5":["誤り。切ばり上の作業用通路の手摺は、高さ85cm以上とし、中桟は35cm以上の高さに設ける必要がある。高さ75cm、中桟30cmでは労働安全衛生規則の基準を満たさない。","正しい。建築物内部に工事用機械を仮設置する場合は、構造的な補強方法や搬出後の復旧方法を含む仮設工事計画書を作成させて、安全性を確認する。","正しい。単管足場の壁つなぎは、垂直方向5m以下、水平方向5.5m以下の間隔で設け、地上第一の壁つなぎは地上から5m以下に設ける。記述の数値はいずれも基準内である。","正しい。特定建設作業に伴う振動の規制基準は、特定建設作業の場所の敷地境界線で測定した値で管理する。"],"2018-施工-6":["正しい。山留めの検討では、掘削土の仮置きや大型重機の据付けがない範囲でも、作業荷重や資材仮置きによる上載荷重として、一般に10kN/m²程度を見込む。","正しい。地盤アンカーでは、全数について確認試験を行い、引抜き耐力が設計アンカー力の1.1倍以上であることを確認する。","誤り。盤ぶくれ対策として止水性の山留め壁を延ばす場合は、被圧水を含む砂礫層ではなく、その下の不透水層まで根入れして遮水する。被圧滞水層に入れても盤ぶくれは防げない。","正しい。粘性土地盤で山留め壁を引き抜く際は、地盤沈下を防ぐため、抜いた跡に直ちに砂などを充填し、必要に応じて注入を行う。"],"2018-施工-7":["正しい。場所打ち杭で特記がない場合、各種管理基準値を定めるための試験杭は、最初に施工する本杭（1本目）と兼ねてよい。","誤り。セメントミルク工法での支持層の確認は、掘削機の電流計の値の変化や排出土の観察、土質資料との比較により行う。電流値から換算したN値で確認するという方法は適当でない。","正しい。アースドリル工法での支持層確認は、ケリーバーの振れや回転抵抗などを参考にしつつ、バケット内の土砂を土質柱状図や土質資料と比較して行う。","正しい。根固め液はグラウトプラントで混練した液、杭周固定液は杭挿入後に孔口からオーバーフローした液を採取して、管理用供試体を作製する。"],"2018-施工-8":["正しい。スラブ配筋のスペーサーは、特記がなければ上端筋・下端筋ともに1m²当たり1.3個程度を配置するのが標準である。","正しい。特記がない場合の重ね継手長さは、コンクリート強度や鉄筋種類により定まる標準値が用いられ、設問の条件では記述の長さが適用される。","正しい。機械式継手では、隣り合う継手をずらし、カップラー中心間で400mm以上、かつカップラー端部間のあきを40mm以上確保する。","誤り。ガス圧接継手の鉄筋中心軸の偏心量は、鉄筋径の1/5以下とする。D22では約4.4mm以下となり、合格基準値を5mmとするのは大き過ぎる。"],"2018-施工-9":["正しい。打放し仕上げ以外のせき板に使用するコンクリート型枠用合板は、特記がなければ、板面の品質がB-Cのものを用いる。","正しい。型枠の構造計算では、施工時の水平荷重は鉛直荷重に対する割合などで定め、地震力は考慮しない扱いが一般的である。","誤り。外壁の地中部分など水密を要する部分の貫通孔スリーブには、止水のため、一般に硬質ポリ塩化ビニル管ではなく、つば付きの鋼管などが用いられる。","正しい。防水下地となる面のコーン穴は、水量の少ない硬練りモルタルを充填し、コンクリート面と同一になるよう処理する。"],"2018-施工-10":["正しい。設計基準強度36N/mm²の普通ポルトランドセメントのコンクリートで、材齢28日までの予想平均気温が0℃以上8℃未満の場合、構造体強度補正値は6N/mm²となる。","正しい。構造体コンクリートの圧縮強度試験は、打込み日ごと、打込み工区ごと、かつ150m³又はその端数ごとに1回行う。","正しい。スランプ21cmの高性能AE減水剤使用コンクリートの許容差は±2cmであり、19.0cmは許容範囲（19〜23cm）内なので合格である。","誤り。構造体コンクリート強度の検査は、材齢28日の標準養生供試体の圧縮強度が、設計基準強度ではなく調合管理強度（所定の判定基準）以上であることで合否を判定する。"],"2018-施工-11":["正しい。暑中コンクリートの適用期間に特記がない場合、打込み予定日の日平均気温の平年値が25℃を超える期間に適用し、施工計画書の提出を求める。","誤り。柱・梁・スラブ・壁に使用する粗骨材の最大寸法は、特記がなければ砕石で20mmとするのが標準である。25mmは主に基礎などで用いられるもので、一般部位には適当でない。","正しい。打継ぎ面のレイタンスは、高圧水洗やワイヤーブラシ掛けで除去し、健全なコンクリート面を露出させてから打ち継ぐ。","正しい。透水性の小さいせき板で保護されている部分は、湿潤養生されているものとみなして、湿潤養生を省略できる。"],"2018-施工-12":["正しい。計画供用期間の級が標準のとき、屋外側の設計かぶり厚さは、柱・梁・耐力壁で45mm、床スラブ・屋根スラブで35mmが標準である。","正しい。工場の製品検査に合格した部材でも、運搬中のひび割れ、破損、変形、先付金物の状態などを現場受入れ時に確認する。","正しい。現場打ち部分に接合する部分のプレキャスト部材の位置の許容差は、特記がなければ現場打ち部分の許容差と同じ値とする。","誤り。プレキャスト部材の組立精度の判定基準は、垂直部材と水平部材とで同じ±10mmではなく、部材の種類や項目ごとに別途定められている。一律に±10mmとする記述は不適当である。"],"2018-施工-13":["正しい。高力ボルト接合の摩擦面は、すべり係数0.45以上を確保するため、ミルスケールを除去して一様に赤錆を発生させる。","正しい。ボルト頭部又はナットと接合部材の面が1/20以上傾斜している場合は、勾配座金を使用する。","正しい。引張強さ490N/mm²以上の高張力鋼や板厚25mm以上の鋼材の組立溶接を手溶接で行う場合は、低水素系溶接棒を使用する。","誤り。スタッド溶接の仕上り精度は、仕上り高さを指定寸法の±2mm、傾きを5度以内として管理する。±5mm、15度以内は許容範囲が大き過ぎる。"],"2018-施工-14":["正しい。保有水平耐力計算を行わない鉄骨造の露出柱脚では、ベースプレートの厚さをアンカーボルト径の1.3倍以上とする。","正しい。アンカーボルトは、二重ナット締めを行ってもねじ山が3山以上突出する高さで設置する。","誤り。完全溶込み溶接部の内部欠陥の検査は、超音波探傷試験で行う。浸透探傷試験は表面欠陥の検出に用いるもので、内部欠陥の検査には適さない。","正しい。溶融亜鉛めっき高力ボルトのナット回転法では、回転量が不足するものは所定の回転量まで追締めを行う。"],"2018-施工-15":["誤り。造作材に使用する「Nくぎ」の代用品として「FNくぎ」を用いることは適当でない。両者は用途・規格が異なるため、特記がなければ指定のくぎを使用する。","正しい。木材の含水率は、1本の製材の異なる2面について、両小口から300mm以上離れた2箇所と中央部1箇所の計6箇所で測定する。","正しい。山形プレートを用いる箇所は、プレート部分の構造用合板を切り欠き、その近傍の釘打ちを増し打ちして耐力を補う。","正しい。基礎と土台を緊結するアンカーボルトの埋込み位置の許容誤差は、±5mmとする。"],"2018-施工-16":["正しい。アスファルト防水のコンクリート下地の乾燥状態は、高周波水分計による測定と、打込み後の経過日数を併せて判断する。","誤り。保護コンクリートの伸縮調整目地は、立上り部の仕上り面から600mm程度離し、中間部の縦横間隔は3m程度とする。中間部を5m程度とする記述は大き過ぎる。","正しい。外部に面するシーリング材の施工前の接着性試験は、特記がなければ簡易接着性試験とする。","正しい。2成分形シーリング材は、1組の作業班が1日に行った施工箇所を1ロットとし、ロットごとにサンプルを作製して硬化状態を確認する。"],"2018-施工-17":["正しい。塗装合板型枠のコンクリート壁にモルタルを塗る場合は、高圧水洗で下地を処理し、ポリマーセメントペーストを塗布して乾燥しないうちに下塗りを行うと付着性が得られる。","正しい。ビニル床シート下地のコンクリート直均し仕上げの平坦さは、特記がなければ3mにつき7mm以下を標準とする。","正しい。内壁空積工法の「あと施工アンカー・横筋流し工法」では、おねじ形の締込み式アンカーを使用できる。","誤り。セメントモルタルによるタイル張りの打診検査は、全面を打診棒等で行うのが原則であり、全面の1/2程度では不十分である。"],"2018-施工-18":["正しい。JIS認定の建築用鋼製下地材は亜鉛めっきされており、切断面にも亜鉛の犠牲防食作用が期待できるため、高速カッター切断面の錆止め塗料塗りは省略できる。","正しい。ガラスブロック積みの伸縮調整目地は、特記がなければ一定間隔ごとに設ける。記述の間隔・幅は一般的な標準の範囲である。","誤り。軽量鉄骨壁下地の振れ止めは、高さに応じた段数と間隔で設ける。高さ3,000mmでは1,200mm程度の間隔で複数段設ける必要があり、1,500mmの位置に1段のみでは不足する。","正しい。はめ込み構法では、地震による面内変形時のガラスの割れを防ぐため、サッシ枠四周のエッジクリアランスを確認する。"],"2018-施工-19":["誤り。ビニル床シートの張付けは、床コンクリート直均し仕上げの場合、下地の乾燥のため打込みから一定期間（一般に28日以上）経過後に行う。21日後では乾燥不足のおそれがある。","正しい。仕様ルートで検証した特定天井では、天井面構成部材と壁・柱との隙間を6cm以上設ける。","正しい。外壁乾式工法の石材は、特記がなければ、正方形に近い矩形で、1枚の面積0.8m²以下、有効厚さ30mm以上70mm以下とする。","正しい。カーテンウォールの躯体付け金物の取付け位置の許容差は、特記がなければ鉛直方向±10mm、水平方向±25mmとする。"],"2018-施工-20":["正しい。コンクリート埋込みの分電盤の外箱は、型枠に取り付けてコンクリートに埋め込む。","正しい。雷保護設備の引下げ導線は、保護レベルに応じた平均間隔以内で、外周に沿ってできるだけ等間隔に、突角部の近くに配置する。","誤り。屋内横走り排水管の最小勾配は、呼び径65以下で1/50、75・100で1/100、125で1/150、150以上で1/200が標準である。呼び径125を1/200とするのは誤りである。","正しい。外壁に設ける換気用ダクトの換気口は、屋外避難階段から2m以上離して設ける。"],"2018-施工-21":["正しい。アースドリル工法の二次スライム処理は、鉄筋かご建込み後、コンクリート打込み直前に水中ポンプ方式などで行う。","正しい。鋼板葺きの留付けに用いる釘や金物は、腐食を防ぐため、ステンレス製などの耐食性のものを使用する。","正しい。屋外に露出する亜鉛めっき鋼面の錆止め塗装は、特記がなければ一液形変性エポキシ樹脂さび止めペイントを使用する。","誤り。外壁乾式工法の石張りの目地にシリコーン系シーリング材を使うと、成分が石材に染み出して汚染するおそれがある。変成シリコーン系など非汚染性のものを使用する。"],"2018-施工-22":["正しい。コア供試体のh/dが2未満の場合は、h/dに応じた補正係数を乗じて、直径の2倍の高さの供試体の強度に換算する。","正しい。スタッド溶接後の仕上り高さと傾きの試験は、スタッドの種類・部材ごと、かつ100本ごと及びその端数を1ロットとし、各ロット1本以上を抜き取って行う。","正しい。鉄骨枠内に使用するグラウト材の圧縮強度試験は、所定の材齢で供試体を試験して品質を管理する。","誤り。本体打込み式の改良型金属系アンカーでは、穿孔深さを有効埋込み深さと同じにするのは不足である。拡張部の施工や先端余長を考慮し、有効埋込み深さより深く穿孔する必要がある。"],"2018-施工-23":["正しい。防水改修で既存保護コンクリートを撤去する際は、躯体や仕上げ材の損傷を避けるため、質量15kg未満のハンドブレーカーを使用する。","正しい。除去したアスベスト含有吹付け材は、湿潤化を確認のうえ、除去作業場所で所定のプラスチック袋に入れて飛散を防止する。","誤り。自動式低圧エポキシ樹脂注入工法では、注入完了後、注入材が硬化したことを確認してから注入器具を撤去する。硬化前に撤去すると樹脂が逆流・流出する。","正しい。かぶせ工法の取合い部で、目地深さが所定寸法で挙動が少ない場合は、ボンドブレーカーを省略して三面接着としてよい。"],"2018-施工-24":["正しい。セトリングは、丸太組構法で、木材の重みや乾燥収縮によって積んだ丸太が沈下し、壁の高さが低くなる現象である。","誤り。軟弱な粘性土の掘削で山留め背面の地盤が回り込み、掘削底面が膨れ上がる現象はヒービングである。リバウンドは、掘削による除荷で地盤が膨れ上がる現象を指す。","正しい。ラミネーションは、鋼材中の非金属介在物や気泡が圧延で延ばされ、層状に分布して生じる内部の層状欠陥である。","正しい。強化ガラスは、フロート板ガラスを約650℃まで加熱後に急冷し、表面に圧縮応力層を形成したもので、耐風圧強度が約3倍に高まる。"],"2018-施工-25":["正しい。双方の責めに帰すことができない事由で受託者が監理業務を行えなくなった場合、受託者は既に遂行した業務の割合に応じて報酬を請求できる。","誤り。委託者の契約違反で受託者に損害が生じても、委託者が自己の責めに帰すことができない事由によることを証明した場合は、賠償を請求できない。証明しても請求できるとする記述は誤りである。","正しい。受注者は、工事用図書又は監理者の指示による施工が適当でないと認めたときは、直ちに書面で発注者又は監理者に通知する。","正しい。工事用図書どおりでない部分があると認められるときは、原則として監理者の指示により、受注者が費用を負担して修補・改造し、工期延長は求められない。"],"2017-施工-1":["正しい。監理者は業務着手に先立ち、監理体制・業務内容・進め方等の監理方針を策定し、建築主や工事施工者等に説明する。","正しい。請負代金内訳書の項目・数量・単価等の適否は、合理的な方法で検討し、結果を建築主に報告する。","誤り。工程表で工期や品質が確保できないおそれがあると判断した場合、監理者が報告する相手は建築主であり、工事施工者ではない。建築主へ速やかに報告する。","正しい。監理者は設計図書等に定める方法のほか、目視、抽出、品質管理記録の確認など、対象工事に応じた合理的方法で確認を行う。"],"2017-施工-2":["正しい。硬質ポリ塩化ビニル管は反り・変形防止のため、直射日光を避け、平坦な場所に角材を敷いて井げた積みとし、高さは1.5m以下とする。","誤り。スランプ21cmのJIS規格品の許容差は±2.5cmではなく、±1.5cmとされる。スランプが大きいほど許容差が大きいわけではない。","正しい。押出成形セメント板は屋内の平坦で乾燥した場所に台木を敷いて積置きとし、積み高さは1.0m以下を目安とする。","正しい。GRCパネルの辺長の寸法許容差は、特記がない場合±3mmとして確認する。"],"2017-施工-3":["正しい。建築一式工事の元請が、500万円以上の専門工事(屋根工事)を自ら施工する場合は、その専門工事に係る専門技術者を現場に置く必要がある。","正しい。解体工事業の新設に伴い、平成28年5月31日以前にとび・土工工事業の許可を受けていた業者は、平成28年6月1日から3年間、経過措置で引き続き解体工事を施工できる。","正しい。公共工事では、発注者が地方公共団体等の場合、下請契約を締結する全ての工事で施工体制台帳の作成が必要となる(金額の下限なし)。","誤り。専任の監理技術者は、請負金額7,000万円以上の建築一式工事で必要となる(個人住宅を除く)。診療所併用住宅は個人住宅ではなく、置かなくてよいとする点が誤り。"],"2017-施工-4":["正しい。一定規模以上の土地の形質の変更をしようとする者は、着手の30日前までに都道府県知事(政令市等は市長)へ届け出る。","正しい。産業廃棄物管理票を交付した排出事業者は、毎年度その状況を都道府県知事(政令市は市長)に報告する。","誤り。工事中の安全上の措置等に関する計画届は、建築主が特定行政庁へ届け出るものである。届出先を都道府県知事とする点が不適当。(図表は未確認)","正しい。特定建築物の所有者等は、使用開始から1か月以内に都道府県知事(保健所設置市等は市長・区長)へ届け出る。"],"2017-施工-5":["正しい。互層地盤では、砂質土層で揚水試験を行い、被圧水位や透水係数を求めて地下水処理工法を検討する。","正しい。平板載荷試験は、地盤の変形や強さなど支持力特性を直接把握する試験であり、根切り後の地盤で実施する。","正しい。枠組足場の作業床では、床材と建地との隙間は12cm未満とし、墜落を防止する。","誤り。吊り足場の吊りワイヤロープの安全係数は10以上とされる。安全係数5では不足である。"],"2017-施工-6":["正しい。ボイリングは動水勾配が大きいと発生するため、止水性のある山留め壁の根入れを延長して動水勾配を小さくするのは有効な対策である。","正しい。腹起しの継手は曲げ応力の小さい位置(火打材と切ばりの間など)とし、補強プレートとボルトで連結する。","誤り。粘性土の床付け面を乱した場合、掘削土の転圧や締固めでは強度が回復しない。砂質土や砕石などで置換する等の処置が必要となる。","正しい。切ばりが切ばり支柱と干渉する場合は、支柱を切り欠いて補強し、切ばりは通りよくまっすぐ設置する。"],"2017-施工-7":["誤り。セメントミルク工法では、支持地盤への根入れ深さは1m程度以上を確保するのが一般的で、0.5m程度では不足する。掘削深さもそれに応じて深くする。","正しい。打込み工法における杭頭の水平方向の施工精度の目安は、杭径の1/4以下かつ100mm以下である。","正しい。主筋間隔が狭くコンクリートの充填性が悪くなる場合は、主筋を2本重ねて配置するなどして適切な間隔を確保する。","正しい。アースドリル工法で安定液を使用する水中打設に準じる場合、単位セメント量は330kg/m³以上とされ、340kg/m³は適当である。"],"2017-施工-8":["誤り。大梁主筋を柱内で折り曲げて定着する場合、柱面から主筋外面までの投影定着長さは柱せいの3/4以上必要である。1/2では不足する。","正しい。溶接継手は、隣り合う鉄筋の継手位置を400mm以上ずらして配置する。","正しい。圧接部の膨らみの直径は1.4倍以上あれば足りるが、長さが1.1倍未満の場合は再加熱して圧力を加え、所定の長さに修正する。","正しい。キャップタイは、梁天端と段差のないスラブが取り付く側を90度フックとし、反対側を135度フックとするのが一般的である。"],"2017-施工-9":["正しい。打込み速さ10m/h以下かつ打込み高さ1.5m以下の場合は、柱と壁の側圧を同じ値として計算してよい。","正しい。ポンプ工法による通常のコンクリート打込み時の積載荷重は、1.5kN/m²を採用する。","誤り。梁下支保工を28日以前に取り外す場合の確認は、現場水中養生または現場封かん養生の供試体の強度が設計基準強度以上であることによる。標準養生の供試体では不適当。","正しい。やむを得ずスラブ支柱を盛替える場合は、範囲や方法を定めた施工計画書を作成させ、監理者が承認する。"],"2017-施工-10":["正しい。水セメント比は水の質量Eをセメントの質量Fで割った百分率であり、(E/F)×100となる。(表は未確認で、記号は一般的な割付を前提とした)","誤り。細骨材率は、細骨材と粗骨材の絶対容積に対する細骨材の絶対容積の割合であり、質量ではなく容積で求める。質量記号で表した式は誤り。(表は未確認)","正しい。空気量は、1,000L(1m³)から水・セメント・骨材の絶対容積の合計を引いた残りの割合で表される。","正しい。フレッシュコンクリートの単位容積質量は、水・セメント・細骨材・粗骨材の質量の合計(kg/m³)を1,000で割ってt/m³で表す。"],"2017-施工-11":["正しい。圧送に先立つ富調合モルタルは、型枠内に打ち込まず全て破棄するのが原則である。","正しい。棒形振動機は下層に先端が入るよう垂直に挿し、間隔は60cm以下とし、上面にセメントペーストが浮くまで加振する。","正しい。打込み翌日でも、適切に養生し振動・衝撃を与えない作業(墨出し等)に限れば認められる。","誤り。普通ポルトランドセメントでは、コンクリートの温度を2℃以上に保つ期間は5日以上とされる(早強は3日以上)。3日では不足。"],"2017-施工-12":["正しい。加熱養生では前養生を2〜3時間以上とり、温度上昇勾配は15℃/h程度以下とする。","誤り。板状プレキャスト部材を立て起こして脱型する場合の所要強度は、5N/mm²では不足し、一般にそれより高い強度(10N/mm²程度以上)が求められる。","正しい。エンクローズ溶接継手は、残留応力を小さくするよう溶接作業の進め方に配慮するもので、設問の記述は適当とされる。","正しい。現場打ちコンクリートとの接合面は、打込み前に散水して湿潤状態にし、豆板等の欠陥を防ぐ。"],"2017-施工-13":["正しい。気温が0℃前後の場合は、溶接線の両側約100mmの範囲を加熱(ウォームアップ)して溶接する。気温が-5℃未満では溶接を行わない。","正しい。突合せ継手の段違いが薄いほうの板厚の1/4以下かつ10mm以下であれば、溶接表面を滑らかに移行させて溶接できる。","誤り。高力ボルト接合の肌すきは1mm以下なら処理不要だが、1mmを超える場合はフィラープレートを挿入する。2mmでは挿入が必要。","正しい。トルシア形高力ボルトでナット回転量にばらつきがある群は、全ボルトの回転量を測定し、平均回転角度±30度の範囲を合格とする。"],"2017-施工-14":["正しい。鋼材表面の温度が50℃以上で塗膜に泡を生じるおそれがある場合は、塗装作業を中止する。","誤り。あと詰め中心塗り工法のモルタル養生は、強度発現に必要な期間(一般に3日以上)を確保する必要があり、2日では不足する。","正しい。ロックウール吹付けの厚さは確認ピンを差し込んで確認し、柱は1面に各1箇所以上とする。","正しい。建築物の倒れの管理許容差は、高さの1/4,000+7mm以下かつ30mm以下とされる。"],"2017-施工-15":["正しい。桁にやむを得ず短材を使う場合は、長さを2m内外とし、継手部を短ざく金物等で補強する。","誤り。木造軸組の建方精度は、垂直・水平ともに1/1,000以下を標準とする。水平の誤差を1/500以下とするのは緩すぎ、不適当。","正しい。ボルト孔は木部に密着するよう、ボルト径に所定の余裕(特記がなければ約1〜2mm)を加えた径とする。","正しい。地表面から高さ1m以下の外周壁内や水まわりの壁内の木部には、JIS規格品の表面処理用木材保存剤を塗布する。"],"2017-施工-16":["正しい。ひび割れ誘発目地のシーリングは、ムーブメントが小さいため、ボンドブレーカーを用いず三面接着とする。","正しい。砂付あなあきルーフィングは一般平場部に用い、立上り部では省略できる。","誤り。立上り部の入隅は直角では防水層が浮くおそれがあり、三角形の面取りとして納める。出隅の面取りは正しい。","正しい。プレキャスト化した塔屋壁基壇部と現場打ちスラブを一体化して防水層の下地とする方法は、工期短縮に有効な納め方である。"],"2017-施工-17":["正しい。モルタルの下塗りは、吸水調整材が乾燥してから行う。","正しい。石張りの敷モルタルは、容積比でセメント1:砂4程度の、手で握って崩れない硬練りとする。","正しい。屋外の有機系接着剤は、JIS規格品の一液反応硬化形変成シリコーン樹脂系等を用いる。","誤り。床タイル張りの伸縮調整目地は、特記がなければ縦横3m程度ごとに設ける。5mごとは間隔が広すぎる。"],"2017-施工-18":["正しい。ふところが1.5m程度の天井では、吊りボルトの水平・斜め補強に軽量の補強材(∟-19×10×1.2程度)を用いる。","誤り。野縁受へ野縁を留め付けるクリップは、つめの向きを同一方向に揃えず、互い違いに留め付けて、野縁の動きや外れを防ぐ。","正しい。強化ガラスは自然破損の可能性があるため、関係者で協議し、合わせガラスへ変更するのは適当である。","正しい。不定形シーリング材構法の複層ガラスの掛り代は、特記がなければ15mm以上確保する。"],"2017-施工-19":["誤り。グリッパー工法の上敷きの伸長張力は、幅500mmにつき300N程度とされる。200Nでは張力不足で、たるみやしわの原因となる。","正しい。防湿層のポリエチレンフィルムの継目は柱等の木下地部分に設け、重ね幅を30mm以上とする。","正しい。Y型ガスケットをはめ込む溝の中心は、コンクリート端面から60mm以上確保する。","正しい。ロックウール化粧吸音板は湿気で軟化するため、工事中の室内湿度が80%を超えないよう管理する。"],"2017-施工-20":["誤り。ロックウールフェルトの密度は、標準的な仕様では40kg/m³程度のものを用いる。20kg/m³では不足するとされる。","正しい。合成樹脂製可とう電線管の埋設は、上下端筋の間に配管し、専用支持具で固定し、曲り部は0.5m以下の間隔で結束する。","正しい。防火区画貫通部は、所定の呼び径以内の硬質塩化ビニル管ならモルタルで隙間を充填する工法が認められる。","正しい。エスカレーターの踏段相互間、スカートガードと踏段との隙間は、全長にわたり接触せず5mm以下とする。"],"2017-施工-21":["誤り。折板のけらば包みは、端部用タイトフレームへの取付け間隔を1.2m以下とする。1.8mは広すぎる。","正しい。縦形ルーフドレンは、あご付きパラペットでは、あごの垂直面からドレン中心までの距離を、ドレンの径に応じて確保する。150mmの場合400mmは適当。","正しい。アルミニウム製笠木は、コーナー部を先に取り付け、直線部は両端から定尺材、中央に調整部材を設ける。","正しい。防火扉の危害防止装置は、閉鎖時間・運動エネルギー・閉鎖力を測定して検査する。"],"2017-施工-22":["誤り。増打ち耐震壁の打継ぎ面の目荒しは、5mm程度の凹凸とするのが一般的である。30mm程度斫って鉄筋を露出させるのは過大で不適当。","正しい。壁頭部にグラウト材を注入する場合、梁下200mm程度の位置でコンクリートを打ち止める。","正しい。金属系あと施工アンカーの穿孔の傾斜角は、垂線に対して5度以内を合格とする。","正しい。確認試験荷重は、鋼材による引張荷重とコンクリート破壊による引張荷重の小さいほうの2/3程度とする。"],"2017-施工-23":["正しい。かぶせ工法は、既存建具の方立・無目・障子等を撤去し、外周枠を残してその上から新規建具を取り付ける。","正しい。塗膜はく離剤工法では、特記がなければ試験施工を行い、既存塗膜を全面除去する。","誤り。モザイクタイルの広範囲な浮きは、注入口付アンカーピンニングエポキシ樹脂注入タイル固定工法の対象ではなく、タイルの張替え等で対処する。","正しい。シーリング再充填工法では、既存材をカッターで切り込んでできる限り除去し、サンダー掛け等で清掃する。"],"2017-施工-24":["誤り。開先角度は開先面どうしのなす角、ベベル角度は片側の開先面の角度であり、AとBを入れ替えている。また「ルート深さ」「ギャップ」は標準的な名称ではない。(図は未確認)","誤り。ベベル角度と開先角度の対応が逆である。ルート面・ルート間隔の名称自体は正しいが、組合せとして成立しない。(図は未確認)","正しい。V形開先では、開先角度(A)、片側のベベル角度(B)、ルート面(C)、ルート間隔(D)の組合せが正しい。(図は未確認)","誤り。開先角度とベベル角度の対応は合うが、「ルート深さ」「ギャップ」は標準的な名称でなく、ルート面・ルート間隔が正しい。(図は未確認)"],"2017-施工-25":["正しい。監理業務で協議して決定した事項は、原則として速やかに書面を作成し、記名・押印する。","正しい。監理業務を原設計者と異なる建築士に委託した場合、設計変更が必要になったときは、原設計者に設計変更業務を別途委託する。","正しい。立会いを要する工事は、事前に発注者または監理者に通知して施工する。","誤り。工事完了時、受注者は設計図書どおりであることを確認し、発注者に通知する流れである。受注者が監理者に検査を求める旨の記述は不適当。"],"2016-施工-1":["正しい。特記とは、標準仕様書と異なる事項や含まれていない事項について、質問回答書、現場説明書、特記仕様書及び図面で指定された事項をいう。","誤り。クレーン等は、中震(震度4)以上の地震の後に作業を行う場合、あらかじめ各部分の異常の有無を点検する必要があり、震度4でも点検は省略できない。","正しい。仮設の荷受け構台は、積載荷重等に対して十分安全な構造とすれば、材料置場と兼用することができる。","正しい。工種別施工計画書は、品質計画や一工程の施工の確認、具体的な計画を定めたもので、原則として施工に先立ち作成し、監理者に提出する。"],"2016-施工-2":["誤り。海域以外の公共用水域へ排出する場合、水質汚濁防止法等の排水基準は水素イオン濃度pH5.8以上8.6以下であり、pH9.0以下では基準を満たさない。","正しい。掘削面の高さが2m以上となる地山の掘削作業では、地山の掘削作業主任者を選任しなければならない。2mはこれに該当する。","正しい。石綿含有成形板(石綿含有率0.1％超)の除去作業では、石綿作業主任者技能講習修了者から石綿作業主任者を選任する。","正しい。騒音規制法の特定建設作業の騒音は、敷地境界線において85dBを超えないことが基準であり、85dB以下の管理は適切である。"],"2016-施工-3":["誤り。既製コンクリート杭を2点支持で仮置きする位置は、曲げモーメントを最小とするため、杭の両端から杭長の約1/5の位置付近とする。1/3ではない。","正しい。タイルカーペット類は荷崩れしないよう、5〜6段積み程度までとして保管する。","正しい。セメントモルタルによる磁器質タイル張りの下地コンクリートの平坦さは、1mにつき10mm以下を標準とする。","正しい。塗装場所の気温が5℃未満、相対湿度85％以上の場合は原則施工しないが、採暖や換気等で適切な温湿度条件が確保できれば施工できる。"],"2016-施工-4":["正しい。建設リサイクル法では、対象建築物の新築工事は床面積の合計が500m2以上で届出が必要で、届出先は都道府県知事である。","誤り。高さ31mを超える建築物の建設・解体に係る建設工事計画届の提出先は、特定行政庁ではなく労働基準監督署長である。","正しい。道路上に仮囲い等を継続して設置する場合は、道路法に基づく道路占用許可申請書を道路管理者へ提出する。","正しい。ボイラー(移動式を除く)を設置する場合は、労働安全衛生法に基づくボイラー設置届を労働基準監督署長へ提出する。"],"2016-施工-5":["正しい。枠組足場の強度計算では、鉛直荷重(自重と積載荷重)は建枠で、水平方向の風荷重は壁つなぎで支持するものとみなして部材を検討する。","正しい。10分間の平均風速が10m/s以上の強風が予想される場合、移動式クレーンの作業は中止し、転倒防止措置を講じる。","誤り。仮設手摺の中桟は、床面から35cm以上50cm以下の位置に設ける必要がある。65cmの位置では墜落防止上不適当である。","正しい。鋼製巻尺のテープ合わせは、1級品を複数用意し、所定の張力(50N)を与えて相互の差を確認する。"],"2016-施工-6":["正しい。ヒービングの対策には、剛性の高い山留め壁を良質地盤まで深く根入れし、背面地盤の回り込みを抑えることが有効である。","誤り。プレボーリングで設置した親杭は、根入れ部分より上の杭周りの空隙を砂などで充填する。空隙を存置してはならない。","正しい。切ばり支柱と乗入れ構台支柱を兼用する場合は、切ばりの荷重に加え、構台上の重機や構台自重等を合計した荷重に対する支持力を確認する。","正しい。新品の形鋼をソイルセメント壁の芯材に用いる場合、許容応力度は短期許容応力度を採用できる。"],"2016-施工-7":["正しい。寒冷地では地中温度が低く強度発現が遅れるため、養生温度による調合強度の補正を行う。","正しい。PC杭のダイヤモンドカッター方式による杭頭切断では、切断面から350mm程度の範囲を補強する。","誤り。セメントミルク工法のアースオーガーは、掘削時も引上げ時も正回転とする。引上げ時に逆回転させると孔壁を崩すおそれがある。","正しい。既製コンクリート杭の仮付け溶接は本溶接と同等のものとし、長さは40mm以上とする。"],"2016-施工-8":["正しい。異なる強度の鉄筋でも、SD345のD25とSD390のD29のように径の差が7mm以下であれば、ガス圧接継手とすることができる。","正しい。加熱中に火炎の異常で中断しても、圧接端面が密着した後であれば再加熱して圧接を続行できる。","誤り。異形鉄筋の圧延マークの突起数は種類で異なり、SD345は突起1個、SD390は突起2個である。突起2個はSD345ではない。","正しい。壁の配筋検査では、交差する鉄筋の結束箇所が、交点の半数以上でバランスよく結束されていることを確認する。"],"2016-施工-9":["誤り。湿潤養生をしない場合の基礎のせき板の存置期間は、計画供用期間の級が標準なら圧縮強度10N/mm2以上である。5N/mm2以上は湿潤養生を行う場合である。","正しい。スラブ下の支保工は、圧縮強度が設計基準強度に達しなくとも、12N/mm2以上かつ構造計算で安全が確認されれば取り外せる。","正しい。打込み速さが20m/hを超える場合、側圧は液圧(フレッシュコンクリートのヘッドと単位容積質量に重力加速度を乗じた値の積)とする。","正しい。開口補強が不要で径200mm以下のスリーブは、特記がなければ紙チューブを使用してよい。"],"2016-施工-10":["正しい。中庸熱ポルトランドセメントは水和熱が小さく、マスコンクリートの温度ひび割れ抑制に有効である。","正しい。乾燥収縮ひずみは、単位水量を減らし単位粗骨材量を大きくすることで抑制できる。","正しい。人工軽量骨材をあらかじめ十分吸水させておくと、圧送中の吸水によるスランプロスを抑制できる。","誤り。高強度コンクリートの自己収縮は、単位セメント量(結合材量)が多いほど大きくなるため、できるだけ小さくして抑制する。"],"2016-施工-11":["正しい。構造体コンクリートの圧縮強度検査では、1回の試験に適切な間隔をあけた3台の運搬車から各1個、計3個の供試体を採取する。","誤り。練混ぜから打込み終了までの時間の限度は、外気温25℃未満で120分以内、25℃以上で90分以内である。150分は長すぎる。","正しい。軽量コンクリートの圧送では、水平換算距離150mなら呼び寸法125Aの輸送管の使用は適当である。","正しい。梁の鉛直打継ぎは、せん断力の小さいスパン中央付近に設ける。"],"2016-施工-12":["正しい。アンカー筋のかぶり厚さは、特記がなければ製造精度や施工誤差を考慮し、必要な最小かぶり厚さに5mmを加えた値とする。","正しい。特記がない場合、プレキャスト部材と現場打ち部分の位置の許容差は同じ値としてよい。","誤り。脱型時の圧縮強度は、標準養生ではなく、部材と同じ条件で養生した供試体の強度で確認する。標準養生では部材の強度を正しく反映しない。","正しい。仮置きするプレキャスト柱部材は、安定性を考慮し、平置きで2段までとする。"],"2016-施工-13":["正しい。ひら金物は上下階の管柱相互などの接合に用いられる。","正しい。梁受け金物は、梁と梁との接合(大梁と小梁など)に用いられる。","正しい。ホールダウン金物(引寄せ金物)は、基礎と柱などの引抜き力が生じる箇所の接合に用いられる。","誤り。折曲げ金物(ST)は、柱と胴差・桁など、主に垂直材と横架材の接合に用いる。根太と大引きの接合用ではない。"],"2016-施工-14":["正しい。アンダーカットは、必要に応じ整形後、ショートビードにならないよう補修溶接し、必要に応じグラインダー仕上げを行う。","誤り。ピットは、欠陥部をアークエアガウジング等ではつり取り、再溶接で補修する。溶接金属を足すだけでは内部の欠陥が残る。","正しい。オーバーラップは、余盛を削りすぎないよう注意してグラインダー仕上げを行う。","正しい。融合不良は、アークエアガウジングではつって位置を確認し、端部より20mm程度除去して船底型に仕上げ再溶接する。"],"2016-施工-15":["誤り。溶融亜鉛めっき高力ボルトの一次締めトルクは、M20・M22では150N・mとする。100N・mはM16の値で不適当である。","正しい。ナット回転法では、一次締め後のマークのずれによりナット回転量が120度±30度の範囲にあるものを合格とする。","正しい。トルシア形高力ボルトの余長は、ナット面から突き出た長さがねじ1山〜6山の範囲であれば合格とする。","正しい。F8Tの溶融亜鉛めっき高力ボルトM20の孔径は、22mmとする。"],"2016-施工-16":["正しい。アスファルト防水の下地の乾燥状態は、高周波水分計による下地水分の測定などで判断する。","正しい。コンクリート壁下地の外壁タイル目地には、特記がなければ2成分形ポリサルファイド系シーリング材を使用できる。","誤り。縦引き型ルーフドレンは、パラペットの立上りに接する位置に設置すると防水層の納まりが悪く不適当で、立上り部から離して設置する。","正しい。折板葺のタイトフレームと受け梁は、ボルト接合ではなく隅肉溶接とし、風による繰返し荷重での緩みを防止する。"],"2016-施工-17":["正しい。外壁乾式工法では、ファスナーの面外調整機構を考慮し、下地コンクリート部材の位置の許容差を±10mmとする。","誤り。石先付けPC工法では、シアコネクターの取付け代を要するため、石材の厚さは30mm以上とする。20mmでは薄すぎる。","正しい。改良圧着張りの張付けモルタルは、1回の塗付け面積を2m2以下とし、60分以内に張り終える範囲とする。","正しい。外壁タイルの引張接着強度試験は、100m2ごと及びその端数につき1個以上、かつ全体で3個以上とする。"],"2016-施工-18":["正しい。アルミニウム合金の線膨張係数は約23×10^-6/℃で、温度差40℃では1m当たり約1mmの伸縮となり、目安として適当である。","正しい。サッシ下部のモルタルを確実に充塡するため、水切り板下部とサッシ下枠下部のモルタル詰めを二度に分けて行う。","正しい。引違い窓のセッティングブロックは、ガラス両端部から横幅の1/4の位置に設置する。","誤り。熱線吸収板ガラスは日射吸収率が高く、フロート板ガラスより熱割れを生じやすい。熱割れ防止には適さない。"],"2016-施工-19":["正しい。せっこう系直張り用接着剤の塗付け間隔は、ボード周辺部で150〜200mmとする。","正しい。長い廊下のグリッパー工法では、伸長用工具としてパワーストレッチャーを使用する。","誤り。吸水調整材の塗布回数を増しても付着性は高まらず、塗り過ぎるとかえって付着力が低下する。所定の塗布方法を守る。","正しい。縦壁ロッキング構法のALCパネル外壁の目地のシーリングは、二面接着とする。"],"2016-施工-20":["誤り。光電式スポット型煙感知器は、換気口等の吹出し口から1.5m以上離して取り付ける。1.2mでは近すぎる。","正しい。排水トラップの封水深さは、5〜10cmとする。","正しい。外壁の換気用排気口は、屋外避難階段から2m以上離して設ける。","正しい。寒冷地以外で車両が通行しない敷地の給水管埋設深さは、300mm程度でよい。"],"2016-施工-21":["正しい。カーテンウォールの層間ふさぎは、部材の挙動で耐火材が脱落しないよう、厚さ1.6mmの鋼板の層間ふさぎ受けを取り付ける。","正しい。断熱材が欠落した部分は、コンクリートをはつり取り、現場発泡工法により隙間なく補修する。","正しい。吹付け硬質ウレタンフォームは、下吹きを厚さ5mm以下で行ったのち、多層吹きとして表面を平滑にする。","誤り。排気ダクトは雨水の浸入防止のため、屋外に向かって先下がり勾配とする。住戸外に向かって先上がりとするのは不適当である。"],"2016-施工-22":["正しい。垂直方向のひび割れへのエポキシ樹脂注入は、下部の注入口から上部へ順次注入する。","正しい。ルーフドレン周囲は、端部から500mm程度の保護層、300mm程度の既存防水層を四角形に撤去する。","正しい。既存インサートを再使用する場合は、工事対象階で数箇所、所定荷重の引抜き試験を行い、引き抜けないことを確認する。","誤り。電磁波レーダ法は鉄筋の位置や空洞などの探査に用いる方法で、中性化深さの調査には適さない。中性化深さはコア採取やはつりによるフェノールフタレイン法等で測定する。"],"2016-施工-23":["誤り。豆板部のコンクリート打直しで、露出した鉄筋と周囲コンクリートの隙間aは、打込み・充填性を確保するため、20mm程度では不十分と判断される。※図が不明のため、十分な隙間を確保するという一般論で記述。","正しい。開口部上端のコンクリート打設側は、空気だまりができないよう、寸法bを100mm以上として斜めにはつり取る。","正しい。接着系アンカーの穿孔をやむを得ず傾斜させる場合、施工面への垂線に対し傾斜角は15度以内とする。","正しい。金属系アンカーは、既存梁の主筋とせん断補強筋に囲まれた内側に配置し、既存柱からのはしあきをアンカー軸部径の5倍以上とする。"],"2016-施工-24":["正しい。クラックスケールは、コンクリート等のひび割れ幅の測定に用いる。","正しい。溶接ゲージは、隅肉溶接ののど厚・脚長・ビード幅、アンダーカット深さ等の測定に用いる。","誤り。本尺と副尺で1/20mmまでの精度で幅や深さを測るのはノギス(キャリパス)である。すきまゲージは隙間の寸法を測る薄板状の器具である。","正しい。鋼球型テストハンマーは、タイル等の表面を転がしたり軽打したりして、音の差で浮きを調べる。"],"2016-施工-25":["正しい。業務委託約款では、委託者の指示が法令に抵触するおそれがある場合、受託者は撤回又は変更を求めることができる。","正しい。受託者が委託者の承諾を得て業務の一部を他の建築士事務所に委託した場合でも、受託者はその受託者の行為全てについて責任を負う。","正しい。工事請負契約約款では、受注者は、監理者の処置が著しく適当でないと認めるとき、理由を明示した書面で発注者に異議を申し立てられる。","誤り。監理技術者又は主任技術者を定めたときの氏名の通知先は、監理者ではなく発注者である。"]};
// EXPL_DATA_END
function explKey(q){return `${q.year}-${q.subject}-${q.no}`}
function explFor(q,i){const e=EXPL[explKey(q)];return e&&e[i]?e[i]:''}
function explItemsHtml(q,mineIdx){
  return q.choices.map((c,i)=>{
    const cls=(i+1===q.answer?' ans':'')+(mineIdx===i+1&&mineIdx!==q.answer?' mine':'');
    const ex=explFor(q,i);
    return `<div class="expl-item${cls}"><b>${i+1}.</b> ${c}${ex?`<div class="ec">${ex}</div>`:''}</div>`;
  }).join('');
}
let qaAnswered = false;
let qaCurrentChoiceIdx = 0;
let qaMaruIsCorrect = false;

// ============================================================
// Storage
// ============================================================
function loadStats(){
  try {
    return JSON.parse(localStorage.getItem('1kyu_stats'))||{total:0,correct:0,last:null};
  } catch(e){return {total:0,correct:0,last:null}}
}
function saveStats(s){
  try{localStorage.setItem('1kyu_stats',JSON.stringify(s))}catch(e){}
}
function updateStatsDisplay(){
  const s=loadStats();
  document.getElementById('statTotal').textContent=s.total+'問';
  document.getElementById('statRate').textContent=s.total>0?Math.round(s.correct/s.total*100)+'%':'--%';
  document.getElementById('statLast').textContent=s.last||'--';
}

// ============================================================
// Navigation
// ============================================================
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const back=document.getElementById('backBtn');
  const sub=document.getElementById('headerSub');
  if(id==='homeScreen'){
    back.classList.add('hidden');
    sub.textContent='過去問トレーニング';
    updateStatsDisplay();
    stopTimer();
    screenHistory=[];
  } else {
    back.classList.remove('hidden');
  }
  currentScreen=id;
}
function goBack(){
  if(currentScreen==='examScreen'||currentScreen==='qaScreen'){
    if(confirm('問題を中断してもよろしいですか？')){
      stopTimer();
      showScreen(screenHistory.pop()||'homeScreen');
    }
  } else if(screenHistory.length>0){
    showScreen(screenHistory.pop());
  } else {
    showScreen('homeScreen');
  }
}
function navigateTo(id){
  screenHistory.push(currentScreen);
  showScreen(id);
}

// ============================================================
// Mode Selection
// ============================================================
function openMode(mode){
  currentMode=mode;
  if(mode==='exam') buildExamSelect();
  else buildQASelect();
}

function getAvailableYears(){
  const years=new Set();
  QUESTIONS.forEach(q=>years.add(q.year));
  return [...years].sort((a,b)=>b-a);
}

function getQuestionCount(year, subjects){
  return QUESTIONS.filter(q=>q.year===year&&subjects.includes(q.subject)).length;
}

function buildExamSelect(){
  const years=getAvailableYears();
  let html='<h2>年代と科目グループを選択</h2>';
  years.forEach(y=>{
    const yLabel=y<=2018?`平成${y-2018+30}年（${y}）`:`令和${y-2018}年（${y}）`;
    html+=`<div class="select-group"><h3>${yLabel}</h3>`;
    EXAM_CONFIG.groups.forEach((g,gi)=>{
      const count=getQuestionCount(y,g.subjects);
      const disabled=count===0;
      html+=`<button class="select-btn" ${disabled?'disabled':''} onclick="startExam(${y},${gi})">
        ${g.label}
        <span class="btn-count">${count>0?count+'問 / '+g.totalQuestions+'問':'データなし'}</span>
        <div class="btn-sub">制限時間: ${g.timeMinutes}分</div>
      </button>`;
    });
    html+='</div>';
  });
  document.getElementById('examSelectArea').innerHTML=html;
  navigateTo('examSelectScreen');
  document.getElementById('headerSub').textContent='年代別過去問モード';
}

function buildQASelect(){
  let html='<h2>科目を選択</h2>';
  SUBJECT_LIST.forEach(s=>{
    const count=QUESTIONS.filter(q=>q.subject===s).length;
    html+=`<button class="select-btn" ${count===0?'disabled':''} onclick="startQA('${s}')">
      ${s}
      <span class="btn-count">${count}問</span>
      <div class="btn-sub">一問一答形式・即時採点</div>
    </button>`;
  });
  document.getElementById('qaSelectArea').innerHTML=html;
  navigateTo('qaSelectScreen');
  document.getElementById('headerSub').textContent='科目別一問一答モード';
}

// ============================================================
// Exam Mode
// ============================================================
function startExam(year, groupIdx){
  currentYear=year;
  currentGroupIdx=groupIdx;
  const group=EXAM_CONFIG.groups[groupIdx];
  currentQuestions=QUESTIONS.filter(q=>q.year===year&&group.subjects.includes(q.subject));
  currentQuestions.sort((a,b)=>{
    const si=SUBJECT_LIST.indexOf(a.subject)-SUBJECT_LIST.indexOf(b.subject);
    return si!==0?si:a.no-b.no;
  });
  currentIndex=0;
  userAnswers={};
  remainingSeconds=group.timeMinutes*60;
  document.getElementById('examSubject').textContent=group.label;
  renderExamQuestion();
  navigateTo('examScreen');
  document.getElementById('headerSub').textContent=`${year}年 ${group.label}`;
  startTimer();
}

function renderExamQuestion(){
  if(currentIndex>=currentQuestions.length) return;
  const q=currentQuestions[currentIndex];
  const area=document.getElementById('examQuestions');
  const prog=document.getElementById('examProgress');
  prog.textContent=` (${currentIndex+1}/${currentQuestions.length})`;
  let choicesHtml='';
  q.choices.forEach((c,i)=>{
    const sel=userAnswers[currentIndex]===(i+1)?'selected':'';
    choicesHtml+=`<li class="${sel}" onclick="selectExamAnswer(${currentIndex},${i+1})">
      <span class="choice-num">${i+1}</span><span>${c}</span>
    </li>`;
  });
  area.innerHTML=`<div class="q-card">
    <div class="q-number">${q.subject} 〔No.${q.no}〕</div>
    <div class="q-text">${q.text.replace(/\n/g,'<br>')}</div>
    ${q.figure||''}
    <ul class="choices">${choicesHtml}</ul>
  </div>`;
  const btn=document.getElementById('examNextBtn');
  btn.textContent=currentIndex===currentQuestions.length-1?'解答を提出':'次の問題';
  area.scrollTo(0,0);
  window.scrollTo(0,0);
}

function selectExamAnswer(qi,ans){
  userAnswers[qi]=ans;
  renderExamQuestion();
}

function examNext(){
  if(currentIndex>=currentQuestions.length-1){
    if(confirm('解答を提出しますか？\n未回答の問題があっても提出されます。')){
      stopTimer();
      showExamResult();
    }
  } else {
    currentIndex++;
    renderExamQuestion();
  }
}
function examPrev(){
  if(currentIndex>0){currentIndex--;renderExamQuestion()}
}

function showExamResult(){
  let correct=0;
  const subjectScores={};
  currentQuestions.forEach((q,i)=>{
    if(!subjectScores[q.subject]) subjectScores[q.subject]={correct:0,total:0};
    subjectScores[q.subject].total++;
    if(userAnswers[i]===q.answer){correct++;subjectScores[q.subject].correct++}
  });
  const total=currentQuestions.length;
  const pct=Math.round(correct/total*100);
  const barColor=pct>=70?'var(--correct)':pct>=50?'#f39c12':'var(--accent)';

  let detailHtml='';
  Object.keys(subjectScores).forEach(s=>{
    const sc=subjectScores[s];
    const pass=EXAM_CONFIG.passingScores[s];
    const passed=sc.correct>=pass;
    detailHtml+=`<div class="result-row">
      <span class="label">${s}</span>
      <span class="value ${passed?'pass':'fail'}">${sc.correct}/${sc.total}点 ${passed?'✓合格':'✗不合格'}（基準:${pass}点）</span>
    </div>`;
  });

  document.getElementById('resultArea').innerHTML=`
    <h2 style="margin-top:20px;color:var(--primary)">試験結果</h2>
    <div class="result-score">${correct}<span style="font-size:24px;color:var(--text-light)">/${total}</span></div>
    <div class="result-total">正答率 ${pct}%</div>
    <div class="result-bar"><div class="result-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
    <div class="result-detail">
      <h3>科目別スコア</h3>
      ${detailHtml}
    </div>
    <h3 style="margin:20px 0 8px;color:var(--primary)">解答と解説</h3>
    ${currentQuestions.map((q,i)=>{
      const ok=userAnswers[i]===q.answer;
      return `<details class="review-q"><summary><span class="review-mark" style="color:${ok?'var(--correct)':'var(--wrong)'}">${ok?'○':'×'}</span>${q.subject} No.${q.no}　あなた:${userAnswers[i]||'未回答'} / 正答:${q.answer}</summary>
        <div class="rb"><div class="q-text" style="font-size:13px">${q.text.replace(/\n/g,'<br>')}</div>${explItemsHtml(q,userAnswers[i])}</div></details>`;
    }).join('')}`;
  navigateTo('resultScreen');

  const stats=loadStats();
  stats.total+=total;
  stats.correct+=correct;
  stats.last=new Date().toLocaleDateString('ja-JP');
  saveStats(stats);
}

// ============================================================
// QA Mode
// ============================================================
function startQA(subject){
  currentSubject=subject;
  currentQuestions=QUESTIONS.filter(q=>q.subject===subject);
  shuffleArray(currentQuestions);
  currentIndex=0;
  qaAnswered=false;
  renderQAQuestion();
  navigateTo('qaScreen');
  document.getElementById('headerSub').textContent=`一問一答：${subject}`;
}

function makeQAStatement(qText, choiceText){
  const sents=qText.replace(/\n/g,'').split(/。(?![）)」])/).map(x=>x.replace(/。$/,'')).filter(x=>x!=='');
  const endRe=/(どれか|いくつあるか|何個あるか|ものは|組合せは|数は|値は|関係は|ものを)$/;
  let ei=-1;
  for(let i=sents.length-1;i>=0;i--){ if(endRe.test(sents[i])){ei=i;break} }
  const context=[],notes=[];
  let head='';
  sents.forEach((x,i)=>{
    if(i===ei){
      let h=x.replace(/[、，]?(?:次の|下記の).*$/,'');
      if(h===x) h=x.replace(/[、，][^、，]*$/,'');
      if(h===x) h='';
      if(/(ものは|組合せは|数は|値は|関係は|ものを)$/.test(h)) h=h.replace(/[、，]?[^、，]*$/,'');
      head=h.replace(/[、，]$/,'');
    } else if(/^(ただし|なお)/.test(x)||(ei>=0&&i>ei)) notes.push(x+'。');
    else context.push(x+'。');
  });
  head=head.replace(/に関する$/,'に関して').replace(/について$/,'について').replace(/における$/,'において');
  const statement=head?head+'、'+choiceText:choiceText;
  return {context:context.join(''),statement,note:notes.join('')};
}

function isNegativeQ(text){
  return /不適当|誤って|誤りの|適合しない|該当しない|効果の低い/.test(text);
}

function renderQAQuestion(){
  if(currentIndex>=currentQuestions.length){
    showQAComplete();
    return;
  }
  qaAnswered=false;
  const q=currentQuestions[currentIndex];
  const choiceIdx=Math.floor(Math.random()*4);
  qaCurrentChoiceIdx=choiceIdx;
  const isAnswer=(choiceIdx+1===q.answer);
  const neg=isNegativeQ(q.text);
  const ex0=explFor(q,choiceIdx);
  qaMaruIsCorrect=ex0?ex0.startsWith('正しい'):(neg?!isAnswer:isAnswer);
  const st=makeQAStatement(q.text, q.choices[choiceIdx]);
  const area=document.getElementById('qaQuestions');
  area.innerHTML=`
    <div style="text-align:center;font-size:13px;color:var(--text-light);margin-bottom:12px">
      ${currentIndex+1} / ${currentQuestions.length}問目
    </div>
    <div class="q-card">
      <div class="q-number">${q.subject} 〔No.${q.no}〕（${q.year}年）</div>
      ${q.figure||''}
      ${st.context?`<div class="qa-note">${st.context}</div>`:''}
      <div class="qa-statement">
        <div class="qa-statement-text">${st.statement}</div>
      </div>
      ${st.note?`<div class="qa-note">${st.note}</div>`:''}
      <div class="qa-buttons" id="qaButtons">
        <button class="qa-btn qa-maru" onclick="selectQAAnswer(true)">○</button>
        <button class="qa-btn qa-batsu" onclick="selectQAAnswer(false)">×</button>
      </div>
      <div class="feedback" id="qaFeedback"></div>
    </div>`;
  document.getElementById('qaNextBtn').style.display='none';
  window.scrollTo(0,0);
}

function selectQAAnswer(answeredMaru){
  if(qaAnswered) return;
  qaAnswered=true;
  const isCorrect=(answeredMaru===qaMaruIsCorrect);
  const btns=document.querySelectorAll('#qaButtons .qa-btn');
  btns.forEach(b=>b.classList.add('disabled'));
  if(answeredMaru){
    btns[0].classList.add(isCorrect?'correct':'wrong');
  } else {
    btns[1].classList.add(isCorrect?'correct':'wrong');
  }
  const fb=document.getElementById('qaFeedback');
  fb.className='feedback '+(isCorrect?'correct':'wrong');
  if(isCorrect){
    fb.textContent='正解！';
  } else {
    fb.textContent=qaMaruIsCorrect?'不正解… ○が正解です。':'不正解… ×が正解です。';
  }
  const q=currentQuestions[currentIndex];
  const ex=explFor(q,qaCurrentChoiceIdx);
  if(ex){
    fb.insertAdjacentHTML('afterend',`<div class="expl-box"><b>解説</b><br>${ex}</div>
      <details class="expl-more"><summary>他の選択肢も確認する</summary>${explItemsHtml(q,0)}</details>`);
  }
  document.getElementById('qaNextBtn').style.display='block';

  const stats=loadStats();
  stats.total++;
  if(isCorrect) stats.correct++;
  stats.last=new Date().toLocaleDateString('ja-JP');
  saveStats(stats);
}

function qaNext(){
  currentIndex++;
  renderQAQuestion();
}

function showQAComplete(){
  showScreen('homeScreen');
  alert('全ての問題を解き終わりました！');
}

// ============================================================
// Timer
// ============================================================
function startTimer(){
  updateTimerDisplay();
  timerInterval=setInterval(()=>{
    remainingSeconds--;
    if(remainingSeconds<=0){
      stopTimer();
      alert('制限時間終了です。');
      showExamResult();
      return;
    }
    updateTimerDisplay();
  },1000);
}
function stopTimer(){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null}
}
function updateTimerDisplay(){
  const h=Math.floor(remainingSeconds/3600);
  const m=Math.floor((remainingSeconds%3600)/60);
  const s=remainingSeconds%60;
  const el=document.getElementById('examTimer');
  el.textContent=(h>0?h+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  el.className='timer';
  if(remainingSeconds<=300) el.classList.add('danger');
  else if(remainingSeconds<=600) el.classList.add('warning');
}

// ============================================================
// Review Wrong
// ============================================================
function reviewWrong(){
  const wrong=[];
  currentQuestions.forEach((q,i)=>{
    if(userAnswers[i]!==q.answer) wrong.push(q);
  });
  if(wrong.length===0){alert('間違えた問題はありません！');return}
  currentQuestions=wrong;
  currentIndex=0;
  qaAnswered=false;
  renderQAQuestion();
  navigateTo('qaScreen');
  document.getElementById('headerSub').textContent='間違えた問題の復習';
}

// ============================================================
// Utilities
// ============================================================
function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

// Init
updateStatsDisplay();
</script>
