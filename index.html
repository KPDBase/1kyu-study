（厳しく）なる。","正しい。引張力を負担する筋かいを保有耐力接合とするには、端部及び接合部の破断耐力を、軸部の降伏耐力に比べ十分大きくして軸部を先に降伏させる必要がある。","正しい。保有耐力横補剛の方法には、梁全長に均等間隔で補剛する方法や、塑性化しやすい梁端部付近を主に補剛する方法などがある。","正しい。繰返し応力を受けない部材及び接合部は、一般に疲労についての検討を必要としない。"],"2024-構造-19":["正しい。圧密対策は、鉛直ドレーン工法で排水距離を短くし、盛土荷重（プレローディング）と組み合わせて圧密時間を短縮する方法が効果的である。","正しい。液状化対策には、深層混合処理工法等による地盤固結や、グラベルドレーン工法等による過剰間隙水圧の消散などがある。","正しい。切土で除去した土の重量より建築物の重量が大きいと、斜面に作用する滑動力が増え、斜面の安定性は低下する。","誤り。砂質土層では、一般に細粒分含有率が大きくなるほど液状化に対する抵抗が増し、液状化発生に対する安全率FLは大きくなる。「小さくなる」は逆である。"],"2024-構造-20":["誤り。一軸圧縮試験は拘束圧を作用させない状態の圧縮強さを求める試験で、主に粘性土の強度を調べる。粘着力と内部摩擦角を求めるのは三軸圧縮試験などである。","正しい。スクリューウエイト貫入試験（旧スウェーデン式サウンディング試験）は、スクリューポイント付きロッドの静的貫入抵抗から地盤の硬軟や締まり具合を評価する。","正しい。平板載荷試験は支持地盤上の平板に載荷して地耐力を求める試験で、載荷板幅の1.5〜2.0倍程度の深さまでの支持力特性を調べられる。","正しい。PS検層は、孔内又は孔近傍で起振した弾性波を受振し、P波及びS波の速度分布を求める試験である。"],"2024-構造-21":["正しい。施工が確実に行える範囲で杭長を設定する場合、杭の長さ径比による許容圧縮力の低減は、一般に考慮しなくてよいとされる。","正しい。液状化のおそれがない地盤では、杭の極限鉛直支持力は極限先端支持力と極限周面抵抗力の和として算定できる。","誤り。群杭では杭同士が地盤を介して影響し合う群杭効果により、杭1本当たりの水平抵抗は単杭より小さくなる。大きくなるとする点が誤り。","正しい。パイルド・ラフト基礎は、直接基礎のべた面と杭の双方で荷重を支えるため、直接基礎に比べ平均沈下量・不同沈下量の低減に有効である。"],"2024-構造-22":["正しい。壁式ラーメン鉄筋コンクリート構造は、壁式鉄筋コンクリート構造より軒の高さの高い建築物に適用できる。","誤り。開口を無いものとみなせるのは開口周比が所定値以下の場合で、住宅用換気扇程度の小開口でも、一般に所定の補強を行うことが前提となる。補強不要とする点が誤り。","正しい。壁式鉄筋コンクリート造の必要壁量は、地震地域係数Zに応じて低減してよいとされている。","正しい。壁梁の幅は、壁梁に接する耐力壁の厚さ以上とする。応力を円滑に伝達させるための規定である。"],"2024-構造-23":["正しい。CFT造では鋼管のコンファインド効果によりコンクリートが拘束されるため、一定の要件のもとで充填コンクリートの圧縮強度を高く評価できる。","正しい。SRC造柱の曲げ終局耐力は、コンクリート、鉄筋、鉄骨それぞれの曲げ終局耐力の和として評価できる（累加強度式）。","誤り。デッキ合成スラブはコンクリートのクリープ等が異なるため、変形増大係数を梁と同じとすることはできない。梁と同じとする点が誤り。","正しい。合成梁の曲げ剛性算定に用いる床スラブの有効幅は、鉄筋コンクリート梁の場合と同じ考え方でよいとされる。"],"2024-構造-24":["誤り。鋼材ダンパーの主架構への接合形式による効率は、層間変形とダンパー変形の関係で決まる。一般には間柱型よりブレース型のほうが効率がよいとされ、記述は逆である。※公式正答に整合させた説明。","正しい。ダンパーが十分に塑性化してエネルギーを吸収するまで、接合部が弾性範囲にあることを確認し、制振効果を確保する。","正しい。免震構造では、一般に上部構造の水平剛性が大きいほど上部構造は剛体的に挙動し、床応答加速度は小さくなる。","正しい。オイルダンパー・粘性ダンパーは速度に応じた減衰力を発揮し、上部構造の応答変位・床応答加速度の低減に有効である。"],"2024-構造-25":["正しい。耐力壁を有する架構では、基礎の浮き上がりが先行して耐力が決まる場合がある。","正しい。剛性率が所定値（0.6）未満の階は剛性が小さく変形が集中するため、層崩壊を起こしやすい。","誤り。振動特性係数Rtは、地盤が軟弱なほど（Tcが大きいほど）周期の長い建築物で大きくなる。したがって軟弱地盤のほうが必要保有水平耐力は大きく、硬質地盤のほうが大きいとする点が誤り。","正しい。限界耐力計算の安全限界固有周期は、保有水平耐力時の各階の水平変形から求めた等価固有周期により計算する。"],"2024-構造-26":["正しい。図は未確認だが、剛心から遠い側や剛心の偏りを是正する側の耐力壁を強化すると、剛心を重心に近づけ偏心を小さくできる。","正しい。図は未確認だが、剛心を重心側へ寄せる位置に耐力壁を追加すれば、偏心が小さくなりねじれを抑えられる。","誤り。耐力壁Cを削除すると、図の配置では剛心が重心から一層離れる方向に移動し、偏心によるねじれが大きくなる。","正しい。図は未確認だが、剛心を重心に近づける側に耐力壁を追加するため、偏心を小さくする方法として適当である。"],"2024-構造-27":["正しい。並列材に構造用合板等を張って荷重を支持する場合は、並列材の曲げ基準強度に割増し係数を乗じてよい。","誤り。無等級材の基準強度の大小関係は、一般にせん断＜引張＜曲げである。曲げ＜引張とする点が誤り。","正しい。木材のクリープ変形は含水率が高いほど大きく、気乾状態より湿潤状態のほうが大きい。","正しい。繊維飽和点から絶乾状態までの収縮率は、繊維方向が最小で、半径方向より年輪の接線方向のほうが大きい。"],"2024-構造-28":["正しい。水中養生は水分が保たれセメントの水和が進むため、気中養生より圧縮強度の増進が大きい。","正しい。AE剤で連行された微細な空気泡が凍結時の膨張圧を緩和し、凍結融解作用に対する抵抗性が増す。","正しい。一軸圧縮を受けるコンクリートの強度時ひずみは、一般に圧縮強度が大きいほど大きくなる。","誤り。円柱コア供試体の圧縮強度は、直径に対する高さの比（h/d）が大きいほど小さくなる。大きくなるとする点が誤り。"],"2024-構造-29":["誤り。SN材のうちシャルピー吸収エネルギーの下限値が定められているのはB種とC種である。A種には規定がなく、いずれにも定められているとする点が誤り。","正しい。SUS304Aの基準強度は235 N/mm²で、板厚40 mm以下のSN400Bの基準強度と同じである。","正しい。LY225などの低降伏点鋼は降伏点が低く延性が高いため、履歴型ダンパーの材料に用いられる。","正しい。BCP325は引張強さの下限が490 N/mm²で、降伏点または耐力の上限・下限が規定されている。"],"2024-構造-30":["正しい。直接基礎の場合に表示すべき事項は、基礎の構造方法及び形式である。","正しい。耐積雪等級は、建築基準法施行令に規定する多雪区域に存する住宅に適用される。","正しい。耐風等級は、暴風に対する構造躯体の倒壊・崩壊等のしにくさと損傷の生じにくさを示す。","誤り。耐震等級は等級1〜3で、要求レベルが最も高いのは等級3である。等級1は建築基準法レベルで最も低い。"],"2023-構造-1":["誤り。図は未確認だが、たわみは荷重・支持条件・スパンの3乗などで決まり、比は16:1となる。4:1とする値は正しい比と一致しない。","誤り。図は未確認だが、正しい比は16:1であり、8:1ではない。たわみ式（Pl³/EIに係数が付く形）から比を求める。","正しい。梁A・Bのたわみは支持条件とスパンから算定でき、その比は16:1となる。スパンの3乗に比例することなどから導かれる。","誤り。図は未確認だが、正しい比は16:1であり、32:1ではない。たわみ公式の係数とスパンの3乗の比で確認できる。"],"2023-構造-2":["誤り。a－b間の軸力はPだが、cの変位は各区間のNl/AEの総和で求めると3Pl/AEとなる。2Pl/AEとする点が誤り。","正しい。釣合いからa－b間の軸力はPで、各区間のNl/AEを足し合わせると、cの軸方向変位は(3l/AE)Pとなる。","誤り。釣合いより、a－b間の軸力はPであり、2Pではない。変位の値も合わない。","誤り。a－b間の軸力は釣合いよりPであり、2Pではない。変位(3l/AE)Pの値のみ正しいが、組合せとして成立しない。"],"2023-構造-3":["誤り。図は未確認だが、崩壊機構に仮想仕事法を適用して求めた崩壊荷重は375 kNであり、225 kNでは小さい。","誤り。図は未確認だが、仮想仕事法による正しい崩壊荷重は375 kNで、300 kNとは一致しない。","正しい。柱・梁の全塑性モーメント（400、200 kN・m）を用い、崩壊機構について外力仕事＝塑性ヒンジの内力仕事とおくと、Pu＝375 kNとなる。","誤り。図は未確認だが、仮想仕事法による正しい崩壊荷重は375 kNであり、500 kNは過大である。"],"2023-構造-4":["正しい。図は未確認だが、柱の曲げモーメントから各柱のせん断力を求めて合計すると、2階に作用する水平荷重P1は100 kNとなる。","正しい。図は未確認だが、梁端の曲げモーメントの和を梁スパンで割って求めた2階梁のせん断力QBは64 kNとなる。","誤り。1階右側柱の軸方向圧縮力NCは、2階梁のせん断力などの釣合いから求めると128 kNにならない。この記述が誤りである。","正しい。図は未確認だが、全体の鉛直力と転倒モーメントの釣合いから、右側支点の鉛直反力Vは152 kNとなる。"],"2023-構造-5":["誤り。図は未確認だが、最大応力の部材が降伏する荷重が塑性崩壊荷重であり、Aσy/3は正しい値と一致しない。","誤り。図は未確認だが、部材軸力の最大値からP＝Aσy/(最大軸力係数)として求めると、Aσy/(3√2)にはならない。","正しい。静定トラスは最大軸力の部材が降伏すると崩壊するため、その部材の軸力＝Aσyとおくと、塑性崩壊荷重はAσy/6となる。","誤り。図は未確認だが、最大軸力部材の降伏から求めた正しい値はAσy/6であり、Aσy/(6√2)ではない。"],"2023-構造-6":["正しい。反力数と部材・ヒンジ条件による判別式（不静定次数）で0となり、安定で静定な構造である。","誤り。図の支持条件（固定＋ローラーで反力4）に斜材が加わる構成では、判別式が正となり不静定構造である。","誤り。ピン接合を含むが斜め部材があるため、判別式の値は静定とならず不静定構造である。","誤り。左下固定、右下ローラーの門型ラーメンは反力が4で、ヒンジがなければ1次不静定構造である。"],"2023-構造-7":["誤り。第三種地盤（沖積層の深さが30 m以上の軟弱地盤等）のTcは0.8秒である。0.2秒は第一種地盤の値で、誤り。","正しい。鉄骨造又は木造の設計用一次固有周期Tは、建築物の高さ(m)に0.03を乗じて算出できる。","正しい。Tの算定に用いる高さは、振動性状を考慮した振動上有効な高さとする場合がある。","正しい。振動特性係数Rtは、TがTcを超えると周期が長いほど小さくなる。"],"2023-構造-8":["正しい。基準風速V0は地域ごとに定められた値で、屋根葺き材と構造骨組で同じ値を用いる。","誤り。ガスト影響係数Gfを考慮するのは骨組用の速度圧などであり、屋根葺き材等の算定にそのままGfを考慮した平均速度圧q̄を用いるとする記述は適当でない。","正しい。V0は稀に発生する暴風時を想定した、地上10 mにおける10分間平均風速に相当する値である。","正しい。Gfは建築物の高さと軒の高さの平均Hが大きいほど、気流の乱れの影響が小さくなり小さくなる。"],"2023-構造-9":["正しい（効果のある補強）。無筋の布基礎にあと施工アンカーで差し筋し、鉄筋コンクリート造の基礎を増し打ちする方法は、耐震性向上に有効である。","誤り（最も効果が低い）。べた基礎は基礎自体が一体の水平面として働き、1階床組の水平剛性への寄与が小さいため、床下地を挽板から構造用合板へ張り替えても耐震性向上への効果は他の方法に比べて小さい。","正しい（効果のある補強）。耐力壁線のずれにより水平力の伝達が不連続になる場合、2階の床下地に構造用合板を直張りして水平構面の剛性を高めることは、耐震性向上に有効である。","正しい（効果のある補強）。吹抜け部をキャットウォークや火打梁で補強すると、水平構面の剛性低下を補え、耐震性の向上に有効である。"],"2023-構造-10":["誤り。各側端部分の必要壁量の算定に用いる階数は、それぞれの側端部分の階数による。建築物全体の階数とする点が誤り。","正しい。張り間方向の存在壁量は張り間方向の耐力壁のみで算定し、桁行方向の耐力壁は考慮しない。","正しい。各側端部分の壁量充足率が全て1を超えていれば、壁率比の確認は不要である。","正しい。偏心率が0.3以下であることを確認した場合は、「木造建築物の軸組の設置の基準」によらなくてよい。"],"2023-構造-11":["正しい。耐力壁の厚さの目安は階高の1/30以上かつ120 mm以上程度で、4 m/30＝約133 mmのため150 mmは適合する。","正しい。柱の一辺は階高の1/10以上が目安で、4 m/10＝400 mmのため600 mmは適合する。","正しい。床スラブの厚さは短辺内法長さの1/40以上かつ所定値以上が目安で、150 mmは適合する。","誤り。片持ちスラブの支持端の厚さは、はね出し長さの1/10以上が目安で、2 m×1/10＝200 mm必要である。150 mmでは不足し、1/15とする点が誤り。"],"2023-構造-12":["正しい。柱のコンクリートの設計基準強度が高いほど付着強度が大きくなり、必要定着長さは短くなる。","誤り。フック付き定着の必要定着長さは、フックの折曲げ角度（90度・135度・180度）によって短くならず、同じ扱いとなる。180度のほうが短いとする点が誤り。","正しい。横補強筋で拘束されたコア内に定着するほうが、割裂等が生じにくく、必要定着長さは短くできる。","正しい。上端筋・下端筋を柱内でU字形に折り曲げて連続させる場合は、折曲げ角度90度のフックの定着長さの取り方を準用してよい。"],"2023-構造-13":["正しい。梁の短期許容せん断力は、せん断スパン比による割増しを考慮して計算できる。","正しい。引張鉄筋比が釣合い鉄筋比以下の場合、許容曲げモーメントはat・ft・jで算定できる。","誤り。耐力壁の長期許容せん断力は、コンクリートの許容せん断応力度のみで算定し、横筋による効果は考慮しない。短期で壁筋の効果を考慮する点と区別する。","正しい。柱の許容曲げモーメントは、圧縮縁のコンクリート、圧縮鉄筋、引張鉄筋のそれぞれが許容応力度に達する場合のうち最小のものとする。"],"2023-構造-14":["正しい。両端が曲げ降伏する梁は、断面が同じなら内法スパンが短いほどせん断力の影響が増し、靱性が低下する。","誤り。曲げ降伏する柱では、引張鉄筋比が大きいほど圧縮縁のコンクリートの負担が増し、靱性は低下する。向上するとする点が誤り。","正しい。軸方向応力度が小さい柱では、平均せん断応力度が小さいほど曲げ降伏が先行しやすく、靱性は向上する。","正しい。壁式構造の耐力壁は、壁板両端に柱を持つラーメン構造の耐力壁より拘束が小さく、靱性は低下する。"],"2023-構造-15":["正しい。H形鋼梁の許容曲げ応力度は、基準強度、断面寸法、モーメント分布、圧縮フランジの支点間距離（横座屈）を考慮して計算する。","誤り。多数回の繰返し応力を受ける継手では、高力ボルト摩擦接合は疲労強さが高く、完全溶込み溶接へ変更しても基準疲労強さは高まらない。","正しい。柱継手は応力が小さく施工しやすい床上約1 m付近に設けるのが一般的である。","正しい。露出型柱脚の許容応力度設計では、ベースプレートを断面とするRC柱とみなし、引張側アンカーボルトを鉄筋とみなす方法がある。"],"2023-構造-16":["正しい。部分溶込み溶接は、ルート部に引張応力や付加曲げが生じる片面溶接には用いることができない。荷重の偏心などでルートに引張が作用する場合は完全溶込み溶接とする。","正しい。突合せ溶接部は、母材の種類に適合した溶接材料を用いれば、溶接部の許容応力度を母材と同じ値とできる。","正しい。高力ボルト摩擦接合と溶接を併用する継手では、施工順序によって耐力の加算の可否が決まる。この記述は、加算できる扱いとして正しいものとして示されている。","誤り。高力ボルトM22の摩擦接合では、ボルト孔径は公称径に2.0mmを加えた24mm程度とする。25mmとするのは大きすぎで、誤りである。"],"2023-構造-17":["正しい。幅厚比の制限は局部座屈防止のためのもので、降伏点が高い鋼材ほど局部座屈しやすいため、制限値は降伏点に応じて厳しくなる。","正しい。角形鋼管は断面のねじり剛性が大きく横座屈を生じにくいため、材長によらず許容曲げ応力度を許容引張応力度と同じとしてよい。","正しい。H形鋼の幅厚比の上限値は、塑性変形能力確保のため定められている。フランジよりウェブの方が大きな値が許容される。","誤り。弾性たわみは鋼材のヤング係数と断面二次モーメントで決まり、降伏点には影響されない。高降伏点鋼材を使ってもたわみは小さくならない。"],"2023-構造-18":["誤り。イとハの組合せは適当でない。X形筋かい構面は、圧縮側で座屈する筋かいの影響によりスリップ型の履歴となり、ラーメン構面は紡錘形の履歴となる点で判断する（図が確認できないため一般論）。","誤り。イとニの組合せは適当でない。筋かい構面とラーメン構面の履歴ループの形状（スリップ型か紡錘形か）の対応が合わない（図が確認できないため一般論）。","正しい。ロとハの組合せが適当である。筋かい構面は座屈によるスリップ型、ラーメン構面は安定した紡錘形の履歴を示し、エネルギー吸収性状が対応する。","誤り。ロとニの組合せは適当でない。ロは適当でも、ニの履歴ループの形状が構面の特性と対応しない（図が確認できないため一般論）。"],"2023-構造-19":["誤り。砂質土の内部摩擦角は、N値が大きい（締まった砂ほど）ほど大きくなる。N値が大きくなるほど小さくなるとの記述は逆である。","正しい。含水比は土粒子に対する水の質量比で、粘土などの細粒分が多いほど保水量が多くなり、一般に大きくなる。","正しい。地盤はせん断ひずみが大きくなるほど非線形性が強まり、せん断剛性は低下し、減衰定数は増大する。","正しい。基礎底面以深に液状化のおそれのある層がある場合は、液状化の程度、層厚、上部地層の構成を考慮し、沈下などの影響を検討する。"],"2023-構造-20":["正しい。重要な建築物では、法令の要求に加え大地震後の継続使用性を目標とする場合、液状化などの地盤変動の可能性を考慮し、終局時を想定した検討を行う。","正しい。同じ鉛直荷重では、群杭は応力の重なりにより影響範囲が広がるため、単杭に比べて沈下量が大きくなる。","誤り。杭先端の地盤の許容応力度は、一般に、打込み杭が最も大きく、次いで埋込み杭、場所打ち杭の順で小さくなる。記述は大小関係が逆である。","正しい。砂質地盤の極限周面抵抗力度は、杭の施工法により異なり、一般に打込み杭より場所打ちコンクリート杭の方が大きく設定される。"],"2023-構造-21":["誤り。L型擁壁では、底版直上にある土の重量は転倒に対する抵抗要素として考慮できる。考慮できないとの記述は誤りである。","正しい。常時の土圧は主働土圧で、受働土圧よりも小さい。受働土圧は壁が土側に押し込まれるときに生じる大きな土圧である。","正しい。背面土の内部摩擦角が大きいほど主働土圧係数が小さくなり、擁壁に作用する土圧は小さくなる。","正しい。底版底面に突起（突起付き）を設けると、地盤との間のせん断抵抗が増し、滑動に対する抵抗が大きくなる。"],"2023-構造-22":["誤り。保有水平耐力計算における部材種別判定では、PC鋼材の有効プレストレス力を軸方向力に含めて考慮する。考慮しないとの記述は誤りである。","正しい。PC鋼材のリラクセーションやコンクリートのクリープ・乾燥収縮により、導入プレストレス力は時間とともに減少する。","正しい。PC鋼材の曲げ半径が小さい箇所では、内側のコンクリートに大きな局部圧縮応力が生じるため、その検討が必要である。","正しい。長期たわみの算定では、PC鋼材の曲げ耐力への寄与を考慮して、変形増大係数を低減することができる。"],"2023-構造-23":["正しい。完全合成梁とする場合、合成梁断面が全塑性モーメントを発揮するのに必要な本数以上の頭付きスタッドを設ける。","正しい。SRC造で地震時に引張軸力が生じる1階鉄骨柱脚は、引抜きに対する抵抗を確保するため、原則として埋込み形式とする。","正しい。RC柱・S梁の混合構造では、柱梁接合部のせん断破壊や、柱頭・柱脚の支圧破壊が生じないことを確認する。","誤り。外周が鉄骨骨組でコアがRC壁の混合構造では、剛性の大きいコアのRC壁が主に水平力を負担し、外周の鉄骨骨組は主に鉛直荷重を負担する。記述は逆である。"],"2023-構造-24":["正しい。構造特性係数Dsは、減衰性と靱性に応じて必要保有水平耐力を低減する係数である。","誤り。鋼材ダンパーは鋼材の塑性変形によりエネルギーを吸収するので、弾性範囲に留まる小さな地震動ではエネルギー吸収能力は発揮されない。","正しい。ダンパーの接合部や周辺部材の変形、取り付く柱の軸変形による架構の曲げ変形があると、ダンパーに生じる変形が小さくなり効率が低下する。","正しい。積層ゴムは、座屈しない範囲では一定の水平剛性を示し、さらに変形が進むと剛性が増大（ハードニング）して、最終的にゴム層の破断に至る。"],"2023-構造-25":["正しい。地下部分の地震力は、当該部分の固定荷重と積載荷重の和に水平震度kを乗じて求める。","正しい。地震地域係数Zは地域により定まる値であり、許容応力度設計用地震力でも必要保有水平耐力の算定でも同じ値を用いる。","正しい。下階がSRC造、上階が鉄骨造の場合、2階以上の必要保有水平耐力は、その階の構造種別である鉄骨造のDsを用いて計算する。","誤り。限界耐力計算では、塑性化が進むほど履歴によるエネルギー吸収が増え、減衰特性を表す数値（減衰定数）は大きくなる。小さくできるとの記述は誤りである。"],"2023-構造-26":["正しい。許容応力度計算で用いる中地震時程度の荷重による変形に対し、建築物の衝突による損傷が生じないことを確かめるのは妥当である。","正しい。RC造で地下も含めて別棟とする場合、大地震時の保有水平耐力計算に対しては、簡便的にエキスパンションジョイント部の高さHに対しH/50以上の間隔を確保する方法がある。","正しい。地下部分が一体で地上を別棟とする場合、一次設計では、地上部分のルート1・2で必要となる割増し規定は、地下部分の検討には適用しなくてよい。","誤り。1階床スラブを一体の剛床と仮定しても、別棟の地震力が局部的に伝わるため、スラブでの局部的な地震力の伝達の検討は省略できない。"],"2023-構造-27":["正しい。繊維直交方向の圧縮によるめり込みは、荷重が増加しても急に破壊せず粘り強く変形が進む非脆性的な性状を示す。","誤り。繊維直交方向の引張による割り裂きは、変形がほとんどなく突然破壊する脆性的な性状を示す。","誤り。繊維平行方向の圧縮による全体座屈は、座屈発生後に急激に耐力が低下する脆性的な性状を示すとされる。","誤り。繊維平行方向の引張による破断は、ほとんど塑性変形せずに突然破壊する脆性的な性状を示す。"],"2023-構造-28":["正しい。せん断弾性係数Gは、ヤング係数Eに比例し（G=E/2(1+ν)）、ヤング係数が大きいほど大きい。","正しい。軽量コンクリート1種の線膨張係数は約1×10^-5/℃で鋼材とほぼ等しく、鋼材と同じ値を用いることが多い。","正しい。軽量コンクリート1種のヤング係数は、単位体積質量が小さいため、同じ強度の普通コンクリートより小さい。","誤り。軽量コンクリート1種の許容せん断応力度は、普通コンクリートの値の0.9倍とされ、同じではない。"],"2023-構造-29":["正しい。SN材B種・C種は、降伏比だけでなく降伏点の範囲も規定され、設計で想定した降伏メカニズムを実現しやすい。","正しい。ステンレス鋼SUS304Aは降伏点が明確でないため、0.1%オフセット耐力をもとに基準強度が定められている。","誤り。同じ鋼塊から圧延された鋼材の降伏点は、板厚が厚いほど低くなる傾向がある。板厚の厚いものの方が高くなるとの記述は誤りである。","正しい。降伏比は降伏点÷引張強さで、325÷490≒0.66、すなわち約66%である。"],"2023-構造-30":["正しい。特定天井の技術基準は、中地震時に天井の損傷を防止し、それを超える地震時にも脱落の低減を図ることを目標としている。","誤り。既存建築物の増改築では、ネットやワイヤーなどによる落下防止措置を講じることで、新築と同様の基準適合を求めない緩和が認められる場合がある。","正しい。免震構造で地震時の加速度が抑えられていても、特定天井についての構造耐力上の安全性の検証は必要である。","正しい。天井と周囲の壁等に隙間を設けない構造であっても、地震時の天井材の脱落に対する安全性の検証は必要である。"],"2022-構造-1":["誤り。軸力が8a²σyで、全塑性状態の応力分布から求めた曲げモーメントがこの値と異なる。モーメントは応力分布の力と図心からの距離の積で求め直すと52a³σyとなる。（図が確認できないため一般論）","正しい。全塑性状態の応力度分布について、圧縮側と引張側の力の差から軸力N=8a²σy、図心まわりのモーメントからM=52a³σyが得られる。","誤り。軸力・曲げモーメントとも応力度分布から求めた値と一致しない。軸力は圧縮側と引張側の合力の差で、8a²σyである。（図が確認できないため一般論）","誤り。軸力を12a²σyとするのは、圧縮側と引張側の合力の差を正しく求めていない。軸力は8a²σyである。（図が確認できないため一般論）"],"2022-構造-2":["誤り。断面の組合せによる曲げ剛性の大小関係が合わない。各梁のEIを比べると、AとBは等しく、Cの方が大きいので、たわみの大小関係と一致しない。（図が確認できないため一般論）","誤り。δA=δB<δCとなるのは、Cの曲げ剛性が最も小さい場合である。Cは最も剛性が大きいので、この関係にならない。（図が確認できないため一般論）","誤り。δB=δC<δAとなるのは、Aの曲げ剛性が最小の場合である。AとBの剛性が等しいため成り立たない。（図が確認できないため一般論）","正しい。中央集中荷重のたわみはPl³/48EIで、EIが大きいほど小さい。AとBは等しく、Cは断面の組合せにより曲げ剛性が最も大きいので、δC<δA=δBとなる。"],"2022-構造-3":["誤り。A点の曲げモーメントがゼロとなる条件を式で立てると、wlとPの比は1：1にならない。（図が確認できないため一般論）","誤り。wl：P=1：2では、A点の曲げモーメントのつり合い式を満たさない。（図が確認できないため一般論）","正しい。等分布荷重による曲げモーメントと水平荷重Pによる曲げモーメントがA点でつり合う条件から、wl：P=2：1となる。","誤り。wl：P=3：1では、A点の曲げモーメントのつり合い式を満たさない。（図が確認できないため一般論）"],"2022-構造-4":["正しい。崩壊機構における仮想仕事の釣合いにより、水平荷重Pu=2Mp/lが得られる。","正しい。崩壊時のつり合いから、柱ABにはMp/lの引張力が生じる。","誤り。梁端部に塑性ヒンジが生じる崩壊機構でも、C点の曲げモーメントはつり合いから0にはならない。0とする記述が不適当である。","正しい。モーメントのつり合いから、E点の鉛直反力VEはMp/lとなる。"],"2022-構造-5":["正しい。節点法・切断法で各部材の軸方向力を求めると、引張を＋として、NA<NB<NCの関係になる。","誤り。NB<NA<NCの順にはならない。各部材の軸方向力の符号と大きさを求めると、NAが最も小さい。（図が確認できないため一般論）","誤り。NC<NA<NBとはならない。NCは最も大きい値である。（図が確認できないため一般論）","誤り。NC<NB<NAとはならない。大小関係が逆である。（図が確認できないため一般論）"],"2022-構造-6":["誤り。このせん断力図は、構造物のつり合いから求めた各部材のせん断力の値・符号と一致しない。（図が確認できないため一般論）","誤り。このせん断力図は、支点反力・各部材のせん断力の値および符号と一致しない。（図が確認できないため一般論）","誤り。このせん断力図も、荷重点前後のせん断力の変化や符号が構造物のつり合いと一致しない。（図が確認できないため一般論）","正しい。鉛直荷重Pに対する反力と各部材のせん断力をつり合いから求めると、荷重点前後での変化と符号が、この図と一致する。"],"2022-構造-7":["正しい。固有周期はT=2π√(m/K)で、剛性Kが大きいほど短い。梁剛体の柱の水平剛性は12EI/h³×本数などで決まり、AはBとCより剛性が大きく、TA<TB=TCとなる。","誤り。TB<TA<TCとなるのは、BがAより剛性が大きく、CがAより小さい場合である。そのような剛性の関係にならない。（図が確認できないため一般論）","誤り。TB=TC<TAとなるのは、AがBとCより剛性が小さい場合である。実際はAの剛性が大きく、成り立たない。（図が確認できないため一般論）","誤り。TC<TA<TBとなる剛性の大小関係にはならない。柱の曲げ剛性と高さから求めた剛性の大小と一致しない。（図が確認できないため一般論）"],"2022-構造-8":["正しい。屋根面で積雪量が不均等となるおそれがある場合は、その影響を考慮して積雪荷重を計算しなければならない。","正しい。垂直積雪量を1mまで減らして積雪荷重を計算した場合は、出入口や主要な居室などの見やすい場所に軽減の実況その他必要な事項を表示する。","正しい。緩勾配屋根の大スパンなどでは、屋根版の構造種別に応じて、積雪後の降雨を考慮した割増係数を乗じる場合がある。","誤り。多雪区域は、垂直積雪量が1m以上の区域、または積雪の初終間日数の平年値が30日以上の区域である。30日以上なら垂直積雪量が1m未満でも多雪区域となる。"],"2022-構造-9":["正しい。ねじれによる被害防止のため、偏心率による確認のほか、四分割法で壁率比0.5以上を確保する。","誤り。出隅の通し柱と胴差の仕口は、かど金物程度では不十分で、羽子板ボルトや込み栓などで十分な引張耐力を持つ接合とする。","正しい。隅柱を通し柱としない場合、管柱相互は通し柱と同等以上の耐力を有するよう金物などで補強する。","正しい。筋かいが間柱と交差する部分では、筋かいの耐力を保つため、間柱を欠き取って筋かいは欠込みをせず通す。"],"2022-構造-10":["正しい。壁量充足率は、側端部分それぞれについて、存在壁量を必要壁量で除して求める。","誤り。耐力壁の壁倍率の和は5が上限である。1.5+3.7=5.2としても、壁倍率は5として存在壁量を算定する。","正しい。地震力による必要壁量は、床面積当たりで定まるため、張り間方向と桁行方向とで同一階では同じ値となる。","正しい。風圧力に対する必要壁量は、見付面積に乗ずる数値（単位見付面積当たりの必要壁量）を階ごとに区別せず同じ値で用いる。"],"2022-構造-11":["正しい。断面内に打継ぎ部を設ける基礎梁では、あばら筋を一体で配筋できないため、必要な定着長さを確保したうえでフック付き重ね継手とすることが認められる。","誤り。片側のみにスラブが取り付く梁では、あばら筋の末端を90度フックとしてよいのは両側にスラブが付く場合等に限られる。片側スラブの梁では末端を135度フックとするのが原則である。","正しい。スパンが短い大梁はせん断力が大きくせん断破壊しやすいため、四隅以外の主筋を対角線上に配置する対角線配筋でせん断抵抗と靱性を高めることがある。","正しい。柱梁接合部のせん断補強筋比は0.2％以上とされており、0.3％相当の帯筋を配筋することは適切である。"],"2022-構造-12":["正しい。梁幅を大きくすると、せん断力に対する余裕が増すとともに圧縮応力度が低減して曲げ降伏後の圧縮域の余裕が増し、靱性の向上が期待できる。","誤り。圧縮側の鉄筋は、コンクリートのクリープによる圧縮変形を抑えて長期たわみを減らす効果がある。圧縮側鉄筋量を減らすとクリープたわみはかえって増大する。","正しい。耐力壁は一般に付着割裂破壊が生じにくいため、付着割裂破壊の検討を省略してよい。","正しい。下階の柱抜けでフィーレンディール架構が形成される場合、剛床仮定は成立しないので設けず、上下弦材の梁は軸方向力を考慮して断面算定する。"],"2022-構造-13":["正しい。外壁から突出する長さが2m以下の片持ちバルコニーは、鉛直振動の励起が生じにくいものとして、鉛直震度による割増しを行わなくてよい。","正しい。引張鉄筋比が釣合い鉄筋比以下の梁の短期許容曲げモーメントは引張鉄筋の許容引張応力度に比例するため、SD390への変更で大きくなる。","誤り。梁の上端筋はブリーディング等により付着性状が劣るため、許容付着応力度は下端筋より小さい値を用いる。大きい値とする記述は誤りである。","正しい。耐力壁の短期許容せん断力は、壁板の許容せん断力と側柱の許容せん断力の和として求める。"],"2022-構造-14":["正しい。引張側にスラブが取り付く大梁では、スラブ有効幅内のスラブ筋も曲げ抵抗に寄与するため、スラブ筋量が多いほど曲げ終局モーメントは大きくなる。","正しい。大梁のせん断終局耐力は、せん断スパン比（せん断スパン／有効せい）が小さいほどアーチ作用等により大きくなる。","誤り。柱のせん断終局耐力は、一般に（限度内で）軸方向圧縮応力度が大きいほど大きくなる。小さいほど大きくなるとする記述は誤りである。","正しい。柱梁接合部のせん断終局耐力は、接合部の有効幅に関係し、取り付く大梁の幅が大きいほど大きくなる。"],"2022-構造-15":["正しい。梁せいがスパンの1/15以下の場合は、たわみの最大値を有効長さで除した値が所定値以下であることを確認すれば、使用上の支障が起こらないことを確かめたものとされる。","正しい。埋込み型柱脚では、鉄骨の曲げモーメントとせん断力を、埋込み部の上部と下部のコンクリートの支圧により基礎に伝達する設計とする。","正しい。冷間成形角形鋼管柱のルート1-1では、標準せん断力係数C0を0.3以上とし、柱の設計用応力を割増して検討する。","誤り。梁端部が塑性化する梁では、一次設計の許容曲げ応力度を圧縮フランジの支点間距離で算定しただけでは十分な塑性変形能力の確保は判断できない。塑性化領域には別途横補剛の配置等が必要である。"],"2022-構造-16":["正しい。柱の限界細長比は、基準強度Fが大きいほど小さくなる。強度の高い鋼材ほど細長比の制限が厳しくなる。","誤り。床の鉛直方向の固有振動数は、梁の断面二次モーメントが大きく剛性が高いほど高くなる。断面二次モーメントを小さくすると固有振動数は低くなる。","正しい。座屈軸まわりの断面二次半径が小さいほど細長比が大きくなり、許容圧縮応力度は小さくなる。","正しい。弱軸まわりに曲げを受けるH形鋼は横座屈を生じないため、幅厚比の制限に従う場合、許容曲げ応力度を許容引張応力度と同じ値とできる。"],"2022-構造-17":["誤り。フランジ幅が大きいほど横座屈に対する抵抗が大きくなり、必要な横補剛の箇所数は少なくなる。多くなるとする記述は誤りである。","正しい。軽量な建築物では暴風時の引抜き力が支配的になるため、柱継手・柱脚の断面算定では積載荷重を無視した応力の組合せについても検討する。","正しい。細長比の大きな筋かいは強度抵抗型、小さな筋かいはエネルギー吸収型であり、中間領域の筋かいは不安定な挙動を示すことが多い。","正しい。冷間成形角形鋼管は板が薄く、筋かいの取付け部で局部変形が生じやすいため、補強を行う必要がある。"],"2022-構造-18":["正しい。入熱量やパス間温度が過大になると溶接部の強度や靱性が低下するため、規定値以下になるよう管理する。","正しい。ノンスカラップ工法はスカラップ底への応力集中やひずみ集中を避けられるため、梁端部の塑性変形能力の向上が期待できる。","正しい。高力ボルト摩擦接合部に引張力が同時に作用すると摩擦力が減少するため、引張応力度に応じて許容せん断耐力を低減する。","誤り。降伏引張耐力は全断面積に基づいて算定し、孔欠損や片側接合による偏心の影響を考慮した有効断面積は破断耐力の算定で用いる。降伏耐力で孔欠損を引いた有効断面積とするのは不適当である。"],"2022-構造-19":["正しい。基礎スラブの自重は地盤に直接支持され、スラブの部材応力には寄与しないため、部材応力算定用の接地圧では一般に自重を考慮しなくてよい。","正しい。受働土圧は、壁が地盤を押す方向に変位して地盤が抵抗する際に発揮される土圧で、変位とともに増加し最終的に一定値に落ち着く。","誤り。液状化のおそれのある砂質地盤では、令に規定された表の許容応力度の数値をそのまま用いることはできず、液状化の影響を別途検討する必要がある。","正しい。同一砂質地盤で同じ接地圧のとき、即時（弾性）沈下量は基礎幅が大きいほど大きくなる。"],"2022-構造-20":["正しい。杭先端の支持力を検討するため、杭先端から下方に必要な深さまでボーリング調査を行う。","誤り。圧密試験は粘性土の圧密沈下量や沈下速度を推定するための試験であり、砂質土層の沈下検討に用いるのは不適当である。","正しい。杭の水平抵抗の検討では、ボーリング孔壁を用いた孔内水平載荷試験により地盤の変形係数を推定できる。","正しい。液状化判定のための粒度試験には、標準貫入試験用サンプラーで採取した乱した試料を用いてよい。"],"2022-構造-21":["正しい。砂質地盤の極限周面摩擦力度は、場所打ちコンクリート杭のほうが、杭周固定液を使用した埋込み杭より大きい。","正しい。杭の引抜き方向の許容支持力の計算では、長期・短期ともに杭の有効自重（自重から浮力を減じた値）を考慮できる。","誤り。軟弱地盤では、地盤の水平変位（地盤変位）により杭に生じる応力も無視できない。慣性力の検討だけでなく地盤変位による応力も考慮する必要がある。","正しい。同一条件で杭頭の固定度が高いほど、杭頭の曲げモーメントは大きくなる（杭頭の変位は小さくなる）。"],"2022-構造-22":["正しい。PC構造は長スパンに適し、ひび割れが生じにくいため鋼材の防食性は高い。","正しい。安全限界時の減衰特性は、一般にPC造の部材のほうがRC造の部材より小さい。","正しい。PC鋼材で圧着接合した接合面のせん断耐力は、有効プレストレス力に摩擦係数を乗じて求めるのが一般的である。","誤り。防錆材で被覆されたアンボンド緊張材を用いる場合は、シース内にグラウトを注入しなくてもよい。グラウト注入が必須となるのは付着のある（ボンド）工法である。"],"2022-構造-23":["誤り。SRC柱の短期せん断に対する検討では、鉄骨部分とRC部分の許容せん断力の和を設計用せん断力が下回らない確認を行うが、各部分の算定方法や適用条件の扱いが規準に従っていない点が不適当とされる。※要確認","正しい。SRC造の柱梁接合部では、梁の鉄骨ウェブに孔をあけて帯筋を貫通させて配筋してよい。","正しい。壁式RC構造は耐震強度が大きい反面、ラーメン構造に比べて優れた靱性は期待できない。","正しい。階高が規定値を超える壁式RC造では、層間変形角が制限値以下であること、保有水平耐力が必要保有水平耐力以上であることの確認が必要となる。"],"2022-構造-24":["正しい。積層ゴムアイソレータの座屈応力度は、一次形状係数S1が大きいほど（ゴム層が薄いほど）大きくなる。","誤り。制振構造は、ダンパー等で減衰（エネルギー吸収）を付加して応答を低減するものであり、固有周期を長くして地震力を低減するのは免震構造の原理である。","正しい。制振ダンパーを用いる建築物のモデル化では、ダンパー取付け部周辺の変形を適切に評価する必要がある。","正しい。耐震改修には強度補強・靱性補強・損傷集中の回避のほか、減築により地震力を低減する方法がある。"],"2022-構造-25":["正しい。Aiは、上階ほど、また設計用一次固有周期Tが長いほど大きくなる。","正しい。方向ごとに構造特性が異なる場合、張り間方向と桁行方向で異なる耐震計算ルートを適用してよい。","誤り。形状特性を表す係数Fesは、各階ごとに剛性率に応じたFsと偏心率に応じたFeから算出する。全階共通の最大値を一つ用いるのではない。","正しい。限界耐力計算を行う場合、耐久性等関係規定を除き、構造強度に関する仕様規定は適用しなくてよい。"],"2022-構造-26":["正しい。RCスラブを用いた鉄骨造の多層骨組では、水平力を各骨組に伝達するため、スラブと鉄骨梁をシアコネクター等で緊結する。","正しい。連層耐力壁に接続する境界梁は、壁の回転による基礎の浮き上がりを抑える効果がある。","正しい。平面的に構造種別が異なる建築物は、エキスパンションジョイントで分離するのが原則だが、力の伝達を考慮すれば一体設計も可能である。","誤り。構造特性係数Dsは、架構が靱性に富むほど小さくすることができる。大きくできるとする記述は誤りである。"],"2022-構造-27":["誤り。繊維飽和点以下の範囲では、含水率が小さくなるほど木材の強度や弾性係数は大きくなる。小さくなるとする記述は誤りである。","正しい。積雪時の許容応力度計算では、木材の繊維方向の短期許容応力度を所定の割合（0.8倍）に減じた値とする。","正しい。木材の熱伝導率は普通コンクリートに比べて小さく、断熱性に優れる。","正しい。腐朽菌の繁殖には酸素・温度・水分・栄養源が必要で、いずれか一つを欠けば腐朽を防止できる。"],"2022-構造-28":["正しい。コンクリートの引張強度は一般に圧縮強度が大きいほど大きい。","正しい。圧縮強度が大きいコンクリートは組織が緻密で水セメント比も小さいため、中性化速度は遅い。","正しい。単位水量が大きいほど乾燥収縮が大きくなり、ひび割れが発生しやすい。","誤り。水和熱によるひび割れは単位セメント量が大きいほど発生しやすく、単位セメント量が小さいほど発生しにくい。小さいほど発生しやすいとする記述は誤りである。"],"2022-構造-29":["正しい。硫黄は不純物で、含有量が少ないほどシャルピー吸収エネルギーや板厚方向の絞り値が大きくなる。","正しい。極端に小さい曲げ半径で冷間曲げ加工をすると、加工硬化で強度が上昇し、変形性能が低下する。","誤り。SN材のC種は板厚方向の絞り値（Z方向特性）が規定されており、通しダイアフラム等の板厚方向に引張力を受ける部位に用いられる。制限がないとする記述は誤りである。","正しい。SN400Aは降伏点の下限のみが規定されており、降伏後の変形性能が保証されないため、弾性範囲で使用する部位に用いる。"],"2022-構造-30":["誤り。完全スリットを設けても、梁剛性の算定にあたっては腰壁部分の影響を一切考慮しなくてよいとは限らず、不適当とされる。※要確認","正しい。木質構造の採用や型枠用合板の使用量低減など、環境負荷低減に寄与する設計が求められている。","正しい。高さ1.2mを超える補強コンクリートブロック塀は、所定の間隔で控壁を設け、必要な根入れ深さ等を確保した基礎とする。","正しい。特定天井の構造方法には、壁等と天井面との間に隙間を設ける方法と設けない方法がある。"],"2021-構造-1":["誤り。引張縁・圧縮縁の応力度は軸力成分と曲げ成分の和で、図の条件では平均応力度4、曲げ応力度20と整合する。長方形断面の最大せん断応力度は平均値の1.5倍となるため、0.50は誤りである。","正しい。σ＝N/A±M/Zで軸力による圧縮4と曲げによる±20から縁応力度は＋16と－24となり、長方形断面の最大せん断応力度は平均値の1.5倍の0.75となる。","誤り。縁応力度の＋26、－34は、軸力成分と曲げ成分の関係が整合しない値である。また最大せん断応力度0.50は平均せん断応力度であり、1.5倍していない。","誤り。縁応力度の＋26、－34は、軸力と曲げによる値と整合しない。せん断応力度0.75は妥当だが、縁応力度が誤っている。"],"2021-構造-2":["正しい。反力は荷重と支持条件から静的につり合いで定まり、図の条件では1:1:1となる。","正しい。最大曲げモーメントは荷重点位置や支持条件で決まり、記載の2:1:2は妥当な比である。","正しい。最大せん断力は支点反力に等しく、1:1:1となる。","誤り。たわみはスパンの3乗に比例して支持条件ごとに異なり、曲げモーメントの比とは一致しない。荷重点のたわみの比2:1:2は図の条件から求まる値と合わない。"],"2021-構造-3":["誤り。α＝1/2ではA点の曲げモーメントを0にできず、モーメントのつり合いから求まる値と一致しない。","正しい。A点の曲げモーメントを鉛直荷重Pによるものと水平荷重αPによるものの釣り合いで0とおくと、α＝1となる。","誤り。α＝3/2ではA点のモーメントは0にならず、つり合い式の解と一致しない。","誤り。α＝2ではA点のモーメントは0にならず、つり合い式の解と一致しない。"],"2021-構造-4":["正しい。梁のせん断力Qbは、梁端の全塑性モーメントの和を梁長で割った値として、図の寸法から妥当な値となる。","正しい。鉛直反力Vは、梁端のせん断力の釣り合いから求まる値として妥当である。","正しい。水平荷重Pは、崩壊メカニズムでの仕事の釣り合いから求めた値として妥当である。","誤り。柱のせん断力Qcは、柱両端の全塑性モーメントの和を柱の高さで割って求める。4Mp/lとする値は釣り合いから求まる値と合わない。"],"2021-構造-5":["誤り。トラスCは水平材の断面積が2aと大きく伸びが小さいため、δCはδAより小さくなる。δA＝δCではない。","誤り。トラスCは水平材の断面積が大きくδCが最も小さくなり、δA＜δCとはならない。またδAとδBは等しい。","正しい。トラスAとBは部材断面積が同じで水平変位が等しく、トラスCは水平材の断面積が2aで伸びが小さいため、δC＜δA＝δBとなる。","誤り。δAとδBは部材の力と断面積が同じで等しく、δA＜δBではない。"],"2021-構造-6":["正しい。長柱の弾性座屈荷重はPe=π²EI/lk²で、正方形断面を保つと断面二次モーメントIは断面積の2乗に比例するため、断面積が2倍ならPeは4倍になる。","正しい。Peは曲げ剛性EIに比例するので、ヤング係数Eが2倍になればPeも2倍になる。","誤り。一端自由他端固定の座屈長さは2lで、両端ピン(l)より長い。Peは座屈長さの2乗に反比例するため、両端ピンの1/4と小さくなる。","正しい。一端ピン他端固定の座屈長さは約0.7lで、両端ピン(l)より短い。したがって両端ピンのほうが座屈荷重は小さくなる。"],"2021-構造-7":["誤り。変位応答スペクトルは、一般に周期が長くなるほど大きくなり、長周期側では地盤の最大変位に近づく。周期が長くなるほど小さくなるわけではない。","正しい。固有周期T=2π√(m/k)であり、質量が同じなら水平剛性が大きいほど固有周期は短くなる。","正しい。固有周期は高次になるほど短くなり、一次固有周期が最も長い。したがって一次は二次より長い。","正しい。減衰定数は一般にRC造は0.03程度、鉄骨造は0.02程度とされ、RC造のほうが内部粘性減衰は大きい。"],"2021-構造-8":["誤り。積載荷重(床の構造計算用)は住宅の居室1,800、事務室2,900、教室2,300N/m²であり、大小関係は住宅<教室<事務室となる。記述の順序は誤り。","正しい。地震層せん断力Qiは上階の重量の和に応じて求められ、下層ほど大きくなるので、最下層で最大となる。","正しい。多雪区域では、地震時や暴風時の短期の検討でも積雪荷重を考慮する(地震時は0.35Sなど)。","正しい。ピーク風力係数は、局部風圧を対象に、全風向を考慮した場合の最大値に基づいて定められている。"],"2021-構造-9":["正しい。側端部分(各辺から1/4の範囲)の必要壁量は、側端部分の床面積に単位床面積当たり必要壁量15cm/m²を乗じて求める。図の寸法から2.4mとなる。","正しい。側端部分の必要壁量は面積×15cm/m²で求め、この記述の1.2mは側端部分の床面積に整合する数値である。","誤り。X方向の壁率比は、側端部分の壁量充足率の小さいほうを大きいほうで除して求める。図の耐力壁配置から算定すると0.5にはならない(図の詳細は文章からは確認不可)。","正しい。Y方向の壁率比も同様に充足率の小さいほう/大きいほうで求め、0.5となる。壁率比は0.5以上が必要である。"],"2021-構造-10":["誤り。構造用合板を同一面に2枚重ねて釘打ちしても、倍率を単純に2倍として加算することはできない。倍率は仕様ごとに告示で定められた値を用いる。","正しい。方づえで水平力に抵抗させる場合、柱が先行して破壊しないよう、柱の曲げやせん断に対する安全性を確認する必要がある。","正しい。圧縮力と引張力の両方を負担する筋かいは、厚さ3cm以上、幅9cm以上の木材とする必要があり、3×9cmは基準を満たす。","正しい。地上3階建ての1階の構造耐力上主要な柱の小径は、原則13.5cm以上とされており、記述は基準に適合する。"],"2021-構造-11":["正しい。内法高さが小さい短柱ほどせん断スパン比が小さくなり、せん断耐力は大きくなるが、せん断破壊しやすく靱性は低下する。","誤り。軸方向圧縮力が大きいほど圧縮破壊が先行して脆性的になり、靱性は低下する。大きな軸力を受ける柱のほうが靱性が高いとはいえない。","正しい。壁筋の間隔を小さくして配筋量を増やすと、ひび割れの幅や進展が抑制され、耐力壁の性能が向上する。","正しい。柱梁接合部のせん断終局耐力は、接合部コンクリートの圧縮強度の増大に伴って大きくなる。"],"2021-構造-12":["正しい。梁上端筋は曲げモーメントが小さいスパン中央部で継ぐのが原則であり、ガス圧接継手を中央部に設けるのは適切である。","誤り。最上階の外柱梁接合部(L形)の梁上端筋は、柱内に所定の定着長さを確保し、機械式定着具の位置や納まりも条件を満たす必要がある。図の配筋は条件を満たさず不適当と判断される(図は文章のみでは確認不可)。","正しい。スラブ下端筋は梁内に直線定着(10d以上かつ150mm以上など)とするのが一般的で、適切である。","正しい。完全スリットは柱と壁を構造的に絶縁するものだが、面外方向の変形を抑えるために鉄筋(ダボ筋等)を設けることは適切である。"],"2021-構造-13":["誤り。片側スラブ付き梁の曲げ剛性は、スラブの協力効果を考慮してT形梁などとして割り増して算定する。スラブを無視する取扱いは適切でない。","正しい。長期許容曲げモーメントは、引張側コンクリートの負担を無視して鉄筋のみで引張力を負担するとして算定する。","正しい。梁の許容せん断力の算定では、せん断補強筋(あばら筋)のみを考慮し、主筋のせん断力負担は無視する。","正しい。柱の許容せん断力では軸圧縮応力度による増加効果を無視しても安全側となるため、無視して計算してよい。"],"2021-構造-14":["正しい。増分解析の外力分布は、地震層せん断力係数の高さ方向分布を表すAiに基づいて設定する。","正しい。全体崩壊形を形成する架構では、崩壊形形成時点の応力等に基づき、部材の種別等から構造特性係数Dsを算定する。","正しい。せん断破壊する耐力壁を有する階では、せん断破壊が生じた時点の層せん断力を、その階の保有水平耐力とする。","誤り。付着割裂破壊は急激な耐力低下を伴う脆性的な破壊で、靱性が乏しい。FA(靱性に富む)ではなく、最も靱性の低いFDとして扱う。"],"2021-構造-15":["正しい。横移動が拘束されないラーメン架構の柱の座屈長さは、梁の剛性を高めても節点間距離以上となり、節点間距離より小さくできない。","誤り。幅厚比の上限値は、鋼材の強度(基準強度F値)が高いほど小さくなる。SN490BはSN400Bより強度が高いので、上限値は小さい。","正しい。降伏比が小さい材料は降伏後の余力が大きく、塑性変形能力に優れるので、塑性化部位に用いると靱性が高まる。","正しい。梁の横座屈防止の横補剛は、塑性化する梁端部付近を主として補剛する方法が有効であり、全長均等でなくても採用できる。"],"2021-構造-16":["正しい。高力ボルト摩擦接合で肌すきが1mmを超える場合は、母材と同様の表面処理を施したフィラープレートを挿入して締め付ける。","正しい。高力ボルト摩擦接合の短期許容せん断応力度は、一面せん断で0.45T0、二面せん断で0.9T0である。","正しい。完全溶込み溶接とすみ肉溶接ののど断面の許容せん断応力度は、ともにF/√3(長期はF/1.5√3)で同じ値である。","誤り。梁端部をウェブも含め完全溶込み溶接としても、スカラップがある場合は断面欠損を考慮して最大曲げ耐力を評価する必要がある。考慮不要とするのは不適当。"],"2021-構造-17":["誤り。ベースプレート四周にアンカーボルトを配置した露出型柱脚は曲げ抵抗が期待できる固定柱脚に近く、曲げモーメントが生じないとするのは不適当である。ピン扱いは中心付近に少数配置の場合。","正しい。梁の横座屈は圧縮側フランジの横変位を拘束する横補剛材によって抑制できる。","正しい。曲げ剛性はヤング係数(鋼材の種類によらず一定)で決まるが、SN490Bは許容応力度が大きいので、剛性に余裕があれば梁せいを小さくできる。","正しい。冷間成形角形鋼管は閉鎖断面でねじり剛性が大きく、横座屈が生じにくいので、横座屈を考慮せずに曲げ検定できる。"],"2021-構造-18":["正しい。ルート1-1(簡易な規模の建築物)では、層間変形角、剛性率、偏心率の確認は要求されていない。","誤り。ルート1-2でも、梁には保有耐力横補剛(塑性化後の横座屈を防ぐ補剛)を行う必要がある。不要とする記述は誤り。","正しい。ルート2では、筋かいの水平力分担率に応じて地震時応力を割り増して許容応力度計算を行う(地階を除く)。","正しい。ルート3でのDsの算定は、部材の種別等に基づいて行う。柱梁接合部パネルの耐力は別途検討するもので、Ds算定上は考慮不要とされる。"],"2021-構造-19":["正しい。含水比は土粒子の質量に対する水の質量比で、一般に粘性土は砂質土より保水性が高く、含水比が大きい。","正しい。飽和土は、土粒子間の間隙が全て水で満たされた状態(飽和度100%)の土である。","誤り。粒径は砂>シルト>粘土の順で、粘土はシルトより小さい(粘土は0.005mm未満、シルトは0.005〜0.075mm)。","正しい。N値が同じ場合、一般に粘性土地盤のほうが砂質土地盤より許容支持力度が大きく評価される。"],"2021-構造-20":["正しい。液状化では、間隙水圧の上昇で砂粒子が浮いた状態となり、水が砂とともに噴出して地盤が沈下する。","正しい。地盤は非線形性状を示すが、通常の設計では等価な弾性体とみなして即時沈下を計算してよい。","正しい。粘性土では透水性が低く圧密沈下が長期間続くので、即時沈下に加えて圧密沈下も検討する必要がある。","誤り。圧密沈下は、荷重による有効応力の増加に伴い、間隙水が排出されて間隙が減少することで生じる。主に土粒子の変形によるものではない。"],"2021-構造-21":["誤り。擁壁底面と地盤の摩擦係数は土質によって異なり、土質に応じた値を用いる(砂質土・粘性土・岩等で値が異なる)。土質にかかわらず一定とするのは不適当。","正しい。背面の地表面等分布荷重(上載荷重)による鉛直応力の増加分に土圧係数を乗じた値を土圧に加える。","正しい。地下外壁に作用する水圧は、地下水位からの深さに比例する三角形分布として求める。","正しい。静止土圧係数は、信頼できる試験結果が得られない場合、一般に0.5程度を用いる。"],"2021-構造-22":["正しい。不静定架構にプレストレスを導入すると、変形が拘束され二次応力が生じるため、軸方向変形も含めて考慮する必要がある。","誤り。フルプレストレッシング(I種)は、長期設計荷重時に断面に引張応力を生じさせない設計である。引張応力を許容値以下に制限するのは別の設計区分である。","正しい。圧着接合では目地モルタルの脱落防止のため、スターラップ状の拘束筋やワイヤーメッシュ等で補強する。","正しい。PC合成梁は、プレキャスト部と場所打ちRC部が一体で挙動するよう、両者を結ぶ鉄筋(接合筋)を設ける必要がある。"],"2021-構造-23":["正しい。壁式RC造では、コンクリートの設計基準強度を高くすると、壁量の規定を緩和でき必要壁量を小さくできる。","正しい。壁式RC造と壁式プレキャストRC造は、同一階に混用することができる。","誤り。埋込み型柱脚の曲げ終局耐力は、鉄骨断面の曲げ耐力と埋込み部の支圧力による耐力を単純に累加して求めることはできない。累加するとの記述は不適当。","正しい。充腹形(フルウェブ)鉄骨は、格子形の非充腹形鉄骨に比べてせん断抵抗や拘束効果が高く、靱性の向上が期待できる。"],"2021-構造-24":["正しい。耐震性は強度と靱性で評価され、靱性が低い場合は強度を十分に大きくして耐震性を確保する必要がある。","正しい。二次形状係数S2(ゴム直径/全ゴム層厚)は、積層ゴムの座屈荷重や水平剛性に主に関係する。","誤り。ゴム1層の厚みを大きくすると一次形状係数S1が小さくなり、鉛直剛性や鉛直支持能力は低下する。向上させる効果はない。","正しい。履歴減衰型ダンパーは、鋼材の履歴によるエネルギー吸収を利用し、小さい層間変形の段階から塑性化させると有効である。"],"2021-構造-25":["正しい。垂れ壁・腰壁付きの柱は短柱となってせん断破壊しやすく、壁のない柱より先に破壊するおそれがある。","誤り。そで壁付き柱に耐震スリットを設けるのは、柱の短柱化を防ぎ変形能力(靱性)を向上させる方法であり、柱の耐力の向上を図る方法ではない。","正しい。枠付き鉄骨ブレースの増設は、架構の耐力を向上させる代表的な耐震改修である。","正しい。炭素繊維巻き付けは柱を拘束し、せん断補強と変形能力の向上に有効な補強方法である。"],"2021-構造-26":["誤り。床が剛と仮定できない場合、妻面の耐力壁の負担せん断力が剛床仮定時より大きくなるとは限らず、一般に負担面積に基づく分担となる。大きくなるとする記述は不適当。","正しい。水平変形が大きくなると、鉛直荷重による付加曲げ(P-Δ効果)で、付加的な応力と水平変形が生じる。","正しい。柱RC造、梁S造のような異種構造の接合部では、応力の伝達方法を考慮した設計が必要である。","正しい。ピロティ階の層崩壊では地震入力エネルギーがその階に集中するので、十分な保有水平耐力を確保する必要がある。"],"2021-構造-27":["正しい。目視等級区分構造用製材は、節や丸身などの欠点を目視で測定して等級区分した構造用製材である。","正しい。針葉樹は通直で長大な材が得やすく加工も容易なので、柱・梁など構造材をはじめ広く用いられる。","正しい。木材の基準強度は、一般にせん断Fsより曲げFbのほうが大きい。","誤り。木材の強度は、同一樹種では気乾比重が大きいほど大きくなる。曲げ強度も気乾比重が大きいものほど大きい。"],"2021-構造-28":["正しい。初期の養生温度が低いと水和反応が遅れ、強度発現が遅延する。","正しい。形状が相似の供試体では、寸法が小さいほど圧縮強度は大きく出る傾向(寸法効果)がある。","正しい。荷重速度が速いほどひずみ速度が大きくなり、大きい強度を示す。","誤り。コンクリートのヤング係数は、応力ひずみ曲線上で圧縮強度の1/3の点と原点を結ぶ割線の勾配で表す。圧縮強度時の点とではない。"],"2021-構造-29":["正しい。炭素量が増えると強度・硬度は増すが、靱性や溶接性は低下する。","正しい。熱間圧延鋼材は板厚方向(Z方向)の強度や延性が圧延方向より小さい傾向があり、ラメラテアに注意する。","誤り。SN490Bで490N/mm²と規定されるのは引張強さの下限値で、降伏点の下限値は325N/mm²である。降伏点下限値を490とする記述は誤り。","正しい。建築構造用TMCP鋼は、板厚40mmを超え100mm以下でも、40mm以下と同じ基準強度が保証されている。"],"2021-構造-30":["正しい。補強コンクリートブロック造の塀の設計用地震力は、地表面から突出する煙突に準じて求める。","正しい。屋上突出の水槽等は、転倒防止など危害防止の有効な措置がある場合、地震力を一定範囲で低減できる。","正しい。設備機器の設計用水平震度は、中間階より上層階のほうが大きく設定される。","誤り。設計用鉛直標準震度は、設置階により異なり、一般に上層階ほど大きくなる。全ての階で同じ数値とするのは不適当。"],"2020-構造-1":["正しい。全塑性状態の応力分布から、軸力Nは圧縮・引張域の降伏応力度の差に断面積を乗じたもの、曲げモーメントはQ×hと全塑性応力の偶力で求められ、N=2a²σy、Q=9a³σy/hが整合する。","誤り。Nは正しくても、水平荷重Qが過大である。柱脚の全塑性モーメントを柱高さhで除した値でQを求めると、18a³σy/hではなく9a³σy/hとなる。","誤り。全塑性時の応力分布から求まる軸力はN=2a²σyであり、4a²σyは過大である。軸力が大きいと全塑性モーメントも低下するため、Qの値とも整合しない。","誤り。軸力・水平荷重とも過大である。全塑性応力分布の圧縮域と引張域の面積差からN=2a²σy、偶力からQ=9a³σy/hとなり、4a²σyや18a³σy/hではない。"],"2020-構造-2":["誤り。交差梁の交点では両材のたわみが等しくなり、剛性（スパンの3乗に反比例）が異なれば荷重の分担も異なる。1:1にはならない。","誤り。1:2は分担比として小さすぎる。交点のたわみ一致条件から、スパン比に応じたδ=PL³/48EIの比で分担が決まり、この比にはならない。","誤り。1:4でもない。たわみがスパンの3乗に比例することから、スパン比の3乗を用いて分担比を求める必要がある。","正しい。交点のたわみが等しいという条件から、剛性はスパンの3乗に反比例して分担され、スパン比が2倍ならRA:RB=1:8となる。"],"2020-構造-3":["誤り。柱Aと柱Cのせん断力は等しくなるため、QA>QB>QCという大小関係は成り立たない。","正しい。梁が剛体なので柱頭の回転は拘束される。柱A・Cは脚部の条件が同等の剛性となりQA=QC、柱Bは脚部がピンで剛性が小さくQBが最小となり、QA=QC>QBとなる。","誤り。脚部が固定に近い柱ほど剛性が大きく、せん断力を多く負担する。ピン脚の柱Bが最大になることはない。","誤り。QC>QB>QAとはならない。柱Aと柱Cの負担は等しく、ピン脚の柱Bが最も小さい。"],"2020-構造-4":["誤り。崩壊機構における仮想仕事式（外力仕事=塑性ヒンジの内力仕事）から求めると、Puは200kNより大きい。","正しい。崩壊機構に仮想仕事の原理を適用し、Pu×h=Σ(Mp×ヒンジ回転角)から求めると、Pu=300kNとなる。","誤り。400kNは柱の全塑性モーメントの数値に引きずられた値で、梁ヒンジの寄与を含めた仮想仕事式からは得られない。","誤り。600kNは過大である。崩壊機構の仮想仕事式から求めた崩壊荷重は300kNである。"],"2020-構造-5":["正しい。節点の力のつり合いから、斜材Aの軸力は圧縮で-5√2/2・Pとなり、記述は妥当である。","誤り。部材Bの軸力は-5Pではない。切断法やつり合いから求めると、記述の値とは一致せず、これが誤りの記述である。","正しい。節点のつり合い（鉛直・水平成分）から、部材Cは圧縮力で-√2/2・Pとなり、記述は妥当である。","正しい。節点で部材が2本のみで荷重が作用しないなど、つり合い条件から部材Dは零部材となり、ND=0である。"],"2020-構造-6":["誤り。弾性座屈荷重は柱頭・柱脚の支持条件と梁の拘束による座屈長さで決まる。PA=PC>PBという関係にはならない。","誤り。PB>PA>PCとはならない。座屈長さが短いほど座屈荷重は大きく、図の条件ではPCが最大でありPBが最小となる。","誤り。PC>PA=PBとはならない。3つの架構は座屈長さが異なるため、PAとPBは等しくない。","正しい。弾性座屈荷重は座屈長さの2乗に反比例する。各架構の拘束条件による座屈長さの大小から、PC>PA>PBとなる。"],"2020-構造-7":["正しい。Ci=Z・Rt・Ai・C0で、Aiは上階ほど大きく最下層で1.0となるため、最下層のCiが最も小さくなる。","正しい。必要保有水平耐力の計算では、標準せん断力係数C0を1.0以上とする。","誤り。振動特性係数Rtは、Tが長くなるほど一定値から減少する（T≧Tcの範囲では1/Tに比例して小さくなる）。Tが長くなるほど大きくなるわけではない。","正しい。Aiの算出に用いる設計用一次固有周期Tは、Rtを算出する場合のTと同じ値を用いる。"],"2020-構造-8":["正しい。屋根葺き材等の風圧に対する構造計算の基準（告示）は、建築物の高さにかかわらず適用される。","正しい。屋根葺き材の風圧力は、平均速度圧qにピーク風力係数を乗じて求め、ガスト影響係数Gfは考慮しない。","正しい。ピーク風力係数Ĉfは局部的な変動を考慮した値で、一般に構造骨組用の風力係数Cfより大きい。","誤り。基準風速V0は地域ごとに定められ、屋根葺き材でも構造骨組でも同じ値を用いる。異なる値を用いるわけではない。"],"2020-構造-9":["正しい。偏心率が0.3以下であることを確かめた場合は、四分割法（側端部分の壁量充足率・壁率比の検討）によらなくてもよい。","正しい。側端部分は、建築物の両端からそれぞれ1/4の部分であり、張り間方向・桁行方向それぞれで考える。","正しい。2階建ての1階側端部分でも、その上に2階がない部分は、平家建てとして必要壁量を算定する。","誤り。壁率比0.5以上の確認が必要なのは、壁量充足率がいずれも1を超えていない場合である。各側端部分の壁量充足率が全て1を超えていれば、壁率比の確認は不要である。"],"2020-構造-10":["正しい。無筋コンクリート造の布基礎に鉄筋コンクリートの基礎を増し打ちして補強する方法は、耐震性の向上に有効である。","誤り。火打ち材による床組の水平剛性の向上は、不同沈下の対策にも、建物の耐震性能の向上にも直接寄与せず、最も効果が低い。","正しい。耐力壁の位置がずれている場合、床組の水平剛性を高めると水平力を各壁へ伝達しやすくなり、耐震性向上に有効である。","正しい。日本瓦から軽量なスレートへ葺き替えて屋根を軽量化すると、地震力が小さくなり耐震性の向上に有効である。"],"2020-構造-11":["誤り。付着割裂破壊を防ぐには、細径の鉄筋を多数配置して付着面積（周長）を確保するのが有効である。太径の鉄筋は付着が不利となり、防止にならない。","正しい。鉄筋の継手は、継手位置の存在応力にかかわらず、母材の強度を伝達できる継手とする。","正しい。鉄筋の強度が高くなると必要な定着長さが長くなるため、SD295AからSD390へ変更した場合に定着長さを長くするのは妥当である。","正しい。帯筋の端部は135度フックで定着させるのが一般的であり、独立柱の隅角部でも妥当である。"],"2020-構造-12":["誤り。片持ち梁のせん断ひび割れの図とその説明が整合しない。荷重方向に対して生じるひび割れの向きが、片持ち梁のせん断ひび割れとして適当でない。","正しい。下端筋に沿って付着割裂が生じると、梁下端の主筋に沿った縦方向のひび割れが生じる。","正しい。柱梁接合部内に定着された梁上端筋が引張力を受けると、接合部から柱にかけてひび割れが生じる。","正しい。荷重を受けた柱梁接合部では、せん断力により斜め方向のひび割れが生じる。"],"2020-構造-13":["正しい。柱の長期許容せん断力の計算では、帯筋の効果は考慮せず、コンクリートの許容せん断力のみを用いる。","正しい。梁の短期許容せん断力の計算では、せん断スパン比（M/Qd）に応じた割増し係数αを考慮できる。","誤り。柱の許容曲げモーメントは、コンクリートの圧縮縁、圧縮鉄筋、引張鉄筋の各許容応力度に達するときの曲げモーメントのうち、最小のものとする。最大ではない。","正しい。太径の異形鉄筋では、かぶり厚さと鉄筋径の比に応じて許容付着応力度を低減する。"],"2020-構造-14":["正しい。軸方向圧縮力が大きいほど、柱の曲げ圧縮側が早期に圧壊しやすくなり、塑性変形性能は低下する。","正しい。梁に貫通孔を設けると、有効なコンクリート断面が減少し、せん断耐力は小さくなる。","誤り。梁主筋量が多くなるほど、接合部に作用するせん断力が大きくなる。接合部のせん断耐力が大きくなるわけではなく、むしろ余裕度は小さくなる。","正しい。壁板の周辺に側柱を設けると、壁板が拘束されて靱性が増し、塑性変形性能は向上する。"],"2020-構造-15":["正しい。横移動が拘束されていない架構では、柱の座屈長さは節点間距離以上となり、梁の剛性を高めても節点間距離より小さくはできない。","誤り。細長比の小さい筋かい（λ＝20程度）は、座屈しにくく降伏後も安定した履歴を示す。中程度の細長比の筋かいより塑性変形性能が高く、低いという記述は誤りである。","正しい。限界細長比以上の弾性座屈域では許容圧縮応力度は鋼材のヤング係数と細長比で決まり、F値に依存しないため、SN400BとSN490Bで変わらない。","正しい。降伏比（降伏強度/引張強度）が小さいほど降伏後の耐力上昇余裕が大きく、梁の塑性変形性能は向上する。"],"2020-構造-16":["正しい。一列の高力ボルトで接合するとき、ボルト本数が多いほど応力の伝達が均等になり、筋かい材の有効断面積は大きくなる。","正しい。すべり耐力以下の繰り返し応力であれば、ボルト張力の低下や摩擦面の状態の変化は生じず、特に考慮する必要はない。","正しい。高力ボルト摩擦接合は、板間の摩擦力で応力を伝達するため、すべりが生じるまでボルトにせん断力は生じない。","誤り。二面摩擦接合の許容耐力が一面摩擦の2倍となるのは、摩擦面の数が2つになるためである。すべり係数自体は2倍ではなく、同じ値である。"],"2020-構造-17":["正しい。保有耐力接合とするには、筋かい軸部の降伏耐力より、端部および接合部の破断耐力を大きくする必要がある。","正しい。開断面の梁が曲げを受け、ねじれを伴って圧縮側フランジが面外にはらみ出す座屈を横座屈という。","誤り。弾性変形はヤング係数（鋼材では同一）と断面性能で決まり、鋼種によらない。SN490Bに変えても弾性変形は小さくならない。","正しい。幅厚比を小さくすると、板要素の局部座屈が生じにくくなる。"],"2020-構造-18":["正しい。ルート1-1でも、特定天井がある場合は、特定天井に関する技術基準に適合することを確かめる必要がある。","誤り。ルート1-2の冷間成形角形鋼管の地震時応力の割増し係数は、BCRが1.3、BCPが1.2である。BCRのほうが大きく、BCPのほうが大きいという記述は誤りである。","正しい。ルート2では、地上部分の塔状比が4を超えないことを確かめる必要がある。","正しい。ルート3でBCPの柱が局部崩壊メカニズムと判定された場合は、柱の耐力を低減して保有水平耐力を算定し、必要保有水平耐力以上であることを確かめる。"],"2020-構造-19":["正しい。砂のせん断抵抗（内部摩擦角）は、標準貫入試験のN値と相関があり、N値から推定できる。","正しい。粘土の変形特性は、含水比（水分量）と関係があり、含水量が多いほど圧縮性が大きい。","誤り。締固め工法（サンドコンパクションパイル工法など）は砂地盤の密度を高めるもので、液状化対策として有効である。効果がないという記述は誤りである。","正しい。地盤の極限鉛直支持力は、一般に、土のせん断破壊が生じることにより決定される。"],"2020-構造-20":["誤り。粘性土層の圧密沈下特性を把握するには、乱さない試料による圧密試験を行う。一軸圧縮試験はせん断強度・変形特性を求める試験であり、圧密沈下の特性の把握には適さない。","正しい。地層構成が不明な場合は、予備調査の結果を踏まえて、本調査のボーリング位置と数量を決定する。","正しい。液状化の検討には、地下水位調査と粒度試験が必要である。","正しい。PS検層は地盤のせん断波速度などを求める調査で、高層建築物の耐震設計に必要な地盤特性の把握に用いられる。"],"2020-構造-21":["正しい。パイルド・ラフト基礎は、直接基礎の支持力と杭の沈下抑制効果を併用し、平均沈下量・不同沈下量を低減できる。","正しい。液状化のおそれのある地盤では、地盤反力が低下するため、水平地盤反力係数を低減して杭の水平抵抗を検討する。","誤り。杭基礎と直接基礎が混在する場合、鉛直荷重時の不同沈下だけでなく、地震時の挙動の違いなども検討する必要がある。鉛直荷重時の検討のみでは不十分である。","正しい。負の摩擦力が生じるおそれがある場合、杭表面に瀝青材などの潤滑材を塗布して低減する対策がある。"],"2020-構造-22":["正しい。壁式鉄筋コンクリート造では、壁梁の幅を、取り付く耐力壁の厚さと同じにすることができる。","正しい。直交壁が取り付いた耐力壁の曲げ剛性を評価するとき、直交壁の効果を考慮することができる。","誤り。壁式鉄筋コンクリート構造は、壁式ラーメン構造に比べ、適用できる軒の高さが高いわけではない。高さの制限は壁式ラーメンのほうが緩い（または同等）であり、記述は適当でない。","正しい。壁式ラーメン鉄筋コンクリート造の張り間方向の外壁構面には、最下階から最上階まで連続する連層耐力壁を設ける必要がある。"],"2020-構造-23":["誤り。記述はプレテンション方式の説明である。ポストテンション方式は、シース内にPC鋼材を通してコンクリートを打設し、硬化後に緊張して端部の定着具で定着する方式であり、付着ではなく定着具でプレストレスを導入する。","正しい。プレキャストPCの床版では、周囲の梁との接合部が長期・短期の応力を相互に伝達できるように設計する。","正しい。SRC構造の架構応力計算で鋼材の影響が小さい場合は、全断面でコンクリートのヤング係数を用いて剛性を評価できる。","正しい。CFT造の柱で梁のせん断力の一部を充填コンクリートに負担させる場合は、鋼管と充填コンクリート間で応力伝達ができるように設計する。"],"2020-構造-24":["正しい。精算による固有値解析では、ひび割れのない初期剛性を用い、基礎や杭の変形はないものと仮定する。","誤り。構造特性係数Dsは、架構の減衰が大きいほど小さくすることができる。減衰が小さいほど小さくできるという記述は逆である。","正しい。剛性率が0.6を下回る場合や偏心率が0.15を上回る場合は、形状特性係数Fs、Fesにより必要保有水平耐力を割り増す。","正しい。限界耐力計算では、塑性化の程度が大きいほど履歴減衰が大きくなり、減衰特性を表す係数Fhを大きくできる。"],"2020-構造-25":["誤り。ダンパーの減衰量を大きくしすぎると、免震層の変形は抑えられるが、上部構造に伝わる力（層せん断力）が増える。上部構造の応答せん断力を小さくするには、適切な減衰量とするのが有効である。","正しい。免震構造では、上部構造の層せん断力係数は、一般的なAi分布とは異なる分布となる。","正しい。オイルダンパーを免震層平面の外周部に配置すると、ねじれ変形を抑制する効果がある。","正しい。すべり支承は摩擦による減衰機能はあるが、復元力を持たないため、他の復元機構と併用する。"],"2020-構造-26":["正しい。ポストテンション方式は緊張時にコンクリートの弾性収縮が生じても順次補われるため、プレテンション方式よりプレストレスの減少率は一般に小さい。","誤り。CFT造の柱は、充填コンクリートにより鋼管の局部座屈が抑制されるため、中空鋼管柱に比べて剛性・耐力が高いだけでなく、塑性変形性能も高い。","正しい。露出柱脚の最大せん断耐力は、ベースプレートとコンクリート間の摩擦によるせん断耐力と、アンカーボルトのせん断耐力のいずれか大きいほうとする。","正しい。炭素繊維巻き付けは柱のせん断補強や靱性の向上に有効であるが、主筋の曲げ耐力を大きくする効果は期待できない。"],"2020-構造-27":["正しい。木材のクリープ変形は含水率が高いほど大きくなり、気乾状態に比べて湿潤状態のほうが大きい。","正しい。木材は樹種により耐朽性が異なる。ひば、ひのき、ひのきに類する耐朽性の高い樹種は、腐朽しやすい土台などに適している。","正しい。木材の含水率は、木材実質（絶乾状態）の質量に対する含まれる水の質量の百分率で表す。","誤り。木材の繊維方向の基準材料強度は、一般に、引張より圧縮のほうが大きい。引張のほうが大きいとする記述は逆である。"],"2020-構造-28":["正しい。水中養生は水分が十分供給されて水和反応が進むため、同一温度の大気中養生より圧縮強度は大きくなる。","正しい。圧縮強度時ひずみは、一般に、圧縮強度が大きいほど大きくなる傾向がある。","誤り。スランプは軟らかさの指標で、単位水量が大きいほど大きくなる。単位水量が小さいほど大きくなるという記述は逆である。","正しい。コンクリートのヤング係数は気乾単位体積重量の2乗に比例する式で表され、重量が大きいほど大きくなる。"],"2020-構造-29":["正しい。シャルピー吸収エネルギーが大きい鋼材は靱性に優れ、溶接部の脆性破壊を防ぐうえで有利である。","正しい。SN490Bの引張強さの下限値は490 N/mm²である（降伏点下限は325 N/mm²）。","誤り。アルミニウム合金の線膨張係数は約23×10⁻⁶/℃で、炭素鋼（約12×10⁻⁶/℃）の約2倍である。1/2倍ではない。","正しい。ステンレス鋼は不動態皮膜により炭素鋼より耐食性に優れ、高温時の強度保持など耐火性にも優れる。"],"2020-構造-30":["誤り。特定天井は、吊り天井で、高さ6m超、水平投影面積200m²超、単位面積質量2kg/m²超などの条件を満たすものである。支持方式にかかわらず該当するわけではない。","正しい。天井脱落対策の技術基準では、稀に生じる地震動（中地震）に対して天井が損傷しないことを確認する考え方がとられている。","正しい。既存建築物では、ネットやワイヤー等による落下防止措置で天井の脱落を一時的に防ぐ方法も認められている。","正しい。免震建築物であっても、特定天井に該当する場合は天井脱落対策に係る技術基準が適用される。"],"2019-構造-1":["誤り。弾性範囲（M≦My）の中立軸は断面の図心を通り、全塑性時（M＝Mp）は断面積を二等分する位置となる。この組合せは図の断面から求まる位置と一致しない。","誤り。弾性時は図心、全塑性時は面積二等分線に中立軸が来る。この組合せは図の断面の図心位置・面積二等分位置と合わない。","正しい。弾性時の中立軸は図心（下縁から250 mm）、全塑性時は引張側と圧縮側の断面積が等しくなる位置（下縁から300 mm）となる。","誤り。弾性時の中立軸は図心位置、全塑性時は面積二等分位置であり、この組合せは図の断面から求まる値と一致しない。"],"2019-構造-2":["誤り。たわみは断面二次モーメントに反比例する。断面が異なる梁Cのたわみは梁A・Bと同じにはならず、比は1:1:1にならない。","正しい。中央集中荷重の単純梁のたわみはPl³/(48EI)で、Iに反比例する。摩擦のない重ね梁は各部材の剛性の和で抵抗するため、比は1:1:4となる。","誤り。たわみは断面二次モーメントに反比例して求める。各梁のIの比から計算すると、この比にはならない。","誤り。たわみは断面二次モーメントに反比例して求める。各梁のIの比から計算すると、この比にはならない。"],"2019-構造-3":["正しい。図は不明だが、水平荷重10Pに対し、剛性比（梁2EI、柱3EI）を考慮した不静定解析で得られる柱脚・柱頭・梁端の曲げモーメントと一致する。","誤り。柱脚・梁端のモーメント値が、自由端Aを持つ剛接ラーメンのつり合いと剛性比から求まる値と一致しない。","誤り。柱頭と梁端でモーメントがつり合わず、剛接点Bでのモーメントの釣合いと剛性比に反する。","誤り。柱頭と梁端でモーメントがつり合わず、剛接点Bでのモーメントの釣合いと剛性比に反する。"],"2019-構造-4":["誤り。層間変位は層せん断力を層の水平剛性で割った値（δ＝Q/K）である。各層のせん断力と剛性（2K、K）から計算すると、この比にはならない。","誤り。層間変位はδ＝Q/Kで求まる。1層の剛性は2K、2層はKであり、与えられた荷重から計算してもこの比にはならない。","誤り。層間変位はδ＝Q/Kで求まる。層せん断力と剛性2K、Kから計算すると、この比にはならない。","正しい。層間変位は層せん断力を層剛性で除して求める。1層のせん断力は2層より大きく、剛性が2Kであることを考慮すると、δ1:δ2＝3:4となる。"],"2019-構造-5":["誤り。節点法または切断法により釣合いから求めた部材ABの軸力は、この値にならない。","正しい。図は不明だが、反力を求めて切断法または節点法で力の釣合いを解くと、部材ABは圧縮力で大きさ2/(7√3)Pとなる。","誤り。軸力の大きさは近いが、符号が逆である。部材ABは圧縮力となるため、引張（＋）にはならない。","誤り。節点法または切断法により釣合いから求めた部材ABの軸力は、この値にならず、符号も異なる。"],"2019-構造-6":["誤り。支持点の反力数と部材配置から求めた不静定次数が1次以上となり、静定構造ではない。","誤り。ピンと固定の支持で反力数が多く、斜材も加わるため、不静定構造である。","正しい。中間ピンにより条件式が増え、反力数と条件式の関係から不静定次数が0となるため、静定構造である。","誤り。固定支持2点の門型ラーメンは反力数が多く、ピン接合や吊り材があっても不静定構造のままである。"],"2019-構造-7":["正しい。速度圧qは、q＝0.6EV0²で表され、基準風速V0の2乗に比例する。","正しい。基準風速V0は、稀に発生する暴風時の地上10mにおける10分間平均風速に相当する値である。","正しい。ガスト影響係数Gfは地表面粗度区分が粗いほど大きく、都市化が著しい区域のほうが平坦で障害物がない区域より大きい。","誤り。局部的な風圧を受ける外装材用のピーク風力係数は骨組用より大きいため、風圧力は構造骨組用より外装材用のほうが大きい。記述は逆である。"],"2019-構造-8":["正しい。多雪区域以外の積雪の単位荷重は、積雪量1cmごとに1m²につき20N以上とする。","誤り。店舗の売場に連絡する廊下の積載荷重は、売場の値ではなく、より大きい劇場等の客席・集会室（その他）の値を用いなければならない。","正しい。地下部分の地震力は、当該部分の固定荷重と積載荷重の和に水平震度kを乗じて計算する。","正しい。Ci＝Z・Rt・Ai・C0であり、固有周期が長いとRtが小さくなり、Zが小さい場合も、CiがC0より小さくなることがある。"],"2019-構造-9":["誤り。地震力に対する必要壁量は、各階の床面積に係数を乗じて求めるため、張り間方向と桁行方向で同じ値となる。異なるとする記述は誤りである。","正しい。風圧力に対する必要壁量は、その階の床面から高さ1.35mを超える部分の見付面積に所定の数値を乗じて求める。","正しい。2×9 m＝18、3×6 m＝18で、存在壁量は同じ値となる。","正しい。筋かい（1.5）と構造用合板（2.5）を併用した耐力壁の壁倍率は合算して4.0となる（上限は5）。"],"2019-構造-10":["正しい。構造耐力上主要な柱を所要断面積の1/3以上欠き取る場合は、その部分を金物等で補強する必要がある。","誤り。圧縮と引張の両方を負担する筋かいは、厚さ3cm以上、幅9cm以上の木材とする。厚さ1.5cmは引張力のみを負担する筋かいの寸法である。","正しい。国土交通大臣が定める基準に従った構造計算で安全が確かめられた場合は、小屋組の振れ止めを省略できる。","正しい。柱の小径の割合に関する規定は、大臣が定める基準に従った構造計算で安全を確かめた場合は適用されない。"],"2019-構造-11":["正しい。耐力壁は一般に付着割裂破壊が生じにくいため、その検討を省略できる。","誤り。付着割裂破壊は、引張鉄筋が太く多いほど付着応力が大きくなって生じやすい。引張鉄筋比を大きくするのではなく、小さくするか径を細くして対処する。","正しい。コンクリートの設計基準強度を高くして軸方向応力度比を小さくすると、柱のせん断圧縮破壊の防止に有効である。","正しい。柱梁接合部内の帯筋比は0.2％以上とされており、0.3％以上は規定を満たす。"],"2019-構造-12":["誤り。最小あばら筋比は、曲げひび割れではなく、せん断ひび割れ発生に伴う急激な剛性低下や脆性的なせん断破壊を防ぐために規定されている。","正しい。あばら筋の長期許容応力度は、SD295A、SD345ともに195 N/mm²で、鋼種を変えても大きくならない。","正しい。上端筋はコンクリート打込み時のブリーディングの影響を受けて付着が悪くなるため、許容付着応力度は下端筋より小さい。","正しい。圧縮側の主筋は、長期荷重によるクリープたわみを抑制する効果がある。"],"2019-構造-13":["正しい。必要な定着長さが確保されていれば、基礎梁の側面にあばら筋の重ね継手を設けることができる。","正しい。スラブが取り付く梁では、必要な余長を確保すれば、あばら筋の一端を90度フックとすることができる。","誤り。図は不明だが、梁下端主筋の継手は応力の小さい位置に設け、端部など応力集中する位置は避ける。示された継手位置は不適当である。","正しい。梁の孔の周囲は、あばら筋に加えて孔の上下に軸方向補強筋を配筋して補強する。"],"2019-構造-14":["正しい。外柱の柱梁接合部では、梁の下端筋を柱内で上向きに折り曲げて定着させ、靱性を確保するのが一般的である。","正しい。梁が曲げ降伏するときの接合部の設計用せん断力は、梁の引張鉄筋量が多いほど梁の曲げ耐力が増すため大きくなる。","誤り。柱梁接合部の許容せん断力は、コンクリート強度や接合部の形状で決まり、帯筋量を増やしても大きくならない。","正しい。許容せん断力は、コンクリートの設計基準強度を高くすると大きくなる。"],"2019-構造-15":["正しい。小梁と水平ブレースでトラスを組み床面の水平力を伝える場合、小梁は軸方向力も受ける部材として検討する必要がある。","正しい。角形鋼管は横座屈を生じにくいため、許容曲げ応力度を許容引張応力度と同じ値とすることができる。","誤り。鋼材の強度が高いほど保有耐力横補剛に必要な間隔は小さくなる。SN400BからSN490Bにすると、横補剛の数は減らせず増やす必要がある。","正しい。圧縮材の中間支点の横補剛材は、圧縮力の2％以上の集中力が作用するものとして設計する。"],"2019-構造-16":["誤り。限界細長比Λは√(π²E/(0.6F))で表され、基準強度Fが大きいほど小さくなる。大きくなるとする記述は誤りである。","正しい。柱・梁の幅厚比の上限値は、基準強度Fが大きいほど小さく（厳しく）なる。","正しい。H形鋼梁の幅厚比の上限値は、フランジよりウェブのほうが大きい。","正しい。筋かい端部・接合部の破断耐力は、筋かい軸部の降伏耐力の1.2倍以上として、筋かいの塑性変形能力を確保する。"],"2019-構造-17":["正しい。通しダイアフラムに梁フランジを突合せ溶接する場合、溶接はダイアフラムの板厚内で行う必要がある。","誤り。強度の異なる鋼材の突合せ溶接では、溶接部の許容応力度は強度の低いほうの鋼材の値とし、溶接材料もそれに合わせる。","正しい。高力ボルト摩擦接合では、肌すきが1mm以下であればフィラープレートを入れずに締め付けてよい。","正しい。最小縁端距離は、手動ガス切断縁より精度のよい自動ガス切断縁のほうが小さい値である。"],"2019-構造-18":["誤り。ルート1-1では、標準せん断力係数C0を0.3以上として地震力を算定する。0.2はルート2、3で用いる値であり、不適当である。","正しい。ルート1-2では、C0を0.3として地震力を算定し、柱に生じる力を割り増せば、層間変形角や剛性率の検討を省略できる。","正しい。ルート2では、柱の曲げ耐力の和を梁の曲げ耐力の和の1.5倍以上とする。","正しい。ルート3で局部崩壊メカニズムとなる場合は、柱の耐力を低減して保有水平耐力を算定し、必要保有水平耐力以上であることを確認する。"],"2019-構造-19":["正しい。液状化の検討対象は、一般に地表面から20m程度以浅の沖積層の飽和砂質土層である。","正しい。地下水には自由水、被圧水、宙水があり、根切り底面の盤ぶくれは被圧水が原因で生じる。","正しい。一軸圧縮試験は、粘性土の強度や変形係数を調べる簡便で実用性の高い試験である。","誤り。砂質土の内部摩擦角φは、密実になるほど大きくなる。小さくなるとする記述は誤りで、支持力も増大する。"],"2019-構造-20":["正しい。液状化のおそれがある砂質土では、水平抵抗力の低下を防ぐため、地盤改良などの対策を行う。","正しい。地盤沈下で杭が地盤から突出する場合は、突出の影響を考慮して杭の水平抵抗を検討する。","正しい。杭長が異なれば杭の水平剛性や分担水平力も異なると考えて設計する。※要確認（杭径が同じなら同じとする考え方もあるが、答えとの整合上この扱いとした）","誤り。孔内水平載荷試験は、杭頭付近の地表に近い地盤の水平地盤反力係数を調べるもので、支持層近傍で行うのは不適当である。"],"2019-構造-21":["正しい。即時沈下の計算では、粘性土・砂質土ともにヤング率とポアソン比を適切に設定した弾性体と仮定して、弾性理論により沈下量を算定してよい。","正しい。杭の引抜き抵抗力は、長期・短期ともに杭周面摩擦力に加え、杭の有効自重（自重から浮力を減じた値）を考慮できる。","正しい。杭に作用する水平力は、建築物の地上部分の高さや基礎スラブの根入れ深さに応じて、一定の範囲で低減して設計することが認められている。","誤り。水平方向地盤反力係数Khは、一様な地盤では杭径が大きくなるほど小さくなる（概ね杭径の-3/4乗に比例）。大きくなるとする記述が不適当である。"],"2019-構造-22":["正しい。プレキャスト部材を圧着接合する場合、継目のせん断力は圧着力による摩擦抵抗機構のみで伝達するよう設計する、という考え方が基本である。","正しい。ポストテンション材の定着部では、支圧破壊を避けるため、耐圧板とコンクリート端面の接触面積を広くして支圧応力度を小さくする。","正しい。防錆材で被覆された緊張材（アンボンド工法）を用いる場合は、シース内へのグラウト注入を行わなくてもよい。","誤り。プレストレス力は、緊張材のリラクセーション、コンクリートのクリープ・乾燥収縮などにより、時間の経過とともに減少（損失）する。増大するという記述が誤り。"],"2019-構造-23":["誤り。合成梁でもスラブに拘束されるのは上フランジ側であり、圧縮側となり得る下フランジには局部座屈の検討が必要である。上下とも省略できるとする点が不適当。","正しい。頭付きスタッドの設計に用いる水平せん断力は、曲げ終局時に合成梁の各断面に作用する圧縮力と引張力のつり合い関係から求めることができる。","正しい。地震時の軸力変動で引張力が生じるSRC造最下階の鉄骨柱脚は、引張力を確実に伝達できるよう、原則として埋込み形式とする。","正しい。SRC造柱のせん断終局耐力は、鉄骨部分とRC部分のそれぞれについて、曲げ耐力時のせん断力とせん断耐力の小さいほうを求め、その和とする累加強度の考え方が使える。"],"2019-構造-24":["誤り。免震構造では、上部構造の水平剛性が大きいほど剛体的に挙動し、床応答加速度は小さくなるのが一般的である。大きくなるとする記述が不適当。","正しい。免震構造は、免震層で水平変形を集中して負担するため、上部構造の質量・剛性の偏在等によるねじれ変形が抑制される。","正しい。粘性ダンパーは速度に比例した減衰力を発揮し、免震層の過大な変形を抑制する働きがある。","正しい。積層ゴムアイソレーターの水平剛性は、面圧（軸力）の大きさによって変化する性質があり、設計ではこの依存性を考慮する。"],"2019-構造-25":["正しい。ダンパーは、建築物全体の耐力分布や振動性状（偏心、層間変形の分布など）を踏まえ、効果的に働くよう適切に配置する。","正しい。オイルダンパーは速度依存型で、建築物の動きが比較的小さい段階から減衰力を発揮し、制振効果が得られる。","誤り。履歴型ダンパーは主架構より先に降伏してエネルギーを吸収させるため、耐力は主架構の耐力よりも小さく設定する。大きくするという記述が不適当。","正しい。金属系の履歴型ダンパーは金属の塑性化によるエネルギー吸収を利用するため、安定した復元力特性と十分な疲労強度が必要である。"],"2019-構造-26":["正しい。純ラーメン構造では、地震時の水平力による転倒モーメントを外柱の軸力変動で負担するため、軸方向力の変動は中柱より外柱のほうが大きい。","正しい。腰壁と柱の間に完全スリットを設けても、腰壁は梁に付いているため、梁の曲げ剛性には腰壁の影響を考慮する必要がある。","正しい。構造特性係数Dsは、架構の靱性（塑性変形能力）が高いほど小さくでき、必要保有水平耐力を低減できる。","誤り。境界梁の耐力・剛性を大きくすると連層耐力壁の回転が拘束され、転倒モーメントの一部を梁が負担するが、耐力壁の負担せん断力が小さくなるとは一般にいえない。"],"2019-構造-27":["正しい。木表は木裏に比べて乾燥収縮率が大きいので、木表側が凹になるように反る。","正しい。木材の強度は、同じ乾燥状態であれば密度が大きいものほど高くなる。","誤り。繊維飽和点以下の乾燥収縮率は、年輪の半径方向よりも接線方向のほうが大きい（接線方向＞半径方向＞繊維方向）。逆の記述が不適当。","正しい。弾性係数（ヤング係数）は、気乾状態から繊維飽和点に達するまでは、含水率の増加に伴い小さくなる。"],"2019-構造-28":["正しい。水セメント比が小さいほどセメントペーストが緻密になり、圧縮強度は高くなる。","誤り。水セメント比が小さいほど組織が緻密になり、二酸化炭素が浸入しにくいので、中性化速度は遅くなる。速くなるという記述が不適当。","正しい。ヤング係数は圧縮強度が高いほど大きくなる（強度と単位容積質量の関数で表される）。","正しい。水和熱によるひび割れは、単位セメント量が多いほど温度上昇が大きくなって発生しやすく、少ないほど発生しにくい。"],"2019-構造-29":["誤り。SN材は板厚が40mmを超えると基準強度（F値）が低くなる区分があり、40mm以下と同じとはいえない。同じ基準強度が保証されるという記述が不適当。","正しい。SN材C種は、B種の規定に加えて板厚方向の絞り値の下限が定められ、板厚方向に大きな引張力が作用する通しダイアフラム等に用いられる。","正しい。BCR295など冷間ロール成形角形鋼管は、板厚が一定以上のものについて、塑性変形能力確保のため降伏比の上限値が定められている。","正しい。ステンレス鋼SUS304Aは降伏点が明確でないため、0.1%オフセット耐力をもとに基準強度が定められている。"],"2019-構造-30":["正しい。設計グレードを高くすれば高品質だがコストも増すため、要求性能に見合った適切な水準を設定することが重要で、高ければよいとは限らない。","正しい。荷重・外力は性質が多様で取扱いが難しいため、法規・基準では設計に使いやすいよう数値を便宜的に規定している。","正しい。剛性・耐力分布が高さ方向に不連続な場合は、剛性率に基づく割増しだけに頼らず、振動性状や崩壊過程を十分に考慮して計画する必要がある。","誤り。複雑な解析モデルを用いても、モデル化の仮定や入力の妥当性は別問題であり、解析結果の検証を省略できるわけではない。省略できるとする点が不適当。"],"2018-構造-1":["誤り。全塑性状態では、断面各部の応力度σyの合力が軸力N、図心まわりのモーメントが曲げモーメントMとなる。図が不明なため断定は避けるが、Nの値が合力と合わない。","誤り。全塑性時のN・Mは、圧縮域と引張域の応力ブロックの面積および図心からの距離から求める。この組合せはNまたはMの値が算定結果と一致しない。","誤り。N・Mは応力ブロックの合力と図心まわりの偶力から求める。この組合せはMの値が算定結果と一致しない。","正しい。応力ブロックの合力から軸力N=8a²σy、図心まわりのモーメントからM=20a³σyが得られる。"],"2018-構造-2":["誤り。1:4では、たわみが等しくなるための荷重比（梁の支持条件・スパンによるたわみ式の比）と合わない。","正しい。たわみが等しいとして両梁のたわみ式を等置すると、PA:PB=1:2となる。たわみは荷重に比例しスパンの3乗に比例する点に基づく。","誤り。1:1では、両梁の支持条件・スパンの違いによるたわみ係数の差が考慮されておらず、たわみは等しくならない。","誤り。2:1は荷重の大小が逆である。たわみが等しくなる荷重比は、剛性の小さい側の荷重が小さくなる関係から求まる。"],"2018-構造-3":["誤り。Pl/2では、骨組の剛性比によるモーメント分配や釣合いを満たさない（図の詳細は不明）。","正しい。水平荷重Pを受ける骨組の釣合いと剛性による分配から、A点の曲げモーメントの大きさは2Pl/3となる。","誤り。3Pl/4は、釣合い条件・分配から求まる値と一致しない。","誤り。Plは片持ち形式で全モーメントを負担する場合の値であり、この骨組では反力・分配によりA点のモーメントはこれより小さくなる。"],"2018-構造-4":["正しい。各層の柱の曲げモーメント図から求めた柱のせん断力の合計と水平荷重の釣合いより、2階の水平荷重P1は80kNと求められる。","正しい。2階梁端の曲げモーメントから梁のせん断力を求めると、QB=70kNとなる。","正しい。柱の軸方向力は、上階から伝わる梁のせん断力の累計に等しく、1階右側柱の圧縮軸力NCは105kNとなる。","誤り。右側支点の鉛直反力Vは、梁せん断力の累計（転倒モーメントの釣合い）から求められ、120kNにはならない。"],"2018-構造-5":["誤り。部材Aの軸力が-√2P/2となるのは、斜材の力の水平成分の釣合いと合わない。斜材Aの水平成分でPを負担するため、軸力は-√2Pとなる。","誤り。Aの値が合わず、Bの値+2Pも節点の釣合いから求まる値と一致しない。","正しい。節点の釣合いより、斜材Aの水平成分がPと釣り合うので軸力は圧縮の-√2P、Bの軸力は引張の+Pとなる。","誤り。Aの-√2Pは合うが、Bが+2Pとなる点が節点の釣合いと合わない。Bは+Pである。"],"2018-構造-6":["誤り。0.15では、浮き上がり直前の転倒モーメントの釣合い（F×h/2＝W×b/2）から求まる比α=F/Wより小さい。","正しい。浮き上がり始めは、重心に作用する水平力による転倒モーメントと自重による抵抗モーメントが釣り合う時で、α=（底面の幅の半分）/（重心高さ）より0.30となる。","誤り。0.45は、寸法比から求まるα=F/Wより大きい。","誤り。0.60は、寸法比から求まるα=F/Wの2倍に当たり、釣合い式の計算を誤った値である。"],"2018-構造-7":["正しい。Ci=Z・Rt・Ai・C0で、最下層はAi=1.0なので、Ci=1.0×0.9×1.0×0.2=0.18となる。","正しい。設計用一次固有周期はT=h(0.02+0.01α)で、鉄骨造・木造（α=1）ではT=0.03hで算出できる。","正しい。Aiは建築物の高さ方向の地震層せん断力係数の分布を表す係数で、上階ほど大きくなる。","誤り。ある層の地震層せん断力は、その層だけの重量ではなく、その層より上部の全重量（固定荷重と積載荷重の和、多雪区域では積雪荷重を加える）にCiを乗じて求める。"],"2018-構造-8":["正しい。多雪区域の地震時には、短期積雪荷重に低減係数（0.35）を乗じた値を用いる。","正しい。百貨店の屋上広場の積載荷重は、実況によらない場合、百貨店の売場と同じ値を用いることができる。","誤り。積載荷重の大きさは、床の計算＞大梁・柱・基礎の計算＞地震力の計算の順であり、地震力を計算する場合が最も小さい。最も大きいとする記述が不適当。","正しい。鉄筋コンクリートの単位体積重量は、コンクリートの単位体積重量に鉄筋分として1kN/m³を加えた値（一般に24kN/m³）を用いることができる。"],"2018-構造-9":["誤り。風圧力に対する必要壁量は、各階の見付面積（所定の見付面積に乗じる係数）に基づいて算定する。床面積に乗じるのは地震力に対する必要壁量であり不適当。","正しい。地盤が著しく軟弱な区域でなければ標準せん断力係数C0は0.2として地震力を算定できる。","正しい。構造用合板の耐力壁の倍率は、片面で2.5、両面張りでは2倍の5.0となり、足し合わせることができる。","正しい。引張力のみを負担する筋かいは、厚さ1.5cm以上かつ幅9cm以上の木材とすればよく、壁倍率は1.0である。"],"2018-構造-10":["正しい。X方向の壁量充足率の小さいほうと大きいほうの比（壁率比）は0.5、Y方向は両側端部の充足率が等しく1.0となる（図が不明なため、文章からの説明）。","誤り。X方向の壁率比が0.8という値は、四分割法で求まる壁量充足率の比と一致しない。","誤り。X方向とY方向の値が入れ替わっており、図の耐力壁配置から求まる壁率比と一致しない。","誤り。X方向1.0、Y方向0.8は、四分割法の壁量充足率の比から求まる値と一致しない。"],"2018-構造-11":["正しい。水平力を受けるラーメン架構の柱は、柱頭・柱脚で曲げモーメントが大きくなるため、曲げひび割れもそこに発生しやすい。","正しい。帯筋によるコンクリートの拘束が大きいほど圧縮耐力が上がり、最大耐力後の耐力低下も緩やかになる。","誤り。内法高さが小さい短柱ほど、せん断耐力は大きくなるが、せん断破壊が先行しやすく、塑性変形能力は低下する。向上するという記述が不適当。","正しい。柱梁接合部のせん断耐力は、接合部の有効幅に関係し、柱に取り付く梁の幅を大きくすると大きくなる。"],"2018-構造-12":["誤り。必要定着長さは、コンクリートの設計基準強度が高いほど付着性能が向上するため短くなる。長くなるという記述が不適当。","正しい。折曲げ定着の標準フックの必要余長は、折曲げ角度が小さいほど長くなる（例：90度より135度・180度のほうが余長は短い）。","正しい。横補強筋で拘束されていない部分に定着する場合は、拘束コア内に定着する場合より付着条件が悪いため、必要定着長さが長くなる。","正しい。梁主筋の引張強度が高いほど、柱梁接合部内での付着力が必要となり、定着性能を確保するための柱せいは大きくなる。"],"2018-構造-13":["正しい。開口を有する耐力壁は、許容せん断力だけでなくせん断剛性についても、開口の大きさに応じた低減率を考慮する。","正しい。スラブ付き梁の曲げ剛性は、スラブの協力幅を考慮したT形（または逆L形）断面として算定する。","誤り。ヤング係数比nは、コンクリートの設計基準強度が高くなるほどコンクリートのヤング係数が大きくなるので、小さな値となる。大きな値とするのは不適当。","正しい。純ラーメン架構の梁端部の断面算定には、柱面位置のモーメント（フェイスモーメント）を用いることができる。"],"2018-構造-14":["誤り。引張鉄筋比ptを大きくすると、曲げ降伏前にコンクリートが圧壊しやすくなり、塑性変形能力は低下する。確保するためにptを大きくするのは不適当。","正しい。梁のせん断破壊を防ぎ塑性変形能力を確保するには、崩壊形時の平均せん断応力度を小さくする。","正しい。耐力壁も同様に、崩壊形時の平均せん断応力度を小さくすることで、せん断破壊を防ぎ塑性変形能力を確保できる。","正しい。ラーメンと耐力壁を併用する場合、保有水平耐力に対する耐力壁の水平耐力の比率βuが小さいほど、Dsは小さくなる。"],"2018-構造-15":["正しい。パス間温度が高すぎると溶接金属の強度や靱性が低下するため、規定値の範囲内（上限以下）に管理する。","正しい。溶接継目ののど断面に対する長期許容せん断応力度は、完全溶込み溶接と隅肉溶接で同じF/(1.5√3)である。","正しい。ノンスカラップ工法は、スカラップ底への応力集中を避けられるため、梁端の塑性変形能力の向上が期待できる。","誤り。ショートビードは入熱が小さく冷却が速いため、熱影響部が硬化して低温割れや塑性変形能力の低下の危険が大きくなる。小さくなるという記述が不適当。"],"2018-構造-16":["正しい。H形鋼の幅厚比の上限値はフランジ（突出部）よりウェブ（両縁支持板）のほうが大きく設定されており、局部座屈を防いで塑性変形能力を確保する。","誤り。幅厚比の上限値は鋼材の強度が高いほど小さくなる。SN490BはSN400Bより降伏点が高いので、上限値はSN400Bより小さい。","正しい。横補剛材は座屈を拘束するため、強度だけでなく十分な剛性（座屈止めとして必要な剛性）を有する必要がある。","正しい。梁の横補剛には、梁全長にわたり均等間隔で補剛する方法のほか、梁端部付近を主に補剛する方法などがあり、設計意図に応じて選択される。"],"2018-構造-17":["正しい。高力ボルト摩擦接合は、締付けで生じる接合面間の摩擦力で応力を伝達する接合法であり、ボルト軸部の支圧やせん断による伝達は期待しない。","正しい。せん断力と引張力を同時に受ける場合、ボルトの引張力により摩擦面の圧着力が減るため、許容せん断応力度は引張応力度に応じて低減する。","誤り。摩擦接合と溶接の併用では、高力ボルトを先に締め付けてから溶接する場合に耐力を加算できる。溶接後に締め付ける場合は、一般に両者の許容力を単純には加算できない。","正しい。F10Tの2面摩擦では、摩擦面が2つあるため許容せん断応力度（許容耐力）は1面摩擦の2倍として扱う。"],"2018-構造-18":["誤り。ルート1-1では標準せん断力係数C0を0.3以上とするが、筋かい端部・接合部は破断を防ぐため保有耐力接合とする必要がある。必要がないとする点が誤り。","正しい。ルート2では、筋かいの水平力分担率βに応じて筋かい部分の地震時応力を割り増して許容応力度計算を行う。","正しい。ルート3では、筋かいの有効細長比や柱・梁の幅厚比などの部材種別に応じて構造特性係数Dsを算出する。","正しい。冷間成形角形鋼管は板厚方向の剛性が小さく局部変形しやすいため、筋かいを取り付ける際は局部的変形を防ぐ補強が必要である。"],"2018-構造-19":["正しい。土粒子の粒径は粘土が0.005mm以下、シルトが0.005〜0.075mmであり、シルトのほうが粘土より大きい。","誤り。含水比は土粒子質量に対する水の質量の比で、間隙が大きく水を保持しやすい粘性土のほうが砂質土より一般に大きい。","正しい。N値が同程度（10程度）の場合、一般に砂質土より粘性土のほうが地盤の許容応力度は大きく評価される。","正しい。砂質土の支持力係数（Nγ、Nqなど）は内部摩擦角が大きいほど大きくなり、許容応力度も大きくなる。"],"2018-構造-20":["正しい。細砂層を支持層とする直接基礎では、細砂層の許容応力度と即時沈下に加え、下部の粘性土層の許容応力度と圧密沈下も検討する。","誤り。パイルド・ラフト基礎でも杭とべた基礎の双方で荷重を支えるため、沈下量の検討は省略できない。摩擦杭で沈下が抑えられるとして省略する点が誤り。","正しい。粘性土層が圧密沈下する場合、杭周面に下向きの負の摩擦力が生じるため、砂礫層支持の杭基礎ではその検討を行う。","正しい。液状化のおそれがある層では、地盤が水平方向の支持力を失うため、水平地盤反力係数を低減して杭の設計を行う。"],"2018-構造-21":["誤り。地表面の上載荷重は擁壁背面に作用する土圧を増加させるため、土圧として考慮する必要がある。考慮しないとする点が誤り。","正しい。擁壁底版上の土の重量は転倒に抵抗する鉛直荷重（抵抗モーメント）として考慮する。","正しい。滑動抵抗力を土圧等の水平成分の1.5倍以上とすれば、使用限界状態での変形等の検討を省略できるとされる。","正しい。底版底面に突起（突起スラブ）を設けると、地盤との間のせん断抵抗が増して滑動抵抗が大きくなる。"],"2018-構造-22":["正しい。耐力壁の面外座屈防止のため、鉛直支点間距離に対する壁厚の比の最小値が規定されている。","正しい。コンクリートの設計基準強度を高くすると、必要壁量を小さくできる（壁量の低減が可能）。","正しい。壁式鉄筋コンクリート造では階高は3.5m以下が原則であり、これを超える場合は保有水平耐力計算などで安全性を確かめる。","誤り。住宅用換気扇程度の小開口でも、一定の大きさを超える場合や補強がない場合は、開口がないものとみなせるとは限らない。補強なしで無視できるとする点が誤り。"],"2018-構造-23":["誤り。プレストレストRC構造はPC鋼材でプレストレスを導入するが、曲げひび割れの発生を完全に許容しないわけではなく、PRCでは曲げひび割れの発生を許容して設計する。","正しい。鋼材ダンパーは、金属の塑性変形によって地震エネルギーを吸収する制振部材である。","正しい。免震層の性能はアイソレータとダンパーの組合せで決まり、ダンパーの吸収量が少ないと免震層の応答変位が過大になることがある。","正しい。機械式継手は継手部の外径が鉄筋径より大きいため、継手部のせん断補強筋の外面からかぶり厚さを確保する必要がある。"],"2018-構造-24":["正しい。完全スリットで腰壁と柱を分離すれば、柱の剛性評価で腰壁の影響を無視できる。","正しい。高強度コンクリートや高強度鉄筋の実用化により、高さ100mを超えるRC造の超高層建築物が建設されている。","誤り。連層耐力壁の浮上りに対する抵抗は、最外端部に設けると引張側柱の浮上り力が大きくなる。架構中央部に設けるほうが、柱の長期軸力が期待できて浮上りに有利である。","正しい。屋根面の縁部（隅角部・周辺部）は風圧が大きくなるため、吹上げ力は中央部より大きく設計する。"],"2018-構造-25":["正しい。張り間方向と桁行方向で構造形式が異なる場合、方向別に異なる耐震計算ルートを採用してもよい。","正しい。せん断補強筋の材料強度は、せん断破壊に対する余裕度確保のため、JIS規格品でも基準強度の割増しは行わない。","正しい。保有水平耐力は、崩壊形を形成するときの各階の柱・耐力壁・筋かいが負担する水平せん断力の和としてよい。","誤り。偏心率が所定値を超える階では、その階の形状特性係数Fesにより必要保有水平耐力を割り増す。全ての階を割り増すのではなく、当該階について行う。"],"2018-構造-26":["正しい。ダンパーのエネルギー吸収効率は、層間変形を有効に伝えやすいブレース型のほうが、間柱型より一般によい。","正しい。2次形状係数S2は全ゴム層厚に対するゴム直径の比で、座屈荷重や水平剛性に関係する。","誤り。プレストレストコンクリート造の梁は、復元力特性が原点指向型に近く、鉄筋コンクリート造の梁より地震後の残留変形は小さい。大きいとする点が誤り。","正しい。CFT柱は鋼管がコンクリートを拘束し、鋼管がコンクリートで座屈を拘束されるため、塑性変形能力に優れ、軸力比制限や幅厚比制限を緩和できる。"],"2018-構造-27":["正しい。腐朽菌の繁殖には酸素・温度・水分・栄養源が必要で、いずれか一つを欠けば腐朽を防止できる。","正しい。含水率が25〜35％程度を境に腐朽しやすくなるため、構造用製材（未仕上げ材）の含水率は25％以下とされている。","正しい。心材は辺材より耐腐朽性に優れるため、腐朽しやすい箇所には心材の多い材を用いる。","誤り。加圧注入した防腐処理材でも、継手・仕口の加工面は薬剤が浸透していないため、加工後に再度防腐処理が必要である。"],"2018-構造-28":["誤り。乾燥収縮ひび割れは、水セメント比が同じなら単位セメント量（単位水量）が多いほど収縮が大きくなり、発生しやすい。発生しにくいとする点が誤り。","正しい。AE剤で連行された独立した微細気泡が凍結時の水の膨張圧を緩和し、凍結融解作用に対する抵抗性が増す。","正しい。相似形の供試体では、寸法が小さいほど欠陥を含む確率が低く、圧縮強度は大きくなる傾向がある。","正しい。コンクリートの引張強度は圧縮強度が大きいほど大きくなる（概ね圧縮強度の1/10〜1/13程度）。"],"2018-構造-29":["正しい。炭素含有量が多くなると強度・硬さは増すが、伸びは小さくなり、靱性や溶接性も低下する。","正しい。LY225は降伏点が低く延性が高いため、塑性変形でエネルギーを吸収する履歴型制振ダンパーに用いられる。","誤り。降伏比は降伏点を引張強さで除した値で、350/490≒0.71である。1.4とするのは分子と分母を逆にした誤りである。","正しい。SN490B（板厚12mm以上）は降伏点または耐力に上限値と下限値が規定されており、塑性設計に配慮されている。"],"2018-構造-30":["正しい。耐震性の向上は、強度を大きくする、塑性変形能力を高める、上部構造を軽量化するなどの方法で図れる。","誤り。特定天井では、天井と壁等との間に隙間を設けない構造方法であっても、地震時の脱落に対する安全性の検討は必要である。省略できるとする点が誤り。","正しい。高炉スラグを利用した高炉セメントは、産業副産物の有効利用につながり、環境配慮型の建築物の実現に寄与する。","正しい。RC造の耐久性は、設計基準強度を高くする、かぶり厚さを大きくするなどにより向上する。"],"2017-構造-1":["誤り。軸力による圧縮応力度と曲げによる縁応力度を重ね合わせた値としては、引張縁と圧縮縁の平均（軸応力度）や曲げ成分が図の条件から求まる値と合わない。","正しい。柱脚断面では、軸力による一様な圧縮応力度に、水平力による曲げ応力度（M/Z）を重ね合わせる。その結果、引張縁は+8、圧縮縁は-12 N/mm²となる。","誤り。軸応力度と曲げ応力度の重ね合わせが図の条件の計算結果と合わず、引張縁・圧縮縁とも数値が大きすぎる。","誤り。曲げ応力度の大きさが過大で、軸力による応力度との重ね合わせの結果が図の条件から求まる値と一致しない。"],"2017-構造-2":["誤り。重ね梁Bは断面二次モーメントが単一梁Aより小さいので、たわみは同じにならない。","誤り。たわみ比は1:2ではない。重ね梁は各梁の断面二次モーメントの和で抵抗するため、比はもっと大きくなる。","正しい。中央集中荷重のたわみはPl³/(48EI)に比例する。梁Bは成が半分の梁2本で、断面二次モーメントがAの1/8×2=1/4となるので、δBはδAの4倍となり1:4である。","誤り。1:8は、重ね梁を一体の梁（成が半分）と見たときの値で、摩擦がなく2本が別々に曲がる場合は2本分の剛性を足すので1:4となる。"],"2017-構造-3":["正しい。図の荷重条件に対して、節点の曲げモーメントの釣合いと水平力によるせん断力から求めた曲げモーメント図は、この値と形状（引張側が内側）に一致する。","誤り。柱脚・柱頭のモーメントが過大で、水平荷重から求まる柱のせん断力と釣合わない。","誤り。右柱頭にモーメントを生じさせており、支持条件や釣合いから求まる曲げモーメント図と合わない。引張側の描き方も一致しない。","誤り。モーメントの値が大きすぎ、右柱頭のモーメントも釣合いから導かれる図と一致しない。"],"2017-構造-4":["正しい。最上階梁の両端に全塑性モーメントMpが生じるので、梁のせん断力は両端モーメントの和を梁長で割ったものとなる。図の崩壊メカニズムと整合する。","正しい。梁端の全塑性モーメントによる梁のせん断力を上階から累計すると、柱に生じる鉛直反力（軸力）Vは3Mp/lとなる。","正しい。崩壊メカニズムの仮想仕事、または層の水平力の釣合いから、水平荷重Pは2Mp/lと求まる。","誤り。1階右側の柱のせん断力Qcは、柱頭・柱脚の塑性モーメントの和を柱の高さで割った値となり、図の崩壊メカニズムから求まる値と一致しない。6Mp/lは過大である。"],"2017-構造-5":["誤り。軸方向力の符号と大きさが合わない。圧縮とする点と、大きさ√2Pの点がともに節点の釣合いと一致しない。","誤り。大きさ（√2/2）Pでは、節点での鉛直方向の釣合いを満たさない。","誤り。引張力の符号は合うが、大きさが（√2/2）Pでは節点の釣合いと一致しない。","正しい。節点の釣合いより、斜材の鉛直成分が荷重Pと釣合うので、45度の斜材の軸方向力は√2Pの引張力（+√2 P）となる。"],"2017-構造-6":["誤り。座屈荷重の大小関係が逆になっている。座屈荷重は座屈長さの2乗に反比例するので、PA>PC>PBとはならない。","誤り。座屈荷重の順序が合わない。PBが最も大きくなることはない。","正しい。弾性座屈荷重はπ²EI/lk²で、座屈長さlkが短いほど大きい。柱頭の支持条件が剛な梁で拘束されたCが最も大きく、次いでA、Bが最も小さいので、PC>PA>PBとなる。","誤り。PBがPAより大きくなることはなく、座屈長さから導かれる順序と合わない。"],"2017-構造-7":["正しい。Rtは、T<Tcの範囲では1.0で、Tcは第1種0.4秒、第2種0.6秒、第3種0.8秒である。Tcを超えると軟弱地盤ほどRtが大きく、第3種が最も大きい（※選択肢の文の記載順に要確認）。","誤り。周期が長い範囲でRtが最も大きいのは軟弱な第3種地盤で、第1種が最も大きいとする図は誤りである。","誤り。Rtは第3種地盤が最も大きいが、第1種と第2種の大小関係が正しくなく、図として適当でない。","誤り。Rtは軟弱地盤ほど大きいので、第1種を最大、第3種を最小とする図は逆で、誤りである。"],"2017-構造-8":["誤り。学校の屋上広場の積載荷重は、教室と同じ値ではなく、百貨店と同じ値（教室より大きい）とされている。同じ数値とする点が誤り。","正しい。雪下ろしの慣習がある地方では、垂直積雪量が1mを超えても、雪下ろしの実況に応じて1mまで減らして積雪荷重を計算できる。","正しい。Erは粗度区分で決まり、地表面が平坦で障害物のない地域より都市化が著しい地域のほうが小さい。","正しい。地震層せん断力Qiは上階から累計した重量に基づくため、最下層で最も大きくなる。"],"2017-構造-9":["正しい。必要壁量は地震力用と風圧力用のうち大きいほうとなり、風圧力で決まる場合も、各方向の壁量をそれぞれの必要壁量以上とすればよい。","正しい。引張力と圧縮力の両方を負担する筋かいは、厚さ3cm以上、幅9cm以上の木材とする。","誤り。9cm角の筋かいの倍率は3、たすき掛けにすれば6となるが、軸組の壁倍率の上限は5であり、6とすることはできない。","正しい。筋かいが間柱と交差する部分は、筋かいを欠き込まず、間柱を欠き取る。"],"2017-構造-10":["正しい。側端部分の必要壁量は、側端部分の床面積に単位床面積当たりの必要壁量15cm/m²を乗じて求め、図の条件で3mとなる。","正しい。存在壁量は、側端部分にある耐力壁の長さに壁倍率1を乗じて求め、図の耐力壁の配置から5mとなる。","正しい。壁量充足率は存在壁量/必要壁量で、5/3となり1を超えている。","誤り。壁率比は、壁量充足率の小さいほうを大きいほうで割った値で、0.5以上が必要であるが、図の配置ではこの値は0.5を超えていない。"],"2017-構造-11":["正しい。最上階の柱梁接合部は、曲げモーメントによりL形接合部の隅角部が開く（または閉じる）向きに力が働き、入隅から斜め方向にひび割れが生じやすい部位である。","誤り。独立基礎フーチングのはね出し部は、接地圧を受けて片持ち梁のように曲げを受けるため、ひび割れは柱際から下面（引張側）に生じる。図の示す原因・ひび割れ状況とは整合しない。","正しい。周辺が梁で固定されたスラブは、鉛直荷重で固定端（梁際）に負曲げが生じ、スラブ上面の梁際に沿ってひび割れが発生しやすい。","正しい。耐力壁は周囲の柱・梁に拘束されるため、乾燥収縮が生じると壁面に引張応力が生じ、斜め方向や縦方向のひび割れが発生しやすい。"],"2017-構造-12":["正しい。あばら筋量（せん断補強筋比）を増やすと梁のせん断補強効果が高まり、せん断強度が大きくなる。","誤り。靭性を高めるには、設計基準強度に対するせん断応力度の比を小さくして、せん断破壊より先に曲げ降伏させる必要がある。この比を大きくすると靭性は低下する。","正しい。コンクリートの圧縮強度が高いほどコンクリートが負担するせん断強度が増加するため、柱のせん断強度を大きくできる。","正しい。両側柱付き耐力壁の側柱の帯筋量を増やすと、コンクリートの拘束効果とせん断補強効果が高まり、靭性が向上する。"],"2017-構造-13":["誤り。主筋間のあきが大きくなると、割裂ひび割れを生じにくくなり付着割裂強度は大きくなる。あきが小さいほど付着割裂強度は小さい。","正しい。太径の主筋は付着面積に対する力が大きく、隅角部のかぶりコンクリートが割れやすいため、付着割裂破壊を生じやすい。","正しい。帯筋、あばら筋、中子筋は割裂ひび割れを拘束するため、その効果を考慮して付着割裂強度を算定してよい。","正しい。部材端部にせん断ひび割れが生じる場合、主筋の引張応力度を一定とみなせる範囲を除いて、付着応力度を算定する。"],"2017-構造-14":["正しい。長期許容曲げモーメントの算定では、コンクリートの引張応力度は無視し、引張側の主筋と圧縮側コンクリートによる断面の釣合いで計算する。","誤り。長期許容引張応力度はSD345とSD390で同じ（215N/mm²程度）であり、長期許容曲げモーメントはSD390に変更しても大きくならない。","正しい。許容せん断力は、コンクリートとせん断補強筋の負担分で算定し、主筋はせん断力を負担しないものとして扱う。","正しい。開口を設けた耐力壁の開口補強筋は、設計用せん断力に対して、壁縦筋・壁横筋の寄与分を考慮して必要量を算定できる。"],"2017-構造-15":["誤り。保有耐力接合では、筋かいの降伏より先に接合部が破断しないよう、接合部の破断耐力を筋かい軸部の降伏耐力より大きく設計する。記述は大小関係が逆である。","正しい。溝形鋼など突出脚のある山形鋼等では、接合部のボルト本数に応じて突出脚の有効断面が減るため、無効長さを考慮して断面積を低減する。","正しい。横移動が拘束された両端ピン接合の柱の座屈長さは、節点間距離（柱長さ）とする。","正しい。梁の横座屈補剛は、曲げモーメントが大きい端部付近を重点的に補剛する方法も有効であり、均等間隔にできない場合に採用できる。"],"2017-構造-16":["正しい。伸び能力のあるアンカーボルト（建築構造用転造ねじアンカーボルト等）は、軸部全断面が塑性変形するまでねじ部が破断しない性能を持つ。","正しい。根巻形式柱脚では、根巻RC頂部で鉄骨柱の曲げモーメントが最大となり、根巻部のせん断力は上部の鉄骨柱のせん断力より大きくなる。","正しい。根巻RCの高さは、応力を基礎に確実に伝達するため、鉄骨柱せいの2.5倍以上とする。","誤り。埋込形式柱脚の剛性は、基礎コンクリート上端ではなく、埋込み深さの途中（一般に埋込み部の中間付近）で固定されたものとして算定する。"],"2017-構造-17":["正しい。高強度のSA440を柱梁に用いて主架構の降伏耐力を高めれば、地震時にダンパー側を先行降伏させ、主架構を無損傷に保ちやすい。","正しい。低降伏点鋼LY225は降伏点が低く伸び能力に優れるため、早期に塑性化してエネルギーを効率的に吸収できる。","誤り。ダンパーの取付け部の剛性が小さいと変形がダンパーに十分伝わらず、制振効果が低下する。取付け部の剛性は大きくする必要がある。","正しい。せん断パネル型の鋼材ダンパーは、繰返し変形による疲労に対し累積損傷度で検討する。"],"2017-構造-18":["誤り。プレス成形角形鋼管の角部は冷間加工で強度は上がるが、塑性変形性能（靭性）は低下する。「変形性能が高くなる」は誤りである。","正しい。冷間成形角形鋼管柱の仕口には、通しダイアフラム、内ダイアフラム、外ダイアフラムの各形式がある。","正しい。柱継手は一般に現場溶接とし、曲げ応力の小さい位置（柱の中間付近）に設けることが望ましい。","正しい。ルート1-1では標準せん断力係数C0を0.3以上とし、柱の設計用応力を割増して許容応力度を検討する。"],"2017-構造-19":["正しい。地震時の杭の水平抵抗の検討用の孔内水平載荷試験は、杭頭から約5m、または最大杭径の約5倍の深さまでで実施する。","正しい。平板載荷試験で地盤の支持力特性を把握できる範囲は、載荷板幅の1.5～2.0倍程度の深さまでである。","正しい。常時微動測定は、地盤の卓越周期の推定や地盤種別の判定に利用できる。","誤り。粘性土の内部摩擦角は、一軸圧縮試験では求められない。三軸圧縮試験などで求める。一軸圧縮試験で得られるのは一軸圧縮強さである。"],"2017-構造-20":["誤り。杭に鉛直荷重が作用すると、まず周面摩擦抵抗が先行して発揮され、沈下が増えると先端抵抗が発揮される。記述は順序が逆である。","正しい。液状化のおそれのある地盤では、地盤が軟化するため、杭の水平抵抗を検討する際は水平地盤反力係数を低減する。","正しい。地下水位が高い敷地の地下室には浮力が作用するため、杭の引抜き抵抗力を検討する必要がある。","正しい。杭先端地盤の許容応力度計算に用いるN値は、杭先端付近の平均値とし、60を超える場合は60とする。"],"2017-構造-21":["正しい。直接基礎の根入れ深さDfは、隣接建築物の影響（掘削や撤去で根入れが失われる場合など）を考慮して評価する。","誤り。杭が長い場合、杭頭の固定度が大きいほど杭頭の曲げモーメントは大きくなる。固定度を大きくすると杭頭曲げモーメントは小さくならない。","正しい。支持層が傾斜する地盤で長短の杭を混用すると、杭の水平剛性が異なるため、負担水平力に差が生じ、ねじれも生じやすい。","正しい。地盤沈下のおそれがある敷地では、支持杭に負の摩擦力が作用するため、杭の支持力や沈下量などを検討する。"],"2017-構造-22":["正しい。プレテンション方式は、PC鋼材を緊張したままコンクリートを打設し、強度発現後に緊張を解放して付着によりプレストレスを導入する。","正しい。制振構造には、特定の層を柔らかく設計し、そこにダンパーを設けて地震エネルギーを吸収させる方法がある。","正しい。免震構造は、戸建て住宅から超高層建築物まで、規模や用途を問わず幅広く適用が可能である。","誤り。壁式鉄筋コンクリート構造は、一般に軒高20m以下、地上5階建て以下とされ、地上6階建ては採用できない。"],"2017-構造-23":["正しい。合成梁の曲げ剛性算定に用いる床スラブの有効幅は、RC梁の曲げ剛性算定時の有効幅と同じとしてもよい。","正しい。デッキ合成スラブは、鋼製デッキプレートとコンクリートが一体となり、面内せん断力の伝達も期待できる。","誤り。CFT柱は塑性変形性能が高いだけでなく、充填コンクリートが熱を吸収するため、同一断面・同一板厚の鋼管柱より耐火性能も高い。「同等」は誤りである。","正しい。RCコア壁を耐震要素とし、外周を鉄骨造とする架構は、大スパン化による空間の有効利用に適している。"],"2017-構造-24":["正しい。圧密沈下のおそれがある地盤では、独立基礎よりべた基礎にして剛性を高めたほうが、不同沈下による損傷を生じにくい。","正しい。平面形状が細長い建築物の短辺方向では、床の面内剛性による剛床仮定が成り立たない場合があり、剛と仮定しないで解析する。","誤り。床組の振動障害は、応力の検討ではなく、梁・スラブの剛性（たわみや固有振動数）を検討して確認する。応力検討のみでは使用上の支障がないとはいえない。","正しい。片持スラブは地震時の上下振動の影響が大きいため、長期荷重に加えて上下振動を考慮して配筋を決定する。"],"2017-構造-25":["正しい。X形筋かいの耐力は、引張側筋かいの耐力と圧縮側筋かいの座屈後安定耐力を合算して求めることができる。","正しい。山形鋼の筋かいは偏心の影響を避けるため、小規模な建築物を除き、2本をガセットプレートの両側に取り付けて偏心を小さくする。","正しい。SRC造の非埋込形式柱脚の曲げ終局強度は、アンカーボルト、ベースプレート直下のコンクリート、周囲RCの各曲げ終局強度の累加で求める。","誤り。断面二次半径が小さいと細長比が大きくなり座屈しやすいため、許容圧縮応力度は小さくなる。「大きくなる」は誤りである。"],"2017-構造-26":["正しい。積層ゴムアイソレータは水平方向に柔らかく、上下方向には非常に硬いため、上下地震動に対する免震効果は期待できない。","正しい。長期荷重時の面圧は、支持軸力を積層ゴムの断面積で除した値とする。","誤り。天然ゴム系積層ゴムは引張に弱く、大きな引張軸力が生じると損傷するため不適当である。引張軸力が大きくなる場合は、アイソレータに引張を生じさせない計画とする。","正しい。天然ゴム系アイソレータは減衰能力が小さいため、オイルダンパーや鋼材ダンパーなどを併用する必要がある。"],"2017-構造-27":["正しい。木材の曲げ強度は、気乾比重（密度）が大きいものほど大きくなる。","誤り。木表は木裏に比べて乾燥収縮が大きく、木表側が凹に反る。記述は木表と木裏が逆である。","正しい。LVLは単板積層材で、各層の繊維方向をほぼ平行にして積層接着したもので、柱・梁などの線材に用いる。","正しい。CLTは直交集成板で、各層の繊維方向を直角に交差させて積層接着したもので、床版・壁などの面材に用いる。"],"2017-構造-28":["正しい。セメント粒子が細かいほど水和反応が速く進むため、初期強度の発現は早くなる。","正しい。同一材齢では、水分が供給される水中養生の供試体のほうが、大気中養生より圧縮強度が大きくなる。","正しい。コンクリートのせん断弾性係数はヤング係数の0.4倍程度（ポアソン比約0.2から約0.42倍）である。","誤り。局部圧縮を受ける場合は周囲のコンクリートが拘束するため、支圧強度は全面圧縮の圧縮強度より大きくなる。「小さい」は誤りである。"],"2017-構造-29":["正しい。板厚40mm以下のSN400Bの基準強度Fは235N/mm²であり、短期許容引張応力度もFに等しく235N/mm²である。","正しい。熱間圧延鋼材は板厚方向の強度や延性が圧延方向より小さい傾向があり、ラメラテアに注意が必要である。","誤り。シャルピー吸収エネルギーが小さい鋼材は靭性が低く脆性破壊しやすい。溶接部の脆性破壊防止には、吸収エネルギーの大きい鋼材が有効である。","正しい。アルミニウムの線膨張係数は約23×10⁻⁶/℃で、鉄（約12×10⁻⁶/℃）の約2倍である。"],"2017-構造-30":["誤り。耐震等級は数字が大きいほど耐震性能が高く、等級1が最低、等級3が最高である。等級3から1への変更は、要求レベルを低くすることになる。","正しい。角形鋼管は断面が閉鎖形で横座屈の影響が小さいため、許容曲げ応力度を許容引張応力度と同じ値としてよい。","正しい。国土交通大臣が定めた構造方法によるプレキャストRC造の柱・梁の、直接土に接しない部分の最小かぶり厚さは2cmである。","正しい。鋼管杭の腐食代は、地盤が強酸性でなければ一般に1mmを見込む。"],"2016-構造-1":["誤り。全塑性状態では、断面全体が降伏応力度σyに達する。図の応力度分布から軸力Pと全塑性曲げモーメントを求めると、この組合せは釣り合わない。","誤り。Pの値が図の応力分布と合わない。全塑性時のPは圧縮側と引張側の降伏域の差から求める必要があり、この組合せは成立しない。","誤り。Pは図の応力分布から合致しているが、柱脚の全塑性モーメントをQで除した値（Q=M/l）が合わず、Qの値が不適当である。","正しい。全塑性状態の応力度分布から軸力P=4d²σyとなり、全塑性曲げモーメントMをl（柱長さ）で除してQ=12d³σy/lが得られる。"],"2016-構造-2":["誤り。たわみは荷重と材長が同じなら1/(EI)に比例する。断面二次モーメントの比から求めると1：2とはならない。","正しい。中央集中荷重の単純梁のたわみは δ=Pl³/(48EI) で、断面二次モーメントIに反比例する。両梁の断面二次モーメントの比から δA：δB=1：4となる。","誤り。断面二次モーメントの比は1：8にならず、たわみ比も1：8とならない。","誤り。断面二次モーメントの比は1：16にならず、たわみ比も1：16とならない。"],"2016-構造-3":["誤り。梁ACは剛体、柱脚ピンで筋かいが引張力100kNを負担しており、柱頭には水平力の一部によるせん断力が生じる。そのため柱頭の曲げモーメントは0にならない。","誤り。筋かいの負担分を差し引いた柱のせん断力と柱高さの積は20kN・mにならない。","誤り。筋かいの負担分を考慮した柱のせん断力と柱高さの積は40kN・mにならない。","正しい。筋かい負担後に柱ABが負担するせん断力に柱高さを乗じると、柱頭の曲げモーメントは80kN・mとなる。"],"2016-構造-4":["誤り。仮想仕事法で、外力のする仕事と塑性ヒンジの内部仕事を等置してPuを求めると、200kNにはならない。","正しい。崩壊機構に仮想仕事法を適用し、柱・梁の全塑性モーメントMp（柱300、梁200kN・m）による内部仕事と外力仕事を等置すると、Pu=225kNとなる。","誤り。仮想仕事法で求めた値は250kNにならない。","誤り。仮想仕事法で求めた値は275kNにならない。"],"2016-構造-5":["誤り。部材ABは荷重を支える主要部材であり、節点の力の釣合いから軸方向力は0にならない。","誤り。節点の釣合いや切断法で求めた軸方向力は+(√3/2)Pにならない。","誤り。節点の釣合いや切断法で求めた軸方向力は+√3Pにならない。","正しい。支点反力を求めたうえで、節点の釣合いまたは切断法により部材ABの軸力を求めると、引張力で+(3√3/2)Pとなる。"],"2016-構造-6":["正しい。最大応答せん断力は質量×応答加速度(Q=m・Sa(T))で求まり、固有周期はT=2π√(m/K)で決まる。図－2のスペクトルから各棒のSaを読み取ると、QAが最小でQB=QCとなる。","誤り。QBがQAやQCより小さくなるという大小関係は、質量と剛性から求めた固有周期に対応する加速度応答と、質量との積の比較に合わない。QAが最小となるのが正しい。","誤り。Q=m・Sa(T)で各棒を比較すると、QB<QA<QCのように3つがすべて異なる値にはならない。QBとQCは等しく、QAがそれより小さい。","誤り。QCが最小になるという関係は、固有周期からスペクトルの加速度を読み、質量を掛けて比較した結果と合わない。最小となるのはQAである。"],"2016-構造-7":["正しい。必要保有水平耐力を計算する場合、標準せん断力係数C0は1.0以上とする。許容応力度計算の0.2以上とは区別される。","正しい。地震地域係数Zは地域ごとに1.0から0.7の範囲で定められており、沖縄は0.7である。","誤り。風圧力の速度圧はq=0.6EV0²で表され、基準風速V0の2乗に比例する。比例ではない。","正しい。多雪区域以外の一般地域では、暴風時や地震時の荷重に積雪荷重を組み合わせなくてよい(令82条)。"],"2016-構造-8":["正しい。弾性座屈荷重はPe=π²EI/lk²で、座屈長さlkは両端固定のほうが両端ピンより短いので、Peは大きくなる。","正しい。水平移動を拘束すると座屈長さが短くなるので、水平移動自由の場合よりPeは大きい。","正しい。Pe=π²EI/lk²より、Peはヤング係数Eに比例する。","誤り。Peは断面二次モーメントIに比例し、断面積に比例するのではない。正方形断面の1辺をaとするとI=a⁴/12で、断面積a²に比例しない。"],"2016-構造-9":["正しい。筋かい端部は、柱と横架材の接合部に接近して緊結し、各材の軸線が1点で交わるようにするのが原則である。","誤り。土台は耐朽性・耐蟻性に優れた心材を用いるのが適切である。辺材は腐朽や蟻害に弱く、耐朽性は心材のほうが高い。","正しい。国土交通大臣が定める基準に従った構造計算で安全を確かめた場合は、小屋組の振れ止めを省略できる。","正しい。柱の所要断面積の1/3を超える欠き込みをする場合は補強が必要で、力を伝達できるよう金物等で補強する。"],"2016-構造-10":["誤り。地震力に対する必要壁量は階の床面積に比例して定まり、張り間方向とけた行方向で同じ値となる。方向ごとに異なるのは風圧力による必要壁量である。","正しい。延べ面積が500㎡を超える木造は、壁量計算等の仕様規定に加え、許容応力度計算等の構造計算が必要となる。","正しい。風圧力に対する必要壁量は、1階床面から1.35mを超える部分の見付面積に所定の数値を乗じて算定する。","正しい。構造耐力上主要な柱の小径は、座屈等を考慮した構造計算で安全を確かめれば、横架材間距離に対する割合によらず決めてよい。"],"2016-構造-11":["正しい。梁せいと引張鉄筋量を変えずに梁幅を大きくすると、圧縮応力度が下がり、曲げ降伏後の圧縮側コンクリートの損傷が抑えられて靱性が高まる。","正しい。軸方向応力度比(軸力/コンクリート強度)が小さいほど、柱の変形性能(靱性)は高くなる。","誤り。圧縮鉄筋はクリープによるたわみを抑える効果があるので、圧縮側の鉄筋量を減らすと、クリープたわみはむしろ増大する。","正しい。曲げ強度に対するせん断強度の比を大きくすると、曲げ降伏が先行し、降伏後のせん断破壊を防止できる。"],"2016-構造-12":["正しい。副帯筋の末端は、余長が帯筋で囲まれたコア内に入り必要な長さが確保されていれば、一端を90度フックとしてよい。","誤り。大梁の長期曲げモーメントは、スパン中央で下端筋が引張となり最大となるため、下端筋の重ね継手は中央部を避け、応力の小さい端部寄りに設ける。中央に設けるのは上端筋である。","正しい。スパンの短い梁では、せん断破壊や付着割裂破壊を防ぐため、四隅以外の主筋を対角線上に配置する方法がある。","正しい。柱梁接合部の帯筋(せん断補強筋)比は0.2%以上とされており、0.3%相当の配筋はこれを満たす。"],"2016-構造-13":["正しい。ひび割れによる剛性低下を考慮して、地震荷重時の構造耐力上主要な部分の力を計算してもよい。","正しい。許容付着応力度は、上端筋(ブリーディングの影響で付着が劣る)より下端筋のほうが大きい値となる。","正しい。柱の長期許容せん断力は、帯筋や軸圧縮応力度の効果を見込まず、コンクリートのみで負担するとして計算する。","誤り。引張鉄筋比が釣合い鉄筋比を超える梁は、コンクリートの圧縮縁が先に許容応力度に達するので、許容曲げモーメントはat・ft・jでは求められない。この式は釣合い鉄筋比以下の場合に用いる。"],"2016-構造-14":["正しい。ルート1の計算で設計基準強度が18 N/mm²を超えるコンクリートでは、割増し係数αを用いて単位強度の割増しができる。","正しい。ルート2-1では、地震力によるせん断力を割増した設計用せん断力が許容せん断力を超えないことを確認し、靱性を確保する。","誤り。ルート3の梁の設計用せん断力の割増しは、両端ヒンジとなる梁は小さい値(1.1以上)、両端ヒンジとならない梁は大きい値(1.2以上)とする。記述は割増し係数が逆になっている。","正しい。崩壊メカニズム時にせん断破壊する柱は、部材種別をFD(最も靱性の乏しい種別)とする。"],"2016-構造-15":["正しい。鋼製エンドタブは、終局状態で塑性ヒンジを形成しない部位であれば、切断せずに残してもよい。","正しい。許容値を超える食い違いや仕口部のずれが生じた場合でも、適切な補強を行えば使用できる。","誤り。パス間温度の管理は、熱影響部の靱性低下や強度低下を防ぐためのものである。低温割れの防止には、予熱や低水素系溶接材料の使用、乾燥管理などが有効である。","正しい。適切な溶接材料を用いた突合せ溶接部の許容応力度は、母材と同じ値を採用できる。"],"2016-構造-16":["正しい。F14Tは耐力が高いので、ボルト本数を減らしてスプライスプレートを小さくできる。","誤り。高力ボルト摩擦接合の短期許容せん断応力度は、長期の1.5倍となる。二面せん断の場合は0.9T0であり、T0とするのは誤りである。","正しい。露出柱脚では、ベースプレートの厚さをアンカーボルト径の1.3倍程度以上とするなどして、プレートの変形を抑える。","正しい。埋込形式柱脚では、柱の応力を、埋め込み部の上部と下部のコンクリートの支圧によって基礎に伝達する。"],"2016-構造-17":["誤り。梁を高強度の鋼材にすると、横座屈に対する補剛の条件は厳しくなり、横補剛の間隔を狭める(数を増やす)必要がある。数を減らすのは不適当である。","正しい。両端ピンのH形断面圧縮材は弱軸まわりの座屈が先行するので、弱軸の断面二次半径から細長比を求めて許容応力度を計算する。","正しい。曲げ剛性に余裕のある梁なら、高強度のSN490Bを用いて梁せいを小さくすることができる。","正しい。フランジの幅厚比を小さくすると、局部座屈を生じにくくなる。"],"2016-構造-18":["誤り。標準せん断力係数C0を0.3とするルート1では、水平力を負担する筋かいの端部・接合部を、保有耐力接合とする必要がある。保有耐力接合としなかったのは不適当である。","正しい。ルート1では剛性率・偏心率の検討は求められず、これらの確認を省略できる。","正しい。冷間成形角形鋼管を柱に用いる場合は、柱梁接合形式と鋼管の種類に応じて応力を割増して柱を設計する。","正しい。ルート2で冷間成形角形鋼管を柱に用いる場合、最上階の柱頭部と1階の柱脚部を除き、柱の曲げ耐力の和を梁の曲げ耐力の和の1.5倍以上にする。"],"2016-構造-19":["正しい。液状化のおそれのない地盤では、杭の極限支持力は極限先端支持力と極限周面摩擦力の和で算定できる。","誤り。液状化のおそれのある地盤では、液状化する層の周面摩擦力などは期待できないので、載荷試験による極限支持力をそのまま許容支持力に用いることはできない。","正しい。砂質地盤の極限周面摩擦力度は、場所打ちコンクリート杭のほうが、杭周固定液を使う埋込み杭より大きく評価できる。","正しい。摩擦杭で杭間隔が十分でない場合は、群杭効果を考慮して支持力を算定する。"],"2016-構造-20":["正しい。同一支持層でも施工方法の異なる杭を併用すると、異種基礎となり、沈下などの挙動が異なるので避けるのが望ましい。","誤り。同じ接地圧でも、基礎底面が大きいほど地盤の影響範囲が深くなり、即時沈下量は大きくなる。基礎底面の大きさに関係なく同じにはならない。","正しい。地下階がある場合、地下外壁等が負担する水平力に応じて、杭に作用する水平力を一定の範囲内で低減できる。","正しい。直接基礎の沈下は、上部構造に障害が生じない範囲であれば許容される。"],"2016-構造-21":["正しい。N値が10程度の粘性土地盤は、地上6階程度の中層建築物の直接基礎の支持地盤として必要な支持力を有していると判断できる。","正しい。圧密沈下は、荷重による応力増加で土中の水が排出され、間隙が減少して生じる。","正しい。砂質地盤の内部摩擦角は、N値が大きいほど大きくなる。","誤り。せん断剛性はG=ρVs²で表され、PS検層で得られるS波速度が大きいほど大きくなる。小さくなるという記述は逆である。"],"2016-構造-22":["正しい。PC鋼材の緊張で圧着接合したプレキャスト部材の継目のせん断力は、摩擦抵抗のみで伝達するように設計する。","正しい。プレキャストPC造の床版と梁の接合部は、長期・短期の応力を部材相互に伝達できるように設計する。","誤り。PC構造のI種は長期荷重時に引張応力が生じず、II種はひび割れを生じさせない。ひび割れを許容して幅を制御するのはIII種だけで、いずれも許容するという記述は不適当である。","正しい。単純梁形式のPC合成梁は、引張側をプレキャストPC部材、圧縮側を現場打ちRCとして一体で挙動するように設計するのが一般的である。"],"2016-構造-23":["正しい。壁式構造は耐力壁を主体にした強度抵抗型の構造で、高い変形性能は期待できない。","正しい。A級継手は降伏ヒンジ域の主筋にも使用できるが、靱性が低下する点を考慮する必要がある。","誤り。壁式RC造と壁式プレキャストRC造は、それぞれの特性を考慮して設計すれば、一つの建築物の同じ階に混用できる。混用できないとは限らない。","正しい。ポストテンション方式のグラウトは、PC鋼材の腐食防止と、シースとPC鋼材の付着の確保等を目的とする。"],"2016-構造-24":["正しい。Aiは、多数の地震応答解析結果をもとに定められた、設計用層せん断力の高さ方向の分布を表す係数である。","正しい。偏心率が大きい場合や剛性率が小さい場合は、必要保有水平耐力を割り増す(形状係数Fesを乗じる)。","正しい。精算の固有値解析では、ひび割れのない初期剛性を用い、基礎や杭の変形は無いものと仮定する。","誤り。曲げ破壊が生じる柱・梁は変形性能が高いので、構造特性係数Dsはせん断破壊の場合より小さくできる。大きくしなければならないという記述は逆である。"],"2016-構造-25":["誤り。積層ゴム1層の厚みを大きくすると、一次形状係数が小さくなり、鉛直剛性や鉛直支持能力が低下する。向上させるには、ゴム1層を薄くするのが有効である。","正しい。基礎免震は上部構造に作用する水平力を小さくできるが、免震層には大きな変形が生じる。","正しい。鋼材や鉛等の履歴減衰型ダンパーは、塑性化するときのエネルギー吸収を利用するので、安定した復元力特性と十分な疲労強度が必要である。","正しい。オイルダンパーや履歴減衰型ダンパーは、地震時だけでなく暴風時の挙動に対しても設計する必要がある。"],"2016-構造-26":["誤り。塔状の建築物で転倒抵抗力を増やすには、基礎の重量を増すなどして抵抗力を大きくする。基礎構造を軽量化すると、転倒に対し不利になる。","正しい。構造形式や構造種別が異なる構造を併用する場合は、それぞれの特性を踏まえて計画する。","正しい。エスカレーターは、耐震ブレースのような挙動による破損や、層間変形による脱落が生じないよう計画する。","正しい。床の鉛直方向の固有振動数が低い(10 Hz以下)場合は、振動に対する居住性の検討を行う。"],"2016-構造-27":["正しい。木材の熱伝導率は、普通コンクリートに比べて小さく、断熱性に優れる。","正しい。木材は含水率が25〜35%を超えると、腐朽菌が繁殖しやすくなる。","正しい。無等級材の繊維方向の基準強度は、曲げ>圧縮>引張の順である。","誤り。含水率が繊維飽和点以下の木材の乾燥収縮率は、年輪の接線方向>半径方向>繊維方向の順で、繊維方向が最も小さい。記述は逆である。"],"2016-構造-28":["誤り。円柱コア供試体の圧縮強度は、直径に対する高さの比(h/d)が小さいと見かけ上強度が大きく出る。小さくなるという記述は逆である。","正しい。水セメント比が小さいほど組織が緻密で、中性化速度は遅くなる。","正しい。コンクリートの引張強度は、円柱供試体の割裂試験で間接的に求める。","正しい。圧縮強度時のひずみは、一般に、圧縮強度が大きいコンクリートほど大きくなる。"],"2016-構造-29":["正しい。建築構造用TMCP鋼は、板厚が40 mmを超え100 mm以下でも、40 mm以下の材と同じ基準強度が保証されている。","正しい。SN材C種は、B種の規定に板厚方向の絞り値の下限が加わっており、通しダイアフラムなど板厚方向に引張を受ける部位に用いる。","誤り。SN490BはSS400に比べて、降伏点と引張強さは大きいが、ヤング係数は鋼材の種類によらずほぼ同じ(約205 kN/mm²)である。","正しい。ステンレス鋼は約11%以上のクロムを含む合金鋼で、炭素鋼に比べて耐食性や耐火性に優れる。"],"2016-構造-30":["正しい。耐火設計では、火災が終了するまで建築物を崩壊・倒壊させないことを目標とする。","正しい。荷重や断面に適度な余裕をもたせるとイニシャルコストは増えるが、寿命が延びてライフサイクルコストの節減につながる。","誤り。エキスパンションジョイントで整形な建築物に分割すると、地震時の挙動が明確になるうえ、温度応力や乾燥収縮の影響も緩和されるので有利になる。不利になるという記述は不適当である。","正しい。中間階免震で免震層を居室として使う場合、火災時を考慮して免震支承に耐火被覆を施す。"],"2025-施工-1":["正しい。瞬間風速30m/sを超える暴風の後、屋外のクレーンで作業する際は、あらかじめ各部分の異常の有無を点検する義務がある（クレーン等安全規則）。","誤り。積載荷重1t以上のエレベーターを工事用に使う場合も設置届等が必要で、使用前に労働基準監督署長の落成検査等を受ける必要がある。監理者の検査合格だけでは使用できない。","正しい。設計図書に指定のない仮設物等は施工者の責任で計画するもので、総合施工計画書に記載しても監理者の承認対象とはならない。","正しい。施工上の必要から考案した材料・工法で特許出願等を行う場合は、あらかじめ発注者と協議することが公共建築工事標準仕様書で定められている。"],"2025-施工-2":["誤り。再生資源利用促進計画の実施状況の記録の保存期間は、工事完成日から1年間ではなく5年間である。1,000m3以上の建設発生土搬出で計画作成が必要な点は正しい。","正しい。切ばり・腹起しの取付け・取外しは土止め支保工作業主任者を選任し、作業方法の決定と直接指揮を行わせなければならない（労働安全衛生法令）。","正しい。特定元方事業者は元方安全衛生管理者を選任し、統括安全衛生責任者の指揮のもと、労働災害防止措置のうち技術的事項を管理させる。","正しい。水質汚濁防止法の排水基準では、海域に排出される水素イオン濃度はpH5.0以上9.0以下とされている（海域以外は5.8以上8.6以下）。"],"2025-施工-3":["正しい。押出成形セメント板の現場孔あけは、振動によるひび割れ・欠けを避けるため振動ドリルを用いず、電気ドリルを使用する。","正しい。ロールカーペットは縦置きにすると端部が損傷・変形しやすいため、横に倒して俵積みとし、段数を制限して保管する。","誤り。セルフレベリング材塗りの養生期間は、特記がなければ7日以上、低温時は14日以上とするのが一般的である。5日間・10日間では不足する。","正しい。引抜き耐力の試験で合格した施工品はそのまま使用するため、試験荷重は設計用引張強度（もしくはそれ以下）までにとどめ、アンカーを損傷させない。"],"2025-施工-4":["正しい。危険物貯蔵所の設置許可申請は、消防本部・消防署を置く市町村では市町村長あてに行う（消防法）。","正しい。床面積10m2を超える建築物を除却する場合、施工者は建築物除却届を建築主事等を経由して都道府県知事に届け出る（建築基準法）。","正しい。つり上げ荷重3t以上のクレーンを設置する場合、事業者は工事開始日の30日前までにクレーン設置届を労働基準監督署長に提出する。","誤り。建設リサイクル法の届出は、床面積500m2以上の新築で対象となるが、届出先は特定行政庁ではなく都道府県知事であり、発注者等が工事着手の7日前までに行う。"],"2025-施工-5":["正しい。三軸圧縮試験は土の強度定数（粘着力c、内部摩擦角φ）を求める室内試験であり、粘性土の粘着力の算定に用いられる。","誤り。孔内水平載荷試験は地盤の変形係数や水平方向の地盤反力係数を求める試験で、液状化の程度の判定には適さない。液状化にはN値や粒度試験等を用いる。","正しい。スクリューウエイト貫入試験（旧スウェーデン式）は、主に戸建住宅規模の軟弱層（10m程度まで）の調査に用いられる。","正しい。平板載荷試験では、載荷板（直径30cm）の中心から一定範囲（1.2m程度）の試験地盤面を水平に整地して行う。"],"2025-施工-6":["正しい。ウェルポイント工法は、砂質土から粘性土分の多い砂質土まで透水性の比較的低い地盤の地下水処理にも適用できる。","正しい。リチャージ工法は揚水した水を同一帯水層に戻すため、復水分を見込んで、復水しない場合より必要揚水量を多く計画する。","正しい。山留め壁と地下躯体との間に隙間がある場合は、切ばり撤去前に必要強度・厚さ・養生期間を確認してコンクリートの盛替え梁を設ける。","誤り。盤圧計（軸力計）は切ばりの軸力を計測するもので、中央付近に置くと自重によるたわみ等の影響を受けやすい。腹起し寄りの端部付近に設置するのが一般的である。"],"2025-施工-7":["誤り。底ざらい直後の掘削孔先端深度の検測は、孔底の中心1か所だけでなく、複数個所（中心及び周辺）で行い、孔底の状況を適切に確認する必要がある。","正しい。鉄筋かごの補強リングは、特記がなければ平鋼を用い、2〜3m間隔で配置する。","正しい。既製コンクリート杭の現場溶接継手では、開先の目違い量は2mm以下、ルート間隔は4mm以下とする。","正しい。杭頭処理はコンクリート打込み後、14日程度経過してから、杭本体を傷めないように行う。"],"2025-施工-8":["誤り。鉄筋相互のあきは、粗骨材最大寸法の1.25倍、25mm、異形鉄筋では呼び名の数値の1.5倍のうち最大値以上必要。D22では22×1.5=33mm以上なので、30mmは不足する。","正しい。鉄筋の加工に用いるかぶり厚さ（設計かぶり厚さ）は、最小かぶり厚さに施工誤差10mmを加えた値とする。","正しい。スラブ鉄筋のスペーサーは、特記がなければ上端筋・下端筋とも所定の間隔で配置し、端部は0.1m以内とする。","正しい。D29以上の太径の異形鉄筋では、付着割裂破壊を考慮し、主筋のかぶり厚さを呼び名の数値の1.5倍以上とする。"],"2025-施工-9":["正しい。型枠の構造計算では、コンクリート打込み時の水平荷重は鉛直荷重に対する割合で定め、通常は地震力を考慮しない。","正しい。型枠支保工に用いる鋼材の許容応力度は、降伏強さ又は引張強さの3/4のうち小さい値の2/3以下とする。","誤り。パイプサポートを継いで用いる場合は、4本以上のボルト又は専用金具で継ぐ必要があり、2本のボルトでは不適当である。また継ぎ足しは2本までが原則である。","正しい。防水下地となるコンクリート面のコーン穴は、水量の少ない硬練りモルタルで平坦に充填する。"],"2025-施工-10":["正しい。細骨材率は、骨材全体の絶対容積に対する細骨材の絶対容積の割合（細骨材/(細骨材+粗骨材)×100）で表される。図表の記号は不明だが、定義上妥当とされる。","誤り。空気量は1,000Lから各材料の絶対容積の合計を引いた残りの割合で求めるが、この式は表の記号の対応上、絶対容積と質量の取り違え等があり不適当とされる。※図表不明のため一般論で記述。","正しい。表乾密度は表面乾燥飽水状態の質量を絶対容積で割った値（質量/絶対容積）であり、骨材の質量と絶対容積の比で求められる。","正しい。水セメント比は、水の質量をセメントの質量で割った百分率（水/セメント×100）である。"],"2025-施工-11":["正しい（合格）。スランプ18cmの許容差は±2.5cmで16.0cmは範囲内、空気量も4.5±1.5%の範囲内（6.0%）であり、不合格ではない。","誤り（不合格）。スランプフロー45cmの許容差は±7.5cmであり、測定値55.0cmは差が10cmで範囲外である。空気量3.0%は4.5±1.5%の下限で範囲内。","正しい（合格）。軽量コンクリートでスランプ15cmの許容差は±2.5cm、17.0cmは範囲内。空気量5.0±1.5%に対し6.5%も範囲内。","正しい（合格）。高強度コンクリートのスランプフロー60cmの許容差は±10cmで、50.0cmは下限ちょうど範囲内。空気量5.5%も範囲内。"],"2025-施工-12":["正しい。計画供用期間の級が標準の場合、プレキャスト部材の屋内側の設計かぶり厚さは、柱・梁・耐力壁35mm、床・屋根スラブ25mm程度とされる。","正しい。目地部等グラウトの圧縮強度は、特記がなければ現場水中養生の供試体の材齢28日強度が部材コンクリートの品質基準強度以上とする。","正しい。プレキャスト柱部材の幅の許容差は、特記がなければ±5mmで管理する。","誤り。現場でのプレキャスト部材の仮置きは、安定性・安全性の観点から積み重ねる枚数・段数を制限する必要があり、床部材10枚は過大で不適当である。梁・柱は2段以下が一般的。"],"2025-施工-13":["正しい。立上げ鉄筋を曲げる場合は、850〜900℃に温度管理して加熱し、所定の角度以内で曲げる。","正しい。塑性変形能力が要求される部位の常温曲げ加工の内側曲げ半径は、板厚の8倍以上とする。","正しい。鉄筋貫通孔の孔径は、異形鉄筋D25で最大38mm程度と、鉄筋径に余裕を加えた値で定める。","誤り。完全溶込み溶接の突合せ継手で板厚差による段違いが規定値（薄い板厚の1/4又は10mm程度）を超える場合は、厚い側にテーパー加工を行って滑らかに移行させる。12mmの段違いでは不十分。"],"2025-施工-14":["正しい。ボルト頭部又はナットと接合部材面が1/20以上傾斜している場合は、勾配座金を使用する。","誤り。トルシア形高力ボルトの長さは、締付け長さに加える長さが呼び径によって異なり、M22では35mmを加える。30mmを加えるのはM20である。","正しい。同一部位に種々の径の貫通孔がある場合、設計担当者と協議し、最大径に統一することがある。","正しい。溶接部の外観検査は全数について目視で行い、基準を逸脱していると思われる箇所のみ測定器具で測定する。"],"2025-施工-15":["正しい。アンカーボルトは耐力壁の両端の柱の下部付近及び土台継手の上木の端部付近に設置する。","正しい。アンカーボルトは径12mm以上、基礎天端からの埋込み長さ250mm以上とする。","誤り。筋かいと間柱の取合いでは、筋かいを欠き込むと耐力が低下するため、筋かいは欠かず間柱側を欠き取る。筋かいの断面欠損となる相欠きは不適当である。","正しい。木製の火打梁は断面90mm×90mm程度とし、横架材との仕口は傾ぎ大入れ、六角ボルト締めとする。"],"2025-施工-16":["正しい。保護コンクリートの伸縮目地は、立上り部の仕上り面から600mm程度、中間部は縦横3m程度の間隔とする。","正しい。耐根層を保護コンクリート（絶縁シート含む）の下に設ければ、保護コンクリートを耐根層保護層とみなせる。","誤り。接着工法による合成高分子系シート防水の接合幅は所定の寸法以上確保する必要があり、特に平場と立上り部の取合い部は120mmでは不足するなど、示された接合幅は不適当である。","正しい。折板葺のタイトフレームと受け梁の接合は、風による繰返し荷重での緩み防止のため、ボルト接合でなく隅肉溶接とする。"],"2025-施工-17":["正しい。外部側に柱形がある場合の垂直伸縮調整目地は、柱形の入隅部及び中間3〜4m間隔に設ける。","正しい。下地モルタルの伸縮調整目地は、タイル面の伸縮調整目地及び躯体のひび割れ誘発目地と一致させる。","正しい。密着張りで張付けモルタルの1回の塗付け面積の限度は、2m2/人以内とされる。","誤り。モルタル塗りの調合は、下塗りが砂2.5程度、中塗り・上塗りは砂3程度（容積比）が標準で、上塗りを砂1とするのは貧配合とならず富調合過ぎ、ひび割れの原因となるため不適当。"],"2025-施工-18":["正しい。はめ込み構法では、躯体の面内変形による窓枠の変形時に、ガラスと窓枠が接触しないようエッジクリアランスを確保する。","誤り。アルミニウム製笠木の取付けは、割付けを検討したうえで、コーナー部分を先に取り付け、その後に直線部分を取り付けるのが一般的である。","正しい。点検口取付けのため野縁や野縁受けを切断した場合は、開口部を補強する。","正しい。JISの建築用鋼製下地材は亜鉛めっきの犠牲防食作用が期待できるため、切断面の錆止め塗料塗りを省略できる。"],"2025-施工-19":["正しい。モルタル下地への直張り用複合フローリングの接着には、ウレタン樹脂系接着剤を用いる。","正しい。湿気の影響を受けやすい箇所のビニル床シート張りには、耐水性に優れるエポキシ樹脂系又はウレタン樹脂系接着剤を用いる。","正しい。縦壁ロッキング構法のALCパネル間の目地シーリングは、パネルの動きに追従できるよう二面接着とする。","誤り。仕上塗材の吹付けは、コンクリート下地の表面含水率が高いと不具合の原因となるため、10%以下で行う。含水率20%は過大で不適当である。"],"2025-施工-20":["誤り。給水管と排水管を平行して埋設する場合は、給水管を上方に埋設し、水平実間隔は500mm以上確保する。300mmでは不足する。","正しい。寒冷地の配管埋設深さは、車両道路では管の上端から600mm以上、それ以外は300mm以上、かつ凍結深度以上とする。","正しい。呼び径80程度のステンレス鋼鋼管の横走り配管の吊り金物の支持間隔は、2.0m程度とされる。","正しい。間接排水管の管径65mm以上の場合の排水口空間は、最小150mmである。"],"2025-施工-21":["誤り。雨水用排水ます及びマンホールの底部には、泥詰まり防止のため深さ150mm以上の泥だめを設ける。100mmでは不足する。","正しい。乾式工法の張り石で、石材裏面と躯体の間隔（取付け代）は70mm程度が標準である。","正しい。タイル面の酸洗いは、監理者の承認を得て、30倍程度に希釈した工業用塩酸を用いて行う。","正しい。吹付け硬質ウレタンフォームは1層の吹付け厚さを30mm以下とし、複数層に分けて吹き付ける。"],"2025-施工-22":["誤り。既存の柱や梁の目荒しは、付着性能向上のため行うが、電動ピックで主筋が露出する程度まで行うと既存躯体を損傷する。主筋を傷めない範囲（5mm程度の凹凸）で行う。","正しい。コアドリルの冷却水はアルカリ成分を含むため、中和処理してから排水する。","正しい。多数のあと施工アンカーを打つ増設壁部分には、新設コンクリートの割裂防止のためスパイラル筋等で割裂補強する。","正しい。上向き施工の接着系アンカーは、脱落防止の措置を施したうえで、所定の養生時間を確保する。"],"2025-施工-23":["正しい。コンクリート打放し外壁の欠損部が深い場合は、エポキシ樹脂モルタル充填工法を適用する。","正しい。植込み等により人が近づけない安全上の配慮がなされた外壁面は、張替え後の引張接着試験を省略できる場合がある。","誤り。幅0.2mm以上0.5mm未満のひび割れの樹脂注入には低粘度形エポキシ樹脂を用いる。高粘度形は幅の広いひび割れに用いるもので、不適当である。","正しい。モルタル塗り外壁の幅1.0mmを超えるひび割れには、Uカットシール材充填工法を適用する。"],"2025-施工-24":["正しい。スカラップは、溶接線の交差を避けるため、一方の母材に設ける扇形の切欠きである。","正しい。チェッキングは、充填したシーリング材や塗膜表面に生じる細かいひび割れをいう。","誤り。バスダクトは大電流を流すための導体を金属ダクトに収めた幹線用の配線材料である。説明の「騒音吸収のため空調ダクトに挿入する箱型装置」は消音ボックス（サイレンサー）。","正しい。ラミネーションは、圧延鋼材の内部の不純物等が層状に開裂する欠陥をいう。"],"2025-施工-25":["誤り。受注者が第三者の権利の対象となる工事材料を使用するときは、その使用に関する一切の責任を負うのが原則である（発注者の指定による場合を除く）。一切責任を負わないとする記述は誤り。","正しい。発注者は、受注者が工事を完成しない間、書面で通知して工事を中止又は契約を解除でき、その場合は受注者の損害を賠償する。","正しい。受託者が委託者の承諾を得て監理業務を他の建築士事務所に再委託した場合も、その受託者の行為全てについて責任を負う。","正しい。原設計者と異なる建築士に監理を委託した場合、設計変更が必要なときは、原設計者が受託しない場合を除き、原設計者に別途委託する。"],"2024-施工-1":["誤り。設計図書の矛盾・誤謬・脱漏等を発見した場合、監理者は設計者に報告し必要な確認を求めるのが業務であり、工事施工者に確認したうえでという手順は告示の内容に合致しない。","正しい。工事施工者が提案・提出する工事材料、設備機器等や見本が設計図書に適合しているかを検討し、建築主に報告することは、告示に示された監理業務の内容である。","正しい。工事施工者からの質疑書は、設計図書に定められた品質確保の観点から技術的に検討し、必要に応じ建築主を通じて設計者に確認のうえ回答を通知する。","正しい。請負代金内訳書の適否を合理的な方法により検討し、その結果を建築主に報告することは、告示に示された一般的な監理業務に含まれる。"],"2024-施工-2":["正しい。専任の監理技術者を要する現場でも、監理技術者補佐を専任で置く場合は、特例監理技術者として元請の監理技術者が2現場まで兼任できる。","誤り。くい打機の巻上げ用ワイヤロープの安全係数は、切断荷重を最大荷重で除した値で、6以上としなければならない。「3から5の間」とする記述は誤りである。","正しい。枠組足場の組立て・解体の業務は、地上又は床上における補助作業の業務を除き、満18歳に満たない者を就業させてはならない業務とされている。","正しい。高さ30m以上の煙突の解体工事は、工事開始の14日前までに建設工事計画届を労働基準監督署長へ届け出る必要がある。高さ40mの煙突はこれに該当する。"],"2024-施工-3":["正しい。現場での木材含水率の測定は、1本の製材の異なる2面について、両木口から300mm以上離れた2か所と中央部1か所の計6か所を測定し、平均を求める。","正しい。高力ボルト継手の仮ボルトは、本接合のボルトと同軸径の損傷のない普通ボルトとし、1群に対して1/3程度以上かつ2本以上をバランス良く配置して締め付ける。","正しい。寒中の養生は、コンクリートを寒気から保護し、普通ポルトランドセメントでは打込み後5日間以上、コンクリート温度を2℃以上に保つ。","誤り。手動ガス圧接継手の外観検査は、全数について行うのが原則である。抜取りで30か所を対象とする記述は誤りで、抜取りは超音波探傷検査などで行う。"],"2024-施工-4":["正しい。請負代金100万円以上の改修工事では、石綿含有建材の事前調査を行い、その結果を遅滞なく労働基準監督署長及び都道府県知事等へ報告する。","正しい。高さ10m以上の枠組足場で設置期間が60日以上のものは、機械等設置届を工事開始の30日前までに労働基準監督署長へ提出する。","誤り。特定建設作業実施届出書は、開始の日の7日前までに市町村長へ提出する。提出先が都道府県知事とする記述は誤りである。","正しい。消防用設備等を設置した防火対象物の関係者は、工事完了の日から4日以内に、消防用設備等設置届出書を消防署長へ提出する。"],"2024-施工-5":["正しい。防護棚(朝顔)は、地上から5m以上の高さに1段目を設け、1段目から10m以内ごとに2段目以上を設ける。1段目から9m上部の2段目は適合する。","正しい。枠組足場の強度計算では、鉛直荷重である自重・積載荷重は建地で、水平荷重である風荷重は壁つなぎで支持するものとみなして検討する。","正しい。単管足場の壁つなぎは、垂直方向5m以下、水平方向5.5m以下の間隔とし、地上第一の壁つなぎは地上から5m以下の位置に設ける。","誤り。枠組足場の墜落防止措置として設ける幅木の高さは、15cm以上必要である。高さ10cmの幅木では不足しており、記述は誤りである。"],"2024-施工-6":["正しい。ソイルセメント壁の応力材(H形鋼等)を本体構造と一体化した合成壁とすれば、地下外壁を薄くでき、合理化が図れる。","誤り。釜場は集水しやすいよう、掘削底面の最も深い場所に設置するのが原則である。最も浅い場所に設置すると、湧水が集まらず排水の目的を果たせない。","正しい。鋼矢板壁は継手をかみ合わせて連続壁とするため遮水性が比較的高く、地下水位が高い地盤や軟弱地盤に適した山留め工法である。","正しい。砂質土の埋戻しの締固めには、振動ローラーなどの振動を与える機械が効果的であり、一般に用いられる。"],"2024-施工-7":["誤り。アースドリル工法の安定液は、コンクリートとの置換を考慮し、コンクリートより低比重で、適切な粘性をもつものとする。高比重とする記述は誤りである。","正しい。サンドコンパクションパイル工法の補給材には、砂のほか再生砕石RC-40なども使用でき、締固めを行って砂杭を造成する。","正しい。特記がない場合、既製コンクリート杭の施工精度は、鉛直精度1/100以内、杭心ずれ量は杭径の1/4以下かつ100mm以下とする。","正しい。セメントミルク工法では、掘削中は安定液を用い、支持層到達後に根固め液を注入し、正回転のまま杭周固定液を注入しながらオーガーを引き上げる。"],"2024-施工-8":["正しい。コンクリート壁内に埋め込むCD管は、バインド線を用いて1m以下の間隔で鉄筋に結束し、打設時にずれないよう固定する。","正しい。径の異なる異形鉄筋の重ね継手の長さは、細いほうの鉄筋の径を基準として算定する。","誤り。鉄筋のあきは、粗骨材最大寸法の1.25倍、25mm、隣り合う鉄筋の平均径の1.5倍のうち最大のもの以上とする。D19とD22では平均径の1.5倍が約30mmとなり、25mmでは不足する。","正しい。特記がない場合、耐圧スラブを除く直接土に接する床のかぶり厚さは40mm(4cm)以上確保する。"],"2024-施工-9":["正しい。打放し以外に用いるせき板は、特記がなければ、コンクリート型枠用合板で表面B・裏面C、厚さ12mmのものを用いるのが一般的である。","誤り。計画供用期間の級が標準で平均気温20℃以上のとき、せき板の存置日数は、高炉セメントB種では一般に5日以上必要である。4日とする記述は短く、誤りである。","正しい。型枠設計用の側圧は、側圧を求める位置から上のコンクリート打込み高さに、フレッシュコンクリートの単位体積重量を乗じた液圧として求める。","正しい。型枠の鉛直荷重のうち固定荷重は、鉄筋を含むコンクリートの単位容積重量に部材厚さを乗じた値に、型枠の重量を加えて求める。"],"2024-施工-10":["誤り。空気量やスランプが許容差を超えた場合の調整は、水セメント比を変えない範囲で行う。水セメント比を変えて調合を調整する記述は誤りである。","正しい。標準養生した供試体の材齢28日の1回の圧縮強度試験結果が調合管理強度以上であれば、構造体コンクリート強度として合格とする。","正しい。普通ポルトランドセメントでは、予想平均養生温度が25℃を超える場合の構造体強度補正値は、一般に6N/mm²とされる。","正しい。構造体コンクリートの各部材の位置は、設計図書に示された位置との差が±20mm以内であることが許容範囲の目安とされる。"],"2024-施工-11":["正しい。打重ね時間間隔の限度は、外気温25℃未満で150分、25℃以上で120分が目安である。20℃で120分とするのは安全側で再振動可能時間内となる。","誤り。マスコンクリートの打込み後に表面へ散水すると、内外の温度差が大きくなり温度ひび割れの原因となる。冷却にはパイプクーリング等を用いる。","正しい。高流動コンクリートは材料分離せずに自己充填できるため、状況によっては棒形振動機による締固めを行わないことができる。","正しい。軽量コンクリートの圧送では、水平換算距離が150m以上の場合、輸送管の呼び寸法は125A以上とするのが一般的である。"],"2024-施工-12":["誤り。敷モルタルの圧縮強度は、標準養生した供試体で材齢28日に部材コンクリートの設計基準強度以上となるよう管理する。現場水中養生で管理する記述は不適当である。","正しい。コンクリートの加熱養生は、前養生を2時間以上とり、温度上昇勾配は20℃/h以下とするのが一般的で、3時間・18℃/hは適合する。","正しい。板状の部材を70〜80度に立て起こして脱型する場合の脱型時所要強度は、一般に9N/mm²とされる。","正しい。プレキャスト部材は、搬入時に組立て用クレーンにより運搬車両から直接荷取りして組み立てることができ、仮置きの手間を省ける。"],"2024-施工-13":["正しい。溶融亜鉛めっき高力ボルトの一次締めトルクは、M16で約100N・m、M20・M22で約150N・m、M24で約200N・mが目安である。","正しい。ナット回転法では、締付け完了後にナットの回転量が不足しているものは、所定の回転量まで追締めを行う。","正しい。溶融亜鉛めっき面の摩擦面は、すべり係数0.40以上を確保するため、特記がなければりん酸塩処理などの処理を行う。","誤り。溶融亜鉛めっき高力ボルト(F8T)の孔径は、F10Tの高力ボルトの孔径と同じとする。1.0mm大きくする記述は誤りである。"],"2024-施工-14":["誤り。試験スタッド溶接の打撃曲げ試験は、曲げ角度30度で行い、割れ等がないことを確認する。15度は製品検査の打撃曲げの角度であり、記述は誤りである。","正しい。スパン数の多い建築物では溶接収縮で柱が倒れるため、調整スパンを設け、溶接完了後に調整スパンの梁を高力ボルトで取り付ける方法がとられる。","正しい。組立溶接は、割れを防ぐため、必要で十分な長さと4mm以上の脚長をもつビードを適切な間隔で配置する。","正しい。保有水平耐力計算を行わない鉄骨造の露出形式柱脚では、ベースプレートの厚さをアンカーボルト径の1.3倍以上とする。"],"2024-施工-15":["正しい。山形プレート部分の構造用合板を切り欠いた場合は、耐力低下を補うため、周辺に釘の増打ちを行って補強する。","正しい。構造耐力上主要な部分の製材の含水率は、乾燥材として搬入時に所定の値以下であることを確認する。15%以下は基準を満たす厳しい側の値である。","誤り。基礎立上がりが地面から40cmあっても、木部に有効な防腐・防蟻措置を講ずる範囲は、地面から1m以内の部分である。60cm以内とする記述は誤りである。","正しい。大壁造の床勝ち仕様では、壁倍率の基準となる仕様が異なるため、告示等で定められた仕様を確認する必要がある。"],"2024-施工-16":["正しい。外壁のひび割れ誘発目地のシーリングは、標準仕様書において目地底にボンドブレーカーを用いず、三面接着とする扱いが示されている。","誤り。塗膜防水の重ね幅は、防水材の塗継ぎが100mm以上、補強布の重ね幅が50mm以上である。記述は両者の値が逆になっており誤りである。","正しい。コンクリートの打継ぎ部やひび割れ部には、幅50mm程度の絶縁用テープを張り、その上に幅300mm程度のストレッチルーフィングを増張りする。","正しい。アスファルト防水の保護コンクリートは、特記がなければ、平場の厚さを80mm程度とする。"],"2024-施工-17":["誤り。タイル張り仕上げ面の打音検査は、モルタルが硬化した後、タイル用テストハンマーを用いて全面について行う。全面の1/2程度とする記述は誤りである。","正しい。外壁タイルの引張接着強度試験は、100m²ごと及びその端数につき1個以上、かつ全体で3個以上の試験体で行う。","正しい。密着張りでは、タイルの目地深さをタイル厚さの1/2以下とする。","正しい。高強度コンクリートの目荒しに超高圧水洗浄法を用いる場合、吐出圧は150〜200N/mm²程度とされる。"],"2024-施工-18":["正しい。複層ガラスを受ける下端ガラス溝には、結露水等を排出するため、径6mm以上の水抜き孔を2か所以上設ける。","誤り。ガラスブロック平積みの目地幅は、特記がなければ10mm以上20mm以下とする。6mmとする記述は狭すぎて誤りである。","正しい。熱割れ防止のため、立地、方位、ガラスの光・熱特性等からガラスエッジの熱応力を算出し、許容応力と比較して検討する。","正しい。ガラスのサンドブラスト加工は、強度低下を考慮し、加工深さを板厚の1/12未満とする。"],"2024-施工-19":["正しい。軽量鉄骨壁下地では、ねじれのないスタッドを用い、上部ランナー上端とスタッド天端の隙間を10mm以下とする。","正しい。出入口の開口補強に用いる縦枠補強材は、スタッドを2本抱き合わせて、上下端部及び600mm程度の間隔で溶接して用いる。","正しい。軽量鉄骨天井下地の野縁及び野縁受けは、特記がなければ、屋内は19形、屋外は25形を使用する。","誤り。野縁を野縁受けに留め付けるクリップは、野縁のひずみを防ぐため、つめの向きを交互にして留め付ける。つめの向きをそろえる記述は誤りである。"],"2024-施工-20":["正しい。コンクリート埋込みのボックスや分電盤の外箱は、打込み時にずれないよう型枠に堅固に取り付ける。","正しい。差動式スポット型感知器は、空気吹出口から1.5m以上離れた位置に設置する。","正しい。雑用水系統と飲料水系統の誤接続を防ぐため、器具取付け後に雑用水を着色して通水し、確認する試験を行う。","誤り。屋内横走り排水管の最小勾配は、呼び径65以下で1/50、75・100で1/100、125で1/150である。呼び径50を1/100とする記述は誤りである。"],"2024-施工-21":["正しい。屋根保護防水密着断熱工法のルーフドレン回りでは、断熱材をつばの手前で止め、欠損部の熱橋対策として結露防止のため補助的な断熱を行う。","正しい。浴室の換気設備では、雨仕舞のよいベントキャップを用い、ダクトは屋外に向かって先下がり勾配とし、結露水や雨水が室内へ流入しないようにする。","誤り。フローリングは湿度変化で膨張・収縮するため、壁、幅木、敷居等との取合いには、膨張を吸収する隙間を設ける。隙間を設けないとする記述は誤りである。","正しい。ガラス部材同士の接合に用いるシーリング材は、特記がなければシリコーン系を使用するのが一般的である。"],"2024-施工-22":["正しい。あと施工アンカーの確認試験で不合格となった場合は、至近の位置に再施工し、再施工した全数に確認試験を行う。","正しい。スタッド溶接後の外観試験は、種類や部材が異なるごと、かつ100本ごと及びその端数をロットとし、各ロット1本以上を抜取り試験する。","誤り。連続繊維補強工事のプライマーは、コンクリート表面を十分に乾燥させてから塗布する。湿潤させてから行う記述は付着不良の原因となり誤りである。","正しい。現場打ち壁の増設で流込み工法を用い、打込み高さが大きい場合は、コンクリート投入口を2段以上設けて打ち込む。"],"2024-施工-23":["正しい。既存ウレタンゴム系塗膜防水の膨れ部分は、カッターナイフで切除し、ポリマーセメントモルタルで平滑に補修する。","正しい。小口平タイル以上の大きさのタイル陶片の浮きには、注入口付アンカーピンニングエポキシ樹脂注入タイル固定工法が用いられる。","誤り。錆を除去した鉄筋には、再腐食防止のため防錆材(防錆剤)を塗布するのが一般的である。浸透性吸水防止材は鉄筋の防錆目的の材料ではなく、記述は誤りである。","正しい。本問の正答表上は適当な記述とされる。ただし降雨養生の要否は工程や防水層の種類で異なり、一般論では確信が持てない。※要確認"],"2024-施工-24":["誤り。クラックスケールは、コンクリート等に生じたひび割れの幅を測定する器具であり、長さの測定に用いるものではない。","正しい。複層ガラスは、2枚以上のガラスをスペーサーで一定間隔に保ち、周囲を封着材で密閉して内部に乾燥気体を満たしたガラスである。","正しい。インバートは、汚水ますやマンホールの底部に設ける、下面を半円形に仕上げた導水溝で、汚水の流れを円滑にする。","正しい。スランプは、高さ30cmのスランプコーンにコンクリートを3層に詰め、コーンを引き上げた直後の頂部からの下がりを測った値である。"],"2024-施工-25":["正しい。監理者は、工事の内容、工期又は請負代金額の変更に関する書類を技術的に審査する立場にある。","正しい。受注者は、発注者又は監理者の立会いを定めた工事を施工するときは、事前に発注者又は監理者に通知する。","正しい。工事用図書のとおりに実施されていない部分は、原則として監理者の指示により、受注者が費用を負担して修補・改造し、工期延長は求められない。","誤り。部分使用は、発注者が工事中に目的物の一部を使用するもので、当該部分の引渡しを受けるものではない。引渡しを受けるのは部分引渡しであり、記述は誤りである。"],"2023-施工-1":["正しい。法令に基づく関係機関の検査では、書類のとりまとめと検査への立会い、指摘事項等の建築主への報告が監理業務に含まれ、報告は工事施工者等の検査記録等に基づいて行う。","誤り。設計図書どおりに実施されない場合、施工者に是正を求め、従わないときに報告する相手は建築主であり、建築主事ではない。","正しい。破壊検査が必要と認められる相当の理由がある場合は、工事請負契約の定めにより、理由を施工者に通知のうえ、必要な範囲で破壊して検査する。","正しい。工事費支払い請求について、工事請負契約に適合しているかを技術的に審査し、建築主に報告することは、告示に定める監理業務の内容である。"],"2023-施工-2":["誤り。自ら施工する工事と別途発注された第三者の工事との調整は、監理技術者が自らの責任で行うものではなく、発注者側(建築主・監理者等)が行うべき事項である。","正しい。品質計画は施工の目標、品質管理、管理体制等を具体的に記載したもので、一般に、監理者が当該工事に相応して妥当であることを確認する。","正しい。監理者の検査で不合格となった材料は、監理者の指示がなくても、施工者が速やかに場外へ搬出し、誤使用を防ぐ。","正しい。民間工事でも特定建設業者が下請代金総額7,000万円以上(建築一式)で下請契約を結ぶ場合は、施工体制台帳を作成し、工事現場ごとに備え置く(引渡しまで)。"],"2023-施工-3":["正しい。調合管理強度の判定は、1回の試験の平均値が調合管理強度の85%以上、かつ3回の総平均値が調合管理強度以上であれば合格とする。","正しい。外壁乾式工法の石材は、矩形で幅・高さ1,200mm以下、1枚の面積0.8m2以下とする。","正しい。外壁タイル後張りの引張接着試験は、引張接着強度が0.4N/mm2以上で、かつ接着界面の破壊率が50%以下であれば合格とする。","誤り。せっこう系直張り用接着材による直張りは、接着材が乾燥するまでの十分な放置期間が必要である。通気性のある壁紙でも5日では短く、所定の期間(一般に1週間程度以上)放置してから仕上げる。"],"2023-施工-4":["正しい。共同企業体で請け負う場合の「共同企業体代表者届」は、工事開始の日の14日前までに都道府県労働局
